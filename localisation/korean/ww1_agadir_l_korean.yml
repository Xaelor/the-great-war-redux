l_korean:
 ww1_agadir.1.t: "프랑스의 모로코 장악 시도"
 ww1_agadir.1.d: "프랑스가 움직이기 시작했습니다. 질서 회복이라는 구실로 프랑스군은 페스로 진격하여 모로코 술탄국에 대한 통제권을 강화하고 있습니다. 파리 주재 우리 외교단은 프랑스 외무부가 우리 동의 여부와 관계없이 모로코를 완전한 보호령으로 만들 계획이라고 보고했습니다.\n이는 독일의 위신과 이 지역에서의 우리의 상업 이익에 직접적인 타격입니다. 카이저께서는 격노하셨고, 해군은 이미 무력 시위를 촉구하고 있습니다. 그러나 우리는 신중하게 대응해야 합니다. 성급한 최후통첩은 영국과 프랑스를 결집시켜 우리에게 대항하게 만들 수 있지만, 너무 오래 기다리면 우리가 나약하게 비칠 것이고 프랑스에 보호령을 기정사실로 내주게 될수도 있습니다.\n우리는 어떤 노선을 택해야 합니까?"
 ww1_agadir.1.a: "적절한 때를 기다려라."
 ww1_agadir.1.b: "판터는 지금 도약해야 한다!"
 ww1_agadir.2.t: "독일의 보상 요구"
 ww1_agadir.2.d: "베를린이 마침내 속내를 드러냈습니다. 독일 정부는 '판터의 도약'을 무기 삼아 모로코를 포기한 것에 대한 '보상'으로 중앙아프리카의 모든 영토, 즉 프랑스령 콩고 전체와 벨기에령 콩고에 대한 우선매수권을 우리에게 양도하라고 요구하고 있습니다.\n이것은 순전히 협박입니다. 하지만 우리는 신중하게 선택해야 합니다. 파리는 아직 전면전을 감당할 준비가 되어 있지 않고, 동맹 영국은 조심스러운 지원 약속만 했습니다. 정면으로 거부한다면 라인강에서 전쟁이 벌어질 수도 있지만, 이러한 터무니없는 요구에 굴복하는 것은 제국 전체에 굴욕감을 안겨줄 것입니다.\n우리는 독일의 서한에 어떻게 대응해야 합니까?"
 ww1_agadir.2.a: "영국과 러시아가 우릴 지지할 것이다!"
 ww1_agadir.2.b: "모든 대가를 치러서라도 확전을 피해라."
 ww1_agadir.3.t: "프랑스의 콩고 요구 거부"
 ww1_agadir.3.d: "파리는 프랑스령 콩고에 대한 우리의 요구를 공식적으로 거부했습니다. 프랑스 정부는 협상을 받아들이는 대신 시간을 끌며 우리의 최후통첩을 경멸하고 있습니다.\n카이저께서 격노하셨지만, 총참모부는 인내를 권고했습니다. 우리는 우리의 입장을 분명히 밝혔습니다. 이제 공은 프랑스 쪽으로 넘어갔습니다. 영국이나 러시아의 중재로 프랑스가 이성을 되찾을 수 있을지, 아니면 우리가 더욱 단호한 대응을 준비해야 할지 지켜볼 것입니다."
 ww1_agadir.3.a: "압박감 좀 느끼게 두자고."
 ww1_agadir.4.t: "아가디르에 도착한 독일 포함"
 ww1_agadir.4.d: "독일 제국이 우리의 모로코 개입 이후 독일의 무역 이익을 보호한다는 명분으로 포함 SMS 판터호를 아가디르 항에 파견했습니다. 이보다 더 큰 순양함 SMS 베를린호도 며칠 후 도착했습니다. 우리 외교단은 독일 측과 접촉 중이며, 카이저가 곧 우리에게 요구 조건을 제시할 것으로 예상합니다."
 ww1_agadir.4.a: "너무 많은 걸 요구하지 않길 빌자고..."
 ww1_agadir.5.t: "프랑스의 독일 요구 거부"
 ww1_agadir.5.d: "오늘 오후, 프랑스 정부가 아가디르 위기에 대한 우리의 요구를 거부했다는 소식이 전해졌습니다. 프랑스는 현재 군대 동원을 시작했으며, 우리 군 지휘부는 즉각적인 대응을 촉구하고 있습니다. 이제 우리는 기로에 서 있습니다. 한발 물러서서 국제적인 굴욕을 감수하거나, 선전포고를 하고 유럽을 가늠할 수 없는 규모의 분쟁 속으로 밀어 넣을 수도 있습니다. 카이저와 정부는 이제 결정을 내려야 합니다."
 ww1_agadir.5.a: "동원을 시작하라."
 ww1_agadir.5.b: "일단 물러서야 한다."
 ww1_agadir.6.t: "프랑스의 노이카메룬 할양"
 ww1_agadir.6.t_no_escalation: "프랑스의 콩고 할양"
 ww1_agadir.6.d: "우리 외교단이 프랑스와의 위기를 평화롭게 해결했다고 알려왔습니다. 확전을 우려한 프랑스는 모로코에서의 성과에 대한 보상으로 프랑스령 콩고의 일부를 할양하기로 합의했습니다. 일부 사람들이 기대했던 대대적인 식민지 승리는 아니었지만, 우리는 귀중한 이익을 얻어냈고 세계 무대에서 우리의 영향력을 세웠습니다."
 ww1_agadir.6.d_no_escalation: "우리 외교단이 프랑스와의 위기가 평화적으로 해결되었다고 알려왔습니다. 더 큰 전쟁을 우려한 프랑스는 모로코에서 얻은 이득에 대한 보상으로 프랑스령 콩고를 우리에게 할양하기로 합의했습니다. 이는 우리가 바라던 대로 위대한 식민 승리이며, 우리는 귀중한 양보를 얻어내고 국제 무대에서 우리의 영향력을 강화했습니다."
 ww1_agadir.6.a: "그럼 올해엔 전쟁이 없겠군."
 ww1_agadir.7.t: "프랑스의 페스 입성"
 ww1_agadir.7.d: "프랑스는 '술탄 보호'와 '질서 회복'이라는 구실로 페스에 진입했습니다. 파리는 우리와 상의도 없이, 북부 지역에 대한 우리의 역사적 권리 주장도 존중하지 않고 모로코에 대한 완전한 보호령을 수립하려는 것이 분명합니다.\n우리가 가만히 있으면 소외될 것입니다. 리프 지역, 해안, 그리고 전략적 요충지인 테투안과 라라슈에 대한 우리의 이익은 프랑스의 야심에 짓밟힐 것입니다. 지금 당장 행동해야 합니다. 독일과 영국이 이 위기에 개입하기 전에, 그리고 상황이 돌이킬 수 없게 되기 전에 말입니다."
 ww1_agadir.7.a: "모로코 북부를 점령하라."
 ww1_agadir.8.t: "스페인 모로코 보호령 수립"
 ww1_agadir.8.d: "아가디르 위기가 해결되자 프랑스는 모로코를 두 개의 다른 보호령으로 분할하는 데 동의했습니다. 이제 우린 북쪽 지역을 관할하며 지역 내 우리 이익을 확보할 것입니다."
 ww1_agadir.8.a: "우리의 프랑스 친구들을 위해 건배!"
 ww1_agadir.9.t: "지나간 위기"
 ww1_agadir.9.d: "독일은 프랑스에 대한 어떤 요구도 제시하지 않고 협상을 지연시켰습니다. 제국 정부는 외무부 장관이 분쟁에서 느리고 소극적이라고 비판합니다."
 ww1_agadir.9.a: "기회를 놓쳤다!"
 ww1_agadir.10.t: "베를린 금융위기"
 ww1_agadir.10.d: "아가디르 위기 고조로 독일 제국에 금융 공황이 벌어졌습니다. 오늘 아침 주식시장이 하루만에 30% 폭락하는 것으로 공공연해졌습니다. 경제학자들은 국가은행이 금보유고의 5분의 1을 잃을 수도 있으며, 정부가 상황을 해결하더라도 금본위제에서 퇴출될 수도 있다고 경고했습니다.\n\n재계의 뒷소문으론 경제전을 통해 우리의 입지를 약화하려는 프랑스의 사보타주라고 보기도 합니다."
 ww1_agadir.10.a: "젠장..."
 ww1_agadir.11.t: "독일의 후퇴 거부!"
 ww1_agadir.11.d: "주식 시장 붕괴와 막대한 재정적 압박에도 불구하고, 독일 제국은 아가디르 위기에서 물러서지 않고 군대를 동원하기 시작했습니다. 이에 맞서 프랑스 또한 군대를 동원하고 있습니다. 우리는 [FRA.GetNameDef] 정부에 지지를 표명하고 평화적 해결안을 옹호했지만, 상황은 시간이 갈수록 더욱 악화되고 있습니다."
 ww1_agadir.11.a: "너무 밀어붙인 걸지도."
 ww1_agadir.11.b: "크리스마스까지는 집으로 갈 것이다!"
 ww1_agadir.11.c: "상황을 면밀히 주시해야 한다."
 ww1_agadir.12.t: "\"판터의 도약\""
 ww1_agadir.12.d: "독일 제국 해군 함정 SMS 판터호가 모로코 대서양 연안의 아가디르 항에 도착했습니다. 경순양함 SMS 베를린과 함께 정박한 판터호는 \"이 지역에서 독일 시민과 상업적 이익을 보호한다\"는 명분으로 오늘 아침 입항했습니다.\n국제 언론에서 \"판터의 도약\"으로 불리는 이 갑작스러운 무력 시위는 모로코에서 프랑스의 영향력에 맞선 직접적인 도전으로 널리 해석되고 있습니다. 프랑스군이 페스를 점령한 지 불과 몇 주 만에 독일은 앞으로 모로코에 대한 프랑스의 지배에 대해 배상을 요구하겠다는 의사를 분명히 했습니다.\n이러한 움직임은 파리와 런던의 외교단을 경악하게 했으며, 그들은 이를 계산된 도발로 보고 있습니다. 베를린은 이번 임무가 평화적이라고 주장하지만, 관찰자들은 유럽이 또 다른 심각한 위기에 직면할 수 있다고 경고합니다."
 ww1_agadir.12.a: "이건 침략 행위다!"
 ww1_agadir.12.b: "우린 우리 이익을 지킨다!"
 ww1_agadir.12.c: "저들은 제 이익을 지킨다!"
 ww1_agadir.13.t: "모로코 위기 촉발"
 ww1_agadir.13.d: "이번 주 일찍이, 프랑스 식민지군은 포위당한 모로코 술탄의 지원 요청을 받았습니다. 프랑스군은 의무를 다하기 위해 곧장 술탄을 타도하려고 페스를 포위한 반란군을 쓸어버렸습니다. 아직 마라케시 인근 교외 지역에서 전투가 계속되고 있다고 합니다.\n\n프랑스의 일방적인 행동이 알헤시라스 협정을 파기했습니다. 이에 국제사회는 이제 독일의 반응을 우려하고 있습니다. 카이저는 독일의 이익을 위해 배상 요구와 같은 강력한 대응에 나설 것으로 보입니다. 상황이 전면적인 위기로 비화될 수 있는 만큼, 유럽 각국은 긴장 속에 사태를 주시하고 있습니다."
 ww1_agadir.13.a: "우리의 주권은 타협의 대상이 아니다!"
 ww1_agadir.13.b: "알헤시라스 회담은 어쩌고?"
 ww1_agadir.13.c: "유럽은 지켜보며 기다린다."
 ww1_agadir.13.e: "자, 프랑스가 이제 우리의 책무를 시험하려고 하는구나..."
 ww1_agadir.13.f: "[SPR.GetNameDef]에 훌륭한 기회가 왔다!"
 ww1_agadir.14.t: "한 발 물러선 독일"
 ww1_agadir.14.d: "[FRA.GetNameDefCap]가 모로코 술탄국을 합병하기 위해 움직이자, 독일 제국은 프랑스의 보상을 강요하기 위한 전술로 SMS 베를린을 아가디르에 파견했습니다. 그러나 이는 주식 시장을 30%가량 폭락시키고 독일 중앙은행의 금 보유량 중 5분의 1을 잃게 하는 등 [GER.GetForeignNameDef]에 경제적 혼란을 야기했습니다. \n\n이에 전면적인 붕괴를 막기 위해 [GER.GetForeignNameDef] 정부는 굴욕적인 철수를 강행하며 아가디르에 있던 SMS 베를린을 철수했습니다. [FRA.GetNameDef]에는 행운이겠지만, [GER.GetForeignNameDef]은 이제 위기를 해결하고 남은 약간의 위신이라도 되찾기 위해 협상 테이블에 앉을 수밖에 없을 것입니다."
 ww1_agadir.14.a: "이제 저들 요구는 분명 겸손해질 것이다."
 ww1_agadir.14.b: "프랑스에 지지 선언을 해야 할지도 모르겠군."
 ww1_agadir.15.t: "아가디르 위기의 해소!"
 ww1_agadir.15.d.forcongo: "일련의 협상 끝에 프랑스와 독일 외교관들이 아가디르 위기를 해결했습니다. 독일이 프랑스의 모로코 보호령을 인정하는 대가로, 프랑스는 프랑스령 콩고에서 '노이카메룬'을 독일에 할양했습니다. 당분간 유럽은 한숨 돌릴 수 있게 되었습니다. 이번 사태에서 [GER.GetForeignNameDef]은 완전하지는 않지만 상당한 성공을 거둔 외교적 승리를 누렸습니다. 하지만 이번 위기로 국제 정세는 한동안 긴장 상태에 놓이기도 했습니다."
 ww1_agadir.15.d.forcongo_full: "치열한 협상 끝에 프랑스와 독일 외교단은 아가디르 위기를 해결했습니다. 독일이 모로코의 프랑스 보호령을 인정하는 대가로 프랑스는 프랑스령 콩고 영토를 독일령 카메룬에 할양했습니다. 유럽은 당분간 안도의 한숨을 쉴 수 있게 되었습니다. 이 결과는 [GER.GetForeignNameDef]의 완전한 성공입니다."
 ww1_agadir.15.a: "마침내 평화다."
 ww1_agadir.15.b: "적어도 뭔가는 얻었으니..."
 ww1_agadir.15.c: "조국을 위한 달콤한 승리로군!"
 ww1_agadir.15.d: "뭐, 최소한 전쟁은 아니니까..."
 ww1_agadir.16.t: "위기 모면"
 ww1_agadir.16.d: "유럽 ​​전역의 외교관들에게는 놀라운 일이지만, [GER.GetForeignNameDefCap] 측은 모로코 상황 악화를 거부하며 심각한 식민지 위기를 피했습니다. 많은 사람들이 아가디르 위기가 임박했다는 확실한 신호로 여겼지만, [GER.GetAdjective] 정책의 이러한 갑작스러운 전환은 아프리카 대륙을 벼랑 끝에서 끌어내렸습니다.\n\n그러나 이러한 해결책이 아무런 결과도 없는 것은 아닙니다. 영국은 [FRA.GetAdjective] 정부의 도발적인 행동을 공개적으로 비판하며, 협상국 세력에 의문을 제기했습니다. 평화는 유지되었지만, 평화를 지키기 위한 동맹은 약화된 것으로 보입니다."
 ww1_agadir.16.a: "깨지기 쉬운 평화로군."
 agadir_crisis_mission: "$great_power_politics_scramble_for_africa_tt_icon$ 아가디르 위기 결과"
 FRA_agadir_outcome_tt: "§Y[GER.GetForeignNameDefCap]§!은 §R전쟁을 일으키거나§! §G물러설 수 있음§!"
 GER_agadir_outcome_tt: " 우리는 §Y[FRA.GetNameDefCap]§!의 답신을 기다리고 있습니다. 저들이 답하지 않는다면, 우린 §R전쟁을 일으키거나§!, §G물러설 수 있습니다.§!"
