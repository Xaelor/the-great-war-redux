l_korean:
 autonomy_tgwr_protectorate: "보호령"
 autonomy_tgwr_protectorate_desc: "$joins_wars_automatically_tt$\n\n§L보호령은 대외 정책과 내정이 외국 세력에 의해 부분적으로 또는 전적으로 통제되는 국가 또는 여러 국가들의 집합입니다. 식민지와는 달리, 보호령은 국제법상 별도의 법적 실체로 간주되며, 보호국에 의해 대표됩니다.§!"
 autonomy_tgwr_protected_state: "피보호국"
 autonomy_tgwr_protected_state_desc: "\n§L피보호국은 국제적 주체성을 유지하면서 외교 정책 수행에 있어 합의된 수준의 독립성을 누리는 동시에 외세의 보호를 받는 국가입니다.§!"
 autonomy_tgwr_unilateral_union: "일방적 연합"
 autonomy_tgwr_unilateral_union_desc: "\n§L일방적 연합은 피보호국이 위계질서에서 종속국이 되겠다는 의사를 자발적으로 표명한 상태를 말합니다. 반면, 종주국은 지배권이나 보호권을 행사하겠다는 의사를 표명하지 않습니다. 대부분의 경우, 이러한 연합은 두 국가의 통합 직전에 잠깐 나타나거나, 짧은 존속 기간 후 관계가 해소되는 양상을 보입니다. 종주국은 정치·경제 영역에서 미미한 영향력만을 행사합니다.§!"
 autonomy_tgwr_ottoman_emirate: "오스만 토후국"
 autonomy_tgwr_concession: "조계"
 protectorate_call_ally_rule_tt: "§R이 유형의 종속국은 전쟁에 호출할 수 없습니다!§!"
 protectorate_join_ally_rule_tt: "§R이 유형의 종속국은 전쟁에 참전할 수 없습니다!§!"
 autonomy_tgwr_regional_government: "지역정부"
 autonomy_tgwr_personal_union: "동군연합"
 autonomy_tgwr_personal_union_desc: "\n§L동군연합은 동일한 군주를 공유하면서도 각각 별개의 실체로 남아 있는 두 개 이상의 군주국 간의 연합입니다. 개인 연합에서 두 국가는 모두 독립성을 유지하며 각자의 이해관계를 지니고 있지만, 군주의 이해관계가 반드시 한 국가의 의지와 일치하는 것은 아닙니다.§!"
 autonomy_tgwr_real_union: "물적연합"
 autonomy_tgwr_real_union_desc: "$joins_wars_automatically_tt$\n\n§L물적연합은 같은 군주를 두고 몇 가지 공통된 제도를 가진 두 개 이상의 군주국으로 이루어진 연합입니다. 물적연합에서는 한 나라가 다른 나라보다 약하기 때문에 한 쪽에 확실히 종속되어 있습니다.§!"
 autonomy_tgwr_condominium: "공동통치령"
 autonomy_tgwr_self_governing_colony: "자치 식민지"
 autonomy_tgwr_feudal_autonomy: "봉건 자치령"
 autonomy_tgwr_occupied_state: "점령국"
 autonomy_tgwr_military_government: "군사정부"
 autonomy_tgwr_nominal_constituency: "명목 선거구"
 autonomy_tgwr_nominal_constituency_desc: "\n§L명목 선거구는 대개 내전으로 인한 중앙 정부의 붕괴로 사실상 독립한 국가의 법률상 일부입니다.§!"
 autonomy_tgwr_client_state: "종속국"
 autonomy_tgwr_client_state_desc: "\n§L종속국은 정치가 외세의 은밀하거나 노골적인 영향을 받으면서도, 공식적으로는 독립 정부를 유지하고 있는 국가입니다. 종속국은 비공식적으로 통제되기 때문에, 외세의 영향에 대항하기가 더 수월합니다.§!"
 autonomy_tgwr_occupied_state_desc: "$joins_wars_automatically_tt$\n\n§L피점령국은 외국 군대에 의해 점령된 국가입니다. 점령국으로부터 허용되는 한도 내에서 자율적으로 행동할 수 있으며, 일반적으로 그 법적 지위는 불분명합니다.§!"
 autonomy_tgwr_regional_government_desc: "\n§L지역정부는 한 국가의 일부로, 지역 내 영향력 있는 정치인이나 군 지도자가 자율적으로 통치하는 곳이며, 이들은 대개 충성스러운 추종자나 군사력을 뒷받침으로 삼아 중앙 정부의 지시를 따르지 않을 수 있습니다.§!"
 autonomy_tgwr_military_government_desc: "$joins_wars_automatically_tt$\n\n§L군사정부는 외세가 이익을 위해 군대를 통해 통치하는 영토입니다. 군사정부는 대개 해당 영토의 원주민을 소모품처럼 취급하며, 반대를 억누르기 위해 가장 가혹한 수단을 동원합니다.§!"
 autonomy_tgwr_feudal_autonomy_desc: "\n§L봉건 자치령은 명목상 한 국가의 구성 부분으로, 지역 내 세습 지도자가 통치하며 해당 영토를 완전히 장악하고 있습니다. 봉건 자치령은 중앙 정부가 국가를 중앙집권화하려는 시도에 종종 반대하는데, 이는 중앙집권화가 이루어질 경우 자치구 통치자들의 영향력이 약화될 수 있기 때문입니다.§!"
 autonomy_tgwr_ottoman_emirate_desc: "\n§L오스만 토후국은 명목상 오스만 술탄의 통치 하에 있지만, 지리적 이유로 인해 자치권을 유지하고 있는 부족 단위 정치체입니다. 오스만 토후국은 대개 부족 지도자들이 세습 군주로서 통치합니다.§!"
 autonomy_tgwr_concession_desc: "$joins_wars_automatically_tt$\n\n§L조계는 외세가 영토 외 관할권을 행사하는 한 국가의 영토입니다. 조계 내에서는 외세의 국민들이 자유롭게 정착하고, 무역을 하며, 여행할 권리를 가지며, 외국인 주민을 대표하기 위한 행정 기관이 설치됩니다.§!"
 autonomy_tgwr_colony: "식민지"
 autonomy_tgwr_colony_desc: "$joins_wars_automatically_tt$\n\n§L식민지는 제국의 통치를 받는 영토로, 제국은 이곳에 자국민을 정착시키고 자국의 이익을 위해 그 자원의 개발과 원주민을 착취합니다.§!"
 autonomy_tgwr_self_governing_colony_desc: "$joins_wars_automatically_tt$\n\n§L자치 식민지는 제국의 식민지 중 하나로, 정착민들이 상당한 수준의 지역 자치권을 누리며, 일반적으로 자체 정부를 선출하는 곳입니다.§!"
 autonomy_tgwr_dominion: "자치령"
 autonomy_tgwr_dominion_desc: "$joins_wars_automatically_tt$\n\n§L자치령은 제국의 자치 영토로, 내정 면에서는 제국으로부터 거의 완전히 독립되어 있으며, 외교 정책 면에서도 어느 정도 독립성을 지니고 있습니다.§!"
 autonomy_tgwr_condominium_desc: "$joins_wars_automatically_tt$\n\n§L공동통치령은 두 개 이상의 외세가 공동으로 소유하고 관리하는 영토를 말합니다. 일반적으로 한 외세가 다른 세력보다 훨씬 강하기 때문에, 공동통치령을 소유함으로써 가장 큰 이익을 얻는 쪽이 됩니다.§!"
 autonomy_tgwr_milrevcom: "군사혁명위원회"
 autonomy_tgwr_milrevcom_desc: "$joins_wars_automatically_tt$\n\n§L군사혁명위원회는 혁명을 그 영역 밖으로 확산시키는 것을 목표로 특정 영토를 장악하고 있는 혁명 조직입니다. 대개 이 조직의 활동은 당 본부에서 지휘되며, 활동 면에서 어느 정도의 자율성이 허용됩니다.§!"
 autonomy_tgwr_assr: "연방 소비에트 공화국"
 autonomy_tgwr_assr_desc: "$joins_wars_automatically_tt$\n\n§L연방 소비에트 공화국은 사회주의 국가의 자치 구성 단위로, 대개 소수 민족을 대표합니다. 공화국 정부는 자치 소비에트 공화국 영토 내에서 권한을 행사할 수 있으나, 당의 노선과 국가 전체의 이익에 종속됩니다.§!"
 cant_change_autonomy_tt: "§R일반적인 수단으로 자치도를 변경할 수 없습니다!§!"
 joins_wars_automatically_tt: "§Y종주국의 편으로 자동 참전함§!"
 autonomy_tgwr_autonomous_governorate: "자치 총독령"
 autonomy_tgwr_autonomous_governorate_desc: "$joins_wars_automatically_tt$\n\n§L자치 총독령은 국가 내에서 특별한 행정적 지위를 가진 지역으로, 다른 지역과는 다른 법률이 적용되며, 대개 소수 민족을 대표합니다. 자치 총독령은 중앙 정부의 완전한 통제하에 있으며, 총독은 중앙 정부에서 직접 임명합니다.§!"
 autonomy_tgwr_federal_subject: "연방 종속국"
 autonomy_tgwr_federal_subject_desc: "$joins_wars_automatically_tt$\n\n§L연방 종속국은 국가 내에서 특별한 행정적 지위를 가진 지역으로, 다른 지역과는 다른 법률이 적용되며, 대개 소수 민족을 대표하기 위해 설립됩니다. 연방 구성 지역은 일반적으로 자체적으로 총독과 대표를 선출하며, 이들은 연방 헌법에 위배되지 않는 한 자체적인 법률을 제정할 권리를 가집니다.§!"
 autonomy_tgwr_ssr: "소비에트 공화국"
 autonomy_tgwr_ssr_desc: "$joins_wars_automatically_tt$\n\n§L소비에트 공화국은 동일한 정당이 통치하고, 그중 한 쪽이 다른 쪽보다 명백히 더 강력한 힘을 가지고 있다는 점에서 다른 사회주의 국가와 밀접하게 연결된 사회주의 국가입니다. 대부분의 경우 내정에 있어 완전한 자치권을 행사하지만, 주요 당사가 위치한 사회주의 국가의 지침을 따릅니다.§!"