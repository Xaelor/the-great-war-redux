 CHI_foreign_influence_modifier_desc: "아편전쟁 이래 이어진 굴욕적인 불평등 조약들은 중국의 주권을 갈기갈기 찢어놓았습니다. 조계지와 차관, 치외법권을 앞세운 열강의 내정 간섭과 경제적 수탈은 국가의 숨통을 조여오고 있습니다."
 CHI_influence_in_china_modifier: "중국에 대한 영향력"
 CHI_influence_in_china_modifier_desc: "아편전쟁 이래 이어진 불평등 조약과 이권 침탈로 중국은 열강의 각축장이 되었습니다. 우리는 조계지와 철도 부설권, 차관을 통해 이 거대한 시장에서 막대한 경제적 특권과 정치적 영향력을 누리고 있습니다."
