 great_power_politics_empire_of_the_periphery_desc: "§Y러시아국§!은 종이호랑이이며, 철권으로 수많은 민족을 지배합니다. 그 영향력이 약해진다면, 우리는 억압받는 민족들을 이용해 우리 영향력을 확대할 수 있을 것입니다.\n\n§Y러시아국§!의 §R붕괴§!는 우리의 §Y확장§! 기회를 열어줄 것입니다."
