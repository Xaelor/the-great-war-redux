 great_power_politics_default_tt: "§H열강 정치§!"
 great_power_politics_default_tt_desc: "열강 정치에 관여함으로써 우리는 약소국에 압력을 가하고 이들을 우리의 영향권에 끌어들이거나, 다른 §Y열강§!과 영토를 놓고 경쟁할 수 있습니다.\n\n§G사용 가능한§! 결정을 확인하거나 상황을 지켜보려면 §Y유형§!을 선택하세요."
 great_power_politics_misc_tt: "§H소규모 조치§!"
 great_power_politics_misc_tt_desc: "특정한 전역에 해당하지 않는 여러 결정"
 great_power_politics_misc_desc: "우리가 취하는 모든 조치가 타국의 우려를 불러일으키진 않으며, 때때로 §Y열강§!의 보복을 걱정하지 않고도 결정을 내릴 수 있습니다.\n\n이 §Y유형§!을 사용하여 £great_war_texticon §Y대전쟁§!을 대비하거나 §Y소규모 개입§!을 실행하십시오."
 great_power_politics_great_war_tt: "§H대전쟁§!"
 great_power_politics_great_war_tt_desc: "§Y대전쟁§!에 관한 결정"
 great_power_politics_great_war_desc: "여섯 번째 천사가 나팔을 불어 §R모든 전쟁을 끝낼 전쟁§!의 시작을 선포했습니다! §Y열강§!은 외교가 아닌 칼로 갈등을 해결하기로 결정했습니다. 하느님, 우리 모두에게 자비를 베푸소서.\n\n§G승리한§! §Y세력§!은 §Y회의§! 후 영유권 주장 주와 핵심 주를 차지하게 될 것입니다."
 great_power_politics_scramble_for_africa_tt: "§H아프리카 쟁탈전§!"
