 TGWR_surrender_conditions_desc: "§T§Y대전쟁§!은 모든 한 쪽 세력의 $core_members_tt$이 §Y항복§!해야 끝납니다. 모든 세력의 $non_core_members_tt$은 마지막 §Y핵심 회원국§!이 §Y항복§!할 때 같이 §Y항복§!합니다.\n\n$entente_tt$ $core_members_tt$:§Y\n[FRA.GetFlag][FRA.GetName]\n[RUS.GetFlag][RUS.getName]§!\n\n$central_powers_tt$ $core_members_tt$:§Y\n[GER.GetFlag][GER.GetName]§!\n\n추가로, 세력의 일부 $non_core_members_tt$은 단독으로 §Y항복§!할 수 있습니다.\n\n$entente_tt$ $non_core_members_tt$:§Y\n[ROM.GetFlag][ROM.GetName]§!\n\n$central_powers_tt$ $non_core_members_tt$:§Y\n[AUS.GetFlag][AUS.GetName]\n[TUR.GetFlag][TUR.GetName]\n[BUL.GetFlag][BUL.GetName]§!§!"
