 brest_litovsk: "브레스트-리토프스크 조약"
 brest_litovsk_message: "@RUS §Y러시아§!가 대전쟁에서 철수하고 막대한 영토를 §Y동맹국§!에 할양했습니다."
 ww1_brest_litovsk.1.t: "러시아와의 휴전"
 ww1_brest_litovsk.1.d: "러시아 외교단이 강화 제의와 함께 우리에게 접촉했습니다. 대전쟁과 혁명으로 인한 내부 혼란에 지친 러시아는 적대 관계를 끝내고자 합니다. 이것은 우리에게 유리한 조건을 확보하고 서부 전선에 집중할 수 있는 기회가 될 수 있습니다."
 ww1_brest_litovsk.1.a: "좋다. 휴전하자."
 GER_start_faustshlag_tt: "우리는 §Y60일§! 안에 동부 전선에서 공세를 재개하는 사건을 받습니다. §R부대를 철수하지 마십시오§!."
 ww1_brest_litovsk.2.t: "독일의 강화 협상 수락"
 ww1_brest_litovsk.2.d: "독일이 강화 협상 제안을 수락했습니다. 적과의 협상은 고통스럽지만 고국의 위태로운 상황을 생각해야만 합니다. 국운이 이 협상의 결과에 크게 좌지우지될지도 모릅니다."
 ww1_brest_litovsk.2.a: "협상장으로 가는 열차편을 준비하라!"
 RUS_GER_start_faustshlag_tt: "독일이 §Y60일§! 안에 동부 전선에서 공세를 재개하는 사건을 받습니다. §R부대를 철수하지 마십시오§!."
 ww1_brest_litovsk.6.t: "파우스트슐라크 작전"
 ww1_brest_litovsk.6.d: "러시아가 협상을 포기하자 막스 호프만 장군은 러시아가 입장을 재고하지 않으면 더 많은 영토 손실을 감수해야 한다고 압박하며 3단계에 걸친 공세를 개시했습니다."
 ww1_brest_litovsk.6.a: "놈들을 끝장날 때다."
 ww1_brest_litovsk.6.b: "잠시만."
 ww1_brest_litovsk.7.t: "독일군 공세 재개"
 ww1_brest_litovsk.7.d: "독일은 휴전을 파기하고 무자비한 공세를 개시했습니다. 협정이 파기되자 전선이 위험에 처했습니다. 이런 침략 행위로 인해 우린 혁명을 지키기 위한 어려운 선택을 강요받게 될지도 모릅니다."
 ww1_brest_litovsk.7.a: "좋지 않은걸..."
 ww1_brest_litovsk.9.t: "발트 왕국들의 재건"
 ww1_brest_litovsk.9.d: "러시아가 강화 조약을 체결했으므로 이제 우리는 우리에게 종속된 발트 왕국들을 통해 러시아와 우리 사이에 완충지대를 만들 수 있습니다."
 ww1_brest_litovsk.9.a: "좋은 선택이다."
 ww1_brest_litovsk.17.t: "빵의 평화"
 ww1_brest_litovsk.17.d: "현지 소비에트 봉기를 처리할 수 있는 제대로 조직된 군대가 없는 [UKR.GetNameDefCap]이 외국의 군사원조를 바라고 있습니다. 우리가 이들을 보호하는 대가로 우크라이나의 광대하고 비옥한 농지에서 보내는 곡물이 우리 군과 국가가 이 혹독한 전쟁에서 싸우는 데 도움이 될 것입니다."
 ww1_brest_litovsk.17.a: "좋은 괴뢰국이 되겠군."
 ww1_brest_litovsk.100.t: "동부 전선 휴전 파기!"
 ww1_brest_litovsk.100.d: "독일과 러시아 대표단은 전쟁을 중단하고 전후 국경을 다시 그리며 전쟁 배상금을 책정하기 위해 강화 협상장에 앉았습니다. 그러나 러시아 대표단은 독일의 터무니없는 영토 할양 요구에 분노하여 협상장을 박차고 나갔습니다. 이에 따라 동부 전선의 휴전이 깨졌으며 독일군은 모스크바와 페트로그라드를 향한 진격을 재개했습니다. 이미 전선이 무너진 상황에서 독일군은 믿을 수 없을 정도로 빠른 속도로 열차를 이용해 병력을 재배치하며 러시아 영토로 진격해 들어가고 있습니다."
 ww1_brest_litovsk.100.a: "승리가 아니면 죽음을."
 ww1_brest_litovsk.100.b: "러시아는 결단을 내려야 한다."
 ww1_brest_litovsk.101.t: "브레스트-리토프스크 협상"
 ww1_brest_litovsk.101.d: "러시아는 유능한 군대 없이는 더 이상 전쟁을 계속할 수 없기 때문에 독일을 초청하여 휴전 협정을 체결했습니다. 앞으로 며칠 안에 러시아인들은 동부 전선에서 함께 유혈사태를 막기 위하여 브레스트-리토프스크에서 독일군과 평화회담을 가질 것입니다."
 ww1_brest_litovsk.101.a: "다른 선택이 있나?"
 ww1_brest_litovsk.101.b: "러시아에서 또 문제가 생겼다."
 ww1_brest_litovsk.102.t: "브레스트-리토프스크 조약"
 ww1_brest_litovsk.102.d: "러시아가 대전쟁에서 패전했다는 것이 명백해졌습니. 러시아 정부는 독일과 강화 협정을 체결했습니다. 협정 조건에 따라 러시아는 폴란드와 발트해 연안 주의 영토를 양도하고, 함대와 군대도 감축할 의무가 있습니다. 동부 전선은 조용해졌습니다."
 ww1_brest_litovsk.102.a: "러시아가 협상국을 배신한 것인가? 아니면 희망이 없는 것인가?"