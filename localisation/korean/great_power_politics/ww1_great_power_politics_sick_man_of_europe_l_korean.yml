 GER_berlin_baghdad_railway_construction: "바그다드 철도 부설"
 ww1_berlin_baghdad.1.t: "[GER.GetForeignName]의 바그다드 철도 연장 희망"
 ww1_berlin_baghdad.1.d: "[GER.GetForeignName]이 베를린-바그다드 철도 부설을 계속할 수 있도록 권한을 요청했습니다. 저들은 자금을 전액 출자하려고 하며, 남부 빌라예트와 페르시아만 지역을 제국의 다른 지방과 연결하는 철도는 우리에게 큰 이익이 될 것입니다. 그러나 이로써 독일과 동맹을 맺는 방향으로 더 기울어지고, 페르시아와 페르시아만에서 러시아와 영국 영향권을 위협하게 될 것입니다. 두 강대국을 자극할지도 모를 위험을 감수하면서까지 우리 기반시설을 현대화하는 것이 가치 있는 일인지 주의해서 결정을 내려야 합니다."
 ww1_berlin_baghdad.1.a: "물론 투자를 환영한다."
 ww1_berlin_baghdad.1.b: "사실 우린 원하지 않는다."
 ww1_berlin_baghdad.2.t: "[TUR.GetForeignName]의 부설권 보장"
 ww1_berlin_baghdad.2.d: "예상대로 튀르크는 우리의 관대한 제한을 거부할 수 없었습니다. 이제 우리가 계획에 드는 모든 비용을 대고 우리 전문가들을 중동으로 보내야 합니다. 부디 러시아와 영국이 부설을 반대하지 않길 바랍니다."
 ww1_berlin_baghdad.2.a: "즉시 진행하라."
 ww1_berlin_baghdad.3.t: "[TUR.GetForeignName]의 부설 거부"
 ww1_berlin_baghdad.3.d: "뜻밖에 튀르크는 우리가 전액을 다 낸다고 했는데도 부설권 보장을 거부했습니다. 어쩌면 저들은 자기 영토를 탐내는 러시아와 영국과 친교를 맺으려는 걸지도 모릅니다."
 ww1_berlin_baghdad.3.a: "은혜도 모르는 튀르크 놈들."
 ww1_berlin_baghdad.4.t: "[GER.GetForeignName]의 베를린-바그다드 철도 연장"
 ww1_berlin_baghdad.4.d: "독일이 베를린-바그다드 철도 부설의 다음 단계를 시작하기로 결정했으며, 이는 지역의 우리 영향력에 위협이 됩니다. 저들에게 물러서라고 항의해야 합니까!"
 ww1_berlin_baghdad.4.a: "당연히 항의하라!"
 ww1_berlin_baghdad.4.b: "저들과 당장 분쟁을 벌일 필요는 없다."
 ww1_berlin_baghdad.5.t: "[ENG.GetName]의 베를린-바그다드 철도 항의"
 ww1_berlin_baghdad.5.d: "[ENG.GetName] 측은 우리와 튀르크의 거래를 자신들과 관련된 문제로 여기는 듯하며, 바그다드 철도 건설에 대해 공식적으로 항의했습니다. 저들 의견을 고려해야 합니까?"
 ww1_berlin_baghdad.5.a: "저들이 관여할 바가 아니다."
 ww1_berlin_baghdad.5.b: "관심도 없고, 물어보지도 않았다."
 ww1_berlin_baghdad.6.t: "물러선 [GER.GetForeignName]"
 ww1_berlin_baghdad.6.d: "우리가 독일에 가한 압력이 결실을 맺어 베를린-바그다드 철도 부설이 중단된 것으로 보입니다. 이는 우리의 외교적 승리를 축하할 만한 일입니다."
 ww1_berlin_baghdad.6.a: "좋은 소식이다!"
 ww1_berlin_baghdad.6.b: "패를 너무 벌리지 말자고."
 ww1_berlin_baghdad.7.t: "물러서기를 거부한 [GER.GetForeignName]"
 ww1_berlin_baghdad.7.d: "우리의 위협에도 불구하고 [FROM.GetName] 측은 여전히 ​​물러서지 않고 계획을 중단하지 않고 있는 것으로 보입니다. 바그다드 철도를 완전히 없애버리기 위한 전면적인 무역 전쟁에 대비해야 합니까?"
 ww1_berlin_baghdad.7.a: "무역 금수조치를 실행하라."
 ww1_berlin_baghdad.7.b: "물러서야 한다."
 ww1_berlin_baghdad.8.t: "[ENG.GetName]의 무역 금수조치 단행"
 ww1_berlin_baghdad.8.d: "놀랍게도 [ENG.GetName] 측은 실제로 위협을 실행에 옮겨 우리와의 모든 무역을 공식적으로 중단했습니다. 이는 양국 관계를 회복할 수 있는 마지막 기회입니다."
 ww1_berlin_baghdad.8.a: "이 상황을 해결해야 한다."
 ww1_berlin_baghdad.8.b: "아니, 이건 미친 짓이야."
 ww1_berlin_baghdad.9.t: "독일과 튀르크의 단호한 입장 표명"
 ww1_berlin_baghdad.9.d: "[GER.GetForeignName]이 여전히 물러서지 않고 계획을 중단하지 않는 것으로 보아 우리의 제재 조치가 무시된 것 같습니다. 페르시아만에서 우리 영토를 지키기 위해 전면전을 치를 준비가 되어 있습니까?"
 ww1_berlin_baghdad.9.a: "전쟁이다."
 ww1_berlin_baghdad.9.b: "아니, 이건 미친 짓이야."
 ww1_berlin_baghdad.10.t: "부설 조기 중단"
 ww1_berlin_baghdad.10.d: "불가피한 사정으로 인해 공사가 중단되었습니다. 남은 자산은 수습했지만, 당분간 공사를 재개하기는 어려울 것으로 예상됩니다."
 ww1_berlin_baghdad.10.a: "유감이군."
 ww1_berlin_baghdad.10.b: "우리가 독일 식민지냐? 권한을 취소하라."
 ww1_berlin_baghdad.11.t: "[TUR.GetForeignName]의 권한 취소"
 ww1_berlin_baghdad.11.d: "튀르크 정부가 바그다드 철도 부설권을 갑자기 취소했습니다. 남은 자산을 챙길 수는 있었지만, 당분간 공사를 재개할 수 없을 것 같습니다."
 ww1_berlin_baghdad.11.a: "이건 뭐 일종의 배신이냐?"
 ww1_berlin_baghdad.12.t: "[TUR.GetForeignName]의 바그다드 철도 폐기"
 ww1_berlin_baghdad.12.d: "놀랍게도 [FROM.GetName] 측에서 독일에 준 부설권을 취소하기로 결정했습니다. 이는 양국 정부 간의 관계를 개선하고 해당 지역에 있는 우리 자산을 더욱 안전하게 보호하는 데 도움이 되므로 환영할 만한 조치입니다."
 ww1_berlin_baghdad.12.a: "금수조치 해제로 화답하라."
 ww1_berlin_baghdad.13.t: "물러선 [FROM.GetName]"
 ww1_berlin_baghdad.13.d: "놀랍게도, 온갖 위협과 항의에도 불구하고 [FROM.GetName] 측은 그 어떤 것도 실행에 옮기지 않기로 결정했고, 바그다드 철도 부설은 아무 문제 없이 진행될 수 있게 되었습니다."
 ww1_berlin_baghdad.13.a: "처음부터 시작해선 안 됐는데."
 ww1_berlin_baghdad.14.t: "부설 조기 중단"
 ww1_berlin_baghdad.14.d: "불가피한 사정으로 인해 공사가 중단되었습니다. 남은 자산은 수습했지만, 당분간 공사를 재개하기는 어려울 것으로 예상됩니다."
 ww1_berlin_baghdad.14.a: "유감이군."
 ww1_berlin_baghdad.15.t: "[FROM.GetName]의 권한 취소"
 ww1_berlin_baghdad.15.d: "튀르크 정부가 바그다드 철도 부설권을 갑자기 취소했습니다. 남은 자산을 챙길 수는 있었지만, 당분간 공사를 재개할 수 없을 것 같습니다."
 ww1_berlin_baghdad.15.a: "이건 뭐 일종의 배신이냐?"
 ww1_berlin_baghdad.16.t: "[FROM.GetName]의 바그다드 철도 취소"
 ww1_berlin_baghdad.16.d: "놀랍게도 [FROM.GetName] 측에서 독일에 준 부설권을 취소하기로 결정했습니다. 이는 양국 정부 간의 관계를 개선하고 해당 지역에 있는 우리 자산을 더욱 안전하게 보호하는 데 도움이 되므로 환영할 만한 조치입니다."
 ww1_berlin_baghdad.16.a: "금수조치 해제로 화답하라."
