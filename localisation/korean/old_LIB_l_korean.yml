l_korean:
 LIB_rapid_industrialisation: "급속한 산업화"
 LIB_rapid_industrialisation_desc: "현대적인 국가들과 다투고 식민지를 통해 진정한 나라를 만들려면 이 땅을 재빨리 산업화해야 합니다. 필요하다면 힘으로라도."
 LIB_slow_and_steady: "천천히 꾸준히 가는 자가 경주에서 이긴다"
 LIB_slow_and_steady_desc: "강제로 산업화를 시도한다면 농업 분야와 원주민들에게서 큰 문제를 일으킬 수도 있습니다. 신중해야 합니다."
 LIB_resurrect_liberian_dollar: "라이베리아 달러 회생"
 LIB_resurrect_liberian_dollar_desc: "1907년 우리 경제는 박살이 났으며 어쩔 수 없이 임시 조치로 미국 달러를 도입해야만 했습니다. 그러나 국민주의의 새로운 파도 가운데서 우리는 라이베리아 달러를 회생시키고 우리만의 화폐를 제어할 수 있습니다."
 LIB_plantation_economy: "플랜테이션 경제"
 LIB_plantation_economy_desc: "라이베리아는 미국 남부와 그다지 다르지 않습니다. 우린 강한 농업 플랜테이션 경제가 있습니다. 우리 힘으로 건설합시다."
 LIB_aristocrats_into_capitalists: "귀족의 자본주의자화"
 LIB_aristocrats_into_capitalists_desc: "우리 상류층은 구시대적이라는 문제가 있습니다. 혁신하고 건설하는 것 대신 그들은 토지의 소산을 먹고 삽니다. 이 귀족 계층이 자본가 계층으로 혁명하도록 장려해야만 합니다."
 LIB_pacification_of_the_hinterlands: "내륙 평정"
 LIB_pacification_of_the_hinterlands_desc: "현재의 가장 큰 걱정거리는 내륙 평정입니다. 강도와 노예상이 자유롭게 돌아다니며 유럽인들은 욕심에 찬 눈으로 불안정한 국경을 탐내고 있습니다. 내륙 평정이 선결과제가 되어야 합니다!"
 LIB_manifest_destiny: "명백한 운명"
 LIB_manifest_destiny_desc: "아프리카를 식민화하여 검은 대국을 만드는 것이 아메리카-라이베리아의 명백한 운명입니다! 우리 형제들이 고국에서 원주민들을 다루듯 이곳 원주민들을 다룰 것입니다."
 LIB_brothers_not_foes: "적이 아닌 형제"
 LIB_brothers_not_foes_desc: "벨벳 장갑이 무쇠 주먹보다 낫습니다. 이 부족들과 협상해야지 정복해서는 안됩니다."
 LIB_renegotiate_johnson_binger: "존슨-빙거 재협상"
 LIB_renegotiate_johnson_binger_desc: "존슨-빙거 조약은 내륙에 군대를 주둔할 수 있도록 허용했지만 그 제한이 정해져 있습니다. 어차피 철수할 예정이니 목적에 부합하는 대로 조약에 대해 협상해야 합니다."
 LIB_tax_exemptions: "부족 면세"
 LIB_tax_exemptions_desc: "항상 부족들에게 세금을 내라고 요구하는 것을 멈춘다면 아마도 좀 더 우리에게 수용적이 될 지도 모릅니다."
 LIB_build_schools: "학교 건립"
 LIB_build_schools_desc: "이 부족민들을 교육할 수 있다면 (그리고 거기서 그들을 세뇌한다면) 평정에 더 좋은 시간을 보낼 수 있을 지도 모릅니다."
 LIB_put_the_boot_down: "군홧발"
 LIB_put_the_boot_down_desc: "덤불 주위를 치고 다니는 것을 멈출 때입니다. 발을 내딛을 것입니다. 이 부족민들은 복종하지 않는다면 죽게 될 것입니다!"
 LIB_smash_slavery: "노예 무역 철폐"
 LIB_smash_slavery_desc: "라이베리아 땅에 야만적인 약탈자는 더는 없을 것입니다! 노예 무역은 단번에 철폐되어 영원히 사라질 것입니다."
 LIB_reiterate_segregation: "분리정책 강화"
 LIB_reiterate_segregation_desc: "새 라이베리아에 어울리고 싶다면 문명인이어야만 합니다. 이는 서구식 교육을 말합니다. 그리고 그건 기독교로의 개종을 뜻합니다. 분리정책은 어제도, 오늘도 실시하였으며, 영원히 실시될 것입니다!"
 LIB_solidify_borders: "국경 굳히기"
 LIB_solidify_borders_desc: "내륙 지역을 평정하는 작업이 거의 마무리되었습니다."
 LIB_develop_hinterlands: "내륙 개발"
 LIB_develop_hinterlands_desc: "내륙이 평정되었으니 더욱 개발하여 플랜테이션을 설치해볼 수 있습니다."
 LIB_industrialise_hinterlands: "내륙 산업화"
 LIB_industrialise_hinterlands_desc: "내륙이 평정되었으니 새로운 라이베리아 시민들을 위한 일자리를 만들기 위해 산업화를 시작할 수 있습니다."
 LIB_northern_aristocrats: "북부 귀족"
 LIB_northern_aristocrats_desc: "귀족들이 북쪽으로 갈 수 있으니 귀족 권력의 막대한 팽창을 보게 될 것입니다."
 LIB_invite_colonisers: "식민주의자 초대"
 LIB_invite_colonisers_desc: "북쪽이 열렸으니 미국과 유럽에서 온 식민주의자들을 초청하여 이 지역 개발을 돕게 해야 합니다."
 LIB_industrial_expertise: "산업 전문가"
 LIB_industrial_expertise_desc: "산업 전문가를 초청하는 것은 우리 경제 개발을 도울 것입니다."
 LIB_engineer_crisis: "위기 설계"
 LIB_engineer_crisis_desc: "아서 바클레이가 사임하고 새 대통령이 부임할 시간이 다가왔습니다. 그러나 나라가 위기상황에 빠진다면 아마 비상권한이 부여되고 무기한 통치할 수 있을지도..."
 LIB_formalise_one_party_state: "일당국가 공식화"
 LIB_formalise_one_party_state_desc: "사실상 라이베리아는 일당국가입니다. 그러나 다른 정당의 존재는 여전히 우리의 안정에 위해를 가하고 있습니다. 트루 휘그당을 제외한 다른 모든 정당을 금지할 것입니다."
 LIB_move_towards_natural_ally: "중립 동맹을 향해"
 LIB_move_towards_natural_ally_desc: "독일은 무려 라이베리아 무역의 75%를 차지합니다. 영국이나 미국 제국주의자들이 아닌 그들이 우리의 자연적인 동맹입니다."
 LIB_labour_camps_for_insurgents: "반란군 처벌"
 LIB_labour_camps_for_insurgents_desc: "이 반란군들(우리가 시작했지만 ㅋㅋ)에게 교훈을 줘야 할 필요가 있습니다! 당신과 함께 노동 교화소로!"
 LIB_president_for_life: "종신 대통령"
 LIB_president_for_life_desc: "아서 바클레이를 종신 대통령으로 선포할 것입니다!"
 LIB_embrace_pan_africanism: "범아프리카주의 포용"
 LIB_embrace_pan_africanism_desc: "지지 기반과 정통성이 필요하게 될 것입니다. 범아프리카주의는 좋은 외침이 될 것입니다!"
 LIB_join_central_powers: "동맹국 가입"
 LIB_join_central_powers_desc: "이제 독일의 신성한 동맹에 정식으로 합류할 때가 되었습니다!"
 LIB_german_arms_shipments: "독일 무기 수입품"
 LIB_german_arms_shipments_desc: "개척군을 성장시키기 위해 독일로부터 무기를 구매합니다."
 LIB_conscript_tribesmen: "부족민 징병"
 LIB_conscript_tribesmen_desc: "독일의 아스카리 체제와 완전히 다르지 않은 선에서 부족민들을 동원하기 시작합시다."
 LIB_german_attache: "독일 주재무관 초청"
 LIB_german_attache_desc: "우리 군대를 발전시키기 위해 독일 장교들을 초대해야 합니다."
 LIB_expand_pan_africanism: "범아프리카주의 확대"
 LIB_expand_pan_africanism_desc: "우리는 이 범아프리카주의를 장난이 아니라 심각하게 고려해야 합니다. 이는 프랑스와의 전쟁에서 진정한 이득이 될 수 있습니다."
 LIB_monrovia_conference: "몬로비아 회담"
 LIB_monrovia_conference_desc: "우리는 아프리카 대륙의 지도자들을 몬로비아로 초청하여 때가 되면 식민 지배자들에 맞서 봉기하는 것에 대해 논의해야 합니다."
 LIB_out_with_old_in_with_new: "옛 것을 버리고 새 것을 취하자"
 LIB_out_with_old_in_with_new_desc: "다니엘 에드워드 하워드가 아서 바클레이의 후임으로 대통령으로 선출되었습니다. 진휘그당은 새로운 시대를 위해 리더십을 쇄신할 것입니다."
 LIB_tightening_our_belts: "허리띠 조이기"
 LIB_tightening_our_belts_desc: "우리 경제는... 아주 힘든 시기를 겪고 있습니다. 따라서, 우리는 급여 지급을 일시 중단하고 정부 예산을 축소한 뒤, 전국적으로 허리띠를 졸라매야 할 때입니다."
 LIB_maintain_neutrality: "중립 유지"
 LIB_maintain_neutrality_desc: "어떠한 대가를 치르더라도 라이베리아의 중립을 유지하려고 해야만 합니다. 독일의 사업 철수를 감당할 수 없습니다."
 LIB_rig_elections: "선거 조작"
 LIB_rig_elections_desc: "트루휘그당의 우세를 보장해야만 합니다. 어쨌거나 선거를 조작하는 게 뭐가 나쁩니까?"
 LIB_seek_loan_from_america: "미국 차관 도입"
 LIB_seek_loan_from_america_desc: "우린 긴급 구제가 필요합니다. 아주 빨리요. 미국인들에게 차관을 줄 수 있는지 물어볼 것입니다."
 LIB_play_both_sides: "양다리 걸치기"
 LIB_play_both_sides_desc: "난 양쪽에서 놀기 때문에 항상 최고가 되는거야."
 LIB_prepare_for_inevitable: "불가피한 상황 대비"
 LIB_prepare_for_inevitable_desc: "세상은 위기에 처했습니다. 준비하지 않는 것은 멍청한 일입니다."
 LIB_placate_border_empires: "국경 제국들 달래기"
 LIB_placate_border_empires_desc: "영국과 프랑스가 우리와 국경을 맞대고 있으니 그들과 화합할 것입니다."
 LIB_strengthen_the_republic: "공화국 강화"
 LIB_strengthen_the_republic_desc: "지금은 정치적 상황이 덜 불안정하니 정치 영역을 다시 활성화해볼 수 있습니다."
 LIB_join_entente: "협상국 가입"
 LIB_join_entente_desc: "이 지역에서의 독일 잠수함 활동이 우리를 압박하고 있습니다! 협상국에 가입해야만 합니다."
 LIB_national_union: "국민 일치를 위한 국민연합!"
 LIB_national_union_desc: "휘그당이 선거를 조작하지 않고 민주주의를 지키기로 하자 국민연합당이 선거에서 이겼습니다! 이는 라이베리아 정치에 큰 변화를 가져올 것입니다..."
 LIB_rapproachment_with_natives: "원주민들과의 재접촉"
 LIB_rapproachment_with_natives_desc: "분리정책은 끝나야 합니다! 우리는 원주민들과 재접촉하여 출신성분에 상관 없는 라이베리아의 정체성을 만들 것입니다."
 LIB_topple_aristocrats: "귀족 혁파"
 LIB_topple_aristocrats_desc: "이 나라의 괴상한 괴족의 보루는 반드시 사라져야 합니다! 귀족들의 자산을 압류하고 노동 계층을 지원할 것입니다."
 LIB_anti_colonialism: "반식민주의"
 LIB_anti_colonialism_desc: "독일, 미국, 영국, 그리고 프랑스는 꺼지라 합시다! 우린 처음으로 진정한 아프리카 국가가 될 것입니다!"
 LIB_found_liberian_army: "라이베리아군 창설"
 LIB_found_liberian_army_desc: "개척군은 현대 20세기에는 씨알도 먹히지 않을 것입니다. 라이베리아군을 창설할 것입니다!"
 LIB_syndicates: "조합 창설"
 LIB_syndicates_desc: "막대한 농업 경제를 극복하기 위해 현대적인 체계가 필요합니다. 국민생디칼리슴 정책이 적당해 보입니다."
 LIB_national_pacification: "국가 평정"
 LIB_national_pacification_desc: "나라가 위기에 처했습니다. 우린 극도로 불안정합니다. 우리는 싹을 자르고, 안정에 대한 모든 위협을 한 번의 신속한 공격으로 파괴할 것입니다. 이는 내전으로 몰아갈 것이지만, 일단 분란이 끝나면 우리 계획을 시작할 수 있습니다."
 LIB_rebuild: "국가 재건"
 LIB_rebuild_desc: "내전은 짧았지만 파괴적이었습니다. 국가를 재건하여 국민연합이 앞으로 나간다는 것을 국민들에게 보여줄 것입니다."
 LIB_tribal_emancipation: "부족 해방"
 LIB_tribal_emancipation_desc: "원주민들은 해방 받아 마땅합니다. 결국 그들이 여기 먼저 살았잖습니까!"
 LIB_liberian_militarism: "라이베리아 군국주의의 탄생"
 LIB_liberian_militarism_desc: "이 새로운 종류의 애국주의를 장려하기 위해 군국주의의 모델을 따를 것입니다."
 LIB_follow_french_model: "프랑스 모델 추종"
 LIB_follow_french_model_desc: "프랑스는 역사상 가장 위대한 장군 나폴레옹 보나파르트가 탄생시킨 오랜 전쟁사를 가졌습니다. 우린 이들의 전쟁 방식을 따를 것입니다."
 LIB_follow_prussian_model: "프로이센 모델 추종"
 LIB_follow_prussian_model_desc: "프로이센은 논란의 여지 없는 전쟁의 대가입니다. 그들의 훈련은 보통이 아니며 그들의 군사 모델을 받아들여야 합니다."
 LIB_join_france: "프랑스 가입"
 LIB_join_france_desc: "프랑스와 함께 독일에 대항하여 싸우는 것이 우리나라에 잘 맞습니다."
 LIB_join_germany: "독일 가입"
 LIB_join_germany_desc: "독일과 함께한다면 대라이베리아의 영광을 위하여 서아프리카의 가치 있는 땅을 점령할 기회가 있을 것입니다."
 LIB_peoples_victory: "인민의 승리"
 LIB_peoples_victory_desc: "민주주의가 마침내 돌아올 수 있습니다! 포크너의 인민당이 이겼습니다!"
 LIB_class_compromise: "계급 타협"
 LIB_class_compromise_desc: "귀족과 노동자가 서로 싸울 이유가 없습니다! 타협하여 더 나은 라이베리아를 만들어야 합니다."
 LIB_public_works: "공공사업"
 LIB_public_works_desc: "국가의 단결을 강화하기 위하여 공공사업에 투자해야 합니다."
 LIB_follow_american_model: "미국 모델 추종"
 LIB_follow_american_model_desc: "미국인들이 하는 걸 따라해야 합니다."
 LIB_alliance_of_democracy: "민주주의의 동맹"
 LIB_alliance_of_democracy_desc: "프랑스는 이 세계의 민주주의의 등불입니다. 그들과 동맹을 맺어야 합니다!"
 LIB_tribal_suffrage: "부족 참정권"
 LIB_tribal_suffrage_desc: "부족민들은 투표권이 없습니다. 이 혐오스러운 잘못을 바로잡아야만 합니다!"
 LIB_land_of_liberty: "자유의 땅"
 LIB_land_of_liberty_desc: "포크너 대통령에 걸맞는, 자유의 땅, 라이베리아!"
 LIB_expand_frontier_force: "개척군 확대"
 LIB_expand_frontier_force_desc: "우리 땅을 더 잘 지키기 위하여 라이베리아 개척군을 확대해야 합니다."
 LIB_try_the_whig_party: "휘그당 재판"
 LIB_try_the_whig_party_desc: "트루 휘그당은 노골적으로 선거를 조작하고 사실상 일당 국가로 집권하고 있습니다. 반역죄로 그들의 지도자를 재판할 때가 왔습니다!"
 LIB_encourage_opposition: "야당 지원"
 LIB_encourage_opposition_desc: "트루 휘그당의 실수를 되풀이하지 않으려면 야당이 우리의 후계자들을 가만히 두도록 독려해야 합니다."
 LIB_smash_german_monopolies: "독일의 독점 철폐"
 LIB_smash_german_monopolies_desc: "우린 독일인들이 계속해서 우리나라를 독점하는 것을 허용할 수 없습니다. 독점을 철폐해야만 합니다!"
 LIB_stability_effort: "안정 주력"
 LIB_stability_effort_desc: "우린 민주주의가 유지되도록 하기 위해 안정을 찾아야 합니다!"
 LIB_investment_from_europeans: "유럽의 투자"
 LIB_investment_from_europeans_desc: "라이베리아 산업 계약을 달성하기 위해 영국과 프랑스를 초청하는 것을 고려해야 합니다."
 LIB_liberty_arms: "자유주의 무기"
 LIB_liberty_arms_desc: "라이베리아군의 확장을 위하여 프랑스 총을 사야 합니다."
 LIB_dewhiggification: "탈휘그화"
 LIB_dewhiggification_desc: "휘그당의 정권 독점을 끝내는 것은 힘들지도 모르지만, 언젠가는 해야할 일입니다."
 LIB_anti_whiggery: "반휘그주의"
 LIB_anti_whiggery_desc: "휘그당과 그들의 웃긴 짓거리들은 우리 사회에 하지 말아야 할 일의 모범으로 새겨져야 합니다."
 LIB_education_reform: "교육 개혁"
 LIB_education_reform_desc: "더 나은 라이베리아를 만들기 위해 교육제도를 향상시켜야 합니다."
 LIB_research_effort: "연구 주력"
 LIB_research_effort_desc: "아프리카에서 우세를 점하는 강대국들과 겨루고자 한다면 연구에 더욱 투자해야 합니다."
 lib_industrialisation_bad_tt: "§R급속한 산업화의 길은 나라의 안정을 크게 해칠 것입니다!§!"
 lib_civil_war_divisions_tt: "§C새 민병대를 창설하기 위해서 내전은 훌륭한 변명거리입니다...§!"
 LIB_king_for_our_people: "우리 국민을 위한 국왕?"
 LIB_king_for_our_people_desc: "바클레이를 그저 종신대통령으로 선언하고 모든 권력을 쥐게 할 수도 있지만 다른 선택지도 열려 있습니다. 군주제를 선포하는 것으로 바클레이는 무대 뒤에서 황제가 될 수 있으며 우린 모든 혜택을 누릴 수 있습니다."
 LIB_entrench_us_dollar: "미국 달러 고수"
 LIB_entrench_us_dollar_desc: "가까운 미래를 위해 우리나라의 통화를 갱신하는 것은 현실적이지 않습니다. 우리는 미국 달러를 고수할 것입니다."

 ww1_liberia.4.t: "라이베리아 내전!"
 ww1_liberia.4.d: "라이베리아에서 내전이 터졌습니다! 현 정권의 반대자들은 몬로비아의 트루 휘그당에 대한 반대를 선언하기 위해 내륙 지방에 모였습니다.\n\n그러나 각국의 소식통은 [LIB.GetLeader] 현직 대통령이 비상대권으로 독재 통치를 벌임으로써 조작된 가짜 위기일 가능성이 더 큰 것처럼 보이기 때문에 내전이 발생한 의심스러운 상황에 주목했습니다."
 ww1_liberia.4.a: "내전이라고? 라이베리아에서?!"
 ww1_liberia.5.t: "참전을 원하는 라이베리아"
 ww1_liberia.5.d: "최근 영국과 미국 친구들과 멀어진 라이베리아 공화국은 무역의 75%가 우리와 관련되어 있기 때문에 우리에게 도움을 요청했습니다. 그들은 [Root.GetFactionName]에 가입하기를 원하고 국경에 있는 영국과 프랑스령 식민지를 탐욕스럽게 주시합니다.  뭐라고 대답해야 합니까?"
 ww1_liberia.5.a: "가장 가치있는 동맹이 될 것이다."
 ww1_liberia.5.b: "우린 그 지역을 탐내고 있다."
 ww1_liberia.6.t: "몬로비아 회담"
 ww1_liberia.6.d: "[LIB.GetLeader] 대통령은 유럽의 주인에 대항하여 봉기할 가능성에 대해 논의하기 위해 서아프리카 전역의 여러 지도자들을 초청하는 논란의 여지가 있는 결정을 내림에 따라 오늘 몬로비아에서 중요한 움직임이 벌어지고 있습니다.\n\n이는 범아프리카주의를 수용하려는 라이베리아의 현 방향을 따르며, 프랑스와 영국은 수상하다는 듯 지켜보고 있습니다."
 ww1_liberia.6.a: "시대가 바뀌고 있다..."
 ww1_liberia.7.t: "몬로비아의 구제금융 요청"
 ww1_liberia.7.d: "[LIB.GetLeader] 라이베리아 대통령은 현재 경제적 혼란을 겪고 있는 라이베리아를 구하기 위해 오늘 우리에게 구제금융을 청원했습니다."
 ww1_liberia.7.a: "우린 돈이 필요하다. 그들에게 지원은 없다."
 ww1_liberia.7.b: "라이베리아는 미국의 중요한 식민지다. 그들이 필요한 걸 지원할 것이다."
 ww1_liberia.8.t: "구제금융 거부!"
 ww1_liberia.8.d: "[USA.GetLeader] 정부는 우리에게 구제금융이 필요하지 않으며 시간을 들일 가치도 없다고 결정했습니다! 우리가 알아서 해결해야 합니다..."
 ww1_liberia.8.a: "제기랄!"
 ww1_liberia.9.t: "도움을 주러 온 엉클 샘!"
 ww1_liberia.9.d: "미국인들은 우리의 도움 요청을 받아들였습니다!  그들은 우리가 이 사업을 정리하는 동안 우리 국고를 계속 유지하는 데 도움이 될 것입니다."
 ww1_liberia.9.a: "[USA.GetLeader], 고맙소!"
 ww1_liberia.10.t: "라이베리아의 [Root.GetFactionName] 가입?"
 ww1_liberia.10.d: "라이베리아는 처음에 중립을 유지하려고 했지만 독일군이 무제한 잠수함 작전을 수행하여 전쟁 상태에 빠졌습니다.  그들은 [ROOT.GetFactionName]에 가입하기를 원합니다. 뭐라고 대답해야 합니까?"
 ww1_liberia.10.a: "전쟁터에 온 걸 환영한다, 친구들!"
 ww1_liberia.10.b: "그들이 뭘 어떻게 도울 수 있는데?"
 ww1_liberia.11.t: "라이베리아 내전!"
 ww1_liberia.11.d: "라이베리아에서 내전이 터졌습니다! 국민연합당의 예상치 못한 승리에 이어, 새 대통령은 전 야당이자 '독재'를 펼쳤던 신휘그당의 흔적을 파괴하려는 움직임을 보이고 있었습니다.\n\n오늘 대통령은 휘그당 고위 지도부를 체포하기 위해 군대를 동원했고, 그에 따라 휘그당은 권력을 되찾기 위해 최후의 반란을 일으켰습니다!"
 ww1_liberia.11.a: "휘그당의 몰락인가?"
 ww1_liberia.12.t: "아서 바클레이의 재판"
 ww1_liberia.12.d: "아서 바클레이 전 대통령 겸 트루 휘그당 당대표는 오늘 반역죄로 재판을 받고 있습니다. 그러나 그는 트루 휘그당의 거물이며 그를 유죄로 판결하는 것은 우리의 안정에 해를 끼칠 수 있습니다.\n\n그러나 반대로 그를 방치하는 것은 휘그당 지도부를 꽤나 대담하게 만들 수 있고 우리 정권에 적극적으로 위험을 끼칠 수 있습니다."
 ww1_liberia.12.a: "유죄!"
 ww1_liberia.12.b: "무죄!"
 ww1_liberia.13.t: "대니얼 하워드의 재판"
 ww1_liberia.13.d: "대니얼 하워드는 선거에서 [LIB.GetLeader] 대통령에 맞서 출마하였으며 휘그당 차기 지도자가 될 예정이었습니다.  그를 수감하는 것은 확실히 좋은 모습이 아니겠지만, 그를 풀어주는 것은 복수를 의미할 수 있습니다."
 ww1_liberia.13.a: "유죄!"
 ww1_liberia.13.b: "무죄!"
 ww1_liberia.14.t: "트루 휘그당 반란!"
 ww1_liberia.14.d: "우리의 두려움이 현실이 되었습니다! 트루 휘그당의 잔당이 얼마 남지 않은 힘을 모아 반란을 일으켰습니다! 운 좋게도 재건된 군대는 내륙으로 도망쳐 지금은 교외에 숨어 있는 반역자들을 격퇴할 수 있었습니다."
 ww1_liberia.14.a: "반혁명분자들을 분쇄해야 한다!"
 ww1_liberia.15.t: "라이베리아 내전!"
 ww1_liberia.15.d: "라이베리아에서 내전이 터졌습니다! 트루 휘그당의 비참한 잔당이 주도한 반란에 뒤이어, 남은 지도부들은 교외로 도피하여 [LIB.GetLeader] 현 대통령에 대항하는 게릴라전을 벌이고 있습니다!"
 ww1_liberia.15.a: "라이베리아의 민주주의를 위한 전쟁이 벌어지고 있다."
