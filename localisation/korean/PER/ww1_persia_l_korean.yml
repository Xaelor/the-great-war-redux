 trait_PER_gendarmerie_desc: "이 지도자는 헌병대 장교입니다."
 ww1_persia_rework.1.t: "아조드 올 몰크 섭정의 죽음"
 ww1_persia_rework.1.d: "알리 레자 칸 아조드 올 몰크가 62세를 일기로 세상을 떠났습니다. 그는 총 18개월 동안 [GetPersiaName]의 섭정을 지냈습니다. 생을 마감할 무렵에는 다이 칸(존경받는 삼촌)으로 불렸습니다."
 ww1_persia_rework.1.a: "새로운 섭정을 뽑아야 하겠군."
 ww1_persia_rework.2.t: "새로운 섭정 선택"
 ww1_persia_rework.2.d: "아조드 올 몰크의 사망으로 섭정 자리가 공석이 되었습니다. 의회는 새로운 섭정을 선출해야 하며, 이는 우리 정치의 방향을 결정할 것입니다. 보수 성향의 중도파 나세르 알 몰크와 진보 성향의 민주당 모스토피 올 마말렉 둘 중 한 명을 택해야 합니다."
 ww1_persia_rework.2.a: "중도가 필요하다."
 ww1_persia_rework.2.b: "개혁이 필요하다."
 ww1_persia_rework.3.t: "Seyyed Abdollah Behbahani Assassinated!"
 ww1_persia_rework.3.d: "제2의회에서 의원들은 강경 진보파와 온건파로 나뉘었습니다. 베흐바하니는 ​​온건파를 지지했고, 두 파벌 간의 의견 차이가 발생했을 때 영향력 있는 인물이 되었습니다. 이로 인해 사이이드 하산 타기자데가 이끄는 강경 진보파 의원들은 그를 싫어하게 되었습니다. 1910년 7월 15일 금요일 밤, 민주당과 연관된 네 명의 총잡이가 그의 집을 습격하여 그를 살해했습니다. 사이이드 하산 타기자데가 배후로 지목되었으며, 그는 이후 수도에서 도피했습니다."
 ww1_persia_rework.3.a: "폭력을 멈춰야 한다!"
 ww1_persia_rework.4.t: "무장 해제를 둘러싼 폭력적 대립!"
 ww1_persia_rework.4.d: "4월에 수도에 도착한 사타르 칸과 그의 전사들은 아타베크 공원에 진을 치고 정부의 무장 해제 명령을 거부했습니다. 예프렘 칸이 이끄는 정부군과 경찰은 짧지만 격렬한 충돌을 벌여 사타르 칸의 군대를 포위하고 무장 해제시키는 데 성공했습니다. 이 과정에서 약 30명의 전사가 사망했고, 사타르 칸은 다리에 부상을 입어 불구가 되었습니다."
 ww1_persia_rework.4.a: "이렇게 될 수밖에 없었다."
 ww1_per_rus_strangling.1.t: "러시아의 최후통첩!"
 ww1_per_rus_strangling.1.d: "러시아 공사는 페르시아 외무부를 찾아와 자국 정부를 대표하여 재무부 헌병대를 슈아우스-살타나 공원에서 즉시 철수시키고 카자크 여단 소속 페르시아 카자크 병사들을 공원에 배치할 것을 구두로 요구했습니다. 또한 자국 영사관 직원들에게 가해진 \"모욕\"에 대한 사과를 요구했습니다. 그는 페르시아의 주권 침해 및 내정 간섭에 대한 항의를 전혀 고려하지 않았으며, 이미 접수 및 확인했던 페르시아 정부의 서면 항의서를 반송했습니다.\n\n러시아 공사는 페르시아 내각으로부터 \"예\" 또는 \"아니오\"로 즉각적인 답변을 받으라는 지시를 받았다고 밝혔습니다."
 ww1_per_rus_strangling.1.a: "영국과 상의하겠다."
 ww1_per_rus_strangling.1.b: "다른 선택의 여지가 없다..."
 ww1_per_rus_strangling.1.c: "우린 굴욕을 당하지 않을 것이다!"
 ww1_per_rus_strangling.2.t: "러시아에 겁박당한 페르시아"
 ww1_per_rus_strangling.2.d: ""
 ww1_per_rus_strangling.2.a: "최후통첩을 수용하고 사죄하라고 전하라."
 ww1_per_rus_strangling.3.t: "영국 고문단의 러시아 최후통첩 수용 제안"
 ww1_per_rus_strangling.3.d: ""
 ww1_per_rus_strangling.4.t: "페르시아의 최후통첩 수용..."
 ww1_per_rus_strangling.4.d: ""
 ww1_per_rus_strangling.4.a: "상관 없다, 새로운 최후통첩을 준비하라!"
 ww1_per_rus_strangling.5.t: "페르시아의 최후통첩 거부!"
 ww1_per_rus_strangling.5.d: ""
 ww1_per_rus_strangling.5.a: "구실을 만들어줘서 고맙군!"
 ww1_per_rus_strangling.6.t: "또다른 최후통첩 준비!"
 ww1_per_rus_strangling.6.d: "러시아 외무장관은 우리가 최후통첩에 쓰인 요구 사항을 수용한 것을 받아들였지만, 그와 동시에 또 다른 최후통첩을 준비하고 있다는 사실을 통보하라는 지시를 받았다고 답했습니다."
 ww1_per_rus_strangling.6.a: "뭐라고?"
 ww1_per_rus_strangling.7.t: "러시아의 두번째 최후통첩!"
 ww1_per_rus_strangling.7.d: ""
 ww1_per_rus_strangling.7.a: "따르는 수밖에..."
 ww1_per_rus_strangling.7.b: "우리는 이를 단호히 거부한다!"
 ww1_per_rus_strangling.8.t: "마즐리스의 최후통첩 거부!"
 ww1_per_rus_strangling.8.d: ""
 ww1_per_rus_strangling.8.a: "폐쇄하라!"
 ww1_per_rus_strangling.8.b: "방어를 준비하라!"
 ww1_per_rus_strangling.9.t: "페르시아의 최후통첩 거부!"
 ww1_per_rus_strangling.9.d: ""
 ww1_per_rus_strangling.9.a: "전쟁이다."
 ww1_per_rus_strangling.9.b: "이건 너무 멀리 갔다."
 ww1_per_rus_strangling.10.t: "러시아군의 테헤란 근접!"
 ww1_per_rus_strangling.10.d: ""
 ww1_per_rus_strangling.10.a: "마즐리스를 해산하라, 나라가 혁명보다 우선이다."
 ww1_per_rus_strangling.10.b: "테헤란을 최후까지 방어하라!"
 ww1_per_rus_strangling.11.t: "페르시아의 최후통첩 수용"
 ww1_per_rus_strangling.11.d: ""
 ww1_per_rus_strangling.11.a: "임무 완수."
 ww1_per_rus_strangling.12.t: "모하마드 알리 샤 복벽"
 ww1_per_rus_strangling.12.d: ""
 ww1_per_rus_strangling.12.a: "마샤'알라, 우리가 돌아왔다."
 ww1_per_rus_strangling.13.t: "페르시아에서의 승리"
 ww1_per_rus_strangling.13.d: ""
 ww1_per_rus_strangling.13.a: "임무 완수."
 ww1_per_rus_strangling.14.t: "페르시아에서의 패배"
 ww1_per_rus_strangling.14.d: ""
 ww1_per_rus_strangling.14.a: "수치스럽군."
 ww1_per_tur_strangling.1.t: "오스만군의 [TUR_occupied_PER_state.GetName] 점령"
 ww1_per_tur_strangling.1.d: "오스만군이 [TUR_occupied_PER_state.GetCapitalVictoryPointName]에 진입하여 사실상 지역을 점령했습니다. 오스만의 영향력과 우리의 전무한 군사력 때문에 우리는 이에 저항할 수 없습니다."
 ww1_per_tur_strangling.1.a: "언젠가는 떠날 것이다."
 ww1_per_tur_strangling.2.t: "페르시아 서부 확보 실패"
 ww1_per_tur_strangling.2.d: "페르시아 서부를 우리 영토로 확보할 기회는 이미 지나갔고, 국제적인 압력까지 더해져 우리는 군대를 철수할 수밖에 없습니다."
 ww1_per_tur_strangling.2.a: "안됐군."
 ww1_per_tur_strangling.3.t: "오스만의 페르시아 서부 철수"
 ww1_per_tur_strangling.3.desc: "오스만은 페르시아 서부를 확보하는 데 실패했고, 국제적인 압력에 직면하여 군대를 철수할 수밖에 없었습니다."
 ww1_per_tur_strangling.3.a: "다시 돌아올 것이다!"
 ww1_per_tur_strangling.3.b: "그립진 않을걸."
 ww1_per_tur_strangling.3.c: "잘 가라."
 ww1_per_tur_strangling.3.d: "너희들은 페르시아를 정복할 수 없다."
 ww1_per_tur_strangling.3.e: "페르시아 국경이 계속 변하는군."
 ww1_per_generic.1.t: "[FROM.GetNameDefCap]의 차관 요청"
 ww1_per_generic.1.d: ""
 ww1_per_generic.1.a: "우리 영향력이 확대될 것이다."
 ww1_per_generic.1.b: "페르시아는 조금도 가치도 없다."
 ww1_per_generic.2.t: "[FROM.GetName]의 차관 제공 승낙"
 ww1_per_generic.2.d: ""
 ww1_per_generic.2.a: "정말 고맙군."
 ww1_per_generic.3.t: "[FROM.GetName]의 차관 제공 거부"
 ww1_per_generic.3.d: ""
 ww1_per_generic.3.a: "어차피 다른 선택지도 있다."
 ww1_per_generic.4.t: "러시아의 [PER_cossack_regiment_station.GetName] 카자크 연대 창설"
 ww1_per_generic.4.d: "러시아 정부가 우리 정부의 약점을 이용해 [PER_cossack_regiment_station.GetName]에서 카자크 부대를 창설했습니다."
 ww1_per_generic.4.a: "조심해야겠군."
 ww1_developer_note.7.t: "페르시아에 오신 것을 환영합니다! (개발 중)"
 ww1_developer_note.7.d: "이 콘텐츠는 페르시아를 처음 접하는 분들을 위해 제작되었으며, 입헌 혁명과 외세 개입을 더욱 생생하게 표현하고 새로운 열강 정치 시스템과 연계하기 위해 만들어졌습니다. 아직 완벽하게 플레이 가능한 콘텐츠는 아니지만, 주요 시스템은 완성되었으므로 체험해 보시고 일부 역사적 사건도 살펴보실 수 있습니다."
 ww1_developer_note.7.a: "그냥 한번 살펴볼거야."
