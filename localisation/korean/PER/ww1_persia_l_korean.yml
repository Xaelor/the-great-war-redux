 PER_empower_the_treasurer_general_desc: ""
 PER_treasury_gendarmerie: "재무부 헌병대"
 PER_treasury_gendarmerie_desc: "모건 슈스터는 지주와 귀족으로부터 정부 세금을 징수하기 위해 재무부 헌병대라는 행정 군사 조직을 창설할 것을 제안합니다."
 PER_elect_new_regent: "새로운 섭정 선출"
 PER_elect_new_regent_desc: "아조드 올 몰크의 사망으로 섭정 자리가 공석이 되었습니다. 의회는 새로운 섭정을 선출해야 하며, 이는 우리 정치의 방향을 결정할 것입니다."
 PER_subdue_the_press: "언론 제압"
 PER_subdue_the_press_desc: "우리는 언론의 자유를 남용하는 문제를 해결해야 하며, 의회는 총리에게 이러한 권한을 부여해야 합니다."
 PER_stronger_cabinet: "더 강한 내각"
 PER_stronger_cabinet_desc: "이러한 중요한 시기에 우리는 더욱 강력하고 단호한 내각이 필요합니다."
 PER_regency_dictatorship: "섭정독재"
 PER_regency_dictatorship_desc: "야당을 추방하고, 신문을 금지하고, 의회 선거를 거부합시다!"
 PER_restore_maku_maliat_payments: "마쿠의 밀레트 납세 복구"
 PER_restore_maku_maliat_payments_desc: "마쿠 칸은 1905년 혁명 도중 밀레트 납세를 완전히 중단했습니다. 그러나 그는 신정부에 좀 더 협력할지도 모릅니다."
 PER_anglo_persian_oil_company: "$PER_anglo_persian_oil$"
 PER_ali_reza_khan_regent: "알리 레자 칸 섭정"
 PER_ali_reza_khan_regent_desc: "1909년 무함마드 알리 샤 카자르가 퇴위한 뒤, \"아조드-올-몰크\"(왕국의 기둥)라는 칭호를 받은 알리 레자 칸은 [GetPersiaAdj] 의회의 결정에 따라 샤의 아들인 아흐마드 샤 카자르의 섭정으로 임명되었습니다. 아흐마드 샤 카자르는 아버지의 폐위 후 제위에 오를 당시 미성년자였습니다. 알리 레자 칸은 정규 교육을 받지 못했지만, 정직한 정치가로 평가받습니다."
 PER_abolqasem_khan_qaragozlu_regent: "$PER_abolqasem_khan_qaragozlu$ 섭정"
 PER_abolqasem_khan_qaragozlu_regent_desc: "\"$PER_naser_al_molk$\"(왕국의 기둥)라는 칭호를 받은 $PER_abolqasem_khan_qaragozlu$는 온건파 일원이며 보수적인 견해를 가지고 있습니다."
 PER_mirza_hasan_ashtiani_regent: "$PER_mirza_hasan_ashtiani$ 섭정"
 PER_mirza_hasan_ashtiani_regent_desc: "$PER_mirza_hasan_ashtiani$, tittled \"$PER_mostowfi_ol_mamalek$\" (Chancellor of the Realm), is the member of the Democrats and holds progressive views."
