 PER_disarm_revolutionaries: "혁명가 무장 해제"
 PER_disarm_revolutionaries_desc: "이 혼란스러운 시기에 정치인과 종교 지도자들에 대한 암살 사건이 잇따라 발생했습니다. 우리는 이러한 암살을 멈춰야 하며, 모든 일반 시민이 무기를 내려놓아야 한다고 선포해야 합니다."
 PER_ask_for_loans: "차관 요청"
 PER_ask_for_loans_desc: "개혁을 단행하려면 자금이 필요한데, 현재로서는 차관을 들이는 것 외에는 자금을 확보할 방법이 없습니다."
