 ww1_absolutist_revolts.1.t: "살라르 알다울라 반란"
 ww1_absolutist_revolts.1.d: "폐위된 무함마드 알리 샤의 동생인 아불파트 미르자 \"살라르 알다울라\"는 사난다즈를 점령했습니다. 그는 테헤란으로 진격하여 왕정 복고를 시도합니다."
 ww1_absolutist_revolts.1.a: "바흐티아리군을 배치하라! 그를 막아!"
 ww1_absolutist_revolts.1.b: "승리의 행진이다. ([PRS.GetFlag] 살라르 알다울라로 플레이)"
 ww1_absolutist_revolts.2.t: "모하마드 알리 샤 반란"
 ww1_absolutist_revolts.2.d: "폐위된 모하마드 알리 샤가 권력 복귀를 꾀하고 아스타라바드에 상륙했습니다. 그는 테헤란으로 진격하여 자신의 통치권을 되찾으려 시도합니다."
 ww1_absolutist_revolts.2.a: "넌 환영받지 못한다!"
 ww1_absolutist_revolts.2.b: "난 항상 돌아오지. ([PEX.GetFlag] 모하마드 알리 샤로 플레이)"
 ww1_absolutist_revolts.3.t: "살라르 알다울라의 실패"
 ww1_absolutist_revolts.3.d: "테헤란에 도달하지 못한 살라르 알다울라의 군대는 붕괴되었고, 그는 다시 오스만 제국으로 도피할 수밖에 없었습니다."
 ww1_absolutist_revolts.3.a: "다시는 돌아오지 말아라!"
 ww1_absolutist_revolts.4.t: "모하마드 알리 샤의 어리석음"
 ww1_absolutist_revolts.4.d: "테헤란에 도달하지 못한 모하마드 알리 샤의 군대는 붕괴되었고, 그는 다시 러시아로 도피할 수밖에 없었습니다."