 AZR_azerbaijani_khanate: "아제르바이잔 칸국"
 AZR_azerbaijani_khanate_desc: "대부분의 칸국은 19세기에 해체되었지만, [ROOT.GetNonIdeologyNameDef]은 고립된 채로 남아 있었습니다. 그러나 입헌 혁명의 촉발과 강대국의 개입으로 이러한 상황은 곧 바뀔지도 모릅니다."
 AZR_reactionary_stronhold: "반동주의의 보루"
 AZR_reactionary_stronhold_desc: "[ROOT.GetNameDef]은 혁명에 저항했고, 새로운 중앙 정부에 대한 충성심을 갖고 있지 않습니다."
 MAK_royal_intrigues: "왕실의 음모"
 MAK_royal_intrigues_desc: "선대 칸 테이무르 파샤는 칸국을 강화했습니다. 독립 쿠르디스탄 건설을 꿈꾸던 셰이크 오바이둘라의 쿠르드족이 아제르바이잔을 침략했을 때, 테이무르 파샤 칸은 이들을 물리치고 '아제르바이잔의 구원자'라는 칭호를 얻었습니다. 지역 주민들은 그를 '마쿠 파드샤히'라고 불렀습니다. 그의 사후, 다섯 형제가 칸의 뒤를 잇기 위해 권력 다툼을 벌였고, 이로 인해 칸국은 약화되었습니다."
 PER_guarded_domains: "숭고국"
 PER_guarded_domains_desc: "우리나라의 공식 명칭인 \"이란 숭고국\"은 국가의 통치를 받는, 지리적으로 구별되는 지역을 가진 보호받는 정치체를 의미합니다. 그러나 현재 페르시아는 숭고한 나라도 아니고 단일한 정치체도 아닙니다. 국내외의 적들이 이제 막 근대화를 시작하는 우리나라를 불안정하게 만들려 하고 있으며, 정부는 이를 어떻게 막아야 할지 결정해야 합니다.\n\n£national_unity_texticon  현재 중앙집권화 수준 - [?PER_centralization_level|.1Y%%]\n£ETH_imperial_treasury  가용 자금 - [?PER_available_funds|.0Y]"
