l_korean:
 JAP_uncontrollable_military: "통제 불가능한 군부"
 JAP_uncontrollable_military_desc: "The Japanese Military is willing to cause conflicts and war to gain their own colonies and show off their might. The government is unnable to manage and restrain their military well, and even the military cannot control themselves."
 JAP_russo_japanese_war_victory: "러시아에 거둔 승리"
 JAP_russo_japanese_war_victory_desc: "Japan had been considered as a small, minor nation in the East Asia and had been neglected by Western powers. However, in the Russo-Japanese War, we defeated Russia, one of the most powerful world powers, and entitled to the place of a new power. No one shall stop the empire of the rising sun."
 JAP_rapid_urbanization: "급속한 도시화"
 JAP_rapid_urbanization_desc: "Just a few decades ago, Japan was a pre-modern country whose main industry was agriculture and was run by a strict order of feudal classes. In order to promote rapid westernization and industrialization, the national leadership has managed to survive the civil wars and rigorous renewal, achieving incredible results. However, not all of these measures are in effect with positive only. Psychocultural factors that cannot keep up with the very transitioning society are hindering the development of [ROOT.GetNameDef]."
 JAP_anglo_japanese_alliance: "영일동맹"
 JAP_anglo_japanese_alliance_desc: "Back in 1902, the British and the Japanese agreed to sign the mutual defence treaty with recognising the Russian expedition over the East as the common threat and with securing their interests in the East Asia. To follow up the British Empire reinforced the sphere of influence in Malay and Chinese coastal region. In exchange we captured Korea into the imperial dominance.\nThese both signatures think that the alliance is for guaranting their own goods not for preparing any possible conflict, but the maelstrom is coming up to shake every stable possessions into the most greatest war."
 JAP_civilized_oriental: "동양의 문명국"
 JAP_civilized_oriental_desc: "One time, the civilizations of the East had lead the world power and fortune until the Europeans got the knowledge to break in. Japan shall be thrive being as a nation in European culture not being the second state on the decline in these fast sliding times."
 JAP_the_debt_at_hand: "떠안은 부채"
 JAP_the_debt_at_hand_desc: "The Russo-Japanese War ceased out with placing the victorious side, but the triumph was barely achieved. Even we have somehow paid off our debts with war reparations, the government is still in financial trouble."
 JAP_the_debt_at_hand_1: "해결 중인 부채"
 JAP_the_debt_at_hand_1_desc: "The debt that weighed us down after the Russo-Japanese War is being somewhat alleviated. With time, the economy will stabilize."
 JAP_idea_meiji_constitution: "메이지 헌법"
 JAP_idea_meiji_constitution_desc: "Only a two decades ago Japan regenerated from old feudalism to new western-styled empire, declaring the Constitution of the Empire of Japan. The constitution guarantees stability but it is not written in democratic and liberal method but authoritarian pages for the Emperor."
 JAP_idea_meiji_oligarchy: "메이지 과두정"
 JAP_idea_meiji_oligarchy_desc: "일본 제국의 기원은 사쓰마-조슈 연합이 주도한 혁명과 내전에서 비롯되었는데, 이들은 막부를 전복하고 \"존황양이\"는 기치를 내걸었습니다. 그 결과 일본은 이들 가문 출신들이 정치와 군사의 주요 요직을 독점하는 과두정이 되었습니다. 이른바 번벌 정치는 원로라는 제도를 통해 실현되었습니다. 일본의 정치는 법적 근거가 없는 비공식 정치 기관인 원로 회의에 의해 운영됩니다. 원로들은 천황의 칙령으로 임명되며, 천황의 자문 위원회로서 국가의 최고 의사결정 과정을 주도하고, 많은 경우 최종 결정을 그들의 의도대로 좌우합니다."
 JAP_dispute_over_arms_buildup: "군비 지출 논쟁"
 JAP_dispute_over_arms_buildup_desc: "The government and military are at odds over military spending. Because of the system, the military is not an arm of the government, but directly under the Emperor, the government and the military are the same-leveled entity, so the government finds it difficult to regulate the military, and the military makes more unreasonable demands."
 JAP_dispute_over_arms_buildup_tt: "§RAdditional divisions cannot be deployed without sufficient political discussions.§!"
 JAP_kanto_earthquake_aftermath: "간토 대지진의 여파"
 JAP_idea_reserves: "예비비"
 JAP_idea_reserves_desc: "To be prepared gather more golds!"
 JAP_idea_colonial_taxes: "식민지 세금"
 JAP_idea_colonial_taxes_desc: "Finally we started to expand our sphere of imperialism that means we can collect some revenue from there."
 JAP_idea_increased_salary: "임금 인상"
 JAP_idea_increased_salary_desc: "Paying them more wages somehow good for the government, they say."
 JAP_idea_crumbled_socialism: "진압된 좌파"
 JAP_idea_crumbled_socialism_desc: "Radical socialism is banned in [ROOT.GetNameDef], having no public support for the socialists. If the impurs try to place their ground, all shall be arrested and executed in no time."
 JAP_hirohito_desc: "With the passing of Emperor Taisho on December 25, 1926, the era of Taisho has drawn to a close, giving way to the reign of Showa. No longer a mere representative of the throne, Hirohito now stands as the 124th Emperor of Japan, the divine pinnacle of a lineage unbroken for ages eternal. However, the Enlightened Peace promised by his era name faces immediate peril. As the flickering light of Taisho Democracy fades, it is replaced by the shadows of global economic instability and the growing political influence of the Imperial Japanese Army. The young Emperor, once a curious student of Western constitutionalism, now finds himself the sacred center of an empire increasingly driven by nationalistic fervor and the heavy burden of imperial destiny."
 JAP_hirohito_regent: "히로히토 섭정궁"
 JAP_hirohito_regent_desc: "As Emperor Taisho's neurological condition rendered him unable to perform his official duties, the young Crown Prince Hirohito was appointed as Prince Regent, Sesshō-no-miya. This transition marked a pivotal moment, shifting the weight of the Chrysanthemum Throne onto the shoulders of a prince who had just returned from an unprecedented tour of Europe. While the Taisho Democracy continues to pulse through the Diet, the Regent must stand as a silent yet firm anchor for a nation increasingly divided between liberal internationalism and rising militarism. Although the father remains the sacred sovereign in name, it is the son who now wields the imperial seal and navigates the complex machinery of the Great Japanese Empire."
 JAP_idea_ansei_treaties: "안세이 조약"
 JAP_idea_ansei_treaties_desc: "The last shogunate had been cheated by the western powers, blinded bureaucracy had agreed to sign the unfair treaties with those swindlers, even with no recognisation from the Emperor. Since we have no strength to demand them pullout and cancel the agreements, negotiation foward can be a way to solve them out."
 JAP_idea_ansei_treaties_tt: "Has national spirit §Y$JAP_idea_ansei_treaties$§!"
 JAP_idea_ansei_treaties_tt_NOT: "Does not have national spirit §Y$JAP_idea_ansei_treaties$§!"
 JAP_idea_buying_ships: "전함 구입"
 JAP_south_manchuria_railway: "일본의 경제적 지배"
 JAP_south_manchuria_railway_desc: "The South Manchuria Railway Company, or Mantetsu for short, is a railway company of [JAP.GetNameDef] that operates the railways of South Manchuria. The Japanese government owns more than half of the shares, making it a de facto state-owned company. Mantetsu Railway Zone's economy is dominated by the Japanese, and the company also runs mining, ports, oil refining, distribution, manufacturing, publishing, education, and healthcare. It's not just a railway company, but a driving force that dominates Manchuria alongside the Kwantung Army."
 JAP_cant_fire_chief: "You §Rcannot dismiss§! a person appointed by the military."
 JAP_rice_riots: "쌀 폭동"
 JAP_rice_riots_desc: "Following the war and economic turmoil, rice riots have erupted across the nation, demanding grain."
 JAP_imperial_general_headquarters: "대본영"
 JAP_imperial_general_headquarters_desc: "The Imperial Japanese Army and Navy's supreme command established during wartime or emergencies. It functions as the highest headquarters, issuing the Emperor's orders as Imperial Headquarters orders."
 JAP_russo_japanese_war_reparations: "러일전쟁 배상금"
 JAP_russo_japanese_war_reparations_desc: "Japan claimed that it had not received sufficient war reparations from Russia in the previous Treaty of Portsmouth and demanded further reparations."
 JAP_tariff_autonomy: "관세 자주권"
 JAP_tariff_autonomy_desc: ""
 JAP_constitutional_protection_movement: "호헌운동"
 JAP_constitutional_protection_movement_desc: "The democrats, journalists, and the general public are expressing their anger at the current situation in which Genrō statesmen such as Yamamoto Gonnohyōe are appointing prime ministers in place of the emperor and wielding political power, and the military is destroying the cabinet."
 JAP_constitutional_protection_movement_2_desc: "The democrats, journalists, and the general public are expressing their anger at the current situation in which Genrō statesmen such as Yamamoto Gonnohyōe are appointing prime ministers in place of the emperor and wielding political power, and the military is destroying the cabinet."
 JAP_constitutional_protection_movement_3_desc: "The democrats, journalists, and the general public are expressing their anger at the current situation in which Genrō statesmen such as Yamamoto Gonnohyōe are appointing prime ministers in place of the emperor and wielding political power, and the military is destroying the cabinet."
 kawasaki_shipbuilding: "가와사키 선박해양회사"
 kawasaki_aerospace: "가와사키 항공우주회사"
 JAP_imperial_army: "대일본제국 육군"
 JAP_imperial_navy: "대일본제국 해군"
 JAP_active_duty_rule: "군부대신 현역무관제"
 JAP_active_duty_rule_desc: "This rule places the life and death of the Cabinet in the hands of the military. By mandating that only active-duty generals and admirals can serve as Army and Navy Ministers, the military can topple any government simply by refusing to nominate a minister or ordering a resignation. It is the ultimate political weapon forged by Yamagata Aritomo to check the rise of political parties and protect the interests of the Hanbatsu cliques."
 JAP_naval_industry: "국내 조선 산업"
 JAP_naval_research: "국내 해군 연구"
 JAP_aircraft_research: "항공기 연구"
 JAP_rapid_urbanization_1: "급속한 도시화"
 JAP_rapid_urbanization_1_desc: "전후 농촌 이탈과 수백만 인구의 대도시 유입으로 초래된 극심한 혼란 속에서, 정부는 긴급 경제 안정화와 기초적인 도시 행정 정비에 착수했습니다. 여전히 사회적 갈등과 인플레이션의 여파가 남아있지만, 도쿄와 오사카 등 주요 산업 거점의 무분별한 팽창은 점차 체계적인 행정의 통제 하에 놓이고 있습니다."
 JAP_rapid_urbanization_light_2: "급속한 도시화"
 JAP_rapid_urbanization_light_2_desc: "기계화된 방적 공장의 비약적인 성장과 생사 수출 붐에 힘입어, '동양의 맨체스터'로 불리는 오사카를 필두로 한 제국의 도시들은 과밀한 빈민촌에서 번영하는 경공업의 중심지로 탈바꿈했습니다. 농촌에서 유입된 풍부한 노동력은 고수익 소비재 생산의 원동력이 되어, 과거의 사회적 불안을 전례 없는 수출 경쟁력과 내수 상업의 활력으로 전환하고 있습니다."
 JAP_rapid_urbanization_heavy_2: "급속한 도시화"
 JAP_rapid_urbanization_heavy_2_desc: "국영 야하타 제철소의 대대적인 확장과 나가사키, 고베, 구레 등에 포진한 재벌 조선소를 기반으로, 제국은 자립적인 중화학 공업과 해양 인프라를 확립하는 데 성공했습니다. 더 이상 영국산 선체나 서구의 철강에 의존하지 않고, 일본의 연안 대도시들은 주력함을 자체 건조하고 제해권을 뒷받침할 수 있는 현대적 공업 지대로 진화했습니다."
 JAP_rapid_urbanization_3: "급속한 도시화"
 JAP_rapid_urbanization_3_desc: "소비재 중심의 경공업, 기간 중화학 공업, 그리고 전국적인 전철화 철도망의 유기적인 결합을 통해 태평양 연안을 아우르는 거대한 복합 산업 벨트가 형성되었습니다. 최고 학부인 제국대학의 기술 지원과 재벌 카르텔의 조직력이 맞물리면서, 일본의 도시들은 지속적인 공장 생산성과 독자적 기술 혁신, 전시 동원력을 모두 갖춘 성숙한 산업 생태계를 자랑합니다."
 JAP_rapid_urbanization_4: "급속한 도시화"
 JAP_rapid_urbanization_4_desc: "메이지 이래 추진된 식산흥업의 원대한 비전이 마침내 정점에 도달했습니다. 도쿄와 오사카를 비롯한 제국의 대도시권은 최첨단 전력망과 현대식 금융 기관, 방대한 공업 단지를 완비하여 세계에서 가장 역동적인 메트로폴리스로 거듭났습니다. 급격한 도시화로 야기되었던 사회적·인프라적 위기를 완전히 극복하고, 동아시아의 명실상부한 최강 공업 강국으로 도약했습니다."
 JAP_special_higher_police: "특별고등경찰"
 JAP_special_higher_police_desc: "1910년 대역사건의 충격 이후 1911년 내무성 산하에 설치된 특별고등경찰, 통칭 특고는 과격 사회주의, 아나키즘, 공화주의 등 체제를 위협하는 사상 범죄를 색출하고 근절하는 임무를 맡고 있습니다. 노동 운동 침투, 불온 간행물 검열, 사전 감시망을 통해 국체의 신성성과 황실의 권위에 가해지는 일체의 사상적 도전을 원천 봉쇄합니다."
 JAP_taisho_modernism: "다이쇼 모더니즘"
 JAP_taisho_modernism_desc: "고도화된 산업 발전과 경제적 번영의 결실로, 제국의 도시 전역에 '다이쇼 모더니즘'이라 불리는 눈부신 문화적 활력의 물결이 번져나갑니다. 카페와 긴자의 백화점, 재즈 음악, 서구식 '하이칼라' 유행은 성숙한 시민 사회와 자신감 넘치는 대중문화를 상징하며, 국가 경제와 사회 전반에 지칠 줄 모르는 생동감을 불어넣고 있습니다."
 JAP_taisho_boom: "다이쇼 대호황"
 JAP_taisho_boom_desc: "유럽에서 발발한 총력전의 참화는 일본 제국에 전례 없는 경제적 대도약의 기회를 가져다주었습니다. 서구 열강의 공장들이 참호전의 군수품에 매몰된 틈을 타, 일본은 중포와 탄약, 상선 선박부터 면직물과 통조림에 이르기까지 전 세계에 물자를 공급했습니다. 막대한 무역 흑자는 제국을 만년 채무국에서 세계적 채권국으로 탈바꿈시켰으며, '선박 졸부(후나나리킨)'를 필두로 한 막대한 국부 축적을 견인하고 있습니다."