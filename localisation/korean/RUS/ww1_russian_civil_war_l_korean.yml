l_korean:
 komuch_focus: "코무치 중점 계통도"
 KOM_consolidate_power: "제헌의회 권한 강화"
 KOM_consolidate_power_desc: "용맹한 체코슬로바키아 군단의 사마라 입성 덕분에 우리가 자행한 정변은 위대한 인민 주권과 러시아 독립이라는 원칙을 위해 이루어졌습니다. 코무치의 당면 목표는 제헌의회의 권위를 강화하고 외부의 적과 싸울 인민군을 창설하는 것입니다."
 KOM_mobilisation_of_the_peoples_army: "인민군 동원"
 KOM_mobilisation_of_the_peoples_army_desc: "볼셰비키에 맞서 싸우는 모든 투사의 첫 번째이자 신성한 임무는 정치적 견해나 당파에 관계없이 공동의 목표를 향해 조직적으로 투쟁하고자 하는 열망을 갖는 것입니다."
 KOM_form_the_governing_council: "행정위원회 설립"
 KOM_form_the_governing_council_desc: "우리는 위원회에 책임을 지지만 어느 정도 자율성을 갖는 특별한 \"체계적인\" 관리 기구를 마련할 필요가 있습니다."
 KOM_contact_anti_bolshevik_forces: "반볼셰비키 세력과 접촉"
 KOM_contact_anti_bolshevik_forces_desc: ""
 RCW_lack_of_officers: "장교 부족"
 IZH_union_of_front_line_soldiers: "전선병사연합"
 IZH_factory_country: "공장 도시"
 FER_partisans: "계곡과 언덕을 넘어"
 FER_partisans_desc: "계곡을 가로지르고 언덕을 넘어, 군대는 전진하여 백군의 요새인 프리모리예를 전투에서 점령하려 합니다."
 RCW_capture_the_gold_reserves: "제국 금보유고 장악"
 RCW_capture_the_gold_reserves_desc: "대전쟁 개전 당시, 페트로그라드에 보관되어 있던 러시아 제국 금보유고는 안전을 확보하기 위해 열차를 이용해 카잔과 니즈니노브고로드로 이송되었습니다.\n\n러시아 혁명 이후에는 보로네시, 탐보프, 사마라, 쿠르스크, 모길레프, 펜자 등 다른 도시의 금도 이곳으로 옮겨졌습니다. 결국, 러시아 제국 금보유고의 절반 이상이 카잔에 집중되었습니다."
 RCW_add_x_to_gold_reserve: "§H금보유고§!의 $RIGHT|H1%$ 소모"
 RCW_has_more_than_x_gold_reserve: "§H금보유고§!에 $RIGHT|H1%$ 이상 보유"
 RUS_state_flag: "전러시아 정부를 수립함"
 ww1_rcw.10.t: "카잔 함락!"
 ww1_rcw.10.d: "카잔 함락이라는 나쁜 소식을 접했습니다. 적들이 전략적 요충지인 카잔 시에 강력한 공격을 감행하여 제국 금보유고를 탈취하려 하고 있으며, 총참모부 사관학교 전체가 백군에 가담했습니다. 지금 당장 이젭스크의 노동자들을 동원하여 신속하게 반격을 조직하고 도시를 탈환해야 합니다."
 ww1_rcw.10.a: "동무들! 싸우자... 맞지?"
 lead_to_IZH_uprising: "§r이젭스크와 봇킨스크의 봉기로 무조건 이어질 것입니다.§!"
 ww1_rcw.11.t: "카잔 해방"
 ww1_rcw.11.d_komuch: "이틀간의 전투 끝에 카잔은 인민군 사마라 분견대와 체코슬로바키아군, 그리고 강상함대의 합동군에 점령되었습니다. 전리품은 셀 수 없이 많았으며, 러시아 금보유고 6억 5천만 달러를 노획했습니다. 총참모부 사관학교 전체가 전향하여 백군에 합류했습니다."
 ww1_rcw.11.d: "이틀간의 전투 끝에 카잔은 우리 군과 체코슬로바키아군, 그리고 강상함대의 합동군에 점령되었습니다. 전리품은 셀 수 없이 많았으며, 러시아 금보유고 6억 5천만 달러를 노획했습니다. 총참모부 사관학교 전체가 전향하여 백군에 합류했습니다."
 ww1_rcw.11.a: "병사들은 잘 싸웠다."
 ww1_rcw.12.t: "카잔 함락"
 ww1_rcw.12.d_komuch: "이틀간의 전투 끝에 카잔은 인민군 사마라 분견대와 체코슬로바키아군, 그리고 강상함대의 합동군에 점령되었습니다. 무기, 탄약, 의약품, 보급품, 그리고 러시아 금보유고가 보관된 거대한 창고들이 점령되었습니다. 총참모부 사관학교 전체가 전향하여 백군에 합류했습니다."
 ww1_rcw.12.d: "이틀간의 전투 끝에 카잔은 백군과 체코슬로바키아군, 그리고 강상함대의 합동군에 점령되었습니다. 무기, 탄약, 의약품, 보급품, 그리고 러시아 금보유고가 보관된 거대한 창고들이 점령되었습니다. 총참모부 사관학교 전체가 전향하여 백군에 합류했습니다."
 ww1_rcw.12.a: "우리 앞에 놓인 승리가 더 있다!"
 ww1_rcw.12.b: "금은 안 된다!"
 ww1_rcw.12.c: "인상적이군."
 komuch.1.t: "명령 제1호"
 komuch.1.d: "제헌의회의 이름으로 사마라와 사마라 주에 있던 볼셰비키 정부는 해산되었습니다. 모든 인민위원은 직위에서 해임되었습니다. 소비에트 정부에 의해 해산되었던 시의회와 젬스트보 의회는 완전히 복원되어 즉시 업무에 복귀하도록 명령을 받았습니다. 볼셰비키 당국이 부과했던 모든 제한과 자유의 제약은 해제되었고, 언론, 출판, 집회 및 시위의 자유가 회복되었습니다. 인민위원과 소비에트 조직의 책임자들은 3일 이내에 모든 업무를 새로 복원된 기관 또는 위원회가 임명한 사람에게 인계해야 합니다. 진정한 민주주의 원칙에 부합하지 않는 기관인 혁명재판소는 폐지되고, 지방인민법원이 복원되었습니다. 통일되고 독립적이며 자유로운 러시아. 모든 권력은 제헌의회에 있습니다. 이것이 새로운 혁명정부의 구호이자 목표입니다."
 komuch.1.a: "모든 권력을 인민에게!"
 komuch.2.t: "전러시아 정부 문제"
 komuch.2.d: "전러시아 정부를 수립하는 데 있어 결정해야 할 것 중 하나는 볼셰비키가 통치하는 러시아에서 수립된 제헌의회를 인정해야 하는지입니다.\n볼셰비키는 러시아 인민들이 볼셰비키 독재를 인정하기 때문에 선거에서 이길 것이라고 생각했으나, 제헌의회는 사회혁명당이 가장 많은 표를 받아 수립되었습니다. 볼셰비키는 제헌의회를 해산하고 없애버렸지만, 제헌의회 의원 일부는 제헌의회의원위원회, 소위 코무치를 결성하여 볼셰비키에 계속 맞서 싸우고 있습니다.\n전러시아 정부 수립 중 제헌의회를 승인한다면 의회권이 저들에게 넘어가게 될 것입니다."
 komuch.2.a: "시베리아와 전러시아 정부를 수립하라."
 komuch.2.b: "우린 반동분자들과 협상하지 않는다."
 komuch.3.t: "[FROM.Capital.GetName]의 전러시아 연립정부 수립 제안"
 komuch.3.d: "[FROM.Capital.GetCapitalVictoryPointName] 지역정부가 모든 러시아인이 힘을 합쳐 볼셰비키와 붉은 위협으로부터 러시아를 지켜야 한다고 주장하며 임시 전러시아 정부에 가입을 요청했습니다."
 komuch.4.d: "[From.GetNameDefCap] 측이 제헌의회의 정통성을 인정할 수 없다고 답했습니다. 협상이 결렬되었으며 제안이 거부당했습니다."
 komuch.4.a: "저들은 인민의 뜻을 거스른다!"
 ww1_izhevsk.1.t: "정부 조직"
 ww1_izhevsk.1.d: "볼셰비키의 폭정에서 도시가 해방됨에 따라, 이젭스크-봇킨스크 노동자 봉기는 중대한 기로에 서 있습니다. 우리의 미래와 정당성을 확보하기 위해, 우리는 즉시 임시정부를 구성하여 방어와 행정을 조직해야 합니다. 적군에 맞서는 더 큰 투쟁을 위해, 우리는 사마라에 있는 제헌의회의원위원회를 러시아의 합법적인 정부로 인정합니다. 이제 우리의 운명은 자유롭고 민주적인 러시아라는 대의에 달려 있습니다."
 ww1_izhevsk.1.a: "이 혼란을 끝내자."
 ww1_izhevsk.2.t: "인민군 강화"
 ww1_izhevsk.2.d: "평범한 노동자부터 대전쟁 참전 용사에 이르기까지 많은 사람들이 볼셰비키에 맞서 싸우고자 하는 열망으로 우리 군대에 입대합니다. 또한 적과의 치열한 전투 끝에 추가 장비를 확보했습니다."
 ww1_izhevsk.2.a: "좋아!"
 ww1_izhevsk.3.d: "최근 선포한 동원령으로 비록 사기 저하가 있었지만 우리 군이 증강되었습니다."
 ww1_izhevsk.3.a: "음..."
 ww1_izhevsk.4.t: "강제 동원"
 ww1_izhevsk.4.d: "참으로 아이러니합니다! 우리는 동원령에 반대하는 봉기를 일으켰는데, 이제는 군 병력 부족 때문에 우리가 동원령을 이행할 수밖에 없게 되었으니 말입니다. 모든 게 계획대로 되고 있는 건지요?"
 ww1_izhevsk.4.a: "볼셰비즘에 반대하는 것이라면 뭐든!"
 ww1_izhevsk.4.b: "아니."
 ww1_izhevsk.5.t: "볼셰비키 개혁 문제"
 ww1_izhevsk.5.d: "우리가 적군과 싸우고 있지만, 그들은 노동자들이 좋아하는 많은 새로운 법들을 제정했습니다. 그렇다면 우리는 그 법들을 폐지해야 합니까?"
 ww1_izhevsk.5.a: "그냥 둬라."