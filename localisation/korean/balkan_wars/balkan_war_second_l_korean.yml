 BW2_war_with_bulgarian_traitor_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ 세르비아가 공격을 준비합니다!"
 BW2_intervention_in_bulgaria: "$great_power_politics_balkan_powder_keg_tt_icon$ [BUL.getName] 개입"
 BW2_war_timer: "$great_power_politics_balkan_powder_keg_tt_icon$ 제2차 발칸 전쟁"
 BW2_balkans_victory_tt: "§G불가리아§!가 §C반불가리아 동맹§!의 군대에 패퇴하고 있으나, 아직 포기하지 않았습니다. 만약 §G불가리아§!가 뭔가 하지 않는다면, 이 전쟁의 §R패자§!로 간주됩니다."
 BW2_balkans_victory_message: "@BUL §Y불가리아§!는 @SER @GRE @MNT @ROM @TUR §C반불가리아 동맹§!의 압도적인 포위 공격 앞에 속수무책으로 붕괴했습니다. 발칸 반도의 국경은 바뀐지 얼마 되지 않았으나 지도가 다시 그려졌습니다."
 BW2_bulgaria_victory_tt: "§G불가리아§!가 §C반불가리아 동맹§!의 군대를 분쇄하고 있습니다. 바뀌는 것이 없다면, §G불가리아§!가 이 전쟁의 §Y승자§!로 간주됩니다."
 BW2_bulgaria_victory_message: "@BUL §Y불가리아§!는 @SER @GRE @MNT @ROM @TUR §C반불가리아 동맹§!의 막대한 위협에도 불구하고 전쟁에서 승리했습니다. @BUL §Y불가리아§!의 영토 획득은 §Y산스테파노 조약§!을 완전히 복수했습니다."
 BW2_stalemate_tt: "§G불가리아§!와 §C반불가리아 동맹§!은 동시에 어려운 상황에 놓였으며, 이들은 바뀌는 것이 없다면 현상유지로 휴전합니다."
 BW2_stalemate_message: "@BUL §Y불가리아§!와 @SER @GRE @MNT @ROM @TUR §C반불가리아 동맹§! 간의 충돌은 양측에 사상자와 상처만을 남긴 채 끝났습니다. 발칸 반도에서 울린 첫 총성의 결과로 국경이 고정되었으나, 머지않아 지도를 다시 그리기 위해 펜을 다시 들어야 할 것이 분명합니다."
 BW2_ottoman_victory_message: "@TUR §Y오스만§!은 @BUL §Y불가리아§!가 가장 어려운 처지에 놓인 틈을 타 이전 전쟁에서 겪었던 패배와 손실을 일부 설욕했습니다."
 BW2_ottoman_withdrawal_rus_message: "열강, 특히 @RUS §Y러시아§!의 압력으로 인해 @TUR §Y오스만§!은 @BUL §Y불가리아§!에 대한 복수 계획을 다시 한번 접어야만 했습니다."
 BW2_ottoman_withdrawal_defeat_message: "강력한 @BUL §Y불가리아§!의 반격에 직면한 @TUR §Y오스만§!은 1453년에 함락했던 옛 수도를 지키기 위해 굴욕 속에 전쟁에서 철수했습니다."
 BW2_bulgaria_crushing_defeat_tt: "§Y[BUL.getName]§!이 §R심각한 패배§!를 겪음 (§Y소피아§!상실 또는 항복 현황 §Y85%§! 이상)"
 BW2_balkans_crushing_defeat_tt: "§Y반불가리아 동맹§!이 §R심각한 패배§!를 겪음 (§Y[SER.getName]§! 항복이 항복하거나, §Y[GRE.getName]§! 및 §Y[ROM.getName]§!(참전했다면)이 항복함)"
 BW2_turkish_intervention_turkey_total_defeat_tt: "§Y[TUR.GetForeignName]§!이 §R심각한 패배§!를 겪음 (§Y콘스탄티노폴리스§! 상실 또는 항복 현황 §Y10%§!(이탈리아-튀르크 전쟁 중에는 §Y20%§!) 이상)"
 BW2_turkey_intervention: "$great_power_politics_balkan_powder_keg_tt_icon$ [BUL.getName] 개입"
 BW2_turkey_intervention_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ 튀르크의 개입"
 TUR_bw2_victory_tt: "§R[TUR.GetForeignName]§!이 §G불가리아군§!을 물리치고 옛 영토를 점령하는데 성공했으며, 이제 §Y이를 되찾을 것§!입니다."
 TUR_bw2_lose_tt: "§R[TUR.GetForeignName]§!이 침공에 완전히 실패했으며 §G불가리아군§!을 물리치는 데 실패했습니다. 모든 것이 침공 이전을 유지합니다."
 BW2_dissolve_wth: "[WTH.getNameDef] 해체"
 BW2_dissolve_wth_tt: "이 오해가 빨리 풀릴수록 우리에게 더 좋습니다."
 TUR_create_wth: "$great_power_politics_balkan_powder_keg_tt_icon$ §Y트라키아§!에 괴뢰 정부 수립"
 SER_cede_macedonia_to_bulgaria: "$great_power_politics_balkan_powder_keg_tt_icon$ §Y[BUL.getName]§!에 마케도니아 할양"
 BUL_cede_macedonia_to_serbia: "$great_power_politics_balkan_powder_keg_tt_icon$ §Y반불가리아 동맹§!에 마케도니아 할양"
 BW2_info_when_attack_ahist: "$great_power_politics_balkan_powder_keg_tt_icon$ 우리는 §Y[?SER.days_mission_timeout@BW2_war_with_bulgarian_traitor]§!일 뒤 불가리아를 공격할 것입니다"
 BW2_balkans_hist_how_to_win_tt: "시간 제한이 끝난 뒤 §7승자§!로 간주되려면, §Y불가리아§!의 항복 현황을 §Y30%§!로 만들고 §Y[203.getName]§!, §Y[1258.getName]§!, §Y[1140.getName]§! 주를 지배해야 합니다\n"
 BW2_balkans_ahist_how_to_win_tt: "시간 제한이 끝난 뒤 §7승자§!로 간주되려면, §Y불가리아§!의 항복 현황을 §Y30%§!로 만들어야 합니다\n"
 BW2_BUL_hist_how_to_win_tt: "시간 제한이 끝난 뒤 §7승자§!로 간주되려면, §Y[203.getName]§!, §Y[1258.getName]§!, §Y[1140.getName]§! 주를 지배하고 항복 현황을 §Y30%§! 미만으로 유지해야 합니다.\n§Y루마니아§! 또는 §Y그리스§!에 항복을 강요했다면, 각각 §Y[846.getName]§! 또는 §Y[345.getName]§! 주를 받습니다\n"
 BW2_BUL_ahist_how_to_win_tt: "시간 제한이 끝난 뒤 §7승자§!로 간주되려면, §Y세르비아§!, 또는 §Y그리스§!와 §Y루마니아§!(참전했다면)를 항복시켜야 합니다\n"
 BW2_turkish_intervention_TUR_how_to_win_tt: "시간 제한이 끝난 뒤 §7승자§!로 간주되려면, §Y불가리아의 아무 주요 주§!를 지배해야 하며, §Y[756.getName]§!과 §Y[200.getName]§!를 지배한다면 이를 받습니다.\n"
 BW2_turkish_intervention_BUL_how_to_win_tt: "시간 제한이 끝난 뒤 §7승자§!로 간주되려면, 튀르크가 §Y아무 우리 주요 지역§!을 점령하는 것을 막아야 합니다.\n"
 ww1_secondbalkan.21.t: "불가리아 침공"
 ww1_secondbalkan.21.d: "발칸 반도에서 다시 군사적 충돌이 발발했습니다. 이제 우리의 정당한 땅을 되찾을 때가 왔습니다!"
 ww1_secondbalkan.21.a: "작전을 준비하라!"
 ww1_secondbalkan.21.b: "즉시 공격하라!"
 ww1_secondbalkan.22.t: "무의미한 전쟁"
 ww1_secondbalkan.22.d: "전쟁은 교착 상태에 빠졌고 어느 쪽도 목표를 달성하지 못했습니다. 불가리아와 반불가리아 동맹은 현상 유지를 조건으로 강화에 서명했습니다."
 ww1_secondbalkan.22.a: "죽은 사람들은 어쩌고?"
 ww1_secondbalkan.23.t: "불가리아 개입 실패"
 ww1_secondbalkan.23.d: "불가리아군은 우리의 공세를 저지할 수 있었습니다. 열강의 압력으로 우리는 불가리아의 정복지를 공고히 하는 평화 조약을 체결할 수밖에 없었습니다."
 ww1_secondbalkan.23.a: "실로 유감이다!"
 ww1_secondbalkan.24.t: "또 다른 승리"
 ww1_secondbalkan.24.d: "승리한 우리 군은 어려운 시기에 다시 우리를 침략해 온 오스만의 군세를 물리쳤습니다. 우리는 [TUR.GetForeignName]과 새로운 강화조약을 체결하여 해방된 영토를 확보했습니다. 하지만 안타깝게도 열강의 압력 때문에 더 많은 영토를 얻을 수는 없습니다. 그들은 우리의 세력 확장을 두려워하기 때문입니다."
 ww1_secondbalkan.24.a: "튀르크 놈들, 이게 끝이 아니다!"
 ww1_secondbalkan.25.t_bul: "튀르크와의 강제 평화"
 ww1_secondbalkan.25.d_bul: "전선의 어려운 상황 때문에 [TUR.GetForeignName]과 휴전에 서명을 강요당했습니다."
 ww1_secondbalkan.25.a: "유감이군!"
 ww1_secondbalkan.25.t_tur: "불가리아의 강화 서명"
 ww1_secondbalkan.25.d_tur: "승리한 우리 군은 소규모 불가리아 부대를 격파했습니다. 그러나 열강이 우리에게 압력을 가해 불가리아와 휴전 협정을 체결하도록 강요했습니다. 곧 우리 수도에서 회의가 열릴 예정이며, 그 회의에서 에디르네를 우리 영토로 인정하는 평화 협정에 서명할 것입니다."
 ww1_secondbalkan.25.b: "복수에 성공했다."
 ww1_secondbalkan.26.t: "서트라키아의 상황"
 ww1_secondbalkan.26.d: "우리가 불가리아군을 격파하고 있지만, 열강은 우리가 서트라키아를 되찾는 것을 허용하지 않을 것입니다. 그러나 무슬림 형제들이 그곳에서 우리를 기다리고 있으므로, 우리 군대의 지원을 받아 그곳에 괴뢰 정부를 세우고 이를 불가리아에 대한 압력 수단으로 활용할 수 있습니다."
 ww1_secondbalkan.26.a: "좋은 기회다."
 ww1_secondbalkan.27.t: "수치스러운 평화"
 ww1_secondbalkan.27.d: "우리 군은 참담한 패배를 당하고 있고, 경제는 파탄 직전이며, 우리는 적과 휴전 협정을 맺을 수밖에 없는 상황에 처해 있습니다."
 ww1_secondbalkan.27.a: "최악의 참사다."
 ww1_secondbalkan.28.t: "불가리아의 배신"
 ww1_secondbalkan.28.d: "불가리아군은 우리에게 정당하게 속한 영토를 점령했습니다. 우리는 반불가리아 동맹을 결성하여 함께 힘을 모아 오만한 불가리아인들을 응징할 것입니다. 몬테네그로는 이미 이에 동의했습니다."
 ww1_secondbalkan.28.a: "그리스에 물어봐라."
 ww1_secondbalkan.29.t: "반불가리아 동맹의 군대 배치"
 ww1_secondbalkan.29.d: "세르브인과 그리스인은 오스만 영토 분할 결과에 불만을 품고 우리 국경에 진을 치고 공격을 준비하고 있습니다. 또한 우리 영토를 자신들에게 넘겨달라는 최후통첩을 보냈습니다."
 ww1_secondbalkan.29.a: "방어를 준비하라!"
 ww1_secondbalkan.29.b: "평화를 위하여..."
 ww1_secondbalkan.30.t: "세르비아의 오흐리드 영유권 주장!"
 ww1_secondbalkan.30.d: "세르비아는 일전의 영토 분할 합의에서 크리바팔란카-오흐리드 선 아래의 영토가 우리 영토임을 인정하기로 했지만 전쟁 중에 세르비아군이 해당 선 이남 지역을 점령했으며 그 이후로 철수하지 않았습니다. 우리는 영토 주장에 확고해야 합니다."
 ww1_secondbalkan.30.a: "배신자들!"
 ww1_secondbalkan.31.t: "불가리아의 오흐리드 영유권 주장!"
 ww1_secondbalkan.31.d: "불가리아는 오흐리드 영유권 포기를 거부하였으며, 우리가 영토 분할에 합의한 크리바팔란카-오흐리드 선 이남 지역을 점령했다고 강력하게 항의했습니다."
 ww1_secondbalkan.31.a: "생각할 시간이 필요하다."
 ww1_secondbalkan.31.b: "평화를 위하여..."
 ww1_secondbalkan.32.t: "세르비아의 오흐리드 포기"
 ww1_secondbalkan.32.d: "세르비아가 협정에 따라 우리 군정 아래에 오흐리드 지역을 반환했습니다. 마침내 안도하고 승리를 만끽할 수 있게 되었습니다."
 ww1_secondbalkan.32.a: "잘했군."
 ww1_secondbalkan.33.t: "세르비아의 반불가리아 동맹 초대"
 ww1_secondbalkan.33.d_gre: "우리는 세르비아와 아무런 문제가 없었지만, 불가리아는 우리에게 속한 땅을 점령했습니다. 우리는 당연히 이에 동의합니다."
 ww1_secondbalkan.33.d_mnt: "일반적으로 불가리아인들에 대해서는 불만이 없지만, 세르브인들이 우리에게 많은 도움을 주었기에 이처럼 어려운 시기에 형제와 같은 민족을 버릴 수는 없습니다."
 ww1_secondbalkan.33.a: "승리를 위해 함께!"
 ww1_secondbalkan.34.t: "[FROM.getName]의 승낙"
 ww1_secondbalkan.34.d: "[FROM.getName] 측은 현명한 결정을 내려 불가리아에 대항하는 우리 동맹에 합류했습니다. 이제 우리는 그들을 물리칠 기회를 얻었습니다. 우리는 즉시 불가리아에 영토 반환을 요구하는 최후통첩을 보낼 것입니다."
 ww1_secondbalkan.34.a: "전쟁이 다가온다."
 ww1_secondbalkan.35.t: "불가리아의 최후통첩 수용 승낙"
 ww1_secondbalkan.35.d: "불가리아 정부는 패배가 불가피하다는 것을 깨닫고 우리 영토를 우리에게 반환하는 데 동의하기로 결정했습니다."
 ww1_secondbalkan.35.a: "외교의 위대한 승리다!"
 ww1_secondbalkan.36.t: "불가리아와의 전쟁 경고"
 ww1_secondbalkan.36.d: ""
 ww1_secondbalkan.36.a: "공격을 준비하라!"