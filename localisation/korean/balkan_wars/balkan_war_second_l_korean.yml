l_korean:
 BW2_preventing_war_tt: "§2세르비아§!가 §Y[203.getName]§!, §Y[1258.getName]§!, §Y[1140.getName]§! 주를 §G불가리아§!에 할양하면 전쟁을 방지할 수 있습니다."
 BW2_preventing_ahist_war_tt: "§G불가리아§!가 §Y[1258.getName]§!, §Y[1140.getName]§! 주를 §2세르비아§!에, §Y[731.getName]§!, §Y[345.getName]§! 주를 §4그리스§!에 할양하면 전쟁을 방지할 수 있습니다."
 BW2_war_with_serbian_traitor: "$great_power_politics_balkan_powder_keg_tt_icon$ 도둑질하는 동맹"
