 SER_buy_austrian_equipment: "$BUL_buy_austrian_equipment$"
 BUL_buy_austrian_equipment_desc: "우리 산업은 오스만 제국과의 전쟁을 독자적으로 지원하기에는 너무 취약합니다. 우리는 장비를 확보할 다른 방법을 찾아야 합니다. 열강에게서 장비를 구매하여 오스만과의 전투에 대비합시다."
 SER_army_mobilization: "의용병 모집"
 BUL_army_mobilization: "군사 동원"
 SER_economical_mobilization: "경제 동원"
 SER_economical_mobilization_desc: "우리는 다가오는 전쟁에 대비하여 경제를 준비하고 전쟁 수행에 필요한 충분한 자원을 확보해야 합니다."
