l_korean:
 ww1_balkan.1.t: "발칸 동맹"
 ww1_balkan.1.d: "튀르키예가 유럽의 병자라고 불리는 데에는 이유가 있습니다. 더 이상 한때 모두에게 공포를 심어주던 나라가 아닙니다. 이제 우리는 복수하고 그들이 정복했던 땅을 되찾을 기회를 맞았습니다. 발칸 이웃 국가들과 동맹을 맺어 더욱 강해지는 방안을 모색할 수도 있습니다. 하지만 각 국가가 더 큰 몫을 차지하려 한다는 점을 잊어서는 안 됩니다. 이는 미래에 갈등으로 이어질 수 있습니다. 어떻게 생각하십니까?"
 ww1_balkan.1.a: "함께 튀르크에 맞서야 한다!"
 ww1_balkan.1.b: "동맹은 어리석은 생각이다."
 ww1_balkan.2.t: "[FROM.GetName]의 제안"
 ww1_balkan.2.d: "[FROM.getNameDef]에서 공식 외교 서한이 도착했습니다. 서한에서 그쪽 정부는 발칸 반도에 남아 있는 기독교 영토를 해방한다는 공동 목표를 위해 오스만 제국에 대항하는 군사 동맹을 맺고자 하는 의사를 표명했습니다.\n제안 내용은 간단합니다. 양국의 군사력을 통합하고, 군사적 노력을 조율하여 술탄에 맞서 단결된 전선을 구축하자는 것입니다. 우리 이웃 국가는 양국이 공동의 목표를 위해 협력할 것을 약속하는 상호 방위 및 공격 조약에 서명할 준비가 되어 있습니다.\n이제 결정은 우리에게 달려 있습니다."
 ww1_balkan.2.a: "제안을 수락한다."
 ww1_balkan.2.b: "제안을 거절한다."
 ww1_balkan.3.t: "발칸 동맹의 실패"
 ww1_balkan.3.d: "발칸 국가들의 수도에 빠르게 소식이 전해졌습니다. 오스만 제국에 맞서는 군사 동맹을 위한 세르비아와 불가리아의 협상이 결렬되었다는 것입니다. 오스만의 지배에서 남은 기독교 영토를 해방시키겠다는 공동의 목표에도 불구하고, 양국 간의 불신과 영토적 야심이 극복할 수 없는 장벽으로 작용했습니다."
 ww1_balkan.3.a: "각자도생이다."
 ww1_balkan.4.t: "[FROM.getName]의 초청"
 ww1_balkan.4.d: "새롭게 결성된 발칸 동맹에서 외교 사절단이 도착하여 동맹의 공식 초청장을 전달해 왔습니다. 초청장에는 오스만 제국에 대항하는 대연합, 즉 발칸에 남아 있는 기독교 영토를 완전히 해방하기 위한 공동의 노력이 담겨 있었습니다."
 ww1_balkan.4.a: "가보자고!"
 ww1_balkan.5.t: "[FROM.getName]의 동의"
 ww1_balkan.5.d_ser: "불가리아는 튀르크에 맞서는 군사 동맹을 주도하기로 합의했습니다. 우리는 튀르크 영토의 미래 분할에 대해 논의했으며, 아직 해결해야 할 몇 가지 문제가 남아 있지만 더 이상 우려할 사항은 아닙니다. 이제 우리는 다가올 분쟁에서 승리를 확보하기 위해 본격적인 군사 준비를 시작해야 합니다."
 ww1_balkan.5.d_bul: "세르브인들은 현명한 선택을 하여 우리가 주도하는 튀르크에 맞서는 동맹에 합류하기로 결정했습니다. 우리는 튀르크 영토의 미래 분할에 대해서도 논의했으며, 아직 해결해야 할 몇 가지 문제가 남아 있지만 더 이상 우려할 사항은 아닙니다. 이제 우리는 다가올 전쟁에서 승리를 확보하기 위해 본격적인 군사 준비를 시작해야 합니다."
 ww1_balkan.5.a: "좋아."
 ww1_balkan.6.t: "[FROM.getName]의 동의"
 ww1_balkan.6.d: "[FROM.getName] 측이 동맹 가입 제안을 수락했고, 이제 우리는 더 강해져서 오스만 제국을 물리칠 가능성이 더 높아졌습니다."
 ww1_balkan.6.a: "훌륭해."
 BLL_form_the_alliance: "혼자서는 군대가 될 수 없다"
 BLL_anti_ottoman_crusade: "반오스만 십자군"
 BLL_anti_ottoman_crusade_desc: "이제 발칸 동맹이 결성되었으니, 발칸반도 해방을 위한 오스만 제국과의 성전을 준비할 때입니다. 전쟁 종료 시 각 동맹국이 무엇을 가질지 협상할 것입니다."
 BUL_lone_liberator: "외로운 해방자"
 BUL_lone_liberator_desc: "마케도니아를 둘러싼 분쟁 때문에 발칸 동맹의 결성은 실패했습니다. 동맹이 없더라도 발칸 반도를 해방해야 합니다. 우리 손으로 산스테파노 조약의 대불가리아 국경을 복원해야 합니다!"
 BUL_buy_french_equipment: "프랑스 야포 구매"
 BUL_buy_austrian_equipment: "[AUS.GetAuhName] 장비 구매"
