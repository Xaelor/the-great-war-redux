l_korean:
 BW1_war_with_turkey: "$great_power_politics_balkan_powder_keg_tt_icon$ 오스만 제국과의 전쟁"
 BLL_attack_together_tt: "아무 발칸 국가가 우리보다 먼저 §Y[TUR.GetForeignName]§!를 공격한다면, 우리도 튀르크에 선전포고합니다."
 BLL_replace_mission_tt: "§Y불가리아§!가 §C발칸 동맹§! 맹주가 되고 우리가 회원국이 된다면, 이 임무는 정보 전달 결정으로 대체됩니다."
 BW1_info_when_attack: "$great_power_politics_balkan_powder_keg_tt_icon$ 우리는 §Y[?BLL.days_mission_timeout@BW1_war_with_turkey]§!일 뒤 오스만 제국을 공격할 것입니다"
 BW1_armistice_mission: "$great_power_politics_balkan_powder_keg_tt_icon$ 발칸 국가들과 휴전"
 BW1_armistice_mission_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ [TUR.GetForeignName]과 휴전"
 BW1_london_conference: "$great_power_politics_balkan_powder_keg_tt_icon$ 런던 회의"
 BW1_armistice_tt: "§Y[TUR.GetForeignName]§!은 §Y발칸 국가들§!에 휴전을 제안합니다. 또한 강화회의가 §Y런던§!에서 열립니다."
 BW1_armistice_TUR_ser: "[SER.getName]과 휴전"
 BW1_armistice_TUR_bul: "[BUL.getName]과 휴전"
 BW1_armistice_TUR_gre: "[GRE.getName]과 휴전"
 BW1_armistice_TUR_mnt: "[MNT.getName]과 휴전"
 BW1_armistice_balkans: "[TUR.GetForeignName]과 휴전"
 BW1_balkan_league_won_tt: "§Y오스만 제국§!은 유럽 영토의 대부분을 잃었으며, §C발칸 동맹§!은 이 전쟁의 §Y승자§!로 간주되어 §Y새로운 영토§!를 얻습니다."
 BW1_balkan_turkey_won_tt: "§C발칸 동맹§!은 §Y튀르크의 유럽 영토§!에서 이들을 쫓아내는 데 실패했으며, §R오스만 제국§!은 이 전쟁의 §Y승자§!로 간주되어, 영토를 유지하고 §Y크레타§!를 보상으로 받습니다."
 BW1_turkey_crushing_defeat_tt: "§Y[TUR.GetForeignName]§!이 §R심각한 패배§!를 겪음 (§Y콘스탄티노폴리스§! 상실 또는 항복 현황 §Y30%§!(이탈리아-튀르크 전쟁 중에는 §Y40%§!) 이상)"
 BW1_balkans_crushing_defeat_tt: "§Y발칸 국가들§!이 §R심각한 패배§!를 겪음 (§Y[BUL.getName]§!이 항복하거나, §Y[SER.getName]§! 및 §Y[GRE.getName]§!이 항복함)"
 BW1_separated_peace_tt: "이 전쟁에서 §Y빠른 승리§!를 거두려면, §Y[BUL.getName]§!에 항복을 강요하거나, 또는 §Y[SER.getName]§!과 §Y[GRE.getName]§!에 항복을 강요해야 합니다."
 GRE_thessaloniki_race: "테살로니키 경주"
 ww1_firstbalkan.121.t: "발칸 국가들과의 휴전"
 ww1_firstbalkan.121.d: "전투가 교착 상태에 빠졌으므로 우리는 발칸 국가들에게 우리와 휴전 협정을 체결할 것을 제안할 수 있습니다. 또한 전쟁을 종식시키기 위해 런던에서 강화회의도 개최되었습니다."
 ww1_firstbalkan.121.a: "그래, 아무렴 어때."
 ww1_firstbalkan.121.b: "아니!"
 ww1_firstbalkan.122.t: "[FROM.getName] 측과 휴전"
 ww1_firstbalkan.122.d: "전투가 교착 상태에 빠진 가운데, [FROM.getName] 측에서 휴전 제안을 받았습니다. 이를 수락해야 합니까? 또한, 전쟁 종식을 위한 강화회의가 런던에서 개최되었습니다."
 ww1_firstbalkan.122.a: "그렇게 하자."
 ww1_firstbalkan.122.b: "튀르크와의 휴전은 없다!"
 ww1_firstbalkan.124.t: "휴전 종료"
 ww1_firstbalkan.124.d: "오스만 제국에서 쿠데타가 일어났고, 새 정부는 전쟁을 계속하려 합니다. 이제 우리는 작전을 재개하여 발칸 반도에서 이 튀르크 놈들을 완전히 몰아낼 수 있습니다."
 ww1_firstbalkan.124.a: "공세를 계속하라!"
 ww1_firstbalkan.125.t: "휴전 종료"
 ww1_firstbalkan.125.d: "이전 정부가 이 쥐새끼들과 휴전을 맺고 유럽 영토를 그들에게 넘겨주는 협상을 한 것은 실수였습니다. 우리는 즉시 전쟁을 재개하여 우리의 위대함을 보여줘야 합니다!"
 ww1_firstbalkan.125.a: "공세를 시작하라!"
 ww1_firstbalkan.126.t: "[FROM.getName]의 휴전 승낙"
 ww1_firstbalkan.126.d: "[FROM.getName] 측이 런던 강화회담 진행 중 우리와의 휴전 서명에 승낙했습니다."
 ww1_firstbalkan.126.a: "쉴 시간이 있다."
 ww1_firstbalkan.127.t: "[FROM.getName]의 휴전 거부"
 ww1_firstbalkan.127.d: "[FROM.getName] 측은 저들이 우리보다 강하다고 보고 휴전이 필요 없다고 결정했습니다. 어디 두고 봅시다."
 ww1_firstbalkan.127.a: "끝까지 싸우리라!"
 ww1_firstbalkan.128.t: "[FROM.getName]의 강화조약 서명"
 ww1_firstbalkan.128.d: "[FROM.getName] 측이 무적의 우리 군에 패배했습니다."
 ww1_firstbalkan.128.a: "누가 남았나?"
 BW1_balkan_league_won_message: "@SER @BUL @GRE @MNT §Y발칸 국가들§!이 @TUR §Y오스만§!의 오랜 지배를 종식시키고 주권과 영토를 완전히 되찾았습니다. 하지만 지도의 국경선은 아직 확정되지 않았고, 전투의 열기는 아직 가라앉지 않았습니다..."
 BW1_balkan_turkey_won_message: "@TUR §Y오스만§!은 @SER @BUL @GRE @MNT §Y발칸 국가들§!의 무모한 도전을 막아내고, @CRE §Y크레타§!를 보상으로 받으며 유럽 영토를 지켜냈습니다. 그러나 이번 전쟁은 @TUR §Y오스만§!에 심각한 타격을 주었으며, 제국은 여전히 회복을 위해 분투하고 있습니다. @SER @BUL @GRE @MNT §Y발칸 국가들§!은 이 도전을 다시 시도할 것이고, 그 순간 발칸 반도의 화약고는 다시 불붙을 것입니다."
 albania_independence_message: "1908년부터 이어진 여러 차례의 반란 끝에, 마침내 @ALB §Y알바니아인들§!은 400년이 넘는 @TUR §Y오스만§!의 지배에서 독립했습니다."