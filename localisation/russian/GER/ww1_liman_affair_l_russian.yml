l_russian:
 ww1_liman_affair.1.t: "[TUR.GetForeignName] обращается в генеральный штаб"
 ww1_liman_affair.1.d: "Из Высокой Порты поступило официальное обращение. Османское правительство, всё ещё не оправившееся от катастрофических поражений на Балканских войнах, запрашивает немедленную помощь в реформировании своих вооружённых сил.\n\nВ частности, Константинополь просит Берлин направить группу высокопоставленных офицеров для реорганизации и переподготовки османской армии. Предлагаемая миссия подразумевает назначение немецкого генерала на ключевой командный пост в армии - возможно, даже в самом Константинополе.\n\nЭтот запрос предоставляет возможность значительно расширить наше влияние в Восточном Средиземноморье, у самых ворот Дарданелл. Однако это не останется незамеченным. Россия, в частности, рассматривает Проливы как жизненно важный интерес и может воспринять наше участие как провокацию.\n\nМы должны решить: возглавим ли мы османские реформы - рискуя дипломатическим штормом?"
 ww1_liman_affair.1.a: "Естественно, мы согласны"
 ww1_liman_affair.1.b: "Наши генералы должны остаться дома"
 ww1_liman_affair.2.t: "[GER.getname] отклоняет наш запрос"
 ww1_liman_affair.2.d: "Из Берлина поступил ответ — и это не то, на что мы надеялись.\n\nНесмотря на нашу официальную просьбу о помощи в реформировании и модернизации вооружённых сил, германское правительство отказалось направить военную консультативную миссию в Константинополь. Хотя послание составлено учтиво и дипломатично, его смысл ясен: Германия не желает рисковать обострением отношений с Российской империей из-за нашего стратегического будущего.\n\nЭто решение оставляет османскую армию уязвимой и политически ослабленной после катастрофических Балканских войн."
 ww1_liman_affair.2.a: "Чёрт"
 ww1_liman_affair.3.t: "[GER.getname] принимает наш запрос"
 ww1_liman_affair.3.d: "Из Берлина прибыло послание с превосходными новостями. Германское правительство приняло нашу просьбу и направит военную консультативную миссию для помощи в реформировании наших вооружённых сил. Миссию возглавит генерал Отто Лиман фон Сандерс — опытный офицер, которому поручено реорганизовать ключевые армейские части и привести нашу систему обучения и командования в соответствие с современными европейскими стандартами. Примечательно, что он примет прямое командование корпусом, расквартированным вблизи Константинополя.\n\nЭто крупная дипломатическая и военная победа для Высокой Порты. Однако она не останется незамеченной нашим северным соседом. Русские считают Проливы жизненно важными для своих амбиций, и присутствие германского офицера в нашей столице может вызвать их гнев.\n\nМы должны действовать осторожно — но Империя, возможно, ещё обретёт свою былую силу."
 ww1_liman_affair.3.a: "Отлично!"
 ww1_liman_affair.4.t: "Люди Кайзера в Турции"
 ww1_liman_affair.4.d: "Данные разведки подтверждают, что Берлин принял просьбу Константинополя о направлении военных советников. Для реформирования османской армии назначен генерал Лиман фон Сандерс — ему даже передано командование войсками, расквартированными у Проливов.\n\nЭто событие вызвало тревогу как в Париже, так и в Санкт-Петербурге. Германское присутствие у ворот Дарданелл может угрожать французскому влиянию в восточном Средиземноморье и ограничить российский доступ к тёплым морям. Дипломаты предупреждают, что это не просто военная помощь — это просчитанный шаг по распространению влияния Германии на Ближний Восток.\n\nПравительству теперь предстоит сделать выбор. Следует ли нам официально заявить протест и поддержать российские требования об ограничении германской миссии или сохранять молчание, чтобы не разжигать напряжённость дальше?"
 ww1_liman_affair.4.a: "Мы должны протестовать"
 ww1_liman_affair.4.b: "Давайте не начинать кризис из-за этого"
 ww1_liman_affair.5.t: "Люди Кайзера в Турции"
 ww1_liman_affair.5.d: "Наши военные атташе в Константинополе подтвердили тревожное развитие событий: Берлин принял османский запрос о военной помощи. Генералу Отто Лиману фон Сандерсу поручено возглавить новую германскую миссию и, что ещё более тревожно, предоставлен прямой контроль над одним из корпусов османской армии, расквартированным вблизи Босфора.\n\nЭто не просто учебная миссия. Это стратегическое вторжение Германии на наш задний двор, размещение её офицеров у самых ворот Проливов — нашего выхода в Средиземное море.\n\nЕсли мы промолчим, то рискуем выглядеть слабыми и можем полностью утратить влияние на Ближнем Востоке. Но если мы возразим, то можем спровоцировать дипломатическую конфронтацию с Берлином и вынудить Париж и Лондон занять позицию.\n\nСудьба наших южных рубежей висит на волоске."
 ww1_liman_affair.5.a: "Мы должны протестовать"
 ww1_liman_affair.5.b: "Давайте не начинать кризис из-за этого"
 ww1_liman_affair.6.t: "[FRA.getname] просит поддержки"
 ww1_liman_affair.6.d: "Министерство иностранных дел получило срочное сообщение из Парижа: французское правительство, встревоженное растущим военным влиянием Германии в Константинополе, просит нашей поддержки в совместном протесте. Недавнее назначение генерала Лимана фон Сандерса главой германской консультативной миссии в Османской империи — с полномочиями над частями, расквартированными у Дарданелл — возмутило Россию и вызвало серьёзную озабоченность в МИД Франции.\n\nХотя у нас нет прямых военных интересов в османской армии, любой сдвиг в балансе сил вокруг Проливов может угрожать Восточному Средиземноморью и имперским маршрутам в Индию.\n\nСтоит ли нам выступить вместе с нашими французскими и российскими партнёрами, оказывая давление на Берлин? Или же протест поставит под угрозу наш собственный нейтралитет во всё более хрупком европейском порядке?"
 ww1_liman_affair.6.a: "Мы поддержим французов"
 ww1_liman_affair.6.b: "Я думаю нам лучше держаться в стороне"
 ww1_liman_affair.7.t: "[RUS.getname] просит поддержки"
 ww1_liman_affair.7.d: "Российское правительство официально обратилось к Парижу в связи с обостряющимся кризисом в Османской империи. Поскольку германская военная миссия теперь полностью развёрнута, а генерал Лиман фон Сандерс командует войсками, расквартированными у Босфора, Санкт-Петербург требует скоординированного дипломатического ответа.\n\nРоссияне рассматривают эту германскую манёвру как прямую угрозу своему влиянию над Проливами и нарушение регионального баланса сил. Теперь они призывают нас, своего главного союзника, поддержать их протест и дипломатически противостоять Германии.\n\nМИД Франции должен взвесить свои варианты. Твёрдый протест продемонстрирует солидарность и, возможно, поможет сдержать германские амбиции — но он рискует спровоцировать более широкий дипломатический кризис в момент, когда Европа уже опасно напряжена."
 ww1_liman_affair.7.a: "Братья по оружию"
 ww1_liman_affair.7.b: "Я думаю нам лучше держаться в стороне"
 ww1_liman_affair.8.t: "[RUS.getname] просит поддержки"
 ww1_liman_affair.8.d: "МИД России официально запросил нашу поддержку в связи с нарастающим кризисом вокруг германской военной миссии в Константинополе. Генерал Лиман фон Сандерс занял видный командный пост вблизи Босфора, и Санкт-Петербург расценивает это как прямую угрозу своим стратегическим интересам в Проливах.\n\nРусские настоятельно призывают нас присоединиться к скоординированному протесту против германского вмешательства в османские дела вместе с Францией. Они предупреждают, что бездействие ободрит Берлин и дестабилизирует восточное Средиземноморье — регион, имеющий важность не только для России, но и для наших собственных имперских коммуникаций с Индией.\n\nОднако наши обязательства перед Россией остаются неформальными, и любое открытое действие может подорвать нашу дипломатическую балансировку. Следует ли нам ответить на этот призыв — или сохранить дистанцию?"
 ww1_liman_affair.8.a: "Мы поддержим русских"
 ww1_liman_affair.8.b: "Я думаю нам лучше держаться в стороне"
 ww1_liman_affair.9.t: "«Дело Лимана фон Сандерса»"
 ww1_liman_affair.9.d: "На востоке Средиземноморья назревает дипломатический шторм. После официального обращения Османской империи с просьбой о иностранной военной помощи германское правительство направило миссию во главе с генералом Отто Лиманом фон Сандерсом для контроля над реформированием османской армии.\n\nХотя это преподносится как обычная консультативная инициатива, решение предоставить Лиману командование корпусом, расквартированным в Константинополе, вызвало острую реакцию. Россия, рассматривая это как угрозу своему доступу к Проливам, выступила с официальными протестами, призвав своих французских и британских партнёров совместно оказать давление на Берлин. Франция уже выразила озабоченность, а британская сторона в настоящее время ведёт обсуждения."
 ww1_liman_affair.9.a: "Боже, спаси нас, только не ещё один кризис..."
 ww1_liman_affair.10.t: "Требования из России остановить нашу военную миссию"
 ww1_liman_affair.10.d: "Из Санкт-Петербурга поступила резкая дипломатическая нота. Российская империя официально возражает против нашей военной миссии в Османской империи и, в частности, против назначения генерала Лимана фон Сандерса на ключевой командный пост вблизи Босфора.\n\nРоссия заявляет, что наше присутствие у Проливов угрожает её морскому доступу в Средиземное море и нарушает хрупкий баланс влияния на Ближнем Востоке. В ноте содержится призыв к Берлину пересмотреть структуру миссии и ограничить полномочия наших офицеров исключительно консультативными функциями.\n\nВ МИДе и Генеральном штабе мнения разделились. Некоторые утверждают, что уступка российским требованиям подорвёт наш авторитет и сведёт на нет редкую возможность расширить своё влияние. Другие предостерегают, что настаивание на полном контроле может спровоцировать международный кризис с непредсказуемыми последствиями.\n\nТеперь решение остаётся за Рейхом."
 ww1_liman_affair.10.a: "Может, мы сможем договориться"
 ww1_liman_affair.10.b: "Нам нужно отступить"
 ww1_liman_affair.10.c: "Черт бы их всех побрал, пусть держат свои руки подальше!"
 ww1_liman_affair.11.t: "Требования из Франции остановить нашу военную миссию"
 ww1_liman_affair.11.d: "Из Парижа поступила дипломатическая нота. В полной поддержку российских опасений французское правительство присоединилось к протесту против нашей военной миссии в Османской империи. Французы требуют, чтобы генерал Лиман фон Сандерс был переведён на исключительно консультативную роль и чтобы Германия воздержалась от любого прямого командования над османскими силами, размещёнными в Проливах или рядом с ними. Париж предупреждает, что игнорирование этих призывов рискует дестабилизировать регион и усилить европейскую напряжённость.\n\nВремя этой ноты — не случайность. Она подтверждает скоординированный франко-российский фронт, полный решимости сдержать наше влияние в Константинополе и за его пределами. Рейх теперь должен решить: отстаивать свои права или предложить дипломатический жест для сохранения мира."
 ww1_liman_affair.11.a: "Может, мы сможем договориться"
 ww1_liman_affair.11.b: "Нам нужно отступить"
 ww1_liman_affair.11.c: "Черт бы их всех побрал, пусть держат свои руки подальше!"
 ww1_liman_affair.12.t: "[GER.getname] уступает российским требованиям"
 ww1_liman_affair.12.d: "Международный спор вокруг германской военной миссии в Османской империи, похоже, достиг мирного урегулирования. В ответ на растущее дипломатическое давление — особенно со стороны России — Берлин согласился ограничить полномочия генерала Лимана фон Сандерса.\n\nХотя Лиман останется во главе консультативной миссии при османской армии, он больше не будет осуществлять оперативное командование войсками, расквартированными вблизи Константинополя и Проливов. Российское правительство, которое выражало озабоченность вместе с Францией, рассматривает это как явный дипломатический успех.\n\nХотя непосредственный кризис был предотвращён, более широкие последствия остаются. Германия сохраняет сильную консультативную роль в османской армии, и её влияние в восточном Средиземноморье всё ещё расширяется. Это дело вновь подтвердило, что Османская империя остаётся критической ареной соперничества между великими державами Европы."
 ww1_liman_affair.12.a: "Хорошо"
 ww1_liman_affair.13.t: "[GER.getname] уступает французским требованиям"
 ww1_liman_affair.13.d: "Международный спор вокруг германской военной миссии в Османской империи, похоже, достиг мирного урегулирования. В ответ на растущее дипломатическое давление — особенно со стороны Франции — Берлин согласился ограничить полномочия генерала Лимана фон Сандерса.\n\nХотя Лиман останется во главе консультативной миссии при османской армии, он больше не будет осуществлять оперативное командование войсками, расквартированными вблизи Константинополя и Проливов. Французское правительство, которое выражало озабоченность вместе с Россией, рассматривает это как явный дипломатический успех.\n\nХотя непосредственный кризис был предотвращён, более широкие последствия остаются. Германия сохраняет сильную консультативную роль в османской армии, и её влияние в восточном Средиземноморье всё ещё расширяется. Это дело вновь подтвердило, что Османская империя остаётся критической ареной соперничества между великими державами Европы."
 ww1_liman_affair.13.a: "Хорошо"
 ww1_liman_affair.14.t: "Германия отказывается от российских требований"
 ww1_liman_affair.14.d: "Напряжённость на Ближнем Востоке обострилась, поскольку Германия официально отвергла российские возражения против своей военной миссии в Османской империи. Несмотря на озабоченность по поводу командной должности генерала Лимана фон Сандерса у Проливов, Берлин отказался изменять структуру миссии. Этот шаг рассматривается как смелое утверждение германского влияния в Константинополе — и дипломатическая неудача для Санкт-Петербурга."
 ww1_liman_affair.14.a: "Опасный прецедент в Восточном вопросе."
 ww1_liman_affair.15.t: "Германия отвергает французский протест"
 ww1_liman_affair.15.d: "Германское правительство официально отвергло призывы Франции изменить структуру своей военной миссии в Османской империи. Париж просил ограничить полномочия генерала Лимана фон Сандерса вблизи Проливов, ссылаясь на озабоченность по поводу региональной стабильности. Отказ Берлина свидетельствует о твёрдом намерении сохранять своё растущее влияние в Константинополе, несмотря на растущее дипломатическое давление со стороны западных держав."
 ww1_liman_affair.15.a: "Проливы остаются точкой возгорания для соперничающих империй."
 ww1_liman_affair.16.t: "[GER.getname] отказываеться от наших требований"
 ww1_liman_affair.16.d: "Напряжённость на Ближнем Востоке обострилась, поскольку Германия официально отвергла российские возражения против своей военной миссии в Османской империи. Несмотря на озабоченность по поводу командной должности генерала Лимана фон Сандерса у Проливов, Берлин отказался изменять структуру миссии. Этот шаг рассматривается как смелое утверждение германского влияния в Константинополе — и дипломатическая неудача для Санкт-Петербурга."
 ww1_liman_affair.16.a: "Тогда война"
 ww1_liman_affair.16.b: "Они раскусили наш блеф."
 ww1_liman_affair.17.t: "[GER.getname] отказываеться от наших требований"
 ww1_liman_affair.17.d: "Напряжённость в Юго-Восточной Европе вновь нарастает после решения Германии отклонить дипломатические требования Франции относительно её военной миссии в Османской империи.\n\nЦентр спора — генерал Отто Лиман фон Сандерс, назначенный возглавить германскую консультативную группу в Константинополе. Франция, поддержав озабоченность России, призвала Берлин пересмотреть миссию и не допускать, чтобы Лиман имел прямое командование над османскими силами, размещёнными вблизи Проливов.\n\nБерлин теперь официально отказался изменить структуру миссии. Германское Министерство иностранных дел защищает это решение как вопрос суверенного сотрудничества между союзниками, но критики утверждают, что оно представляет собой провокационное утверждение влияния в регионе, который уже изобилует нестабильностью.\n\nНаблюдатели предупреждают, что ситуация может обостриться дальше, если другие державы решат ответить. Восточный вопрос — давно бездействовавший — вернулся на передний план европейской дипломатии."
 ww1_liman_affair.18.t: "Кризис на ближнем востоке предотвращён"
 ww1_liman_affair.18.d: "По-видимому, достигнуто дипломатическое урегулирование кризиса вокруг германской военной миссии в Османской империи. После недель растущей напряжённости и международных протестов Берлин согласился пересмотреть роль генерала Лимана фон Сандерса, который был поставлен во главе османских войск у стратегически важных Проливов.\n\nВ рамках нового соглашения Лиман сохранит руководство консультативной миссией, но больше не будет осуществлять прямое командование войсками в Константинополе. Это изменение удовлетворяет главную озабоченность России и привело к деэскалации спора."
 ww1_liman_affair.18.a: "Значит, в этом году войны не будет?"
 ww1_liman_affair.19.t: "Кризис на ближнем востоке предотвращён"
 ww1_liman_affair.19.d: "После недель растущей напряжённости германское правительство согласилось пересмотреть структуру своей военной миссии в Османской империи. В дипломатической ноте, адресованной Парижу, Берлин подтвердил, что генерал Лиман фон Сандерс останется в Константинополе, но больше не будет осуществлять прямое командование османскими силами, расквартированными вблизи Проливов.\n\nЭта уступка последовала после устойчивых французских протестов против того, что воспринималось как чрезмерное расширение германского влияния у ворот Босфора. Хотя Российская империя выражала первоначальную озабоченность, она воздержалась от эскалации этого вопроса — что отражает более дружественный тон, который в настоящее время характеризует российско-германские отношения."
 ww1_liman_affair.19.a: "Значит, в этом году войны не будет?"
 ww1_liman_affair.20.t: "[FROM.getAdjective] правительство поддерживает нас!"
 ww1_liman_affair.20.d: "[FROM.getName] проявил большой интерес к сохранению нашего влияния на Босфоре и поддержал наш протест против германской военной миссии в Османской империи. При поддержке [FROM.getAdjective] мы можем заставить османо-германскую ось отступить."
 ww1_liman_affair.20.a: "Замечательно."
 ww1_liman_affair.21.t: "[FROM.getAdjective] отклонило предложение!"
 ww1_liman_affair.21.d: "Несмотря на очевидную потерю влияния, которую мы все можем понести из-за этого кризиса, [FROM.getAdjective] правительство отказалось поддержать наш протест против германской миссии в Османской империи."
 ww1_liman_affair.21.a: "Чёрт!"
 ww1_liman_affair.22.t: "Германия и Османская империя корректируют военную миссию"
 ww1_liman_affair.22.d: "В жесте, направленном на сохранение региональной стабильности, Германия и Османская империя совместно объявили, что немецкие офицеры, размещённые в Константинополе, больше не будут осуществлять прямое командование османскими войсками. Миссия Лимана фон Сандерса продолжит работу в консультативном качестве, но немецкий персонал теперь официально исключён из оперативного руководства — включая чувствительный регион Проливов. Эта корректировка, по-видимому, является добровольной мерой Центральных держав, предпринятой без прямого дипломатического давления со стороны Антанты.\n\nХотя и скромное, это изменение затрагивает ключевую озабоченность, неофициально высказанную в Париже и Санкт-Петербурге. На данный момент Восточный вопрос остаётся спокойным."
 ww1_liman_affair.22.a: "Жест сдержанности, достойный приветствия."
 CP_expel_german_advisors:0 "$great_power_politics_sick_man_of_europe_tt_icon$ Ограничить германскую миссию"
 CP_expel_german_advisors_desc:0 "Напряжённость, вызванная военной миссией, значительно возросла. Ограничение миссии до меньшей роли может предотвратить глобальный конфликт с Антантой."
 ww1_liman_affair.23.t: "Германия сокращает масштабы военной миссии"
 ww1_liman_affair.23.d: "Мы получили известие из Берлина о том, что германское командование решило ограничить масштабы миссии генерала Лимана фон Сандерса в Константинополе. С немедленным вступлением в силу немецкие офицеры больше не будут иметь прямого оперативного командования османскими силами, включая те, что расквартированы вблизи Проливов.\n\nХотя это преподносится как добровольный жест, ясно, что это решение последовало за косвенным давлением со стороны Франции и России. Имперскому правительству теперь необходимо пересмотреть, как продолжать военные реформы, сохраняя при этом свой суверенитет и союзы."
 ww1_liman_affair.23.a: "Мы принимаем этот результат ради стабильности."
 ww1_liman_affair.24.t: "Антанта готовит совместные дипломатические действия"
 ww1_liman_affair.24.d: "Сообщения из наших посольств в Париже и Санкт-Петербурге позволяют предположить, что державы Антанты готовят скоординированную дипломатическую демарш, чтобы противостоять нашему растущему военному присутствию в Османской империи. Хотя официальный ультиматум ещё не предъявлен, их озабоченность сосредоточена на полномочиях генерала Лимана фон Сандерса в отношении османских сил у Проливов. Публичная конфронтация поставит Берлин в трудное положение — и может нанести ущерб нашим отношениям с другими нейтральными державами.\n\nМы всё ещё можем проявить инициативу, добровольно ограничив масштабы нашей миссии, и разрядить кризис до его эскалации."
 ww1_liman_affair.24.a: "Это настораживает..."
 ww1_liman_affair.25.t: "Антанта отказывается от официального протеста"
 ww1_liman_affair.25.d: "Мы получили подтверждение по дипломатическим каналам, что державы Антанты — хотя изначально были встревожены нашим военным присутствием в Константинополе — решили не выдвигать никакого официального протеста или скоординированной демарш.\n\nИх нерешительность, вероятно, из-за внутренних разногласий и страха перед эскалацией, знаменует собой тихую, но ясную дипломатическую победу Центральных держав. Наша миссия в Османской империи остаётся полностью нетронутой, и никаких уступок не сделано. По-видимому, кризис миновал, и наша позиция на Ближнем Востоке только укрепилась."
 ww1_liman_affair.25.a: "Тихий отход — и стратегический успех."
 ww1_liman_affair.26.t: "Миссия в Османской империи сохранена, поскольку Антанта отступает"
 ww1_liman_affair.26.d: "Дипломатическая напряжённость вокруг германской военной миссии в Османской империи, по-видимому, тихо завершилась в пользу Центральных держав. Несмотря на ранние возражения Франции и России, официальный протест так и не был выдвинут. Поскольку Антанта отступила, османское правительство сохраняет своё суверенное право принимать иностранных советников, а Германия укрепляет своё присутствие у Проливов, не делая уступок.\n\nВ Константинополе и Берлине исход рассматривается как политическая победа — достигнутая без единого выстрела."
 ww1_liman_affair.26.a: "Тихий триумф Центральных держав."
 ww1_liman_affair.26.b: "Пусть забирают, нам всё равно"
 entente_abandon_demands:0 "$great_power_politics_sick_man_of_europe_tt_icon$ Отказаться от требований"
 entente_abandon_demands_desc:0 "Напряжённость, вызванная военной миссией, значительно возросла. Поскольку Германия и Османская империя не отступают, мы можем быть втянуты в полномасштабную войну из-за кучки немецких офицеров в миссии. Мы могли бы отказаться от нашего протеста, чтобы избежать кровавой войны."
 liman_affair_mission:0 "$great_power_politics_sick_man_of_europe_tt_icon$ Дело Лимана"
 liman_affair_mission_desc:0 "Германия направила военную миссию в Османское государство по его просьбе, и Отто Лиман фон Сандерс берёт под контроль часть их армии. Для некоторых других крупных европейских держав это слишком далеко зашедший шаг; они официально возразили против миссии и заручаются поддержкой среди других держав. Было бы разумно для обеих сторон следить за тем, кто кого поддерживает, прежде чем определять свою политику по этому вопросу - мы можем только молиться, чтобы это не привело к реальному конфликту..."
 liman_mission_active:0 "Кризис Лимана активен"
 liman_affair: "Дело Лимана"