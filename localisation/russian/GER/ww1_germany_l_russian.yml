 GER_lessons_of_lorraine: "Уроки Лотарингии"
 GER_lessons_of_lorraine_desc: "Наступления против Франции позволили нам накопить богатый опыт в ведении современной войны. Важность артиллерии и сохранение солдат — два основных компонента победы."
 GER_heavy_firepower_doctrine: "Доктрина тяжелой огневой мощи"
 GER_heavy_firepower_doctrine_desc: "Массированные пехотные атаки не будут достаточны для прорыва вражеских линий. Более концентрированное использование артиллерии даст нашим солдатам возможность продлить наступления."
 GER_the_great_war_of_the_sky: "Великая война небес"
 GER_the_great_war_of_the_sky_desc: "Растущая важность авиации вынуждает Luftstreitkräfte пересмотреть свою стратегию в воздухе, в частности, ускорив разработку небольших, простых в производстве самолётов."
 GER_abandon_zeppelin_doctrine: "Отказаться от доктрины Цеппелинов"
 GER_abandon_zeppelin_doctrine_desc: "Дирижабли слишком медленны и дороги и не оправдали ожиданий генерального штаба. Инновации, такие как Fokker и Albatros, показали, что можно строить более дешёвые и эффективные самолёты."
 GER_fighter_mass_production: "Массовое производство истребителей"
 GER_fighter_mass_production_desc: "Для борьбы с вражескими самолётами мы должны сосредоточить наше производство на нескольких дешёвых моделях и полностью отказаться от производства деталей для более тяжёлого или нестандартизированного оборудования."
 GER_heeringen_air_plan: "Воздушный план Хеерингена"
 GER_new_air_doctrine: "Новая воздушная доктрина"
 GER_modest_conscription_effort: "Скромные усилия по призыву"
 GER_modest_conscription_effort_desc: "Война затягивается, и, хотя мы пытались избежать этого, мы вынуждены увеличивать численность войск, чтобы удержать фронт."
 GER_gain_a7v_when_getting_heavy_tank: "§YПроектирует§! и §Yдобавляет 20 танков A7V§! как только будет изучена технология §Yтяжелого танка§!. Также добавляет следующую идею на 720 дней:\n"
 GER_breaktrough_trenches: "Прорвать траншеи"
 GER_breaktrough_trenches_desc: "Окопная война вынуждает нас искать новые подходы к сухопутным сражениям. Для поддержки пехотных атак и разрушения укреплений мы можем изучить конструкцию бронированной гусеничной машины, оснащённой тяжёлым орудием."
 GER_mitigated_quantitative_plan: "Смягченный количественный план"
 GER_mitigated_quantitative_plan_desc: "Несмотря на усилия по призыву, нехватка людей всё ещё ощущалась. Военный министр Хееринген связался с генералом Фалькенхайном, чтобы переопределить германский план ведения войны на ближайшие годы. Сосредоточившись на более медленной мобилизации, план ухудшил качество войск в пользу их численности — необходимая жертва."
