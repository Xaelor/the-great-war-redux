 GER_secure_loyalty_of_unions_desc: ""
 GER_restoration_of_belgium: "Restoration of Belgium"
 GER_restoration_of_belgium_desc: "Expanding our influence into Belgium serves little purpose. The plans for Belgium outlined in the Septemberprogramm would only serve to outrage the British in peace negotiations. If Belgian is restored as an independent state, The Entent may be more amenable to accepting demands elsewhere..."
