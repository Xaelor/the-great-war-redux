 ww1_german_victory.1.t: "Будущее OHL"
 ww1_german_victory.1.d: "Когда мы достигли победы, заставив наших врагов сесть за стол переговоров, в Берлине — да и по всему Рейху — поднимаются новые вопросы, вопросы о будущем Верховного командования (OHL).\n\nСозданное для надзора за военными действиями и добившееся больших успехов благодаря таким генералам, как Гинденбург и Людендорф, OHL накопило огромную власть, часто действуя независимо от гражданских властей. Одни утверждают, что его дальнейшее существование необходимо для обеспечения послевоенной безопасности и подавления беспорядков.\n\nДругие, особенно в Рейхстаге и среди конституционалистов, утверждают, что война окончена и что военные должны вернуться на своё место — под гражданским контролем."
 ww1_german_victory.1.a: "Сохранить OHL — поддержание порядка требует дальнейшего военного контроля."
 ww1_german_victory.1.b: "Распустить OHL — война окончена, власть должна вернуться Рейхстагу."
 GER_politize_OHL_for_interwar: "§YВерховное командование§! будет сохранено. Это вызовет §Oсерьёзную оппозицию§!."
 ww1_german_victory.2.t: "Военная оппозиция роспуску OHL"
 ww1_german_victory.2.d: "Решение распустить Верховное командование вызвало резкую критику среди офицерских кругов. Генерал Людендорф, в частности, выразил своё возмущение, заявив, что роспуск военного командования после победы является предательством достижений армии.\n\nНекоторые офицеры даже призвали сохранить влияние армии в определении государственной политики, но они явно в меньшинстве. Большинство же политиков и даже ключевые фигуры в армии признают, что гражданское руководство должно быть восстановлено. Людендорф и горстка сторонников жёсткой линии были тихо уволены или назначены на почётные посты."
 ww1_german_victory.2.a: "Военные возвращаются в казармы."
 ww1_german_victory.3.t: "Массовые протесты за демократические реформы"
 ww1_german_victory.3.d: "Победа в войне принесла гордость империи, но не мир дому. По всему Берлину, Дрездену, Руру и Кёнигсбергу собрались толпы, скандируя требования о долгожданных демократических реформах.\n\nСреди самых громких из них: ликвидация трёхклассовой избирательной системы в Пруссии, усиление гражданского представительства в имперском управлении и срочные меры по борьбе с послевоенной инфляцией и неравенством. Многие протесты мирные, но забастовки и агитация быстро набирают обороты. В то время как знамена победы развеваются во славу Фатерлянда, другие требуют, чтобы за победой последовали справедливость и настоящая демократия."
 ww1_german_victory.3.a: "Нам следует преступить к реформам"
 ww1_german_victory.4.t: "Забастовки усиливаются: требование новых выборов"
 ww1_german_victory.4.d: "Вслед за волной демократических протестов сформировалось второе, более решительное движение. Важнейшие промышленные центры по всей Германии — от Рура до Саксонии — теперь парализованны забастовками.\n\nПротестующие больше не довольствуются обещаниями реформ. Они требуют немедленных общенациональных выборов, полной реструктуризации имперского парламента и срочных внутренних реформ, включая защиту труда, жилищные программы и контроль за ценами.\n\nДаже внутри умеренных партий усиливается давление, требующее принятия ответных мер до того, как движение радикализуется ещё больше. Рейх не может позволить себе оставаться глухим к собственному народу — по крайней мере, после победы."
 ww1_german_victory.4.a: "Задержите и проведите расследование... Это необходимо пресекать сразу же."
 GER_reform_german_empire: "Реформировать Кайзеррейх"
 ww1_german_victory.5.t: "Обращение Кайзера к нации"
 ww1_german_victory.5.d: "В ответ на растущие беспорядки и народные демонстрации, Его Императорское и Королевское Величество, Вильгельм II выступил с прямым обращением к народу.\n\nКайзер признал требования о проведении реформ и признал жертвы, принесённые населением во время войны. Он заверил слушателей, что демократические реформы, включая парламентские изменения и расширение гражданского представительства, будут проведены организованно и обдуманно.\n\nПризывая к единству и дисциплине, Кайзер призвал общественность доверять мудрости короны и избегать волнений, которые могли бы поставить под угрозу с таким трудом одержанную национальную победу."
 ww1_german_victory.5.a: "Спокойный голос в наше неспокойное время."
 ww1_german_victory.6.t: "Выборы на фоне несогласия военных"
 ww1_german_victory.6.d: "По мере подготовки к ожидаемым национальным выборам, обещанным Его Императорским Величеством в его недавнем обращении, в старом военном истеблишменте вновь возникает напряжённость.\n\nНесмотря на то, что официально отошёл от дел, генерал Эрих Людендорф и несколько бескомпромиссных консерваторов выступили с публичной критикой избирательного процесса, обвинив правительство в передаче власти популистам и социалистам. Их слова находят отклик в националистических ветеранских кругах и реакционных газетах.\n\nНесмотря на их отстранение от власти, эти голоса продолжают эхом отдаваться в коридорах старого офицерского корпуса — и их нельзя полностью игнорировать."
 ww1_german_victory.6.a: "Рейх пойдёт вперёд, с ними или без."
 ww1_german_victory.7.t: "Имперский комитет по национальному восстановлению"
 ww1_german_victory.7.d: "С установлением мира за рубежом, но продолжающимися трудностями внутри страны, правительство объявило о создании нового Имперского комитета по национальному восстановлению.\n\nНа комитет возложена задача оценки военного ущерба, восстановления ключевой инфраструктуры и предотвращения голода в наиболее пострадавших регионах; он объединяет гражданских инженеров, местных чиновников и офицеров военной логистики. Он уполномочен координировать экстренный ремонт железных дорог, жилья и систем распределения продовольствия.\n\nХотя некоторые рассматривают это как временную меру, другие видят в этом начало современного, централизованного подхода к социальному обеспечению и экономическому восстановлению."
 ww1_german_victory.7.a: "Дело мира начинается с восстановления."
 ww1_german_victory.8.t: "Политическое направление Кайзеррейха"
 ww1_german_victory.8.d: "С победой в войне кайзер Вильгельм II и его правительство провозглашают новую эру стабильности. Вместо того чтобы стремиться к новым завоеваниям, Рейх сосредоточится на консолидации своих приобретений и проецировании силы через торговлю, дипломатию и культуру. Экономическое влияние и технологическое лидерство теперь рассматриваются как инструменты империи. Мир будет уважать Германию не только за её мощь, но и за её видение."
 ww1_german_victory.8.a: "Это рассвет прусского мира."
 ww1_german_victory.9.t: "Голландские эсминцы доставлены"
 ww1_german_victory.9.d: "До войны Германия согласилась построить четыре современных эсминца для Королевских военно-морских сил Нидерландов. Хотя конфликт задержал их передачу, перемирие и последующий мир теперь позволили возобновить проект.\n\nРассматриваемая как жест доброй воли и морской надёжности, передача этих кораблей укрепляет связи с Нидерландами и демонстрирует послевоенное промышленное восстановление Германии."
 ww1_german_victory.9.a: "Наши верфи наконец-то выполняют свои обещания."
 ww1_german_victory.10.t: "Прибытие немецких эсминцев"
 ww1_german_victory.10.d: "Несколько лет назад наше правительство заказало четыре современных эсминца на немецких верфях. Война нарушила контракт, и многие опасались, что корабли никогда не будут достроены. Однако сегодня суда наконец прибыли в наши гавани. Их передача рассматривается как дипломатический жест и признак восстановленного доверия. Наш флот укреплён, а отношения с Берлином незаметно улучшились."
 ww1_german_victory.10.a: "Желанное пополнение нашего флота."
 ww1_german_victory.11.t: "Реформы правительства"
 ww1_german_victory.11.d: "С увольнением Людендорфа Рейхстаг принял широкомасштабные реформы. Они предоставляют новые полномочия парламенту: министры теперь могут быть депутатами, объявление войны требует согласия законодателей, а рейхсканцлер должен пользоваться доверием Рейхстага. Расширяется гражданский контроль над военными назначениями. Тайный совет упраздняется, а Эльзас-Лотарингия получает статус федеральной земли под властью герцога Франца Баварского. Германия делает смелый шаг к конституционной монархии."
 ww1_german_victory.11.a: "Начинается новая глава в истории Империи."
 ww1_german_victory.12.t: "Новое экономическое партнёрство?"
 ww1_german_victory.12.d: "С завершением свободных выборов и недавно подписанным морским договором Берлин стремится углубить связи с Вашингтоном через экономическое сотрудничество. Германское правительство предложило долгосрочное торговое соглашение: экспорт стали и продукции горнодобывающей промышленности из Рура в обмен на американское зерно и излишки сельскохозяйственной продукции. Для Рейха это одновременно дипломатический жест и стратегический шаг для создания национальных продовольственных запасов."
 ww1_german_victory.12.a: "Сталь за хлеб — союз процветания."
 ww1_german_victory.12.b: "Хороший немец — это голодный немец!"
 ww1_german_victory.13.t: "Подписан договор с Соединёнными Штатами"
 ww1_german_victory.13.d: "После нескольких недель переговоров Вашингтон официально принял наше торговое предложение. Новое соглашение обеспечивает регулярный экспорт немецкого угля и стали в обмен на американские продовольствие и оборудование. Это знаменует собой веху в германо-американском сотрудничестве и помогает стабилизировать как наш промышленный выпуск, так и национальные продовольственные запасы."
 ww1_german_victory.13.a: "Многообещающее начало экономической дипломатии."
 ww1_german_victory.14.t: "Вашингтон отклоняет наше предложение"
 ww1_german_victory.14.d: "Несмотря на недавнее дипломатическое потепление и общую заинтересованность в стабильности, США отклонили наше предложение об экономическом партнёрстве. Чиновники в Вашингтоне ссылаются на внутренние приоритеты и политическую осторожность. Отказ является неудачей, но Берлин по-прежнему намерен найти других торговых партнёров и обеспечить продовольственную безопасность альтернативными способами."
 ww1_german_victory.14.a: "Разочаровывает, но это ещё не конец."
 GER_USA_trade_deal_interwar: "Торговый договор с Германией"
 GER_USA_trade_deal_interwar_GER: "Торговый договор с США"
 GER_supervize_belgium_focus_free: "Постоянное посольство в Бельгии"
 GER_supervize_belgium_focus_free_desc: "Хотя Бельгия была освобождена, она должна оставаться под влиянием империи, чтобы снова не попасть под влияние своих французских и британских соседей."
 GER_supervize_belgium_focus_puppet: "Интегрированная [BEL.getName]"
 GER_supervize_belgium_focus_puppet_desc: "Согласно «Сентябрьской программе», Бельгия должна стать сателлитом Рейха, подчиняясь нашей воле. Чтобы гарантировать подчинение бельгийцев, их экономика должна быть подчинена экономике империи."
 GER_supervize_belgium: "[GER_supervize_belgium_focus_name]"
 ww1_german_victory.15.t: "Бельгийский союзник, а не марионетка"
 ww1_german_victory.15.d: "Отказавшись от аннексионистских амбиций во время войны, Германия выполнила своё обещание признать независимость Бельгии. В Брюсселе открылось новое посольство, и экономические советники теперь помогают восстанавливать бельгийскую промышленность. Формально суверенное Королевство Бельгия оказывается под сильным германским влиянием — дипломатическим, экономическим и культурным. Рождается новое партнёрство, скреплённое тенью войны."
 ww1_german_victory.15.a: "Мягкость добивается успеха там, где сила потерпела неудачу."
 ww1_german_victory.16.t: "Бельгия поставлена на колени"
 ww1_german_victory.16.d: "После нашей военной победы положения «Сентябрьской программы» теперь полностью реализованы в Бельгии. Хотя страна сохраняет номинальное правительство, её экономика подчинена потребностям Берлина. Железные дороги, порты и ключевые отрасли переходят под германский надзор. Договоры обеспечивают права на военный транзит и экономические привилегии. Бельгия больше не является независимым субъектом — она является зависимым сателлитом Рейха."
 ww1_german_victory.16.a: "Наш западный фланг защищен — навсегда."
 ww1_german_victory.17.t: "Суверенная нация в тени Германии"
 ww1_german_victory.17.d: "Хотя Бельгии удалось избежать аннексии, она выходит из войны глубоко опутанной Германской империей. Берлин открыл посольство в Брюсселе и разместил советников в наших министерствах. Торговые соглашения и инфраструктурные программы привязывают нашу экономику к их экономике. Пока король остаётся на троне, критики предупреждают, что истинная автономия может уже ускользать."
 ww1_german_victory.17.a: "Хрупкая независимость лучше, чем никакой независимости."
 ww1_german_victory.18.t: "Подчиненный по договору"
 ww1_german_victory.18.d: "Война окончена, но для Бельгии настоящий мир остаётся недостижимым. На условиях, продиктованных Берлином, наша экономика привязана к немецким нуждам. Железные дороги, порты и промышленность работают под иностранным надзором. Рейх претендует на право транзита войск и диктовки ключевых политических решений. Хотя бельгийский флаг всё ещё развевается, многие шепчутся, что мы лишь марионеточное государство де-факто."
 ww1_german_victory.18.a: "Возможно, мы выжили, но какой ценой?"
 ww1_german_victory.19.t: "Берлин протягивает руку"
 ww1_german_victory.19.d: "Спустя годы после нашего поражения Германская империя направила неофициальных посланников, предлагая дипломатическую оттепель. По словам Берлина, Европа должна «смотреть вперёд, а не назад». Однако во Франции воспоминания об оккупации, унижении и Франкфуртском договоре всё ещё свежи. Это предложение разделяет наше руководство: одни видят в нём возможность, другие — предательство. Можно ли построить мир на горечи?"
 ww1_german_victory.19.a: "Мы никогда не забудем. Никогда."
 ww1_german_victory.19.b: "Это горькая пилюля... но мы её проглотим."
 ww1_german_victory.20.t: "Берлин стремится к сближению"
 ww1_german_victory.20.d: "Из Берлина прибыло послание — тщательно сформулированное, неофициальное, но недвусмысленное по тону. Германская империя, ныне стабильная и уверенная в себе, желает восстановить видимость нормальных отношений с Британией. Воспоминания о морской блокаде, колониальном соперничестве и военных потерях всё ещё живы. Парламент разделён: является ли эта оливковая ветвь искренней дипломатией или просчитанным оппортунизмом?"
 ww1_german_victory.20.a: "Мы не готовы прощать."
 ww1_german_victory.20.b: "Ради стабильности мы ответим."
 ww1_german_victory.21.t: "Предложение Германии среди пепла"
 ww1_german_victory.21.d: "Из руин нашей гражданской войны приходит послание — из Берлина, ни много ни мало. Германская империя предлагает дипломатическую нормализацию, ссылаясь на «континентальную стабильность» и «взаимный интерес». Для многих русских это жестокая ирония: Германия разгромила наши армии, унизила наш старый режим и теперь предлагает мир, как будто ничего не случилось. Но можем ли мы позволить себе отвергнуть все контакты с новым порядком?"
 ww1_german_victory.21.a: "Пусть Берлин сохраняет свою фальшивую дружбу."
 ww1_german_victory.21.b: "Мы ответим — не из доверия, а их необходимости."
 ww1_german_victory.22.t: "[FROM.getName] замечает нашу инициативу."
 ww1_german_victory.22.d: "Дружеские приветствия, направленные нами правительству [FROM.getAdjective], не были проигнорированы. В типично дипломатической манере [FROM.getName] проявил интерес к нашей инициативе, не признавая её прямо. Это означает, что мы, надеемся, сможем потеплить наши отношения в более или менее отдалённом будущем."
 ww1_german_victory.22.a: "Это хорошее начало!"
 ww1_german_victory.23.t: "[FROM.getName] проигнорировал нас."
 ww1_german_victory.23.d: "Наша дружеская рука была отвергнута [FROM.getAdjective] правительством, которое даже не ответило на наше сообщение. Как мы и предполагали, [FROM.getAdjective] люди всё ещё высокомерны и плохо переносят поражения, что делает любое потепление наших отношений на данный момент невозможным."
 ww1_german_victory.23.a: "По крайней мере, мы попытались."
 ww1_german_victory.24.t: "Новый канцлер"
 ww1_german_victory.24.d: "Новая конституция потрясла основы имперской политики. С отменой ненавистной трёхклассной системы голосования консерваторы в замешательстве, а старый порядок пошатнулся. Кайзер, хотя и неохотно, теперь должен назначить канцлера, способного справиться с требованиями более демократичного Рейхстага. Он мог бы назначить беспартийного Вильгельма Зольфа, что было бы более стабильным выбором. Он также может выбрать убеждённого реформиста Эрцбергера или вернуть Хольвега, опытного прогрессиста."
 ww1_german_victory.24.a: "Назначить Вильгельма Зольфа — твёрдую либеральную руку."
 ww1_german_victory.24.b: "Вернуть Бетман-Гольвега — стабильность превыше всего."
 ww1_german_victory.24.c: "Назначить Маттиаса Эрцбергера — смелый шаг к реформам."
 ww1_german_victory.25.t: "Германия предлагает членство в Миттельевропе."
 ww1_german_victory.25.d: "Берлин направил официальное приглашение присоединиться к новому континентальному проекту — Миттельевропе. Представленный как обширный экономический союз мира и процветания, проект предусматривает гармонизацию тарифов, общую инфраструктуру и скоординированную торговую политику — всё под германским руководством. Сторонники приветствуют возможность доступа к надёжному рынку и стабильным инвестициям. Критики предупреждают, что это рискует превратить нашу экономику в придаток Рейха."
 ww1_german_victory.25.a: "Принять приглашение — сотрудничество приносит рост."
 ww1_german_victory.25.b: "Отказаться — мы не пожертвуем нашим суверенитетом."
 GER_mitteleuropa_project: "Проект «Миттельевропа»"
 GER_mitteleuropa_project_desc: "Чтобы оживить европейскую экономику, мы можем создать экономическую сферу, своего рода таможенный союз, который будет определять, как работает европейская торговля."
 GER_mitteleuropa_category: "Миттельевропа"
 GER_mitteleuropa_germany: "Основатель Миттельевропы"
 GER_mitteleuropa_member: "Член Миттельевропы"
 GER_invite_from_in_mitteleuropa_fake_tt: "Будет открыто решение: £decision_icon_small §YПригласить дружественную страну в Миттельевропу§!"
 GER_invite_from_in_mitteleuropa: "Пригласить государство [FROM.getName]"
 GER_tsingtao_accord: "Соглашения в Циндао"
 GER_tsingtao_accord_desc: "Япония — отдалённая страна, которая не подверглась вторжению во время Великой войны, и поэтому является проигравшей лишь косвенно. Такая ситуация делает её потенциальным противником в Азии, с которым было бы лучше дружить."
 ww1_german_victory.26.t: "[FROM.getName] присоединяется к Миттельевропе."
 ww1_german_victory.26.d: "[FROM.getAdjective]  правительство приняло наше приглашение в Миттельевропу. Экономики [FROM.getAdjective] и Германии значительно выиграют друг от друга, увеличивая нашу торговлю и политическое влияние в [FROM.getName]."
 ww1_german_victory.26.a: "Хорошо"
 ww1_german_victory.27.t: "[FROM.getName] отказался присоединиться к Миттельевропе."
 ww1_german_victory.27.d: "[FROM.getAdjective] government refused our proposal to join our economyc sphere. They argued that this initiative may break the balace of Europe in German Advantage and denied any fuhrer participation to such project."
 ww1_german_victory.27.a: "Прискорбно."
 ww1_german_victory.28.t: "[FROM.getName] покидает Миттельевропу."
 ww1_german_victory.28.d: "[FROM.getAdjective] government sent us a letter about a radical change in their economic stance toward us. Explained in a diplomatic way, the document announce that [FROM.getName] is leaving Mitteleuropa, denouncing the full-German control of this institution."
 ww1_german_victory.28.a: "Прискорбно."
 GER_leaves_mitteleuropa: "Покинуть Миттельевропу"
 ww1_german_victory.29.t: "Циндаоские соглашения."
 ww1_german_victory.29.d: "В попытке ослабить напряжённость после победы Германии в Великой войне делегация пригласила нас в Циндао, Китай, для обсуждения соглашения о «сотрудничестве» между нашими двумя странами. Несмотря на наше теоретическое поражение, Япония понесла мало потерь во время войны и, напротив, оккупировала германские территории в Азии. Несмотря на эту победу на бумаге, мы были вынуждены вывести войска с захваченных территорий, что повлияло на популярность правительства и вызвало гнев населения.\n\nПодписание соглашения смягчит наши отношения, но мы должны быть осторожны, чтобы не нанести дальнейший ущерб имперской чести."
 ww1_german_victory.29.a: "Подписать его, но нигде не упоминать Циндао."
 ww1_german_victory.29.b: "Подписать его..."
 ww1_german_victory.30.t: "Циндаоские соглашения."
 ww1_german_victory.30.d1: "Японская делегация благополучно прибыла в Циндао, и встреча длилась три дня, в течение которых обсуждались германо-японские отношения и статус территориальных уступок после окончания конфликта. Хотя обсуждения были конструктивными, японские власти отказались признать германское владение Циндао, утверждая, что территория находилась под их оккупацией и была освобождена только для мирных переговоров. Обсуждения по этому вопросу стали напряжёнными, и в итоговом соглашении эта территория не упоминалась."
 ww1_german_victory.30.d2: "Японская делегация благополучно прибыла в Циндао, и встреча длилась три дня, в течение которых обсуждались германо-японские отношения и статус территориальных уступок после окончания конфликта. Самым спорным вопросом был статус Циндао — территории, которую Империя Восходящего Солнца завоевала во время войны и неохотно возвращала по Франкфуртскому мирному договору. К счастью, выгодное положение Германии быстро вынудило японские власти признать германский суверенитет над этой территорией."
 ww1_german_victory.30.a: "По крайней мере, мы что-то подписали"
 GER_renact_relation_with_losers: "Наладить отношения с побеждёнными"
 GER_contact_loser_gain_tt: "\n§YДля каждой страны, что примет предложение:§!\n"
 GER_foe_can_become_a_fool: "§LПобеждённая страна может в конце концов согласиться возобновить дипломатические отношения.§!"
 GER_decision_frustration_among_general_staff: "$great_power_politics_great_war_tt_icon$ Разочарование в Генеральном штабе"
 GER_decision_frustration_among_general_staff_desc: "Верховное командование сухопутных сил и Морское руководство разочарованы состоянием войны, в первую очередь — низкой поддержкой среди населения. Чтобы добиться решающей победы, они готовы проявить собственную инициативу, даже если правительство с этим не согласно..."
 ww1_german_interwar.1.t: "Гинденбург обвиняет тыл"
 ww1_german_interwar.1.d: "В широко распространившемся заявлении фельдмаршал Пауль фон Гинденбург нарушил молчание относительно причин поражения Германии. По его словам, армия стойко держалась на передовой, но была «предана ударом в спину» из-за беспорядков, забастовок и политической агитации в тылу. Он осуждает так называемый «этап» — промышленников, рабочих и гражданских лиц, — которых он обвиняет в подрыве морального духа и национального единства в критический час. Его слова находят отклик у консерваторов — и углубляют раскол внутри нации."
 ww1_german_interwar.1.a: "Миф укореняется."
 ww1_german_interwar.3.t: "Бауэр уходит в отставку на фоне кризиса"
 ww1_german_interwar.3.d: "После провала капповского путча и под огромным политическим давлением канцлер Густав Бауэр подал в отставку. Хотя его правительство выступало против путча, его воспринимаемая слабость во время кризиса вызвала возмущение во всём политическом спектре. Чтобы восстановить доверие, кайзер назначил Германа Мюллера — социал-демократа с более умеренной репутацией — новым рейхсканцлером. Сможет ли он выдержать бурю, покажет время."
 ww1_german_interwar.3.a: "Хрупкая республика цепляется за стабильность."
 ww1_german_interwar.4.t: "Распад Веймарской коалиции"
 ww1_german_interwar.4.d: "Недавние выборы положили конец так называемой Веймарской коалиции, поскольку СДПГ, НДП и Центр не смогли сохранить своё парламентское большинство. Канцлер Герман Мюллер, не сумев обеспечить дальнейшую поддержку, ушёл в отставку. На его место президент назначил Константина Ференбаха, центристского католического государственного деятеля, чтобы возглавить Рейх. Его задача — удержать вместе раздробленный Рейхстаг и восстановить доверие к гражданскому управлению."
 ww1_german_interwar.4.a: "Ещё один поворот в бурные времена."
 ww1_german_interwar.5.t: "Лондонский ультиматум"
 ww1_german_interwar.5.d: "Антанта предъявила ультиматум из Лондона: Германия должна принять обязательство выплатить 132 миллиарда золотых марок в качестве репараций. Сумма ошеломляет — её невозможно выплатить, не ввергнув страну в экономическую разруху. По всему Рейху распространяется возмущение. Политики говорят о национальном унижении, промышленники предупреждают о крахе, а граждане протестуют против того, что они называют «данью, а не миром». Однако отказ может привести к новой оккупации или даже к войне."
 ww1_german_interwar.5.a: "Это вымогательство, а не справедливость."
 ww1_german_interwar.6.t: "Плебисциты в Восточной Пруссии и Силезии."
 ww1_german_interwar.6.d: "В соответствии с Версальским договором в Восточной Пруссии и Верхней Силезии были проведены плебисциты для определения их будущей принадлежности. Несмотря на польскую агитацию и беспорядки, большинство в нескольких спорных регионах проголосовало за сохранение в составе Рейха. Хотя некоторые корректировки границ всё ещё могут последовать, этот результат рассматривается в Берлине как политическая и моральная победа. Толпы празднуют в Кёнигсберге и Бреслау — но напряжённость на границе остаётся высокой."
 ww1_german_interwar.6.a: "Отечество побеждает — пока."
 ww1_german_interwar.7.t: "Восстание в Верхней Силезии"
 ww1_german_interwar.7.d: "Несмотря на то, что плебисцит показал немецкое большинство в большей части Верхней Силезии, польские военизированные группы начали насильственное восстание в знак протеста. При поддержке добровольцев из-за границы они стремятся добиться международного вмешательства и изменить окончательное урегулирование. В ответ мобилизуются немецкие фрайкоры и местные ополчения. Регион погружается в хаос, угрожая свести на нет хрупкие дипломатические завоевания."
 ww1_german_interwar.7.a: "Порядок должен быть восстановлен — любыми средствами."
 ww1_german_interwar.15.t: "Восстание коммунистов"
 ww1_german_interwar.15.d: "Вдохновлённая революционным пылом и волнениями среди рабочих в центральной Германии, Коммунистическая партия (КПГ) подняла вооружённое восстание. Забастовки, саботаж и открытые столкновения вспыхивают по всей Саксонии и Тюрингии. Однако восстание плохо скоординировано, не имеет народной поддержки и в течение нескольких дней подавлено полицией и частями рейхсвера. Провал восстания углубляет раскол среди левых — и усиливает призывы к жёстким мерам против радикализма."
 ww1_german_interwar.15.a: "Красная мечта угасает — снова."
 ww1_german_interwar.9.t: "Третье Силезское восстание"
 ww1_german_interwar.9.d: "Несмотря на предыдущие соглашения и результаты плебисцита, показавшие более 60% поддержки за сохранение в составе Германии, польские повстанцы начали третье восстание в Верхней Силезии. Лига Наций предлагает территориальный компромисс, чтобы предотвратить эскалацию. Перед Берлином теперь стоит выбор: принять болезненный раздел региона или действовать в одностороннем порядке, чтобы подавить восстание и восстановить суверенитет силой."
 ww1_german_interwar.9.a: "Мы принимаем решение Лиги — пока что."
 ww1_german_interwar.9.b: "Мы сами наведем порядок. Силезия — немецкая!"
 ww1_german_revolution.11.t: "Республика провозглашена дважды"
 ww1_german_revolution.11.d: "[?global.date.GetDateStringNoHourLong], когда революция охватила Берлин, Филипп Шейдеман из СДПГ встал на балконе Рейхстага и провозгласил Германскую республику перед ликующей толпой. Всего несколько часов спустя Карл Либкнехт из Союза Спартака объявил о создании «Свободной социалистической республики Германии» из Королевского дворца. С разрушающейся монархией и кайзером в изгнании Германия оказывается перед двумя видениями будущего — и без ясного пути вперёд."
 ww1_german_revolution.11.a: "В конце концов останется только одна Республика."
 ww1_german_revolution.12.t: "Рождественский кризис"
 ww1_german_revolution.12.t2: "Кризис в Берлине"
 ww1_german_revolution.12.d: "Напряжённость взорвалась в Берлине, когда правительственные силы попытались расформировать Фольксмаринедивизион — левую милицию, оккупировавшую Берлинский дворец. Моряки отказались сложить оружие, что привело к уличным боям, жертвам и унизительному отступлению верных правительству войск. Правительство Эберта выживает, но доверие между СДПГ и радикальными левыми разрушено. Молодая республика теперь балансирует на грани гражданской войны."
 ww1_german_revolution.12.a: "Мы едва удерживаем эту республику от распада."
 ww1_german_interwar.8.t: "Верхняя Силезия частично передана Польше"
 ww1_german_interwar.8.d: "После хаоса Третьего силезского восстания и растущего польского давления Лига Наций приняла решение в пользу передачи части Верхней Силезии Польше. Это решение в Варшаве приветствуется как дипломатическая победа и шаг к национальному объединению. Однако немецкие протесты становятся всё громче, и смешанное население региона может превратить этот успех в новый источник конфликта."
 ww1_german_interwar.8.a: "Силезия наша!"
 ww1_german_nazism.1.t: "Наш агент вступил в Немецкую рабочую партию"
 ww1_german_nazism.1.d: "Адольф Гитлер, наш агент разведывательной части рейхсвера, был направлен для влияния на других солдат и внедрения в Немецкую рабочую партию."
 ww1_german_nazism.1.a: "Мы будем с большим интересом следить за вашей карьерой."
 ww1_german_nazism.2.t: "Образование Национал-социалистической немецкой рабочей партии"
 ww1_german_nazism.2.d: "После своей первой речи для Немецкой рабочей партии (ДАП) Гитлер быстро стал самым активным оратором партии. Значительные ораторские и пропагандистские навыки Гитлера были оценены партийным руководством, поскольку толпы начали стекаться, чтобы послушать его речи. Популярность ораторских способностей Гитлера была настолько велика, что партия начала взимать плату за вход для посетителей, желающих услышать его выступления.\n\nНебольшое число членов партии быстро прониклось политическими убеждениями Гитлера. Он организовал их самую большую на тот момент встречу с участием 2000 человек в пивном зале в Мюнхене. Далее, в попытке сделать партию более привлекательной для более широких слоёв населения, ДАП была переименована в Национал-социалистическую немецкую рабочую партию."
 ww1_german_nazism.2.a: "Тревожно"
 ww1_german_nazism.6.t: "Канцлер Гитлер"
 ww1_german_nazism.6.d: "Адольф Гитлер назначен рейхсканцлером. С Schutzstaffel и Sturmabteilung, окружающими Рейхстаг, был принят «Закон о преодолении бедствий народа и рейха», известный как Закон о чрезвычайных полномочиях. Веймарская республика рухнула, и возникла нацистская Германия."
 ww1_german_nazism.6.a: "Вот так и умирает демократия."
 ww1_germanrework.171.t: "Кризис бюджета 1912 года"
 ww1_germanrework.171.d: "Рейхстаг остаётся в тупике по поводу имперского бюджета на 1912 год. Споры между консерваторами и прогрессистами по вопросам налогообложения, военных расходов и социальных реформ парализовали процесс. Правительство теперь осталось без действующего бюджета, что вызвало конституционный кризис. С колеблющейся легитимностью канцлер Хольвег должен выбрать: уйти в отставку и позволить сформироваться новой коалиции — или запросить чрезвычайные полномочия и попытаться принудить к компромиссу."
 ww1_germanrework.171.a: "В отставку! Рейхстаг высказался."
 ww1_germanrework.171.b: "Это всё ещё можно решить."
 ww1_germanrework.172.t: "Бюджетный тупик сохраняется"
 ww1_germanrework.172.d: "Прошло три месяца, а бюджет всё ещё не утверждён. Переговоры полностью провалились. Поскольку Рейхстаг парализован, а правительство не может получить большинство, канцлер подал в отставку. В ответ кайзер использовал свою прерогативу, чтобы ввести временный бюджет — разработанный военными и консервативными министерствами, ставящий вооружение и порядок выше реформ."
 ww1_germanrework.172.a: "По крайней мере, кризис заканчивается..."
 ww1_germanrework.174.t: "Переговоры с [getFederalStateNameFromCountryFlag]"
 ww1_germanrework.174.desc: "Чтобы заручиться поддержкой федерального штата [getFederalStateNameFromCountryFlag], мы должны предложить им вознаграждение, соизмеримое с их поддержкой. Мы могли бы развивать их местную промышленность или предложить им более разнообразные льготы, которые могли бы на некоторое время ограничить эффективность правительства."
 ww1_germanrework.174.a: "Мы инвестируем в их промышленность"
 ww1_germanrework.174.b: "Мы инвестируем в их инфраструктуру"
 ww1_germanrework.174.c: "Мы сделаем кое-какие политические \"уступки\""
 ww1_germanrework.174.d: "Знаете, мы передумали..."
