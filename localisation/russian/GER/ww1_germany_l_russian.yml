 GER_reperations_to_the_americans_desc: ""
 GER_the_coalition_forgotten: "The Coalition Forgotten"
 GER_the_coalition_forgotten_desc: ""
 GER_endorse_hindenburg: "Endorse Hindenburg"
 GER_endorse_hindenburg_desc: ""
 GER_finish_the_netherlands_naval_contract: "Завершить голландский морской контракт"
 GER_finish_the_netherlands_naval_contract_desc: "Теперь, когда война окончена, мы можем завершить обещанную поставку оборудования в Нидерланды, что не должно вызывать у них недовольства..."
 USA_washington_naval_treaty: "Вашингтонское морское соглашение"
 USA_washington_naval_treaties: "Вашингтонские морские соглашения"
 GER_berlin_naval_treaty: "Берлинское морское соглашение"
 GER_berlin_naval_treaty_desc: "Мы должны учредить морскую конференцию в Берлине, где соберутся [ITA.GetNameDef], [USA.GetNameDef], Соединённое Королевство и [JAP.GetNameDef] для установления морских ограничений, что положат конец дорогостоящей гонке вооружений на море. Как победитель, мы можем обеспечить себе выгодные условия и одновременно обеспечить стабильность в глобальной военно-морской конкуренции."
 GER_berlin_naval_treaties: "Берлинские морские соглашения"
 GER_berlin_naval_treaties_desc: "Чтобы избежать второй морской гонки вооружений, мы должны предложить крупным морским державам заключить международный договор, ограничивающий количество кораблей в зависимости от установленной численности каждой из стран-участниц. Это смелое предложение является частью подхода к деэскалации."
 GER_march_constitution: "Реформировать конституцию Бисмарка"
 GER_march_constitution_desc: "Чтобы завершить срочные реформы, обещанные Его Императорским Величеством, мы должны закрепить недавние социальные достижения в рамках новой конституции. Эта новая конституция установила бы парламентское государство, тщательно сохранив при этом славу и традиционный авторитет империи."
 GER_OHL_question: "Вопрос об OHL"
 GER_OHL_question_desc: "Завершение Великой войны теоритически должно положить\nконец политической доминации OHL. Тем не менее, страна\nостаётся переменчивой и нестабильной, а влияние OHL всё ещё остро ощущается. Мы должны решить этот вопрос о власти военных, чтобы обеспечить подлинный гражданский контроль и стабильность."
 GER_address_to_the_nation: "Обратиться к нации"
 GER_address_to_the_nation_desc: "После разрушительной войны немецкий народ решительно требует реформ, о чём свидетельствуют многочисленные забастовки и гражданские беспорядки. Его Императорское Величество должен действовать решительно, чтобы сохранить в стране стабильность, пообещав стремительные и значительные реформы."
 GER_victor_snap_elections: "Организовать досрочные выборы"
 GER_victor_snap_elections_desc: "В мирное время могут быть проведены новые выборы, которые позволят обеспечить хорошее представительство немецкого народа в парламенте, а также повысить легитимность будущих правительств."
 GER_limited_time_for_reforms: "§RВы должны будете провести некоторые демократические реформы, чтобы избежать политической нестабильности.§!"
 GER_new_prussian_electoral_reform: "Вторая Прусская избирательная реформа"
 GER_new_prussian_electoral_reform_desc: "Избирательная реформа, которую предложил $GER_theobald_von_bethmann_hollweg$ была неосуществима во время войны. Однако теперь этот долгожданный проект наконец-то может быть реализован, положив конец архаичному прусскому трёхклассовому избирательному праву."
 GER_realpolitik_appeasement: "«Реалполитик» умиротворения"
 GER_realpolitik_appeasement_desc: "После нашей решающей победы мы, несомненно, стали ведущей мировой державой. Теперь мы можем усилить наше гегемонистское положение, не прибегая к агрессивному прусскому милитаризму, который обеспечил нам победу. Пришло время для проведения политики прагматичного умиротворения и установления прочных, стабильных отношений с побеждёнными народами."
 prussian_electoral_reform_passed: "Прусская избирательная реформа принята"
 snap_elections_are_done: "Досрочные выборы завершены"
 GER_establish_the_german_recovery_comittee: "Учредить комитет по восстановлению Германии"
 GER_establish_the_german_recovery_comittee_desc: "Великая война оставила после себя повсеместное опустошение по всему континенту. Мы должны учредить комитет, посвящённый восстановлению Германии, который тщательно проанализирует ущерб и, что особенно важно, обяжет побежденные страны взять на себя расходы по восстановлению."
 GER_establish_the_german_recovery_comittee_done: "Комитет по восстановлению Германии учреждён"
 GER_bundesrat_category: "[GetBundesratName]"
 GER_reichstag_category: "Рейхстаг"
 GER_reichstag_category_desc: "Рейхстаг — нижняя палата парламента Германии, каким он был с 1871 года после принятия имперской кончтитуции. Внутри правительственной структуры Рейха он представляет национальный и демократический элемент империи — наряду с федерализмом Бундесрата и монархическим элементом правительства, воплощённым в рейхсканцлере. Вместе с Бундесратом Рейхстаг являет собой орган законодательной власти и участвует в принятии решений по имперскому законодательству.\n\nЗаконы должны пройти через Рейхстаг, прежде, чем быть отправленными на рассмотрение в Бундесрат; каждый закон будет поддержан различными партиями, в зависимости от их политической пренадлежности и направленности самого закона; чем больше партия — тем больше голосов получит закон. Но это не помешает нам в случае чего заручиться поддержкой других партий."
 GER_election1: "Предстоящие выборы в Рейхстаг"
 GER_calculate_predicted_results: "Прогнозируемые результаты"
 GER_calculate_predicted_results_desc: "Прогнозируемые результаты будут обновлены."
 GER_might_delay_a_famine: "В случае затяжной войны, этот фокус может §Yотложить риск§! §Rголода§!."
 GER_toggle_hiddenburg_program: "Переключить программу Гинденбурга"
 GER_has_at_least_2_ships_in_bismark_sea: "Есть как минимум §Y2§! корабля в Море §YБисмарка§!."
 GER_reichstag_next_elections_category: "Прогнозируемые результаты выборов"
 GER_election1_desc: "§WПрогнозируемый исход выборов:\n$GER_leftist_factions_prediction_text$\n$GER_leftist_factions_prediction_list_text$\n$GER_centrist_factions_prediction_text$\n$GER_centrist_factions_prediction_list_text$\n$GER_rightist_factions_prediction_text$\n$GER_rightist_factions_prediction_list_text$\n$GER_neutral_factions_prediction_text$\n$GER_neutral_factions_prediction_list_text$§!"
 ww1_german_reichstag.1.t: "Выборы в Рейхстаг [?reichstag_election_date] года"
 ww1_german_reichstag.1.d: "В мирное время состав Рейхстага обновляется каждые пять лет после выборов его депутатов. Во время полномочий нижней палаты Рейхстаг играет важную роль в разработке немецкого законодательства, а также в принятии бюджетов и предоставлении исключительных кредитов."
 ww1_german_reichstag.1.a: "Да начнётся работа"
 ww1_german_reichstag.2.t: "Выборы в Рейхстаг отложены"
 ww1_german_reichstag.2.d: ""
 ww1_german_reichstag.2.a: "Иногда приходится идти на жертвы"
 ww1_german_reichstag.3.a: "Итак, дело сделано"
 ww1_german_reichstag.4.t: "Закон принят Рейхстагом"
 ww1_german_reichstag.4.d: "После длительных обсуждений и политического лавирования, предложенный правительством законопроект успешно прошёл голосование в Рейхстаге. Несмотря на некоторую оппозицию со стороны различных фракций, наша программа получила необходимое одобрение со стороны избранных народом представителей."
 ww1_german_reichstag.4.a: "Победа для правительства."
 ww1_german_reichstag.5.t: "Закон провалился в Рейхстаге"
 ww1_german_reichstag.5.d: "Коалиция оппозиционных партий успешно заблокировала наш последний закон в Рейхстаге. Это представляет собой серьёзную политическую неудачу и демонстрирует трудности, связанные с ориентированием в расколотом политическом ландшафте нижней палаты. Правительственная повестка дня зашла в тупик."
 ww1_german_reichstag.5.a: "Это неповиновение запомнится надолго."
 ww1_german_reichstag.6.t: "Закон прошёл [GetBundesratName]"
 ww1_german_reichstag.6.d: "Представители федеральных земель, представленных в [GetBundesratName]е, дали своё согласие на предложенный закон. Это голосование подтверждает единство входящих в него государств, поддерживаемых центральным правительством, и гарантирует, что законодательство может быть введено в действие по всей империи."
 ww1_german_reichstag.6.a: "Свидетельство федерального единства."
 ww1_german_reichstag.7.t: "Закон заблокирован [GetBundesratName]ом"
 ww1_german_reichstag.7.d: "[GetBundesratName] отклонил законодательное предложение правительства. Ключевые государства-члены отказались предоставить своё одобрение, обнажив глубокие разногласия внутри федеральной структуры империи. Это вето представляет собой серьёзный вызов нашей власти."
 ww1_german_reichstag.7.a: "Возможно, федеральная империя была ошибкой."
