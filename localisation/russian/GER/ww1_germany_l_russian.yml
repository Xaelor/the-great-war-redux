 GER_reduction_of_submarine_warfare_tt: "$great_power_politics_great_war_tt_icon$ §GУменьшает шансы утопления нейтральных судов, особенно американских.§!"
 GER_unrestricted_submarine_warfare_idea: "Расширение Атак на Торговые Суда"
 GER_unrestricted_submarine_warfare_idea2: "Агрессивная Подводная Война"
 GER_unrestricted_submarine_warfare_idea3: "Неограниченная Подводная Война"
 GER_unrestricted_submarine_warfare_idea4: "Неограниченная Подводная Война"
 ww1_german_revolution.2.t: "Эберт назначен канцлером в хаосе"
 ww1_german_revolution.2.d: "Революция, начавшаяся в Киле, охватила всю Германию. В Берлине массовые демонстрации парализовали столицу. Казармы распахнуты, оружие роздано, и революционные солдаты теперь маршируют рядом с бастующими рабочими. [?global.date.GetDateStringNoHourLong] власть Кайзера исчезла. Советы рабочих и солдат захватили правительственные здания, телеграфные станции и транспортные узлы. Имперская администрация рухнула. Канцлер ушёл в отставку, и власть перешла — не к парламенту, а к советам. На улицах развеваются красные флаги.\n\nВ этой ужасной ситуации канцлер фон Баден передал пост канцлера Фридриху Эберту из СДПГ. Что будет дальше — неясно, но Германия теперь республика во всём, кроме названия."
 ww1_german_revolution.2.a: "Сможет ли Фридрих спасти Германию?"
 ww1_german_revolution.3.t: "Напряжённость между социалистами растёт"
 ww1_german_revolution.3.d: "Хотя монархия пала, Германия далека от единства. Временное правительство — непрочная коалиция между Социал-демократической партией большинства (МСДПГ) и Независимой социал-демократической партией (НСДПГ) — сталкивается с растущим давлением со стороны радикальных левых. Союз Спартака, возглавляемый Карлом Либкнехтом и Розой Люксембург, призывает к созданию полной рабочей республики по советскому образцу. Их риторика становится всё более воинственной.\n\nЛидеры МСДПГ, включая канцлера Эберта, опасаются, что спартакисты могут попытаться захватить власть силой. НСДПГ, хотя и более сочувствующая, также встревожена возможностью вооружённого восстания, которое может ввергнуть страну в гражданскую войну. В Берлине и других промышленных центрах напряжённость достигает критической точки. Революционные советы становятся всё более агрессивными, в то время как вооружённые отряды фрайкора начинают перегруппировываться. Столкновение кажется неизбежным, если не будет найден срединный путь."
 ww1_german_revolution.3.a: "Мы должны быть осторожны."
 GER_spartakist_revolt_timer: "Таймер восстания спартакистов"
 GER_scorned_army: "Оскорблённая армия"
 GER_aftermath_of_the_zabern_affair: "Последствия Цабернского инцидента"
 ww1_german_revolution.4.t: "Заключён пакт Эберта — Гренера"
 ww1_german_revolution.4.d: "В ходе тайного телефонного разговора вечером [?global.date.GetDateStringNoHourLong] Фридрих Эберт — глава нового германского правительства — достиг решающей договорённости с генералом Вильгельмом Гренером из Верховного командования армии.\n\nГренер пообещал лояльность армии Республике при условии, что Эберт обязуется поддерживать порядок и бороться с революцией большевистского типа. В ответ Эберт признает авторитет офицерского корпуса и обеспечит преемственность военной иерархии.\n\nЭтот пакт, хотя и секретный, представляет собой глубокий компромисс: республика, защищаемая имперскими генералами, и социалистический лидер, полагающийся на монархических офицеров для подавления радикальных рабочих. Для Эберта цель ясна: революция не должна идти дальше. Лучше республика, поддерживаемая армией, чем хаос, устроенный спартакистами."
 ww1_german_revolution.4.a: "Порядок должен быть сохранён — даже ценой этого."
 ww1_german_revolution.5.t: "В Веймаре рождается новая республика"
 ww1_german_revolution.5.d: "Поскольку Берлин всё ещё охвачен волнениями и на улицах проливается свежая кровь, избранное Национальное собрание собралось в тихом городе Веймар. Именно здесь, вдали от хаоса, будет выковано будущее германского государства. Делегаты из всего расколотого политического спектра — социал-демократы, центристы, либералы — собрались для разработки конституции, восстановления государственных институтов и придания республике легитимной основы. Хотя монархия пала, а империя распалась, путь Германии остаётся неопределённым. Но из скромных залов Веймара поднимается новая надежда: республика, рождённая не завоеваниями или традицией, а компромиссом.\n\nКакое бы имя ни дала история этому новому государству, свой первый вдох оно делает здесь — в Веймаре."
 ww1_german_revolution.5.a: "Будем надеяться, что её не назовут Веймарской республикой."
 ww1_german_revolution.6.t: "Республика обретает форму в Веймаре"
 ww1_german_revolution.6.d: "После исторического собрания Национального собрания в Веймаре новая Германская республика начинает обретать форму. Фридрих Эберт, давний столп Социал-демократической партии большинства, избран первым президентом Республики.\n\nНаряду с ним Филипп Шейдеман назначен министром-президентом, которому поручено сформировать новое правительство и провести страну через послевоенное восстановление. Их умеренное, парламентское руководство широко рассматривается как стабилизирующая сила в эти неопределённые времена.\n\nХотя впереди много проблем, формирование этого гражданского правительства знаменует собой жизненно важный шаг к демократическому порядку."
 ww1_german_revolution.6.a: "Республика стоит."
 ww1_german_revolution.7.t: "Фрайкор и союзы ветеранов мобилизуются"
 ww1_german_revolution.7.d: "После пакта Эберта-Гренера и на фоне растущих страхов перед революцией по всей Германии возникают новые военные формирования. Бывшие офицеры, демобилизованные солдаты и националистические добровольцы организуются в военизированные отряды — фрайкор.\n\nЯкобы созданные для защиты Республики от большевистских восстаний и уличных беспорядков, эти формирования часто действуют в соответствии со своими собственными планами. В то же время множатся союзы ветеранов, объединяя людей, отмеченных войной, в поисках товарищества, цели — а иногда и мести.\n\nХотя в краткосрочной перспективе они полезны, эти силы могут оказаться взрывоопасными в будущем."
 ww1_german_revolution.7.a: "Пусть они восстановят порядок, пока что."
 ww1_german_interwar.2.t: "Шейдеман уходит в отставку из-за Версаля"
 ww1_german_interwar.2.d: "Филипп Шейдеман ушёл в отставку, отказавшись подписывать Версальский договор, заявив, что «такой мир неприемлем для любого честного немца». Его уход отражает глубокий моральный и политический кризис, охвативший молодую Республику.\n\nПоскольку угроза возобновления военных действий нависла, Национальное собрание назначило Густава Бауэра главой нового правительства. Перед ним стоит невыполнимая задача — подписать договор, который большинство считает предательством, — лидерство Бауэра начинается под тяжёлой тенью."
 ww1_german_interwar.2.a: "Ему придётся его подписать."
 ww1_german_revolution.8.t: "Германия принимает новую конституцию"
 ww1_german_revolution.8.d: "В Германии официально принята новая конституционная система, устанавливающая федеральную полупрезидентскую республику на смену павшему имперскому порядку. Документ закрепляет гражданские свободы, всеобщее избирательное право и федеральную структуру — знаменуя решительный разрыв с прошлым.\n\nЭтот шаг многими наблюдателями рассматривается как основа для возобновления демократического управления в стране, всё ещё оправляющейся от войны, революции и социальных волнений. Удастся ли новой республике выдержать растущее давление, остаётся неясным — но пока что правовой порядок восстановлен."
 ww1_german_revolution.8.a: "Республика, рождённая в трудные времена."
 ww1_german_revolution.16.t: "Провозглашена Бременская советская республика!"
 ww1_german_revolution.16.d: "Во время революции Совет рабочих и солдат сместил Сенат Бремена. После того, как были даны заверения в сохранении частной собственности и заручено согласие существующего административного аппарата, Совет объявил выборы, ограниченные членами левых партий и аффилированных профсоюзов: Социал-демократической партии большинства, Независимой социал-демократической партии и недавно сформированной Коммунистической партии Германии. Четыре дня спустя большинство НСДПГ-КПГ провозгласили Бременскую советскую республику."
 ww1_german_revolution.16.a: "Когда они уже научатся..."
 ww1_german_revolution.9.t: "Армия разваливается"
 ww1_german_revolution.9.d: "Революция не только свергла монархию, она разрушила саму ткань армии. По всей стране солдаты массово покидают свои посты и направляются домой — многие всё ещё вооружены, многие разочарованы, некоторые радикализированы. Целые полки распадаются за ночь, в то время как казармы переходят под контроль местных солдатских советов.\n\nПравительство, само недавно сформированное и хрупкое, не обладает властью, чтобы управлять хаосом. Война окончена, но мир не подписан. До тех пор нет формального конца, есть лишь опасный вакуум дисциплины и власти."
 ww1_german_revolution.9.a: "Мы должны попытаться удержать центр… как-нибудь."
 ww1_german_revolution.10.t: "Демобилизация продолжается в хаосе"
 ww1_german_revolution.10.d: "Несмотря на попытки правительства Эберта контролировать процесс демобилизации, ситуация остаётся хаотичной. Вокзалы заполнены возвращающимися войсками, часто всё ещё вооружёнными и без командования. Дезертирство продолжается, и местные советы бессильны поддерживать порядок.\n\nМногие ветераны начинают тяготеть к возникающим военизированным формированиям. Такие группы, как фрайкор, «Стальной шлем», «Вервольф» и «Айнвонервейр», предлагают структуру, оплату и чувство цели среди послевоенной неразберихи. В то время как некоторые видят в них необходимый противовес революционным силам, другие опасаются, что они могут стать собственной угрозой."
 ww1_german_revolution.10.a: "Настоящая армия ополчения"
 ww1_german_revolution.17.t: "Курт Эйснер убит!"
 ww1_german_revolution.17.d: "В разгар Германской революции [BAY.GetNameDef] была установлена после свержения монархии. Однако правящая социалистическая партия не пользовалась поддержкой большинства населения, а забастовки и протесты были широко распространены. В результате президент Курт Эйснер проиграл выборы и был застрелен правым националистом по пути в парламент, чтобы подать в отставку.\nВ его отсутствие советы и социалисты сформировали коалиционное парламентское правительство, но в течение месяца оно было атаковано коммунистами и анархистами, и режим рухнул. Первым главой государства, пришедшим к власти, был Эрнст Толлер."
 ww1_german_revolution.17.a: "Слишком много всего происходит, чтобы понять..."
 ww1_german_revolution.14.t: "Восстание спартакистов подавлено"
 ww1_german_revolution.14.d: "Отряды фрайкора из района Берлина вошли в город, как и Гвардейская кавалерийская дивизия. Берлинские газеты приветствовали вступление войск после окончания боёв как восстановление «мира и порядка». За военной оккупацией последовали многочисленные случаи насилия, совершённые правыми войсками, далеко превосходящие предыдущие акты насилия со стороны некоторых левых."
 ww1_german_revolution.14.a: "Это должно было быть сделано."
 ww1_german_revolution.14.b: "Спартакисты успешно бегут в Мюнхен!"
 ww1_german_revolution.18.t: "Аннексия Баварии"
 ww1_german_revolution.18.d: "Во время Германской революции Бавария некоторое время находилась вне контроля центрального правительства в Берлине, но наконец стало возможным навести порядок и восстановить законную администрацию в Баварии. Фрайкор заслуживает большой похвалы за это."
 ww1_german_revolution.18.d_alt: "Во время Германской революции Бавария некоторое время находилась вне контроля центрального правительства в Берлине, но поскольку у всех нас одна цель — установление социалистического государства ради рабочих и народа — мы наконец договорились об интеграции в единое государство."
 freikorps.12.a: "Бавария возвращается в лоно отечества."
