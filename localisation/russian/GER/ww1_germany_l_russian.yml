 ww1_germanrework.1.t: "Позор Германии"
 ww1_germanrework.1.d: "Несмотря на грандиозное позёрство и бряцание оружием, конечным результатом Агадирского кризиса стал дипломатический конфуз. Этот кризис не только выявил слабую позицию Германии на мировой арене, но также больно ударил по её репутации. Неспособность добиться каких-либо существенных результатов в противостоянии с Францией вызвала широкую критику как со стороны правительства, так и со стороны широкой общественности. Фесский мирный договор, завершивший кризис, привёл к тому, что Германия получила незначительные уступки в Конго, в то время как Франция укрепила свою власть в Марокко, что стало явным показателем дипломатического провала Германии.\n\nОбщественная и политическая реакция была особенно резкой в отношении канцлера Теобальда фон Бетман-Гольвега, чьё руководство ситуацией было сочтено слабым и нерешительным. Многие считают его руководство ответственным за национальное унижение, утверждая, что более жёсткая позиция или лучшая тактика ведения переговоров могли бы привести к более благоприятным результатам. Популярность канцлера резко упала, и всё чаще раздаются призывы к его отставке в качестве средства восстановления уверенности в способности правительства отстаивать интересы и престиж Германии на мировой арене. Теперь перед кайзером стоит вопрос о том, заменить ли Бетман-Гольвега в надежде на возрождение руководства или пережить нынешние политические потрясения с прежним руководством."
 ww1_germanrework.1.a: "Бетман-Гольвег остаётся."
 ww1_germanrework.1.b: "Кайзер заставит Бетман-Гольвега уйти в отставку."
 ww1_germanrework.2.t: "Кайзер назначит фон Хайдебранда"
 ww1_germanrework.2.d: "Смелым и решительным шагом Кайзер Вильгельм II назначил Эрнста фон Хайдебранда унд дер Лазу новым канцлером Германской Империи. Восхождение такой фигуры, известной своим консерватизмом и неколебимой преданностью прусским идеалам, как фон Хайдебранд несомненно приведёт в движение политический ландшафт империи.\n\nРодившийся в аристократичной семье Эрнст фон Хайдебранд долгое время был видным деятелем немецкой консервативной партии. Его карьера характеризовалась пылким отстаиванием сохранения немецких традиционных ценностей и порядков. Как ярый противник либерализма и социализма, фон Хайдебранд последовательно отстаивал политику поддержки монархических, военных и сельских интересов, которые составляют основу его поддержки.\n\nОжидается, что пребывание фон Хайдебранда на этом посту ознаменует начало эры усиления консервативного управления. С его репутацией человека железной воли и непоколебимых принципов, он, как ожидается, укрепит видение Кайзера о сильной, единой Германии, готовой утвердить своё влияние на европейской арене. Тем не менее, это назначение не прошло без заминок, поскольку оно чревато углублением разногласий внутри Рейхстага и среди населения, которое всё больше беспокоится о сохранении статус-кво."
 ww1_germanrework.2.a: "Удачи новому канцлеру"
 ww1_germanrework.19.t: "Взгляд направо"
 ww1_germanrework.19.d: "Новый канцлер не такой убеждённый переговорщик, каким был Бетман-Гольвег, и теперь ему придется склонять правых на свою сторону, если он хочет остаться у власти. Консерваторы-традиционалисты и пангерманские националисты рассматривают это как возможность укрепить своё влияние среди правых фракций, на которые опирается новый канцлер, чтобы остаться у власти. Эти националистические группы, движимые желанием восстановить престиж Германии после кризиса и проводить более агрессивную национальную политику, борются за контроль и стремятся протолкнуть свои планы в Рейхстаге.\n\nВ условиях этой внутренней борьбы за власть канцлер сталкивается с ещё одной серьёзной проблемой: надвигающейся угрозой со стороны социал-демократической партии на предстоящих выборах 1912 года. Растущая популярность СДПГ представляет значительный риск для стабильности и консервативных ценностей нынешней администрации. Чтобы сохранить власть и предотвратить потенциальную смену политического курса, канцлер должен ориентироваться в сложной динамике правой политики, умиротворяя влиятельные фракции, а также разрабатывая стратегии, направленные на то, чтобы ограничить привлекательность СДПГ для масс. Следующие несколько месяцев будут решающими в определении будущего направления развития Германии, поскольку новый канцлер стремится консолидировать власть и провести нацию через эти неспокойные времена."
 ww1_germanrework.19.a: "Канцлеру следует действовать осторожно."
 ww1_germanrework.89.t: "Встреча в Потсдаме"
 ww1_germanrework.89.d: "Мы получили предложение от германского правительства этим утром, приглашающее царя на встречу с Кайзером Вильгельмом в Потсдаме. Заявленная повестка дня касалась наших соответствующих сфер влияния в Персии. Не видя особых сложностей в переговорах, царь согласился встретиться со своим немецким кузеном.\n\nВстреча была тёплой, и представители обеих сторон часто соглашались друг с другом по вопросам ближневосточной внешней политики. Однако атмосфера изменилась, когда немецкая делегация предложила официальное публичное заявление о том, что ни одна из империй не предпримет враждебных действий против другой. Столкнувшись с этим неожиданным требованием заключить пакт о ненападении, наши две страны не смогли достичь официального соглашения."
 ww1_germanrework.89.a: "Они зашли слишком далеко."
 ww1_germanrework.90.t: "Разочарование в Потсдаме"
 ww1_germanrework.90.d: "Русский царь и его делегаты встретились с Кайзером в Потсдаме. На протяжении всего мероприятия атмосфера была довольно тёплой, и многие делегаты пришли к единому мнению по вопросам внешней политики на Ближнем Востоке. Два кузена, Вильгельм и Николай, тоже, казалось, хорошо ладили. Однако, несмотря на такое позитивное начало, переговоры в конечном счёте провалились. Наше предложение о заключении пакта о ненападении, направленное на обеспечение мира между нашими империями, оказалось неприемлемым для русских. В результате никакого официального соглашения подписано не было, и делегации разъехались с чувством упущенной возможности. Возможно, будущие обстоятельства позволят возобновить диалог между Германией и Россией."
 ww1_germanrework.90.a: "Ну хоть в чём-то мы согласны."
 ww1_germanrework.91.t: "Возобновление Тройственного Союза"
 ww1_germanrework.91.d: "Возобновление Тройственного Союза было дипломатическим процессом с участием Германии, Италии и Австро-Венгрии; это событие дало возможность союзникам встретиться в Вене. Германию представлял Готлиб фон Ягов, государственный секретарь по иностранным делам. Австро-Венгрия направила своего министра иностранных дел графа Берхтольда. Италию представлял министр иностранных дел Антонино ди Сан-Джулиано.\n\nВо время этой сдержанной конференции три союзника обсудили сферы влияния в Северной Африке, а также взаимные гарантии того, что в случае войны ни одна из сторон не заключит сепаратный мир. Помимо простого возобновления центрального сотрудничества, это мероприятие стало возможностью подтвердить приверженность каждой из сторон Тройственному Союзу."
 ww1_germanrework.91.a: "Утомительная необходимость."
 ww1_germanrework.91.b: "Будем надеяться, что этого хватит, чтобы сдержать Россию."
 ww1_germanrework.91.c: "Мы должны примирить итальянские и австрийские амбиции!"
 ww1_germanrework.91.e: "Превосходно."
 ww1_germanrework.92.t: "Немецкий контроль над бухарестскими газетами"
 ww1_germanrework.92.d: "В результате шокирующего поворота событий нам стало известно, что влиятельные газеты «Саэра» и «Минерва», принадлежащие скандальному Александру Богдану-Питешти, были проданы немецкому консорциуму. Эти газеты сейчас открыто распространяют прогерманскую пропаганду по всему Бухаресту, подрывая нашу национальную решимость и военные усилия в критический момент. Этот акт подрывной деятельности нельзя игнорировать."
 ww1_germanrework.92.a: "Закрыть их, сейчас же!"
 ww1_germanrework.93.t: "Немецкий контроль над прессой"
 ww1_germanrework.93.d: "Поскольку наша страна вступила в войну, мы обнаружили, что влиятельные газеты «Слово» и «Отечество» были проданы консорциуму, имеющему тесные связи с Германской империей. Последствия этого незамедлительны и опасны: эти газеты начали распространять пропаганду в пользу Центральных Держав, прямо угрожая дестабилизировать наши военные усилия изнутри."
 ww1_germanrework.93.a: "Этой подрывной деятельности должен прийти конец!"
 ww1_germanrework.94.t: "Голландский контракт с «Вулкан»"
 ww1_germanrework.94.d: "[HOL.GetNameDefCap] заключило контракт с нашей верфью «Вулкан» на строительство четырёх современных торпедных катеров. Учитывая растущую напряжённость в Европе, было бы неразумно передавать эти военные корабли нейтральной державе. У нас есть уникальная возможность приостановить поставку и реквизировать эти суда для Кайзерлихемарине, укрепив наш собственный флот за счёт голландцев."
 ww1_germanrework.94.a: "Корабли будут служить империи."
 ww1_germanrework.94.b: "Нам следует соблюсти условия контракта."
 ww1_germanrework.95.t: "Германия захватывает наши торпедные катера!"
 ww1_germanrework.95.d: "Мы подписали контракт с немецкой фирмой «Вулкан» на строительство четырёх торпедных катеров типа «Z-1». Теперь, когда их строительство завершено, нам сообщили, что [GER.GetForeignNameDefCap] вмешалась. Корабли поставлены не будут. Этот вопиющий захват нашей собственности, кораблей, которые мы приобрели на законных основаниях, является вопиющим нарушением нашего контракта и глубоким оскорблением нашего суверенитета."
 ww1_germanrework.95.a: "Возмутительно!"
 ww1_germanrework.96.t: "«Вулкан» доставляет новые корабли"
 ww1_germanrework.96.d: "Строительство четырёх торпедных катеров типа «Z-1», которые мы заказали у немецкой фирмы «Вулкан», наконец завершено. Несмотря на напряжённую международную обстановку, [GER.GetForeignNameDefCap] выполнила условия сделки, и производитель сообщил нам, что корабли переданы Королевским ВМФ Нидерландов. Скоро они будут готовы к эксплуатации."
 ww1_germanrework.96.a: "Превосходно!"
 ww1_germanrework.97.t: "Германия предлагает промышленную поддержку"
 ww1_germanrework.97.d: "Наш немецкий союзник предлагает повышенную промышленную, военную и технологическую помощь в поддержку развития нашей военной промышленности. В добавок, предложив кредиты под малый процент, они такж предлагают помощь своих советников и передачу некоторых патентов, чтобы облегчить модернизацию нашей промышленности. Несмотря на щедрость такого предложения, мы рискуем стать сателлитом Германской империи, если уже не стали..."
 ww1_germanrework.97.a: "Мы примем любую помощь!"
 ww1_germanrework.97.b: "Мы в состоянии справиться сами."
 ww1_germanrework.98.t: "Австрийское сотрудничество"
 ww1_germanrework.98.d: "Как мы и предпологали, Австрия пошла на сотрудничество и приняла предложение нашей помощи, что, несомненно, ускорит рост их военной промышленности."
 ww1_germanrework.98.a: "Хорошо."
 ww1_germanrework.99.t: "Австрийское неповиновение"
 ww1_germanrework.99.d: "К нашему большому удивлению, Австро-Венгрия наотрез отказалась от нашего предложения помощи, заявив, что их экономическая программа и так достаточно процветает, и что они останутся суверенной державой. Это неожиданное проявление гордости вызывает беспокойство."
 ww1_germanrework.99.a: "Им же хуже."
 ww1_germanrework.100.t: "Улучшение военного и научно-исследовательского сотрудничества"
 ww1_germanrework.100.d: "Германские и австрийские военные эксперты встретились для обсуждения потенциала компании «Шкода» в производстве тяжёлых орудий и пушек. Немцы выразили заинтересованность в австрийских 305-мм сверхтяжёлых гаубицах производства «Шкоды». Такая крепостная артиллерия доказала свою необычайну эффективность в ходе первоначальных испытаний, и некоторые отзывы о них позволили начать работу по усовершенствованию вращающейся оси. В целях увеличания дальности рассматривается и второй проект по увеличению ствола, который придаст этому оружию потенциал гаубицы очень большой дальнобойности."
 ww1_germanrework.100.a: "Мы могли бы извлечь из этого большую пользу."
 ww1_germanrework.101.t: "Назначение нового колониального секретаря"
 ww1_germanrework.101.d: "Место в Имперском Колониальном Управлении (Reichskolonialamt) требует от нас выбора нового государственного секретаря, и этот выбор в значительной степени повлияет на управление нашими заморскими территориями. Пред нами стоит выбор меж двумя кандитатурами:\n\nВильгельм Зольф представляет реформистское крыло. Как дипломат, имеющий опыт в колониальной администрации, он выступает за более примирительную политику, стремясь повысить эффективность и потенциально ослабить напряжённость в отношениях с колониальным населением посредством административных реформ, а не применения силы.\n\nВ противовес ему, Эдуард фон Либерт выступает за жесткий милитаристский подход. Бывший губернатор с репутацией безжалостного человека и прочными связями с националистическими и пангерманскими кругами, он выступает за утверждение непоколебимого немецкого господства и агрессивную колониальную эксплуатацию, невзирая на человеческие жертвы. Его назначение будет означать приверженность силовой экспансии и контролю."
 ww1_germanrework.101.a: "Нам нужны реформы Зольфа."
 ww1_germanrework.101.b: "Фон Либерт утвердит наше господство."
 ww1_germanrework.102.t: "Акт о чрезвычайных полномочиях"
 ww1_germanrework.102.d: "Чтобы позволить империи финансировать войну любыми необходимыми средствами, парламент принял закон, разрешающий введение исключительных мер, продиктованных правительством. Таким образом, Кайзер и OHL могут управлять страной посредством декретов, что упрощает военное законодательство и открывает перед нами множество перспектив. Помимо этих торжеств, важно отметить, что парламент может в любой момент отозвать это исключительное разрешение, что стало бы катастрофой для военных усилий."
 ww1_germanrework.102.a: "Коалиция должна держать позиции!"
 ww1_germanrework.175.t: "Закон о вспомогательной службе"
 ww1_germanrework.175.d: "Чтобы добиться всеобщей мобилизации, требуемой программой Гинденбурга, Верховное командование сухопутных войск провело через Рейхстаг Закон о вспомогательной службе. Новый закон предоставляет государству широкие полномочия по привлечению всех гражданских рабочих к военным действиям. Однако за эти полномочия пришлось заплатить высокую политическую цену. Чтобы заручиться поддержкой социалистов и их влиятельных профсоюзов, мы были вынуждены официально признать их и поручить создать рабочие арбитражные комитеты. Хотя на данный момент это обеспечило мир в промышленности, оно также значительно расширило возможности тех самых групп, которые ещё могут выступить против войны."
 ww1_germanrework.175.a: "Необходимый, хотя и опасный компромисс."
 ww1_germanrework.176.t: "Отречение Вильгельма II"
 ww1_germanrework.176.d: "Потеряв поддержку своих военных советников и осознав, что продолжение его правления, вероятно, приведёт к дальнейшим гражданским беспорядкам и кровопролитию, Кайзер Вильгельм II отрёкся от престола. Он отправился в изгнание в Нидерланды, чтобы избежать судебного преследования."
 ww1_germanrework.176.a: "Lebewohl für immer."
 ww1_germanrework.177.t: "Эрих фон Фалькенхайн освобождён от своих двойных обязанностей"
 ww1_germanrework.177.d: "Будучи одновременно военным министром и начальником Генерального штаба, Эрих фон Фалькенхайн был отправлен в отставку с поста военного министра Пруссии."
 ww1_germanrework.177.a: "Нельзя усидеть на двух стульях разом."
 ww1_germanrework.178.t: "Лев Африки"
 ww1_germanrework.178.d: "Депеша, доставленная на дерзкой подводной лодке, прорвавшей блокаду, принесла отличные новости из наших колоний. Генерал Пауль фон Леттов-Форбек официально принял командование всеми вооружёнными силами в германской Восточной Африке.\n\nНедавно сформированные бригады аскари встали под его знамёна, создав небольшое, но элитное подразделение закалённых ветеранов, готовых к бою. Из своей штаб-квартиры в Дар-эс-Саламе фон Леттов-Форбек уже начал подготовку к началу своей нетипичной кампании против Антанты. «Лев Африки» теперь на свободе, и он заставит врага дорого заплатить за каждый дюйм нашей колониальной земли."
 ww1_germanrework.178.a: "Мы безгранично верим в его способности.я"
 ww1_germanrework.179.t: "Смерть Хельмута фон Мольтке"
 ww1_germanrework.179.d: "Скончался Гельмут фон Мольтке Младший, человек, который занимал пост начальника Генерального штаба в начале Великой войны и был освобождён от своих обязанностей после битвы на Марне.\n\nМольтке, живший в относительной безвестности с 1914 года, внезапно скончался. Сегодня, 18 июня 1916 года, во время посещения государственной панихиды в Рейхстаге по покойному фельдмаршалу Кольмару фон дер Гольцу, у него случился смертельный инсульт. Человека, чьё имя навсегда будет связано с началом войны, больше нет."
 ww1_germanrework.179.a: "Трагический конец для несчастного человека."
 ww1_germanrework.180.t: "Альфред фон Тирпиц угрожает отставкой из-за ограничений на использование подводных лодок"
 ww1_germanrework.180.d: "Не имея возможности руководить военно-морскими операциями со своей чисто административной должности, Тирпиц стал ярым сторонником неограниченной подводной войны, которая, по его мнению, могла бы лишить Британию продовольствия и вынудить её пойти на опредёленные условия. С изменением политики он начал агитировать против всех ограничений, используя немецкую прессу и угрозы уйти в отставку."
 ww1_germanrework.180.a: "Вы даже не уделяли особого внимания подводным лодкам!"
 ww1_germanrework.181.t: "Альфред фон Тирпиц уходит в отставку"
 ww1_germanrework.181.d: "Его волнения привели к ссоре с Кайзером, и когда ограничения на подводную войну не были сняты, он в конце концов подал в отставку."
 ww1_germanrework.181.a: "Вот тебе и всё."
 GER_coalition_collapse: "§RКоалиция развалится, и мы потеряем безоговорочную поддержку Рейхстага.§!"
 GER_viability_of_the_coalition: "Burgfriedenspolitik и её жизнеспособность"
 GER_viability_of_the_coalition_desc: "Коалиция «крепость мира», созданная канцлером Бетман-Гольвегом, хрупка, и с каждым днём равновесие в Рейхстаге становится всё более неустойчивым. Если нам не удастся сохранить единство в военное время, мы рискуем потерять всё."
 GER_idea_coalition_benefits: "Burgfriedenspolitik и её приемущества"
 GER_idea_coalition_benefits_desc: "Политическое перемирие в Рейхстаге защищает нас от протестов и забастовок, позволяя нам сосредоточиться на войне без организованной оппозиции. "
 GER_free_belgium: "После §YВеликой воны§!, §Y[BEL.getFlag]Бельгия§! будет освобождена как §Yнезависимая страна§!."
 GER_puppet_belgium: "После §YВеликой воны§!, §Y[BEL.getFlag]Бельгия§! будет освобождена как §Yмарионетка§! под нашим контролем."
 GER_get_congo: "В качестве компенсации германских потерь, §YКонго§! будет передан §Y[GER.getFlag]Германии§!."
 tt_while_ongoing: "Пока миссия продолжается, мы будет полчать бонусы от:"
 ww1_germanrework.103.t: "Силезия за Тироль?"
 ww1_germanrework.103.d: "Канцлер Германии Теобальд фон Бетман-Гольвег отправился в Вену, чтобы обсудить концессионный план, направленный на постоянное смягчение напряжённых австро-итальянских отношений. Зная о трудностях нашей армии, министр предложил обменять свою территорию, если мы согласимся выполнить требования Италии.\n\nДругими словами, мы могли бы предложить Тироль и получить взамен Силезию. Это предложение очень привлекательно; Силезия является промышленно развитой территорией и населена немецкоговорящими жителями, что является нашим преимуществом."
 ww1_germanrework.103.a: "Это честная сделка."
 ww1_germanrework.103.b: "Никогда!"
 ww1_germanrework.104.t: "Тироль за гарантии?"
 ww1_germanrework.104.d: "Мы приняли австрийскую делегацию, которая предложила ослабить территориальную напряжённость в Тироле. Австро-Венгерская монархия, похоже, серьёзно относится к своему подходу и предложила уступить часть своей территории, то есть весь Тироль, в обмен на восстановление дружественных отношений между двумя странами. Более формально это, по крайней мере, помешало бы нам объявить им войну."
 ww1_germanrework.104.a: "Это честная сделка."
 ww1_germanrework.104.b: "Никогда!"
 ww1_germanrework.105.t: "Австрийский отказ"
 ww1_germanrework.105.d: "Несмотря на все наши усилия, Австро-Венгрию не убедил предложенный нами обмен. Похоже, они опасаются, что даже этого грандиозного жеста будет недостаточно для удовлетворения амбиций Италии."
 ww1_germanrework.105.a: "Черт их побери!"
 ww1_germanrework.106.t: "Италия отказывается от переговоров"
 ww1_germanrework.106.d: "Несмотря на все наши усилия, Италию не убедило австро-германское предложение, возможно, опасаясь предательства или полагая, что они могут добиться большего с помощью войны."
 ww1_germanrework.106.a: "Черт их побери!"
 ww1_germanrework.107.t: "Мир в Альпах"
 ww1_germanrework.107.d: "Дипломатия умиротворения, начатая канцлером Германии Бетман-Гольвегом, принесла свои плоды; итальянское правительство пообещало не вступать в войну против Центральных Держав и, возможно, даже поддержит нас в нашей войне. Это крупная дипломатическая победа, предотвращающая открытие нового фронта на Западе."
 ww1_germanrework.107.a: "Триумф дипломатии!"
 need_AUS_ITA_approval: "§Y[AUS.getFlag]Австрия§!, а затем и §Y[ITA.getFlag]Италия§! должны принять соглашения, чтобы бонусы начали действовать."
 ITA_AUS_appeasement: "Австро-итальянский территориальный спор урегулирован"
 ww1_germanrework.83.t: "Германия приглашает Виконта Холдейна"
 ww1_germanrework.83.d: "Германское правительство во главе с про-британским канцлером Теобальдом фон Бетман-Гольвегом пригласило его близкого друга, Виконта Ричарда Холдейна, в Германию, ища дипломатического согласия между странами в попытке прекратить гонку морских вооружений. Мнения в парламенте разделились, но наше правительство готово предложить Германии следующие условия:\n\n1. Германия признает военно-морское превосходство Великобритании и прекратит любое увеличение расходов на флот, предпочтительно сократив их.\n2. Великобритания не будет вмешиваться в германские колониальные амбиции и, после обсуждения, будет готова помочь Германии в отдельных вопросах колониальных дел.\n3. Будущие переговоры с целью предотвращения вступления какой-либо из держав в войну друг против друга приветствуются."
 ww1_germanrework.83.a: "Отправим Холдейна и посмотрим, чего сможем достичь."
 ww1_germanrework.83.b: "Никаких переговоров с немцами."
 ww1_germanrework.84.t: "Великобритания отказывается от дипломатических переговоров"
 ww1_germanrework.84.d: "К нашему большому разочарованию, британцы, похоже, не заинтересованы в переговорах с нами. Увы, вместо этого адмирал Тирпиц убедил Кайзера заставить Рейхстаг как можно скорее принять новый закон о флоте, чтобы расширить германский флот."
 ww1_germanrework.84.a: "Им не сказать потом, что мы не пытались!"
 ww1_germanrework.85.t: "Британия отправляет Виконта Холдейна, Тирпиц требует новый закон ВМФ"
 ww1_germanrework.85.d: "Великобритания согласилась направить Виконта Холдейна с дипломатической миссией в Германию. По прибытии он предоставил правительству и Кайзеру следующие условия соглашения:\n\n1. Германия признает военно-морское превосходство Великобритании и прекратит любое увеличение расходов на флот, предпочтительно сократив их.\n2. Великобритания не будет вмешиваться в германские колониальные амбиции и, после обсуждения, будет готова помочь Германии в отдельных вопросах колониальных дел.\n3. Будущие переговоры с целью предотвращения вступления какой-либо из держав в войну друг против друга приветствуются.\n\nРейхстаг поддержал эту миссию, но адмирал Тирпиц осудил её и вместо этого попросил Кайзера принять новый закон о ВМФ, который вновь привёл бы к обострению военно-морской напряжённости между двумя странами."
 ww1_germanrework.85.a: "Мы должны сами выковать свою судьбу на море! Принять закон!"
 ww1_germanrework.85.b: "Добиться нейтралитета Британии — уже большая победа."
 ww1_germanrework.86.t: "Германия объявляет о новом расширении ВМФ"
 ww1_germanrework.86.d: "Вскоре после высадки Виконта Холдейна в Германии Кайзер имел наглость провести его по верфям Вильгельмсхафена и пошутить о расширении германского флота! Это оскорбление стало ещё обиднее, когда вскоре было объявлено о принятии Рейхстагом нового закона о флоте, который ещё больше увеличит германский флот. Вскоре после этого Холдейн отказался от своего предложения о мире и вернулся в Великобританию."
 ww1_germanrework.86.a: "Высокомерие немцев не знает границ."
 ww1_germanrework.87.t: "Германия принимает наш договор"
 ww1_germanrework.87.d: "Премьер-министр с радостью объявил стране о подписании соглашения между Германией и Великобританией, положившего конец гонке военно-морских вооружений. Это соглашение знаменует собой завершение периода разрядки между двумя странами, и теперь может начаться эпоха примирения. Обеспечив превосходство Великобритании на море, наша страна снова может стоять уверенно."
 ww1_germanrework.87.a: "Солнце никогда не заходит над Британской империей"
 ww1_germanrework.88.t: "Примирение Великобритании и Германии"
 ww1_germanrework.88.d: "По всей Европе министерства иностранных дел Франции и России полны тревоги. После периода разрядки напряжённости между Великобританией и Германией обе страны пришли к соглашению, признающему превосходство Великобритании на море и, в свою очередь, дистанцирующему её присутствие от Антанты. Это соглашение может стать предвестником заключения новых договоров между двумя странами, которые обяжут Великобританию придерживаться нейтралитета в будущих европейских конфликтах."
 ww1_germanrework.88.a: "Как удобно для немецких экспансионистов!"
 ww1_germanrework.88.b: "Как удобно для нас!"
 ww1_germanrework.45.t: "Имперский бюджет 1912 года"
 ww1_germanrework.45.d: "В Рейхстаге бушуют дебаты по поводу нового федерального бюджета. Учитывая растущие требования промышленности, рабочих и армии, Германии предстоит определить приоритеты в распределении ресурсов. Либералы и сторонники социальных реформ призывают к инвестициям в социальное обеспечение, инфраструктуру и образование. Консерваторы и офицерский корпус требуют увеличения военных расходов и расширения колониальной собственности. Выбранный нами путь определит будущее империи."
 ww1_germanrework.45.a: "Либеральный бюджет для модернизации Рейха."
 ww1_germanrework.45.b: "Консервативный бюджет — власть через силу."
 ww1_germanrework.3.t: "Забастовки в Гамбурге"
 ww1_germanrework.3.d: "Ранее этим утром на судостроительных верфях Габмурга, нашего главного морского торгового порта, была объявлена забастовка, согласно последним данным, около десяти тысяч рабочих оставили свои рабочие места. Забастовка была поддержанна (и организована) Немецким Союзом Транспортных Рабочих, которая была той ещё головной болью для Кайзра с момента её создания в этом году; подчеркивая для многих в империи и за её пределами, что подъём социализма в Германии представляет реальную угрозу власти Кайзера.\n\nЗачинщики угрожают продолжить забастовку пока не будут выполнены их требования по повышению зарплат и сокращению рабочего дня. Хотя эти требования были безрезультатными, поскольку работодатели упорно отказывали бастующим, опасаясь, что уступки приведут к дальнейшим забастовкам. Только время покажет, будут ли выполнены требования бастующих, но в любом случае Германия, несомненно, вскоре столкнётся с новыми забастовками."
 ww1_germanrework.3.a: "Мы должны пойти навстречу бастующим."
 ww1_germanrework.4.t: "Столкновения с бастующими в Берлине"
 ww1_germanrework.4.d: "В промышленном центре Берлина, районе Моабит, царит хаос. Из-за смертельной конкуренции в угольной промышленности рабочие компании «Kupfer and Co.» (недавно купленной самым безжалостным капиталистом страны — Гуго Стиннесом), пострадавшие от этой конкуренции в виде снижения заработной платы и тяжёлых условий труда, начали масштабную забастовку, в ходе которой десятки тысяч рабочих отсутствовали на угольных шахтах. Изначально мирная демонстрация получила поддержку общественности и быстро переросла в насилие, в результате которого угольным колоннам в городе пришлось предоставлять полицейское сопровождение, что привело к ожесточенным столкновениям между протестующими и правоохранительными органами.\n\nНекогда спокойные улицы Моабита превратились в поле боя. Баррикады из обломков блокируют основные перекрестки, витрины магазинов разбиты, а крики эхом разносятся по всему району. Масштабы беспорядков беспрецедентны: в них принимают участие тысячи протестующих, которые даже критикуют Кайзера и его администрацию.\n\nПравоохранительным органам удалось взять ситуацию под контроль, но эти события, безусловно, увеличат значительную поддержку социализма в Берлине — можно, по крайней мере, надеяться, что насилию будет положен конец."
 ww1_germanrework.4.a: "Чёртовы социалисты."
 ww1_germanrework.5.t: "Бурные дебаты по «Королевскому гражданскому списку»"
 ww1_germanrework.5.d: "Сегодня в Ландтаге (Палате представителей) Пруссии разгорелись жаркие дебаты, когда был поднят вопрос о «Королевском гражданском списке». По просьбе Кайзера, предлагается повысить выплаты из государственного бюджета королевской семье.\n\nВо время дебат представитель социал-демократов, Адольф Гофман, заявил перед собранием, что Кайзер уже получает ежедневный доход в размере 43065 марок, даже без учёта предлагаемого повышения. Эта резкая критика вызвала возмущение среди центристских и правых фракций палаты представителей. Председатель Ландтага зашёл так далеко, что назвал Гофмана «предателем».\n\nХотя само по себе повышение почти наверняка пройдёт, этот инцидент подверг ревизионистское крыло СДПГ повышенному вниманию со стороны правых, поставив под сомнение их лояльность после такой, казалось бы, «предательской» позиции."
 ww1_germanrework.5.a: "Гофман прав. Кайзер не нуждается в дополнительных средствах!"
 ww1_germanrework.5.b: "Чёртовы предатели! Кайзер заслуживает нашей преданности!"
 ww1_germanrework.6.t: "«Центр» критикует антисемитизм в армии"
 ww1_germanrework.6.d: "На заседании Рейхстага партия «Центр» выразила обеспокоенность усилением антисемитской риторики в политической жизни Германской империи. Лидеры партии подчеркнули важность соблюдения принципов равенства и уважения ко всем гражданам, независимо от их религиозной принадлежности.\n\nЭта критика знаменует собой важный момент, поскольку «Центр», традиционно ориентированный на умеренную и прагматичную политику, призывает к более инклюзивному и толерантному подходу. Представители партии заявили, что укрепление единства и взаимного уважения имеет решающее значение для стабильности и прогресса страны.\n\nРеакция на эту позицию была неоднозначной. Некоторые политические деятели и слои населения приветствовали призыв «Центра» к умеренности, рассматривая его как необходимый шаг к более гармоничному обществу. Другие же, однако, отвергли его как излишне идеалистичный и оторванный от преобладающих настроений."
 ww1_germanrework.6.a: "Это вызывает некоторое беспокойство..."
 ww1_germanrework.7.t: "Избирательная реформа в Гессене"
 ww1_germanrework.7.d: "Великое герцогство Гессен реформировало избирательное законодательство. Старая система цензового избирательного права, основанная на имущественном цензе, была отменена, она была заменена системой множественного голосования, которая предоставляет право повторного голоса всем гражданам мужского пола старше пятидесяти лет. Социал-демократы осудили этот консервативный компромисс, призванный уравновесить эффект более широкого избирательного права. Этот шаг только укрепил их кампанию за подлинное равное избирательное право."
 ww1_germanrework.7.a: "Странный какой-то прогресс."
 ww1_germanrework.8.t: "Соглашение об ограничении вооружений с Великобританией?"
 ww1_germanrework.8.d: "Британское правительство направило делегацию в [ROOT.capital.GetCapitalVictoryPointName] в надежде подписать соглашение о взаимном ограничении производства вооружений. Англия действительно стремится снизить напряжённость в Европе, что, естественно, подразумевает снижение военной эскалации в регионе. Такой пакт мог бы улучшить наш имидж в глазах британцев, одновременно перенаправив часть нашего бюджета на другие цели... Однако мы не можем быть уверены, что война не разразится, так или иначе."
 ww1_germanrework.8.a: "Увы, нам придется отказаться."
 ww1_germanrework.8.b: "Благородное начинание. Мы согласимся."
 GER_anglo_german_arms_limitations: "Англо-[ROOT.getAdjective]ий пакт по ограничению вооружений"
 ww1_germanrework.9.t: "[FROM.getNameDefCap] отказывается от договора"
 ww1_germanrework.9.d: "[FROM.getAdjective]ое правительство отклонило наше предложение по взаимнуому ограничению вооружений. В письме, полученном нашей делегацией, [FROM.getLeader] заверил нас в своих добрых намерениях по отношению к нашей стране, добавив, что угрозы со стороны третьих сторон мешают ему подписать такое соглашение."
 ww1_germanrework.9.a: "Как и ожидалось..."
 ww1_germanrework.10.t: "[FROM.getNameDefCap] подписывает договор по ограничению вооружений с Британией"
 ww1_germanrework.10.d: "\nПосле нескольких дней переговоров британское правительство и [FROM.getAdjective]ое правительство заключили пакт об ограничении запасов оружия. Соглашение, подписанное в [FROM.capital.GetCapitalVictoryPointName]е, предусматривает постепенное сокращение производства обеими странами в надежде распространить это движение по всей Европе, а затем и по всему миру."
 ww1_germanrework.10.a: "Один маленький шаг к миру."
 ww1_germanrework.11.t: "Забастовки в Руре"
 ww1_germanrework.11.d: "Ранее на этой неделе в Рурском регионе 170000 шахтёров оставили свои рабочие места и начали бастовать, требуя повышения зарплаты на 15 процентов. На данный момент владельцы шахт ещё даже не пытались договориться с забастовщиками, явно планируя переждать забастовку. Забастовка была спровоцирована падением уровня жизни и безопасности на шахтах.\n\nСДПГ выразила свою поддержку бастующим, используя их как трамплин для завоевания поддержки среди местных рабочих. В ответ Партия Центра сдвинулась вправо, предложив финансовую помощь владельцам шахт, чтобы компенсировать их убытки."
 ww1_germanrework.11.a: "Мы не будем вести переговоры с профсоюзами."
 ww1_germanrework.11.b: "Ради общего блага мы должны начать переговоры."
 ww1_germanrework.12.t: "Авария на шахте в Руре"
 ww1_germanrework.12.d: "В этот знаменательный для Рейха день Кайзер Вильгельм недавно посетил место аварии на шахте в Рурской области, чтобы почтить память погибших шахтёров. На данный момент общее число погибших составляет 115 человек. Это произошло после забастовок на шахтах в начале этого года, и авария дала крайне левым Рура повод вновь начать призывать к забастовкам. Пока Кайзер и его народ скорбят по погибшим, в ближайшее время в прессе будет опубликован ответ правительства на аварию."
 ww1_germanrework.12.a: "Печальный день для Рейха."
 ww1_germanrework.18.t: "Результаты национальной переписи населения"
 ww1_germanrework.18.d: "Результаты национальной переписи населения были представлены и изучены администрацией. После рассмотрения результатов был подготовлен документ, который будет направлен в Рейхстаг и Кайзеру для ознакомления с выводами. В этих документах подчёркивается, что на значительной части территории империи отсутствует жизненно важная инфраструктура по сравнению с нашими конкурентами в Европе, массовая урбанизация привела к нехватке жилья, а рост общественного здравоохранения минимален, а в некоторых городах даже замедлился. Эти выводы сильно обеспокоили канцлера, который стремится внести изменения в законодательство, выделить новые государственные инвестиции и привлечь иностранных экспертов для помощи в строительстве новой канализационной системы, чтобы бороться с плохим состоянием общественного здравоохранения в наших ключевых городах.\n\nРезультаты национальной переписи оказались не такими, как многие ожидали, и, без сомнения, сыграют большую роль в стремлении левых увеличить социальные расходы империи."
 ww1_germanrework.18.a: "Возможно, немецкое общество не так прогрессивно, как мы думали..."
 ww1_germanrework.20.t: "Кайзер созывает военный совет"
 ww1_germanrework.20.d: "Кайзер созвал в Берлине Военный совет с участием высшего военного руководства Германской империи. Ожидается, что темы для обсуждения будут касаться напряжённой военной и дипломатической ситуации в Европе. Конкретные темы, естественно, будут посвящены «Большой военной программе» России, озабоченности Австро-Венгрии военными действиями Сербии и отношениям империи с Великобританией.\n\nСреди известных участников — Тирпиц, Мюллер, Молькте и Хееринген, а также представители армии и военно-морского флота.\n\nПоскольку приготовления и разговоры о месте Германии в европейской войне с каждым днём приближают войну к Рейху, нет сомнений, что вскоре будет принят закон о расширении вооружённых сил Германии, чтобы соответствовать новой военной эре."
 ww1_germanrework.20.a: "Большая война на горизонте."
 ww1_germanrework.21.t: "Вильгельмовская Германия"
 ww1_germanrework.21.d: "Взойдя на престол в 1888 году, кайзер Вильгельм II открыл эпоху, отмеченную ростом национальных амбиций и промышленной мощи. Подпитываемая ярым национализмом и верой в военную силу, [GER.GetForeignNameDef] проводит «Вельтполитику» — стремление к глобальному влиянию и «месту под Солнцем» — и это определяет её действия на мировой арене.\n\nПод влиянием стремительной индустриализации [GER.GetForeignNameDef] преобразилась и стала экономическим центром, изменив при этом и свой народ. Эта экономическая мощь подпитывает морские аппетиты адмирала фон Тирпица, нацеленные бросить вызов британской морской мощи.\n\nВнутри страны подъём Социал-демократической Партии (СДПГ), отстаивающей интересы растущего рабочего класса, создаёт внутренние политические трения с консервативным истеблишментом.\n\n[GER.GetForeignNameDef]  стремясь к глобальному влиянию отказалась от тщательно продуманной сети союзов Бисмарка в пользу «Политики свободных рук» (Politik der freien Hand). Такой напористый подход, ставящий во главу угла дипломатическую гибкость, а не установленные обязательства, усилил напряжённость в отношениях с другими европейскими державами и способствовал возникновению ощущения «окружения» со стороны Антанты. Тем не менее, Тройственный Союз, в котором состоят [AUS.GetAuhNameDef] и [ITA.GetNameDef] представляет собой важный противовес.\n\nМогущественную и амбициозную Вильгельмовскую Германию ждёт непростое будущее, в которой царят внутренние раздоры и международная напряжённость."
 ww1_germanrework.21.a: "Германия уверенно идёт своим курсом."
 ww1_germanrework.22.t: "Социал-демократия в Германской Империи"
 ww1_germanrework.22.d: "Социал-демократическая Партия Гермнаии (СДПГ) значительно выросла после объединения, заняв доминирующее положение среди левых в Рейхстаге наряду с Прогрессивной Народной Партией (ПНП). Этот рост отражается в растущей мощи профсоюзов, подпитываемой промышленным ростом Германии.\n\nОднако ухудшение условий труда на фоне растущего производственного спроса привело к росту волнений среди рабочих, состоящих в профсоюзах. Несмотря на то, что в настоящее время профсоюзы децентрализованы и у них отсутствует единое руководство, они могут нанести ущерб экономике, если их жалобы будут проигнорированы. Правительство должно действовать осторожно, балансируя между уступками рабочим и необходимостью умиротворить могущественные консервативные силы в Рейхстаге и среди истеблишмента."
 ww1_germanrework.22.a: "Требования социалистов не должны отвлекать нас."
 ww1_germanrework.23.t: "Хлипкое правое крыло"
 ww1_germanrework.23.d: "Правое крыло Германии, состоящее из консервативных, сельских и националистических партий, всегда пользовалось поддержкой как аристократии, так и фермеров. Однако упадок правого крыла становится всё более очевидным по мере того, как вторая промышленная революция стала катализатором формирования левых профсоюзов и усилила поддержку социал-демократов. В связи с этим многие консервативные партии начали корректировать свою политику, чтобы сохранить поддержку своих ключевых избирателей; консерваторы продолжают выступать за самодостаточную экономику, менее зависимую от торговли, особенно с такими странами, как Великобритания, которые представляют угрозу амбициям Германии, а агрономы призывают к освобождению фермеров от налогов, чтобы оказать им поддержку, необходимую для того, чтобы прокормить недавно перееховшее в города население. Если правые хотят возродиться, они должны поставить перед собой чёткую цель, которой смогут следовать правые партии, иначе правые будут раздавлены волной социал-демократии."
 ww1_germanrework.23.a: "Возможно, правых ещё можно возродить..."
 ww1_germanrework.24.t: "Основание Франкфуртского университета"
 ww1_germanrework.24.d: "Университет во Франкфурте-на-Майне был основан 28 сентября 1912 года, когда городское правительство Франкфурта приняло решение о создании университета. Он берёт свое начало в Университете имени Гёте, который был основан в 1484 году, но официально не считался таковым в соответствии с немецкими обычаями, поскольку почти полвека не выдавал ученых степеней. Финансируется несколькими людьми и группами, в частности, торговцами ценными бумагами из семьи Шпайер; Вильгельмом Ральфом Мертоном, основателем «Металлгезелльшафт»; Артур фон Вайнберг, совладелец исторической химической компании «Касселла» и бывший директор Общества изучения природы Зенкенберга, а также различные другие семьи и местная элита.\n\nКоролевское одобрение университета во Франкфурта-на-Майне было получено 10 июня 1914 года, а набор начался в середине октября."
 ww1_germanrework.24.a: "Немецкий разум никогда не будет запятнан."
 ww1_germanrework.25.t: "Эйнштейн прибывает в Германию"
 ww1_germanrework.25.d: "Альберту Эйнштейну, известному физику-теоретику, недавно предложили работу в качестве директора нового физического института имени Кайзера Вильгельма, а также членство в Прусской академии наук и Берлинской академии Гумбольдта, чтобы получать финансирование для проведения исследований. Макс Планк — физик-теоретик, занимавший пост президента Немецкого физического института с 1905 по 1909 год и создатель постоянной Планка, и Вальтер Нернст — друг кайзера Вильгельма II и физик-термодинамик — убедили Эйнштейна занять эти должности."
 ww1_germanrework.25.a: "Великим умам мы только рады!"
 ww1_germanrework.40.t: "Создание OHL"
 ww1_germanrework.40.d: "После образования Германской империи в 1871 году прусская армия, королевская саксонская армия, армия Вюртемберга и баварская армия в мирное время были автономны, и каждое королевство имело отдельное военное министерство и генеральный штаб для управления своими войсками. В случае начала войны конституция Германской империи гарантирует, что германский император будет назначен главнокомандующим объединёнными армиями.\n\nС началом войны Верховное Командование сухопутных войск станет высшим эшелоном командования сухопутных войск Германской империи, возглавляемым генералом Мольтке. OHL разделена на подразделения, которые будут контролировать различные районы страны, а также следить за политикой и экономикой, чтобы обеспечить максимальную эффективность производства для армии.\n\nВ дополнение к Генеральному штабу полевой армии, Высшее армейское командование состоит из Военного кабинета императора, генерал-интенданта (отвечающего за снабжение), старших советников в различных областях (артиллерия, инженеры, медицина, телеграф, боепрпасы и железные дороги) и представителей четырёх военных министерств Германии, а также представители стран Центральных Держав."
 ww1_germanrework.40.a: "Значит, война."
 ww1_germanrework.41.t: "Блок центра"
 ww1_germanrework.41.d: "Германский центр был доминирующей силой в политике управления империей с момента её создания. Центристов возглавляет пользующаяся доверием партия «Центр», которая была создана в 1870 году и успешно боролась против культуркампфа канцлера Отто фон Бисмарка. Вскоре она получила четверть мест в рейхстаге, а её промежуточная позиция по большинству вопросов позволила ей сыграть решающую роль в формировании большинства. Однако в Германии существует множество центристских партий, которые стремятся провести умеренные социальные реформы, сохраняя при этом традиционные немецкие ценности.\n\nЕсли Германия хочет сохранить стабильность в течение следующего десятилетия, центристы должны сохранить свою власть в Германии, чтобы в Бундесрат было внесено умеренное количество правых и левых законов. К счастью, многие ключевые политические фигуры Германии, такие как Теобальд фон Бетман-Гольвег, поддерживают центристов и помогли им сохранить большинство в рейхстаге."
 ww1_germanrework.41.a: "Немного империализма не повредит."
 ww1_germanrework.42.t: "Дело пангерманцев"
 ww1_germanrework.42.d: "Пангерманизм имел большое влияние на немецкую политику в XIX веке во время объединения Германии, когда Германская империя была провозглашена национальным государством в 1871 году, но без Габсбургской Австрии, Люксембурга и Лихтенштейна их цели так и не были по-настоящему достигнуты. После объединения, с конца XIX века, многие мыслители-пангерманисты, которые с 1891 года были организованы в Пангерманский союз, приняли открыто этноцентристские и расистские идеологии, даже призывая к аннексии Австрии. Организация оказывала значительную поддержку образованному среднему и высшему классу, пропагандируя немецкое националистическое сознание, особенно среди этнических немцев за пределами Германии. В своем трёхтомном труде «Deutsche Politik» (1905-07) Хассе призывал к германской империалистической экспансии в Европе, что многие в Союзе приняли близко к сердцу.\n\nОднако с начала нового тысячелетия пангерманисты заняли умеренную позицию по отношению к Австрии, сосредоточившись на претензиях к России и Франции. Похоже, на данный момент пангерманисты отказались от политики аннексии в отношении Австрии."
 ww1_germanrework.42.a: "Германия должна идти твердым курсом."
 ww1_germanrework.42.b: "Нам нужно искать убежища слева."
 ww1_germanrework.42.c: "У них действительно есть несколько весомых доводов..."
 GER_diamond_profits: "Прибыль от продажи алмазов"
 ww1_germanrework.15.t: "Предложение из Берлина"
 ww1_germanrework.15.d: "Мы получили официальное предложение от Германского колониального ведомства относительно огромных минеральных богатств бассейна реки Конго. Они предлагают создать совместное предприятие между нашими колониальными администрациями для координации и расширения добычи алмазов как в Бельгийском Конго, так и на прилегающих территориях.\n\nВ их предложении утверждается, что совместные усилия приведут к повышению эффективности и прибыльности для обеих наших стран. Немцы ждут нашего ответа."
 ww1_germanrework.15.a: "Очень прибыльное предприятие. Мы согласны."
 ww1_germanrework.15.b: "Мы не позволим втянуть себя в их колониальные планы."
 ww1_germanrework.16.t: "Положительный ответ из Брюсселя"
 ww1_germanrework.16.d: "Правительство Бельгии приняло наше предложение относительно сотрудничества в бассейне реки Конго. Их колониальная администрация получила указание сотрудничать с нашей, чтобы начать расширять операции по добыче алмазов.\n\nЭто соглашение, несомненно, окажется выгодным для обеих империй."
 ww1_germanrework.16.a: "Замечательно. За наше взаимное процветание!"
 ww1_germanrework.17.t: "Бельгийский отказ"
 ww1_germanrework.17.d: "Из Брюсселя поступила дипломатическая телеграмма. Бельгийское правительство официально отклонило наше предложение совместной добычи алмазов в бассейне реки Конго.\n\nХотя этот результат разочаровывает, он не является полностью неожиданным. Их осторожность — это их потеря."
 ww1_germanrework.17.a: "Да будет так. Мы продолжим в одиночку."
 ww1_germanrework.43.t: "Меньшинства"
 ww1_germanrework.43.d: "Объединение Германии под Пруссией охватило обширные территории, населённые ненемецкими народами, прежде всего поляками и датчанами. Несмотря на продолжающуюся политику германизации, в этих регионах сохраняется молчаливое культурное сопротивление, бросая вызов самой идее однородного имперского государства.\n\nЭтот давно назревавший вопрос теперь обсуждается в Рейхстаге. Центристские и левые фракции, которых возглавляет канцлер Теобальд фон Бетман-Гольвег, выступают за расширение прав меньшинств. Они верят, что предоставление им тех же государственных льгот и правовой защиты, что и этническим немцам, повысит лояльность и укрепит империю изнутри. И наоборот, националистические и правые элементы требуют более строгого подхода, предлагая ограничить права негерманцев, чтобы перенаправить ресурсы на улучшение положения «истинных» немцев."
 ww1_germanrework.43.a: "Равенство обеспечит их лояльность."
 ww1_germanrework.43.b: "Германская империя для поляков? Не думаю."
 ww1_germanrework.44.t: "Статус ВМФ"
 ww1_germanrework.44.d: "Под руководством адмирала Тирпица ВМФ Германии быстро расширялся. Он твёрдо убежден, что Германии нужен мощный флот, чтобы конкурировать с Великобританией и обеспечить своё будущее. При Кайзере Вильгельме II уже были приняты четыре военно-морских закона, и Тирпиц, вероятно, готовится к принятию пятого.\n\nВоенно-морской флот представляет собой значительную силу, однако, если Германия действительно намерена бросить вызов британскому военно-морскому превосходству, потребуются значительно большие инвестиции в военно-морское производство, чтобы соответствовать их огромной мощи."
 ww1_germanrework.44.a: "Вперёд, к нашему месту под солнцем!"
 ww1_germanrework.46.t: "Мольтке освобождён от командования"
 ww1_germanrework.46.d: "Неудача нашего первоначального наступления, не приведшая к быстрой победе, и последующий переход к позиционной войне на Западном фронте взяли своё. Здоровье Хельмута фон Мольтке-младшего, начальника Генерального штаба, пошатнулось из-за огромного напряжения, что сделало его непригодным к службе.\n\nКайзер был вынужден «отправить» его в отставку, назначив его преемником военного министра Пруссии Эриха фон Фалькенхайна. Есть надежда, что более прагматичный подход Фалькенхайна позволит нам стабилизировать фронт на Западе и одновременно добиться решающей победы над Россией на Востоке."
 ww1_germanrework.46.a: "Надеюсь, Фалькенхайну это по силам."
 ww1_germanrework.47.t: "Фалькенхайн смещён с поста главнокомандующего"
 ww1_germanrework.47.d: "Вопреки ожиданиям Фалькенхайна, Антанта смогла избежать больших потерь в дивизиях, отправленных на фронт. Перемещение дивизий взад и вперёд было аналогично работе «нории», типа водяного колеса, которое непрерывно поднимает воду и сливает её в желоб, что позволило антанте сорвать план Фалькенхайна.\n\nВдобавок ко всему, и Гинденбург, и Людендорф ясно дали понять, что уйдут со своих постов, если Фалькенхайн не будет смещён, а Гинденбург не будет назначен главой OHL, используя его неудачи для достижения своих целей, и у Кайзера не останется иного выбора, кроме как согласиться."
 ww1_germanrework.47.a: "Надеюсь, Гинденбургу это по силам."
 ww1_germanrework.48.t: "Канцлер выступает за мир"
 ww1_germanrework.48.d: ""
 ww1_germanrework.48.a: "Как он посмел! Кайзер должен немедленно уволить его"
 ww1_germanrework.52.t: "Предложение из Берлина"
 ww1_germanrework.52.d: "После успеха миссии Холдейна мы получили запрос от Германии поддержать их в их требовании аннексировать португальскую Анголу. Хотя Португалия и является нашим союзником некоторое время, мы в то же время пообещали Германии поддержать их колониальные амбиции по мере возможности... Что ставит нас в весьма затруднительное положение. Тем не менее, витает мнение, что в случае нашей поддержки Германии, Португалия охотнее пойдёт на удовлетворение немецких требований."
 ww1_germanrework.52.a: "Хорошо, мы предложим нашу дипломатическую поддержку."
 ww1_germanrework.52.b: "Точно нет. Португальцы могут довериться нам."
 ww1_germanrework.53.t: "Британцы согласны"
 ww1_germanrework.53.d: "Британцы решили придерживаться строке договора Холдейна и поддержать нас дипломатически, не требуя аннексии Анголы. Теперь, когда мы заручились британский поддержкой, мы можем предъявить наши требования немедленно и начать оккупацию Анголы."
 ww1_germanrework.53.a: "Замечательно!"
 ww1_germanrework.54.t: "Британский отказ"
 ww1_germanrework.54.d: "Чёртовы британские олухи отказались следовать духу Холдейнских соглашений. Без их поддержки требовать Анголу — глупость. По некоторым сообщениям Кайзер в ярости из-за своего британского кузена и уже публично оклеветал королевскую семью в национальных газетах. Пропасть между Соединённым королевством и Германией никогда не была так глубока."
 ww1_germanrework.54.a: "Коварный Альбион!"
 ww1_germanrework.55.t: "Германия требует Анголу"
 ww1_germanrework.55.d: "Ранее этим утром посольства Германии и Британии совместно вручили нам ультиматум с требованием немедленной передачи Анголы в качестве уплаты «долга» немцам. Наша ситуация ужасна, а выступление Британии заодно с немцами вообще ставит под вопрос целесообразность сопротивления. Многие в администрации просто заявили, что у нас не осталось иного выбора, кроме как уступить... хотя мы всегда можем обратиться к французам с просьбой помочь обуздать этих фрицев."
 ww1_germanrework.55.a: "У нас нет выбора, кроме как уступить."
 ww1_germanrework.55.b: "Следует сейчас же позвать на помощь французов!"
 ww1_germanrework.56.t: "Португалия уступает Анголу"
 ww1_germanrework.56.d: "Чудесные новости из-за рубежа! Португалия уступила нашим требованиям по передаче Анголы и наша администрация уже начала продвигаться вглубь колонии. Эта победа вызвала позитивную реакцию в Германии, а также повысило поддержку народом текущего правительства и все мало-мальски значимые газеты ратовали за «победу десятилетия» Бетмана-Гольвега. Достаточно сказать, что теперь мы можем спокойно греться под палящим солнцем Анголы."
 ww1_germanrework.56.a: "Славная победа на дипломатическом поле!"
 ww1_germanrework.57.t: "Португалия уступила Анголу"
 ww1_germanrework.57.d: "Хорошие новости из Германии, они подтвердили передачу Португалией контроля над Анголой Германской колониальной администрации. Наша поддержка Германии принесла свои плоды: нам удалось избежать более масштабного кризиса и успокоить Германию, не отдалившись от Португалии. Однако мы уже получили гневные жалобы от французского министерства иностранных дел за нашу поддержку Германии, так что на восстановление доверия французов уйдёт время."
 ww1_germanrework.57.a: "Предотвращён ещё один кризис."
 ww1_germanrework.58.t: "Португалия обращается к Франции"
 ww1_germanrework.58.d: "Тревожные новости из Португалии: они пока официально не отреагировали на требования Германии о передаче Анголы и обратились к Франции с просьбой о дипломатической поддержке. Хотя Франция всё ещё может отказаться, вынудив Португалию отступить, если Франция поддержит Португалию, разрядить ситуацию будет непросто, потребуется деликатный подход."
 ww1_germanrework.58.a: "Будем надеяться, что ситуация не обострится..."
 ww1_germanrework.59.t: "Португальские дипломаты прибывают в Париж"
 ww1_germanrework.59.d: "Мы получили тревожное заявление от Португалии сегодня, ранее на этой неделе им был предъявлен ультиматум от Британии и Германии, требующий передачи Анголы Германии. Теперь Португалия просит нас о помощи и даже о защите от возможных попыток агрессоров взять Анголу силой. Большинство в правительстве встревожено возможным началом войны с СК и Центральными Державами, но в то же время германские амбиции необходимо держать в узде."
 ww1_germanrework.59.a: "Мы должны защитить Португалию!"
 ww1_germanrework.59.b: "Это не наша забота."
 ww1_germanrework.60.t: "Португалия заручается французской поддержкой!"
 ww1_germanrework.60.d: "Франция пришла на помощь Португалии и ясно дала нам и британцам понять, что любое действие против Португалии будет воспринято как действие против Франции. Хотя поход на попятную и будет дипломатическим провалом, разумеется мы не будем рисковать войной ради Анголы... даже если британцы продолжат нас поддерживать."
 ww1_germanrework.60.a: "Мы не отступим!"
 ww1_germanrework.60.b: "У нас нет выбора, кроме как отозвать наши требования."
 ww1_germanrework.61.t: "Франция отказывается помочь!"
 ww1_germanrework.61.d: "Катастрофа. Франция отклонила нашу просьбу о помощи, оставив нас в позиции ещё хуже, чем было. В условиях растущего на нас давления, вынуждающего ответить на ультиматум, похоже, мы вынуждены сдать Анголу. Нас бросили на произвол судьбы против голодного немецкого пса."
 ww1_germanrework.61.a: "Мы должны отступить."
 ww1_germanrework.62.t: "Германия просит помощи против Франции"
 ww1_germanrework.62.d: "После того, как Франция выступила в защиту Португалии, Германия, похоже, не собирается отступать и вместо этого попросила нас заверить их в нашей безоговорочной поддержке в борьбе с Францией и Португалией. Хотя мы обязаны поддержать Германию, тем более что мы уже оказывали ей дипломатическую поддержку, сейчас у нас есть последний шанс избежать того, что может обернуться гораздо более серьёзным конфликтом...\n\nБудущее Европы может зависеть от нашего выбора."
 ww1_germanrework.62.a: "Мы должны помочь нашему союзнику."
 ww1_germanrework.62.b: "Нет. Это зашло слишком далеко."
 ww1_germanrework.63.t: "Германия отступает"
 ww1_germanrework.63.d: "После того, как правительству Германии стало известно, что французы пришли на помощь Португалии, канцлер рихстага сказал Кайзеру, что он должен дать указание правительству пересмотреть свои требования. Вильгельм прислушался к просьбе своего канцлера и с тех пор снял свои требования.\n\nСлава богу, что фрицы отступили..."
 ww1_germanrework.63.a: "Что ж, с этим мы разобрались."
 ww1_germanrework.64.t: "Германия отступает"
 ww1_germanrework.64.d: "Германия аннулировала свои требования по Анголе, что значит, что португальские колонии в безопасности от немецкого пса! Поддержка французского правительства практически вынудила Кайзера отдать приказ своему правительству отступить, кто бы мог подумать, что этот дурак может заставить свою нацию страдать от ещё большего позора?"
 ww1_germanrework.64.a: "Великая победа!"
 ww1_germanrework.65.t: "Португалия отступает"
 ww1_germanrework.65.d: "Французское правительство, отказавшее Португалии в просьбе о помощи, обрекло Португалию на то, что она будет вынуждена уступить нашим требованиям. Аннексия Анголы произойдёт незамедлительно, и наша колониальная администрация уже работает над тем, чтобы включить колонию в состав Германской империи. К счастью, в Анголе уже существует сильное экономическое присутствие Германии, что позволяет нам быстро ввести в действие нашу новую администрацию."
 ww1_germanrework.65.a: "Великолепная дипломатическая победа!"
 ww1_germanrework.66.t: "Португалия отступает"
 ww1_germanrework.66.d: "Французское правительство, отвергнув просьбу Португалии о помощи, обрекло Португалию на то, что она будет вынуждена уступить нашим требованиям. Германия уже начала аннексию Анголы, и ожидается, что вскоре она установит там свою собственную администрацию. В то время как будущее португальских колоний остается неопределенным, эта победа Германии подчеркивает наши новые отношения с кайзером."
 ww1_germanrework.66.a: "Кризис разрешён."
 ww1_germanrework.67.t: "Война разразилась в Европе!"
 ww1_germanrework.67.d: "Война в Европе! После отказа Португалии выполнять требования Британии и Германии по передаче Анголы обе державы объявили войну Португалии. Помимо этого, Франция пришла на помощь Португалии в попытке сдерживания германских амбиций. Без сомнения, другие европейские страны вскоре включатся в конфликт, включая Россию и Австрию.\n\nСпустя столетия человечество задастся вопросом, почему такой масштабный конфликт начался всего лишь из-за одной колонии..."
 ww1_germanrework.67.a: "Война, что покончит со всеми войнами."
 ww1_germanrework.68.t: "Соединённое Королевство отказывается помочь нам"
 ww1_germanrework.68.d: "Британцы сбежали, поджав хвост, поскольку Франция пришла на помощь Португалии. Хотя наше правительство в ярости на британцев, ещё предстоит определить дальнейшие действия, возможно, мы сможем справиться с ними самостоятельно... в конце концов, мы уже делали это однажды, мы можем сделать это снова."
 ww1_germanrework.68.a: "Мы не отступим!"
 ww1_germanrework.68.b: "У нас нет выбора, кроме как отозвать наши требования."
 ww1_germanrework.69.t: "Германия воюет с Францией!"
 ww1_germanrework.69.d: "Война в Европе! После отказа Португалии выполнять требования Британии и Германии по передаче Анголы Германия объявила Португалии войну, что примечательно, без поддержки Британии. Помимо этого, Франция пришла на помощь Португалии в попытке сдерживания германских амбиций. Без сомнения, другие европейские страны вскоре включатся в конфликт, включая Россию и Австрию.\n\nСпустя столетия человечество задастся вопросом, почему такой масштабный конфликт начался всего лишь из-за одной колонии..."
 ww1_germanrework.69.a: "Сможет ли Германия победить?"
 ww1_germanrework.70.t: "Германия пасует перед Францией"
 ww1_germanrework.70.d: "Потребовав от Португалии передачи Анголы при поддержке Соединённого Королевства, Германия впоследствии отозвала свои требования после того, как её сообщник, Великобритания, отказалась от своей поддержки после вмешательства Франции. Это ещё одно из длинной череды внешнеполитических конфузов Германии при Кайзере Вильгельме II."
 ww1_germanrework.70.a: "Неожиданное предательство."
 ww1_germanrework.49.t: "Коалиция военного времени"
 ww1_germanrework.49.d: "Теперь, когда Германия втянута в войну, Рейхстаг несёт ответственность за то, чтобы OHL могло выполнять свои обязанности перед империей, не проходя через бесконечную государственную бюрократию. Таким образом, канцлер Бетман-Гольвег объединил Рейхстаг в целом в коалицию, которая сможет принимать законы без противодействия. Эта коалиция позволит гражданскому правительству остаться у власти, однако коалиция в лучшем случае нестабильна, поскольку часть крыла СДПГ откровенно игнорирует коалицию своей антивоенной риторикой, а призыв правых к отставке СДПГ из Рейхстага мало что сделает для сохранения коалиции.\n\nЕсли мы хотим гарантировать, что гражданское правительство не уступит власть OHL, мы должны обеспечить выживание этой коалиции."
 ww1_germanrework.49.a: "Мир — Рейхстагу, война — фронту."
 ww1_germanrework.71.t: "Париж взят"
 ww1_germanrework.71.d: "Блестящие, если не сказать чудесные новости с фронта были подтверждены ранее сегодня — немецкая армия захватила Париж, французы вполне могут сейчас капитулировать, но в любом случае это крупная победа вооружённых сил, которые теперь наверняка сосредоточатся на достижении краха остальной Антанты. OHL предложило правительству принять крайние меры, чтобы гарантировать, что наша армия сможет уничтожить русских, а не проявлять осторожность и рисковать затягиванием войны."
 ww1_germanrework.71.a: "Вперёд, Германия!"
 ww1_germanrework.72.t: "Фронт встал"
 ww1_germanrework.72.d: "Что касается новостей с фронта, которые дошли сегодня до Кайзера, то немецкая армия становится всё более неэффективной после неудачи с захватом Парижа и наших заявлений о том, что война будет быстрой. В то время как OHL принимает меры для обеспечения стабильности армии, чтобы продолжать попытки прорыва к Парижу, очевидно, что в ближайшие дни военные потерпят неудачу. Только бог сможет нам помочь."
 ww1_germanrework.72.a: "Это не хорошо."
 GER_sokehs_rebellion: "Сокехское восстание"
 GER_sokehs_rebellion_desc: "Недовольство сокехского народа на острове Понпеи вылилось в открытое восстание. Это восстание бросает вызов имперской власти и угрожает стабильности в регионе. Мы должны действовать решительно, чтобы подавить это восстание и восстановить имперский контроль над Понпеи."
 GER_sokehs_mission_countdown: "Восстание крепнет"
 GER_sokehs_mission_countdown_desc: "Эта задание будет повторяться до тех пор, пока мы не разберёмся с восстанием."
 GER_deal_with_sokehs_rebellion: "Подавить сокехское восстание"
 sokehs_rebellion_ongoing: "Сокехское восстание продолжается"
 sokehs_rebellion_crushed: "Сокехское восстание было подавлено"
 ww1_germanrework.13.t: "Вспыхнуло Сокехское восстание"
 ww1_germanrework.13.d: "Пришли донесения из Германской Новой Гвинеи, описывающие вооружённое восстание среди сокехского народа на острове Понпеи. Повстанцы, по-видимому, спровоцированные спорами из-за земли и требований колониальной администрации о принудительном труде, атаковали немецкие позиции и бросили вызов местным властям. Этот вопиющий вызов имперскому правлению недопустим и требует немедленного вмешательства."
 ww1_germanrework.13.a: "Эти беспорядки должны быть немедленно пресечены!"
 ww1_germanrework.14.t: "Сокехское восстание подавлено"
 ww1_germanrework.14.d: "Наши силы в Немецкой Новой Гвинее сообщают об успехах в подавлении Сокехского восстания. После решительного сопротивления основные повстанческие элементы были разгромлены или сдались после прибытия крейсеров ВМС. Главари и многие участники в настоящее время находятся под нашим арестом и ожидают суда за свои действия против Германской империи."
 ww1_germanrework.14.a: "Казнить всех ответственных в назедание остальным"
 ww1_germanrework.14.b: "Заключить виновных в тюрьму и приговорить их к принудительным работам."
 ww1_germanrework.26.t: "В Цаберне назревает кризис"
 ww1_germanrework.26.d: "В гарнизонном городе Цаберн молодой секунд-лейтенант Гюнтер фон Форстнер публично оскорбил местных жителей Эльзаса. В сообщениях прессы цитируются слова Форстнера, сказанные своим войскам: «Если на вас нападут, применяйте оружие; Если же при этом кто-то из вас заколет одного из вакес, тот получит от меня 10 марок».\n\nПресса подхватила этот инцидент, разжигая местные настроения и вызывая резкие протесты против действий военных в Эльзасе-Лотарингии."
 ww1_germanrework.26.a: "Мы будем следить за развитием событий."
 ww1_germanrework.27.t: "Новые неприятности в Цаберне"
 ww1_germanrework.27.d: "После событий, произошедших ранее на этой неделе, под давлением властей Эльзаса и СДПГ военные сочли целесообразным назначить Форстнеру домашний арест сроком на 7 дней, который позже был отменён на втором слушании по его делу. К сожалению, общественность Эльзаса, не впечатлённая этими действиями, продолжила протестовать. В качестве ещё одной провокации, как сообщалось, лейтенант Форстнер вышел на улицу и вызвал раздражение общественности после того, как его наказание было отменено. Вскоре после этого перед казармами снова собралась огромная толпа людей, что привело к тому, что военный суд назвал «неадекватной контрреакцией войск»."
 ww1_germanrework.27.a: "Будем надеяться, скоро всё утихнет..."
 ww1_germanrework.27.b: "Послушать Бетман-Гольвега и наказать Форстнера."
 ww1_germanrework.28.t: "Цабернский инцидент"
 ww1_germanrework.28.d: "Цабернский инцидент перерастает в национальный кризис, намного превосходящий первоначальные ожидания Кайзера. По всей стране распространились протесты в поддержку требований справедливости эльзасцев. Ситуация ухудшилась после того, как пресса сообщила, что жене пришлось уговаривать Кайзера отказаться от поездки на охоту, чтобы разрешить кризис, и что теперь он отстраняет канцлера от встреч, прислушиваясь только к советам военных.\n\nКанцлер Теобальд фон Бетман-Гольвег теперь в безвыходном положении. Он исполняет свой долг перед Кайзером, но Рейхстаг призывает вынести ему вотум недоверия, чтобы выразить своё неодобрение. Для сохранения своей должности и ради блага его государства Бетман-Гольвег мог бы присоединиться к призывам депутатов Рейхстага к справедливости."
 ww1_germanrework.28.a: "Канцлер останется верен Кайзеру."
 ww1_germanrework.28.b: "Бетман-Гольвег встаёт на сторону Рейхстага."
 ww1_germanrework.29.t: "Вотум недоверия"
 ww1_germanrework.29.d: "Как и предсказывалось, рейхстаг вынес вотум недоверия руководству канцлера Теобальда фон Бетман-Гольвега.\n\nНа этой неделе канцлер выступил с первой речью в защиту своего правительства. Он оставался непреклонным, твёрдо защищая действия кайзера и военного командования. Это мало способствовало его сближению с рейхстагом; на протяжении всей его речи левые партии демонстрировали явные признаки протеста. Сегодня утром он произнёс заключительную речь, обращаясь к политическому центру в надежде, что их голосов окажется достаточно, чтобы переломить ситуацию."
 ww1_germanrework.29.a: "Жребий брошен."
 ww1_germanrework.30.t: "Голоса подсчитаны"
 ww1_germanrework.30.d: "После напряжённого заседания в Рейхстаге голоса были подсчитаны. Результат — поражение правительства. Теперь официально объявлено, что действия канцлера не отражают волю Рейхстага.\n\nХотя этот вотум юридически не обязывает Бетман-Гольвега уйти в отставку, тем более что Кайзер не выказывает желания его уволить, дальнейшее пребывание у власти обнажило бы пределы немецкой демократии и непоправимо запятнало бы репутацию канцлера."
 ww1_germanrework.30.a: "Бетман-Гольвег продолжит идти своим путём."
 ww1_germanrework.30.b: "Канцлер уходит в отставку."
 ww1_germanrework.31.t: "Старый порядок удерживается"
 ww1_germanrework.31.d: "События последних нескольких недель наконец завершились, почти не затронув верхи власти, к великому разочарованию левых партий. Канцлер продолжает свою работу, теперь уже в оппозиции к СДПГ, но сумев умиротворить военных. Цабернский инцидент запомнится как серьёзное испытание нашей власти в Эльзас-Лотарингии. Остаётся лишь надеяться, что эльзасский народ поспешит принять свою немецкую идентичность."
 ww1_germanrework.31.a: "Возвращается неспокойная стабильность."
 ww1_germanrework.32.t: "Скорое разрешение"
 ww1_germanrework.32.d: "Решив наложить на лейтенанта фон Форстнера быстрое наказание, Кайзер предотвратил политический и конституционный кризис. Будучи проинформирован об обостряющейся ситуации, он прервал свою охотничью поездку и приказал наказать Форстнера. Рейхстаг и местные эльзасцы успокоены, но, как и следовало ожидать, военное руководство чувствует себя оскорблённым и опозоренным этим прямым вмешательством в свои дела."
 ww1_germanrework.32.a: "Всем не угодишь."
 ww1_germanrework.33.t: "Конституционный кризис"
 ww1_germanrework.33.d: "Встав на сторону Рейхстага, канцлер фон Бетман-Гольвег открыто бросил вызов влиянию военных на гражданские дела. Теперь он и законодательная власть едины в противостоянии традиционной власти Генерального штаба. Умиротворение Рейхстага, несомненно, разозлит военное командование, но это может быть необходимо для сохранения гражданского правительства. Настало время решить, где в Германской империи находится высшая власть."
 ww1_germanrework.33.a: "Укрепить Бетман-Гольвега. Военные должны знать своё место."
 ww1_germanrework.33.b: "Уволить Бетман-Гольвега. Власть армии абсолютна."
 ww1_germanrework.34.t: "Цабернский инцидент"
 ww1_germanrework.34.d: "В городе Цаберн в Эльзас-Лотарингии разгорелся политический и социальный скандал, обнаживший глубокую напряжённость между военной властью и гражданским обществом. Инцидент начался со стычки между солдатом и гражданскими лицами, которая переросла в применение чрезмерной военной силы и произвольные аресты. Местные военные командиры проигнорировали озабоченность граждан, что ещё больше разожгло общественное возмущение. Это дело теперь стало общенациональной проблемой, и фракции в Рейхстаге, особенно социал-демократы, требуют ответственности и реформ."
 ww1_germanrework.34.a: "Мундир Кайзера должно уважать при любых обстоятельствах!"
 ww1_germanrework.34.b: "Военные не стоят выше закона!"
 ww1_germanrework.34.c: "У армии есть некоторые проблемы со своим положением."
 ww1_germanrework.73.t: "Krupp и Vickers объявляют о совместном промышленном предприятии"
 ww1_germanrework.73.d: "В замечательном событии представители Friedrich Krupp AG и Vickers Ltd. подписали официальное соглашение о создании совместного промышленного консорциума. Это предприятие, названное беспрецедентным, будет способствовать технологическому сотрудничеству, совместному использованию ресурсов и скоординированным исследованиям в области металлургии, тяжёлого машиностроения и военно-морской инженерии.\n\nБудучи внешне коммерческим, предприятие имеет глубокие политические последствия. На протяжении десятилетий Krupp и Vickers символизировали гонку морских вооружений между Германией и Британией. Многие рассматривают тот факт, что две фирмы теперь работают бок о бок, как признак стратегической разрядки.\n\nМИД Германии приветствовал эту новость, назвав её доказательством того, что взаимные интересы и рациональное сотрудничество могут восторжествовать над соперничеством. В Лондоне реакция более сдержанная, но осторожно оптимистичная."
 ww1_germanrework.73.a: "Экономическая логика преодолевает старую вражду."
 ww1_germanrework.74.t: "Статус Эльзас-Лотарингии"
 ww1_germanrework.74.d: "Эльзас-Лотарингия является имперской областью – то есть территорией под прямым управлением Германской империи с момента её аннексии в 1871 году. Управляемая назначаемым императором штатгальтером, она не обладает автономией, как другие федеральные земли. Население региона, в основном говорящее на эльзасском и французском языках, долгое время выражало недовольство централизованным контролем и проводимой политикой германизации в сфере образования и общественной жизни.\n\nС введением новой конституции и созданием регионального парламента территория получит некоторые ограниченные законодательные полномочия по местным вопросам. Она также будет представлена как в Бундесрате, так и в Рейхстаге, что усилит её участие в имперских делах. Хотя ключевые властные полномочия остаются в Берлине, эта реформа может стать важным шагом к интеграции в федеральную структуру и широко рассматривается как мера, призванная решить давние региональные проблемы."
 ww1_germanrework.74.a: "Мы решим эту проблему достаточно скоро"
 ww1_germanrework.75.t: "Модернизация Плана Шлиффена?"
 ww1_germanrework.75.d: "Генеральный штаб настаивает на переработке плана Шлиффена, предусматривающего вторжение во Францию через страны Бенилюкса. Генштаб предложил более агрессивную версию плана, нацеленную на то, чтобы обойти Нидерланды и сосредоточиться на прямом наступлении через Бельгию.\n\nВоенный министр Йозиас фон Хееринген уже дал понять, что, по его мнению, такой план является чрезмерно рискованным, приведёт к истощению солдат и скованности фронта. Многие другие генералы с этим не согласны, и необходимо принять решение об одобрении или отклонении нового плана."
 ww1_germanrework.75.a: "Новый план - это разумный компромисс."
 ww1_germanrework.75.b: "Придерживаемся первоначального плана."
 ww1_germanrework.76.t: "Провал на Западном фронте"
 ww1_germanrework.76.d: "Несмотря на интенсивную мобилизацию нашей армии, нам не удалось захватить контроль над Верден-сюр-Мёз. Помимо того, что регион является стратегической артерией, он ещё и укреплён, что открыло бы двери для более широкого наступления, которым мы не сможем воспользоваться."
 ww1_germanrework.76.a: "Чёрт!"
 ww1_germanrework.77.t: "Наступление Людендорфа провалилось"
 ww1_germanrework.77.d: "Наступление на Сомме провалилось; наши силы не достигли целей, поставленных Генеральным штабом. Эта последняя неудача угрожает деморализовать войска, особенно по мере затягивания войны..."
 ww1_germanrework.77.a: "Чёрт!"
 ww1_germanrework.78.t: "Ипр все ещё держится"
 ww1_germanrework.78.d: "Несмотря на наши возобновлённые усилия, Бельгия по-прежнему удерживает сектор Ипра и, следовательно, не полностью уступила свою территорию. Похоже, нам ещё предстоит некоторое время иметь дело с бельгийцами."
 ww1_germanrework.78.a: "Чёрт!"
 ww1_germanrework.79.t: "Сформирована Первая бронетанковая бригада"
 ww1_germanrework.79.d: "Первые партии тяжёлого танка Йозефа Фольмера готовы, их достаточно для формирования подразделений поддержки или крупных батальонов. Из-за высокой стоимости танка A7V ещё не запущен в массовое производство, его полезность ещё предстоит доказать в полевых условиях."
 ww1_germanrework.79.a: "Скоро мы увидим, чего он стоит."
 ww1_germanrework.80.t: "Провал на Восточном фронте"
 ww1_germanrework.80.d: "Крупное наступление, начатое нами против России, не достигло поставленных целей, несмотря на интенсивные усилия нашей армии. Это стратегическое поражение несколько деморализовало войска, вдобавок вызвав ненужные потери."
 ww1_germanrework.80.a: "Чёрт!"
 ww1_germanrework.81.t: "Немецкая поддержка в Италии"
 ww1_germanrework.81.d: "Для поддержки наших действий в горах Трентино и проведения наступления на Италию Германская империя направила нам советников для организации крупного совместного наступления. Целью операции является отбросить итальянцев за Венецию и завершить войну в Альпах."
 ww1_germanrework.81.a: "Замечательно!"
 ww1_germanrework.82.t: "Провал на итальянском фронте"
 ww1_germanrework.82.d: "Крупное наступление, начатое нами против Италии, не достигло поставленных целей, остановившись в Альпах, несмотря на все усилия нашей армии. Это стратегическое поражение несколько деморализовало войска, вдобавок приведя к неоправданным потерям."
 ww1_germanrework.82.a: "Чёрт!"
 ww1_germanrework.108.t: "Предложение об американском посредничестве"
 ww1_germanrework.108.d: "Поскольку война затягивается дольше ожидаемого, а потери растут на обоих фронтах, канцлер Бетман-Гольвег предложил нетрадиционную инициативу: обратиться к Соединённым Штатам с просьбой выступить посредником в мирной конференции между воюющими державами. Надежда заключается в том, что президент [USA.getLeader], который до сих пор официально сохраняет нейтралитет, возможно, будет готов посадить обе стороны за стол переговоров.\n\nЭто смелое и рискованное предложение. Некоторые в Рейхстаге опасаются, что оно может быть воспринято как признак слабости. Другие утверждают, что без дипломатического прорыва война может перерасти в затяжную и безнадёжную борьбу.\n\nБетман-Гольвег может направить конфиденциальное сообщение в Вашингтон с просьбой о вовлечении Америки в качестве нейтрального посредника."
 ww1_germanrework.108.a: "Мы должны попытаться. Отправить сообщение в Вашингтон."
 ww1_germanrework.108.b: "Слишком опасно. Мы не должны выглядеть отчаявшимися."
 ww1_germanrework.109.t: "Германия предлагает мирное посредничество"
 ww1_germanrework.109.d: "Из Берлина прибыла дипломатическая телеграмма. Канцлер Бетман-Гольвег, ссылаясь на усиливающееся кровопролитие в Европе, официально обратился к Соединённым Штатам с просьбой выступить посредником в общей мирной конференции между воюющими державами. Германское правительство стремится к тому, что оно называет «миром с честью», и надеется, что нейтралитет и моральный авторитет Америки убедят Антанту сесть за стол переговоров.\n\nПрезидент [USA.getLeader] и его советники разделились во мнениях. Некоторые приветствуют возможность восстановить мир и утвердить роль Америки как глобального арбитра. Другие настороженно относятся к мотивам Германии, подозревая, что это может быть уловкой для закрепления завоеваний или посеяния раздора между державами Антанты.\\nХотя предложение беспрецедентно, выбор теперь за нами: вступить в дипломатический контакт или держаться на расстоянии."
 ww1_germanrework.109.a: "Мы изучим возможность достижения мира."
 ww1_germanrework.109.b: "Сейчас неподходящий момент. Отклонить просьбу."
 ww1_germanrework.110.t: "Америка отказывается от посредничества"
 ww1_germanrework.110.d: "Ответ из Вашингтона прибыл. Президент [USA.getLeader] отклонил нашу просьбу о посредничестве в мирной конференции. Несмотря на осторожные формулировки и дипломатичный тон, сообщение не оставляет сомнений: Соединённые Штаты не будут вмешиваться в данный момент.\n\nКанцлер возлагал большие надежды на нейтральную американскую инициативу, которая привела бы Антанту за стол переговоров. Теперь, когда эта дверь закрыта, критики в Рейхстаге говорят об упущенной возможности, а из Генерального штаба вновь звучат призывы готовиться к долгой и тотальной войне.\n\nСитуация на обоих фронтах остаётся неизменной, а перспективы дипломатического урегулирования с каждым днём становятся всё более призрачными."
 ww1_germanrework.110.a: "Тогда мы должны подготовиться к тому, чтобы выиграть войну силой."
 ww1_germanrework.111.t: "Америка рассматривает наше предложение"
 ww1_germanrework.111.d: "Ответ из Вашингтона прибыл. Президент [USA.getLeader], хотя и с осторожностью и явной неопределённостью относительно наших истинных намерений, в принципе согласился изучить возможность проведения мирной конференции. Он сообщил нам, что Соединённые Штаты готовы выступить в качестве нейтрального посредника, если Антанта будет открыта для этой идеи.\n\nХотя никаких конкретных обязательств взято не было, это самый многообещающий дипломатический шаг с начала войны. Канцлер сохраняет оптимизм, но понимает, что любой неверный шаг или недопонимание могут сорвать процесс, даже не успев начаться.\n\nТеперь всё зависит от того, как Антанта отреагирует на перспективу переговоров при посредничестве."
 ww1_germanrework.111.a: "Призвать президента Америки продолжать."
 ww1_germanrework.112.t: "Германское предложение о переговорах"
 ww1_germanrework.112.d: "Соединённые Штаты передали официальное послание германского правительства. Канцлер Бетман-Гольвег предлагает начать мирные переговоры при американском посредничестве, предлагая то, что он называет «миром с честью».\n\nПредложение не содержит предварительных условий, но его время указывает на озабоченность германского руководства затяжным характером войны и растущими потерями. Президент [USA.getLeader], похоже, открыт для роли посредника, хотя и подчёркивает, что это лишь первый шаг. В наших собственных рядах мнения разделились. Некоторые утверждают, что это может быть возможностью добиться выгодных условий до дальнейшего кровопролития. Другие видят в этом прозрачную уловку Германии с целью закрепить свои завоевания и ослабить единство союзников.\n\nТеперь мы должны решить, принять ли предложение — или отклонить его безоговорочно."
 ww1_germanrework.112.a: "Мы выслушаем, с осторожностью."
 ww1_germanrework.112.b: "Отклонить предложение. Германия не должна диктовать мир."
 ww1_germanrework.113.t: "Германское предложение о переговорах"
 ww1_germanrework.113.d: "Соединённые Штаты передали официальное послание германского правительства. Канцлер Бетман-Гольвег предлагает начать мирные переговоры при американском посредничестве, предлагая то, что он называет «миром с честью».\n\nПредложение не содержит предварительных условий, но его время указывает на озабоченность германского руководства затяжным характером войны и растущими потерями. Президент [USA.getLeader], похоже, открыт для роли посредника, хотя и подчёркивает, что это лишь первый шаг. Хотя мы не являемся ключевым игроком и не имеем влияния на эти обсуждения, мы будем информированы о развитии событий в своё время."
 ww1_germanrework.113.a: "Мы будем наблюдать с интересом."
 ww1_germanrework.114.t: "Бельгийский вопрос"
 ww1_germanrework.114.d: "По мере осторожного продвижения дипломатических усилий один центральный вопрос теперь доминирует во внутренних дискуссиях в Вашингтоне: какую позицию нам следует занять в отношении Бельгии?\n\nБританцы и французы настаивают на том, что любой приемлемый мир должен гарантировать полное восстановление суверенитета Бельгии. Общественное мнение в Соединённых Штатах также остаётся сочувственным к положению Бельгии после вторжения 1914 года. Но первые сигналы из Берлина позволяют предположить, что немцы вряд ли согласятся на безоговорочный вывод войск.\n\nНекоторые советники утверждают, что мы должны сделать освобождение Бельгии краеугольным камнем любых американских посреднических усилий — в противном случае мы можем потерять моральный авторитет. Другие предостерегают, что выдвижение ультиматумов слишком рано может привести к тому, что немцы откажутся от переговоров до их реального начала."
 ww1_germanrework.114.a: "Требовать полного и немедленного восстановления суверенитета Бельгии."
 ww1_germanrework.114.b: "Сделать Бельгию центральной темой, но оставить пространство для переговоров."
 ww1_germanrework.114.c: "Пока не поднимать бельгийский вопрос. Всему своё время."
 USA_will_mediate_the_peace: "§Y[USA.getFlag][USA.getName]§! выступит посредником при заключении мирного соглашения. Результат может не соответствовать нашим требованиям, но может привести к окончанию §tВеликой войны§!."
 ww1_germanrework.115.t: "Германское предложение: Бельгия в обмен на Конго"
 ww1_germanrework.115.d: "Продолжая американское посредничество, германское правительство пошло на свою самую значительную уступку на сегодняшний день: полный и безоговорочный вывод войск с оккупированной бельгийской территории. Взамен Германия требует передачи Конго — находящегося под управлением Бельгии — в качестве колониальной компенсации. Вашингтон рассматривает это предложение как сбалансированный компромисс, который может положить конец войне, удовлетворив основные требования союзников.\n\nЭто предложение ошеломило набережную Орсе и разделило кабинет министров. Некоторые утверждают, что полное освобождение Бельгии отвечает нашим военным целям, а Конго в конечном итоге является второстепенным вопросом. Другие отвергают саму идею вознаграждения агрессии имперскими приобретениями, предупреждая, что согласие создаст опасный прецедент — и осложнит франко-бельгийские отношения.\n\nТеперь решение остаётся за нами, здесь, в [ROOT.Capital.GetCapitalVictoryPointName]."
 ww1_germanrework.115.b: "Принять. Бельгия свободна, и мир достижим."
 ww1_germanrework.115.a: "Отклонить. Мы не будем вознаграждать германские завоевания."
 ww1_germanrework.116.t: "Антанта отвергает наше предложение"
 ww1_germanrework.116.d: "Американская делегация вернулась с тревожными новостями: державы Антанты официально отклонили наше предложение о всеобщем мирном урегулировании. Несмотря на наше обязательство полностью вывести войска из Бельгии — уступка, которую многие в Берлине сочли чрезмерной — союзные правительства отказались уступить Конго в качестве компенсации, назвав предложение попыткой обменять имперские завоевания на вывод войск из Европы.\n\nКанцлер глубоко разочарован. В Рейхстаге оппозиция звучит всё громче, а среди Генерального штаба раздаются голоса, призывающие к немедленному возобновлению полномасштабных операций. Мечта о посредническом мире рухнула, а вместе с ней — все оставшиеся иллюзии о том, что войну можно закончить с помощью разума."
 ww1_germanrework.116.a: "Пригрозить им неограниченной подводной войной!"
 ww1_germanrework.116.b: "Тогда меч решит то, что не смогла дипломатия."
 ww1_germanrework.117.t: "Германия угрожает неограниченной подводной войной"
 ww1_germanrework.117.d: "Суровое сообщение достигло [ROOT.Capital.GetCapitalVictoryPointName] из Вашингтона: германская делегация сообщила президенту Вильсону, что если Антанта продолжит отвергать их мирные инициативы, у Берлина не останется выбора, кроме как возобновить неограниченную подводную войну. Последствия серьёзны. Такой шаг будет направлен против нейтрального судоходства, включая американские суда, и, вероятно, спровоцирует вступление США в войну — развитие событий, на которое немцы, похоже, готовы пойти. Ультиматум канцлера ясен: примите предложенные условия или готовьтесь к новому этапу тотальной войны на море.\n\nВ кабинете министров мнения резко разделились. Некоторые утверждают, что это отчаянный блеф, другие видят в этом просчитанную эскалацию, которая может изменить глобальный баланс. Будущее войны висит на волоске."
 ww1_germanrework.117.a: "Пусть угрожают. Мы не поддадимся на шантаж."
 ww1_germanrework.117.b: "Это может втянуть Америку в войну. Мы должны посоветоваться с Лондоном."
 ww1_germanrework.118.t: "Франция не восприимчива"
 ww1_germanrework.118.d: "Несмотря на всё давление, которое наша делегация смогла оказать, а также угрозу тотальной и неограниченной подводной войны, представители Антанты не изменили своих позиций и отказываются уступать нашим условиям, даже если они законны. Эта ситуация вынуждает нас затягивать войну, что может сыграть не в нашу пользу."
 ww1_germanrework.118.a: "Мы выиграем эту войну, что бы ни случилось!"
 ww1_germanrework.119.t: "Провал мирной конференции"
 ww1_germanrework.119.d: "Несмотря на наши наилучшие усилия по посредничеству в переговорном урегулировании, мирная инициатива провалилась. Державы Антанты отказались принять предложенные условия, которые включали полный вывод германских войск из Бельгии в обмен на колониальную компенсацию в Конго. Франция и Британия назвали предложение морально неприемлемым, и никаких дальнейших уступок от Берлина добиться не удалось. Германское правительство, со своей стороны, не смогло оказать достаточного давления, чтобы продвинуть переговоры вперёд, несмотря на угрозы возобновить неограниченную подводную войну.\n\nТо, что начиналось как смелая дипломатическая авантюра, закончилось тупиком. Взаимное недоверие глубже, чем когда-либо, и никакого компромисса не видно — снова заговорят пушки. Пока что война продолжается."
 ww1_germanrework.119.a: "Мы сделали всё, что могли. Мир ещё не готов к миру."
 ww1_germanrework.120.t: "Мирные переговоры провалились"
 ww1_germanrework.120.d: "Возглавляемая Америкой мирная инициатива провалилась. После недель конфиденциальных обсуждений президент [USA.getLeader] сообщил нашим правительствам, что Берлин не выведет войска из Бельгии без получения колониальной компенсации — предложение, которое мы единогласно отвергли. Германия согласилась освободить Бельгию только при условии передачи ей Конго — требование, которое мы сочли возмутительным и несовместимым с принципами, за которые мы сражаемся. Никакого дальнейшего компромисса не последовало, и Берлин не оказал достаточного давления — ни военного, ни дипломатического — чтобы форсировать решение.\n\nКонференция окончена. В то время как некоторые в наших правительствах выражают облегчение, что мы избежали бесчестного соглашения, другие испытывают тревогу. Война продолжается, и конца ей не видно. Наш народ устал, а издержки растут с каждым днём."
 ww1_germanrework.120.a: "Мы выиграем эту войну на поле боя, а не за столом переговоров."
 tt_great_war_ends: "§tВеликая война§! заканчивается."
 tt_need_entente_usa_approval: "§Y[USA.getFlag][USA.getName]§! и затем §Y[FRA.getFlag][FRA.getName]§! должны одобрить соглашение, чтобы бонусы вступили в силу."
 ww1_germanrework.121.t: "Прорыв: Антанта принимает мирные рамки"
 ww1_germanrework.121.d: "После недель осторожной дипломатии и растущего давления из Вашингтона пришло известие: державы Антанты официально согласились с американскими рамками мирного урегулирования. Согласно этому соглашению, мы выведем войска со всей оккупированной бельгийской территории в обмен на Конго, переходящее из-под бельгийского управления под германский колониальный контроль. В то время как многие в Генеральном штабе возмущены потерей завоёванной стратегической позиции, канцлер видит в этом решающий первый шаг к переговорному завершению войны.\n\nОднако путь впереди остаётся долгим и неопределённым. Вопросы Эльзас-Лотарингии, Восточной Европы, Балкан и морского разоружения всё ещё стоят на повестке дня. Но пока мы добились дипломатического прорыва и, возможно, спасли Германию от войны на полное истощение."
 ww1_germanrework.121.a: "Наконец-то дипломатия приносит плоды! Готовьтесь к дальнейшим переговорам."
 ww1_germanrework.122.t: "Вопрос об [28.getName]-[1107.getName]"
 ww1_germanrework.122.d: "После достижения предварительного соглашения по Бельгии и Конго внимание теперь переключается на самый символически заряженный вопрос войны: судьбу [28.getName]-[1107.getName].\n\nФранция требует полного возвращения двух провинций, ссылаясь на исторические претензии и национальную честь. Германия, тем временем, настаивает на сохранении территории как неотъемлемой части Рейха с 1871 года, предупреждая, что любая уступка будет политически взрывоопасной.\n\nПоявилось несколько вариантов компромисса. Некоторые американские советники предлагают раздел провинций по культурному или языковому принципу. Другие предлагают нейтральное решение — создание независимого [28.getName]-[1107.getName] под международными гарантиями. Это решение определит следующий этап мирного процесса — и может решить, выживут ли переговоры или провалятся."
 ww1_germanrework.122.a: "Поддержать полное возвращение Франции — Эльзас-Лотарингия должна быть возвращена."
 ww1_germanrework.122.b: "Поддержать суверенитет Германии — Рейх сохраняет провинции."
 ww1_germanrework.122.c: "Предложить раздел: Лотарингию — Франции, [28.getName] — Германии."
 ww1_germanrework.122.e: "Что насчёт нейтрального Эльзас-Лотарингии под международными гарантиями."
 ww1_germanrework.123.t: "Великая война заканчивается?"
 ww1_germanrework.123.d: "По-видимому, достигнут реальный прогресс на пути к переговорному миру. Под руководством президента [USA.getLeader] представители Центральных держав и Антанты встречаются за закрытыми дверями, чтобы изучить условия прекращения кровопролития.\n\nХотя окончательное соглашение ещё не подписано, источники, близкие к переговорам, сообщают о серии прорывов. Германия согласилась вывести войска из Бельгии в обмен на колониальную компенсацию, а давний спор об Эльзас-Лотарингии теперь перешёл в стадию официальных обсуждений. Хотя прогресс хрупок, дипломатический импульс неоспорим. Некоторые надеются, что Соединённым Штатам всё же удастся выступить посредником в достижении всеобщего мира."
 ww1_germanrework.123.a: "Возможно, война не будет длиться вечно."
 ww1_germanrework.124.t: "Америка требует возвращения [28.getName]-[1107.getName]"
 ww1_germanrework.124.d: "Из американской делегации прибыла новая нота. После консультаций с Парижем президент [USA.getLeader] официально потребовал, чтобы Германия вернула провинции [28.getName] и [1107.getName] Франции в рамках всеобщего мирного урегулирования.\n\nРеакция в Берлине взрывоопасна. Рейхстаг разделился на тех, кто считает это невыносимым унижением, и тех, кто не видит пути к миру без трудных уступок. Генеральный штаб предупреждает, что отказ от провинций спровоцирует беспорядки внутри страны и ободрит вражеские требования в других местах.\n\nКанцлер Бетман-Гольвег стоит перед решающим моментом. Отказ может разрушить хрупкие мирные рамки. Согласие может стоить правительству легитимности.\n\nСудьба Рейха — и войны — может зависеть от этого решения."
 ww1_germanrework.124.a: "Абсолютно нет — [28.getName]-[1107.getName] — немецкая земля."
 ww1_germanrework.124.b: "Мы открыты для обсуждения, но при строгих условиях."
 ww1_germanrework.124.c: "Если это принесёт мир, то мы должны отпустить их."
 ww1_germanrework.125.t: "Германия принимает передачу [28.getName]-[1107.getName]"
 ww1_germanrework.125.d: "Германское правительство официально заявило о своей готовности уступить [28.getName]-[1107.getName] Франции на условиях, предложенных американской делегацией.\n\nЭто событие знаменует собой исторический поворотный момент. Провинции, долгое время бывшие источником глубокой вражды между Францией и Германией, почти полвека находились в центре европейской напряжённости. Тот факт, что Берлин теперь готов отказаться от них, является свидетельством как давления войны, так и обещания мира.\n\nПрезидент [USA.getLeader] и его советники рассматривают это решение как крупный дипломатический прорыв. Впервые кажется, что обе стороны готовы пойти на жертвы, необходимые для завершения войны. Многое ещё предстоит обсудить, но путь вперёд яснее, чем когда-либо."
 ww1_germanrework.125.a: "Мы приближаемся к концу этого долгого кошмара."
 ww1_germanrework.126.t: "Германия соглашается вернуть Эльзас-Лотарингию"
 ww1_germanrework.126.d: "Теперь это официально. При американском посредничестве германское правительство согласилось на полную реституцию Эльзаса и Лотарингии Франции. Провинции, захваченные силой в 1871 году, должны вернуться Республике — не только с помощью оружия, но и благодаря неослабевающему дипломатическому и военному давлению.\n\nЭто объявление вызвало волну эмоций в Палате депутатов и на улицах Парижа. Но это ещё не конец. Условия мира остаются неполными: вопросы Балкан, репараций, разоружения — всё ещё впереди.\n\nНо сегодня мы на шаг ближе к справедливости. На шаг ближе к победе."
 ww1_germanrework.126.a: "La patrie retrouve ses terres. Continuons le travail diplomatique."
 ww1_germanrework.127.t: "Америка призывает нас отказаться от Эльзас-Лотарингии"
 ww1_germanrework.127.d: "Из делегации президента [USA.getLeader] прибыла официальная нота. В интересах сохранения хрупкого мирного процесса Соединённые Штаты призывают Францию отказаться от своих притязаний на Эльзас-Лотарингию. Американцы утверждают, что требование возвращения провинций может полностью сорвать переговоры, спровоцировать германские беспорядки и затянуть войну. Они предлагают альтернативные формы компенсации — экономическую, колониальную или символическую, но дают понять, что этот вопрос, по их мнению, является второстепенным по отношению к более широкой цели достижения мира.\n\nКабинет министров ошеломлён. Для миллионов французских граждан Эльзас и Лотарингия — не разменная монета: это Франция. Уступить сейчас означало бы предать само дело, за которое наши солдаты сражались и умирали. Мы должны ответить с достоинством и решимостью."
 ww1_germanrework.127.a: "Абсолютно нет. Эльзас-Лотарингия не подлежит обсуждению."
 ww1_germanrework.127.b: "Если это положит конец войне... мы рассмотрим это."
 ww1_germanrework.128.t: "Франция отказывается от притязаний на Эльзас-Лотарингию"
 ww1_germanrework.128.d: "Действие, которое мало кто считал возможным, свершилось: французское правительство официально согласилось отказаться от своих притязаний на Эльзас-Лотарингию, устранив главное препятствие в мирном процессе. Хотя решение встретило серьёзное сопротивление в Палате депутатов и французской прессе, настойчивость президента [USA.getLeader] в поиске компромисса и обещание скорого окончания войны в конце концов убедили Париж пойти на эту трудную уступку.\n\nГерманская делегация отреагировала осторожно, всё ещё опасаясь возможных условий или будущих откатов. Тем не менее, Вашингтон теперь видит реальную возможность направить переговоры к всеобщему перемирию.\n\nМир затаил дыхание. Конфликт, рождённый железом и кровью, всё же может быть окончен дипломатией и сдержанностью."
 ww1_germanrework.128.a: "Мир может достаться дорогой ценой — но мир достижим."
 ww1_germanrework.129.t: "Америка предлагает раздел Эльзас-Лотарингии"
 ww1_germanrework.129.d: "Из Вашингтона прибыла новая дипломатическая нота. В поисках пути между французским требованием полной реституции и германским отказом от любых уступок американская делегация теперь предлагает территориальный компромисс: раздел Эльзас-Лотарингии. Согласно этому предложению, Лотарингия вернётся Франции, а Эльзас — или по крайней мере его часть — останется под контролем Германии. Президент [USA.getLeader] описывает это как «взвешенное и рациональное» решение, направленное на сохранение мира и удовлетворение обеих сторон.\n\nРеакция в Париже неоднозначна. Многие воспринимают это предложение как оскорбление национальной чести и предательство наших жертв. Другие, измотанные годами войны, утверждают, что даже частичное возвращение предпочтительнее продолжения кровопролития."
 ww1_germanrework.129.a: "Неприемлемо. Провинции должны вернуться целиком."
 ww1_germanrework.129.b: "Мы рассмотрим предложение, но с протестом."
 ww1_germanrework.130.t: "Франция отвергает раздел Эльзас-Лотарингии"
 ww1_germanrework.130.d: "Французское правительство официально отвергло наш предложенный компромисс по вопросу Эльзас-Лотарингии. Несмотря на наши усилия по деэскалации напряжённости путём предложения раздела — с возвращением Лотарингии Франции и оставлением Эльзаса под контролем Германии — Париж дал твёрдый и категорический отказ.\n\nФранцузские чиновники называют предложение «неприемлемым как с моральной, так и с исторической точки зрения». Сообщается, что Палата депутатов отреагировала с негодованием, а некоторые элементы французской прессы начали ставить под сомнение американский нейтралитет. Президент [USA.getLeader] теперь стоит перед трудным выбором: продолжить посредничество, рискуя срывом переговоров, или переключить внимание на достижение мира на других фронтах.\n\nНеспособность разрешить спор об Эльзас-Лотарингии бросает длинную тень на переговоры."
 ww1_germanrework.130.a: "Разочаровывает — но это не конец. Мы будем искать другой путь."
 ww1_germanrework.130.b: "Возможно, нейтральный Эльзас-Лотарингия — это наилучший выход."
 ww1_germanrework.131.t: "Франция принимает раздел Эльзас-Лотарингии"
 ww1_germanrework.131.d: "После интенсивных дебатов внутри французского правительства президент [USA.getLeader] получил подтверждение из Парижа: Франция примет предложенный раздел Эльзас-Лотарингии, хотя и неохотно и под протестом. Согласно этому соглашению, Лотарингия вернётся Франции, в то время как Эльзас — или по крайней мере его часть — останется под германской администрацией. Французские лидеры настаивают на том, что этот компромисс рождён не удовлетворением, а истощением и долгом перед миром.\n\nЭто решение вызвало протесты в некоторых частях Франции, и ожидается политическая реакция. Тем не менее, дипломаты в Вашингтоне рассматривают этот исход как важный шаг к всеобъемлющему урегулированию. Президент [USA.getLeader] признаёт серьёзность этого момента — и жертву, которую он представляет. Путь к миру остаётся узким, но он всё ещё открыт."
 ww1_germanrework.131.a: "Теперь мы должны получить одобрение Германии"
 ww1_germanrework.132.t: "Америка предлагает раздел [28.getName]-[1107.getName]"
 ww1_germanrework.132.d: "Из Вашингтона прибыло новое коммюнике. Американская делегация сообщает нам, что Франция, хотя и явно недовольна, приняла предложенный компромисс по [28.getName]-[1107.getName]: [1107.getName] будет уступлена Франции, в то время как [28.getName] может остаться в составе Рейха.\n\nПрезидент [USA.getLeader] теперь призывает Германию одобрить это соглашение, чтобы продвинуть более широкие мирные переговоры. В Рейхстаге и Генеральном штабе реакция неоднозначна. Некоторые рассматривают это как стратегическую победу — сохранение части спорной территории при избежании полной уступки. Другие видят в любой территориальной потере опасный прецедент и унижение. Теперь решение за нами. Принять компромисс, который завершит войну на выгодных условиях — или отказаться и рисковать потерять всё."
 ww1_germanrework.132.a: "Согласиться на раздел — это сохраняет наши интересы."
 ww1_germanrework.132.b: "Отклонить эту сделку — [28.getName]-[1107.getName] должна остаться единой."
 ww1_germanrework.133.t: "Германия отвергает предложение о разделе"
 ww1_germanrework.133.d: "Берлин высказался. Несмотря на неохотное принятие Францией нашего предложения о разделе Эльзас-Лотарингии, германское правительство наотрез отказалось от сделки. Ответ канцлера Бетман-Гольвега, хотя и облечённый в дипломатические формулировки, не оставляет места для двусмысленности. Германия не согласится ни на какую территориальную потерю в спорных провинциях, даже на частичную уступку. Внутренние отчёты позволяют предположить, что Кайзер и Генеральный штаб считают неприемлемым даже символический компромисс.\n\nЭтот отказ подорвал доверие к мирному процессу. Президент [USA.getLeader], который неустанно работал над примирением сторон, теперь сталкивается с растущим давлением как внутри страны, так и за рубежом. Антанта в ярости. Париж, политически пожертвовавший многим, чтобы согласиться на сделку, теперь задаётся вопросом, действует ли Германия добросовестно. Если Берлин не пересмотрит своего решения, это может ознаменовать конец переговоров."
 ww1_germanrework.133.a: "Так близко к миру — и всё же так далеко."
 ww1_germanrework.134.t: "Германия принимает раздел — перемирие достижимо"
 ww1_germanrework.134.d: "В решении, которое может изменить ход войны, германское правительство официально согласилось на раздел Эльзас-Лотарингии, предложенный Соединёнными Штатами. Несмотря на яростное сопротивление со стороны некоторых элементов Генерального штаба и Рейхстага, Берлин принял компромисс: Лотарингия вернётся Франции, в то время как Эльзас останется под контролем Германии. Канцлер Бетман-Гольвег назвал это решение «болезненным, но необходимым шагом» к миру.\n\nТеперь, когда и Франция, и Германия пришли к соглашению, президент [USA.getLeader] считает, что перемирие на Западном фронте наконец достижимо. Американская делегация уже готовит официальные рамки для прекращения военных действий и перехода к более широкому мирному договору.\n\nЭто хрупкий, но исторический момент. То, что началось в огне и стали, всё же может закончиться переговорами и решимостью."
 ww1_germanrework.134.a: "Готовьте условия. Пушки скоро могут замолчать."
 ww1_germanrework.135.t: "Прорыв в мирных переговорах"
 ww1_germanrework.135.d: "Американская делегация сообщила нам, что в текущих мирных переговорах достигнут крупный прорыв. По данным Вашингтона, давно оспариваемый вопрос Эльзас-Лотарингии, который в течение многих лет был одним из главных препятствий для любого урегулирования, теперь «успешно урегулирован» между заинтересованными сторонами. Хотя детали остаются конфиденциальными, американские чиновники охарактеризовали результат как «взаимно терпимый» и «исторически значимый».\n\nВ результате переговоры теперь движутся к разработке официального соглашения о прекращении огня на Западном фронте. Если прогресс будет продолжаться такими темпами, перемирие может быть объявлено в ближайшие дни или недели. В столицах Антанты осторожное чувство надежды начинает заменять давнюю усталость от войны."
 ww1_germanrework.135.a: "Мы должны оставаться твёрдыми, но открытыми для мира."
 ww1_germanrework.136.t: "Прогресс в мирных переговорах"
 ww1_germanrework.136.d: "Из Вашингтона пришли обнадёживающие новости: американские посредники сообщают, что главное препятствие в текущих мирных переговорах было преодолено. Согласно последним дипломатическим сообщениям, вопрос [28.getName]-[1107.getName] — долгое время бывший источником непримиримой напряжённости между Францией и Германией — успешно урегулирован к удовлетворению всех основных сторон. Хотя конкретные условия остаются неразглашёнными, прорыв создал новый импульс в переговорах.\n\nВ связи с этим поворотным моментом возможность официального прекращения огня на Западном фронте теперь активно обсуждается. Запланированы дальнейшие сессии для завершения разработки рамок перемирия.\n\nХотя ничто ещё не определено, в Центральных державах растёт надежда, что конец этой долгой и горькой войны наконец может быть достижим."
 ww1_germanrework.136.a: "Давайте действовать осторожно и готовиться к миру."
 ww1_germanrework.137.t: "Америка предлагает независимый [28.getName]-[1107.getName]"
 ww1_germanrework.137.d: "В новой попытке разрешить тупиковую ситуацию вокруг [28.getName]-[1107.getName] американская делегация выступила со смелым предложением: спорные провинции станут независимым и нейтральным государством — Свободной Республикой Эльзас-Лотарингия — под международными гарантиями.\n\nПрезидент [USA.getLeader] утверждает, что это решение удовлетворит как французские, так и германские исторические претензии, одновременно устраняя регион как постоянный источник конфликта. Предложение предусматривает создание демилитаризованного буферного государства с собственным правительством и символическим нейтралитетом.\n\nВ Берлине реакция неоднозначна. Некоторые видят в этом умный компромисс, который позволяет избежать уступки территории Франции. Другие воспринимают это как завуалированную потерю — отказ от суверенной земли, завоёванной войной и удерживаемой почти полвека. Рейх должен теперь решить, стоит ли рассматривать этот путь — или рисковать срывом мирных переговоров."
 ww1_germanrework.137.a: "Мы принимаем принцип. Это может сохранить мир и достоинство."
 ww1_germanrework.137.b: "Нет! [28.getName]-[1107.getName] — часть Рейха и останется ею."
 ww1_germanrework.138.t: "Германия принимает независимый Эльзас-Лотарингию"
 ww1_germanrework.138.d: "В результате развития событий, которого немногие осмеливались ожидать, германское правительство официально согласилось на создание независимого Эльзас-Лотарингии. Согласно этому соглашению, провинции будут преобразованы в нейтральное и самоуправляемое государство, суверенитет которого будет гарантирован великими державами. Регион будет демилитаризован и выведен из-под прямого французского или германского контроля — символический жест в сторону примирения.\n\nРешение в Берлине далось с трудом. Внутреннее сопротивление со стороны военных и националистических фракций было ожесточённым, но канцлер Бетман-Гольвег в конечном итоге одержал верх, представив предложение как путь как к миру, так и к достоинству. Американские дипломаты теперь полагают, что это может быть прорывом, который откроет путь к всеобщему перемирию на Западном фронте. Впервые тень компромисса затмевает призрак тотальной войны."
 ww1_germanrework.138.a: "Трудная уступка, но такая, которая может положить конец кровопролитию."
 ww1_germanrework.139.t: "Германия отвергает независимость Эльзас-Лотарингии"
 ww1_germanrework.139.d: "Германское правительство официально отклонило наше предложение разрешить спор об Эльзас-Лотарингии путём создания независимой нейтральной республики. Хотя план был разработан для удовлетворения как французских, так и германских интересов, Берлин назвал его неприемлемым дроблением суверенной территории. Источники, близкие к канцлеру, сообщают об интенсивном давлении со стороны военных и консервативных фракций, которые считают любую потерю — символическую или реальную — Эльзас-Лотарингии недопустимой.\n\nЭтот отказ бросает длинную тень на мирные переговоры. Президент [USA.getLeader] надеялся, что модель независимости позволит преодолеть тупик между Францией и Германией. Теперь, когда этот вариант снят с повестки дня, будущее переговоров неопределённо, и возможность возобновления военных действий снова маячит на горизонте.\n\nВремя для действий ещё есть — но окно закрывается."
 ww1_germanrework.139.a: "Тогда Франция должна пойти на уступки."
 ww1_germanrework.140.t: "Германия принимает независимость Эльзас-Лотарингии"
 ww1_germanrework.140.d: "В Париж пришло известие: при американском посредничестве Берлин принял создание нейтрального и независимого Эльзас-Лотарингии. Регион не вернётся Франции. Он не останется и немецким. Вместо этого он должен стать демилитаризованной республикой под международными гарантиями, возможно, буфером, но также и раной, оставленной лишь частично закрытой.\n\nВ Палате депутатов реакция неоднозначна. Некоторые видят в этом дипломатическую победу — доказательство того, что Германия дрогнула. Другие воспринимают это как предательство национальной чести, окончательную жертву земли, возвращённой кровью в 1871 году и вновь на которую надеялись в этой войне.\n\nОбщественное мнение нестабильно. Газеты осторожны, ветераны в ярости, а улицы Меца и Страсбурга ждут ясности относительно своего будущего. Мир стал ближе, но его цена высока — а его основания хрупки."
 ww1_germanrework.140.a: "Мы будем внимательно следить за этой новой республикой."
 ww1_germanrework.141.t: "Предложена реформа прусского избирательного права"
 ww1_germanrework.141.d: "На фоне растущего давления со стороны большинства Рейхстага и усиления социальных волнений канцлер Бетман-Гольвег представил предложение о реформе глубоко неравной избирательной системы Королевства Пруссия. План отменяет трёхклассную систему голосования — которая предоставляет непропорционально большую власть богатой элите — и заменяет её более демократичной и эгалитарной структурой, близкой к всеобщему избирательному праву для мужчин, используемому на выборах в Рейхстаг.\n\nПредложение было разработано для сохранения национального единства, укрепления мирных усилий канцлера за рубежом и жеста в сторону социал-демократов и умеренных либералов. Но оно встретило подавляющее сопротивление.\n\nКонсервативная элита, военное командование и даже члены императорской семьи осудили план как угрозу существующему порядку. Генеральный штаб в частном порядке предупредил Кайзера, что такие реформы во время войны «подорвут национальную дисциплину». Предложение даже не дошло до зала заседаний прусского ландтага. Оно мертво, ещё не родившись."
 ww1_germanrework.141.a: "Реформа проваливается под давлением. Старый порядок удерживается."
 ww1_germanrework.142.t: "Канцлер Бетман-Гольвег уходит в отставку"
 ww1_germanrework.142.d: "После месяцев растущего политического давления и неоднократных неудач — как внутренних, так и дипломатических — канцлер Теобальд фон Бетман-Гольвег подал прошение об отставке Кайзеру. Его реформаторские инициативы, включая предложенную демократизацию прусской избирательной системы, провалились под яростным давлением военных, консервативной элиты и императорского двора. Его попытки мирного посредничества через Вашингтон оказались столь же безуспешны, а его авторитет неуклонно падал.\n\nВерховное командование армии под руководством генералов Гинденбурга и Людендорфа ясно дало понять, что больше не будет сотрудничать с Бетман-Гольвегом. Столкнувшись с правительственным кризисом и опасаясь нестабильности, Кайзер принял его отставку. Георг Михаэлис, малоизвестный бюрократ и верный слуга монархии, был назначен новым канцлером. Хотя ему не хватает политического опыта, ожидается, что он будет строго следовать курсу военного руководства."
 ww1_germanrework.142.a: "Неблагодарная задача подошла к концу."
 ww1_germanrework.143.t: "Трещины в железном кольце"
 ww1_germanrework.143.d: "Недавние успехи Императорского военно-морского флота привели к заметному ослаблению морской блокады союзников. Наши аналитики сообщают, что военно-морское превосходство противника, хотя всё ещё сохраняется, уже не такое подавляющее, как раньше.\n\nЭтот многообещающее развитие означает, что больше наших торговых судов и нейтральных перевозчиков могут проскользнуть сквозь сеть, доставляя жизненно важные припасы. Хотя «голодная блокада» ещё не прорвана, это серьёзный удар по стратегии Антанты и луч надежды для нашего осаждённого тыла."
 ww1_germanrework.143.a: "Наши моряки сделали нас гордыми!"
 ww1_germanrework.144.t: "Голодная блокада разрушена!"
 ww1_germanrework.144.d: "Решающие победы Императорского военно-морского флота разгромили противостоящие нам флоты союзников! С военно-морской мощью врага сломленной, «голодная блокада» была фактически ликвидирована. Наши порты открыты, и жизненно важные артерии морской торговли снова могут приносить пропитание Германской империи.\n\nТёмные дни брюквенных зим и скудных пайков подходят к концу. Стойкость [GER.GetAdjective] народа вознаграждена, и тыл наконец может вздохнуть свободнее. Этот триумф на море будет эхом звучать в залах истории!"
 ww1_germanrework.144.a: "Историческая победа!"
 ww1_germanrework.145.t: "Предложение из Берлина"
 ww1_germanrework.145.d: "Дипломатическая телеграмма из МИД Германии прибыла на Уайтхолл, содержа беспрецедентное предложение: Кайзеррейх официально предлагает договор о дружбе между Германской империей и Британской короной.\n\nВ документе Берлин подчёркивает успех недавних англо-германских договорённостей — переговоры Холдейна, морскую разрядку и растущее торговое сотрудничество между такими фирмами, как Krupp и Vickers. Кроме того, в ноте упоминается недавнее совместное решение по будущему Анголы, что позволяет предположить, что была заложена основа для доверия.\n\nТем не менее, последствия такого пакта огромны. Хотя он нейтрализовал бы напряжённость в Северном море и, возможно, избавил бы Империю от континентальных обязательств, он также рисковал бы разорвать нашу давнюю дружбу с Францией. Такое изменение позиции было бы воспринято в Париже как предательство, возможно, полностью расколов Антанту. МИД теперь должен взвесить преимущества разрядки с Берлином против цены отчуждения наших союзников на континенте."
 ww1_germanrework.145.a: "Принять это предложение. Мир с Германией имеет первостепенное значение!"
 ww1_germanrework.145.b: "Отклонить предложение. Мы с Францией."
 ww1_germanrework.146.t: "Британия принимает наше предложение"
 ww1_germanrework.146.d: "Из Лондона прибыл официальный ответ. В тщательно сформулированном коммюнике Правительство Его Величества приняло предложение о договоре о дружбе между Британской империей и Германским рейхом. В ноте подчёркиваются плоды недавнего сотрудничества — успех миссии Холдейна, морская разрядка и совместные экономические инициативы — как доказательство того, что две великие державы не должны быть соперниками. Британские чиновники представляют соглашение не как альянс, а как обязательство нейтралитета и взаимного уважения.\n\nВ Берлине этот ответ празднуют как дипломатический триумф. Впервые за десятилетия возможность стабильных англо-германских отношений кажется достижимой. Тем не менее, не всё спокойно. Париж пока молчит. Но никто не сомневается, что это решение может разрушить саму основу Сердечного согласия."
 ww1_germanrework.146.a: "Неоспоримый триумф."
 ww1_germanrework.147.t: "Британия отклоняет наше предложение"
 ww1_germanrework.147.d: "Из министерства иностранных дел в Лондоне прибыл официальный ответ. Тон вежлив, но сообщение предельно ясно: британское правительство отклонило наше предложение о договоре о дружбе. Ссылаясь на исторические обязательства перед Францией и опасения по поводу баланса сил в Европе, Британия вновь подтвердила свою приверженность Антанте. Признавая недавний дипломатический прогресс — морские соглашения, экономическое сотрудничество и понимание по Анголе, — Уайтхолл настаивает на том, что этого недостаточно для изменения позиции.\n\nВ Берлине новости встречают с разочарованием и тихой решимостью. Многие надеялись, что новое взаимопонимание может предотвратить будущее столкновение. Теперь эта надежда померкла. Каким бы ни был мир, который мы построили, похоже, ему никогда не суждено было устоять без одобрения Парижа. Дипломатическое окно закрылось. Мы должны подготовиться к последствиям."
 ww1_germanrework.147.a: "Теория окружения подтверждается..."
 ww1_germanrework.148.t: "Подписан англо-германский договор о дружбе"
 ww1_germanrework.148.d: "В результате потрясающего дипломатического поворота Германская империя и Британская корона официально подписали договор о дружбе, обязываясь к взаимному нейтралитету и расширенному экономическому сотрудничеству. Соглашение, заключённое после месяцев конфиденциальных переговоров и после успешной миссии Холдейна, кладёт конец десятилетиям военно-морского и имперского соперничества.\n\nНаблюдатели отмечают углубление связей между германской и британской промышленностью, при этом партнёрство Vickers-Krupp рассматривается как символическое для этой новой главы. Договор вызвал шок в Европе, особенно в Антанте. Французские газеты предупреждают о предательстве, в то время как Берлин приветствует соглашение как шаг к прочной континентальной стабильности. Британские чиновники поспешили разъяснить, что договор не является военным альянсом, но он тем не менее знаменует собой чёткую перестройку дипломатических приоритетов."
 ww1_germanrework.148.a: "Началась историческая перестройка."
 ww1_germanrework.148.b: "Nique sa mère"
 ww1_germanrework.148.c: "Это неожиданно."
 ww1_germanrework.149.t: "Отдан несанкционированный приказ о морском наступлении"
 ww1_germanrework.149.d: "Правительство Рейха было уведомлено о том, что Флот Открытого моря отдал приказ о полномасштабной морской операции против британских позиций в проливе Ла-Манш без предварительного одобрения Берлина.\n\nПлан, составленный втайне военно-морским командованием, предусматривает выход всего флота, что, по-видимому, является последним актом неповиновения, призванным искупить честь флота до того, как вступит в силу какое-либо перемирие. Гражданское руководство возмущено. Решение было принято не только в одностороннем порядке, но и рискует спровоцировать массовый мятеж: нет никаких сомнений, что измученные и уставшие от войны моряки откажутся выполнять эту самоубийственную миссию."
 ww1_germanrework.149.a: "Это безумие!"
 ww1_germanrework.150.t: "Срочные реформы для обеспечения мира"
 ww1_germanrework.150.d: "Поскольку война решительно оборачивается против нас, а американский президент делает демократические реформы предварительным условием для мирных переговоров, имперское правительство инициировало широкомасштабные конституционные изменения.\n\nБыл принят ряд чрезвычайных указов и парламентских поправок: отныне канцлер будет нести полную ответственность перед Рейхстагом, а военные решения перейдут под гражданский надзор. Эти шаги призваны убедить Соединённые Штаты в том, что Германия больше не является автократией — и, следовательно, имеет право на переговоры на их условиях.\n\nДорога каждая минута, и каждая задержка рискует новым кровопролитием."
 ww1_germanrework.150.a: "Если демократия приносит мир, пусть так и будет."
 ww1_germanrework.151.t: "Канцлер Михаэлис уходит в отставку"
 ww1_germanrework.151.d: "Георг Михаэлис, назначенный канцлером после падения Бетман-Гольвега, оказался неспособен консолидировать власть. Не имея ни доверия военного руководства, ни поддержки основных партий Рейхстага, Михаэлис подвергался критике за свою нерешительность и отстранённость.\n\nНа фоне растущего разочарования и внутренних разногласий он подал в отставку. На его месте Георг фон Гертлинг — более опытный политик, связанный с партией Центра, — получил предложение сформировать новое правительство. Ожидается, что Гертлинг будет поддерживать осторожное сотрудничество с парламентским большинством."
 ww1_germanrework.151.a: "Слабый канцлер падает, другой занимает его место."
 ww1_germanrework.152.t: "Канцлер Гертлинг уходит в отставку"
 ww1_germanrework.152.d: "Поскольку Рейх сталкивается с политическими волнениями и растущими призывами к реформам, канцлер Георг фон Гертлинг подал в отставку. Будучи убеждённым консерватором, ему не хватало гибкости и легитимности для управления новыми реалиями. На его месте Кайзер назначил принца Макса фон Баденского — либерально настроенного аристократа, считающегося приемлемым как для монархистов, так и для реформистов. Его мандат: сохранить монархию через перемены, а не через сопротивление."
 ww1_germanrework.152.a: "Это может сработать."
 USA_want_us_democratic: "§R§Y[USA.GetFlag][USA.getName]§! не примет мира, если мы не станем §3Демократической нацией§!.§!"
 ww1_germanrework.153.t: "Людендорф уходит в отставку"
 ww1_germanrework.153.d: "Под растущим политическим давлением и на фоне усиления гражданского контроля над военными делами генерал Эрих Людендорф подал в отставку. Когда-то архитектор тотальной войны и фактический лидер Империи, его авторитет стал помехой в меняющейся Германии. Его уход знаменует конец военного доминирования в политике — и начало хрупкого превосходства гражданских властей."
 ww1_germanrework.153.a: "Старый порядок отступает."
 ww1_germanrework.154.t: "OHL становится беспокойным"
 ww1_germanrework.154.d: "Поскольку Австро-Венгрия разваливается под воздействием внутренних мятежей и военных поражений, бремя победы теперь ложится squarely на плечи Германии. OHL, уже раздражённый гражданскими колебаниями и политическими компромиссами, считает ситуацию плачевной. Гинденбург и Людендорф настаивают на смелом одностороннем наступлении — утверждая, что только решительный удар может восстановить стратегический баланс. Гражданские лидеры остаются в стороне, поскольку военные устанавливают фактический контроль."
 ww1_germanrework.154.a: "Меч снова ведёт Рейх."
 ww1_germanrework.155.t: "Забастовка на берлинских оружейных заводах"
 ww1_germanrework.155.d: "Нормирование, инфляция и падение заработной платы создали взрывоопасную напряжённость в промышленных районах Берлина. Когда правительство объявило о дальнейшем сокращении норм выдачи хлеба и мяса, рабочие ключевых оружейных заводов начали массовую забастовку. Организованная отчасти цеховыми старостами левого толка и радикальными элементами СДПГ, акция протеста была не просто протестом против голода — это было предупреждение против милитаристского правления и человеческой цены бесконечной войны.\n\nК счастью, забастовка длилась недолго, и рабочие вернулись к работе. Но правительство опасается, что ситуация ухудшится при более жёстком нормировании."
 ww1_germanrework.155.a: "Народ приходит в отчаяние."
 ww1_germanrework.156.t: "Стрельба в школе Бремена"
 ww1_germanrework.156.d: "В католической школе Святой Марии в Бремене произошла ужасная стрельба, в результате которой пять юных девочек погибли и более двадцати получили ранения. Стрелок, опознанный как 29-летний безработный учитель Хайнц Шмидт, открыл шквальный огонь внутри школы, прежде чем был обезврежен сотрудниками.\n\nНа похоронах жертв присутствовало более 30 000 скорбящих, включая кайзера Вильгельма, который лично изменил свой график, чтобы присутствовать, и впоследствии после стрельбы выступал за ужесточение законов о контроле над оружием."
 ww1_germanrework.156.a: "Оружию не место в наших классах!"
 ww1_germanrework.157.t: "Авиакатастрофа на острове Гельголанд"
 ww1_germanrework.157.d: "Цеппелин LZ 14, недавно переданный Императорским военно-морским силам Германии и получивший обозначение L-1, трагически разбился в Северном море во время учебной миссии. Дирижабль, вылетевший в неблагоприятных погодных условиях с 20 людьми на борту, столкнулся с сильными штормами и холодным дождем, из-за которых его газ сжался. В результате L-1 опустился на море примерно в 20 милях от Гельголанда, в конце концов разломившись надвое. Тринадцать человек погибли, когда управляемая гондола затонула, в то время как семеро были успешно спасены моторными торпедными катерами."
 ww1_germanrework.157.a: "Будем надеяться, эта трагедия не повторится."
 ww1_germanrework.158.t: "Авиакатастрофа в Йоханнистале"
 ww1_germanrework.158.d: "Дирижабль Императорских ВМС Германии L 2, обозначенный как LZ 18, попал в катастрофическую аварию во время испытательного полета, в результате которой погибли все 28 человек на борту, включая военнослужащих и экипаж.\n\nПримерно в 10:30 утра по местному времени во время обычного маневра недалеко от аэродрома Йоханнисталь произошло случайное возгорание выходящего водорода от носового двигателя, что привело к мощному взрыву. Очевидцы сообщили о громком взрыве, после которого дирижабль рухнул вниз в пламени с высоты 270 метров.\n\nСреди погибших были члены испытательной комиссии Адмиралтейства, включая семь офицеров, которые были тесно связаны с кайзером Вильгельмом. Пилот, капитан Глут, был известен своей долгой службой у графа Цеппелина.\n\nЕдинственный выживший, лейтенант барон фон Бойль, был гостем на борту, но скончался от тяжелых ранений. Обломки были обнаружены разбросанными по месту катастрофы, а останки пассажиров были найдены на расстоянии до четверти мили."
 ww1_germanrework.158.a: "Еще одна катастрофа дирижабля?!"
 ww1_germanrework.159.d: "Дирижабль Императорских ВМС Германии L 2 трагически взорвался во время испытательного полета, убив всех 28 человек на борту, включая пассажиров и экипаж.\nПримерно в 10:30 утра выделившийся водород воспламенился в носовом двигателе, вызвав катастрофический взрыв. Дирижабль разбился недалеко от аэродрома Йоханнисталь, к юго-востоку от Берлина, чуть более чем через месяц после катастрофы на острове Гельголанд.\nСвидетели описали громкий взрыв и пламя, когда L-2, предназначенный стать флагманом Германии, падал с высоты 270 метров.\nДобравшись до места крушения, наблюдатели увидели искореженные обломки, а единственный выживший, лейтенант барон фон Бойль, получил смертельные ранения. Взрыв с силой выбросил пассажиров из гондолы, их останки были найдены в четверти мили."
 ww1_germanrework.160.t: "Бракосочетание принцессы Виктории Луизы и принца Эрнеста Августа"
 ww1_germanrework.160.d: "Принц Эрнест Август Ганноверский женился на принцессе Виктории Луизе Прусской, объединив королевские семьи Гогенцоллернов и Ганноверов после многолетней вражды. Свадьба ознаменовала важный момент, собрав европейских монархов, включая кайзера Вильгельма II, короля Соединенного Королевства Георга V и царя Николая II.\n\nЭтот союз родился из искреннего жеста соболезнования императора Вильгельма II после трагической гибели Георга Вильгельма, наследного принца Ганноверского, в автомобильной аварии в 1912 году. Эрнест Август, единственный выживший сын герцога Камберлендского, отправился в Берлин, чтобы выразить благодарность, и в конце концов влюбился в дочь императора.\n\nЭрнест Август принес присягу на верность Германской империи и занял военную должность в прусской армии.\n\nВ качестве жеста доброй воли кайзер даровал королевское помилование двум заключенным британским шпионам в качестве свадебного подарка. Георг V дал официальное согласие на брак, требуемое Актом о королевских браках."
 ww1_germanrework.160.a: "Frohe Hochzeit!"
 hohenzollern_hanover_fued_ended: "Вражда Гогенцоллернов и Ганноверов прекращена"
 ww1_germanrework.161.t: "Королевская свадьба положила конец многолетней вражде"
 ww1_germanrework.161.d: "Принц Эрнест Август Ганноверский женился на принцессе Виктории Луизе Прусской, объединив королевские семьи Гогенцоллернов и Ганноверов после многолетней вражды. Свадьба ознаменовала важный момент, собрав европейских монархов, включая германского императора Вильгельма II, короля Соединенного Королевства Георга V и царя Николая II.\n\nЭтот союз родился из искреннего жеста соболезнования императора Вильгельма II после трагической гибели Георга Вильгельма, наследного принца Ганноверского, в автомобильной аварии в 1912 году. Эрнест Август, единственный выживший сын герцога Камберлендского, отправился в Берлин, чтобы выразить благодарность, и в конце концов влюбился в дочь императора."
 ww1_germanrework.161.b: "Sovet da lyubov!"
 ww1_germanrework.161.c: "Настоящий брак по любви."
 ww1_germanrework.162.t: "Немецкие подводные лодки потопили конвой"
 ww1_germanrework.162.d: "Несмотря на наш нейтралитет и наше законное право отправлять суда в Северное море, сообщения указывают на то, что мы потеряли конвой в результате атаки немецкой подводной лодки. Немецкое правительство отрицало свою ответственность, заявив, что не совершало такой атаки, но доказательства указывают на то, что они солгали. Эта ужасная авария, вероятно, вызвана доктриной неограниченной подводной войны, заставляющей немецкие суда атаковать практически любую цель на виду, включая нас. Мы уже отправили ноту протеста немецкому правительству, мы надеемся, что это удержит их от продолжения такой ужасной доктрины."
 ww1_germanrework.162.a: "Упокой, Господи, их души."
 ww1_germanrework.163.t: "[FROM.getAdjective] конвой потоплен"
 ww1_germanrework.163.d: "Сообщения указывают на то, что мы поразили нейтральную подводную лодку в спорном районе между Северным морем и проливом Ла-Манш. Судно, [FROM.getAdjective] коммерческое судно, было поражено одной из наших подводных лодок V-30. Случайный выстрел был вызван нашей доктриной неограниченной коммерческой войны, заставляющей наши подводные лодки атаковать торговые пути на виду. [FROM.getLeader] отправил письмо с протестом, которое мы проигнорировали, отказавшись от ответственности за эту ужасную аварию. Нам следует быть осторожными, чтобы не потопить больше их судов."
 ww1_germanrework.163.a: "Упокой, Господи, их души."
 ww1_germanrework.164.t: "Лузитания уничтожена"
 ww1_germanrework.164.d: "В Берлин поступили новости: U-20 успешно потопила британский лайнер «Лузитания», предположительно перевозивший оружие под видом гражданского судна. Адмиралтейство приветствует это как триумф военно-морской стратегии. Однако в Министерстве иностранных дел распространяется беспокойство — на борту находилось более сотни американцев. Хотя Рейх не может позволить себе проявлять слабость, некоторые министры предупреждают, что Вашингтон может быть побужден к действию. Пресса разделилась, но послание с открытого моря ясно: никаких исключений, никаких извинений."
 ww1_germanrework.164.a: "Пусть мир увидит цену помощи Британии."
 ww1_germanrework.165.t: "Лузитания потоплена"
 ww1_germanrework.165.d: "Британский лайнер «Лузитания» был потоплен немецкой подводной лодкой, в результате чего погибло более сотни американских граждан. Возмущение распространяется по всей стране. Газеты требуют действий, и в Конгрессе звучат призывы к решительному ответу. Однако президент [USA.getLeader] стоит перед дилеммой: пригрозить Берлину последствиями, если неограниченная подводная война продолжится, или сохранять нейтралитет и избегать дальнейшего вовлечения в далекую войну?"
 ww1_germanrework.165.a: "Предъявить официальный ультиматум. Они должны отступить."
 ww1_germanrework.165.b: "Мы скорбим о погибших, но остаемся в стороне — пока."
 ww1_germanrework.166.t: "Американский ультиматум вручен"
 ww1_germanrework.166.d: "Из Вашингтона прибыла нота: Соединенные Штаты требуют, чтобы мы ограничили наши операции подводных лодок против торговых судов и официально признали потерю американских жизней на борту «Лузитании». Министерство иностранных дел призывает к осторожности, чтобы не спровоцировать вступление США в войну. Но в Адмиралтействе и OHL многие считают любую уступку слабостью. Теперь Рейх стоит перед трудным выбором — умиротворять или бросить вызов."
 ww1_germanrework.166.a: "Мы смягчим нашу военно-морскую политику — пока."
 ww1_germanrework.166.b: "Мы им ничего не должны. Война превыше всего."
 ww1_germanrework.167.t: "Германия отступает"
 ww1_germanrework.167.d: "Берлин дал официальный ответ на наш ультиматум. Имперское правительство соглашается ограничить подводную войну против гражданских судов и признает потерю американских жизней на борту «Лузитании». Президент [USA.getLeader] приветствует эту ноту как дипломатический успех, хотя многие в Конгрессе остаются скептиками. Пока напряженность спадает — но доверие к немецким намерениям остается хрупким."
 ww1_germanrework.167.a: "Они больше никогда не должны пытаться сделать это!"
 USA_might_join_if_USW_is_at_level_2: "§R§Y[USA.getFlag][USA.getName]§! может присоединиться к Антанте, если мы не ограничим нашу неограниченную подводную войну!§!"
 ww1_germanrework.168.t: "Германия отвергает наши требования"
 ww1_germanrework.168.d: "Немецкое правительство отказалось смягчить свою подводную кампанию и отклонило наш протест по поводу «Лузитании». Это неповиновение в сочетании с продолжающимися атаками на гражданские суда не оставляет нам выбора. Сегодня президент [USA.getLeader] обращается к Конгрессу с просьбой объявить войну. Соединенные Штаты не будут стоять сложа руки, пока их граждане гибнут, а их честь оскорблена. Америка идет на войну."
 ww1_germanrework.168.a: "Мир должен быть сделан безопасным для демократии."
 ww1_germanrework.169.t: "Соединенные Штаты объявляют войну Германии"
 ww1_germanrework.169.d: "Исторический поворот: Соединенные Штаты официально объявили войну Германской империи. Решение последовало за растущей напряженностью из-за кампании Германии по неограниченной подводной войне, наиболее примечательным эпизодом которой стало потопление британского лайнера «Лузитания», в результате которого погибло более 100 американских граждан. Несмотря на предыдущие дипломатические усилия, Берлин отказался свернуть свои операции. В Вашингтоне президент [USA.getLeader] осудил атаки как оскорбление международного права и человеческого достоинства."
 ww1_germanrework.169.a: "Война становится по-настоящему глобальной."
 ww1_germanrework.170.t: "Конвой потоплен немецкими подводными лодками"
 ww1_germanrework.170.d: "Несмотря на наши предупреждения после потопления «Лузитании», немецкие власти, похоже, возобновили свою доктрину неограниченной подводной войны, что привело к гибели сотен американцев за последние несколько дней. Суда были гражданскими кораблями, перевозившими продовольствие во Францию и Великобританию, что делало их легкой добычей. В сердце и уме Германия теперь является смертельным врагом американского народа."
 ww1_germanrework.170.a: "Пришло время присоединиться к Антанте"
 ww1_germanrework.192.t: "Брюквенная зима"
 ww1_germanrework.192.d: "Великая война дорого обходится [GER.GetForeignNameDef], из-за морских блокад, от которых мы страдаем, нам сегодня не хватает еды для нашего населения. Несмотря на нормирование, наш народ страдает от ужасного голода что угрожает подорвать наши военные усилия."
 ww1_germanrework.192.a: "Шокирует..."
 ww1_germanrework.193.t: "Наступление Людендорфа"
 ww1_germanrework.193.d: "[GER.GetForeignNameDefCap] чувствует, что военная ситуация становится все более неблагоприятной, и предпринимает попытку тотального наступления, чтобы изменить ситуацию на окопавшемся Западном фронте. Если это наступление провалится, [GER.GetForeignNameDef], возможно, больше не сможет держаться."
 ww1_germanrework.193.a: "Последний выстрел, который рискует жизнью Империи."
 ww1_germanrework.193.b: "Это отчаянный шаг!"
 ww1_germanrework.193.c: "Кажется, победа или поражение решены."
 ww1_germanrework.194.t: "Война на Западе начинается"
 ww1_germanrework.194.d: "С началом военных действий против [FRA.GetNameDef] время теоретических планов подошло к концу. Германский генеральный штаб отдал приказ о приведении в действие Aufmarsch West - нашего тщательно подготовленного стратегического развертывания и оперативного плана для войны на Западном фронте.\n\nНаши армии теперь выступают в поход, выполняя заранее определённую доктрину, которая продиктует начальную фазу этого великого противостояния. Судьба войны, а вместе с ней и Империи, теперь зависит от успеха этой первой, решающей кампании."
 ww1_germanrework.194.a: "За Бога, Кайзера и Отечество!"
 ww1_germanrework.194.b: "Выдвинуть Бельгии ультиматум."
 ww1_germanrework.195.t: "Бельгия отвергает ультиматум"
 ww1_germanrework.195.d: "Из Брюсселя поступил официальный ответ. Король Альберт и бельгийское правительство категорически отвергли наш ультиматум. Ссылаясь на суверенитет своей нации и её гарантированный нейтралитет по Лондонскому договору 1839 года, они отказываются предоставить проход любой иностранной армии.\n\nИх ответ твёрд: они будут защищать свой нейтралитет всеми имеющимися средствами. Эта глупая гордость дорого им обойдётся. Вторжение должно начаться немедленно."
 ww1_germanrework.195.a: "Так тому и быть."
 ww1_germanrework.196.t: "Проход через Бельгию обеспечен"
 ww1_germanrework.196.d: "Наш посол в Брюсселе докладывает, что бельгийское правительство уступило нашим требованиям. Столкнувшись с подавляющей мощью германской армии и угрозой опустошения, король Альберт неохотно согласился предоставить нашим силам беспрепятственный проход через свою страну для удара по [FRA.GetNameDefCap].\n\nХотя они подчинились, их сотрудничество порождено принуждением, а не дружбой. Наши силы должны оставаться бдительными, однако стратегическое преимущество неоспоримо. Путь в северную Францию открыт."
 ww1_germanrework.196.a: "План выполняется безупречно."
 BEL_granted_german_passage: "§YБельгия§! предоставила проход §YГермании§!"
 ww1_germanrework.197.t: "Нидерланды нам противятся"
 ww1_germanrework.197.d: "Из Гааги прибыла депеша. Несмотря на наше настойчивое требование, правительство Нидерландов отказало нам в запросе на военный доступ. Их упрямая приверженность нейтралитету теперь твёрдо стоит на пути наших оперативных планов. Это неповиновение, хотя, возможно, и достойное восхищения для некоторых, является препятствием, с которым необходимо разобраться."
 ww1_germanrework.197.a: "Они пожалеют об этом решении."
 ww1_germanrework.198.t: "Нидерланды подчиняются"
 ww1_germanrework.198.d: "Прекрасные новости от наших дипломатов в Гааге. Голландское правительство, признав тщетность сопротивления, согласилось на наши условия и предоставит проход нашим армиям. Их территория теперь открыта для нас, обеспечивая новый, беспрепятственный маршрут для наших сил. Эта стратегическая победа достигнута без единого выстрела."
 ww1_germanrework.198.a: "Самое разумное решение."
 ww1_germanrework.199.t: "Нидерланды бросают вызов Антанте"
 ww1_germanrework.199.d: "Антанта выполнила свои угрозы. После того, как правительство Нидерландов мужественно отказалось склониться перед их грубым ультиматумом, Антанта объявила войну [HOL.GetNameDef]. В ошеломляющем проявлении лицемерия они теперь наказывают голландцев за решение, которое им было навязано, вторгаясь в страну, чей нейтралитет они якобы отстаивали.\n\nЭтот безрассудный акт агрессии не оставил голландцам иного выбора. В поисках защиты от воинственности Антанты, [HOL.GetNameDefCap] официально обратилось с просьбой о вступлении в Центральные державы. Их армия и ресурсы теперь на нашей стороне."
 ww1_germanrework.199.a: "Их мужество будет вознаграждено нашей защитой."
 ww1_germanrework.200.t: "Ультиматум из [GER.capital.GetCapitalVictoryPointName]"
 ww1_germanrework.200.d: "Сегодня утром генерал фон Эммих передал суровый ультиматум от имени [GER.GetForeignNameDefCap]: предоставить свободный проход [GER.GetAdjective] армии для атаки на Францию. Они обещают относиться к нам как к дружественной нации и предлагают щедрую компенсацию за любой ущерб, но невысказанная угроза очевидна. \n\nВ ответ король Альберт созвал королевский совет, чтобы определить судьбу нашей нации. Уступить - значит пожертвовать нашим суверенитетом и честью. Оказать сопротивление - означало бы войну с одной из величайших военных держав мира. На кону стоит само существование нашего королевства."
 ww1_germanrework.200.a: "Бельгия - это страна, а не дорога!"
 ww1_germanrework.200.b: "У нас нет другого выбора..."
 ww1_germanrework.201.t: "Ультиматум из [GER.capital.GetCapitalVictoryPointName]"
 ww1_germanrework.201.d: "[GER.GetForeignNameDefCap] выдвинул суровый ультиматум, требуя прохода для своих армий через нашу территорию. Они заявляют, что это необходимый стратегический шаг для их безопасности, но это явное нарушение нашего давнего нейтралитета. Отказ означает неминуемую войну с военным титаном. Согласие - означает капитуляцию нашего суверенитета и привлечение гнева Антанты на нашу землю. Нашему правительству предстоит взвесить цену неповиновения против позора подчинения."
 ww1_germanrework.201.a: "Наш нейтралитет не обсуждается!"
 ww1_germanrework.201.b: "Мы не можем сражаться с ними... мы должны уступить."
 ww1_germanrework.202.t: "Голландский нейтралитет нарушен"
 ww1_germanrework.202.d: "Мы только что получили разведданные о том, что правительство [HOL.GetNameDefCap] капитулировало перед [GER.GetAdjective] ультиматумом, предоставив их армиям свободный проход. Этот акт полностью компрометирует их нейтралитет и создаёт серьёзную стратегическую угрозу, позволяя [GER.GetForeignNameDef] обойти наши северные укрепления. Хотя их могли принудить, их подчинение ставит под угрозу все наши военные усилия. Мы должны решить, принудительно вмешаться и рассматривать их как враждебную державу или принять эту неприятную реальность и сосредоточить наши силы против главной угрозы."
 ww1_germanrework.202.a: "Они сделали свой выбор. Теперь они с немцами."
 ww1_germanrework.202.b: "Мы не можем позволить себе открывать ещё один фронт."
 ww1_germanrework.203.t: "Ультиматум из [ENT.capital.GetCapitalVictoryPointName]"
 ww1_germanrework.203.d: "Чернила на нашем соглашении с [GER.GetForeignNameDef] ещё не высохли, как из Антанты уже прибыла яростная депеша. Они обвиняют нас в отказе от нейтралитета и требуют немедленно аннулировать военный проход для Германии, изгнать все [GER.GetAdjective] войска и закрыть для них наши границы.\n\nУгроза очевидна: если мы не подчинимся, они будут считать нас союзником Центральных держав и действовать соответственно. Однако отменить своё решение сейчас, несомненно, навлечёт на себя гнев [GER.GetForeignNameDefCap], чьи армии стоят у самого нашего порога. Мы оказались между двух титанов, и любой выбранный нами путь ведёт к войне."
 ww1_germanrework.203.a: "Мы сделали свой выбор. Мы не поддадимся на угрозы."
 ww1_germanrework.203.b: "Это безумие! Мы должны немедленно умиротворить Антанту!"
 ww1_germanrework.204.t: "Предательство из Гааги"
 ww1_germanrework.204.d: "Из Гааги пришло позорное сообщение. Не имея духу держаться своего собственного решения, правительство [HOL.GetNameDef] склонилось перед ультиматумом Антанты.\n\nОни отменяют наш военный проход и требуют немедленного вывода всех наших войск. Эта трусливая перемена срывает наши стратегические планы на Западном фронте. Теперь мы должны решить, как ответить на это предательство."
 ww1_germanrework.204.a: "Они сделали себя нашими врагами. Это будет означать войну."
 ww1_germanrework.204.b: "Нам нельзя отвлекаться. Главный враг ждёт."
 GER_send_zimmermann_telegram: "$great_power_politics_great_war_tt_icon$ Отправить Телеграмму Циммермана в [FROM.GetName]"
 GER_date_naval_report: "$great_power_politics_great_war_tt_icon$ [GetMonth] Морской Отчет"
 GER_date_naval_report_desc: "Каждый месяц мы получаем полный отчёт о результатах нашей подводной войны. Мы должны быть осторожны, чтобы не уничтожать нейтральные конвои, даже если это кажется несовместимым с нашей текущей доктриной..."
