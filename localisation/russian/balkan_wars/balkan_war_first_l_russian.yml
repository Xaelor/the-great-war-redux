l_russian:
 BW1_war_with_turkey: "$great_power_politics_balkan_powder_keg_tt_icon$ Война с Османской империей"
 BLL_attack_together_tt: "Если кто-либо из балканских стран нападёт на §Y[TUR.GetForeignName]§! до нас, мы также объявим войну туркам."
 BLL_replace_mission_tt: "Если §YБолгария§! станет главой §CБалканской лиги§! и мы являемся её членом, то эта миссия будет заменена информационным решением."
 BW1_info_when_attack: "$great_power_politics_balkan_powder_keg_tt_icon$ Мы нападём на Османскую империю через §Y[?BLL.days_mission_timeout@BW1_war_with_turkey]§! дней"
 BW1_armistice_mission: "$great_power_politics_balkan_powder_keg_tt_icon$ Перемирие с балканскими странами"
 BW1_armistice_mission_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ Перемирие с [TUR.GetForeignName]"
 BW1_london_conference: "$great_power_politics_balkan_powder_keg_tt_icon$ Лондонская конференция"
 BW1_armistice_tt: "§Y[TUR.GetForeignName]§! предложит §Yбалканским странам§! подписать перемирие. Также начнётся мирная конференция в §YЛондоне§!."
 BW1_armistice_TUR_ser: "Перемирие с [SER.getName]"
 BW1_armistice_TUR_bul: "Перемирие с [BUL.getName]"
 BW1_armistice_TUR_gre: "Перемирие с [GRE.getName]"
 BW1_armistice_TUR_mnt: "Перемирие с [MNT.getName]"
 BW1_armistice_balkans: "Перемирие с [TUR.GetForeignName]"
 BW1_balkan_league_won_tt: "§RОсманская империя§! потеряла большую часть своих европейских территорий, и §CБалканская лига§! будет считаться §Yпобедителем§! этой войны и получит §Yновые территории§!."
 BW1_balkan_turkey_won_tt: "§CБалканской лиге§! не удалось изгнать турок с их §Yевропейских владений§!, и §RОсманская империя§! будет считаться §Yпобедителем§! этой войны, сохранив свои территории и получив §YКрит§! в качестве компенсации."
 BW1_turkey_crushing_defeat_tt: "§Y[TUR.GetForeignName]§! потерпела §Rсокрушительное поражение§! (потеряла контроль над §YКонстантинополем§! или имеет более §Y30%§! (§Y40%§! во время Итало-турецкой войны) прогресса капитуляции)"
 BW1_balkans_crushing_defeat_tt: "§YБалканские страны§! потерпели §Rсокрушительное поражение§! (§Y[BUL.getName]§! капитулировала или §Y[SER.getName]§! и §Y[GRE.getName]§! капитулировали)"
 GRE_thessaloniki_race: "Гонка за Салоники"
 ww1_firstbalkan.121.t: "Перемирие с балканскими странами"
 ww1_firstbalkan.121.d: "Поскольку боевые действия зашли в тупик, мы можем предложить балканским странам подписать с нами перемирие. Кроме того, для прекращения войны была созвана мирная конференция в Лондоне."
 ww1_firstbalkan.121.a: "Конечно, почему бы и нет"
 ww1_firstbalkan.121.b: "Нет!"
 ww1_firstbalkan.122.t: "Перемирие с [FROM.getName]"
 ww1_firstbalkan.122.d: "Поскольку боевые действия зашли в тупик, мы получили предложение о перемирии от [FROM.getName], следует ли нам принять его?. Кроме того, для прекращения войны была созвана мирная конференция в Лондоне."
 ww1_firstbalkan.122.a: "Нам это нужно"
 ww1_firstbalkan.122.b: "Никакого перемирия с турками!"
 ww1_firstbalkan.124.t: "Окончание перемирия"
 ww1_firstbalkan.124.d: "В Османской империи произошёл государственный переворот, и новое правительство теперь хочет продолжить войну. Теперь мы можем продолжить нашу кампанию и наконец очистить Балканы от этой турецкой нечести."
 ww1_firstbalkan.124.a: "Продолжить наступление!"
 ww1_firstbalkan.125.t: "Окончание перемирия"
 ww1_firstbalkan.125.d: "Предыдущее правительство совершило ошибку, заключив перемирие с этими крысами и согласившись на передачу им европейских территорий. Мы должны немедленно продолжить войну и показать наше величие!"
 ww1_firstbalkan.125.a: "Начать наступление!"
 ww1_firstbalkan.126.t: "Государство [FROM.getName] приняло перемирие"
 ww1_firstbalkan.126.d: "[FROM.getName] согласился подписать с нами перемирие на время проведения мирной конференции в Лондоне."
 ww1_firstbalkan.126.a: "У нас есть время для отдыха"
 ww1_firstbalkan.127.t: "Государство [FROM.getName] отклонило перемирие"
 ww1_firstbalkan.127.d: "[FROM.getName] решил, что они сильнее нас и не нуждаются в перемирии, что ж, посмотрим."
 ww1_firstbalkan.127.a: "Война до победного конца!"
 BW1_separated_peace_tt: "Чтобы добиться §Yбыстрой победы§! в этой войне, мы должны принудить к капитуляции §Y[BUL.getName]§! или §Y[SER.getName]§! и §Y[GRE.getName]§!."
 ww1_firstbalkan.128.t: "[FROM.getName] подписывает мир"
 ww1_firstbalkan.128.d: "[FROM.getName] была побеждена нашей непобедимой армией"
 ww1_firstbalkan.128.a: "Кто следующий?"