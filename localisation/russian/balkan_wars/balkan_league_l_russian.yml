l_russian:
 ww1_balkan.1.t: "Балканская Лига"
 ww1_balkan.1.d: "Турцию не просто так называют больным человеком Европы, она уже давно не та страна, что наводила ужас на всех. У нас появились шансы взять реванш и освободить наши земли, некогда завоеванные ими. Мы можем попытаться предложить нашим балканским соседям заключить союз, чтобы стать сильнее. Но нужно не забывать, что каждый из них хочет отхватить кусок пирога побольше, что может привести к конфликтам в будущем. Что мы думаем по этому поводу?"
 ww1_balkan.1.a: "Мы должны объединиться против турок!"
 ww1_balkan.1.b: "Этот союз - безумие."
 ww1_balkan.2.t: "Предложение от [FROM.GetName]"
 ww1_balkan.2.d: "Из [FROM.getNameDef] прибыла официальная дипломатическая нота. В своём послании их правительство выражает желание заключить военный союз против Османской империи с общей целью освобождения оставшихся христианских территорий на Балканах.\nПредложение простое: объединить наши силы, скоординировать военные усилия и выступить единым фронтом против султана. Наш сосед готов подписать договор о взаимной обороне и нападении, обязывающий обе страны к общему делу.\nТеперь решение за нами."
 ww1_balkan.2.a: "Мы принимаем предложение"
 ww1_balkan.2.b: "Мы отклоняем предложение"
 ww1_balkan.3.t: "Провал Балканского союза"
 ww1_balkan.3.d: "Новость быстро разнеслась по балканским столицам: переговоры между Сербией и Болгарией о военном союзе против Османской империи провалились. Несмотря на общую цель освобождения оставшихся христианских территорий от османского владычества, взаимные подозрения и противоречивые территориальные амбиции оказались непреодолимыми."
 ww1_balkan.3.a: "Каждый сам за себя"
 ww1_balkan.4.t: "Приглашение от [FROM.getName]"
 ww1_balkan.4.d: "От недавно сформированного Балканского союза прибыл посланник с официальным приглашением от союзных государств. В письме говорится о великой коалиции против Османской империи - объединённых усилиях по окончательному освобождению оставшихся христианских территорий Балкан."
 ww1_balkan.4.a: "Поехали"
 ww1_balkan.5.t: "[FROM.getName] соглашается"
 ww1_balkan.5.d_ser: "Болгары согласились возглавить военный союз против Турции. Мы обсудили будущий раздел турецких территорий, хотя осталось решить ещё несколько вопросов, но это больше не является проблемой. Теперь мы должны начать серьёзную военную подготовку, чтобы обеспечить победу в предстоящем конфликте."
 ww1_balkan.5.d_bul: "Сербы сделали мудрый выбор и решили присоединиться к союзу против Турции под нашим руководством. Мы обсудили будущий раздел турецких территорий, хотя осталось решить ещё несколько вопросов, но это больше не является проблемой. Теперь мы должны начать серьёзную военную подготовку, чтобы обеспечить победу в предстоящем конфликте."
 ww1_balkan.5.a: "Хорошо"
 ww1_balkan.6.t: "[FROM.getName] соглашается"
 ww1_balkan.6.d: "Государство [FROM.getName] приняло предложение присоединиться к союзу, и теперь мы сильнее и имеем больше шансов на победу над Османской империей."
 ww1_balkan.6.a: "Отлично"
 BLL_form_the_alliance: "Один в поле не воин"
 BLL_anti_ottoman_crusade: "Антиосманский крестовый поход"
 BLL_anti_ottoman_crusade_desc: "Теперь, когда Балканский союз сформирован, пришло время готовить наш крестовый поход против османов за освобождение Балкан. Мы договоримся с союзниками о том, кто что получит в итоге."
 BUL_lone_liberator: "Одинокий освободитель"
 BUL_lone_liberator_desc: "Формирование Балканского союза провалилось из-за споров о Македонии. Даже без союза Балканы всё равно должны быть освобождены. Своими силами мы восстановим границы Великой Болгарии по Сан-Стефанскому договору!"
 BUL_buy_french_equipment: "Купить артиллерию из Франции"
 BUL_buy_austrian_equipment: "Купить снаряжение из [AUS.GetAuhName]"
 SER_buy_french_equipment: "$BUL_buy_french_equipment$"
 SER_buy_austrian_equipment: "$BUL_buy_austrian_equipment$"
 BUL_buy_austrian_equipment_desc: "Наша промышленность слишком слаба, чтобы самостоятельно финансировать войну против османов, мы должны найти другой способ получить снаряжение. Мы можем обратиться к великим державам, чтобы закупить у них снаряжение для подготовки к борьбе против османов."
 SER_army_mobilization: "Призыв к набору добровольцев"
 BUL_army_mobilization: "Мобилизация армии"
 SER_economical_mobilization: "Экономическая Мобилизация"
 SER_economical_mobilization_desc: "Нам необходимо подготовить нашу экономику к предстоящей войне и обеспечить достаточное количество ресурсов для ведения боевых действий."
