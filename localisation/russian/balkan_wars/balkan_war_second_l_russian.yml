l_russian:
 BW2_preventing_war_tt: "Войны можно избежать, если §2Сербия§! передаст §Y[203.getName]§!, §Y[1258.getName]§! и §Y[1140.getName]§! §GБолгарии§!."
 BW2_preventing_ahist_war_tt: "Войны можно избежать, если §GБолгария§! передаст §Y[1258.getName]§! и §Y[1140.getName]§! §2Сербии§!, а §Y[731.getName]§! и §Y[345.getName]§! — §4Греции§!"
 BW2_war_with_serbian_traitor: "$great_power_politics_balkan_powder_keg_tt_icon$ Вороватые союзники"
 BW2_war_with_serbian_traitor_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ Болгария готовит нападение!"
 BW2_war_with_bulgarian_traitor: "$great_power_politics_balkan_powder_keg_tt_icon$ Война с [BUL.getName]"
 BW2_war_with_bulgarian_traitor_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ Сербия готовит нападение!"
 BW2_intervention_in_bulgaria: "$great_power_politics_balkan_powder_keg_tt_icon$ Интервенция в [BUL.getName]"
 BW2_war_timer: "$great_power_politics_balkan_powder_keg_tt_icon$ Вторая Балканская война"
 BW2_balkans_victory_tt: "§GБолгария§! терпит поражение от войск §Cантиболгарской коалиции§!, но ещё не сдаётся. Если §GБолгария§! не предпримет ничего, она будет считаться §Rпроигравшей§! в этой войне."
 BW2_bulgaria_victory_tt: "§GБолгария§! сокрушает войска §Cантиболгарской коалиции§!. Если ничего не изменится, §GБолгария§! будет считаться §Yпобедителем§! в этой войне."
 BW2_stalemate_tt: "§GБолгария§! и §CАнтиболгарская коалиция§! одновременно оказались в сложной ситуации, они подпишут перемирие с сохранением статус-кво, если ничего не изменится."
 BW2_bulgaria_crushing_defeat_tt: "§Y[BUL.getName]§! потерпела §Rсокрушительное поражение§! (потеряла контроль над §YСофией§! или имеет более §Y85%§! прогресса капитуляции)"
 BW2_balkans_crushing_defeat_tt: "§YАнтиболгарская коалиция§! потерпела §Rсокрушительное поражение§! (§Y[SER.getName]§! капитулировала или §Y[GRE.getName]§! и §Y[ROM.getName]§! (если воюет) капитулировали)"
 BW2_turkish_intervention_turkey_total_defeat_tt: "§Y[TUR.GetForeignName]§! потерпела §Rсокрушительное поражение§! (потеряла контроль над §YКонстантинополем§! или имеет более §Y10%§! (§Y20%§! во время Итало-турецкой войны) прогресса капитуляции)"
 BW2_turkey_intervention: "$great_power_politics_balkan_powder_keg_tt_icon$ Интервенция в [BUL.getName]"
 BW2_turkey_intervention_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ Турецкая интервенция"
 TUR_bw2_victory_tt: "§R[TUR.GetForeignName]§! смогла разгромить §Gболгарскую армию§! и оккупировать свои бывшие территории, теперь §Yона получит их обратно.§!"
 TUR_bw2_lose_tt: "§R[TUR.GetForeignName]§! полностью провалила вторжение и не смогла разгромить §Gболгарскую армию§!, всё останется так, как было до вторжения."
 BW2_dissolve_wth: "Распустить [WTH.getNameDef]"
 BW2_dissolve_wth_tt: "Чем быстрее мы разберёмся с этим недоразумением, тем лучше для нас."
 TUR_create_wth: "$great_power_politics_balkan_powder_keg_tt_icon$ Создать марионеточное правительство в §YФракии§!"
 SER_cede_macedonia_to_bulgaria: "$great_power_politics_balkan_powder_keg_tt_icon$ Передать Македонию государству §Y[BUL.getName]§!"
 BUL_cede_macedonia_to_serbia: "$great_power_politics_balkan_powder_keg_tt_icon$ Передать Македонию §YАнтиболгарской коалиции§!"
 BW2_info_when_attack_ahist: "$great_power_politics_balkan_powder_keg_tt_icon$ Мы нападём на Болгарию через §Y[?SER.days_mission_timeout@BW2_war_with_bulgarian_traitor]§! дней"
 ww1_secondbalkan.21.t: "Вторжение в Болгарию"
 ww1_secondbalkan.21.d: "На Балканах снова вспыхнул военный конфликт, и настало время вернуть наши законные земли!"
 ww1_secondbalkan.21.a: "Готовить операцию!"
 ww1_secondbalkan.21.b: "Атаковать немедленно!"
 ww1_secondbalkan.22.t: "Бессмысленная война"
 ww1_secondbalkan.22.d: "Война зашла в тупик, и ни одна из сторон не достигла своих целей. Болгария и антиболгарская коалиция подписали мир на условиях статус-кво."
 ww1_secondbalkan.22.a: "А как же погибшие?"
 ww1_secondbalkan.23.t: "Провал интервенции в Болгарии"
 ww1_secondbalkan.23.d: "Болгарская армия смогла сдержать наше наступление. Под давлением великих держав мы вынуждены подписать мирный договор, который закрепит болгарские завоевания."
 ww1_secondbalkan.23.a: "Какой позор!"
 ww1_secondbalkan.24.t: "Ещё одна победа"
 ww1_secondbalkan.24.d: "Наша победоносная армия разгромила османские орды, которые вновь посягнули на нас в трудный час. Мы подписали новый мирный договор с [TUR.GetForeignName], который закрепляет за нами освобождённые территории. Но, к сожалению, из-за давления великих держав мы не можем получить больше, так как они опасаются нашего усиления."
 ww1_secondbalkan.24.a: "Турки, это ещё не конец!"
 ww1_secondbalkan.25.t_bul: "Вынужденный мир с Турцией"
 ww1_secondbalkan.25.d_bul: "Из-за сложной ситуации на фронте мы вынуждены подписать перемирие с [TUR.GetForeignName]."
 ww1_secondbalkan.25.a: "Какой позор!"
 ww1_secondbalkan.25.t_tur: "Болгария подписала мир"
 ww1_secondbalkan.25.d_tur: "Наша победоносная армия разгромила небольшие болгарские формирования. Но великие державы оказали на нас давление и вынудили подписать перемирие с Болгарией. Вскоре в нашей столице состоится конференция, на которой мы подпишем мирное соглашение, признающее за нами Эдирне."
 ww1_secondbalkan.25.b: "Месть свершилась"
 ww1_secondbalkan.26.t: "Ситуация в Западной Фракии"
 ww1_secondbalkan.26.d: "Хотя мы сокрушаем болгарскую армию, великие державы не позволят нам вернуть Западную Фракию. Но там нас ждут братья-мусульмане, поэтому при поддержке наших войск мы можем создать там марионеточное правительство и использовать это как рычаг давления на Болгарию."
 ww1_secondbalkan.26.a: "Хорошая возможность"
 ww1_secondbalkan.27.t: "Позорный мир"
 ww1_secondbalkan.27.d: "Наша армия терпит сокрушительное поражение, экономика трещит по швам, и мы вынуждены подписать перемирие с нашими врагами."
 ww1_secondbalkan.27.a: "Величайшая катастрофа"
 ww1_secondbalkan.28.t: "Болгарские предатели"
 ww1_secondbalkan.28.d: "Болгарская армия оккупировала территории, которые по праву принадлежат нам. Мы попытаемся собрать антиболгарскую коалицию и вместе сможем наказать зазнавшихся болгар. Черногория уже согласна."
 ww1_secondbalkan.28.a: "Попросить Грецию"
 ww1_secondbalkan.29.t: "Антиболгарская коалиция развернула против нас армию"
 ww1_secondbalkan.29.d: "Сербы и греки недовольны результатами раздела османских владений, и теперь они встали на нашей границе и готовят наступление. Они также прислали ультиматум о передаче им наших территорий."
 ww1_secondbalkan.29.a: "Готовить оборону!"
 ww1_secondbalkan.29.b: "Ради мира..."
 ww1_secondbalkan.30.t: "Сербия претендует на Охрид!"
 ww1_secondbalkan.30.d: "Сербия изначально согласилась признать, что территория ниже линии Крива-Паланка — Охрид принадлежит нам при территориальном разделе, но во время войны сербские войска захватили регион ниже этой линии и с тех пор не вывели войска. Мы должны быть твёрды в наших территориальных претензиях."
 ww1_secondbalkan.30.a: "Предатели!"
 ww1_secondbalkan.31.t: "Болгария претендует на Охрид!"
 ww1_secondbalkan.31.d: "Болгария отказалась уступить свои претензии на Охрид и решительно протестовала против того, что мы захватили территорию ниже линии Крива-Паланка — Охрид, которую, как мы договорились при территориальном разделе, они считали своей."
 ww1_secondbalkan.31.a: "Нам нужно время подумать"
 ww1_secondbalkan.31.b: "Ради мира..."
 ww1_secondbalkan.32.t: "Сербия уступает Охрид"
 ww1_secondbalkan.32.d: "Сербия передала Охридский регион нашей военной администрации в соответствии с существующими соглашениями. Мы наконец можем вздохнуть с облегчением и насладиться нашей победой."
 ww1_secondbalkan.32.a: "Отлично."
 ww1_secondbalkan.33.t: "Сербия приглашает нас в Антиболгарскую коалицию"
 ww1_secondbalkan.33.d_gre: "У нас никогда не было проблем с Сербией, но болгары оккупировали земли, которые должны принадлежать нам. Мы, очевидно, согласны на это"
 ww1_secondbalkan.33.d_mnt: "В целом у нас нет претензий к болгарам, но сербы нам очень помогли, поэтому мы не оставим братский народ в такой трудный час."
 ww1_secondbalkan.33.a: "Вместе к победе!"
 ww1_secondbalkan.34.t: "[FROM.getName] соглашается"
 ww1_secondbalkan.34.d: "[FROM.getName] принял мудрое решение и присоединился к нашей коалиции против болгар, теперь у нас есть шанс победить их. Мы немедленно отправим Болгарии ультиматум о передаче территорий."
 ww1_secondbalkan.34.a: "Война близка."
 ww1_secondbalkan.35.t: "Болгария согласилась принять ультиматум"
 ww1_secondbalkan.35.d: "Болгарское правительство, осознавая неизбежность своего поражения, решило согласиться на возвращение наших территорий"
 ww1_secondbalkan.35.a: "Величайшая победа дипломатии!"
 ww1_secondbalkan.36.t: "Предупреждение о войне с Болгарией"
 ww1_secondbalkan.36.d: ""
 ww1_secondbalkan.36.a: "Подготовьте атаку!"
 BW2_balkans_hist_how_to_win_tt: "Чтобы считаться §7победителем§! по истечении таймера, нам нужно довести §YБолгарию§! до §Y30%§! прогресса капитуляции и контролировать §Y[203.getName]§!, §Y[1258.getName]§! и §Y[1140.getName]§!\n"
 BW2_balkans_ahist_how_to_win_tt: "Чтобы считаться §7победителем§! по истечении таймера, нам нужно довести §YБолгарию§! до §Y30%§! прогресса капитуляции\n"
 BW2_BUL_hist_how_to_win_tt: "Чтобы считаться §7победителем§! по истечении таймера, мы должны контролировать §Y[203.getName]§!, §Y[1258.getName]§! и §Y[1140.getName]§! и иметь не менее §Y30%§! прогресса капитуляции.\n Если мы сможем принудить к капитуляции только §YРумынию§! или только §YГрецию§!, мы получим соответственно §Y[846.getName]§! или §Y[345.getName]§!\n"
 BW2_BUL_ahist_how_to_win_tt: "Чтобы считаться §7победителем§! по истечении таймера, мы должны капитулировать §YСербию§! или §YГрецию§! и §YРумынию§! (если она воюет)\n"
 BW2_turkish_intervention_TUR_how_to_win_tt: "Чтобы считаться §7победителем§! по истечении таймера, нам нужно контролировать §Yлюбой крупный регион в Болгарии§!, и мы получим §Y[756.getName]§! и §Y[200.getName]§!, если будем его контролировать.\n"
 BW2_turkish_intervention_BUL_how_to_win_tt: "Чтобы считаться §7победителем§! по истечении таймера, мы должны помешать туркам захватить §Yлюбой из наших крупных регионов§!.\n"