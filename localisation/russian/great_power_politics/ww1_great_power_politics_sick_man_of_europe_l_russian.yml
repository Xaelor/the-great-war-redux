 GER_berlin_baghdad_railway_construction: "Строительство Багдадбана"
 ww1_berlin_baghdad.1.t: "[GER.GetForeignName] хочет расширить Багдадбан"
 ww1_berlin_baghdad.1.d: "[GER.GetForeignName] попросил у нас разрешения на продолжение строительства Берлин-Багдадской железной дороги. Они готовы полностью оплатить все расходы, и железная дорога принесла бы нам большую пользу, соединив южные вилайеты и район Персидского залива с остальной частью империи. Однако это продвинуло бы нас дальше в направлении союза с немцами и угрожало бы российским и британским сферам влияния в Персии и Персидском заливе. Мы должны быть осторожны и решить, готовы ли мы заплатить цену потенциального гнева двух великих держав за модернизацию нашей инфраструктуры."
 ww1_berlin_baghdad.1.a: "Мы, конечно, приветствуем эти инвестиции."
 ww1_berlin_baghdad.1.b: "На самом деле нам это не нужно."
 ww1_berlin_baghdad.2.t: "[TUR.GetForeignName] выдает нам разрешение на строительство"
 ww1_berlin_baghdad.2.d: "Как и ожидалось, турки не смогли устоять перед нашим щедрым предложением, а это значит, что теперь мы должны взять на себя все расходы по проекту и отправить наших специалистов на Ближний Восток. Будем надеяться, что русские и британцы не помешают строительству."
 ww1_berlin_baghdad.2.a: "Действуйте немедленно"
 ww1_berlin_baghdad.3.t: "[TUR.GetForeignName] Отказывается от строительства"
 ww1_berlin_baghdad.3.d: "Неожиданно турки отказались дать нам разрешение на строительство, хотя мы предложили оплатить все расходы. Возможно, они предпочли бы дружить с Россией и Великобританией, которые хотят прибрать к рукам их территорию."
 ww1_berlin_baghdad.3.a: "Неблагодарные турки."
 ww1_berlin_baghdad.4.t: "[GER.GetForeignName] расширяет железную дорогу Берлин-Багдад"
 ww1_berlin_baghdad.4.d: "Немцы решили начать новый этап строительства железной дороги Берлин-Багдад, угрожая нашему влиянию в регионе. Должны ли мы выразить протест, чтобы заставить их отступить?"
 ww1_berlin_baghdad.4.a: "Конечно, мы протестуем!"
 ww1_berlin_baghdad.4.b: "Нам не нужен конфликт с ними прямо сейчас."
 ww1_berlin_baghdad.5.t: "[ENG.GetName] Протестует против строительства железной дороги Берлин-Багдад"
 ww1_berlin_baghdad.5.d: "[ENG.GetName] по-видимому, считает, что наши отношения с турками их беспокоят, и выразила официальный протест против строительства Багдадбана. Должны ли мы вообще учитывать их мнение по этому вопросу?"
 ww1_berlin_baghdad.5.a: "Это их не касается."
 ww1_berlin_baghdad.5.b: "Нам все равно, мы не спрашивали."
 ww1_berlin_baghdad.6.t: "[GER.GetForeignName] отступает"
 ww1_berlin_baghdad.6.d: "Наше давление на немцев оказалось плодотворным, поскольку, похоже, они приостановили строительство железной дороги Берлин-Багдад. Это требует празднования нашей дипломатической победы."
 ww1_berlin_baghdad.6.a: "Прекрасные новости!"
 ww1_berlin_baghdad.7.t: "[GER.GetForeignName] jтказывается отступать"
 ww1_berlin_baghdad.7.d: "Похоже, что наши угрозы остаются без внимания, поскольку [FROM.GetName] по-прежнему отказывается отступить и остановить проект. Готовы ли мы к полномасштабной торговой войне, которая уничтожит Багдадскую железную дорогу?"
 ww1_berlin_baghdad.7.a: "Ввести торговое эмбарго."
 ww1_berlin_baghdad.7.b: "Мы должны отступить."
 ww1_berlin_baghdad.8.t: "[ENG.GetName] Вводит торговое эмбарго"
 ww1_berlin_baghdad.8.d: "Совершив ошеломляющий шаг, [ENG.GetName] фактически выполнила свои угрозы и официально прекратила всю торговлю с нами. Для нас это последняя возможность спасти отношения между нашими странами."
 ww1_berlin_baghdad.8.a: "Мы должны разобраться с этой ситуацией."
 ww1_berlin_baghdad.9.t: "Германия и Турция стоят на своём"
 ww1_berlin_baghdad.9.d: "Похоже, что наше эмбарго было проигнорировано, поскольку [GER.GetForeignName] по-прежнему отказывается отступить и остановить проект. Готовы ли мы к полномасштабной войне для защиты наших владений в Персидском заливе?"
 ww1_berlin_baghdad.9.a: "Значит, война."
 ww1_berlin_baghdad.9.b: "Нет, это безумие."
 ww1_berlin_baghdad.10.t: "Строительство закончилось преждевременно"
 ww1_berlin_baghdad.10.d: "В результате не зависящих от нас обстоятельств наши строительные работы были приостановлены. Нам удалось собрать то, что осталось от наших активов, но мы не сможем возобновить строительство в течение некоторого времени."
 ww1_berlin_baghdad.10.a: "Черт."
 ww1_berlin_baghdad.11.t: "[TUR.GetForeignName] отзывает наше разрешение"
 ww1_berlin_baghdad.11.d: "Турецкое правительство неожиданно отозвало наше разрешение на строительство Багдадбана. Нам удалось собрать то, что осталось от наших активов, но мы не сможем возобновить строительство в течение некоторого времени."
 ww1_berlin_baghdad.11.a: "Что это, какой-то удар в спину?"
 ww1_berlin_baghdad.12.t: "[TUR.GetForeignName] уничтожает Багдадбан"
 ww1_berlin_baghdad.12.d: "К нашему удивлению, [FROM.GetName] решила отозвать германское разрешение на строительство. Желанное развитие событий, так как оно создаёт разрыв между их правительствами и делает наши активы в регионе более безопасными."
 ww1_berlin_baghdad.12.a: "Вознаградите их отменой эмбарго."
 revoke_permit_tt: "§RОстанавливает§! текущий проект и запрещает [GER.GetFlag][GER.GetForeignNameDefCap] возможность §Yначала строительства§! в течение §Yгода§!."
 cant_build_berlin_baghdad_tt: "Текущий проект будет §Rостановлен§!, и мы не сможем §Yначать строительство§! в течение §Yгода§!."
 cant_build_berlin_baghdad: "В данный момент мы не можем начать строительство"