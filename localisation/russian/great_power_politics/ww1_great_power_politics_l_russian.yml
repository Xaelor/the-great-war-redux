 great_power_politics_default_tt: "§HПолитика великих держав§!"
 great_power_politics_default_tt_desc: "Участие в политике великих держав позволяет нам оказывать давление на более слабые страны, вводя их в сферу нашего влияния, или же соперничать с другими §Yвеликими державами§! за их владения.\n\nВыберите §Yкатегорию§!, чтобы увидеть §Gдоступные§! решения или отслеживать ситуацию."
 great_power_politics_misc_tt: "§HЛокальные действия§!"
 great_power_politics_misc_tt_desc: "Различные решения, не связанные с конкретным регионом"
 great_power_politics_misc_desc: "Не каждое наше действие касается других наций, и порой мы можем принимать решения, не опасаясь возмездия со стороны §Yвеликих держав§!.\n\nИспользуйте эту §Yкатегорию§!, чтобы подготовиться к £great_war_texticon §YВеликой войне§! или проводить §Yлокальные интервенции§!."
 great_power_politics_great_war_tt: "§HВеликая война§!"
 great_power_politics_great_war_tt_desc: "Решения, связанные с §YВеликой войной§!"
 great_power_politics_great_war_desc: "Восстал шестой ангел, возвещая начало §Rвойны, которая положит конец всем войнам§!. §YВеликие державы§! решили разрешать свои разногласия мечом, а не дипломатией. Да смилостивится над нами всеми Господь.\n\n§GПобедившая§! §Yфракция§! получит заявленные территории и национальные регионы после §Yконференции§!."
