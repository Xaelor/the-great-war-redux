l_russian:
 GER_backstab: "Удар в спину"
 GER_backstab_desc: "Изгнать Австрию из союза за Италию. Австрия слаба и является для нас тяжелым бременем."
 GER_isolate_adriatic_sea: "Изолировать Адриатическое море"
 GER_isolate_adriatic_sea_desc: "Если мы введем блокаду Австрии в Адриатическом море, мы можем серьезно подорвать их экономику и еще больше склонить итальянцев на нашу сторону."
 GER_romanian_pact: "Румынский пакт"
 GER_romanian_pact_desc: "Если мы поддержим их претензии на Трансильванию, Румыния может быть соблазнена присоединиться к нашей фракции."
 GER_second_bjork_agreement: "Второе Бьеркское соглашение"
 GER_second_bjork_agreement_desc: "Мы можем убедить Россию заключить пакт о ненападении."
 GER_second_bjork_agreement_rejected: "Второе Бьеркское соглашение было отклонено"
 GER_partition_of_persia: "Раздел Персии"
 GER_partition_of_persia_desc: "Если мы пообещаем русским часть добычи, возможно, мы сможем покорить персов без их вмешательства."
 GER_bruderkrieg: "Брудеркриг"
 GER_bruderkrieg_desc: "Австро-Венгрия - это просто построение территорий, которые по праву принадлежат другим народам. Мы должны положить этому конец ради нас самих и наших братьев."
 GER_german_cisleithania: "Немецкая Цислейтания"
 GER_german_cisleithania_desc: "Австрия немецкая. Следовательно, она принадлежит Кайзеррейху. Мы объединимся еще раз, даже если это будет сделано силой."
 GER_suppress_the_hungarian_uprising: "Подавить Венгерское восстание"
 GER_suppress_the_hungarian_uprising_desc: "Пора закончить то, что мы начали не так давно, Габсбурги должны быть стерты с лица земли."
 GER_recognize_hungarian_sovereignty: "Признать суверенитет Венгрии"
 GER_recognize_hungarian_sovereignty_desc: "Венгры сломали Ausgleich и получили свою свободу. Это то, что мы можем отпраздновать!"
 GER_bohemia_integration: "Интеграция Богемии"
 GER_bohemia_integration_desc: "Богемия входила в Германскую конфедерацию. Это означает, что она должна быть Германской."
