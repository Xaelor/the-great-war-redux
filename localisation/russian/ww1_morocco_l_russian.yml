l_russian:
 GER_sms_panther_morocco: "SMS «Panther» находится в Марокко"
 GER_leave_in_one_month_or_crash: "§RУ нас есть месяц, чтобы отступить, или Германия будет отстранена от золотого стандарта!§!"
 GER_decisions_agadir: "§YРазблокирует решения по эскалации марокканского кризиса§!"
 FRA_leave_MOR: "$great_power_politics_scramble_for_africa_tt_icon$ Покинуть Марокко"
 MOR_navy_decisions: "Решения ВМФ"
 MOR_navy_decisions_desc: "Чтобы построить ВМФ, мы должны приобрести устаревшие европейские фрегаты, крейсеры и линкоры. Даже если эти корабли будут низкого качества, они станут основой нашей береговой обороны."
 MOR_purchase_Admiral_class: "Приобрести линкоры типа «Admiral»"
 MOR_purchase_blake_class: "Приобрести крейсеры типа «Blake»"
 MOR_purchase_gazelle_class: "Приобрести крейсеры типа «Gazelle»"
 MOR_purchase_gueydon_class: "Приобрести крейсеры типа «Gueydon»"
 MOR_purchase_arquebuse_class: "Приобрести эсминцы типа «Arquebuse»"
 MOR_surrender_to_FRA: "$great_power_politics_scramble_for_africa_tt_icon$ Сдаться государству [FRA.getName]"
 MOR_reclaim_lands: "Вернуть [ROOT.getAdjective]ие земли государству [FROM.getName]"
 ww1_morocco.1.t: "Восстание в Фесе"
 ww1_morocco.1.d: "Племена, выступающие против правления султана Абд аль-Хафида и его непопулярных реформ, двинулись на Фес. Повстанцы осадили столицу, заперев султана в городских стенах. Без внешней помощи правлению султана неминуемо придет конец.\n\nВ отчаянной мольбе султан обратился за помощью к французскому гарнизону в Касабланке, чтобы снять осаду. Однако вмешательство Франции, несомненно, будет использовано как предлог для установления дальнейшего контроля над Марокко, что может привести к полному поглощению страны их колониальной империей. В условиях, когда народное мнение уже настроено против правителя, считающегося французской марионеткой, этот кризис ставит народ Марокко перед сложным выбором."
 ww1_morocco.1.a: "Мы должны обратиться за помощью к генералу Муанье."
 ww1_morocco.1.b: "Султан предал Марокко!"
 ww1_morocco.1.c: "Верные каиды должны вмешаться!"
 ww1_morocco.2.t: "Экспедиция в Фес"
 ww1_morocco.2.d: "По просьбе султана Абд аль-Хафида генерал Муанье направил 23 000 человек из Касабланки в Фес. Он быстро разбил осаждающие силы повстанцев, которые впоследствии отступили в сельскую местность близ Марракеша. После этого султан отрекся от престола в пользу своего брата, Мулай Юсуфа, но это мало помогло успокоить продолжающееся восстание.\n\nСложившаяся ситуация открывает широкие возможности для расширения нашего колониального влияния в Северной Африке. Используя предлог защиты европейских граждан и активов, мы могли бы установить официальный протекторат над Марокко. Это, конечно, спровоцирует дипломатический кризис в отношениях с Германской Империей, но министр иностранных дел уверен, что при поддержке Великобритании мы сможем обеспечить себе приз лишь с минимальными уступками."
 ww1_morocco.2.a: "Приступить к оккупации."
 ww1_morocco.2.b: "Не допускать эскалации ситуации."
 ww1_morocco.3.t: "Марокканское восстание достигло успеха"
 ww1_morocco.3.d: "Отказ султана призвать на помощь Францию оказался роковым для его правления. Народное восстание в Фесе привело к его свержению, а французская жандармерия, расквартированная в столице, была перебита восставшими марокканскими войсками.\n\nЭто оскорбление французского авторитета нельзя игнорировать. Наши силы в регионе уже начали мобилизацию для восстановления порядка."
 ww1_morocco.3.a: "Мы наведем порядок."
 ww1_morocco.3.b: "Нам не стоит вмешиваться."
 ww1_morocco.4.t: "Франция оккупирует Фес"
 ww1_morocco.4.d: "В ответ на просьбу марокканского султана французские войска вошли в столицу страны город Фес и заняли его, рассеяв повстанческие силы, державшие его в осаде. Французское правительство заявило о своем намерении восстановить порядок и защитить европейские интересы в регионе, и за этим шагом пристально наблюдают другие державы. Пока неясно, как это повлияет на хрупкий баланс сил в Северной Африке."
 ww1_morocco.4.a: "Война за кусок песка?"
 ww1_morocco.5.t: "Марокко провозглашает независимость"
 ww1_morocco.5.d: "Попытка Франции установить протекторат над Марокко провалилась. Марокканские войска оказали успешное сопротивление европейским войскам, что привело к масштабному кризису в регионе. Султан был свергнут, а новое правительство отреклось от любого иностранного влияния в стране.\n\nСейчас [FRA.GetNameDefCap] готовится к полномасштабной военной интервенции, чтобы отстоять свой авторитет."
 ww1_morocco.5.a: "Это, несомненно, спровоцирует кризис."
 ww1_morocco.8.t: "Германия требует компенсации"
 ww1_morocco.8.d.forcongo: "После бурных переговоров между нами и Германской Империей, требования кайзера Вильгельма были получены нашим министром иностранных дел. В них говорится, что в качестве компенсации за аннексию Францией Марокко мы должны передать Французское Конго под колониальное управление Германии. Эти требования небезосновательны, и мы должны подготовиться к их принятию, чтобы гарантировать мир в Европе, даже если пресса продолжит критиковать наши соглашения. Однако, если мы откажемся от них, нам нужно будет провести мобилизацию и проинформировать наших союзников."
 ww1_morocco.8.d.forsouthmorocco: "После бурных переговоров между нами и Германской Империей, требования кайзера Вильгельма были получены нашим министром иностранных дел. В них говорится, что в качестве компенсации за французскую аннексию Марокко мы должны передать южную часть Марокко под управление Германии. Эти требования небезосновательны, и мы должны подготовиться к их принятию, чтобы гарантировать мир в Европе, даже если пресса продолжит критиковать наши соглашения. Однако, если мы откажемся от них, нам нужно будет провести мобилизацию и проинформировать наших союзников."
 ww1_morocco.8.d.forfreemorocco: "После бурных переговоров между нами и Германской Империей, требования кайзера Вильгельма были получены нашим министром иностранных дел. В них говорится, что в качестве компенсации за французскую аннексию Марокко мы должны отказаться от протектората Марокко и покинуть страну. Эти требования небезосновательны, и мы должны подготовиться к их принятию, чтобы гарантировать мир в Европе, даже если пресса продолжит критиковать наши соглашения. Однако, если мы откажемся от них, нам нужно будет провести мобилизацию и проинформировать наших союзников."
 ww1_morocco.8.a: "Принять требования в полном объеме"
 ww1_morocco.8.b: "Предложить компромисс"
 ww1_morocco.8.c: "Германия не в том положении, чтобы что-то требовать!"
 ww1_morocco.8.e: "Они могут получить Южное Марокко."
 ww1_morocco.8.f: "Мы должны покинуть Марокко."
 ww1_morocco.9.t: "Германия требует протекторат"
 ww1_morocco.9.d: "Немецкие дипломаты выдвинули ошеломляющий ультиматум: либо мы уступаем Западное Марокко под их защиту, либо они вмешиваются в ситуацию военным путем. Очевидно, что они готовы рискнуть войной из-за этого вопроса."
 ww1_morocco.9.a: "Забирайте и проваливайте."
 ww1_morocco.9.b: "Вот это комики!"
 ww1_morocco.18.t: "Усугубление финансового кризиса"
 ww1_morocco.18.d: "Наш отказ отступить из-за Марокко привел к тяжелым последствиям для нашей экономики. Финансовый кризис продолжает углубляться, и теперь мы столкнулись с вполне реальной возможностью быть вынужденными отказаться от золотого стандарта."
 ww1_morocco.18.a: "Проклятый Рейхсбанк."
 ww1_morocco.19.t: "Марокканцы просят автономию"
 ww1_morocco.19.d: "После нашей победы в Великой войне представители Марокко попросили передать их страну под защиту Германской Империи. Мы не обязательно должны править ими напрямую; в конце концов, наше первоначальное участие было направлено на то, чтобы помешать французской экспансии. Предоставление им статуса протектората соответствует предыдущим заявлениям кайзера о поддержке суверенитета султана."
 ww1_morocco.19.a: "Германская Империя может позволить себе быть щедрой."
 ww1_morocco.19.b: "Вылижи мои сапоги."
 ww1_morocco.21.t: "Султан Юсуф умирает"
 ww1_morocco.21.d: "Правление султана Юсуфа подошло к концу из-за внезапной уремии. Его сын, Мухаммед бен Юсуф, был назначен его преемником. Покойный султан был похоронен в королевском некрополе при мечети Мулай Абдаллах."
 ww1_morocco.21.a: "Да здравствует султан!"
 ww1_morocco.22.t: "Международная зона Танжер"
 ww1_morocco.22.d: "Учитывая стратегическую важность Танжера для нескольких европейских держав, долгие обсуждения завершились решением о создании международной зоны. Этот компромисс, как мы надеемся, обеспечит мир и стабильность в регионе."
 ww1_morocco.22.a: "Вполне разумный исход."
 ww1_morocco.25.t: "Речь в Мэншн-Хаузе"
 ww1_morocco.25.d.forcongo: "В начале этой недели премьер-министру стало известно о двух вещах: во-первых, Германия направила Франции требования в качестве реакции на кризис в Агадире, и наш министр иностранных дел Эдвард Грей сообщил ему, что они в целом сводятся к получению Германией территорий во Французском Конго. Второй вопрос, также связанный с Агадирским кризисом, - это просьба канцлера казначейства Дэвида Ллойд Джорджа: он хочет объявить в своей речи в Мэншн-Хаузе в Лондоне перед членами парламента, что наша позиция относительно Агадира - это поддержка Франции. Хотя это не будет сказано прямо, но чтобы напугать парламент и заставить его поддержать Францию, Ллойд Джордж использует тот факт, что Германия может получить военно-морской порт в Атлантике, если выдвинет новые требования.\n\nОднако парламент все равно разделится между строгим нейтралитетом и поддержкой французов - Эдвард Грей даже попытается польстить Германии, поскольку значительное меньшинство в парламенте считает, что Франция, как агрессор, не заслуживает нашей поддержки."
 ww1_morocco.25.d.forsouthmorocco: "В начале этой недели премьер-министру стало известно о двух вещах: во-первых, Германия направила Франции требования в качестве реакции на кризис в Агадире, и наш министр иностранных дел Эдвард Грей сообщил ему, что они в целом сводятся к установлению контроля над югом Марокко. Второй вопрос, также связанный с Агадирским кризисом, - это просьба канцлера казначейства Дэвида Ллойд Джорджа: он хочет объявить в своей речи в Мэншн-Хаузе в Лондоне перед членами парламента, что наша позиция относительно Агадира - это поддержка Франции. Хотя это не будет сказано прямо, но чтобы напугать парламент и заставить его поддержать Францию, Ллойд Джордж использует тот факт, что Германия может получить военно-морской порт в Атлантике, если выдвинет новые требования.\n\nОднако парламент все равно разделится между строгим нейтралитетом и поддержкой французов - Эдвард Грей даже попытается польстить Германии, поскольку значительное меньшинство в парламенте считает, что Франция, как агрессор, не заслуживает нашей поддержки."
 ww1_morocco.25.d.forfreemorocco: "В начале этой недели премьер-министру стало известно о двух вещах: во-первых, Германия направила Франции требования в качестве реакции на кризис в Агадире, и наш министр иностранных дел Эдвард Грей сообщил ему, что они в целом сводятся к освобождению Марокко от любой формы протектората. Второй вопрос, также связанный с Агадирским кризисом, - это просьба канцлера казначейства Дэвида Ллойд Джорджа: он хочет объявить в своей речи в Мэншн-Хаузе в Лондоне перед членами парламента, что наша позиция относительно Агадира - это поддержка Франции. Хотя это не будет сказано прямо, но чтобы напугать парламент и заставить его поддержать Францию, Ллойд Джордж использует тот факт, что Германия может получить военно-морской порт в Атлантике, если выдвинет новые требования.\n\nОднако парламент все равно разделится между строгим нейтралитетом и поддержкой французов - Эдвард Грей даже попытается польстить Германии, поскольку значительное меньшинство в парламенте считает, что Франция, как агрессор, не заслуживает нашей поддержки."
 ww1_morocco.25.a: "Позволить Дэвиду Ллойд Джорджу произнести речь."
 ww1_morocco.25.b: "Мы должны придерживаться политики нейтралитета."
 ww1_morocco.26.t: "Переговоры в Агадире"
 ww1_morocco.26.d: "Размещение нашей канонерской лодки в Агадире стало дипломатическим конфузом. Ожидаемые уступки не оправдались, а финансовая паника ослабила наши позиции на переговорах. Чтобы спасти национальный престиж, кайзер настаивает на том, чтобы мы начали прямые переговоры с Францией о получении колониальной территории, как первоначально предлагало их правительство.\n\nОднако прежде чем сделать предложение, мы должны определить наши цели. По общему мнению Министерства иностранных дел, мы должны обменять наши претензии на Марокко на все Французское Конго. Однако другие голоса предлагают более амбициозные цели: мы можем потребовать для себя Южное Марокко, настоять на полном уходе Франции или просто согласиться на финансовые репарации, чтобы покрыть наши расходы. Мы должны решить, какую цену должна заплатить Франция за Марокко."
 ww1_morocco.26.a: "Наша цена - Французское Конго."
 ww1_morocco.26.b: "Потребовать Южное Марокко."
 ww1_morocco.26.c: "Франция должна полностью выйти из Марокко."
 ww1_morocco.26.e: "Добиться финансовых репараций."
 ww1_morocco.26.f: "Сократить расходы и отступить."
 ww1_morocco.28.t: "[GER.GetForeignNameDefCap] оккупирует Южное Марокко"
 ww1_morocco.28.d: "После напряженных переговоров было достигнуто взаимное соглашение об урегулировании Марокканского кризиса. В рамках этого соглашения [GER.GetAdjective]ие войска оккупируют Южное Марокко. Хотя это и снизило непосредственную напряженность в отношениях между великими державами, долгосрочные стратегические последствия немецкого присутствия в Северной Африке еще предстоит выяснить."
 ww1_morocco.28.a: "Вполне приемлемый итог."
 ww1_morocco.29.t: "Rebellion Defeated"
 ww1_morocco.29.d: "The army managed to stop a large part of the insurgent forces. The few remaining opponents are isolated and entrenched partisans in the Fez region, where we will have to intervene more in depth to obtain a total victory. Nevertheless, Morocco has been generally pacified and the establishment of a protectorate now seems possible."
 ww1_morocco.29.a: "Good"
 ww1_morocco.30.t: "France Remain Defiant"
 ww1_morocco.30.d: "France has not responded to our legitimate requests. War seems inevitable and avoiding it would be seen as a huge act of weakness on our part."
 ww1_morocco.30.a: "Then its war"
 ww1_morocco.31.t: "France Defeated"
 ww1_morocco.31.d: "French forces have called for a ceasefire, recognizing that the war in North Africa is not working to their advantage. Indeed, the Moroccan army entered Algeria and the great French colonial power was ridiculed. From now on, we can ask for generous compensation in exchange for this long-awaited peace."
 ww1_morocco.31.a: "They might compensate us greatly."
 ww1_morocco.32.t: "France Leave Morocco"
 ww1_morocco.32.d: "French forces have called for a ceasefire, recognizing that the war in North Africa is not working to their advantage. Our fierce resistance forced the government of [FRA.GetLeader] to recognize our self-determination and thus decided to leave Morocco permanently."
 ww1_morocco.32.a: "We survived!"
 ww1_morocco.33.t: "France Defeated in Morocco"
 ww1_morocco.33.d: "The French military intervention in Morocco did not bear these fruits. Sultan Yusef, having requested help from Paris to put down rebellions around Fez, was unable to rally his people, provoking a large uprising that the French themselves were unable to put down. Despite a special military operation with ample resources, France was unable to defeat rebellious Morocco."
 ww1_morocco.33.a: "Grhhh..."
 ww1_morocco.33.b: "We didnt even had to intervene!"
 ww1_morocco.33.c: "What a shame for France."
 ww1_morocco.33.e: "Is France THAT weak ?"
 ww1_morocco.33.f: "We should be careful with our colonies in Morocco..."
 ww1_morocco.34.t: "Morocco Reclaims our Colonies"
 ww1_morocco.34.d: "Morocco, recently freed from all French influence, turned to us asking for the restitution of the colonies that we installed on their territory. Accepting such a proposal would be a clear loss of prestige, but knowing that a notable power like France did not obtain victory questions Morocco's abilities to fight large colonial empires."
 ww1_morocco.34.a: "We should accept..."
 ww1_morocco.34.b: "We wont step down!"
 ww1_morocco.35.t: "[FROM.getName] Refuses"
 ww1_morocco.35.d: "The [FROM.getAdjective] government has not been receptive to our demands, underestimating our ability to fight to recover our lands."
 ww1_morocco.35.a: "Noted."
 ww1_morocco.36.t: "[FROM.getName] Accepts!"
 ww1_morocco.36.d: "The [FROM.getAdjective] government has been receptive to our requests. The local authorities have already started the administrative handover and our international prestige has been restored!"
 ww1_morocco.36.a: "Noted."
 ww1_morocco.38.t: "[FROM.getName] Asks for a Loan"
 ww1_morocco.38.d: "Plunged into a deep economic crisis, Morocco has officially sent us a request for debt support. The sultanate is no longer able to pay the IFC, nor to invest in the country, which paralyzes their economy. Our interests in Morocco push us to accept such a request, because it will allow us to increase our influence on the country."
 ww1_morocco.38.a: "Give them 100 millions francs"
 ww1_morocco.38.b: "Weakening Morocco is our real objective"
 ww1_morocco.39.t: "[FROM.getAdjective] Government Accepted!"
 ww1_morocco.39.d: "The minister [FROM.getLeader] agreed to grant us a loan of 100 million gold francs in exchange for the concession of our customs service, which was a predictable request from the [FROM.getAdjective] authorities."
 ww1_morocco.39.a: "Its better than nothing"
 ww1_morocco.40.t: "[FROM.getAdjective] Government Refused!"
 ww1_morocco.40.d: "Despite sending talented negotiators, France refused to grant us a loan or any aid. Not only were we humiliated by asking them to take over our debt, but we also got nothing."
 ww1_morocco.40.a: "Damn..."
 ww1_morocco.41.t: "\"Darija\" Tertib"
 ww1_morocco.41.d: "The tertib is a form of tax intended to replace the Islamic taxes Zakkat and Achour. These ancient tributes date from the Middle Ages and had a sacred character consistent with Islam. It was therefore only with the support of the Caids and the entire Makhzen that the Sultan was able to carry out such a reform.\n\n This tertib is more egalitarian and removes the local caids from his perception. It is a kind of tax on the arable land, livestock and fruit trees of each household which eliminates the canonical taxes that the subject populations agree to pay to the Sultan."
 ww1_morocco.41.a: "The best for everyone"
 ww1_morocco.42.t: "Famine Hits Countryside"
 ww1_morocco.42.d: "A great famine affects the Sahel due to poor harvests. This ordeal also affects our most rural regions, which risks further weakening our position."
 ww1_morocco.42.a: "We cant do anything about it..."
 ww1_morocco.43.t: "Excavation Concession Question"
 ww1_morocco.43.d: "Morocco is not in a position to launch a prospecting mission with the current economic crisis. If we want to exploit our soil, we must turn to foreign players. Initial surveys indicate that the French and Germans are interested in carrying out research missions, in exchange for industrial exploitation rights. We could accept both partners, or only accept one, at the risk of slowing down our economy even further."
 ww1_morocco.43.a: "Accept both missions"
 ww1_morocco.43.b: "Accept French mission"
 ww1_morocco.43.c: "Accept German mission"
 ww1_morocco.44.t: "Fierce Opposition to Centralization Reform"
 ww1_morocco.44.d: "The major tax reform ordered by [MOR.getLeader] and led by the El Mokri and Glaoui families has caused the exacerbation of tensions across the country, more particularly in the surrounding areas of Fez and Meknes. Already outraged by the excesses but also the failure of the military reform introduced by the Sultan in 1910, the Amazigh and Arab tribes of these two regions take a dim view of the exactions and abuses inflicted on them by Thami El Glaoui during the collection of taxes.\n\nThe situation becomes all the more untenable as the exactions committed by Glaoui's agents take on alarming proportions, not even sparing the tribes which were once exempted from paying taxes due to their status as suppliers of soldiers to the sultan's army, as was the case with the Cherarda tribe."
 ww1_morocco.44.a: "Let them strike!"
 ww1_morocco.44.b: "Suspend the reform"
 ww1_morocco.45.t: "Financing the Reform"
 ww1_morocco.45.d: "The military reform proposed by [MOR.getLeader] requires significant funds that must be drawn from somewhere. We could make an amendment to the budget, but it will damage our economy. Otherwise, we can overtax the Caïds, which will have little impact on our budgetary balance."
 ww1_morocco.45.a: "Tax the Caïds"
 ww1_morocco.45.b: "Amend the Budget"
 ww1_morocco.46.t: "Caïds Opposes the new Taxes"
 ww1_morocco.46.d: "The new tax implemented as part of the military reform project does not please the rural regions of the Anti-Atlas and Sousse in general. The local Caïds refuse to enter the country and show great distrust towards the authority of the Sultan. This lack of funds prevents the reform from being financed and therefore from being applied. Armed prospectors were sent with the support of the Glaoua family."
 ww1_morocco.46.a: "We need money!"
 ww1_morocco.49.t: "Successful Army Reform"
 ww1_morocco.49.d: "The reform of the Sultan's army went well. It caused a major financial drain, but the Caïds were reassured that they had not been overtaxed. The new forces, trained by French, British, and Italian officers, were now prepared for modern conflicts and to protect Morocco."
 ww1_morocco.49.a: "Excellent!"
 ww1_morocco.50.t: "Izayan Loyalty Question"
 ww1_morocco.50.d: "Middle Atlas Moutains are populated by several tributes of feared fighters. The latter all applied a transit tax to goods and enjoyed a great deal of autonomy before the [MOR.getLeader] reforms. Today, a large part of them, including the Mohas, Hemmous and the Izayans, are waging a hidden war against the central authority. They refuse to pay taxes and hide in the mountains, attacking convoys.\n\nTo reestablish the loyalty of these clans, Caïd Thami Aglaou of Marrakech was sent to talk to find out the demands of the local tributes.\n\nThe conditions for renewing their allegiance are simple: The authorization to levy a Nzala tax despite the recent regulation, but also the sacralization of their autonomy in the region. We could accept and enjoy their support, or simply stabilize the situation so that they do not rebel against our authority."
 ww1_morocco.50.a: "Grant them what they want"
 ww1_morocco.50.b: "We dont need them, maintain cordial relations"
 ww1_morocco.51.t: "Call to Chaouia Caïds"
 ww1_morocco.51.d: "The rich and fertile region of Chaouia, close to Casablanca, has always been a coveted place of power. Our reform of the army, the regained influence of the Makhzen and the French interventions from 1907 to 1909 helped ensure the loyalty of these powerful Caids. In short, we had no trouble mobilizing them, even if they were seriously lacking in equipment..."
 ww1_morocco.51.a: "They will serve us well!"
 ww1_morocco.52.t: "High-Sous Arbitrage"
 ww1_morocco.52.d: "Since the spring of 1910, the Marrakech region has been plunged into a conflict of influence and loyalty which threatens the stability of the entire Souss. Pasha Thami Aglaou fails to control his local lords, powerful Caids from the Haida and Mouais tribes. This situation causes the cessation of the collection of taxes, attacks on convoys and a constant defiance of the central authority.\n\nThis resistance to Pasha is not unfounded, the insurgent tribes were motivated by Taïeb el Goundafi, a pretender to the title of Pasha, under the pretext that Thami Aglaou would benefit his tribe, the Igliouas, to the detriment of local order, which would be a case of corruption proven.\n\nThe Aglaou family has always been loyal to the central authority, but we could give el Goundafi a chance by taking his testimony and that of the insurgents as the strict truth."
 ww1_morocco.52.a: "Reaffirm Aglaous's authority"
 ww1_morocco.52.b: "Appoint Taïeb el Goundafi as pacha of Marrakech"
 ww1_morocco.53.t: "Self-Determination in Extreme-Sous and Atlas"
 ww1_morocco.53.d: "The south of the country, dominated by the Atlas Mountains, is difficult to access, which left local tributes in almost total autonomy for several centuries. The unification of Morocco was completed in 1882 with the annexation of the autonomous territory of Sidi Hachim by Moulay Hassan I. Since then, the influence of central power has declined, in particular because of the economic crisis and the internal battle for control of the Sultanate.\n\nThis delicate situation has revived local independence, particularly in the Sub-Extreme, with memories of the prosperous kingdom of Tazeroualt returning to local discourse. In order to calm things down, we could grant relative autonomy in these regions, also in the High Atlas. Otherwise, we could authorize Sidi Mohamed to take control of the historic region of Tazeroualt in order to rebuild a kingdom there that would be submissive and faithful to us."
 ww1_morocco.53.a: "Give them increased autonomy"
 ww1_morocco.53.b: "Let's trust Sidi Mohamed"
 ww1_morocco.54.t: "Jihad Sultan"
 ww1_morocco.54.d: "During a meeting of Viziers and Caïds, the Sultan [MOR.getLeader] reaffirmed his desire not to fall under the control of the French, he thus outlined a plan aimed at stabilizing the country and making it neutral from any external influence. The speech is nuanced, it does not completely exclude foreign investments, but intends to limit and condition them. The country's policy would therefore be more pragmatic, in particular thanks to the economic development of the southern regions.\n\nThis intervention, coupled with the relatively well-prepared reform on the army, gives hope to the administrators of the Sous and the Atlas, who hope to receive funding and recognition of their autonomy."
 ww1_morocco.54.a: "We will reform the country"
 ww1_morocco.55.t: "Фесский договор"
 ww1_morocco.55.d: "The Sultan [MOR.getLeader] signed a protectorate agreement with France, subjugating Morocco which lost much of its sovereignty. This treaty follows a series of social, economic and military crises that the Cherifian empire was unable to confront with the constant assistance of France.\n\nDejected and submissive, Morocco has since then only enjoyed a facade of independence, which is definitively erased by the signing of this agreement."
 ww1_morocco.55.a: "A new french colony"
 ww1_morocco.55.b: "Finally"
 ww1_morocco.55.c: "Concerning"
 ww1_morocco.56.t: "[MOR.getLeader] Abdicates"
 ww1_morocco.56.d: "[MOR.getLeader] announced that he would abdicate his title of Sultan, torn by remorse and the weight of the dissolution of Morocco's independence under his reign. After a series of failed reforms and total Francophile subjugation, the Sultan admitted his incompetence, threatening suicide if he was not allowed to leave the throne.\n\nThe line of succession is very clear, his successor is his brother: Moulay Youssef."
 ww1_morocco.56.a: "Please, dont kill yourself"
 ww1_morocco.56.b: "You should kill yourself"
 ww1_morocco.57.t: "Ahmed al-Hiba Rebellion"
 ww1_morocco.57.d: "Подписание Фесского договора стало серьёзным поводом для восстания в Марокко. Утрата суверенитета султана, который сам считался антифранцузским, была воспринята племенами как великое предательство. На юге множество кланов поднялись по взаимному согласию, объединив народы Тизнита, Тафраута, Тарудана, Антиатласа, Атласа... Короче говоря, весь юг страны.\n\nЭту невероятную коалицию возглавляют несколько влиятельных военачальников, таких как Си Мадани или Адди у Ахмед. Эти войска стремятся свергнуть султана [MOR.getLeader] и заменить его Ахмедом аль-Хиба, мавританским религиозным лидером, признанным султаном союзными племенами в Марракеше.\n\nСитуация сложная - предстоит настоящая операция по повторному завоеванию в горах и регионе Сус."
 ww1_morocco.57.a: "Send the tirailleurs!"
 MOR_rebels_declare_war: "§R§YMoroccan Rebels§! are attacking from the south of Morocco§!"
 ww1_morocco.58.t: "Agitation in Southern Morocco"
 ww1_morocco.58.d: "В стране отмечено явное волнение среди племён Суса, Атласа и Антиатласа после подписания Фесского договора. Похоже, кланы активизируют свою деятельность и могут начать операцию по свержению протектората."
 ww1_morocco.58.a: "We need troops in Morocco"
 MOR_rebels_declare_war_soon: "§R§YMoroccan Rebels§! may attack from the south of Morocco, you should gather §Y[FRA.getFlag][FRA.getAdjective] troops§! there!§!"
 tt_cant_join_faction: "§RCannot join factions§!"
 ww1_morocco.59.t: "War in Europe"
 ww1_morocco.59.d: "The war that France is waging in Europe has provoked the call of Moroccan riflemen. Consequently, we are de facto involved in the ongoing conflict and must provide assistance to France."
 ww1_morocco.59.a: "Its war, then"
 GUD_jihad_against_french: "Джихаж против Франции"
 ww1_morocco.89.t: "Лев Сахары спит"
 ww1_morocco.89.d: "Шейх Ма аль-Айнайн, основатель Смары и духовный наставник племён сахрави, скончался в Тизните. На протяжении десятилетий он стоял несокрушимой преградой на пути европейского империализма, объединяя разрозненные племена Сахары под знаменем джихада. Хотя его сердце перестало биться, разожжённый им огонь горит ярче, чем когда-либо. Его сын, Ахмед аль-Хиба, готов принять мантию «Голубого султана» и повести правоверных против захватчиков. Шейх мёртв; да здравствует султан."
 ww1_morocco.89.a: "Его наследие будет жить вечно."
 GUD_nation_of_poets: "Страна тысячи поэтов"
 GUD_nation_of_poets_desc: "Мавританию и земли сахрави часто называют «Страной тысячи поэтов» из-за наших древних устных традиций и глубоких корней литературы в нашей культуре. Это означает, что значительная часть населения образована в различных формах искусства и способна по крайней мере к минимальному пониманию прочитанного."
 GUD_tribal_loyalty_medium: "Средняя лояльность племен"
 GUD_tribal_loyalty_low: "Низкая лояльность племен"
 GUD_tribal_loyalty_abyssmal: "Нулевая племенная преданность"
 GUD_tribal_loyalty_high: "Высокая лояльность племен"
 GUD_tribal_loyalty_undying: "Вечная племенная верность"
 GUD_uncertain_mission: "Неопределенная миссия"
 GUD_uncertain_mission_desc: "У братства Гудфийя не было реальных целей, кроме как досаждать французам как можно сильнее. Каждый шейх и каждый солдат — это отдельная голова, ведущая братство в своём направлении, а Ма аль-Айнайн — это тот клей, который скрепляет нас вместе. Будем надеяться, что с ним ничего не случится!"
 MOR_treaty_of_fes: "$great_power_politics_scramble_for_africa_tt_icon$ Фесский договор"
 MOR_harka_category: "Мобилизация племен"
 MOR_harka_category_desc: "В военное время власть султана измеряется не только его регулярной армией, но и скоростью, с которой он может созвать племена Атласа. Харка — древняя традиция королевского военного похода — превращает местных вождей в генералов, а их воинов — в грозное, хотя и недисциплинированное войско."
 MOR_raise_militia_FROM: "Поднять Харка в [FROM.GetName]"
 MOR_demobilization_harka: "Демобилизация племен"
 MOR_harka_delete: "§RПоскольку война закончилась, племена разойдутся по домам.§!"
 MOR_anticolonial_movement: "Антиколониальное движение"
 MOR_tribals_uprising_tt: "Племена недовольны нашей профранцузской политикой, и скоро они восстанут."
 MOR_tribal_discontent: "Восстание племен"