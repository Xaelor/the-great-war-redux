 PER_treasury_gendarmerie: "Казначейская жандармерия"
 PER_treasury_gendarmerie_desc: "Морган Шустер предлагает создать исполнительную военную организацию под названием Казначейская жандармерия для сбора налогов правительства с землевладельцев и знати."
 PER_elect_new_regent: "Избрать нового регента"
 PER_elect_new_regent_desc: "Со смертью Азод-оль-Молька пост регента стал вакантным. Меджлису предстоит избрать нового регента, который определит курс нашей политики."
 PER_subdue_the_press: "Усмирить прессу"
 PER_subdue_the_press_desc: "Мы должны разобраться с прессой, которая злоупотребляет свободой, парламент должен предоставить эти полномочия премьер-министру."
 PER_stronger_cabinet: "Более сильный кабинет"
 PER_stronger_cabinet_desc: "В эти критические времена нам нужен более сильный и решительный кабинет."
 PER_regency_dictatorship: "Диктатура регентства"
 PER_regency_dictatorship_desc: "Изгнать оппозицию, запретить газеты, отказаться от проведения парламентских выборов!"
 PER_restore_maku_maliat_payments: "Восстановить выплаты малиата Маку"
 PER_restore_maku_maliat_payments_desc: "Хан Маку полностью прекратил выплату малиата во время революции 1905 года, но он может быть более склонен к сотрудничеству с новым правительством."
 PER_anglo_persian_oil_company: "$PER_anglo_persian_oil$"
 PER_ali_reza_khan_regent: "Регент Али Реза Хан"
 PER_ali_reza_khan_regent_desc: "После свержения Мохаммада Али Шаха Каджара в 1909 году Али Реза Хан, носивший титул «Азод-оль-Мольк» (Столп государства), был назначен по решению [GetPersiaAdj] парламента регентом при сыне шаха, Ахмад-шахе Каджаре, который был несовершеннолетним, когда взошёл на трон после свержения отца. Али Реза Хан не имел формального образования. Он считается честным политиком."
 PER_abolqasem_khan_qaragozlu_regent: "Регент $PER_abolqasem_khan_qaragozlu$"
 PER_abolqasem_khan_qaragozlu_regent_desc: "$PER_abolqasem_khan_qaragozlu$, носящий титул «$PER_naser_al_molk$» (Столп государства), является членом партии умеренных и придерживается консервативных взглядов."
 PER_mirza_hasan_ashtiani_regent: "Регент $PER_mirza_hasan_ashtiani$"
 PER_mirza_hasan_ashtiani_regent_desc: "$PER_mirza_hasan_ashtiani$, носящий титул «$PER_mostowfi_ol_mamalek$» (Канцлер государства), является членом партии демократов и придерживается прогрессивных взглядов."
