 AZR_azerbaijani_khanate_desc: "Большинство ханств были упразднены в XIX веке. Но [ROOT.GetNonIdeologyNameDef] осталось, пребывая в изоляции. Однако с началом Конституционной революции и вмешательством великих держав, это может скоро измениться."
 AZR_reactionary_stronhold: "Оплот реакции"
 AZR_reactionary_stronhold_desc: "[ROOT.GetNameDef] сдержало натиск революции и не испытывает лояльности к новому центральному правительству."
 MAK_royal_intrigues: "Королевские интриги"
 MAK_royal_intrigues_desc: "Бывший хан, Теймур-паша, укрепил ханство. Во время рейда курдов шейха Убайдуллы, стремившихся создать независимый Курдистан, на Азербайджан, Теймур-паша Хан отбил их нападение, заслужив титул «спасителя Азербайджана». Местные жители называли его «Маку Падшахи». После его смерти пятеро его братьев хотели унаследовать власть. Эта борьба за власть ослабила ханство."
 PER_guarded_domains: "Охраняемые владения"
 PER_guarded_domains_desc: "Официальное название нашей страны, «Охраняемые владения Ирана», имеет значение защищённой политической единицы, управляемой государством и имеющей определённый географический регион. Однако в настоящее время Персия не защищена и не является единой политической единицей: враги за рубежом и внутри страны пытаются дестабилизировать нашу нацию, которая только начинает модернизироваться, и правительству предстоит решить, как её защищать.\n\n£national_unity_texticon Текущий уровень централизации - [?PER_centralization_level|.1Y%%]\n£ETH_imperial_treasury Доступные средства - [?PER_available_funds|.0Y]"
