 ww1_absolutist_revolts.1.t: "Мятеж Салар ад-Даулы"
 ww1_absolutist_revolts.1.d: "Абульфатх Мирза «Салар ад-Даула», брат бывшего шаха Мохаммада Али, захватил Сенендедж. Он пытается наступать на Тегеран, чтобы восстановить монархическое правление."
 ww1_absolutist_revolts.1.a: "Развёрнуты силы бахтиар! Остановите его!"
 ww1_absolutist_revolts.1.b: "Наш триумфальный марш. (Играть за [PRS.GetFlag] Салар ад-Даулу)"
 ww1_absolutist_revolts.2.t: "Мятеж Мохаммада Али Шаха"
 ww1_absolutist_revolts.2.d: "После заговора с целью возвращения к власти бывший шах Мохаммад Али высадился в Астрабаде. Он пытается наступать на Тегеран, чтобы восстановить свою власть."
 ww1_absolutist_revolts.2.a: "Тебе здесь не рады!"
 ww1_absolutist_revolts.2.b: "Я всегда возвращаюсь. (Играть за [PEX.GetFlag] Мохаммад Али Шаха)"
 ww1_absolutist_revolts.3.t: "Провал Салар ад-Даулы"
 ww1_absolutist_revolts.3.d: "Не сумев дойти до Тегерана, силы Салар ад-Даулы разваливаются, и он снова вынужден бежать в Османскую империю."
 ww1_absolutist_revolts.3.a: "И никогда не возвращайся!"
 ww1_absolutist_revolts.4.t: "Авантюра Мохаммада Али Шаха"
 ww1_absolutist_revolts.4.d: "Не сумев дойти до Тегерана, силы Мохаммада Али Шаха разваливаются, и он снова вынужден бежать в Россию."