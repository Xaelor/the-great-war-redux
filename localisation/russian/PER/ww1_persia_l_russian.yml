 ww1_per_rus_strangling.9.d: ""
 ww1_per_rus_strangling.9.a: "Значит, война."
 ww1_per_rus_strangling.10.t: "Русские под Тегераном!"
 ww1_per_rus_strangling.10.d: ""
 ww1_per_rus_strangling.10.a: "Разогнать Меджлис, страна важнее революции."
