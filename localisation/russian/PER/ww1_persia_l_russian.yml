 ww1_persia_rework.1.t: "Регент Азод-оль-Мольк умирает"
 ww1_persia_rework.1.d: "Али-Реза Хан Азод-оль-Мольк умер в возрасте 62 лет. Он был регентом [GetPersiaName] в общей сложности восемнадцать месяцев. В конце жизни он был известен как Дай Хан (почтенный дядя)."
 ww1_persia_rework.1.a: "Нам придётся избрать нового регента."
 ww1_persia_rework.2.t: "Выбор нового регента"
 ww1_persia_rework.2.d: "Со смертью Азод-оль-Молька пост регента стал вакантным. Меджлису предстоит избрать нового регента, который определит курс нашей политики. Выбор стоит между консервативным Насер оль-Мольком от Умеренных и прогрессивным Мостовфи оль-Мамалеком от Демократов."
 ww1_persia_rework.2.a: "Нам нужна умеренность."
 ww1_persia_rework.2.b: "Нам нужны реформы."
 ww1_persia_rework.3.t: "Сейед Абдолла Бехбахани убит!"
 ww1_persia_rework.3.d: "Во втором парламенте депутаты разделились на две группы: ультрапрогрессистов и умеренных. Бехбахани поддержал умеренную группу и стал влиятельной фигурой, когда между двумя группами возникли разногласия, из-за чего ультрапрогрессивные депутаты во главе с Сейедом Хасаном Такизаде возненавидели его. В ночь на пятницу 15 июля 1910 года четверо вооружённых людей, связанных с демократами, напали на него у него дома и убили его. Сейед Хасан Тагизаде подозревается в причастности, и он впоследствии бежал из столицы."
 ww1_persia_rework.3.a: "Этому насилию необходимо положить конец!"
 ww1_persia_rework.4.t: "Жестокое столкновение из-за разоружения!"
 ww1_persia_rework.4.d: "Саттар-хан и его воины, прибывшие в столицу в апреле, разбили лагерь в парке Атабек, где отказались подчиниться приказу правительства о разоружении. Правительственные войска и полицейские силы под руководством Епрема Хана предприняли краткое, но жестокое столкновение и сумели окружить и разоружить силы Саттар-хана. Около 30 воинов были убиты, а Саттар-хан был ранен в ногу, что сделало его инвалидом."
 ww1_persia_rework.4.a: "В конце концов, так должно было случиться."
 ww1_per_rus_strangling.1.t: "Российский ультиматум!"
 ww1_per_rus_strangling.1.d: "Российский министр, вызванный в Персидский МИД, выдвинул устное требование от имени своего правительства о немедленном выводе казначейских жандармов из парка Шуау-с-Салтана и о размещении в поместье персидских казаков из Казачьей бригады. Он также потребовал извинений за «оскорбление», которое, по утверждению его правительства, было нанесено его консульским должностным лицам. Он отказался принять во внимание протест Персии против нарушения её суверенитета и вмешательства в её внутренние дела и фактически вернул письменный протест, поданный Персидским правительством, хотя ранее получил и подтвердил его получение.\n\nРоссийский министр заявил, что его инструкции заключались в том, чтобы получить немедленный ответ «да» или «нет» от Персидского кабинета."
 ww1_per_rus_strangling.1.a: "Мы проконсультируемся с британцами."
 ww1_per_rus_strangling.1.b: "У нас нет другого выбора..."
 ww1_per_rus_strangling.1.c: "Мы не будем унижаться!"
 ww1_per_rus_strangling.2.t: "Персия напугана Россией"
 ww1_per_rus_strangling.2.d: ""
 ww1_per_rus_strangling.2.a: "Скажите им принять ультиматум и извиниться."
 ww1_per_rus_strangling.3.t: "Британия советует принять российский ультиматум"
 ww1_per_rus_strangling.3.d: ""
 ww1_per_rus_strangling.4.t: "Персия принимает наш ультиматум..."
 ww1_per_rus_strangling.4.d: ""
 ww1_per_rus_strangling.4.a: "Неважно, начинайте писать новый!"
 ww1_per_rus_strangling.5.t: "Персия отвергает наш ультиматум!"
 ww1_per_rus_strangling.5.d: ""
 ww1_per_rus_strangling.5.a: "Спасибо за предлог!"
 ww1_per_rus_strangling.6.t: "Готовится новый ультиматум!"
 ww1_per_rus_strangling.6.d: "Министр иностранных дел России ответил, что наше согласие на требования ультиматума принято, но он получил указание уведомить, что тем временем готовится другой ультиматум!"
 ww1_per_rus_strangling.6.a: "Прошу прощения?"
 ww1_per_rus_strangling.7.t: "Второй российский ультиматум!"
 ww1_per_rus_strangling.7.d: ""
 ww1_per_rus_strangling.7.a: "Мы должны смириться..."
 ww1_per_rus_strangling.8.t: "Меджлис отвергает ультиматум!"
 ww1_per_rus_strangling.8.d: ""
 ww1_per_rus_strangling.8.a: "Закройте его!"
 ww1_per_rus_strangling.8.b: "Организовать оборону!"
