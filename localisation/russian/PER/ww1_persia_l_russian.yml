 PER_disarm_revolutionaries: "Разоружить революционеров"
 PER_disarm_revolutionaries_desc: "В эти смутные времена произошло несколько убийств политических и религиозных деятелей. Мы должны остановить эти убийства и объявить, чтобы все частные лица сдали оружие."
 PER_ask_for_loans: "Просить займы"
 PER_ask_for_loans_desc: "Если мы собираемся проводить какие-либо реформы, нам нужны деньги, а получить их сейчас мы можем только через займы."
