 ww1_per_rus_strangling.11.a: "Миссия выполнена."
 ww1_per_tur_strangling.1.t: "Османские войска оккупировали [TUR_occupied_PER_state.GetName]"
 ww1_per_tur_strangling.1.d: "Османские войска вошли в [TUR_occupied_PER_state.GetCapitalVictoryPointName] и фактически оккупировали регион. Из-за их влияния и нашей практически несуществующей армии мы не можем противостоять этому действию."
 ww1_per_tur_strangling.1.a: "Когда-нибудь они уйдут."
 ww1_per_tur_strangling.2.t: "Неудача в закреплении в Западной Персии"
 ww1_per_tur_strangling.2.d: "Возможность закрепиться в Западной Персии для нас упущена, и вместе с международным давлением у нас нет другого выбора, кроме как вывести наши войска."
 ww1_per_tur_strangling.2.a: "Как жаль."
 ww1_per_tur_strangling.3.t: "Вывод османских войск из Западной Персии"
 ww1_per_tur_strangling.3.desc: "Поскольку османам не удалось закрепиться в Западной Персии, и под международным давлением у них не осталось выбора, кроме как вывести свои войска."
 ww1_per_tur_strangling.3.a: "Мы вернёмся!"
 ww1_per_tur_strangling.3.b: "Не будем скучать."
 ww1_per_tur_strangling.3.c: "Скатертью дорога."
 ww1_per_tur_strangling.3.d: "Персия не для завоеваний."
 ww1_per_tur_strangling.3.e: "Персидская граница продолжает меняться."
 ww1_per_generic.1.t: "[FROM.GetNameDefCap] просит заём"
 ww1_per_generic.1.d: ""
 ww1_per_generic.1.a: "Это расширит наше влияние."
 ww1_per_generic.1.b: "Персия не стоит и ломаного гроша."
 ww1_per_generic.2.t: "[FROM.GetName] согласился предоставить заём"
 ww1_per_generic.2.d: ""
 ww1_per_generic.2.a: "Весьма признательны."
 ww1_per_generic.3.t: "[FROM.GetName] отказался предоставить заём"
 ww1_per_generic.3.d: ""
 ww1_per_generic.3.a: "У нас есть другие варианты."
 ww1_per_generic.4.t: "Россия сформировала казачий полк в [PER_cossack_regiment_station.GetName]"
 ww1_per_generic.4.d: "Российское правительство, пользуясь слабостью нашего правительства, сформировало казачье подразделение в [PER_cossack_regiment_station.GetName]."
 ww1_per_generic.4.a: "Мы должны действовать с осторожностью."
 ww1_developer_note.7.t: "Добро пожаловать в Персию! (В разработке)"
 ww1_developer_note.7.d: "Это вводный контент для Персии, призванный лучше отразить Конституционную революцию и иностранные интервенции, а также увязать с новой механикой «Политика великих держав». Контент ещё не полностью играбелен, но основные механики готовы, и вы можете опробовать их, а также ознакомиться с некоторыми историческими событиями."
 ww1_developer_note.7.a: "Я просто посмотрю."
 has_domestic_independence_tt: "По крайней мере £occupation_costs  $RIGHT|.0Y%$ внутренней независимости"
 ww1_per_rus_strangling.7.b: "Мы решительно отвергаем это!"
 ww1_per_rus_strangling.9.b: "Это зашло слишком далеко."
 ww1_per_rus_strangling.10.b: "Защищать Тегеран до последнего!"
 ww1_per_rus_strangling.12.t: "Реставрация Мохаммада Али Шаха"
 ww1_per_rus_strangling.12.d: ""
 ww1_per_rus_strangling.12.a: "Машаллах, мы снова вернулись."
 ww1_per_rus_strangling.13.t: "Победа в Персии"
 ww1_per_rus_strangling.13.d: ""
 ww1_per_rus_strangling.13.a: "Миссия выполнена."
