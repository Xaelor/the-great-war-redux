 ITA_reinforce_lake_garda_fortifications: "Укрепить форты у озера Гарда"
 ITA_reinforce_lake_garda_fortifications_desc: "West of Lake Garda, our current fortifications are outdated and would not stand up against an Austrian attack. We must reinforce this area, with new fortifications and modernization of old ones to make sure the Austrians make no advance into Lombardy."
