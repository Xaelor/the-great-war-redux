 ITA_expand_hydroelectricity_decision2.tt: "(§YРегион§!):"
 ITA_tiring_historical_right_support: "Угасающая Поддержка Правых"
 ITA_tiring_historical_left_support: "Угасающая Поддержка Левых"
 ITA_tiring_socialist_support: "Угасающая Поддержка Социалистов"
 ITA_utilize_southern_agriculture_for_northern_industry: "Использовать южное с/х для северной промышленности"
 ITA_lombardy_textile_industry: "Инвестировать в текстильную промышленность Ломбардии"
 ITA_invest_in_emilia_electricity: "Инвестировать в электроэнергетику Эмилии"
 ITA_government_stability: "Правительство Луиджи Луццатти"
 ITA_government_stability_desc: "Синьор Луццатти, возможно, и сильный финансист, но является ли он сильным премьер-министром? Ответ - решительное нет. Оппозиция? Полное отсутствие готовности к конфронтации. Делать то, что необходимо ради нации? Только если это не сделает его непопулярным, нет, сэр. Его падение - лишь вопрос времени, а вместе с ним падут и его наполовину реализованные идеалы. Наполовину - это ещё щедро сказано, на самом деле."
 ITA_fading_mandate: "Угасающий мандат"
 ITA_reforming_the_country: "Реформирование и усиление страны"
 ITA_reforming_the_country_desc: "Объединённая лишь полвека назад, наша нация представляет собой лоскутное одеяло из пластырей для проблем, которые, кажется, никто не хочет решать. Юг остаётся в том же состоянии эксплуатации, в котором он пребывает уже тысячу лет, а интеграция граждан, находившихся под австрийским зонтиком, оказалась весьма сложной задачей. Эти проблемы, пронизывающие наше относительно новое государство, необходимо решать. На самом деле, их следовало бы решить десять лет назад, на рубеже веков, или даже пять десятилетий назад, на волне Рисорджименто. Неважно, время по-прежнему созрело для преобразования нации, чтобы встретить меняющийся мир.\n\nРазрушьте устаревшие стандарты прошлого! Принесите новую промышленную революцию нашим южным братьям! Создайте Италию, которая поставит своих врагов на колени и исполнит обещание нашей нации!"
 ITA_establish_the_school_patronage: "Установить попечительство над школами"
 ITA_increase_teacher_salary: "Увеличить Зарплаты Учителей"
 ITA_bring_schools_under_state_control: "Взять школы под контроль государства"
 ITA_mandatory_education_for_soldiers: "Обязательное образование для солдат"
 ITA_create_maternity_fund: "Создание материнского фонда"
 ITA_nationalize_insurance: "Национализировать страховые компании"
 ITA_fight_malaria_in_state: "Борьба с малярией в [FROM.GetName]"
 ITA_libyan_war: "Итало-турецкая война"
 ITA_leftist_union: "Умерить экстремистские партии"
 ITA_leftist_union_desc: "The Radical party used to be in a similar position the PSI currently finds itself in. Many of their members refused to participate in governments and elections all together, until the early 1900's. As we brought them into government, the party natually moderated itself, with the radicals no longer holding the view that the monarchy should be abolished, for example. We must bring the PSI into a coalition, and repeat the same process that moderated the radical party."
 ITA_the_reality_of_war: "Реалии войны"
 ITA_the_reality_of_war_desc: "Many people in the country, including socialists, don't support the Italian involvement in Turkish Libya. As the war progresses for longer, socialist sentiment in the country will continue to rise and support for the war will start to decline as the population question our ability to achieve victory in this war against the Sick Man of Europe."
 ITA_libyan_war_desc: "The inevitable war has finally broken done. Italia stands more united then ever with a patriotic fever running through the country. A patriotic fever so large, some are calling it 'dangerous'. With emotions at an all time high, we need to deliver results, both to humilate Turkey and to avoid being humilated to our own people. After all, socialists have claimed this war is completly useless and will only be a blood bath. We must prove them wrong. Unfortunately, the longer the war goes on the more correct they will appear."
 ITA_war_preperations: "Подготовка к войне"
 ITA_war_preperations_desc: "Despite what our propaganda says, very few people in the higher ups of the Italian military and political office believe a war with Turkey will truely be a cakewalk. We're favored, yes, but ego would certainly be our downfall here. That's why Giolitti has ordered for war preperations to be made before we strike the Ottoman Empire. We want to ensure we are ready, but waiting too long will only anger nationalists further, who want an invasion as soon as possible."
 ITA_prepare_for_naval_landings: "Подготовка к морским высадкам"
 ITA_publish_libyan_manual: "Опубликовать Manualetto per l'Ufficiale in Cirenaica"
 ITA_invite_military_staff: "Пригласить военных"
 ITA_communication_lines: "Улучшить линии коммуникаций"
 ITA_send_the_ultimatum: "Ультиматум за Триполитанию"
 ITA_send_the_ultimatum_desc: "As the Ottomans are clearly discriminating against ethnic Italians in Libya, we shall send them an ultimatum to transfer the territory to us."
 ITA_recognize_french_hegemony_morocco: "Услуга за услугу с французами"
 ITA_recognize_french_hegemony_morocco_desc: "The French promise us if we recognize their claims in morocco, the French promise back they would not intervene in a possible war between us and the Turkish."
 ITA_bomb_ottoman_islands: "Бомбардировка Османских Островов"
 ITA_bombard_the_libyan_coast: "Обстрел побережья Ливии"
 ITA_survey_libyan_coastline: "Шпионаж за Османскими кораблями"
 ITA_army_reforms: "Итальянская армия"
 ITA_navy_decisions: "Итальянский флот"
 ITA_build_medusa_class_submarines: "Построить подводные лодки типа Медуза"
 ITA_build_medusa_class_submarines_desc: "Инженер-подводник Чезаре Лауренти недавно создал новый проект подводной лодки типа Медуза. Эта новая конструкция представляет собой значительный шаг вперед по сравнению с его предыдущим проектом Фока - первым итальянским проектом подводной лодки, который теперь сильно устарел из-за своего бензинового двигателя. Нам следует приступить к строительству этих новых подводных лодок, поскольку они значительно лучше и являются следующим шагом для нашего флота."
 ITA_build_indominito_class_destroyers: "Построить эсминцы типа Индоминито"
 ITA_build_indominito_class_destroyers_desc: "Тип Индоминито - это новый проект эсминца, созданный инженером Луиджи Скалья. Эти новые корабли значительно крупнее и более совершенны во многих отношениях, в частности, оснащены паровой турбиной вместо паровой машины, и станут нашими первыми крупными эсминцами после завершения строительства."
 ITA_build_the_dante_alighieri: "Построить Данте Алигьери"
 ITA_build_the_dante_alighieri_desc: "Инженер Эдоардо Масдеа создал проект дредноута типа Данте Алигьери. По завершении это будет первый итальянский дредноут, великое достижение для нашего флота, демонстрирующее нашу военно-морскую мощь. Нам следует завершить строительство корабля и вывести его в море вместе с остальным флотом Regia Marina."
 ITA_build_conte_di_cavour_class: "Построить современные дредноуты"
 ITA_build_conte_di_cavour_class_desc: "Поскольку европейские державы соревнуются в постройке наибольшего числа дредноутов, нам необходимо наверстать упущенное, если наш флот хочет иметь шанс. Инженер Эдоардо Масдеа создал новый проект дредноута типа Конте ди Кавур. Новая конструкция обладает большей бронёй и вооружением, чем Данте Алигьери, и призвана превзойти проекты дредноутов других европейских держав."
 ITA_build_francesco_caracciolo_class: "Построить Франческо Караччоло класс"
 ITA_build_weather_monitoring_stations: "Построить метеорологические станции"
 ITA_build_weather_monitoring_stations_desc: "Погода в море может полностью изменить исход любого морского сражения, уничтожая флоты, поэтому нам крайне важно проявлять осторожность. Благодаря новому применению радиотехнологий на нашем флоте мы можем построить метеорологические станции для передачи данных о погоде нашим военно-морским силам и помощи им в избегании разрушительных штормов."
 ITA_prevent_AUS_shell_venice: "Этот фокус §Gпредотваратит§! §Rбомбардировку Венеции§! §YАвстрийским флотом§! во время войны!"
 ITA_prevent_AUS_harass_shipping: "Этот фокус §Gпредотвратит§! §Rрейды§! §Yавстрийского флота§! на наше судоходство во время войны!"
 ITA_train_new_naval_officers: "Подготовить новых морских офицеров"
 ITA_train_new_naval_officers_desc: "Наш флот значительно расширяется, и в настоящее время требуется намного больше новых морских офицеров для его полноценного укомплектования. Используя наш новый опыт с современными кораблями, мы должны подготовить современных офицеров, которые будут знать, как идеально управлять новейшими разработками, такими как подводные лодки и дредноуты."
 ITA_develop_new_hydrophones: "Разработать новые гидрофоны"
 ITA_develop_new_hydrophones_desc: "Подводные лодки - это смертоносные суда, представляющие серьёзную угрозу для наших крупных кораблей, поскольку они могут оставаться совершенно скрытыми и нанести смертельный удар. Наша текущая противолодочная технология пока недостаточно эффективна для обнаружения подводных лодок, и нам крайне важно инвестировать в разработку более точных гидрофонных технологий для точного определения их местоположения."
 ITA_organized_naval_barrages: "Организованные морские обстрелы"
 ITA_organized_naval_barrages_desc: "С развитием наших современных систем управления огнём мы можем гораздо точнее нацеливать крупнокалиберные орудия на вражеские корабли и наносить сокрушительные удары. Мы должны использовать это преимущество, применяя дредноуты с их многочисленными орудиями в скоординированных морских обстрелах, способных опустошить вражеские флоты."
 ITA_raid_the_austrian_navy: "Рейд на австрийский флот"
 ITA_raid_beirut_port: "Рейд порта в Бейруте"
 ITA_fund_ansaldo: "Профинансировать Ансальдо"
 ITA_fund_cantieri_navali_riuniti: "Профинансировать Cantieri Navali Riuniti"
 ITA_vote_of_no_confidence: "Отсутствие поддержки вынуждает к отставке"
 ITA_add_tarriffs_on_lumber: "Принять тарифы на пиломатериалы"
 ITA_add_tarriffs_on_carrots: "Принять тарифы на морковь"
 ITA_welcome_foreign_capital: "Привлечь иностранный капитал"
 ITA_free_trade_decat: "Чудеса свободной торговли"
 ITA_free_trade_decat_desc: "Италия исторически использовала высокие тарифные барьеры для защиты своей промышленности от иностранной конкуренции. Хотя это способствовало ограниченному росту отечественной промышленности и поддержанию высокого уровня занятости, очевидно, что такая политика ослабила Италию. Поэтому, открывая страну миру, мы должны действовать осторожно, чтобы не нарушить экономическое равновесие. Если иностранные товары наводнят нашу страну, местные предприятия и фермеры могут закрыться, что вызовет резкий скачок безработицы. Высокий уровень безработицы приведёт к снижению производительности заводов, уменьшению политической власти и росту потребления товаров народного спроса. Если иностранные производители начнут подавлять отечественные, это может привести к закрытию местных предприятий, ослабляя нашу промышленную базу. Это вызовет падение стабильности, снижение политической власти и замедление темпов строительства."
