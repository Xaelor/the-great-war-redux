 ww1_italy.451.t: "Очередной Год Войны"
 ITA_pressure_to_end_war: "Давление с Целью Окончить Войну"
 ww1_italy.451.d: "Поскольку война перешагнула в очередной год без конца, внутреннее положение в Италии продолжает ухудшаться. Война никогда не должна была затянуться так надолго — она высасывает всё из нашей страны. Наш дефицит продолжает оставаться непосильным, запасы продовольствия иссякают быстрее, чем мы можем их пополнить, и итальянцы хотят выйти из войны."
 ww1_italy.451.a: "Просто дайте нам пару месяцев!"
