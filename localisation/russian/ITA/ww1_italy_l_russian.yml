 ITA_the_enemy_from_within_desc: "Across the nation there are traitors who are opposed to our revolution, launching sabotages against us and resisting our socialist policies in favour of those who only want to suppress the lower class. We must swiftly crush these traitors with a campaign of terror if we are to secure the revolution."
