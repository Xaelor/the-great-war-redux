 ITA_the_biennio_rosso_desc: "Отношения между работодателями и работниками в Италии достигли рекордно низкого уровня, поскольку итальянские рабочие и крестьяне всё чаще отказываются мириться с нынешними условиями жизни. Организованные забастовки, беспорядки и прямая оккупация фабрик и городов становятся обычным явлением, в то время как владельцы предприятий и правительство пытаются справиться с ситуацией. Если UIl и USI добьются своего, это недовольство и волнения могут перерасти в настоящую революцию.\n\nТекущий уровень §rРеволюционного давления§! составляет §Y[?ITA_br_rev_progress]§!\n§LПо мере ухудшения ситуации интенсивность волнений будет расти. Превышение уровня волнений выше 100 приведёт к§! §Rреволюции.§!\n\nНаша текущая §3Переговорная сила§! составляет §Y[?ITA_br_reforms_level]§!\n§LДействия, удовлетворяющие требованиям рабочего класса и крестьян, будут увеличивать нашу переговорную силу. Переговорная сила может помочь нам мирно урегулировать острые события и повысить шансы на положительный исход при попытках договориться как с реформистскими организациями, так и с рабочими.§!\n\nНаши текущие отношения с §Sреформистскими§! организациями: §Y[?ITA_br_reformist_relations]§!\n§LРеформистские организации весьма настороженно относятся к попыткам революции и, вероятно, выступят против попыток анархистов, коммунистов и синдикалистов начать революцию в Италии. Хорошие отношения с реформистскими организациями гарантируют, что они помогут нам подавить эти выступления, хотя за свою поддержку они, вероятно, будут ожидать уступок.§!\n\nНаша текущая способность к §NПодавлению§! революционной активности составляет §Y[?ITA_br_suppress_power]§!\n§LПодавление революционной активности потребует сильных, лояльных и компетентных властей, будь то армия или полиция. Без достаточной способности к подавлению все попытки силового разгона забастовок, бунтов и освобождения захваченных городов провалятся.§!"
