 ww1_italy.452.t: "Хрупкая Поддержка Войны"
 ww1_italy.452.d: "Многие итальянцы, несмотря на все наши усилия по воспитанию чувства национального единства и общей цели, не видят, каким образом текущая война приносит им хоть какую-то пользу. Война такого масштаба, в которой мы оказались, несомненно, изменит всё в повседневной жизни итальянского народа, если мы не сможем завершить её достаточно быстро. И когда это произойдёт, нам останется лишь молиться, чтобы их терпимость к лишениям оказалась достаточно высокой, чтобы избежать революции. Безопаснее всего сказать, что для всех участников лучше всего будет выиграть эту войну быстро."
 ww1_italy.452.a: "Мы должны успокоить людей, война будет быстрой."
 ww1_italy.452.b: "Тогда мы можем только надеется, что война скоро закончится"
