 ITA_bersaglieri_cyclists: "Экипировать Берсальеров велосипедами"
 ITA_bersaglieri_cyclists_desc: "The bersaglieri are elite skirmisher units intended to be fast moving and mobile. We should equip the bersaglieri with bicycles and form bicycle units in them to improve the mobility of the soldiers."
