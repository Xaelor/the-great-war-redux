l_russian:
 ITA_communist_party_dominance: "Авангард революции"
 ITA_what_new_reforms_do: "Мы полностью §Cперепишем§! конституцию Италии. Определенные решения могут увеличить силу либо §RАвтономистов§!, либо §QЦентралистов§!."
 ITA_autonomists_increase: "§rАвтономисты§! увеличат свою силу в §oКоалиции§!"
 ITA_automists_dominate: "§rАвтономисты§! домиинируют в §oКоалиции§!"
 ITA_centralists_increase: "§QЦентралисты§! увеличат свою силу в §oКоалиции§!"
 ITA_food_shortages: "Нехватка продовольствия"
 ITA_synd_ana_a: "Все советники §QМаксималисты§! и §rСиндикалисты§! будут разблокированы"
 ITA_disable_some_mas: "Несколько §Sсоциал-демократических§! §Yполитических советников§! будет §Rнедоступно§!"
 ITA_the_great_relief: "Великое Облегчение"
 ongoing_negotiations_ITA: "В данный момент ведем переговоры"
 ITA_silesian_bargain_success: "Мы согласились принять §YСилезскую сделку§!"
 ITA_reparations_to_war: "Репарации Османам"
 ITA_invest_in_southern_states: "Инвестировать в [FROM.GetName]"
 ITA_spread_unions_down_south: "Распростронить профсоюзы на юг"
 ITA_francesco_coal_and_energy_law: "Закон об угле и энергии"
 ITA_francesco_coal_and_energy_law_desc: ""
 ITA_army_preperations: "Подготовка к войне в Ливии"
 ITA_ministry_of_the_colonies: "Министерство колоний"
 ITA_reformist_wins: "§rРеформисты§! одержали победу на конференции §oPSI§!"
 ITA_inc_r: "Нанятие этих §YПолитических Советников§! увеличит силу §rРеформистов§! в §oPSI§!"
 ITA_reform_increase: "§rРеформисты§! увеличат свою силу в §oPSI§!\n§LСейчас баланс сил между реформистами и максималистами таков:\nРеформисты: [?ITA_reformist_socialist_power]\nМаксималисты: [?ITA_maximalist_power]§!"
 ITA_u_dont_want: "§oPSI§! проведет съезд партии в §YИюле 1912§!. В наших интересах, чтобы §rРеформисты§! оказались на вершине"
 ITA_maxim_increase: "§QМаксималисты§! увеличат свою силу в §oPSI§!\n§LСейчас баланс сил между реформистами и максималистами таков:\nРеформисты: [?ITA_reformist_socialist_power]\nМаксималисты: [?ITA_maximalist_power]§!"
 ITA_mob_tt: "Мы будем получать §CСобытия§! дающие нам §Gбонусы§! по мере того, как программа мобилизации промышленности набирает обороты."
 ITA_ottoman_islands_bombed: "Итальянская бомбардировка"
 ITA_liberty_protections: "Закрепить свободу в конституции"
 ITA_supporting_northern_business: "Разорение профсоюзов"
 ITA_italian_nationalism: "Итальянский национализм"
 ITA_italian_nationalism_desc: "В Италии существует значительная интеллектуальная группа итальянских националистов. Эти националисты позиционируют себя как альтернативу так называемым провалам либерального правления, в которых они винят наши унижения в Эфиопии и Тунисе. Хотя их ряды не состоят целиком из авторитаристов, большинство их членов действительно полагают, что демократия является одной из многих вещей, сдерживающих Италию."
 ITA_social_unrest: "Социальные Волнения"
 ITA_new_aluminium_mines: "Построить новые бокситовые шахты"
 ITA_social_unrest_desc: "Социальное и политическое состояние Италии далеко от стабильности. Глубоко укоренившиеся проблемы, такие как южный вопрос, нищета, политическая поляризация, преступность, а также отсутствие как системы социальной защиты, так и подлинного политического представительства, привели к тому, что массовые социальные волнения стали нормой. Для исцеления страны потребуются масштабные политические, экономические и социальные реформы."
 ITA_fruits_of_the_reforms: "Плоды реформ"
 ITA_fruits_of_the_reforms_desc: "Реформы прошлых правительств Джолитти и Сиднея Соннино принесли Италии ощутимые плоды. Новые железные дороги, повышение эффективности сельского хозяйства, укрепление лиры и расширение сельской промышленности сделали многое для усиления страны. По мере того как мы продолжаем проводить реформы, можно ожидать ещё большей отдачи от наших усилий."
 ITA_italian_army: "[ITA_army_name_thing]"
 ITA_italian_army_desc: "Армия рассматривалась как критический инструмент «унификации» с момента самого объединения. Политики как левого, так и правого толка признавали, что региональный набор был бы более эффективен с военной точки зрения, а также более экономичен.\n\nПоследствия этой организационной структуры были многочисленны. Прежде всего, с логистической точки зрения, это была дорогостоящая и затратная по времени система, которая крайне усложняла и замедляла процесс мобилизации. С точки зрения сплоченности подразделения, это часто считается жизненно важным фактором поддержания морального духа войск."
 ITA_socialism_with_italian_characteristics: "Искать классового сотрудничества"
 ITA_revolting: "Восстающая провинция"
 ITA_nation_first: "Нация Прежде Всего"
 ITA_unlock_other_army_chiefs: "Сейчас доступен на эту позицию"
 ITA_sac_cadorna: "§YЛуиджи Кадорна§! будет уволен и станет §Rнедоступен§!. §YАрмандо Диаз§! будет назначен как новый §Yглавнокомандующий армии§!, другие главнокомандующие также будут §Gдоступны§! для выбора."
 ITA_encourage_self_defense_of_the_workers: "Вооружить рабочих"
 ITA_encourage_self_defense_of_the_workers_desc: "Единственный способ выжить для революции — это вооружить население. Арсеналы будут захвачены, фабрики реквизированы, а пролетариат призван. Только тогда будет достигнута победа!"
 ITA_workers_militia.tt: "Создает дивизии, использующие шаблон §YGuardie Rosse§!"
 ITA_guerrilla_tactics: "Партизанские тактики"
 ITA_guerrilla_tactics_desc: "Если мы хотим одержать победу над многочисленной итальянской армией, мы должны перейти к партизанской тактике. Опираясь на нашу народную поддержку, мы можем призвать рабочих по всей Италии развернуть кампанию партизанской войны против итальянской армии, саботируя её логистику, линии связи и устраивая засады, чтобы постепенно подорвать её боеспособность."
 ITA_guerrilla_tactics.tt: "(§Y[ITA.GetNameWithFlag]§!) получает:"
 ITA_recruit_northern_workers: "Набрать северных рабочих"
 ITA_recruit_northern_workers_desc: "По всему северу Италии есть множество рабочих, сочувствующих нашему делу, которые, несомненно, стали бы сражаться за нас, получив оружие. Развёртывание масштабной вербовочной кампании в промышленных городах севера, чтобы привлечь рабочих в наши ряды, могло бы значительно помочь в освобождении страны от гнёта."
 ITA_recruit_northern_workers.tt: "Мы получим дивизию §YGuardie Rosse§! в следующих городах, если мы контролируем их: §YТорнио§!, §YМилано§!, §YБергамо§!, §YБрешиа§!, §YВерона§!, §YПадова§!, §YВенеция§!, §YУдине§!, §YПарма§!, §YБолонья§!, §YФиренце§!\n\nТекущие §Yэффекты§!:"
 ITA_spread_revolution_down_south: "Разжечь пламя революции на юге"
 ITA_spread_revolution_down_south_desc: "Крестьян на юге Италии десятилетиями эксплуатировали крупные землевладельцы, устанавливая непомерно высокую арендную плату и обрекая их на нищету. При нашей поддержке эти крестьяне смогут избавиться от эксплуататоров-землевладельцев и освободиться, охватив пламенем революции весь юг."
 ITA_coordinate_the_unions: "Скоординировать революционные бригады"
 ITA_coordinate_the_unions_desc: "Революционные бригады отличаются высокой мотивацией, но не имеют подготовки и опыта. Их следует реорганизовать в профессиональную, революционную армию, но под строгим надзором, чтобы избежать проникновения сил реакции."
 ITA_revolutionary_brigades.tt: "Создает дивизии, использующие шаблон §YBrigata Rivoluzionaria§!"
 ITA_victory_in_numbers: "Победа в цифрах"
 ITA_victory_in_numbers_desc: "Нынешней революционной армии не нужна помощь реакционных элементов в итальянской армии. Руководить должны только те, кто обладает революционным пылом. Верховенство воли и численности возьмёт верх над реакционной дисциплиной."
 ITA_mass_conscription_of_workers: "Массовая мобилизация рабочих"
 ITA_mass_conscription_of_workers_desc: "Из-за нехватки профессиональных солдат, лояльных нашему делу, было принято решение распределить захваченные арсеналы между новыми рабочими ополчениями. Мы последуем примеру Гарибальди и Парижской коммуны, чтобы создать истинно революционную народную армию!"
 ITA_mass_conscription_of_workers.tt: "Мы получим дивизию §YBrigata Rivoluzionaria§! в следующих городах, если мы контролируем их: §YТорнио§!, §YМилано§!, §YВерона§!, §YВенеция§!, §YБолонья§!, §YФиренце§!\n\nТекущие §Yэффекты§!:"
 ITA_support_the_roman_workers: "Поддержать римских рабочих"
 ITA_support_the_roman_workers_desc: "Революционный пыл вновь охватил улицы Рима: рабочие бастуют и восстают против короля в поддержку нашего революционного дела. В первые дни революции рабочие попытались свергнуть короля и захватить Рим, как это делали революционеры против папы в 1849 году, однако на этот раз они были жестоко подавлены итальянской армией и местной полицией. Но революция в Риме ещё не побеждена, и если мы вооружим рабочих, мы сможем освободить город."
 ITA_seek_internationalist_volunteers: "Пригласить интернациональных добровольцев"
 ITA_seek_internationalist_volunteers_desc: "По всему миру множество интернационалистов разделяют идею освобождения рабочих от угнетения и сплачиваются вокруг нашего революционного дела. Многие даже готовы сражаться за нас, и их поощрение значительно поможет нам освободить всю страну."
 ITA_article_8_is_now_a: "Статья восьмая теперь будет гласить:\n§LВсе представители парламента суверенны в рамках своего избранного мандата. Никто не может распустить их иначе как через народный референдум или новые немедленные выборы.§!"
 ITA_socialist_propaganda: "Распространять социалистическую пропаганду в [FROM.GetName]"
 ITA_s_prop: "Социалистическая Пропаганда"
 ITA_sabotadge_entente: "Солидарность с рабочими запада"
 ITA_socialist_sabotadge_entente: "Саботировать Антанту"
 ITA_entente_civil_war: "§YКарл Маркс§! всегда утверждал, что революция начнётся в индустриально развитых западных странах. Возможно, для свершения революции на Западе достаточно лишь §Rпоражения§! в §YВеликой войне§!."
 ITA_article_8_is_now_c: "Статья восьмая теперь будет гласить:\n§LПремьер-министр созывает палаты, может приостанавливать их работу и распускать их.§!"
 ITA_explusion_of_moderates: "Выборы председателя ИСП."
 ITA_ppd: "При выборе этого фокуса:\nМы получим §Yцепочку событий§!, в ходе которых будет установлена §Cдиктатура§!. §TПарламент§! может попытаться §Rсопротивляться§! нам."
 ITA_article_5_is_now_a: "Статья пятая теперь будет гласить:\n§LВооружённые силы находятся под контролем и в подчинении местных рабочих советов и должны быть организованы на основе демократического командования.§!"
 ITA_article_5_is_now_c: "Статья пятая теперь будет гласить:\n§LПремьер-министр является главой государства: он командует всеми вооружёнными силами на суше и на море.§!"
 ITA_article_2_is_now_m: "Статья вторая теперь будет гласить:\n§LИтальянская Республика является атеистическим государством. Публичное отправление религиозных культов запрещено.§!"
 ITA_article_2_is_now_a: "Статья вторая теперь будет гласить:\n§LИтальянская Республика является светским государством. Религия отделена от государства, и религиозные убеждения свободны.§!"
 ITA_article_2_is_now_c: "Статья вторая теперь будет гласить:\n§LИтальянская Республика является светским государством. Религия отделена от государства, и религиозные убеждения свободны при условии, что они не вмешиваются в права рабочего класса или власть социалистической республики.§!"
 ITA_care_about_sucessor: "§CПреемник§! Джоллити будет решен нашими действиями как премьер-министра. Посмотрите фокусы: §YСоциализм через реформизм§!, §YХристианская демократия§!, §YШанс для радикалов§!, §YНедооцененный компромисс§!, §YВозвращение консерваторов§!, §YКонсенсус разделенных§!, §YВеликий гамбит Джолитти§! и §YКак отец, как сын§!, чтобы увидеть, что нужно сделать, чтобы получить желаемого преемника."
 ITA_article_1_is_now: "Статья первая теперь будет гласить:\n§LИталия является демократической республикой, основанной на суверенитете трудового народа. Вся власть принадлежит пролетариату и выражается через советы, собрания и демократические органы рабочих и крестьян.§!"
 focus_selected.tt: "Когда этот фокус выбран:\n"
 ITA_utilize_king_decrees: "Применить королевские указы"
 ITA_utilize_king_decrees_desc: "Согласно Статуту Альбертино, король обладает широким кругом полномочий, таких как внесение законопроектов и издание декретов. Это может оказаться преимуществом, позволяя премьер-министру при необходимости обходить парламент."
 ITA_mass_mobilization: "Массовая мобилизация"
 ITA_mass_mobilization_desc: "Все способные сражаться должны быть мобилизованы на защиту нации."
 ITA_hand_made_weapons: "Массовое производство оружия"
 ITA_hand_made_weapons_desc: "В то время как Италия испытывает трудности как в количественном, так и в качественном производстве, мы не можем сосредоточиться на том и другом одновременно, но мы можем, по крайней мере, обеспечить наши войска хорошим вооружением."
 ITA_rebuilding_the_nation_idea: "Перестройка нации"
 ITA_socialist_crackdown: "Репрессии против социалистов"
 ITA_socialist_crackdown_desc: "Социалистическое движение с начала Великой войны выражало ожесточённое противодействие нашему участию в конфликте. Такие голоса, подрывающие наши военные усилия, не должны терпеться. Подавление этих агитаторов необходимо для стабильности нации."
 ITA_pacifist_crackdown: "Разбить пацифистов"
 ITA_pacifist_crackdown_desc: "Пацифисты ничего не знают об истине. Мы сражаемся за славу Италии и великую цель. Этим капитулянтам никогда этого не понять. Мы должны подавить пацифизм, чтобы продолжать наши военные усилия и сплотить нацию вокруг победы и долга."
 ITA_principles_of_rigidity: "Принципы жестокости"
 ITA_principles_of_rigidity_desc: "Итальянский народ должен осознавать принципы твёрдости. Мы сильны, решительны и не боимся никаких угроз для Италии. Итальянский дух должен следовать принципам твёрдости, когда порядок и сплочённость имеют первостепенное значение для движения нации вперёд!"
 ITA_duty_to_victory: "Долг Победе"
 ITA_duty_to_victory_desc: "Мы должны воспитать в каждом итальянце чувство долга. Долга перед победой — все жертвы являются средствами для достижения победы. Неважно, как мы к ней придём. Важно лишь то, что мы придём и что от этого выиграет Италия в целом."
 ITA_the_invisible_weakness: "Невидимая млабость"
 ITA_the_invisible_weakness_desc: "Нация не будет по-настоящему единой, пока не будут устранены все слабости итальянского народа и нации. Неповиновение и агитация служат лишь тому, чтобы навредить стране. Мы должны быстро удалить эту язву с тела нашей страны, как хирург. Чтобы Италия оставалась сильной и единой!"
 ITA_idea_the_invisible_weakness: "Невидимая млабость"
 ITA_idea_the_invisible_weakness_desc: "Наши солдаты должны понимать важность служения Италии. Слабости, как реальные, так и мнимые, должны быть искоренены из мыслей народа и нашей армии. Это не просто война, а долг, который каждый итальянец должен носить в своём сердце. Мы не должны показывать слабости нашим врагам!"
 ITA_international_volunteers: "Интернациональные добровольцы"
 ITA_anti_socialism: "Репрессии против социализма"
 ITA_moderate_the_nationalists: "Новая программа"
 ITA_moderate_the_nationalists_desc: ""
 ITA_bulwark_of_the_conservative_movement: "Союз с людьми Саландры"
 ITA_bulwark_of_the_conservative_movement_desc: "Бывший министр финансов Антонио Саландра имеет множество полезных связей в среде деловой элиты, что может оказаться полезным в случае войны."
 ITA_national_pacification: "Искать национального умиротворения"
 ITA_national_pacification_desc: "Итальянские левые расколоты по вопросу нейтралитета, но риск забастовок в случае войны слишком велик. Подавление и раскол профсоюзов необходимо провести быстро."
 ITA_arrest_liberals: "Подавление протестующих либералов"
 ITA_pass_the_first_anti_dissent_laws: "Принять первые антидиссидентские законы"
 ITA_pact_with_the_mafia: "Пакт с мафией"
 ITA_from_the_root: "Вырвать с корнем"
 ITA_split_the_socialist_movement: "Разделить социалистическое движение"
 ITA_split_the_socialist_movement_desc: "Многие из предыдущих реформ Джолитти удовлетворили стремление многих рабочих на севере к переменам. Мы можем использовать это, чтобы попытаться расколоть социалистическое движение, интегрировав некоторых более умеренных социалистов в политическую систему, одновременно изолируя и атакуя максималистов."
 ITA_repress_the_north: "Подавить северных анархистов"
 ITA_repress_the_north_desc: "Анархистские профсоюзы являются самыми проблемными из всех. Если они захватят и удержат контроль над оружейными заводами в Турине, это..."
 ITA_adapt_to_mountain_warfare: "Приспособиться к войне в горах"
 ITA_adapt_to_mountain_warfare_desc: "С началом войны в Альпах нашей армии необходимо применять новые стратегии для эффективного ведения боевых действий на большой высоте, в опасных условиях, среди долин и заснеженных горных вершин, где в любой момент может сойти лавина и уничтожить целую бригаду. Эта новая война требует прокладки туннелей через ледники, восхождений на скалы и доставки припасов в горы по канатам."
 ITA_establish_supremacy_over_politicians: "Установить превосходство над политиками."
 ITA_expand_carabinieri_des: "Развернуть карабинеров на фронте"
 ITA_expand_carabinieri_des_desc: "В нашей армии растёт число солдат, которые слишком трусливы, чтобы идти вперёд, и во время атаки покидают свои позиции и бегут с фронта. Это совершенно неприемлемо, поэтому мы должны разместить карабинеров на передовой с пулемётными постами, чтобы предотвратить отступление наших солдат."
 ITA_align_with_ultra_nationalists: "Союз с ультранационалистами"
 ITA_stick_to_our_core_values: "Разрушить статус-кво"
 ITA_stick_to_our_core_values_desc: "Нынешний политический порядок несостоятелен. Если его нельзя переделать по нашему усмотрению, он будет разрушен!"
 ITA_concentrate_offensives: "Запустить концентрированные наступления"
 ITA_concentrate_offensives_desc: "Чтобы добиться какого-либо прогресса в этой адской окопной войне, мы должны сосредоточить наши силы в одном месте и начать крупное скоординированное наступление. Это может быть требовательно к нашим сетям снабжения, но нет другого способа добиться разумных успехов без массированной артиллерийской подготовки, когда люди идут вперёд и достигают быстрых успехов."
 ITA_offensive: "Итальянское наступление"
 ITA_veneto_offensive: "Контрнаступление в Венето"
 ITA_isonzo_offensive: "Наступление в Изонцо"
 ITA_nice_offensive: "Ниццкое наступление"
 ITA_improve_soldier_morale: "Повысить боевой дух"
 ITA_improve_soldier_morale_desc: "Боевой дух наших солдат на передовой ухудшается из-за ужасных условий в окопах на линии фронта. Мы должны поднять моральный дух наших солдат, приказав командирам улучшить условия жизни на передовой."
 ITA_sack_cadorna: "Уволить Кадорну"
 ITA_sack_cadorna_desc: "Кадорна доказал, что он некомпетентный командующий, неспособный руководить армией. Его безжалостные стратегии стоили нам множества жизней и оборудования и сильно навредили нашим военным усилиям. Он будет отстранён от командования и заменён Армандо Диасом."
 ITA_an_army_of_trust: "Воспитать Армию Доверия"
 ITA_an_army_of_trust_desc: "Кадорна был безжалостным параноиком, который породил атмосферу недоверия в высшем командовании. Если мы хотим одержать победу, этому необходимо положить конец. Мы восстановим автономию офицеров и снова будем ценить мастерство выше слепой лояльности."
 ITA_hearten_morale: "Воодушевить солдат"
 ITA_hearten_morale_desc: "Вооружение и живая сила ничего не значат, если боевой дух низок. Армия должна знать, за что и почему она сражается."
 ITA_update_tactical_norms: "Обновить тактические руководства"
 ITA_update_tactical_norms_desc: "Наших солдат обучают устаревшим стратегиям из устаревших учебников. Это неприемлемо! Это необходимо исправить!"
 ITA_form_compagnie_della_morte: "Сформировать Роту Смерти"
 ITA_form_compagnie_della_morte_desc: "В этой войне оборонительные укрепления установлены повсеместно, что делает любое наступление крайне дорогостоящим и неэффективным. Мы должны сформировать специализированные инженерные подразделения из самых опытных солдат — «роты смерти», — чтобы они выходили на вражеские позиции и уничтожали укрепления до начала основного наступления, снижая обороноспособность противника."
 ITA_mass_produce_artillery: "Массовое Производство Артиллерии"
 ITA_mass_produce_artillery_desc: "Артиллерия чрезвычайно важна в этой войне, и для любого наступления необходимы массированные бомбардировки. Нам нужно наладить массовое производство артиллерии, чтобы проводить крупные наступления и никогда не испытывать нехватки."
 ITA_storm_troopers: "Создать Ардити"
 ITA_storm_troopers_desc: "Для эффективной атаки на вражеские позиции нам нужны самые преданные, храбрые и опытные бойцы, чтобы идти вперёд и сражаться за вражеские позиции. Мы должны создать для этой цели специализированные подразделения «Ардити», состоящие из людей, готовых отдать свою жизнь за страну.\n\"Мы либо победим, либо все погибнем!\""
 ITA_unlock_stormtroopers: "Разблокирует §Yотряды штурмовиков§!"
 ITA_arditi_tech: "Штурмовики"
 ITA_boys_of_99: "Мальчики 99 года"
 ITA_boys_of_99_desc: "Живая сила жизненно важна для удержания сильных позиций на передовой и для того, чтобы враг никогда не прорвался. Поскольку война затягивается, требуется больше живой силы, и для этого мы должны ускорить обучение новобранцев, как только им исполнится 18 лет, и отправлять их на передовую."
 ITA_hold_the_piave: "Держать рубеж у Пьяве"
 ITA_hold_the_piave_desc: "Австрийцы только что отбросили наши армии к реке Пьяве, и такие крупные города, как Венеция, находятся под непосредственной угрозой вторжения австрийцев. Река Пьяве не должна пасть, и мы должны защищать её всеми силами, не позволяя ни одному австрийскому солдату переправиться через неё."
 ITA_stand_on_the_piave: "Стоять на Пьяве"
 ITA_veneto_counteroffensive: "Контрнаступление в Венето"
 ITA_veneto_counteroffensive_desc: "Австрийские армии ослаблены после их наступления против нас, а в Венето есть итальянцы, которые ждут наших армий для освобождения. Мы должны начать контрнаступление всеми силами и нанести решающий удар по австрийской армии, одновременно освободив весь регион."
 ITA_accelerate_training_of_officers: "Ускорить подготовку новых офицеров"
 ITA_accelerate_training_of_officers_desc: "Нашей армии нужно много новых офицеров для эффективного командования многочисленными подразделениями, в которых ощущается их нехватка. Мы должны ускорить процесс подготовки новых офицеров, чтобы помочь преодолеть дефицит."
 ITA_constant_offensive: "Беспощадные штурмы"
 ITA_constant_offensive_desc: "Луиджи Кадорна считает, что если армия будет постоянно атаковать вражеские позиции, противник будет полностью деморализован и его можно будет победить благодаря превосходному моральному духу наших армий. Мы должны внедрить эту тактику и никогда не давать врагу шанса на восстановление."
 ITA_continue_moderation_of_the_party: "Продолжить умеренный курс партии"
 ITA_continue_moderation_of_the_party_desc: "Наша власть непрочна. Реформы на предельной скорости оттолкнут избирателей, симпатизирующих Христианским демократам, но слишком медленные изменения, вероятно, направят голоса в пользу Социалистической партии. Ключ — идти по узкому пути."
 ITA_land_reform_south: "Земельная реформа на юге"
 ITA_land_reform_south_desc: "Крестьяне Меццоджорно стонут под железной хваткой латифундистов — положение, граничащее с феодализмом. Возможно, пришло время последовать примеру столыпинских реформ в России и наделить крестьян землёй, создав класс мелких фермеров."
 ITA_divorce_reform_r: "Реформировать систему разводов"
 ITA_divorce_reform_r_desc: "Слишком долго развод в Италии находился в руках церкви, которая фактически запрещала эту практику среди верующих. Эта система по сути оказалась несправедливой по отношению к женщинам и должна быть реформирована, чтобы стать более эгалитарной."
 ITA_progressive_catholics: "Союз с прогрессивными католиками"
 ITA_progressive_catholics_desc: "Прогрессивные католики близки к нашей партии, так как выступают за многие из тех же социальных реформ, что и мы. Сближение с ними было бы мудрым шагом, поскольку мы могли бы получить гораздо больше поддержки с их стороны, и они могли бы оказаться ценными союзниками."
 ITA_social_equality_women: "Социальное равенство женщин"
 ITA_social_equality_women_desc: "В настоящее время женщины не играют большой роли в итальянском обществе, и лишь небольшая часть рабочей силы состоит из женщин. Мы должны поощрять больше женщин к участию в рабочей силе и разрушению традиционных ролей."
 ITA_develop_housing_in_toscana: "Развивать жилье в Тоскане"
 ITA_build_modern_homes_in_the_south: "Построить современные дома на юге"
 ITA_build_modern_homes_in_the_south_desc: "Состояние жилья на юге очень плохое: многие люди живут в домах из камня, которые даже не скреплены раствором или деревом. В рамках нашего государственного жилищного плана мы должны построить новые современные дома на юге, чтобы обеспечить людям там надлежащее, пригодное для жизни жильё."
 ITA_effect_of_earthquake: "Любое будущее землятрясение в §YАбруццо§! нанесет меньший ущерб."
 ITA_annul_the_pro_anarchist_laws: "Запретить левые газеты"
 ITA_annul_the_pro_anarchist_laws_desc: "Социалистические газеты слишком опасны, чтобы им позволили действовать свободно. Они обладают властью координировать забастовки и поднимать пролетариат на борьбу. Они должны быть немедленно запрещены."
 ITA_begin_army_reforms_desc: "Итальянская армия находится в плачевном состоянии. Плохое оснащение, устаревшее вооружение и руководство одними из самых некомпетентных людей на свете привели к тому, что армия не в состоянии вести боевые действия против какой-либо крупной страны. Нам потребуются масштабные реформы в руководстве и тактике, а также увеличение финансирования, чтобы вытащить нашу армию из её нынешнего жалкого состояния."
 ITA_southern_agriculture: "Южный вопрос"
 ITA_southern_agriculture_desc: "Южная Италия сильно отстала от индустриализированного севера из-за десятилетий правительственного пренебрежения. Правительства прошлого пренебрегали экономическими и социальными проблемами юга, чтобы сосредоточиться на росте севера, что отражается в высоких тарифах Италии и незначительных инвестициях в инфраструктуру юга. Хотя эксплуатация юга приносит выгоду нашей промышленности на севере, она привела к массовой эмиграции, особенно в Америку."
 ITA_southern_question_idea: "Южный вопрос"
 ITA_southern_question_idea_desc: "Южная Италия сильно отстала от индустриализированного севера из-за десятилетий правительственного пренебрежения. Правительства прошлого пренебрегали экономическими и социальными проблемами юга, чтобы сосредоточиться на росте севера, что отражается в высоких тарифах Италии и незначительных инвестициях в инфраструктуру юга. Хотя эксплуатация юга приносит выгоду нашей промышленности на севере, она привела к массовой эмиграции, особенно в Америку."
 ITA_let_our_star_power_shine: "Пусть наша звезда сияет"
 ITA_let_our_star_power_shine_desc: "Луццати, возможно, не самый искушённый политик, но никто не может отрицать, что он пользуется всеобщим уважением как экономист. Мы используем опыт нашего премьер-министра, чтобы привлечь в правительство более видных экономистов и применить их знания для модернизации нашей финансовой системы."
 ITA_southern_debt_plam: "Национализировать долг юга"
 ITA_southern_debt_plam_desc: "Огромный долг, сковывающий провинции Юга, является не просто региональной проблемой, а общенациональным кризисом. Чтобы способствовать подлинному единству и раскрыть экономический потенциал Меццоджорно, государство должно вмешаться. Мы примем на себя этот долг — смелый шаг, который стабилизирует Юг и полностью интегрирует его в национальную экономику."
 ITA_cooling_of_employer_worker_relations: "Бескомпромиссный либерализм"
 ITA_cooling_of_employer_worker_relations_desc: "Постоянное государственное посредничество между трудом и капиталом привело к неэффективности и ободрило социалистических агитаторов. Мы должны твёрдо стоять на либеральных принципах: роль правительства не вмешиваться в частное предпринимательство, а гарантировать порядок. Отступив, мы позволяем свободному рынку функционировать, способствуя росту и дисциплине."
 ITA_liberalize_the_economy: "Начать либерализацию экономику"
 ITA_liberalize_the_economy_desc: "Итальянская экономика скована назойливыми регуляциями и идиотскими пошлинами. Только приняв элементы австрийской школы, мы сможем выбраться из застоя."
 ITA_budget_balancing: "Связы с французскими интеллектуалами"
 ITA_budget_balancing_desc: "Сам термин \"Laissez Faire\" происходит из Франции. Французский экономический либерализм должен быть полностью скопирован."
 ITA_limited_priv_railway: "Ограниченная приватизация ж/д"
 ITA_limited_priv_railway_desc: "У приватизации есть свои пределы, и железные дороги являются слишком важным активом, чтобы просто полностью продавать их. Поэтому она должна быть проведена в ограниченном масштабе."
 ITA_deregulate_the_arms_industry: "Дерегулировать оружейную промышленность"
 ITA_mobilize_troops_and_economy: "Мобилизировать экономику и армию"
 ITA_mobilize_troops_and_economy_desc: "Время пришло, мы слишком долго сидели и наблюдали за ужасами. И экономика, и армия могли бы использовать некоторую «акклиматизацию», чтобы выстоять в этих бурях войны, о которых мы слышали, и выйти победителями. Срочная мобилизация в больших масштабах того и другого — это следующее по важности, над чем должны работать все."
 ITA_work_reform: "Реформы для пролетариата"
 ITA_royal_decree_expropriate_factories: "Королевский указ об экспроприации фабрик"
 GLD_trade: "Аграрный экспорт"
 ITA_industrialization_program: "Программа индустриализации"
 ITA_industrialization_program_desc: "Правительства последнего десятилетия начали масштабную программу индустриализации, в основном сосредоточенную на усилении севера. Хотя результаты пока довольно скромные, при продолжении курса на индустриализацию мы можем увидеть большие успехи."
 ITA_solidify_control_of_somialand: "Укрепить контроль над Сомалилендом"
 ITA_solidify_control_of_somialand_desc: "В настоящее время Итальянское Сомали состоит из нескольких разрозненных поселений и государств-клиентов, которые правят от нашего имени. Колония должна быть централизована до того, как произойдёт очередное восстание."
 ITA_watch_for_labor.tt: "Национальный Дух §Y$ITA_active_labor_unions$§! дает следующие §Yмодификаторы§! в зависимости от нашей §Yстабильности§! на протяжении всей игры:\nЕсли §Yстабильность§! ниже §R60%§!, изменит §Y$ITA_active_labor_unions$§! на: $communism_drift$: §G+0.01§!\nЕсли §Yстабильность§! ниже §R40%§!, изменит §Y$ITA_active_labor_unions$§! на: $communism_drift$: §G+0.02§!\nЕсли §Yстабильность§! ниже §R20%§!, изменит §Y$ITA_active_labor_unions$§! на: $communism_drift$: §G+0.03§!"
 ITA_widespread_malaria: "Широкораспространенная Малярия"
 ITA_royal_ties: "Королевские Узы"
 ITA_christian_trade_unions: "Католические профсоюзы"
 ITA_christian_trade_unions_desc: "Хотя католическое социальное учение выступает против социализма, оно поддерживает профсоюзы. Поддержка этих профсоюзов поможет отвлечь рабочих от более радикальных групп и заручиться поддержкой католиков."
 ITA_lancia_car_manu: "Поддержать производителя автомобилей Лянча"
 ITA_muslim_boycott: "Бойкот Мусульман"
 ITA_great_war: "Италия в Великой Войне"
 ITA_food_quotas: "Квоты на производство продовольствия для армии"
 ITA_prioritize_food_for_army: "Кампания против расточительства"
 ITA_reduce_soldier_food: "Уменьшить ежедневные калории для рациона солдат"
 ITA_liberal_italy_marches_on: "Либеральная Италия марширует дальше"
 ITA_liberal_italy_marches_on_desc: "Италия в настоящее время является в Европе маяком либерализма с растущей экономикой благодаря нашим усилиям. Мы должны продолжать этот либеральный путь, проводя новые реформы, чтобы сделать Италию истинной экономической державой, способной конкурировать с другими экономическими гигантами."
 ITA_shorter_work_week: "Лейбористская партия"
 ITA_shorter_work_week_desc: "Наша партия представляла простых людей, принимая широкий спектр социальных и экономических реформ, которые им очень помогли. Наша партия должна продолжать оставаться партией народа и принимать важные законы."
 ITA_conversion_of_mils: "Конверсия военной промышленности"
 ITA_proletariat_in_control: "Италия для пролетариата"
 ITA_proletariat_in_control_desc: "После того как мы провели все наши социалистические реформы, Италия стала одной из самых прогрессивных стран Европы. Рабочих больше не будут беспокоить ужасные условия на их фабриках, и они смогут иметь право голоса в вопросах рабочей среды."
