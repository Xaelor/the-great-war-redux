 ITA_true_seperation_of_church_and_state: "Подорвать могущество церкви"
 ITA_true_seperation_of_church_and_state_desc: "Religion is a way to distract the lower classes from the real battle: the class struggle. It's made by the bourgeois to expand their control over the working class. Christianity is the most popular religion in Italy and we must eliminate it by reducing their power."
 ITA_press_writes_pro_centrist_articles1: "Press is Writing Scathing Articles"
 ITA_fight_for_masculinity: "Восстановление мужественности"
 ITA_fight_for_masculinity_desc: "Strength, vigor, determination, nationalism and vitality- Those shall be the values of the new Italian man, the man who will finally allow Italy to grasp the glory she deserves and that has been denied by the tide of history."
