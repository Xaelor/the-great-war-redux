 ITA_great_war_desc: "С нашим вступлением в Великую войну на кону оказалась сама судьба Италии. То, возвысимся мы или падём, будет решаться тем, как мы и наши союзники проявим себя в этой войне.\n--------------------------------------------------------------------------------------------------------------------\nНаш текущий £victory_points §Cвоенный счёт§! равен [ITA_war_score_color]\n§L£victory_points Военный счет отражает, насколько успешно мы действуем в войне на текущий момент. Высокие показатели гарантируют, что все обещания, данные нам союзниками, будут исполнены. Низкие же могут означать, что после победы нашей стороны разногласия между нами и нашими союзниками приведут к тому, что лидер нашего альянса поддержит другие страны, и в итоге мы не получим все обещанные территории. Кроме того, слабые результаты могут привести к тому, что Король, армия и народ потеряют доверие к способности нынешнего правительства вести войну, что выльется в §!§Rколлапс правительства§! §Lили даже §!§Rгражданскую войну§!§L.§!\n--------------------------------------------------------------------------------------------------------------------\n£victory_points §CВоенный счёт§! может быть §Gувеличен§! с помощью\n§L-Нанесения потерь врагам.§!\n§L - Успешных морских и воздушных операций§!\n§L - Контроля вражеских победных очков§!\n§g--------------------------------------------------------------------------------------------------------------------§!\n£victory_points §CВоенный счёт§! может быть §Rуменьшен§! с помощью\n§L - Высоких потерь от вражеских стран.§!\n§L - Успешных операций врагов против нас.§!\n§L - Потери наших победных очков.§!\n--------------------------------------------------------------------------------------------------------------------Сейчас наш £ETH_imperial_treasury §9Финансовый бюджет§! равен §Y[ITA_budget_color]§!\n§LВеликая война тяжело бьёт по финансам Италии. Финансирование войны — дело дорогое, и нам определённо придётся принять особые меры, если мы не хотим сорваться в финансовую пропасть.§!\nПадение бюджета ниже §R-5§! может привести к §Rкатастрофическим§! последствиям!\n--------------------------------------------------------------------------------------------------------------------Сейчас наши £consumer_goods_texticon §8Запасы продовольствия§! равны§Y[ITA_bread_shortage_color]§!\n§LМы не создали крупных продовольственных запасов, а неурожаи на юге за последние 2 года оставили нас уязвимыми перед лицом нехватки продовольствия. Учитывая резко возросшие потребности в снабжении нашей армии, если эта война не завершится к Рождеству, как было обещано, то мы столкнёмся с серьёзными проблемами.§!\nОтрицательное значение запасов продовольсвия вызовет негативные эффекты для нашей стабильности, поддержки войны и производства товаров народного потребления. Если запасы продовольствия опустятся достаточно низко, мы также ощутим последствия для боеспособности нашей армии.\n--------------------------------------------------------------------------------------------------------------------Сейчас наше £boost_popularity_texticon §SОтношение с рабочими§! равно §Y[ITA_strikes_color]§!\n§LНаселение далеко не едино в поддержке войны. Большинство социалистов, особенно на севере, активно организуют забастовки, пытаясь подорвать нашу способность вести войну.§!\n— Отношения с рабочим движением будут ухудшаться со временем, если уровень поддержки войны опустится ниже 50%.\n— Низкий уровень отношений с рабочим движением значительно замедлит производство военного снаряжения, поскольку забастовки участятся. Мы можем помочь снизить количество забастовок, либо подавляя социалистов, либо пытаясь заручиться поддержкой профсоюзов, либо делая и то, и другое одновременно."
 ITA_war_prep: "Подготовка к войне"
 ITA_war_prep_desc: "наша страна далека от того, чтобы быть готовой к великому Европейскому конфликту. Нам нужно делать запасы денег, продовольствия, исправлять внутренние проблемы перед тем, как мы вступим в войну.\n\nСейчас наш £ETH_imperial_treasury §9финансовый бюджет§! равен §Y[ITA_budget_color]§!\n§LВеликая война тяжело бьёт по финансам Италии. Финансирование войны — дело дорогое, и нам определённо придётся принять особые меры, если мы не хотим сорваться в финансовую пропасть.§!\n--------------------------------------------------------------------------------------------------------------------Сейчас наши £consumer_goods_texticon §8запасы продовольствия§! равны §Y[ITA_bread_shortage_color]§!\n§LМы не создали крупных продовольственных запасов, а неурожаи на юге за последние 2 года оставили нас уязвимыми перед лицом нехватки продовольствия. Учитывая резко возросшие потребности в снабжении нашей армии, если эта война не завершится к Рождеству, как было обещано, то мы столкнёмся с серьёзными проблемами.§!\nОтрицательное значение запасов продовольсвия вызовет негативные эффекты для нашей стабильности, поддержки войны и производства товаров народного потребления. Если запасы продовольствия опустятся достаточно низко, мы также ощутим последствия для боеспособности нашей армии.\n--------------------------------------------------------------------------------------------------------------------Сейчас наше £boost_popularity_texticon §SОтношение с рабочими§! равно §Y[ITA_strikes_color]§!\n§LНаселение далеко не едино в поддержке войны. Большинство социалистов, особенно на севере, активно организуют забастовки, пытаясь подорвать нашу способность вести войну.§!\n- Отношения с рабочим движением будут ухудшаться со временем, если уровень поддержки войны опустится ниже 50%.\n- Низкий уровень отношений с рабочим движением значительно замедлит производство военного снаряжения, поскольку забастовки участятся. Мы можем помочь снизить количество забастовок, либо подавляя социалистов, либо пытаясь заручиться поддержкой профсоюзов, либо делая и то, и другое одновременно."
 ITA_easy_mode_war: "§LЕсли ты бессовестный и просто читак, введи 'set_var  ITA_war_strikes_var, ITA_bread_shortages, или ITA_war_budget = 100' в консоль, что может сильно помочь.§!"
 ITA_useless_flavor_l: "Мы будем приглашены на мирную конференцию, если османы сдадутся Балканскому пакту. Мы будем гарантировать, что государство §Y[SER.GetNameWithFlag]§! не получит адриатическое побережье на конференции."
 ITA_outdated_fleet: "[ITA_outdated_fleet]"
 ITA_outdated_fleet_desc: "Regia Marina (Королевский флот), основанный в 1861 году одновременно с образованием государства Италия, постепенно отстаёт по мере того, как великие морские державы, такие как Британия, Франция и Германия, продолжают разрабатывать и внедрять новые технологии. Флот понёс серьёзные потери в ходе Семинедельной войны против австрийцев, но медленно восстанавливается и возвращается к прежней силе."
