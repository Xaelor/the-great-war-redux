 ITA_fall_of_misrata: "Падение Мисраты"
 ITA_fall_of_sokna: "Падение Сокны"
 ITA_fall_of_ecdebiye: "Падение города Эджебие"
 ITA_war_powers: "Чрезвычайные военные полномочия"
 ITA_arise_workers_of_italy: "Вставайте, рабочие Италии!"
 ITA_arise_workers_of_italy_desc: "The time for parliamentary games is over. The monarchy and the liberals have failed the working class, leaving a system rotten to its core. We must cast aside our illusions and take up arms. Only through revolution can we shatter our chains and build a new state for the proletariat. The future of Italy is in our hands!"
 ITA_the_moral_highground: "The Moral Highground"
 ITA_the_moral_highground_desc: "Our struggle is not for power, but for justice. We fight for the common people against a decadent monarchy and a corrupt system. By clearly demonstrating the righteousness of our cause, we will win the hearts of the people and prove to the world that we hold the moral highground in this civil war."
 ITA_a_red_future: "Красное будущее"
 ITA_a_red_future_desc: "The forces of reaction have been crushed, and the red flag flies victorious over Italy. The civil war is won, but the revolution has only just begun. We stand at the dawn of a new era and must now chart the course for our socialist republic, forging a future free from the exploitation of the old regime and building a state truly for the workers."
 ITA_end_devolution: "End Devolution"
 ITA_above_50_warning: "Достижение более §Y50.00%§! поддержки социалистов на более чем §Y60 дней§! приведёт к §Rгражданской войне§!"
 ITA_crush_the_maximalists: "Finish off the Maximalists"
 ITA_crush_the_maximalists_desc: "With our domination over the PSI it's time for us to kick out the Maximalist faction of the party, who are opposed to democracy and are increasingly radical. They are a stain on our party and we must eliminate them and their radical agitation."
