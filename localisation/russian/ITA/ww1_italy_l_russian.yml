 ITA_we_want_a_war: "Барабаны войны гремят всё громче. §qНационалисты§! требуют начать войну с £ww1_game_rule_flag_TUR. §Y[TUR.GetForeignName]§!. В разделе решений будет появляться задание каждые §Y30 дней§!, пока мы не предъявим §Cультиматум§! Османской империи.\nКак только мы предъявим ультиматум Османской империи, все §Rнегативные§! §Y$MODIFIER_POLITICAL_POWER_FACTOR$§! эффекты на §Y$ITA_social_unrest$§!, вызванные этим событием, будут §Gсняты§!."
