 ITA_revive_trade: "Revive Foreign Trade"
 ITA_bul_rev: "Completing the focus §YAssist Revolutionary Proletariat World Wide§! will allow us to spark a §Ccivil war§! in [BUL.GetFlag] §YBulgaria.§! This decision will disappear if Bulgaria stabilizes their domestic situation. "
