 ITA_ally_the_catholic_electoral_union: "Изолировать экстремистские партии"
 ITA_ally_the_catholic_electoral_union_desc: "With our efforts to sway catholics into supporting us going very well, we should work towards integrating them into a political block. Their large numbers combined with our traditional center left voting base would be able to completely block the PSI as well as natinoalist radicals from getting many seats in parliament."
 ITA_libya_lose: "§rПоражение§! в ливийской войне"
 ITA_fund_catholic_schools: "Финансировать католические школы"
 ITA_fund_catholic_schools_desc: "The Catholic Church is the largest provider of education in the country and funding them would help repair relations with the Papacy."
 ITA_giolitti_programme: "Программа Джолитти"
 ITA_giolitti_programme_desc: "The PSI is here to stay, whether we like it or not. We must extend an arm to them and see if we can encourage the development of their more moderate wings by stopping our previous attempts to isolate them. If we can de-radicalize the PSI, similar to what we did with the Radicals, it would stabilize the political situation greatly."
 ITA_parliamentry_dictator: "Джентльменская игра"
 ITA_parliamentry_dictator_desc: "Politics at it's core should be removed of its more emotional aspects. Fighting for ideals is very important, yes, but the ends should generally justify the means. We must allow ourself flexibility in our actions, and try our best to smooth over relations with all sides of the political isle."
