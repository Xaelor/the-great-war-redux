 ITA_government_support_of_union: "Господдержка профсоюзов"
 ITA_government_support_of_union_desc: "Unions across Italy have been cracked down on by previous governments to stop their activity. This is of course not the right course, and we should change our policy to instead actively support unions and their activies as they lead to better working conditions and workers' rights."
 ITA_persecute_union_busting: "Преследовать за разорение профсоюзов"
 ITA_taking_care_of_our_workers: "Забота о наших рабочих"
 ITA_taking_care_of_our_workers_desc: "For too long the Italian proletariat was exploited by greedy capitalists, but that shall stop now. We shall introduce several new measures to ensure our workers can enjoy the best working conditions possible."
 ITA_reduce_working_week_dec: "Сократить рабочую неделю"
 ITA_mass_nationalization: "Массовая национализация"
 ITA_mass_nationalization_desc: "We cannot trust companies in important sectors to make decisions in the interest of the nation or workers, as they only seek to enrich themselves. If we take over those companies, we can prioritize the needs of the nation and workers first."
