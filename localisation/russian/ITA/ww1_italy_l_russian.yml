 ITA_second_anti_dissent_laws: "Второй раунд принятия законов против инакомыслия"
 ITA_concentrate_research_efforts: "Сосредоточить усилия на исследованиях"
 ITA_will_unlock_furher: "Разблокирует дальнейшие требования..."
 ITA_entente_ties: "Экономические связи с Антантой"
 ITA_london_unlock: "Завершены переговоры по поводу договора с Антантой"
 ITA_british_pov_thing: "(§Y[ITA.GetNameWithFlag]§!):"
 ITA_entente_has_so_far: "[ENG.GetFlag][FRA.GetFlag]§YАнтанта§! в данный момент предложила нам:"
 ITA_unlock_treaty_london: "Разблокирует национальный фокус '§YПодписать договор с Антантой§!'"
 ITA_trasformismo_focus: "Трансформизмо"
 ITA_trasformismo_focus_desc: "Трасформизм - это величайший и самый печально известный инструмент Джолитти. Он означает процесс крайней политической гибкости, союз с кем угодно — от радикальных социалистов до убеждённых католических консерваторов, - когда это политически выгодно. Коалиция Джолитти редко бывает стабильной в любое время, и хотя некоторые называют это оппортунизмом, Джолитти предпочитает называть это политической зрелостью."
 ITA_increase_taxes_focus: "Увеличить налоги"
 ITA_increase_taxes_focus_desc: "Наше правительство проводит несколько новых реформ, но наш бюджет далеко не безграничен. Это не будет популярно среди населения, но мы должны ввести более высокие налоги, чтобы финансировать текущие и будущие реформы."
 ITA_universal_suffrage: "Предложить всеобщее избирательное право"
 ITA_universal_suffrage_desc: "Прогрессивная коалиция должна быть в состоянии провести через парламент закон о всеобщем избирательном праве, если нам удастся успешно договориться с левоцентристами. Его принятие стало бы огромным достижением, мы должны добиваться этого."
 ITA_male_suffrage: "Предложить полное избирательное право для мужчин"
 ITA_male_suffrage_desc: "Парламент Италии должен быть более чем готов принять закон, дающий избирательные права большинству мужчин в Италии. Это был бы большой успех, который придал бы Луццатти вид успешного политика. Давайте начнём пытаться провести его."
 ITA_settle_libya: "Поощрить иммиграцию итальянцев в Ливию"
 ITA_settle_libya_desc: "Нам нужно расширить культурное присутствие в Ливии, отправляя туда итальянских иммигрантов и инвесторов."
 ITA_adopt_left_wing_social_stances: "Принять левые социальные позиции"
 ITA_adopt_left_wing_social_stances_desc: "Социалистическая и радикальная партии, составляющие значительную часть итальянского парламента и находящиеся на одном из своих пиков, показывают, что итальянцы хотят прогресса. Мы должны постепенно отказаться от некоторых наших более социально-консервативных позиций и принять прогрессивное отношение, чтобы переманить их сторонников."
 ITA_new_liberalism: "Сострадательный либерализм"
 ITA_new_liberalism_desc: "Либерализм прошлого часто был тесно связан с тесным сотрудничеством с политическими и экономическими элитами, а также с жестоким подавлением рабочего класса и общим пренебрежением к бедным в нашем обществе. Мы должны принять новый образ мышления британских либералов и стремиться создать твёрдо либеральное государство, которое обеспечивает всех."
 ITA_play_the_nationalists: "Играть в националистов"
 ITA_play_the_nationalists_desc: "Новейший игрок на политической арене появился благодаря мощному всплеску поддержки националистических партий. Джолитти, конечно, считает национализм бессмыслицей, но крайне эмоциональная природа националистического движения означает, что должно быть довольно легко переманить их сторонников в основном пустой риторикой."
 ITA_nationalist_journalist: "Журналист-националист"
 ITA_harass_anti_war_news_papers: "Вредить антивоенным газетам"
 ITA_increase_agricultural_subsidies: "Увеличить субсидии сельскому хозяйству"
 ITA_increase_agricultural_subsidies_desc: "Хотя это, безусловно, недостаточно для решения всех многочисленных проблем юга, введение некоторых субсидий для многих фермеров на юге, несомненно, принесёт пользу и, надеюсь, сократит количество людей, покидающих Италию каждый год из-за сельской бедности."
 ITA_walk_down_south: "Подготовка к походу на юг"
 ITA_walk_down_south_desc: "Османская Триполитания, или Ливия, была объектом наших притязаний в течение нескольких десятилетий. После того как французы украли у нас Тунис, а британцы отказались дать нам справедливую долю в Восточной Африке, Ливия всегда представлялась нам самым очевидным местом для расширения нашей колониальной империи. Тысячи итальянцев уже живут там, а ливийские туземцы отчаянно ждут своего освобождения."
 ITA_nationalized_insurance: "Национальный институт страхования"
 ITA_nationalized_insurance_desc: "Централизация страховых услуг под государственным контролем упорядочила наш промышленный сектор, одновременно снизив экономическое бремя для потребителей. Эта реформа повысила эффективность заводов и позволила направить больше ресурсов на военное производство, создав более прочную промышленную базу для нашей нации."
 ITA_municipal_socialism: "Поддержать муниципальный социализм"
 ITA_municipal_socialism_desc: "Хотя внедрение социалистической политики в национальном масштабе в данный момент затруднительно, это можно сделать в отдельном городе. Баллотируясь на места в местных органах власти, мы можем проводить социалистическую политику в меньшем масштабе, принося пользу бедным и помогая опровергнуть критиков."
 ITA_giolitti_maternity_fund: "Материнский фонд Джолитти"
 ITA_giolitti_maternity_fund_desc: "Будут выделены средства на фонд материнства, чтобы помочь женщинам с новорождёнными детьми и привлечь прогрессивных избирателей."
 ITA_player_of_the_game: "Политический оппортунизм"
 ITA_player_of_the_game_desc: "Работа как с радикальными социалистами, так и с консервативными католиками не должна быть противоречием, поскольку политика в своей основе - это просто игра по созданию коалиций и уступок другим партиям, когда это необходимо. Всё так просто. Мы не должны бояться прибегать к этим практикам, когда это необходимо."
 ITA_full_male_suffrage: "Полное избирательное право мужчин"
 ITA_full_male_suffrage_desc: "После того как Луццатти не удалось провести законы о предоставлении избирательных прав, пришло время более популярному и компетентному политику попробовать свои силы."
 ITA_foundations_for_an_industrial_powerhouse: "Основы мощной промышленности"
 ITA_foundations_for_an_industrial_powerhouse_desc: "Прежде чем строить заводы, мы должны построить дороги и линии электропередач, которые обеспечат транспортировку товаров, необходимых в индустриальной экономике. Поэтому, хотя завтра мы будем строить большие красивые заводы, сегодня мы должны сосредоточиться на строительстве простых дорог."
 ITA_a_rising_tide_lifts_all_boats: "Прилив поднимает все лодки"
 ITA_a_rising_tide_lifts_all_boats_desc: "Южная Италия долгое время была экономически и политически заброшена, и пришло время это изменить. Развитие и инвестиции в эту богатую и почти нетронутую землю могут принести огромные доходы и принести чистую пользу всей нашей нации."
 ITA_the_heart_and_soul_of_italy: "Сердце и душа Италии"
 ITA_the_heart_and_soul_of_italy_desc: "Север Италии всегда был основной и плодородной зоной полуострова: самой успешной в производственном отношении и экономически доминирующей стороной. Продолжение развития Северной Италии в таких местах, как Пьемонт или Венето, будет полезно для всей Италии в целом."
 ITA_textile_industries: "Поддержать текстильную промышленность"
 ITA_textile_industries_desc: "Текстильная промышленность производит одежду и другие товары для дома, необходимые в итальянском быту. Инвестиции и развитие текстильных предприятий помогут улучшить жизнь многих итальянцев, причём не в одном, а в нескольких аспектах."
 ITA_pdm_steel: "Сталелитейная промышленность Пьемонта"
 ITA_pdm_steel_desc: "Пьемонт сам по себе является шахтой с тем количеством неиспользуемого железа, которое там присутствует. Мы должны использовать его для получения ресурсов и создания рабочих мест."
 ITA_utilize_southern_agriculture: "Использовать сельское хозяйство Юга"
 ITA_utilize_southern_agriculture_desc: "Юг, хотя и не так индустриализирован, как Север, изобилует сельскохозяйственными угодьями, такими как фермы и виноградники. Используя сельскохозяйственную продукцию Юга, мы можем развивать промышленность Севера для переработки этих южных товаров."
 ITA_land_reclamation: "Мелиорация южных земель"
 ITA_land_reclamation_desc: "Юг полон болот и лесистых земель, которые можно легко освоить для человеческого использования с помощью простых проектов. Мы должны использовать этот потенциал, начав устранять эти препятствия на пути нашего экономического прогресса."
 ITA_emilia_electricity_industries: "Электроэнергетическая промышленность Эмилии"
 ITA_emilia_electricity_industries_desc: "Многие города вблизи Альп являются жизненно важными стратегическими точками для производства электроэнергии с помощью гидроэлектростанций. Нам необходимо финансировать строительство большего количества таких плотин, чтобы обеспечить непрерывную подачу электроэнергии для государственных учреждений и наших граждан."
 ITA_centralized_economic_model: "Сверху вниз"
 ITA_centralized_economic_model_desc: "Хотя мы не собираемся пытаться создать государственную экономическую систему, наше правительство определённо должно делать больше в экономике. По мере того как мы инвестируем в нашу экономику, результаты наших проектов создадут больше рабочих мест, больше промышленности и больше богатства. С этого момента должен начаться положительный обратный эффект, инициированный сверху."
 ITA_industrialization_program_f: "Централизованная экономическая модель"
 ITA_industrialization_program_f_desc: "С помощью мощного государственного регулирования и финансовой помощи наш промышленный прогресс может взлететь до небес. Мы должны продолжать делать целевые инвестиции в промышленные проекты, где это возможно."
 ITA_lancia_car_manufacturing: "Поддержать Лянча"
 ITA_lancia_car_manufacturing_desc: "Автомобили - это следующая большая вещь. Мы должны попытаться стать ведущим экспортёром в этой новой отрасли, поддерживая крупных производителей автомобилей. Lancia было бы хорошим началом."
 ITA_fight_malaria: "Борьба с малярией"
 ITA_fight_malaria_desc: "Малярия опустошает юг и его население, причиняя значительный вред. Нам нужна война с малярией, чтобы искоренить болезнь с помощью новых больниц и методов предотвращения её распространения."
 ITA_help_messina_earthquake_recovery: "Поддержать восстановление страны от мессинского землятрясения"
 ITA_help_messina_earthquake_recovery_desc: "Землетрясение в Мессине 1908 года ужаснуло многих на Юге. Землетрясение магнитудой 7,1 унесло жизни более 75 000 человек и нанесло ущерб на миллионы. Поддержка его восстановления принесёт пользу людям и стабилизирует их всё ещё шаткую жизнь."
 ITA_containing_the_labor_movement: "Сдержать рабочее движение"
 ITA_containing_the_labor_movement_desc: "По мере роста нашей промышленной продукции на севере растёт и сила организованного труда. Хотя профсоюзы могут иметь своё место, многие из них откровенно саботируют наш прогресс ради детских целей. Мы должны стараться предотвращать формирование разрушительных профсоюзов, когда это возможно."
 ITA_prop_up_banks: "Инвестиции в банки"
 ITA_prop_up_banks_desc: "Нам нужно огромное увеличение кредитования в экономике, чтобы развиваться с той скоростью, которую мы наметили. Давайте напрямую поможем нашим банкам, чтобы они могли свободно выдавать огромные суммы денег экономическим инвесторам, не беспокоясь о крахе, если один или два крупных проекта пойдут не так."
 ITA_increase_state_control_of_eco: "Увеличить контроль государства над экономикой"
 ITA_increase_state_control_of_eco_desc: "Частный сектор несовершенен, и иногда они ставят свою краткосрочную прибыль выше долгосрочного блага страны. Увеличивая государственный контроль над экономикой, мы можем обеспечить более гладкое проведение экономических проектов при полной поддержке правительства."
 ITA_hydro_electricity_schemes: "Гидроэлектрические проекты"
 ITA_hydro_electricity_schemes_desc: "Создание большего количества энергии, рабочих мест и богатства одновременно — это абсолютно очевидное решение. У нас есть большие водоёмы по всей стране, где государственные гидроэлектрические проекты могли бы процветать. Давайте организуем что-нибудь."
 ITA_encourage_catholic_participation_in_politics: "Поощрить участие католиков в политике"
 ITA_encourage_catholic_participation_in_politics_desc: "Католикам де-юре не разрешается участвовать в выборах в Италии согласно папским прокламациям, за исключением случаев, когда католическое голосование могло бы остановить социалистических кандидатов. Хотя де-факто эта прокламация почти не соблюдается, она всё равно привела к тому, что значительная часть католического населения отказывается участвовать в итальянских выборах. Хотя раньше они были на крайне правом фланге, рост националистических движений, а также радикализация социалистов привели к тому, что они выглядят всё более привлекательными друзьями. Мы должны попытаться интегрировать их в политическую жизнь любыми возможными способами."
 ITA_promote_higher_educations: "Продвигать высшее образование"
 ITA_promote_higher_educations_desc: "Недавнее расширение избирательного корпуса означает, что образование населения Италии сейчас важнее, чем когда-либо. Необразованное население — это население, которое будет принимать иррациональные решения и избирать иррациональных политиков. Поэтому мы должны как можно больше продвигать среднее и высшее образование среди нашего населения."
 ITA_loans_to_the_south: "Кредиты югу"
 ITA_loans_to_the_south_desc: "Щедрые кредиты для местных органов власти на юге могли бы помочь югу догнать север. Давайте поработаем над утверждением некоторых щедрых кредитных программ для них."
 ITA_lipservice_to_unions: "Рабочие лучше работодателей"
 ITA_lipservice_to_unions_desc: "Нет лучшего способа завоевать поддержку социалистов и гарантировать, что они останутся умеренной и разумной оппозицией, чем дать им некоторые уступки. Конечно, это разозлит некоторых на правом фланге, но сохранение социалистов, готовых вести с нами переговоры, будет лучше для нашего правительства в долгосрочной перспективе."
 ITA_non_intervention_in_strikes: "Невмешательство в забастовки"
 ITA_non_intervention_in_strikes_desc: "Отправка войск для подавления забастовок рабочих подтолкнёт людей к крайне левым, а вставание на их сторону заставит избирателей думать, что мы мягко относимся к социализму. Нейтральная позиция является наиболее практичным решением."
 ITA_begin_army_reforms: "[ITA_army_name_thing]"
 ITA_reassure_northern_business: "Сокрушить профсоюзы на юге"
 ITA_reassure_northern_business_desc: "Хотя было бы политически невозможно разрушить сильную профсоюзную организацию на севере, мы можем не допустить, чтобы социалисты получили такую же опору на юге. Мы должны тихо работать за кулисами, чтобы подавлять усилия по созданию профсоюзов в сельских и городских районах юга, используя любые возможные средства."
 ITA_mantaining_the_liberal_order: "Просто выждать время"
 ITA_mantaining_the_liberal_order_desc: "Наше сотрудничество с ИСП, очевидно, является временным соглашением. Хотя с некоторыми их членами можно договориться, многие из них, откровенно говоря, безумны. Наше сотрудничество с ними должно быть направлено только на принятие законодательства, решающего некоторые коренные проблемы, вызывающие рост социализма, в то время как мы в то же время работаем за кулисами, чтобы окончательно уничтожить это движение."
 ITA_invite_socialists_to_the_government: "Искать сотрудничества с PSI"
 ITA_invite_socialists_to_the_government_desc: "Поскольку социалистическое движение только набирает силу, для нас важно установить более позитивные отношения с их партией. Некоторые консерваторы называют их экстремистами, желающими свергнуть монархию, и хотя некоторые из них придерживаются этого мнения, многих из них можно переубедить с помощью реформистского экономического и социального законодательства. Давайте сотрудничать с ИСП в достижении этих целей."
 ITA_conscription_reform: "Внедрить реформу Спингарди"
 ITA_conscription_reform_desc: "Боевой дух итальянцев в отношении войны находится на низком уровне после нашей неудачи в завоевании Эфиопии в 1896 году, а использование армии для полицейских обязанностей кажется неприятным и неблагоприятным для нового итальянского поколения. Мы можем помочь поднять моральный дух, сократив обязательный срок службы на год, с трёх до двух. Это изменение сократит количество солдат, находящихся на обучении, но сделает вступление в армию менее скучной и тягостной обязанностью."
 ITA_improve_railway_networks: "Улучшить ж/д сеть"
 ITA_improve_railway_networks_desc: "Снабжение является большой проблемой в горных районах Альп, где расположена потенциальная вражеская территория. Строительство железных дорог облегчит транспортировку товаров к солдатам и позволит быстро перебрасывать командование или войска поездами."
 ITA_expand_reggimento_alpini: "Расширить Reggimento Alpini"
 ITA_expand_reggimento_alpini_desc: "Реггименто Альпини - итальянские специализированные горнострелковые войска, обученные для ведения боевых действий в Альпах, созданные в 1872 году. Расширение этих сил имеет решающее значение для ведения любой войны в Альпийских горах на нашей северной границе."
 ITA_prepare_for_a_war_in_the_mountains: "Подготовка к войне в горах"
 ITA_prepare_for_a_war_in_the_mountains_desc: "Наши границы на севере полностью покрыты Альпийскими горами, и если мы вступим в войну в Европе, это, несомненно, будет основным местом наших боевых действий. Мы должны подготовить нашу армию к горным условиям, с которыми она столкнётся в этом регионе."
 ITA_finish_the_tagliamento_line: "Завершить линию Тальяменто"
 ITA_finish_the_tagliamento_line_desc: "Если бы австрийцы напали на нас, нашей первой естественной линией обороны была бы река Тальяменто. В последнее время на реке были построены некоторые укрепления, но они недостаточны для полноценной обороны и должны быть расширены, если мы хотим организовать надлежащую оборону."
 ITA_build_forts_on_the_french_border: "Укрепить французскую границу"
 ITA_build_forts_on_the_french_border_desc: "Французы, безусловно, представляют для нас гораздо более опасную угрозу, чем австрийцы, так как мы и австрийцы вместе состоим в Тройственном союзе. Вместо того чтобы строить бесполезные оборонительные линии против Австрии, мы должны сосредоточить наши усилия по укреплению против Франции."
 ITA_adopt_the_maxim_gun: "Развивать легкие пулеметы Максима"
 ITA_adopt_the_maxim_gun_desc: "Наши винтовки в настоящее время имеют технологию, отстающую от наших соседей на десятилетия. Нам нужно инвестировать в собственные пулемёты, если мы хотим догнать остальной мир."
 ITA_establish_the_automobile_service: "Учредить автомобильную службу"
 ITA_establish_the_automobile_service_desc: "Автомобили - это блестящее изобретение, способное быстро доставлять ресурсы из одного места в другое на относительно большие расстояния. Нам следует учредить в нашей армии новую службу, состоящую из автомобилей, для транспортировки припасов нашим войскам."
 ITA_rain_hellfire: "Обрушить адский огонь на врага"
 ITA_prioritize_the_defense_of_italy: "Приоритет обороны Италии"
 ITA_prioritize_the_defense_of_italy_desc: "Участие в крупных наступательных операциях приведёт к большим потерям и резкому падению боевого духа. Война на истощение — наш лучший шанс против численно превосходящего противника."
 ITA_rain_hellfire_desc: "Массированная артиллерия доказала свою эффективность. Численное превосходство будет бесполезно перед лицом наших орудий."
 ITA_harass_austrian_shipping: "Нарушить судоходство Австрии"
 ITA_aus_harass_ship: "Нарушение судоходства"
 ITA_mobile_command_centres: "Мобильные командные центры"
 ITA_mobile_command_centres_desc: "В настоящее время наши командные пункты стационарные и не могут быстро перемещаться в случае изменений на линии фронта. Мы должны решить эту проблему, сделав наши командные пункты мобильными с помощью моторизованных транспортных средств, таких как грузовики."
 ITA_utilize_heavy_artillery: "Использовать более тяжелую артиллерию"
 ITA_utilize_heavy_artillery_desc: "Будет полезно использовать более тяжелые и совершенные артиллерийские орудия, поскольку они будут эффективнее своих более легких аналогов."
 AUS_blockade_italy: "$great_power_politics_great_war_tt_icon$ Нарушенить итальянское судоходство"
 ITA_against_alps: "Марш через Альпы"
 ITA_camillo_finocchiaro_aprile: "Камилло Финоккьяро Априле"
 ITA_ministry_of_italian_africa_tgwr: "Основать министерство колоний"
 ITA_ministry_of_italian_africa_tgwr_desc: "Министерство колоний заменит Центральное управление по делам колоний в управлении итальянскими колониальными владениями и управлении их экономикой."
 ITA_sway_northern_workers: "Повлиять на северных рабочих"
 ITA_sway_northern_workers_desc: "Наши высокие пошлины были чрезвычайно популярны среди профсоюзов на севере, которые видят в них защиту местного производства. Таким образом, мы можем использовать эти пошлины для завоевания поддержки профсоюзов и их членов."
 ITA_workers_accident_insurance: "Страхование рабочих от несчастных случаев"
 ITA_workers_accident_insurance_desc: "Обязательное страхование от несчастных случаев необходимо для обеспечения безопасности, долголетия и полезности заводского рабочего. Эта страховка будет оплачиваться работодателем."
 ITA_bring_radicals_into_government: "Привести радикальную партию в правительство"
 ITA_bring_radicals_into_government_desc: "Радикальная партия, хотя ранее считалась крайне левой и иррациональной, за последние несколько десятилетий значительно умеренно. Поэтому мы должны обратиться к их лидерам и посмотреть, нельзя ли сформировать коалицию между радикальной партией и фракцией Джолитти. Это принесло бы нам столь необходимую поддержку слева и имело бы дополнительный бонус в виде поощрения дальнейшей умеренности среди радикалов."
 ITA_loan_to_northern_businesses: "Субсидии Конфиндустрии"
 ITA_loan_to_northern_businesses_desc: "Конфиндустрия - это промышленная группа на севере, состоящая из наших самых процветающих предприятий. Они процветают не просто так, и с большим капиталом они могли бы развиваться ещё быстрее. Инвестиции в них - это беспроигрышный вариант."
 ITA_fall_of_the_great: "Провал трансформизмо"
 ITA_fall_of_the_great_desc: "Политическая система трансформизма, основанная на создании гибких центристских коалиций, выродилась в источник циничного покровительства и парламентского паралича. Сделки, заключаемые ради личной выгоды, а не национального блага, оставляют глубокие разделения Италии без решения. Эта застойная атмосфера способствует коррупции и широко распространённому разочарованию, позволяя новым радикальным идеологиям набирать силу."
 ITA_radicals_in_power: "Шанс для радикалов"
 ITA_radicals_in_power_desc: "Итальянская радикальная партия всегда была одной из главных политических сил, представляющих левый прогрессивизм в Италии. Благодаря формированию левого союза и поддержке Джолитти мы можем сформировать новое правительство, сосредоточенное на улучшении гражданских прав и социальной справедливости."
 ITA_separation_of_church_and_state: "Полное разделение церкви и государства"
 ITA_separation_of_church_and_state_desc: "Католическая церковь имеет большое влияние во многих аспектах нашей жизни, включая государственные институты и политику. Это должно измениться: мы должны двигаться к полному отделению церкви от государства и устранить политическое влияние церкви."
 ITA_public_works_program: "Программа общественных работ"
 ITA_public_works_program_desc: "Инфраструктура в Италии в настоящее время оставляет желать лучшего, и многие люди нуждаются в работе. Мы можем решить обе эти проблемы, создав программу общественных работ, нанимая людей для строительства необходимой инфраструктуры по всей стране."
 ITA_improve_northern_urban_infrastructure: "Улучшить северную городскую инфраструктуру"
 ITA_improve_southern_rural_infrastructure: "Улучшить южную городскую инфраструктуру"
 ITA_workers_pensions: "Пенсии для рабочих"
 ITA_workers_pensions_desc: "В настоящее время рабочие получают недостаточные пенсии: только государственные служащие и некоторые рабочие имеют возможность получать добровольные частные пенсии. Чтобы лучше поддерживать наших рабочих, мы должны начать выдавать государственные пенсии для вышедших на пенсию рабочих."
 ITA_progressive_taxationm: "Прогрессивный налоговый кодекс"
 ITA_progressive_taxationm_desc: "Налоговая система в Италии в настоящее время несправедлива: самые высокооплачиваемые платят гораздо меньший процент своего дохода в виде налогов, чем самые низкооплачиваемые, которые отдают большую часть своего дохода на налоги. Эта система несправедлива, и необходимо внести изменения, чтобы богатые платили больше, а бедные — меньше."
 ITA_public_education: "Государственное Образование"
 ITA_public_education_desc: "Образование в Италии является обязательным, однако многим государственным школам не хватает средств для качественного обучения в их регионе, особенно на юге. Финансирование образования должно быть расширено, и система образования также должна быть расширена."
 ITA_state_housing_plan: "Государственный жилищный план"
 ITA_state_housing_plan_desc: "По всей Италии жильё находится в плохом состоянии. Многие дома не соответствуют современным стандартам, в них отсутствуют современные строительные материалы и удобства, особенно на юге, где множество домов самых бедных построены просто из камня. Это необходимо изменить, и должен быть разработан план по строительству новых домов в регионах, которые в них нуждаются, и модернизации старых."
 ITA_judicial_independence: "Независимость судебной власти"
 ITA_judicial_independence_desc: "В настоящее время судьи по всей Италии назначаются самим королём и могут быть им уволены в любое время. Это не является справедливой и независимой системой, и её реформа имеет решающее значение для создания надлежащей судебной системы."
 ITA_shorter_working_hours: "Сократить рабочее время"
 ITA_christian_democracy2: "Христианская демократия"
 ITA_christian_democracy2_desc: "Пытаясь отвечать на социальные вопросы с сугубо христианской точки зрения, христианская демократия становится новой силой в итальянской политике, стремясь стать третьим путём между либералами и социалистами."
 ITA_popularism: "Популяризм"
 ITA_popularism_desc: "Многие из наших идей уходят корнями в популизм — идею, стремящуюся поддерживать гражданские и политические свободы, равные для всех, без преследования людей по признаку расы, религии или класса, и реформы капиталистической системы. Эти идеи должны направлять наше преобразование Италии и законы, которые мы принимаем."
 ITA_christian_social_reform: "Христианская социальная реформа"
 ITA_christian_social_reform_desc: "Большинство рабочих по всей Италии в настоящее время эксплуатируются и получают низкую заработную плату от крупных компаний и владельцев бизнеса. Мы должны помочь этим рабочим в соответствии с христианскими учениями, повысив их заработную плату и поддержав христианские профсоюзы по всей стране."
 ITA_raise_workers_wages: "Поднять заработную плату"
 ITA_support_christian_unions: "Поддержать христианские профсоюзы"
 ITA_decentralization: "Децентрализация"
 ITA_decentralization_desc: "В настоящее время власть в стране слишком централизована: правительство обладает значительным объёмом власти, а региональные органы отодвинуты на второй план. Это привело к тому, что некоторые регионы страны, особенно юг, оказались более запущенными, чем другие. Чтобы исправить это, наше правительство должно начать децентрализацию власти и предоставить регионам большую автономию."
 ITA_local_socialist_revolts: "Местные социалистические восстания"
 ITA_crush_revolutionaries_decisions: "Сражаться с революционерами"
 ITA_fight_the_revolution: "Сражаться с революцией"
 ITA_fight_the_revolution_desc: "Катастрофа! Социалисты воспользовались моментом нашей слабости и используют свой шанс, чтобы распространить свою гнусную идеологию по всем уголкам Италии. Мы должны сплотить армию и народ вокруг флага и короля. Италия никогда не падёт перед социализмом, пока есть верные люди, готовые сражаться за всё, что для нас свято."
 ITA_purge_the_revolutionary_traitors: "Избавиться от революционеров"
 ITA_purge_the_revolutionary_traitors_desc: ""
 ITA_crackdowns_in_cities: "Террор в городах"
 ITA_counter_revolutionary_terror_dec: "Белый террор"
 ITA_counter_revolutionary_terror.tt: "§Y120 дней:§!\n$MODIFIER_STABILITY_WEEKLY$§G+0.20%§!\n$communism_drift$§R-0.05§!"
 ITA_anti_socialist_propaganda: "Антисоциалистическая пропаганда"
 ITA_anti_socialist_propaganda_desc: ""
 ITA_crush_the_strikers: "Раздавить бунтовщиков"
 ITA_crush_the_strikers_desc: ""
 ITA_recruit_loyalist_militias: "Вербовка лояльного ополчения"
 ITA_recruit_loyalist_militias_desc: ""
 ITA_maintain_strict_army_discipline: "Поддержать строгую дисциплину в армии"
 ITA_maintain_strict_army_discipline_desc: ""
 ITA_extreme_discipline_measures: "Строгая армейская дисциплина"
 ITA_conscript_southern_peasants: "Призыв южных крестьян"
 ITA_conscript_southern_peasants_desc: ""
 ITA_mobilize_the_nation: "Мобилизация нации"
 ITA_mobilize_the_nation_desc: ""
 ITA_grant_the_government_emergency_powers: "Дать правительству чрезвычайные полномочия"
 ITA_grant_the_government_emergency_powers_desc: ""
 ITA_civil_war_emergency_powers: "Чрезвычайные полномочия"
 ITA_will_be_lost_after_civil_war: "Это §Yдух§! будет удалён, как только закончится гражданская война."
 ITA_royal_frontline_visits: "Королевские визиты на передовую"
 ITA_royal_frontline_visits_desc: ""
 ITA_increase_the_kings_power_in_government: "Увеличить влияние короля в правительстве"
 ITA_increase_the_kings_power_in_government_desc: ""
 ITA_restore_civil_liberties: "Восстановить гражданские свободы"
 ITA_restore_civil_liberties_desc: ""
 ITA_recover_from_the_civil_war: "Восстановление после гражданской войны"
 ITA_recover_from_the_civil_war_desc: "Эти месяцы боёв столкнули брата с братом и раскололи итальянское общество. Хотя мир, возможно, и вернулся, осталось много шрамов от боёв, некоторые из которых могут потребовать десятилетий, если не больше, для настоящего заживления, но сейчас всё, что мы можем сделать, — это попытаться восстановиться и обеспечить, чтобы такая трагедия никогда не повторилась."
 ITA_rebuilding_the_nation_idea_monarchist: "Перестройка нации"
 ITA_disband_the_militias: "Распустить ополчение"
 ITA_disband_the_militias_desc: "The men who volunteered to fight for us during our darkest hours are a shining example of loyalty and patriotism, but the fighting is done, and it's time they put down their rifles and were allowed to return to their farms and families where they are most needed so they can serve Italy both in war and peace."
 ITA_repair_cities: "Восстановление городов"
 ITA_repair_cities_desc: "Many cities have suffered heavily from much destruction during the civil war, with many buildings flattened and infrastructure in disrepair as these cities were bastions of the revolutionary cause and were heavily fought over. These cities are vital to our economy and reparing them must be at the top of our priorities if we are to rebuild our economy."
 ITA_reparing_city_infrastructure: "Восстановление городской инфраструктуры"
 ITA_empower_the_king: "Наделить короля полномочиями"
 ITA_empower_the_king_desc: "The war is over, but Italy lies in ruins and now the last man with any remaining support and legitimacy is the king. While Victor Emmanuel has never been a man prone to involving himself in politics or asserting his royal prerogatives, it seems fate has decided it for him. For the foreseeable future, a non-partisan royal government will lead the reconstruction of the nation."
 ITA_utilize_the_power_of_the_royal_decree: "Использовать силу королевских указов"
 ITA_utilize_the_power_of_the_royal_decree_desc: "With parliament being dismissed and with the political climate being far too polarized for any election to be called, it seems the only way a semblance of normal governance can return is to use the power of royal decree to put the government back in working order."
 ITA_royal_decree_on_extremism: "Королевский указ об экстремизме"
 ITA_unlock_focus_crackdown_on_extremists: "§GРазблокирует§! национальный фокус '§YБорьба с экстремистами§!'."
 ITA_spread_monarchist_propaganda: "Распространять монархическую пропаганду"
 ITA_spread_monarchist_propaganda_desc: "The monarchy is now the only hope of Italy, it must transform from simply an institution or a person into a symbol that all of our people can look up to and admire. Our new propaganda will portray Victor Emmanuel as a caring father of the nation and an enlightened despot like the great monarchs of the past centuries."
 ITA_crackdown_on_extremists: "Борьба с экстремистами"
 ITA_crackdown_on_extremists_desc: "Despite the recent bloodshed of the civil war, there are still men, both on the left and the right clamoring for more of it and trying to spark another uprising. We can't have a repeat of the tragedy. These agitators will be dealt with before they can once again bring ruin to our nation."
 ITA_can_do_crackdown_extremists: "Has completed £decision_icon_small'§YRoyal Decree on Extremism§!"
 ITA_nationalism_and_monarchism: "Invigorate Italian Nationalism"
 ITA_nationalism_and_monarchism_desc: ""
 ITA_return_to_somalia: "Вернуться в Сомали"
 ITA_return_to_somalia_desc: ""
 ITA_demand_the_restoration_of_treaties_with_hobyo: "Demand the Restoration of Treaties with Hobyo"
 ITA_demand_the_restoration_of_treaties_with_majeerteenia: "Demand the Restoration of Treaties with Majeerteenia"
 ITA_southern_government_bailouts: "Southern Government Bailouts"
 ITA_southern_government_bailouts_desc: "Local governments in the South have been negligent when it comes to spending. Therefore a bailout shall be issued."
 ITA_sacred_egoism: "Священный эгоизм"
 ITA_sacred_egoism_desc: "Italian foreign policy shall be dictated not by sentiment or adherence to precedent, but by whatever shall benefit the nations objectives"
 ITA_negotiations_with_entente: "Переговоры с Антантой"
 ITA_negotiations_with_entente_desc: "While on paper we are allied with Berlin and Vienna, there's much more to be gained  by joining the war on the side of the Entente. Diplomats will travel to London to see what concessions they're willing to make."
 ITA_salandra: "Возвращение консерваторов"
 ITA_salandra_desc: "Thanks to the ever-growing participation of catholics in electoral politics and the support of Giolitti himself, the conservative faction in parliament has been able to form a new government led by Antonio Salandra that aims to foster traditional values and nationalism."
 ITA_unity_through_nationalism: "Защитник традиционных ценностей"
 ITA_unity_through_nationalism_desc: "Giolitti, while a very respectable man who did his best, was a bit too open to social reforms from the left. We must protect conservative values and prevent the erosion of what makes our country great."
 ITA_the_gears_of_war: "Расшевелить военную машину"
 ITA_the_gears_of_war_desc: "The armaments industry has lagged behind other sectors of the economy. In dire need of funds, the government shall meat with prominent arms barons to give a helping hand to businesses. "
 ITA_subsidize_shipping: "Субсидировать судоходство"
 ITA_subsidize_shipping_desc: "A merchant marine is vital for the surival of Italy during war. The war industry's endless hunger for resources must be met no matter what."
 ITA_local_government_reforms: "Провести ответственные госреформы"
 ITA_local_government_reforms_desc: "The past years have seen a steady rise in government spending by the liberals. This is simply unsustainable, and we will take the measures needed to solve this issue before it gets out of control."
 ITA_undersecretariat_for_arms: "Undersecretariat for Arms"
 ITA_undersecretariat_for_arms_desc: "General Alfredo Dallolio has, since the start of our war in Libya, been responsible for successfully organizing the supply of our troops. To mobilize our war industry, we are offering him lead of the newly created Undersecretariat for Arms and Munitions. Essentially, we will give him more power over his specialty, troop supply."
 ITA_the_bulwark_of_italy: "Assist the Latifondisti"
 ITA_destroy_latifondisti: "Destroy the Latifondisti"
 ITA_the_bulwark_of_italy_desc: "The Latifondisti are one of our most important supporters and are key to our government's long-term stability. We must aid them against any attempt at curbing their power and influence, as well as blocking any attempt at land reform in parliament is key to that."
 ITA_integrate_nationalist_groups: "Integrate Nationalist Groups"
 ITA_integrate_nationalist_groups_desc: "Nationalists had been at odds with the Giolitti government, but now that Italy is led by a conservative and patriotic government, it won't be too hard to draw those men back towards more moderate politics."
 ITA_savari: "Основать савари"
 ITA_askari_troops: "Набрать войска Аскари"
 ITA_askari_troops_desc: "To keep our colonies under control is to adapt to our colonies. A new Camel Corps will be formed so that we can guard and protect our colonies better. "
 ITA_italian_spahis: "Spahis Italiani"
 ITA_italian_spahis_desc: ""
 ITA_cycling_divisions: "Велосипеды в армии"
 ITA_cycling_divisions_desc: "Bicycles have begun being used in certain parts of the army on small scales and have proved effective increasing mobility. With these signs of success we should adapt bicycles on a more widespread scale across our army, for our divisions aswell as our supply deliveries."
 ITA_mountain_artillery: "Горная артиллерия"
 ITA_mountain_artillery_desc: "Mountain warfare requires specialized equipment. Mountain guns that are small enough to be carried by mule and donkeys will enable us to shell our enemies into submission."
 ITA_fund_breda: "Fund the Società Ernesto Breda"
 ITA_fund_breda_desc: ""
 ITA_develop_military_industry: "Инвестировать в военные мануфактуры"
 ITA_develop_military_industry_desc: "Thanks to Giolitti's rapid industrialization, our war industry has significantly improved over the last decade, but it still is not enough. For example, military hardware production is still catching up. To address this issue, we will diversify already existing manufacturers and develop them into bigger complexes to have a more organic and stable major supplier."
 ITA_cavalry_reform: "Альпийские всадники"
 ITA_cavalry_reform_desc: "While not ideal for cavalry, mounted infantry could play a key role in the mountains, enabling our troops to outflank the enemy."
 ITA_distance_from_giolitti: "Дистанцироваться от Джолитти"
 ITA_consensus_of_the_divided: "Консенсус разделенных"
 ITA_consensus_of_the_divided_desc: "The fall of Giolitti and the lack of any clear majority in parliament has led to the return of former prime minister Sidney Sonnino, who, as a widely respected man and moderate conservative, is considered an acceptable candidate by most of the parliament."
 ITA_land_reform_in_the_south: "Земельная реформа на юге"
 ITA_land_reform_in_the_south_desc: ""
 ITA_align_with_the_reformist_socialists: "Союз с социалистами-реформистами"
 ITA_align_with_the_reformist_socialists_desc: "Though most socialist parties call for armed struggle, some of the more reformist factions can be negotiated with. Their price is steep, but could be the key to fending off revolution."
 ITA_align_with_the_liberals: "Обьединиться с либералами"
 ITA_align_with_the_liberals_desc: "There are some more liberal groups in Italy who support many of the social reforms that our government is passing. We should request for their support and align ourselves more with them as they could offer valuable help."
 ITA_continue_progress_of_the_first_reforms: "Продолжить прогресс первых реформ"
 ITA_continue_progress_of_the_first_reforms_desc: "Sonnino has always been a man that values financial responsibility. His new government will take a series of measures to strengthen the economy in the long term and prepare Italy for future financial troubles it may face."
 ITA_combat_nationalist_agitators: "Сражаться с националистическими агитаторами"
 ITA_combat_nationalist_agitators_desc: "There is no bigger Italian nationalist than prime minister Sonnino himself, but these men don't seek to aid Italy, her people, government or success, they are simple violent agitators grasping at a vain attempt at power. This is simply unacceptable, and we will deal with this malcontents without delay or hesitation."
 ITA_create_a_plan_for_the_south: "Создать план для юга"
 ITA_create_a_plan_for_the_south_desc: "Sonnino's first government fell because of his radical plan to transform southern Italy, but now that he has a stable government, he can begin the process of aiding the southern farmers and relieving the widespread poverty."
 ITA_push_back_against_the_church: "Оттеснить церковь на задний план"
 ITA_push_back_against_the_church_desc: "The Catholic Church was a staunch opponent of Italian Unification, rejecting the legitimacy of our government entirely. Perhaps it's time to follow in the footstepps of the French and adopt laws similar to those passed in 1905."
 ITA_utilize_public_works: "Задействовать общественные работы"
 ITA_utilize_public_works_desc: ""
 ITA_develop_libyan_coastal_cities: "Развитие ливийских прибрежных городов"
 ITA_develop_libyan_colony: "Л'ора ди Триполи"
 ITA_develop_libyan_colony_desc: "To quote a reporter: \"No Italian emigrant will go (to Tripoli), so long as there is such a place as Chicago.\""
 ITA_agricultural_developments_italian_somaliland: "Поддержать итальянских фермеров в Сомалиленде"
 ITA_agricultural_developments_italian_somaliland_desc: "Many Italians have emigrated to Somaliland to set up farms on the fertile soils of the region. These settlers are grealty benefiting the local economy and our colonization of the region. We should support them by offering them grants and also offering anyone willing to emigrate to the region grants aswell."
 ITA_italian_settlers: "Итальянские поселенцы"
 ITA_mogasidishu_villabruzi_railway: "Ж/д Могадишо-Виллабруци"
 ITA_mogasidishu_villabruzi_railway_desc: "Across Somaliland are Italian agricultural settlements that are quite isolated from the port city of Mogadishu, making it difficult to export agricultural products. We should build a railway from Mogadishu stopping through some settlements before ending at the Italian agricultural settlement of Villabruzi, which will allow Italian farmers to easily transport their agricultural goods to Mogadishu to be brought to Italy."
 ITA_expand_somali_agriculture: "Расширить сельское хозяйство Сомали"
 ITA_expand_somali_agriculture_desc: "With the new railway going through Somaliland being able to transport many goods for export and the many Italian farmers, we should heavily invest into the agricultural industry in the region as it has great potential to be a very profitable colony for us."
 ITA_funded_italian_farmers_flag: "Завершено решение £decision_icon_small §Y$ITA_agricultural_developments_italian_somaliland$§!"
 ITA_mogadishu_railway_flag: "Завершено решение £decision_icon_small §Y$ITA_mogasidishu_villabruzi_railway$§!"
 ITA_livestock_eritrea: "Поддержать животноводческие фермы Эритреи"
 ITA_livestock_eritrea_desc: "Throughout the hills and mountains of Eritrea livestock are being raised in many farms on the fertile lands. We should support these farmers as this could with some help be a very profitable industry that would be worthwhile to invest in."
 ITA_complete_the_eritrean_railway: "Завершить эритрейскую железную дорогу"
 ITA_complete_the_eritrean_railway_desc: "The Eritrean railway from the port of Massaua to the city of Asamra has been under construction since 1887 and has been taking a while to be built through the Eritrean mountains. We should get to work finishing this railway by providing some extra funds, to connect the city of Asmara, allowing easy access from the coast to the central highlands which would usually be a long journey."
 ITA_transform_eritrea: "Преобразовать Эритрею"
 ITA_transform_eritrea_desc: "Eritrea is ripe to be developed into a perfect Italian colony in Africa, with it already having modern cities rebuilt with Italian architecture and a large livestock industry. We should invest extra funds into the colony, transforming it into the perfect Italian colony in Africa with its cities looking no different then the ones in the Italian mainland and a large amount of Italians emigrating there every day."
 ITA_the_model_colony: "Примерная колония"
 ITA_eritrea_livestock_flag: "Завершено решение £decision_icon_small §Y$ITA_livestock_eritrea$§!"
 ITA_eritrea_railway_flag: "Завершено решение £decision_icon_small §Y$ITA_complete_the_eritrean_railway$§!"
 ITA_countdown_until_no_libya: "Окно возможности войны в Ливии"
 ITA_countdown_until_no_libya_desc: "Time is running out for us to conquer Tripolitanian lands as Ottoman instability is at its highest. With a war brewing in the balkans, we have to take the opportunity."
 ITA_countdown_until_no_libya_tt: "Вы должны начать войну до того, как таймер §Rистечёт§!!"
 ITA_has_TUR_balkan_war_question: "Балканская война началась"
 ITA_compromise_with_tribes: "Компромис с ливийскими племенами"
 ITA_open_for_business: "Открыты для бизнеса!"
 ITA_open_for_business_desc: "Our tariff policy clearly isn't working. As Germany, France, and Britain continue to develop faster then us, a shakeup to our current tariff policy may help balance out the odds. By dropping tariffs, we can hopefully reduce the costs of goods for everyone and bring in foreign business, even if domestic businesses suffer."
 ITA_encourage_for_profit_industries: "Encourage For-Profit Industries"
 ITA_encourage_for_profit_industries_desc: "A lot of government ran development projects prioritize serving the people instead of making a profit. While a noble goal, perhaps redirecting our projects efforts towards bringing in more money could help our economic growth."
 ITA_foreign_investments_in_italy: "Healing International Economic Relations"
 ITA_foreign_investments_in_italy_desc: "Our high tariffs on global powers have lead to global powers placing their own counter tariffs on us. We should try and negotiate their tariffs on us down so we can sell our goods to their countries."
 ITA_push_through_deregulation: "Провести дерегулирование"
 ITA_loosen_export_tarriffs: "Ослабление экспортных пошлин"
 ITA_loosen_export_tarriffs_desc: "We currently levy export tariffs on agricultural goods to encourage domestic consumption of Italian agricultural goods. By removing these, we can expand our farmers profits dramatically."
 ITA_push_through_deregulation_desc: "With our attempts to reduce tariffs helping bring in foreign investments, we need to slash red tape to get their projects through. By removing some less important regulations, we can speed up economic growth."
 ITA_support_farmers: "Поддержать наших фермеров"
 ITA_support_farmers_desc: "Our farmers need more from their government. With many struggling, a collapse of the farmer sector would collapse the economy itself. Through generous aid programs, we can hopefully prop up this sector."
 ITA_artillery_modernisations: "Закупить новой артиллерии"
 ITA_invite_southern_labourers: "Пригласить южных рабочих"
 ITA_invite_southern_labourers_desc: "In the south there are a lot of peasants working on farms and many workers who are unemployed who could do with a new job. With the growing war industry in the north, we need more workers for the factories and we can bring these workers from the south."
 ITA_mass_shell_produciton: "Массовое производство снарядов"
 ITA_new_research_facilities: "Основать новые исследовательские центры"
 ITA_new_research_facilities_desc: "Times are changing and warfare is not what it used to be. New research facilities are already being planned. If we wish to enter prepared, in meantime, our main focus should be gas warfare, which is still completely unknown to us."
 ITA_bersaglieri_focus: "Реорганизация Берсальеров"
 ITA_bersaglieri_focus_desc: "The Bersaglieri are elite soldiers of the Italian army, who are trained as skirmishers who can move from place to place quickly. We should reorganize the Bersaglieri battalions to improve their combat effectiveness."
 ITA_love_daggie: "§YРодос§! будет передан нам после нашей победы."
 ITA_the_defense_of_italia: "Оборона Италии"
 ITA_the_defense_of_italia_desc: "The future does not bode well for the Kingdom of Italy. The push and pull of the Franco-Russian alliance and our commitment to the Triple Alliance may eventually lead us to war against one side. Whether our soldiers be in Provence or Tirol, it matters not. We must be prepared for any possibility."
 ITA_expand_regia_marina: "Догоняем Австрию"
 ITA_expand_regia_marina_desc: "The Royal Navy has many, many rivals in the Mediterranean. A sorrowful display for the descendants of men that once hold sole dominion over it. Eventually one of these rivals will meet us across our ship's bows and will greet us with a cannon salute aimed at the quarterdeck. When that time comes we will be ready. Whether by submarine, by cruiser, or by looming battleship; that salute shall be greeted in kind."
 ITA_build_the_means_of_production: "Расширение наших верфей"
 ITA_build_the_means_of_production_desc: "Might always triuphs in battle, yet it is rare that military might is not accompanied by numbers. Bringing our navy up to speed with the rest of the Great Powers also means bringing our ship counts up to speed as well. "
 ITA_global_naval_power: "Глобальная морская держава"
 ITA_global_naval_power_desc: "What separates Germany, France, and Britain from the rest of the Great Powers is their naval projection. Their fleets have presences all around the globe. This is what enabled their colonization of known world. Going all in with our naval program will be our daring attempt at matching this power. Our land forces might suffer for it but sacrifices must be made in order to conquer the waves."
 ITA_expand_the_livorno_naval_academy: "Расширение Военно-морской академии Ливорно"
 ITA_expand_the_livorno_naval_academy_desc: "To staff our new ships a new generation of naval officers must be trained and deployed. Our current ability to efficiently educate these officers is lacking. An expansion of the Livorno naval academy would ensure that we can accept more applicants and staff more ships."
 ITA_new_naval_guns: "Новые морские пушки"
 ITA_new_naval_guns_desc: "Bigger is better. At least, when concerning naval warfare. Larger caliber guns have proved themselves far superior to the alternative, and our R&D department has recognized this. New ships should and will be outfitted with larger guns."
 ITA_modernise_the_navy: "Модернизировать флот"
 ITA_modernise_the_navy_desc: "Our continued efforts at bringing navy up to speed with the rest of the Great Powers has worked wonders. Originally years behind, we are now only slighly behind the latest technology. Now is time to take the next step, and emerge from the waves neck and neck with them. We must also become a pioneer in naval technology, for the sake of our nation and its wellbeing."
 ITA_a_fleet_to_rule_the_mediterranean: "Флот, чтобы править Средиземноморьем"
 ITA_a_fleet_to_rule_the_mediterranean_desc: "Итальянский народ связан с морем с самой Пунических войн. Проявляясь в могущественных морских империях, поддерживаемых итальянскими городами-государствами на протяжении столетий после падения Рима, ясно, что эта связь - хотя и несколько ослабленная - никогда не угасала. Когда потенциал объединённого полуострова достигает новых высот, пришло время вновь разжечь этот пламенный роман. Дети Ромула ещё раз будут властвовать над волнами."
 ITA_a_world_class_shipbuilding_industry: "Кораблестроительство мирового уровня"
 ITA_a_world_class_shipbuilding_industry_desc: "Our shipyards have grown and grown over the years, eventually surpassing some of the strongest of naval powers. Soon enough burgeoning navies will contract us to furnish their fleets. When that day comes we will truly have cemented our naval legacy for years to come. "
 ITA_strongholds_in_the_mediterranean: "Опорные пункты в Средиземноморье"
 ITA_strongholds_in_the_mediterranean_desc: "Many faces in the navy claim our Mediterranean bases, especially ones on islands, are in a concerning lack of basic defences. Along with their defences, our bases in the corners of the Mediterranean, must be upgraded to maximise the naval dominance we so wish to establish."
 ITA_new_naval_innovations: "Новые морские инновации"
 ITA_new_naval_innovations_desc: "Some navies have a presence that is simply too grand to surpass without years of investing in our shipyards. What we can do though is ensure a technological advantage in any encounter we might have."
 ITA_expand_the_light_ship_fleet: "Расширить легкий флот"
 ITA_expand_the_light_ship_fleet_desc: "Maintaining a diverse naval portfolio is the key objective of each and every nation investing in a naval program. Our convoy raiding and escorting capabilities are currently lacking. To deal with this, we will invest in a new line of light ships, capapble of racing across the Adriatic at high speeds."
 ITA_utilize_fast_moving_ships: "Использовать быстрые корабли"
 ITA_utilize_fast_moving_ships_desc: "For all of the power a capital ship might have it cannot simply meet the demands of fast maneuvers at sea. For that we rely on our smaller classes of ships, something that we have neglected in times past. Improving our doctrine regarding them will make our naval exchanges much more deadly to deal with."
 ITA_invest_into_submarines: "Инвестировать в подлодки"
 ITA_invest_into_submarines_desc: "War is always material, no matter the circumstances. Disrupting that material is key to victory. Among what is considered as material is civilian supplies transported across the world in massive convoy systems. Attacking our enemy's convoys would hurt their homefront, giving us a greater chance at victory. Let us attack from below, where we can resubmerge just as quickly as we rise up for the attack."
 ITA_laurenti_double_hull_construction: "Схема двойного корпуса Лауренти"
 ITA_laurenti_double_hull_construction_desc: "Double-hulls took the submarine world by storm with their introduction at the turn of the century by the French. Our attempts under the designs of Cesare Laurenti have proved useful, however an expansion of this would take things to the next level."
 ITA_a_mobile_fleet: "Мобильный флот"
 ITA_a_mobile_fleet_desc: "Our enemies in the Mediterranean are all within arms-length, meaning that whoever arrives to battle first may very well be the victor. An ambush against the Austrian Navy holed up in Fiume would be decisive as would one against the French, all such an operation requires is the proper investments into our light fleet, in particular new submarines. "
 ITA_2_enemies_2_navies: "Два врага, два флота"
 ITA_2_enemies_2_navies_desc: "We stand head and shoulders above the Ottoman fleet, however in order to utterly crush them in any engagement we must be prepared for any tricks they might have. Our operations in a war against them will primarily consist near the Libyan coast and potentially the Aegean, as such the navy will be directed to exercise in similar conditions."
 ITA_impliment_cunibertis_theory: "Реализовать теорию Куниберти"
 ITA_impliment_cunibertis_theory_desc: "Though we had previously discarded the idea of the All-Big-Gun ship, it may be time to take a look at it once more. The success of the HMS Dreadnought has made waves around the world, so the merits of the idea are certaintly validated. What remains to be seen is whether the budget can find the space for it. If we were to find the space, though, such a ship would no doubt prove immensly useful in our Mediterranean activities."
 ITA_implement_prevents_tsd: "Completing the focus '§Y$ITA_impliment_cunibertis_theory$§! will §GPrevent§! Austria from being able to take this action again."
 ITA_implement_prevents_tsd_desc: ""
 ITA_radio_prevents_shelling: "Completing the focus '§Y$ITA_utilize_the_radio$§! will §GPrevent§! Austria from being able to take this action again."
 ITA_prioritization_of_dreadnoughts: "Построить современные дредноуты"
 ITA_prioritization_of_dreadnoughts_desc: "Сильнейший флот - самый современный флот. Наш нынешний флот против нашего же флота десятилетней давности мог бы выиграть сражение, не потеряв ни одного линейного корабля. Крайне важно, чтобы мы не отставали от времени. Расширение нашего флота дредноутов за счёт этих современных проектов - хорошее начало."
 ITA_study_the_works_of_brin: "Изучить труды Брина"
 ITA_study_the_works_of_brin_desc: "На протяжении многих лет Италия дала миру множество военно-морских гениев, одним из которых был Бенедетто Брин. В течение своей жизни он служил министром флота, спроектировав множество броненосцев. В духе Брина наши усилия по оснащению флотов линкорами будут продолжены, и с каждым новым проектом мы будем значительно улучшать нашу способность вести войну на море."
 ITA_develop_fire_control_systems: "Разработать системы управления огнём"
 ITA_develop_fire_control_systems_desc: "Было бы разумно иметь установленную доктрину в отношении нацеливания на корабли. Другие современные флоты поступили так же, в частности японцы, использовав её с опустошительным эффектом в Цусимском сражении. Если наше собственное Цусимское сражение наступит, мы должны быть готовы промахиваться как можно меньше и бить по самым уязвимым местам."
 ITA_improve_dreadnought_armour: "Улучшить броню дредноутов"
 ITA_improve_dreadnought_armour_desc: "Наши линейные корабли должны быть способны выдержать столько же ударов, сколько наносят сами. Неважно, насколько мощны наши орудия, - они ничего не стоят, если снаряд вражеского корабля поразит двигатель. Утолщение и улучшение брони на будущих проектах устранит эту угрозу, нейтрализовав опасность орудий меньшего калибра."
 ITA_a_modern_battlefleet: "Мастерство линкора"
 ITA_a_modern_battlefleet_desc: "Будущее состоит из больших орудий и ещё больших кораблей. На протяжении многих лет различные морские державы осознали это и соответствующим образом скорректировали свои подходы, и теперь наша очередь. Наша программа строительства линкоров достигла своего апогея. Пусть наши враги найдут Бога, потому что он определённо не лежит на дне моря, куда наши 12-дюймовые орудия отправят их."
 ITA_aus_shell: "Морская бомбардировка"
 AUS_shell_venice: "$great_power_politics_great_war_tt_icon$ Бомбить Венецию"
 ITA_utilize_the_radio: "Воспользоваться радио Маркони"
 ITA_utilize_the_radio_desc: "Coordinating large naval maneuvers and reporting on the enemy's has always been one of the trickiest parts of naval warfare. A new invention, the radio, seeks to solve this. Ships can now relate positions to each other even when miles away, making sure that we know where we are; more importantly, we know where to find them."
 ITA_servizio_aeronautico: "Сервицио Аэронаутико"
 ITA_servizio_aeronautico_desc: "With the recent advent of aeroplanes, the experimentation of their use in military matters has been conducted by the Army Staff, with the army already flying a few reconnaissance planes. With powers across Europe investing into these flying weapons, we ourselves must keep up and not fall behind."
 ITA_lessons_from_libya: "Уроки из ливийской кампании"
 ITA_lessons_from_libya_desc: "From the Libyan campaign we've learned a lot about flying over enemy positions and scouting behind Turkish lines from above. The air campaign in Libya was a success, and what lies ahead is an expansion of our airforce and continued training for future wars to come."
 ITA_support_douhets_bomber_theory: "Поддержать теорию Дуэ"
 ITA_support_douhets_bomber_theory_desc: "Джулио Дуэ выдвинул множество теорий о мощи авиации, предполагая, что высотные бомбардировки должны быть её основной задачей, и призывая наши военно-воздушные силы инвестировать больше в бомбардировщики. Нам стоит прислушаться к нему и начать прилагать усилия в этом направление."
 ITA_caproni_manufacturer: "Купить самолёты Капрони"
 ITA_caproni_manufacturer_desc: "The Caproni Ca.1 plane designed by inventor Giovanni Caproni has gained the attention of our air corps recently with it's strong engine and potential to drop bombs. The army seeing the value of bomber aircraft has began to approach Caproni to make a modified type for the army, and let us produce them."
 ITA_corpo_aeronautico_militare: "Сформировать Корпо Аэронаутико Милитаре"
 ITA_corpo_aeronautico_militare_desc: "Lately the success of the air program within our military has warranted the creation of an autonomous air wing under the Royal Army, the Military Aviation Corps. Consolidating our air command will allow us to conduct missions with more efficiency, as well as standardising the training process for new pilots."
 ITA_aviator_training: "Подготовка авиаторов"
 ITA_aviator_training_desc: "With new aircraft being either built or purchased comes the need for pilots. Fresh blood for the airforce is hard to come by. There are requirements and standards that exceed everything currently offered in the military. The search for men of the required character must begin if we mean to keep this air program off the ground."
 ITA_french_plane_license: "Запросить лицензию французских самолетов"
 ITA_french_plane_license_desc: "The French are pioneers in the aviation field, just like us, and a new company, the Nieuport-Macchi Corporation has been founded in Lombardy to produce French aircraft for our army. We should quickly negotiate licenses for French planes quickly to get the production up and running."
 ITA_fund_domestic_fighter_production: "Поддержать отечественные самолёты"
 ITA_fund_domestic_fighter_production_desc: "If Italy is to become a leading aerial power, we must invest in producing more fighters domestically. Caproni's new fighter design seems promising, and investing in its production would be a surely wise decision to bolster the strength of our airforce"
 ITA_support_savoia_pomilio: "Инвестировать в Савойя Помилио"
 ITA_support_savoia_pomilio_desc: "The newly designed Savoia Pomilio bomber plane is showing its usefulness as a weapon of war. It can drop bombs on a specific location with precision and cause devestation. We should invest into future development of this aircraft and also invest into the production of it."
 ITA_new_aerial_innovations: "Новые воздушные инновации"
 ITA_new_aerial_innovations_desc: "Engineers around the world are constantly making new aerial innovations, making planes significantly better then previous versions. We must keep up with these new innovations, and also support our own engineers making new innovations."
 ITA_mass_plane_production: "Массовое производство самолётов"
 ITA_mass_plane_production_desc: "Dominating the skies is crucial in this war, as with our airforce we can bomb and destroy the enemy before we're anywhere close to them. With our war funds, it would be wise to launch a program to mass produce planes to dominate the sky."
 ITA_mass_plane_production_idea: "Массовое производство самолётов"
 ITA_mass_bombing_campaigns: "Интенсивные бомбардировки"
 ITA_mass_bombing_campaigns_desc: "The Italo-Turksish war saw the first use of aerial bombing in history. Using large airplanes will bring the war to enemy cities!"
 ITA_ansaldo_sva_recon: "Ансальдо С.В.А"
 ITA_ansaldo_sva_recon_desc: "Designers at Ansaldo have been developing a new plane, originally designed to be a fighter plane but has been found inadequate for the role. However, the plane has an impressive speed, range and top speed, which intrigues our military staff as it could be very valuable for reconnaissance missions."
 ITA_funding_fighters: "Финансировать разработку истребителей"
 ITA_navy_lobbying: "Морское лоббирование"
 ITA_navy_lobbying_desc: ""
 ITA_naval_lobby_remove: "Этот национальный дух будет удален как только мы завершим фокус '§Y$ITA_expand_regia_marina$§!'"
 ITA_papal_stuff: "Holy Decrees"
 ITA_sign_treaty_of_london: "Подписать договор с Антантой"
 ITA_sign_treaty_of_london_desc: "Paris and London's offers have proven to be quite tempting. It's time to continue the Risorgimento, to liberate the Italians of Istria, Dalmatia and Trentino!"
 ITA_negotiations_with_germany: "Переговоры с Германией"
 ITA_negotiations_with_germany_desc: "The Austro-Italo-German Triple Alliance has been present since 1882. Along with German attempts to renew the alliance, it is finally time to enter the war alongside our alliance members... but not without some extra demands, as some tension has been present between us and the Austrians. If we can leverage our entry in exchange for extra territories, or even Italo-Austrian disputed lands, it would be our priority."
 ITA_our_traditional_allies: "Исправить ошибки 1881 года"
 ITA_our_traditional_allies_desc: "We never forgot the Slap of Tunis. The French stole what was rightfully ours that year. This, as well as the loss of Savoy and Nice in 1861, being outmanouevered at the Berlin Conference and reliance on Anglo-French imports have caused a great deal of resentment towards the Entente. The slap shall be avenged."
 ITA_confront_vienna: "Потребовать компенсацию от Австрии"
 ITA_confront_vienna_desc: "During the Bosnian Crisis Austria received support from us in exchange for territorial compensation elsewhere. Its time we made Vienna fufill its promise."
 ITA_the_great_war_redux: "La Grande Guerra"
 communist_theorist_2: "Теоретик коммунизма"
 ITA_the_great_war_redux_desc: "The great war we had been preparing for in recent years is finally upon us. It seems clear this war won't be like any other war in history. If we truly intend to emerge victorious, we will need to mobilize all our resources to achieve this, even if it takes us to the brink of collapse. Avanti Savoia!"
 ITA_testing_the_waters: "Прощупывая почву"
 ITA_testing_the_waters_desc: "With Austria's attention diverted elswehere, Albania lies vulnerable. Seizing islands off the Albanian coast could help gauge the international reaction to a full scale takeover of the entire country."
 ITA_occupy_valore: "Оккупация Валоны"
 ITA_occupy_valore_desc: "Now that we have confirmed other powers won't interfere in our Albanian ambitions, we shall seize the port of Vlore to secure a proper beachhead from where we can exert control over the rest of Albania."
 ITA_military_industrial_complex: "Взять контроль над частными оружейными фабриками"
 ITA_military_industrial_complex_desc: "The war effort requires efficiency, and we have not time to deal with the squabbles of corporations. Companies producing weapons, especially foreign ones, shall have their assets requisitioned for the defence of the Fatherland."
 ITA_cost_cutting_measures: "Меры по сокращению расходов"
 ITA_intensify_food_production: "Увеличить производство еды"
 ITA_intensify_food_production_desc: "Conscription, which has particularly affected peasants, and problems with fertiliser imports have led to a looming food crisis in Italy. To avert famine, the government will introduce strict regulations on the production of bread and other foodstuffs to boost output, and will also impose quotas for the army to prevent malnutrition on the front line."
 ITA_implement_strict_rationing: "Ввести строгое нормирование"
 ITA_implement_strict_rationing_desc: "In the context of the war and difficulties in food production, every loaf of bread counts. To prevent disruptions to food supplies, strict quotas will be introduced on the sale and distribution of food, and the production of lower-quality bread will be authorised in order to conserve grain."
 ITA_issue_war_bonds: "Выпускать военные облигации"
 ITA_issue_war_bonds_desc: "We shall start a program of war bonds to get some fast liquidity to fuel the war effort. We'll, of course, have to repay them after the war, but it will be much less dangerous for our economy than taking on foreign loans."
 ITA_restrict_the_press: "Ограничить прессу"
 ITA_restrict_the_press_desc: "Some of the press has been against our entry into the Great War, writing news articles criticizing the government and the the war effort. This negative attitude cannot be tolerated while a war is going on, and as such we will use our powers to restrict the press."
 ITA_enforce_social_cohesion: "Укрепить социальную сплочённость"
 ITA_enforce_social_cohesion_desc: "Italy is at war, and to secure victory, in addition to success on the front line, it needs a strong home front. Society and the government, the right and the left, must put aside their petty squabbles and stand united to achieve victory."
 ITA_war_propaganda: "Военная пропаганда"
 ITA_establish_mobilitazione_industriale: "Учредить Мобилитационе индустриале"
 ITA_establish_mobilitazione_industriale_desc: "Despite our previous mobilization efforts, our industry is still lacking the coordination we need for our war industry. It will be expensive and likely take several months until our industry has fully adjusted itself to our new demands, but it's still a necessary process to undertake."
 ITA_intervene_in_labor_relations: "Вмешаться в трудовые отношения"
 ITA_intervene_in_labor_relations_desc: "We are open to cooperating with the unions, but that does not mean we'll allow them to foster domestic agitation against the war effort. We'll coordinate with the unions friendly to our government in an effort to marginalize the radical socialists and keep the support of the workers in this most critical time"
 ITA_socialist_economics: "Социалистическая экономика"
 ITA_socialist_economics_desc: "The strains of war have made something clear: We need all the Italian industry at our disposition to win this war. We shall institute \"war socialism\" and enact price controls and fully take over food distribution and domestic industry. These measures will allow us to take full control of all the resources in the country and to better organize and utilize them for our aims."
 ITA_expand_carabinieri: "Ужесточить дисциплинарные меры"
 ITA_expand_carabinieri_desc: "Disciplining our army is extremely important, as without discipline our army would break down in combat, and soldiers would be extremely demoralized. We must implement some discipline measures that may be viewed as harsh, but they are necessary."
 ITA_fund_new_coal_mines: "Основать новые угольные шахты"
 ITA_fund_new_coal_mines_desc: "The economy is heavily dependent on importing foreign coal and would collapse without it, but the war has crashed the amount we can bring in from abroad. The coal mines shall be expanded!"
 ITA_solve_the_import_crsis: "Решить кризис импорта"
 ITA_solve_the_import_crsis_desc: "In the context of the war, including at sea, it is becoming increasingly difficult for Italy to import the resources it needs, in particular coal, iron and food, from its key pre-war suppliers, the United Kingdom and Russia. To address this problem, it will be necessary to diversify supply routes, whilst at the same time ensuring reliable protection for our maritime trade routes."
 ITA_combat_defeatism: "Борьба с пораженчеством"
 ITA_combat_defeatism_desc: "The horrors of the war are leaving big scars on the hearts and minds of our nation. To combat this all-too-common problem, we will improve conditions for soldiers, rebuild morale by relaxing forced discipline and intensify propaganda. The main point we wish to achieve with this, is to make people realize this is not a war of unnecessary expansion, but a defensive war of survival."
 ITA_intimidate_labour_unions: "Запугивать профсоюзы"
 ITA_intimidate_labour_unions_desc: "The unions have been a thorn in the government's side for years"
 ITA_like_father_like_son: "Как отец, как сын"
 ITA_like_father_like_son_desc: "It seems history has repeated itself, For Victor Emmanuel has embraced the same autocratic tendencies of his father, albeit reluctantly. His patience with the Italian Parliament has apparently worn thin, for now he essentially rules by decree."
 ITA_the_new_normal: "Соблюдать новую норму"
 ITA_the_new_normal_desc: "Pollio has shown himself more reasonable and willing to work with parliament than was expected of him. After long negotiations and several assurances were made, he has managed to form a coalition of right liberals, Catholic nationalists."
 ITA_a_firm_hand: "Слава прежних дней"
 ITA_a_firm_hand_desc: "Parliament was already divided after the fall of Giolitti's government, and they had not taken the king's intervention kindly. Without any workable coalition being possible, it seems the return of military rule is inevitable."
 ITA_murder_the_leader_of_the_cgl: "Убить лидера CGL"
 ITA_murder_the_leader_of_the_cgl_desc: ""
 ITA_utilize_the_ani: "Воспользоваться ANI"
 ITA_utilize_the_ani_desc: "Despite being seen with suspicion by many in our government, the ANI shares many of our same goals and values. We will offer them positions in our government to ensure we can unite all rightists and nationalists behind our government."
 ITA_parliamentry_dictatorship: "Парламентская диктатура"
 ITA_parliamentry_dictatorship_desc: "While being far from popular in parliament, prime minister Pollio has managed to form a coalition of nationalists and more hardline conservatives around him. And while this isn't enough to form a parliamentary majority, it does give our government some direly needed legitimacy."
 ITA_form_the_nationalist_block: "Сформировать националистический блок"
 ITA_form_the_nationalist_block_desc: "Now that we have secured the support of the hardline conservatives, the ANI and other nationalists, we can unify these groups from a tenuous coalition into a united nationalist bloc and stop the tide of liberalism and socialism."
 ITA_mobilize_the_public: "Мобилизировать общественность"
 ITA_mobilize_the_public_desc: "Despite our efforts to achieve stability and legitimacy for our government, we have thus far failed to sway public opinion to our side. We can't allow the mob to become a threat to Italy's stability. We will launch campaigns of nationalist propaganda to ensure our ideals are spread to the population."
 ITA_on_the_unions_neck: "На шее у профсоюзов"
 ITA_on_the_unions_neck_desc: "The CGL is the largest and thus the most dangerous labor union in the country. They have been a thorn in our side since Pollio assumed office. We will take the necessary measures to ensure the current leadership is dealt with and that the new one will be much more cooperative with our government."
 ITA_a_militarized_society: "Милитаризованное общество"
 ITA_a_militarized_society_desc: "We have taken the first steps towards making Italy great again despite the efforts of our many domestic enemies. The next step in our goal is restoring the prestige of the army and creating a militarist cult like that in the other great nations throughout history."
 ITA_rule_through_decree: "Правление через декреты"
 ITA_rule_through_decree_desc: "Parliament is rotten to the core. Any attempt at working them has been a failure, so we will fight fire with fire and remind them we don't need them. The only man our government needs for support is the King, and Pollio has his full confidence, so he won't have a problem with using the power of decree as many times as it's needed for our government to function properly."
 ITA_above_political_parties: "Быть выше всех партий"
 ITA_above_political_parties_desc: "Our government is an extension of the king's will and thus above reproach and certainly above political parties, but it seems many so-called \"conservatives\" do not understand this. They will either fall in line and stand behind us or we will consider them enemies like any other liberal or socialist."
 ITA_strangle_the_corporations: "Задушить корпорации"
 ITA_strangle_the_corporations_desc: "Many of Italy's great corporations have not welcomed our government's increasing authoritarianism and tendency to intervene in all parts of society, but we can't allow them to stand against us. We will give them a simple ultimatum. They will either work for us or they will be nationalized and taken over."
 ITA_first_anti_socialist_law: "Ренулировать социализм в Италии"
 ITA_first_anti_socialist_law_desc: "The very fact that the PSI is allowed to operate openly is an affront to Italian honor and morality that came about because of cynical liberal governments. Now that Italy is led by a true conservative, we will finally deal with them permanently, although some in our government believe this could have disastrous consequences and that we should simply clamp down on revolutionary socialists."
 ITA_conservative_financial_reforms: "Консервативные финансовые реформы"
 ITA_conservative_financial_reforms_desc: "For too long, Italy has been led by financially irresponsible liberals. This reckless spending must cease at once before we fall into financial ruin. Austerity and privatization are what Italy needs to revitalize her economy."
 ITA_the_bread_basket_of_italy: "Хлебная корзина Италии"
 ITA_the_bread_basket_of_italy_desc: "The south has been the traditional breadbasket of Italy but in recent years it has fallen short of meeting our agricultural demands and, with war in the air, that's simply not something we will accept. We will take the measures needed to ensure they meet our needs for any future conflict."
 ITA_moderate_the_unions: "Умерить профсоюзы"
 ITA_moderate_the_unions_desc: "The unions are here to stay and that's a fact we must accept. What we can't accept is them being an extension of the PSI and a front for socialist agitators. We will promote non-socialist unions and subtly undermine the socialist ones."
 ITA_more_freedom_of_speech_news: "Терпимо относиться к критике правительства"
 ITA_catholic_education: "Католическое образование"
 ITA_catholic_education_desc: "Italian politicians have been hostile to the church since the very foundation of our nation, but now that Italy is led by a true conservative, this can finally stop. We will extend an olive branch to the church by enshrining Catholic values in our education system."
 ITA_quid_pro_quo_with_the_army: "Услуга за услугу с армией"
 ITA_quid_pro_quo_with_the_army_desc: "Pollio is a general first and politician second. Now that such a man is in charge of our nation, he will ensure the army gets the funding and respect it deserves and that it has long been owed."
 ITA_national_defense_law: "Закон о национальной обороне"
 ITA_national_defense_law_desc: "The growing tensions throughout Europe are clear: War is coming. We will pass the necessary laws and make whatever changes are needed to ensure Italy is ready to fight when destiny calls her to arms."
 ITA_cut_welfare_programs: "Сокращение программ соцобеспечения"
 ITA_cut_welfare_programs_desc: "All these welfare policies and laws are only leading Italy towards socialism. We must restore the proper relationship between the state and the people. Besides, these cuts in spending will surely be good for our economy."
 ITA_supremacy_in_the_balkans: "Превосходство на Балканах"
 ITA_supremacy_in_the_balkans_desc: "Albania is currently, barely holding its head above the water. With almost no control over its lands, in constant revolts, it is in the perfect state and location for our expansionist goals. We should mop this up fast while we can, as the world lately feels like... on the razor's edge."
 ITA_levrage_our_neutrality: "Шантизировать нашим нейтралитетом"
 ITA_levrage_our_neutrality_desc: ""
 ITA_eyes_on_east_africa: "Взгляд на Восточную Африку"
 ITA_eyes_on_east_africa_desc: "In May of 1889 we signed a legal treaty with Ethiopia that'd make them our protectorate and block them from representation without our supervision; however, Emperor Menelik disagreed and denounced the Treaty in 1893. We'd then invade two years later and blunder due to high command incompentence. It's not longer the 19th century; with a reformed high command and experience in Libya, an Ethiopian adventure would be swift!"
 ITA_eyes_on_east_africa.tt: "\nАнтанта это §Rне одобрит§!!"
 ITA_the_glory_in_suffering: "Слава в страдании"
 ITA_the_glory_in_suffering_desc: "The people won't like it, but we should start seizing valuable assets from the people and liquidating them to fund our war effort. It will be painful in the short term, but instituting more radical measures could cause irreparable damage to Italian industry and society."
 ITA_seek_emergency_powers: "Искать чрезвычайные полномочия"
 ITA_seek_emergency_powers_desc: "A war of unprecedented scale has broken out right on Italy's borders. The country is in dire danger! Under these circumstances, petty political squabbles will undoubtedly lead to our destruction. To prevent such a dire outcome, Gillioti is requesting emergency powers to navigate Italy through those troubled times."
 ITA_destiny_arrives_all_the_same: "Судьба все равно приходит"
 ITA_destiny_arrives_all_the_same_desc: "It seems all attempts at peace were for naught. But perhaps there is a silver lining, for the ongoing conflict could mark another chance for Giolitti's premiership."
 ITA_the_bismarckian_model: "Finalize the Integration of the Middle Class"
 ITA_the_bismarckian_model_desc: "The newly emerging middle class shall finally be integrated into society, as a reliable base of support for the government."
 ITA_abandon_the_giolitti_programme: "Отказаться от программы Джоллити"
 ITA_abandon_the_giolitti_programme_desc: "The Giolitti Progam has been a mixed bag, with Giolitti not having a set ideology"
 ITA_abandon_pacifism: "Отказаться от пацифистских взглядов"
 ITA_abandon_pacifism_desc: "The pacifists would rather deny Italy it's destiny on the world stage. Ending their influence would be easy, for it goes hand in hand with socialism."
 ITA_tide_of_progress_tt: "Pay attention to the mission §YThe Tide of Progress§!. If we do not complete it's requirements, our government will be almost guaranteed to §Rcollapse§!"
 ITA_postpone_farmers_debts: "Отсрочить выплату долгов для фермеров"
 ITA_postpone_farmers_debts_desc: "The south has been in a debt spiral for a long time. The government must intervene and postpone their debt so our reforms and aid have time to set in, even if it will be painful for our economy in the short term."
 ITA_fight_southern_illiteracy: "Бороться с безграмотностью на юге"
 ITA_fight_southern_illiteracy_desc: "While our reforms in the south have already started to show positive results, we still need to deal with the south's largest barrier to it's success: the widespread lack of education and literacy. We will fight this by investing and subsidizing southern schools."
 ITA_fund_southern_schools: "Финансировать южные школы"
 ITA_curb_the_power_of_the_latifondisti: "Ограничить власть латифундистов"
 ITA_curb_the_power_of_the_latifondisti_desc: "The largest landowners in the South, the Latifondisti wield considerable power. They pose a threat to our agenda. and their power must be neutralized as much as possible."
 giolitti_resigns_shamed: "ИЛИ: Джоллити уходит в отставку с позором"
 ITA_army_expansion_bill: "Закон о бюджете армии"
 ITA_army_expansion_bill_desc: ""
 ITA_mold_italy_in_our_vision: "Формирование Италии по нашему замыслу"
 ITA_mold_italy_in_our_vision_desc: ""
 ITA_auth_d_1.tt: "All £decision_icon_small §YMolding Italy To Our Vision Decisions§! relating to usual parliamentry procedures will cost §G20§! less §YPolitical Power§!"
 ITA_auth_d_2.tt: "All £decision_icon_small §YMolding Italy To Our Vision Decisions§! relating to usual parliamentry procedures will now be §Gfree§!"
 ITA_split_the_right: "Разделить правых"
 ITA_nationalism_and_liberalism: "Национализм и либерализм"
 ITA_nationalism_and_liberalism_desc: ""
 ITA_nationalist_media_pressure: "Националистическое давление"
 ITA_nationalist_media_pressure_desc: "As they believe in its weakness, the Nationalists are pressuring [ITA.GetLeader] into starting and winning a war against the Ottomans for Libya."
 ITA_redistribute_land_in_the_south: "Перераспределить землю в [FROM.GetName]"
 ITA_uplift_southern_economies: "Заняться регионом [FROM.GetName]"
 ITA_uplift_southern_economies_desc: "[FROM.GetName] вместе с другими южноитальянскими регионами остро нуждается в развитии, если он хочет догнать своих северных соседей."
 ITA_invest_in_southern_infra: "Инвестировать в инфраструктуру региона [FROM.GetName]"
 ITA_military_dictatorship_desc: "The rapidly deteriorating situation on the frontline has lead to the king to take drastic measures. With the use of a royal decree, the current chief of staff Cadorna has been promoted to prime minister spot, with the decree also giving Cadorna expansive powers to the point of a dictatorship in all but name."
 ITA_results_vary: "Results may vary based on our selected §CEconomic Direction§!"
 ITA_anger_blacks: "This will §RInfuriate§! corporate leaders"
 political_genius: "Политический гений"
 ITA_public_works_minister: "Министр общественных работ"
 ITA_minister_of_agriculture_industry: "Министр с/х и промышленности"
 ITA_colonial_governor: "Колониальный губернатор"
