 ITA_left_fire_fast: "Миссия §YУгасающая Поддержка Социалистов§! будет на §Y5§! дней короче"
 ITA_unify_all_sides: "Правительство Большой Коалиции"
 ITA_unify_all_sides_desc: "There is no need to rely on authoritarian war measures when parliament is ready and willing to cooperate with the government to ensure Italy's victory. We shall a grand coalition of all the democratic parties to ensure a stable government whilst not trampling over civil liberties."
 ITA_war_powers2: "Коалиционное правительство"
 ITA_union_war_board: "Union Input in the Mobilization Process"
 ITA_union_war_board_desc: "Working with the trade unions will help greatly with mobilising a war economy, with unions promising to avoid going on strike and making sure key workers important to certain industries arent conscripted."
 ITA_soc_fire_faster2: "Миссия §YУгасающая Поддержка Социалистов§! будет на §Y15§! дней короче"
 ITA_rad_fire_faster: "Миссия §YУгасающая поддержка радикалов§! будет на §Y10§! дней короче"
 ITA_all_fire_faster: "Миссия §YУгасающая поддержка социалистов§! будет на §Y5§! дней короче\nМиссия §YУгасающая поддержка радикалов§! будет на §Y5§! дней короче\nМиссия §YУгасающая поддержка левых§! будет на §Y5§! дней короче\nМиссия §YУгасающая поддержка правых§! будет на §Y5§! дней короче"
