 ITA_form_a_health_sector: "Сформировать сектор здравоохранения"
 ITA_ascension_of_the_destra: "Восхождение партии Дестра"
 ITA_ascension_of_the_destra_desc: "As the old system falters, many flock to the Destra (the Right), the traditional conservative forces. They promise to restore order, uphold traditional values, and pursue a strong foreign policy. This marks a shift away from liberal compromise towards a more authoritarian and nationalist stance, seeking to renew Italy through discipline and hierarchy."
 ITA_ascension_of_the_estrema_destra: "Восхождение партии Эстрема Дестра"
 ITA_ascension_of_the_estrema_destra_desc: "«Эстрема Дестра» (Крайне правые) направляют народный гнев в революционное движение, презирающее демократию и прославляющее действие. Их боевые отряды сражаются с противниками на улицах, обещая национальное возрождение силой. Они стремятся очистить нацию от слабости, социализма и коррупции, требуя полной лояльности единому сильному вождю."
 ITA_ascension_of_the_estrema_sinistra: "Восхождение партии Эстрема Синистра"
 ITA_ascension_of_the_estrema_sinistra_desc: "«Эстрема Синистра» (Крайне левые) сплачивают простой народ в могучую революционную силу. Вдохновляясь потрясениями за рубежом, они утверждают, что вся система монархии и капитализма должна быть сметена. Выступая за забастовки и захват земель, они стремятся построить новое государство, где рабочие и крестьяне будут обладать всей полнотой власти."
 ITA_seize_large_farms: "Захватить крупные плантации"
 ITA_agr_credit_scheme: "Схема кредитования сельского хозяйства"
 ITA_cost_cutting_measures_desc: "The dramatic increase in military spending needed to wage this great war means we will have to tighten our belts elsewhere. Some social programs must see their funding cut, for now."
