 ITA_prioritize_domestic_stability: "Избегание кровавой бани"
 ITA_prioritize_domestic_stability_desc: "Why should the Italian people bleed for the sake of others? its likely in the event of victory we may end up getting shortchanged in favour of other states anyway. Our economy would suffer by joining the fray, but neutrality is quite profitable!"
