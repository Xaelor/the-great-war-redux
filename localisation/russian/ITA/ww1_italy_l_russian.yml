 ITA_pension_program: "Establish a Progressive Pension System"
 ITA_strangle_falck_group: "Strangle the Falck Group"
 ITA_eliminate_private_education: "Eliminate Private Education"
 ITA_eliminate_private_education_desc: "Private education means that we aren't in control of what the student learns. This could lead to students learning the wrong things or even being indoctrinated with negative ideas. The only way we can secure the future of the education of a student is by making sure they are in the right schools."
 ITA_strangle_OTO_melara: "Strangle Vickers-Terni"
 ITA_accept_our_responsibility: "The Responsibility of Governance"
 ITA_accept_our_responsibility_desc: "It seems Giolitti's greatest gambit worked. In the first few weeks of their government, the ANI has shown itself willing and able to cooperate with other factions of parliament, and has also toned down its rhetoric and distanced itself from some of its more radical positions, although they are still far from a truly centrist or moderate party."
 ITA_the_state_weve_dreamed_of: "Италия, которую мы заслуживаем"
 ITA_the_state_weve_dreamed_of_desc: "This mandate is a once in a lifetime opportunity for our movement. There shall be no negotiation or compromise with the old and corrupt establishment, we shall pursue our complete program no matter who attempts to stand against us."
 ITA_dominate_the_narritive: "Dominate the Narrative"
 ITA_dominate_the_narritive_desc: "Now that we have control of Italy, we have all the tools at our disposal to shape Italian society, and now we only have to use them. We shall start a mass propaganda campaign to show the people the glory of warfare and to destroy the pacifist rhetoric of our enemies."
 ITA_reward_our_people: "Mantain the Populist Image"
 ITA_reward_our_people_desc: "Our movement was founded first and foremost as a proletarian one. Despite our intentions, elitism has started to slip into the movement, we won't let this continue or else we risk losing the purity of our ideals. We will always remain committed to the people of Italy above all else!"
 ITA_naval_support_designer: "Производитель морских пушек"
 ITA_pacify_libya: "Умиротворение Ливии"
 ITA_pacify_libya_desc: "Since 1911, Libya has been a hotbed of resistance. Its time to crush the insurgents and turn this patch of desert into a model colony."
 ITA_board_of_corporations: "Establish the Board of Corporations"
 ITA_board_of_corporations_desc: "We shall organize a new board to organize the various sectors of Italian society, such as unions and businesses that will allow our government to regulate the relationship between workers and their employers. This will be the start of the process to end class warfare and bring about our corporatist vision."
 ITA_true_national_syndicalism: "Recognize the Place of The Proletariat"
 ITA_true_national_syndicalism_desc: "Corradini's vision for Italy has always been as a fundamentally proletarian nation. Unlike other right-wingers, we are not opposed to labor unions or materialist thought. We shall give workers and their unions a say in our government to sway them away from socialism and to fulfill the original vision of our movement."
 ITA_recognize_the_agrarian_group: "Recognize the Agrarian Group"
 ITA_recognize_the_agrarian_group_desc: "One of the key sectors of Italian society has always been the farmers. They have been neglected and marginalized for far too long. We won't let this stand any longer. Farmers shall be given direct representation in our government, so their interests can be truly represented."
 ITA_draw_closer_to_the_military: "Draw Closer to the Military"
 ITA_draw_closer_to_the_military_desc: "Corradini always hoped the ANI would become a mass proletarian movement, but the fact is that most of the proletarians are at best distrustful of us, but there is another group willing to support us and that's the army. We are not ungrateful and to ensure their continued support, we'll make sure they get the proper funding and respect they are owed."
 ITA_a_fever_of_nationalism: "Fan the Flames of Nationalism"
 ITA_a_fever_of_nationalism_desc: "Despite its relative uncontrollability, Italian nationalism is one of the most powerful weapons of national mobilization. Italians beyond our borders are awaiting reunification with their motherland, and by fanning the flames of Italian nationalism, we will achieve it!"
