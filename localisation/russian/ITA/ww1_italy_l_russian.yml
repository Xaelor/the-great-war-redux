 ITA_debt_first_warning: "§LДолг начинает расти. Можно взять еще один без последствий, но, возможно, стоит изучить другие варианты.§!"
 ITA_debt_second_warning: "§LДолг достигает высокого уровня. Если взять больше, послевоенные проблемы станут неизбежными.§!"
