 ITA_trickle_down_economics: "Подход свободного рынка"
 ITA_trickle_down_economics_desc: "The government has in the past taken a dramatic role in pushing through industrialization and economic growth, and what good has it done us? We must stop doubling down on this method and instead let the free market do its own thing."
