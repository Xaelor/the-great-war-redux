 ITA_the_conductor_and_his_choir: "Взаимная помощь рабочим"
 ITA_the_conductor_and_his_choir_desc: "Рабочий класс сильно поддерживает социализм из-за озабоченности по поводу надёжной социальной защиты и регулирования их прав. Решив проблемы, которые волнуют рабочих, мы устраним саму потребность в социализме. Нам следует попытаться улучшить нашу социальную политику, перестав сопротивляться переменам, и даже приветствуя их. После такого поворота социалистическому движению тогда лучше позаботиться о самом себе."
 ITA_inform_about_that_one_focus: "Фокус §YИспользовать сельское хозяйство Юга§! будет теперь требовать хотя бы §Y3 уровень инфраструктуры§! в регионах §YКомпания§! и §YКалабрия§! перед тем, как он может быть взят."
