 ITA_assist_employees: "Помочь рабочим"
 ITA_assist_employees_desc: "Luzzati might be a classical liberal, but that does not mean he's completely against government intervention. We shall pursue moderate labour reforms to ensure our workers are treated fairly and with dignity even if this might be slightly detrimental to our economy."
 ITA_hands_off_approach: "Подход «руки прочь»"
 ITA_hands_off_approach_desc: "There's a simple fact about economics that must be accepted: the more the government intervenes, the worse the economy will fare. We shall allow business owners to dictate terms to their employees as they deem fit or else we risk stifling their productivity."
 ITA_reverse_our_decline: "Уроки австрийской экономической школы"
 ITA_reverse_our_decline_desc: "Though we loath copying economic ideas from Vienna, the Austrian school's emphasis on low regulations and free market forces has the potential to bring economic prosperity to the nation."
 ITA_trade_deal_with_france: "Оживить юг"
 ITA_trade_deal_with_france_desc: "Our government has generally been reluctant to directly intervene in the economy for ideological reasons, but it's clear the south is in dire need of help or else it will never reach economic parity with the north. We will make limit and well planned investments in southern business to help bring it forth into the 20th century."
 ITA_shore_up_the_classic_liberals: "Придерживаться классического либерализма"
 ITA_shore_up_the_classic_liberals_desc: "In recent years, there have been some calls for increased intervention in the economy and the creation of a welfare state, but that would only cause bloat and a sluggish economy. We shall maintain our course of limited intervention and support business people to ensure future growth and prosperity."
 ITA_ban_striking: "Криминализировать забастовки"
 ITA_no_room_for_dissent: "Нет места для инакомыслия"
 ITA_reform_colonial_policy: "Реформировать нашу колониальную политику"
 ITA_reform_colonial_policy_desc: "Our policy towards our small colonies has been a mixed bag. It was our lack of action that stopped us from grabbing Tunisia before the French could. The colonies need proper investments to be profitable."
 ITA_reformed_colonial_policy: "Реформированная колониальная политика"
 ITA_agricultural_credit_bank: "Национальный с/х кредитный банк"
 ITA_agricultural_credit_bank_desc: "Even though the PSI is less favored in the rural parts of Italy, we can't ignore them and their concerns. The farmers are the backbone of our country and we must ensure they are able to provide for themselves and sustain their farms. We can support their efforts by establishing a national agricultural credit bank, and boost the output of agricultural goods in rural Italy."
 ITA_one_step.tt: "Мы будем на один шаг §Gближе§! к получению:"
 ITA_lib_order.tt: "Как только все эти решения завершены:"
 ITA_war_pows: "Использовать военные полномочия"
 ITA_war_pows_desc: "During the lead up to our entry into the Great War Parliament passed a piece of legislation granting the government extraordinary powers in the case of a war. Now with the war it is time we put these powers to use for the defense of the nation."
 ITA_comprehensive_national_strategy: "Comprehensive National Strategy"
 ITA_comprehensive_national_strategy_desc: "The Great War is straining every resource of our state and society. Without a well-thought-out national strategy for organising the country's affairs in wartime, Italy would fall victim to internal problems sooner than to the enemy's weapons. We must build a well-oiled machine for the distribution of resources and food, one that will sustain the home front whilst the army is at war."
 ITA_interwar_update_sometime: "§LThank you for playing the§! §GItali§!an re§Rwork§!§L, this is where the§! §Yfocus tree§! §Lcontent ends for now! In a future update, interwar content will be expanded to encapsulate content from§! §Y1919-1925§!"
