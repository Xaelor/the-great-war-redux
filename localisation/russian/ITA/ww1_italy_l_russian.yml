 ITA_destroy_the_government: "Purposeful Destruction of the Government"
 ITA_tap_into_our_resource_potential: "Develop the Red Belt"
 ITA_militant_pacifism: "Militant Pacifism"
 ITA_militant_pacifism_desc: "The larger desire which animates many men is the passionate longing for an end of all war. But checking this desire, strangling this hope, are two widespread dogmas: the psychological dogma that man is inevitably a fighter and the ethical dogma that through war, and through war alone, he can rise to the supreme height of self-sacrifice."
 ITA_tax_churches: "Налоги для церкви"
 ITA_fund_catholic_schools_decision: "Финансировать католические школы"
 ITA_democratic_socialism: "Социализм через реформизм"
 ITA_democratic_socialism_desc: "The Reformist faction within the PSI has gained the upper hand. Even better, they were right to embrace the democratic process as they are now in government. We can now enjoy the fruits of socialism without having to worry about losing their freedom."
 ITA_cut_the_military_budget: "Сократить военный бюджет"
 ITA_a_dark_horse_emerges: "Великий гамбит Джолитти"
 ITA_a_dark_horse_emerges_desc: "No one knows what was going through Giolitti's mind when he put forth Enrico Corradini and, by extension, the ANI as his successor, maybe a hope of moderating them like he has attempted with socialists. Now the only certain thing is that, in the coming years, Italy will be molded by a ultranationalist and corporate vision of the future."
