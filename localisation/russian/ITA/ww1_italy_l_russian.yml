 ITA_giolittian_shadow: "Построение коалиции"
 ITA_giolittian_shadow_desc: "Хотя в парламенте почти нет откровенных врагов, правда в том, что у нас нет прочной базы поддержки. Если бы Джолитти или Соннино захотели вернуть себе этот пост, они получили бы его мгновенно. Нам нужно начать предпринимать шаги для создания более прочной базы поддержки."
 ITA_giolitti_era: "Продолжить эру Джолитти"
 ITA_giolitti_era_desc: ""
 ITA_daneo_credaro_law: "Закон Данео-Кредаро"
 ITA_daneo_credaro_law_desc: "Для эффективного образования нашего населения и повышения грамотности наша образовательная система должна стать более централизованной для лучшего управления финансированием. Луиджи Кредаро и Эдоардо Данео предложили новый закон, который проведёт множество реформ в школьной системе для решения этой задачи."
 ITA_overtures_to_the_psi: "Предложения к PSI"
 ITA_overtures_to_the_psi_desc: "Правительства в прошлом пытались делать вид, что социалистическая партия не существует, — эта стратегия больше нереалистична. Мы должны обратиться к ИСП и посмотреть, сможем ли мы заручиться их поддержкой некоторых пунктов нашей левоцентристской повестки."
 ITA_avoid_offensive_policies: "Твердый либерализм"
 ITA_avoid_offensive_policies_desc: "Левоцентристы и правоцентристы составляют большинство в итальянском парламенте. Конечно, у нас может не быть их лояльности, как у Джолитти, но кто сказал, что мы всё равно не можем подружиться с ними? Давайте попробуем заручиться их твёрдой поддержкой."
 ITA_embrace_nationalism: "Принять национализм"
 ITA_embrace_nationalism_desc: "Итальянский национализм пылает огнём со времён Наполеона, и его недавнее возрождение в поддержку наших амбиций по расширению границ даёт нам прекрасную возможность использовать националистическую риторику. В основном одними словами мы можем разжечь бешеную поддержку."
 ITA_friend_of_the_south: "Друзья с юга"
 ITA_friend_of_the_south_desc: "Юг испытывает глубокую неприязнь к северным политикам, таким как Джолитти. Поскольку наше влияние на севере оказывается под угрозой со стороны социалистов, обеспечение поддержки юга может оказаться решающим для сохранения большинства в парламенте. Давайте попытаемся примириться с ними."
 ITA_promote_creation_of_workers_councils: "Содействовать созданию рабочих советов"
 ITA_promote_creation_of_workers_councils_desc: "Один из способов продвижения социализма на местном уровне - это помочь рабочим организоваться. Профсоюзы, безусловно, хороши, но мы можем пойти дальше. Помогая создавать рабочие советы по всей Северной Италии, мы можем значительно увеличить контроль рабочих над экономикой."
 ITA_the_welfare_state: "Строительство государства всеобщего благосостояния"
 ITA_the_welfare_state_desc: "Бедность является главной причиной многих проблем. Преступность, радикализация и даже трагические случаи смерти от недоедания или медицинских расходов - всё это может быть результатом бедности. Какая проблема может быть важнее борьбы с этой чумой общества? Правительство должно играть большую роль в сокращении бедности и создании системы социальной защиты для наших граждан."
