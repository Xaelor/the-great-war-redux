 ITA_moderate_protectionism: "Препятствовать удушению отечественной промышленности"
 ITA_moderate_protectionism_desc: "We've long levied high tariffs on foreign countries to protect our domestic industry, and with the growth of the German industrial economy as well as the impressive agricultural advancements across the world, our industries are once again under threat. We must adjust our tariffs higher accordingly to secure our saftey."
 ITA_mussolini_kicked: "§YBenito Mussolini§! has been §Rexpelled§! from the §oPSI§!"
 ITA_investments_in_balkan: "Мы получим серию событий о возможностях инвестиций в несколько балканских стран. Они будут стоить §Yполитической власти§!, но после завершения могут предоставить нам снижение затрат на §Yпотребительские товары§!. §RЕсли мы начнём войну со страной, в которую инвестируем, наши вложения будут потеряны. Кроме того, если страна, в которую мы инвестируем, будет оккупирована иностранным государством, наши вложения также будут потеряны.§!"
