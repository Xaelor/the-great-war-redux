l_russian:
 komuch_focus: "Дерево фокусов КОМУЧа"
 KOM_consolidate_power: "Укрепить Учредительное собрание"
 KOM_consolidate_power_desc: "Переворот, совершённый нами благодаря прибытию доблестных чехословацких войск в Самару, был проведён во имя великого принципа народного суверенитета и независимости России. Ближайшая цель КОМУЧа — укрепить авторитет Учредительного собрания и создать Народную армию для борьбы с внешним врагом."
 KOM_mobilisation_of_the_peoples_army: "Мобилизация Народной армии"
 KOM_mobilisation_of_the_peoples_army_desc: "Первая и священная обязанность каждого борца против большевиков — стремление к общей, скоординированной борьбе... независимо от политических взглядов и партийной принадлежности."
 KOM_form_the_governing_council: "Сформировать Правящий совет"
 KOM_form_the_governing_council_desc: "У нас есть необходимость выделить специальный «упорядоченный» управленческий аппарат, подотчётный Комитету, но в определённой степени автономный от него."
 KOM_contact_anti_bolshevik_forces: "Связаться с антибольшевистскими силами"
 KOM_contact_anti_bolshevik_forces_desc: ""
 RCW_lack_of_officers: "Нехватка офицеров"
 IZH_union_of_front_line_soldiers: "Союз фронтовиков"
 IZH_factory_country: "Город-завод"
 FER_partisans: "По долинам и по взгорьям"
 FER_partisans_desc: "По долинам и по взгорьям шли дивизии вперёд, Чтобы с боем взять Приморье — белогвардейцев оплот."
 RCW_capture_the_gold_reserves: "Захватить Императорский золотой запас"
 RCW_capture_the_gold_reserves_desc: "С началом Великой войны, для обеспечения безопасности государственного золотого запаса Российской империи, находившегося в Петрограде, он был эвакуирован поездом в Казань и Нижний Новгород.\n\nПосле революции туда же было перевезено золото из других городов: Воронежа, Тамбова, Самары, Курска, Могилёва и Пензы. В итоге в Казани сосредоточено более половины золотого запаса Российской империи."
 RCW_add_x_to_gold_reserve: "Это будет стоить нам $RIGHT|H1%$ нашего §HЗолотого запаса§!"
 RCW_has_more_than_x_gold_reserve: "У нас более $RIGHT|H1%$ в нашем §HЗолотом запасе§!"
 RUS_state_flag: "Сформировало Всероссийское правительство"
 ww1_rcw.10.t: "Падение Казани!"
 ww1_rcw.10.d: "Мы получили плохие новости о падении Казани. Наши враги предприняли мощную атаку на этот стратегический город, чтобы украсть императорский золотой запас, а вся Академия Генерального штаба перешла на сторону Белого движения. Прямо сейчас нам нужно мобилизовать рабочих в Ижевске, чтобы быстро организовать контратаку и вернуть город."
 ww1_rcw.10.a: "Товарищи! Будем сражаться... правильно?"
 lead_to_IZH_uprising: "§rЭто определённо приведёт к восстанию в Ижевске и Воткинске.§!"
 ww1_rcw.11.t: "Казань освобождена"
 ww1_rcw.11.d_komuch: "После двух дней боёв Казань взята совместными силами Самарского отряда Народной армии и чехословаков вместе с Речной флотилией. Трофеи неисчислимы, мы захватили золотой запас России — 650 миллионов. Вся Академия Генерального штаба перешла на сторону Белого движения."
 ww1_rcw.11.d: "После двух дней боёв Казань взята совместными силами нашей армии и чехословаков вместе с Речной флотилией. Трофеи неисчислимы, мы захватили золотой запас России — 650 миллионов. Вся Академия Генерального штаба перешла на сторону Белого движения."
 ww1_rcw.11.a: "Войска сражались хорошо."
 ww1_rcw.12.t: "Падение Казани"
 ww1_rcw.12.d_komuch: "После двух дней боёв Казань взята совместными силами Самарского отряда Народной армии и чехословаков вместе с Речной флотилией. Захвачены огромные склады с оружием, боеприпасами, медикаментами, припасами и золотой запас России. Вся Академия Генерального штаба перешла на сторону Белого движения."
 ww1_rcw.12.d: "После двух дней боёв Казань взята совместными силами Белой армии и чехословаков вместе с Речной флотилией. Захвачены огромные склады с оружием, боеприпасами, медикаментами, припасами и золотой запас России. Вся Академия Генерального штаба перешла на сторону Белого движения."
 ww1_rcw.12.a: "Нас ждут ещё более великие победы!"
 ww1_rcw.12.b: "Только не золото!"
 ww1_rcw.12.c: "Впечатляет."
 komuch.1.t: "Приказ № 1"
 komuch.1.d: "Именем Учредительного собрания большевистское правительство в Самаре и Самарской губернии объявляется низложенным. Все комиссары смещаются со своих должностей. Местные органы самоуправления, распущенные Советской властью — городские думы и земские управы, — полностью восстанавливаются и обязуются немедленно приступить к работе. Все ограничения и ущемления свободы, введённые большевистскими властями, отменяются, восстанавливаются свобода слова, печати, собраний и митингов. Комиссары и руководители советских предприятий обязаны в трёхдневный срок сдать все дела вновь восстановленным органам, по принадлежности, или лицам, назначенным Комитетом. Революционный трибунал, как орган, не соответствующий истинным народно-демократическим принципам, упраздняется, восстанавливается окружной народный суд. Единая, независимая, свободная Россия. Вся власть Учредительному собранию. Таковы лозунги и цели нового революционного правительства."
 komuch.1.a: "Вся власть народу!"
 komuch.2.t: "Вопрос о Всероссийском правительстве"
 komuch.2.d: "Одна из вещей, которую нам предстоит решить при создании Всероссийского правительства, — признать ли Учредительное собрание, созданное в подконтрольной большевикам России.\nБольшевики думали, что выиграют выборы, потому что русский народ признал большевистскую диктатуру, но было создано Учредительное собрание, в котором большинство голосов получила партия эсеров. Большевики разогнали его и заставили исчезнуть, но некоторые члены Учредительного собрания продолжают бороться против большевиков в форме так называемого КОМУЧа, Комитета членов Учредительного собрания.\nЕсли мы признаем Учредительное собрание при формировании Всероссийского правительства, это будет означать, что парламентская власть перейдёт к ним."
 komuch.2.a: "Сформировать Всероссийское правительство с Сибирью"
 komuch.2.b: "Мы не договариваемся с реакционерами"
 komuch.3.t: "[FROM.Capital.GetName] предлагает сформировать Всероссийское коалиционное правительство"
 komuch.3.d: "Местное правительство в [FROM.Capital.GetCapitalVictoryPointName] обратилось с просьбой о присоединении к Временному Всероссийскому правительству, заявляя, что все русские должны сплотиться воедино, чтобы защитить Россию от большевиков и красной угрозы."
 komuch.4.d: "[From.GetNameDefCap] ответил, что не может признать легитимность Учредительного собрания. Переговоры были прерваны, и предложение отклонено."
 komuch.4.a: "Они идут против воли народа!"
 ww1_izhevsk.1.t: "Организация власти"
 ww1_izhevsk.1.d: "С освобождением города от большевистской тирании Ижевско-Воткинское рабочее восстание находится на распутье. Чтобы обеспечить своё будущее и легитимность, мы должны немедленно сформировать временное правительство для организации нашей обороны и управления. В рамках более широкой борьбы против красных мы признаём Комитет членов Учредительного собрания в Самаре законной властью в России. Наша судьба теперь связана с делом свободной, демократической России."
 ww1_izhevsk.1.a: "Покончим с этим хаосом"
 ww1_izhevsk.2.t: "Пополнение для Народной армии"
 ww1_izhevsk.2.d: "В нашу армию вступают люди — как простые рабочие, так и ветераны Великой войны — с желанием бороться против большевиков. Мы также получили дополнительное снаряжение после серьёзных столкновений с врагом."
 ww1_izhevsk.2.a: "Отлично!"
 ww1_izhevsk.3.d: "Недавно объявленная мобилизация увеличивает нашу армию, хотя это и ведёт к падению её морального духа."
 ww1_izhevsk.3.a: "Что ж..."
 ww1_izhevsk.4.t: "Принудительная мобилизация"
 ww1_izhevsk.4.d: "Какая ирония! Мы подняли восстание против мобилизации, но теперь вынуждены проводить её из-за нехватки людей в армии. Всё идёт по плану?"
 ww1_izhevsk.4.a: "Всё против большевизма!"
 ww1_izhevsk.4.b: "Нет"
 ww1_izhevsk.5.t: "Вопрос о реформах большевиков"
 ww1_izhevsk.5.d: "Хотя мы боремся против красных, они ввели много новых законов, которые понравились рабочим. Стоит ли нам их отменять?"
 ww1_izhevsk.5.a: "Оставить как есть"