l_russian:
 ww1_agadir.1.t: "Французский захват Марокко"
 ww1_agadir.1.d: "Французы сделали свой ход. Под предлогом восстановления порядка их войска вступили в Фес и теперь укрепляют контроль над султанатом. Наши дипломаты в Париже сообщают, что набережная Орсе намерена превратить Марокко в полноценный протекторат – с нашего согласия или без него.\nЭто прямой удар по престижу Германии и нашим торговым интересам в регионе. Кайзер в ярости, и Адмиралтейство уже призывает к демонстрации силы. Однако мы должны тщательно выбрать ответ. Преждевременный ультиматум может объединить Британию и Францию против нас; но слишком долгое ожидание может заставить нас выглядеть слабыми и позволить французам поставить нас перед свершившимся фактом.\nКакой курс мы изберём?"
 ww1_agadir.1.a: "Выждать подходящий момент."
 ww1_agadir.1.b: "«Пантера» должна прыгнуть сейчас!"
 ww1_agadir.2.t: "Немцы требуют компенсацию"
 ww1_agadir.2.d: "Берлин наконец показал свои карты. Германское правительство, используя «прыжок Пантеры» как дубину, требует полной уступки наших территорий в Центральной Африке – всего Французского Конго и права преимущественной покупки Бельгийского Конго – в качестве «компенсации» за их отказ от Марокко.\nЭто шантаж, чистый и простой. Однако мы должны тщательно взвесить наши варианты. Париж ещё не готов к полномасштабной войне, и наши британские союзники дали нам лишь сдержанные обещания поддержки. Прямой отказ может означать войну на Рейне; но уступка этим абсурдным требованиям станет унижением, которое почувствует вся империя.\nКак нам ответить на германскую ноту?"
 ww1_agadir.2.a: "Англия и Россия поддержат нас!"
 ww1_agadir.2.b: "Избегать эскалации любой ценой."
 ww1_agadir.3.t: "Франция отказывается – требования по Конго отклонены"
 ww1_agadir.3.d: "Париж официально отклонил наше требование о передаче Французского Конго. Вместо того чтобы принять сделку, французское правительство решило тянуть время и отнеслось к нашему ультиматуму с пренебрежением.\nКайзер в ярости, но Генеральный штаб советует проявить терпение. Мы чётко обозначили свою позицию; теперь мяч на их стороне. Мы подождём и посмотрим, сможет ли британское или российское посредничество привести Францию к благоразумию – или нам придётся готовиться к более решительному ответу."
 ww1_agadir.3.a: "Пусть почувствуют давление"
 ww1_agadir.4.t: "Немецкая канонерка прибывает в Агадир"
 ww1_agadir.4.d: "Германская империя направила канонерскую лодку SMS Panther в порт Агадир под предлогом защиты германских торговых интересов после нашего вмешательства в Марокко. Крейсер SMS Berlin прибыл несколькими днями позже. Наши дипломаты контактировали со своими германскими коллегами, и мы полностью ожидаем, что Кайзер вскоре представит нам свои требования."
 ww1_agadir.4.a: "Будем надеяться, их требования не будут слишком суровыми..."
 ww1_agadir.5.t: "Франция отклоняет германские требования"
 ww1_agadir.5.d: "Сегодня днём мы получили известие о том, что французское правительство отклонило наши требования по кризису в Агадире. Их страна начинает мобилизацию армии, и наше собственное военное командование призывает к немедленному ответу. Мы на распутье: отступить и столкнуться с международным унижением или объявить войну и ввергнуть Европу в конфликт невиданного масштаба. Кайзер и его правительство должны решить."
 ww1_agadir.5.a: "Начать мобилизацию."
 ww1_agadir.5.b: "Мы должны отступить."
 ww1_agadir.6.t: "Франция уступает Нойкамерун"
 ww1_agadir.6.t_no_escalation: "Франция уступает Конго"
 ww1_agadir.6.d: "Наши дипломаты сообщили нам, что кризис с Францией урегулирован мирным путём. Опасаясь более широкой войны, французы согласились уступить часть Французского Конго в качестве компенсации за их приобретения в Марокко. Хотя это не та грандиозная колониальная победа, на которую некоторые надеялись, мы получили ценную уступку и утвердили наше влияние на мировой арене."
 ww1_agadir.6.d_no_escalation: "Наши дипломаты сообщили нам, что кризис с Францией урегулирован мирным путём. Опасаясь более широкой войны, французы согласились уступить Французское Конго в качестве компенсации за их приобретения в Марокко. Это грандиозная колониальная победа, на которую мы надеялись, мы получили ценную уступку и утвердили наше влияние на мировой арене."
 ww1_agadir.6.a: "Значит, в этом году войны не будет."
 ww1_agadir.7.t: "Франция вступает в Фес"
 ww1_agadir.7.d: "Французы вступили в Фес под предлогом «защиты султана» и «восстановления порядка». Париж явно готовится ввести полный протекторат над Марокко – без консультаций с нами и без уважения к нашим историческим претензиям на север.\nЕсли мы будем бездействовать, нас маргинализируют. Наши интересы в Рифе, на побережье и в стратегических городах Тетуан и Лараш будут растоптаны французскими амбициями. Время действовать сейчас – пока кризис не втянул Германию и Британию и пока ситуация не стала необратимой."
 ww1_agadir.7.a: "Оккупировать Северное Марокко"
 ww1_agadir.8.t: "Установлен испанский протекторат в Марокко"
 ww1_agadir.8.d: "С урегулированием Агадирского кризиса Франция согласилась разделить Марокко на два отдельных протектората. Теперь мы будем управлять северными территориями, обеспечивая наши интересы в регионе."
 ww1_agadir.8.a: "Тост за наших французских друзей!"
 ww1_agadir.9.t: "Кризис уходит"
 ww1_agadir.9.d: "Германия затянула переговоры, не выдвигая никаких требований к Франции. Правительство империи критикует министра иностранных дел за медлительность и пассивность в конфликте."
 ww1_agadir.9.a: "Упущенная возможность!"
 ww1_agadir.10.t: "Финансовый кризис в Берлине"
 ww1_agadir.10.d: "Эскалация кризиса в Агадире вызвала финансовую панику в Германской империи. Сегодня утром стало известно, что фондовый рынок упал на 30% за один день. Экономисты предупреждают, что Рейхсбанк может потерять пятую часть своих золотых резервов, что потенциально может вынудить Германию отказаться от золотого стандарта, если правительство не сможет разрешить ситуацию.\nВ финансовых кругах даже шепчутся о французском саботаже, направленном на ослабление нашей позиции через экономическую войну."
 ww1_agadir.10.a: "Scheisse..."
 ww1_agadir.11.t: "Германия отказывается отступать!"
 ww1_agadir.11.d: "Несмотря на биржевой крах и колоссальное финансовое давление, Германская империя не отступила от кризиса в Агадире и теперь начала мобилизацию своей армии. В ответ Франция делает то же самое. Мы подтвердили нашу поддержку [FRA.GetNameDef] и высказались за мирное урегулирование, но ситуация становится всё более напряжённой с каждым часом."
 ww1_agadir.11.a: "Возможно, мы зашли слишком далеко."
 ww1_agadir.11.b: "Мы будем дома к Рождеству!"
 ww1_agadir.11.c: "Мы должны внимательно следить за ситуацией."
 ww1_agadir.12.t: "«Прыжок Пантеры»"
 ww1_agadir.12.d: "Имперская германская канонерская лодка SMS Panther прибыла в порт Агадир на атлантическом побережье Марокко. Судно в сопровождении лёгкого крейсера SMS Berlin встало на якорь сегодня утром под предлогом «защиты германских граждан и коммерческих интересов» в регионе.\nЭто внезапная демонстрация силы, уже получившая название «прыжок Пантеры» в международной прессе, широко рассматривается как прямой вызов французскому влиянию в Марокко. Всего через несколько недель после того, как французские войска заняли Фес, Германия теперь сигнализирует о своём намерении требовать компенсацию за любой будущий французский контроль над султанатом.\nЭтот шаг ошеломил дипломатов в Париже и Лондоне, которые рассматривают его как просчитанную провокацию. Хотя Берлин настаивает на мирном характере миссии, наблюдатели предупреждают, что Европа может оказаться на грани нового крупного кризиса."
 ww1_agadir.12.a: "Это акт агрессии!"
 ww1_agadir.12.b: "Мы защищаем свои интересы!"
 ww1_agadir.12.c: "Они защищают свои интересы!"
 ww1_agadir.13.t: "Кризис назревает в Марокко"
 ww1_agadir.13.d: "По просьбе осаждённого марокканского султана французские силы вмешались, чтобы подавить восстание близ Феса. После того как мятежники рассеяны, Франция движется к укреплению своего контроля над страной, фактически аннексируя её в качестве протектората.\nЭто одностороннее действие разрушило соглашения Альхесирасской конференции. Международное сообщество теперь опасается ответа Германии. Вероятно, Кайзер отреагирует решительно, чтобы отстоять германские интересы, возможно, потребовав компенсацию. Столицы Европы наблюдают и ждут, поскольку ситуация может легко перерасти в более широкий кризис."
 ww1_agadir.13.a: "Наш контроль не подлежит обсуждению."
 ww1_agadir.13.b: "А как же Альхесирасская конференция?"
 ww1_agadir.13.c: "Европа наблюдает и ждёт."
 ww1_agadir.13.e: "Итак, французы хотят испытать нашу решимость..."
 ww1_agadir.13.f: "Отличная возможность для [SPR.GetNameDef]!"
 ww1_agadir.14.t: "Германия отступает"
 ww1_agadir.14.d: "После того как [FRA.GetNameDefCap] аннексировало Марокко, Германская империя разместила канонерскую лодку SMS Berlin в Агадире в попытке добиться уступок. Этот шаг имел обратный эффект, вызвав финансовую панику в [GER.GetForeignNameDef]. Фондовый рынок рухнул, а Рейхсбанк потерял пятую часть своих золотых резервов.\nЧтобы предотвратить полный коллапс, правительство Кайзера было вынуждено унизительно отступить, отозвав SMS Berlin из Агадира. Для [FRA.GetNameDef] это везение, но [GER.GetForeignNameDef] теперь будет вынуждена сесть за стол переговоров, чтобы разрешить кризис и спасти то немногое, что осталось от её престижа."
 ww1_agadir.14.a: "Теперь их требования, должно быть, скромнее."
 ww1_agadir.14.b: "Возможно, нам следует публично поддержать французскую позицию."
 ww1_agadir.15.t: "Агадирский кризис урегулирован!"
 ww1_agadir.15.d.forcongo: "После периода интенсивных переговоров французские и германские дипломаты урегулировали Агадирский кризис. В обмен на признание Германией французского протектората в Марокко Франция уступила территорию «Нойкамерун» из Французского Конго Германскому Камеруну. Европа может вздохнуть с облегчением, пока что. Этот исход является значительным, если не полным, успехом для [GER.GetForeignNameDef], хотя кризис также осложнил международные отношения."
 ww1_agadir.15.d.forcongo_full: "После периода интенсивных переговоров французские и германские дипломаты урегулировали Агадирский кризис. В обмен на признание Германией французского протектората в Марокко Франция уступила территорию Французского Конго Германскому Камеруну. Европа может вздохнуть с облегчением, пока что. Этот исход является полным успехом для [GER.GetForeignNameDef]."
 ww1_agadir.15.a: "Мир наконец."
 ww1_agadir.15.b: "По крайней мере, мы что-то получили..."
 ww1_agadir.15.c: "Ясная победа для нашей нации!"
 ww1_agadir.15.d: "Ну, по крайней мере, войны нет..."
 ww1_agadir.16.t: "Кризис предотвращён"
 ww1_agadir.16.d: "Неожиданно для дипломатов по всей Европе, [GER.GetForeignNameDefCap] отказалась от эскалации ситуации в Марокко, избежав крупного колониального кризиса. Многие рассматривали развивающийся Агадирский кризис как верный признак надвигающейся войны, но этот внезапный разворот [GER.GetAdjective] политики отвёл континент от пропасти.\nОднако разрешение не обошлось без последствий. Соединённое Королевство открыто критиковало [FRA.GetAdjective] правительство за его провокационные действия, ставя под сомнение прочность Антанты. Похоже, что, хотя мир был сохранён, союзы, призванные его защищать, ослабли."
 ww1_agadir.16.a: "Хрупкий мир."
 agadir_crisis_mission: "$great_power_politics_scramble_for_africa_tt_icon$ Исход Агадирского кризиса"
 FRA_agadir_outcome_tt: "§Y[GER.GetForeignNameDefCap]§! может §Rобострить ситуацию до войны§! или §Gотступить§!"
 GER_agadir_outcome_tt: "Мы ждём ответа от §Y[FRA.GetNameDefCap]§!, если они не ответят, мы можем §Rобострить ситуацию до войны§! или §Gотступить.§!"
 FRA_send_compensation: "$great_power_politics_scramble_for_africa_tt_icon$ Отправить компенсацию"
 FRA_crash_german_stock_markets: "$great_power_politics_scramble_for_africa_tt_icon$ Обить германские фондовые рынки"
 GER_moroccan_crisis: "Второй марокканский кризис"
 GER_moroccan_crisis_fast_solution: "Без эскалации в марокканском кризисе"