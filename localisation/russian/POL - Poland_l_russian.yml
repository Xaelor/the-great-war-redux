 idea_POL_The_patchwork_army_desc:0 "Солдаты и офицеры новой польской армии набираются из людей воевавших по разные стороны фронта. С одной стороны "австрийские" легионеры, с другой бойцы польского вермахта, а также чины бывшей русской армии. Так или иначе, всё это приводит к фрагментации вооруженных сил."
