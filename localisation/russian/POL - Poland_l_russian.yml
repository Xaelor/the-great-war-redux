 ### Leaders ###
 POL_jozef_pilsudski_desc:0 "Социальный и борющийся за независимость деятель, бывший лидер Польской социалистической партии, основатель бойцовской организации PPS и Польской военной организации, командир первой бригады Польских легионов — Józef Piłsudski, окружённый культовой любовью среди своих солдат и сторонников, ненавидимый своими политическими противниками, — это харизматичная личность, стремящаяся установить диктаторскую власть в Польше в качестве Военного руководителя. Его характер похож на романтика и харизматичного мегаломаньяка XVIII века, его идол — Наполеон Бонапарт, которому он восхищается и чьего духа желает видеть над домом семьи Пилсудских при рождении Józef. Командир, так называемый его солдатами, — сторонник идеи имперской Польши как руководителя федерации стран, расположенных между Балтийским и Чёрным морем. На самом деле, будучи анти-русским политиком, бывшим сибирским ссыльным, Piłsudski скорее хотел бы видеть Россию в её этнографических границах. Во время заключения в Магдебурге немцами, его известность в стране и народе значительно выросла, и он стал человеком, на которого могли рассчитывать общество и левый спектр партий в условиях нарастающих социальных и революционных настроений в Польше."
 POLITICS_REGENCY_COUNCIL_1918_DESC:0 "Регентский Совет был создан немецкими и австро-венгерскими оккупационными властями на основе указа о государственной власти в Королевстве Польском, выданного этими властями. Полномочия Регентского Совета были ограничены в пользу оккупантов — в случаях, когда управление не было передано польским властям. Регентское правительство же, не возымело популярность и любовь среди общества, даже среди лояльно настроенных поляков."

