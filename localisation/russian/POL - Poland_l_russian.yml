 ### Events ##
 ww1_poland.1.title:0 "Возвращение Галлера в Польшу"
 ww1_poland.1.desc:0 "Галлер ранее решил порвать с австро-германцами и, пройдя немалый путь, прибыл во Францию, где был назначен командующим Польской армией во Франции. Первоначально армия находилась под французским политическим контролем. Однако позже контроль перешёл к Польскому национальному комитету во главе с Романом Дмовским.\n\nК концу войны силы под командованием Галлера, известные как «Армия Галлера» или «голубая армия» по цвету формы, достигли шести дивизий. Общая численность армии возросла до 70 тысяч солдат, и вместе со всем снаряжением было принято решение направить её в уже независимую и свободную Польшу."
 ww1_poland.1.a:0 "Рады приветствовать вас"

 ww1_poland.2.title:0 "Военная миссия в Польше"
 ww1_poland.2.desc:0 "Французская военная миссия и начавшиеся крупные поставки оружия в Польшу станут частью широкой стратегии поддержки молодой Второй Польской республики, недавно  обретшая независимость в условиях смуты и борьбы за власть. Наше правительство стремится способствовать формированию боеспособной польской армии, способной стать надёжным союзником в противостоянии как германской угрозе, так и наступлению большевистских сил."
 ww1_poland.2.a:0 "Потратим ресурсы на свои нужды"
 ww1_poland.2.b:0 "Польша будет забита нашим оружием"

 ww1_poland.3.title:0 "Французская военная поддержка"
 ww1_poland.3.desc:0 "Французская военная миссия и начавшиеся крупные поставки оружия в Польшу стали частью широкой стратегии поддержки молодой Второй Польской республики Францией, что недавно обрела независимость в условиях смуты и борьбы за власть. Французское правительство стремится способствовать формированию боеспособной польской армии, способной стать надёжным союзником в противостоянии как германской угрозе, так и наступлению большевистских сил."
 ww1_poland.3.a:0 "Неоценимая помощь"

 ww1_poland.4.title:0 "Франция отказывается от поддержки"
 ww1_poland.4.desc:0 "Французское правительство, видимо, из-за ухудшения отношений с нами или из-за нехватки нужного поставляемого снаряжения, вынуждено отказать нам в поставках оружия, и другой военной помощи, что, конечно, не может нас не огорчать, учитывая, как сильно нам это оружие необходимо в данный момент."
 ww1_poland.4.a:0 "Грустные вести однако"


