 ROM_carol_i_desc: "§YБожией милостью и волей нации, Король Румынии, Принц Гогенцоллерн-Зигмаринген.§!\n\n§LКороль Румынии Кароль I, принц Гогенцоллерн-Зигмаринген - любимый монарх, царствующий уже почти 50 лет, он провел свою страну через войну за независимость и в XX век. Но теперь, в возрасте более 70 лет, его связи с германской королевской семьей не предвещают ничего, кроме смутных времен.§!"
