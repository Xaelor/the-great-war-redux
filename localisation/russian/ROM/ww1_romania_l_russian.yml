 ww1_romania.173.d: "Переориентация Делавранчи Консервативной партии (КП) обратно в элитарную городскую партию оказалась крайне непопулярной среди сельского крыла КП, которое набирало влияние в последние годы. Поскольку Делавранча убрал аграриев с правительственных постов, многие из них начали покидать КП в целом. Они видят в Консервативно-демократической партии (КДП) всё более привлекательную альтернативу и решили, что их лучший шанс — с ними. Хотя это снизит фракционность, это также уменьшит общую численность нашей партии."
