 ROM_oppose_populism_desc: "Страх перед угрозами и откровенное заигрывание угрожают разорвать социальную ткань Румынии. Мы должны противостоять этим радикалам со всех сторон политического спектра и работать над их изоляцией, чтобы консолидировать румынскую политику вокруг тех, кто наиболее разумен."
