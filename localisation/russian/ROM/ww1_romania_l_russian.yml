 ROM_clense_the_party_desc: "КП слишком открыта и разнородна. Как мы можем работать с политиками внутри нашей же партии, если их взгляды столь радикально расходятся? Это просто не способствует сплочённому управлению. Мы очистим правительство от других фракций КП, будь что будет."
