 ROM_hungarian_war_surrender_limit_desc: "На протяжении сотен лет Венгрия контролировала Трансильванию, Словакию и другие территории, которые сейчас отнимают у нее экспансионистские поджигатели войны. Эти территории по праву принадлежат Венгрии, населены венграми, культурно являются венгерскими, какими они были на протяжении сотен лет, и мы не позволим никому отнять их у нас без боя."
