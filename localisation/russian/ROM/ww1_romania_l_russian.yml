 ww1_romania.78.t: "«Болото» требует защиты."
 ww1_romania.78.d: "Так называемое «болото» румынской политики, состоящее из назначаемых, а не избираемых государственных должностей, часто распределяемых среди друзей и родственников, выступает против кампании нашего правительства по снижению коррупции в правительстве. Особенно те, кто в НЛП, требуют защиты от этих усилий и угрожают выступить против нашего правительства, если мы не согласимся."
 ww1_romania.78.a: "Мы можем сделать некоторые исключения "
 ww1_romania.78.b: "Кем они себя возомнили?"
 ww1_romania.18.d: "С потерей доверия короля к нынешнему правительству нынешний премьер-министр был вынужден уйти в отставку. С вакантным постом премьер-министра королю теперь предстоит сформировать новое правительство. У короля есть несколько различных вариантов, и он должен выбрать лучший. Кто будет назначен для формирования следующего правительства?"
 ww1_romania.18.a: "КДП возглавит стабильное правительство!"
 ww1_romania.18.b: "Либералам должен быть дан еще один шанс"
 ww1_romania.77.c: "Давайте выберем аграриев из ПК."
 ww1_romania.77.e: "Барбу не должен сильно раскачивать лодку"
 ww1_romania.77.a: "С другой стороны, давайте пересмотрим на наши предыдущие варианты"
 ww1_romania.18.c: "Давайте назначим кого-то из ПК"
 ww1_romania.20.t: "Левые бойкотируют выборы в Бухарестский совет"
 ww1_romania.20.d: "В знак протеста против нового консервативного правительства НЛП и некоторые члены PCD решили бойкотировать выборы в Бухарестский совет. Демонстрируя низкую явку, они надеются доказать, что народ на самом деле не поддерживает консерваторов. Они могут это делать, так как это лишь обеспечит нашу победу на выборах. Однако консерваторы разделены на множество фракций. Хотя король назначил фракцию Карпа на пост премьер-министра, народу предстоит выбрать, какая консервативная фракция победит на этих выборах.\n\nОдин из кандидатов принадлежит к более элитарной, авторитарной группе консерваторов, близкой к Карпу. Они считают, что Румынии не нужны масштабные реформы, и что парламент получил гораздо больше власти, чем следовало бы. Другой кандидат происходит из антикарповской фракции консерваторов. В основном более молодые и центристские, они считают, что Карп представляет угрозу для румынской демократии, и выступают за более серьёзные экономические реформы."
 ww1_romania.20.a: "Прокарповская фракция побеждает!"
 ww1_romania.20.b: "Румынские младотурки побеждают!"
 ww1_romania.18.t: "Король назначает новое правительство "
 ww1_romania.17.d: "Недавно объявленные выборы в Румынии подошли к концу. После подсчёта голосов ПК была объявлена победителем выборов, одержав довольно крупную электоральную победу. Теперь у нас наконец будет мандат для проведения нашей повестки. Румынский народ по-прежнему ожидает продолжения реформ, поэтому мы должны быть осторожны в нашем руководстве. Неспособность управлять должным образом может привести к тому, что король Кароль просто отправит нас в отставку!"
 ww1_romania.77.t: "Какую фракцию ПК следует назначить?"
 ww1_romania.77.d: ""
 ww1_romania.17.a: "Наконец-то! Давайте приступим к управлению."
 ww1_romania.16.t: "ПК обвиняет нас в коррупции!"
 ww1_romania.16.d: "Члены ПК в последнее время усиливают свои атаки на нас, на этот раз обвиняя нас в фаворитизме в кабинете министров. Они утверждают, что правительство НЛП назначает на должности в кабинете неквалифицированных членов только за их лояльность, а не за заслуги. В основном это беспочвенно, но это наносит ущерб нашей поддержке среди населения. Король Кароль также приватно выразил свою обеспокоенность по этому вопросу Брэтиану, заявив, что в этом может быть доля правды, и что НЛП необходимо реформировать себя."
 ww1_romania.16.a: "Ложь и пропаганда!"
 ww1_romania.15.t: "Союз с НДП?"
 ww1_romania.15.d: "С объявлением альянса Консервативно-демократической партии и Национально-либеральной партии у нас появляется шанс сформировать наш собственный избирательный альянс. Хотя Национально-демократическая партия не так популярна, как Консервативно-демократическая партия, у неё есть своя небольшая, но преданная база поддержки. Кроме того, союз с Национально-демократической партией ещё больше символизирует сдвиг Консервативно-демократической партии влево в экономических вопросах. Это позволит нам обойти левую экономическую базу Национально-либеральной партии, что значительно поможет нам.\n\nОднако проблема в том, что Национально-демократическая партия может иметь свой багаж. Большинство населения считает Национально-демократическую партию крайне радикальной, и не без оснований. Национально-демократическая партия имеет историю использования насилия для получения политической поддержки, а некоторые члены Национально-демократической партии придерживаются... как минимум спорных взглядов на еврейскую общину. Это также разозлит короля Кароля, который уже считает, что Карп может быть слишком самоуверенным и радикальным, чтобы победить на выборах."
 ww1_romania.15.a: "Мы ответим огнём на огонь!"
 ww1_romania.15.b: "Что мы можем получить от этих глупцов?"
 ww1_romania.14.t: "НЛП объявляет о союзе с КДП"
 ww1_romania.14.d: "Поскольку Карп отверг просьбы короля о примирении с КДП, Национально-либеральная партия и Консервативно-демократическая партия объявили об избирательной коалиции для противодействия Консервативной партии. С этим альянсом чаша весов склонилась против Консервативной партии в пользу альянса НЛП-КДП. Хотя это и не идеально, мы должны сохранять уверенность в наших шансах на следующих выборах."
 ww1_romania.14.a: "Они отчаянно нуждаются в этом, это очевидно!"
 ww1_romania.13.t: "Консенсус центра."
 ww1_romania.13.d: "Недавнее формирование альянса Консервативной партии и Консервативно-демократической партии значительно усилило позиции коалиции в опросах. Хотя сначала многие предсказывали, что гонка будет абсолютно непредсказуемой, а некоторые эксперты даже видели склонность выборов в пользу Национально-либеральной партии, альянс Консервативной партии и Консервативно-демократической партии значительно укрепляет свои позиции по всей стране. Смещение правых к центру смягчило опасения крестьян, которые изначально беспокоились, что консерваторы будут выступать против новой земельной реформы, в то время как многие видят проблемы с Национально-либеральной партией и её коррупционными скандалами."
 ww1_romania.13.a: "Its time to turn a new leaf!"
 ww1_romania.12.t: "Александру Маргиломан предлагает... обеспечить «безопасность выборов»."
 ww1_romania.12.d: "Хотя консерваторы являются правящей партией, в значительной части страны сохраняется реформистский настрой. Многие политические эксперты называют гонку абсолютно непредсказуемой, а некоторые даже говорят, что выборы склоняются в пользу Национально-либеральной партии. Ещё одно правительство НЛП было бы неприемлемо, мягко говоря. Видя ситуацию, министр внутренних дел Александру Маргиломан предложил Карпу способ обеспечить нашу победу: вмешательство в выборы. Хотя это, конечно, не... морально безупречно, это действительно обеспечило бы победу."
 ww1_romania.12.a: "Что? Э-э, да, да, звучит отлично."
 ww1_romania.12.b: "Проявите немного уверенности в нас, Маргиломан!"
 ww1_romania.11.t: "Король Кароль просит нас сохранить предыдущую земельную реформу НЛП."
 ww1_romania.11.d: "Хотя последний законопроект о земельной реформе НЛП провалился, НЛП действительно провела множество значительных реформ после восстания 1907 года. С приходом консерваторов к власти некоторые члены партии, включая Карпа, считают, что следует рассмотреть вопрос об отмене некоторых из этих реформ. Король Кароль, очевидно, не согласен с этим, поскольку именно он изначально назначил либералов. Теперь, когда консерваторы пришли к власти, Кароль попросил Карпа занять позицию, которую многие консерваторы заняли в последнее время: полностью поддержать предыдущую земельную реформу и пообещать не отменять её. Это, по словам Кароля, необходимо для поддержания стабильности и предотвращения повторения 1907 года. Хотя Карп может не соглашаться, ясно, что Кароль настроен решительно по этому вопросу. Противодействие ему здесь может привести к тому, что он станет значительно менее уверен в нашем правительстве."
 ww1_romania.11.a: "Позволять королю диктовать партийную политику было бы плохим прецедентом."
 ww1_romania.11.b: "Не волнуйтесь, мы согласны, что эти меры разумны."
 ww1_romania.10.t: "Король Кароль просит Карпа примириться с КДП"
 ww1_romania.10.d: "Консервативно-демократическая партия (PCD) — ранее известная как Partidul Conservator-Democrat — и её соперничество с Консервативной партией (PC) широко известно. Возникнув как отколовшаяся фракция от КП, КДп позиционирует себя как самая умеренная из трёх основных румынских партий. Будучи в целом экономически умеренной и социально консервативной, КДП приобрела популярность после отделения от КП и самостоятельно формировала несколько правительств. Теперь, с приходом первого за многие годы консервативного правительства, король Кароль стремится обеспечить его стабильность. Поскольку КП и КДП сходятся во многих вопросах, а большинство лидеров КДП имеют опыт работы в КП, Кароль видит возможность формирования правоцентристского правительства из двух партий. Хотя сам Карп лично против этой идеи, она приветствуется многими умеренными в партии. Обеспечение поддержки правительства Каролем также будет иметь решающее значение для его выживания. Стоит ли рисковать, зля Кароля в этом вопросе?"
 ww1_romania.10.a: "С уважением, ваше величество, нам будет лучше без них."
 ww1_romania.10.b: "Хорошо, давайте сформируем коалиционное правительство."
 ww1_romania.9.t: "Формирование нового правительства."
 ww1_romania.17.t: "Консервативная партия получает большинство на выборах!"
 ww1_romania.9.a: "Посмотрим, как они справятся!"
 ww1_romania.9.d: "После провала земельной реформы премьер-министр Брэтиану решил уйти в отставку в знак протеста. Поскольку королю было поручено сформировать новое правительство, было решено дать шанс консервативной партии КП. Хотя КП была у власти в течение последних нескольких лет, она претерпела драматические изменения. Из откровенно элитарной партии PC осознала необходимость перемен и перебрендировалась, сместившись влево по ряду вопросов, включая трудовые права и экономику. Хотя Кароль назначил КП править, Кароль не тиран. Таким образом, были объявлены выборы, назначенные на 1911 год."
 ww1_romania.8.t: "Мечеть Кароля."
 ww1_romania.8.d: "Хотя мусульманское население в Румынии невелико, оно играет заметную роль. В знак уважения и солидарности с румынскими мусульманами, а также как жест доброй воли по отношению к Османской империи, король Кароль сегодня отдал приказ о начале строительства большой мечети в Констанце, одном из наших крупнейших городов. Хотя строительство будет идти медленно, этот амбициозный проект, несомненно, увеличит туристический поток в нашу страну после завершения."
 ww1_romania.8.a: "Мы — инклюзивная страна!"
 ww1_romania.1.t: "Кукловод."
 ww1_romania.28.t: "Начало Великой войны."
 ww1_romania.28.d: "Центральные державы против Антанты — это величайшая война в истории человечества. Учитывая наше ключевое положение в Европе, на нас обращено пристальное внимание, и все ждут, что мы предпримем. Хотя значительная часть нашего населения настроена либо проантантовски, либо за нейтралитет, у нас в настоящее время есть оборонительный пакт с Центральными державами. Хотя мы юридически не обязаны вступать в войну, немецкие и австрийские дипломаты в последнее время оказывают на нашу страну сильное давление, обещая огромные российские территории.\n\nНеизвестно, готова ли наша армия к войне, но вступление в войну на стороне Германии сейчас может стать нашим лучшим шансом быстро получить желаемые территории в России, пока Россия чувствует себя неподготовленной. С другой стороны, может быть безопаснее и практичнее просто выждать и посмотреть, как будет развиваться война. Каков план?"
 ww1_romania.28.a: "Мы не готовы к радикальным шагам, пока сохраним нейтралитет."
 ww1_romania.28.b: "Освобождение Молдовы ждёт!"
 ww1_romania.79.t: "Национальная оппозиция организуется."
 ww1_romania.79.d: "Оппозиция в румынских политических партиях сформировалась, чтобы противостоять политике Карпа в Румынии."
 ww1_romania.79.a: "Нам нужно потушить этот пожар."
 ROM_national_opposition_organizes: "Добавляет §Y'Национальная оппозиция'§!, что дает: \nПрирост политической власти: §R -50%§!\nСтабильность: §R-40.00%§!"
 ww1_romania.80.t: "Конституция Карпа"
 ww1_romania.80.d: "Карп установил диктатуру в Румынии, манипулируя политическими партиями для получения поддержки."
 ww1_romania.80.a: "Ок"
 ww1_romania.1.d: "Румынская конституция 1866 года часто хвалилась как одна из самых современных конституций в мире на тот момент, с разделением властей, отменой смертной казни, гарантией частной собственности, свободы слова и полной свободы печати. Однако с тех пор румынская конституция почти не изменилась, и поэтому Румыния из одной из самых демократических стран своего времени превратилась в несовершенную конституционную монархию, которой она является сейчас.\n\nСпоры о том, является ли это позитивным или негативным развитием для Румынии, могут вестись, но все сходятся в одном: влияние короля Кароля на румынскую политическую систему огромно и в последнее время усилилось. Король Кароль часто просто чередовал формирование правительства с либеральной НЛП и консервативной КП, а также с недавно сформированной умеренной КДП. Это привело к незначительным реальным реформам в Румынии, поскольку оппозиционные партии отменяли многие реформы, принятые предыдущим правительством. Это привело к восстанию разгневанных крестьян в 1907 году, недовольных небольшими реформами, проведёнными любым правительством. Таким образом, король Кароль выбрал новый курс, назначив либеральное правительство, которое управляло страной в течение последних трёх лет подряд и недавно провело удивительно большое количество реформ, что пока удерживает крестьян в повиновении.\n\nС приближением выборов 1911 года уверенность короля Кароля в либералах и их способности управлять упала. Считая, что пришло время дать шанс новой партии управлять Румынией, король Кароль рассматривает возможность назначения консервативного правительства или, по крайней мере, поддержки консерваторов на выборах."
 ww1_romania.1.a: "Король очень мудрый человек."
 ww1_romania.88.t: "Петре Карп формирует правительство в Румынии."
 ww1_romania.88.d: "С результатами недавних выборов в Румынии консервативная партия Петре Карпа получила большинство в парламенте. Таким образом, король Кароль поручил им сформировать правительство. Стоит отметить, что Петре Карп давно является германофилом и написал несколько работ, призывающих к «освобождению» Молдовы от Российской империи. В связи с этим многие ожидают, что Румыния станет ближе к Германии. Ещё более тревожно для Антанты то, что Карп в прошлом проявлял авторитарные тенденции, и в своей нынешней риторике он также демонстрирует их, поэтому неизвестно, будет ли Карп готов добровольно отказаться от власти."
 ww1_romania.88.a: "Представляет ли он угрозу для румынской демократии?"
 ww1_romania.88.b: "Будем надеяться, что его правительство падёт!"
 ww1_romania.88.c: "Желаем ему удачи!"
 ww1_romania.89.t: "Правительство НЛП в Румынии."
 ww1_romania.89.d: "Сегодня король поручил либеральной партии НЛП сформировать новое правительство в Румынии. Примечательно, что многие в НЛП являются откровенными франкофилами, и поэтому многие ожидают, что это новое правительство может сблизиться с Антантой. Это станет серьёзным ударом по Центральным державам, которые в прошлом оказывали значительное влияние на Румынию. Новое правительство уже начало налаживать контакты с Францией и, что удивительно, с Россией для укрепления связей. Хотя ничто не гарантировано, это, похоже, серьёзный удар по Германии."
 ww1_romania.89.a: "Это, безусловно, встряхнёт ситуацию."
 ww1_romania.89.b: "Великолепно!"
 ww1_romania.89.c: "Ничто не гарантировано!"
 ww1_romania.1.b: "Будем надеяться, что он не подорвёт румынскую демократию..."
 ww1_romania.2.t: "Законопроект о земельной реформе Брэтиану — начинаются дебаты."
 ww1_romania.5.a: "Что за катастрофа!"
 ww1_romania.2.d: "Премьер-министр Ион Брэтиану и либеральная партия наконец завершили разработку нового законопроекта о земельной реформе, который предоставит больше власти большинству румын. Теперь осталось только провести его через парламент, что может оказаться сложнее, чем кажется. Консерваторы, разумеется, против законопроекта, но и умеренные, и король также настроены настороженно. Скорее всего, будучи оторванными от реальности, они считают предыдущие меры правительства достаточными и видят в этом законопроекте риск утечки мозгов из Румынии. Принять этот законопроект будет непросто, и нам потребуется осторожный маневр, чтобы получить большинство голосов."
 ww1_romania.2.a: "Мы это сделаем!"
 ww1_romania.4.t: "Законопроект о земельной реформе Брэтиану — убеждение КДП"
 ww1_romania.4.d: "Нынешний состав румынского парламента означает, что для принятия законопроекта о земельной реформе необходимо убедить умеренных поддержать его. Некоторые члены Консервативно-демократической партии, отколовшейся от более консервативной Консервативной партии, похоже, настроены относительно открыто к предложенному нами законопроекту. Некоторые опасаются, что он слишком радикален, но любое изменение законопроекта может вызвать недовольство более либеральных членов нашей партии, которые могут проголосовать против в знак протеста. Каким будет наш следующий шаг?"
 ww1_romania.3.t: "Законопроект о земельной реформе Брэтиану — землевладельцы обращаются к правительству с петицией."
 ww1_romania.3.d: "Всесильные землевладельцы Румынии выступили против нашего недавнего законопроекта о земельной реформе, который в настоящее время обсуждается в парламенте. Приводя множество причин, почему этот законопроект навредит румынскому обществу и экономике, они настоятельно призывают нас полностью отказаться от него. Хотя они не имеют голосов в парламенте, их оппозиция нашему правительству сильно ослабит нашу позицию, учитывая их огромное влияние в стране."
 ww1_romania.3.a: "Неужели они так быстро забыли о 1907 годе? Вперёд с законопроектом!"
 ww1_romania.3.b: "В их словах есть доля истины, мы можем вернуться к этому вопросу, когда ситуация станет более стабильной."
 ww1_romania.4.a: "Давайте применим давление."
 ww1_romania.4.b: "Они часть нашей коалиции, мы можем им доверять."
 ww1_romania.4.c: "Предложить КДП значительную роль в нашей коалиции, если мы выиграем следующие выборы."
 ww1_romania.5.t: "Законопроект о земельной реформе Брэтиану — законопроект провален."
 ww1_romania.5.d: "Плохие новости для Национально-либеральной партии: крупный законопроект о земельной реформе, недавно предложенный, провалился в парламенте. Поскольку предыдущие законопроекты о земельной реформе принимались подавляющим большинством, отчасти из-за страха перед крестьянской революцией 1907 года, многие удивлены и обеспокоены провалом этого законопроекта. Хотя прогресс был достигнут, многие считают, что его недостаточно, и провал законопроекта привёл к тому, что многие крестьяне опасаются, что дальнейшего прогресса в этом вопросе не будет. В любом случае, эта новость определённо не поможет популярности либерального правительства, даже если провал законопроекта произошёл не по их вине."
 ww1_romania.6.t: "Законопроект о земельной реформе Брэтиану — король Кароль выражает обеспокоенность."
 ww1_romania.6.d: "Хотя король Кароль явно поддерживал либералов после крестьянского восстания 1907 года, а также предыдущие законопроекты либералов о земельной реформе, король Кароль выразил скептицизм по поводу законопроекта о земельной реформе, который в настоящее время обсуждается в румынском парламенте. Считая этот законопроект слишком радикальным, он предложил лидерам НЛП смягчить его ради политической стабильности. С изменениями, предлагаемыми Каролем, законопроект стал бы в основном пустой формальностью, поэтому его изменения неприемлемы. Однако публичное выступление короля Кароля против законопроекта стало бы катастрофой. Хотя маловероятно, что он предпримет решительные меры, такие как роспуск парламента, одно лишь его выступление против законопроекта, несомненно, заставит многих членов КДП отказаться от него, что приведёт к его провалу."
 ww1_romania.6.a: "Король против законопроекта, но против ли парламент?"
 ww1_romania.6.b: "Давайте попробуем развеять его опасения, нам нужна его поддержка в этом вопросе."
 ww1_romania.7.t: "Законопроект о земельной реформе Брэтиану — законопроект принят!"
 ww1_romania.7.d: "Хотя это оказалось сложнее, чем ожидалось, недавний законопроект о земельной реформе, предложенный парламенту, принят! Король Кароль и румынская общественность в последнее время выражали беспокойство по поводу компетентности либералов в управлении, и с принятием этого важного законопроекта их опасения должны рассеяться. Хотя предстоит ещё много работы, этот законопроект является довольно большим шагом вперёд после серии очень незначительных реформ в прошлом году."
 ww1_romania.7.a: "Великолепные для нас новости!"
 ww1_romania.19.t: "Они отклонили "
 ww1_romania.19.a: "Ок"
 ww1_romania.26.t: "Массовые отставки."
 ww1_romania.26.d: "In protest of Carp's government, many in parliament have resigned, demanding Carp do the same. They claim they cannot, in good faith, work with such a corrupt government. With this, the king has clearly lost faith in our government. Its going to take a miracle to stay in power at this point, thats for sure"
 ww1_romania.26.a: "Они перегибают палку!"
 ww1_romania.25.t: "Нечестивый союз."
 ww1_romania.25.d: "К авторитарному, консервативному правительству Карпа присоединился неожиданный союзник: демократические социалисты. Видя, что политика Карпа приносит пользу фабричным рабочим, эти социалисты выходят на улицы с контрпротестами в поддержку Карпа. Хотя это не очень большая группа, их поддержка, безусловно, приветствуется."
 ww1_romania.24.t: "Консерваторы предатели."
 ww1_romania.24.d: "Несколько членов консервативной партии, выступающих против Карпа, присоединились к протестам НЛП против правительства. Соглашаясь с тем, что Карп представляет угрозу для демократии, они призывают Карпа немедленно уйти в отставку. Поскольку улицы заполнены протестующими, похоже, что наше правительство может подойти к концу. Если мы не сможем пережить этот шторм, король, несомненно, распустит наше правительство."
 ww1_romania.23.t: "Массовые протесты на улицах."
 ww1_romania.23.d: "With our refusal to resign, the PNL has organized mass protests against our government. Rioting has broken out in Bucharest with tens of thousands demanding the PC step down from power. With this, the King has increasingly began weighing his options. Its clear the king is increasingly seeing us as unable to govern, and if we don't fix this issue soon we see our government collapse!"
 ww1_romania.22.t: "Верховные суды не находят нарушений со стороны Общества трамваев."
 ww1_romania.22.d: "После иска НЛП закрытие Общества трамваев было отменено Верховным судом Румынии. Эти суды явно коррумпированы и заполнены сторонниками НЛП. В результате этого решения НЛП заявила, что наше правительство должно уйти в отставку с позором. Многие консерваторы, выступающие против Карпа, присоединились к призывам НЛП об отставке Карпа, и начались разговоры об организации массовых протестов."
 ww1_romania.22.a: "Мы скоро закроем этот коррумпированный суд!"
 ww1_romania.21.t: "Закрытие Общества трамваев."
 ww1_romania.21.d: "Национально-либеральная партия известна своей коррупцией, прогнившей до основания. Мы лучше перестрахуемся в вопросе коррупции, и поэтому мы должны быть бдительными. «Общество трамваев» неоднократно открыто поддерживало НЛП, и ходят слухи, что они незаконно присваивали деньги для НЛП. Поэтому мы насильно распустим это коррумпированное учреждение."
 ww1_romania.21.a: "Отлично! Мы должны продолжать такие действия."
 ww1_romania.30.t: "Англо-итальянские банки выводят средства."
 ww1_romania.30.a: "Безразницы"
 ww1_romania.31.t: "Французская промышленная поддержка прекращена."
 ww1_romania.31.a: "Безразницы"
 ww1_romania.32.t: "Французская военная поддержка прекращена."
 ww1_romania.32.d: ""
 ww1_romania.31.d: ""
 ww1_romania.32.a: "Безразницы"
 ww1_romania.38.t: "Немецкая военная поддержка прекращена."
 ww1_romania.38.d: "После нашего объявления войны Германии они решили вывести свои инвестиции из нашей страны."
 ww1_romania.38.a: "Безразницы"
 ww1_romania.36.t: "Меняющаяся коалиция."
 ww1_romania.36.d: "Во Франции, России, Австрии, Германии, Америке и в подавляющем большинстве стран политический раскол лучше всего рассматривается как противостояние сельских и городских проблем. Городские жители в целом более либеральны, в то время как сельские жители более консервативны. Однако в Румынии это не так. Сельские районы в целом поддерживают либеральную НЛП, которая обещает им многое в виде земельной реформы, в то время как городские жители в основном получают выгоду от внимания КП к образованию. С назначением Титу Майореску коалиции снова меняются.\nСосредоточив внимание на сельских проблемах, те, кто часто чувствовал себя обделённым элитарной консервативной КП, начинают пересматривать свои будущие голоса. Хотя он и не либерал, Майореску придерживается нетрадиционных для консерватора взглядов на земельную реформу, что помогло переориентировать сельские районы на КП. Если Майореску сможет успешно склонить сельскую Румынию на сторону КП, сохранив при этом сильную поддержку в городских районах, он сможет обеспечить себе электоральный мандат на ближайшие 100 лет."
 ww1_romania.36.a: "Мы войдём в историю!"
 ww1_romania.37.t: "«Старая гвардия» обеспокоена нашими реформами."
 ww1_romania.37.d: "После принятия парламентом нашего недавнего закона об аграрной реформе многие в старой, более традиционно консервативной фракции КП высказали обеспокоенность в частном порядке. Они, как и многие землевладельцы, имеют экономические интересы в сохранении статус-кво. Некоторые из них угрожают выйти из КП, если мы не заблокируем этот законопроект, хотя многие считают, что это просто блеф."
 ww1_romania.37.a: "Они могут голосовать против законопроекта, если хотят."
 ww1_romania.37.b: "Ладно-ладно, давайте тихо похороним законопроект."
 ww1_romania.39.t: "Социалистические клубы набирают популярность в Молдавии!"
 ww1_romania.39.d: "В Молдавии в последнее время социалистические клубы набирают всё большую популярность, распространяя гнилые социалистические идеи по всему обществу. Сила клубов продолжает расти без признаков замедления. Если эта тенденция сохранится, это может представлять серьёзную угрозу для нашего правления и народа Румынии."
 ww1_romania.39.a: "Нужно что-то делать."
 ww1_romania.55.t: "Прорумынские протесты в Молдове."
 ww1_romania.55.d: "Сегодня несколько румынских протестующих вышли на улицы в России, требуя большей автономии и прав, некоторые даже размахивали румынскими флагами. В ответ на жестокие действия российской полиции правительство столкнулось с давлением, требующим осудить действия России."
 ww1_romania.55.a: "Это возмутительно! Осудите их."
 ww1_romania.55.b: "Давайте действовать рационально..."
 ww1_romania.43.t: "Не «мы против них», а «мы»."
 ww1_romania.43.d: "Румынское общество, к сожалению, очень поляризовано. Самое большое разделение в обществе происходит между землевладельцами и крестьянами, причём обе стороны испытывают глубокую неприязнь друг к другу. Если мы хотим модернизироваться, мы не можем позволить этим мелким разногласиям разделять нас. Наша единственная надежда на прекращение поляризации — это придерживаться средней линии между двумя группами, чтобы умиротворить обе стороны. Если мы не сможем этого сделать, Румыния навсегда останется отсталой."
 ww1_romania.43.a: "Должен быть способ!"
 ww1_romania.77.f: "Нам нужен кто-то очень умный, давайте назначим Ариона."
 ww1_romania.58.t: "Принц Кароль вступает в румынский Сенат."
 ww1_romania.58.d: "В соответствии с румынской конституцией, принц Кароль, сын короля Фердинанда, стал членом румынского парламента. Хотя он не присоединился ни к какой конкретной политической партии, Кароль, как известно, придерживается консервативных и националистических взглядов в румынской политике, даже поддерживая дружеские отношения с радикальной Национально-демократической партией."
 ww1_romania.58.a: "Давайте тепло поприветствуем его!"
 ww1_romania.49.t: "Выборы 1911 года — НЛП сохраняет власть."
 ww1_romania.49.d: "Хотя результат был ближе, чем нам хотелось бы, итоги выборов 1911 года подведены, и мы сохранили небольшое большинство в парламенте. Таким образом, наш мандат был восстановлен, и теперь мы можем приступить к управлению страной."
 ww1_romania.49.a: "Ожидаемо, разумеется!"
 ww1_romania.50.t: "Выборы 1911 года — КП получает большинство в парламенте."
 ww1_romania.50.d: "Это не тот результат, на который мы надеялись, но КП набрала достаточный процент голосов, чтобы получить относительное большинство в парламенте. В связи с этим король Кароль поручил Петре Карпу сформировать правительство."
 ww1_romania.50.a: "Мы когда-нибудь вернёмся!"
 ww1_romania.51.t: "Выборы 1911 года — ни одна партия не может сформировать правительство."
 ww1_romania.51.d: "Результаты выборов подведены, и они настолько близки, что ни одна из партий не имеет достаточного большинства для формирования правящей коалиции. В связи с этим король и ПКД вступили в переговоры о создании компромиссного правительства под их руководством. Таким образом, ПКД сформирует правительство."
 ww1_romania.51.a: "Лучше, чем КП, по крайней мере!"
 ww1_romania.46.t: "КП укрепляет позиции среди сельских избирателей."
 ww1_romania.46.d: "Хотя традиционно сельская Румыния уверенно голосует за НЛП, сдвиг Петре Карпа влево ставит нашу сельскую базу под угрозу потери поддержки. Если мы не выиграем эти регионы, у нас нет никаких шансов на победу на выборах, поэтому мы должны решить эту проблему. Мы могли бы усилить наши позиции по таким вопросам, как всеобщее избирательное право для мужчин, чтобы вернуть этих избирателей, или попытаться изменить курс и использовать проблему доверия к Карпу среди традиционно городских избирателей КП."
 ww1_romania.48.t: "КП обвиняет нас в предательстве румын в Молдове."
 ww1_romania.48.d: "В последнее время КП утверждает, что у нас есть планы заключить союз с Францией и, следовательно, с Россией. Они обвиняют нас в том, что мы бросаем наших друзей в Берлине в обмен на страну, которая в настоящее время угнетает наш народ. Как нам следует ответить?"
 ww1_romania.48.a: "Сосредоточьтесь на внутренней политике, люди не обратят на это внимания."
 ww1_romania.48.b: "Подчеркните дружбу с Францией, но игнорируйте Россию."
 ww1_romania.47.t: "КП атакует нас за нашу протекционистскую политику."
 ww1_romania.47.d: "КП атакует нас за нашу протекционистскую политику, заявляя, что она делает цены на продукты питания выше для всех. Собираемся ли мы усилить нашу позицию или изменить курс?"
 ww1_romania.47.a: "Зачем нам менять позицию по этому вопросу и отталкивать нашу базу?"
 ww1_romania.47.b: "Конечно, мы сместимся к центру, это просто политика."
 ww1_romania.46.a: "Нам нужно укрепить наши позиции среди сельской Румынии."
 ww1_romania.46.b: "Давайте посмотрим, сможем ли мы переманить некоторых высокообразованных городских избирателей."
 ww1_romania.52.t: "Австрия отклоняет просьбу о передаче Буковины."
 ww1_romania.52.d: "После краткого рассмотрения в Имперском совете Австро-Венгрия отклонила нашу просьбу о передаче Буковины в обмен на официальное присоединение к Центральным державам."
 ww1_romania.52.a: "Проклятые австрийцы."
 ww1_romania.45.t: "КП атакует наше правительство как коррумпированное."
 ww1_romania.45.d: "КП запустила несколько кампаний по нападкам на наше правительство, указывая на случаи коррупции или кумовства в кабинете министров. Это разрушительная атака, снижающая нашу поддержку по всей стране, и мы должны ответить. Как мы это сделаем?"
 ww1_romania.45.a: "Встретьте эти обвинения лицом к лицу."
 ww1_romania.45.b: "Просто отрицать, отрицать и отрицать"
 ww1_romania.44.t: "Король Кароль требует новых выборов."
 ww1_romania.44.d: "Поскольку наше правительство исчерпало остатки политического капитала, продвигая недавний закон о земельной реформе, король Кароль настаивает на проведении новых выборов для обновления румынского правительства. Хотя пока выборы обещают быть напряжёнными, если мы получим большое большинство, это может дать нам новый мандат для проведения дополнительных реформ, поэтому согласие на проведение новых выборов — наш единственный выбор. Хотя мы относительно популярны, консерваторы под руководством Петре Карпа реорганизуются, смещаясь влево по многим экономическим вопросам. Они угрожают обойти нашу левую базу по нескольким вопросам, что может разрушить нашу шаткую коалицию. Если мы хотим выиграть эти выборы, нам придётся балансировать между сохранением нашей базы и привлечением центра."
 ww1_romania.44.a: "Мы с нетерпением ждём расширения нашего большинства в парламенте!"
 ww1_romania.40.t: "Румыния просит Буковину в обмен на присоединение к Центральным державам."
 ww1_romania.40.d: "Хотя мы уже подписали оборонительный пакт с нами и государством [GER.GetForeignNameDef], [ROM.GetNameDef] не будет иметь обязательств перед нами, если мы начнём наступательную войну против Антанты. Хотя несколько лет назад присоединение Румынии к нам против [RUS.GetForeignNameDef] считалось предрешённым, сейчас очевидно, что Румыния начинает отдаляться от нашей сферы влияния. Сегодня посол Румынии попросил нас рассмотреть возможность передачи провинции Буковина в обмен на официальное присоединение к Центральным державам. Хотя Германия настаивает на том, чтобы мы приняли просьбу Румынии, это, несомненно, вызовет недовольство некоторых венгров."
 ww1_romania.40.a: "Это неприемлемо!"
 ww1_romania.40.b: "Нам всё равно не нужна Буковина."
 ww1_romania.75.t: "[AUS.GetAuhNameDefCap] соглашается уступить нам Буковину!"
 ww1_romania.75.d: "[AUS.GetAuhNameDefCap] согласилась уступить нам Буковину в обмен на наше присоединение к Центральным державам."
 ww1_romania.75.a: "Превосходно."
 ww1_romania.76.t: "[AUS.GetAuhNameDefCap] отказывается уступать Буковину."
 ww1_romania.18.g: "Петре Карп однажды уже хорошо справился..."
 ww1_romania.27.t: "Король Кароль I скончался."
 ww1_romania.27.d: "Король Кароль I, правивший Румынией на протяжении всей её истории как современного государства, сегодня скончался от естественных причин. Как основатель современного румынского государства в том виде, в котором мы его знаем, сегодня вся Румыния будет скорбеть о нём. Его запомнят как человека, лично возглавлявшего румынскую армию в бою во время русско-османской войны и обеспечившего независимость Румынии в 1878 году. Теперь король Фердинанд станет следующим королём Румынии. Как союзник либералов, новый король, несомненно, окажет своё влияние на румынскую политику."
 ww1_romania.27.a: "Să-i fie tărâna usoară."
 ww1_romania.56.t: "Внутренний переворот в НЛП."
 ww1_romania.56.d: "В НЛП давно существовали внутренние разногласия, в основном между теми, кто расходился во мнениях относительно того, насколько далеко должны заходить реформы. Константин Стере долгое время выступал за создание обширного комитета по земельной реформе, полное избирательное право для мужчин, новую конституцию и даже рассматривал возможность предоставления женщинам права голоса. Напротив, Ион Брэтиану, нынешний лидер НЛП, в лучшем случае лишь делал вид, что поддерживает эти вопросы. С недавним формированием нового правительства НЛП за кулисами развернулась борьба за власть.\n\nПохоже, что Стере вышел победителем из этого конфликта, поскольку сегодня НЛП вынудила Брэтиану уступить место Стере под угрозой раскола партии. В связи с этим король принял отставку Брэтиану, и теперь Стере предстоит увидеть, сможет ли он оправдать свои обещания."
 ww1_romania.56.a: "Приступим к действиям!"
 ww1_romania.84.t: "Разочаровывающий мирный договор."
 ww1_romania.84.d: "Премьер-министр официально ушёл в отставку после того, как не смог получить Банат на переговорах. Несмотря на получение почти всех румынских требований, Брэтиану, возглавлявший делегацию в Париже, решил не идти на компромисс с Королевством сербов, хорватов и словенцев, а полностью отказаться от переговоров и позволить новому премьер-министру попытаться добиться успеха. Это упрямое отношение было признано нежелательным остальным правительством в период национального возрождения после объединения с Трансильванией, Буковиной и Бессарабией. Поистине ненужный жест, когда компромисс мог бы значительно облегчить ситуацию."
 ww1_romania.84.a: "Какое разочарование."
 ww1_romania.34.t: "Проантантовские бунты вспыхивают по всей Румынии."
 ww1_romania.34.d: "Ни для кого не секрет, что большинство румын настроены проантантовски, но все в правительстве ожидали, что они, хотя и неохотно, примут тот факт, что Антанта теперь враг, а австрийцы — друзья. Однако по всей стране вспыхивают бунты с требованием заключить мир с Францией, а некоторые призывают нас двинуться на запад в Австрию и вернуть Трансильванию. Они, похоже, не понимают, что, хотя румынская культура в Трансильвании просуществует ещё тысячу лет, румынам угрожает полная русификация царём в течение нескольких десятилетий. Хотя полиция пытается справиться с ситуацией, некоторые считают, что ситуация выходит из-под контроля, и звучат призывы отправить несколько резервных солдат для их подавления."
 ww1_romania.34.a: "Они предатели!"
 ww1_romania.33.t: "Сотни тысяч леев, выделенных на общественные работы, потеряны."
 ww1_romania.33.d: "Похоже, премьер-министр Карп не опровергает обвинения в некомпетентности: газеты по всей Румынии сообщают, что сотни тысяч леев были полностью потеряны, причём средства, вероятно, были украдены коррумпированными чиновниками на низшем уровне. Карп уже пользуется репутацией некомпетентного и высокомерного как у короля, так и у широкой общественности, и этот доклад, безусловно, не помогает. Национально-либеральная партия подвергла резкой критике консервативную партию за их некомпетентность, а некоторые обвиняют чиновников КП в присвоении средств."
 ww1_romania.33.a: "Это абсолютно пустой звук!"
 ww1_romania.23.a: "Они предатели своей страны!"
 ww1_romania.24.a: "Они в любом случае никчёмные неудачники."
 ww1_romania.25.a: "...спасибо?"
 ww1_romania.35.t: "Александру Маргиломан предлагает цензуру прессы."
 ww1_romania.35.d: "По мере того как мы работаем над восстановлением приличий и сотрудничества в нашей политике, в правительстве Карпа возник вопрос: можно ли доверять анархистам, агитаторам, растратчикам, мародёрам и людям, которые во многих случаях понятия не имеют, что они делают, действовать добросовестно? Они уже пытались бойкотировать наше правительство, и они уже организовывали крупные разрушительные протесты только потому, что проиграли, так кто может сказать, что они не попытаются пойти дальше? Маргиломан, в частности, обеспокоен этой возможностью и имеет план по введению цензуры новостей, касающихся НЛП, чтобы ослабить их позиции среди избирателей. Это поможет нам выиграть будущие выборы против НЛП, хотя может разозлить некоторых умеренных консерваторов в партии и, возможно, подтолкнуть некоторых из них к КДП или даже к НЛП."
 ww1_romania.35.a: "Мы имеем полное право вмешиваться в прессу!"
 ww1_romania.35.b: "Это не стоит той реакции, которую это вызовет."
 ww1_romania.67.d: "Имея полное доминирование в румынской политике в сложившихся условиях, КДП обладает большим влиянием на КП, которая сейчас изо всех сил пытается найти свою электоральную базу. В связи с этим Таке Ионеску организовал встречу с несколькими высокопоставленными чиновниками КП для обсуждения политического объединения. Не имея другого выбора, лидеры КП согласились присоединиться к КДП и сформировать широкую правоцентристскую партию."
 ww1_romania.67.a: "Это значительно расширит наш мандат!"
 ww1_romania.67.t: "Слияние КП и КДП."
 ww1_romania.66.t: "The Enescu Prize"
 ww1_romania.66.desc: "Культурная сцена Румынии процветает, а её молодые таланты стремятся заявить о себе. Известный композитор Джордже Энеску учредил в этом году Премию Энеску — престижную награду для признания самых многообещающих румынских композиторов нашего времени. Мероприятие собрало культурную элиту в Бухаресте, чтобы прославить местную музыку и поднять румынскую гордость. Победителем этого года стал Ион Нонна Отеску."
 ww1_romania.66.a: "Все они делают Румынию гордой."
 ww1_romania.65.t: "Какой ценой?"
 ww1_romania.65.desc: "Война окончена, и мы властвуем над нашими врагами. Наши территориальные претензии признаны нашими союзниками, и мы принимаем их с радостью, отражающейся в лицах освобождённых румын, которые там проживают. Однако остаётся вопрос. Что насчёт бесчисленных погибших, чтобы достичь этого? Можно легко списать потери на приобретённые репарации, но более серьёзные из нас понимают, что каждый из погибших представлял собой будущее Румынии; следовательно, наше будущее без них немного менее светлое. Но не будем об этом, сейчас время двигаться вперёд. Экономика требует внимания, новые территории нуждаются в надлежащем управлении, и, наконец, венгерская агрессия должна быть обуздана навсегда."
 ww1_romania.65.a: "Наконец, давайте двигаться дальше."
 ww1_romania.68.t: "Разрушенная экономика."
 ww1_romania.68.desc: "Когда демобилизованные солдаты возвращаются домой, многие из них идут на место работы своих родителей. Будь то магазин, фабрика или ферма, все они обнаруживают одно и то же: дела идут не так, как раньше. В переходе к военной экономике простой человек потерял внимание правительства, благодаря которому он раньше процветал. То, что осталось от их бизнеса после войны, почти во всех случаях приходит в упадок. Во время войны все молодые люди ушли, оставив работодателей без сотрудников. Они возвращаются в эти предприятия только для того, чтобы найти их закрытыми, рабочие места заброшенными. Давайте снова откроем эти двери, шаг за шагом."
 ww1_romania.68.a: "Румыния восстановится!"
 ww1_romania.68.b: "С тем малым, что у нас есть..."
 ww1_romania.70.t: "Следует ли нам отправить пакет помощи в государство [ROM.GetName]?"
 ww1_romania.70.desc: "Мы могли бы помочь нашему союзнику Румынии, отправив им немного оборудования, так как у них дела идут не очень хорошо."
 ww1_romania.70.a: "Мы всегда будем помогать нашим союзникам."
 ww1_romania.70.b: "А что Румыния сделала для нас?"
 ww1_romania.71.t: "[FRA.GetNameDefCap] отправляет нам пакет помощи!"
 ww1_romania.71.desc: "Из-за наших трудностей в войне [FRA.GetName] решила отправить нам партию военного снаряжения."
 ww1_romania.71.a: "Спасибо, наверное."
 ww1_romania.72.t: "Аурел Влайку разрабатывает более безопасный самолёт."
 ww1_romania.72.desc: "Аурел Влайку, румынский изобретатель, инженер, авиаконструктор и пилот, сегодня совершил первый полёт на A. Vlaicu Nr. II недалеко от Бухареста. Это более совершенная и безопасная конструкция, чем первая, которую можно использовать в военных целях."
 ww1_romania.72.a: "Это будет полезно"
 ww1_romania.73.t: "Аурел Влайку возвращается с Комиссией по авиации."
 ww1_romania.73.desc: "В ноябре 1909 года Аурел Влайку получил заказ от румынской армии на создание самолёта для армии. Сегодня он объявил нам, что его конструкция успешно прошла лётные испытания. Что нам ему сказать?"
 ww1_romania.73.a: "Хорошо, давайте использовать его."
 ww1_romania.73.b: "Он должен быть безопаснее"
 ww1_romania.82.d: "Видя, что они почти окружены и потеряли свою столицу, а также учитывая, что у нас находится множество захваченных венгерских солдат и ополченцев, венгерское правительство капитулировало перед нами. Теперь вопрос в том, действительно ли нам нужно оккупировать их и мириться с постоянными волнениями там, или позволить им стать возможной угрозой в будущем."
 ww1_romania.82.a: "С нашей победой мы можем занять наши законные земли."
 ww1_romania.82.b: "Мы не удовлетворимся только нашей законной землёй, они должны быть наказаны."
 ww1_romania.82.t: "Венгрия предлагает сдаться"
 ww1_romania.85.t: "Румынские выбора [GetYear] года"
 ww1_romania.85.d: "Выборы [GetYear] года в Румынии состоялись; основными партиями были либеральная НЛП и радикальная НРП, которая привлекла многих крестьян своей политикой земельной реформы."
 ww1_romania.85.a: "Румынская национальная партия!"
 ww1_romania.85.b: "Либералы побеждают вновь!"
 ww1_romania.86.t: "Король Фердинанд распускает правительство"
 ww1_romania.86.d: "Король Фердинанд I распустил правительство, посчитав его политику земельной реформы слишком радикальной."
 ww1_romania.86.a: "Да как он смеет?"
 ww1_romania.92.t: "Вопрос приоритетов"
 ww1_romania.92.d: "Пришло время выбрать, на чём сосредоточиться внутри страны во время Великой войны. Мы можем либо сделать приоритетом экономический рост за счёт военных спекуляций или дальнейшей индустриализации, либо ещё больше улучшить состояние нашей армии."
 ww1_romania.92.b: "Давайте улучшим нашу армию"
 ww1_romania.92.a: "Капитализм звучит неплохо."
 ww1_romania.92.c: "Мы все еще социалисты, поверь мне!"
 ww1_romania.93.t: "Смерть Аурела Влайку."
 ww1_romania.93.d: "Аурел Влайку, румынский авиаконструктор, к сожалению, погиб в Карпатах, когда пытался первым перелететь через них. Некоторые обвинили его друзей, которые были с ним в пути и следовали за ним на автомобиле, в саботаже. Они, конечно, отрицают это обвинение и вместо этого утверждают, что двигатель был отключён для посадки, что сделало управление самолётом затруднительным, и он разбился."
 ww1_romania.93.a: "Покойся с миром."
 ww1_romania.94.t: "Коалиционное правительство распадается"
 ww1_romania.94.d: "Под давлением гнева со всего политического спектра из-за нашего шага по национализации собственности Reşiţa как Национально-либеральная партия, так и Консервативно-демократическая партия объявили о выходе из нашей коалиции. НЛП, чья база консолидировалась среди избирателей среднего класса, выступает против этого шага, так как он затрагивает интересы их электората. КДП, с другой стороны, в целом выступала против любой национализации. Таким образом, поскольку коалиция и так была напряжена в последние недели, этот шаг стал переломным моментом."
 ww1_romania.94.a: "Это может стать концом нашего правительства!"
 ww1_romania.95.t: "Искусственный кризис."
 ww1_romania.95.d: "Подогреваемые желанием положить конец нынешнему правительству, Ионеску и Брэтиану заключили сделку по созданию искусственного кризиса, чтобы вынудить Авереску уйти в отставку. Похоже, этот кризис напугал короля Фердинанда, который согласился назначить Ионеску на его место для формирования правительства."
 ww1_romania.95.a: "Эти крысы!"
 ww1_romania.96.t: "Вотум недоверия"
 ww1_romania.96.d: "Неудовлетворённые самим назначением Ионеску, НЛП и Крестьянская партия уже предприняли шаги к смещению КДП. Обвиняя Ионеску в мягкотелости по отношению к коммунизму и в коррупции, они провели вотум недоверия, а также убедили Фердинанда в том, что Ионеску не способен управлять. При мощной политической поддержке у Ионеску не остаётся иного выбора, кроме как уйти в отставку."
 ww1_romania.96.a: "Что? Но мы вступили в должность всего месяц назад!"
 ww1_romania.97.t: "Первый перелёт через Карпаты."
 ww1_romania.97.d: "Аурел Влайку успешно совершил полёт в Карпатах, первый в этом регионе. Самолёт A. Vlaicu Nr. III теперь будет увековечен как гордость румынского народа и достижение."
 ww1_romania.97.a: "Невероятно."
 ww1_romania.87.t: "Румынские нефтяные месторождения восстановлены"
 ww1_romania.87.d: "После начала работ на нефтяных месторождениях несколько недель назад они теперь полностью восстановлены и готовы начать добычу большого количества нефти для нашего использования."
 ww1_romania.87.a: "Отлично!"
 ww1_romania.41.t: "Германия требует уступок для продолжения экспорта оружия."
 ww1_romania.41.d: "Поскольку большая часть наших закупок оружия приходится на Германию, Кайзер решил использовать это преимущество, чтобы потребовать от нас ряд уступок. Они заявляют, что если мы не увеличим торговлю и даже не разрешим им использовать некоторые наши железные дороги для перевозки припасов в Болгарию, они прекратят экспорт оружия. Хотя это было бы нарушением нашего нейтралитета, возможно, мы не в том положении, чтобы отказываться."
 ww1_romania.41.a: "Эти условия не так уж плохи."
 ww1_romania.41.b: "Кем они себя возомнили?"
 ww1_romania.42.t: "Германия требует право прохода"
 ww1_romania.42.d: "Германия отправила сообщение, информирующее нас о том, что она прекратит продажу нам оружия, если мы не позволим немецким припасам и войскам проходить через румынскую территорию, де-факто требуя разрешить им переброску дивизий через наши земли. Хотя это значительно скомпрометирует наш нейтралитет, мы, возможно, слишком зависим от Германии, чтобы отказаться. Как нам следует ответить?"
 ww1_romania.42.a: "Давайте не злить их..."
 ww1_romania.42.b: "Тогда мы найдём другие рынки."
 ww1_romania.69.t: "Результаты досрочных выборов."
 ww1_romania.69.d: "Используя относительную волну стабильности и экономического роста, правящая партия Румынии смогла расширить своё большинство в румынском парламенте за счёт КП, которая всё больше превращалась в изолированную политическую партию. С этим новым мандатом мы можем продолжить нашу внутреннюю программу."
 ww1_romania.69.a: "Отлично!"
 ww1_romania.59.b: "Знаете, я думаю, будет лучше, если он найдёт другую работу."
 ww1_romania.59.d: "Чтобы привить принцу Каролю важность прусских ценностей, Кароль был направлен на службу в Королевскую гвардию в качестве офицера. Однако сам Кароль проявил больший интерес к вечеринкам, выпивке и ухаживаниям за женщинами, чем к выполнению армейских обязанностей. Его успехи на учениях были плачевными, и новая должность лишь привлекла внимание к личным скандалам молодого принца, которые в последнее время стали любимой темой румынских газет."
 ww1_romania.59.a: "Как они смеют клеветать на принца?!"
 ww1_romania.59.t: "Принц Кароль стал армейским офицером"
 ww1_auh.214.t: "Румыния просит Буковину в обмне на вступление в союз"
 ww1_auh.214.a: "Да, конечно"
 ww1_auh.214.b: "Нет необходимости"
 ww1_auh.220.t: "Германия просит создать марионеточную Польшу"
 ww1_auh.220.a: "Нет"
 ww1_auh.220.b: "Да"
 ww1_poland.24.t: "Австрийская промышленная сделка"
 ww1_poland.24.d: "Мы отдаем часть промышленности Австрии"
 ww1_poland.24.a: "Печально"
 ww1_germany.173.t: "Австрия просит о помощи"
 ww1_germany.173.a: "чтобы предложить им интересы в Польше."
 ww1_germany.173.b: "Нет"
 ww1_romania.90.t: "[AUS.GetAuhName] уступает Буковину румынам"
 ww1_romania.90.desc: "[AUS.GetAuhNameDef] уступает Буковину и северную Буковину румынам, взамен, Румыния обязана вступить в Центральные Державы. Это какжется односторонней сделкой, так как [ROM.GetNameDef] получите все преимущества"
 ww1_romania.90.a: "Как народ Буковины отреагирует?"
 ww1_romania.90.b: "Румынская крыса наносит ответный удар опять..."
 ww1_romania.90.c: "Привет нашему новому союзнику!"
 ww1_romania.90.d: "Это стоило того?"
 ww1_romania.90.e: "Надеемся мы здесь выживем"
 ww1_romania.91.t: "[ROM.GetName] подписывает перемирие"
 ww1_romania.91.desc: "Румынское правительство объявило, что неспособно дальше продолжать сражаться в Великой Войне, и что они выходят из неё. Они подписали мир с государствами [AUS.GetAuhName], [GER.GetForeignName] и [BUL.GetName] в обмен на территорию"
 ww1_romania.91.a: "Темные Времена."
 ww1_romania.91.b: "По крайней мере, мы выжили."
 ww1_romania.91.c: "На один проблемный фронт меньше"
 ww1_romania.91.d: "Чёрт возьми!"
 ww1_romania.98.t: "Набег на венгерскую границу"
 ww1_romania.98.d: "Наши солдаты успешно провели набег на венгерскую границу."
 ww1_romania.98.a: "Это принесет нам пользу"
 ww1_romania.99.t: "Румынские войска провели набег"
 ww1_romania.99.d: "Румынские части вступили в нашу страну и ограбили некоторые оружейные склады и базу. Это явное нарушение международных границ."
 ww1_romania.99.a: "Как они смеют?"
 ww1_romania.100.t: "[ROM.GetName] требует передачу региона [764.GetName]"
 ww1_romania.100.d: "[ROM.GetName] просит регион [764.GetName] после того, как ей не удалось добиться этого на Парижской мирной конференции."
 ww1_romania.100.a: "Нам он не нужен"
 ww1_romania.100.b: "Какого черта?"
 ww1_romania.101.t: "Они отказались передать [764.GetName]!"
 ww1_romania.101.d: "Они обратились в наше посольство с заявлением о том, что не отдадут нам нашу законную землю."
 ww1_romania.101.a: "На войну!"
 ww1_romania.102.t: "Они сдали [764.GetName]"
 ww1_romania.102.d: "Они опубликовали сообщение, в котором заявили, что согласны с тем, что у них нет законных прав на [764.GetName] и что он принадлежит нам."
 ww1_romania.102.a: "Слишком легко"
 ww1_romania.103.t: "Может нам надо забрать больше венгерской земли?"
 ww1_romania.103.d: "[HUN.GetName] была повержена в войне с нами, итак, вопрос в том, должны ли мы еще больше расстроить венгров и взять [154.GetName]?"
 ww1_romania.103.a: "Прочество о Великой Румынии будет исполнено!"
 ww1_romania.103.b: "С другой стороны..."
 ww1_romania.104.t: "Румыния предлагает нам вступить в Румыно-венгерскую войну"
 ww1_romania.104.d: "Румыния пригласила сегодня нашего представителя в посольство и официально спросила нас, хотим ли мы присоединиться к конфликту между ними и Венгрией."
 ww1_romania.104.a: "Конечно"
 ww1_romania.104.b: "Нейтралитет - это правильный путь, даже по отношению к венграм."
 ww1_romania.105.t: "Сербия согласна вступить в нашу войну!"
 ww1_romania.105.d: "Сербия согласилась вступить в нашу войну красной венгерской угрозы."
 ww1_romania.105.a: "Отлично!"
 ww1_romania.106.t: "Сербия отказалась вступать в нашу войну"
 ww1_romania.106.d: "Сербия отказалась присоединиться к нашему походу против красной венгерской угрозы."
 ww1_romania.106.a: "У нас был союз..."
 ww1_romania.106.b: "Что-то теряешь, что-то находишь."
 ww1_romania.81.t: "Отправка армии в Трансильванию"
 ww1_romania.81.d: "С окончанием Великой войны нам причитаются территории в Трансильвании, контролируемые Венгрией, для освобождения которых мы вступили в войну на стороне Антанты. Мы должны ввести наши армии в этот регион, чтобы обеспечить его контроль и подготовить к интеграции в румынское государство."
 ww1_romania.81.a: "Вперед в Трансильванию!"
 ww1_romania.81.b: "Мы не должны что то делать"
 ww1_romania.81.t2: "Запуск вторжения в Трансильванию?"
 ww1_romania.81.d2: "С окончанием Великой войны и крахом Австро-Венгерской империи Венгрия находится в ослабленном состоянии и станет лёгкой мишенью для вторжения на её трансильванские земли. Это прекрасная возможность освободить румын Трансильвании, но это также может разгневать победившие великие державы..."
 ww1_romania.108.t: "Король Фердинанд обращается с речью к народу"
 ww1_romania.108.d: "«Румыны! Война, которая в течение последних двух лет всё теснее сжимала кольцо вокруг наших границ, потрясла до основания древние устои Европы. Она принесла день, которого веками ждало национальное сознание, основатели Румынского государства, те, кто объединил княжества в войне за независимость, те, кто нёс ответственность за национальное возрождение. Это день объединения всех ветвей нашей нации. Сегодня мы можем завершить дело наших предков и установить навечно то, что Михай Великий смог установить лишь на миг, — румынское единство по обе стороны Карпат».\n— Король Румынии Фердинанд I"
 ww1_romania.108.a: "De la Nistru pana la Tisa!"
 ww1_romania.110.t: "Румыния оккупирует венгерские земли!"
 ww1_romania.110.d: "После победы в Венгеро-румынской войне почти вся Венгрия была оккупирована румынскими войсками, которые не проявляют никаких признаков ухода. Они взяли на себя работу венгерского населения в полиции и других сферах. Венгерский народ подвергается угнетению и взывает о помощи. Следует ли нам осудить их?"
 ww1_romania.110.a: "Эта оккупация должна завершиться!"
 ww1_romania.110.b: "Это не наше дело."
 ww1_romania.111.t: "[FROM.GetName] осуждает нашу оккупацию"
 ww1_romania.111.d: "[FROM.GetName] осудил нашу оккупацию Венгрии — страны-противника."
 ww1_romania.111.a: "Если мы не вторгнемся, венгры вернутся!"
 ww1_romania.111.b: "Мы должны окончить оккупацию"
 ww1_romania.112.t: "Протесты в оккупированной Венгрии"
 ww1_romania.112.d: "На улицах крупных городов Венгрии вспыхнула серия антирумынских протестов. Как нам следует реагировать на эти протесты?"
 ww1_romania.112.a: "Подавите их!"
 ww1_romania.113.t: "Протесты в оккупированной Венгрии"
 ww1_romania.113.d: "На улицах крупных городов Венгрии вспыхнула серия антирумынских протестов. Как нам следует реагировать на эти протесты?"
 ww1_romania.113.a: "Продолжайте подовлять!"
 ww1_romania.114.t: "Союзники требуют вывода наших войск из Венгрии"
 ww1_romania.114.d: "Антанта требует окончить оккупацию венгерских земель."
 ww1_romania.114.a: "Хорошо."
 ww1_romania.114.b: "Мы не окончим оккупацию."
 ww1_romania.115.t: "[ROM.GetName] предлагает союз"
 ww1_romania.115.d: "[ROM.GetName] предлагает союз против любых внешних угроз. Нация, которая была нестабильна из-за нашей победы в войне против них, была свергнута социалистами и хочет вступить с нами в союз."
 ww1_romania.115.a: "Вперед!"
 ww1_romania.115.b: "Мы не забыли."
 ww1_romania.116.t: "[HUN.GetName] отвергает союз"
 ww1_romania.116.d: "Посланник из Венгрии сказал нам, что они не будут подписывать союз с нами."
 ww1_romania.116.a: "Глупцы..."
 ww1_romania.115.c: "Как насчет простого мира прямо сейчас?"
 ww1_romania.117.t: "[ROM.GetName] требует [78.GetName] за гражданские фабрики"
 ww1_romania.117.d: "Государство [ROM.GetName] предложило нам сделку: они дают нам в пользование 5 их гражданских фабрик на 1080 дней, а мы даем им регион [78.GetName]"
 ww1_romania.117.a: "Договорились."
 ww1_romania.117.b: "Нам не нужны жалкие 5 фабрик."
 ww1_romania.119.t: "[FROM.GetName] отказалосб давать нам регион [78.GetName]"
 ww1_romania.119.d: "[FROM.GetName] отказало давать нам Бессарабию взамен на фабрики"
 ww1_romania.119.a: "Облом."
 ww1_romania.120.t: "Константин Стере свергает правительство!"
 ww1_romania.120.d: "Константин Стере успешно свергает правительство после нашего унизительно поражения Венграм."
 ww1_romania.120.a: "Послушай... Я не хочу об этом говорить..."
 ww1_romania.118.t: "[FROM.GetName] согласилось продать [78.GetName]"
 ww1_romania.118.d: "[FROM.GetName] продало нам [78.GetName] взамен на гражданские фабрики"
 ww1_romania.122.t: "Петре П. Карп умирает"
 ww1_romania.122.d: "Петре П. Карп, глава нашей страны, уумер в возрасте 82 лет из-за ухудшающегося состояния здоровья. Румыния будет возглавлена Лупу Костаки."
 ww1_romania.122.a: "Вся Румыния скорбит."
 ww1_romania.123.t: "[TUR.GetForeignName] закрывает проливы!"
 ww1_romania.123.d: "[TUR.GetForeignName] контролирует важные проливы Босфор и Дарданеллы. Из-за Великой войны они закрыли их, чтобы перекрыть путь Антанте к южной России. Это также ограничивает нашу торговлю с Антантой, что влияет на нашу экономику."
 ww1_romania.123.a: "Облом"
 ww1_romania.124.t: "[ROM.GetName] просит нас открыть им проливы"
 ww1_romania.124.d: "Румыны попросили открыть им доступ через проливы Босфор и Дарданеллы, чтобы торговаться с Антантой."
 ww1_romania.124.a: "Конечно"
 ww1_romania.124.b: "Мы не позволим им этого!"
 ww1_romania.125.t: "[TUR.GetForeignName] согласилось дать нам проход через проливы!"
 ww1_romania.125.d: "Османы приняли нашу просьбу о ведении торговли через проливы."
 ww1_romania.125.a: "Правда?"
 ww1_romania.126.t: "[TUR.GetForeignName] запрещает нашим кораблями торговаться с Антантой"
 ww1_romania.126.d: "Османы восприняли в штыки идею о том, что нейтральная страна может торговать жизненно важные ресурсы с врагами через их проливы."
 ww1_romania.126.a: "Ну что ж"
 ww1_romania.127.t: "Восстание в Хотине!"
 ww1_romania.127.d: "В городе Хотин в Бессарабии вспыхнуло крупное восстание украинских крестьян при поддержке украинских казаков. Мятежники взяли под контроль весь регион и готовятся к созданию нового государства. Они представляют собой крайнюю опасность для нашего законного контроля над Бессарабией, и необходимо что-то предпринять, чтобы остановить их."
 ww1_romania.127.a: "Отправьте армию!"
 ww1_romania.60.t: "Мирный премьер-министр"
 ww1_romania.60.d: "Чтобы дать чёткие уступки Германии, король принял решение уволить нынешнего премьер-министра и назначить на его место того, кого Германия предпочитает больше. Это должно помочь нам получить более выгодные условия мирного договора."
 ww1_romania.61.t: "Назначение Константина Коандэ"
 ww1_romania.61.d: "Хотя Александру Маргиломан был назначен как явная уступка Германии, с падением Германии и нашим присоединением большей части Австро-Венгрии становится ясно, что он бесполезен. Таким образом, король решил назначить нового человека. Константин Коанда — генерал, очень популярный среди членов Антанты, и он должен помочь нам сохранить тесные связи с ними."
 ww1_romania.61.a: "Отлично!"
 ww1_romania.60.a: "У нас есть путь к миру."
 ww1_romania.107.t: "Бухарестский договор [GetYear] года"
 ww1_romania.107.d: "Сегодня представители Центральных держав прибыли в Яссы для переговоров о выходе Румынии из войны. Румыния вынуждена уступить земли и ресурсы Центральным державам."
 ww1_romania.107.a: "Может ли все пойти хуже?"
 ww1_romania.129.t: "Event for AI"
 ww1_romania.129.d: "Event for AI"
 ww1_romania.129.a: "Event for AI"
 ww1_romania.132.t: "[GER.GetForeignName] просит права прохода войск"
 ww1_romania.132.d: "Германия попросила у нас военного прохода для переброски войск через нашу страну. Как нам следует ответить?"
 ww1_romania.132.a: "Никакое зло не пройдет через наши земли!"
 ww1_romania.132.b: "Добро пожаловать в Румынию!"
 ww1_romania.134.t: "Германия требует мира"
 ww1_romania.134.d: "Антанта победила Центральные Державы, и они наконе-то достигли победы."
 ww1_romania.134.a: "Время атаковать!"
 ww1_romania.62.t: "Социалисты организуются."
 ww1_romania.62.desc: "Ходят слухи, что группа социалистов организуется в различных районах Румынии для распространения революции."
 ww1_romania.62.a: "Это катастрофа!"
 ww1_romania.63.t: "Массовые беспорядки на улицах"
 ww1_romania.63.a: "Что происходит!"
 ww1_romania.63.desc: "Сегодня вечером социалисты вышли на улицы наших городов, разрушив несколько зданий в знак протеста против военного правительства Константина Коанды."
 ww1_romania.64.t: "Константин Коандэ вынужден подать в отставку!"
 ww1_romania.64.desc: "Константин Коанда объявил сегодня о своей отставке из-за жестоких протестов с требованием его ухода. Ион И. К. Брэтиану снова возглавил государство [ROM.GetName]."
 ww1_romania.64.a: "Вон из окна."
 ww1_romania.57.t: "Германия назначает Петре Карпа марионеточным лидером"
 ww1_romania.57.d: "Поскольку король официально не капитулировал, Германия назначила Петре Карпа для формирования нового марионеточного правительства в Бухаресте. Немецкие солдаты уже начинают вывод войск, передавая контроль над страной новому гражданскому правительству. Как заслуживающий доверия германофил, Петре Карп должен идеально служить интересам Германии в нашей стране."
 ww1_romania.57.a: "Если не можешь победить, то присоединяйся!"
 ww1_romania.135.t: "ai event if you got this normally please contact devs in discord"
 ww1_romania.136.t: "Румыния саботирует нефтяную инфраструктуру"
 ww1_romania.136.d: "Когда наши наступающие войска захватили драгоценные румынские нефтяные месторождения, мы обнаружили, что Румыния разрушила нефтяные скважины и нефтеперерабатывающие заводы"
 ww1_romania.136.a: "Мы их скоро восстановим"
 ww1_romania.137.t: "TEST EVENT"
 ww1_romania.137.d: ""
 ww1_romania.137.a: "Activate effects of Armistice of Focsani"
 ww1_romania.138.t: "План на войну"
 ww1_romania.138.d: "Поскольку наша страна почти готова вступить в войну, нам необходимо принять стратегическое решение о том, на чём сосредоточить наши усилия. Мы можем укрепить болгарскую границу или Южные Карпаты, чтобы остановить любое продвижение врага, или же начать быстрое и стремительное наступление в Трансильванию."
 ww1_romania.138.a: "Укрепите вю болгарскую границу"
 ww1_romania.138.b: "Укрепите ключевые города на болгарской границе"
 ww1_romania.138.c: "Укрепите южные карпаты"
 ww1_romania.138.e: "Нам нужно ударить по Трансильвании"
 ww1_romania.83.t: "Венгрия сдается Румынии и Чехии"
 ww1_romania.83.d: "Сегодня венгерское правительство объявило о своей капитуляции перед румынами и чехами. [HUN.GetNameDef] теперь полностью признаёт территориальные претензии Румынии в Трансильвании и претензии Чехии в Словакии."
 ww1_romania.83.a: "Ура!"
 ww1_romania.83.b: "Мир возвращается на балканы"
 ww1_romania.83.c: "Мы однажы получим их назад..."
 ww1_romania.139.t: "Румыния запрашивает нашу поддержку"
 ww1_romania.139.d: "Наши новые союзники в Румынии просят нас отправить военную миссию в их страну для обучения румынской армии и обеспечения их новым оборудованием. Наличие сильной Румынии может оказать большую помощь на Восточном фронте в войне против австрийцев и болгар."
 ww1_romania.139.a: "Конечно, мы поможем нашим союзникам"
 ww1_romania.139.b: "Им не нужна наша помощь!"
 ww1_romania.140.t: "Франция согласилась отправить военную миссию"
 ww1_romania.140.d: "Франция согласилась отправить военную миссию для поддержки нас в войне. Они согласились помочь в обучении нашей армии и передаче новых тактик, а также отправить нам часть своего вооружения для снабжения нашей армии в это трудное время."
 ww1_romania.140.a: "Отлично!"
 ww1_romania.141.t: "Франция отказалась отправить военную миссию"
 ww1_romania.141.d: "Французы отказались отправлять нам военную миссию, заявив, что у них нет времени и оборудования для поддержки нас в данный момент. Нам придётся выживать самостоятельно."
 ww1_romania.141.a: "Какое разочарование."
 ww1_romania.142.t: "Димитре Стурдза умирает"
 ww1_romania.142.d: "Димитрие Стурдза, родившийся как князь Димитрие Александру Стурдза-Миклэузану, сегодня скончался в психиатрической лечебнице. Он был бывшим премьер-министром Румынии и бывшим президентом Румынской академии."
 ww1_romania.142.a: "Ок"
 ww1_romania.143.t: "Cerchez & Co. объявляет о банкротстве"
 ww1_romania.143.d: "Михай Черкез, основатель Cerchez & Co., румынской авиастроительной компании, объявил о банкротстве из-за нехватки финансирования."
 ww1_romania.143.a: "Ок"
 ww1_romania.147.t: "Венгры протестуют против подавления их языка!"
 ww1_romania.147.d: "Сегодня венгры массово вышли на протесты против нашей политики подавления венгерского языка в образовании и администрации, которая является частью нашей политики румынизации и продвижения румынского языка. Мы должны найти способ сдержать эти протесты, прежде чем они выйдут из-под контроля."
 ww1_romania.147.a: "Венгерский сепаратизм продолжает усиливаться..."
 ww1_romania.148.t: "Столкновения и массовые беспорядки вспыхивают в Секейском крае!"
 ww1_romania.148.d: "Сегодня, после того как наши силы прибыли для подавления местных венгерских мятежников, тысячи венгров вышли на улицы с беспорядками и напали на наши войска, что привело к жестоким столкновениям. Наши силы в настоящее время справляются с беспорядками, и некоторые столкновения всё ещё происходят, но это, безусловно, серьёзная эскалация напряжённости, которая может продолжать выходить из-под контроля."
 ww1_romania.148.a: "Уничтожьте их всех!"
 ww1_romania.149.t: "Венгерская оппозиция формируется в Секейском крае."
 ww1_romania.149.d: "После нашей победы и взятия Трансильвании в регионе Секейский край остаётся большое количество венгров, которые выступают против нас и не хотят быть частью нашей страны. Проходят многочисленные протесты, и некоторые прибегают к более насильственным методам. Мы должны что-то предпринять, чтобы остановить их, будь то компромисс с ними или подавление любых попыток отделения."
 ww1_romania.149.a: "Нужно что-то делать."
 ww1_romania.150.t: "Венгры протестуют против урезания автономии!"
 ww1_romania.150.d: "После нашего решения снизить статус автономии венгров в Секейском крае многие венгры вышли на улицы, чтобы выразить протест против наших действий. Протесты продолжаются и не подают признаков скорого завершения."
 ww1_romania.150.a: "Жалующиеся венгры, как всегда!"
 ww1_romania.151.t: "Эпидемия холеры поражает нашу армию"
 ww1_romania.151.d: "В наших оккупационных войсках была зафиксирована вспышка холеры. Эксперты утверждают, что наши солдаты заразились из-за плохих условий питания и санитарии. Некоторые возлагают вину на наших офицеров, которые игнорировали предупреждения врачей."
 ww1_romania.151.a: "Нам нужно вакцинироваться!"
 ww1_romania.152.t: "Вакцинация успешна"
 ww1_romania.152.d: "Наши войска были успешно вакцинированы для защиты от вспышки холеры. К сожалению, по оценкам, от эпидемии погибло более 1600 солдат."
 ww1_romania.152.a: "Покойтесь с миром."
 ww1_romania.153.t: "[FROM.GetName] вторгается в регион [78.GetName]!"
 ww1_romania.153.d: "В связи с нашей нынешней слабостью [FROM.GetName] решил атаковать наши позиции в [78.GetName], чтобы «восстановить» их в составе Великой Румынии. Если мы немедленно не отправим войска, они могут преуспеть в попытке захвата территории!"
 ww1_romania.153.a: "Мы должны защищаться!"
 ww1_romania.154.t: "Часы бьют полночь"
 ww1_romania.154.d: "Так никогда не должно было закончиться. Оно должно было закончиться, но не так. Бесчисленные тела, разбросанные по Карпатам, свидетельствуют об этом факте. Наши трансильванские амбиции почти разрушены, идея Великой Румынии исчезает в лучах заходящего солнца. Люди в замешательстве, их протесты заполняют улицы. Что нам делать? В конце концов, у них есть все основания для протеста. Наша администрация полностью и абсолютно подвела свой народ. Но как долго они смогут продолжать маршировать? Когда еда станет слишком дорогой для простого человека, вернутся ли они в свои дома или пойдут дальше? Один Бог знает, поскольку теперь ничто не определено. Когда мы полностью демобилизуемся и разоружимся, когда мы подпишем отказ от прав на нашу промышленность, когда мы приведём себя к подчинению, у нас будет лишь одна передышка. Фермерам не придётся поливать свои поля в этом сезоне, потому что кровь их сыновей, пропитывающая почву, сделает это достаточно хорошо."
 ww1_romania.154.a: "И на этом все заканчивается..."
 ww1_romania.155.t: "За Окном нашего дома бушует пожар"
 ww1_romania.155.d: ""
 ww1_romania.155.a: "Позор"
 ww1_romania.156.t: "[ROM.GetName] требует Мунтению"
 ww1_romania.156.d: "С тех пор как мы оккупировали румынские земли по Фокшанскому перемирию и Бухарестскому договору, румыны стремятся вернуть свои земли. Они только что предложили больше никогда не объявлять нам войну в обмен на возвращение Валашской территории. Если мы не согласимся, сопротивление в этих провинциях возрастёт."
 ww1_romania.156.a: "Мы всегда будем союзниками!"
 ww1_romania.156.b: "В этом нет никакой выгоды."
 ww1_romania.157.t: "[GER.GetForeignName] соглашается на передачу земли"
 ww1_romania.157.d: "Взамен мы должны никогда больше не воевать с ними."
 ww1_romania.157.a: "Отлично!"
 ww1_romania.158.t: "Германия отказывается"
 ww1_romania.158.d: "Немцы заявляют, что договор ни при каких условиях не должен нарушаться, и Бухарестский договор гласит, что румынские земли находятся под оккупацией на неопределённый срок."
 ww1_romania.158.a: "Эти фрицы..."
 ww1_romania.159.t: "Французский арбитраж по Банату."
 ww1_romania.159.d: "Банат является зоной серьёзных разногласий между Румынией и Сербией из-за проживающих там меньшинств. Оккупация Баната Сербией быстро вызвала гнев румынских националистов, требовавших передачи всего Баната им. В качестве арбитра и победителя в целом Франция направила отряд из 15 000 солдат для обеспечения безопасности региона и его раздела между двумя государствами."
 ww1_romania.159.a: "Заметано"
 ww1_romania.180.t: "Смерть Фердинанда I"
 ww1_romania.180.d: "Король Фердинанд I скончался сегодня. Первоначально его старший сын Кароль должен был унаследовать трон, но он был лишён права наследования из-за своего образа жизни, включая супружеские измены. Поэтому королём коронован сын Кароля, Михай."
 ww1_romania.180.d_carol: "Король Фердинанд I скончался сегодня. Наследный принц Кароль коронован как король."
 ww1_romania.180.a: "Да здравствует король Михай I"
 ww1_romania.180.b: "Да здравствует король Кароль II"
 ww1_romania.181.t: "Возвращение Кароля Караимана."
 ww1_romania.181.d: "Кароль пообещал Конгрессу, что прекратит свою любовную связь и воссоединится со своей бывшей женой, и на этих условиях настаивал на своей коронации."
 ww1_romania.182.t: "Мечта о Великой Румынии"
 ww1_romania.182.d: "Бухарестский договор положил конец войне Румынии с Центральными державами. Хотя он считался относительно мягким, его ограничения были достаточны, чтобы подпитывать миф об «ударе ножом в спину», который после нескольких кризисов 1920-х годов привёл к краху политического истеблишмента страны. Смерть короля Фердинанда и ведущего либерального политика страны открыла путь двум крайне амбициозным людям: королю Каролю II и Корнелиу Зелеа Кодряну. Они объединились, чтобы свергнуть румынскую демократию и начать крестовый поход за воссоединение Румынии, но как долго эти две сильные личности смогут работать вместе, прежде чем их амбиции столкнутся открыто?"
 ww1_romania.182.a: "Никто не знает, как долго это продлится."
 ww1_romania.183.t: "Открытие компании Cerchez & Co."
 ww1_romania.183.d: "Сегодня недавно основанная авиационная компания Cerchez & Co. была открыта на их аэродроме в Читиле, к северо-западу от Бухареста. Компания является пионером в области авиации, имеет лётную школу и мастерскую по производству самолётов. Они станут очень полезным партнёром в развитии румынской авиации, и Министерство войны уже заинтересовано в закупке нескольких самолётов у них."
 ww1_romania.183.a: "Великое событие в авиации!"
 ww1_romania.184.t: "[ROM.GetName] запрашивает взаимные гарантии."
 ww1_romania.184.d: "Сегодня румынское правительство обратилось к нам с просьбой подписать с ними оборонительный пакт для предотвращения любых попыток венгерского реваншизма. Этот пакт может помочь обеспечить стабильность и мир на Балканах."
 ww1_romania.184.a: "Конечно."
 ww1_romania.184.b: "Нам не нужен их альянс"
 ww1_romania.185.t: "[FROM.GetName] принял взаимные гарантии."
 ww1_romania.185.d: "Правительство государства [FROM.GetAdjective] приняло наше предложение о взаимных гарантиях. Этот, казалось бы, небольшой договор является огромным шагом в обеспечении мира и стабильности на Балканах."
 ww1_romania.185.a: "Отлично!"
 ww1_romania.186.t: "Румыния предлагает балканский альянс"
 ww1_romania.186.d: "Сегодня румынские дипломаты прибыли в нашу столицу, чтобы узнать, заинтересованы ли мы в заключении с ними союза для обеспечения мира на Балканах и сдерживания Венгрии. Этот союз может оказаться очень полезным для нас, особенно если какой-либо венгерский режим попытается «вернуть» свои земли."
 ww1_romania.186.a: "Конечно, этот альянс должен быть подписан!"
 ww1_romania.186.b: "Мы прекрасно справляемся сами по себе."
 ww1_romania.187.t: "[FROM.GetName] вступило в Альянс"
 ww1_romania.187.d: "[FROM.GetAdjective] дипломаты уведомили нас сегодня о том, что они согласны на наш союз, который создаст мощную силу на Балканах для поддержания мира и стабильности в регионе против любых угроз."
 ww1_romania.187.a: "Отлично!"
 ww1_romania.188.t: "Румыния зарпашивает гарантии"
 ww1_romania.188.d: "Сегодня румынское правительство запросило у нас гарантии для защиты своей страны от крупных угроз. Сотрудничество с Румынией может быть очень выгодным для нас, дав нам отличного балканского партнёра, с которым мы могли бы совместно действовать против общих врагов в регионе."
 ww1_romania.188.a: "Конечно, мы согласны"
 ww1_romania.188.b: "Кого это волнует"
 ww1_romania.189.t: "Франция согласна гарантировать нас!"
 ww1_romania.189.d: "Сегодня французское правительство приняло нашу просьбу и объявило, что будет защищать Румынию от иностранных вторжений. Это огромный шаг в франко-румынских отношениях и обеспечит мир в нашем регионе."
 ww1_romania.189.a: "Отлично!"
 ww1_romania.190.t: "Венгрия сдается Румынии"
 ww1_romania.190.d: "Сегодня венгерское правительство объявило о предложении условной капитуляции Румынии, которое румынское правительство приняло. Капитуляция положила конец войне на Балканах и передала Трансильванию под контроль Румынии."
 ww1_romania.190.a: "Ура!"
 ww1_romania.190.b: "Мир возвращается на балканы"
 ww1_romania.190.c: "Однажды мы вернем их обратно..."
 ww1_romania.191.t: "Румыния оккупирует Будапешт"
 ww1_romania.191.d: "Сегодня румынские войска продолжили наступление против [HUN.GetName], сумев достичь венгерской столицы Будапешта. Входу румынских войск в город было оказано мало сопротивления, поскольку в последние дни венгерская армия полностью развалилась под натиском румынского наступления. Румынские войска прошли парадом по городу, празднуя победу, и ожидается, что правительство [HUN.GetName] капитулирует в ближайшие дни, поскольку власть правительства полностью рухнула с падением их столицы.\nНеизвестно, каково будущее Венгрии после этой войны, но Румыния, несомненно, станет сильной державой в регионе."
 ww1_romania.191.a: "Какая катастрофа!"
 ww1_romania.191.b: "Поразительная победа."
 ww1_romania.191.c: "Мечта о Великой Румынии близка!"
 ww1_romania.192.t: "Белградское перемирие"
 ww1_romania.192.d: "Сегодня было подписано Белградское перемирие, ознаменовавшее официальное прекращение военных действий между Тройственной Антантой и Венгрией. Это также касается румынского вторжения в Трансильванию, где была установлена новая линия перемирия, которую румынские войска не должны пересекать."
 ww1_romania.192.a: "Мы должны подождать"
 ww1_romania.193.t: "Румыния нарушает режим прекращения огня!"
 ww1_romania.193.d: "Сегодня румынские войска начали пересекать линию перемирия, установленную Белградским перемирием. Это действие является явным нарушением приказов, установленных державами Антанты, и мы должны сплотить нашу армию, чтобы держаться до тех пор, пока Антанта не предпримет ответных действий."
 ww1_romania.193.a: "Будет ли это вообще волновать Антанту?"
 ww1_romania.194.t: "Антанта протестует против нарушения нами режима прекращения огня!"
 ww1_romania.194.d: "Антанта выразила протест против нашего недавнего нарушения Белградского перемирия и начала требовать от нашего правительства остановить наступление, призывая к дипломатическому решению кризиса. Они, похоже, не понимают угрозы, которую венгры представляют для нашей нации, и угнетения румын с их стороны."
 ww1_romania.194.a: "Мы просто освобождаем наш народ!"
 ww1_romania.195.t: "Антанта приказывает провести новую демаркационную линию!"
 ww1_romania.195.d: "Сегодня державы Антанты выдвинули новую демаркационную линию, приказав войскам обеих сторон не пересекать её. Это произошло после наступления за первую демаркационную линию, которое нарушало Белградское перемирие и вызвало гнев Антанты."
 ww1_romania.195.a: "Антанта что-то предприняла?"
 ww1_romania.196.t: "Нота Викса."
 ww1_romania.196.d: "Сегодня французский подполковник и делегат Антанты Фернан Викс направил нам ноту с требованием отступить к реке Тиссе. Если мы примем это, наше правительство станет крайне непопулярным, так как это будет воспринято как де-факто капитуляция перед румынами, но если мы отклоним это, это покажет провал нашей политики умиротворения, направленной на то, чтобы дипломатически сохранить как можно больше Трансильвании, сотрудничая с Антантой."
 ww1_romania.196.a: "Мы не сдадим наши земли румынам!"
 ww1_romania.196.b: "Мы должны подчиниться, иначе вся Венгрия будет потеряна"
 ww1_romania.197.t: "Венгрия отвергает приказы Антанты!"
 ww1_romania.197.d: "Венгерскому правительству была направлена нота от Фернана Викса, французского подполковника и делегата Антанты в Венгрии, с требованием отступить к району у реки Тиссы. Венгерское правительство отклонило её и не отвело свои войска, и теперь Антанта дала нам разрешение обеспечить выполнение приказов Антанты и продвинуться к Тиссе."
 ww1_romania.197.a: "Мы сами все сдалаем!"
 ww1_romania.198.t: "Армия разваливается под румынским наступлением на Тиссу!"
 ww1_romania.198.d: "Румыны начали крупное наступление к реке Тиссе, и наша армия начала полностью разваливаться. Солдаты бунтуют, отказываясь выполнять приказы, массово сдаются румынам, а те войска, которые всё же сражаются, крайне плохо оснащены и не имеют плана, что приводит к огромным потерям. Наш единственный реальный вариант — отступить к Тиссе и ждать вмешательства Антанты, иначе румыны дойдут до самого Будапешта."
 ww1_romania.198.a: "Отступаем к Тисе!"
 ww1_romania.198.b: "Мы должны сражаться за каждый клочок земли!"
 ww1_romania.199.t: "Чешское вторжение в Словакию!"
 ww1_romania.199.d: "Правительство государства [CZE.GetName] недавно предприняло несколько вторжений в Словакию, захватив территорию, однако мы мало что можем сделать, так как чехи пользуются полной поддержкой Антанты, и мы не можем предпринять никаких военных действий."
 ww1_romania.199.a: "Скоро наступит освобождение Словакии"
 ww1_romania.200.t: "Растущая напряженность на чешском фронте"
 ww1_romania.200.d: "В последнее время чехи предпринимают всё больше шагов на словацком фронте, продвигаясь дальше на нашу территорию и вступая в частые столкновения с нашими войсками. Полномасштабная война, похоже, на горизонте, и нам следует подготовить наступление, чтобы нанести сокрушительный удар до того, как они успеют среагировать."
 ww1_romania.200.a: "Отдайте приказ о быстром наступлении"
 ww1_romania.201.t: "Антанта отдает приказ об отступлении из Прешова"
 ww1_romania.201.d: "Словацкий город Прешов, бывший целью нашего наступления, был захвачен, и мы нанесли значительный урон чехам, однако державы Антанты приказали нам отступить на демаркационную линию между нами и чехословаками, в противном случае они дадут румынам разрешение на дальнейшее продвижение."
 ww1_romania.201.a: "Мы должны вывести войска и сфокусироваться на Румынии."
 ww1_romania.201.b: "Ни за что!"
 ww1_romania.202.t: "Провал чешского наступления"
 ww1_romania.202.d: "Наше наступление в Словакию для освобождения народа от оккупантов из государства [CZE.GetName] не достигло своих целей, и Антанта была разгневана нашим наступлением. Антанта теперь разрешила румынам продвинуться дальше в нашу страну, чтобы оккупировать её и разгромить наше правительство."
 ww1_romania.202.a: "Мы продержимся!"
 ww1_romania.203.t: "Антанта разрешает наступать против Венгрии"
 ww1_romania.203.d: "Державы Антанты разрешили нам начать наступление на Венгрию, чтобы свергнуть их правительство и начать оккупацию. Это произошло после того, как Венгрия начала наступление на государство [CZE.GetName], разгневав Антанту, которая теперь разрешает нам продвижение."
 ww1_romania.203.a: "На Будапешт!"
 ww1_romania.204.t: "Наша последняя возможность"
 ww1_romania.204.d: "После того как Антанта приказала нам отступить из Словакии после нашего успешного наступления, все надежды на дипломатическое решение этой войны и освобождение нашего народа потеряны. Антанта явно выступает против нашего правительства и поддерживает наших врагов на каждом шагу. Единственный вариант, который у нас остался, — это отчаянная военная атака на Румынию, удар через Тиссу в Трансильванию и решение войны таким образом."
 ww1_romania.204.a: "Мы должны пересечь Тису"
 ww1_romania.205.t: "Венгры планируют наступление через Тиссу!"
 ww1_romania.205.d: "Сегодня нас уведомил итальянский офицер, находившийся в Будапеште и получивший от венгерского правительства планы запланированного наступления через реку Тиссу. Венгры в настоящее время проводят массовую мобилизацию для подготовки отчаянного удара по Трансильвании."
 ww1_romania.205.a: "Тогда мы дойдём до Будапешта!"
 ww1_romania.206.t: "Армия полностью разваливается!"
 ww1_romania.206.d: "Наше наступление против Румынии прошло плохо: армия добилась нескольких первоначальных успехов, но затем впала в хаос, солдаты отказываются дальше сражаться, и наша армия полностью превосходится румынами. Дальнейшая оборона невозможна из-за развала армии, и наша капитуляция ожидается в ближайшее время."
 ww1_romania.206.a: "Это конец?"
 ww1_romania.208.t: "Румынское вторжение в Трансильванию"
 ww1_romania.208.d: "Сегодня румынские войска начали пересекать Карпаты, вторгаясь в контролируемую Венгрией Трансильванию. Румыны стремятся оккупировать земли, которые они считают своей законной территорией, ещё до того, как конференция Антанты успеет установить границы в этом регионе.\n\nПравительство Венгрии обратилось с просьбой о международной поддержке для остановки вторжения и мирного урегулирования спора, но маловероятно, что румыны повернут назад."
 ww1_romania.208.a: "Антанта должна прекратить это!"
 ww1_romania.208.b: "Есть ли у Венгрии шансы?"
 ww1_romania.208.c: "Transilvanie frumoasă, Pregăteşte-te mireasă..."
 ww1_romania.209.t: "Венгерско-чехословацкая война"
 ww1_romania.209.d: "После нескольких недель мелких стычек в Словакии между чехословацкими и [HUN.GetAdjective] силами между обеими странами вспыхнула полномасштабная война. Венгры, понеся большие потери в Словакии от чехословаков, начали полномасштабное наступление с целью разгрома чехословацкой армии и «освобождения» Словакии.\n\nИсход этой войны неясен, так как маловероятно, что Венгрия сможет успешно уничтожить чехословацкую армию, пока продолжается война с румынами."
 ww1_romania.209.a: "Их армии будут сокрушены!"
 ww1_romania.209.b: "Еще одна война на Балканах?"
 ww1_romania.209.c: "Венгрия еще больше обрекла себя на гибель..."
 ww1_romania.210.t: "Буковина заявляет о союзе с нами!"
 ww1_romania.210.d: "В Буковине Румынский национальный совет созвал Генеральный конгресс Буковины и запросил объединение Буковины с Румынией. Союз был одобрен и теперь официально оформлен нашим правительством, что фактически аннексирует регион."
 ww1_romania.210.a: "Буковина была освобождена!"
 ww1_romania.211.t: "Буковина заявляет о союзе с Румынией"
 ww1_romania.211.d: "В Буковине Румынский национальный совет созвал Генеральный конгресс Буковины и запросил объединение Буковины с Румынией. Союз был одобрен в отсутствие украинских представителей и оформлен румынским правительством, аннексирующим территорию у нас."
 ww1_romania.211.a: "Можем ли мы что-то сделать?"
 ww1_romania.212.t: "Капитуляции Венгрии"
 ww1_romania.212.d: "Венгрия отказалась от продолжения войны и уступила большую часть своих земель в Трансильвании, которые по праву принадлежат нам. С этой победой наши армии могут вернуться домой, и может начаться интеграция новых земель в румынское государство."
 ww1_romania.212.a: "Трансильвания была освобождена!"
