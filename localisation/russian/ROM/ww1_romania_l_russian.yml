 ROM_kings_country_category_desc: "Будучи конституционной монархией с довольно сильным разделением властей, Конституция все же делегирует королю многие полномочия. Король Румынии может отправлять в отставку правительства, а также распускать парламент во время кризиса. Хотя эти полномочия используются крайне редко, они также оказывают огромное влияние на мнение общественности и политиков Румынии. Если король слишком сильно возмущается нашим правительством, он может поддержать оппозицию или даже прибегнуть к крайним мерам. В то же время, если король одобряет наше правительство, он может использовать свою политическую популярность для продвижения нашей программы.\n\nТекущее мнение короля о правительстве - [KingsOpinionRomania]\n"
 ROM_kings_country_category_tt: "Мнение Короля может меняться следующим образом:\n§GОчень позитивно§!;\nИзменения:\n£political_power_texticon  Прирост политической власти: §G+20%§!\n£stability_texticon Стабильность: §G+12.00%§!\n§7Позитивно§!;\nИзменения:\n£political_power_texticon  Прирост политической власти: §G+10%§!\n£stability_texticon Стабильность: §G+6.00%§!\n§YНейтрально§!;\nИзменения:\n£political_power_texticon  Прирост политической власти: §Y+0.0%§!\n£stability_texticon Стабильность: §Y+0.00%§!\n§OПлохо§!;\nИзменения:\n£political_power_texticon  Прирост политической власти: §R-10%§!\n£stability_texticon Стабильность: §R-6.00%§!\n§RОчень плохо§!;\nИзменения:\n£political_power_texticon  Прирост политической власти: §R+20%§!\n£stability_texticon Стабильность: §R+12.00%§!\n"
