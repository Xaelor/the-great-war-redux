l_russian:
 FOCUS_FILTER_ROM_LAND_REFORM: "Земельная реформа"
 ROM_restore_civilian_control: "Провести новые внеочередные выборы"
 ROM_restore_civilian_control_desc: "Управлять страной – это тяжёлая работа. Король Кароль всем своим великодушием решил вновь разрешить демократию, на время. Им придётся работать осторожнее и усерднее, если они хотят сохранить свою власть."
 ROM_national_opposition_idea: "Национальная оппозиция"
 ROM_the_carp_constitution: "Конституция Карпа"
 ROM_the_carp_constitution_desc: "С нейтрализацией всех врагов Карпа мы наконец-то можем принять решительные меры по реорганизации румынского государства. События прошлого года ясно показали, что Румыния должна отойти от декадентского парламентаризма и выбрать сильного правителя, а наша новая конституция как раз и обеспечит это."
 ROM_balance_the_budget: "Сбалансировать бюджет"
 ROM_balance_the_budget_desc: "Многие либеральные правительства в прошлом создавали большой дефицит бюджета. Нашим долгом является искоренение этой финансовой неустойчивости. Мы сократим нецелевые расходы, чтобы уже к следующему году обеспечить небольшой профицит."
 ww1_romania.121.t: "Беспорядки на Севере"
 ww1_romania.121.d: "Наше решение о запрете НЛП и СДПР не прошло гладко. На севере страны, где НЛП имеет наибольшую поддержку, вспыхнули беспорядки. Они требуют отставки правительства Карпа и восстановления подлинной демократии в Румынии.\n\nКороль имеет неоднозначное мнение по поводу проиходящего. Хотя назначение раздробленной НЛП было бы неразумным, есть опасения, что Карп приведет страну к гражданской войне. Таким образом, в Коронном Совете обсуждаются идеи об отставке Карпа и всех политических партий. Некоторые считают, что король лучше справляется с проблемами Румынии, чем НЛП, СДПР и КП, которые за последние несколько лет привели страну лишь ко второму кризису."
 ww1_romania.121.a: "Карп прекрасно себя чувствует."
 ww1_romania.121.b: "Румыния слишком долго находилась под властью глупцов!"
 ROM_not_we_and_them_but_us: "Единство двух сословий"
 ROM_not_we_and_them_but_us_desc: "Маштабные реформы Ариона пока не затронули баланс между крестьянами и помещиками. Однако их хорошие отношения, сохранявшиеся на протяжении веков, неизбежно разорвутся. Разорвутся на куски, но эти куски не должны пропасть. Арион намерен восстановить отношения между двумя классами, превратив их связь в сотрудничество, а не эксплуатацию рабочего работодателем."
 ROM_invite_jews: "Безопасное пристанище для евреев"
 ROM_invite_jews_desc: "Наш большой сосед на востоке применил к еврейскому населению ужасающие меры, в результате чего всё больше и больше евреев бегут от беспорядков на Балканы. Возникает вопрос: куда им деваться? Наша страна готова ответить на этот вопрос и откликнуться. Мы поручим нашему еврейскому населению открыть свои двери для беженцев, спасающихся от преследований в Украине или в любом другом регионе, где они чувствуют себя в опасности."
 ROM_the_party_of_thieves: "Партия жуликов и воров"
 ROM_the_party_of_thieves_desc: "Руководство НЛП в прошлом было пронизано коррупцией, которая так глубоко укоренилась в обществе, что нам необходимо начать следствие. Мы должны провести расследование на предмет коррупции в государственных учреждениях НЛП и затем закрыть их."
 ww1_romania.167.t: "Румыния просит нас оказать давление на Болгарию с целью передачи Южной Добруджи."
 ww1_romania.167.d: "Наши румынские союзники давно имеют интересы в Южной Добруджи. Увидев, что Болгария окружена врагами со всех сторон, они считают, что настал подходящий момент, чтобы забрать эту землю. Стремясь избежать начала войны, они просят нас одобрить их требование о мирной передаче территории. Мы, конечно, хотим поддержать нашего союзника, но некоторые задаются вопросом, стоит ли изолировать Болгарию от Центральных Держав, чтобы Румыния смогла получить небольшой участок земли. Что же нам ответить?"
 ww1_romania.167.a: "Мы их поддержим"
 ww1_romania.167.b: "Им придется отступить"
 ww1_romania.168.t: "Германия согласилась поддержать нас"
 ww1_romania.168.d: "Мы получили сообщение от немецкого посла о том, что они готовы поддержать нас в нашем требовании о возвращении Южной Добруджи. Нам остаётся лишь отправить сообщение в Болгарию."
 ww1_romania.168.a: "Хорошо, что у нас есть надёжные союзники"
 ww1_romania.169.t: "Германия откланяет наши претензии на Южную Добруджу"
 ww1_romania.169.d: "Мы получили сообщение от посла Германии о том, что Германия не будет поддерживать наши претензии на Добруджу. Они утверждают, что такие действия сильно ухудшат отношения с Болгарией и подтолкнут её к вступлению в Антанту. К сожалению, мы слишком зависим от Германии, чтобы выдвигать какие-либо требования, поэтому Южная Добруджа пока останется болгарской."
 ww1_romania.169.a: "Какие у нас замечательные «союзники»!"
 ww1_romania.170.t: "Германо-румынское требование"
 ww1_romania.170.d: "Воспользовавшись нашей текущей ситуацией, змеи в Бухаресте потребовали передать им Южную Добруджу, угрожая начать войну. Что ещё хуже, их поддерживает Германская империя. Поскольку мы не сможем победить Румынию вместе с Германией, нам придётся принять их требование."
 ww1_romania.171.t: "Болгария уступает нашим требованиям"
 ww1_romania.171.d: "Болгария приняла наш ультиматум по Южной Добрудже, эта территория станет новой румынской провинцией!"
 ww1_romania.171.a: "Искусство дипломатии, а?"
 ww1_romania.170.a: "Просто возьмите, нам всё равно!"
 ROM_balkan_war_intervention_german_pressure: "$great_power_politics_balkan_powder_keg_tt_icon$ Германия требует от Болгарии передать Добруджу"
 ROM_advancements_in_plane_technology: "Заказать военную авиацию"
 ROM_advancements_in_plane_technology_desc: "Нам необходимо адаптировать [ROM.GetNameDef] к будущему, включая авиационные технологии. Многие румынские изобретатели и авиаконструкторы готовы принять этот вызов. Мы поручим одному из них спроектировать для нас самолёт, который можно будет использовать в военных целях, в основном для передачи сообщений на большие расстояния. Вопрос в том, кого же мы попросим?"
 ROM_domestic_air_manufactor: "Фонд «Cerchez and Co»"
 ROM_domestic_air_manufactor_desc: "«Cerchez and Co» — недавно основанная авиакомпания, которая занимается производством самолётов. Мы должны помочь ей с финансированием, так как она находится на грани банкротства. Если мы будем сотрудничать с ней, она окажет нам большую помощь в новом мире авиации."
 ROM_tackle_the_alcohollic_issue: "Решить проблему алкоголизма"
 ROM_tackle_the_alcohollic_issue_desc: "Алкогольные напитки занимают важное место в Румынии благодаря их эффектам, спасающим в тяжёлые времена: средний житель страны потребляет около 9 литров чистого спирта в год. К сожалению для наших солдат, они не могут пить на службе, иначе наши войска станут некомпетентными, а полки будут заполнены бесполезными людьми. Мы должны решить эту проблему, введя запрет на употребление алкоголя на рабочем месте."
 ROM_prepare_for_the_upcoming_war: "Приготовиться к предстоящей войне"
 ROM_prepare_for_the_upcoming_war_desc: "Страна не готова к войне. Её необходимо подготовить во всех аспектах: от экономики до тыла."
 ww1_romania.131.t: "Проблемы внутри церкви"
 ww1_romania.131.d: "Конечно, конституция Румынии предусматривает разделение Церкви и политики. Однако было бы наивно жаловаться, что это полностью соответствует действительности. Церковь по-прежнему может тайно поддерживать политических кандидатов, используя лазейки в законе, что она и делала на протяжении всей истории. В связи с недавними реформами, отменившими христианский Голубой закон, запрещающий различные виды деятельности в воскресенье, многие в Церкви обеспокоены тем, что наше правительство планирует дальше продвигать ослабление влияния христианства в стране. Что нам делать?"
 ww1_romania.131.a: "Мы должны их успокоить"
 ww1_romania.131.b: "Их мнение не имеет значения"
 ROM_strike_swift_and_hard: "Гипотеза «Z»"
 ROM_strike_swift_and_hard_desc: "Гипотеза «Z» — это план, разработанный Генеральным штабом, согласно которому в случае войны с Австрией и Болгарией основные силы армии должны продвинуться в Трансильванию, а остальная часть будет сдерживать болгар до прибытия подкрепления из России. Если всё пойдёт по плану, Трансильвания будет освобождена, а Болгария выйдет из войны."
 ROM_sway_the_vote_of_soldiers: "Повлиять на голоса солдат"
 ROM_invite_fredrick_wilhelm_as_king: "Пригласить Фридриха Вильгельма в качестве короля"
 ROM_sway_intellectuals: "Влияние интеллектуалов"
 ww1_romania.109.t: "[ROM.GetLeader] вынужден подать в отставку"
 ww1_romania.109.d: "Популярность [ROOT.GetLeader] рухнула из-за того, что он был вынужден подписать перемирие с Австрией. В связи с этим он был вынужден подать в отставку, и король решил заменить его кем-то, кто поможет наладить официальные мирные переговоры между Румынией и ее врагами."
 ww1_romania.109.a: "Давайте пожелаем ему всего хорошего"
 ROM_treaty_of_bucharest: "Бухарестский договор"
 ROM_carp_collaborationist_governmenmt: "$great_power_politics_great_war_tt_icon$ Германия создает коллаборационистское правительство Карпа"
 ROM_help1: "Если мы не подпишем мирный договор с [GER.GetFlag]§YГерманией§! в срок, §YПетре Карп§! сформирует прогерманское альтернативное правительство."
 ROM_entrench_the_aristocracy: "Укрепить аристократию"
 ROM_entrench_the_aristocracy_desc: "Общество деградировало. Нет ничего противоречивого в скорби по падению феодализма, ведь полуфеодальная империя находится прямо за нашей границей. Наврерно, они всё делают правильно, и мы тоже должны. Создание наследственных правительственных должностей позволит достойным людям оставаться у власти навсегда."
 ROM_rural_base.tt2: "\nНаш советник §YДимитре Стурдза§! §Gулучшает§! эффекты этого фокуса."
 pot_tt: "При выборе этого фокуса:\nПроизойдёт событие '§YЗакрытие Трамвайного общества§!'\nМы попытаемся закрыть несколько организаций, поддерживающих §lНЛП§!, по обвинению в коррупции. Мы должны быть готовы к §Rзначительному§! сопротивлению этим действиям!"
 ROM_re_assure_liberals: "Успокоить наших партнеров по коалиции"
 ROM_re_assure_liberals_desc: "Многие либералы в Румынии обеспокоены новым правительством короля. Они опасаются отката румынской демократии и замены демократии диктатурой. Эти слухи абсолютно ложны. Наше правительство не является завуалированной тенью короля, а король по-прежнему привержен румынской демократии."
 ROM_restore_christianity_to_romania: "Возродить христианство в Румынии"
 ROM_restore_christianity_to_romania_desc: "Румынская православная церковь издавна является опорой румынского общества. Ей должно быть отведено почётное место, что ещё больше укрепит единство нашего народа."
 ROM_blurry_the_lines_between_church_and_state: "Стереть границы между Церковью и государством"
 ROM_blurry_the_lines_between_church_and_state_desc: "Для сохранения политического контроля и влияния на избирателей необходимо пойти на уступки Румынской православной церкви. Потребуется тайная встреча с митрополитом Афанасием."
 ROM_autocomplete_19072: "Этот фокус будет §Yавтоматически завершён§! если произойдёт второе §Rкрестьянское восстание§! и король утратит доверие к политическим партиям Румынии."
 ROM_a_moral_romania: "Восстановить доверие к правительству"
 ROM_a_moral_romania_desc: "Последние коррумпированные администрации, в которые входили члены НЛП и КП, значительно подорвали веру народа в правительство Румынии. Мы должны стремиться восстановить доверие румын к нашему правительству."
 ROM_a_man_from_junimea: "Человек из Junimea"
 ROM_a_man_from_junimea_desc: "Основанное в 1863 году как небольшое литературное общество, Junimea превратилось в группу влиятельных политиков, писателей и поэтов. У них много полезных идей, они заявляют, что Румыния развила только внешнюю сторону современного общества и ещё не достигла полной зрелости. Они являются естественными союзниками правительства Карпа."
 ROM_disruptions_to_the_economy: "Нарушения в работе свободного рынка"
 ROM_harmonization_of_romanian_society: "Гармонизация румынского общества"
 ROM_harmonization_of_romanian_society_desc: "Благодаря нашему абсолютному контролю мы наконец-то сможем искоренить межклассовые конфликты и другие формы беспорядков в румынском обществе."
 ROM_junimea_ideas: "Идеи Junimea"
 ROM_geniocracy: "Правительство интеллектуалов"
 ROM_geniocracy_desc: "Очевидно, что нельзя доверять управлять страной массам, которые легко поддаются влиянию популистских подстрекателей, в то время как нынешнее правительство страдает от коррупции и непотизма. Только меритократическая система элит может спасти Румынию от гибели!"
 ROM_install_a_royal_dictatorship: "Правительство короля"
 ROM_install_a_royal_dictatorship_desc: "Время ограниченного парламентаризма в Румынии закончилось. Кароль I и его советники взяли на себя управление государством, наконец-то положив конец раздорам между политическими партиями. Что это означает для Румынии, никто не знает."
 ROM_pragmatic_politics: "Объединить консервативные партии"
 ROM_pragmatic_politics_desc: "СДПР и ДП уже давно придерживаются похожей политики, но всё же достаточно разной, чтобы противостоять друг другу. Пусть впредь это будет не так. СДПР получила полномочия, которых не было ни у одной партии до неё, и реально единственная надежда на выживание КП — это слияние с СДПР. Пусть так будет всегда."
 ROM_the_second_great_disaster: "Вторая великая катастрофа"
 ROM_the_second_great_disaster_desc: "На нашу страну обрушилось второе крестьянское восстание, столь же маштабное, как и предыдущее. Король настолько разгневан на парламент, что может просто распустить текущее правительство и не назначать новое."
 ROM_fuse_nationalism_and_literacy: "Слияние национализма и грамотности"
 ROM_fuse_nationalism_and_literacy_desc: "Умный человек знает, что конечной целью войны всегда является мир, поэтому мы не должны уклоняться от неё, когда она стучится в наши двери. Проблема заключается в том, что в Румынии не хватает людей, которые понимают, почему мы должны идти на жертвы. Проведение кампании по повышению грамотности среди населения помогло бы внедрить идею о том, что умный человек – это патриот, а патриот будет сражаться, когда это необходимо."
 ROM_new_elitism: "Новый элитизм"
 ROM_new_elitism_desc: "В Румынии теперь есть элита, которая не уступает элитарным обществам Франции и Англии, она поможет нам укрепить власть над Румынией. В этом, безусловно, нет никаких минусов. Верно?"
 ROM_put_a_leash_on_carp: "Накинуть поводок на Карпа"
 ROM_put_a_leash_on_carp_desc: "Всё более авторитарная риторика Карпа, а также его бессмысленный популизм нанесли ущерб КП. Мы должны жёстче контролировать его политику и сосредоточиться на сотрудничестве с более... разумными политиками."
 ROM_the_natural_division_of_society: "Естественное разделение общества"
 ROM_the_natural_division_of_society_desc: "Некоторые считают, что интеллектуальный разрыв между сословиями необходимо преодолеть, но правительство не должно этого допускать, чтобы избежать восстаний, подобных тем, которые разрушили нашу великую страну всего несколько лет назад. Массы будут слушать то, что мы им говорим, потому что у них больше не будет возможности думать иначе."
 ROM_you_think_you_just_fell_out_of_a_coconut_tree: "Великое просветление"
 ROM_you_think_you_just_fell_out_of_a_coconut_tree_desc: "Кульминация усилий правительства по преодолению интеллектуального разрыва в нашем обществе наконец-то наступила, и идеалы Junimea распространяются по всей стране. Вскоре каждый румын будет читать, писать и отстаивать свои интеллектуальные права, не поддаваясь устрашению перед элитами."
 ROM_new_elites.tt: "§YНациональных дух§!, который дает этот фокус, будет усилен при §Y50.00%§!, §Y60.00%§! и §Y70.00%§! поддержки §3демократии§!"
 no_happy_few: "Принял просьбу Кароля не отменять земельную реформу"
 ROM_enpower_the_elites: "Расширить права и возможности элиты"
 ROM_enpower_the_elites_desc: "Почему массы должны править? Демократия приводит только к хаосу. Мы должны забыть о крестьянской революции 1907 года, к чёрту последствия. Аристократия — лучшая форма государственного правления."
 ROM_we_happy_few: "Счастливы немногие"
 ROM_we_happy_few_desc: "Разве не землевладельцы являются одними из самых богатых в Румынии? Не надо их злить их ещё больше, это не приведёт ни к чему хорошему. Вместо этого мы должны обратиться к ним и предложить внести свой вклад в наше будущее внутреннее законодательство."
 ROM_the_third_force: "Третья сила"
 ROM_the_third_force_desc: "Похоже, что на данный момент слабая сторона румынской политики останется верной демократическим принципам, несмотря на её внезапное и неожиданное одобрение королём. Начались переговоры между новым правительством и возможными будущими членами коалиции о реформе и перераспределении властных полномочий. С учётом всего вышесказанного, кажется, что СДПР останется на своём месте."
 ROM_further_land_reform: "Решить проблему земельной реформы"
 arm_twister: "Ручной тормоз"
 ROM_the_workers_party: "Рабочая Партия"
 ROM_the_workers_party_desc: "Пусть все знают! Самым ярым защитником интересов рабочих является НЛП! Мы должны поддерживать прогресс, достигнутый благодаря предыдущим реформам, и регулировать максимальное количество рабочих часов."
 ROM_minimum_wage_law_idea: "Минимальная заработная плата"
 ROM_reduced_working_week: "Минимальная зарплата"
 ROM_liberal_government_tt: "Правительство возглавляет §lНЛП§!"
 ROM_liberal_government_tt_NOT: "Правительство не возглавляет §lНЛП§!"
 ROM_a_nation_of_peasants: "Нация фермеров"
 ROM_a_nation_of_peasants_desc: "Фермеры Румынии являются опорой всего народа, благодаря им румыны не голодают. Поскольку они составляют столь важную часть населения, мы должны вознаградить их. Мы примем новые законы о землевладельцах и вернём им часть земли, которая им принадлежит по праву."
 ROM_economic_protectionalism: "Аграрный протекционизм"
 ROM_economic_protectionalism_desc: "Румынские фермеры и рабочие должны быть в приоритете. Нам необходимо повысить тарифы на импортные товары, чтобы наши местные производители могли конкурировать с иностранными товарами, которые в последнее время наводнили наш рынок."
 ROM_undemocratic_methods: "Недемократические методы для демократической политики"
 ROM_undemocratic_methods_desc: "НЛП — это раздробленная партия, в которой есть фракции, поддерживающие и противостоящие различным либеральным реформам. Мы не можем тратить время и политический капитал на то, чтобы убедить всех принять этот план, и поэтому мы должны использовать лазейки, чтобы продвинуть часть нашей повестки дня. В данном случае цель оправдывает средства."
 ROM_further_land_reform_desc: "Румынский народ ожидает от нас дальнейшей земельной реформы. Мы должны оправдать его ожидания и поэтому обратимся ко всем политическим силам с целью разработки законопроекта, который устроит всех."
 ROM_influx_of_western_intellectuals_idea2: "Приток западных социалистов"
 ROM_towards_a_socialist_economy: "Переходная экономика"
 ROM_sa_faci_din_rahat_bici: "Sa Faci Din Rahat Bici"
 ROM_sa_faci_din_rahat_bici_desc: "Может наше государство и молодое, но наша нация старше самых величественных европейских держав. Нет никаких причин, по которым мы не должны стремиться к тому, чтобы догнать, а то и превзойти их. Однако всё начинается с малого, таково состояние нашей промышленности. Давайте же начнём наш путь, чтобы наконец занять своё место среди великих, с соответствующей промышленной базой."
 ROM_fixing_the_railways: "Ремонт железных дорог"
 ROM_fixing_the_railways_desc: "Железнодорожная система Румынии нуждается в некоторых улучшениях. Нынешние проблемы с нашими железными дорогами приводят к тому, что поезда почти никогда не ходят по расписанию, но что ещё хуже, создают задержки в поставках материалов, что значительно замедляет строительство. Если и есть место, с которого можно начать наш путь к сильной промышленности, то это именно оно. Как только мы исправим ситуацию с железными дорогами, можно будет приступить к обсуждению дальнейшего расширения промышленности."
 ROM_the_conservative_conservatives: "Консерватор в Консервативной Партии"
 ROM_the_conservative_conservatives_desc: "В последнее время КП начала терять свою позицию. Партия, которая изначально была консервативной, превратилась в хаос противоречивых левых и правых мнений по различным вопросам, практически лишённых всякой связности. К счастью, назначение Делавранча дало нам шанс вернуть консервативной партии её консервативность."
 ROM_develop_the_north: "Забытая половина страны"
 ROM_develop_the_north_desc: "Без сомнения, юг Румынии является наиболее развитым регионом страны. Север, напротив, испытывает серьёзные недостатки практически во всех аспектах. Мы больше не можем допускать, чтобы одна сторона одной и той же монеты была грязнее другой. С помощью надлежащих инвестиций мы сможем обеспечить окончательное разрушение невидимого барьера, разделяющего всех румын."
 ROM_prahova_valley: "Расширить долину Праховы"
 ROM_prahova_valley_desc: "В регионе долины Праховы сосредоточена основная часть промышленности Румынии. Инвестиции в процветающую добывающую индустрию могут оказаться полезными для будущего развития региона, а также стать ещё одним шагом на пути к ликвидации торгового дефицита нашей экономики."
 ROM_his_majestys_influence: "Влияние Его Величества"
 ROM_his_majestys_influence_desc: "Король Кароль имеет большое влияние на румынский парламент, а его прихоти и недовольство определяют деятельность правительства. Он является сильным монархом во всех отношениях, и его мнение ценится не меньше, а то и больше, чем мнение избранных должностных лиц. Угодить ему сложно, к тому же он имеет право распускать правительство. Эта право часто используется просто из-за его желания сменять партии."
 ROM_crush_left_wing_protesters: "Покончить с либеральным бойкотом"
 ROM_crush_left_wing_protesters_desc: "Многие левые отказываются сотрудничать с новым правительством Карпа. Хотя обычно мы не против того, чтобы левые терпели поражение, сейчас нам нужно, чтобы они присоединились к нам. С помощью некоторых сомнительных манёвров мы должны суметь положить конец этому бойкоту."
 ROM_law_on_mobilization: "Закон о мобилизации"
 ROM_law_on_mobilization_desc: "В рамках расширения армии необходимо принять новый закон, расширяющий призыв на военную службу. Премьер-министр должен представить этот законопроект в румынский парламент."
 ROM_study_enemy_cartography: "Изучить картографию противника"
 ROM_study_enemy_cartography_desc: "Генеральный штаб запросил изготовление и приобретение карт стратегических мест соседних стран, особенно Карпатских гор. Это даст нам преимущество над врагами."
 ROM_general_directorate_of_munitions: "Главное управление военного снаряжения"
 ROM_general_directorate_of_munitions_desc: "Управление амуницией — это новый отдел армии, созданный для закупки боеприпасов и их дальнейшего распределения. Он значительно поможет реорганизовать наши слабые линии снабжения."
 ROM_expansion_of_the_officer_corp: "Расширить офицерский корпус"
 ROM_expansion_of_the_officer_corp_desc: "Крупные операции подразумевают сложные приказы, сложные манёвры и массовые перемещения: наш нынешний офицерский корпус не в состоянии выполнить все эти задачи в нужном масштабе. Выпускные — не за горами, а это значит, что скоро появятся новые офицеры. Они будут хорошо служить Румынии, и очень скоро."
 ROM_build_a_domesic_arms_industry: "Расширить «Pirotehnia Armatei»"
 ROM_build_a_domesic_arms_industry_desc: "«Pirotehnia Armatei» — это государственное предприятие в Бухаресте, которое поставляет амуницию. В связи с потребностью в боеприпасах для нашей растущей армии, мы должны расширить производственную мощность, чтобы она соответствовала нашей быстро укрепляющейся армии."
 ROM_beggers_cant_be_chosers: "Массовый импорт иностранного снаряжения"
 ROM_beggers_cant_be_chosers_desc: "Несмотря на рост внутреннего производства, оно никогда не сможет заменить импорт оружия. Неважно, откуда оно поступает, главное, чтобы оно было хорошего качества и дешёвым."
 ROM_a_common_divison_structure: "Единая структура подразделений"
 ROM_a_common_divison_structure_desc: "В рамках стандартизации румынской армии необходима новая структура подразделений, иначе дивизии превратятся в вооруженные банды при малейшем нарушении дисциплины."
 ROM_restructure_the_high_command: "Реорганизация высшего командования"
 ROM_restructure_the_high_command_desc: "Нынешний Генеральный штаб полон людей, которые не осознают требований современной войны. Нам нужна свежая кровь, не только для того, чтобы идти в ногу с противником, но и для разработки новых тактик и стратегий."
 ROM_training_schools: "Открыть тренировочные училища"
 ROM_training_schools_desc: "Будет создана новая система учебных заведений, где наши новобранцы будут обучаться новейшим стратегиям, военному планированию и оружию, получая инструменты для победы."
 ROM_autonomous_army_structure: "Автономная структура армии"
 ROM_autonomous_army_structure_desc: "Нынешние дисциплинарные требования слишком жёсткие. Предоставление офицерам большей независимости от Генерального штаба повысило бы оперативную мобильность."
 ROM_psychological_warfare: "Психологическая война"
 ROM_psychological_warfare_desc: "С появлением новых средств массовой информации появились новые возможности для пропаганды. Нами будет создан специальный отдел пропаганды, который будет заниматься агитированием и подрывом боевого духа противника."
 ROM_continue_democratization: "Продолжение демократизации"
 ROM_continue_democratization_desc: "Идея демократии была одним из самых важных основополагающих принципов Румынии. Несмотря на свои недостатки, эта система в целом пока что работает хорошо. Кроме того, если к власти придет либерал, то сильный и консервативный парламент сыграет нам на руку."
 ROM_decentralization: "Децентрализация"
 ROM_revive_the_committee_on_the_agrarian_question: "Комитет по аграрному вопросу"
 ROM_revive_the_committee_on_the_agrarian_question_desc: "Настало время завершить земельную реформу. Было предложено бесчисленное количество законов, ни один из которых не был принят, но с нашим новым влиянием у нас плоявились шансы. Землевладельцы наверняка будут ворчать и жаловаться, но они осознавали неизбежность этой ситуации ещё с момента утверждения нашего мандата. Народ заслуживает больший кусок пирога. Скорее всего, наши попытки вызовут волнения в будущих поколениях. Давайте наконец созовём комитет для лучшей Румынии."
 ROM_decentralization_desc: "В Румынии находится множество разнообразных общин с разными потребностями. Местные органы власти лучше понимают интересы своих граждан, поэтому мы должны расширить их полномочия."
 ROM_the_burdens_they_endure: "Особые привилегии солдатам"
 ROM_the_burdens_they_endure_desc: "Солдатская служба является самой тяжёлой работой из всех возможных. Их преданность Румынии не имеет себе равных, они являются опорой государства. Мы должны вознаградить наших верных солдат дополнительными льготами."
 ROM_moderate_pnl: "§mСДПР§! имеет слишком большое влияние в нашей коалиции, чтобы вносить такие радикальные изменения."
 ROM_populist_rhetoric: "Популистская риторика"
 ROM_consolidate_support_amongst_rural_areas: "Увеличить поддержку сельских районов Румынии"
 ROM_challenge_pc_dominance_of_urban_romania: "Оспорить доминирование КП в городской Румынии"
 ROM_pcd_government_tt: "§YКДП§! - текущая правящая партия.\n"
 ROM_pcd_government_tt_NOT: "§YКДП§! - не текущая правящая партия.\n"
 disable_htopnl: "§RDisables§! national focus:'§Y Hostile Takeover of the PNL§!'"
 ROM_election_russik_style: "Мы будем руководить избирательной кампанией §lНЛП§!. Мы сделаем ряд решений в нашей кампании, и в зависимости от наших действий мы можем выиграть или проиграть выборы. §RНам не будут прямо сообщать результаты наших решений, так что выбирайте с умом§!."
 pnl_standing_improve: "Позиции §lНЛП§! на выборах укрепятся"
 ROM_vast_political_promises: "Широкие политические обещания"
 ROM_religious_tolerance: "Религиозная терпимость"
 ROM_religious_tolerance_desc: "Разрешив мусульманам, евреям, цыганам и другим религиозным группам исповедовать свои религии, а также закрепив их защиту законом, мы сможем сделать Румынию единой страной."
 ROM_the_uniting_principal: "Объединяющие принципы"
 ROM_the_uniting_principal_desc: "Подобно тому, как Валахия объединилась с Молдовой, образовав Румынию, мы должны объединить наши идеи и мировозрение в единый набор принципов. Это позволит нам укрепить нашу поддержку среди народа и короля."
 ROM_compassionate_conservatism: "Сострадательный консерватизм"
 ROM_compassionate_conservatism_desc: "Концепция «сострадательного консерватизма» подробно описывает, как правительство должно отстаивать гражданские свободы и справедливость. Мы должны следовать этому принципу, чтобы не стать хуже австрийцев и венгров."
 ROM_building_a_new_consensus: "Формирование нового консенсуса"
 ROM_building_a_new_consensus_desc: "Мы владеем самым мощным оружием. Неудивительно, что подавляющее большинство населения страны обожает Майореску, ведь он уделяет особое внимание в своей политике густонаселённым регионам. Он человек из народа и использует народ на благо страны."
 ROM_what_were_fighting_for: "За что мы сражаемся"
 ROM_what_were_fighting_for_desc: "Наш труд продолжает приносить плоды. Наш открытый подход к управлению позволил создать прочные союзы между различными политическими силами, воплотив в жизнь мировозрение Майореску. Хотя наша работа ещё далека от завершения, любой пессимизм в нашем правящем блоке исчез. С этого момента мы будем двигаться только вперёд."
 ROM_romania_for_those_who_earn_it: "Румыния для тех, кто её заслужил"
 ROM_romania_for_those_who_earn_it_desc: "Некоторые считают, что Румыния принадлежит элитам. Мы с этим не согласны. Мы должны ставить потребности каждого фермера, который печёт хлеб, каждого шахтёра, который добывает железо, каждого рабочего, который производит оружие, превыше всего. Именно они построили Румынию; она принадлежит им."
 ROM_those_who_are_often_forgotten_desc: "Карп слишком долго был доминирующей фигурой в КП. Его авторитарная и разъединяющая риторика слишком долго наносила ущерб политической стабильности Румынии. Мы должны избавиться от его влияния в КП и заставить партию тщательно проанализировать свою деятельность."
 right_wing_populist: "Популист правого крыла"
 left_wing_publisher: "Публицист левого крыла"
 ROM_the_crowned_jewl: "Сокровище короны"
 ROM_the_crowned_jewl_desc: "Бухарест — родина величайших представителей нашего общества, будь то писатели, политики или, самое главное, дворяне. Город на их благо — это город на благо всей страны. Процветающая столица в конечном итоге просачивается на окраины и, в конечном счёте, на остальную часть страны, вызывая рост более мелких городов, которые могут служить дальнейшими игровыми площадками для элиты."
 industrialist: "Промышленник"
 scholarly_statesman: "Государственный ученый"
 modernizer: "Модернизатор"
 ROM_in_the_hall_of_the_mountain_king: "В пещере горного короля"
 ROM_in_the_hall_of_the_mountain_king_desc: "Мир вокруг нас постепенно погружается в хаос. Всем известно, что в Европе в любой момент может разразиться война, поэтому Румыния, которая, скорее всего, будет поневоле вовлечена в неё и будет играть ключевую роль, нуждается в сильном руководстве, чтобы пережить эту бурю. Поэтому мы должны обратиться к королю с призывом положить конец системе ротации партий и предоставить нам мандат на ближайшее будущее."
 ROM_battle_for_the_soul_of_the_nation: "Битва за душу нации"
 ww1_romania.172.t: "Встреча в Бухаресте"
 ww1_romania.172.d: "После встречи с Коронным Советом в Бухаресте Майореску успешно убедил короля в важности стабильного и постоянного правительства. Хотя у короля были опасения и требования, в конечном итоге он согласился с аргументами Майореску. Таким образом, мы можем рассчитывать на использование нашего мандата для продвижения умеренных консервативных идей."
 ww1_romania.172.a: "Отлично!"
 disable_halve_parliment: "§RDIsables§! National Focus: §YHalve Parliaments Seats§!'"
 ROM_no_take_halve: "Пообещал королю, что мы не будем проводить эту политику."
 ROM_no_take_halve.tt: "Сформировал коалицию с КДП после просьбы короля."
 disable_we_happy_few: "§RБлокирует§! национальный фокус:'§Y$ROM_we_happy_few$§!'"
 ROM_promote_romanian_nationalism: "Кооптация румынского национализма"
 ROM_promote_romanian_nationalism_desc: "Миллионы румын проживают на чужой земле, которая на самом деле должна принадлежать нам. Чтобы подготовиться к их возвращению на родину, нам необходимо разжечь пламя национализма как внутри страны, так и за её пределами."
 ROM_cement_the_churches_status: "Зацементировать статус церквей"
 ROM_cement_the_churches_status_desc: "Румыния — прежде всего христианская страна. Учитывая широкое влияние церквей в Румынии, работа с ними будет необходима. Мы должны обратиться к ним и предложить несколько уступок за их поддержку."
 ROM_tax_cuts_for_poor_idea: "Налоговые льготы для бедных"
 ROM_tax_cuts_for_the_poor: "Облегчить бремя крестьян"
 ROM_tax_cuts_for_the_poor_desc: "Одним из главных предвыборных обещаний как НЛП, так и КП было снижение налогов для крестьян. Получив мандат, пришло время выполнить это обещание и облегчить финансовое бремя крестьян."
 ROM_overturn_the_blue_law: "Отмена Голубого закона"
 ROM_overturn_the_blue_law_desc: "Разделение Церкви и государства является одним из важнейших принципов румынской конституции. Голубой закон, запрещающий торговлю по воскресеньям, в основном основан на учениях Христа. Христиане могут дальше следовать этому принципу, но его не следует навязывать всем."
 pcd_leader: "Член §mКДП§!"
 pcd_member: "Член §mКДП§!"
 pcd_leader2: "Член §mКДП§!"
 ROM_ferd_king: "§YФердинанд I§! — король Румынии"
 ROM_a_voice_of_reason: "Голос разума"
 ROM_a_voice_of_reason_desc: "Умеренность во всём — это признак процветающей жизни. Возможно, смягчение политики нашей партии сделает Румынию более процветающей. Доходить до крайностей — безрассудно, а история доказала, что которой руководящие экстремисты наносят лишь ущерб нации. Нет никаких причин, по которым мы не можем организовать нашу политику таким образом, чтобы коалиция могла расшириться для выровнения нашей политики."
 ROM_a_useful_ally: "Полезный союзник"
 ROM_a_useful_ally_desc: "Король Фердинанд на данный момент является либеральным монархом. Будучи почти полной противоположностью своего дяди, бывшего короля Кароля, Фердинанд на удивление верит в ограниченную монархию. Это также означает, что он, в отличие от своего дяди, поддержит партию, избранную народом, что позволит нам принимать законы, которые раньше были бы невозможны. С его согласия реформы наконец-то смогут пойти в правильном направлении без задержек из-за печального опыта прошлого."
 plays_dirty: "Играет в грязные игры"
 lack_of_passion: "Отсутствие страсти"
 ROM_democratic_coalition: "Демократическая коалиция"
 ROM_democratic_coalition_desc: "В прошлом КДП была нашим хорошим партнёром по коалиции, и мы могли бы извлечь выгоду из формирования второго альянса с ними. Таким образом, мы сможем обеспечить полноценный мандат в парламенте."
 ROM_the_moderating_influence: "Влияние умеренных"
 ROM_the_moderating_influence_desc: "Нам нужно больше советников, чтобы наш умеренный эксперимент прошел гладко. Известные центристы откликнулись на призыв, и, похоже, мы достигнем нашей цели в кратчайшие сроки. Законодательство разрабатывается с головокружительной скоростью просто потому, что мы сотрудничаем с разными сторонами. Все хотят получить кусок пирога, и мы рады им его дать. Румыния остается процветающей страной благодаря усилиям множества людей."
 ROM_the_new_constitution: "Переворот в НЛП"
 ROM_the_new_constitution_desc: "С провалом земельной реформы в НЛП растёт призыв к смене руководства. Прогресс — это движущийся паровоз, но кажется, что нынешнее руководство не загружает в него достаточно угля. Новые альтернативы ищутся во всех уголках партии. Однако одна из них выглядит более убедительной, чем остальные: Константин Стере — сторонник либерализации и реформ, которые обязательно принесут партии популярность. Возможно, именно на него мы должны сделать ставку."
 ROM_a_unifying_figure_head: "Добиться полного мужского избирательного права"
 ROM_a_unifying_figure_head_desc: "Настало время, чтобы каждый мужчина в этой стране получил право голоса. Это обеспечит максимальную демократичность процесса, а если мы сохраним популярность, то и победу на выборах за выборами. Стере вынес это предложение на рассмотрение парламента. Хотя оно может вызвать недовольство у более консервативных депутатов, оно наверняка будет принято благодаря поддержке, которой он пользуется в настоящее время. Да здравствует румынская демократия!"
 ROM_the_house_always_wins: "Казино всегда в выигрыше"
 ROM_the_house_always_wins_desc: "Король решил положить конец постоянным сменам партий, поскольку он полностью поддерживает КДП. Теперь, когда наш мандат обеспечен, пришло время предпринять действия, которые мы не могли сделать раньше."
 ROM_mandatory_insurance: "Обязательное страхование"
 ROM_mandatory_insurance_desc: "Многие румынские горожане работают в небезопасных условиях без какой-либо компенсации за халатность работодателей, которая может привести к их травмированию. Мы должны положить конец этой эксплуататорской практике и обязать работодателей предоставлять своим работникам страховку."
 ROM_social_conservative_principle: "Принцип социального консерватизма"
 ROM_social_conservative_principle_desc: "Румыния уязвима перед натиском сил современности. Румынская традиционная культура должна быть сохранена."
 ROM_take_ionescu: "Таке Ионеску"
 ROM_the_natural_party_of_governance: "Естественная правящая партия"
 ROM_the_natural_party_of_governance_desc: "НЛП компетентно управляет страной на протяжении последних 3 лет. Получив доверие короля и народа, партия тщательно провела столь необходимые реформы и обеспечила стабильность в стране после крестьянской революции 1907 года. Очевидно, что НЛП справляется с управлением страной."
 ROM_from_the_top_down: "Поощрение иностранных инвестиций"
 ROM_from_the_top_down_desc: "Крестьянское сословие будет процветать, когда экономика будет процветать. Нам необходимо продолжать индустриализацию и создавать больше низкоквалифицированных рабочих мест на заводах со средней заработной платой для населения. Для этого мы должны предложить выгодные налоговые льготы иностранным компаниям, желающим инвестировать в Румынию."
 ROM_land_reform_pass: "§YЗаконопроект о земельной реформе§! §Gпринят§!"
 ROM_land_reform_fail: "§YЗаконопроект о земельной реформе§! §Rпровалился§!"
 land_reform_fail: "Законопроект о земельной реформе §Rне§! будет принят"
 ROM_HUN_war_1919: "Румыно-венгерская война продолжается"
 ROM_bratianu_resign: "Отставка Брэтиану"
 ROM_bratianu_resign_desc: "Неспособность НЛП провести последний законопроект о земельной реформе доказала королю, что либералы правили достаточно долго и что пришло время другой партии привнести свежие идеи в управление. Давайте отправим Брэтиану в отставку и позволим консервативной РП сформировать правительство."
 on_select_ROM_our_duty_to_the_people: "При выборе этого фокуса:\nПроизойдет событие «§YЗаконопроект Брэтиану о земельной реформе - начинаются дебаты§!»\nНам придется иметь дело с различными группами, пытающимися §Cповлиять§! на законопроект. Если законопроект будет принят, мы получим:"
 ROM_break_pnl.tt: "При выборе этого фокуса:\nЗапускает цепочку §Yсобытий§!, уменьшающих поддержку §3демократии§!"
 ROM_ferd_will_fuck_you: "§RБолее либерально настроенный король может отвергнуть это соглашение§!"
 ROM_king_carols_reign: "Правление Короля Кароля"
 ww1_romania.177.t: "Король Фердинанд смещает Делавранчу"
 ww1_romania.177.d: "Не секрет, что король Фердинанд более либерален, чем покойный король Кароль, но многие в нынешней администрации надеялись, что король Фердинанд неохотно примет соглашение, заключённое его отцом с консерваторами Делавранчи: никаких новых выборов до тех пор, пока политический климат в Европе не станет более стабильным. Однако, похоже, их надежды были ошибочны, поскольку король Фердинанд вручил Делавранче записку, уведомляющую его о том, что его время на посту премьер-министра подходит к концу, так как король намерен сформировать новое правительство."
 ww1_romania.177.a: "Ублюдок!"
 ROM_king_carols_reign_desc: "Хотя сам Кароль был немцем, многие считают его отцом-основателем румынского государства и настоящим румыном. Под его правлением мы обрели независимость от османов и превращаемся в региональную державу. Его новаторская система смены правящих партий по усмотрению не позволяла концентрировать власть в одних руках. Это, пока что, создало сильную Румынию. Да продлится его правление!"
 ROM_socialist_utopia: "Марксизм без авторитаризма"
 ROM_socialist_utopia_desc: "Мы сделали это. Мы построили социализм. Завершив преобразования, мы должны помнить, что не должны попасть в ловушку авторитарного авангардизма. Румыния — в первую очередь демократическая республика, и только во вторую — социалистическая."
 ww1_romania.178.t: "Вторая крестьянская революция"
 ww1_romania.178.d: "Политика Делавранчи оказалась слишком отчуждённой для крестьян Румынии, которые объединились, чтобы свергнуть правительство. С восстаниями по всей деревне и протестующими, оккупировавшими столицу, королю Каролю не оставалось выбора, кроме как капитулировать перед их требованиями и назначить нового премьера. Этим новым премьером оказался Константин Стере, давний радикальный либерал и убеждённый союзник крестьян."
 ww1_romania.178.a: "Что только что произошло?"
 ROM_dreams_of_a_great_romania_shortcut: "Внешняя политика"
 ROM_king_carols_reign_shortcut: "Внутренняя политика"
 ROM_our_duty_to_the_people: "Наш долг перед народом"
 ROM_our_duty_to_the_people_desc: "Народ требует земельной реформы, и король также изъявил свою волю. Парламент собрался для работы над обсуждением этого законопроекта. Будем надеяться, что всё пойдёт правильно."
 ROM_politically_engaged_population: "Политически активное население"
 ww1_romania.179.t: "Склоки внутри НЛП"
 ww1_romania.179.d: "Программа НЛП всё больше расходится во взглядах между её многочисленными фракциями. Одни призывают к решительному повышению тарифов, другие — к сбалансированной торговле. Некоторые пропагандируют элементы социализма, в то время как другие твёрдо стоят за принципы свободного рынка. При такой широкой коалиции НЛП запутало многих избирателей в том, за что же она на самом деле выступает. В результате её поддержка сокращается."
 ww1_romania.179.a: "Отлично! Пусть они сами сражаются."
 ww1_romania.175.t: "Коррупционный скандал вокруг НЛП"
 ww1_romania.175.d: "НЛП оказалась вовлечена в местный коррупционный скандал, поскольку губернатор города от НЛП был уличен во взяточничестве. Эта новость разошлась по газетам по всей стране и подорвала поддержку НЛП."
 ww1_romania.175.a: "Они сами себе роют могилу!"
 ww1_romania.176.t: "Митинги НЛП сорваны"
 ww1_romania.176.d: "Всё больше митингов НЛП сталкиваются с жёсткими мерами со стороны нашего правительства. Из-за невозможности организоваться их послание с трудом доходит до крестьян, что снижает их поддержку среди апатичного населения."
 ww1_romania.176.a: "Отлично!"
 ROM_law_on_southern_dobruja: "Закон о Южной Добрудже"
 ROM_law_on_southern_dobruja_desc: "С недавним завоеванием Южной Добруджи был сделан ещё один шаг к великому проекту Великой Румынии. Однако мы должны решить, как будет управляться этот регион, а также как будут обращаться с болгарским и турецким населением."
 ROM_encourage_romanian_migration_dobruja: "Поощрение миграции румын в Добруджу"
 ROM_encourage_romanian_migration_dobruja_desc: "Добруджа — это многообразный регион с большим населением, включающим не только румын, но и болгар, турок, греков и даже небольшое число немцев. Поощрение переселения румын в этот регион изменило бы демографический баланс в нашу пользу."
 ROM_concessions_to_muslim_romanians: "Уступки румынским мусульманам"
 ROM_concessions_to_muslim_romanians_desc: "В Добрудже существует большое мусульманское население, в основном турецкое, процент которого в населении Добруджи только увеличился с аннексией Южной Добруджи у Болгарии. Гарантия религиозной свободы и языковых прав не только даст нам опору в регионе, но и улучшит отношения с Высокой Портой."
 ROM_dreams_of_a_great_romania: "Мечты о великой Румынии"
 ROM_dreams_of_a_great_romania_desc: "Существует множество земель, которые в настоящее время контролируются другими странами, но которые по праву должны принадлежать нам. Если мы хотим вернуть их, нам необходимо укрепить нашу армию, а также наши внешние связи со странами, которые могут служить нашим интересам в предъявлении претензий на земли у наших соседей."
 ROM_negotiations_for_bukovina: "Переговоры по Буковине"
 ROM_negotiations_for_bukovina_desc: "Австро-Венгры знают не хуже нас, что для них означает ещё один фронт, что это значит для русских. Вопрос в том, готовы ли они заплатить цену за наше вступление в войну. Трансильвания не обсуждается, но Буковина, безусловно, может быть предметом переговоров..."
 ROM_support_from_germany: "Оружие от «Krupp»"
 ROM_support_from_germany_desc: "Немецкая компания Krupp уже долгое время является надёжным поставщиком орудий для румынской армии. Давайте увеличим заказы у них, чтобы помочь расширить нашу армию."
 ROM_french_industrial_support: "Французская промышленная помощь"
 ROM_french_industrial_support_desc: "Франция обладает одной из самых сильных экономик в мире, и мы можем многому у них научиться. Давайте пригласим несколько их промышленных экспертов в Румынию, чтобы помочь повысить производительность нашей экономики."
 ROM_increase_french_weapon_purchases: "Увеличение закупок французского оружия"
 ROM_increase_french_weapon_purchases_desc: "Нынешний объём военной поддержки, которую мы получаем от французского гиганта, высоко ценится, но румыны никогда не славились своей скромностью. Настало время снова связаться с ними и выяснить, можно ли договориться о дополнительной помощи."
 ROM_welcome_anglo_italian_banks: "Англо-итальянские банки"
 ROM_welcome_anglo_italian_banks_desc: "Глобальная капиталистическая империя, которую поддерживает Британия, представляет собой впечатляющее зрелище. Однако всё это работает гладко благодаря банкам. Приглашение нескольких из них для ведения бизнеса было бы прекрасным шагом для создания сильной экономической модели, подобной британской."
 ROM_center_consensus: "Согласие с центром"
 ROM_center_consensus_desc: "Межпартийные склоки между НЛП и ПК сильно навредили Румынии. ПКД были назначены королём не просто так: чтобы привести к власти объединяющее, умеренное правительство, которое сможет поддержать большинство румын."
 ROM_reach_out_to_the_industrialists: "Обращение к промышленникам"
 ROM_reach_out_to_the_industrialists_desc: "Промышленность Румынии мала, слаба и неэффективна. Мы должны связаться с промышленниками, как иностранными, так и отечественными, чтобы сократить разрыв между нами и нашими врагами."
 ROM_arfocus: "В конце концов, мы сможем национализировать §YСеверную Добруджу§! с помощью этого решения."
 ROM_romanian_army: "Надвигающаяся буря"
 ROM_revanchism: "Реваншизм"
 ROM_romanian_army_desc: "Война на горизонте, и наш генеральный штаб считает, что мы к ней не готовы. В любой день Европа может столкнуться, и мы намерены извлечь выгоду, встав либо на сторону французов, либо на сторону немцев. Вопрос сейчас в том, к кому нам следует обратиться за военным сотрудничеством?"
 ROM_lessons_from_prussian: "Доктрины прусского милитаризма"
 ROM_lessons_from_prussian_desc: "Нам многому нужно научиться, чтобы создать армию, способную вернуть наши земли. Почему бы не поучиться у тех, кто уже это сделал? Воинский этос сделает нас непобедимыми как духом, так и в бою."
 ROM_french_russian_attache: "Франко-российский атташе"
 ROM_french_russian_attache_desc: "The Franco-Russian alliance sits right on our border thanks to our border with Russian Bessarabia. This provides a wonderful opportunity for a Russian officer to increase the efficiency of our armed forces and perhaps even engage in exercises with their military."
 ROM_lessons_from_balkan_wars: "Уроки Балканских войн"
 ROM_lessons_from_balkan_wars_tt: "Должно быть выполнено одно из следующих условий:\n   Воевал с §Y[BUL.GetNameWithFlag]§!\n   Воевал с §Y[TUR.GetFlag][TUR.GetForeignNameDefCap]§!\n   Воевал с §Y[SER.GetNameWithFlag]§!\n   Воевал с §Y[MNT.GetNameWithFlag]§!\n   Воевал с §Y[GRE.GetNameWithFlag]§!"
 ROM_lessons_from_balkan_wars_desc: "За каждой победой и каждым поражением на землях к югу от нас мы извлекли суровый урок о ведении войн. Эти уроки теперь определяют стратегии, которые использует наша нация. Но как бы ни были смертоносны войны, которые мы только что вели, револьвер, направленный в голову Европы, в конце концов выстрелит, и эта война будет самой смертоносной из всех."
 ROM_adapt_to_the_times: "Адаптация к времени"
 ROM_adapt_to_the_times_desc: "Эта война не похожа ни на одну из предыдущих. Появились новые технологии, тактики и стратегии, и мы должны принять их, чтобы победить."
 ROM_to_the_trenches_you_go: "Вперед, в окопы"
 ROM_to_the_trenches_you_go_desc: "Как и на других театрах военных действий, фронт превратился в позиционную войну. Мы расширим призыв, чтобы отразить вторжение иностранных захватчиков."
 ROM_restructure_the_army: "Реструктуризация армии"
 ROM_restructure_the_army_desc: "Румынские вооружённые силы являются одной из крупнейших армий на Балканах, но они плохо оснащены, не обучены и не имеют опыта. С помощью наших союзников мы наконец сможем изменить это."
 ROM_political_unity: "Политическое единство"
 ROM_political_unity_desc: "Мы не можем позволить себе никакой слабости в правительстве. Единственный способ спасти страну — это коалиционное правительство национальной обороны."
 ROM_for_the_truth: "Pe Aici nu se Trece!"
 ROM_for_the_truth_desc: "Война с Австрией — это война за освобождение угнетённых румын в Венгрии. Мы должны укрепить боевой дух наших войск и обратиться к румынам в Австро-Венгрии, которые сейчас угнетаются, чтобы они сражались на стороне правды и освобождения!"
 ROM_lessons_from_carpathian_defense: "Вопреки всему!"
 ROM_lessons_from_carpathian_defense_desc: "Многие как внутри Румынии, так и за её пределами ожидали, что наши армии будут быстро разгромлены. Несмотря на многочисленные неудачи,"
 ROM_the_great_war_redux: "The Great War Redux"
 ROM_the_great_war_redux_desc: "Франция и Германия снова вступили в полномасштабную войну. В то время как последняя война между великими державами была ограничена ими самими, на этот раз к ним присоединилась половина мира. Учитывая наше ключевое положение в Европе, нам вряд ли удастся избежать вовлечения, поэтому мы должны рассмотреть наши варианты. Хотя Антанта, вероятно, пообещает наибольшие территориальные приобретения, готова ли наша армия противостоять Австрии? Нам, скорее всего, будет легче с Центральными державами, но стоит ли отказываться от наших амбиций в отношении Трансильвании в ближайшем будущем? Вопрос действительно сложный."
 ROM_our_call_to_arms: "Призыв к оружию"
 ROM_our_call_to_arms_desc: "С началом войны настало время присоединиться к нашим союзникам в битве во славу всей Румынии!"
 ROM_claim_bessarabia: "Освободительная война"
 ROM_claim_bessarabia_desc: "Бессарабия была неотъемлемой частью Молдавского княжества, пока не была захвачена русскими в 1812 году. Хотя часть её была возвращена после Крымской войны, мы были вынуждены уступить эту землю в обмен на признание нашей независимости царём. Как неотъемлемая часть Молдавии, этот регион необходимо вернуть из-под русского гнёта."
 ROM_crush_pro_entente_protesters: "Подавить протесты сторонников Антанты"
 ROM_crush_pro_entente_protesters_desc: "Поскольку среди общественности распространены профранцузские настроения, наше недавнее решение вступить в войну на стороне Германии было встречено с возмущением. Все протесты будут подавлены, и мы объявим военное положение в случае необходимости."
 ROM_abandon_the_central_powers: "Отказаться от Центральных Держав"
 ROM_abandon_the_central_powers_desc: "Хотя Румыния была неофициальным членом Тройственного союза с 1883 года, членство всегда держалось в секрете от общественности. Проблемы с Веной по поводу прав меньшинств в Трансильвании и растущие связи с Францией означают, что теперь у нас мало причин для продления союза."
 ROM_our_piece_of_the_pie: "Наш кусок пирога"
 ROM_our_piece_of_the_pie_desc: "Its time we officially staked our claims on our desired lands. We shall negotiate with the Entente and gain our just reward for aiding them."
 ROM_stir_anti_austrianism: "Разжигание антиавстрийской ненависти"
 ROM_stir_anti_austrianism_desc: "Австрия издавна была врагом румынского народа. Они отняли Буковину у Молдавии, оккупировали нас несколько раз и в сотрудничестве с венграми обрушили дальнейшие репрессии на трансильванских румын, когда те обратились к австрийскому императору с просьбой о предоставлении автономии. Румыния не может быть единой, пока Трансильвания не будет свободной."
 ROM_turn_west: "Поворот на Запад"
 ROM_turn_west_desc: "Поскольку мы вышли из Тройственного союза, нам понадобятся новые союзники. К счастью, мы уже нашли готового партнёра в лице французов. Франкофилия широко распространена во всех ветвях власти и среди широкой общественности, отчасти из-за общих латинских корней, а Бухарест перестраивается по образцу Парижа. Поэтому союз с Парижем является наиболее логичным вариантом."
 ROM_minimum_wage_law: "Закон о минимальной заработной плате"
 ROM_minimum_wage_law_desc: "Идея минимальной заработной платы для рабочих существует не так давно, но она постепенно была принята членами Британской империи и её субъектами, такими как Австралия и Новая Зеландия. Румыния, конечно, не является зеркальным отражением их процветания, но это, безусловно, разумная идея для укрепления доброй воли с рабочими (и потенциальными избирателями, если будет принято всеобщее избирательное право). Человек, который получает больше, работает усерднее, и это факт."
 ROM_pro_entente_protests: "Протесты сторонников Антанты"
 ROM_anti_corruption_campaign: "Антикоррупционная кампания"
 ROM_anti_corruption_campaign_desc: "В Румынии взятка может сильно помочь, в зависимости от того, как вы одеты, конечно. Слишком долго необеспеченный мандат означал бюрократию, которую можно было эксплуатировать, и они не были этим полностью недовольны. Мандат НЛП обеспечен, что идёт вразрез с тенденцией, но бюрократия не привыкла к такой стабильности. Нужно предложить руководящую руку тем, кто готов отказаться от своих методов в свете более сильного управления, и нанести удар по тем, кто просто не может."
 ROM_halve_parliments_size: "Сокращение числа мест в парламенте"
 ROM_halve_parliments_size_desc: "Парламент Румынии слишком раздут и могущественен. Чтобы уменьшить власть парламента, мы должны сократить его размер вдвое и провести новое разграничение границ избирательных округов в пользу консервативных политиков."
 ROM_law_and_order: "Стабильное правительство"
 ROM_law_and_order_desc: "The King's first priority above all is clearly a stable government. While the King may disagree with our anti-democratic policies, if we can promise the King a stable hand during the dangerous times the world is facing as of now then he may be inclined to accept our rule, for now."
 ROM_agrarianists_in_power: "Кандидат от аграриев"
 ROM_agrarianists_in_power_desc: "Падение коррумпированного правительства Карпа привело к тому, что король назначил Титу Майореску премьер-министром. Майореску принадлежит к «аграрной» фракции ПК, которая ставит во главу угла налогово-бюджетную ответственность, социальный консерватизм и, как и следовало ожидать, сельские вопросы, такие как образование и земельная реформа."
 ROM_for_country_side: "Все для деревни"
 ROM_for_country_side_desc: "Хотя твёрдое большинство консервативной партии состоит из элит из городских районов, мы не можем оставлять без внимания сельские районы, где проживает большая часть страны. Мы должны уделять им особое внимание и продолжать поддерживать их развитие."
 ROM_investments_in_rural_education: "Обязательное сельское образование"
 ROM_investments_in_rural_education_desc: "Многие люди в сельской Румынии просто не утруждают себя получением образования, так как предпочитают тратить время на сельское хозяйство. Такой высокий уровень неграмотности не может оставаться без внимания, и мы должны принять закон, предписывающий обязательное обучение грамоте."
 ROM_our_rural_base: "Потворствовать нашим сельским жителям"
 ROM_our_rural_base_desc: "Нам необходимо консолидировать нашу поддержку по всей стране, чтобы обеспечить себе народную поддержку. Мы должны усилить нашу пропаганду в сельской Румынии и принять несколько мелких законов в их пользу."
 ROM_invite_western_thinkers: "Пригласить западных мыслителей"
 ROM_invite_western_thinkers_desc: "Прозванный Парижем Востока, Бухарест стал знаменит своей архитектурой и культурой. Приглашение западных интеллектуалов для преподавания в Бухарестском университете ещё больше укрепит репутацию города."
 ROM_invest_in_romania_steel_industry: "Свернуть земельную реформу"
 ROM_invest_in_romania_steel_industry_desc: "Хотя земельная реформа была проведена после недавнего крестьянского восстания 1907 года, она плохо реализуется. Тем не менее, она всё ещё представляет угрозу для власти аристократии, поэтому дальнейшая земельная реформа будет противостоять либеральному влиянию."
 ROM_romania_for_those_who_deserve_it: "Румыния для тех, кто ее заслуживает"
 ROM_romania_for_those_who_deserve_it_desc: "«Каждая из семей, владеющих богатством десяти поколений, обладает им потому, что работала для этого. Они создали для себя реальность в свою пользу и преуспели. Наша задача — формировать реальность дальше в их пользу, субсидируя их образ жизни в обмен на их тактическую поддержку."
 ROM_those_who_are_often_forgotten: "За пределами эпохи Карпизма"
 ROM_military_cooperation_with_austria: "Военное сотрудничество с Австро-Венгрией"
 ROM_military_cooperation_with_austria_desc: "Несмотря на угнетение трансильванских румын, было бы плодотворно искать военное сотрудничество с австрийцами. Их время может прийти, а может и нет, но независимо от исхода будущих отношений было бы благоразумно извлечь как можно больше выгоды из наших нынешних отношений."
 ROM_krupp_weapon_purchases: "Закупки оружия от «Krupp»"
 ROM_krupp_weapon_purchases_desc: "Krupp имеет репутацию компании, которая даёт странам преимущество над врагами, не имеющее аналогов у других производителей оружия. Самым ярким примером является использование Пруссией их винтовок для обеспечения полной победы над противниками в войнах за объединение Германии. Наши текущие цели не слишком отличаются от тех, что были у Пруссии, так кто сказал, что то же решение не сработает для нас?"
 ROM_crush_the_protesters: "Объявить чрезвычайное положение"
 ROM_crush_the_protesters_desc: "Состояние страны неприемлемо. Леворадикальные бандиты в сговоре с их предателями-праворадикалами, очевидно, пытаются свергнуть правительство Карпа. Мы должны объявить чрезвычайное положение и взять на себя более широкие полномочия, чтобы спасти страну от анархии."
 ROM_the_unholy_alliance: "Нечестивый союз"
 ROM_disband_the_parliament: "Запретить НЛП и КДП"
 ROM_disband_the_parliament_desc: "the PNL and PCD have been a thorn in our side for too long. Investigating them for any wrongdoing, and if nothing turns up, framing them, will give us the perfect excuse to ban them."
 ROM_the_peoples_dictator: "Народный диктатор"
 ROM_the_peoples_dictator_desc: "Парламентаризм привёл только к проблемам: интригам, кумовству и коррупции. То, что действительно нужно, — это просвещённый деспот, поддерживаемый элитной группой экспертов, отобранных по заслугам."
 ROM_get_party_in_line: "Заставить партию встать в линию"
 ROM_get_party_in_line_desc: "К сожалению, не все члены партии согласны с нашим новым курсом действий. Возможно, настало время выяснить, где их истинная лояльность..."
 ROM_the_carpist_renaissance_desc: "Под руководством Карпа как просвещённого деспота Румыния будет приведена в новый золотой век."
 ROM_reconcile_pcd: "Примирение с КДП"
 ROM_romania_for_those_who_earn_it_idea: "Оптимистичная Румыния"
 ROM_reconcile_pcd_desc: "Почти всё руководство ДКП состоит из бывших членов ПК. Хотя Карп, возможно, оттолкнул их своей глупостью и высокомерием, Майореску сможет наладить контакт с руководством ДКП так, как не могли предыдущие консервативные правительства, открывая путь к интеграции некоторых из них в правительство."
 ROM_great_egoism: "Великий эгоизм"
 ROM_accept_the_call_to_war: "Принять призыв к войне"
 ROM_anti_russianism: "Русофобия"
 ROM_anti_russianism_desc: "The Russians stole Bessarabia, occupied us, crushed the Wallachian Revolution, and made us cede land gained after the Crimean War. Its clear Romania won't be safe until their influence is expelled, and our Bessarabian brothers liberated."
 ROM_recruitment_campaigns: "Начать призывную кампанию"
 ROM_recruitment_campaigns_desc: "Чтобы Румыния могла выиграть сражения, с которыми нашей стране почти наверняка придётся столкнуться, нам нужно больше людей. Настало время взыскать с каждого молодого румына чувство патриотизма и призвать его на службу своей стране."
 ROM_embrace_revanchism: "Воплотить реваншизм"
 ROM_embrace_revanchism_desc: "Идея Великой Румынии, или România Mare, существует уже десятилетия, но до сих пор она была практически недостижима. Мы клянёмся объединить всех носителей румынского языка во имя Михая Храброго."
 ROM_recruitment_campaign: "Призывная кампания"
 ROM_german_support: "Немецкая поддержка"
 ROM_romanian_claims: "Румынские претензии"
 ROM_please_bucovina: "Попросить Буковину"
 ROM_secure_bulgaria: "Безопасность от Болгарии"
 ROM_operation_sarbia: "План «Сарбия»"
 ROM_neutral: "«Нейтралитет»"
 ROM_crush_the_entente_supporters: "Подавить сторонников Антанты"
 ROM_crush_the_entente_supporters_desc: "После нашего объявления войны России и Франции вспыхнули массовые беспорядки: протестующие маршируют по улицам, а призывные пункты поджигают. Мы не можем рисковать распространением беспорядков, поэтому у нас нет иного выбора, кроме как вызвать войска для подавления насилия."
 ROM_war_propaganda: "Военная пропаганда"
 ROM_war_propaganda_desc: "Всё должно быть посвящено военным усилиям, ибо наше дело правое. Эта война решит судьбу нашей нации на долгие годы."
 ROM_general_mobilization: "Всеобщая мобилизация"
 ROM_general_mobilization_desc: "С врагами Румынии у ворот призыв был значительно расширен, чтобы у нас был шанс выжить в предстоящих испытаниях."
 ROM_deal_with_the_liberal_king: "Конституция Карпа"
 ROM_deal_with_the_liberal_king_desc: "Последний человек, который может угрожать нашей власти, — это сам король. Союзник либералов, король Фердинанд, явно не заслуживает доверия! Он воспользуется любой возможностью, чтобы свергнуть нас в пользу своей предпочтительной партии, НЛП — или того, что от неё осталось. С роспуском парламента Карп сам возьмёт на себя ответственность за написание новой конституции, которая защитит румынскую демократию от короля, лишив его права отправлять правительства в отставку."
 deal_with_lib_king.tt: "Отключает категорию решений §Y«Страна короля»§! и все связанные с ней решения и события. Король больше не будет §Rотстранять§! наше правительство, а его мнение о нас больше не будет влиять на нашу §Yполитическую власть§! и §Yстабильность§!"
 house_win.tt: "Король изменит курс, полностью одобрив наше правительство и §Rпрекратив§! ротацию власти между §mКДП§!, §lНЛП§!, and §cКП§!. Он больше не будет §Rотстранять§! наше правительство, а его мнение о нас больше не будет влиять на нашу §Yполитическую власть§! и §Yстабильность§!"
 ROM_consolidate_the_dictatorship: "Снять маску"
 ROM_guide_parliament: "Внутрипартийная демократия"
 ROM_secure_the_peasants: "Заручиться поддержкой крестьян"
 ROM_secure_the_party: "Заручиться поддержкой партии"
 ROM_secure_the_elites: "Заручиться поддержкой элит"
 ROM_industrial_modernization: "Модернизация промышленности"
 ROM_voice_of_the_farmer: "Голос фермера"
 ROM_just_to_bide_time: "Выждать время"
 ROM_friends_from_junimea: "Друзья из Junimea"
 ROM_abandon_federalism: "Отказ от федерализма"
 ROM_jewish_emancipation: "Исход в Румынию"
 ROM_the_propaganda_machine: "Пропагандистская машина"
 ROM_the_natural_enemy: "Естественный враг"
 ROM_the_natural_enemy_desc: "Слишком долго русский медведь нависал над нашей нацией, разрушая наши устремления и угрожая нашему суверенитету. Их вмешательство в наши дела и пренебрежение к румынским границам сделали их нашим естественным врагом. Пришло время свести счёты и вступить в войну. Хватка царя должна быть разорвана, и с русской угрозой необходимо столкнуться лицом к лицу."
 ROM_encourage_development_of_the_left_flank: "Поощрять помощь социалистов в развитии"
 ROM_a_country_to_fight_for: "Страна, за которую стоит сражаться"
 ROM_new_constitution: "Новая Конституция"
 ROM_new_constitution_desc: "С введением всеобщего избирательного права для мужчин возникает вопрос: почему бы не пойти до конца? Стере разрабатывает новую конституцию при поддержке других членов коалиции с НЛП. После завершения она будет представлена на рассмотрение парламента, проголосована и, скорее всего, принята. В этом начинании мы пользуемся поддержкой большей части населения. Перемены грядут, и мы встретим их с распростёртыми объятиями."
 ROM_cooperative_agriculture: "Сельскохозяйственные кооперативы"
 ROM_cooperative_agriculture_desc: "Для достижения максимальной эффективности в сельском хозяйстве обсуждается идея кооперативного земледелия. Во время войны это обеспечит нашу продовольственную ситуацию лучше, чем продолжение нынешних практик, ориентированных на прибыль. Мы, безусловно, столкнёмся с противодействием со стороны крестьянства, но со временем они поймут, что это был лучший путь, когда их желудки станут полнее благодаря этому."
 ROM_nationalize_steel_industry: "Национализировать сталелитейную промышленность"
 ROM_nationalize_steel_industry_desc: "Многие товары и материалы необходимы для нашей экономики, но ни один из них не является столь важным, как сталелитейная промышленность. Оружие, самолёты, станки — всё требует этого сырья. Более левыми членами нашей коалиции была предложена радикальная идея — национализация. Если мы это сделаем, мы значительно укрепим целостность нашей экономики, хотя нарушение свободного рынка может вызвать волнения."
 ROM_poporanist: "Попоранизм"
 ROM_poporanist_desc: "Попоранизм — это румынский идеал национализма и популизма. Он был создан Константином Стере и направлен на увеличение политической власти крестьян, которые, в свою очередь, поддерживают государство, что приводит к правительству, способному делать то, что оно хочет. Хотя попоранизм считает себя антисоциалистическим, он выступает за коллективное ведение сельского хозяйства — определённо социалистическую политику."
 conservative_coalition: "Консервативная коалиция"
 ROM_kick_pnl_from_coalition: "Отстраниться от НЛП"
 ROM_kick_pnl_from_coalition_desc: "Постоянное правительство означает, что необходимость удовлетворять прихоти партий, не служащих интересам короля, неактуальна, и НЛП является ярким примером этого. Будет создана чистая коалиция с одной-единственной целью. Нас больше не будут обременять бюрократией."
 ROM_expansion_of_the_middle_class: "Расширение среднего класса"
 ROM_expansion_of_the_middle_class_desc: "Средний класс является основой нашей экономики и общества. Рабочий класс и крестьянство, безусловно, выполняют свою работу, но именно менеджеры, владельцы магазинов и фермеры создают большую часть богатства своими усилиями. Если мы укрепим их ряды, мы укрепим нашу экономику и получим все выгоды, которые из этого следуют. Не помешает и то, что они также голосуют больше всех..."
 ROM_lessons_from_denmark: "Датский опыт"
 ROM_lessons_from_denmark_desc: "Небольшая скандинавская страна Дания практикует кооперативное земледелие на протяжении веков, начиная с Чёрной смерти в XIV веке. Хотя результаты этой политики уже оказали положительное влияние на сельскохозяйственный сектор, гнев, проявленный в протестах против этого нового направления, был столь же сильным. Применение некоторых усовершенствованных методов из Дании может помочь прекратить эти протесты, поскольку датчане довели эту экономическую модель до совершенства, принося процветание не только правительству, но и фермерам."
 ROM_peasants_democracy: "Крестьянская демократия"
 ROM_peasants_democracy_desc: "Марш к абсолютной земельной реформе продолжается под заботливой рукой Стере. Новая конституция позволила ввести в действие более эффективные меры. Всё больше и больше земли перераспределяется в пользу народа, и Стере, безусловно, пожинает плоды. Популярность его правительства сейчас зашкаливает. Похоже, на этом этапе ничто не может остановить его на пути к либерализации."
 ROM_encourage_jobs_in_the_war_industry: "Расширить военную промышленность"
 ROM_encourage_jobs_in_the_war_industry_desc: "Чтобы выиграть эту войну, мы должны мобилизовать наш народ и промышленность для поддержки военных усилий. Мы будем быстро расширять наше военное производство, строя новые оружейные заводы и расширяя существующие."
 ROM_de_polarization: "Деполяризация"
 ROM_de_polarization_desc: "Почему все должны быть ультра-националистами или марксистами? Почему мы не можем все ладить, держаться за руки и петь вместе в маковом поле? Должно быть что-то, что мы можем сделать, чтобы все были добры друг к другу! Ну, для начала, мы можем лишить политических прав поляризующих личностей и продвигать межпартийное сотрудничество. Все будут счастливы, или иначе!"
 ROM_transition_towards_a_socialist_economy: "Переход к социалистической экономике"
 ROM_transition_towards_a_socialist_economy_desc: "После национализации сталелитейной промышленности свободный рынок был повергнут в хаос. Сейчас или никогда. Разрабатываются законы, чтобы задушить свободный рынок и установить новую норму: государственный социализм. Эти законы одновременно прокладывают путь к национализации других важнейших отраслей, хотя и не всех сразу. Это будет постепенный процесс, но в конце концов видение Стере будет реализовано."
 ROM_alliance_with_the_pdsr: "Альянс с СДПР"
 ROM_alliance_with_the_pdsr_desc: "Марксисты из PDSR в настоящее время противостоят нам, как и мы им. Это может измениться. Мы более похожи, чем кажется, и в нашем переходе к социалистической форме экономики мы можем пригласить их помочь в этом вопросе. Этот переход, несомненно, вызовет резонанс в мире румынских рабочих, и наличие друзей, имеющих корни в румынском рабочем движении, будет полезно для нашего дела."
 ROM_invite_french_socialists: "Пригласить французских социалистов"
 ROM_invite_french_socialists_desc: "Наше сотрудничество с PDSR принесло нам большую пользу. Было бы хорошо расширить нашу поддержку среди рабочих мира, рекламируя себя как пролейбористскую партию в дополнение к нашим уже прокрестьянским идеалам. Кто лучше сможет оказать нам такое признание и помощь, если не самые успешные социалисты из всех — французы!"
 ROM_restructure_our_logistics: "Улучшить логистику снабжения"
 ROM_restructure_our_logistics_desc: "С расширением потребностей вооружённых сил становится очевидным, что наша нынешняя логистическая сеть недостаточна. Модернизируя наши пути снабжения, мы можем обеспечить более эффективную доставку жизненно важных ресурсов на передовую, укрепить наши стратегические возможности и подготовить нашу страну к будущим вызовам."
 ROM_slow_and_steady_wins_the_race: "Медленный и стабильный выигрывает гонку"
 ROM_slow_and_steady_wins_the_race_desc: "Законы приняты. Процесс национализации наших важнейших отраслей начался. Несмотря на все волнения по поводу этого события, мы должны проявлять осторожность. Слишком много или слишком мало может иметь катастрофические последствия для нашей экономики. Мы не можем позволить себе ничего, что могло бы привести к разочаровывающей и опасной остановке всего процесса. Ключевым моментом является то, что мы должны делать это медленно."
 ROM_social_welfare_focus: "Социальное обеспечение"
 ROM_social_welfare_focus_desc: "Гражданам Румынии необходима программа социального обеспечения, финансируемая правительством, для оказания помощи населению."
 ROM_new_times: "Новые времена"
 ROM_new_times_desc: "Великая война закончилась, но её последствия для нашей страны были огромны. Инфляция растёт, а тень войны всё ещё витает в сознании нашего народа. Будущее может казаться неопределённым, но мы способны изменить его. Новая эра на горизонте, и мы должны встретить её во всеоружии."
 ROM_the_lame_duck: "Хромая утка"
 ROM_the_lame_duck_desc: "Что делать, что делать. Очевидно, что делать особо нечего. У нас мало полномочий и народной поддержки. Должно быть что-то, что угодно, что могло бы позволить нам что-то сделать. Возможно, инцидент."
 ROM_restore_romanian_pride: "Восстановить гордость Румынии"
 ROM_restore_romanian_pride_desc: "Ни один истинный румын не является социалистом, и любой румын, который становится им, отрекается от своего народа. Национальный этос должен строиться на этих принципах: Бог и Отечество, и только это."
 ROM_reunify_the_conservatives: "Воссоединение консерваторов"
 ROM_reunify_the_conservatives_desc: "Ей-богу! Социалисты определённо угрожают нашему правительству! Это не искусственно созданная ситуация, мы бы никогда не стали так поступать. Это реально и опасно! Мы должны объединиться с нашими собратьями-консерваторами против этой угрозы, что, как следствие, даст нам большинство в парламенте... Но кого это волнует!"
 ROM_torch_to_the_future: "Румынский либерализм"
 ROM_torch_to_the_future_desc: "Ион И. К. Брэтиану успешно руководил страной многие годы и будет руководить ещё долгие годы."
 ROM_socialist_crackdown: "Преследование социалистов"
 ROM_preventing_a_brain_drain: "Предотвратить утечку мозгов"
 ROM_preventing_a_brain_drain_desc: "Наша социалистическая политика отпугнула некоторых из наших самых талантливых умов. Оружейники, учёные, авиаконструкторы — все они стремятся покинуть страну, воспринимая наши действия как политику замалчивания и угнетения. Их необходимо заверить, что это не так и что инновации ценятся. Единственное, что изменилось, — это то, что теперь всё находится под добрым оком государства, а не предоставлено рыночным колебаниям."
 ROM_build_up_more_defenses: "Усилить оборону"
 ROM_on_select_lame_duck: "При выборе этого фокуса:\nПроизойдёт событие '§Y$ww1_romania.62.t$§!'"
 ROM_investigate_bureaucratic_corruption: "Расследование бюрократической коррупции"
 ROM_investigate_bureaucratic_corruption_desc: "Хотя ротация партий имела свои преимущества, нельзя игнорировать тот факт, что она способствовала коррупции. Власть — это опасный наркотик, и некоторые готовы пойти на всё, чтобы удержать её. Мы должны добраться до корней этих проблем. Наше правительство больше не будет запятнано коррупцией, поскольку мы стремимся искоренить её полностью."
 ROM_alexandru_c_cuza: "Александру К. Куза"
 ROM_reduce_trade_barriers_with_germany: "Уменьшить торговые барьеры с Германией"
 ROM_reduce_trade_barriers_with_germany_desc: "Предыдущее гражданское правительство не решалось на расширение торговли с Германией. Это было ошибкой, которая стоила нам огромного роста. Но теперь мы можем исправить это и снизить пошлины для стимулирования немецких инвестиций. Наше население может быть не согласно, но это лучший путь для Румынии."
 ROM_de_politicize_key_cabinet_positions: "Деполитизация кабинета министров"
 ROM_de_politicize_key_cabinet_positions_desc: "Партийная политика часто диктует, кого правительство должно выбирать в качестве кандидатов в кабинет. Это должно определяться не влиятельностью, а способностями. Сделать эти должности строго меритократическими даст стране больше уверенности в том, что их правительство не просто сидит сложа руки, а действительно делает всё возможное для улучшения жизни простых людей."
 this_wont_do_anything_if_completed_jewish_focus_tt: "§RThis focus will not have any effects if §YExodus to Romania§! or §YSafe Haven for Jews§! are completed.§!"
 this_wont_do_anything_if_completed_male_suffrage_focus_tt: "§RThis focus give you the National Spirit if the focus '§YPursue Full Male Suffrage§!' is completed.§!"
 ROM_end_antisemitism: "Обратиться к нашему прошлому"
 ROM_end_antisemitism_desc: "К сожалению, антисемитизм распространён в Румынии. Хотя евреи получили гражданство в 1860-х годах, они по-прежнему являются объектом дискриминации: НЛП и попоранисты обвиняют их во всех проблемах общества. Это пятно на нашей стране должно быть устранено."
 ROM_grand_coalition: "Большая коалиция"
 ROM_grand_coalition_desc: "Пришло время отбросить идеологию в пользу полной и абсолютной лояльности королю и нации. Партии уже провозглашают себя таковыми, но они, безусловно, этого не показывают. Чтобы исправить это отсутствие мотивации для улучшения жизни своих избирателей, король провозгласил необходимость формирования Большой коалиции во главе с PCD. Парламент почти наверняка примет это, что повысит доверие народа к своему правительству."
 ROM_support_romanian_literature: "Поддерживать румынскую литературу"
 ROM_support_romanian_literature_desc: "Румынская литература — это неразработанное золотое дно. Романисты и поэты, живущие в бедности в бухарестских квартирах, нуждаются в помощи, поскольку их произведения стоят больше, чем любые деньги, которые мы могли бы им предоставить. Время культурного возрождения близко, и художники нашей нации осветят путь."
 ROM_fight_illiteracy: "Борьба с безграмотностью"
 ROM_fight_illiteracy_desc: "Книги — это прекрасные вещи. Те, кто имеет роскошь читать их в нашей стране, действительно удачливы. Однако более важным является умение читать вывески, объявления, газеты — то, что необходимо для того, чтобы оставаться информированным и в безопасности. Проблема в том, что наше население не полностью грамотно, а это означает, что во время войны они не смогут многое сделать с информацией, которую мы им предоставляем о военных усилиях. Это необходимо изменить, и это можно изменить."
 ROM_secure_the_countryside: "Заручиться поддержкой селян"
 ROM_secure_the_countryside_desc: "В сельской местности всё ещё царят беспорядки и анархия после недавнего крестьянского восстания. Хотя некоторые из их проблем действительно были обоснованными, нам необходимо восстановить закон и порядок. Мы должны дать разрешение армии выступить на север и подавить протестующих."
 ROM_prussian_values: "Прусские ценности"
 ROM_prussian_values_desc: "Ни для кого не секрет, что наш король — Гогенцоллерн, но на протяжении всего своего правления он придерживался ценностей, внушённых ему румынским парламентом. Возможно, пришло время импортировать ценности, дорогие его предкам, чтобы обеспечить наше дальнейшее политическое развитие."
 ROM_recover_from_defeat: "Бухарестский договор"
 ROM_rejoined_the_war: "Вновь присоединился к войне"
 ROM_victory_in_the_great_war: "Начать демобилизацию"
 ROM_victory_in_the_great_war_desc: "Теперь, когда война наконец окончена, мы можем демобилизовать вооружённые силы, переведя тысячи необходимых людей на гражданские специальности. Наши герои наконец-то могут насладиться своей наградой."
 ROM_discipline_the_army: "Дисциплинировать армию"
 ROM_discipline_the_army_desc: "Наш прусский король решил сделать следующий шаг в формировании страны в соответствии со своими идеалами. Армии было приказано проводить учения при содействии немецких офицеров, и результаты выглядят многообещающими."
 ROM_tighten_our_grip: "Укрепить хватку"
 ROM_tighten_our_grip_desc: "Король Кароль добился значительных успехов в своей новой форме правления, и эти успехи приносят положительные результаты. Можно предпринять шаги для дальнейшего укрепления нашего режима, но единственным препятствием на пути к этим шагам является слово короля."
 ROM_expanding_our_majority_in_parliament: "Увеличить наше большинство в парламенте"
 ROM_expanding_our_majority_in_parliament_desc: "Успех партии, стоящей у власти, вызвал волну в румынском обществе. Любые выборы, объявленные сейчас, несомненно, приведут к убедительной победе их кандидатов. И, как хранители ключей к новым выборам, они могут именно это и сделать. Оппозиция дрожит в своих ботинках, и вполне заслуженно. Почти наверняка их электоральный мандат расширится."
 empty_space_tt: " \n"
 ROM_discredit_democracy: "Дискредитация демократии"
 ROM_enforce_fiscal_sustainability: "Обеспечение фискальной устойчивости"
 ROM_enforce_fiscal_sustainability_desc: "Во время войны наш бюджет растёт до небес. Приходится брать кредиты, и наша экономика в целом страдает. Это нелегко исправить, поскольку война требует затрат. Однако мы можем сделать так, чтобы в мирное время мы могли функционировать без кредитов. Путь налогово-бюджетной строгости — это путь, по которому нам нужно идти. Как только мы достигнем этого, мы сможем начать говорить о снижении последствий войны, которая, несомненно, уже на горизонте."
 ROM_romanian_economy_idea: "Румынская экономика"
 ROM_economy_idea_for_bookmark: "Румынская экономика"
 ROM_economy_idea_for_bookmark2: "Румынская экономика"
 ROM_continue_electrification: "Продолжить электрификацию"
 ROM_continue_electrification_desc: "Удары молнии возвещают о чём-то большем, или, по крайней мере, так говорят мифы и легенды. Возможно, эти легенды тогда не имели конкретной ценности, но сегодня они дают нам важный урок: электричество меняет мир. Нетрудно увидеть, что это уже происходит в различных государствах Европы. Пришло время и нам использовать молнии в полной мере и заодно вернуть смысл этим легендам."
 ROM_import_foreign_tools: "Импорт иностранных инструментов"
 ROM_import_foreign_tools_desc: "С промышленным прогрессом приходит необходимость во всё более крупных мерах. В конце концов страны сталкиваются с препятствием, которое не могут преодолеть, и вынуждены прибегать к внешней помощи, что ослабляет их. Мы должны предотвратить это, обратившись за помощью сейчас, пока наш прогресс всё ещё растёт в геометрической прогрессии. Если мы справимся с этой задачей, мы сможем затем направить наше внимание на дальнейшие промышленные инвестиции."
 ROM_concessions_to_the_upper_class: "Уступки верхнему классу"
 ROM_concessions_to_the_upper_class_desc: "Прогресс — это удивительное зрелище, но иногда он пугает. Не обычных граждан, а укоренившуюся знать, которая беспокоится, что с прогрессом приходят перемены, способные вырвать их с насиженных мест. Хотя было бы замечательно просто игнорировать это, существует проблема их власти и влияния, которое они оказывают на нашу экономику. Чтобы успокоить их страхи, мы должны заверить их, что волны прогресса не коснутся их берегов."
 ROM_support_industrialists: "Поддержать промышленников"
 ROM_support_industrialists_desc: "Движущей силой большинства этих инвестиций были группы богатых промышленников, которые лоббируют наше правительство для расширения операций. Они были и будут иметь решающее значение для любых дальнейших усилий. Мы должны заручиться их поддержкой с помощью соглашений и обещаний, которые позволят им вести свой бизнес так, как им угодно, в обмен на их дальнейшую поддержку."
 ROM_agricultural_knowledge: "Новые сельскохозяйственные технологии"
 ROM_agricultural_knowledge_desc: "Движение к индустриализации продолжается. Однако прогресс в сельском хозяйстве застопорился. Если мы пренебрежём основой нашей экономики, индустриализация будет невозможна. Единственный ответ — временно поставить наши фермы выше заводов. Тише едешь — дальше будешь, и мы не можем позволить себе быть неустойчивыми."
 ROM_government_aid_to_industries: "Содействие строительству новых заводов"
 ROM_government_aid_to_industries_desc: "Прямые субсидии оказались эффективными в процессе индустриализации. Теперь промышленники предоставляют правительству возможности для расширения строительной отрасли в Бухаресте. Мы можем и будем платить за это. Медленно, но верно мы инициируем эффект снежного кома, подкреплённый кредитами и государственными деньгами, и это лишь один шаг на пути к его поддержанию."
 ROM_move_away_from_an_export_based_economy: "Отход от экспортной экономики"
 ROM_move_away_from_an_export_based_economy_desc: "Мы не можем полагаться на стабильность окружающих нас стран. В конце концов, этот карточный дом рухнет вокруг нас, и мы не можем полагаться на тех, кто рухнет сильнее всех, если хотим процветать. Да, это может повысить цены и испортить дипломатические отношения, но это цена, которую мы можем заплатить. Это цена, которую мы должны заплатить."
 ROM_doubuja_steel_industry: "Сталелитейная промышленность Мунтении"
 ROM_doubuja_steel_industry_desc: "В Мунтении есть несколько сталелитейных заводов, но они относительно малы. По мере расширения нашей промышленности растёт и потребность в большем количестве стали. Мы должны расширить сталелитейную промышленность в этом регионе, и рабочие места, которые будут созданы на таких предприятиях, также будут полезны."
 ROM_expand_doubruja_dockyards: "Расширить порты Дуная"
 ROM_expand_doubruja_dockyards_desc: "У нас есть один выход к морю; один клочок земли, отделяющий нас от полной зависимости от наших соседей. Мы должны убедиться, что эта спасительная возможность не остаётся неиспользованной. Значительные инвестиции в наши порты позволят увеличить пропускную способность для торговли, как экспорта, так и импорта, а также расширить судостроение, если мы когда-нибудь будем стремиться к созданию мощного черноморского флота."
 ROM_increase_cereal_exports: "Увеличить экспорт зерновых культур"
 ROM_increase_cereal_exports_desc: "Хотя мы пытаемся перейти от аграрного общества к современному, было бы глупо не воспользоваться преимуществами нашего нынешнего урожая. Поскольку население мира постоянно растёт, увеличивается и количество ртов, которые нужно кормить. Мы можем использовать наш выгодный экспорт зерновых, чтобы гарантировать, что именно румынские урожаи достигнут этих ртов, а румынские карманы будут наполняться."
 ROM_ramp_up_exports_of_fruit_grains_and_seeds: "Увеличить экспорт зерновых, фруктов и семян"
 ROM_ramp_up_exports_of_fruit_grains_and_seeds_desc: "Наша страна производит много сельскохозяйственной продукции, такой как зерно и фрукты. Некоторые из них пользуются большим спросом за рубежом, так как в других странах их не могут выращивать так же хорошо, поэтому нам следует наращивать экспорт этих товаров, так как это значительно поможет нашей экономике."
 ROM_increase_gold_and_silver_exports: "Экспорт золота и серебра"
 ROM_increase_gold_and_silver_exports_desc: "Обычное золото всегда было нашим сильным экспортным товаром, но причина, по которой мы должны подчеркнуть, что оно обычное, заключается в том, что поддельное золото, каким-то образом, становится популярным. Некоторые владельцы бизнеса в Бухаресте сходят с ума по поводу «дурацкого золота», называя его следующим большим событием и говоря, что оно скоро заменит настоящее золото. Люди не обращали на них внимания, но каким-то образом цена на «дурацкое золото» резко выросла. Затем она снова упала, но это почему-то всё равно не остановило многих людей."
 ROM_expansion_of_the_lumber_industry: "Расширить лесозаготовительную промышленность"
 ROM_expansion_of_the_lumber_industry_desc: "Земли у гор покрыты бесконечными морями крепкой древесины, создающими зелёный полог вдоль Карпат. На пути к экономическому росту и промышленной мощи мы должны использовать всё, что у нас есть. Хотя это может огорчить некоторых, часть этих лесов является необходимой частью этого пути."
 ROM_trade_deals_with_germany_and_austria: "Торговые соглашения с Германией и Австрией"
 ROM_trade_deals_with_germany_and_austria_desc: "Наши друзья по ту сторону Карпат более чем готовы воспользоваться нашими торговыми возможностями. Их друзья, немцы, проявляют не меньший энтузиазм. Будь то интерес к экономическому доминированию, страх неурожая или пополнение запасов перед надвигающейся войной, мы просто не можем отказаться от их предложений. В конце концов, у нас нет других вариантов."
 ROM_close_the_trade_defict: "Устранение торгового дефицита"
 ROM_close_the_trade_defict_desc: "С нашим экспортом на подъёме и ростом внутреннего производства мы почти полностью устранили наш торговый дефицит. Больше ничего нельзя сделать, кроме как вести переговоры и использовать политические инструменты для заключения более выгодных сделок, чтобы достичь этой цели. Главной среди этих возможностей является Австрия. Они становятся всё более отчаянными, особенно учитывая, что хрупкость их империи постоянно подвергается испытаниям. Было бы глупо с нашей стороны не воспользоваться этими условиями."
 ROM_spike_interest_rates: "Резкое повышение процентных ставок"
 ROM_spike_interest_rates_desc: "Инфляция — это проблема, которая подрывает основы любого государства: простых людей. Хорошей мерой для укрепления основ нашего нового государства — Великой Румынии — является облегчение этих экономических трудностей путём повышения процентных ставок. Это несовершенное решение, но оно работает, и это лучшее, на что мы можем надеяться."
 ROM_price_controls: "Контроль над ценами"
 ROM_price_controls_desc: "Цены растут почти в геометрической прогрессии. Единственный способ бороться с этим — через меры контроля цен, которые, несомненно, будут непопулярны среди предприятий по всей стране, но это всё, что мы можем сделать."
 ROM_strengthen_the_leu: "Стабилизация лея"
 ROM_strengthen_the_leu_desc: "К сожалению, наша валюта — лей — имеет небольшую стоимость, до такой степени, что российские рубли почти вытеснили её в обращении в 1880-х годах. С планами отказаться от золотого стандарта стоимость лея необходимо будет повысить."
 ROM_back_in_couple_of_days.tt: "§YАурел Влайку§! вернётся со своим §Yболее безопасным§! проектом через несколько дней."
 ROM_different_buffs_aircraft.tt: "В зависимости от вашего выбора вы получите различные бонусы, связанные с авиационными технологиями."
 ROM_commission_air_name1: "§YCommissioned Aurel Vlaicu §!"
 ROM_commission_air_name2: "§YCommissioned Traian Vuia §!"
 ROM_pave_the_way_for_industrial_expansion: "Проложить дорогу индустриализации"
 ROM_pave_the_way_for_industrial_expansion_desc: "Наши заводы большие, но они могут быть ещё больше, и их может быть больше. Необходимо инвестировать в создание новых отраслей промышленности в наших промышленных центрах. Расширяя то, что у нас есть, мы облегчаем будущий рост. Это принесёт плоды в ближайшие годы."
 ROM_tackle_unemployment: "Борьба с безработицей"
 ROM_tackle_unemployment_desc: "После нашей демобилизации тысячи молодых и пожилых румынских мужчин ищут работу. Для них есть много работы в быстрорастущей добывающей промышленности, и мы должны направить их туда."
 ROM_transistion_away_from_wartime_jobs: "Переход с военных работ"
 ROM_transistion_away_from_wartime_jobs_desc: "Как и во всей Европе, спрос на военные материалы резко упал, и теперь тысячи промышленных рабочих уволены. Мы должны помочь им найти новую работу в послевоенной экономике."
 ROM_a_question_of_priorities: "Вопрос приоритетов"
 ROM_a_question_of_priorities_desc: "С началом войны и нашей неопределённой позицией в отношении нейтралитета мы сталкиваемся с дилеммой: продолжать расширять экономику или сменить курс и сосредоточиться на военном строительстве?"
 ROM_general_army_inspectorate: "Генеральная инспекция армии"
 ROM_general_army_inspectorate_desc: "Для всех должно быть ясно, что армия во время войны выигрывает от внимания к военным вопросам, а не к гражданской экономике. Простая идея, которой не так уж сложно следовать, и мы будем следовать ей. Укрепление нашей офицерской академии, адаптация тактики, о которых сообщают наши наблюдатели в Нидерландах: есть много способов убедиться, что наша армия готова к участию в войне, которая, несомненно, положит конец всем войнам."
 ROM_prioritise_economic_growth: "Приоритет на рост экономики"
 ROM_prioritise_economic_growth_desc: "Пока остальная Европа воюет, мы можем воспользоваться этим и получить прибыль. Нефть, полезные ископаемые, продовольствие — всё это можно продать тому, кто предложит больше, с большой выгодой."
 ROM_reduce_reliance_on_world: "Уменьшить зависимость от импорта"
 ROM_reduce_reliance_on_world_desc: "Что произойдёт, когда шахты, из которых мы импортируем железную руду, будут разбомблены? Что случится с полями, которые планировалось использовать для румынских тарелок всего несколько месяцев назад, если они будут сожжены? Если эта война нас чему-то научила, так это тому, что нам нужно уменьшить нашу зависимость от пороховой бочки, замаскированной под «Концерт Европы»."
 ROM_prioritise_industrialisation: "Приоритет индустриализации"
 ROM_prioritise_industrialisation_desc: "Its time we increased our industry. Diversification is neccessary in the modern era."
 ROM_from_farms_to_factories: "От ферм к фабрикам"
 ROM_from_farms_to_factories_desc: "Слишком долго Румыния была аграрной, сельскохозяйственной страной. Чтобы догнать остальной мир, это должно измениться."
 ROM_french_grain_deal: "Зерновая сделка с Францией"
 ROM_french_grain_deal_desc: "Мы близки с Парижем, и увеличение экспорта на французские рынки было бы очевидным шагом."
 ROM_ottoman_maize_deal: "Кукурузная сделка с османами"
 ROM_ottoman_maize_deal_desc: "Османы — бывшие угнетатели, но у них огромное, голодное население. Новая торговая сделка обеспечит нас большим количеством товаров из экзотического Востока."
 ROM_army_focus1: "Реорганизовать батальоны"
 ROM_army_focus1_desc: "Очевидно, что наши организационные стратегии бледнеют по сравнению с сильными армиями великих держав. Это ставит вопрос: сохранить нашу текущую устаревшую, едва проверенную в боях организацию вооружённых сил или перейти на то, что уже доказало свою эффективность в бою? Ответ очевиден, и перемены давно назрели."
 ROM_army_focus2: "Пересмотреть наши тактики"
 ROM_army_focus2_desc: "Мелкомасштабные операции имеют своё время и место, и это время было около 300 лет назад. Наша тактика строится вокруг небольшой армии, что не подходит для постоянно расширяющихся вооружённых сил Румынии. Следует разработать новую доктрину, основанную на масштабных манёврах на сотни километров."
 ROM_army_focus3: "Реструктурировать иерархию"
 ROM_army_focus3_desc: "The world around us seems to become more uniform by the day; perhaps for good reason. The way modern militaries are addressing the problem of operational hierachy seems to be identical, yet it seems to work. Something to think about, something to perhaps implement into our own military thinking."
 ROM_building_a_domestic_arms_industry: "Расширить отечественную оружейную промышленность"
 ROM_building_a_domestic_arms_industry_desc: "Мы не можем полностью полагаться на импорт иностранного оружия для оснащения нашей армии, и мы должны расширить внутреннее производство всего, что нужно нашей армии. Всё оружие, боеприпасы, снаряжение будут производиться здесь, по всей нашей стране."
 ROM_tackle_the_core_issue: "Решить главную проблему"
 ROM_do_not_delete.tt: "§RDon't delete this its for future§!"
 ROM_tackle_the_core_issue_desc: "Боже, бюрократия может быть такой болью. Ведь именно из-за неё мы не могли расширить наши вооружённые силы до начала большой войны! Как удобно, что наш законодательный орган наконец-то что-то решает, когда на карту поставлена судьба страны, но всё, что не является срочным, не имеет значения. Знаете, у пруссаков была та же проблема до того, как Бисмарк стал канцлером, и это едва не привело к отречению их короля! Это заставляет задуматься: может, нам следует называться Пруссией Балкан. В конце концов, у нас плохое чувство срочности, и нами правит Гогенцоллерн! Просто мысль, не обращайте на неё внимания."
 ROM_coalition_useless: "Будет сформирована коалиция, включающая некоторых членов парламента от §lНЛП§! и §CРНП§!."
 ROM_radical_land_reform: "Радикальная земельная реформа"
 ROM_the_apathetic_prime_minister: "Апатичный премьер-министр"
 ROM_the_apathetic_prime_minister_desc: "Западный Банат потерян по вине некомпетентности нашего премьер-министра. Что за глупость, что за безрассудство. Наша нация могла быть наконец-то по-настоящему объединена, но победила апатия."
 ROM_crack_down_on_radical_elements: "Подавление радикальных элементов"
 ROM_crack_down_on_radical_elements_desc: "В этой стране нет места радикальным идеологиям, разжигаемым страстями войны. Прочь из нашего правительства, прочь из нашей академической среды, прочь из нашей армии — всё это должно быть удалено!"
 ROM_alliance_of_convience: "Удобный альянс"
 ROM_alliance_of_convience_desc: "КДП предложила свою помощь в переписывании конституции. Они — лучшие, кого можно привлечь к этому делу, и нет никакой возможности повлиять на жалобы некоторых наших членов по их поводу."
 ROM_alliance_with_the_peasants_party: "Альянс с партией крестьян"
 ROM_LITTLE_ENTENTE_FACTION_NAME: "Малая Антанта"
 ROM_grand_coalition_idea: "Большая коалиция"
 ROM_rise_of_socialism: "Подъем социализма"
 ROM_victory_of_the_peasants: "Победа крестьян"
 ROM_victory_of_the_peasants_desc: "Ликуйте, ибо из пасти поражения народ вырвал победу у гигантов! Теперь настало их время — время дать импульс послевоенной экономике, вдохнув жизнь в крестьянство! Наша работа начинается сегодня и закончится, когда каждый человек в Румынии станет королём."
 ROM_the_man_to_end_the_chaos: "Человек, который покончит с хаосом"
 ROM_alliance_with_the_pnl: "Альянс с НЛП"
 ROM_alliance_with_the_anti_socialists: "Альянс с Антисоциалистами"
 ROM_shut_down_socialist_conference: "Закрыть Конференции Социалистов"
 ROM_bury_the_grudges_of_the_past: "Забыть Прошлые Обиды"
 ROM_bury_the_grudges_of_the_past_desc: "The war has taught us the cost of infighting. The Entente and German factions at each other's throats hindered our war effort, an effect so damaging from such a trivial thing. No more, for Romania must emerge united in policy and people. "
 ROM_court_the_stereianists: "Переговоры с Попоранистами"
 ROM_court_the_stereianists_desc: "Стерианисты, более известные как попоранисты, имеют крестьянство под своим влиянием. Их поддержка будет жизненно важна для достижения наших целей."
 ROM_true_meaningful_land_reform: "Настоящая Земельная Реформа"
 ROM_true_meaningful_land_reform_desc: "Решение давно назревшего вопроса о земельной реформе станет благом не только для нашей администрации, но и для нашей электоральной базы. Окончательный законопроект будет составлен в этих стенах, наконец-то давая народу то, что он заработал; нет, то, чего он заслуживает. Они заслуживают этого, ибо кем была бы Румыния без фермера, который доставляет еду на её стол?"
 ROM_hold_new_elections: "Новые Выборы"
 ROM_hold_new_elections_desc: "Великая Румыния свершилась, но народ возмущён потерей Западного Баната. Приближаются выборы, и нынешнее правительство стоит на шаткой основе. Оппозиция сплачивается, пока премьер-министр пребывает в унынии, размышляя о своих неудачах на мирных переговорах. Это хороший день для многих и ужасный для немногих."
 ROM_alliance_with_the_pcd2: "Альянс с PCD"
 ROM_dismantle_transylvanian_councils: "Закрыть Трансильванские Советы"
 ROM_joint_land_reform_efforts: "Совместная Земельная Реформа"
 ROM_nationalize_resita_enterprise: "Национализация Компании Resita"
 ROM_nationalize_resita_enterprise_desc: "Среди многих благ союза с Трансильванией — приобретение компании Reşiţa. Известная своим высококачественным металлом, она станет ключевым активом для страны."
 ROM_stimulate_the_economy: "Стимуляция Экономики"
 ROM_stimulate_the_economy_desc: "Чтобы стимулировать рост отраслей, которые сыграют ключевую роль в нашей послевоенной экономике, мы должны обеспечить средства для роста, а это означает субсидии и денежные вливания. Это будет стоить очень дорого, но мы сможем увидеть его плоды."
 ROM_improvements_on_fortifications: "Восстановление Фортификаций"
 ROM_improvements_on_fortifications_desc: "Некоторое время наши укрепления устаревали. Мы должны начать модернизацию этих укреплений и строительство новых для защиты нашей страны от врагов."
 ROM_modernize_army_arsenals: "Модернизация Арсеналов"
 ROM_modernize_army_arsenals_desc: "Арсеналы армии в нашей стране довольно устарели и не могут эффективно обслуживать нашу армию. Мы должны модернизировать эти арсеналы, вложив в них немного денег, и это будет стоить того."
 ROM_german_food_exports: "Экспорт Пищи в Германию"
 ROM_german_food_exports_desc: "Немецкая экономика сильно пострадала из-за морской блокады британским Королевским флотом, и поэтому Германия ищет новые способы сокращения нехватки продовольствия. Это включает в себя перенаправление наших урожаев в немецкие продовольственные запасы."
 ROM_1912_naval_program: "Румынская Программа Судостроения"
 ROM_1912_naval_program_desc: "Министерство войны распорядилось провести новый этап расширения флота, включая несколько крейсеров, дюжину эсминцев и даже подводную лодку. Хотя это займёт время, выгоды окупятся в долгосрочной перспективе."
 ROM_romanian_black_sea_fleet: "Черноморский Флот"
 ROM_romanian_black_sea_fleet_desc: "Морская программа 1899 года предусматривала добавление 4 эсминцев, 6 броненосцев береговой обороны и дюжины миноносцев. Хотя она так и не была реализована, этот план служит хорошей основой для расширения Черноморского флота."
 ROM_defend_the_danube: "Защитить Дунай"
 ROM_defend_the_danube_desc: "Дунай — это жизненная артерия Румынии, но, к сожалению, он уязвим для атак. Дунайская флотилия будет расширена для сдерживания морских десантов и предотвращения продвижения любых сил вверх по реке."
 ROM_law_on_minorities: "Румынизация"
 ROM_law_on_minorities_desc: "Пока наше празднование новых территорий может продолжаться, необходимо ответить на вопрос о нерумынах, проживающих на них. Ассимиляция — это ответ, и наши усилия должны начаться сейчас."
 ROM_integration_of_szekelyfold: "Интеграция Секейского края"
 ROM_integration_of_szekelyfold_desc: "Секейский край был для нас серьёзной проблемой: венгры выступали против нашей власти, постоянно протестуя и устраивая беспорядки. Однако, благодаря некоторым мерам нашего правительства, они наконец успокоились, и их антиправительственные действия прекратились. Теперь, когда венгерская угроза устранена, мы можем полностью интегрировать Секейский край в состав нашей страны."
 ROM_pillage_hungary: "Разграбить венгерскую границу"
 ROM_pillage_hungary_desc: "Венгрия слаба. Изуродованная Трианоном, она стоит одна против стаи стервятников, одним из которых являемся и мы. Давайте пировать на трупе «тюрьмы народов»."
 ROM_form_the_little_entente: "Формирование Малой Антанты"
 ROM_form_the_little_entente_desc: "Формирование Малой Антанты является важнейшей мерой для обеспечения наших национальных интересов и защиты стабильности наших границ от венгерского ревизионизма и потенциального возрождения влияния Габсбургов в Австрии или Венгрии. Создав союз с Чехословакией, мы создадим единый фронт, посвящённый сохранению территориальных завоеваний, которые определяют наш послевоенный суверенитет, и обеспечению регионального мира. Франция объявила о своей поддержке нашего будущего альянса, предоставляя нам необходимые дипломатические и военные гарантии. Это партнёрство является не только пактом о взаимной обороне, но и ясным заявлением о том, что мы будем соблюдать договоры и защищать баланс, установленный после Великой войны, обеспечивая нашу независимость и стабильность в Восточной Европе от любых сил, стремящихся его нарушить."
 ROM_anti_hungarian_propaganda: "Антивенгерская Пропаганда"
 ROM_anti_hungarian_propaganda_desc: "Наш долг — противостоять попыткам Венгрии подорвать наш суверенитет и стабильность Восточной Европы. Мы должны сообщить нашему народу и нашим западным союзникам, что венгерский ревизионизм представляет собой явную угрозу границам, установленным Трианонским договором. Амбиции Венгрии вернуть Трансильванию являются прямым вызовом целостности Великой Румынии, и мы представим это как опасность не только для нашей страны, но и для мира во всём регионе."
 ROM_retry_to_secure_banat: "Потребовать Западный Банат"
 ROM_retry_to_secure_banat_desc: "Обеспечение контроля над [764.GetName] было целью румынского правительства с момента нашей неудачи на Парижской мирной конференции."
 ROM_revitalization_of_the_north: "Экономическое Оживление Севера"
 ROM_revitalization_of_the_north_desc: "Дорогу! Дорогу! Дорогу инженерам, архитекторам и рабочим, садящимся на поезда, направляющиеся на север, несущим с собой процветание! С возрождением железных дорог мы наконец сможем индустриализировать север. Слишком долго безграничный потенциал Румынии был сосредоточен в Бухаресте, но теперь мы можем наконец радоваться новому, более светлому будущему в Молдове."
 ROM_romanian_hungarian_war_focus: "Интервенция в Венгрию"
 ROM_romanian_hungarian_war_focus_desc: "Венгры спровоцировали этот акт агрессии, не соблюдая демаркацию послевоенных границ, установленных договором."
 ROM_recall_romanian_engineers: "Отозвать Румынских Инженеров"
 ROM_recall_romanian_engineers_desc: "Группа румынских авиационных инженеров в настоящее время находится в государстве [FRA.GetNameDef] или других странах Западной Европы. Мы можем отозвать их обратно в Румынию для службы в качестве командиров авиации."
 ROM_invasion_of_bessarabia: "$great_power_politics_misc_tt_icon$ Вторгнуться в Бессарабию"
 ROM_invasion_of_bessarabia_desc: "Мы давно мечтали воссоединиться с нашими братьями за рекой Прут. Теперь, когда [78.GetName] осталась без защиты, мы наконец можем вернуть её Великой Румынии."
 ROM_bessarabian_gamble: "$great_power_politics_misc_tt_icon$ Бессарабская авантюра"
 ROM_unification_with_moldova: "Объединение с Молдовой"
 ROM_fund_the_viata_romaneasca: "Спонсировать Viata Româneasca"
 ROM_fund_the_viata_romaneasca_desc: "«Viața Românească» — это социалистическая газета, соучредителем которой был Константин Стере, использовавшаяся для продвижения социалистических и попоранистских идей среди читателей в Румынии и других странах. Теперь, когда Константин возглавляет правительство, он может финансировать газету через свою должность."
 ROM_tax_burdens_on_the_rich: "Их Справедливая Доля"
 ROM_tax_burdens_on_the_rich_desc: "Огромное богатство румынской элиты было бы лучше использовать для развития страны. Хотя повышение налогов вызовет их гнев, это стоит того ради блага страны."
 ROM_protect_the_ports: "Защита Портов"
 ROM_protect_the_ports_desc: "Прибрежная Румыния уязвима для блокады и даже морских десантов. Укрепление побережья было бы разумным решением."
 ROM_crush_radical_marxists: "Сокрушить Радикальных Марксистов"
 ROM_crush_radical_marxists_desc: "Члены PDSR должны стать первой целью наших репрессий. Большинство их членов верят в насильственную революцию, и у них мало друзей в политическом спектре."
 ROM_form_the_fppr: "Создать FPPR"
 ROM_form_the_fppr_desc: "Простой способ противостоять тем в ПК, кто выступает против нас, — полностью их изолировать. Мы сформируем новую партию, пригласив наших союзников из PDSR присоединиться к ней. Те, кто в ПК выступает против нас, не будут приглашены."
 ROM_allign_the_pdsr: "Соглашение с PDSR"
 ROM_allign_the_pdsr_desc: "Как ни удивительно, но самым близким к другу, которого мы сейчас имеем по ту сторону политической арены, является социалистическая PDSR. Они сотрудничали с нами в принятии нескольких законов и участвовали в контрпротестах в ответ на требования PNL и PCD о нашей отставке. Давайте подружимся с ними."
 ROM_concessions_to_the_elites: "Уступки Элитам"
 ROM_concessions_to_the_elites_desc: "Многие так называемые олигархи в ПК выступают против нас из-за некоторых левых экономических позиций Карпа. Мы можем легко усмирить олигархов в ПК, просто пообещав оставить их в покое. Они могут нас не любить, но мы лучшее, что у них есть."
 ROM_placate_the_peasants: "Задобрить Крестьян"
 ROM_placate_the_peasants_desc: "Подавляющее большинство румын — апатичные крестьяне. Мы можем легко завоевать их поддержку, ускорив проведение земельной реформы. Давайте подарим крестьянам часть государственных земель, чтобы подкупить их и заставить поддерживать нас."
 ROM_carpist_renaissance: "Карпистский Ренессанс"
 ROM_carpist_renaissance_desc: "Карп часто мечтал о «ренессансе» румынской культуры — ренессансе, где румыны объединятся вокруг него, союза с Германией, традиционных ценностей и сильной армии. Мы должны работать над этим так называемым «карпистским ренессансом» и формировать румынское общество в соответствии с ценностями Карпа."
 ROM_placate_the_king: "Умаслить Короля"
 ROM_placate_the_king_desc: "Величайшая угроза нашей власти — не мятежные политические партии, а сам король. Он может легко и законно распустить наше правительство. Король не чужд использованию этой власти, поэтому нам придётся уделять особое внимание его пожеланиям в правительстве. По крайней мере, пока."
 ROM_strong_arm_parliament: "Принуждение Парламента"
 ROM_strong_arm_parliament_desc: "Несмотря на весь этот вздор со стороны PNL и PCD, мы победим. Мы находимся в процессе возвращения этой страны. Мы находимся в процессе политической революции, которая останется бескровной, если те, кто в парламенте, позволят ей быть таковой. Нам вовсе не нужно упразднять парламент для достижения наших целей, нам просто нужно убедиться, что он принимает правильные решения."
 ROM_victory_in_hungarian_war: "Триумф Над Мадьярами"
 ROM_victory_in_hungarian_war_desc: "Мы нейтрализовали венгерскую угрозу, и теперь мы наконец можем вздохнуть с облегчением, зная, что на горизонте нет никаких угроз."
 ROM_rebuild_transylvania: "Перестроить Трансильванию"
 ROM_rebuild_transylvania_desc: "Трансильвания была опустошена Великой войной: многие поселения были разрушены или заброшены. Теперь, под контролем Румынии, пришло время восстановить этот регион и помочь ему снова процветать."
 ROM_ensure_hungarian_weakness: "Гарантировать Слабость Венгрии"
 ROM_ensure_hungarian_weakness_desc: "Мы не можем просто ждать, пока Венгрия перевооружится и снова вторгнется в нашу страну. Мы должны обеспечить, чтобы Венгрия была достаточно слабой и никогда не представляла угрозы для нас в ближайшие 100 лет, даже если некоторые из наших союзников не согласны с этим."
 ROM_realisation_of_greater_romania: "România Mare"
 ROM_realisation_of_greater_romania_desc: "Румыния наконец-то объединена в величие, образовав Целую Румынию, Единую Румынию, или, как называют её в народе, România Mare."
 ROM_promote_romanian_language: "Распространить Румынский Язык"
 ROM_promote_romanian_language_desc: "Трансильванские земли слишком долго находились под властью Австро-Венгрии, а их народ был подвергнут промывке мозгов венгерской пропагандой. К счастью, мы можем финансировать образование в Трансильвании и продвигать румынский язык, чтобы вновь вернуть людей к румынской идентичности, какой она и должна была быть."
 ROM_defeat_in_hungarian_war: "Поражение от Венгрии"
 ROM_defeat_in_hungarian_war_desc: "Мы потерпели неожиданное унизительное поражение от венгров."
 ROM_suppress_szekelyfold_hungarians: "Suppress Hungarian in Székelyföld"
 ROM_suppress_szekelyfold_hungarians_desc: "Секейский край населён преимущественно венграми. Мы подавим любое публичное использование венгерского языка, чтобы заставить их соответствовать румынским требованиям для получения работы и в других сферах."
 ROM_grant_szekelyfold_autonomy: "Дать автономию Секейскому краю"
 ROM_grant_szekelyfold_autonomy_desc: "Венгры в Секейском крае агитируют за автономию. Возможно, её следует предоставить, чтобы снизить вероятность беспорядков в Трансильвании."
 ROM_invite_serbia_to_little_entente: "Пакт с сербами"
 ROM_invite_serbia_to_little_entente_desc: "С угрозой венгерского ревизионизма и тенью габсбургских амбиций, нависшей над нами, Румыния должна действовать быстро, чтобы сохранить стабильность на Балканах. Предложив пакт нашим бывшим союзникам сербам, мы делаем первый шаг к созданию мощного альянса против этих угроз. Вместе мы сохраним стабильность на Балканах."
 ROM_czechoslovak_alliance: "Взаимные гарантии с Чехословакией"
 ROM_czechoslovak_alliance_desc: "После нашей совместной победы над мадьярами и по настоянию их министра иностранных дел Бенеша чешское правительство теперь предлагает углубить наше сотрудничество, подписав договор о взаимных гарантиях и взаимной помощи против любой будущей венгерской агрессии."
 ROM_serbian_intervention_in_hungarian_conflict: "Просить [SER.GetAdjective] интервенции"
 ROM_serbian_intervention_in_hungarian_conflict_desc: "Ведя ожесточённые бои с венгерскими войсками, Румыния обращается к Сербии за срочной поддержкой в нашей борьбе. Венгерская агрессия угрожает не только нашим границам, но и самой стабильности региона. Этот вопрос касается не только нас, но и их."
 ROM_romanianize_alfold: "Румынизация [154.GetName]"
 ROM_romanianize_alfold_desc: "Нам необходимо поощрять румынское поведение и язык на недавно оккупированной территории [154.GetName]."
 has_had_communist_revolution_HUN: "В государстве [HUN.GetNameWithFlag] произошла коммунистическая революция"
 ROM_seize_hungarian_goods_and_livestock: "Отъем Венгерской Продукции"
 ROM_seize_hungarian_goods_and_livestock_desc: "На Румынию оказывается давление со стороны различных групп, включая венгров, некоторых румын, державы Антанты и нескольких лидеров, с требованием прекратить оккупацию Венгрии. Поскольку Румыния опасается нового правления Габсбургов в Венгрии и новой войны, лучше всего ограничить их возможности, разграбив их фермы для получения товаров и скота."
 ROM_concede_on_the_tariff_issue: "Уступки по Вопросу Тарифов"
 ROM_concede_on_the_tariff_issue_desc: "Нас наконец убедили, или, скорее, вынудили, отказаться от вопроса о тарифах. Наша страна может пострадать от отсутствия сильного бюджета, но с точки зрения отношений и экономики это самый сильный вариант из имеющихся."
 ROM_land_reform: "Совместный Законопроект о Земельной Реформе"
 ROM_land_reform_desc: "Одним из наших предвыборных обещаний является окончательное завершение проклятых дебатов о земельной реформе. Теперь мы разрабатываем нормативные акты и законодательные положения для этого."
 ROM_alliance_with_pnd: "Политический Альянс с PND"
 ROM_new_constitution_interwar: "Проект Новой Конституции"
 ROM_new_constitution_interwar_desc: "Настал день, когда мы должны попрощаться со старым и приветствовать новое, день, когда новая конституция предоставляет право голоса массам, наконец создавая по-настоящему справедливый парламент и, в свою очередь, справедливое правительство."
 ROM_special_rights_to_minorities: "Особые Права Меньшиствам"
 ROM_special_rights_to_minorities_desc: "В Великой Румынии присутствуют значительные группы меньшинств, такие как венгры, украинцы и цыгане. Мы должны защищать эти группы меньшинств, чтобы помочь дальнейшему развитию Румынии как сияющего маяка в Восточной Европе."
 ROM_claims_on_morava: "Претензии на [809.GetName]"
 ROM_claims_on_morava_desc: "[809.GetName] — это провинция с большим румынским меньшинством. Мы должны объединить всех румын в Великой Румынии — România Mare."
 ROM_expansion_of_the_coal_industry: "Расширение Добычи Угля"
 ROM_expansion_of_the_coal_industry_desc: "Румынская угольная промышленность сильно пострадала во время Великой войны, но теперь она должна снова набирать обороты в связи с растущим послевоенным спросом на уголь. Мы должны найти новые месторождения угля для разработки и восстановить работу существующих шахт."
 ROM_ignore_the_entente_protests: "Игнорировать Протесты Антанты"
 ROM_ignore_the_entente_protests_desc: "Антанта считает себя кукловодом, а нас — марионеткой. Они неоднократно приказывали нам не применять наши победные стратегии против венгров в нашей войне с ними. К сожалению для них, мы проигнорировали большую часть этих порицаний, и в итоге они ничего нам не сделали, когда мы отказались подчиняться. Антанта настаивает на том, чтобы наши солдаты и правительство покинули Венгрию. Мы проигнорируем их протесты и навсегда оккупируем Венгрию."
 ROM_remove_soviet_hungarian_elements_in_alfold: "Устранить советские элементы в [154.GetName]"
 ROM_remove_soviet_hungarian_elements_in_alfold_desc: "Советская революция в Венгрии оставила после себя множество коммунистических пропагандистских материалов; пришло время сносить статуи и плакаты."
 ROM_repair_relations_with_hungary: "Восстановление Отношений с Венгрией"
 ROM_repair_relations_with_hungary_desc: "После нашего поражения от венгров мы потерпели дипломатическое унижение. Пришло время восполнить наши потери и осуществить примирение с венграми."
 ROM_anti_russian_propaganda_in_bessarabia: "Антимонархические настроения в [78.GetName]"
 ROM_anti_russian_propaganda_in_bessarabia_desc: "Годы российской оккупации привели к тому, что жители региона [78.GetName] подверглись промывке мозгов. Нам необходимо провести антироссийскую пропаганду, чтобы очистить их умы от этой бессмыслицы."
 ROM_ask_for_bessarabia_for_civilian_industry: "Фабрики для [78.GetName]"
 ROM_ask_for_bessarabia_for_civilian_industry_desc: "[78.GetName] — это, по нашему мнению, однозначно румынская земля. У русских нет никаких прав владеть ею. К сожалению, маловероятно, что они передадут нам эту землю без какой-либо компенсации. К счастью, мы можем предложить разделить нашу промышленность на несколько лет в обмен на возвращение территории."
 ROM_poporanist_education: "Попоранистское Образование"
 ROM_poporanist_education_desc: "Когда Стере пришёл к власти насильственным путём, он решил преподавать в румынских школах основы и базис своей идеологии — попоранизма."
 ROM_hostile_takeover_of_government: "Социалистический Переворот"
 ROM_hostile_takeover_of_government_desc: "Социалисты организовали переворот в Румынии, заложив основы социалистического государства."
 ROM_flight_school: "Авиационная Школа 'Aurel Vlaicu'"
 ROM_flight_school_desc: "Названная в честь знаменитого румынского авиаинженера Аурела Влайку, эта школа будет служить для набора новых пилотов для Королевских ВВС Румынии."
 ROM_conduct_air_bombing_raids: "Рейды Бомбардировщиков"
 ROM_conduct_air_bombing_raids_desc: "Королевским ВВС Румынии (RAC) необходимо проводить бомбардировки крупных вражеских городов, чтобы ослабить их инфраструктуру и получить преимущество в войне."
 ROM_found_rezerva_generala_a_aviatiei: "Основать Rezerva Generală a Aviatiei"
 ROM_found_rezerva_generala_a_aviatiei_desc: "Нашей стране необходимо место, где можно ремонтировать и строить новые самолёты для нашего авиационного корпуса. Мы должны создать Генеральный авиационный резерв, где мы сможем легко получить доступ к деталям, необходимым для строительства самолётов и ремонта повреждённых."
 ROM_ban_the_pnl_and_pcd: "Запрет PNL и PCD"
 ROM_ban_the_pnl_and_pcd_desc: "PNL и PCD долгое время доминировали в румынской политике. Их влияние угрожает революционному преобразованию нашего государства. Запретив эти реакционные организации, мы разрушим их коррумпированные сети и обеспечим полное подавление контрреволюционных элементов. Это решительное действие укрепит власть Карпа и проложит путь к диктатуре Карпа в Румынии."
 ROM_handle_the_radical_lunatics: "Преследование Сумасшедших Радикалов"
 ROM_handle_the_radical_lunatics_desc: "Беспорядочные действия наших политических оппонентов стали невыносимыми. Мы должны подавить марксистов, анархистов, мародёров и тех, кто во многих случаях понятия не имеет, о чём говорит."
 ROM_dismiss_parliament: "Сильное и Смелое Лидерство"
 ROM_dismiss_parliament_desc: "С Карпом у руля у нас мало пользы от нынешнего парламента. Он объявит, что, чтобы пресечь любую возможность коммунистической революции, парламент будет временно распущен, пока мы проводим расследование в отношении так называемых либералов и демократов. Конечно, мы никогда не откроем парламент снова, но то, чего они не знают, не причинит им вреда. По крайней мере, слишком большого."
 democratic_coalition: "Демократическая Коялиция"
 ROM_the_enemy_from_within: "Внутренний Враг"
 ROM_the_enemy_from_within_desc: "В нашей стране есть очень плохие люди, которые хотели бы превратить нашу страну в коммунистическую диктатуру. Они могут притворяться умеренными либералами, но они величайшие мошенники. Этих больных щенков нужно остановить. Это следует поручить Королевской гвардии или даже армии, если потребуется."
 ROM_romanian_mountaineer_corps: "Ванатори де мунте"
 ROM_romanian_mountaineer_corps_desc: "Пришло время создать боевую силу, способную гибко действовать на землях к западу от нас. Vânători de Munte станут той силой, которая защитит нас в горных хребтах."
 ROM_concessions_to_the_crown_council: "Уступки Коронному Совету"
 ROM_concessions_to_the_crown_council_desc: "Нам нужно склонить короля на нашу сторону, и, склонив его ближайшее окружение к нам, мы также сможем гарантировать, что король будет получать советы от тех, кто благосклонно к нам относится. Давайте работать над установлением дружественных отношений с королевским советом."
 ROM_invite_carp_jews: "Борьба с Антисемитизмом"
 ROM_invite_carp_jews_desc: "Антисемитизм широко распространён в Румынии и в Европе в целом. Поскольку Карп выступает против таких взглядов, у нас есть уникальная возможность привлечь еврейских представителей среднего и высшего классов по всей Европе, которые могут чувствовать себя неуютно в своих странах, приехать и жить в Румынии."
 ROM_unity_of_the_nation: "Единство Нации"
 ROM_unity_of_the_nation_desc: "С укреплением власти Карпа в стране нам следует работать над восстановлением отношений с менее враждебными фракциями. В ПК есть много умеренных, которые, возможно, не любят Карпа, но достаточно умны, чтобы принять реальность ситуации и работать с ним."
 ROM_reduce_import_tariffs: "Уменьшение Импортных Тарифов"
 ROM_reduce_import_tariffs_desc: "Ошибочная протекционистская политика НЛП затормозила экономический рост Румынии и снизила иностранные инвестиции. Мы должны отменить эти пошлины ради нашей экономики."
 ROM_invite_german_intellectuals: "Пригласить Немецких Интеллектуалов"
 ROM_invite_german_intellectuals_desc: "С приходом Карпа к власти наши отношения с Германией только укрепились. Приглашение немецких интеллектуалов для работы в румынских университетах, а также для консультирования правительства, поможет привить немецкие идеалы эффективности и лояльности во всём обществе."
 ROM_package_of_workers_rights: "Пакет Реформ Трудового Законодательства"
 ROM_package_of_workers_rights_desc: "Хотя для консерватора это несколько неортодоксально, Карп на протяжении всей своей политической карьеры был стойким сторонником расширения прав рабочих. Мы должны продолжать прогресс на этом фронте, чтобы повысить производительность и уровень жизни наших рабочих."
 ROM_new_voice_of_the_people: "Новый Глас Народа"
 ROM_new_voice_of_the_people_desc: "Фермеры и рабочие Румынии могут спать спокойно, зная, что их возглавляет сильный защитник. Пока Карп продолжает улучшать их жизнь и расширять их права, у них нет причин не поддерживать его правление с энтузиазмом."
 ROM_all_for_the_nation: "Все Для Нации"
 ROM_all_for_the_nation_desc: "Каждый человек — за Румынию! Всё, что они могут отдать, — наше, а всё, что наше, — принадлежит народу. Это девиз, который поведёт нашу нацию в золотой век XX века — идея жертвенности ради ближнего, потому что он, без сомнения, пожертвует ради тебя."
 ROM_fuse_with_the_peoples_party: "Объединение с Народной Партией"
 ROM_fuse_with_the_peoples_party_desc: "Видение Стере наконец-то принесло свои плоды, и настолько успешно, что несколько партий пересмотрели свою позицию из-за схожести убеждений. Одна из партий даже предложила объединение! Такую возможность нельзя упускать."
 ROM_gift_government_land_to_peasants: "Раздача Государственных Земель Крестьянам"
 ROM_gift_government_land_to_peasants_desc: "Пришло время отплатить нашей базе, но наш жест будет немного более масштабным, чем в прошлые разы. Мы планируем перераспределить неиспользуемые государственные земли крестьянству, чтобы укрепить нашу сельскохозяйственную экономику. Мы в долгу перед ними, и это лишь небольшая мера, которой мы попытаемся погасить этот долг."
 ROM_reject_marxism: "Отказ от Марксизма"
 ROM_reject_marxism_desc: "Маркс когда-то назвал румын народом без истории. Мы не согласны! Поэтому упоминания Маркса в наших программах и литературе будут изъяты, и мы будем почитать другого социалистического деятеля, например, Лассаля, известного своими демократическими идеалами."
 ROM_increase_agricultural_subsidies: "Увеличение Сельскохозяйственных Субсидий"
 ROM_increase_agricultural_subsidies_desc: "Новая земля, переданная крестьянству, имеет хорошую почву, но есть проблема. Многие из тех, кто получил землю, не могут позволить себе развить её в полноценное фермерское хозяйство. Увеличив наши сельскохозяйственные субсидии, мы сможем полностью решить эту проблему и обеспечить процветание всех."
 ROM_romanianization_of_bessarabia: "Подавить Хотинское восстание"
 ROM_romanianization_of_bessarabia_desc: "В городе Хотин в Бессарабии вспыхнуло крупное восстание украинских крестьян, которое получило поддержку украинских казаков. Восстание представляет собой серьёзную угрозу нашему контролю над Бессарабией, и его необходимо быстро подавить."
 ROM_agrarian_reforms_in_bessarabia: "Аграрные реформы в Молдове"
 ROM_agrarian_reforms_in_bessarabia_desc: "Регион Бессарабия когда-то находился под властью Российской империи, чей сельскохозяйственный сектор был очень слабо развит. Мы должны провести аграрные реформы в этом регионе, перераспределить землю и побудить фермеров использовать более современное оборудование."
 ROM_romanianization_of_moldova: "Румынизация Бессарабии"
 ROM_romanianization_of_moldova_desc: "Жители Бессарабии по какой-то причине сопротивляются нашему освобождению их земель и даже подняли крупные восстания против нас. Мы должны провести в регионе политику румынизации и интегрировать этих непокорных граждан в Румынию."
 ROM_purge_pro_russians_in_besarabia: "Интеграция Бессарабии"
 ROM_purge_pro_russians_in_besarabia_desc: "В Бессарабии возникли некоторые проблемы с интеграцией в состав нашей страны: несколько восстаний и недовольное население, которое считает нас оккупантами, а не освободителями. После внедрения нашей политики румынизации сопротивление было подавлено, и народ готов стать полноправной частью румынской нации."
 ROM_reap_the_rewards_of_socialism: "Жатва Плодов Социализма"
 ROM_reap_the_rewards_of_socialism_desc: "Наши усилия, предпринятые много лет назад, только сейчас начинают приносить плоды, превосходя наши самые смелые ожидания. Ни для кого не секрет, что эти социалистические политики оставили хороший след в стране. Возможно, пришло время попытаться повторить эти успехи, национализировав некоторые отрасли, которые разрослись во время войны, чтобы сдержать амбиции."
 ROM_slap_on_the_tariffs: "Ввести Тарифы"
 ROM_slap_on_the_tariffs_desc: "В мире нет экономики, которая могла бы функционировать без пошлин. Неужели никто не рассердится на нас, если мы введём новые пошлины для финансирования дальнейших национализаций и развития инфраструктуры? Да, никаких последствий."
 ROM_nationalization_of_enterprise: "Национализация Компаний"
 ROM_nationalization_of_enterprise_desc: "Каждая компания, внёсшая вклад в военные усилия, высоко ценится. В связи с этим мы любезно предложим им более выгодные условия при переходе под контроль их операций. Нет, ни одна компания не будет пощажена, независимо от того, что она делает. Всё должно находиться под добрым, но внимательным оком Стере."
 ROM_creation_of_governman_ran_industries: "Создание Государственной Промышленности"
 ROM_creation_of_governman_ran_industries_desc: "Нам нужно что-то сделать со всеми национализированными компаниями. Давайте начнём объединять компании в более крупные, охватывающие целые отрасли. Таким образом можно достичь максимальной эффективности."
 ROM_future_of_the_dictatorship: "Будущее Диктатуры"
 ROM_future_of_the_dictatorship_desc: "После смерти Петре П. Карпа на пост лидера Румынии выдвинулся Лупу Костаки. Теперь он является лидером диктатуры, оставленной Карпом."
 ROM_restoration_of_democracy: "Восстановление Демократии"
 ROM_restoration_of_democracy_desc: "Нам следует управлять страной на основе демократии, а не диктатуры, и народ должен решать, кто поведёт нацию вперёд."
 ROM_consolidate_the_dictatorship2: "Предупредить Левый Переворот"
 ROM_consolidate_the_dictatorship2_desc: "Новая цель государства — предотвратить приход к власти в Румынии нового демократического правительства."
 ROM_beyond_the_old_allies: "Отход от Старых Союзников"
 ROM_beyond_the_old_allies_desc: "У Карпа было много союзников по необходимости. Опять же, можно спорить, что они были нужны в то время, но сейчас они уже не нужны. Мы должны изгнать из политики тех, кто не является лояльным."
 ROM_right_the_wrongs_of_carp: "Исправление Ошибок Карпа"
 ROM_right_the_wrongs_of_carp_desc: "Хотя Карп был великим лидером, он не был лишён ошибок. Он принял множество левых экономических мер в попытке расширить свою поддержку. Хотя можно утверждать, что для того времени это было хорошим шагом, стабильность диктатуры даёт нам возможность отменить некоторые из этих мер."
 ROM_deal_with_turkey_to_pass_through_straits: "Попросить Проход Через Проливы"
 ROM_deal_with_turkey_to_pass_through_straits_desc: "К сожалению, румынский флот ограничен Чёрным морем. Мы обратимся к туркам с предложением о выгодных торговых преференциях в обмен на доступ к Средиземному морю."
 ROM_mold_the_dictatorship: "Чистки Противников Диктатуры"
 ROM_mold_the_dictatorship_desc: "It's time to transform the Carp dictatorship from a dictatorship of the masses to a dictatorship of a few. We must abandon the allies of the old and work towards building a new generation of political leaders - ones absolutely loyal to the dictatorship."
 ROM_overturn_carpist_social_programs: "Отмена Карпистских Социальных Программ"
 ROM_overturn_carpist_social_programs_desc: "Такие вещи, как обязательное страхование, должны стать следующей целью на пути сокращений. Эти программы обходятся нам дороже, чем они того стоят, и к тому же система работала нормально и до подобных реформ."
 ROM_crack_down_on_federalism: "Разрушение Федерализма"
 ROM_crack_down_on_federalism_desc: "Мы должны установить более жёсткий контроль над нашими провинциями. Указ, лишающий губернаторов и мэров части их местной автономии, поможет централизовать Румынию и обеспечить согласованность политики."
 ROM_censorship_act: "Legea Cenzurii"
 ROM_censorship_act_desc: "Наше правительство подвергается жёсткой критике и нападкам из-за превращения в социалистическое государство. Пришло время принять закон о свободе слова, чтобы ограничить нестабильность, исходящую от этих критиков."
 ROM_nationalize_banks: "Национализация Банков"
 ROM_nationalize_banks_desc: "Военное время придало новый смысл большей части румынской политической сцены. Новые идеи входят в моду, старые уходят. Старые институты не являются исключением из этого кардинального правила. Многие в нашей администрации требуют переоценки полезности национальных банков. Большинство сходится во мнении, что они совершенно бесполезны и было бы лучше, если бы они получили выгоду от новых идей, которые только что появились."
 ROM_destroy_the_influence_of_the_church: "Уничтожить Влияние Православной Церкви"
 ROM_destroy_the_influence_of_the_church_desc: "Церковь имеет слишком большое влияние в Румынии, из-за чего румыны меньше гордятся нашей нацией. Мы должны уничтожить её влияние и воспитать патриотизм в народе."
 ROM_purge_PC_members: "Чистка Консерваторов"
 ROM_purge_PC_members_desc: "Члены Консервативной партии давно критикуют идеологию Стере и его режим. Теперь, когда Стере у власти и близок к установлению диктатуры во имя коммунизма, нам нужно как можно быстрее провести чистку возможных критиков."
 ROM_establish_a_communist_dictatorship: "Коммунистическая Диктатура"
 ROM_establish_a_communist_dictatorship_desc: "С разгромом оппозиции мы теперь можем перейти к последнему шагу: официально стать коммунистической утопией, румынской коммунистической диктатурой."
 ROM_artillery_modernization_focus: "Модернизация Артиллерии"
 ROM_artillery_modernization_focus_desc: "Будущее войны заключается в машинах, а не в людях. Самая сильная машина на поле боя в последнее время — это скромная артиллерия, бывающая всех форм и размеров. Мы, несомненно, пожнём плоды наших трудов, если доведём наши запасы до стандартов, превосходящих наших соседей на Балканах и за их пределами."
 ROM_the_last_days_of_the_conservatives: "Последние Дни Консерваторов"
 ROM_the_last_days_of_the_conservatives_desc: "Консерватизм в Румынии отступает на всех фронтах. Радикальные политические изменения в послевоенной обстановке привели к тому, что консерватизм как политическая идеология в Румынии воспринимается как неспособный удовлетворить потребности современного румынского народа. В связи с этим у нас не будет иного выбора, кроме как провести новые выборы в ближайшее время, и когда это произойдёт, ПК, несомненно, не получит многого."
 ROM_prisoner_of_war_battalions: "Батальоны Венгерских Военнопленных"
 ROM_prisoner_of_war_battalions_desc: "Венгры захватили многих румын во время Великой войны и использовали их в качестве штрафных батальонов для борьбы против дружественных Румынии государств. Будет справедливо, если мы поступим так же с ними в качестве наказания и возмездия."
 ROM_anti_aircraft_guns: "Создание Противовоздушного Снаряжения"
 ROM_anti_aircraft_guns_desc: "Зенитные орудия в основном используются для уничтожения вражеских самолётов, таких как бомбардировщики, истребители и другие. Нам необходима эта технология, чтобы противостоять господству противника в воздухе."
 ROM_invite_allied_spy_agencies: "Пригласить Разведку Антанты"
 ROM_invite_allied_spy_agencies_desc: "Является ли это абсолютным прекращением частной жизни? Да, безусловно. Необходимо ли это? Спорно. Является ли это интересной перспективой? Время покажет. Опасно ли это? Зависит от того, кого мы решим считать достойным румынской войны."
 ROM_seize_russian_equipment: "Конфискация Российского Вооружения"
 ROM_seize_russian_equipment_desc: "Отступление русских означает, что бесчисленное количество винтовок, артиллерийских орудий и другого снаряжения разбросано по всей стране. Передача этого снаряжения немцам в обмен на снижение оккупационных расходов была бы для нас разумным шагом. В конце концов, мы всё равно не собираемся использовать это оборудование."
 ROM_exportation_of_grains_to_cp: "Экспорт Зерновых в Германию"
 ROM_exportation_of_grains_to_cp_desc: "Чтобы облегчить бремя оккупации, было бы благоразумно направлять излишки нашего урожая зерна в немецкие хранилища. Это, безусловно, навредит нам в долгосрочной перспективе, но от этих оккупационных расходов необходимо избавиться любой ценой."
 ROM_factory_work_for_cp: "Работа на фабриках на Центральные державы"
 ROM_factory_work_for_cp_desc: "Германия выдвинула требования не только в отношении ресурсов, но и желает использовать наш промышленный потенциал в своих целях. Это унизительное требование по крайней мере отчасти выгодно."
 ROM_export_steel_to_germany: "Экспорт Стали в Германию"
 ROM_export_steel_to_germany_desc: "Хотя спрос на сталь резко упал из-за перемирия, наши сталелитейные заводы работают на полную мощность. Мы были бы глупцами, если бы не воспользовались этой возможностью, чтобы умиротворить Германию, надеясь добиться более мягких условий в нашем суровом договоре."
 ROM_invite_austrian_investors: "Пригласить Австрийских Инвесторов"
 ROM_invite_austrian_investors_desc: "Наша промышленность явно отстаёт. Если бы это было не так, мы бы не находились в состоянии оккупации. Проблема в том, что мы не использовали иностранные инвестиции. К счастью для нас, один из наших оккупантов стремится получить контроль над нашей экономикой. Если мы впустим их сейчас, мы, несомненно, сможем найти способ выгнать их позже."
 ROM_pay_off_occupation_costs: "Плата за Оккупацию"
 ROM_pay_off_occupation_costs_desc: "Среди самых унизительных требований Германии — необходимость оплачивать содержание оккупации нашей собственной страны. У нас нет иного выбора, кроме как принять эти абсурдные требования."
 ROM_bring_in_the_collaborators: "Пригласить Коллаборационистов"
 ROM_crush_the_pnl: "Сокрушить PNL"
 ROM_lock_down_nation: "Закрыть Страну"
 ROM_begin_the_trials: "Начать Суды"
 ROM_pay_off_debts_in_bulk: "Выплата Долга в Больших Размерах"
 ROM_pay_off_debts_in_bulk_desc: "Наша экономика никогда не восстановится, если мы попытаемся выплачивать репарации Центральным державам крупными суммами. В конце концов, румынская сельская местность лежит в руинах, и все доступные средства должны быть направлены на её восстановление. Если из-за долгов не останется средств, то и восстановления не будет."
 ROM_pay_off_debts_in_small_payments: "Выплата Долга Малыми Частями"
 ROM_pay_off_debts_in_small_payments_desc: "Покончить с этим раз и навсегда. Такую идею предлагают некоторые члены парламента. Если мы быстро погасим наш долг, логика подсказывает, что у нас будет больше средств в течение более длительных периодов, верно? Это направление, в котором мы должны двигаться, чтобы очистить наши счета от долгов."
 ROM_defeat_in_gw: "Поражение в Великой войне"
 ROM_defeat_in_gw_desc: "Наша страна потерпела поражение в Великой войне, и мы платим за это цену. Как мы будем управлять нашей экономикой после этого?"
 ROM_all_for_the_war: "Все Для Нации"
 ROM_the_centrist_government: "Центристское Правительство"
 ROM_the_centrist_government_desc: "Хотя многие насмехаются над концепцией центристского правительства, оно даёт нам большую гибкость. Мы можем работать с либералами и консерваторами по своему усмотрению, а в случае необходимости мы можем успокоить социалистов и других радикалов."
 ROM_first_things_first: "Перво-Наперво"
 ROM_first_things_first_desc: "Для начала мы должны обеспечить стабилизацию Румынии. Великая война опустошила наши земли, унесла жизни многих наших людей и разрушила нашу промышленность. Мы должны посвятить время восстановлению."
 ROM_german_military_reorganization: "Немецкие Военные Реформы"
 ROM_return_to_normalacy: "Возвращение Нормальности"
 ROM_a_pefect_puppet: "Идеальная Марионетка"
 ROM_not_our_king: "Не Наш Король"
 ROM_prevent_a_brain_drain: "Предупредить Утечку Мозгов"
 ROM_cooperative_agriculture_idea: "Сельские Кооперативы"
 ROM_encourage_factory_jobs: "Поддержка Заводских Профессий"
 ROM_pander_to_the_middle_class: "Уступки Среднему Классу"
 ROM_embrace_modernization: "Полномасштабная  Модернизация"
 ROM_anti_populist_campaigns: "Дискредитация Популизма"
 ROM_united_conservative_front: "Объединенный Консервативный Фронт"
 ROM_do_later: "Старая Гвардия"
 ROM_do_later_desc: "Поэт Ион Нае Теодореску, более известный под псевдонимом Тудор Аргези, является защитником прав крестьянства. Это идеально сочетается с нашим правительством. Его стихи произвели фурор в румынском обществе и, несомненно, вызовут ещё больший резонанс, если мы поддержим его карьеру или даже предложим ему символическую должность. Надвигается необходимость национального единства; Аргези мог бы помочь нам в этом."
 ROM_oil_modernization: "Модернизация нефтедобычи"
 ROM_oil_modernization_desc: "Румыния — одно из немногих мест в Европе, где есть нефть. К сожалению, мы не успевали за новейшими технологическими разработками в этой отрасли. Это должно измениться."
 ROM_export_transylvanian_gold: "Конфисковать трансильванское золото"
 ROM_export_transylvanian_gold_desc: "В Трансильвании много шахт, добывающих большое количество серебра и золота. Мы можем захватить их и зарабатывать, продавая золото и экспортируя серебро."
 ROM_reopen_the_steel_industry: "Возобновить производство стали"
 ROM_reopen_the_steel_industry_desc: "Во время Великой войны наша сталелитейная промышленность сильно пострадала из-за падения занятости из-за призыва и повреждения инфраструктуры нашими врагами. Мы должны сосредоточить усилия на восстановлении работы сталелитейных заводов, поскольку это одна из самых важных, если не самая важная промышленная потребность нашей страны."
 ROM_develop_the_agriculture: "Возродить сельское хозяйство"
 ROM_develop_the_agriculture_desc: "После Великой войны наше сельскохозяйственное производство было полностью разрушено, так как люди, работавшие на фермах, были призваны в армию. Из-за этого резкого падения производства мы из одного из ведущих экспортёров зерна до войны превратились в импортёра зерна. Мы должны срочно спасти наших отчаявшихся фермеров."
 ROM_fable_and_truth: "Сказка и правда"
 ROM_fable_and_truth_desc: "Христианство — это одно из немногих явлений, объединяющих почти всех румын. Пропагандируя веру, мы можем укрепить единство румынского общества."
 ROM_eliminate_foreign_tariffs: "Снижение иностранных тарифов"
 ROM_eliminate_foreign_tariffs_desc: "Правительства НЛП в прошлом вводили огромные пошлины на иностранные товары. Это привело к ответным пошлинам против нас, что снизило доходы наших фермеров. Мы должны работать над снижением пошлин, чтобы помочь нашим фермерам процветать."
 ROM_new_rural_schools: "Новые сельские школы"
 ROM_new_rural_schools_desc: "Многие сельские дети не имеют доступа к образованию. Законопроект, выделяющий средства на строительство новых сельских школ, должен получить поддержку со всех сторон политического спектра."
 ROM_sell_public_land_to_peasants: "Продать государственные земли крестьянам"
 ROM_sell_public_land_to_peasants_desc: "Правительство владеет большим количеством земли, которая ему не нужна. Мы должны продать её крестьянам, которые хотят получить собственную землю для ведения сельского хозяйства."
 ROM_redefine_conservatism: "Переосмыслить консерватизм"
 ROM_redefine_conservatism_desc: "Что значит быть консерватором? Если спросить среднего румына, многие из них могут ассоциировать этот термин с элитизмом и аристократией. Это далеко от истины, и такое представление вредит популярности консерватизма среди населения."
 ROM_reject_excesses_of_society: "Избегать излишек в обществе"
 ROM_reject_excesses_of_society_desc: "Наш народ требует не многого. Они хотят еды, воды и крова. Хотя большие и навороченные промышленные инструменты — это хорошо, они не очень нужны. Вместо этого нам следует сосредоточить нашу экономику на обеспечении основных компонентов хорошей жизни для наших людей."
 ROM_special_privileges: "Особые привилегии для аристократов"
 ROM_special_privileges_desc: "Аристократы часто берут на себя бремя инвестирования в экономику Румынии. Мы должны поощрять это поведение, освободив их от некоторых налогов."
 ROM_increase_security: "Закон и порядок"
 ROM_increase_security_desc: "Жадные крестьяне начали массовые протесты против нашего правительства."
 ROM_break_the_pnl: "Сокрушить НЛП"
 ROM_break_the_pnl_desc: "Главный источник политической оппозиции — НЛП, но фундамент этой партии прогнил. Нам нужно лишь немного нажать на рычаги, и популярность НЛП резко снизится."
 ROM_encourage_political_apathy: "Поощрять политическую апатию"
 ROM_encourage_political_apathy_desc: "У среднего крестьянина нет причин участвовать в румынской политике — особенно потому, что большинство из них выступают против нас. Мы должны поощрять их сидеть тихо, делать свою работу и не лезть в политику."
 ROM_opium_of_the_masses: "Опиум народа"
 ROM_opium_of_the_masses_desc: "Религия — отличный способ отвлечь крестьян от вопроса о том, стоит ли им поддерживать наше правление. Давайте уделим немного больше внимания христианской политике и поощрим большее послушание Христу."
 ROM_quid_pro_quo_with_junimea: "Quid Pro Quo с Junimea"
 ROM_quid_pro_quo_with_junimea_desc: "Хотя многие в Junimea выступают против нашей политики, она приносит им прямую выгоду. Наверняка можно прийти к какому-то соглашению, верно? Мы продолжим приносить им пользу, а они согласятся поддерживать нас политически."
 ROM_controll_the_media: "Контроль прессы"
 ROM_controll_the_media_desc: "Средства массовой информации в основном пишутся богатыми и влиятельными людьми, которые, как раз кстати, извлекают выгоду из нашего правления. Мы должны использовать это, чтобы заставить их писать новостные статьи, восхваляющие нашу политику, и подавлять негативную информацию."
 ROM_special_privileges_for_elites: "Налоговые льготы для аристократов"
 ROM_brutal_economic_realism: "Суровый экономический реализм"
 ROM_brutal_economic_realism_desc: "Хотя это может навредить местной промышленности, свободная торговля объективно лучше для экономики по большинству показателей. Если мы хотим оставаться конкурентоспособными по сравнению с нашими балканскими соседями, мы не можем продолжать протекционистскую политику НЛП."
 ROM_count_our_pennies: "Посчитать наши копейки"
 ROM_count_our_pennies_desc: "Одна из важнейших составляющих здоровой экономики - сбалансированный бюджет. Мы должны посчитать наши копейки и посмотреть, какие неэффективные программы можно сократить, чтобы помочь уменьшить дефицит."
 ROM_encourage_political_activism: "Поощрение политической активности"
 ROM_encourage_political_activism_desc: "Румыны в идеале должны быть хорошо информированы во всех аспектах жизни, включая политику. Мы должны поощрять людей вступать в политические партии, голосовать и быть активными."
 ROM_de_centralize_the_economy: "Децентрализация экономики"
 ROM_de_centralize_the_economy_desc: "Многие экономические программы центрального правительства неэффективны. Мы должны делегировать немного больше полномочий провинциям, чтобы они могли распоряжаться федеральными деньгами по своему усмотрению, поскольку они лучше знают, что нужно их сообществам."
 ROM_improve_the_urban_life: "Улучшить городскую жизнь"
 ROM_improve_the_urban_life_desc: "Наша база в основном городская, и мы должны служить ей. Некоторых инвестиций в городскую инфраструктуру должно быть достаточно."
 ROM_balkan_diplomacy: "Балканская дипломатия"
 ROM_balkan_diplomacy_desc: "С окончанием Великой войны и поражением нашего главного соперника перед Румынией открылась уникальная возможность утвердиться в качестве величайшей державы на Балканах. Однако, прежде чем думать о расширении нашего влияния в регионе, мы должны обеспечить победу в последней войне против мадьяр."
 ROM_french_guarantees: "Французские гарантии"
 ROM_french_guarantees_desc: "После войны Франция начала поддерживать несколько восточноевропейских государств. Естественно, что мы стремимся вновь развить тесные отношения с нашими бывшими союзниками и получить от них некоторые гарантии, особенно учитывая наше положение как оплота Балкан против социализма."
 depends_on_idea_ROM_navy.tt: "В зависимости от идеи, которую вы выбрали в предыдущем фокусе, она будет §Gусилена§! в этом фокусе!"
 ROM_save_pp.tt: "§RВам возможно лучше сохранить немного §!§Y £political_power_texticon Политической власти§Y§R для этого решения§!"
 ROM_treaty_of_bucharest_violated: "Бухарестский мирный договор был нарушен"
 ROM_treaty_of_bucharest_nullified: "Бухарестский мирный договор признан недействительным"
 ROM_collaborationist_tag: "Стало немецким коллаборационистским правительство"
