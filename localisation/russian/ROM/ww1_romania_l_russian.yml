 ROM_carol_i_idea_desc: "§YБожией милостью и волей нации, Король Румынии, Принц Гогенцоллерн-Зигмаринген.§!\n\n§LНесмотря на то, что это конституционная монархия с довольно сильным разделением властей, Конституция делегирует королю многие полномочия. Король Румынии может напрямую отправлять в отставку правительства, а также распускать парламент во время кризиса. Хотя эти полномочия используются крайне редко, они также оказывают огромное влияние на мнение общественности и политиков Румынии. Если король слишком сильно возмущается нашим правительством, он может поддержать оппозицию или даже прибегнуть к крайним мерам. Кроме того, если король одобряет наше правительство, он может использовать свое политическое влияние, чтобы помочь продвинуть нашу программу.§!"
 ROM_ferdinand_i_idea_desc: "§YБожией милостью и волей нации, Король Румынии, Принц Гогенцоллерн-Зигмаринген.§!\n\n§LНесмотря на то, что это конституционная монархия с довольно сильным разделением властей, Конституция делегирует королю многие полномочия. Король Румынии может напрямую отправлять в отставку правительства, а также распускать парламент во время кризиса. Хотя эти полномочия используются крайне редко, они также оказывают огромное влияние на мнение общественности и политиков Румынии. Если король слишком сильно возмущается нашим правительством, он может поддержать оппозицию или даже прибегнуть к крайним мерам. Кроме того, если король одобряет наше правительство, он может использовать свое политическое влияние, чтобы помочь продвинуть нашу программу.§!"
