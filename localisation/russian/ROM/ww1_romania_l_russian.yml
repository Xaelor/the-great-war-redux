 ww1_romania.174.d: "Среднестатистический крестьянин-неудачник яростно противостоит нашему режиму, который благоволит тем, кто действительно полезен обществу. Хотя большинство крестьян довольно политически апатичны, похоже, наша нынешняя политика становится для них чрезмерной. Мы наблюдаем рост протестов по всей стране, поскольку крестьяне требуют от короля назначить новые выборы."
