 ROM_romanian_economy_idea_desc: "Румыния не является экономической державой, она в основном опирается на сельское хозяйство, формируемое землёй, зерном и сельским трудом. Наследие крестьянской революции 1907 года всё ещё витает над системой, обнажая тесную связь экономического курса с социальной напряжённостью в сельском хозяйстве."
 ROM_small_payment_flag: "Сейчас долг выплачивается небольшими частями"
 ROM_mass_payment_flag: "Сейчас долг выплачивается оптом"
 ROM_ally_poland: "Союз с Польшей"
 ROM_ally_poland_desc: "Хотя наши предыдущие дипломатические шаги в отношении поляков оказались неудачными, их неожиданная победа над Советами и возвращение относительного спокойствия в Восточную Европу дали нам достаточно свободы для переговоров о надлежащем договоре с ними, направленном на борьбу с будущей советской агрессией."
 ww1_romania.213.t: "Румыния предлагает союз"
 ww1_romania.213.d: "Румыния обратилась к нам с предложением о заключении союза, чтобы мы могли лучше защитить себя в случае вторжения со стороны более сильного государства."
 ww1_romania.213.a: "Конечно"
 ww1_romania.213.b: "Нам это не нужно"
 ww1_romania.214.t: "Государство [FROM.GetName] приняло союз."
 ww1_romania.214.d: "Правительство государства [FROM.GetAdjective] приняло наше предложение о взаимных гарантиях. Этот, казалось бы, небольшой договор является огромным шагом в обеспечении мира и стабильности на Балканах."
 ww1_romania.214.a: "Отлично!"
 ROM_tackle_the_core_issue_tt: "£tank_design_cost_texticon  Стоимость проекта артиллерии: §G-100.00%§!\n£tank_design_cost_texticon  Стоимость проекта пехоты: §G-100.00%§!"
 ROM_treaty_of_bucharest_mission: "$great_power_politics_great_war_tt_icon$ Бухарестский договор"
 ROM_the_man_to_end_the_chaos_desc: "После нескольких закулисных сделок с другими влиятельными политиками на сцену вышел один человек, чтобы положить конец правительству Вайды-Воевода. Этим человеком является генерал Александру Авереску. Король Фердинанд считает его хорошим выбором благодаря поддержке различных политических фракций и обещаниям вернуть умеренность и стабильность."
 ROM_alliance_with_the_pnl_desc: "Хотя Народная партия Авереску изначально была основана как оппозиция НЛП, политические события с тех пор и их общая вражда с НРП позволили сформировать коалицию между двумя партиями, хотя маловероятно, что она продержится дольше нескольких лет."
 ROM_alliance_with_the_anti_socialists_desc: "Хотя КП могла рухнуть после войны, те, кто всё ещё занимает свои должности, более чем готовы объединиться с генералом Авереску, видя в нём единственного человека, способного гарантировать, что волна социализма не достигнет Румынии."
 ROM_shut_down_socialist_conference_desc: "Социалистическая революция у наших ворот только воодушевила социалистов СП и других, которые даже вступили в Коминтерн. Ясно, что их следующим шагом будет революция, поэтому мы должны подавить их до того, как они попытаются предпринять что-либо подобное."
 ROM_alliance_with_the_pcd2_desc: "Хотя КДП пережила войну, в отличие от КП, она вышла из неё не в лучшей форме, и теперь её лидер, Таке Ионеску, готов вступить в союз с правительством Авереску. Они будут играть лишь второстепенную роль в коалиции из-за того, что их влияние уступает влиянию Народной партии."
 ROM_dismantle_transylvanian_councils_desc: "Наши новые территории в Трансильвании всё ещё имеют хаотичные и разнородные административные структуры, и, что ещё хуже, большинство их местных советов контролируются нашими соперниками из НРП. Мы распустим все эти мелкие администрации и должным образом включим Трансильванию в состав Великой Румынии."
 ROM_joint_land_reform_efforts_desc: "Хотя проблема земельной реформы стала причиной краха правительства НЛП, в основном из-за их радикальных предложений, не все они были лишены смысла. Мы воспользуемся несколькими их предложениями, чтобы сформулировать новый закон о земельной реформе, который окончательно завершит дебаты, терзающие румынскую политику более десятилетия."