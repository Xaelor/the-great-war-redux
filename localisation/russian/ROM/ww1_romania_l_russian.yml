 ROM_prince_nicolae_desc: "Несмотря на то, что Николая называют «регентом первого ранга», он возмущен тем, что ему пришлось оставить военно-морскую карьеру, и не интересуется политикой.\n\nЧлен регентства, патриарх Мирон, сказал: «Регентство не работает, потому что у него нет головы. Принц курит свои сигареты, Сарацяну просматривает свои книги, а я, как священник, могу только пытаться примирить.»"
