l_russian:
 HOL_wilhelmina_desc:0 "§YЕё Величество Вильгельмина, Божией милостью Королева Нидерландов, Принцесса Оранско-Нассауская, Герцогиня Лимбургская и пр., и пр., и пр.§!\n\n§LНа протяжении столетий семья Оранских-Нассау была неразрывно связана с самой историей Нидерландов. Подобно своему предку Вильгельму Молчаливому в Восьмидесятилетнюю войну, нынешняя Королева, Вильгельмина, несомненно, станет вдохновляющим примером для голландцев, сплачивающихся для защиты своей родины, если их стране когда-либо угрожает вторжение.§!"