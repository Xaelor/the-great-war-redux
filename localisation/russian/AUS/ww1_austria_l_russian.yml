 AUS_propaganda_in_bohemia_cheaper: "Стоимость решения £decision_icon_small §YПропагандистская кампания в Богемии§! будет §Gсокращена вдвое§!"
 AUS_explain_suspend_re: "Ценой временного £stability_icon£ §YСтабильности§! и дебаффа £consumer_goods_texticon §YФактора товаров народного потребления§! мы теперь можем временно приостановить работу Рейхсрата по желанию, §GУдалив§! национальный дух §YИмперский совет§! на короткое время."
 AUH_bohemian_parliament_shenanigans: "Проделки богемского парламента"
 AUS_fortwursteln: "Fortwursteln"
 AUS_prioritize_arms_bill: "Отдавать приоритет законопроектам о вооружениях"
 AUS_prioritize_arms_bill_desc: "Война с Сербией или Россией явно приближается, и мы должны быть готовы. Нам необходимо срочно провести новые законопроекты о вооружениях, важнее любого другого законодательства. Давайте обеспечим приоритет этих законопроектов в комитетах."
 AUH_currently_suspend_gives: "В настоящее время приостановка работы Рейхсрата даёт национальный дух:"
