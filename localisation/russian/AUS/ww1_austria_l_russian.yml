 AUS_overton_window_introduction: "\nДемонтаж демократии является ключом к укреплению Австрии, но поспешный процесс рискован и может привести к политическим волнениям и даже революции. Таким образом, мы должны быть осторожны. Требуется, чтобы §YОкно Овертона§! медленно смещалось в нашу сторону, прежде чем мы сможем предпринимать крупные §qантидемократические§! действия. Оно начинается с §Y0§! очков на нашей стороне. "
