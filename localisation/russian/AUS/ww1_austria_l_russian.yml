 AUS_con_duopoly_path: "\nЭтот путь предлагает:\n£plan_value_strip|2 §RОчень мало взаимодействия с лояльностью меньшинств§!\n£stability_icon£ §YМастер на все руки, но ни в чём не превосходен в плане политических, экономических и военных баффов§!\n£plan_value_strip|4 §GСильные отношения с Имперским советом§!\n§Lэтот путь намеренно проще и легче, чем другие 3 политических пути, что делает его идеальным для тех, кому не нравится более сложная политическая механика/геймплей в модах для hoi4.§!"
 AUS_sdpao_path: "\nЭтот путь предлагает:\n£plan_value_strip|2 §RНизкая политическая власть§!\n£plan_value_strip|2 §RДебаффы нашей военной промышленности§!\n£plan_value_strip|4 §GСильные отношения с меньшинствами§\n\n£plan_value_strip|4 §GБольшая стабильность§!\n£plan_value_strip|4 §GСолидные баффы гражданской промышленности§!"
 AUS_breakdown_the_rules_of_the_legislature: "Нарушить правила законодательного органа"
