 AUS_invest_in_new_jobs: "Поддержка рабочих в химической промышленности"
 AUS_invest_in_new_jobs_desc: "Чтобы повысить нашу военную технологию, мы будем поддерживать рабочие места, связанные с этими исследованиями, с помощью средств и рекламы для стимулирования подачи заявок, предоставляя при этом множество рабочих мест для молодых людей."
 AUS_forts_for_equipment: "Демонтировать форты [FROM.GetName] ради оборудования"
 AUS_forts_for_equipment_tt: "Открывает решение: £decision_icon_small §YДемонтировать форты (региона) ради оборудования§!"
 AUS_suspend_civil_liberties: "Поддержание общественного порядка"
 AUS_outlaw_hindering_of_war_effort: "Запретить препятствование военным усилиям"
 AUS_abandon_jury_trials: "Приостановить суды присяжных"
 AUS_abandon_jury_trials_desc: "Принцип суда присяжных опасен для наших военных усилий. Присяжные могут оправдать наказание для предателей, что может привести к катастрофическим последствиям для морального духа.\nПриказ № 228 решит эту проблему, приостановив суды присяжных на одиннадцать месяцев."
 AUS_abandon_jury_trials_tt: "Через 11 месяцев после завершения этого фокуса:\n"
 AUS_suspended_jury_trials_ns: "Приостановленные суды присяжных"
 AUS_suspended_jury_trials_ns_desc: "Во время войны суды присяжных могут привести к непредвиденным последствиям для морального духа нации."
 AUS_extend_the_suspension_of_jury_trials: "Продлить приостановку судов присяжных"
 AUS_establish_landwehr_tribunals: "Военный контроль над судами"
 AUS_establish_landwehr_tribunals_desc: "Ландвер должен взять на себя контроль над преследованием за убийства, непредумышленные убийства, грабежи и поджоги для улучшения национальной безопасности."
