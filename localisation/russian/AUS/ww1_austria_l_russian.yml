 AUS_invest_in_the_east: "Инвестировать в Восток"
 AUS_invest_in_the_east_desc: "Используя средства из других частей империи, мы можем установить лояльность в украинских и польских государствах, инвестируя в их экономические базы, такие как Лемберг и Кракау."
 AUS_take_180: "Это решение займёт §Y180§! дней"
 AUS_take_365: "Это решение займёт §Y365§! дней"
 AUS_strengthen_prague_industry: "Укрепить промышленность Праги"
 AUS_invest_in_przemysl: "Профинансировать разработки в [562.GetName]"
 AUS_strengthen_the_heartland_of_the_empire: "Укрепить сердце Империи"
 AUS_strengthen_the_heartland_of_the_empire_desc: "В качестве продолжения улучшения нашей экономики, сердце империи нуждается в дальнейшем строительстве и инвестициях в исследования. Консервативные голоса давно требовали этого, и не без оснований. Если наше сердце не будет постоянно финансируемой областью Империи, то что-то определённо не так!"
 CZE_antonin_svehla: "Антонин Швегла"
 AUS_increase_the_money_supply: "Увеличить денежную массу"
 AUS_construct_university_in_triest: "Построить итальянский университет в Триесте"
 minister_besides_king: "Министр при короле"
 AUS_moritz_von_auffenberg: "Мориц фон Ауффенберг"
 AUS_proactive_interest_rate_policy_desc: "Процентные ставки, устанавливаемые Австро-Венгерским банком в прошлом, были довольно стабильными, менялись медленнее по сравнению с большинством других европейских стран. В связи с ростом напряжённости и всё большей нестабильностью в мире мы должны изменить ситуацию. Быстро меняя наши процентные ставки вверх и вниз по мере изменения ситуации, мы можем снизить экономическую стабильность, но мы обеспечим, чтобы наша страна была более готова ко всему, что может произойти."
 reichsfinanzminister_AUS: "Reichsfinanzminister"
 stephan_burian_break: "Ушёл в отставку"
 AUS_unlock_trade_romania: "§Y[ROM.GetNameWithFlag]§! будет §Gболее склонна§! принять §Yторговую сделку§! через фокус '§YТорговая конвенция с Румынией§!', и для торговой сделки будут открыты дополнительные эффекты!"
 AUS_autonomy: "Предоставлена автономия"
 AUS_bohemian_admin_reform: "Местные реформы в богемских городах"
 AUS_bohemian_admin_reform_desc: "Хотя Богемия имеет свой статус коронного королевства, многие чешские националисты желают большего представительства. Чтобы удовлетворить их требования, мы должны начать постепенно внедрять новые административные реформы на городском уровне, предоставляя чешскому народу больше права голоса в отношении себя."
 AUS_reform_civil_service_code: "Реформировать устав государственной службы"
 AUS_state_of_the_realm_real: "Состояние монархии"
 AUS_bukovina_autonomy: "Личная автономия в Буковине"
 AUS_bukovina_autonomy_desc: "Наша текущая система переписи вынуждает нашу собственную классификацию того, к какой этнической группе принадлежат граждане Буковины. Изменив систему на самоотчёт, мы можем позволить буковинцам чувствовать себя лучше представленными, а также иметь более точные данные переписи."
 AUS_prioritize_wellbeing_of_galacia: "Отдавать приоритет благосостоянию Галиции"
 AUS_prioritize_wellbeing_of_galacia_desc: "Улучшение ситуации в Галиции должно быть главным приоритетом правительства, поскольку если мы позволим бедности продолжать бушевать, у нас никогда не будет надежды на полную стабилизацию королевства. Мы должны работать над расширением государственного финансирования этой цели."
 joint_minister_finance_AUS: "Совместный министр финансов"
 AUS_expand_the_marine_budget: "Расширить военно-морской бюджет"
 AUS_expand_the_marine_budget_desc: "По сравнению с нашей армией, наш флот был запущен из-за нехватки средств. Однако эрцгерцог Франц Фердинанд выступает за дальнейшее расширение флота. Во имя его наше чёрно-золотое знамя снова будет развеваться над Адриатикой!"
 AUS_naval_technical_military_committee: "Морской технический военный комитет"
 AUS_naval_technical_military_committee_desc: ""
 AUS_submarines_experiments: "Инвестировать в подводный флот"
 AUS_submarines_experiments_desc: "Наша промышленность может не иметь возможности производить один линейный корабль за другим, но мы можем обратиться к подводным лодкам; экономически эффективный способ сеять хаос на море среди всех, кто выступает против нас."
 AUS_order_uboats_from_germany: "Заказать подводные лодки у Germaniawerft"
 AUS_order_uboats_from_germany_desc: ""
 AUS_expand_tegetthof_class: "Завершить дредноуты типа 'Тегетгоф'"
 AUS_expand_tegetthof_class_desc: "Недостаточно построить линкор и забыть о нём. Расширение нашей военно-морской промышленности знаменует начало нового Kriegsmarine, созданного в Адриатике, способного противостоять нашим врагам."
 AUS_improved_naval_guns: "Морские орудия Škoda"
 AUS_improved_naval_guns_desc: ""
 AUS_naval_expansion_program: "Программа расширения флота"
 AUS_naval_expansion_program_desc: ""
 AUS_begin_new_dreadnought_constructions: "Начать строительство новых дредноутов"
 AUS_begin_new_dreadnought_constructions_desc: ""
 AUS_naval_excercises: "Подготовить морские удары"
 AUS_naval_excercises_desc: "Моряки Австро-Венгерского флота должны быть мореходными и хорошо обученными. Мы проведём учения в Адриатике, чтобы убедиться, что они идеально готовы служить в нашем новом Kriegsmarine."
 AUS_new_naval_officers: "Продвигать новых морских офицеров"
 AUS_new_naval_officers_desc: ""
 AUS_reorganise_the_luftfahrtruppen: "Реорганизовать Luftfahrtruppen"
 AUS_reorganise_the_luftfahrtruppen_desc: "С приближением войны нашей славной Императорской армии и флота будет недостаточно для защиты от надвигающихся угроз. Мы должны подняться в небо, чтобы обеспечить победу во имя нашего Императора."
 AUS_seaplane_experimentation: "Эксперименты с гидросамолётами"
 AUS_seaplane_experimentation_desc: ""
 AUS_form_kuk_seeflugwesen: "Сформировать K.u.K. Seeflugwesen"
 AUS_form_kuk_seeflugwesen_desc: "Флот требует отдельного и хорошо финансируемого нового рода войск. Хорошо финансируемую часть мы не можем обещать, но новый отдельный род — безусловно. Узелак уже одобрил это требование, поэтому мы немедленно начнём строительство прибрежных аэродромов и более глубокие исследования самолётов, специализирующихся на поддержке флота. Самолёты Антанты уже нанесли нам достаточно урона; адаптация к этим новым методам ведения войны может быть именно тем, что нужно, чтобы сбить всех этих мух над западным фронтом."
 AUS_airship_studies: "Исследования дирижаблей"
 AUS_airship_studies_desc: "После катастрофы Кёртинга наши дирижабли не упоминались в Цислейтании. Учитывая это событие, неудивительно, что эта тема щекотливая. Но эмоции не должны брать верх, поскольку доминирующий контроль над небом ещё не достигнут. Консервативное мышление нашего командования считает, что отказываться от дирижаблей будет плохой идеей, и требует, чтобы мы удвоили наши предыдущие усилия по созданию дирижаблей."
 AUS_prepare_the_great_war_of_sky: "Подготовка к Великой войне в небе"
 AUS_prepare_the_great_war_of_sky_desc: "Благодаря огромным достижениям в военных технологиях ясно, что следующая Великая война будет проходить не только на земле и на море, но и в облаках. Мы должны подготовиться к участию в этой битве."
 AUS_abandon_airships: "Новый курс в авиации"
 AUS_abandon_airships_desc: "Трудно скрыть, что это попытка спасти положение, но это факт: мы должны отказаться от нашей программы дирижаблей. Наше производство плачевно, и единственные изменения в авиации происходят, когда нам приходится списывать какого-нибудь древнего члена флота. Нас не должны беспокоить эти события, а нужно смело идти дальше и использовать этот момент, чтобы максимально догнать другие великие державы в авиации. Вместо устаревших дирижаблей мы запустим производство новых самолётов."
 AUS_kuk_luftfahrtruppen_expansion: "Расширить Luftfahrtruppen"
 AUS_kuk_luftfahrtruppen_expansion_desc: "Великая война началась, и наши военно-воздушные силы меньше, чем у любой другой великой державы. Хотя мы не подаём виду, дальнейшее финансирование авиации необходимо. Зависимость от немецкой авиации, кажется, растёт, поскольку несколько наших самолётов востребованы повсеместно. С несколькими дополнительными аэродромами, большим количеством средств на исследования и отправкой большего количества офицеров для заполнения корпусов, авиация Империи, надеюсь, восстановит свои позиции."
 AUS_our_own_fighters: "Наши собственные истребители"
 AUS_our_own_fighters_desc: "Пришло время отказаться от лицензионных немецких моделей самолётов, дирижаблей и разведывательных самолётов. Нам нужны наши собственные модели, в первую очередь истребители. Наш авиакорпус наконец начал догонять другие державы после требования Узелака разрешить унтер-офицерам стать пилотами. Немедленные субсидии будут направлены на авиационные исследования."
 AUS_expand_the_UFAG: "Расширить UFAG"
 AUS_expand_the_UFAG_desc: "Мы не можем создавать самолёты из воздуха! Прежде чем мы начнём собирать самолёты, мы должны запустить нашу авиационную промышленность."
 AUS_new_customs_offices: "Построить новые таможни"
 AUS_new_customs_offices_desc: "В настоящее время у нас недостаточно таможен для обслуживания всей торговли, поступающей в нашу страну. Мы должны построить новые таможни, чтобы помочь решить эту проблему."
 AUS_pig_war_idea: "Последствия Свиной войны"
 AUS_appoint_sturgkh: "Поощрять восточную апатию"
 AUS_appoint_sturgkh_desc: "Многие фермеры на востоке слишком заняты попытками выжить, чтобы заниматься политикой, что мешает им даже думать о требовании от нас масштабных реформ. Мы должны поощрять эту апатию, чтобы они оставались довольны статус-кво."
 AUS_invest_in_skoda_works: "Инвестировать в Škoda Works"
 AUS_increase_the_police_in_galacia: "Усилить наш контроль над Галицией"
 AUS_increase_the_police_in_galacia_desc: "Хотя усилия по сокращению бедности в Галиции являются положительными, общая текущая ситуация в Галиции неприемлема. Мы должны подписать серию агрессивных указов, разрешающих подавление преступности в Галиции."
 AUS_destroy_decadent_democracy: "Уничтожить обструкционистскую демократию"
 AUS_one_class_struggle: "Одна борьба — классовая борьба!"
 AUS_destroy_decadent_democracy_desc: "Слишком много времени было потрачено на перепалки с людьми, которые никогда не примут наши требования. Мы развлекали этот цирк достаточно долго. Некогда больше терять время, мы должны нанести удар немедленно. Назначение Штюркха, поддержанное армией, императором и немецкими националистами, — это именно то, что нужно, чтобы избавиться от этих тщетных уступок, которыми нас закидали."
 AUS_streamline_conscription_process: "Отменить ключевые освобождения от призыва"
 AUS_neglected_economy: "Запущенная экономика"
 AUS_end_aristocratic_favortism_in_the_high_command: "Покончить с аристократическим фаворитизмом в верховном командовании"
 AUS_denounce_nepotism: "Разоблачить кумовство в армии"
 AUS_neglected_economy_desc: "Экономика этой провинции была заброшена Веной и оставлена в плохом состоянии."
 AUS_trade_convention_with_romania: "Конвенция с Румынией"
 AUS_trade_convention_with_romania_desc: "Будучи нашим соседом, мы должны улучшить отношения с ними, чтобы помочь их экономике, поскольку предлагаемое торговое соглашение выгодно обеим нациям в случае подписания."
 AUS_agriculture_minister: "Министр сельского хозяйства"
 AUS_env_agriculture_minister: "Зелёный министр сельского хозяйства"
 AUS_josef_von_pop: "Йозеф фон Поп"
 AUS_aurel_popovici: "Аурел К. Попович"
 AUS_influential_pol_writer: "Писатель-федералист"
 AUS_adalbert_von_widmann: "Адальберт фон Видман"
 AUS_waclaw_zaleski: "Вацлав Залеский"
 AUS_obstructionism_of_our_own: "Собственный обструкционизм"
 AUS_obstructionism_of_our_own_desc: "Меньшинства Империи любят досаждать нам обструкционизмом, затягивая принятие необходимых законов. Без зазрения совести эти люди день за днём саботируют Империю изнутри, эгоистично заинтересованные только в своей личной выгоде. Чтобы противостоять этим утомительным попыткам, мы покажем им наш собственный обструкционизм, который может сорвать гораздо больше законов, чем они могут себе представить. Если они хотят играть в эти грязные игры, что ж, мы тоже будем."
 AUS_hungarian_aluminium_production: "Венгерское производство алюминия"
 AUS_hungarian_aluminium_production_desc: "Венгрия спит на настоящем сокровище. Мы должны инвестировать в добычу алюминия, жизненно важного компонента для определённого военного снаряжения."
 AUS_croatian_industrialisation: "Хорватская индустриализация"
 AUS_croatian_industrialisation_desc: "Хорватия — бедный регион, которым долгое время пренебрегало центральное правительство. Мы должны исправить ситуацию, поддерживая местных промышленников."
 AUS_electrify_the_countryside: "Электрифицировать сельскую местность"
 AUS_electrify_the_countryside_desc: "Во многих местах Венгрии до сих пор нет доступа к электричеству. Мы должны инвестировать в подключение региона к электричеству, чтобы ускорить модернизацию региона."
 AUS_modernisation_of_slovakia: "Модернизация Словакии"
 AUS_modernisation_of_slovakia_desc: "Словакия — это сельская и горная местность, оставленная без внимания. Нам нужно построить инфраструктуру для бесперебойной доставки товаров людям в этом отдалённом регионе."
 AUS_mavag_gyarak: "MÁVAG Gyárak"
 AUS_mavag_gyarak_desc: "Поддержка венгерской промышленности позволит нам увеличить наши военные возможности, внедряя инновации в строительство бронепоездов, устойчивых к бомбардировкам."
