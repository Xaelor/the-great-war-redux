 AUS_attack_regionalist_parties: "Атаковать регионалистские партии"
 AUS_attack_regionalist_parties_desc: "Разделяй и властвуй. За исключением того, что разделены мы и, следовательно, будем завоёваны, если ослабим эти глупые регионалистские, эгоцентричные и пререкающиеся партии. Регионализм в нашей обширной Империи звучит как бюрократический кошмар попыток умилостивить каждый возможный элемент в наших границах. Поэтому регионализм должен быть отвергнут и осуждён ради улучшения нашей нации в целом."
