 AUS_bohemian_shenanigans2: "Миссия §YПроделки богемского парламента§! запустится на §Y30§! дней £time_texticon §Gмедленнее§!\n"
 AUS_reject_bohemian_autonomy: "Отклонить концепцию богемской автономии"
 AUS_reject_bohemian_autonomy_desc: "Чехи недавно потребовали возмутительную концепцию 'богемской автономии'. Такая концепция, особенно в данный момент, звучит не иначе как больная шутка сумасшедшего. Это предложение должно быть отклонено. Чтобы подобное не повторилось, пропагандистские кампании будут удвоены, и будет отправлено больше полиции, чтобы послать сильный сигнал в ответ на такое грубое предложение."
