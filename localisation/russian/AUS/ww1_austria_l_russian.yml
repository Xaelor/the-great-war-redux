 AUS_camarilla_introduction: "Консервативная §qКамарилья§!, окружающая Франца Иосифа, стремится как можно скорее заменить наше правительство. Хотя Франц Иосиф пока не восприимчив к их требованиям, если мы попытаемся сделать что-то, что может быть расценено как фундаментальная угроза национальной безопасности Австрии, он, несомненно, захочет заменить нас. Это отслеживается переменной §YВлияние Камарильи на Императора,§! которая начинается с §Y1.§! Превышение §Y5§! приведёт к тому, что Император потребует отставки §YМинистра-президента§! и назначит консервативного автократа на эту должность."
 AUS_camarailla_influence_army: "Франц Иосиф станет более восприимчив к призывам §qКамарильи§! заменить наше правительство. Это будет ещё хуже, если армией руководит §qКонрад§!!"
 AUS_church_stuff_chain: "Мы получим цепочку событий, обсуждающую роль церкви в §CОбразовании§! и §CГосударственных регистраторах.§! Затем мы обсудим законы о §CБраке§! и положении §CРелигиозных орденов§!, таких как иезуиты. Наша политика будет иметь кардинальные последствия"
 ww1_austriahungary.186.t: "Сокращение финансирования Ландвера"
 ww1_austriahungary.186.d: "Массовое расширение социального обеспечения, задуманное социал-демократами в парламенте, потребует сокращения где-то ещё, и Ландвер является естественной целью. Хотя у нас мало возможностей для сокращения KuK, Ландвер полностью находится в нашей компетенции. Сокращение бюджета Ландвера, австрийской местной армии, высвободит деньги для программ социального обеспечения и гарантирует, что мы не будем иметь огромного дефицита. Однако это, вероятно, сильно разозлит военных, которые и так работают с небольшими бюджетами, которым придётся компенсировать неизбежный упадок местной австрийской армии."
 ww1_austriahungary.186.a: "Людям нужно здравоохранение, а не артиллерия"
