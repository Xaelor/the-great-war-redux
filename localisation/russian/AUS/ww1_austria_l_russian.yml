l_russian:
 AUS_technical_military_committee: "Технический военный комитет"
 AUS_technical_military_committee_desc: "Технический военный комитет, основанный в 1869 году, является частью австрийского военного министерства, предназначенной для отслеживания технических разработок, полезных для военных, предоставления экспертных заключений и разделённой на артиллерийскую, инженерную, статистическую, техническую и автомобильную секции. С помощью этого комитета австрийская армия сможет лидировать во внедрении новых технологий для использования на поле боя."
 AUS_war_requirements_act: "Закон о военных требованиях"
 AUS_war_requirements_act_desc: "Чтобы подготовиться к войне, мы должны убедиться, что гражданское население будет готово помочь нам в этой войне. Необходимо принять закон о военных требованиях, позволяющий во время войны передавать фабрики под военный контроль и реквизировать у граждан автомобили и лошадей, разумеется, с соответствующей компенсацией."
 AUS_modernize_artillery_equipment: "Модернизация артиллерийского вооружения"
 AUS_modernize_artillery_equipment_desc: "Нынешнее артиллерийское вооружение нашей армии безнадёжно устарело, и его необходимо модернизировать, прежде чем оно подведёт нас на поле боя. При недавно расширенном военном бюджете следует закупить новые модернизированные артиллерийские орудия и спроектировать новые на замену устаревшему арсеналу."
 AUS_work_with_skoda: "Сотрудничество с Škoda"
 AUS_work_with_skoda_desc: "Чтобы продолжить технологическое развитие, мы начнём масштабные инвестиции в артиллерию. Это новое оборудование обеспечит хороший прирост в боях, а также улучшит нашу технику."
 AUS_fund_burstyns_motorgeschutz: "Профинансировать Motorgeschütz Бурштына"
 AUS_fund_burstyns_motorgeschutz_desc: "Гюнтер Адольф Бурштын — австрийский изобретатель и техник, которому удалось создать технический чертёж тяжёлой машины-зверя, которая отлично показала бы себя на поле боя против наших врагов. Он назвал свою конструкцию 'Motorgeschütz', что означает 'моторное орудие'. Финансирование этого проекта — большой риск, но, возможно, это риск, на который нам придётся пойти, чтобы выиграть войну."
 gunther_burstyn_designed_motor_gun: "§YГюнтер Бурштын§! разработал §YMotorgeschütz§!"
 AUS_expand_rail_funding: "Расширить финансирование железных дорог"
 AUS_expand_rail_funding_desc: ""
 AUS_approve_extraordinary_army_expenditure: "Утвердить чрезвычайные военные расходы"
 AUS_approve_extraordinary_army_expenditure_desc: "Напряжённость в Европе растёт, растёт и вероятность нашего вступления в войну, но наша армия не в лучшей форме. Необходимо утвердить некоторые чрезвычайные военные ассигнования в это время, чтобы помочь армии закупить модернизированное оборудование."
 AUS_expand_the_army_budget: "Расширить армейский бюджет"
 AUS_expand_the_army_budget_desc: "Чтобы быстро мобилизовать и усилить наши войска, мы установим более высокий военный бюджет. Это может вызвать антагонизм у соседей и значительно ухудшить наше экономическое положение, но ради самообороны это является приоритетом."
 AUS_bolster_size_of_army: "Увеличить численность армии"
 AUS_bolster_size_of_army_desc: ""
 AUS_revise_the_army_law_1889: "Пересмотреть закон об армии 1889 года"
 AUS_revise_the_army_law_1889_desc: "Закон об армии 1889 года сильно устарел, ограничивая ежегодный набор новобранцев, поскольку парламент в то время отклонил ежегодное увеличение призывных квот. В связи с растущей напряжённостью необходимо принять новый закон об армии, увеличивающий ежегодный призыв и позволяющий увеличивать его каждый год."
 AUS_approve_new_fortification_projects: "Утвердить новые проекты укреплений"
 AUS_approve_new_fortification_projects_desc: "По мере того как наши отношения с бывшим союзником Италией обостряются, мы должны проверить состояние границы и улучшить существующие оборонительные сооружения. Альпы, хотя и являются хорошей основой для обороны, представляют собой сложную местность, где нельзя разместить большое количество войск без надлежащего обустройства и защиты. Итак, чтобы получить полный контроль над этими районами, необходимо дальнейшее расширение наших укреплений, прежде чем предательские трусы на нашей западной границе вступят в бой."
 AUS_prioritized_logistics: "Приоритетная логистика"
 AUS_rigorous_cohesion: "Строгая сплочённость"
 AUS_rigorous_cohesion_desc: ""
 AUS_prepare_supply_hubs: "Подготовка узлов снабжения"
 AUS_booming_machine_tool: "Сохранить господство в станкостроении"
 AUS_mountain_training: "Расширить горные войска"
 AUS_mountain_training_desc: ""
 AUS_debloat_the_military_apparatus: "Сокращение военного аппарата"
 AUS_debloat_the_military_apparatus_desc: ""
 AUS_cold_training: "Специализированная зимняя подготовка"
 AUS_cold_training_desc: ""
 AUS_masters_of_cavalry: "Мастера кавалерии"
 AUS_masters_of_cavalr_desc: ""
 AUS_implement_conrads_army_structure: "Внедрение армейской структуры Конрада"
 AUS_implement_conrads_army_structure_desc: "У Конрада фон Хётцендорфа есть очень амбициозные планы по созданию большой, хорошо дисциплинированной армии, готовой атаковать врага, однако текущего военного бюджета Австрии недостаточно для финансирования такого предприятия. Его планы по армии следует начать внедрять уже сейчас, и хочется надеяться, что нехватка военного финансирования не помешает его планам."
 AUS_ambitious_planning: "Детальное планирование"
 AUS_ambitious_planning_desc: "Конрад известен многим своими детальными, тщательно проработанными, амбициозными планами на случай войны с нашими врагами. Эти планы следует использовать во всей армии, ибо, следуя точным планам Конрада, мы непременно победим."
 AUS_modernize_army_equipment: "Модернизировать армейское снаряжение"
 AUS_modernize_army_equipment_desc: "Одной из самых больших проблем армии является устаревшее оборудование, которое она использует, например, устаревшая артиллерия, но у армии не было средств на закупку современного оборудования. Но теперь, с новыми выделенными средствами, их следует использовать с пользой и потратить на покупку современного снаряжения для армии."
 AUS_war_like_training_methods: "Боевые методы обучения"
 AUS_war_like_training_methods_desc: ""
 AUS_establish_army_reserves: "Создание армейского резерва"
 AUS_establish_army_reserves_desc: "Мобилизация — это сложная тема не только в нашем королевстве, но и во всём мире. Наше многонациональное население часто сопротивляется призыву, который является важным элементом военной машины. Поэтому мы должны создать армейские резервы, достаточные для этой предстоящей войны, войны нашей жизни. Армейские резервы необходимо увеличить уже сейчас, потому что, независимо от наших действий, это долгий и утомительный процесс, который не должен отбросить нас назад по сравнению с другими великими державами."
 AUS_end_serbia: "Сокрушить славянскую угрозу"
 AUS_end_serbia_desc: "Все приготовления закончены. Все меры предосторожности приняты. Наши армии на месте и готовы. Нам следовало послушать Конрада и вторгнуться в Сербию ещё до того, как они вызвали весь этот переполох и страдания на Балканах. Пришло время вырвать эту мелкую занозу из нашей спины, которая существует не для чего иного, как для того, чтобы быть покорённой и оккупированной нашей мощью. Сербии больше не быть!"
 AUS_politically_isolate_conrad: "Политически изолировать Конрада"
 AUS_politically_isolate_conrad_desc: "Конрад фон Хётцендорф — опасный командир, считающий свои планы лучшими, отодвигающий идеи других на второй план и постоянно предлагающий превентивные вторжения в другие страны. После его увольнения с поста начальника штаба императором пришло время воспользоваться моментом и изолировать его от других ведущих военных деятелей."
 AUS_prepare_for_the_two_front_war: "Подготовка к войне на два фронта"
 AUS_prepare_for_the_two_front_war_desc: "Если война всё же произойдёт, мы должны быть готовы. На юге Сербия становится агрессивнее с каждым днём, прячась за спиной русского медведя. Оба этих кровожадных врага недавно участвовали в боевых действиях, чего нельзя сказать о наших войсках. Мы должны ускорить подготовку к этой неизбежной войне на два фронта."
 AUS_focus_on_the_defense: "Сосредоточиться на обороне"
 AUS_focus_on_the_defense_desc: "Наша армия велика, но она неорганизованна и разобщена. Такая армия не должна сосредотачиваться на нападении, поскольку смелые планы Конрада по постоянным атакам вызывают сомнения из-за его туннельного видения и отсутствия неоспоримых и надёжных знаний о силах противника. Более того, положительные эффекты обороны на коренных территориях Империи могут принести воодушевление среди некоторых наших унылых подразделений, набранных с пограничных земель. Хотя мы никогда не будем сомневаться в том, что мы превосходим каждого из наших врагов, план окопаться и позволить им раскрыть свои карты может оказаться гораздо более выгодным, чем прямые атаки."
 AUS_cautious_planning: "Осторожное планирование"
 AUS_cautious_planning_desc: "Наши оценки российских сил несколько противоречивы и слишком малы для их размеров. С другой стороны, сербский народ испытывает страх при упоминании нашей Империи, что является мощным инструментом для призыва и морального духа. Мы никогда не можем проявлять слишком много осторожности, и несомненно, что мы должны планировать безопасно и отдавать приоритет обороне ключевых точек. В конце концов, надвигается война на два фронта, и наша армия не участвовала в боевых действиях в новейшей истории. Каждый наш шаг должен быть продуманным и подготовленным к тому, что они бросят нам."
 AUS_adapt_new_infantry_tactics: "Адаптироваться к новой пехотной тактике"
 AUS_adapt_new_infantry_tactics_desc: "Пехотная тактика сильно изменилась после наших последних конфликтов, поскольку модернизация войны резко возросла. Наша пехота в отличной форме, но для достижения впечатляющих побед и использования наших качеств нам нужна новейшая тактика, чтобы удивить наших неполноценных врагов. Наряду с модернизацией мы должны продолжать решать проблему призыва, прежде чем возникнет разница в качестве между новыми и нынешними солдатами."
 AUS_stop_the_hoarding_of_food: "Остановить скупку продовольствия"
 AUS_stop_the_hoarding_of_food_desc: "Потребители охвачены паникой из-за начала войны и скупают продукты из страха, что запасы закончатся. Это вызывает реальные проблемы со снабжением продовольствием, поэтому необходимо ввести правила, запрещающие скупку продовольствия."
 AUS_patriotic_loans: "Патриотические займы"
 AUS_patriotic_loans_desc: "Для создания фондов мы должны взять так называемые патриотические займы, чтобы обеспечить более сильную будущую экономику. Однако мы должны быть осторожны, чтобы не взять их слишком много."
 AUS_state_control_of_industry: "Национализация военных усилий"
 AUS_state_control_of_industry_desc: ""
 AUS_roaring_money_printer: "Ревущий печатный станок"
 AUS_roaring_money_printer_desc: ""
 AUS_convert_war_economy: "Перепрофилирование нашей промышленности"
 AUS_convert_war_economy_desc: ""
 AUS_exports_imports_controls: "Контроль экспорта и импорта"
 AUS_exports_imports_controls_desc: "Экспорт и импорт — одна из важнейших тем сейчас, когда половина мира воюет с нами. Из-за продолжающейся войны цены, очевидно, подскочат, но чтобы предотвратить неконтролируемую эскалацию, мы должны поддерживать безупречную дипломатию с оставшимися торговыми партнёрами, чтобы удержать экономику и рынок на плаву, ибо мы не можем выжить в одиночку."
 AUS_set_up_the_centrals_system: "Создать систему Централей"
 AUS_set_up_the_centrals_system_desc: "Чтобы обеспечить правильное управление стратегически важными товарами, необходимыми для военных действий, они должны перейти под контроль государства. Для этого следует создать несколько подконтрольных правительству 'централей' для управления определёнными ресурсами, такими как металлы, хлопок, корма для животных и т.д."
 AUS_found_the_war_grain_distribution_institution: "Учредить Учреждение по распределению зерна в военное время"
 AUS_found_the_war_grain_distribution_institution_desc: "В связи с растущей нехваткой продовольствия по всей стране следует ввести нормирование некоторых товаров, таких как зерно. Для этой цели следует создать новое учреждение, Kriegs-Getreide-Verkehrsanstalt (Учреждение по распределению зерна в военное время)."
 AUS_expand_the_rationing_system: "Расширить систему нормирования"
 AUS_expand_the_rationing_system_desc: ""
 AUS_put_factory_workers_under_military_control: "Перевести заводских рабочих под военный контроль"
 AUS_design_modern_artillery_skoda: "Разработать современную артиллерию с Škoda"
 AUS_purchase_modernised_skoda_artillery: "Закупить модернизированную артиллерию Škoda"
 AUS_expand_army_recruitment: "Расширить армейский набор"
 AUS_discipline_soldiers_in_the_attack: "Тренировать солдат в нападении"
 AUS_case_r: "Выполнить план R"
 AUH_great_war_bullshit: "Тикающая бомба замедленного действия"
 AUH_great_war_bullshit_desc: "Наша экономика не рассчитана на длительную изнурительную войну. По мере продолжения этой Великой войны наша экономика может рухнуть под собственным весом.\n\nТекущая £consumer_goods_texticon §NИнтенсивность нехватки продовольствия§! составляет: [AUS_food_shortage_intensity] ([?AUS_cumulative_food_price_increase]) \n§LПо мере роста цен на продовольствие народ будет злиться. Это приводит к вычитанию 1 лояльности у каждой группы меньшинств за каждые 5% увеличения номинального роста цен на продовольствие.§!"
 AUS_introduce_price_caps: "Ввести предельные цены на продовольствие"
 AUS_introduce_price_caps_desc: "В настоящее время цены на продовольствие по всей стране стремительно растут из-за растущего дефицита и не демонстрируют признаков остановки. Население не довольно экстремальными ценами на продукты и требует введения ограничений на цены на продовольствие, что было бы мудрым шагом для прекращения этого кризиса."
 AUS_begin_the_rationing_of_flour_bread: "Начать нормирование муки и хлеба"
 AUS_begin_the_rationing_of_flour_bread.tt: "Миссия '§Y$AUS_worsening_food_shortages$§!' запустится на §Y20§! дней §Gмедленнее§!"
 AUS_has_began_rationing: "Выполнено £decision_icon_small'§YНачать нормирование муки и хлеба§!"
 AUS_expand_rationing_to_sugar_milk_and_fats: "Расширить нормирование на сахар, молоко и жиры"
 AUS_expand_rationing_to_sugar_milk_and_fats.tt: "Миссия '§Y$AUS_worsening_food_shortages$§!' запустится на §Y10§! дней §Gмедленнее§!"
 AUS_ration_potatoes_jam_and_meat: "Расширить нормирование на картофель, джем и мясо"
 AUS_stricten_the_rations: "Ужесточить нормы"
 AUS_setting_up_central_tt: "В настоящее время не настраивается Централь"
 AUS_establish_the_metal_central: "Создать Металлическую Централь"
 AUS_establish_the_wool_central: "Создать Хлопково-шерстяную Централь"
 AUS_establish_the_wool_central_desc: "Хлопок и шерсть — очень важные ресурсы для военных, необходимые для изготовления униформы, бинтов и многого другого. По мере роста дефицита этих материалов правительство должно вмешаться и создать baumwollzentrale (хлопково-шерстяную централь), чтобы изъять эти ресурсы у гражданского населения и предписать их повторное использование."
 AUS_establish_the_livestock_meat_central: "Создать Централь по животноводству и мясу"
 AUS_convert_economy_d: "Перепрофилировать нашу промышленность"
