 AUS_building_a_welfare_foundation: "Государство всеобщего благосостояния"
 ww1_austriahungary.126.a: "Непокорность будет наказана!"
 ww1_austriahungary.97.t: "Россия отказывается помогать"
 ww1_austriahungary.97.d: "Наши призывы к России о помощи в выдворении Австрии из Таслицы были встречены отказом со стороны русских. Они утверждают, что этот вопрос рискует войной с Австрией, к которой Россия не готова. Из-за отказа России помочь нам мы должны отступить."
 ww1_austriahungary.97.a: "С такими друзьями и враги не нужны!"
 ww1_austriahungary.100.t: "Австрия отступает"
 ww1_austriahungary.100.d: "Опасаясь нашей мощи, Австрия немедленно отказалась от своей незаконной захватнической деятельности в Таслице. Их войска покинули провинцию, передав её законным владельцам."
 ww1_austriahungary.100.a: "Уф!"
 ww1_austriahungary.146.t: "Вопрос о переписи в Буковине"
 ww1_austriahungary.147.t: "Восстанье Die Fackel"
 ww1_austriahungary.147.d: "Die Fackel, антикоррупционная и антивоенная газета, в последнее время переживает всплеск популярности. Это происходит на фоне того, что наше консервативное правительство продолжает восприниматься как коррумпированное, старое и воинственное среди широких слоёв населения. Хотя газета в основном безобидна, сатирическая, она серьёзно вдохновляет антиправительственные действия среди населения, такие как протесты и даже саботаж."
 ww1_austriahungary.147.a: "Немного тревожно"
 ww1_austriahungary.146.d: "В рамках наших реформ местного самоуправления система переписи в Буковине была предложена как потенциальный объект реформы. В настоящее время лица, ответственные за проведение переписи в Буковине, изучают семейную историю граждан, чтобы определить, к какой признанной этнической группе они принадлежат, вместо того чтобы просто позволить гражданам идентифицировать себя. Это не так, как работает перепись во многих странах, и это вызвало недовольство местного населения Буковины. Следует ли нам изменить нынешнюю систему?"
 ww1_austriahungary.146.a: "Давайте внедрим личную автономию"
 ww1_austriahungary.146.b: "Не нужно это менять, эксперты знают лучше"
 ww1_austriahungary.105.t: "Россия отступает в последнюю минуту"
 ww1_austriahungary.105.d: "Угроза войны с Германией испугала Россию, и в последнюю минуту она отступила, приказав нам просто принять оккупацию нашей законной земли Австрией. Имея мало шансов победить и Австрию, и Германию в одиночку, у нас нет выбора, кроме как следовать их совету"
 ww1_austriahungary.105.a: "Жалко!"
 ww1_austriahungary.189.t: "Обрушение плотины Десна"
 ww1_austriahungary.189.d: "Плотина Десна, известная в народе как 'Плотина Бурст', прорвалась менее чем через год после завершения строительства. Сегодня утром лесорубы, работавшие на плотине, заметили утечку воды и попытались опорожнить водохранилище, но расход воды продолжал увеличиваться, и в 16:15 по местному времени она прорвалась, убив 65 человек. Предупреждение было отправлено за 15 минут, чего было недостаточно, чтобы спастись от последующего наводнения. Услышав о прорыве плотины, старший государственный надзиратель за строительством плотины Карел Подгайский покончил с собой выстрелом. Неизвестно, что стало причиной прорыва плотины, хотя это может быть связано с плохим строительством или геологической нестабильностью."
 ww1_austriahungary.189.a: "Трагедия"
 ww1_austriahungary.106.t: "Россия и Сербия сдаются"
 ww1_austriahungary.106.d: "Угроза гнева всего Тройственного союза заставила Россию и Сербию отозвать свой ультиматум о выводе Австрии из Таслицы. Кажется, наша мощь восторжествовала."
 ww1_austriahungary.106.a: "Рад, что они образумились"
 ww1_austriahungary.169.t: "Антикартельные протесты продолжаются"
 ww1_austriahungary.169.d: "Антикартельные беспорядки всё ещё бушуют на наших улицах. Картели и их партнёры по бизнесу потребовали от нас решить проблему с протестующими так или иначе."
 ww1_austriahungary.169.a: "Убирайтесь с наших улиц!"
 ww1_austriahungary.164.t: "Цены на муку вызывают беспорядки"
 ww1_austriahungary.164.d: "Стоимость жизни в Вене достигла критической точки. Цена на муку медленно росла, в то время как заработная плата оставалась на том же уровне и даже сокращалась; мясо мигрировало с тарелок рабочих в область роскоши, а хлеб, когда-то закуска в рационе рабочего человека, стал тонким, редким и дорогим. Балансирование между потребностями промышленности и земли вскоре показало, что весы качнутся. И картели просят нас наклонить чашу весов в их сторону, подавив бунтовщиков."
 ww1_austriahungary.185.t: "Убийство [AUS_GetMinisterPresident]"
 ww1_austriahungary.185.d: "Сегодня министр-президент Цислейтании, [AUS_GetMinisterPresident], был убит социалистическим политиком Фридрихом Адлером, сыном Виктора Адлера, основавшего Sozialdemokratische Arbeiterpartei Österreich.\nБудучи социалистическим журналистом, Фридрих довольствовался написанием статей для газеты Volksrecht в Цюрихе и даже рассматривался на должность заведующего кафедрой физики вместо Эйнштейна. Позже он стал австромарксистом и был против войны, что является одной из причин убийства поддерживающего войну министра-президента."
 ww1_austriahungary.185.a: "Катастрофа!"
 ww1_austriahungary.142.t: "Чехи усиливают оппозицию правительству"
 ww1_austriahungary.142.d: "Поскольку становится ясно, что наше правительство не намерено проводить серьёзные реформы чешского вопроса, чехи в парламенте наращивают свою обструкцию. В богемском сейме они начинают предпринимать свои собственные шаги, принимая реформы на основе сомнительных юридических прецедентов. Мы должны как-то остановить их."
 ww1_austriahungary.142.a: "Они засранцы!"
 ww1_austriahungary.164.a: "Почему мы всё ещё говорим об инфляции?"
 ww1_austriahungary.165.t: "Повышение арендной платы пугает население"
 ww1_austriahungary.165.d: "Недавний скачок арендной платы из-за растущей экономики вызвал беспорядки на улицах крупных городов, таких как Вена и Прага, и даже во многих второстепенных городах. Картели снова попросили нас вмешаться и раз и навсегда остановить этих бунтовщиков."
 ww1_austriahungary.165.a: "Доступность — их любимое слово..."
 ww1_austriahungary.166.t: "Роль женщин в беспорядках"
 ww1_austriahungary.166.d: "Женщины нашли другое место за пределами своих домов: на улицах. Действительно, они первыми отреагировали на проблему роста стоимости жизни, протестуя против антипотребительской политики картелей."
 ww1_austriahungary.166.a: "Они не могут быть серьёзны!"
 ww1_austriahungary.167.t: "Успех богемского среднего класса"
 ww1_austriahungary.167.d: "Богемский средний класс добился недавнего и долгожданного успеха благодаря сахарной промышленности. Действительно, поддержка Веной богемской сахарной промышленности позволила укрепить чешские банки, такие как Zivnostenská banka, чья стоимость взлетела до пятикратной стоимости чешских отделений венских банков. Это, к сожалению, дало необходимое политическое финансирование богемским активистам для большей автономии."
 ww1_austriahungary.167.a: "Ты хоть раз сказал 'спасибо'?"
 ww1_austriahungary.141.t: "Ключевые законы в парламенте заблокированы оппозиционными обструкционистскими группами"
 ww1_austriahungary.141.d: "То, что должно быть простым процедурным законодательством — бюджеты, простые поправки к старым законам для исправления какой-то незамеченной маленькой проблемы, небольшие гранты для помощи городу в решении проблемы с инфраструктурой, — сдерживается оппозиционными группами в парламенте. Блокирование и задержка принятия этих простых законов ослабляют империю, поскольку оппозиционные группы в парламенте требуют, чтобы мы 'уважали демократию' и положили конец некоторым нашим недавним действиям, которые пытались законно подорвать Имперский совет."
 ww1_austriahungary.141.a: "Они просто доказывают нашу правоту: демократия ведёт к дисфункции!"
 ww1_austriahungary.143.t: "Чехи протестуют в парламенте"
 ww1_austriahungary.143.d: "Поскольку наша антименьшинственная политика становится ясной, чехи в Имперском парламенте пытаются нарушить наше управление в знак протеста против нас. Они снова и снова вносят законопроекты о реформах, тратя время, голосуют против правительственных мер и пытаются отложить голосование по любым вопросам, не связанным с реформами, предоставляющими Богемии больше автономии. Нам придётся иметь дело с этими маленькими тварями пока."
 ww1_austriahungary.143.a: "Имперский совет у них будет недолго"
 ww1_austriahungary.156.t: "Рост Стального кольца"
 ww1_austriahungary.156.d: "Ключевые лидеры в чёрной металлургии, такие как Витковицкая горная и металлургическая корпорация и Пражская железная компания, расширяют свою деятельность, скупая существующие предприятия и доводя остальных до банкротства, чтобы обеспечить контроль над сталелитейной промышленностью. По мере их роста растёт и объём производства стали. Хотя цены для большинства потребителей в целом растут, фавориты картеля, такие как само правительство и ключевые компании-партнёры правительства, получают льготные цены."
 ww1_austriahungary.156.a: "Хорошие новости для нас"
 ww1_austriahungary.101.t: "Австрия просит нашей поддержки в кризисе с Сербией и Россией"
 ww1_austriahungary.101.d: "Австрия, возможно, поспешно оккупировала Таслицу после начала Балканской войны, чтобы помешать Сербии и Черногории обеспечить границу. Теперь Россия и Сербия направили Вене требование вывести войска из Таслицы, в противном случае это будет считаться актом войны с Сербией. Австрия, кажется, готова воевать из-за этого, прося нашей поддержки их оккупации. Они утверждают, что наша поддержка может заставить Россию и Сербию отозвать свой ультиматум, но если они не отзовут, это будет конфликт, который мы легко выиграем. Готовы ли мы рискнуть поджечь мир?"
 ww1_austriahungary.101.a: "Австрия имеет нашу безоговорочную поддержку!"
 ww1_austriahungary.101.b: "Чёрта с два. Скажите Австрии уступить"
 ww1_austriahungary.102.t: "Германия требует нашего отступления"
 ww1_austriahungary.102.d: "Германия отказалась поддержать нас против требований России и Сербии и, что ещё хуже, приказала нам уступить. Без немецкой поддержки у нас мало выбора, кроме как уйти из Таслицы"
 ww1_austriahungary.102.a: "Они проявляют слабость!"
 ww1_austriahungary.104.t: "Австрия заручается поддержкой Германии"
 ww1_austriahungary.104.d: "Наш ультиматум Австрии привёл к тому, что они трусливо бежали к своим немецким повелителям, которые согласились поддержать Австрию. Таким образом, война с Сербией, вероятно, втянет весь Тройственный союз, что может привести к крупнейшей войне в истории человечества, если Тройственная Антанта затем присоединится на нашей стороне."
 ww1_austriahungary.104.a: "Это ничего не меняет!"
 ww1_austriahungary.104.b: "Мы не готовы к этому!"
 ww1_austriahungary.103.t: "Германия поддерживает нас"
 ww1_austriahungary.103.d: "Германия сообщила нам, что мы имеем их абсолютную поддержку в кризисе с Россией и Сербией. Теперь мы можем предъявить этот факт России и Сербии, и, надеюсь, они отступят."
 ww1_austriahungary.103.a: "Будем надеяться, они не сделают ничего глупого"
 ww1_austriahungary.98.t: "Россия поддерживает нас"
 ww1_austriahungary.98.d: "Россия поддержала наше требование к Австрии вывести войска с недавно захваченных земель на Балканах, что означает, что теперь мы можем предъявить совместный ультиматум Австрии."
 ww1_austriahungary.98.a: "Они должны отступить!"
 ww1_austriahungary.150.t: "Чем больше вещи меняются"
 ww1_austriahungary.150.d: "Тем больше они остаются прежними. По мере того как напряжённость в Богемии начинает закипать, обструкционизм в Имперском совете и нижнем богемском сейме становится всё более распространённым, отношения между поляками и украинцами остаются напряжёнными, а социалистические движения в Вене вызывают потрясения в нашей политике, избиратели только что дали мандат Имперскому совету и министру-президенту, заинтересованным только в сохранении статус-кво. В то время как многие считают, что не раскачивать лодку — это путь вперёд, другие опасаются, что бездействующее правительство может привести к дальнейшему накалу, что может привести к более серьёзному политическому кризису."
 ww1_austriahungary.150.a: "Мы просто будем действовать по обстоятельствам"
 ww1_austriahungary.175.t: "Всплеск сельскохозяйственного экспорта"
 ww1_austriahungary.175.d: "leaf sussy loc blahj"
 ww1_austriahungary.175.a: "Вау"
 ww1_austriahungary.176.t: "Антисемитский подтекст"
 ww1_austriahungary.176.d: "Христианско-социальная партия всегда была домом антисемитизма, содержа множество пожилых мужчин из среднего класса, которые винят еврейское население в упадке своей экономической важности. Их продолжающееся доминирование в Имперском совете, а также в местных органах власти, вероятно, приведёт к сохранению институционализированного антисемитизма, что в предыдущие несколько лет побудило многих евреев мигрировать в более дружественные районы, такие как Венгрия или страны за пределами монархии."
 ww1_austriahungary.176.a: "Может, нам лучше без них?"
 ww1_austriahungary.177.t: "Местная еврейская община массово эмигрирует"
 ww1_austriahungary.177.d: "Локально сконцентрированная община евреев в нашей империи устала от антисемитской политики и культуры в Австрии, собирая чемоданы, чтобы уехать куда-то ещё. Это, вероятно, освободит некоторые рабочие места для местных жителей в регионе, хотя потеря в целом более образованной и квалифицированной группы нанесёт ущерб местной экономике."
 ww1_austriahungary.177.a: "Их рабочие места принадлежат истинным австрийцам!"
 ww1_austriahungary.178.t: "Местная еврейская община массово эмигрирует"
 ww1_austriahungary.178.d: "Локально сконцентрированная община евреев в нашей империи устала от антисемитской политики и культуры в Австрии, собирая чемоданы, чтобы уехать куда-то ещё. Это, вероятно, освободит некоторые рабочие места для местных жителей в регионе, хотя потеря в целом более образованной и квалифицированной группы нанесёт ущерб местной экономике."
 ww1_austriahungary.178.a: "Их рабочие места принадлежат истинным австрийцам!"
 ww1_austriahungary.179.t: "Местная еврейская община массово эмигрирует"
 ww1_austriahungary.179.d: "Локально сконцентрированная община евреев в нашей империи устала от антисемитской политики и культуры в Австрии, собирая чемоданы, чтобы уехать куда-то ещё. Это, вероятно, освободит некоторые рабочие места для местных жителей в регионе, хотя потеря в целом более образованной и квалифицированной группы нанесёт ущерб местной экономике."
 ww1_austriahungary.179.a: "Их рабочие места принадлежат истинным австрийцам!"
 ww1_austriahungary.180.t: "Местная еврейская община массово эмигрирует"
 ww1_austriahungary.180.d: "Локально сконцентрированная община евреев в нашей империи устала от антисемитской политики и культуры в Австрии, собирая чемоданы, чтобы уехать куда-то ещё. Это, вероятно, освободит некоторые рабочие места для местных жителей в регионе, хотя потеря в целом более образованной и квалифицированной группы нанесёт ущерб местной экономике."
 ww1_austriahungary.180.a: "Их рабочие места принадлежат истинным австрийцам!"
 ww1_austriahungary.181.t: "Растущая нехватка продовольствия"
 ww1_austriahungary.181.d: ""
 ww1_austriahungary.181.a: "Это нехорошо... не волнуйтесь, война скоро закончится!"
 ww1_austriahungary.182.t: "Очистка глубоко укоренившейся церкви"
 ww1_austriahungary.182.d: "С падением власти Христианско-социальной партии, блока, построенного на недоверии к церкви, к власти пришла группа в стране, где церковь имеет один из самых высоких уровней влияния на государство из всех европейских стран. От образования до общего права, необходимо много реформ.\n\nОднако христианские консерваторы в Австрии, вероятно, будут отчаянно бороться, чтобы остановить нас. Заход слишком далеко в наших попытках реформировать власть церкви может привести к массовым гражданским волнениям, поэтому рекомендуется осторожность."
 ww1_austriahungary.182.a: "Остальная Европа разобралась с этим десятилетия назад!"
 ww1_austriahungary.183.t: "'Камарилья' советует проявлять крайнюю осторожность в отношении нового социал-демократического правительства"
 ww1_austriahungary.183.d: "Многие австрийские элиты, приближённые к императору, крайне настороженно относятся к нашему правительству, видя в нём угрозу своему институциональному могуществу. Они усиленно лоббируют Франца Иосифа, чтобы тот выгнал наше правительство и назначил консервативного министра-президента, который затем использовал бы указы статьи 14 для обхода социал-демократической коалиции в парламенте. Франц Иосиф, к его чести, стремится дать нашему правительству честный шанс. Если мы сможем избежать прямого гнева императора или того, чтобы он увидел в нас угрозу национальной безопасности Австрии, у нас всё будет в полном порядке."
 ww1_austriahungary.183.a: "Кого волнуют слёзы кучки юнкеров!"
 ww1_austriahungary.184.t: "Ухудшение продовольственной ситуации по всей стране"
 ww1_austriahungary.184.d: "По всей стране цены на продовольствие быстро растут из-за войны и потери сельскохозяйственного производства, и население обеспокоено. Они больше не видят скорого окончания войны и требуют введения предельных цен на продовольствие, чтобы остановить быстро растущие цены."
 ww1_austriahungary.184.a: "Успокойтесь, всё уладится!"
 ww1_austriahungary.174.t: "Чешские группы начинают разыгрывать свои карты"
 ww1_austriahungary.174.d: "На выборах в Имперский совет 1911 года богемские группы интересов получили большое преимущество, надеясь добиться реформ, предоставляющих Богемии больше автономии и сохраняющих чешский язык и культуру отчётливыми и сильными. Консервативное большинство в совете, безразличное к любым изменениям статуса Богемии, привело к тому, что чехи начали применять новые меры. Они поднимают требования на каждой сессии Имперского совета, задерживая управление и раздражая многих. В богемском сейме немецкие группы в Богемии начали сталкиваться с чешскими клубами, что привело к тому, что богемский сейм становится всё более сломленным. Поскольку Имперский совет вряд ли проведёт какие-либо реформы, ситуация может продолжать ухудшаться."
 ww1_austriahungary.174.a: "Не большая проблема в общей схеме вещей"
 ww1_austriahungary.109.t: "Кризис обструкционизма"
 ww1_austriahungary.109.d: "Поскольку отношения между министром-президентом и членами Имперского совета, особенно националистическими и социал-демократическими фракциями, достигли крайне низкого уровня, члены оппозиции в парламенте прибегают к простому захвату законодательного органа, отказываясь принимать законы до тех пор, пока не будут сделаны определённые уступки. Это показывает их истинное лицо: им не удалось получить большинство на прошлых выборах, и теперь они стремятся уничтожить правительство, избранное народом. Поскольку их требования неприемлемы, ситуация вряд ли разрешится путём переговоров. Однако позволить группе агитаторов, марксистов и анархистов удерживать народный парламент в заложниках неприемлемо, и это может дать нам оправдание для применения крайних мер."
 ww1_austriahungary.109.a: "Что ж, они как бы вынуждают нас пойти на решительные действия!"
 ww1_austriahungary.148.t: "Катастрофа Кёртинга"
 ww1_austriahungary.148.d: "Утром 20 июня 1914 года, накануне войны, наш M.III Körting взорвался в результате дружественного столкновения на пути в Кёнигсберг. Весь экипаж погиб вместе с безрассудным пилотом биплана Farman F.20, который врезался в M.III Körting. Эрнст Флатц, пилот Farman, по словам свидетелей, летал кругами вокруг дирижабля, который он не смог опознать как наш! Пресса посетила место крушения уже днём, вызвав медийный ажиотаж. Этот дирижабль был первым дирижаблем, построенным и произведённым австрийскими инженерами, и был единственным в своём роде. Из-за размеров нашего арсенала многие мрачно шутят, что мы были уничтожены собственной рукой. Новости об этом событии распространяются как лесной пожар, и, возможно, уже слишком поздно спасать нашу честь..."
 ww1_austriahungary.148.a: "Это возмутительно!"
 ww1_austriahungary.149.t: "Столкновение биплана и дирижабля в Австрии"
 ww1_austriahungary.149.d1: "Сегодня утром австрийский дирижабль M.III Körting столкнулся во время военных учений с бипланом Farman F.20. Пилот Farman, обер-лейтенант Эрнст Флатц, обвиняется в столкновении, так как он был известен своей безрассудностью. Добавьте больше информации"
 ww1_austriahungary.149.d2: "Сегодня утром австрийский дирижабль M.III Körting столкнулся во время военных учений с бипланом Farman F.20. Пилот Farman, обер-лейтенант Эрнст Флатц, обвиняется в столкновении, так как он был известен своей безрассудностью. Похоже, он имитировал атаку и начал летать кругами вокруг дирижабля и врезался в его резиновую поверхность. Самолёт разбился, а дирижабль взорвался: никто из экипажа — ни с биплана Farman, ни с дирижабля Körting — не выжил после последующих падений. Добавьте больше информации"
 ww1_austriahungary.149.a: "Ок"
 ww1_austriahungary.99.t: "Российско-сербский ультиматум"
 ww1_austriahungary.99.d: "Наш захват Таслицы вызвал дипломатическое возмущение со стороны Сербии, которая теперь призвала своего настоящего хозяина, Россию, поддержать их. Россия и Сербия требуют, чтобы мы немедленно покинули Таслицу, в противном случае это будет считаться нападением на Сербию."
 ww1_austriahungary.99.a: "Может, Германия сможет вразумить этих горячих голов?"
 ww1_austriahungary.99.b: "Ладно, ладно. Мы уйдём."
 ww1_austriahungary.95.t: "Сербия остаётся спокойной"
 ww1_austriahungary.96.t: "Сербия просит нас выступить посредником в споре с Австрией"
 ww1_austriahungary.96.d: "На прошлой неделе австрийские войска оккупировали полосу земли, которая де-юре является османской, которая соединила бы Черногорию и Сербию общей границей после победы Балканской лиги над Османской империей. Сербия, претендуя на эту землю для себя, просит нас помочь заставить Австрию уйти. Что нам делать?"
 ww1_austriahungary.96.a: "Австрия должна уступить"
 ww1_austriahungary.96.b: "Это может спровоцировать войну с Центральными державами. Мы не можем."
 ww1_austriahungary.95.d: "Наш захват Таслицы должен был вызвать ответную реакцию Сербии, но пока Сербия никак не ответила. Кажется, они приняли наш захват региона, очевидно понимая, что им выбьют зубы, если произойдёт реальная конфронтация между нашими армиями."
 ww1_austriahungary.113.t: "Падение добычи галицийской нефти"
 ww1_austriahungary.113.d: "Мы использовали галицийскую нефть. Являясь регионом-производителем нефти, входящим в десятку лучших в мире в наше время, нам удалось вызвать множество спадов в ценах на нефтяную промышленность. К сожалению, из-за недавних забастовок нефтяников и многих других факторов наша добыча нефти резко упала. Чтобы оживить эту отрасль, возможно, нам придётся использовать методы протекционизма, чтобы нефть продолжала течь."
 ww1_austriahungary.113.a: "Катастрофа!"
 ww1_austriahungary.95.a: "Что ж, мы примем победу"
 ww1_austriahungary.94.t: "Австрия захватывает Таслицу"
 AUS_destroy_power_of_the_church: "Уничтожить власть католической церкви"
 AUS_autonomy_and_reconciliation: "Автономия и примирение"
 AUS_reform_the_census_system: "Универсальная личная автономия"
 AUS_concessions_to_the_croatians: "Славянский контроль над славянской администрацией"
 AUS_universal_language_rights: "Универсальные языковые права"
 ww1_austriahungary.94.d: "Австрийские войска вторглись в Таслицу, полосу земли, где официальная граница с Черногорией должна была быть разделена после завершения Балканской войны, и захватили её для себя. Они утверждают, что это временная оккупация для повышения их безопасности, но этот шаг является явным актом агрессии против нас. Как нам реагировать?"
 ww1_austriahungary.94.a: "Может, Россия сможет поддержать нас здесь?"
 AUS_arbeiterbildung: "Arbeiterbildung"
 ww1_austriahungary.94.b: "Мы не можем выиграть войну с Австрией, давайте уступим"
 ww1_austriahungary.88.t: "Хётцендорф предлагает оккупировать Таслицу"
 ww1_austriahungary.88.d: "Конрад Хётцендорф, начальник австрийской армии, предложил оккупировать Таслицу, полосу земли, которая де-юре отделяет Сербию от Черногории. Он утверждает, что установление границы между Сербией и Черногорией укрепит отношения между обоими государствами и повысит вероятность аннексии Сербией Черногории. Ни для кого не секрет, что многие в Сербии желают создания южнославянского государства на Балканах, и Черногория была бы естественным первым регионом, который присоединился бы к этому проекту. Объединение этих двух стран значительно усилит Сербию и рискует ещё больше сплотить мятежных славян в нашей империи."
 ww1_austriahungary.88.a: "Дайте добро!"
 ww1_austriahungary.88.b: "Это было бы безумной эскалацией!"
 ww1_austriahungary.144.t: "Парламент пытается утвердить себя"
 ww1_austriahungary.144.d: "Поскольку мы продолжаем попирать слабые демократические институты, члены Имперского совета пытаются остановить нас. Мятежные фракции в парламенте пытаются заставить соблюдать обычные демократические процедуры и отстаивать свои собственные законные права, к нашему большому сожалению. Хотя мы явно побеждаем демократию, она не сдаётся без боя."
 ww1_austriahungary.144.a: "Их сопротивление бесполезно!"
 ww1_austriahungary.77.t: "Активная Империя"
 ww1_austriahungary.77.d: "Будучи империей с двумя суверенными половинами, каждая со своим сложным правительством, политическими проблемами и общественными противоречиями, Австро-Венгерская империя, несомненно, не скучна для тех, кто ею управляет, мягко говоря. Чтобы империя процветала и в следующие десятилетия, нам нужно внимательно следить."
 ww1_austriahungary.77.a: "У нас всё получится!"
 ww1_austriahungary.37.t: "Беспорядки в Вене"
 ww1_austriahungary.40.t: "Тяжёлая битва"
 ww1_austriahungary.41.t: "Богемский реальполитик?"
 ww1_austriahungary.42.t: "Определяя нарратив"
 ww1_austriahungary.42.d: "По мере приближения выборов определение нарратива становится всё более важным для трёх основных партий. Консерваторы пытаются сформулировать выборы через социальные и религиозные вопросы, привлекая христиан на свою сторону, либералы утверждают, что у них есть решения институциональных проблем, с которыми сталкивается Австрия, а социал-демократы обещают бороться за простых людей."
 ww1_austriahungary.42.a: "Мы должны обеспечить моральную основу нашей страны"
 ww1_austriahungary.42.b: "Нам нужно правительство, решающее проблемы"
 ww1_austriahungary.42.c: "Нам нужно правительство, которое заботится о народе!"
 ww1_austriahungary.41.d: "Поскольку либерально-националистическая коалиция, похоже, имеет хорошие шансы получить большинство на следующих выборах, некоторые чешские националисты рассматривают возможность переключения своего голоса с местных богемских националистических политических партий на 'Deutscher Nationalverband'. Поскольку местные партии не имеют шансов получить большинство в парламенте, голосование за них может быть сочтено пустой тратой по сравнению с голосованием за Deutscher Nationalverband, который может действительно победить. Большинство Deutscher Nationalverband может быть готово пойти на компромисс с богемскими требованиями языковой реформы, предоставив особый статус Судетенланду, что по крайней мере будет лучше, чем статус-кво."
 ww1_austriahungary.41.a: "Они абсолютно правы"
 ww1_austriahungary.41.b: "Ерунда, Deutscher Nationalverband — это в основном немецкая националистическая группа"
 ww1_austriahungary.40.d: "SAO, будучи социалистической партией, чья основная поддержка — рабочий класс, сталкивается с реальностью консервативного правления. Христианско-социальная партия не жалеет сил в своём подходе к организованному труду, подавляя его всякий раз, когда может. Это разрушает сплочённость рабочих и ослабляет способность SAO распространять поддержку через организованный труд."
 ww1_austriahungary.40.a: "У них никогда не было лёгкого пути"
 ww1_austriahungary.37.d: "По мере роста цен на мясо растут беспорядки в Вене. Бедняки выходят на улицы, выражая своё недовольство экономическим положением и требуя от правительства что-то предпринять. Протесты начинают становиться жестокими, поскольку голодные граждане вымещают свои обиды на местных властях. Это влияет на население в целом, которое поддаётся влиянию послания..."
 ww1_austriahungary.37.a: "Консерваторов, обещающих закон и порядок"
 ww1_austriahungary.37.b: "Либералов, хвастающихся своими обширными планами по улучшению страны"
 ww1_austriahungary.37.c: "Социал-демократов, обещающих хлеб для всех!"
 ww1_austriahungary.50.t: "Чешские националистические партии показывают хорошие результаты"
 ww1_austriahungary.50.d: "Примечательным отрывком из недавних выборов в Имперский совет является успех чешских националистических партий. Чешский блок получил много мест, увеличив своё влияние в Имперском совете, что может привести к усилению давления на министра-президента, чтобы он помог найти подходящий компромисс для различных требований чешских националистов."
 ww1_austriahungary.50.a: "Полагаю, мы не можем откладывать этот вопрос на потом"
 ww1_austriahungary.64.t: "Вопрос приоритетов"
 ww1_austriahungary.64.d: "Основными товарами, контрабандой ввозимыми в Боснию, являются оружие и пропаганда, и то, и другое оказывает негативное влияние на Боснию. Хотя контрабанда оружия, очевидно, более опасна на первый взгляд, действительно многие покушения терпят неудачу из-за плохого планирования. Кроме того, есть опасения, что пропагандистские кампании могут вызвать дальнейшие волнения. Мы должны решить, на чём пограничная безопасность должна сосредоточиться в первую очередь."
 ww1_austriahungary.64.a: "Мы должны бороться с пропагандой!"
 ww1_austriahungary.64.b: "Разве это не очевидно? Оружие насилия опаснее каких-то глупых бумажек"
 ww1_austriahungary.54.t: "[AUS.GetName] протягивает руку"
 ww1_austriahungary.54.d: "[AUS.GetName] и их дипломаты обратились к нам, предлагая различные договоры о торговле и правовой помощи. Хотя наше правительство далеко не дружелюбно к Австрии, эти договоры кажутся взаимовыгодными и могут представлять новый подход Австрии к дипломатии. Может, мы могли бы все стать друзьями? Или мы можем отклонить эти предложения"
 ww1_austriahungary.54.a: "Это кажется... довольно разумным"
 ww1_austriahungary.54.b: "Чёрта с два. Это уловка"
 ww1_austriahungary.55.t: "[SER.GetName] принимает договоры"
 ww1_austriahungary.55.d: "Наши договоры о правовом сотрудничестве и торговле были приняты Сербией, что означает, что они теперь официально вступили в силу. Ожидается, что они принесут пользу нам обоим и могут открыть путь к будущей мирной терпимости."
 ww1_austriahungary.55.a: "Ещё один успех Эренталя!"
 ww1_austriahungary.56.t: "[MNT.GetName] принимает договоры"
 ww1_austriahungary.56.d: "Наши договоры о правовом сотрудничестве и торговле были приняты Черногорией, что означает, что они теперь официально вступили в силу. Ожидается, что они принесут пользу нам обоим и могут открыть путь к будущей мирной терпимости."
 ww1_austriahungary.56.a: "Ещё один успех Эренталя!"
 ww1_austriahungary.57.t: "[SER.GetName] отклоняет договоры"
 ww1_austriahungary.57.d: "Сербия outright отклонила наши предложенные договоры о сотрудничестве в различных секторах. Этот отказ является явным признаком их растущей враждебности и неразумности, и мы должны скорректировать нашу дипломатию соответствующим образом."
 ww1_austriahungary.57.a: "Глупцы."
 ww1_austriahungary.78.t: "Автоматическая пропаганда в Богемии завершается"
 ww1_austriahungary.78.d: "Наша политическая власть упала ниже требуемого уровня, что привело к отмене миссии Распространение пропаганды в Богемии. Мы можем реактивировать её, когда наша политическая власть станет выше"
 ww1_austriahungary.78.a: "Замечено"
 ww1_austriahungary.110.t: "Автоматическое охлаждение напряжённости со славянами завершается"
 ww1_austriahungary.110.d: "Наша политическая власть упала ниже требуемого уровня, что привело к отмене миссии Автоматическое охлаждение напряжённости со славянами. Мы можем реактивировать её, когда наша политическая власть станет выше"
 ww1_austriahungary.110.a: "Замечено"
 ww1_austriahungary.79.t: "Автоматические усилия по стабилизации в славянских территориях завершаются"
 ww1_austriahungary.79.d: "Наша политическая власть упала ниже требуемого уровня, что привело к отмене миссии Усилия по стабилизации в славянских территориях. Мы можем реактивировать её, когда наша политическая власть станет выше, чтобы облегчить бремя управления такими проблемными землями."
 ww1_austriahungary.79.a: "Замечено"
 ww1_austriahungary.52.t: "Чехи наращивают обструкционизм"
 ww1_austriahungary.52.d: "Поскольку министр-президент активно занимает позицию против чешских партий, чехи в парламенте начали усиливать свою обструкцию. Голосование по законопроектам, даже не связанным с образованием, отменяется, поскольку чехи уходят, соглашаясь голосовать только по тем законопроектам, которые они поддерживают. Хотя чехи обычно позволяют законопроектам проходить после больших задержек, это всё же начинает делать парламент нефункциональным."
 ww1_austriahungary.52.a: "В каком мире это справедливо?"
 ww1_austriahungary.58.t: "[MNT.GetName] отклоняет договоры"
 ww1_austriahungary.58.d: "Черногория отклонила наши предложенные договоры о сотрудничестве в различных секторах. Этот отказ является явным признаком их растущей враждебности и неразумности, и мы должны скорректировать нашу дипломатию соответствующим образом."
 ww1_austriahungary.58.a: "Глупцы."
 ww1_austriahungary.53.t: "Чехи начинают предпринимать шаги"
 ww1_austriahungary.53.d: "В связи с нашими явными античешскими действиями чехи в богемском сейме начали предпринимать свои собственные шаги. Они проверяют границы, принимают несколько реформ, направленных на достижение их требований, которые им не удалось выполнить в Имперском совете. Это приводит к призывам к министру-президенту приостановить работу богемского сейма или, по крайней мере, ограничить его полномочия."
 ww1_austriahungary.53.a: "Это вообще законно?"
 ww1_austriahungary.63.t: "Всплеск активности 'Чёрной руки' и 'Младой Босны'"
 ww1_austriahungary.63.d: "Начало войны между Сербией и Османской империей привело к всплеску сербского национализма как в Сербии, так и среди сербов в нашей стране. Это, в сочетании с тем, что сербская безопасность границы снижена, поскольку их правительство уделяет приоритетное внимание войне с Османской империей, приводит к большому увеличению контрабандных кампаний из Сербии в Боснию. Пропагандистские материалы, оружие и боеприпасы наводняют Боснию, разжигая напряжённость и увеличивая насилие в регионе."
 ww1_austriahungary.63.a: "Необходима массовая облава!"
 ww1_austriahungary.49.t: "Борьба за принятие бюджета"
 ww1_austriahungary.49.d: "Сессия по принятию нового бюджета в Имперском совете заняла гораздо больше времени, чем ожидалось, из-за обструкции чешских националистов, которые яростно спорили с предпочтительным бюджетом немецких националистов. Бюджет в конечном итоге был принят через несколько дней после ожидаемого срока, потребовав обширного вмешательства министра-президента."
 ww1_austriahungary.49.a: "Нехорошо"
 ww1_austriahungary.62.t: "Социалистические марши в Вене"
 ww1_austriahungary.62.d: "Наша недавняя антисоциалистическая политика привела к тому, что социалистические группы организовали марши в своих опорных пунктах, особенно в Вене. Они привлекают поддержку рабочих, которые видят политику правительства как угнетающую. Хотя пока они кажутся относительно безвредными, протесты выглядят не очень хорошо."
 ww1_austriahungary.62.a: "Кучка никчёмных людей"
 ww1_austriahungary.60.t: "Чехи разрушают Рейхсрат"
 ww1_austriahungary.60.d: "Чехи, ранее задерживавшие принятие законопроектов, начали outright отказываться что-либо принимать. Они уклоняются от голосования, вместо этого произнося долгие речи о важности реформы образования в Богемии. Это приводит к тому, что Рейхсрат не может функционировать, что, вероятно, означает, что необходимы решительные меры."
 ww1_austriahungary.60.a: "Они не могут смириться с тем, что их идеи непопулярны!"
 ww1_austriahungary.51.t: "Массовые инвестиции из Вены"
 ww1_austriahungary.51.d: "Австрийское правительство в Вене одобрило масштабные инвестиции в Боснию, которые, как ожидается, помогут нам построить новые школы, дороги, полицейские участки и инвестировать в местную промышленность."
 ww1_austriahungary.51.a: "Как любезно с их стороны!"
 ww1_austriahungary.35.t: "Люди без дома"
 ww1_austriahungary.35.d: "Немецкий правый национализм в Австрии неуклонно снижается, обычно показывая довольно плохие результаты на выборах. Поскольку монархия в целом выступает против всех форм национализма, включая немецкий национализм, они чувствуют себя отчуждёнными от политики Христианско-социальной партии, крупнейшей правой партии в Австрии, тесно связанной с короной Габсбургов. Либералы в последние годы формируют коалиции с некоторыми немецкими националистами, но эти немецкие националисты обычно вовсе не правые, вместо этого соглашаясь с большинством идей либералов. Малочисленные, правые немецкие националисты знают, что они не наберут значительного количества мест в парламенте, но их группа достаточно велика, чтобы поддержка одной партии могла помочь её продвижению и увеличить их влияние внутри этой партии. Вопрос в том, какую партию выбрать."
 ww1_austriahungary.36.t: "Либералы увеличивают поддержку в Богемии"
 ww1_austriahungary.36.d: "Поскольку консерваторы блокируют существенные реформы в Богемии, а SAO не может предложить комплексный план будущего Богемии, либералы наблюдают всплеск поддержки своей политики. Они призвали провести новые границы на этнической основе в Богемии, одновременно реформируя школы, чтобы включить чешский язык."
 ww1_austriahungary.48.t: "Антиимперская пропаганда достигает румын"
 ww1_austriahungary.48.d: "Румыны начали антиавстрийские пропагандистские кампании по всей Трансильвании, чтобы ослабить мнение нашего румынского меньшинства о стране."
 ww1_austriahungary.48.a: "Они нейтральны!"
 ww1_austriahungary.45.t: "Вперёд, к промышленному производству"
 ww1_austriahungary.45.d: "Наш выбор сосредоточиться на гражданской промышленности — это не мелочь. Хотя мы упустим производство оружия, от улучшения гражданских промышленных рабочих мест будет гораздо больше бонусов, поскольку мы превратим нашу Империю в центр Восточной Европы."
 ww1_austriahungary.45.a: "Все на борт!"
 ww1_austriahungary.36.a: "Это, безусловно, увеличивает их шансы на победу на следующих выборах"
 ww1_austriahungary.35.a: "По крайней мере, либералы делают вид, что заботятся о нас"
 ww1_austriahungary.35.b: "Христианско-социальная партия защитит некоторые немецкие ценности"
 ww1_austriahungary.34.t: "Отношения между немецкой СДПГ и австрийской SAO"
 ww1_austriahungary.34.d: "Несмотря на очень тесные отношения между Австро-Венгрией и Германией, и СДПГ, и SAO доминируются немецкими деятелями, СДПГ и SAO не широко сотрудничают. В преддверии выборов в Австрии многие в SAO хотят заручиться помощью СДПГ. Использование СДПГ может улучшить предвыборную программу SAO и дать SAO больше ресурсов для агитации, но некоторые в SAO не считают, что работать с иностранной партией — хорошая идея."
 ww1_austriahungary.34.a: "Немецкая и австрийская политика должны оставаться раздельными"
 ww1_austriahungary.34.b: "Сотрудничество двух немецких социал-демократических партий просто имеет смысл"
 ww1_austriahungary.21.t: "Результаты выборов в законодательное собрание Цислейтании 1911 года - Deutscher Nationalverband получает большинство"
 ww1_austriahungary.43.t: "Результаты выборов в законодательное собрание Цислейтании 1911 года - Sozialdemokratische Arbeiterparte Österreich получает большинство"
 ww1_austriahungary.43.d: "Выборы в австрийский законодательный орган завершились на фоне беспорядков из-за нехватки мяса, при этом правящая коалиция старых консерваторов была вытеснена коалиционной группой социал-демократов. Ожидается, что группа будет добиваться реформы трудового законодательства и новых методов социального обеспечения. Потеряв мандат, ожидается, что Рихард Биенерт вскоре уйдёт в отставку, а нового министра-президента на его место назначит король."
 ww1_austriahungary.43.a: "Народ запел..."
 ww1_austriahungary.44.t: "Результаты выборов в законодательное собрание Цислейтании 1911 года - Христианско-социальная партия сохраняет большинство"
 ww1_austriahungary.44.d: "Выборы в австрийский законодательный орган завершились на фоне беспорядков из-за нехватки мяса, при этом правящей коалиции старых консерваторов удалось удержать небольшое большинство. Ожидается, что группа продолжит статус-кво, принимая ограниченные реформы, где это уместно. После окончания выборов ожидается, что Рихард Биенерт вскоре уйдёт в отставку, чтобы позволить назначить нового министра-президента, которого решит король."
 ww1_austriahungary.44.a: "Народ запел..."
 ww1_austriahungary.21.d: "Выборы в австрийский законодательный орган завершились на фоне беспорядков из-за нехватки мяса, при этом правящая коалиция старых консерваторов была вытеснена либерально-националистической коалиционной группой. В Богемии, уже страдающей от противоречий, связанных с желанием местных чехов повысить зарплату учителям и создать больше чешских языковых школ, ожидается, что напряжённость возрастёт ещё больше с добавлением большего числа чешских националистов в парламенте. Потеряв мандат, ожидается, что Рихард Биенерт вскоре уйдёт в отставку, а нового министра-президента на его место назначит король."
 ww1_austriahungary.21.a: "Народ запел..."
 ww1_austriahungary.33.t: "Партии начинают организовывать свои избирательные кампании"
 ww1_austriahungary.33.d: "Хотя до выборов в имперский совет ещё более года, социал-демократы, либералы и консерваторы уже начали организовывать свои кампании. Выборы выглядят довольно конкурентными, и социал-демократы, и в меньшей степени либералы имеют реальный шанс вытеснить правящую консервативную коалицию из власти, получив большинство сами."
 ww1_austriahungary.33.a: "Кто победит?"
 ww1_austriahungary.31.t: "Социал-демократы устраивают бунт в парламенте"
 ww1_austriahungary.31.d: "Вслед за недавними общими беспорядками социал-демократические группы в парламенте начали нарушать парламентские процедуры, требуя различных реформ. Хотя пока [AUS_GetMinisterPresident] игнорировал эти выходки, их трюки привлекают нежелательное внимание к их идеалам и задерживают принятие важных законов, что означает, что необходим ответ."
 ww1_austriahungary.31.a: "Нам нужно что-то с этим сделать..."
 AUS_protect_the_mittelstand: "Защитить средний класс"
 AUS_the_emperors_blessing: "Переключиться на вопросы не меньшинств"
 AUS_mantaining_the_harmony_of_the_empire: "Поддержание гармонии Империи"
 ww1_austriahungary.28.t: "Богемский вопрос преследует [AUS_GetMinisterPresident]"
 ww1_austriahungary.28.d: "Приход к власти [AUS_GetMinisterPresident] вызвал новые дебаты в парламенте о лучшем решении чешского языкового и школьного вопроса. Несмотря на все попытки, министр-президент не добился успеха в парламентских переговорах о компромиссе между двумя сторонами."
 ww1_austriahungary.28.a: "Неужели это никогда не пройдёт?"
 AUS_unite_the_imperial_council: "Объединить Имперский совет"
 AUS_sponsoring_agr_cooperatives: "Спонсирование сельскохозяйственных кооперативов"
 AUS_reform_laws_on_obstructionism: "Реформировать законодательство об обструкционизме"
 AUS_anti_liberalism: "Защитить общество от либерализма и упадка"
 AUS_agricultural_cooperatives: "Спонсировать сельскохозяйственные кооперативы"
 AUS_destroy_the_elitist_culture: "Gebundene Wirtschaftsordnung"
 AUS_destroy_the_elitist_culture_desc: "Wirtschaftsordnung, или 'экономический порядок' на английском, — это набор правил, которым должны следовать все государственные организации, граждане, предприятия и предприниматели. Установление чёткого порядка, Gebundene Wirtschaftsordnung, облегчит наш переход к более регулируемой экономике, вдали от экономического либерализма."
 AUS_combat_the_appeal_of_the_social_democrats: "Soziale Marktwirtschaft"
 AUS_implement_corporatism: "Внедрить национальный корпоративизм"
 ww1_austriahungary.23.e: "Мы вернём Пауля Гауча фон Франкентурна"
 ww1_austriahungary.29.t: "Продовольственные бунты продолжаются"
 ww1_austriahungary.29.d: "Всего через несколько недель после прихода к власти [AUS_GetMinisterPresident] в собственно Австрии вспыхнули крупные беспорядки. Поскольку цены на мясо всё ещё высоки из-за вспышки чумы рогатого скота в животноводстве, многие австрийцы с трудом могут позволить себе мясо и винят в этом правительство."
 ww1_austriahungary.29.a: "Венская биржа на прошлой неделе выросла!"
 ww1_austriahungary.30.t: "Конрад фон Хётцендорф предлагает 'превентивный удар' по Италии"
 ww1_austriahungary.30.d: "Франц Конрад фон Хётцендорф, лучший и ведущий командир нашей армии, неоднократно просил [AUS.GetLeader] санкционировать вторжение в Италию, которая сейчас занята войной с Османской империей. Конрад давно выступает против итальянского союза, утверждая, что Италия мало что даёт Тройственному союзу и при первой же удобной возможности ударит Австрию в спину. Это шаг, который никто в правительстве всерьёз не рассматривает, однако Эренталь, наш ведущий дипломат, особенно оскорбился этим предложением. Он уже некоторое время утверждает, что присутствие такого агрессивного и импульсивного человека, как Конрад, во главе армии подрывает его дипломатические усилия с соседями Австрии, поскольку его слова противоречат официальной позиции австрийского государства, желающего мира, дружественных отношений и стабильности во всём мире. Хотя [AUS.GetLeader] в прошлом прощал многие громкие заявления Хётцендорфа, этот инцидент в сочетании с давлением Эренталя заставил [AUS.GetLeader] временно отстранить Хётцендорфа от должности главы армии."
 ww1_austriahungary.30.a: "Ты не понимаешь, Конрад? Ты и есть проблема"
 ww1_austriahungary.14.t: "Правительство утверждает новые запреты на российскую сельскохозяйственную продукцию"
 ww1_austriahungary.14.d: "По мере роста напряжённости с Россией из-за нестабильности на Балканах, особенно в Албании, [AUS.GetLeader] утвердил серию новых торговых ограничений с Россией, чтобы попытаться экономически наказать Россию за её действия на Балканах, надеясь использовать торговые ограничения в качестве рычага позже. Пока что эффект был немедленным в виде роста цен на товары по всей империи, поскольку наша экономика уже страдает от недавней засухи."
 AUS_nationalized_irma: "Государственные железные дороги"
 AUS_ban_import_of_luxury_goods: "Запретить импорт предметов роскоши"
 ww1_austriahungary.108.t: "Отношения между министром-президентом и Имперским советом рушатся"
 ww1_austriahungary.108.d: "Бескомпромиссный характер нового министра-президента принёс ему мало друзей в Имперском совете, уже раздробленном и разделённом после выборов в июле 1911 года. Коалиции с трудом создаются, и принятие законов останавливается."
 ww1_austriahungary.108.a: "Какой совершенно бесполезный орган власти"
 ww1_austriahungary.14.a: "Было ли мудро с его стороны делать это прямо сейчас?"
 ww1_austriahungary.46.t: "[FROM.GetName] предоставляет преимущества [ROOT.GetAdjectiveCap] зерну"
 ww1_austriahungary.46.d: "[FROM.GetNameDefCap] применил льготные тарифы к нашей продукции, что означает, что они применили тарифы к сельскохозяйственному экспорту других стран, чтобы сделать нашу сельскохозяйственную продукцию более дешёвой для покупки на австрийских рынках. Это огромная победа для нас, и это помогает поддерживать наших фермеров в полях, особенно в производстве зерна и крупного рогатого скота."
 ww1_austriahungary.20.t: "Нехватка мяса подрывает поддержку правящих партий"
 ww1_austriahungary.20.d: "По мере того как австрийская половина империи готовится к новым выборам, недавняя нехватка мяса вызывает недовольство правящей партии. В настоящее время в Австрии доминирует Христианско-социальная партия, но коалиция либералов и националистов теперь, кажется, готова сломать господство Христианско-социальной партии в австрийской политике."
 ww1_austriahungary.20.a: "Император — тот, кто обладает реальной властью!"
 ww1_austriahungary.19.t: "Организованный труд демонстрирует признаки раскола"
 ww1_austriahungary.19.d: "Организованный труд, самый сильный в промышленных регионах Богемии и внутренней Австрии, в прошлом пользовался умеренной сплочённостью, объединённый в стремлении улучшить условия труда для всех. В преддверии выборов между движением начинают проявляться трещины. Профсоюзы, связанные с чешскими националистическими и немецкими националистическими организациями, с трудом сотрудничают, видя друг в друге врагов, а не товарищей, объединённых общей борьбой за улучшение условий труда."
 ww1_austriahungary.19.a: "Мы должны использовать это как можно больше!"
 ww1_austriahungary.19.b: "Что ж, это интересно"
 ww1_austriahungary.18.t: "Нарушенные цепочки поставок продовольствия"
 ww1_austriahungary.18.d: "Засуха, запреты на торговлю с Россией и недавние вспышки заболеваний скота вызвали хаос в наших линиях снабжения. Теперь, когда все запасы мяса до кризиса распроданы в магазинах, цепочки поставок по всей стране официально сильно пострадали. Цена на мясо резко выросла, многие магазины сообщают о дефиците."
 ww1_austriahungary.18.a: "Мы переживём эту бурю"
 ww1_austriahungary.15.t: "Увеличение импорта из Сербии"
 ww1_austriahungary.15.d: "Пока мы ждём, пока проблема с ценами на продовольствие решится сама собой, многие в правительстве считают, что временное увеличение импорта из Сербии может помочь предотвратить резкий рост цен. Проблема, однако, в том, что агрессивная антиславянская политика Венгрии серьёзно обострила отношения между нами и Сербией, и, видя нашу уязвимость сейчас, они вряд ли примут новую торговую сделку без реформы Венгрией их обращения со славянами в Хорватии. Таким образом, мы планируем официально попросить Венгрию реформировать обращение со славянами, чтобы мы могли заключить торговую сделку с Сербией."
 ww1_austriahungary.15.a: "Это унизительно, но нам это нужно"
 ww1_austriahungary.16.t: "Австрия просит нас реформировать антисербскую политику"
 ww1_austriahungary.16.d: "Ввиду недавних проблем в нашей сельскохозяйственной промышленности, вызванных болезнями скота, Австрия стремится временно увеличить импорт сельскохозяйственной продукции из Сербии, чтобы предотвратить нехватку продовольствия. Однако наша антисербская политика как в торговле, так и в обращении со славянскими гражданами привела к тому, что у Сербии нет нулевого интереса к увеличению торговли ни с нами, ни с Австрией. Таким образом, Австрия просит нас провести реформы, чтобы можно было увеличить торговлю с Сербией."
 ww1_austriahungary.16.a: "Да, как бы не так!"
 ww1_austriahungary.17.t: "Венгрия отказывается изменять антиславянскую политику"
 ww1_austriahungary.17.d: "Высокомерные венгры отказались реформировать своё обращение со славянами на своих землях, фактически убив нашу идею увеличения импорта из Сербии, чтобы помочь смягчить продовольственный кризис. Это в сочетании с недавними торговыми ограничениями в отношении России означает, что наша способность избежать временной нехватки продовольствия зависит от нашей удачи."
 ww1_austriahungary.17.a: "Проклятые венгры!"
 ww1_austriahungary.46.a: "Спасибо, Австрия, очень мило!"
 ww1_austriahungary.47.t: "Имперский доклад о защитных пошлинах"
 ww1_austriahungary.47.d: "Несколько месяцев назад мы применили принцип протекционизма и ввели защитные пошлины на продукцию, такую как крупный рогатый скот и зерно, из других стран, чтобы принести пользу галицийским и венгерским фермерам. Пошлины на крупный рогатый скот оказались эффективными: цены на импортный скот выросли более чем на 30%, что принесло имперским фермерам в Галиции и Трансильвании много денег. К сожалению, пошлины на пшеницу оказались неэффективными, поскольку мы не смогли превзойти зарубежное производство пшеницы."
 ww1_austriahungary.47.a: "Отменить налог на зерно!"
 ww1_austriahungary.47.b: "Некоторые говорят, что мы можем захотеть больше тарифов..."
 ww1_austriahungary.27.t: "Поляки протестуют против строительства новых каналов"
 ww1_austriahungary.27.d: "Поляки по всей стране начали оказывать сильное давление на правительство, чтобы оно отказалось от создания новых каналов через Дунай, заявляя, что это нанесёт огромный ущерб их общинам. Они утверждают, что экономика Галиции сильно зависит от железнодорожного транспорта, используемого для экспорта зерна, соли и нефти. Если система каналов Дуная будет улучшена, торговля будет всё больше переключаться на водные пути, минуя галицийские железные дороги и разрушая их экономику. В настоящее время они используют законы о парламентской процедуре, чтобы блокировать финансирование проектов, хотя [AUS.GetLeader] может использовать королевский указ, чтобы обойти их опасения, если это необходимо."
 ww1_austriahungary.27.a: "Если для них это так важно, мы откажемся от этого"
 ww1_austriahungary.27.b: "Они могут жаловаться сколько угодно, но это станет законом!"
 ww1_austriahungary.162.t: "Протест Zuckerkartell"
 ww1_austriahungary.162.d: "Наше решение перейти к более управляемой государством, справедливой для всех экономике было спорным среди немногих, за исключением тех, кто наживается на вершине многих австро-венгерских картелей. Многие сахарные картели, Zuckerkartells, протестовали против нашего решения, как венгерский бизнесмен Шандор Хатвани-Дойч, который заявил, что австрийская прибыль упадёт на '400, 500, 600 процентов из-за этого действия'. Несмотря на возмущение бизнесменов, многие крестьяне и рабочие, кажется, воспринимают это хорошо, рады видеть меньше скоординированной монополизации в нации."
 ww1_austriahungary.162.a: "А мне их не жалко"
 ww1_austriahungary.163.t: "Связанные со стоимостью жизни беспорядки в крупных городах"
 ww1_austriahungary.163.d: "Поскольку австрийская экономика всё больше поглощается монополистическими картелями, стоимость жизни для австрийцев растёт. Из-за отсутствия конкуренции картели повышают цены повсеместно и получают рекордную прибыль за счёт простых граждан. Кроме того, теряется много рабочих мест, поскольку картели вытесняют малый бизнес и вызывают его крах, и многие их работники не находят другого места"
 ww1_austriahungary.163.a: "Закрыть их как можно быстрее!"
 ww1_austriahungary.22.t: "Назначение следующего министра-президента Австрии"
 ww1_austriahungary.22.d: "В связи с отставкой нынешнего министра-президента, [AUS_GetMinisterPresident], [AUS.GetName] теперь поручено назначить нового министра-президента. Основным соображением для [AUS.GetLeader] является вопрос о том, должен ли следующий министр-президент быть либеральным реформистом со склонностью к попыткам умиротворения групп меньшинств или антидемократическим лояльным автократом, который не будет бояться применять силу в случае необходимости. У обоих есть свои преимущества и недостатки. Кого следует назначить?"
 ww1_austriahungary.32.t: "Правительство [AUS_GetMinisterPresident] падает"
 ww1_austriahungary.32.d: "Беспорядки из-за продовольственных бунтов и либеральной обструкции достигли кульминации, когда в австрийский парламент были произведены выстрелы в акте политического терроризма. Это привело к тому, что [AUS_GetMinisterPresident] решил уйти в отставку, видя текущую политическую ситуацию как крайне неблагоприятную. Надеются, что следующий министр-президент будет глотком свежего воздуха, который будет квалифицирован для решения политического кризиса."
 ww1_austriahungary.32.a: "Всего через несколько месяцев после вступления в должность!"
 ww1_austriahungary.23.t: "Выбор идеального кандидата"
 ww1_austriahungary.23.d: "Хотя мы решили назначить автократа министром-президентом Австрии, теперь мы должны определиться с именем. Советники [AUS.GetLeader] принесли список политиков, которые соответствуют целям повестки [AUS.GetLeader]. Кого следует назначить?"
 ww1_austriahungary.23.a: "Очевидный выбор — Карл фон Штюркх"
 ww1_austriahungary.23.b: "Генрих Клам-Мартиниц хорошо подойдёт"
 ww1_austriahungary.23.c: "Макс Гуссарек фон Хайнлайн, кажется, восходящая звезда"
 ww1_austriahungary.22.a: "Давайте посмотрим на кандидатов-автократов"
 ww1_austriahungary.22.b: "Давайте посмотрим на кандидатов-реформистов"
 ww1_austriahungary.11.t: "Повестка Биенерта"
 ww1_austriahungary.11.d: "С момента принятия избирательной реформы в Цислейтании напряжённость между немцами и чехословаками значительно снизилась, до такой степени, что текущая ситуация довольно стабильна. Тем не менее, проблемы остаются: чешские националистические партии добиваются большей автономии, в то время как немецкие националистические партии пытаются обострить ситуацию. Чехословацкие профсоюзы также организуются в попытке добиться от нас больших уступок. Биенерт стремился ещё больше стабилизировать ситуацию, проведя ряд реформ по всей цислейтанской половине империи, чтобы успокоить чехословаков, румын, поляков и рутенов."
 ww1_austriahungary.11.a: "Ограниченные уступки, вероятно, к лучшему"
 ww1_austriahungary.25.t: "Осязаемое решение богемских проблем"
 ww1_austriahungary.25.d: "По мере роста беспорядков в Богемии, поскольку чешские националисты требуют реформ чешских школ, [AUS.GetLeader] предложил, чтобы бывший богемский губернатор граф Франциск Тун вернулся на эту должность. Туну удалось договориться о нескольких уступках чехам в последний раз, когда он занимал эту должность, до такой степени, что немцы в Богемии возглавили усилия по его отстранению от должности. Надеются, что он также сможет договориться о решении чешского школьного вопроса."
 ww1_austriahungary.25.a: "Он был бы нам очень полезен сейчас"
 ww1_austriahungary.26.t: "Немцы блокируют попытку языковой реформы"
 ww1_austriahungary.26.d: "Несмотря на наши попытки внедрить запрашиваемые чехами реформы по использованию чешского языка в школах, немецкие группы в парламенте успешно заблокировали наши усилия, утверждая, что это навредит образованию немецких детей, а также навредит единству австрийской нации. Таким образом, пока попытки провалились."
 ww1_austriahungary.26.a: "Ну блин"
 ww1_austriahungary.130.t: "Австрия предлагает выступить посредником между нами и Болгарией"
 ww1_austriahungary.130.d: "Хотя у нас, безусловно, есть разногласия, Австрия предложила выступить посредником в наших отношениях и разрешить любые возможные пограничные споры и конфликты между нами и Болгарией."
 ww1_austriahungary.130.a: "Меньше конфликтов для всех."
 ww1_austriahungary.130.b: "Это уловка!"
 ww1_austriahungary.131.t: "Румыно-болгарское посредничество успешно"
 ww1_austriahungary.131.d1: "Нам удалось организовать переговоры с Румынией! Однако полный союз невозможен из-за наших противоречивых идеологий."
 ww1_austriahungary.131.d2: "Австрийцам неожиданно удалось организовать переговоры между Болгарией и Румынией."
 ww1_austriahungary.131.a: "Отлично!"
 ww1_austriahungary.132.t: "Австрийское посредничество провалилось"
 ww1_austriahungary.132.d: "Румыния отказалась, вызвав массовый переворот на Балканах, а возмущение цветёт по всей территории."
 ww1_austriahungary.132.a: "Балканы бурлят..."
 ww1_austriahungary.133.t: "Хрупкий союз с Румынией"
 ww1_austriahungary.133.d: "Балканская пороховая бочка взорвалась, и интерес России к региону только растёт. Они мобилизовали часть своей армии у границ Румынии, чтобы помешать им помочь туркам. Румыния является ключевым противником нашего союза для контратаки русского медведя... но с ростом румынского унионистского рвения и агитации в Трансильвании... ну, легко понять, к чему это ведёт. Необходимо поощрять Румынию оставаться верным компонентом нашего союза, ибо наша ситуация будет ужасной, если откроется так много возможных фронтов."
 ww1_austriahungary.133.a: "Мотивировать Венгрию умиротворить трансильванских румын"
 ww1_austriahungary.134.t: "Австрия призывает нас умиротворить трансильванских румын"
 ww1_austriahungary.134.d: "Балканская пороховая бочка взорвалась, и интерес России к региону только растёт. Они мобилизовали часть своей армии у границ Румынии, чтобы помешать им помочь туркам. Совместный министр Берхтольд призывает нас умиротворить румын, чтобы сохранить хрупкий союз в порядке и угодить Германии..."
 ww1_austriahungary.134.a: "Разве голого минимума недостаточно?"
 ww1_austriahungary.173.t: "Новый прототип"
 ww1_austriahungary.173.d: "Австрийский изобретатель Гюнтер Бурштын, вдохновлённый американским сельскохозяйственным трактором с гусеничными лентами, придумал конструкцию боевой машины, или, как он её называет, Motorgeschütz (моторное орудие). Модель, которую он нам прислал, когда её проверили наши специалисты, была описана как... оптимистичная, мягко говоря. Он описал её предполагаемое использование как поддержку пехоты и подавление вражеского пулемётного огня. Если бы он мог получить контракт с коммерческой фирмой, мы могли бы рассмотреть возможность использования его конструкции, но пока он уходит ни с чем."
 ww1_austriahungary.173.a: "Безумно..."
 ww1_austriahungary.12.t: "Засуха по всей Европе сильно ударила по нам"
 ww1_austriahungary.12.d: "Засуха сильно ударила по всей Европе, и мы испытываем трудности. Наши восточные сельскохозяйственные провинции резко сокращают производство продовольствия, а фермеры банкротятся. Цены на продовольствие растут по всей Европе, и ожидается, что они продолжат расти в ближайшие месяцы."
 ww1_austriahungary.12.a: "Это может вызвать бунты!"
 ww1_austriahungary.13.t: "Падение экспорта скота"
 ww1_austriahungary.13.d: "Проблема с болезнями, похоже, никуда не уходит: чума рогатого скота разрушает сельскохозяйственную промышленность, и наши основные торговые партнёры временно приостанавливают многие из наших поставок. Это дошло до того, что необходима правительственная реакция, чтобы помочь искоренить болезнь и возродить наш экспорт."
 ww1_austriahungary.13.a: "Необходимо наше вмешательство"
 ww1_austriahungary.10.t: "Успешная реформа Алиспана в Венгрии"
 ww1_austriahungary.10.d: "Венгерское правительство официально отстранило от должности нескольких неэффективных Алиспанов и согласилось провести правительственные реформы, чтобы сделать своё правительство более эффективным. Хотя это и не революция, мы можем ожидать, что эти действия помогут улучшить эффективность нашего имперского правительства."
 ww1_austriahungary.10.a: "Отлично!"
 ww1_austriahungary.9.t: "[AUS.GetLeader] соглашается оставить ситуацию нам"
 ww1_austriahungary.9.d: "Наши возражения [AUS.GetLeader] по поводу шага Австрии по увольнению нескольких Алиспанов привели к тому, что он согласился позволить нам решать ситуацию самостоятельно, то есть он ожидает, что мы сами проведём расследования для повышения эффективности нашего правительства, но не будет навязывать это нам."
 ww1_austriahungary.9.a: "Рад, что мы это уладили"
 ww1_austriahungary.8.t: "[AUS.GetLeader] игнорирует наши опасения"
 ww1_austriahungary.8.d: "Несмотря на наши попытки остановить это, несколько венгерских Алиспанов были уволены в попытке сделать правительства нашей империи более эффективными. Как бы эффективно это ни было, явно было неправильно с их стороны делать это без нашего разрешения. Тем не менее, что сделано, то сделано, и мы должны двигаться дальше."
 ww1_austriahungary.8.a: "Они нас вообще уважают?"
 ww1_austriahungary.6.t: "[AUS.GetLeader] намерен уволить нескольких Алиспанов"
 ww1_austriahungary.6.d: "Парламент австрийской половины империи утвердил предложение с одобрения [AUS.GetLeader] об увольнении нескольких неэффективных местных лидеров и проведении реформ местного самоуправления на уровне вармедье. Хотя у нас нет юридических полномочий отменять решение короля, мы могли бы подать протест, чтобы попытаться убедить [AUS.GetLeader] пересмотреть этот шаг, который вызвал гнев венгерских националистов, видящих в нём австрийское превышение полномочий. Мы могли бы также просто сидеть сложа руки и ничего не делать."
 ww1_austriahungary.6.a: "Здесь нет никакой проблемы"
 ww1_austriahungary.6.b: "Это явное превышение полномочий!"
 ww1_austriahungary.7.t: "[HUN.GetLeader] возражает против нашей попытки уволить нескольких Алиспанов"
 ww1_austriahungary.7.d: "Наши попытки реорганизовать несколько местных венгерских правительств встретили возражения со стороны [HUN.GetLeader], который заявил, что этот шаг был бы превышением полномочий, несмотря на то, что он бесспорно законен. Тем не менее, продолжение этого шага может усилить поддержку венгерских националистов, которые могли бы использовать этот инцидент, чтобы заявить, что мы не уважаем права Венгрии на независимое управление. Что нам делать?"
 ww1_austriahungary.7.a: "Это был полностью законный шаг, дайте добро"
 ww1_austriahungary.7.b: "Что ж, полагаем, это можно отложить..."
 ww1_austriahungary.1.t: "Министр финансов уходит в отставку"
 ww1_austriahungary.1.d: "Стефан Буриан фон Райеч решил уйти с поста Reichsfinanzminister, поскольку ему становилось всё труднее примирять различные этнические фракции."
 ww1_austriahungary.1.a: "Печально"
 ww1_austriahungary.2.t: "Назначен новый министр иностранных дел"
 ww1_austriahungary.2.d: "Кайзер [AUS.GetLeader] назначил Стефана Буриана фон Райеча министром при короле, или 'a király személye körüli miniszter', но не без трудностей. Многие описывали Стефана как внушающего страх и описывали его как 'тип человека, который слушал неподвижно, почти остекленевшими глазами, не выдавая ни малейшего выражения, отвечая машинно-сухим способом, школьная лекция без перевода дыхания'. Кайзеру пришлось долго думать, прежде чем дать добро на его назначение."
 ww1_austriahungary.2.a: "Страшно"
 AUS_stabilization_effort_in_bosnia: "Усилия по стабилизации в славянских территориях"
 AUS_double_stab_effort: "Стоимость решения £decision_icon_small §YУсилия по стабилизации в славянских территориях§! будет §Rудвоена§!"
 AUS_minus_10_stab_effort: "Стоимость решения £decision_icon_small §YУсилия по стабилизации в славянских территориях§! будет уменьшена на £pol_power §Y10 политической власти§! "
 ww1_austriahungary.59.t: "Австрия стремится укрепить нашу военную мощь"
 ww1_austriahungary.59.d: "Мы получили чрезвычайно хорошие новости из Вены: они намерены значительно расширить военное сотрудничество с нами и инвестировать в нашу страну для укрепления нашей военной промышленности. Они предоставляют нам значительный капитал, часть своих военных исследований и выгодные оружейные сделки. Ожидается, что всё это значительно укрепит нас."
 ww1_austriahungary.59.a: "Вау! Как щедро с их стороны!"
 ww1_austriahungary.90.t: "[FROM.GetName] запрашивает инвестиции"
 ww1_austriahungary.90.d: "[FROM.GetName] связался с нами, чтобы достичь соглашения, в рамках которого мы инвестировали бы в строительство гражданской фабрики на их землях."
 ww1_austriahungary.90.a: "Конечно"
 ww1_austriahungary.90.b: "У них уже достаточно"
 ww1_austriahungary.91.t: "[FROM.GetName] соглашается на инвестиции"
 ww1_austriahungary.91.d: "[From.GetName] согласился на инвестиции в гражданскую фабрику."
 ww1_austriahungary.91.a: "Отлично"
 ww1_austriahungary.92.t: "[FROM.GetName] отказывается помогать"
 ww1_austriahungary.92.d: "[FROM.GetAdjectiveCap] отказались инвестировать в наши земли."
 ww1_austriahungary.92.a: "Досадно"
 ww1_austriahungary.93.t: "Галицийский нефтяной кризис заканчивается"
 ww1_austriahungary.93.d: "Благодаря тарифам из Вены, галицийская нефть захватила австрийский рынок, получая бешеную прибыль и расширяя рыночную активность."
 ww1_austriahungary.93.a: "Тарифы: моё новое любимое слово!"
 ww1_austriahungary.3.t: "[FROM.GetName] предлагает договор о торговле и культурном обмене"
 ww1_austriahungary.3.d: "Австрийцы обратились к нашему правительству, явно видя, как мы отдалились от Франции в последние годы, и стремясь вернуть нас в лоно. Они предлагают нам новые торговые договоры, а также соглашение о культурном обмене. Стоит ли принимать?"
 ww1_austriahungary.3.a: "Звучит справедливо"
 ww1_austriahungary.3.b: "Нет, пока они оккупируют Буковину!"
 ww1_austriahungary.4.t: "[FROM.GetName] принимает торговое соглашение"
 ww1_austriahungary.4.d: "После приглашения в Вену румынские делегаты и наши представители согласовали взаимовыгодное торговое соглашение, которое укрепит наши отношения в будущем. Кроме того, они приняли наш договор о культурном обмене, что, надеюсь, должно увеличить наше влияние на их страну."
 ww1_austriahungary.4.a: "Тост за наших друзей!"
 ww1_austriahungary.5.t: "Румыния отклоняет договор"
 ww1_austriahungary.5.d: "Румынские делегаты отклонили наше предложение о договоре, заявив, что он не будет для них справедливым. Хотя Румыния должна быть нашим другом, это ясно показывает недовольство румынами нами."
 AUS_offensive_against_the_liberals: "Перейти в наступление против либералов"
 ww1_austriahungary.5.a: "Потеря для них"
 ww1_austriahungary.61.t: "Формирование 'Чёрной руки'"
 ww1_austriahungary.61.d: "'Чёрная рука', ультранационалистическая югославистская группа, была сформирована в Сербии. Их явные цели — уничтожение Австро-Венгерской империи и объединение Сербии с нашими южными территориями. Без сомнения, они уже предпринимают попытки саботажа против нас в Боснии, поэтому мы должны спать с открытыми глазами. Хотя их влияние сейчас довольно низко, со временем они могут усилиться."
 ww1_austriahungary.61.a: "Стая диких зверей!"
 ww1_austriahungary.66.t: "Ратификация нового военного бюджета"
 ww1_austriahungary.66.d: "Венгерский парламент уже некоторое время отказывается ратифицировать более высокий военный бюджет, всё ещё добиваясь ключевых уступок от Австрии. Теперь, когда Венгрия удовлетворена, а также благодаря некоторым умным политическим манёврам промилитаристских политиков с обеих сторон империи, этот бюджет наконец принят и ратифицирован. Таким образом, вознаграждение от него теперь можно получить."
 ww1_austriahungary.66.a: "Отлично!"
 ww1_austriahungary.68.t: "Смерть Алоиза Лексы фон Эренталя"
 ww1_austriahungary.68.d: "Наш нынешний министр иностранных дел, будучи довольно пожилым, к сожалению, скончался вчера. Наследие Эренталя, его осторожной дипломатии и наведения мостов, будет помниться австрийцами вечно, его служба, несомненно, сделала страну сильнее и лучше. Теперь возникает циничный, но необходимый вопрос о том, кем его заменить. Кто-то вроде графа Фердинанда фон Трауттмансдорфа может помочь продолжить наследие Эренталя, в то время как кто-то вроде графа Берхтольда может применить более напористый и силовой подход к внешней политике."
 ww1_austriahungary.168.t: "[FROM.GetName] разрывает Брюссельское торговое соглашение 1903 года"
 ww1_austriahungary.168.d: "В 1902 году крупные европейские державы встретились в Брюсселе и согласились ограничить экспорт для защиты экономики друг друга. Для Австрии они согласились ограничить экспорт сахара до 5,7 кроны за 100 килограммов, но сегодня они объявили о выходе из этого договора, чтобы следовать своему либерально-экономическому подходу."
 ww1_austriahungary.168.a: "Это нехорошо"
 ww1_austriahungary.140.t: "Антидемократическая повестка"
 ww1_austriahungary.140.d: "Имперский совет поглупел, полный реформистов, более заинтересованных в ослаблении гегемонии империи и передаче всей власти разбойничьим обструкционистским группам меньшинств, вместо того чтобы проводить политику укрепления стабильности империи и ремилитаризации Австрии, чтобы подготовить её к неизбежной будущей войне. Вместо того чтобы работать с Имперским советом, мы будем стремиться уничтожить их влияние. Благословение императора, которое позволит нам обойти многие функции Имперского совета, должно позволить нам проводить нашу повестку дня с той быстрой скоростью, которая необходима для обеспечения будущего Австрии."
 ww1_austriahungary.140.a: "Демократия всегда была дурацкой затеей в любом случае"
 ww1_austriahungary.145.t: "Лидер оппозиции произносит гневную речь против автократии"
 ww1_austriahungary.145.d: "Лидеры оппозиции в Имперском совете произнесли длинную речь, атакуя нынешнего министра-президента за его антидемократическую повестку, требуя, чтобы мы соблюдали верховенство закона, уважали свободу слова и все демократические институты. Они привлекают поддержку в Имперском совете, а также от людей на улицах, которые начали свои собственные, хотя и довольно маленькие, раздражающие протесты, которые не улучшают наш имидж среди широкой общественности."
 ww1_austriahungary.145.a: "Вышвырнуть его кто-нибудь!"
 ww1_austriahungary.151.t: "Делает ли Имперский совет Австрию небезопасной?"
 ww1_austriahungary.152.t: "Украинские обструкционисты вышвырнуты из Имперского совета"
 ww1_austriahungary.152.d: "Украинские группы, пытавшиеся создать обструкцию на последней сессии Имперского совета, провалили свою попытку: министр-президент приказал полиции вышвырнуть буйных украинцев, что технически является нарушением закона и, безусловно, нарушением демократических норм. Украинцы пытались заблокировать серию законов об инвестициях в Польшу, разгневанные отсутствием инвестиций в свой собственный регион. Этот решительный шаг министра-президента позволил Имперскому совету завершить свою сессию и может быть повторён в будущем."
 ww1_austriahungary.152.a: "Надоедливые выскочки!"
 ww1_austriahungary.153.t: "Министр-президент начинает пропускать заседания Имперского совета"
 ww1_austriahungary.153.d: "Министр-президент, обычно посещающий большинство заседаний Имперского совета, начал пропускать их, предпочитая встречаться с императором и его ближайшим окружением вместо того, чтобы тратить время на обструкционистский и сломленный Имперский совет. Отсутствие визитов министра-президента наносит ущерб авторитету и общественной легитимности Имперского совета."
 ww1_austriahungary.153.a: "Зачем нам скучать с этими неудачниками"
 ww1_austriahungary.151.d: "Споры между Германией и Тройственной Антантой, нестабильная ситуация к югу от нас и быстрый рост российской экономики указывают на одно: Австрия должна укрепить свою мощь. Министр-президент произносит длинные речи перед министрами правительства и самим императором, оправдывая необходимость быстрых и решительных действий для укрепления военной мощи Австрии. Тем не менее, чешские и либеральные обструкционисты в Имперском совете ставят нацию под угрозу, отказываясь принимать необходимое законодательство для защиты империи. Таким образом, естественно, Имперский совет становится угрозой для самой нации, и могут потребоваться действия против него."
 ww1_austriahungary.151.a: "Довольно убедительный аргумент"
 ww1_austriahungary.161.t: "Укрепление среднего класса"
 ww1_austriahungary.161.d: "Поскольку наша политика одновременно регулирует монополии и расширяет возможности класса среднего класса, ранее упадочный класс ремесленников, квалифицированных мастеров и владельцев мелких магазинов получает новый шанс процветать, поскольку экономическая ситуация начинает склоняться в их пользу."
 ww1_austriahungary.161.a: "Это настоящие немецкие рабочие!"
 ww1_austriahungary.160.t: "Первая серия картельных норм"
 ww1_austriahungary.160.d: "Со времён экономического кризиса 1880-х годов правительство Австрии начало поддерживать крупные картели и крупный бизнес, пытаясь стабилизировать экономику и предотвратить волатильные события. Однако с новым министром-президентом и Имперским советом ситуация начинает меняться. Имперский совет только что принял серию норм, регулирующих монополистическую деловую практику, явно нацеленных на деловые картели, которые начали доминировать в экономике за последние 20 лет. Хотя ожидается, что в краткосрочной перспективе это нанесёт ущерб экономике, в долгосрочной перспективе это, надеюсь, гарантирует, что экономика не будет доминироваться застойными монополиями и останется конкурентоспособной."
 ww1_austriahungary.160.a: "Смелая смена курса"
 ww1_austriahungary.68.a: "Граф Берхтольд, ваш выход!"
 ww1_austriahungary.68.b: "Граф Фердинанд фон Трауттмансдорф, кажется, подходящий человек для этой работы"
 ww1_austriahungary.125.t: "Революция в Венгрии"
 ww1_austriahungary.125.d: "В ответ на введение Францем Фердинандом всеобщего избирательного права в Венгрии венгерские революционеры как на улице, так и в высшей политике совершили переворот, объявив конституционный кризис в империи и предприняв попытку провозгласить независимость Венгрии. Хотя большая часть армии остаётся верна Фердинанду, достаточно много перешли на сторону мятежников, так что ожидается реальное восстание."
 ww1_austriahungary.125.a: "Независимо от исхода, империя уже никогда не будет прежней"
 ww1_austriahungary.67.t: "Австро-Венгрия осуждает наше обращение с христианами"
 ww1_austriahungary.67.d: "Наше правительство совершенно правильно обращалось с предателями на Балканах довольно жёстко, и всё же кажется, что Австро-Венгрия считает это своим делом. Министр иностранных дел Австрии выступил с решительным осуждением нашего обращения с христианами на Балканах, даже пригрозив вмешательством, если ничего не изменится. Мы пришли к выводу, что фактическое вмешательство маловероятно, и эта поза, скорее всего, направлена лишь на создание доброй воли среди сепаратистских групп в Османской империи."
 ww1_austriahungary.81.t: "Наш ответ на Балканские войны"
 ww1_austriahungary.86.t: "Реагирование на австрийскую агрессию"
 ww1_austriahungary.86.d: "Похоже, Австрия может готовиться к вторжению в Сербию, что было бы неприемлемо для нас. Чтобы попытаться охладить пыл Австрии, мы должны напомнить им о возможных последствиях таких действий. Возможно, решительное письмо может этого добиться."
 ww1_austriahungary.86.a: "Нам нужно доказать здесь свою точку зрения!"
 ww1_austriahungary.87.t: "Российское предупреждение"
 AUS_expand_the_badeni_decrees: "Расширить Бадени указы"
 AUS_expand_the_badeni_decreees_desc: "В рамках наших новых демократических реформ мы расширим законы Бадени, включив в них больше избирательных законов, а также продолжим избирательную реформу, ещё больше обогащая нас демократией."
 ww1_austriahungary.87.d: "Наше передвижение войск в Боснию и к сербской границе привело к тому, что Россия направила дипломатический протест нашему правительству. Они в неопределённых выражениях заявили, что ненужная агрессия со стороны Австро-Венгерской империи по отношению к Сербии не будет принята Россией. На практическом языке они говорят нам, что если мы ударим по Сербии, Россия будет военной защищать Сербию. Мы не можем знать, блефуют ли они или нет, но мы должны серьёзно отнестись к их предупреждению."
 ww1_austriahungary.87.a: "Ожидаемая от них нота"
 ww1_austriahungary.85.t: "Австро-венгерские передвижения войск на Балканах"
 ww1_austriahungary.85.d: "Начало войны между Балканской лигой и Османской империей привело к серии поспешных переговоров между крупными европейскими державами, отчаянно пытающимися предотвратить эскалацию войны. Обнаруженное массовое передвижение австро-венгерских войск к сербской границе, безусловно, не успокоило страхи этих великих держав, поскольку напряжённость между Австро-Венгрией и Сербией продолжает расти. Ни для кого не секрет, что многие в Австро-Венгерской империи добивались превентивного удара по Сербии, и многие опасаются, что Австрия идёт по этому пути."
 ww1_austriahungary.85.a: "Мы просто готовимся к любому развитию событий!"
 ww1_austriahungary.85.b: "Боже, неужели они втянут нас в мировую войну?"
 ww1_austriahungary.85.c: "Они бы не посмели!"
 ww1_austriahungary.81.d: "Взрыв большой войны прямо к югу от нас требует от нас решительного ответа. Ястребы в правительстве открыто призывают к удару по Сербии, утверждая, что война с Сербией явно неизбежна, и мы должны начать её на наших условиях, пока они ещё слабы и отвлечены войной против Османской империи. Это, безусловно, была бы лёгкая победа в теории, но на практике это рисковало бы вмешательством России, что привело бы к войне между Антантой и Тройственным союзом. Более пацифистски настроенные члены правительства считают, что мы должны занять более хладнокровную позицию. Признавая хаос на южной границе, они считают, что мы должны потребовать, чтобы Сербия подписала с нами договор, помогающий обеспечить безопасность границ и сгладить контрабандные операции."
 ww1_austriahungary.81.a: "Действия Сербии разрушают мир на Балканах. Мы должны решительно осудить их!"
 ww1_austriahungary.81.b: "Действия Сербии ставят под угрозу стабильность на Балканах. Они должны это исправить!"
 ww1_austriahungary.67.a: "Это письмо отправится в мусорную корзину!"
 tenacious_negotiator_3: "Дипломатический архитектор"
 ww1_austriahungary.84.t: "Массовое передвижение войск в Боснию"
 ww1_austriahungary.84.d: "Начало войны на Балканах между Балканской лигой и Османской империей может легко распространиться и на нас, если мы не будем осторожны. Поскольку сербские агенты в Боснии пытаются устроить революцию, мы должны быть готовы к возможной войне. Развернув крупные силы в Боснии, мы можем быть готовы ко всему и послать чёткий сигнал Сербии."
 ww1_austriahungary.84.a: "Начать развёртывание!"
 ww1_austriahungary.82.t: "Австрия требует договор о пограничной безопасности"
 ww1_austriahungary.82.d: "Начало войны на Балканах привело к всплеску активности 'Младой Босны' и 'Чёрной руки', которые были подстёгнуты нашей освободительной войной на Балканах, а также имеют преимущество менее охраняемой австрийской границы, поскольку наши силы сосредоточены на войне с Османской империей. Похоже, эти группы создают проблемы для Австрии, которая обратилась к нашему правительству с требованием. Они требуют, чтобы мы усилили безопасность на границе, чтобы попытаться ослабить эти группы."
 ww1_austriahungary.82.a: "Мы согласимся, чтобы избежать их гнева."
 ww1_austriahungary.83.t: "Сербия соглашается усилить пограничную безопасность"
 ww1_austriahungary.83.d: "Сербия согласилась активизировать аресты контрабандистов на своей стороне австро-сербской границы, что должно помочь нам решить проблему. Хотя Сербия по-прежнему явно является вражеской страной из-за своих действий на Балканах, эта сделка открывает возможность для будущего мирного сосуществования наших двух стран."
 ww1_austriahungary.83.a: "Хорошо"
 ww1_austriahungary.112.t: "Хрупкая экономика"
 ww1_austriahungary.112.d: "Экономика Австрии не совсем готова к войне на истощение такого масштаба. Хотя эта война, вероятно, скоро закончится, если бы она длилась годами, мы, несомненно, сильно пострадали бы. Мы должны обеспечить, чтобы наша экономика могла оставаться на плаву до тех пор."
 ww1_austriahungary.112.a: "Кто знал, что война с половиной мира не полезна для бизнеса?"
 ww1_austriahungary.138.t: "Расследование подозрительной почты"
 ww1_austriahungary.138.d: "Расследование подозрительной почты привело к интересному открытию. Было обнаружено письмо, содержащее значительную сумму денег и несколько адресов, используемых для шпионской деятельности. Позже было отправлено письмо-дубликат с тем же именем, Никон Низетас. Детективы были выставлены на почтамте, чтобы проследить за тем, кто его заберёт, и когда письмо было получено через несколько недель, полиция преследовала, но человек, забравший письмо, уехал на такси. Детективы взяли то же такси и попросили отвезти их туда, куда был доставлен предыдущий пассажир, и прибыли в отель Klomser. Они нашли ножны для перочинного ножа в такси, о чём попросили администрацию отеля спросить гостей, не потерял ли кто их, и когда гость пришёл за ними, оказалось, что это Альфред Редль, бывший глава Эвиденцбюро."
 ww1_austriahungary.138.a: "Допросить его!"
 ww1_austriahungary.139.t: "Допрос Альфреда Редля"
 ww1_austriahungary.139.d: "Поскольку Альфред Редль был пойман с поличным при получении подозрительных конвертов не на своё имя, его допросили в его гостиничном номере несколько военных офицеров. Во время допроса он признался в продаже военной разведки иностранной державе, России, и в крупномасштабной работе на иностранные государства в 1910 и 1911 годах. Начальник армейского штаба Конрад фон Хётцендорф приказал оставить его одного с заряженным револьвером, и в утренние часы он был найден мёртвым, застрелившись."
 ww1_austriahungary.139.a: "Как много знают русские?"
 ww1_austriahungary.123.t: "Австрия навязывает нам всеобщее избирательное право!"
 ww1_austriahungary.123.d: "Франц Фердинанд сегодня подписал указ о введении всеобщего избирательного права для нас, что явно нарушает наше право на суверенитет! Этот шаг призван ослабить власть венгров в венгерском правительстве, вместо этого наполнив его немальярскими группами меньшинств, которые теперь могут голосовать на венгерских выборах. Это неприемлемо и может стать точкой разрыва для многих."
 ww1_austriahungary.123.a: "Мы должны пересмотреть наш статус в двойной монархии!"
 ww1_austriahungary.121.t: "Беспорядки в Будапеште"
 ww1_austriahungary.172.t: "Финансовый шок из-за Балканской войны"
 ww1_austriahungary.172.d: "Начало войны между Балканской лигой и Османской империей привело к падению австрийской фондовой биржи, поскольку инвесторы опасаются, что война может дестабилизировать южные регионы Австрии и что война может даже распространиться на саму Австрию. Падение фондового рынка привело к тому, что многие кредиторы стали осторожно относиться к выдаче кредитов австрийским предприятиям и банкам, что привело к резкому экономическому спаду. Хотя ситуация, вероятно, довольно быстро восстановится по мере стабилизации ситуации на Балканах, это, вероятно, на некоторое время оставит чёрную метку на нашей экономике."
 ww1_austriahungary.172.a: "Это чисто панические продажи!"
 ww1_austriahungary.121.d: "Поскольку Фердинанд назначает лоялиста главой правительства Венгрии, органическое сопротивление назревает среди гражданских лиц. В Будапеште венгры бунтуют против нового руководства, призывая к смещению Августа и к тому, чтобы Венгрия имела народный суверенитет над своим руководством."
 ww1_austriahungary.121.a: "Мы будем внимательно следить за ситуацией"
 AUS_mandate_for_leadership: "Мандат на лидерство"
 ww1_austriahungary.124.t: "Несколько политиков объявляют конституционный кризис"
 ww1_austriahungary.124.d: "В ответ на объявление Францем Фердинандом всеобщего избирательного права законом в Венгрии многие венгерские политики рассматривают этот вопрос как точку разрыва. Австрия, напрямую навязывающая свою волю Венгрии, явно незаконна и неприемлема, и позволить этому пройти фактически означало бы положить конец независимости Венгрии."
 ww1_austriahungary.124.a: "Они правы!"
 ww1_austriahungary.122.t: "Всеобщее избирательное право в Венгрии"
 ww1_austriahungary.122.d: "Следующим шагом по уничтожению венгерской элиты является введение всеобщего избирательного права в Венгрии. Этот шаг значительно расширит права румын, словаков и славян в Венгрии, таким образом уменьшив власть венгров. Сделав это, мы можем гарантировать, что у Венгрии не будет сильной основной оппозиции против нас."
 ww1_austriahungary.122.a: "Давайте подпишем это как закон!"
 AUS_aggressive_war_plan_conrad: "Развязать агрессивное наступление"
 AUS_unlock_in_the_gw.tt: "Это решение будет доступно в §YВеликую войну§!"
 AUS_conrad_war_dec.tt: "§YВ течение 90 дней:§!\n(§YЛюбая соседняя страна, воюющая с нами§!)\n$MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+20.0%§!\n$MODIFIER_DEFENSE_BONUS_AGAINST_A_COUNTRY$: §R-20.0%§!"
 ww1_austriahungary.117.t: "Увольнение венгерского правительства"
 ww1_austriahungary.117.d: "Венгерское правительство полно чиновников, которые антагонизируют Фердинанда, стремясь к большей автономии от Австрии, и их необходимо ограничить. Благодаря полномочиям, предоставленным императору, Фердинанд может начать чистку венгерского правительства. Самые вопиющие деятели должны быть удалены, а лояльный глава государства назначен для поддержки нашей повестки дня."
 ww1_austriahungary.117.a: "И они будут удалены!"
 ww1_austriahungary.119.t: "Фердинанд назначает нового венгерского главу государства"
 ww1_austriahungary.119.d: "Фердинанд назначил старого союзника Австрии, Иосифа Августа, главой Венгрии. Август придерживается повестки Фердинанда и, как ожидается, поддержит его в его кампании по уничтожению Венгрии. Надеюсь, на улицах возрастёт органическое сопротивление его повестке..."
 ww1_austriahungary.119.a: "Какого чёрта?"
 ww1_austriahungary.120.t: "Программа Престолонаследия"
 ww1_austriahungary.120.d: "Группа ключевых советников Франца Фердинанда начала готовиться к eventual коронации эрцгерцога, считая время своего отца на исходе. В написанном тексте излагаются приготовления к тому, чтобы Фердинанд немедленно как можно эффективнее выполнил свою повестку дня. Этот текст, как ожидается, поможет ему подготовиться к разгрому Венгрии, усилению централизации империи и разрушению того, что осталось от демократии в Австрии."
 AUS_expand_army_reserve: "Цель Конрада: Расширение армейских резервов"
 AUS_stack_the_military_bureaucracy: "Расширить военные склады снабжения"
 ww1_austriahungary.120.a: "Интересно..."
 ww1_austriahungary.118.t: "Франц Фердинанд откладывает коронацию?"
 ww1_austriahungary.118.d: "Несмотря на то, что Фердинанд уже несколько дней является королём Австрии, он, кажется, игнорирует призывы принять коронацию как король Венгрии. Это вызывает вопросы у политического истеблишмента, подозревающего скрытые мотивы Фердинанда, известного противника венгерских интересов."
 ww1_austriahungary.118.a: "В чём его игра?"
 ww1_austriahungary.116.t: "Откладывание нашей коронации как короля Венгрии"
 ww1_austriahungary.116.d: "Хотя Фердинанд был коронован как король Австрии, он технически ещё не был коронован как король Венгрии, что означает, что он также не приносил присягу на верность венгерской конституции и правовой системе. Тем не менее, как император Австрии, мы сохраняем де-юре право вносить изменения в венгерскую коронную землю королевским указом. Не имея обязательств перед венгерской конституцией, технически мы имеем неограниченный мандат на перестройку политического состояния Венгрии по нашему желанию. Откладывая нашу коронацию в Венгрии, мы можем сохранить эту власть достаточно долго, чтобы полностью раздавить венгерских выскочек."
 ww1_austriahungary.116.a: "Приступим к работе..."
 ww1_austriahungary.111.t: "Новый человек в городе"
 ww1_austriahungary.111.d: "Приход Франца Конрада фон Хётцендорфа к власти в Австрии привёл к немедленным изменениям в её правительстве. Местные губернаторы по всей Австрии были уволены и заменены националистами, лояльными ему. Была принята серия чрезвычайных указов, резко сокращающих гражданские свободы по всей стране. Хотя парламент ещё не распущен, его конец считается вероятным в ближайшее время."
 ww1_austriahungary.111.a: "Необходимы смелые перемены!"
 ww1_austriahungary.136.t: "Австрия форсирует вопрос об армейском законопроекте"
 ww1_austriahungary.136.d: "Австрия навязала нам вопрос об армейском законопроекте и требует, чтобы мы наконец положили конец армейскому кризису."
 ww1_austriahungary.136.a: "Мы стараемся"
 ww1_austriahungary.115.t: "Беспартийный министр-президент"
 ww1_austriahungary.115.d: "Министры-президенты Цислейтании при императоре Иосифе часто преследовали свои собственные амбициозные, независимые повестки дня. Франц Фердинанд намерен быть более вовлечённым в политическое состояние империи, и поэтому ожидается, что роль министра-президента станет в основном церемониальной, с назначением марионетки, которая будет штамповать повестку Фердинанда."
 ww1_austriahungary.115.a: "Давно назревшее улучшение"
 ww1_austriahungary.137.t: "Выбор идеального кандидата"
 ww1_austriahungary.137.d: "Хотя мы решили назначить реформиста министром-президентом Австрии, теперь мы должны определиться с личностью. Советники [AUS.GetLeader] принесли список политиков, которые соответствуют целям повестки [AUS.GetLeader]. Кого следует назначить?"
 ww1_austriahungary.137.a: "Макс Владимир фон Бек был бы идеален"
 ww1_austriahungary.137.b: "Генрих Ламмаш был бы хорош"
 ww1_austriahungary.137.c: "Эрнест фон Кёрбер — лучший выбор"
 ww1_austriahungary.128.t: "Меньшинства хотят выйти"
 ww1_austriahungary.128.d: "Видя надпись на стене, многие группы меньшинств в империи ищут выход после захвата правительства военными во главе с Хётцендорфом. Поскольку Хётцендорф является закоренелым германофилом, они понимают, что режим под его началом приведёт к их угнетению. Таким образом, группы меньшинств по всей империи организовались и присоединились к Венгрии в её восстании."
 ww1_austriahungary.128.a: "Все предатели встретят быстрый конец!"
 ww1_austriahungary.127.t: "Заговор в армии"
 ww1_austriahungary.127.d: "По мере того как революция в Венгрии бушует, многие в армии считают Фердинанда плохим лидером. Если Фердинанд уже может вызвать гражданскую войну в империи в течение первых нескольких недель своего правления, кто знает, выживет ли империя под ним к следующему году. Германия, разгневанная более пророссийским взглядом Фердинанда, похоже, поддерживает какой-то военный заговор против Фердинанда. Пришло время армии восстановить порядок в империи?"
 ww1_austriahungary.127.a: "Мы должны быстро окружить Вену"
 ww1_austriahungary.127.b: "Фердинанд должен быстро очистить армию!"
 ww1_austriahungary.126.t: "Самый одинокий человек в Вене"
 ww1_austriahungary.126.d: "Франц Фердинанд, будучи авторитарным человеком с резким характером, завёл мало друзей среди политической элиты, доминирующей в австрийской политике. Хотя у него есть небольшой круг лояльных советников, большинство австрийских политиков видят в Фердинанде автократа, который хочет отнять у них власть. Таким образом, Франц Фердинанд входит в правительство с небольшим количеством сторонников."
 ww1_austriahungary.114.t: "Редль предоставляет австрийские военные планы"
 ww1_austriahungary.114.d: "Редль, наш шпион в Австрии, доставил нам копию австрийских военных планов против нас. Теперь мы можем использовать их, чтобы разгромить Австрию на поле боя, по крайней мере, пока они не спохватятся и не перерисуют их"
 ww1_austriahungary.114.a: "Вау! Они в пролёте!"
 ww1_austriahungary.135.t: "Wehrmann"
 ww1_austriahungary.135.d: "По мере продолжения Великой войны жители Вены начали участвовать в уникальном сборе средств для поддержки войны и демонстрации солидарности с австрийским военным духом. Сотни тысяч венцев вбивают железные гвозди в деревянную статую солдата в Вене, пытаясь превратить статую в чистое железо. Они получают железные гвозди через государственные магазины, которые позволяют гражданским покупать железные гвозди, чтобы вбить их в большую статую в обмен на деньги, которые используются для выплат программ для вдов павших солдат на фронте."
 ww1_austriahungary.135.a: "Очень классная программа!"
 ww1_austriahungary.107.t: "Превентивный удар по Сербии?"
 ww1_austriahungary.107.d: "Поскольку мы одержали верх над Сербией в кризисе с Таслицей, многие в армии хотят, чтобы мы пошли дальше. Влиятельные фигуры, такие как Конрад, уже много лет выступают за превентивный удар по Сербии, и какое лучшее время, чем когда Сербия отвлечена войной с Османской империей? Несомненно, атака вызовет международный кризис. Однако война с Антантой может быть неизбежна, и если мы атакуем сейчас, она может начаться на наших условиях."
 ww1_austriahungary.107.a: "Глупости. Мы не будем этого делать"
 ww1_austriahungary.107.b: "Некогда сомневаться, мы должны это сделать"
 ww1_austriahungary.154.t: "Бюджетные запросы Конрада отклонены"
 ww1_austriahungary.154.d: "Недавно в попытке увеличить армейский бюджет Конрад фон Хётцендорф подал заявки на армейский бюджет рейхскригсминистру Францу Шёнайху на общую сумму 1000 миллионов крон, однако министр скептически отнёсся к тому, сможет ли он его одобрить, поэтому он сократил запрос более чем на треть от предложения Конрада. Конрад не был проинформирован об изменении, и позже он сердито узнал об этом и повторил свои требования полной суммы, пригрозив императору своей отставкой. Франц Иосиф сказал ему быть реалистом, однако при вмешательстве Франца Фердинанда Конраду было разрешено изложить свою позицию на специальной министерской конференции в Будапеште, но ему не удалось убедить министров. Франц Фердинанд назвал Шёнайха врагом династии и отправил ему письмо с требованием отставки, но Шёнайх просто проигнорировал его."
 ww1_austriahungary.154.a: "Это нехорошо"
 ww1_austriahungary.155.t: "Ауффенберг заказывает 12 осадных артиллерийских орудий"
 ww1_austriahungary.155.d: "Из-за отсутствия действий по модернизации устаревших осадных артиллерийских орудий, k.u.k. Kriegsminister Мориц Ауффенберг по собственной инициативе заказал 12 современных артиллерийских орудий на заводах Škoda. Парламенты, конечно, были недовольны решением Ауффенберга и были в смятении, особенно в Будапеште, но, по крайней мере, была предпринята попытка модернизировать артиллерию армии."
 ww1_austriahungary.155.a: "Парламент должен финансировать армию!"
 ww1_austriahungary.170.t: "Конрад готовится запросить расширение бюджета"
 ww1_austriahungary.170.d: "Поскольку Конрад готовится расширить армию и модернизировать её оборудование, смехотворно малый военный бюджет, который ему в настоящее время выделен, необходимо увеличить. Очевидно любому, кто смотрит, напряжённость растёт, и потребность в сильной армии выше, чем когда-либо. При нынешней ситуации, надеюсь, императору удастся получить для него запрошенный бюджет."
 ww1_austriahungary.170.a: "Мы, несомненно, пострадаем, если не получим!"
 ww1_austriahungary.171.t: "Потребители скупают продукты питания"
 ww1_austriahungary.171.d: ""
 ww1_austriahungary.171.a: "Этому безумию нужно положить конец"
 AUS_working_with_skoda: "Работа с Škoda"
 AUS_extraordinary_army_expenditure: "Чрезвычайные военные расходы"
 AUH_stitching_the_quilt: "Сшивая лоскутное одеяло"
 AUH_stitching_the_quilt_desc: "Цислейтанская половина империи полна итальянцев, румын, богемцев, поляков и украинцев, у всех свои интересы и важные для них проблемы. Империя также очень неравна: части страны находятся в крайней нищете, а части — очень процветающие. Мы должны работать над компромиссом с группами интересов меньшинств и решением экономического неравенства в империи, чтобы обеспечить стабильное будущее."
