 AUH_relations_crown_more_1: "Отношения между правительствами §Y[AUS.GetNameWithFlag]§! и §Y[HUN.GetNameWithFlag]§! выше §Y1§!"
 AUH_cost_2_relations: "Этот фокус будет §Rстоить§! §Y2§! очка отношений между правительствами §Y[AUS.GetNameWithFlag]§! и §Y[HUN.GetNameWithFlag]§!"
 AUS_minorities_mechanic: "Der Ausgleich"
 AUS_minorities_mechanic_tt_desc: "Der Ausgleich, или 'компромисс', был компромиссом 1867 года, который установил нынешнюю двойную монархию Австро-Венгрии и восстановил частичный суверенитет, предыдущую конституцию и территории Венгерского королевства. Но даже с этим компромиссом наша империя представляет собой лоскутное одеяло из многих разнообразных этнических групп. К сожалению для нас, мы должны угождать людям, живущим там, чтобы сохранить твёрдый контроль над землями и ресурсами."
 AUS_minorities_hun_text: "[HUN.GetFlag] §C[?global.AUS_hungarian_relations]§!"
 AUS_minorities_hun_tt: "Отношения между правительствами §Y[AUS.GetNameWithFlag]§! и §Y[HUN.GetNameWithFlag]§! составляют: §C[?global.AUS_hungarian_relations]§!"
 AUS_minorities_bos_text: "[BOS.GetFlag] [BOS_relations_color]"
 AUS_minorities_bos_tt: "Отношения между правительствами §Y[AUS.GetNameWithFlag]§! и §Y[BOS.GetNameWithFlag]§! составляют: [BOS_relations_color]/100."
 AUS_AUS_FLAG_BOS_TT: "§Y[AUS.GetNameWithFlag]§!"
 AUS_AUS_FLAG_BOS_TT_DELAY: "С 1878 года Австрия де-факто руководит управлением §Y[BOS.GetNameWithFlag]§!, а с 1908 года §Y[BOS.GetNameWithFlag]§! юридически и официально является частью Австрийской империи."
 AUS_BOS_FLAG_TT: "§Y[BOS.GetNameWithFlag]§!"
 AUS_HUN_FLAG_BOS_TT: "§Y[HUN.GetNameWithFlag]§!"
 AUS_HUN_FLAG_BOS_TT_DELAY: "§LЗемли короны Святого Стефана, или §!§Y[HUN.GetNameWithFlag]§!§L, были частью Австро-Венгерской империи со времён Австро-Венгерского компромисса, или Аусляйха, в 1867 году.§!"
 AUS_minorities_cze_text: "[CZE.GetFlag] §C[?AUS_czechoslovak_loyalty]§!"
 AUS_minorities_cze_tt: "[CZE.GetFlag] §YЧехословацкая§! лояльность к нам: [?AUS_czechoslovak_loyalty|+0]"
 AUS_minorities_czechs: "§YЧехи и словаки§!"
 AUS_minorities_czechs_delay_tt: "§L§YЧехословаки§!§L являются частью одного из многочисленных славянских элементов в Монархии. §YЧехи§! доминируют в промышленных землях Богемии и Моравии. §YСловаки§! Верхней Венгрии, напротив, остаются в основном сельскими и подвергаются политике мадьяризации со стороны Будапешта, с ограниченными культурными уступками.§!"
 AUS_minorities_pol_text: "[GAL.GetFlag] §C[?AUS_pole_loyalty]§!"
 AUS_minorities_pol_tt: "[GAL.GetFlag] §YПольская§! лояльность к нам: [?AUS_pole_loyalty|+0]"
 AUS_minorities_poles: "§YПоляки§!"
 AUS_minorities_poles_delay_tt: "§L§YПоляки§!§L находятся в австрийских руках с Первого раздела Польши в 1772 году. Несмотря на то, что они являются коронной землёй Цислейтании, в настоящее время они пользуются большим уровнем провинциальной автономии в Империи по сравнению с другими провинциями в Галиции и Лодомерии."
 AUS_minorities_south_slavs_text: "[CRO.GetFlag][SER.GetFlag] §C[?AUS_south_slav_loyalty]§!"
 AUS_minorities_south_slavs_tt: "[CRO.GetFlag] §YХорватско-словенская§! лояльность к нам: [?AUS_croat_loyalty|+0]\n[SER.GetFlag] §YСербская§! лояльность к нам: [?AUS_serb_loyalty|+0]"
 AUS_minorities_south_slavs: "§YЮжные славяне§!"
 AUS_minorities_south_slavs_delay_tt: "§L§YЮжные славяне§!§L в пределах Монархии состоят из §Yсербов§! и §Yхорватов§!, разделённых между землями Хорватии-Славонии, Далмации, Боснии и южными венгерскими частями. Хорваты обладают определённой мерой автономии через Хорватско-Славонский сабор, но остаются привязанными к Будапешту в ключевых вопросах. Сербы поддерживают сильные культурные институты. Обе группы возбуждены более широкой идеей 'освобождения', которая призывает к большему единству между их народами, вопрос, который сильно влияет на отношения с соседней и независимой Сербией и на стабильность самой Венской империи. Обе живут в Боснии и являются причиной большого этнического напряжения там и здесь.§!"
 AUS_minorities_ser_text: "[SER.GetFlag] §C[?AUS_serb_loyalty]§!"
 AUS_minorities_ser_tt: "[SER.GetFlag] §YСербская§! лояльность к нам: [?AUS_serb_loyalty|+0]"
 AUS_minorities_serbs: "§YСербы§!"
 AUS_minorities_ukr_text: "[UKR.GetFlag] §C[?AUS_ruthenian_loyalty]§!"
 AUS_minorities_ukr_tt: "[UKR.GetFlag] §YРутенская§! лояльность к нам: [?AUS_ruthenian_loyalty|+0]"
 AUS_minorities_ukrs: "§YРутены§!"
 AUS_minorities_ukrs_delay_tt: "§L§YРутены§!§L, в основном проживающие в восточной Галиции и северо-восточных графствах венгерской короны, являются славянским, в основном аграрным и грекокатолическим народом. В Галиции и Лодомерии они конкурируют политически и культурно с польской элитой, добиваясь школ и должностей на своём языке. В Венгрии их положение ещё слабее под венгерским управлением.§!"
 AUS_minorities_rom_text: "[ROM.GetFlag] §C[?AUS_romanian_loyalty]§!"
 AUS_minorities_rom_tt: "[ROM.GetFlag] §YРумынская§! лояльность к нам: [?AUS_romanian_loyalty|+0]"
 AUS_minorities_roms: "§YРумыны§!"
 AUS_minorities_roms_delay_tt: "§L§YРумыны§!§L составляют значительное население в восточных землях короны Святого Стефана, особенно в Трансильвании и Банате. Они сохраняют отчётливую культурную и церковную жизнь, поддерживаемую растущей интеллигенцией. В условиях политики мадьяризации их язык и школы сталкиваются с определённым давлением, однако национальное движение продолжает добиваться равных прав и признания в [HUN.GetName], в то время как события в соседней независимой [ROM.GetName] вызывают живой интерес.§!"
