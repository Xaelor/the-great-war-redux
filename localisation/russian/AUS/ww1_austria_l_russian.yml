 ww1_austriahungary.190.t: "Напряжённость в Галицийском сейме"
 ww1_austriahungary.190.d: "По мере завершения общенациональных выборов 1911 года, в Галиции одновременно прошли выборы в местный сейм, где поляки, несмотря на то, что составляют всего 45% населения, доминируют более чем на 80% мест в местном сейме через формирование Польского клуба. Рутенские и еврейские партии, несмотря на то, что составляют большинство населения, в совокупности получили жалкие менее 20% мест в Галицийском сейме. Это связано с куриальной системой, которая благоприятствует богатым землевладельцам-избирателям перед крестьянами, которые составляют подавляющий процент рутенского населения. Как будто обстоятельства и так были против рутенов, поляки также были замечены в жестоком запугивании рутенских избирателей, причём одно сообщение говорило о том, что они устроили массовое убийство безоружных гражданских лиц в Дрогобыче. Из-за этого непропорционального представительства, а также событий в Дрогобыче, напряжённость между поляками и рутенами, и без того высокая, будет продолжать обостряться."
 ww1_austriahungary.190.a: "Рутены должны работать в рамках системы!"
 ww1_austriahungary.190.b: "Нам нужно обещать расследование в Дрогобыче!"
