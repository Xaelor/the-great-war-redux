 AUS_bohemian_language: "Уравнять чешский язык в Богемии"
 AUS_focus_on_the_administration: "Революционизировать административное государство"
 AUS_build_a_welfare_state: "Правительство работающего человека"
 AUS_build_a_welfare_state_desc: "Мы вступаем в эру социализма. Люди хотят прав, свобод и прогрессизма. Чтобы выполнить эти обязанности, мы будем медленно переходить к государству всеобщего благосостояния, чтобы поддерживать народ."
 AUS_cow_vaccine_program: "Карантин для заражённого скота"
 AUS_livestock_disease_mission: "Болезни скота ухудшаются"
 AUS_move_past_the_chaos: "Преодолеть хаос"
 AUS_cultivate_real_loyalty: "Создать прочную лояльность Империи"
 AUS_work_with_unions: "Отменить законы против забастовщиков"
 AUS_above_petty_squabbles: "Выше мелких национальных свар"
 AUS_butter_before_guns: "Масло вместо пушек"
 AUS_liberals_first_nationalists_second: "Либералы прежде всего, националисты потом"
 AUS_condemn_ottomans: "Осудить политику Османов в отношении христиан"
 AUS_condemn_ottomans_desc: "Османы жестоко угнетали христиан на своих балканских территориях, что вызвало возмущение практически всех в империи. Сильное осуждение этой османской политики может легко принести нам благосклонность всех в империи."
 AUS_crown_jewels_of_the_empire: "Коронные драгоценности империи"
 AUS_crown_jewels_of_the_empire_desc: "Несомненно, Вена и Прага — коронные драгоценности цислейтанской половины империи. Подавляющая часть нашей промышленности расположена в этих районах, и наше экономическое будущее зависит от них. Мы должны укрепить эти районы."
 AUS_special_privileges_to_weapon_companies: "Ослабить промышленные нормы"
 AUS_special_privileges_to_weapon_companies_desc: "Наша военная машина не в лучшей форме. Чтобы это изменить, оружейным заводам необходимы ослабленные нормы для максимизации их эффективности. Это не подлежит обсуждению, поскольку наша нынешняя военная машина отстаёт от некоторых великих держав. Конечно, это не будет эффективно, если не будут предприняты дальнейшие усилия по ремилитаризации..."
 AUS_establish_kriegspressequartier: "Учредить Kriegspressequartier"
 AUS_overton_window_tt: "Окно Овертона"
 AUS_overton_window_desc_tt: "Окно Овертона — это измеритель, определяющий, какие идеи приемлемы для основной массы населения. Это окно Овертона здесь выражает предел политики, которую мы можем проводить, в зависимости от того, склонно ли австрийское население к демократии или к автократизму."
 current_overton_window: "Текущее окно Овертона находится на [?AUS_overton_window] в сторону §qАвтократии§!"
 current_overton_window_tt: "Текущее окно Овертона находится на [?AUS_overton_window] в сторону §qАвтократии§!. Более высокое окно Овертона позволит нам выполнить больше фокусов для достижения нашей цели по ограничению автономии меньшинств и централизации командования."
 AUS_parliamentary_mandate_tt: "Влияние Камарильи:"
 AUS_parliamentary_mandate_tt_tt_tt: "Влияние Камарильи на Императора: §Y[?AUS_camarilla_progress_to_deposing_you]§!"
 AUS_parliamentary_mandate_tt_tt_tt_desc_tt: "Когда влияние Камарильи достигнет 5, Франц Иосиф потребует нашей отставки, что приведёт к цепочке событий, блокирующей наш путь 'Уничтожить обструкционистскую демократию'"
 AUS_enforce_war_requirement_act_on_bosnia: "Поощрять боснийские военные усилия"
 AUS_enforce_war_requirement_act_on_bosnia_desc: "Босния до сих пор не приняла Закон о военных требованиях, принятый нашим законодательством некоторое время назад. Пришло время нам погрузиться в боснийскую политику, навязав им Закон о военных требованиях."
 AUS_siegfried_popper: "Зигфрид Поппер"
 scientist_AUS_naval_architect: "Морской архитектор"
 AUS_preferential_rates_to_hungarian_grain: "Защитные пошлины на имперскую продукцию"
 AUS_preferential_rates_to_hungarian_grain_desc: "Продукция из других держав намного дешевле и присутствует в большем количестве. Это прискорбная ситуация для имперских фермеров, которым приходится брать больше из-за более высоких затрат на обслуживание. Мы можем установить имперское господство на австрийском рынке сельскохозяйственной продукции, облагая налогом импорт иностранного скота и зерна. Это даст преимущество менее богатым имперским фермерам, и они смогут получать больше прибыли."
 AUS_bohemian_industry: "Мастерская Империи"
 AUS_bohemian_industry_desc: "Мы продолжим инвестировать в Богемию, перераспределяя оставшиеся средства на строительство фабрик. Это значительно повысит нашу экономику, а также укрепит чешскую лояльность."
 AUS_continue_the_army_reforms: "Продолжить армейские реформы"
 AUS_continue_the_army_reforms_desc: "После серьёзной подготовки мы теперь можем приступить к реформированию наших вооружённых сил. Поскольку фундамент уже заложен, задача должна быть относительно простой."
 AUS_price_ceiling: "Предельные цены"
 AUS_price_ceiling_desc: "Колеблющиеся цены были суровы к народу Империи. Вопросы о предельных ценах обсуждались и раньше, но всегда рассматривались как чрезвычайная мера и шаг слишком далёкий. Что ж, эти экстремальные меры, безусловно, создадут нагрузку на нашу экономику, но население нельзя обманывать пустыми обещаниями."
 AUS_whip_the_army_into_action: "Взбодрить армию"
 AUS_war_cars: "Военные автомобили"
 AUS_improve_the_propaganda: "Нацелиться на политически безграмотных"
 AUS_protect_the_emperors_mandate: "Обеспечить полную силу мандата Императора"
 AUS_protect_the_emperors_mandate_desc: "[AUS_GetMinisterPresident] получил от [AUS.GetLeader] мандат на выполнение своих обязанностей в качестве директивы Имперского совета, но надоедливые реформистские группы пытаются создать обструкцию в парламенте и отобрать это право для себя. Мы не позволим им препятствовать нашему правительству, и чтобы обеспечить это, мы реформируем закон, чтобы устранить лазейки, которые они используют для создания обструкции."
 AUS_ban_labour_unions: "Запретить профсоюзы"
 AUS_ban_labour_unions_desc: "Наши реформы достигают кульминации. Чтобы сместить население вправо, мы должны лишить его защиты от лени, профсоюзов. Профсоюзы мешают нам установить реалистичную продолжительность рабочего дня, поэтому им необходимо положить конец сейчас."
 AUH_investment_bosnia: "Боснийские инвестиции"
 AUS_improve_supply: "Медленные, продуманные наступления"
 AUS_mandate_for_leadership_desc: "Недостаточно, чтобы Франц Фердинанд был просто ещё одним императором. Если мы собираемся спасти страну от хватки радикальных мадьяр, нам нужны как управленческая повестка дня, так и нужные люди на местах, готовые выполнить эту повестку в первый же день правления Фердинанда."
 AUS_proactive_interest_rate_policy: "Проактивная процентная ставка"
 AUS_investigate_artillery_decision: "Исследовать артиллерию"
 AUS_a_great_war_begins: "Великая война начинается"
 AUS_romania_bulgaria_peace: "Болгаро-румынское посредничество"
 AUH_extensive_bulgarian_investments: "Крупные инвестиции в Болгарию"
 AUS_crush_labor: "Уничтожить классовое сознание"
 AUS_enforce_our_will_on_bohemia: "Навязать нашу волю Богемии"
 AUS_fate_of_the_czechs: "Судьба чехов"
 AUS_imperial_press: "Имперская пресса"
 AUS_protect_our_national_sovereignty: "Вновь подтвердить наш национальный суверенитет"
 AUS_united_in_christianity: "Объединённые в христианстве"
 AUS_united_in_christianity_desc: "Император [AUS.GetLeader] глубоко набожен, 79% населения Цислейтании считают себя католиками, и он желает возрождения Pietas Austriaca XVII века."
 AUS_national_unity_idea: "Национальное единство"
 remove_tt_national_unity: "§RЭта идея будет удалена, если Christlichsoziale Partei больше не будет контролировать Имперский совет§!"
 AUS_the_reformist_era: "Начать эру реформизма"
 ww1_austriahungary.188.t: "Парламент застопорился"
 ww1_austriahungary.188.d: "Поскольку консерваторы продолжают отказываться от любых реформ в стране, парламент сталкивается с атакой со стороны обструкционистов-чехов, либералов и социал-демократов. Всевозможные важные законы блокируются, поскольку оппозиция использует парламент как спектакль, чтобы продвигать свои собственные предпочтительные законы, у которых нет шансов на принятие. Ясно, что они злоупотребляют функцией обструкционистских законов в Имперском совете; мы должны найти способ остановить их!"
 ww1_austriahungary.188.a: "Они переигрывают!"
 AUS_order_uboats.tt: "§YЭффекты через 450 дней:§!"
 AUS_order_uboats2.tt: "§YЭффекты при провале:§!"
 AUS_work_with_skoda_combo_tt: "Идея '§YРабота с Škoda§!' продлится на §Y150§! дней дольше."
 AUS_design_modern_artillery_with_skoda: "Выполнено £decision_icon_small'§YРазработать современную артиллерию с Škoda§!"
 AUS_conrad_will_not_return.tt: "§YФранц Конрад фон Хётцендорф§! не будет принят на работу повторно."
 AUS_mp_autocrat_dec.tt: "В настоящее время §YМинистр-президент Цислейтании§! является §qАвтократом§!\n§LАвтократические министры-президенты будут иметь плохие отношения с Имперским советом и должны стремиться к максимальному ограничению полномочий Имперского совета.§!"
 AUS_mp_reformist_dec.tt: "В настоящее время §YМинистр-президент Цислейтании§! является §CРеформистом§!\n§LРеформистские министры-президенты будут стремиться отменить демократию только в самых экстремальных случаях, поэтому реформистским министрам-президентам лучше всего пытаться поддерживать рабочие отношения с Имперским советом.§!"
 AUS_ic_con.tt: "§YИмперский совет§! в настоящее время возглавляется §gChristlichsoziale§! §qPartei§!\n§LChristlichsoziale Partei, или Христианско-социальная партия, возглавляла имперский совет на протяжении большей части его истории. Она состоит как из умеренных консерваторов, так и из убеждённых монархистов, которые обычно выступают против реформ, ослабляющих власть империи.§!"
 AUS_half_pig_war_things: "Решение £decision_icon_small §YИзменить Таможенный тарифный акт 1906 года§! будет иметь £pol_power §YСтоимость политической власти§! и £time_texticon §YКоличество дней до удаления§! §Gвдвое меньше§!"
 AUS_state_of_energy_desc: "По умолчанию каждый гражданский завод (до 25) добавляет одну единицу производства энергии, в то время как каждые 100 тысяч человек на поле боя вычитают одну. Другие изменения в мировой ситуации также повлияют на наше чистое производство."
 depends_on_previous_focus: "Эффекты этого фокуса будут зависеть от того, какой из его предварительных требований был выполнен."
 AUS_emperor_forms_holy_roman_empire: "Император приостановил выборы и объявил о восстановлении Священной Римской империи"
 romania_cannot_join_balkan_war_2: "Если §Y[ROM.GetNameWithFlag]§! примет, её возможность присоединиться ко Второй Балканской войне будет §Rнедоступна§!"
 AUH_tutorial_tt: "Убедитесь, что вы проверили свои £decision_icon_small §YКатегории решений§!, если вы ещё этого не сделали. Некоторые §YМиссии§! потребуют вашего внимания. Категория решений §YАвстрийские механики§! также может быть очень полезной; там вы найдёте §CРуководства§! по нескольким австрийским механикам, а также §CРешения для автоматизации§! для автоматического запуска решений, чтобы вам не приходилось беспокоиться о многократном нажатии нескольких решений каждые несколько месяцев."
 AUS_project_1911_one: "§YФранц Фердинанд§! использует ключевую юридическую лазейку для быстрого проведения радикальных изменений в §Y[HUN.GetNameWithFlag]§!, значительно ослабив §YВенгерскую§! автономию и отобрав большие объёмы власти у венгерской антифердинандовской элиты."
 AUS_depends_on_what_army: "Эффекты этого фокуса будут зависеть от того, выполнили ли мы §YПолитически изолировать Конрада§! или §YВнедрить армейскую структуру Конрада§!"
