 AUS_civil_servant_pensions: "Пенсии государственным служащим"
 AUS_reorganize_hungarian_governors: "Реорганизовать местные венгерские правительства"
 AUS_fortwursteln_desc: "Долгие 6 десятилетий правления оставили стареющего Франца Иосифа уставшим и, возможно, не таким активным, как раньше. Тем не менее, империя нуждается в его службе сейчас больше, чем когда-либо, и, как любят говорить некоторые австрийцы, он 'fortwursteln', то есть как-то пробивается."
 AUS_polish_baku: "Поддержать галицийскую нефтяную промышленность"
 AUS_polish_baku_desc: "В последнее время галицийская нефтяная промышленность приходит в упадок после быстрого расширения и достижения пика в 1909 году. Необходимо что-то делать с этим спадом, поскольку многие люди в уже обедневшей Галиции полагаются на эту отрасль, и мы не должны отставать от других стран в производстве этого критически важного ресурса."
 AUS_rachet_on_bosnia: "Усилить давление на славян"
 AUS_rachet_on_bosnia_desc: "Славяне всегда были самым бунтарским меньшинством в нашей империи, и недавнее покушение на губернатора Боснии подчёркивает этот факт. Мы должны усилить безопасность в регионе, чтобы остановить этих террористов."
 AUS_mp_austria_now_autocrat: "Следующий §YМинистр-президент Цислейтании§! будет §qАвтократом§!"
 AUS_mp_austria_now_reformist: "Следующий §YМинистр-президент Цислейтании§! будет §CРеформистом§!"
 AUS_this_might_be_complicated.tt: "Формула расчёта дней для миссии §YАдминистративный саботаж в южных регионах§! изменится с:\n(25 + [SER.GetFlag]§YСербская лояльность +§! [CRO.GetFlag]§YХорватско-словенская лояльность§!)\nна:\n([SER.GetFlag]§YСербская лояльность +§! [CRO.GetFlag]§YХорватско-словенская лояльность x 1.5§!)"
 AUS_this_might_be_complicated.tt2: "Формула расчёта дней для миссии §YАдминистративный саботаж в южных регионах§! изменится с:\n(25 + [SER.GetFlag]§YСербская лояльность +§! [CRO.GetFlag]§YХорватско-словенская лояльность x 1.5§!)\nна:\n(25 + [SER.GetFlag]§YСербская лояльность +§! [CRO.GetFlag]§YХорватско-словенская лояльность x 2§!)"
 AUS_ban_parties_that_undermine_austria_hungary: "Запретить антиимперские организации"
 HELP_ME: "ПОЖАЛУЙСТА, СДЕЛАЙТЕ ЭТО МЕНЬШЕ И ЧТОБЫ ГРАФИКА МИНИСТРА-ПРЕЗИДЕНТА ПОЯВЛЯЛАСЬ ЗДЕСЬ."
 AUS_depoliticize_the_language_issue: "Деполяризовать языковой вопрос"
 AUS_unlock_south_focus: "Контрабанда оружия и пропаганды из Сербии в Боснию угрожает стабильности региона"
 AUS_combat_southern_smuggling: "Борьба с контрабандой на юге"
 AUS_citizenship_for_muslims: "Признать ислам легальной религией"
 AUS_citizenship_for_muslims_desc: "В нашем недавно аннексированном кондоминиуме Боснии и Герцеговине проживает большое количество мусульман. Учитывая тот факт, что мы отошли от ненужного кровопролития и насильственных обращений, мы должны позволить этим людям как-то интегрироваться в общество нашей Империи и, что более важно, в нашу правовую систему, которая пока не признаёт и не допускает таких практик. Чтобы наладить отношения с местным населением в этом районе, мы признаем ислам разрешённой религией в Империи."
 AUS_inform_mp_mini_mechanic: "Текущий §YМинистр-президент Цислейтании§!, §Y[AUS_GetMinisterPresident]§! — §CРеформист.§! При желании мы могли бы в конечном итоге заменить его на §qАвтократа.§! В зависимости от идеологии §YМинистра-президента Цислейтании§! будут открываться разные фокусы."
 AUS_crackdown_on_galacia: "Пропагандистская кампания в Галиции"
 AUS_appoint_count_francis_thun: "Назначить графа Франциска Туна губернатором Богемии"
 AUS_liberal_majority_in_pm: "§NНационалистические§!-§mлиберальные§! члены составляют большинство в §YЦислейтанском парламенте§!"
 AUS_canal_projects: "Канальные проекты"
 AUS_canal_projects_desc: "Каналы — это часто упускаемый из виду способ транспорта в большинстве европейских стран. Эти каналы открывают множество возможностей, таких как: улучшение сельского хозяйства и промышленности, новые торговые пути и, в конечном счёте, объединение нашей географически сложной империи. Основной проект сосредоточен на соединении Дуная и Одера, чему рад каждый между Гамбургом и Будапештом. Этим мы положим конец целому десятилетию проектов, направленных на соединение водных путей империи."
