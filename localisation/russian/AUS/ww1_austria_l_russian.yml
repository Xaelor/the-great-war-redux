 AUS_as_serbia_strengthens: "По мере того как §Y[SER.GetNameWithFlag]§! захватывает всё больше земель, ситуация, вероятно, ухудшится."
 AUS_burying_the_grudges_of_the_past: "Забывая обиды прошлого"
 AUS_burying_the_grudges_of_the_past_desc: "Наша прежняя терпимость к таким меньшинствам, как славяне и мусульмане, была чрезвычайно консервативной. Мы должны уничтожить обиды прошлого, поскольку они уничтожают нашу репутацию, а также вызывают массовую нестабильность внутри империи и её владений."
 tenacious_negotiator_2: "Дипломатический архитектор"
 AUS_guy_is_alive: "§YГраф Алоиз фон Эренталь§! жив"
 AUS_guy_makes_better: "Наличие §Yграфа Алоиза фон Эренталя§! в качестве советника сократит £pol_power §Yстоимость политической власти§! и £time_texticon §Yколичество дней до удаления§! этого решения §Gвдвое§!"
 AUS_if_pp_ever_75: "Наша £pol_power §YПолитическая власть§! никогда не сможет упасть ниже §Y-75§!, пока мы не воюем."
 AUS_the_counterweight_to_serbia: "Противовес Сербии"
 AUS_the_counterweight_to_serbia_desc: "Чтобы ослабить сербское влияние, мы поддержим царя Болгарии в его войне против сербско-греческой коалиции. Это, в свою очередь, должно обеспечить нам более прочный плацдарм на Балканах."
