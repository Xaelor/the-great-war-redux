 AUS_centralization_and_discipline: "Централизация и дисциплина"
 AUS_centralization_and_discipline_desc: "Из-за глупых ошибок наших предшественников многие законы были смягчены, что привело к вызывающему беспокойство отсутствию дисциплины почти во всех секторах общества. Кроме того, необходимо сосредоточиться на централизации, которая в последнее время снижается. Мы сбились с курса, поэтому дальнейшая централизация государства и дисциплина его людей неотложны!"
 AUS_automatic_prop.tt2: "Эта миссия будет вычитать §Y25§! £pol_power §YПолитической власти§! каждые §Y30 дней§! и взамен давать нам эффекты от £decision_icon_small Решения §YОхлаждение напряжённости со славянами§!, эффективно автоматизируя решение за вас. Если ваша §YПолитическая власть§! упадёт ниже §Y25§!, миссия будет отменена, и это решение будет переактивировано, с уведомлением вас об этом."
 AUS_stabilization_effort.tt: "Эта миссия будет вычитать §Y[?AUS_cost_for_stabilization_effort_decision]§! £pol_power §YПолитической власти§! каждые §Y[?AUS_days_for_stabilization_effort_decision] дней§! и взамен давать нам эффекты от £decision_icon_small Решения §YУсилия по стабилизации в славянских территориях§!, эффективно автоматизируя решение за вас. Если ваша §YПолитическая власть§! упадёт ниже §Y[?AUS_cost_for_stabilization_effort_decision]§!, миссия будет отменена, и это решение будет переактивировано, с уведомлением вас об этом."
 AUS_gui_explain_stuff.tt: "§LМеханика Имперского совета влияет на национальный дух 'Имперский совет', причём его эффекты зависят от того, кто контролирует Имперский совет, влияния Имперского совета и отношений министра-президента с Имперским советом. Модификаторы рассчитываются по следующим уравнениям:\n\nПолучение политической власти и стоимость политических советников: 0.04 x влияние x отношения\n\nЕсли Имперский совет доминируется Christlichsoziale Partei, будет добавлена ежедневная поддержка авторитаризма по формуле 0.016 x влияние.\n\nЕсли Имперский совет доминируется Deutscher Nationalverband, будет добавлена ежедневная поддержка демократии по формуле 0.016 x влияние. Будет добавлен лимит на общую лояльность меньшинств: если отношения с Имперским советом положительные, минимальная лояльность меньшинств будет увеличена по формуле = влияние x 8 + 10; если отношения отрицательные, то максимальная лояльность меньшинств будет уменьшена по формуле 100 - влияние x 8.\n\nЕсли Имперский совет доминируется Sozialdemokratische Arbeiterpartei Österreich, будет добавлена ежедневная поддержка демократии по формуле 0.025 x влияние. Стабильность будет добавлена по формуле 0.025 x влияние x отношения. Фактор товаров народного потребления будет добавлен по формуле влияние x 0.04§!"
 AUS_ic_lib.tt: "§YИмперский совет§! в настоящее время доминируется §mDeutscher§! §NNationalverband§!\n§LDeutscher Nationalverband, или Германский национальный союз, представляет собой объединение либеральных и националистических групп в Богемии и Австрии. Его члены в целом согласны с тем, что в империи необходимы реформы, причём партия выступает за всеобъемлющее решение для разрешения богемско-германской напряжённости.§!"
 AUS_ic_socdem.tt: "§YИмперский совет§! в настоящее время доминируется §lSozialdemokratische§! §SArbeiterpartei§! §rÖsterreich§! \n§LSozialdemokratische Arbeiterpartei Österreich, или клуб германских социал-демократов, — это демократическая социалистическая группа, которая в сочетании с социал-демократическими партиями в разных регионах Цислейтании наконец получила большинство в парламенте. Социал-демократы поддерживают новые обширные программы социального обеспечения и разделены во мнениях о том, как обращаться с этническими меньшинствами в империи§!"
