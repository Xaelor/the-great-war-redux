 ww1_austriahungary.191.t: "Сформирован рутенско-еврейский избирательный союз"
 ww1_austriahungary.191.d: "Как на национальном, так и на местном уровне рутены и евреи договорились голосовать за своих соответствующих кандидатов на конкурентных выборах, где только один из их кандидатов имеет реальные шансы на победу, надеясь, что объединение их голосов может увеличить их влияние в парламенте, которое в настоящее время очень низко по сравнению с долей их населения в империи. Их низкое представительство идёт на пользу полякам, которые, несмотря на то, что составляют гораздо меньший процент населения, доминируют в местном галицийском сейме и имеют больше мест в Имперском совете из-за неблагоприятных законов для рутенских крестьян, благоприятствующих богатому землевладельческому польскому классу."
 AUS_storm_the_galician_diet: "Штурмовать Галицийский сейм"
 AUS_promise_minimum_seats_for_ukranians: "Обещать минимальное количество мест для украинцев"
 AUS_dysfunctional_galician_diet: "Дисфункциональный Галицийский сейм"
 ww1_austriahungary.193.t: "Рутены разрушают Галицийский сейм"
 AUS_done_ruthenian_demands: "Выполнены рутенские требования"
 ww1_austriahungary.193.d: "Учась у чехов, рутены сделали Галицийский сейм полностью неработоспособным, громко барабаня во время голосований и убивая законодательство с помощью обструкционистской тактики, чтобы протестовать против отсутствия представительства и несправедливых избирательных законов, которые слишком долго лишали рутенов избирательных прав."
 ww1_austriahungary.193.a: "Они действительно зашли далеко!"
 ww1_austriahungary.194.t: "Австрия предлагает продажу подводных лодок"
 ww1_austriahungary.194.d: "Австрия предложила нам продажу своих подводных лодок класса U-7, строящихся на Germaniawerft в Киле, поскольку подводные лодки не могут быть доставлены в Австрию из-за начала войны. Общее количество подводных лодок — 5 австрийских класса U-7, оснащённых достаточно современными торпедами и двигателями, хотя они будут введены в наш флот как класс U-66."
 ww1_austriahungary.194.a: "Конечно, отличная сделка!"
 ww1_austriahungary.194.b: "Мы не заинтересованы"
 ww1_austriahungary.195.t: "Германия принимает сделку по подводным лодкам"
 ww1_austriahungary.195.d: "Германия согласилась приобрести наши подводные лодки, строящиеся в их стране на Germaniawerft, поскольку возможность их передачи Австрии была утрачена с началом войны. Они будут введены в немецкий флот как класс U-66."
 ww1_austriahungary.195.a: "Отличная сделка!"
 ww1_austriahungary.196.t: "Германия отклоняет сделку по подводным лодкам"
 ww1_austriahungary.196.d: "Германия отклонила предложение о покупке наших подводных лодок, строящихся в их стране на Germaniawerft, которые предназначались для использования нашим флотом, но начало войны сделало передачу невозможной. Нет ясного ответа о том, что произойдёт с подводными лодками, которые стоят на верфях Киля."
 ww1_austriahungary.196.a: "Досадно"
