 ww1_austriahungary.197.t: "Галицийская бедность значительно сокращена"
 ww1_austriahungary.197.d: "Регион Галиция был самым бедным регионом нашей империи на протяжении всей её истории, и хотя он не процветает, мы добились невероятного прогресса за последние несколько лет благодаря нашим масштабным усилиям по сокращению бедности в Галиции. Фермеры в целом сводят концы с концами, большинство населения теперь имеет доступ к приемлемому уровню здравоохранения, а технологии в Галиции догнали остальную часть страны. Конечно, ещё есть прогресс, но Галиция определённо движется в правильном направлении."
 ww1_austriahungary.197.a: "Прекрасная история успеха!"
