 AUS_centralize_governance_in_vienna: "Централизовать управление в Вене"
 AUS_mp_is_neutral2: "Место §YМинистра-президента§! станет §gБеспартийным§! Все фокусы, связанные с §YМинистром-президентом§!, будут заблокированы."
 AUS_mp_is_neutral: "Место §YМинистра-президента§! станет §gнедействительным.§! Все фокусы, связанные с §YМинистром-президентом§!, будут заблокированы."
 AUS_root_out_red_traitors: "Выкорчевать красных предателей"
 AUS_tackle_galician_poverty_desc: "В Галиции очень высокий уровень бедности по сравнению с остальной империей, что привело к глубокой обиде проживающих там людей, а также затормозило экономику региона. Инвестируя в регион, мы сможем заложить семена будущего экономического роста Галиции и завоевать сердца и умы людей."
 AUS_investing_in_galacia: "Уже инвестируем в Галицию"
 AUS_state_of_the_realm: "Политическая система Аусgleich"
 AUS_state_of_the_realm_desc: "Корона Габсбургов связывает воедино обширное многоязычное лоскутное одеяло провинций и местных автономий, с конкурирующими парламентами, сепаратистами и социальными волнениями. Хотя с помощью постепенных реформ мы можем надеяться сохранить стабильную и процветающую империю, национальный кризис может привести к полному распаду империи."
 AUS_economic_patchwork: "Экономическое лоскутное одеяло"
 AUS_italian_university_desc: "Несмотря на лучшие усилия итальянских ирредентистов и пропаганды, итальянских иммигрантов в нашей империи часто описывали как самую лояльную группу меньшинств Кюстенланда. Хотя в целом они довольны правлением Габсбургов, одной из причин недовольства местных итальянцев является наш отказ разрешить строительство итальянского университета на наших территориях. Это был бы простой способ завоевать большую поддержку местных итальянцев в нашей империи."
 AUS_economic_patchwork_desc: "Экономика [AUS.GetNameDef] — это запутанное лоскутное одеяло из процветающих городов и трущоб, поражённых преступностью. Экономика может быть стабильной, но она очень неравна, что вызвало недовольство у многих."
