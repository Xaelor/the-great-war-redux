 AUS_obstruct_the_left: "Отклонить парламентские процедуры"
 AUS_obstruct_the_left_desc: "Парламентская бюрократия требует от нас соблюдения нескольких процедур, которые задерживают принятие законопроектов и позволяют оппозиции создавать обструкцию. Хотя это может быть не самым вежливым поступком, мы всегда можем просто игнорировать эти процедуры, чтобы уменьшить влияние обструкционистов."
 AUS_save_the_empire: "Спасти Империю"
 save_da_empires_tt: "Этот фокус будет §Gразблокирован§!, если §YКонрад фон Хётцендорф§! станет лидером страны"
