 this_event_will_fire_every_month_AUS_cartels_mexico_build_a_wall: "Это событие будет происходить каждый месяц, пока вам не удастся подавить беспорядки."
 AUS_the_natural_place_of_women: "Выступить против войны с материнством"
 AUS_rubber_stamp_the_conservative_agenda: "Резиновая печать консервативной повестки"
 AUS_rubber_stamp_the_conservative_agenda_desc: "Консерваторы в парламенте уже подготовили обширную повестку дня. Теперь, с дружественным министром-президентом, мы сможем быстро провести основную часть этой повестки и удовлетворить консерваторов в парламенте."
 AUS_appeal_to_rural_farmers: "Апеллировать к консервативным сельским фермерам"
 AUS_restore_business_confidence: "Восстановить доверие бизнеса"
 AUS_restore_business_confidence_desc: "Бизнес был отпугнут хаосом, вызванным ростом цен на продукты питания в начале 1911 года. Теперь, с новым правительством и ситуацией, оставленной позади, мы должны попытаться снова привлечь эти предприятия."
 AUS_desperate_coalition_building: "Построить идеологическую коалицию"
 AUS_new_mobilization_laws: "Ужесточить освобождение от призыва"
 AUS_deal_with_unions: "Антипрофсоюзное законодательство"
 AUS_better_the_devil_you_know: "Консервативно-германский националистический союз"
 AUS_disrupt_the_right: "Противодействовать регионалистским партиям"
 AUS_disrupt_the_right_desc: "Регионалистские партии в Имперском совете становятся всё более обструктивными и разрушительными для нашей империи. Нам необходимо бороться с влиянием этих партий, как борясь с их тактикой в парламенте, так и удушая их поддержку среди народа."
 AUS_the_poison_of_nationalism: "Устранить яд национализма"
 AUS_the_poison_of_nationalism_desc: "Национализм — это мёд и молоко для неграмотных претенциозных людей из маленьких наций на юго-востоке нашей Империи. Они не осознают сложности и нюансов достижения мира и процветания вместо пустоголовой экспансии под квазиисторическими претензиями. Такое же мышление, к сожалению, присутствует и в умах многих этнических меньшинств внутри наших границ. Мы не можем сильно влиять на иностранных граждан, но до наших собственных людей нужно достучаться. Этот национализм простых людей должен быть объяснён как близорукая мысль ради улучшения их собственной жизни."
 AUS_emperors_right_hand_man: "Правая рука императора"
 AUS_whip_together_army_bills: "Мандат для армии"
 AUS_nationalism_and_militarism: "Национализм и милитаризм"
 AUS_the_german_will: "Немецкая воля"
 AUS_invest_in_bosnia: "Одобрить кредиты Боснии"
 AUS_the_constitutionalist_dictatorship: "Конституционалистская диктатура"
 AUS_invest_in_bosnia_desc: "Босния — довольно неразвитый регион, что, возможно, объясняет неприязнь местных жителей к нашему правлению. Мы должны одобрить серию кредитов для Боснии, чтобы помочь развить инфраструктуру, построить новые общественные здания и укрепить полицию. Эта территория была так долго оккупирована отсталой Османской империей, что любые инвестиции в эти земли должны быть встречены с величайшей благодарностью, по крайней мере, мы так считаем."
 AUS_reshuffle_intelligence_bureau: "Реорганизовать разведывательное бюро"
 AUS_reshuffle_intelligence_bureau_desc: "Пришло время провести ежегодный набор повышений и вместе с ними обычную незначительную реорганизацию должностей в государственном аппарате. Среди незначительных изменений в этом году начальник разведки нынешнего Эвиденцбюро, Альфред Редль, повышается на незначительную военную должность, а на его место назначается его ученик Максимилиан Ронге. Редль возглавил модернизацию департамента, за что мы очень благодарны."
 AUS_double_down_on_organization: "Решить проблему с манекенами"
 AUS_adapt_to_climates: "Специализированная зимняя подготовка"
 AUS_new_logistics: "Расширить систему гужевого транспорта"
 AUS_calm_down_germans: "Успокоить немецких националистов"
 AUS_regulate_consumption_of_grain: "Регулировать потребление зерна"
 AUS_regulate_consumption_of_grain_desc: "Зерно, возможно, является самым важным ресурсом для поддержания порядка в нации. Кроме того, оно расточительно тратится на такие бесполезные алкогольные напитки, как пиво. Многие совершенно ненужные товары требуют зерно в больших количествах, что ни один здравомыслящий человек не позволил бы тратить во время войны. Наряду с пивом многие другие ненужные товары должны быть запрещены к производству как необходимая мера для стабилизации наших запасов зерна."
