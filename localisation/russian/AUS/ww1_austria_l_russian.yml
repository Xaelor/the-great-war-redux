 AUS_forcefully_reopen_galicia: "Если §YГалицийский сейм§! закрыт, мы можем использовать государственные силы для захвата Галицийского сейма и пресечения рутенского обструкционизма, быстро удалив отрицательный национальный дух ценой единовременного удара по стабильности."
