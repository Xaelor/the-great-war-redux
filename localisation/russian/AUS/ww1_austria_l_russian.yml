 AUS_mild_food_shortage: "Лёгкая"
 AUS_limited_food_shortage: "Ограниченная"
 AUS_noticeable_food_shortage: "Заметная"
 AUS_moderate_food_shortage: "Умеренная"
 AUS_widespread_food_shortage: "Широко распространённая"
 AUS_severe_food_shortage: "Серьёзная"
 AUS_critical_food_shortage: "Критическая"
 AUS_extreme_food_shortage: "Экстремальная"
 AUS_famine_food_shortage: "Уровень голода"
 AUS_germaniawerft_submarine_construction: "Строительство подводных лодок на Germaniawerft"
 AUS_all_in_the_name_of_security: "Тот, кто спасает нацию, не нарушает законов"
 AUS_subsidize_skoda_works: "Субсидировать заводы Škoda"
 AUS_subsidize_skoda_works_desc: ""
 AUS_funnel_money_into_landwehr: "Направлять деньги в Ландвер"
 AUS_funnel_money_into_landwehr_desc: ""
 AUS_reduce_working_regulations: "Сократить минимальный период отдыха"
 AUS_reduce_working_regulations_desc: "Сейчас у нас строгие требования к периоду отдыха для неквалифицированных рабочих по всей стране. Хотя идея, лежащая в основе закона, была праведной, нынешние стандарты неподходящи и нуждаются в обновлении. Мы должны сократить их, чтобы повысить производительность."
 AUS_galicia_invest: "Инвестиции в Галицию"
 AUS_discredit_trade_unions: "Дискредитировать профсоюзы"
 AUS_discredit_trade_unions_desc: "В последнее время Империя добилась больших успехов в реформах для рабочего класса, достаточных, чтобы удовлетворить любого разумного рабочего человека. Мы должны дотянуться до профсоюзов и подавить их, особенно в Богемии, где настроения, нелояльные Империи, сеют огромный раздор и недоверие. Мы должны провести расследование и усилить хватку, ибо на карту поставлена лояльность нашего промышленного сердца!"
 AUS_HUN_combat_spread_of_rinderpest: "Борьба с распространением чумы рогатого скота"
 AUS_italian_university: "Разрешить строительство итальянского университета"
 AUS_new_housing_projects: "Субсидировать жилищное строительство"
 AUS_new_housing_projects_desc: "Чтобы смягчить растущую высокую стоимость жизни, мы должны сначала устранить корень проблемы — жильё. Мы не можем допустить роста бездомности и обнищания в Империи! Чтобы бороться с проблемой, мы должны взять дело в свои руки и немедленно начать строительство новых домов и других общественных проектов!"
 AUS_expand_trade: "Продвигать [AUS.GetAdjectiveCap] торговлю"
 AUS_expand_trade_desc: "Торговля — неотъемлемая часть экономики Империи, и независимо от того, что мы не должны никогда ею пренебрегать! В преддверии войны командование и политики начинают осознавать, что после начала войны многие импортируемые товары, на которые мы сильно полагаемся, будут крайне ограничены. Итак, отношения с нашими торговыми партнёрами должны быть немедленными и эффективными, чтобы сохранить их лояльность в условиях войны."
 AUS_tackle_galician_poverty: "Инвестировать в Галицию"
 AUS_realistic_planning: "Отказаться от чрезмерно амбициозных армейских планов"
 AUS_prioritize_the_infantry: "Отдавать приоритет базовой полевой армии"
 AUS_the_money_printer: "Использование печатного станка"
 AUS_worsening_food_shortages: "Ухудшение нехватки продовольствия"
 AUS_endorse_project_1911: "Внедрение 'Проекта 1911'"
 AUS_endorse_project_1911_desc: "В 1911 году близкие советники Франца Фердинанда Визнер и Хойос написали обширный юридический план, который должен был быть введён в действие немедленно после коронации Франца Фердинанда императором Австрии. План позволит Францу Фердинанду быстро централизовать власть и значительно ослабить оппозиционные группы Фердинанду, начиная с венгров."
 AUH_austrian_military: "Landstreitkräfte"
 AUS_reform_intelligence_agency: "Реформировать разведывательные операции"
 AUS_amend_pigwar_tarrifs: "Продолжить деэскалацию торговой войны с Сербией"
 AUS_amend_pigwar_tarrifs_desc: "Несколько лет назад мы достигли соглашения с Сербией о прекращении нашей бессмысленной торговой войны. Хотя мы отменили большинство тарифов, некоторые всё ещё остаются. Мы должны продолжать медленно снижать эти тарифы, пока торговые отношения не нормализуются."
 AUH_dm_pig_war: "Последствия Свиной войны"
 AUH_dm_pig_war_desc: "[AUS_pig_war_dm_desc_scripted]"
 AUH_dm_pig_war_AUS_desc: "Schweinekrieg, или Свиная война, была серией неудачных тарифов и блокад, введённых против сербской свинины в отместку за установление ими других иностранных связей. Она длилась 2 года с 1906 года, но до сих пор имеет долгосрочные последствия для экономики и отношений обеих стран."
 AUH_dm_pig_war_HUN_desc: "Disznóháború, или Свиная война, была серией неудачных тарифов и блокад, введённых против сербской свинины в отместку за установление ими других иностранных связей. Она длилась 2 года с 1906 года, но до сих пор имеет долгосрочные последствия для экономики и отношений обеих стран."
 AUH_dm_pig_war_BOS_desc: "Svinjski rat, или Свиная война, была серией неудачных тарифов и блокад, введённых против сербской свинины в отместку за установление ими других иностранных связей. Она длилась 2 года с 1906 года, но до сих пор имеет долгосрочные последствия для экономики и отношений обеих стран."
 AUS_every_mans_duty: "Долг каждого человека перед своей нацией"
 AUS_premptive_strike: "Упреждающий удар"
 AUS_strict_working_regulations: "Большие красивые рабочие нормы"
 AUS_invest_in_the_less_fortunate: "Инвестировать в менее удачливых"
 AUS_status_quo_angry: "Продолжение политики статус-кво, вероятно, приведёт к ухудшению политической напряжённости по всей империи. Бездействие может привести к §Rэскалации§!"
 AUS_the_hostile_enemy_of_austria: "Начать расовую войну"
 AUS_adress_inequality: "Решить проблему неравенства"
 AUS_adress_inequality_desc: "Наша империя обширна и неравна. Многие этнические группы чувствуют, что ими пренебрегают и оставляют позади. Экономический застой в этих сельских или горных районах нельзя отрицать, и хотя это не наша вина, именно мы должны помочь запустить надлежащую промышленность в каждом уголке нашей обширной Империи. Инвестируя в эти территории, мы можем завоевать столь необходимую симпатию наших народов и успешно построить процветающее общество."
 AUS_provide_trucks_dec: "Реквизировать гражданские автомобили"
 AUS_abandon_stabilization: "Остановить автоматический запуск решения £decision_icon_small '§YУсилия по стабилизации в славянских территориях§!'"
 AUS_abandon_propaganda: "Остановить автоматический запуск £decision_icon_small '§YПропагандистская кампания в Богемии§!'"
 AUS_when_1911_thing: "Этот фокус будет §Gавтозавершён§! после завершения §YВыборов 1911 года в Цислейтании§!"
 AUS_stabilization_effort: "Автоматически запускать решение £decision_icon_small '§YУсилия по стабилизации в славянских территориях§!'"
 AUS_automatic_propaganda_mission_bosnia: "Автоматически запускать решение £decision_icon_small '§YОхлаждение напряжённости со славянами§!'"
 AUS_stabilization_effort_mission: "Усилия по стабилизации в славянских территориях"
 AUS_automatic_propaganda_mission: "Распространение пропаганды в Богемии"
 AUS_automatic_propaganda: "Автоматически запускать решение £decision_icon_small '§YПропагандистская кампания в Богемии§!'"
 AUH_automatic_mechanics: "Австрийские механики"
 AUH_automatic_mechanics_desc: "У Австрии есть несколько уникальных механик. Здесь вы можете получить более подробные объяснения по каждой из них. Также у вас будет возможность автоматически запускать определённые решения здесь."
 AUS_ratify_new_budget: "Обновить фонд Gemeinsame Armee"
 AUS_ratify_new_budget_desc: "Чтобы создать экономический бюджет для Общей армии, мы обновим давно ожидаемое финансирование армии, что значительно продвинет текущее состояние вооружений. Это также свяжет нас с Венгрией и подготовит к неизбежным будущим конфликтам."
 AUS_reform_obstruction_laws: "Запретить обструкционизм"
 AUS_concede_to_christians: "Апеллировать к христианскому большинству"
 AUS_concede_to_christians_desc: "Рейхсрат состоит из социально-консервативного христианского меньшинства. Мы должны играть с этими консерваторами, чтобы провести нашу милитаристскую повестку, поэтому давайте уделим им особое внимание, разделяя нашу общую христианскую идентичность."
 AUS_inspectorates_local_governments: "Инспектораты местных органов власти"
 AUS_inspectorates_local_governments_desc: "Многие местные органы власти страдают от коррупции и кумовства. Чтобы бороться с этим, мы должны разрешить министерству внутренних дел инспектировать местные органы власти и заменять неэффективных губернаторов."
 AUS_reformgovsdecisions: "Открывает £decision_icon_small §YРешения§! по реформированию местных органов власти в [AUS.GetFlag]§YАвстрийских§! регионах , обменивая £boost_popularity_texticon поддержку §gАвторитаризма§! на £pol_power §YПолитическую власть§!"
 AUS_begin_erasing_slavic_identity: "Начать стирание славянской идентичности на Юге"
 stuff_set_shit_0: "Если £boost_popularity_texticon §gАвторитарный§! §Yприрост партии§! меньше §Y0§!, он будет установлен на §Y0§!"
 AUS_serb_trade_cut: "Австро-сербские торговые отношения разорваны"
 AUS_cut_key_trade_SER: "Разорвать торговые отношения с [SER.GetName]"
 AUS_imperial_elections: "Выборы в Имперский совет"
 AUS_imperial_elections_desc: "Выборы в Имперский совет назначены на июль 1911 года.\nВ настоящее время сила §gChristlichsoziale§! §qPartei§! составляет: [?AUS_conservative_election_performance]\nВ настоящее время сила §mDeutscher§! §NNationalverband§! составляет: [?AUS_liberal_election_performance]\nВ настоящее время сила §lSozialdemokratische§! §SArbeiterpartei§! §rÖsterreich§! составляет: [?AUS_socdem_election_performance]"
 AUH_the_imperial_council: "Имперский совет"
 AUH_the_imperial_council_desc: "[AUS_GetMinisterIdeology]\n\n[AUS_GetImperialCouncilIdeology]"
 AUS_imperial_council_info_tt: "Имперский совет был основан в 1861 году как законодательный орган Австрийской империи после Февральского патента, который официально закрепил конституционное управление. Задачей законодательного органа является обсуждение и принятие законов и консультирование императора, в то время как министр-президент является главой правительства, руководящим администрацией Совета."
 AUS_ic_desc_tt: "Имперский совет был основан в 1861 году как законодательный орган Австрийской империи после Февральского патента, который официально закрепил конституционное управление. Задачей законодательного органа является обсуждение и принятие законов и консультирование императора."
 AUS_mp_desc_tt: "Министр-президент является главой правительства, руководящим администрацией Совета."
 AUH_the_imperial_council_tt: "В настоящее время отношения между §YМинистром-президентом§! и §YИмперским советом§! составляют: [AUS_GetParliamentRelations] §L([?AUS_parliament_relations])§!"
 AUS_the_minister_president: "Министр-президент Цислейтании"
 AUS_minister_president_tt: "Министр-президент \n§YЦислейтании§! —\n[AUS_GetMinisterIdeologyShort]"
 AUS_minister_president_tt_2: "§Y[AUS_GetMinisterPresident]§! — [AUS_GetMinisterIdeologyShort]"
 AUS_reformist_tt: "§CРеформист§!"
 AUS_autocrat_tt: "§qАвтократ§!"
 AUS_christlichsoziale_tt: "§gChristlichsoziale§! §qPartei§!"
 AUS_sozialdemokratische_arbeiter: "§lSozialdemokratische§! §SArbeiterpartei§! §rÖsterreich§!"
 AUS_deutscher_nationalverband: "§mDeutscher§! §NNationalverband§!"
 AUS_imperial_council_ideology_tt: "Имперский совет\nвозглавляется\n[AUS_GetImperialCouncilIdeologyShort]"
 AUS_imperial_council_ideology_tt_2: "Имперский совет возглавляется [AUS_GetImperialCouncilIdeologyShort]"
 AUS_mp_autocrat_desc_tt: "В настоящее время §YМинистр-президент Цислейтании§! является §qАвтократом§!.\n§LАвтократические министры-президенты могут относительно мирно работать с консервативными Имперскими советами, но будут испытывать серьёзные трудности в работе с либералами, националистами и социал-демократами. Как правило, автократы будут иметь плохие отношения с Имперским советом и должны стремиться к максимальному ограничению полномочий Имперского совета.§!"
 AUS_mp_reformist_desc_tt: "В настоящее время §YМинистр-президент Цислейтании§! является §CРеформистом§!.\n§LРеформистские министры-президенты могут испытывать некоторые трудности в работе с консервативными Имперскими советами, но им будет легче работать с либералами и социал-демократами. Реформистские министры-президенты будут стремиться отменить демократию только в самых экстремальных случаях, поэтому реформистским министрам-президентам лучше всего пытаться поддерживать рабочие отношения с Имперским советом.§!"
 AUS_minister_president_desc_tt: "[AUS_GetMinisterIdeologyDescs]"
 AUS_ic_conservatives_tt: "§LChristlichsoziale Partei, или Христианско-социальная партия, возглавляла имперский совет на протяжении большей части его истории. Она состоит как из умеренных консерваторов, так и из убеждённых монархистов, которые обычно выступают против реформ, ослабляющих власть империи.§!"
 AUS_ic_liberals_tt: "§LDeutscher Nationalverband, или Германский национальный союз, представляет собой объединение либеральных и националистических групп в Богемии и Австрии. Его члены в целом согласны с тем, что в империи необходимы реформы, причём партия выступает за всеобъемлющее решение для разрешения богемско-германской напряжённости.§!"
 AUS_ic_social_dem_tt: "§LSozialdemokratische Arbeiterpartei Österreich, или клуб германских социал-демократов, — это демократическая социалистическая группа, которая в сочетании с социал-демократическими партиями в разных регионах Цислейтании наконец получила большинство в парламенте. Социал-демократы поддерживают новые обширные программы социального обеспечения и разделены во мнениях о том, как обращаться с этническими меньшинствами в империи.§!"
 AUS_ic_party_desc_tt: "[AUS_GetImperialCouncilIdeologyDesc]"
 AUS_ic_influence_tt: "Влияние §YИмперского совета§!:\n[AUS_GetParliamentInfluence] §L([?AUS_parliament_influence])§!"
 AUS_ferdinand_von_trauttmansdorff: "Фердинанд фон Трауттмансдорф"
 AUS_suspend_the_reichsrat: "Приостановить работу Рейхсрата"
 AUS_heinrich_klam_martinic: "Генрих Клам-Мартиниц"
 AUS_max_von_heinlein: "Макс Гуссарек фон Хайнлайн"
 AUS_amend_pig_war: "Изменить Таможенный тарифный акт 1906 года"
 AUS_livestock_disease: "Болезни скота"
 AUS_industrialize_vienna_suburbs: "Индустриализировать пригороды Вены"
 AUS_industrialize_vienna_suburbs_desc: "В настоящее время Вена — великий, могущественный и богатый город. Однако, чтобы ещё больше расширить возможности региональной промышленности, мы простимулируем промышленное производство, построив государственные мануфактуры. Это создаст рабочие места в городе для молодых граждан."
 AUS_increase_resource_extraction: "Европейский ресурсный центр"
 AUS_increase_resource_extraction_desc: "Австрия может достичь огромных объёмов добычи ресурсов, особенно стали и угля, даже превзойдя производственные мощности других европейских держав, таких как Франция и Россия. Пришло время использовать наш ресурсный потенциал и стать центром Европейского континента."
 AUS_pursue_balkan_peace: "Стремиться к миру на Балканах"
 AUS_pursue_balkan_peace_desc: "Никто не выиграет от мира на Балканах больше, чем мы. Дестабилизирующие боевые действия, к которым призывают многие маленькие нации на Балканском полуострове, идиотичны и могут принести только вред! Статус-кво этих наций и османов с момента их освобождения имеет первостепенное значение, ибо эти националистические кровожадные псы ничего не знают о дипломатии или разуме, и никто не желает себе таких соседей. Поэтому достижению мира на Балканах будет уделено больше внимания."
 AUS_expand_womens_education: "Одобрить проекты женского образования"
 AUH_democratic_riots: "Либеральная обструкция"
 AUS_bohemian_steel_mills: "Богемские сталелитейные заводы"
 AUS_bohemian_steel_mills_desc: "Ой! Извините, это шумят фабрики на заднем плане! Сталь — важнейший ресурс для промышленного производства, поэтому создание большего количества отраслей, связанных со сталью, будет полезно для нашей обрабатывающей промышленности."
 AUS_us_vs_them: "Менталитет 'Мы против них'"
 AUS_expand_textiles_and_glass_industry: "Расширить текстильную и стекольную промышленность"
 AUS_expand_textiles_and_glass_industry_desc: "У нас одна из крупнейших потребительских отраслей в Европе. Чтобы ещё больше развить нашу экономику, мы используем это для создания монополии."
 AUS_domestic_industry: "Укрепление местных производителей"
 AUS_domestic_industry_desc: "В последнее время местным производителям уделялось недостаточно внимания, поэтому инвестиции необходимы. Это не только улучшит сердце империи, но и будет в интересах многих немецких граждан, которые нуждаются во внимании так же, как и проблемные меньшинства."
 AUS_secure_eastern_minorities: "Защитить меньшинства Востока"
 AUS_limit_czech_authority: "Ограничить полномочия нижних парламентов"
 AUS_dissolve_bohemian_diet: "Распустить богемский сейм"
 AUS_dissolve_bohemian_diet_desc: "Постоянное лишение власти богемского сейма дало лишь частичные результаты. По мнению наших советников, этого недостаточно. Чехи были одними из главных пользователей обструкционистских методов, и за это приходит расплата. Все предупреждения были проигнорированы, и из-за несотрудничающей ситуации мы вынуждены распустить их сейм, который доставляет нам столько ненужных головных болей."
 AUS_peace_and_prosperity_program: "Новый промышленный центр"
 AUS_peace_and_prosperity_program_desc: "Хотя мы могли бы сосредоточиться на военной промышленности, чтобы удовлетворить гражданский спрос и увеличить наши производственные мощности, мы пока сосредоточимся на гражданской промышленности и технологиях."
 AUS_supress_social_democrat_organizations: "Подавить социал-демократические клубы"
 AUS_further_escalate: "Мы можем §Rэскалировать§! ситуацию, если Балканская война продолжится."
 AUS_reject_democratization: "Отвергнуть чуму демократизации"
 AUS_reject_democratization_desc: "Император проявил великодушие, создав Имперский совет, удовлетворив сторонников либерализации. Во что превратился Имперский совет? В бессмысленные пререкания, обструкционизм и крайнюю партийную разобщённость. Мы не можем позволить этому сломленному институту играть такую большую роль в управлении Австрией."
 AUS_salveageable_institution: "Спасаемый институт"
 AUS_build_class_consciousness: "Формировать классовое сознание"
 AUS_mandate_saftey_equipment: "Обязать использовать базовое защитное оборудование"
 AUS_joint_ventures_with_cartel: "Установить благоприятные торговые и тарифные ставки"
 AUS_salveageable_institution_desc: "Имперский совет использовался как оружие обструкционистскими группами для остановки правительства Австрии, и это необходимо решить. Реформированный Имперский совет, ставший более продуктивным инструментом, должен иметь возможность установить отличные рабочие отношения с министром-президентом."
 AUS_taken_5_times: "Это решение может быть принято §Y5§! раз"
 AUS_taken_3_times: "Это решение может быть принято §Y3§! раза"
 AUS_skoda_works: "Субсидировать заводы Škoda"
 AUS_skoda_works_desc: "Заводы Škoda, крупная организация в Чехии, уже процветают. Они чрезвычайно велики, обладают мощной промышленной базой, которая двигает Богемию вперёд. Однако, чтобы поддержать их экономически, мы предоставим компании субсидии, чтобы повысить их процветание и в конечном итоге получить их на нашей стороне."
