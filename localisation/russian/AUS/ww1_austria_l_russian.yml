 ww1_austriahungary.192.t: "Поляки готовят чрезвычайно агрессивную избирательную кампанию"
 ww1_austriahungary.192.d: "Поскольку рутены и евреи организуются, пытаясь бросить вызов польскому доминированию в Галицийском сейме, поляки не воспринимают их усилия легкомысленно. Применяются жестокие методы, такие как насильственные ответные меры на избирательные кампании рутенов и евреев, а также польские группы планируют полностью помешать рутенам голосовать с помощью запугивания избирателей. К сожалению, из-за отсутствия надзора на востоке, вероятно, ничего нельзя сделать, чтобы помешать полякам предпринимать эти действия, что означает, что выборы, скорее всего, будут далеки от справедливых."
 ww1_austriahungary.192.a: "Они же богатые. Просто смотри в другую сторону."
