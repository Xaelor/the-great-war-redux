 AUS_expand_womens_education_desc: "Огромное количество проектов, связанных с образованием для девочек, ожидают одобрения правительства для строительства. Хотя [AUS.GetLeader] в прошлом не решался поддерживать такие меры, сейчас [GetYear], и нам нужно привести империю к современности. Мы должны начать одобрять эти проекты."
