 AUS_allow_volatile_growth: "Принять волатильный рост"
 AUS_slow_labor_reforms: "Разрешить реформы на рабочем месте"
 AUS_open_up_the_country: "Открытие страны"
 AUS_satisfy_the_peasants: "Сосредоточиться на стоимости жизни"
 AUS_crush_the_bohemian_parliament: "Раздавить богемский сейм"
 AUS_combat_the_scissor_effect: "Бороться с эффектом ножниц"
 AUS_support_competitive_pricing: "Поддержать конкурентное ценообразование"
 AUS_encourage_innovation: "Поощрять инновации"
 public_utilities_aus: "Муниципальный социализм"
 AUS_improve_trento_supply_administration_desc: "Альпы представляют собой горную цепь, которую трудно пересечь, и многие империи погубили бы свои армии, пытаясь пройти через неё. Наши войска на границе, хотя и подготовлены, снабжаются недостаточно хорошо. Мы должны решить эту проблему до возможного начала конфликта в регионе. Будет построен приличный узел снабжения для поддержания линии фронта в случае такого события."
 AUS_conrad_effects: "Конрад известен тем, что доводит австрийскую армию до предела, планируя очень амбициозно, даже если ресурсов... не хватает, мягко говоря. Таким образом, выбор следования военной доктрине Конрада §Gудвоит§! бонусы всех общих армейских фокусов в этом дереве, однако все общие армейские фокусы в этом дереве также начнут §Rотрицательно§! влиять на £supply_consumption_texticon Потребление снабжения, £army_experience Получение опыта армии и £factory_output_texticon Фабричный выпуск.\n\nМы можем смягчить влияние этих дебаффов через фокусы §YЧрезвычайные военные расходы§!, §YРасширение армейского бюджета§! и §YНаправление денег в Ландвер§!"
 AUS_reverse_serbian_reconciliation: "Отменить примирение с Сербией"
 AUS_uplift_developing_areas: "Поднимать развивающиеся районы"
 AUS_support_the_cartelization_of_industry: "Поддержать картелизацию промышленности"
 AUS_support_the_cartelization_of_industry_desc: "Картелизация экономики — это когда группа рынков договаривается о сотрудничестве друг с другом, чтобы не создавать конкуренцию, а вместо этого максимизировать прибыль и доминировать на рынке. Начиная с 1890-х годов, экономика нашей Империи доминируется этой либертарианской политикой, и мы не видим причин останавливаться: наша экономика процветает и так."
 korting_disaster: "§YКатастрофа Кёртинга§! произошла"
 AUS_housing_projects: "Инвестировать в жилищное строительство"
 AUS_support_textile_paper_cartels: "Поддержать текстильные и бумажные картели"
 AUS_mantain_a_competitive_economy: "Поддерживать конкурентоспособную экономику"
 AUS_mantain_a_competitive_economy_desc: ""
 AUS_break_the_1903_brussels_convention: "Разорвать Брюссельскую конвенцию 1902 года"
 AUS_break_the_1903_brussels_convention_desc: "На торговой конвенции 1902 года, в которой участвовали все европейские центры силы, Австро-Венгрия согласилась ограничить свои импортные пошлины до 6 французских франков, что составляло 5,7 кроны за 100 килограммов, и запретить экспортные премии (государственные субсидии) на сахар. Но эти конвенции ограничивают любое возможное расширение картелей, поэтому они должны быть отменены ради блага австрийской экономики."
 AUS_urbanize_vienna: "Урбанизировать Вену"
 AUS_urbanize_vienna_desc: "Вена, имперская столица нашей Империи, никогда не должна отставать от столиц других великих держав. Очевидно, что это не так, но для сохранения нашей нетронутой гордости необходимо постоянное финансирование её промышленности. Пусть наш мегаполис сияет."
 AUS_too_big_to_fail: "Слишком большой, чтобы обанкротиться"
 AUS_too_big_to_fail_desc: "Банки Цислейтании не только предоставляют кредиты для развития нашей промышленности, но и владеют и управляют ею. Это связано с Великой депрессией 1873 года, спровоцированной в Вене и вызванной неправильным использованием либертарианской экономической системы. Таким образом, банки владеют картелями."
 AUS_mantain_cheap_goods: "Поддерживать дешёвые добывающие ресурсы"
 AUS_the_iron_ring: "Железное кольцо"
 AUS_cooperation_with_military_industry: "Сотрудничество с военной промышленностью"
 AUS_commission_on_cartels: "Выполнить услуги картелям"
 AUS_housing_projects_desc: "Чтобы продолжить нашу экономическую политику и предоставить жильё многим семьям, мы создадим больше квартир, государственных домов, продолжим развитие наших городов, периферии империи и снизим уровень бедности из-за дорогого жилья."
 AUS_improve_the_civil_service: "Улучшить государственную службу"
 AUS_improve_the_civil_service_desc: "Мы будем активно инвестировать в эффективность нашего правительства, пытаясь устранить узкие места и наладить поток идей, правительственных запросов, всё это во славу Кайзера и самого кабинета министров, создавая более простой и понятный процесс для всех."
 AUS_multiethnic_army: "Kaiserlich Und Koniglich Armee"
 AUS_offensive_doctrine: "Наступательная доктрина"
 AUS_mining_in_salzburg: "Поддержать горнодобывающую промышленность в Зальцбурге"
 AUS_multiethnic_army_desc: "Landstreitkräfte Österreich-Ungarns — наши сухопутные силы, разделённые на три секции. Армия страдает от множества различных культур и меньшинств, что создаёт проблемы с организацией и связью, а также некомпетентность. Кто-то может немного это исправить. Остальная часть описания — копипаста из википедии. Погнали! После боевых действий между Австрийской империей и Венгерским королевством и последующих двух десятилетий нелёгкого сосуществования, венгерские войска служили либо в этнически смешанных подразделениях, либо были размещены вдали от венгерских регионов. С Австро-Венгерским компромиссом 1867 года была создана Австро-Венгерская армия. Она просуществовала до роспуска Австро-Венгрии в 1918 году после окончания Первой мировой войны. Подразделения общей армии, как правило, были плохо обучены и имели очень ограниченный доступ к новому оборудованию, потому что правительства австрийской и венгерской частей империи часто предпочитали щедро финансировать свои собственные подразделения, а не оснащать в равной степени все три армейские ветви."
 AUS_funnel_money_into_the_landwehr: "Направлять деньги на ремилитаризацию"
 AUS_take_advantage_of_section_41: "Использовать диктаторский параграф"
 AUS_take_advantage_of_section_41_desc: "Параграф 14 Конституции, чрезвычайная статья, позволяет обходить парламентские дебаты при принятии спорных решений."
 AUS_der_grosse_kriegsredux: "Мобилизовать нацию"
 AUS_der_grosse_kriegsredux_desc: "После тщательной подготовки Великая война началась. Миллионы людей по всей Европе движутся к линии фронта, и мы сделаем то же самое. Наша элитная армия тактически уничтожит Сербию, сосредоточившись на границе с Белградом, а остальной армией мы сдержим русских. Наше время пришло. Солнце взошло, но для Австрии и её союзников. Слава Кайзеру!"
 AUS_invest_in_supporting_attacks: "Увеличить вспомогательные силы в армии"
 AUS_invest_in_bosnian_schools: "Инвестировать в боснийские школы"
 AUS_invest_in_bosnian_schools_desc: "Общеизвестный факт, над которым многие смеются по всей Империи, — это уровень грамотности в Боснии и Герцеговине, нашем новом приобретении. Чтобы реально изменить тот факт, что четыре пятых этого региона неграмотны, мы должны помочь им со строительством школ и дальнейшими инвестициями, связанными с этой проблемой."
 AUS_adopt_modern_technology: "Внедрить современные технологии"
 AUS_anti_peddling_laws: "Законы против уличной торговли"
 AUS_aid_chemical_warfare_development: "Профинансировать исследования химического оружия"
 AUS_remilitarization_program: "Программа ремилитаризации"
 AUS_remilitarization_program_desc: "Хватит этих абсурдных мирных программ процветания! Сейчас не мирное время, а канун большой войны. Пацифистские элементы не осознают состояния нашей военной машины и общей готовности экономики поддерживать стабильность в случае крупномасштабной войны. Немедленное строительство оружейных заводов и субсидирование наших самых ценных компаний — приоритет Империи!"
 BOS_young_bosnia_party: "Млада Босна"
 AUS_unlock_tanks: "Открывает специальный проект: §Y$tank_design$§!"
 AUS_new_course_in_aviation: "Новый курс в авиации"
 AUS_construct_air_base_in_ragusa: "Построить авиабазу в [1206.GetName]"
 AUS_construct_air_base_in_1197: "Построить авиабазу в [1197.GetName]"
 AUS_cultivate_polish_loyalty: "Взращивать польскую лояльность"
 AUS_bypass_the_obstructionists: "Обойти обструкционистов"
 AUS_prepare_for_war_economy: "Подготовиться к военной экономике"
 AUS_prepare_for_war_economy_desc: "Война надвигается, а наша промышленность всё ещё далека от желаемой. Поэтому, чтобы максимально наверстать упущенное, мы пойдём на крайние меры и в одночасье переоборудуем несколько фабрик под военную технику. Строительство совершенно новых фабрик — слишком дорогой и длительный процесс, поэтому мы вынуждены прибегнуть к конверсии. Надеюсь, это именно то, что нам нужно."
 AUS_bypass_the_obstructionists_desc: "Если антидемократические трусы в рейхсрате хотят сломать законодательную ветвь власти, мы просто вырежем законодательный орган. Используя наши полномочия для неоднократной приостановки работы рейхсрата и принятия чрезвычайных указов, пока рейхсрат не заседает, мы можем помешать реализации нашей повестки дня."
 AUS_encourage_jewish_exodus: "Поощрять еврейскую эмиграцию"
