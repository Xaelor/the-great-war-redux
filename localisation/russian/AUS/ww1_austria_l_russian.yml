 AUS_its_a_jungle_out_there: "Свирепейший тигр в джунглях геополитики"
 AUS_the_youth_group: "Парамилитарные молодёжные группы"
 AUS_national_pensions: "Универсальная пенсионная система"
 AUS_franz_ferdinand: "Самый одинокий человек в Вене"
 AUS_politicking: "Политиканство"
 AUS_delay_the_coronation: "Отложить коронацию"
 AUS_delay_the_coronation_desc: "Отсрочка коронации Франца II королём Венгрии позволит ему принимать исполнительные решения в Венгерском королевстве без необходимости соблюдать Аусляйхский компромисс 1867 года. Он высказал своё политическое мнение о том, что он будет делать в Венгрии после коронации: он устроит хаос."
 AUS_secure_the_ballhausplatz: "Обезопасить Бельведерский кружок"
