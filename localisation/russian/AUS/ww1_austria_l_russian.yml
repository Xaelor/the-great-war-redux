 ww1_austriahungary.187.t: "Утверждение армейского бюджета требует согласия парламента"
 ww1_austriahungary.187.d: "Хотя это и не главное, периодически требуется закон для решения таких вопросов, как форт, нуждающийся в модернизации, небольшой грант для оружейного завода или одобрение траты небольшой суммы средств на покупку нескольких сотен дополнительных винтовок или артиллерийских орудий. Армия снова пытается прервать одну из наших сессий своими требованиями законов для решения проблем в армии. Эти законы накапливаются и отнимают политический капитал и средства у законов, которые мы хотим видеть принятыми, и мы могли бы сделать нечто, что может показаться радикальным: заблокировать их. Если мы заблокируем эти законы, мы можем обеспечить, чтобы парламентские сессии были сосредоточены на нашей повестке дня, а не на повестке военных. Мы также можем гарантировать, что наш бюджет останется здоровым, поскольку он уже напряжён из-за нашего расширения общественных услуг. Однако блокирование этих законов, несомненно, разозлит военных и может заставить короля видеть в нас угрозу национальной безопасности Австрии."
 ww1_austriahungary.187.a: "Кого волнует, что форту не хватает кроватей? Заблокируйте эти законы и сосредоточьтесь на благосостоянии народа!"
 ww1_austriahungary.187.b: "Они не просят ничего драматичного, не стоит ссориться. Пусть проходит"
