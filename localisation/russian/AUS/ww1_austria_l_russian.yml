 AUS_explain_formula_tt: "§LВенгрия также может влиять на отношения с меньшинствами. Чем ниже лояльность меньшинства, тем выше шанс коллапса.\n\nЛояльность хорватов, словенцев и сербов объединяется в общую южнославянскую лояльность.\n\nАвстрийские отношения с Боснией видны в дереве фокусов.§!"
