HOL_dc_ek:0 "Dutch Politics"
HOL_dc_ek_desc:0 "Dutch politics are divided between liberals, socialists, catholic, and conservative parties. As elections approach, each party attempts to convince citizens that their policies are best for moving the country foward.\n\n§1The Algemene Bond§! - Popularity: §Y[?HOL_variable_ag_popularity]§!\n§LA conservative alliance of aristocrats, monarchists, and traditional elites, the Algemene Bond seeks to preserve the authority of the monarchy, maintain social order, and defend Dutch values against the left.§!\n\n§CThe Anti-Revolutionaire Partij§! - Popularity: §Y[?HOL_variable_arp_popularity]§!\n§LFounded on Protestant Christian values, the Anti-Revolutionaire Partij opposes secularist politics. The party advocates religious education, social order, and a society guided by Christian principles and moral conservatism.§!\n\n§YThe Liberale Unie§! - Popularity: §Y[?HOL_variable_lu_popularity]§!\n§LPopular amongst the middle class, the Liberale Unie promotes centralist governance, free trade, and moderate economic reforms.§!\n\n§RThe Sociaal Democratische Arbeiderspartij§! - Popularity: §Y[?HOL_variable_sdap_popularity]§!\n§LThe SDAP supports socialism, feminism, labour protections, and social reform. Though divided between reformists and radicals, the party aims to reduce inequality and democratize the economy.§!" 
