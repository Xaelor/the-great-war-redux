### -- EVENTS -- ##
ww1_holland.1.t: "Failed Coup in Suriname!"
ww1_holland.1.d: "This morning, the 23rd of May, several police officers were arrested in Suriname. Their ringleader, Franz Killinger, was a police officer as of last month and conspired to coup the colonial government. He planned to install himself as President-Dictator and gain the support of the relevant Great Powers of the region in order to secure his rule. His plan had many working parts, almost all of which had a high chance of failing; and eventually one did. A former police-officer turned baker who was initially part of the plan had a change of heart after discussing the matter with his priest. He turned Killinger and several others into the police meaning that the coup was totally and utterly foiled."
ww1_holland.1.a: "How queer..."
ww1_holland.2.t: "The End of the Amsterdam Strikes"
ww1_holland.2.d: ""
ww1_holland.2.a: ""
ww1_holland.3.t: "A History of Dutch Economic Exeptionalism"
ww1_holland.3.d: ""
ww1_holland.3.a: ""
ww1_holland.4.t: "Queen Wilhelmina Announced the New Course"
ww1_holland.4.d: "After the victory of conservative forces in the Netherlands, parliament sided with the royal government. Queen Wilhelmina now has significant power in the country. European monarchs recognize that Wilhelmina has every chance of becoming the new Queen Victoria of this era."
ww1_holland.4.a: "She is a strong woman, no doubt."
ww1_holland.5.t: "[HOL.GetName] calls for the unification of States"
ww1_holland.5.d: "[HOL.GetLeader] calls on our government to join the federation of the United Provinces. Otherwise, the Netherlands will begin to independently unite Benelux by force."
ww1_holland.5.a: "This is a difficult decision, but we agree."
ww1_holland.5.b: "Irredentism will not bring to good."
ww1_holland.5.c: "Can we keep our autonomy?"
ww1_holland.6.t: "[FROM.GetName] refuses to unite under the Dutch flag"
ww1_holland.6.d: "[FROM.GetLeader] refuses to sacrifice independence in exchange for Benelux security. Well, our troops have been preparing for this for a long time."
ww1_holland.6.a: "Voor de Koningin en het Vaderland!"
ww1_holland.6.b: "We will be no match for them..."
ww1_holland.7.t: "[HOL.GetName] ask for Duinkerken"
ww1_holland.7.d: "[HOL.GetLeader] is calling for the transfer of Dunkirk and Pas de Calais, which belonged to the Flemings several centuries ago. Their government puts forward an ultimate demand, and if we refuse them, they will get a cause for war."
ww1_holland.7.a: "A small price for peace."
ww1_holland.7.b: "How dare they?"
ww1_holland.8.t: "[FROM.GetName] refuses to transfer Duinkerken"
ww1_holland.8.d: "Predictably, [FROM.GetLeader] refused to transfer Duinkerken and Pas de Calais, which belonged to the Flemings several centuries ago. Well, our troops have been preparing for this for a long time."
ww1_holland.8.a: "We will fight for our lost territories."
ww1_holland.8.b: "We will be no match for them..."
ww1_holland.9.t: "[HOL.GetName] ask for Colonies"
ww1_holland.9.d: "[HOL.GetLeader] is asking to transfer the colonies lost over the past century. This appeal may become an ultimutum from the Netherlands, if we do not agree, and they begin a colonial war."
ww1_holland.9.a: "We do not mind."
ww1_holland.9.b: "The Dutch Empire should not be reborn."
ww1_holland.10.t: "[FROM.GetName] refuses to transfer claimed colonies"
ww1_holland.10.d: "Predictably, [FROM.GetName] refused to transfer our lost colonies. We have territorial claims on our colonies and may push for war."
ww1_holland.10.a: "We will fight for our glory."
ww1_holland.10.b: "We will be no match for them..."
ww1_holland.11.t: "Aftermath of the Great War"
ww1_holland.11.d: "After fierce warfares between Germany and France, the victor of the Great War has been decided. The world order is vastly different from before, and the victorious faction have taken the lead. [ROOT.GetNameDefCap] managed to avoid the chaos of the war and maintain neutrality, but we also suffered indelible wounds from the war to end all wars."
ww1_holland.11.a: "At least we stand here."
ww1_holland.12.d: "The Dutch administration in the East Indies have failed to control their colonial provinces after the government is not able to send their support to maintain the far east property. The semi-independent rajas in local already recognise themself as total indepdent state, and we could save were only coastal areas in controll of Dutch and European citizens. Since those cities were europeanized enough they won't be fallen into local natives' hand, but also we can't restore the colonial control over there. Rather the states would be remain under something autonomous administration by colonial Dutch people."
ww1_holland.12.a: "No! That's only prosperous colony we have!"
ww1_holland.13.t: "Food Shortages!"
ww1_holland.13.d: "Food supplies in our country is running low due to the ongoing Great War where a blockade has been imposed on Europe to starve out Germany. This has effected us aswell and food supplies in our country is running low. People have begun getting disatisfied only time will tell how long this war will go on for..."
ww1_holland.13.a: "Something must be done!"
ww1_holland.14.t: "The Diamond Sector Gains the 8 Hour Work Day"
ww1_holland.14.d: "The ANDB, a union that represents workers of the diamond industry, has started celebrating the introduction of the 8 hour work day in its sector. Is is the first union inside the Netherlands that has been able to secure the 8 hour work day. This achievement inspires other unions to keep demonstrating for better working conditions."
ww1_holland.14.a: "The Syndicates Rule"
ww1_holland.15.t: "Welfare Pays Off"
ww1_holland.15.d: "Due to welfare reforms we have implemented, more people like our parties. This is great as elections are coming soon and we need all the popularity we can get."
ww1_holland.15.a: "Great"
ww1_holland.22.t: "Welfare Really Pays Off"
ww1_holland.22.d: "Due to welfare reforms we have implemented, more people like our parties. This is great as elections are coming soon and we need all the popularity we can get."
ww1_holland.22.a: "Thats amazing!"
ww1_holland.22.b: "Imagine how much reform other parties pass"
ww1_holland.16.t: "SDAP wins the 1913 Election"
ww1_holland.16.d: "The SDAP has won the 1913 elections, wow!"
ww1_holland.16.a: "Crazy"
ww1_holland.16.b: "Team up with the other progressive party"
ww1_holland.17.t: "Liberal Union wins the 1913 Election"
ww1_holland.17.d: "The Liberal Union has won the 1913 elections, wow!"
ww1_holland.17.a: "Crazy"
ww1_holland.17.b: "Team up with the other progressive party"
ww1_holland.18.t: "ARP wins the 1913 Election"
ww1_holland.18.d: "The ARP has won the 1913 elections, wow!"
ww1_holland.18.a: "Crazy"
ww1_holland.18.b: "Team up with the other conservative party"
ww1_holland.19.t: "ABRKK wins the 1913 Election"
ww1_holland.19.d: "The ABRKK has won the 1913 elections, wow!"
ww1_holland.19.a: "Crazy"
ww1_holland.19.b: "Team up with the other conservative party"
ww1_holland.23.t: "The Coastal Defence Plan Expands"
ww1_holland.23.d: "The Coastal Defence Plan is a project to expand, renovate or create forts at our coast. The project is very controversial as France perceives this as a threath and believe we are aligning ourselves with Germany. We can either choose to limit the project and satisfy France or we can ignore them."
ww1_holland.23.a: "Keep the Original Plan"
ww1_holland.23.b: "Limit the Project"
ww1_holland.24.t: "Belgium commits to our Trade Deal"
ww1_holland.24.d: "After our foreign minister and The Belgian foreign minister had a talk in Brussels, Belgium has come to the conclusion that it is in their best interest to expand trade with us."
ww1_holland.24.a: "Great!"
ww1_holland.25.t: "The Dutch have a conference with us"
ww1_holland.25.d: "The Dutch have contacted us to have a conference. They want us to discuss the relations between our countries and agree to an economic deal that will benefit all involved. Our foreign minister says he is ready to have talks in Brussels."
ww1_holland.25.a: "Accept"
ww1_holland.25.b: "Reject"
ww1_holland.26.t: "Belgium rejects our proposal"
ww1_holland.26.d: "The Belgian foreign minister send us a message that a conference will lead to nothing and is just a waste of time."
ww1_holland.26.a: "Really?"
ww1_holland.27.t: "Mobilisation"
ww1_holland.27.d: "European geopolitics is getting out of hand and tensions are rising. We are aware that a great war might happen between Germany and France. Our army knows of a German war plan to invade France which might result in an invasion of the Netherlands. Our army chief says it is in our best interests to start mobilisation to defend our indenpendence."
ww1_holland.28.t: "Belgium Accepts our Alliance"
ww1_holland.28.d: "Belgium, a country that is also aware of the dreaded Schlieffen plan, has agreed to our alliance."
ww1_holland.28.a: "Great"
ww1_holland.29.t: "The Effects of War"
ww1_holland.29.d: "So far we have been able to stay out of the war. But this is not the same for countries beyond our borders. Journalists have reported deadly weapons mowing down hundreds of men. This has discouraged our people even further to go to war and causes panic in border villages. Not only have our civilian population been panicking but Dutch corporations too. The economy is going down as trust in the market falls."
ww1_holland.29.a: "Why..."
ww1_holland.30.t: "Soldiers Unintentionally Cross into our Country"
ww1_holland.30.d: "Our border guards have reported some German and Belgian soldiers accidently crossing the border. The Hague conferences say we need to detain and intern those soldiers no matter if they are armed or not. We are considering building internment camps because this will probably not be the last time this happens."
ww1_holland.30.a: "Intern Them"
ww1_holland.31.t: "Guarantee Syndicate Formed"
ww1_holland.31.d: "Dutch banks have made agreements to work together to secure funding during this difficult period."
ww1_holland.31.a: "The Financial Sector is Secured"
ww1_holland.32.t: "Mass Migration Behind Innudation Lines"
ww1_holland.32.d: "Due to the war in Europe, civilians have started migrating behind innudation lines. They believe if an invasion happens that they will only be safe behind those lines."
ww1_holland.32.a: "Where are those inlanders coming from?"
ww1_holland.33.t: "Godsvrede"
ww1_holland.33.d: "The different parties in the parliament have decided to work together to ensure unity during this crisis. Much like the Union sacrée in France, all parties shall unanimously vote for whatever law needs to be passed."
ww1_holland.33.a: "Impossible..."
ww1_holland.34.t: "Entente Accuses us of Conspiring with Germans"
ww1_holland.34.d: "The Entente accuses us of letting Germans pass through the Maastricht region. They claim that there is no other way that the German army could have rushed through Belgium like how they are doing now. Our ambassadors report that we haven't let them through but convincing them otherwise is hard."
ww1_holland.34.a: "What have we done wrong?"
ww1_holland.35.t: "German Cavalry Detachment enters the Netherlands"
ww1_holland.35.d: "A whole cavalry detachment have accidently gone into Vaels, a city in south east Netherlands. After we communicated they were inside the Netherlands, they quickly retreated back to occupied Belgium."
ww1_holland.35.a: "Don't the roads make it clear already?"
ww1_holland.36.t: "Sailors Save British Seamen"
ww1_holland.36.d: "Dutch merchant sailors have found 114 British sailors drowning in the water. While we shouldn't interfere in the war, we still saved the drowning sailors. The sailors are now being put in internment camps."
ww1_holland.36.a: "They are lucky"
ww1_holland.37.t: "Wave of Belgian Refugees"
ww1_holland.37.d: "Due to the fighting in Belgium, over 1 million Belgians refugees entered our country. Our army are letting the refugees through the border but announce it is up to municipalities to take care of the Belgians."
ww1_holland.37.a: "Enjoy your stay"
ww1_holland.38.t: "Belgian Refugees Leave"
ww1_holland.38.d: "Now that the fighting is happening in France, Belgian refugees are returning to their homeland. This marks the end of the refugee crisis."
ww1_holland.38.a: "Thanks god"
ww1_holland.39.t: "Mass Internment of British & Belgian Soldiers"
ww1_holland.39.d: "After the siege of Antwerp, many British and Belgian soldiers had nowhere to go but to The Netherlands, leading to us interning thousands of soldiers."
ww1_holland.39.a: "More internees"
ww1_holland.40.t: "Dodendraad"
ww1_holland.40.d: "The Germans have told us that they are setting up electric wire along the whole Belgian-Dutch border to stop Belgian refugees and resistance members from going into the Netherlands. The local population have called the wire the Dodendraad (Dead wire)."
ww1_holland.40.a: "How are we supporting Belgian civilians now?"
ww1_holland.41.t: "Sinking of Tubantia"
ww1_holland.41.d: "A German U-boat has sunk a cruise ship called the 'Tubantia' that carried 294 crew members and 80 passengers. Fortunately, 3 Dutch ships close to the Tubantia were able to save all of the passengers and crew members."
ww1_holland.41.a: "Oh god"
ww1_holland.42.t: "The Netherlands Requests An Alliance"
ww1_holland.42.d: "The Netherlands has contacted us for a defensive alliance. We both know about the Schlieffen plan, a plan to invade France through the low countries. Our politicians however really want to be neutral and fear this breaks our neutrality."
ww1_holland.42.a: "Accept the Dutch alliance"
ww1_holland.42.b: "Reject the Dutch alliance"
ww1_holland.44.t: "Addresing the Elephant in The Room"
ww1_holland.44.d: "The Germans are at war with the French which means there is a chance the Schlieffen plan might be enacted. We already know about the Schlieffen plan which means an invasion of us, Belgium and Luxembourg. We could create an alliance with Belgium which means we are more prepared for a war but if the Germans only invade Belgium it means we will dragged into a war."
ww1_holland.44.a: "Better safe then sorry"
ww1_holland.44.b: "Stay with neutrality"
ww1_holland.45.t: "Germany invades our side"
ww1_holland.45.d: "We are joining the Great war on the side of the Entente after Germany declared war on our side."
ww1_holland.45.a: "Apa Apa"
ww1_holland.46.t: "The Entente invades our side"
ww1_holland.46.d: "We are joining the Great war on the side of the Central Powers after the Entente declared war on our side."
ww1_holland.46.a: "Apa Apa"
ww1_holland.50.t: "Rode Dinsdag"
ww1_holland.50.d: "20 000 protestors went to the streets of the Hague to protest for universal suffrage. It was a peacefull protest which the authorities allowed only if no paramilitaries were present. The protest comes after a petition signed by 300 000 people for universal suffrage was given to the domestic minister was ignored."
ww1_holland.50.a: "This cannot happen again, supress them"
ww1_holland.50.b: "Who cares about them"
ww1_holland.51.t: "Germany Invades us"
ww1_holland.51.d: "Germany, as part of the Schlieffen plan has invaded us, this leaves us no other choice but to join the Entente."
ww1_holland.51.a: "We will resist and fight"
ww1_holland.52.t: "The Netherlands Stands Victorious"
ww1_holland.52.d: "The German Empire has given up and we stand victorious over the Central Powers. We can restore civil liberties and send our ambassadors to Versailles."
ww1_holland.52.a: "Yippie"
ww1_holland.53.t: "200 Years of Dutch Indenpendence"
ww1_holland.53.d: "On this day, we celebrate 200 years since the occupation of our country by Napoleon and the creation of a new Dutch kingdom."
ww1_holland.53.a: "200 years of freedom"
ww1_holland.54.t: "Typographer Strike is Succesfull"
ww1_holland.54.d: "A typographer strike has forced bosses to accept their demands."
ww1_holland.54.a: "The socialists claim another victory"
ww1_holland.55.t: "Construction Funds 'Handwerkers Vriendenkring' Founded"
ww1_holland.55.d: "While the Jewish community in Amsterdam is rich, there always have been Jews that are homeless or live in houses with bad conditions. So Jews in Amsterdam have created a construction funds to make safe houses for the poorest of their community. Even though they are focused on providing housing for Jews, they also provide housing for other religions if possible."
ww1_holland.55.a: "Great"
ww1_holland.56.t: "Incident in Zeeland"
ww1_holland.56.d: "A Danish steamship called 'The Kursk' was headed for Saint Petersburg, when it was going along the coast of Zeeland, a storm hit them leading to the destruction of the ship and all 27 passengers drowning."
ww1_holland.56.a: "Rest in Peace"
ww1_holland.57.t: "Train Derailment Causes 5 Deads"
ww1_holland.57.d: "A train carrying 1200 passengers derailed a few minutes after passing Assen. The cause of the derailment is unknown. After the derailment happened, the red cross went to the incident, confirming 5 deads and sending a wounded passenger to the hospital."
ww1_holland.57.a: "Sad"
ww1_holland.58.t: "Palace of Peace Founded"
ww1_holland.58.d: "The Palace of Peace is a building financed by an American philantrophist to be a symbol of peace and the headquarters for the Permanent Court of Arbitration. Queen Wilhemina opened the building surrounded by journalists."
ww1_holland.58.a: "insert peace quote"
ww1_holland.59.t: "Christian Labor Union Splits"
ww1_holland.59.d: "The Catholic bishops in Vatican City have spoken and have commanded Catholics to not work together with other denominations when it comes to trade unions. This has led to Catholics leaving the CNV, a unified Christian labor union."
ww1_holland.59.a: "Pillarisation continues"
ww1_holland.60.t: "Troelstra Calls for Revolution"
ww1_holland.60.d: "Troelstra, after delivering a big list of demands for welfare and liberty, has called for a revolution, seeing it as the only path to socialism. followers of his have went to the street to pick up weapons or convince Marechaussee to side with them." 
ww1_holland.60.a: "Lets see what Holland thinks"
ww1_holland.61.t: "The Workers Stand Up"
ww1_holland.61.d: "The Dutch government was unable to give an effective response to leftist paramilitaries storming government buildings. This resulted in many politicians going into hiding, leaving the Netherlands or getting arrested. Members of the SDAP, SDP and NVV have all declared that Troelstra shall lead an interim government until the real government can be decided. Soldiers are encouraged to demobilise and give up their guns and efforts are underway to integrate the Marechaussee into a new police force."
ww1_holland.61.a: "The Domino Effect..."
ww1_holland.62.t: "Troelstra's Mistake"
ww1_holland.62.d: "Following Troelstra's call for a revolution, the government acted quickly. They mobilised the police and Marechaussee to put down any protests and arrest armed paramilitary members. Troelstra, realising that the revolution has failed, quickly retracted his statements in favor of revolution and called it a mistake."
ww1_holland.62.a: "Are we for real?"
ww1_holland.63.t: "Who Shall Lead The Left?"
ww1_holland.63.d: "The SDAP and SDP were united by their mutual hatred for the old establishment. But now that its gone, it's hard to stay united. Both parties are now trying to decide which party should lead the revolution."
ww1_holland.63.a: "Lets hope this doesn't turn bloody"
ww1_holland.64.t: "Moderates Keep The Left Clean"
ww1_holland.64.d: "The moderates were able to make the SDP give up power and grant it to them. Many believe this is the road to the end of violence and a better republic."
ww1_holland.64.a: "Thanks god"
ww1_holland.65.t: "Extremists Take Power of The Revolution"
ww1_holland.65.d: "The extremists were able to intimidate the SDAP and made them grant power to them. The SDP is less reluctant to work with corporations and believes the right shouldn't have any say in politics. Many believe that these extreme views will lead to a surge in violence."
ww1_holland.65.a: "Oh God"
ww1_holland.66.t: "Conscription in Communist Holland"
ww1_holland.66.d: "While one of the principles of the left is demobilisation and less spending on the military, many see it as a requirement to defend the republic from foreign opponements or even domestic opponements."
ww1_holland.66.a: "Conditions justify the laws"
ww1_holland.66.b: "We must stick to our promises"
ww1_holland.67.t: "The Two Wings of The ARP"
ww1_holland.67.d: "Ever since the rise of Heemskerk's power within the Anti Revolutionary Party, things have not been easy. Kuyper, the founder of the party calls Heemskerk way too soft and thinks he is unfit to rule. Heemskerk along with other members of the party think Kuyper reduces the reputation of the party and should stop leading the party. Now that the ARP won elections, the party needs to decide which side will rule."
ww1_holland.67.a: "Kuyper"
ww1_holland.67.b: "Heemskerk"
ww1_holland.68.t: "Investors Agree to Invest"
ww1_holland.68.d: "The CHU has convinced foreign investors to put their money into the Dutch economy."
ww1_holland.68.a: "Great decision"
ww1_holland.69.t: "Investors Refuse to Invest"
ww1_holland.69.d: "The CHU has failed to convince investors to boost the Dutch economy"
ww1_holland.69.a: "God Dammit"
ww1_holland.70.t: "CHU invites Investors"
ww1_holland.70.t: "The CHU consists of many businessmen that will use their connections to convince people to invest into the economy."
ww1_holland.70.a: "Lets make a pitch"
ww1_holland.71.t: "The First Dutch Communist Election"
ww1_holland.71.d: "The SDP has announced elections with only leftist parties being allowed. Many believe this election is being held to back up their legitemacy as the government of The Netherlands."
ww1_holland.71.a: "And the winner is..."
ww1_holland.72.t: "Communists Win Election"
ww1_holland.72.d: "The election results have been released and the SDP claims victory."
ww1_holland.72.a: "Congrats"
ww1_holland.73.t: "Communists Lose Election"
ww1_holland.73.d: "The elections are done but the SDP refuses to release election results. Many believe the reason is because they lost the elections and are now trying to cover it up. Opponements that ask for election results are silenced."
ww1_holland.73.a: "How do they fail at democracy?"
ww1_holland.74.t: "Opponements Call Out Election Fraud"
ww1_holland.74.d: "The SDP has released results claiming they won the election but popular opponements call the SDP out for election fraud. This resulted in outrage among the population, which makes the counterrevolution stronger."
ww1_holland.74.a: "What Fraud?"
ww1_holland.75.t: "Snijders Creates a Counterrevolution"
ww1_holland.75.d: "A Dutch general called Snijders has started a rebellion against our government. Snijders is a general that is popular within nationalist and far right circles. The right disagrees with us and think we should have no place in the Netherlands."
ww1_holland.75.a: "Put them down"
ww1_holland.76.t: "Germany Supports the Counterrevolution"
ww1_holland.76.d: "Reports have emerged of weapon shipments meant for the counterrevolution are coming from Germany."
ww1_holland.76.a: "Don't they have bigger problems?"
ww1_holland.77.t: "Snijders Takes Gelderland"
ww1_holland.77.d: "Snijders counterrevolution has taken control of the Gelderland region. They managed to dislodge our army and take over urban centers."
ww1_holland.77.a: "What the hell?"
ww1_holland.78.t: "Snijders Takes Friesland"
ww1_holland.78.d: "Snijders counterrevolution has taken control of the Friesland region. They managed to dislodge our army and take over urban centers."
ww1_holland.78.a: "What the hell?"
ww1_holland.79.t: "Snijders Takes Holland"
ww1_holland.79.d: "Snijders counterrevolution has taken control of the Holland region. They managed to dislodge our army and take over urban centers."
ww1_holland.79.a: "What the hell?"
ww1_holland.80.t: "Snijders Takes Brabant"
ww1_holland.80.d: "Snijders counterrevolution has taken control of the Brabant region. They managed to dislodge our army and take over urban centers."
ww1_holland.80.a: "What the hell?"
ww1_holland.81.t: "Revolutionaries Liberate Brabant"
ww1_holland.81.d: "Our army was able to take back Brabant from Snijders militia."
ww1_holland.81.a: "Hurrah!"
ww1_holland.82.t: "Revolutionaries Liberate Friesland"
ww1_holland.82.d: "Our army was able to take back Friesland from Snijders militia."
ww1_holland.82.a: "Hurrah!"
ww1_holland.83.t: "Revolutionaries Liberate Holland"
ww1_holland.83.d: "Our army was able to take back Holland from Snijders militia."
ww1_holland.83.a: "Hurrah!"
ww1_holland.84.t: "Revolutionaries Liberate Gelderland"
ww1_holland.84.d: "Our army was able to take back Gelderland from Snijders militia."
ww1_holland.84.a: "Hurrah!"
ww1_holland.85.t: "Snijders Revolt Crushed"
ww1_holland.85.d: "Now that Snijders militia is weak, we should do a final operation to catch Snijders or atleast force him to leave the Netherlands."
ww1_holland.85.a: "Bye Bye Snijders"
ww1_holland.86.t: "Snijders Takes Control"
ww1_holland.86.d: "Snijders, after managing to take over all Dutch regions, arrests the communist government and claims control of the Netherlands. He installs himself as the interim leader of a military government."
ww1_holland.86.a: "Liberty or just a new leader?"
ww1_holland.87.t: "Coastal Defence Plan Strenghtened"
ww1_holland.87.d: "The cabinet has decided to ignore French pressure and strenghten the current coastal defence plan."
ww1_holland.87.a: "Take that France"
ww1_holland.88.t: "Coastal Defence Plan Restricted"
ww1_holland.88.d: "The cabinet has decided to restrict the coastal defence plan to the wishes of France."
ww1_holland.88.a: "Happy now?"
ww1_holland.89.t: "Meet With Germany"
ww1_holland.89.d: "Tensions are rising in Europe and we might be dragged into a war unprepared. So cabinet members and generals have proposed we join the Central Powers to stand a better chance."
ww1_holland.89.a: "Here we go"
ww1_holland.89.b: "We're a neutral country"
ww1_holland.90.t: "Netherlands Wants to Join the Central Powers"
ww1_holland.90.d: "The Dutch government has contacted us to join our faction."
ww1_holland.90.a: "Why not?"
ww1_holland.90.b: "No"
ww1_holland.91.t: "Germany Rejects our Request"
ww1_holland.91.d: "The German government told us they don't accept our request."
ww1_holland.91.a: "Sad"
ww1_holland.103.t: "Germany Accepts our Request"
ww1_holland.103.d: "The German government responded positivly to our request to join the Central Powers."
ww1_holland.103.a: "Yay"
ww1_holland.92.t: "The Netherlands wants to join the Entente"
ww1_holland.92.d: "The Dutch feel like they're in danger and decided the best course of action is to join the Entente."
ww1_holland.92.a: "We accept ofcourse"
ww1_holland.93.t: "The Netherlands wants to join the Central Powers"
ww1_holland.93.d: "The Dutch feel like they're in danger and decided the best course of action is to join the Central Powers."
ww1_holland.93.a: "We accept ofcourse"
ww1_holland.94.t: "France Lets us into the Entente"
ww1_holland.94.d: "France has accepted our request to join the Entente."
ww1_holland.94.a: "Yay war!"
ww1_holland.95.t: "Germany Lets us into the Central Powers"
ww1_holland.95.d: "Germany has accepted our request to join the Central Powers."
ww1_holland.95.a: "Yay war!"
ww1_holland.96.t: "Potato Protest"
ww1_holland.96.d: "Due to a mismanagement in food distribution, some people in Amsterdam were starving. In desperation they started rioting and looting Amsterdam."
ww1_holland.96.a: "Why..."
ww1_holland.97.t: "Harskamp Protest"
ww1_holland.97.d: "Soldiers in a military base called 'Harskamp' are unhappy with their conditions and the harsh laws that are imposed on them. They have burned down the base and have held officers at gunpoint. Military police was able to subdue them but this has inspired soldiers elsewhere to protest."
ww1_holland.97.a: "Stay calm"
ww1_holland.98.t: "Snow Protests"
ww1_holland.98.d: "Many people need jobs and the local government in Groningen won't give them jobs leading to protests."
ww1_holland.98.a: "God dammit"
ww1_holland.99.t: "Germany invades us"
ww1_holland.99.d: "German forces have attacked the Netherlands. Some call for surrender but the current cabinet is deadset on defending."
ww1_holland.99.a: "Clock your gun and sharpen your knives"
ww1_holland.100.t: "Snijders coups the Government"
ww1_holland.100.d: "Army Chief Snijders thinks that resistance to the Germans is futile, which is the opposite of what the government thinks. He believes the future of the Netherlands is in danger unless he takes over and sides with Germany."
ww1_holland.100.a: "One who saves his country breaks no rules"
ww1_holland.101.t: "Wilhelmina Escapes the Netherlands"
ww1_holland.101.d: "Queen Wilhelmina fears for her life and decided to leave the Netherlands. The communist government hates the idea of a monarchy and had an arrest warrant for the royal family."
ww1_holland.101.a: "The start of a republic?"
ww1_holland.102.t: "Wilhelm Seeks Refuge"
ww1_holland.102.d: "Wilhelm, after losing his country to the Entente, seeks refuge inside the Netherlands. People are unsure if Wilhelmina had to do anything with him finding refuge inside the Netherlands, some believe it because he met with Wilhelmina alot in the final months of the war. The government refuses Entente requests to extradite him and have given him refugee status."
ww1_holland.102.a: "Who's the coward now?"
ww1_holland.118.t: "[HOL.GetName] invites us to their faction"
ww1_holland.118.d: "[ITA.GetName] wants us to join their communist alliance."
ww1_holland.118.a: "Alright"
ww1_holland.118.b: "No"
ww1_holland.104.t: "[FROM.GetName] accepts invitation"
ww1_holland.104.d: "[FROM.GetName] has decided to join our alliance"
ww1_holland.104.a: "Great"
ww1_holland.105.t: "[FROM.GetName] rejects invitation"
ww1_holland.105.d: "[FROM.GetName] doesn't want to join our alliance."
ww1_holland.105.a: "Sad"
ww1_holland.106.t: "The Netherlands wants to join our alliance"
ww1_holland.106.d: "The Netherlands, a fellow communist country, wants to join our alliance."
ww1_holland.106.a: "Great"
ww1_holland.106.b: "Nah"
ww1_holland.107.t: "Italy accepted us"
ww1_holland.107.d: "Italy welcomes us into their communist alliance."
ww1_holland.107.a: "Nice"
ww1_holland.108.t: "Italy rejects our request"
ww1_holland.108.d: "Italy has rejected our request to enter their alliance."
ww1_holland.108.a: "Sad"
ww1_holland.109.t: "Netherlands Recognises Us"
ww1_holland.109.d: "The Netherlands is among the first countries to recognise us as the legitemate government over the Tsarist one. They have started supporting communist movements worldwide after they had a revolution."
ww1_holland.109.a: "Thanks"
ww1_holland.110.t: "[HOL.GetName] Asks for Investment"
ww1_holland.110.d: "The Communists inside the Netherlands have asked us if we can invest into their country."
ww1_holland.110.a: "Great relations are vital"
ww1_holland.110.b: "With communists? Ofcourse not"
ww1_holland.111.t: "[FROM.GetName] invests into us"
ww1_holland.111.d: "[FROM.GetName] has decided to invest into our country."
ww1_holland.111.a: "Thank you, come again"
ww1_holland.112.t: "[FROM.GetName] Refuses to invest"
ww1_holland.112.t: "[FROM.GetName] doesn't want to invest into us because we are communist."
ww1_holland.112.t: "Sad"
ww1_holland.113.t: "Communist Netherlands wishes to join the Entente"
ww1_holland.113.d: "The Netherlands, now under a communist regime, wishes to become closer to us and thus join the Entente."
ww1_holland.113.a: "Okay"
ww1_holland.113.b: "What? No!"
ww1_holland.114.t: "We are accepted into Entente"
ww1_holland.114.d: "They have accepted us into the Entente"
ww1_holland.114.a: "Nice"
ww1_holland.115.t: "Our request was denied"
ww1_holland.115.d: "The Entente doesn't want us to join them."
ww1_holland.115.a: "Sad"
ww1_holland.116.t: "Frontbeweging insurrection"
ww1_holland.116.d: "The Frontbeweging has been arming itself and are threathening police and local governments."
ww1_holland.116.a: "What?"
ww1_holland.117.t: "The Netherlands grabs Flanders"
ww1_holland.117.d: "The Netherlands claims to back the Flemish rebels and has taken over Flanders to protect the region."
ww1_holland.117.a: "We can't do anything about it..."
ww1_holland.117.b: "This is war!"
ww1_holland.119.t: "Heilig Landstichting Founded"
ww1_holland.119.d: "A museum called The Heilig Landstichting opened, it was made by Catholics. The museum was made to show the life and death of Jesus Christ."
ww1_holland.119.a: "A great project by Catholics"
ww1_holland.119.b: "Just straight up propoganda"
ww1_holland.120.t: "Christians lose in Amsterdam"
ww1_holland.120.d: "Religious parties have been losing their grip over Amsterdam due to the influx of newer more progressive minded cizitsens. Many of the newcomers vote for the liberal or socialist party."
ww1_holland.120.a: "The Answer is Liberalism"
ww1_holland.120.b: "The Answer is Socialism"
ww1_holland.120.c: "Amsterdam isn't that important anyways..."
ww1_holland.121.t: "CHU Defence against Liberalism"
ww1_holland.121.d: "The liberals have been increasing their popularity in CHU (Protestant) districts. The CHU wages a propoganda battle to defend the districts but many believe a yellow wave is headed for the Netherlands."
ww1_holland.121.a: "The Liberals reign Supreme"
ww1_holland.121.b: "The CHU holds their Position"
ww1_holland.122.t: "The SDAP attacks Weak Liberal Factions"
ww1_holland.122.d: "While the Liberals were hoping the socialists would cooperate with them against religious parties, the socialists do not care. The socialists seek to expand their influence in districts led by small liberal factions so that they can intimidate them."
ww1_holland.122.a: "Yay Socialism"
ww1_holland.122.b: "The Liberals Hold"
ww1_holland.123.t: "Catholic South stays Loyal"
ww1_holland.123.d: "For years, parties have been trying to influence southern districts. This has been a failure since the southern districts are incredibly loyal to the Catholic party. Even though the Catholic party gets marginalised by the current political system, they come on top almost every election because of their loyal districts."
ww1_holland.123.a: "Loyalty."
ww1_holland.123.b: "The Parties will breakthrough eventually"
ww1_holland.124.t: "VDB Loyalties"
ww1_holland.124.d: "The VDB is a liberal faction that broke away from the Liberal Union because they believed that they weren't progressive enough. The VDB knows that it won't be able to win alone so they are choosing to work together with the SDAP or the LU."
ww1_holland.124.a: "They side with the SDAP"
ww1_holland.124.b: "They side with the LU"
ww1_holland.125.t: "The Dutch Government falls"
ww1_holland.125.d: "The Dutch government was couped by their army chief. His name is Snijders and he wants to side the Netherlands with Germany."
ww1_holland.125.a: "Your welcome here!"
ww1_holland.126.t: "A Debate in The Kamers"
ww1_holland.126.d: "The elections are close and all parties are calling each other out for what they see is wrong. You only get this event if atleast 2 parties tie each other. The game literally breaks if that happens. This will hopefully force you to make a faction win. If your game breaks thats on you ngl. This is a placeholder btw."
ww1_holland.126.a: "The Liberals come out on Top"
ww1_holland.126.b: "The Socialists come out on Top"
ww1_holland.126.c: "The Catholics come out on Top"
ww1_holland.126.d: "The Protestants come out on Top"
ww1_holland.127.t: "Kuyper Found Not Guilty"
ww1_holland.127.d: "In 1909, Kuyper, the founder and leader of the Anti Revolutionaire Partij got accused of corruption. The trail has dragged on until now, and after a long investigation. Kuyper was found not guilty."
ww1_holland.127.a: "The ARP always Wins"
ww1_holland.127.b: "They paid off the Judge!"
ww1_holland.128.t: "Fraction Leader Nolens"
ww1_holland.128.d: "Nolens became the leader of the Catholic fraction of the second kamer, many found him a good pick due to him being a priest with deep connections to Southern workers."
ww1_holland.128.a: "He was a Great Pick"
ww1_holland.128.b: "He sucks"
#ww1_holland.129.t: "Dutch Politics"
#ww1_holland.129.d: "The Netherlands has alot of parties but they can be sorted into 4 factions.\nYou have the Socialists, they prioritise the welfare of the people. 2 Parties identify with this ideology, the moderate SDAP and the more extreme SDP which broke away from the SDAP in 1909.\nYou have the Liberals, they support the freedom of the individual and the protection of their rights. The faction has 3 parties, the large Liberale Unie, and the smaller VDB and BVL.\nYou have the Protestants, that want to impose their values on the Netherlands, they also have close ties to the Queen. There are 2 protestant parties, the large Anti Revolutionaire Partij and the smaller CHU.\nAt last you have the Catholics, they want to impose their Catholic beliefs on the Netherlands. their party was created in 1904 and they are marginalised. There is only 1 Catholic party called the Algemeene Bond. "
#ww1_holland.129.a: "Interesting..."
ww1_holland.130.t: "Goeman Dies"
ww1_holland.129.d: "Hendrik Goeman Borgasius, a prominent politician in the Liberale Unie, dies at the age of 70."
ww1_holland.130.a: "Sad"
ww1_holland.131.t: "SDAP wins the 1917 Election"
ww1_holland.131.d: "The SDAP has won the 1917 elections, wow!"
ww1_holland.131.a: "Crazy"
ww1_holland.132.t: "Liberal Union wins the 1917 Election"
ww1_holland.132.d: "The Liberal Union has won the 1917 elections, wow!"
ww1_holland.132.a: "Crazy"
ww1_holland.133.t: "ARP wins the 1917 Election"
ww1_holland.133.d: "The ARP has won the 1917 elections, wow!"
ww1_holland.133.a: "Crazy"
ww1_holland.134.t: "ABRKK wins the 1917 Election"
ww1_holland.134.d: "The ABRKK has won the 1917 elections, wow!"
ww1_holland.134.a: "Crazy"
ww1_holland.135.t: "Wilhelmina Wants a Strong Cabinet"
ww1_holland.135.d: "Wilhelmina has recently been getting into politics, critisizing whoever opposes her. With the new elections, she wants the next cabinet to be loyal and respect her wishes otherwise she will take action."
ww1_holland.135.a: "It isn't that deep..."
ww1_holland.136.t: "Wilhelmina Sacks Government"
ww1_holland.136.d: "Wilhelmina has announced that the cabinet is way too weak to represent the Netherlands and has appointed another party to represent the Netherlands."
ww1_holland.136.a: "She can do that?"
ww1_holland.141.t: "Netherlands runs out of food"
ww1_holland.141.d: "The Netherlands is unable to supply their population with food anymore which leads to famine."
ww1_holland.141.a: "No..."
kis_news.143.t: "Failed Socialist Revolution in the Netherlands"
kis_news.143.d: "News from the Netherlands has came out detailing a failed attempt to start a socialist revolution, after a week of chaos. The failed revolution comes a result of the ongoing food shortage in the Netherlands, as well as the dramatic rise of unemployment and poverty in the nation in the past few years. With the nation suffering, socialists decided to take their chance, calling upon massive protests in the nation. Dutch police were quick to reinforce cities facing mass protests with police officers, however, who swiftly rounded up and arrested socialist agitators. Either way, the failed revolt has caused panic amongst Western European governments, who have previously assumed there was little chance at revolt in their nations."
kis_news.143.a: "Will the revolution spread to Western Europe?"
