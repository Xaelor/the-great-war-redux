#events
ww1_indonesia.1.t: "Investors Confidence"
ww1_indonesia.1.d: "Investors have looked at this years results and have decided their next moves within the the Dutch East Indies."
ww1_indonesia.1.a: "Lets see their choice"
ww1_indonesia.2.t: "Foreign Investment brings Foreign Expertise"
ww1_indonesia.2.d: "Insert great description"
ww1_indonesia.2.a: "Great"
ww1_indonesia.3.t: "The [INS.Getname] Wants to Annex Us"
ww1_indonesia.3.d: "The [INS.Getname] has asked us to sign a korte verklaring, which will take away our power and lets Dutch administrators control our territories."
ww1_indonesia.3.a: "We stand no chance"
ww1_indonesia.3.b: "We will never surrender!"
ww1_indonesia.4.t: "[INS.GetName] Informs us of their Claims"
ww1_indonesia.4.d: "An official of [INS.GetName] has approached us to inform us of their claims in Papua. They say they claim all of our land and if we choose to submit, they will let the king be a figurehead."
ww1_indonesia.4.a: "Abandon the Kingdom"
ww1_indonesia.4.b: "We shall Survive!"
ww1_indonesia.5.t: "Idenburg Considers Resigning"
ww1_indonesia.5.d: "Due to the results of the Dutch election, Idenburg isn't confident in governing the Dutch East Indies anymore. He believes the new minister of colonies might become someone that opposes his policies.
ww1_indonesia.5.a: "He Chooses to Stay"
ww1_indonesia.5.b: "He Chooses to Resign"
ww1_indonesia.7.t: "Slow Progress in Kalimantan"
ww1_indonesia.7.d: "The Rhenish Missionary Society has had trouble converting the people of Kalimantan to Christianity. This society had a succesfull campaign in Sumatra, where they converted over 100 thousand people. While in Kalimantan they have only converted 3 thousand people. The society is unsure if they should continue their operations in Kalimantan or cut their losses."
ww1_indonesia.7.a: "Cut their losses"
ww1_indonesia.7.b: "Continue operations"
ww1_indonesia.8.t: "Status of Bali"
ww1_indonesia.8.d: "Bali has been a region that has historicly been very resistant against Christian missionaries. Any mission in the past has come back with no result. For this reason the governor has closed Bali from Missionaries. A lot of missionaries still request acces to the island. We can either allow them or keep the island closed."
ww1_indonesia.8.a: "keep it Closed"
ww1_indonesia.8.b: "Allow Missionaries"
ww1_indonesia.9.t: "First seminary in the Indies"
ww1_indonesia.9.d: "The first seminary has been established in the Indies. The seminary is called the 'Peter Canisius Minor Seminary Mertoyudan' seminary. The seminary is located in Magelang, in central Java. As of now 2 natives have been appointed as teachers and the seminary is owned by Frans van Lith, a jesuit."
ww1_indonesia.9.a: "This is great for Christianity"
ww1_indonesia.10.t: "Mass Exodus of Riau-Linggan citizens to Johor"
ww1_indonesia.10.d: "After the Dutch laid siege to Riau-Lingga's parliament, many citizens of Riau-Lingga have decided to take refuge from the Dutch takeover in Johor."
ww1_indonesia.10.a: "Welcome"
ww1_indonesia.11.t: "Policy on Sarekat Islam"
ww1_indonesia.11.d: "The time has come, we must make a decision on the Sarekat Islam. We could finnaly give them the recognition they have been asking for. This would satisfy them but also make them grow alot which would scare European or Chinese merchants. We could alternativly make use of the decentralised position the SI is in. The SI has a central leadership in Surakarta but they don't really have power outside of that city. If we just make the branches isolate themselves from the central leadership in Surakarta and make them cut off ties with the rest of the other branches, we would have broken the SI and made the central leadership weak which in turn would make them more dependent on us."
ww1_indonesia.11.a: "Recognise the Surakarta SI"
ww1_indonesia.11.b: "Isolate SI branches and weaken the Surakarta SI"
ww1_indonesia.12.t: "Hajj Season Starts"
ww1_indonesia.12.d: "Hajj is just around the corner, meaning thousands of Indonesians are going to Mecca to peform their religious duty."
ww1_indonesia.12.a: "Don't come back with revolutionary ideas"
ww1_indonesia.13.t: "Decision on Muhammadiyah"
ww1_indonesia.13.d: "Muhammadiyah is an organisation which primarily focuses on religious practice and the establishment of schools. They seem to have no desire in actual politics."
ww1_indonesia.13.a: "Crush them anyways"
ww1_indonesia.13.b: "We can tolerate them"
ww1_indonesia.14.t: "Tirto Adhi Soerjo Exiled"
ww1_indonesia.14.d: "Tirto Adhi Soerjo was the owner of the newspaper Medan Prijaji, a popular newspaper which was popular in Java and critical of our regime. For this anti regime propoganda, he has been exiled to the island of Bacan."
ww1_indonesia.14.a: "Another threath gone"
ww1_indonesia.15.t: "Medan Prijaji moves to Java"
ww1_indonesia.15.d: "The Medan Prijaji, a newspaper owned by Tirto Adhi Soerjo, has moved to Bandung, Java. The newspaper is in written in Malay and is full of anti colonial rhetoric. The newspaper is supported by many prijaji and Chinese backers but the owner, Tirto Adhi Soerjo, aligns more with Islamic movements."
ww1_indonesia.15.a: "Unacceptable"
ww1_indonesia.16.t: "Plague Arrives in Java"
ww1_indonesia.16.d: "The bubonic plague has arrived in Java and is killing civilians extremely fast. The infection arrived from grain imported from Burma. We are able to contain the infection with the help of local doctors. One of the docters is called Cipto Mangunkusomo, a figurehead within Budi Utomo. If we award him for his efforts, we might get loyalty from that faction."
ww1_indonesia.16.a: "Award him"
ww1_indonesia.16.b: "He Merely did his Job"
ww1_indonesia.17.t: "Sarekat Islam Forms"
ww1_indonesia.17.d: "The Sarekat Islam is an organisation made up of Islamic merchants in Surakarta. After the riots in Java, the government started investigating a group called Rekso Roemekso. Rekso Roemekso found out that the government was investigating them and realised that if they weren't a legal organisation, the government could clamp down on them. So the organisation quickly scrambled to make a statute. They call themselves the Sarekat Islam, inspired by the Sarekat Dagang Islam of Bogor, which they claimed they were tied to."
ww1_indonesia.17.a: "Woah"
ww1_indonesia.18.t: "Sarekat Islam begins Expanding"
ww1_indonesia.18.d: "The Sarekat Islam is done restructurting and is now expanding out of Surakarta. They are planning to create decentralised branches in other cities."
ww1_indonesia.18.a: "We Might have to Stop Them"
ww1_indonesia.19.t: "Sarekat Islam Restructuring"
ww1_indonesia.19.d: "The Sarekat Islam is restructuring their organisation, creating ranks and making plans for eventual expansion. They are also finding out ways to deal with a major problem they suffer from. Most of the Sarekat Islam consists of middle and lower class natives which are illiterate. To deal with this problem they have created sign language and use colors to convey tasks."
ww1_indonesia.19.a: "Creative"
ww1_indonesia.20.t: "Unrest in Java"
ww1_indonesia.20.d: "Street fighting between the Kong Sing, an Indo Chinese organisation and the Rekso Roemekso, an Islamic organisation, has been escalating. The fighting has been scaring away business and is destabilising the region."
ww1_indonesia.20.a: "Just get along!"
ww1_indonesia.21.t: "Growing SI Scares Colonialists"
ww1_indonesia.21.d: "The Sarekat Islam has been growing bigger than what the government and colonial elite has been expecting. While the Sarekat Islam never has stated that they are for indenpendence, the colonialists believe that they may be planning to work with the revolutionary Indische Partij."
ww1_indonesia.21.a: "Suspend them for Now"
ww1_indonesia.22.t: "Sarekat Islam Grows"
ww1_indonesia.22.d: "While the Sarekat Islam was suspended, the leaders took time to look at their organisation and make plans to expand it to the rest of Java. They plan to make as many branches as possible in every city."
ww1_indonesia.22.a: "Oh God"
ww1_indonesia.23.t: "Newspaper Saritomo Founded"
ww1_indonesia.23.d: "One of the Sarekat Islam objectives is to create their own newspaper, which they have now completed. They call it Saritomo."
ww1_indonesia.23.a: "Wow"
ww1_indonesia.24.t: "SI Branches Create New Newspapers"
ww1_indonesia.24.d: "The new Sarekat Islam branches that have been formed have been making their own newspapers, seperate from Saritomo. Oetoesan Hindia was popular in Surabaya, Sinar Djiwa was popular in Semerang, Kaoem Moeda in Bandung and Fantjaran Warta in Batavia."
ww1_indonesia.24.a: "Is the CSI losing their grip?"
ww1_indonesia.25.t: "Grand SI Rally"
ww1_indonesia.25.d: "Sarekat Islam has rallied over 10 thousand people in Surabaya. Rallies are very rare in Insulandia, especially one of this size."
ww1_indonesia.25.a: "What!?"
ww1_indonesia.27.t: "Status of Sarekat Islam"
ww1_indonesia.27.d: "The Sarekat Islam is currently suspended but the people behind it have been rewriting the statutes to make it clear that they are not against the colonial government. It would be unreasonable to keep them suspended."
ww1_indonesia.27.a: "What could possibly go wrong?"
ww1_indonesia.26.t: "First SI Congress"
ww1_indonesia.26.d: "The first congress of the Sarekat Islam is being held. The discussion at hand is who will be the new leader, Expansion outside of the Islamic world of Java, and the structure of the 3 SI departments. Colonial officials are also seen present."
ww1_indonesia.26.a: "Lets decide the Leader"
ww1_indonesia.28.t: "Leadership of SI"
ww1_indonesia.28.d: "The Sarekat Islam has many important members, but the one that has risen among other members if a man called Tjokroaminoto."
ww1_indonesia.28.a: "Tjokroaminoto it is!"
ww1_indonesia.29.t: "SI Congress Ends"
ww1_indonesia.29.d: "The SI has made their decisions on the important subjects and thus the congress has ended."
ww1_indonesia.29.a: "See you next time"
ww1_indonesia.30.t: "Tjokroaminoto Rewrites SI Statutes"
ww1_indonesia.30.d: "Tjokroaminoto has been working on rewriting the statutes of the Sarekat Islam. He is planning to turn SI branches into local SI's. Which means abolishing the 3 departments and making all of the local SI directly under CSI rule. He has been having trouble making the new statutes and some guidance from a colonial servant might help."
ww1_indonesia.30.a: "Send Rinkes to Help him"
ww1_indonesia.30.b: "Let him be"
ww1_indonesia.31.t: "Second SI Congress"
ww1_indonesia.31.d: "Tjokroaminoto has released his new statutes he has been making. From now on SI branches will turn into local SI's, which means they are directly under CSI control instead of department control. Local SI will pay a lower contribution but it will go directly to CSI now which means the CSI will earn more short term. All of these statutes are announced at the second SI congress which Tjokroaminoto has organised."
ww1_indonesia.31.a: "There goes factionalism"
ww1_indonesia.32.t: "Muhammadiyah Founded"
ww1_indonesia.32.d: "Muhammadiyah is an organisation founded in response to the rise of Christian missionaries. It is an NGO started by Ahmad Dahlan in Yogyakarta. They describe themselves as a reformist socioreligious movement. They work on education and the spread of their religious beliefs."
ww1_indonesia.32.a: "So they don't hate us?"
ww1_indonesia.33.t: "Medan Mouslimin Founded"
ww1_indonesia.33.d: "Medan Mouslimin is a newspaper founded by Sarekat Islam members to combat the newspaper 'Mardi Rahardjo', established by Christian missionaries."
ww1_indonesia.33.a: "Why resist?"
ww1_indonesia.34.t: "IJB Formed"
ww1_indonesia.34.d: "The IJB, also known as the League of Native Journalists, has been established in Surakarta. It is an organisation consisting of native journalists, they write articles about the social, economic and political situation of the Dutch East Indies."
ww1_indonesia.34.a: "What did we do wrong?"
ww1_indonesia.35.t: "Marco's 'War of Voice'"
ww1_indonesia.35.d: "Marco Kartodikromo has started what he calls a 'war of voice'. He has been using the newspaper Doenia Bergerak, a newspaper owned by the IJB, to protest and critisize the government. He began by critisizing the head of the Department of Native Affairs Douwe Adolf Rinkes. He compared himself with him, Rinkes being an educated man but not knowing what the natives really want while he is an uneducated man but who really knows what the natives want."
ww1_indonesia.35.a: "We Must Take Action"
ww1_indonesia.36.t: "ISDV & Insulinde Protest Marco's Arrest"
ww1_indonesia.36.d: "Marco Kartodikromo has been apprehended by colonial authorities and has been sentenced to Semerang prison for 7 months. The ISDV and Insulinde have both protested the action."
ww1_indonesia.36.a: "Shut up for once!"
ww1_indonesia.37.t: "Dutch Communist Moves to [INS.Getname]"
ww1_indonesia.37.d: "A Dutch marxist called Henk Sneevliet has moved to our country. He has already joined a newspaper called Soerabajaasch Handelsblad where he spreads his rhetoric."
ww1_indonesia.37.a: "Communists in our country? Never!"
ww1_indonesia.38.t: "Henk Sneevliet Becomes Owner of Volharding"
ww1_indonesia.38.d: "Henk Sneevliet, a marxist, has become owner of the newspaper 'Volharding'. Volharding is the newspaper of the VSTP, a union for railway and tram personell."
ww1_indonesia.38.a: "Hes Getting Powerfull..."
ww1_indonesia.39.t: "ISDV Founded"
ww1_indonesia.39.d: "Henk Sneevliet has founded a communist organisation in the [INS.Getname] called The Indies Social Democratic Assocation. The organisation is still small in comparison with other organisations but it is the only communist organisation in the Indies."
ww1_indonesia.39.a: "Another Party?"
ww1_indonesia.40.t: "Insulinde-ISDV Friendshio Established"
ww1_indonesia.40.d: "Insulinde and ISDV may not be similiar ideologically but they share a hatred for the colonial authorities and their oppresive rule. So they have decided to work together when it comes to protesting."
ww1_indonesia.40.a: "Oh God"
ww1_indonesia.41.t: "Semaoen Joins VSTP"
ww1_indonesia.41.d: "Semaoen has become part of the VSTP leadership. The VSTP is a union for railway and tram workers and one of the biggest unions in the Indies."
ww1_indonesia.41.a: "The Communists Expand"
ww1_indonesia.42.t: "Het Vrije Woord Founded"
ww1_indonesia.42.d: "Het Vrije Woord is a newspaper of the ISDV that has started circulating in Java."
ww1_indonesia.42.a: "Another Day, Another Newspaper"
ww1_indonesia.43.t: "Samaoen Takes Over Semerang SI"
ww1_indonesia.43.d: "Samaoen, a communist and Sarekat Islam member, has taken over the Semerang branch of the SI. He has also turned this part of the Sarekat Islam into the largest and most powerfull. He uses the organisation to spread his communist ideas."
ww1_indonesia.43.a: "The Power Struggle Begins"
ww1_indonesia.44.t: "Opening Hospital Met With Controversy"
ww1_indonesia.44.d: "A second hospital in Surabaya has been opened by the colonial government. The hospital is staffed by strictly only European doctors. The Indo association 'Bond van Geneesheren' made a letter where they called it rascism because the colonial authorities 'don't think they would be able to be good doctors'."
ww1_indonesia.44.a: "We Can't Open Hospitals Now?"
ww1_indonesia.45.t: "Commitee of 7 Convenes"
ww1_indonesia.45.d: "A group of indo's that call themselves the 'commitee of 7' has convened to discuss the recent development of a new hospital. They want to create a new organisation to better defend the people oppresed by the colonial authorities."
ww1_indonesia.45.a: "A Indo Party...?"
ww1_indonesia.46.t: "Indische Partij Created"
ww1_indonesia.46.d: "The Indische Partij is a party for all those living within the Indies. The party is formed Douwes Dekker, Tjipto Mangoenkoesoemo and Soewardi Soerjaningrat. They support Indies indenpendence and unity among all people residing within the Indies. The party is open to everyone and aims to gain more rights for the people living within the Indies."
ww1_indonesia.46.a: "A new foe has appeared!"
ww1_indonesia.48.t: "IP Requests Legal Recognition"
ww1_indonesia.48.d: "The Indische Partij has asked us to give them legal recognition. Every party needs legal recognition to operate, otherwise they can be oppresed."
ww1_indonesia.48.a: "Why would we grant them recognition?"
ww1_indonesia.49.t: "Indische Partij Disbands"
ww1_indonesia.49.d: "The Indische Partij was not able to gain their recognition, leading to the colonial authorities to designate the organisation as a banned party. Douwes Dekker closed the party after he was let known that the party was banned."
ww1_indonesia.49.a: "And that marks the end of it"
ww1_indonesia.50.t: "Boemi Putera Established"
ww1_indonesia.50.d: "The 3 founders of the Indische Partij have established the Boemi Putera, which translates to The Native Commitee. They claim to represent the natives of the Indies. They are very critical of the colonial authorities."
ww1_indonesia.50.a: "We should get rid of them"
ww1_indonesia.51.t: "Als Ik Een Nederlander Was"
ww1_indonesia.51.d: "Soewardi Soerjaningrat, a member of the Boemi Putera, has released an article called 'Als ik een Nederlander was'. In that article he describes what he would do if he were Dutch during the 100 year of indenpendence from France celebrations. He describes that the natives shouldn't give their money to fund the celebrations when they aren't respected by the Dutch."
ww1_indonesia.51.a: "Arrest him"
ww1_indonesia.52.t: "Kracht en Vrees"
ww1_indonesia.52.d: "Tjipto, a member of Boemi Putera, has released an article called 'Kracht en Vrees'. In the article he describes the suppresion his party has faced after the release of the article 'Als ik een Nederlander was'. He also remarked that the colonial authorities can suppress but there will always be resistance."
ww1_indonesia.52.a: "Arrest him too"
ww1_indonesia.53.t: "Douwes Dekker Defends the Articles"
ww1_indonesia.53.d: "Douwes Dekker, the former leader of the Indische Partij and one of the founders of Boemi Putera, has publicly defended his fellow members. Saying that he stands by them."
ww1_indonesia.53.a: "Thats all of them"
ww1_indonesia.54.t: "Ati Soejti Established"
ww1_indonesia.54.d: "Ati Soejti is an Indo Chinese organisation founded to combat the trafficking of Indo Chinese woman and children. They also want to provide education to the latter."
ww1_indonesia.54.a: "A heroic cause"
ww1_indonesia.55.t: "Sin Po Created"
ww1_indonesia.55.d: "Sin Po is a left wing Indo Chinese newspaper, created by Lauw Giok Lan and Yoe Sin Gie. The newspaper is a weekly newspaper as of now but the founders have plans to make it daily at some point."
ww1_indonesia.55.a: "Interesting"
ww1_indonesia.56.t: "Sin Po Officer Fued"
ww1_indonesia.56.d: "Sin Po has released an article where they accuse 2 Chinese officers of corruption and abuse of authority. Those officers are Phoa Keng Hek and Khouw Kim An. The officers are part of Tiong Hoa Hwee Koan, a powerfull Indo Chinese organisation."
ww1_indonesia.56.a: "Let the officers take care of it"
ww1_indonesia.56.b: "Intervene on behalf of Sin Po"
ww1_indonesia.57.t: "Sin Po Critisizes Colonial Government"
ww1_indonesia.57.d: "Sin Po released an article about a dead Chinese man who was murdered in Sukabumi. The article was also meant to stir up hate against the colonial government."
ww1_indonesia.57.a: "Thats not nice"