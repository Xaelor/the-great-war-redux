INS_ip_tt: "An §OIndo person§! is someone born with Dutch and Indonesian roots. Even though they are part Dutch, they get treated just as bad as the natives of Insulandia. The Indo's have had an easier time working together to try and earn the same rights."
INS_bu_tt: "The §3Budi Utomo§! is an organisation formed by natives in 1908 in a medical school in Batavia. it consists of many intellectuals which aim to elevate the welfare of the native by funding education."
INS_si_tt: "§GIslamic Movements§! in the Indies have mainly been isolated to Java. They consist of merchants and religious figures with an aim to protect their commercial interests and combat the influence of Christian missionaries."
INS_ic_tt: "The §mIndo Chinese§! present in the Indies consist of about 3 million people. This minority has faced exploitation from both natives and the Dutch overlords. Thus they try to work together to protect their communities and merchants."
INS_isdv_tt: "§RCommunist movements§! within the Indies are very small and unpopular. They are very disunified and nobody has taken up leadership yet."


