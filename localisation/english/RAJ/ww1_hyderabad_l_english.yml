HYD_factions: "The Mulki Debate"
HYD_factions_desc: "The Hyderabadi State is composed of Mulkis, which are native Hyderabad-born men, or sons of the soil, or permanent residents residing in the nation. The nation is also comprised of Non-Mulkis, often referred to as Ghair-Mulkis or Afakis, which are outsiders, most often British and British-Indian administrators. This structural seperation transformed into a crisis in the times of Diwan Sir Salar Jung I."
