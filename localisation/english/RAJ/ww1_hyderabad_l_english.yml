MULKI_DESCRIPTION: "The §YMulkis§! of Hyderabad can be simply described as the local people: the soul of the land. They are the peasants that work in the farms and the native elites that built their riches: and they both want political reform."
OUTSIDER_DESCRIPTION: "The §YOutsiders§! in Hyderabad, or §YNon-Mulkis§! are most commonly British-Indian or non-native Muslims that reside in Hyderabad and want to occupy government jobs. They want to continue to curb Mulki political expression in order to control the state better."
