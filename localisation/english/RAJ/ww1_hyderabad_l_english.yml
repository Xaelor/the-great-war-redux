# Hyderabad
HYD_agricultural_exports_focus: "Heavy Exporter of Cotton"
HYD_agricultural_exports_focus_desc: "The top export of Hyderabad destined to outside of its delimited borders is cotton, used in British and Indian textile mills."

# Mysore
MYS_progressive_economy: "[MYS.GetAdjective] Progressive Economy"
MYS_progressive_economy_desc: "Described in Visvesvaraya's framework, the industrialization pioneered by Mysore consists of a state-led model instead of the traditional British-influenced laissez-faire. In the Mysore model, the state is the lead investment banker, infrastructure planner and developer. These systems have allowed Mysore to quickly industrialize compared to other native states. It has helped the nation complete on its British mining companies' electricity contracts due to the hydropower projects initiated by the state."

# Gwalior
GWA_madhorao_scindia_i: "Madhorao Scindia I"
GWA_madhorao_scindia_i_desc: "Maharaja Sir Madhorao Scindia I of Gwalior. 6th Maharaja of Gwalior, inaugurated in 1886."

GWA_agricultural_exports: "Agrarian Export-Driven Economy"
GWA_agricultural_exports_desc: "Many rich agrarian resources such as opium and cotton are exported from Gwalior fields to the international stage though the GLR acting as a fast and efficient route to the international gateway at the Port of Bombay."

# Travancore
TRV_rama_varma_vi: "Rama Varma VI"
TRV_rama_varma_vi_desc: "Since his ascension to the throne of Travancore in 1885, §YRama Varma VI§! has walked in his predecessors' footsteps regarding the modernisation of his kingdom\n\nHe hasn't simply formed the first legislative council for a native state in India or established a life insurance system, he has also reformed the transportation system, the Marumakkathayam (inheritance) system, education (with progression in the numbers of female students) public works department, medicine, law, and many more.\n\nHis accomplishments valued him to be granted a personal §Y21-Gun Salute§!."
TRV_maharaja: "Maharaja"
TRV_princely_modernist: "Princely Modernist"

TRV_sree_mulam_praja_sabha: "Sree Mulam Praja Sabha"
TRV_sree_mulam_praja_sabha_desc: "In 1888, a legislative council was established with eight appointed members, increased by §YRama Varma IV§! to 15 members by 1886.\n\nThe council was reformed into a full fledged parliament in 1904 with the addition of a lower house, the '§YSree Mulam Popular Assembly§!'. Strong of 88 members, the lower house was the first step towards popular participation in governance, although its composition was hand-picked by the §YMaharaja§! (King of Travancore) among landlords and merchants.\n\nBy 1905, the size of the Assembly had increased to 100 members, 77 of whom were elected through census suffrage or on the basis of educational merit (university graduates). The last reform dating back to 1907, when lower house was enabled to elect members of the upper house."
TRV_weakened_jenmimar: "Jenmimar"
TRV_weakened_jenmimar_desc: "The Jenmimar are the landed aristocracy of Travancore, predominantly belonging to the §YNair§! and §YNambudiri§! communities.\n\nThey have, over the course of history, been weakened over and over again. More than 70 nobles killed in the 17th century by the new Maharaja, §YMarthanda Varma§!, in an effort to to completely abolish the feudal system in Travancore. §YMysore§! invasions of the northern region of Malabar, leading to Hindu-Muslim clashes, resulting in the purge of Nairs from the region. §YBritish interferences§! in the 18th century causing Jenmimar led revolts, promptly squashed by the Crown.\n\nThe Jenmimar are now greatly reduced both in number and influence over Travancore, however, they still practice some form of contest to §Y[TRV.GetLeader]§!'s rule."

