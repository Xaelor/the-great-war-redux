HYD_martial_races_theory: "Hyderabadi Martial Races Theory"
HYD_martial_races_theory_desc: "The Martial Races Theory belief in Hyderabad is rampant due to British influence. Under the standards set, barely any people in the nation are in a martial caste, as Hyderabad is mostly composed of South Indian populations like Telugus and Kannadans. This makes recruitment for a British-standard army difficult, as we have to import soldiers from martial regions such as ones from East African origins and Arab Chausch mercenaries. This system however does allow the Nizam to assert state power as racialized internal enclaves were preserved and British expectations were satisfied."
HYD_martial_races_theory3: "Breaking the Martial Races Theory"
HYD_martial_races_theory3_desc: "The Martial Races Theory belief in Hyderabad is rampant due to British influence. Under the standards set, barely any people in the nation are in a martial caste, as Hyderabad is mostly composed of South Indian populations like Telugus and Kannadans. This makes recruitment for a British-standard army difficult, as we have to import soldiers from martial regions such as ones from East African origins and Arab Chausch mercenaries. We have made a pivot recently to discourage the theory and allow for more recruitment of non-martial castes."
ww1_princely.8.t: "The Slow Death of the Martial Races Theory in Hyderabad"
ww1_princely.8.d: "Ever since the discouragement of the Martial Races Theory and campaigns against the British propaganda machine started, we have started seeing yearly results, with more people applying to join the Hyderabadi army."
ww1_princely.8.a: "One step at a time"
improve_every_year_hyderbad_hi_great_tooltip_amirite_hi_this_is_daggie: "Every year, the §YBreaking the Martial Race Theory§! idea will deteriorate its negative effects until it dissipates."

ww1_princely.9.t: "Nizam of Hyderabad Addresses Indian Muslims"
ww1_princely.9.d: "The Nizam of Hyderabad, [HYD.GetLeader], who is the most influential Muslim leader in all of India, has made an address to the Islamic Indians today, rushing to tell everybody to stay loyal to the Empire and not react to the declaration of Jihad by the Ottomans, deeming it invalid. He also makes promises that the British army will protect Muslim monuments during the future combat that is unevitably arriving to Middle Eastern cities occupied by the Ottomans. This action was praised by [RAJ.GetLeader], calling the Nizam very courageous and telling him that he helped save the Imperial foothold in Muslim India."
ww1_princely.9.a: "Thank you, very cool!"
ww1_princely.9.b: "Prosperity is coming to Hyderabad"

ww1_princely.10.t: "\"Where Can We Find a Mulki That Can Administer Hyderabad?\"..."
ww1_princely.10.d: "...was the title of the magazine 'Ilahibaksh' today. This magazine is known for being pro-Outsider, and advocating for increased Outsider rights and spreading belief that Mulkis are not competent and smart enough to administer the nation and therefore occupy the government jobs."
ww1_princely.10.a: "Outrageous"
ww1_princely.10.b: "They must be playing hide and seek"
