## HYDERABAD SHIT
HYD_POWDERKEG_DESC: "In the late 18th and early 19th centuries, Hyderabad became a princely state under the paramountcy of the British Empire. Through key military alliances aiding British campaigns, it grew to become the largest and most influential princely state in India.\nInternally, the state faced significant socio-political tension over the \"Mulki\" issue, which is a debate between local residents (Mulkis) and non-local administrators or immigrants (non-Mulkis). This conflict raised a critical question for Hyderabad's future: which group would ultimately control the state's administration and political direction?"
HYD_son_of_mahbub: "Son of Nizam VI"
HYD_successor_of_hyderabad: "Future of Hyderabad"
HYD_mahbub_ali_khan: "Mahbub Ali Khan"
HYD_mahbub_ali_khan_desc: "His Exalted Highness Asaf Jah, Muzaffar-ul-Mulk, Nawab Mahbub Ali Khan Bahadur, Fateh Jung, is the sixth Nizam of the now-princely state of Hyderabad."
HYD_osman_ali_khan: "Osman Ali Khan"
HYD_hindu_muslim_friction: "Hindu-Muslim Friction"
HYD_hindu_muslim_friction_desc: "Ever since the Mulki-Outsiders dispute broke out, there has been a subconflict between Mulkis themselves. More specifically, between Hindu natives and Muslim natives. Despite 90% of the population being Hindu, most government jobs were filled with non-Mulki muslims. In §Y1894§!, Sir Kishen Parshad, a Hindu diwan, revealed that two thirds of the government posts were occupied by non-Mulkis."

HYD_enforce_DEI_on_mulkis: "Limit Outsider 'Bureaucratic Dynasties'"
HYD_enforce_DEI_on_mulkis_desc: "To limit Outsider influence in government jobs, we will apply regulations to prioritize their applications before the Outsider's, and even create some jobs where their positions are limited to only Mulkis. The Outsiders will likely not be very happy about this, calling it 'woke'."
HYD_education_outreach: "Expand State Education Program"
HYD_education_outreach_desc: "We need to expand the reach of the basic education program for Hyderabad by establishing more schools."
HYD_fiscal_revamp: "Fiscal Reform"
HYD_fiscal_revamp_desc: ""
HYD_destroy_alcohol_monopolies: "Destroy Alcohol Monopolies"
HYD_destroy_alcohol_monopolies_desc: "Destroying monopolies on alcohol products and having the state control the price and revenue will benefit the population and increase our fiscal revenue in excise."
HYD_draft_a_blueprint_for_reservoir: "Never Another 1908"
HYD_draft_a_blueprint_for_reservoir_desc: "In 1908, there was a big flood that destroyed a lot of Hyderabad and killed over 20 thousand citizens. We cannot have another disaster like this happen again."
HYD_imperial_succession_plan: "Mahbub's Imperial Succession Plan"
HYD_imperial_succession_plan_desc: "Mahbub senses his life ending soon, somehow. He might be indulging on too much alcohol, who knows. He needs to designate a successor fast to prevent a crisis. I mean, everybody already knows that Mahbub's son Mir Osman Ali Khan will succeed him on the throne as Nizam, so this plan is kind of useless, but Mahbub feels formal today."
coronation_extra_buffs_HYD: "The focus §YCoronation of Osman Ali Khan§! will be §Gimproved§!."

HYD_coronation_of_osman_ali_khan: "Coronation of Osman Ali Khan"
HYD_coronation_of_osman_ali_khan_desc: "Following the death of Nizam VI, Mahbub Ali Khan, Hyderabad looks for a new leader. Conviniently, Mahbub had a son, ready to be heir. Wait... if he has a son... Mahbub, you dirty dog!"
ww1_princely.3.t: "Mahbub Ali Khan Dies"
ww1_princely.3.d: "Aged 45, Mahbub Ali Khan passed away.\n\nHe will be remembered as the sixth Nizam of Hyderabad, who was present during the catastrophic events such as the Great Famine of 1876-78 and the Great Musi Flood of 1908. During the flood, he opened his palace to accomodate flood victims in the catastrophe that killed around 20 thousand."
HYD_integrate_mulkis_in_political_life: "Integrate Mulkis in Political Life"
HYD_integrate_mulkis_in_political_life_desc: "Mulkis, or native Hyderabadi members of society, have almost no role in Osman's domain, at least not more than the British administrators, or the non-Mulkis. We need to appease them by giving them a role to play."
HYD_policy_of_unwavering_loyalty_to_ENG: "Unwavering Loyalty to the British Crown"
HYD_policy_of_unwavering_loyalty_to_ENG_desc: "We are at a disadvantage to the British: they allow us to exist as an inconvinient chip on the Raj administration's shoulders. We need to create levrage of autonomy against the unfair system. Unfortunately, the only way to do that is to help the said system with administrating the nation to their standards and helping out the British Empire in diplomatic affairs."
HYD_administrative_modernization: "Administrative Modernization"
HYD_administrative_modernization_desc: "Our administrative systems are considered 'outdated' by the non-Mulkis that help us run the country: let's adapt to their standards."
HYD_political_reforms: "Political Reforms"
HYD_political_reforms_desc: "The nation of Hyderabad is lacking behind in political management compared to modern European nations, with even the most autocratic of them containing the people's participation; what the Mulkis here in Hyderabad are wanting."
HYD_broaden_public_services: "Broaden Public Services"
HYD_broaden_public_services_desc: "Our public services are extremely limited: transportation, healthcare, etc.: they are only here to appease the people--the Mulkis, mostly--and prevent them from complaining against the Nizam. It is time to make them actually useful and broaden their use across the soon-to-be prosperous nation."
HYD_city_improvement_board_idea: "City Improvement Board"
HYD_inefficient_departments: "Inefficient Departments"
HYD_follow_travancore_democratization: "Follow Travancorean Democratization"
HYD_follow_travancore_democratization_desc: "The fellow Indian princely state of Travancore has adopted a system of semi-constitutional monarchy. A lesser version of this, would severely increase Mulki support in the government."
HYD_appoint_key_administration_members: "Appoint Key Administration"
HYD_appoint_key_administration_members_desc: ""
HYD_rural_administrative_reform: "Rural Administrative Reform"
HYD_rural_administrative_reform_desc: "The non-urban areas of the Hyderabad State are extremely incoherent, inefficient in administering a large population of mostly farmers. Let's make rural areas great again."
HYD_pressure_prime_minister: "Apply Pressure on the Diwan"
HYD_pressure_prime_minister_desc: "Salar Jung III, the Diwan of Hyderabad, is completing administrative reforms that are getting the attention of British officials such as the Resident, which we consider to be undermining the authority of the Nizam. It is time to pressure him and press his decision-making in order for his resignation."
HYD_city_improvement_board: "City Improvement Board"
HYD_city_improvement_board_desc: "After the devastating floods in 1908 that wrecked and destroyed the beautiful capital city of Hyderabad; Hyderabad, it is time to establish measures so that natural disasters' impacts are minimilized, or even extinguished."
HYD_hyderabadi_sourced_resources: "Hyderabadi-Sourced Resources"
HYD_hyderabadi_sourced_resources_desc: "We need to encourage the extraction and production of locally-sourced resources such as oil and cement."
HYD_standardize_weights: "Standardize Weights and Measurements"
HYD_standardize_weights_desc: "With the literacy rate of the country climbing at a RECORD pace, we need to establish regulations that will not only help the newly educated, but also building projects such as houses, fancy hotels for the Nizam and egg drop challenges."
HYD_encourage_textile_production: "Encourage Textile Production"
HYD_encourage_textile_production_desc: "We need more people in this country, to STOP importing textiles from neighboring productors such as the Raj and Gwalior and instead build textile factories and production farms. Build, baby build: make textiles great again in Hyderabad!"
HYD_construct_reservoirs: "Construct Reservoirs"
HYD_construct_reservoirs_desc: "With the 1908 flood that claimed over 20 000 lives, this seems like an obvious measure to prevent another catastrophe like that from ever happening: build reservoirs."
HYD_improve_urban_quality_of_life: "Improve Urban Quality of Life"
HYD_improve_urban_quality_of_life_desc: "The urban environment in Hyderabad City is not the best: sewage systems are either incomplete or outdated, and housing is lacking. The quality of life of Hyderabadi residents would be improved via this project."
HYD_railway_expansion: "Aid Railway Expansion"
HYD_railway_expansion_desc: "Let's provide workers for the expansion and maintenance of the Nizam's Guaranteed State Railway."
HYD_nizams_guaranteed_state_railway: "Nizam's Guaranteed State Railway"
jihad_declared: "§Y[TUR.GetNameWithFlag]§! has declared Jihad against the §YEntente§!"
HYD_direct_rule: "Establish Direct Rule"
HYD_direct_rule_desc: "After the resignation of the Diwan, the Nizam declines to appoint a new Diwan, instead opting to take over all of the nation's affairs and taking personal control of the nation."
HYD_balance_two_factions: "Balance the Mulki-Outsider Scale"
HYD_balance_two_factions_desc: "The two factions, the Mulkis and the non-Mulkis are still bickering about political reforms. It is time to appease them all with magic Nizam powers."
HYD_advisory_cabinet: "Establish an Advisory Cabinet"
HYD_advisory_cabinet_desc: "\"Taking personal control over the nation's affairs is one crazy thing\", the British thought, \"but he would be a fool to not have a council to aid him!\" Okay, I don't think they said that, but it would make sense, as the Nizam thought about this too. We need to establish an advisory cabinet for aiding the Nizam in decision and policy-making."
HYD_begin_departmental_reforms: "Begin Departmental Reforms"
HYD_begin_departmental_reforms_desc: ""
HYD_department_of_agriculture: "Create the Department of Agriculture"
HYD_department_of_agriculture_desc: "Farming being a big activity for revenue in Hyderabad, we need to regulate and protect it with a governmental department."
HYD_establish_co_operative_societies: "Establish Co-operative Societies"
HYD_establish_co_operative_societies_desc: ""
HYD_reorganise_medical_department: "Reorganise Medical Department"
HYD_reorganise_medical_department_desc: ""
HYD_establish_sanitary_department: "Establish Sanitary Department"
HYD_establish_sanitary_department_desc: ""
HYD_ottoman_jihad_on_britain: "The Muslim Crisis"
HYD_ottoman_jihad_on_britain_desc: "The Ottomans have joined against the British Empire in the Great War, and that isn't so great for the Raj. Especially for us, as we are a majority-Muslim state. We need to soon establish order and assure loyalty to Britain."
HYD_farman_for_the_muslims_of_british_india: "Address the Muslims of Hyderabad and India"
HYD_farman_for_the_muslims_of_british_india_desc: "The Indian government has been pressing us since the entry of the Turks in the Great War to tell the Muslims of the Raj and of Hyderabad to stay loyal to the British Crown, that Muslim holy sites in the Middle East will be protected during combat and to dismiss the Jihad declaration by [TUR.GetNameDef]. This address would be significant as we are the largest Muslim princely state (largest princely state in general) and we hold a lot of power as the most influential Muslim leader in India."

HYD_centralize_the_state: "Centralize the State"
HYD_centralize_the_state_desc: ""
HYD_stabilize_finances: "Stabilize the State's Finances"
HYD_stabilize_finances_desc: ""
HYD_reform_predatory_tax_system: "Regulate the Bhagdela System"
HYD_reform_predatory_tax_system_desc: "Nearly 90% of the population lives the rural way and near 50% live an agrarian lifestyle, with land taxes provided from them accumulating to near half of Hyderabad's revenue. We need to fix the structural problems caused by the issues of the past, which were inspired from serfdom and feudalism. A high number of peasants are indebted towards a system called the Bhagela system, where heavy taxes were imposed on farmers by nobles and they had to become de facto slaves to pay off their eternal, accumulating debts. This debt is passed down to wives and children, and the latter also became a slave of the noble groups such as the Jagirdars and the Zamindars."
HYD_curtail_lavish_spending: "Curtail Lavish Spending"
HYD_curtail_lavish_spending_desc: "The VIth Nizam, Mir Osman Ali Khan's father, was known for spending on unnecessary expenses, such as mansions and personal projects like vehicles. But times are changing, and modernization does not allow for selfish spending."
HYD_levrage_internal_autonomy: "Leverage Internal Autonomy"
HYD_levrage_internal_autonomy_desc: "Hyderabad is special than other princely states such as Gwalior or Bikar as it is more autonomous due to the advanced state of... the State, and its revenue. It is also convinient for the British to not have to deal with revolution, like in the North-West."
HYD_hyderabad_at_middle_eastern_battlefields: "Hyderabad at Middle-Eastern Battlefields"
HYD_hyderabad_at_middle_eastern_battlefields_desc: ""
HYD_fund_the_hyderabad_squadron: "Fund the 'Hyderabad' Squadron"
HYD_fund_the_hyderabad_squadron_desc: "The British aviation company Airco wants to make airplanes for a squadron in the British Royal Air Forces. We can fund them, and maybe we can get more recognition!"
HYD_a_new_movement: "A New Movement Emerging"
HYD_a_new_movement_desc: "The Indian Home Rule Movement"
HYD_financial_crisis: "The Financial Crisis"
HYD_financial_crisis_desc: "Marine transportation of goods is no longer a valid method of importing. The market is failing due to wartime disruptions and agrarian failure due to the elite focusing on foreign wars and imperial diplomacy."
HYD_form_the_hyderabadi_royal_lancers: "Form the Hyderabadi Royal Lancers"
HYD_hyderabad_samajik_sudhar_singh: "Hyderabad Samajik Sudhar Sangh"



