l_english:

# AFGHANISTAN
ww1_afghanistan.12.t: "Failure of the Kabul Expedition"
ww1_afghanistan.12.d: "The Kabul Expedition has ended in failure. Disguised as a travelling circus, the German delegation attempted to journey to Turkey overland via Austria-Hungary. However, upon reaching Romania, the plan unraveled. Romanian authorities uncovered wireless aerials concealed within “tent pole” packaging, confiscating essential equipment, arms, and mobile radios. Delays mounted as replacements couldn’t be arranged for weeks, forcing the group to wait in Constantinople.\n\nEfforts to reinforce the Islamic identity of the expedition met with further obstacles. Turkish officials suggested that the Germans adopt Turkish military uniforms to integrate more effectively, but the proposal was firmly declined. Growing tensions between the Turkish and German officers over control and protocol deepened the divisions, and the expedition ultimately had to be abandoned."
ww1_afghanistan.12.a: "Thoses Turks..."

ww1_afghanistan.13.t: "Success of the Kabul Expedition"
ww1_afghanistan.13.d: "The expedition to Kabul, led by Mahendra Pratap and accompanied by German officials Niedermayer and von Hentig, the latter serving as the Kaiser’s representative, has successfully arrived in Afghanistan. After a journey fraught with challenges across Europe and the Middle East, the delegates finally reached Kabul. Now, they are poised to initiate diplomatic negotiations with the Emir, aiming to secure Afghanistan’s alignment with our cause."
ww1_afghanistan.13.a: "Let's talk."

ww1_afghanistan.14.t: "Afghan-German Friendship Treaty"
ww1_afghanistan.14.d: "Von Hentig, the German delegate leading the Imperial expedition in Kabul, has approached our Emir today with a proposal: to sign a Friendship Treaty between our two nations. The treaty guarantees German assistance against Russian and British threats should we join the war on their side. In return, the Emir's army will be modernised with Germany providing 100,000 modern rifles, 300 artillery pieces, and other modern warfare equipment. The Germans will assume responsibility for maintaining advisors and engineers, and they will maintain an overland supply route through Persia for arms and ammunition. Furthermore, the Emir is to be paid 1,000,000 British pound."
ww1_afghanistan.14.a: "Sign it, but I'll reaffirm my Neutrality."

ww1_afghanistan.15.t: "Habibullah Khan Remains Neutral!"
ww1_afghanistan.15.d: "Four days after signing the Friendship Treaty, Habibullah called for a durbar, a grand meeting where he unambiguously reaffirmed his neutrality. He made it clear that the war's outcome was still unpredictable and that he stood for national unity. It is becoming increasingly evident that Habibullah has no intention of joining the war on our side. He is merely attempting to exploit us to his advantage. Our sole remaining option is his brother, Nasrullah, who has proposed removing Habibullah from power and leading the frontier tribes in a campaign against British India."
ww1_afghanistan.15.a: "Screw him."

 
 # German Expedition
GER_afghan_expeditions: "Niedermayer–Hentig Expedition"
GER_afghan_expeditions_desc: "[niedermayer_hentig_expedition_desc]"

GER_niedermayer_hentig_expedition_desc: "The ([ENG.GetFlag]) §YBritish Empire's§! grip over India is a foundation of their global power, but foundations can crumble. By reaching out to the Emir of ([AFG.GetFlag]) §YAfghanistan§!, we aim to destabilize British dominance in the region, forcing their forces to stretch thin. Our expedition is bold, but success could ignite a rebellion that might very well weakens ([ENG.GetFlag]) §YBritain§!.\n\nOur current influence in ([AFG.GetFlag]) §YAfghanistan§! is [?global.AFG_german_influence|%%Y1]."
ENG_niedermayer_hentig_expedition_desc: "([GER.GetFlag]) §YGerman§! and ([TUR.GetFlag]) §YOttoman§! agents have infiltrated Afghanistan, aiming to incite rebellion against the ([RAJ.GetFlag]) §YRaj§!. The Emir of ([AFG.GetFlag]) §YAfghanistan§!, caught between conflicting loyalties, may be swayed by promises of arms, gold, and freedom from our influence, and it is our duty to not let the Northwestern frontier fall.\n\nGerman current influence in ([AFG.GetFlag]) §YAfghanistan§! is [?global.AFG_german_influence|%%Y1]."
TUR_niedermayer_hentig_expedition_desc: "The Emir of ([AFG.GetFlag]) §YAfghanistan§! may hold the key to spreading the fires of rebellion against the ([ENG.GetFlag]) §YBritish§! Empire. With the support of our ([GER.GetFlag]) §YGerman§! allies, our envoys have been dispatched to Kabul to urge the Emir to join a broader jihad against the enemies of Islam.\n\nGerman current influence in ([AFG.GetFlag]) §YAfghanistan§! is [?global.AFG_german_influence|%%Y1]."
AFG_niedermayer_hentig_expedition_desc: "Our Country has become the centerpiece of a dangerous game between global powers. ([GER.GetFlag]) §YGerman§! and ([TUR.GetFlag]) §YOttoman§! envoys have arrived in Kabul, offering gold, weapons, and promises of independence from ([ENG.GetFlag]) §YBritish§! domination. Yet their intentions remain unclear, and their presence threatens to undermine the delicate balance of power in our region. If we allow their influence to grow unchecked, it could provoke the wrath of the ([ENG.GetFlag]) §YBritish§! and plunge Afghanistan into chaos.\n\nGerman current influence in ([AFG.GetFlag]) §YAfghanistan§! is [?global.AFG_german_influence|%%Y1]."

