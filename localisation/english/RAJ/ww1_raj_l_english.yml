RAJ_indian_electricity_act: "Indian Electricity Act"
RAJ_indian_electricity_act_desc: "The §YIndian Electricity Act§! of §Y1903§! has proved itself too rigid to handle the Raj growing power demands. The Council has therefore drafted a new, more versatile law that only asks to be enforced.\n\nThe new act will regulate licensing to private companies, set basic rules for public safety, protection of property, etc."
RAJ_nullify_the_partition_of_bengal: "Nullify the Partition of Bengal"
RAJ_nullify_the_partition_of_bengal_desc: "In 1905, Lord Curzon, then Viceroy of India, made the decision to partition the Bengal presidency into more provinces, along religious lines. Although the partition was ostensibly designed to facilitate the administration of the regions, it was met with considerable resistance from the Indian population, particularly the §YIndian National Congress§!. In order to demonstrate our good will and commitment to the development of Bengal, it is imperative that the nullification of the partition of the province be enacted."
RAJ_unlock_focus_reorganize: "Unlocks National Focus: §YReorganize Bengal§!"
RAJ_indian_iron_and_steel_company: "Bengal Iron and Steel Company"
RAJ_indian_iron_and_steel_company_desc: ""
RAJ_indian_tramways_act: "Electrify the Tramways"
RAJ_indian_tramways_act_desc: ""
RAJ_hardinge_bridge_railway: "Hardinge's Bridge Railway"
RAJ_hardinge_bridge_railway_desc: "In 1889, the Eastern Bengal Railway proposed the construction of a railway bridge over the Padma River with the intention of facilitating communication between Calcutta and the, then, Eastern Bengal and Assam. In 1902, Sir FJE Spring prepared a report on the bridge. With the planning of such infrastructure now complete, it is now possible to direct resources towards the construction of the bridge."
RAJ_form_bihar_and_horissa: "Form Bihar and Horissa"
RAJ_form_bihar_and_horissa_desc: "With our latest investment in the Bengal presidency, we can now once again separate Bihar and Orissa provinces in an effort to facilitate the administration of these regions without facing a backlash from the Indian population."
RAJ_dhamrai_hardinge_school: "Dhamrai Hardinge's School"
RAJ_dhamrai_hardinge_school_desc: "Our recent successes in the Bengal region have allowed us to devote even more resources to the development of the region and its people. In an effort to educate the masses of Bengal, the opening of a government school is of paramount importance."
RAJ_support_irrigation_projects: "Triple Canal Project"
RAJ_support_irrigation_projects_desc: "The Raj currently has the largest irrigation system in the world, and by 1900 the amount of irrigated land had increased eightfold. Our work in creating more irrigable land has been fruitful and we must not backtrack now. For example, in Punjab, the Triple Canal Project is currently under way. These canal projects continuing a prosperous development is essential for Punjabi farmers, as rain doesn't descend as often as other farming areas in the colony. In 1901, from the ongoing Triple Canal Project, it was reported the canals irrigated around 1.95 million acres of land."
RAJ_support_irrigation_projects_reward: "Modify §YDe-Industrialisation§! by\n$MODIFIER_STABILITY_FACTOR$:§G +5.00%§!\n$MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$:§G+10%§!\n\n"
RAJ_banaras_hindu_university: "Banaras Hindu University"
RAJ_banaras_hindu_university_desc: "The Banaras Hindu University was founded by a number of Indian philanthropists, industrialists and nationalist sympathisers. While their aims often clashed with those of the Raj, the University has lifted thousands out of ignorance and allowed us to find more and more bright-minded individuals among the Indian masses."
RAJ_use_the_industrials: "Use the Industrials"
RAJ_use_the_industrials_desc: "With the seed of the Industrial Revolution growing in India, a small but robust middle class has birthed from the Jewel of the Empire. These educated citizens are now forming conglomerates, developing local industries, and building schools to educate the youth. Utilizing the expertise of these industrials would offer much valuable advices to our government."
RAJ_reap_the_rewards: "Reap the Rewards"
RAJ_reap_the_rewards_desc: ""
RAJ_reap_the_rewards_tt: "Our investments will pay off in the form of one §YCivilian Factory§! in each state we invested in."
RAJ_invest_in_punjab: "Invest in Punjab"
RAJ_invest_in_punjab_desc: "Located near the Northwestern province, Punjab is one of our most promising province. The land's irrigability was greatly improved by irrigation projects introduced in 1885, and now we only have to reap the benefits of such fertile land."
RAJ_invest_in_delhi: "Invest in Delhi"
RAJ_invest_in_delhi_desc: "Former capital of the Mughal empire, Delhi is one of our fastest growing city. While the majority of the city's surroundings are rural and used for cultivating crops such as wheat, barley, millet, and pulses, it is worth noting that Delhi is also highly industrialised and even hosts arsenals of the Ordnance Factory Board."
RAJ_invest_in_bombay: "Invest in Bombay"
RAJ_invest_in_bombay_desc: "Located on the western side of the Indian Ocean, Bombay is one of our most prosperous coastal port. The ever-increasing demand for cotton from Europe and the opening of the Suez Canal in 1869 made Bombay the centre of our western trading activities, investing in such centerpiece could only bring us prosperity."
RAJ_invest_in_calcutta: "Invest in Bengal"
RAJ_invest_in_calcutta_desc: "First base of operation of the East India Company, Bengal is one of our most prosperous province. Since our establishment in the region, It has been home to many arsenals and mills of all kinds. Its capital, Calcutta, is also one of our busiest coastal ports."
RAJ_invest_in_madras: "Invest in Madras"
RAJ_invest_in_madras_desc: ""
RAJ_invest_in_burma: "Invest in Burma"
RAJ_invest_in_burma_desc: ""
RAJ_calcutta_improvement_act: "Calcutta Improvement Act"
RAJ_calcutta_improvement_act_desc: ""
RAJ_military_developments_reward: "The benefits of this national focus will §Gincrease§! §Ywith each previous investment§!."
RAJ_tata_steel_ltd: "Tata Steel Ltd."
RAJ_tata_steel_ltd_desc: "Tata Steel stands as a pillar of India's emerging industry. We must work alongside this growing enterprise to increase steel production tounprecedented levels. Supporting Tata Steel not only strengthens our domestic economy but also ensures we can meet wartime demands with local resources. The Raj will standtaller on foundations forged in Indian mills."
RAJ_tata_steel_ltd_tt: "\nIf §YDorabji Tata§! is hired as advisor, the effect of this focus will §Gimprove§!."
RAJ_burmah_oil: "Burmah Oil"
RAJ_burmah_oil_desc: "Burmah Oil has long been an untapped asset in the Indian economy. By expanding its operations and ensuring efficient extraction, we can strengthenIndia's role in the global oil trade. This strategic resource will not only fuel industries but also position India as a key player in the global energy market, ready toprofit from its natural wealth."
RAJ_burmah_oil_tt: "\nIf §YHarcourt Butler§! is hired as advisor, the effect of this focus will §Gimprove§!."
