# Starting Ideas
RAJ_deindustrialisation_dynamic: "De-Industrialisation"
RAJ_deindustrialisation_dynamic_desc: "Also known as stagflation, §YDe-Industrialisation§! is the name of the reduction in industrial-based activities within the Indian economy under our rule. The subcontinent's economy has been supervised by British Interests since §Y1757§!, initially under the §YEast Indian Company§! up to 1858, when India was directly incorporated into the §YBritish Empire§!.\n\nOur rule is marked by protectionist policies which restrict the sale of Indian goods and services within Britain, while flooding Indian markets with low-cost British goods and services, without tariffs or quotas. This has led the British Empire to replace the Indian economy as the world's largest textile producer and caused India's GDP to drop from §Y30% of the world's total GDP§! in 1757 (more than all of Europe combined) to a rapidly approaching §Y2% of the world's total GDP§!."
RAJ_modify_deindustrialisation: "Modify §YDe-Industrialisation§! by\n"

RAJ_indian_army_dynamic: "Indian Army"
RAJ_indian_army_dynamic_desc: "§Y\"The British Government has undertaken to protect the dominions of the Native princes from invasion and even from rebellion within ; its army is organized for the defence not merely of British India, but of all possessions under the suzerainty of the King-Emperor.\" - Imperial Gazetteer of India§!\n\nThe term 'Indian Army' was first used informally to describe the broader 'Presidency Armies' of the Bengal, Madras and Bombay Armies. The Indian Army, raised as an independent army by the Government of India in 1895, gradually absorbed the three long-established Presidency Armies, fully integrating them in 1903. The same year, Lord Kitchener was appointed Commander-in-Chief of India and began what became known as the Kitchener Reforms.\n\nThese reforms structured the modern Indian Army, completing the unification of the three former Presidency Armies as well as other forces, outlining the defence of the North-West Frontier against foreign aggression as the primary role of the army, and the maintenance of internal security as a secondary role, in support of the police. With the reforms ending in 1909, the Indian Army was organised along British lines, although it always lagged behind in terms of equipment. Now a reformed force, the Indian Army has yet to see the light of a battlefield.\n\n§RIt would take a major conflict to close the gap.§!"
RAJ_modify_indian_army: "Modify §YIndian Army§! by\n"

RAJ_indian_press_act: "Indian Press Act"
RAJ_indian_press_act_desc: "The §YIndian Press Acts§! are a set of laws designed to keep seditious propaganda at bay.\n\nThe most recent amendment of §YMarch 1910§! added a '§YCash Deposit§!' rule, where printers and publishers would be required to pay between §Y500§! to §Y2,000§! rupees to the local government in order to have a legal existence. Should an article go against the government, a first warning would be issued with the cash deposit being taken away. A second warning would simply and purely §Rshut down the printing press.§!"

RAJ_martial_races: "Martial Races"
RAJ_martial_races_desc: "Army officials have classified each caste in India has either '§YMartial§!' or '§YNon-Martial§!', effectively segregating our armed forces.\n\nEstablished after the §YSepoy Mutiny§! of §Y1857§!, theses Categories were, officialy, meant to exclude races unfit for battle because of their sedentary lifestyles (opposed to the §YMartial Races§! who are braver and well-built for war).\n\nCoincidentally, this categorisation often leads to the recruitement of Less-Educated, Easier to Control, soldiers."

# Focus Ideas
RAJ_montagu_chelmsford_reforms_idea: "Montagu-Chelmsford Reforms Announced"
RAJ_montagu_chelmsford_reforms_idea_desc: "With the recent announcement of the Montagu-Chelmsford reforms, we are now in a position to garner more support from the Indian people until the tensions that have engulfed the world settle down. This announcement, however, will lead our subject to expect sweeping reforms and, as a result, strengthen the ranks of the Indian National Congress."

# Event Ideas
RAJ_non_cooperation_movement: "Non-Cooperation Movement"
RAJ_non_cooperation_movement_desc: "The Non-Cooperation Movement, spearheaded by Mahatma Gandhi, is a nationwide call to boycott British goods, institutions, and services. It urges Indians to resign from government jobs, schools, and courts, as part of a peaceful resistance to British rule. The movement captures the imagination of the masses, awakening a spirit of self-reliance and non-violent defiance against our supposed colonial oppression."
RAJ_akali_movement1: "Akali Movement"
RAJ_akali_movement1_desc: "The Akali movement is a religious campaign led by the Sikh community to reform the management of gurdwaras and removing mahants (priests) under our ''Corrupt British influence''. It represents a powerful assertion of Sikh religious rights and autonomy, aiming to return control of these sacred institutions to the Sikh sangat (community) while challenging our colonial administration's rule in religious affairs."
RAJ_akali_movement2: "Akali Movement"
RAJ_akali_movement2_desc: "The Akali movement is a religious campaign led by the Sikh community to reform the management of gurdwaras and removing mahants (priests) under our ''Corrupt British influence''. It represents a powerful assertion of Sikh religious rights and autonomy, aiming to return control of these sacred institutions to the Sikh sangat (community) while challenging our colonial administration's rule in religious affairs."
RAJ_indian_home_rule_movement: "Indian Home Rule Movement"
RAJ_indian_home_rule_movement_desc: "The Indian Home Rule Movement, championed by leaders like Bal Gangadhar Tilak and Annie Besant, is a bold campaign to secure self-governance within the British Empire. Advocating for greater autonomy through radical means, it aims to instigate widespread national awakening among Indians."
# Caste System
RAJ_caste_system: "Caste System"
RAJ_caste_system_desc: "The caste system is a socio-political stratification of Indian society, taking its roots in ancient India. It divides the Indian population into different castes, assigned at birth, in order to determine individuals' roles within society. Transformed by various ruling elites during medieval India, it developed especially in the aftermath of the collapse of the Mughal Empire and the establishment of the British Raj. Our administration furthered this development, making rigid caste organisation a central mechanism of our colonial hold on the subcontinent. Since 1860, we incorporated the Indian caste system into our system of governance, granting administrative jobs and senior appointments only to Christians and people belonging to certain castes. While supported by the higher castes and nobility, granting us certain privileges, it remains a source of social unrest within the Indian population."
# Text kept if a description of the INC or ML is needed
RAJ_indian_national_congress_low: "Low Indian National Congress Tensions"
RAJ_indian_national_congress_low_desc: "The Indian National Congress (INC) is a political organisation in India which advocates for greater autonomy within the Empire or, for the more radical elements, total independence. Founded on 28 December 1885 by A. O. Hume, it held its first session the same year and has since grown ever larger. With the Surat split of 1907, which opposed the §3Moderates§! and the §tRadicals§!, the Congress was split into two factions, each with different ways of pushing their agendas."
RAJ_muslim_league_low: "Low All-India Muslim League Tensions"
RAJ_muslim_league_low_desc: "The All-India Muslim League (AIML) is a political organisation in India that advocates for the political representation of Muslims in British India, using means ranging from peaceful cooperation with the British authorities to mass protests. Founded in 1906 by prominent Muslim politicians at the All India Muslim Education Conference held in Dhaka, it aims to secure Muslim interests on the Indian subcontinent in opposition to the often over-represented Hindu movements. Because of the socio-economic background of its founders, the League holds very elitist standards.""

