RAJ_repealing_and_ammending_act: "Repealing and Amending"
RAJ_repealing_and_ammending_act_desc: "Some old laws are outdated or are not necessary. The repealing part repeals the useless legal brouhaha and the amending part amends old laws to add definitions and extra clauses."
