# Legal Tree
RAJ_matters_of_the_council: "Matters of the Council"
RAJ_matters_of_the_council_desc: ""
RAJ_indian_penal_code_act: "Integrate Princely Criminal Records"
RAJ_indian_penal_code_act_desc: "Currently, criminal convictions in the Princely States cannot be used as aggravating factors in provincial courts. This allows repeat offenders to benefit from more lenient laws in our administered territories, and it simply cannot be allowed to continue."
RAJ_civil_courts_act: "Loosen the grip on Northern Civil Courts"
RAJ_civil_courts_act_desc: "Civil courts in the northern provinces of Agra (United Provinces), Bengal, and Assam are subject to constant delays due to the strict bureaucratic framework of the 'Bengal, North-Western Provinces and Assam Civil Courts Act' of 1887. Courts will be freed from the Viceroy's sanctions and thus have greater potential for adaptation."
RAJ_indian_high_courts_act: "Strengthen the High Courts"
RAJ_indian_high_courts_act_desc: "High Courts all over India are overwhelmed with court cases, so an expansion is in order. We will increase the number of judges from 15 to 20 and give ourselves the flexibility to set up extra high courts and appoint additional temporary judges when required."
RAJ_indian_lunacy_act: "Improved Facilities for the Lunatics"
RAJ_indian_lunacy_act_desc: "The Indian Lunacy Act will reform laws about lunatic and psychotic idiots, and how they should be treated in and out of asylums."
