# RIN
RIN_united_front: "United Front"
RIN_united_front_desc: "In a rare moment of unity, the Indian Independence Committee has forged an alliance of revolutionaries—§qNationalists§!, §rRadicals§!, and §gIdealists§!—who have come together to shatter the chains of British rule. Fueled by a shared hatred for colonial oppression, this alliance combines the fire of India's revolutionary spirit with the strategic support of foreign allies. Though these factions have vastly different visions for India's future, they are united in their belief that freedom must come first, at any cost."
RIN_max_von_oppenheim: "Max von Oppenheim"
RIN_max_von_oppenheim_desc: "Under the steely gaze of the §YGerman Supervisor§!, the Indian Independence Committee has transformed into a formidable force, assisted by vast financial resources, intelligence, and military teachings, they might very well turn the tide of rebellion in their favor. Yet, this power comes at a cost—their newfound strength is shackled to German ambitions, and the relentless pressure to serve foreign interests looms over their struggle for true independence. In this fierce dance of power, the flames of freedom burn bright, but so too does the shadow of external control."
