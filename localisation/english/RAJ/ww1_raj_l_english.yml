HYD_nizam_of_HYDerabad: "Nizam of Hyderabad"
ww1_princely.4.t: "Lord Hardinge's letter to Sir Kishen Pershad"
ww1_princely.4.d: "\"My dear Sir Kishen Pershad,\n\nI cannot leave Hyderabad without sending you a line to say how glad I am to have the pleasure of making your acquaintance, and of discussing with you the general situation. You have had heavy responsibilities in the past, and it rejoices me to think that you had always retained the confidence of His Highness the late Nizam.\nI hope you will accept the accompanying photograph as a small token of my esteem towards you. With my best wishes for your success and prosperity.\n\nBelieve me to be,\nYours very sincerely,\nHardinge of Penshurst.\""
ww1_princely.4.a: "Cool"
