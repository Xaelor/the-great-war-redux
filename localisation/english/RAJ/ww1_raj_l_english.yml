# Economy Tree
RAJ_indian_paper_currency_act_m_1910: "Shatter the Circle of Issue"
RAJ_indian_paper_currency_act_m_1910_desc: "Paper currencies valid in the Bombay Presidency are not in the Madras Presidency, paper currencies valid in the Madras Presidency are not in the Bengal Presidency, etc. This way of doing hinders the circulation of paper notes in India, by making universal currency notes the economy will flow smoother within India proper."
