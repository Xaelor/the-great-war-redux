# Imperial Legislative Council
RAJ_imperial_legislative_council: "Imperial Legislative Council"
RAJ_imperial_legislative_council_desc: "The Imperial Legislative Council, established under the §YGovernment of India Act§! of 1853, is India's sole legislative body. Its position gradually strengthened, leading up to the §YIndian Council Act§! of 1909, which increased the number of members from 16 to 60. Of these, 27 were to be elected, with Muslims specifically assigned six seats in the Council.\n\nThe council regularly meets to enact new laws necessary to keep the Raj in an orderly state. However, some laws require more 'focus' from the government to be properly implemented. If the government procrastinates on its duties, it could lose the §YConfidence§! of both the British government and the local population, and the administration will slowly collapse.\n\nThe current §YState of the Raj§! gives us the following effects :\n[RAJ_sotr_consumer_goods_loc][RAJ_sotr_stability_loc][RAJ_sotr_resources_loc][RAJ_sotr_ppgain_loc][RAJ_sotr_cs_loc][RAJ_sotr_fo_loc][RAJ_sotr_mp_loc][RAJ_sotr_nothing_loc]"

ww1_council_raj.0.t: "The Imperial Legislative Council"
ww1_council_raj.0.d: "The Imperial Legisaltive Council is what keeps the Raj running, holding a meeting every few months in order to enact new laws. Rest assured : most of them are just minor amendments. However, some laws will demand your special attention to enforce them.\n\nShould you focus on other matters, the Raj administrative machine will crumble, as well as the confidence of both your subjects and your masters."
ww1_council_raj.0.a: "Let's get to it."

council_meeting_march_1910_held: "The §YCouncil Meeting of March 1910§! was held."
RAJ_next_council_meeting: "Next Council Meeting"

ww1_council_raj.1.t: "Council Meeting of December 1910"
ww1_council_raj.1.d: "XII. to amend the law relating to Glanders and Farcy.\nXIII. to amend the Prisons Act, 1894.\nXIV. to amend the Indian Emigration Act, 1908.\nXV. to consolidate and amend certain Acts relating to Cantonments.\nXVI. to provide for certain matters in connection with the taking of the Census.\nXVII. to provide for the continuance of the Prevention of Seditious-Meetings Act, 1907."
ww1_council_raj.1.a: "Very well."
council_meeting_december_1910_held: "The §YCouncil Meeting of December 1910§! was held."

ww1_council_raj.2.t: "Council Meeting of March 1911"
ww1_council_raj.2.d: ""
ww1_council_raj.2.a: "Very well."
