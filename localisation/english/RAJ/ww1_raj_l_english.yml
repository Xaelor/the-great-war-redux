RAJ_viceroy_executive_council_category: "Viceroy's Executive Council"
#RAJ_viceroy_executive_council_category_desc: "Established as an advisory council by the §YRegulating Act§! of 1773 and transformed into a functioning cabinet by the §YIndian Councils Act§! of 1861, the Viceroy's Executive Council is the effective government of the Raj, with each member having an assigned portfolio such as revenue, military, law, finance, home and public works. The Commander-in-Chief also sits on the Council as an extraordinary member.\n\nIf deemed necessary, the Viceroy is allowed to overrule the Council on affairs. The Indian Councils Act 1909, also known as the §YMorley-Minto Reforms§!, enabled the Viceroy to nominate one Indian member to the Executive Council, leading to the appointment of §YSatyendra Prasanna Sinha§! as the first Indian member.\n\nThe current Secretary of State for India is : §Y[RAJ_secretary_of_state_for_india]§!\n\nThe current §YConfidence§! of the §YBritish Government§! towards our administration is [?RAJ_british_confidence_var|%%+], giving us the following effects:\n[RAJ_BC_drift_def_loc][RAJ_BC_pp_advisor_loc][RAJ_BC_ppgain_loc][RAJ_BC_hc_loc][RAJ_BC_ml_loc][RAJ_BC_me_loc][RAJ_BC_cs_loc][RAJ_BC_nothing_loc]\nThe current §YConfidence§! of the §YIndian Population§! towards our administration is [?RAJ_indian_confidence_var|%%+], giving us the following effects :\n[RAJ_IC_fo_loc][RAJ_IC_do_loc][RAJ_IC_ws_loc][RAJ_IC_sl_loc][RAJ_IC_lrf_loc][RAJ_IC_nd_loc][RAJ_IC_ppsf_loc][RAJ_IC_nothing_loc]"
