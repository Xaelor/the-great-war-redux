ww1_raj.44.t: "Inauguration of [ROOT.Capital.GetCapitalVictoryPointName]"
ww1_raj.44.d: "After years of meticulous planning, hard work, and tireless dedication, the construction of the [RAJ_capital_loc] is finally complete. This grand city, designed to serve as the administrative and symbolic center of British rule in India, now stands proudly as a testament to the power and reach of the Raj.\n\nSprawling avenues, majestic government buildings, and state-of-the-art infrastructure have transformed [ROOT.Capital.GetCapitalVictoryPointName] into a modern marvel, blending British architectural elegance with local cultural elements. The Viceroy and key officials held a grand opening ceremony, with public celebrations across the city."
ww1_raj.44.a: "Fabulous."
ww1_raj.45.t: "The Pianma Kachin Tribe Requests Annexation"
ww1_raj.45.d: "Two tribal leaders from the Kachin Hills petitioned the British Burmese administration to annex the Pianma Kachin Cheifdom which is under Chinese suzerainty. The area is overseen by local officials, Tosa, appointed by the Qing Dynasty of China. However, direct Qing rule barely exists and poorly guarded. Their petition could be used as a pretext for further territorial expansion."
ww1_raj.45.a: "Great."
