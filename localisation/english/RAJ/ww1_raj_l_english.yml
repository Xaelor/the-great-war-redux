ww1_princely.7.t: "Kishen Pershad Resigns"
ww1_princely.7.d: "The current prime minister of Hyderabad, Kishen Pershad, has resigned due to unfavorable terms with the Nizam. The Nizam decided to appoint Yousuf Ali Khan, or Salar Jung III, as his next Prime Minister."
ww1_princely.7.a: "He was a fighter, not a quitter"

HYD_factions: "The Mulki Debate"
HYD_factions_desc: "The Hyderabadi State is composed of Mulkis, which are native Hyderabad-born men, or sons of the soil, or permanent residents residing in the nation. The nation is also comprised of Non-Mulkis, often referred to as Ghair-Mulkis or Afakis, which are outsiders, most often British and British-Indian administrators. This structural seperation transformed into a crisis in the times of Prime Minister Sir Salar Jung I.\ntemp text\n[?HYD_mulki_loyalty|1Y%%]: $HYD_mulki_tt$\n[?HYD_outsiders_loyalty|1Y%%]: $HYD_outsiders_tt$" #insert Bulgaria GUI here

