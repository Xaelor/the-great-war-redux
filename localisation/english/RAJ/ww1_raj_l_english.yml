RAJ_indian_companies_act_m_1910: "Secure the Shareholders"
RAJ_indian_companies_act_m_1910_desc: "Currently, companies cannot use their capital directly in order to pay interest to their shareholders. This prevents Indian companies from being an interesting investment target for the shareholders during non profit periods, and forces them to use loopholes. The Amendment passed in March will allow this to change."
