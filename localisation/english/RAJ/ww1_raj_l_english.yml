# Propaganda Campaigns
RAJ_indian_diplomacy_category: "Propaganda Campaigns"
RAJ_indian_diplomacy_category_desc: "§mPropaganda Campaigns§! in the Raj are one of the many ways in which our administration maintains its hold on the subcontinent. They are essential to keep the Indian people united and to ensure their support of the ([ENG.GetFlag]) §YBritish rule§!. However, we cannot run too many §mPropaganda Campaigns§! at once, as this would overload the Indian population, therefore we are limited to §Rthree Propaganda Campaigns§! at a time.\n\nCurrently, we are leading [?indian_diplomacy|Y0]§Y/3§! §mPropaganda Campaigns§!.\n"
