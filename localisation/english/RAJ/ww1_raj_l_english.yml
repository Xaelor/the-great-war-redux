RAJ_state_of_the_raj_dynamic: "State of the Raj"
RAJ_state_of_the_raj_dynamic_desc: "The Raj is essentially a patchwork of various political and administrative entities with varying levels of autonomy.\n\nOur rule is defined by the amalgamation of laws and traditions from the §YMughals§!, the §YPrincely States§!, and the §YEast India Company§! presidencies, merged together into a byzantine legal apparatus.\n\nState building in India is more about delaying the inevitable §RPandemonium§! than it is about a civilisational mission."

