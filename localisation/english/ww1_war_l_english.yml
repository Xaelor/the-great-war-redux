 # Messages
 revolt_supressed_message: "The §YRebellion§! has been §Rsupressed§!."
 #China
 xinhai_revolution_end_message: "§YThe Chinese Revolution§! brought about the fall of @QIN §Ythe Chinese Empire§! with its thousands of years of history. However, reorganizing the vast territory of @CHI §YChina§! will be a tremendous undertaking, and there is still a very long way to go to end §Ythe century of national humiliation§!."
 xinhai_revolution_alt_message: "@QIN §YThe Chinese Empire§!, with its thousands of years of history, has endured countless turmoil. This time is no different; the Mandate of Heaven has merely been slightly disrupted. However, it seems the true master of Beijing is no longer the young emperor, but a seasoned and ambitious general."
 chinese_second_revolution_message: "Not long after its birth, the young @CHI §YRepublic of China§! was plunged into a bitter civil war. Backed by military might, an authoritarian @CHI §Yiron-fisted ruler§! crushed the vain ideals of the @FROM §Yrevolutionaries§! and projected his power across the south."
 national_protection_war_end_message: "§YThe National Protection War§! ends without either side achieving a complete victory. While the total collapse is prevented, @CHI §YChina§! would once again face a period of division and strife."
 national_protection_war_end_alt_message: "§YThe National Protection§! have succeeded. From Yunnan to Hebei, the banners of those who seek to §Yuphold the Republic§! are raised high. §YThe false emperor§! has fallen, ambitious §Ywarlords§! have vanished, and those obsessed with factionalism have quietly fallen silent. Only the banner of saving the Chinese people flutters."
 zhili_anhui_war_end_message: "The monopoly of power held by @ANC §YDuan Qirui§! and the §YAnhui Clique§! has come to an end. As the leaders of @ZHC §YZhili§! and @FNG §YFengtian§! face each other in Beijing, debating how to divide the regime, the common goal of overthrowing @ANC §YAnhui§! has vanished, leaving only a scramble for power."
 first_zhili_fengtian_war_end_message: "The first clashes between @ZHC §YZhili§! and @FNG §YFengtian§! ended with a decisive victory for @ZHC §YZhili§!. @FNG §YFengtian§! retreats back to its base and seeks reconciliation. @ZHC §YZhili§! has, for now, secured control of most of China's key regions."
 yung_feng_incident_message: "The coup in Guangzhou completely thwartes the @KMT §YKMT§!'s Northern Expedition, leaving the @KMT §YKMT§! with an even more difficult path to take."
 second_zhili_fengtian_war_end_messsage: "@ZHC §YZhili§!'s hegemony has been shattered. §YCao Kun§! is overthrown, and §YWu Peifu§! barely flees to his base. And in the void left by the collapse, @FNG §YFengtian§! seeks to rule China."
 anti_chiang_war_end_message: "Countless warlords rose up against the one man who holds all power, but ultimately all power still lies with §YChiang Kai-shek§!. Yet, to him, all he see is the bare face of @CHI §YChina§!, a place of scars and destruction."
 anti_chiang_war_end_alt_message: "Countless warlords rose up against the one man who held all power, and now the power is with §YYan Xishan§!, who reads the ocean currents more quietly and perfectly than anyone else. Yet, to him, all he see is the bare face of @CHI §YChina§!, a place of scars and destruction."
 tanggu_truce_message: "@CHI §YChina§!'s internal divisions and impotence led to the @JAP §YJapanese§! invasion, the fall of @MAN §YManchuria§!, and the greatest foreign threat ever. But @CHI §YChina§! is not finished yet. South of the Great Wall, the central plains of the Huaxia people will once again awaken to their immense potential and march as a volunteer army, returning to its glory. Unless, of course, the dragon is beheaded before then."
 yunnan_kmt_message: "When §YTang Jiyao§! lost power in Yunnan, the @YUN §YYunnan Clique§! turns to allies with the @KMT §YKuomintang§!."
 anti_fengtian_war_zhili_message: "Like an old fox, §Ythe Jade Marshal§! seek an opportunity for revenge. The @ZHC §YZhili Army§! rises again, determines to punish the man who stabbed him in the back."
 guangxi_kmt_message: "When §YLu Rongting§! lost power in Guangxi, the @GXC §YGuangxi Clique§! turns to allies with the @KMT §YKuomintang§!."
 northern_expedition_end_message: "@KMT §YThe bright sun illuminates§! the land of China like a scorching red flame. There is not much left until the final chapter of the §YChinese Republican Revolution§!. Yet, @CHI §YChina§! remains scarred by warlordism, factionalism, and war. And perhaps another massive current threatens to tear @CHI §YChina§! apart."
 anti_fengtian_war_fujian_message: "@FNG §YFengtian§!'s relentless army pauses for a moment, standing still. The Jiangnan region once again takes a different path from Beijing. And the one walking that path is §Ythe Smiling Tiger§!."
 khabarovsk_protocol_message: "@FNG §YFengtian§! adventurism has been submerged in a @SOV §Yred tide§!. Upon learning of his place, the young leader will be heartbroken and may even lose his judgment. But more importantly, the @RUS §YRed Army§! proved itself powerful not only in the snowfields and taiga of Russia, but also on the plains of @MAN §YManchuria§!."
 khabarovsk_protocol_alt_message: "The young leader from @FNG §YFengtian§! now has his sights set on a new goal: Just as a rock remains in the sand even when the red waves crash against it, China is ready to confront @SOV §Yred imperialism§!."
 long_march_message: "@PRC §YChinese socialists§!, enduring arduous hardships and opposition, find refuge in the mountains of Shaanxi. But at what cost? Did they really find the Canaan they had been promised?"
 treaty_of_kyakhta_message: "The attempt by the newly established @MON §YMongolian Nation§! to unify the Mongolian steppes ended in failure. Caught in a precarious position between the influences of two foreign powers, @RUS §YRussia§! and @CHI §YChina§!, which are not even fully independent nations, the complete independence of @MON §YOuter Mongolia§! remains a distant prospect, and the @MON @MEN §YMongolian People§! have once again entered a period of division."