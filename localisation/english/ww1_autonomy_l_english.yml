l_english:
 autonomy_tgwr_unilateral_union: "Unilateral Union"
 autonomy_tgwr_unilateral_union_desc: "\n§LUnilateral Union is defined as a state in which the protected state has voluntarily declared its intention to be subordinate in the hierarchy. In contrast, the suzerain state has not expressed an intention to exercise dominion or protection. In the majority of cases, such a union is observed to manifest briefly prior to the integration of the two states, or the dissolution of the relationship following a brief period of existence. The suzerain state exerts minimal influence in the political and economic spheres.§!" #I'm not sure that we should remove this - Frosty
 #DELETE STUFF ABOVE

 autonomy_tgwr_nominal_constituency: "Nominal Constituency"
 autonomy_tgwr_nominal_constituency_desc: "\n§LNominal Constituency is a de jure part of a country which became de facto independent due to a collapse of the central government, likely due to a civil war.§!"

 autonomy_tgwr_client_state: "Client State"
 autonomy_tgwr_client_state_desc: "\n§LClient State is a country politics of which are either covertly or overtly influenced by a foreign power, which nontheless officially retains an independent government. Client states are controlled informally, which makes it easier for them to combat foreign influence.§!"

 autonomy_tgwr_occupied_state: "Occupied State"
 autonomy_tgwr_occupied_state_desc: "$joins_wars_automatically_tt$\n\n§LOccupied State is a country occupied by the military of a foreign power. It can act autonomously from the occupying power as long as they're allowed to, and in general their legal status remains unclear.§!"

 autonomy_tgwr_regional_government: "Regional Government"
 autonomy_tgwr_regional_government_desc: "\n§LRegional Government is a part of a country autonomously ruled by a local influential politician or military leader, who typically have a loyal following or military strength backing them, allowing them to disobey the central government.§!"

 autonomy_tgwr_protected_state: "Protected State"
 autonomy_tgwr_protected_state_desc: "\n§LProtected State is a country that enjoys protection of a foreign power while retaining its international personality and enjoying an agreed amount of independence in conducting its foreign policy.§!"

 autonomy_tgwr_protectorate: "Protectorate"
 autonomy_tgwr_protectorate_desc: "$joins_wars_automatically_tt$\n\n§LProtectorate is a country or a collection of countries with foreign policy and internal affairs partially or fully controlled by a foreign power. Unlike colonies, protectorates are treated as separate legal entities under international law, represented by their protecting power.§!"

 autonomy_tgwr_military_government: "Military Government"
 autonomy_tgwr_military_government_desc: "$joins_wars_automatically_tt$\n\n§LMilitary Government is a territory administered by the military of a foreign power for the benefit of that foreign power. Military govenments usually treat the native population of their territory as expendable and use the harshest means to suppress its dissent.§!"

 autonomy_tgwr_feudal_autonomy: "Feudal Autonomy"
 autonomy_tgwr_feudal_autonomy_desc: "\n§LFeudal Autonomy is a nominally constituent part of a country ruled by a local hereditary leader, who fully controls their territory. Feudal autonomies often oppose the central government's efforts to centralize the state, as it would strip their rulers of their influence.§!"

 autonomy_tgwr_ottoman_emirate: "Ottoman Emirate"
 autonomy_tgwr_ottoman_emirate_desc: "\n§LOttoman Emirate is a tribal entity nominally under the rule of the Ottoman Sultan, but for geographic reasons remaining autonomous. Ottoman emirates are usually ruled by tribal leaders as hereditary monarchs.§!"

 autonomy_tgwr_personal_union: "Personal Union"
 autonomy_tgwr_personal_union_desc: "\n§LPersonal Union is a union of two or more monarchies, that share the same monarch, while remaining two distinct entities. In personal unions, both states retain their independence and have their interests, though monarch's interests might not always align with the wants of one of the states.§!"

 autonomy_tgwr_real_union: "Real Union"
 autonomy_tgwr_real_union_desc: "$joins_wars_automatically_tt$\n\n§LReal Union is a union of two or more monarchies, that share the same monarch and have some common institutions. In real unions, one state is clearly is weaker than the other, and thus subordinate to it.§!"

 autonomy_tgwr_concession: "Concession"
 autonomy_tgwr_concession_desc: "§LConcession is a territory of a coutry with an extraterritorial jurisdiction of a foreign power. In concessions, citizens of a foreign power have the right to settle, trade and travel freely, and an administration is set up to represent the foreign population.§!"

 autonomy_tgwr_colony: "Colony"
 autonomy_tgwr_colony_desc: "$joins_wars_automatically_tt$\n\n§LColony is a territory under the rule of an empire, which settles it with its own citizens and exploits its resources and native population for their benefit.§!"

 autonomy_tgwr_self_governing_colony: "Self-governing Colony"
 autonomy_tgwr_self_governing_colony_desc: "$joins_wars_automatically_tt$\n\n§LSelf-governing Colony is a colony of an empire with significant degree of local autonomy for the settler population, which typically elects its own government.§!"

 autonomy_tgwr_dominion: "Dominion"
 autonomy_tgwr_dominion_desc: "$joins_wars_automatically_tt$\n\n§LDominion is a self-governing territory of an empire almost entirely independent from it in its internal affairs, as well as in foreign policy to a lesser extent.§!"

 autonomy_tgwr_condominium: "Condominium"
 autonomy_tgwr_condominium_desc: "$joins_wars_automatically_tt$\n\n§LCondominium is a territory jointly owned and administered by two or more foreign powers. In general, one foreign power is much stronger than the other, making it prime beneficiary of owning a condominium.§!"

 autonomy_tgwr_milrevcom: "Military Revolutionary Committee"
 autonomy_tgwr_milrevcom_desc: "$joins_wars_automatically_tt$\n\n§LMilitary Revolutionary Committee is a revolutionary organization controlling a certain territory with an aim to spread the revolution beyond it. Usually it's actions are coordinated from the party headquarters, and it is allowed a degree of autonomy in its actions.§!"

 autonomy_tgwr_assr: "Federated Soviet Republic"
 autonomy_tgwr_assr_desc: "$joins_wars_automatically_tt$\n\n§LFederated Soviet Republic is an autonomous part of a socialist country, usually representing an ethnic minority. Its governemt is allowed to exercise its power within the territory of an autonomous SR, but is subject to the party line and the interests of a country as a whole.§!"

 autonomy_tgwr_ssr: "Soviet Republic"
 autonomy_tgwr_ssr_desc: "$joins_wars_automatically_tt$\n\n§LSoviet Republic is a socialist country which is tied to another socialist country by the virtue of being ruled by the same party and one of them being clearly stonger then the other. Most of the time it posseses complete autonomy over internal affairs, but follows the lead of a socialist state where the main party headquarters are located.§!"

 autonomy_tgwr_autonomous_governorate: "Autonomous Governorate"
 autonomy_tgwr_autonomous_governorate_desc: "$joins_wars_automatically_tt$\n\n§LAutonomous Governorate is a part of a country with a special administrative status, with laws differing from the rest of the country, usually to represent an ethnic minority. Autonomous governorates remain under a full control of the central government, which appoints its governor directly.§!"

 autonomy_tgwr_federal_subject: "Federal Subject"
 autonomy_tgwr_federal_subject_desc: "$joins_wars_automatically_tt$\n\n§LFederal Subject is a part of a country with a special administrative status, with laws differing from the rest of the country, usually to represent an ethnic minority. Federal subjects typically elect their own governors and representatives, who have a right to pass their own laws, as long as they don't contradict the federal constitution.§!"

 cant_change_autonomy_tt: "§RCan't change autonomy level by regular means!§!"
 joins_wars_automatically_tt: "§YJoins wars on the side of their overlord automatically§!"
 protectorate_call_ally_rule_tt: "§RCan not call this subject type into wars!§!"
 protectorate_join_ally_rule_tt: "§RThis subject type can not join wars!!§!"
