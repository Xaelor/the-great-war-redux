 GER_berlin_baghdad_railway_construction: "Baghdadbahn Construction"

 #Events
 ww1_berlin_baghdad.1.t: "[GER.GetForeignName] Wants to Extend the Baghdadbahn"
 ww1_berlin_baghdad.1.d: "The [GER.GetForeignName] has asked us for the permission to continue the construction of the Berlin-Baghdad Railway. They are willing to foot the entire bill, and the railway would benefit us greatly by connecting the southern vilayets and the Persian Gulf area with the rest of the empire. However, this would push us further in the direction of an alliance with the Germans, and threaten Russian and British spheres of influence in Persia and the Persian gulf. We have to be careful and decide, whether potentially angering two great powers is the price we're ready to pay for modernization of our infrastructure."
 ww1_berlin_baghdad.1.a: "We welcome this investment, of course."
 ww1_berlin_baghdad.1.b: "We don't want it, actually."
 ww1_berlin_baghdad.2.t: "[TUR.GetForeignName] Grants Us the Permission for Construction"
 ww1_berlin_baghdad.2.d: "As expected, the Turks couldn't resist our generous proposal, meaning now we have to pay the entire expense of the project and send our experts in the Middle East. Hopefully, the Russians and the British don't  the construction."
 ww1_berlin_baghdad.2.a: "Proceed immediately"
 ww1_berlin_baghdad.3.t: "[TUR.GetForeignName] Refuses the Construction"
 ww1_berlin_baghdad.3.d: "Unexpectedly, the Turks refused to grant us the permission for construction, even though we offered to pay the entire expense. Perhaps, they'd rather be friends with Russia and Britain, who want to take their territory for themselves."
 ww1_berlin_baghdad.3.a: "Ungrateful Turks."
 ww1_berlin_baghdad.4.t: "[GER.GetForeignName] is Expanding the Berlin-Baghdad Railway"
 ww1_berlin_baghdad.4.d: "The Germans have decided to start another stage of the Berlin-Baghdad Railway construction, threatening our influence in the region. Should we issue a protest to get them to back down!"
 ww1_berlin_baghdad.4.a: "Of course we protest!"
 ww1_berlin_baghdad.4.b: "We don't need a conflict with them right now."
 ww1_berlin_baghdad.5.t: "[ENG.GetName] Protests the Berlin-Baghdad Railway"
 ww1_berlin_baghdad.5.d: "[ENG.GetName] apparently thinks that that our dealings with Turks concern them and issued a formal protest against the construction of the Baghdadbahn. Should we even consider their opinion on the matter?"
 ww1_berlin_baghdad.5.a: "This is none of their concern."
 ww1_berlin_baghdad.5.b: "Don't care, didn't ask."
 ww1_berlin_baghdad.6.t: "[GER.GetForeignName] Backs Down"
 ww1_berlin_baghdad.6.d: "Our pressure on the Germans has been fruitful, as it appears that they've halted the construction of the Berlin-Baghdad Railway. This calls for a celebration of our diplomatic victory."
 ww1_berlin_baghdad.6.a: "Great news!"
 ww1_berlin_baghdad.7.t: "[GER.GetForeignName] Refuses to Back Down"
 ww1_berlin_baghdad.7.d: "It appears that our threats fall on deaf ears, as the [FROM.GetName] still refuses to back down and stop the project. Are we prepared for a full on trade war to kill the Baghdadbahn?"
 ww1_berlin_baghdad.7.a: "Issue a trade embargo."
 ww1_berlin_baghdad.7.b: "We have to back down."
 ww1_berlin_baghdad.8.t: "[ENG.GetName] Issues Trade Embargo"
 ww1_berlin_baghdad.8.d: "In a stunning move, [ENG.GetName] actually followed through with their threats and officially seized all trade with us. This is the last opportunity for us to save relations between our countries."
 ww1_berlin_baghdad.8.a: "We have to deal with this situation."
 ww1_berlin_baghdad.9.t: "Germany and Turkey Stand Definant"
 ww1_berlin_baghdad.9.d: "It appears that our embargo was ignored, as the [GER.GetForeignName] still refuses to back down and stop the project. Are we prepared for a full scale war to protect our possessions in the Persian Gulf?"
 ww1_berlin_baghdad.9.a: "War it is."
 ww1_berlin_baghdad.9.b: "No, this is madness."
 ww1_berlin_baghdad.10.t: "Construction Ended Prematurely"
 ww1_berlin_baghdad.10.d: "As a result of circumstances outside of our control, our construction efforts have been halted. We were able to gather what remained of our assets, but we won't be able to resume construction for some time."
 ww1_berlin_baghdad.10.a: "Unfortunate."
 ww1_berlin_baghdad.11.t: "[TUR.GetForeignName] Revokes Our Permit"
 ww1_berlin_baghdad.11.d: "Our permission for the Baghdadbahn construction has suddenly been revoked by the Turkish government. We were able to gather what remained of our assets, but we won't be able to resume construction for some time."
 ww1_berlin_baghdad.11.a: "What is this, some sort of Backstab?"
 ww1_berlin_baghdad.12.t: "[TUR.GetForeignName] Kills the Baghdadbahn"
 ww1_berlin_baghdad.12.d: "To our surprise [FROM.GetName] has decided to end the German construction permission. A welcome development, as it creates between their governments and makes our assets in the region safer."
 ww1_berlin_baghdad.12.a: "Reward them with lifting the embargo."

