 GUD_uncertain_mission: "Uncertain Mission"
 GUD_uncertain_mission_desc: "The Gudfiyya Brotherhood had no real set goals to acheive, apart from irritating the French as much as possible. Every Sheik and Soldier is a different head, leading our Brotherhood in another direction, and Ma al'-aynayn is the glue keeping us together. We better hope nothing bad happens to him!"