 ww1_morocco.59.t: "War in Europe"
 ww1_morocco.59.d: "The war that France is waging in Europe has provoked the call of Moroccan riflemen. Consequently, we are de facto involved in the ongoing conflict and must provide assistance to France."
 ww1_morocco.59.a: "It's war, then"


 ww1_morocco.89.t: "The Lion of the Sahara Sleeps"
 ww1_morocco.89.d: "Sheikh Ma al-'Aynayn, the founder of Smara and the spiritual guide of the Sahrawi tribes, has passed away in Tiznit. For decades, he stood as a monolithic barrier against European imperialism, uniting the disparate tribes of the Sahara under the banner of Jihad. Although his heart has stopped beating, the fire he ignited burns brighter than ever. His son, Ahmed al-Hiba, stands ready to take up the mantle of the 'Blue Sultan' and lead the faithful against the invaders. The Sheikh is dead; long live the Sultan."
 ww1_morocco.89.a: "His legacy shall endure forever."



 # Gudfiyya
 ## Idea
 GUD_nation_of_poets: "Land of a Thousand Poets"
 GUD_nation_of_poets_desc: "Mauritania and the lands of the Sahrawi is often labled as 'The Land of a Thousand Poets' due to our ancient oral traditions and deep roots with literature in our culture. This means that a vast amount of the population is educated in many forms of arts, and are capable of atleast minor reading comprehension."

