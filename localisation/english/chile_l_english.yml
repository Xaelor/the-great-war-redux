CHL_send_officers_to_germany:0 "Send Officers To Germany"
CHL_send_officers_to_germany_desc:0 "To modernize our military and enhance its effectiveness, we will send our best officers to Germany to study their tactics and strategies. By learning from one of the world's leading military powers, our officers will gain invaluable knowledge and experience. Upon their return, we can implement these new techniques, greatly boosting our army."
