ww1_chile.1.t:0 "President Pedro Montt Dies!"
 ww1_chile.1.d:0 "The president was sick of arteriosclerosis and arrhythmia, and each day it got worse.\n\nOn 16 of July, he embarked for Germany, with his wife and his doctor, hoping that the German doctors could treat him.\nThe trip was very tiring and the last strength that he had was lost.\n\nHe came to Bremen on the 16 of August and was stationed in a hotel with his small entourage. Near midnight of that day, he went to the bathroom. His private secretary noticed that he did not come back after a long time, went to look for him. When he got to the bathroom, he found him dead.\nThe probable cause of death was a heart attack or a stroke."
 ww1_chile.1.a:0 "He shouldn't have ignored the advice of Father Tadeo."
 ww1_chile.2.t:0 "President Elías Fernández Albano Dies!"
 ww1_chile.2.d:0 "Fernández Albano was hella sick, in fact, there's reports he told our late president pedro montt montt he was even sicker than him, anyway, he caught a cold during Montt's funeral, which soon turned into pulmonary, causing him to die of heart failure after only three weeks in office.\nThe country is stunned, there are only two weeks left until the century of Chilean independence, and there is no president to celebrate it."
 ww1_chile.2.a:0 "We shall call for elections."
 ww1_chile.3.t:0 "The [GetYear] Chilean Presidential Election"
 ww1_chile.3.d:0 "The Year Is [GetYear],His Excelency President Montt has died, his succesor, His Excelency Vicepresident Fernandez has died too, and His Excelency Vicepresident Figueroa has taken over in replacement. the parties, as a symbol of unity,have agreed on a united candidate, who will that be? the initial candidates, Agustin Edwards And Juan Luis Sanfuentes, are both very capable for the however, they kinda hate each other,that's why another possible candidate has risen, Ramon Barros Luco, an old figurehead who wont do shit,A President Who Holds No Threat"
 ww1_chile.3.a:0 "The President Who Holds No Threat"
 ww1_chile.3.b:0 "A Young, And Modern Perspective Rises In The Moneda Palace"
 ww1_chile.3.c:0 "Oh No, Please Not Another 1891 Again"
 ww1_chile.4.t:0 "Inauguration of Ramón Barros Luco"
 ww1_chile.4.d:0 "The philosophy of Barros Luco's government can be summarised with the following phrase, well known in Chile, "99% of problems solve themselves, and the remaining 1% have no solution"."
 ww1_chile.4.a:0 "Someone who poses no threat to anybody."
 ww1_chile.5.d:0 "It is a bitter contest between Juan Luis Sanfuentes — candidate of Coalicion Conservadora, and Javier Ángel Figueroa — supported by Alianza Liberal"
 ww1_chile.5.a:0 "Coalicion Returns To Power Once Again"
 ww1_chile.5.b:0 "A Second Term For Alianza Liberal"
 ww1_chile.6.t:0 "[GetYear] Chilean Presidential Inauguration"
 ww1_chile.6.d_1:0 "Sanfuentes beat Figueroa by a single vote in the electoral vote, with numerous allegations of fraud and electoral intervention. Due to the controversy, the National Congress made a contingent vote, which Sanfuentes won by 77 votes to 41."
 ww1_chile.6.d_2:0 "Figueroa beat Sanfuentes by a single vote in the electoral vote, there were attempts of fraud and electoral intervention by the Balmacedist-Conservative Coalition but they failed."
 ww1_chile.6.a:0 "That was totally fair."
 ww1_chile.6.b:0 "That was close."
 ww1_chile.9.t:0 "Foundation of the Socialist Workers' Party"
 ww1_chile.9.d:0 "Although it is not the first worker's socialist organization in Chile, the POS was established in association number of socialist militants with a high influence on the workers and their organizations. Actively participates in the Federation Obrera de Chile, assuming the entirety of its trade union leadership."
 ww1_chile.9.a:0 "Will this mark the rise of socialism?"
 ww1_chile.10.t:0 "Peruvians Demand Tacna"
 ww1_chile.10.d:0 "The Peruvian nationalists demand that we should return Tacna which had been occupied in the War of the Pacifics."
 ww1_chile.10.a:0 "Sure."
 ww1_chile.10.b:0 "Come and get it."
 ww1_chile.11.t:0 "Bolivians Demand Antofagasta"
 ww1_chile.11.d:0 "The Bolivians nationalists demand that we should return Antofagasta which had been occupied in the War of the Pacifics."
ww1_chile.12.z:0 "The [GetYear] Chilean Parliamentary Election"
ww1_chile.12.d:0 "This Year's Elections Are Very Interesting,Its Finally The time for voters to evaluate [CHL.GetLeader]'s mandate"
ww1_chile.12.a:0 "A Somewhat Good Victory For [CHL.GetDemocraticParty]"
ww1_chile.13.t:0 "The [GetYear] Chilean Parliamentary Election"
ww1_chile.13.d:0 "In both chambers[CHL.GetNeutralParty] managed to prevail over [CHL.GetDemocraticParty] by a wide margin, The population growth in these three years was minimal, so there were no objections in the Electoral Division of Chile, the country grew almost 1.3% annually. However, the number of votes did increase since many decided to belong to the increasingly broad social spectrum of citizens and make use of their right to vote in accordance with the legal provisions of the Constitution of 1833."
ww1_chile.13.a:0 "We Will Be Looking Foward To This Year's Presidential Election."
ww1_chile.14.t:0 "The [GetYear] Chilean Parliamentary Election"
ww1_chile.14.d:0 "[CHL.GetDemocraticParty] achieved an important victory in both chambers, composed on this occasion by the Radical Party as the axis, together with the Liberal Party, the Democratic Party and the Liberal-Democratic Alliance Party.The hegemony that [CHL.GetNeutralParty]obtained over the elections and the cabinets in previous years began to be affected by the image of conservatism defending the oligarchy and the powerful class, versus the workers, a mass that grew every day in intellectuality and civic consciousness.[CHL.GetFascistParty] participated in the electoral contest, a party that promoted a scientific approach to politics; however, like the proletarian movements, it did not obtain parliamentary representation."
ww1_chile.14.a:0 "A Tough Hit To [CHL.GetLeader]'s mandate "
ww1_chile.15.t:0 "The Foundation Of The Partido Nacionalista "
ww1_chile.15.d:0 "formed by a group of intellectuals disillusioned with party struggles, the discussion of old doctrinal disputes and the sterility of the public function of the executive and legislative powers in solving the country's social and economic problems. Many of them had joined in some way in the liberal and conservative parties of the time.Regarding the name of the Party (or Union) and its date of creation, there is no great clarity. In certain sources, a Nationalist Union is named, created in 1913, which would correspond to the Nationalist Party, the name by which it is better known. Other sources cite 1914 or 1915 as the year of foundation."
ww1_chile.15.a:0 "What A Bunch Of Racist Morons"
ww1_chile.16.t:0 "[CHL.GetNameDef] Want To Purchase Our Newest Model, The Canada Class"
ww1_chile.16.d:0 " "Our Centenario Plan is of the utmost importance if we are to win this dreadnought naval race. In order to fulfill it, we must purchase a dreadnought from our friends across the world, the British. If our purchase is approved we’ll have one of the most powerful navies in the world."That's what the chilean ambassador in the uk has told us"
ww1_chile.16.a:0 "Our Friendship Goes Back To Their Independence, I Dont See Why Not"
ww1_chile.16.b:0 "The Hell With Them"
ww1_chile.17.t:0 "The Fear Of War..."
ww1_chile.17.d:0 "As War Is Expected In Europe, the british have begun to reinforce their,although still powerful,navy,that's why today the've gotten here in the coin palace an offer of the british offering the purchase of the,still in production, Almirante Latorre, for a million pounds."
ww1_chile.17.a:0 "we paid too much money to throw away our dreams like that"
ww1_chile.17.b:0 "2 Civs? hell yeah,and its not like we are going to war anytime soon"
ww1_chile.18.t:0 "The British Have Agreed!"
ww1_chile.18.d:0 "yay"
ww1_chile.18.a:0 "Let's How Will Argentina And Brazil React To This Movement"
ww1_chile.19.t:0 "Repurchase Of The Almirante Latorre?"
ww1_chile.19.d:0 "The War is Now Seen Of Something Of The past in europe, thats why the british ambassador in santiago has come to the coin palace offering the Repurchase Of The Almirante Latorre for the same million pounds that we paid them back in the day"
ww1_chile.19.a:0 "Of Course"
ww1_chile.20.t:0 "The British Have Rejected The Purchase Of The HMS Canada"
ww1_chile.20.d:0 "After Our Meeting with the english government officials, they've,in their own polite english way that the government of HRS has no interest in selling one of their most modern dreadnoughts to [CHL.GetNameDef]"
ww1_chile.20.a:0 "Go Tell The King To Kill Himself"
ww1_chile.21.t:0 "[CHL.GetNameDef] Is Requesting A Naval Mission"
ww1_chile.21.d:0 "Year by year thanks to our saltpeter investments in the north of chile our relationship does nothing but to get better and better, so today the chileans are requesting a naval mission in their country"
ww1_chile.21.a:0 "Our Friendship Goes Back To Their Independence, I Dont See Why Not"
ww1_chile.21.b:0 "The Hell With Them"
ww1_chile.22.t:0 "The British Have Agreed!"
ww1_chile.22.d:0 "yay"
ww1_chile.22.a:0 "now nobody on southamerica will be able to defeat us on the sea"
ww1_chile.23.t:0 "The British Have Rejected Our Request Of Naval Mission"
ww1_chile.23.d:0 "WHY? I JUST DONT KNOW..."
ww1_chile.23.a:0 "its not like the german navy isnt better than them in all aspects... "
ww1_chile.21_tooltip:0 "We'll Send One Of Our Admirals To A Naval Mission in Chile"
ww1_chile.24.t:0 "The Death Of Elias Yañez"
ww1_chile.24.d:0 "General And War Of The Pacific Veteran,news today announce the death,by old age, of our beloved general"
ww1_chile.24.a:0 "He'll Be Missed"
ww1_chile.25.t:0 "Assasination Attempt On General Silva Renard!"
ww1_chile.25.d:0 "Among the dead at the Santa María massacre was Manuel Vaca, a Spanish immigrant worker. His half-brother, Antonio Ramón arrived in Chile from Argentina[4] decided to seek revenge. Ramón finally took action seven years later and bought a dagger and some strychnine.He found General Silva Renard walking alone to his office, on December 14, 1914, and stabbed him seven times on his back and head. The General started shouting “Murderer! Murderer!” and several passersby came to his help. Ramón, in turn, stopped the attack and tried to run away, only to be captured by an off-duty prison guard. When Ramón saw himself surrounded and all escapes blocked, he drank the bottle of strychnine he was carrying, but vomited most of it and was unharmed. Once in custody, Ramón vehemently denied other parties' involvement in the assassination, while the worker's organizations held public campaigns to raise money for his defense. He was eventually sentenced to five years in prison."
ww1_chile.25.a:0 "Fuck, he's gotta retire now"
ww1_chile.25.b:0 "Its just a few wounds, nothing bad"
ww1_chile.26.t:0 "The Chilean Military Mission In Germany"
ww1_chile.26.d:0 "Today has arrived a new generation of young chilean officers here to germany for their war academy studies, as its been tradition since 1895. funnily enough, now our troops have trouble recognizing their mates, the chilean uniforms are almost as same as ours! "
ww1_chile.26.a:0 "Nice, chile is an inportant ally in the region"
ww1_chile.27.t:0 "The Century Of Independence, Is There Something To Celebrate?"
ww1_chile.27.d:0 "Its Time To Organize The September 18th Celebrations, this time, they'll be very special, as we celebrate a hundred years of independence from the spanish rule, we know it'll be a big thing, very big, we just gotta decide how it'll be done"
ww1_chile.27.a:0 "A Century Of Glorious Independence!"
ww1_chile.27.b:0 "There's Nothing To Celebrate"
ww1_chile.28.t:0 "Chile Celebrates 100 Years Of Independence"
ww1_chile.28.d:0 "Centennial celebration activities began to be scheduled at the beginning of the year. The first step consisted of inviting the delegations of friendly countries; The Argentine delegation committed its attendance led by the President of the Republic. On the other hand, various public works, whose main objective was to beautify the country's cities, were inaugurated in the year of the centenary, including the Palace of Fine Arts and the Mapocho Station in Santiago. Various commemorative monuments were also inaugurated, many of which were donations from foreign colonies in Chile. That same year, the installation work on the sewage systems was completed and the new public lighting in Santiago was turned on. As part of the celebrations, a series of documents related to the events of September 18, 1810, Independence, and the main aspects of the hundred years of national history were published."
ww1_chile.28.a:0 "What A Great Country"
