ww1_chile.36.d:0 "fuckers from germany and england are holding protests in valparaiso of over 100k people, we must put and end to this,either by declaring our neutrality,or joining a side of the war, its really difficult tho, the government of [CHL.GetLeader] has held a security council meeting on the matters of the war, and they've recommended our government to stay neutral and take advantage of the war by selling saltpeter to the fighting sides, however, its clear how much our germophile army loves germany and the kaiser, and would obviously love to help them in the war "
