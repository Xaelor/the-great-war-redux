ww1_chile.47.d:0 "THE OLIGARCHY HAS REVOLVED AND TAKEN CONTROL OF SANTIAGO, BUT WE WILL FIGHT, WE WILL NTO GIVE UP WHAT WE'VE GOTTEN, VIVA CHILE, VIVA EL PARTIDO NACIONALISTA, VIVA LA PATRIA!!!!"
ww1_chile.47.a:0 "POR LA RAZON O LA FUERZA!!"
ww1_chile.48.t:0 "The Chilean Civil War"
ww1_chile.48.d:0 "As Part Of Their New Nationalistic Government Programme, they've stripped the old castillian-basque oligarchy all of their priviliges,not following the santiago accords, in response, the oligarchy has revolted and chile is now involved in a civil war"
ww1_chile.48.a:0 "Wow"
ww1_chile.49.t:0 "Chile Is Involved In A Civil War"
ww1_chile.49.d:0 "The old oligarchy has revolved against the new nationalist government in charge of the Generacion Del Centenario, a group of mad writers. their country is in chaos, and thats a good thing, its our chance to get our dear territories, lost in the war of the pacific"
ww1_chile.49.a:0 "Take Them, its the opportunity we've been waiting for"
ww1_chile.51.t:0 "Peru And Bolivia Take Control Their Old Territories"
ww1_chile.51.d:0 "Peru And Bolivia Have Taken Control Of Their Old Teritories,they've taken advantage of our situation and have restored their pre-1879 territories, no more advance has been reported"
ww1_chile.51.a:0 "FUCK, HOLY HOLY FUCK"
ww1_chile.52.t:0 "The 2nd War Of The Pacific"
ww1_chile.52.d:0 "Peru And Bolivia had Taken Control Of Their Old Teritories in the Chilean Civil War,and,of course, the chilean state has responded, a new war has unleashed in the americas"
ww1_chile.52.a:0 "will This Become a 4th Scenario For The Great War"
ww1_chile.53.t:0 "The Foundation Of The National History Museum"
ww1_chile.53.d:0 "In the first decade of the 20th century and soon to commemorate Chile's centenary, the intellectual Luis Montt Montt, then director of the National Library, proposed to organize a new historical exhibition. Once ready, occupying the former mansion of the Urmeneta family (located on Monjitas Street), it opened its doors with a large number of objects and a great success with the public."
ww1_chile.53.a:0 "Noice."
ww1_chile.54.t:0 "The Foundation Of The Concepcion University"
ww1_chile.54.d:0 "The Concepcion University has Been Founded,Its regulations were presented and approved, so that on [GetDateText] the rector of the Liceo de Concepción (now Liceo Enrique Molina) Enrique Molina Garmendia founded the university, thus becoming its first rector and its great promoter.[citation needed] The university began to operate with 123 students, belonging to the schools of Dentistry, Pharmacy, Industrial Chemistry and English Pedagogy, which would later become the Faculty of Education.17"
ww1_chile.54.a:0 "Chile,The True Land Of Inventors"
ww1_chile.55.t:0 "First Flight In Chile"
ww1_chile.55.d:0 "At the initiative of cousins Miguel Covarrubias Valdés and David Echeverría Valdés, to celebrate Chile's centennial, they had the idea of bringing a Voisin biplane to the country. The aeronautical feat was entrusted to the French brothers César and Félix Copetta Brossio. On [GetDate], after preparations, César Copetta made the first flight of an airplane in Chile, aboard a Voisin biplane. Copetta takes to the skies in the sector of the Chacra Valparaíso, currently Plaza Ramón Cruz located in the district of Ñuñoa.3"
ww1_chile.55.a:0 "Maybe We Should Open A Military Aviation School, I've Heard General Concha Is Interested"
ww1_chile.56.t:0 "First Crossing Of The Andes"
ww1_chile.56.d:0 "[GetDateText], Lieutenant Dagoberto Godoy climbed into his 110 HP Bristol Le Rhone N°4988 and took off from the El Bosque air base, south of Santiago.5 After flying for two hours over the Andes Mountains at an altitude of 6300 meters, he landed at Lagunitas, near Mendoza, Argentina.It was the first flight of an airplane over the Andes Mountains.5"
ww1_chile.56.a:0 "A Landmark For Aviation!"
ww1_chile.57.t:0 "The Finding Of Sulfur Reserves In The Aucanquilcha Volcano"
ww1_chile.57.d:0 "The Year Is [GetYear],the brothers Hipólito and Vicencio Carrasco have discovered the sulfur reserves found at high altitude on the northeast face of the mountain, and founded Sociedad Industrial, Azufrera y Minera Carrasco S.A., an industrial, sulfur and mining company."
ww1_chile.57.a:0 "kewl."
ww1_chile.58.t:0 "Lieutenant Bello Disappears!"
ww1_chile.58.d:0 "[GetDateText] - Yesterday, Lieutenant Alejandro Bello Silva disappeared during a training flight from the Lo Espejo Military Aeronautics School. In adverse weather conditions, Bello veered off course and went out of sight. Despite intensive searches, no trace of the pilot or his aircraft has been found. Disappearance of Lieutenant Bello leaves Chilean society dismayed.."
ww1_chile.58.a:0 "Mas Perdido Que El Teniente Bello"
ww1_chile.59.t:0 "Agustin Edwards' Inauguration"
ww1_chile.59.d:0 "In a surprising turn of events, Agustín Edwards MacClure has been elected President of Chile in 1910, a victory that has altered the expected political landscape. Known for his profound influence in the media through his ownership of El Mercurio, Edwards MacClure's ascent to the presidency marks a significant shift from the anticipated leadership of Ramón Barros Luco or Juan Luis Sanfuentes. His platform, emphasizing progressive reforms and modernization, resonated with voters eager for change. As the country looks ahead, the new president's policies and vision are expected to chart a dynamic and transformative path for Chile's future."
ww1_chile.59.a:0 "A Young, And Modern Perspective Rises In The Moneda Palace"
ww1_chile.60.t:0 "Jose Luis Sanfuentes' Inauguration"
ww1_chile.60.d:0 "In a surprising turn of events, Juan Luis Sanfuentes has been elected President of Chile in 1910, securing a victory that shifts the political landscape. Known for his pragmatic approach and extensive experience in public service, Sanfuentes' election signifies a move towards stability and continuity. His campaign, which emphasized economic modernization and social reforms, resonated deeply with the electorate. As Sanfuentes takes office, the nation anticipates a period of progressive policy-making aimed at fostering economic growth and addressing social inequalities, charting a promising course for Chile's future."
ww1_chile.60.a:0 "please, not another 1891"
ww1_chile.61.t:0 "The Results Of The [GetYear] Census"
ww1_chile.61.d:0 "Since the last census in 1907, Chile's population has experienced a steady increase, growing by 1.2 percent. This gradual rise reflects ongoing demographic trends, including natural population growth and migration patterns. The modest yet consistent growth indicates that Chile continues to develop and expand, contributing to its social and economic evolution over the past century."
ww1_chile.61.a:0 "nice"
ww1_chile.62.t:0 "News From Germany"
ww1_chile.62.d:0 "News from Germany has just arrived: the forces of the Kaiser have failed in their attempt at a swift conquest of France. As a result, a stalemate has settled over Europe. In response, Britain has imposed a naval blockade on Germany. This development is particularly concerning for us, as Germany is our third-largest customer in the saltpeter industry. The blockade signifies a substantial blow to our economy, highlighting our heavy dependence on saltpeter and exposing a critical vulnerability. This situation underscores the urgent need to diversify and strengthen our economic foundations."
ww1_chile.62.a:0 "Fuck."
ww1_chile.63.t:0 "News From Chile"
ww1_chile.63.d:0 "In the midst of the Great War, we have received an intriguing proposition from Chile. They are offering their abundant saltpeter reserves to aid our war efforts. This offer comes at a crucial time, as saltpeter is indispensable for producing munitions and fertilizers. With Germany isolated due to the British naval blockade, Chile's proposal provides us with a reliable alternative source. Embracing this opportunity could significantly bolster our supply chains and enhance our military capabilities. By accepting Chile's offer, we stand to gain not only in terms of resources but also by forging a valuable economic partnership during these turbulent time."
ww1_chile.63.a:0 "Sure, The Extra Saltpeter Will Help"
ww1_chile.63.b:0 "Hell naw bro"
ww1_chile.64.t:0 "They've Accepted"
ww1_chile.64.d:0 "Chile is pleased to announce that several nations have accepted our offer of saltpeter, recognizing its critical importance for their war efforts. This development comes at a pivotal moment, affirming our role as a key supplier in this global conflict. By providing this essential resource, we not only support our allies in their time of need but also secure a prosperous future for our own economy. The acceptance of our saltpeter offer marks the beginning of strengthened international partnerships and highlights Chile's strategic significance on the world stage during these challenging times."
ww1_chile.64.a:0 "Very Well, Its Our Turn Now,Let's Get Working"
ww1_chile.65.t:0 "They've Rejected Our Offer"
ww1_chile.65.d:0 "Chile regrets to inform that several nations have declined our offer of saltpeter. Despite the critical importance of this resource for their war efforts, they have chosen alternative suppliers. This decision presents a significant setback for our economy, which heavily relies on saltpeter exports. However, we remain resilient and are committed to finding new markets and opportunities to ensure our economic stability. This rejection underscores the challenges we face but also motivates us to diversify and strengthen our economic foundations for the future."
ww1_chile.65.a:0 "Well-."
ww1_chile.66.t:0 "The Chilean Declaration Of Neutrality"
ww1_chile.66.d:0 "In a decisive move amidst the escalating turmoil of the Great War, the Chilean government has formally declared its neutrality. President [CHL.GetLeader] emphasized the nation's commitment to peace and stability, opting to steer clear of the entanglements embroiling Europe. This declaration reflects Chile's strategic interest in safeguarding its economic and political sovereignty while maintaining amicable relations with all warring nations. The announcement has been met with widespread approval among Chileans, who hope this stance will shield their homeland from the ravages of conflict sweeping across the globe."
ww1_chile.66.a:0 "We hope this wont intefeere with our Saltpeter business."
CHL_a_century_of_poverty:0 "A Century Of Poverty"
CHL_a_century_of_poverty_desc:0 "A century of our independence has passed, but there's nothing to celebrate. For these 100 years, the people and the nation have suffered, with much poverty. This must change, and to bring change the current government must be replaced with a new one!"
CHL_denounce_the_oligarchy:0 "Denounce The Ungovernment"
CHL_denounce_the_oligarchy_desc:0 "The current government of our country, has done little to raise the Chilean people from poverty and their suffering. They aren't really a government at all due to their lack of effort on the issues, and they must be replaced by an actual, competent, government."
 ww1_chile.69.d:0 "The elections were held in a tense and violent political environment, where the social issues, the Legislative power primacy over the Executive and the separation of church and state were at stake. Both candidates proposed similar government plans, with the main difference being Alessandri's fervent campaign, which included passionate speeches from balconies, to rallies with the Chilean middle class. During his campaign, Alessandri spoke against the rule of the oligarchy and advocated for democratic and renovating reforms. On the contrary, Barros Borgoño presented himself as the candidate of tranquillity and seriousness, accusing his opponent of fomenting class hatred. A third candidate, Luis Emilio Recabarren, from the Socialist Workers' Party, also run in the election, still knowing he had little chances of winning, but stating the election to be just an intern conflict between different branches of the oligarchy."
 ww1_chile.69.a:0 "For the Chilean middle class!"
 ww1_chile.69.b:0 "Stop the class hatred!"
 ww1_chile.69.c:0 "For the Chilean working class!"
ww1_chile.70.d:0 "The election results were almost a tie and were heavily disputed by both sides: the two candidates claimed victory. In the following months, political violence arouse in the country, with the population fearing a revolution. As a response to uncertainty and fraud accusations, a Tribunal of Honour was created to perform a detailed examination of the results."
 ww1_chile.70.d_2:0 "The Socialist Workers' Party won..."
 ww1_chile.70.a:0 "This victory marks a bright future for Chile!"
 ww1_chile.70.b:0 "Now onto sorting out the mess."
 ww1_chile.70.c:0 "How..."
 ww1_chile.67.d:0 "The Year is [GetYear] and the legal mandate of [CHL.GetLeader] is about to end, who's gonna become the next chilean president now?"
 ww1_chile.67.a:0 "Its Emiliano Figueroa's Second Turn"
 ww1_chile.67.b:0 "Alessandri For Change!"
 ww1_chile.68.d:0 "The Election Had a clear winner, its his time to become president."
 ww1_chile.68.a:0 "F- F F I Fi F i g Fig F I G U E FIGUE F I G U E R FIGUER F I G U E R O FIGUERO F I G U E R O A FIGUEROA! FIGUEROA PRESIDENTE"
 ww1_chile.68.b:0 "Vamos Leon!"
