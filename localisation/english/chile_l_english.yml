CHL_la_red_norte:0 "La Red Norte"
CHL_la_red_norte_desc:0 "In the north of our country is the Atacama desert, filled with nitrate reserves crucial to our economy. We should invest in railways connecting to the north, which will help us extract more nitrate to sell abroad and boost our economy."
