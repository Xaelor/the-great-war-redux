l_english:
 
 CHL_POWDERKEG_DESC:0 "Having risen as victor in the War of the Pacific, Chile now stands as one of the most stable countries in the region thanks to the riches brought by the newly acquired saltpeter mines in the north, fully administrated by the British since the 1891 civil war. However, not everything is fine. Corruption, electoral bribery, and poverty are still everyday occurrences.\n\nWith a big war expected in Europe, how will Chile figure out its new challenges as the 20th century approaches?"
