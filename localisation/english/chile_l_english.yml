CHL_longitud_norte:0 "Unify Northern Railways"
CHL_longitud_norte_desc:0 "In the north of our country, we have constructed many railways recently but many of them are disconnected from eachother. We should begin unifying these railways, building more routes between them to help connect them and make a more efficent rail network."
CHL_modernization_of_santiago:0 "Modernization Of Santiago"
CHL_modernization_of_santiago_desc:0 "If we want to improve our economy, the modernization of our capital city, Santiago will be extremely important as it is the heart of the nation. We must modernize the city onto European standards if we want to achieve a bustling economy."
CHL_sewage_system_for_santiago:0 "First Sewage System"
CHL_sewage_system_for_santiago_desc:0 "In our capital city, Santiago there is a massive lack of potable water for the citizens there. This is completly unacceptable and we must provide clean water to the citizens of the city. We should construct a large scale sewage system as a first step."
