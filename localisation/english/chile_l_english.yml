CHL_reform_the_promotion_system:0 "Reform The Promotion System"
CHL_reform_the_promotion_system_desc:0 "The promotion system in our country is broken, dominated by nepotism. To build a stronger, meritocratic army, we must end this practice. Family connections have overshadowed talent and dedication. By putting an end to this, we will ensure our officers are competent and respected, fostering a professional fighting force."
CHL_german_rifles:0 "Mauser 1895 Of Chilean Model"
CHL_german_rifles_desc:0 "Our army is in need of many more firearms to supply its needs. One efficent way to acquire these guns will be buying them from a foreign arms manufacturer. We can purchase from the gun manufacturer Steyr, an arms company who produces the reliable Mauser 1895 and modify them to the needs of the Chilean army."
CHL_ley_four_thousand_fourtythree:0 "Law 4.043"
CHL_ley_four_thousand_fourtythree_desc:0 "We can't just rely on foreign arms, but we also can't rely on our very small domestic production. We must increase our domestic arms manufacturing, and to do that, we will turn to FAMAE, our state owned arms manufacturer, to expand its production and make all kinds of machinery."
