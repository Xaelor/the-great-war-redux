 ww1_qing.419.t: "1910 Nanyang Industrial Exposition"
 ww1_qing.419.d: "On June the 5th, the 1910 Nanyan industrial exposition has finally started. Duanfang, Governor-General of Liangjiang, and Cheng Qitai, Governor of Jiangsu, submitted a suggestion to the court, proposing that China should host an international exposition. It is an official fair backed by the court. \n\nA site of about 41 acres near San Pai Lou has been established for the exhibition. Along a main axis road are several exhibit buildings including the Administration Building, Fine Arts Building, Agriculture Building, Transportation Building, Foreign Exhibits Buildings, and then several buildings for the Chinese Provinces."
 ww1_qing.419.a: "Nice!"

 ww1_qing.412.t: "General Liangbi Assasinated!"
 ww1_qing.412.d: "General Liangbi—the supreme commander of the Imperial Guard, leader of the hardline Royalist Party (Zongshedang), and the dynasty's last military pillar who fiercely opposed any compromise with the republicans—has been assassinated outside his residence.\n\nThe assassin, Peng Jiazhen of the Tongmenghui, disguised himself as a fellow officer and threw a bomb the moment Liangbi stepped down from his carriage. While Peng was killed instantly by the blast, Liangbi suffered catastrophic wounds and succumbed to his injuries following the amputation of his legs. On his deathbed, he bitterly lamented: 'The man who bombed me is a hero; now that I am dead, the Great Qing is finished.' With the imperial house's most capable and resolute defender gone, the court has been thrown into utter terror and paralysis."
 ww1_qing.412.d_chi: "General Liangbi, the leader of the hardline Manchu Royalist Party and commander of the Imperial Guard who spearheaded resistance against the revolution in Beijing, has been successfully eliminated!\n\nComrade Peng Jiazhen of the Tongmenghui disguised himself in uniform, ambushed Liangbi in front of his mansion, and detonated a bomb at the cost of his own life. Comrade Peng achieved heroic martyrdom on the spot, while Liangbi succumbed to mortal wounds shortly after. By striking down the very heart of the Qing royalist military, the diehard faction has been shattered, dealing a fatal blow to the dying empire."
 ww1_qing.412.a: "Those damned revolutionaries!"
 ww1_qing.412.b: "Good riddance to the tyrant!"
 
 ww1_qing.411.t: "Shen Jiaben Passes Away"
 ww1_qing.411.d: "The great legal reformer Shen Jiaben has died peacefully at his home! He leaves behind a huge legacy of legal reforms that have revolutionized law in our country."
 ww1_qing.411.a: "His reforms will be remembered"
 
 ww1_qing.403.t: "The British refuse the Lugard Proposal!"
 ww1_qing.403.d: "The British said they saw Weihaiwei as critical for strategic importance, and refused our offer."
 ww1_qing.403.a: "Fine"
 
 ww1_qing.402.t: "The British accept our proposal"
 ww1_qing.402.d: "There was much deliberation over our proposal, but an agreement was reached. Noon yesterday, the flag of British Weihaiwei was lowered for the last time and British administrators left for Hong Kong"
 ww1_qing.402.a: "Finally, imperialists off our soil?"
 
 ww1_qing.401.t: "The Lugard Proposal"
 ww1_qing.401.d: "Sir Frederick Lugard, Governor of Hong Kong, has suggested to our government that we make a deal with [QIN.GetNameDef]. In return for Weihaiwei, our control over Hong Kong will be extended indefinetely instead of 99 years. The [QIN.GetName] have already agreed, and it is up to us to decide."
 ww1_qing.401.a: "Sounds quite fine to us"
 ww1_qing.401.b: "Not worth the deal"
 QIN_effect_lugard_proposal: "In return for the return of Weihaiwei, we will permanently recognize British control over Hong Kong"

 ww1_qing.382.t: "Pianma Incident"
 ww1_qing.382.d: "The British sent troops near Pianma, a frontier town between Yunnan and British Burma. The governor of Yunnan, Li Jingxi, failed to secure his border and the local administrators, Tosa, whom we had appointed, surrendered to the British."
 ww1_qing.382.a: "... What is Pianma? What do you mean?"
 
 ww1_qing.378.t: "Viceroy of Min-zhe commits suicide"
 ww1_qing.378.d.2: "Songshou has long been a loyal governor of our dynasty, switching between governing Fuzhou and being Minister of Industry. His long service has rewarded him with the role of Viceroy of Min-zhe (Fujian, Zhejiang). However, as revolutionaries closed in on the province and the Fujian garrison mutinied, he was defeated in battle and the province was lost. The humiliation was apparently too much, and Songshou swallowed gold to commit suicide.\n\nSongshou was a loyal and gently governor, always lenient to his citizens. We will need to soon find a new Viceroy."
 ww1_qing.378.d: "Songshou has long been a loyal governor of our dynasty, switching between governing Fuzhou and being Minister of Industry. His long service has rewarded him with the role of Viceroy of Min-zhe (Fujian, Zhejiang). Recently stresses, however, seem to have proven too much for him, and he swallowed gold in order to commit suicide. \n\nSongshou was a loyal and gently governor, always lenient to his citizens. We will need to soon find a new Viceroy."
 ww1_qing.378.a: "Time to start thinking about his replacement"
 
 ww1_qing.374.t: "Zhang Mingqi becomes Viceroy of Liangguang"
 ww1_qing.374.d: "Liangguang, our southern most viceroy consisting of Guangxi and Guangdong, has now received its newest governor, Zhang Mingqi. His ascension was much due to the intervention of Prince Qing (Yikuang), and there is much suspected corruption behind it. Anyway, he is now the provinces governor and we wish him well."
 ww1_qing.374.a: "Congratulations"

 ww1_qing.366.t: "Viceroy of Sichuan"
 ww1_qing.366.d: "Zhao Erxun has been our appointed governor of Sichuan since 1907, though, he also has duties in Huguang, where he founded the Hubei Law School. Anyway, his stable governance has led him to be recently appointed the comfortable position as Viceroy of the Three Northeast Provinces in Manchuria.\n\nHowever, the replacement, his brother Zhao Erfeng, known as the 'Zhao the Butcher', responsible for crushing the 1905 Tibetan Rebellion, is often critized as ruthless. When he lead the crushing of the revolt, he is reported to have ordered the razing Batang monastery, the use of holy texts by troops as shoeliners, and the mass murdering of Tibetans. In these times of revolution, can we really risk this man in charge of Sichuan?"
 ww1_qing.366.a: "Overrule the court, Zhao Erxun must stay"
 ww1_qing.366.b: "Zhao Erfeng can become the new governor"

 ww1_qing.353.t: "The Great Manchurian Plague"
 ww1_qing.353.d: "What seems to be an extremely deadly disease is ravaging Manchuria, affecting all cities north of Beijing.  The disease seems to have an almost 100% fatality rate. Several doctors have already gone to the area to help with the medical effort, though many have died. The Cambridge-trained doctor Wu Lien-teh is leading Chinese efforts to end the plague, and is promiting quarantine and the wearing of cloth face masks."
 ww1_qing.353.a: "Send as many doctors as possible!"
 ww1_qing.353.b: "Just make sure we don't get in his way"
 ww1_qing.353.c: "Quarantine? Face masks? What radical nonsense!!"
 
 ww1_qing.347.t: "Foreign Recognition"
 ww1_qing.347.d: "After the fall of the Qing, no other nation can claim to be the Chinese nation, and foreign powers have decided to recognize us as the legitimate government of China. Unfortunetely, this means their unequal treaties are now on our shoulders too..."
 ww1_qing.347.a: "Not again!"

 ww1_qing.316.t: "The Emperor needs Glasses"
 ww1_qing.316.d: "Sir Reginald Johnston has recently approached the court. After much confusing translation, it turns out the Emperor has 'flawed vision' and needs 'glasses'. Apparently, the Emperor has had a visual examination done by one of the tutor's friends who is a western doctor.\n\n The court is outraged that the tutor suggests the Emperor is not perfect, and say that the divine emperor needs no such earthly modifications. Zaifeng, Puyi's father, said that the emperor cannot have bad vision, as that is impossible of a son of heaven. Still, Sir Reginald Johnston is unusually insistant, saying that it is an essential need."
 ww1_qing.316.a: "The tutor is right"
 ww1_qing.316.b: "Ha! The Emperor is Divine, and needs no such 'glasses'"
 
 ww1_qing.311.t: "The Peking Peace Conference of [GetYear]"
 ww1_qing.311.d: "After our defeat in the Great War, the Great Powers placed their demands on our land to be under their protection and to establish the concessions."
 ww1_qing.311.a: "We have no choice..."
 
 ww1_qing.296.t: "Feng Guozhang Offers to Crush the Revolution"
 ww1_qing.296.d: "For a hefty sum, Beiyang general Feng Guozhang offers to bring his army to crush the revolution. Many of the hardline conservatives who distrust Yuan Shikai are in favor of this path, and want to accept his deal."
 ww1_qing.296.b: "It is too risky..."
 ww1_qing.296.a: "We need his help."
 
 ww1_qing.292.t: "The Emperor Abusing Eunuchs"
 ww1_qing.292.d: "Reports have emerged that the boy emperor, Puyi, growing up within the confines of the Forbidden City, has been tormenting his attending eunuchs with increasing cruelty. Raised amidst unconditional pampering and reverent adulation, the young emperor has realized that his power within the palace walls is absolute, ruthlessly ordering floggings for the slightest mistakes. With no one around who dares oppose his whims, the child's pranks have grown distinctly sadistic.\n\nOnly recently, an uproar occurred when he attempted to 'reward' a eunuch who had performed a puppet show by forcing him to eat rice cakes mixed with iron filings—an act narrowly averted only through the desperate pleading of his wet nurse."
 ww1_qing.292.a: "The Emperor cannot be questioned"
 ww1_qing.292.b: "Discipline the boy"
 ww1_qing.292.c: "Quite a game they play behind those palace walls."
 
 ww1_qing.289.t: "Aftermath of the Foiled Assassination"
 ww1_qing.289.d: "In March 1910, Wang Jingwei, a member of the Tongmenghui, was keen on raising popularity among the populace against the Qing. With their morale at an all time low after multiple failed revolutions since 1905, the assassination of Prince Chun, or Zaifeng, father of the emperor Puyi and current regent was being planned, with Wang Jingwei offering to sacrifice his life detonating the bomb.\n\nWhile Puyi resides safely within the walls of the Forbidden City, his father, the regent Zaifeng, travels often between his mansion and the palace. Wang intented to detonate a bomb on a bridge in between to kill Zaifeng and decapitate the imperial court. \n\nHis plan was foiled after the bomb was discovered. At first, it was suspected that the incident was the result of court intrigue, perhaps orchestrated by Yikuang, unhappy with Zaifeng's role as regent. However, investigators soon closed in on Wang and captured him. The only question now is, what is his fate?\n\nSummary: Tongmenghui Revolutionary Wang Jingwei attempts to assasinate the prince regent Zaifeng, fails and is captured. What is his punishment?"
 ww1_qing.289.a: "Schedule the execution!"
 ww1_qing.289.b: "Zaifeng commutes the sentence to life in prison."
 
 ww1_qing.268.t: "Death of Empress Dowager Longyu"
 ww1_qing.268.d: "Empress Dowager Longyu was the empress of Emperor Guangxu, the previous emperor before Xuantong. She helped spy of the previous emperor for Cixi and helped block the 100 days reform in 1898. She adopted Puyi after he ascended the throne and was a major voice in our court. Her death has brought much disorganization to the court, and they have dropped many of the old squabbles with reformers that Empress Dowager Longyu held."
 ww1_qing.267.a: "Send our regards"

 ww1_qing.253.t: "Tsinghua Fund"
 ww1_qing.253.d: "In 1900, the United States were given a share of the Boxer Indemnities. Believing it to be too much, they offered to re-invest this into our country. Many plans were proposed, such as Yuan Shikai's infrastructure plan, but in the end, it was agreed that the indemnity would be reduced by $10.8 million on the condition it was used to setup a western style university. This university would be located on the site of the former imperial Tsinghua Gardens to form the new Tsinghua College, staffed by several prominent US and Chinese scholars such as Liang Qichao. \n\nThe agreement was approved in 1909 by Theodore Roosevelt and the US Congress and is now ready to be implemented."
 ww1_qing.253.a: "Excellent!"
 ww1_qing.253.b: "The imperial park is for royalty only!"

 
 ww1_qing.196.t: "PCA moves to Impeach the Grand Council!"
 ww1_qing.196.desc: "After the Hunan Bond incident and more incidents in Yunnan and Guangxi where the Grand Council overruled the PCA, the PCA has issued to the emperor, or in other words his regent, a Impeachment Memorial that, while not blaming individual members of the Grand Council, highlighted the corruption of the Grand Council as an institution. \n\nThe impeachment memorial was issued with an analogy: 'if China were a ship, and the officials were the crew, an irresponsible crew would cause the ship to sink.', in other words saying they were arguing for the establishment of a responsible cabinet"
 ww1_qing.196.a: "What business is it of the PCA to question the court?"
 ww1_qing.196.b: "Lets just try to find a way to satisfy both the PCA and the Grand Council"
 ww1_qing.196.c: "The Grand Council has shown itself incapable assisting the Emperor. Disband it!"
 ww1_qing.196.d: "Tell them we'll think about it"
 
 ww1_qing.195.t: "Hunan Bond Incident"
 ww1_qing.195.d: "On the 6th of October 1910, the Hunan Provincial Assembly reported to the PCA that the governor of Hunan, Yang Wending, had issued 1.2 million taels in government bonds without such consultation. They alleged that Yang had bypassed the provincial assembly and gained imperial permission to issue the debt directly. After much debate, the PCA decided that Yang did in fact overreach his powers and broke the law, and appealed to the Court for guidence in deciding the punishment. \n\nInstead, our Grand Council shocked the PCA by drafting an edict in the name of the Emperor outright refusing to punish Yang, only criticising him for being careless. The PCA is completely outraged, but powerless in the face of the Emperor's edict. What should we do?"
 ww1_qing.195.a: "The Grand Council knows best"
 ww1_qing.195.b: "Overrule the Grand Council, and punish Yang Wending"

 ww1_qing.188.t: "PCA Petition on Cabinet Formation"
 ww1_qing.188.d: "Already, there is much outcry over our cabinet formation. Some call it the 'Princes' Cabinet' as it is made up of largely royal clan members. The Federation of Provincial Assemblies declared that imperial princes should not serve as premiers and that the Princes' Cabinet is not compatible with a constitutional monarchy. Over 40 legislators have submitted a petition to form a new cabinet"
 ww1_qing.188.a: "Assemblymen have no business in the appointment and dismissal of officials!"
 ww1_qing.188.b: "We should listen to their recommendations"
 
 ww1_qing.187.t: "Forming the Imperial Cabinet"
 ww1_qing.187.d: "Replacing the Grand Council, we will need to form a close group of advisors to the Emperor. It will initially consist of 13 members. How should we appoint this group?"
 ww1_qing.187.a: "The wisdom of our imperial nobles has never failed us"
 ww1_qing.187.b: "The Emperor deserves a cabinet that reflects the people"
 
 ww1_qing.178.t: "Bloodshed in Chengdu!"
 ww1_qing.178.d: "The railway protection movement has grown to fullout rebellion! On September 7th, protesters marched on the Governor-General's Office in Chengdu, demanding the release of a Pu Dianjun, a railway executive who opposed nationalization, and the situtation quickly escalated, killing 32 protesters. Armed groups across Sichuan have risen up and are quickly overwhelming local government forces there. What should we do? "
 ww1_qing.178.a: "Get me in contact with Duanfang, viceroy of nearby Huguang!"
 ww1_qing.178.b: "Negotiate with the protesters"
 ww1_qing.178.c: "This is old news, we are already dealing with rebellion!"
 
 ww1_qing.177.t: "Railway Protection Movement"
 ww1_qing.177.desc: "Our plans to nationalize the railroads and transfer those profits into our or foreign coffers has angered many across the nation. The anti-Qing sentiment has now grown into a 'Railway Protection Movement' that is actively protesting in Sichuan. What should we do about this?"
 ww1_qing.177.a: "Tell the troops in Sichuan to take them down!"
 ww1_qing.177.b: "Just ignore it, what could happen?"
 ww1_qing.177.c: "Perhaps we should stop the nationalization"
 ww1_qing.177.d: "This is old news, we are already dealing with rebellion!"
 
 ww1_qing.176.t: "Second Guangzhou Uprising"
 ww1_qing.176.d: "On April 27th, Huang Xing, revolutionary leader, and nearly a hundred fellow revolutionaries forced their way into the residence of the Qing viceroy of Guangdong and Guangxi provinces. The uprising was initially successful but Qing reinforcements turned the battle into a catastrophic defeat. Most revolutionaries were killed, only few managed to escape. Huang Xing was wounded during the battle. How should we react to this insurrection?"
 ww1_qing.176.a: "We should harshly crackdown on revolutionary activity nation wide!"
 ww1_qing.176.b: "We should accede to some democratic demands to prevent more violence"

 ww1_qing.146.t: "Italian Indemnities Resolved"
 ww1_qing.146.d: "Whether through war or diplomacy, current world situations allow us to no longer pay this debt"
 ww1_qing.146.a: "Finally!"
 
 ww1_qing.145.t: "Japanese Indemnities Resolved"

 ww1_qing.346.t: "Austrian Indemnities Resolved" 
 
 ww1_qing.144.t: "American Indemnities Resolved" 
 
 ww1_qing.143.t: "French Indemnities Resolved"
 
 ww1_qing.142.t: "Russian Indemnities Resolved"
 
 ww1_qing.142.d: "Whether through war, diplomacy, or Russia's civil war, current world situations allow us to no longer pay this debt"
 
 ww1_qing.141.t: "British Indemnities Resolved"

 ww1_qing.140.t: "German Indemnities Resolved"

 ww1_qing.99.t: "Our grip over Mongolia loosens!"
 ww1_qing.99.d: "The land reclamation and tax hike policies pushed by Sanduo, the Imperial Resident (Amban) at Urga, have triggered fierce resistance across Mongolia. As traditional nomadic pastures and long-standing autonomy are threatened by the large-scale influx of Han peasant settlers and the stationing of imperial garrisons, the Bogd Khan, along with Buddhist lamas and Mongol princes, have begun a collective refusal to pay taxes or provide corvée labor to the Qing Court.\n\nTo make matters worse, the Russian Empire has seized this opportunity to reinforce its consular guard in Urga and establish covert contact with the Mongol leadership, causing imperial control over the northern frontier to rapidly unravel."
 ww1_qing.99.a: "We'll have to solve this soon."

