l_english:
#qing rework
#focus
 QIN_equal_cabinet: "Responsible Cabinet"
 QIN_equal_cabinet_desc: "Our cabinet must help our country's modernization, not orchestrate its downfall into backwards barbarism! Cabinet must be responsible to the Parliament to ensure there is no corruption in this process."
 QIN_cave_to_parliament: "Establish Parliament"
 QIN_cave_to_parliament_desc: "The advisory council demands a parliament by 1911. We must give in to their demands to survive."
 QIN_court_appeasement: "Prerogatives of the Manchu Court"
 QIN_court_appeasement_desc: "The Grand Council has always helped us. What do you mean they are corrupt? Shoo, petitioners!"
 QIN_restore_military_production: "Restore Military Production"
 QIN_restore_military_production_desc: "After the Boxer Rebellion, we were banned from purchasing foreign weapons. This ban has since expired, but we stand substantially weaker. We must act quickly."
 QIN_form_imperial_guard_corps: "Form Imperial Guard Corps"
 QIN_form_imperial_guard_corps_desc: "The Beiyang Army remains heavily influential in our politics, creating difficulties in firmly asserting our control. The time has come to decide how we shall deal with them."
 QIN_form_imperial_guard_corps_tt: "Six divisions of the Imperial Guards can be deployed in case of crisis."
 QIN_shanghai_shipyards: "Shanghai Shipyards"
 QIN_shanghai_shipyards_desc: "The Chinese Sea will again be ruled by the Chinese navy."
 QIN_coastal_defense: "Coastal Defense"
 QIN_coastal_defense_desc: "Our navy is incredibly outdated, and cannot ensure proper coastal defence. Further expansion of naval industry will help to solve this."
 QIN_education_reform: "Education Reform"
 QIN_education_reform_desc: "Education is often unavailable for the peasantry. Strides must be taken to ensure that a greater majority will be able to learn in our great institutions."
 QIN_rebuild_beiyang_fleet: "Rebuild the Fleet"
 QIN_rebuild_beiyang_fleet_desc: "As we expand our facilities, it is time to ensure we rebuild and outfit our fleet with the finest advancements in naval armaments and technology."
 QIN_nanjing_arsenal: "Nanjing Arsenal"
 QIN_nanjing_arsenal_desc: "With tensions rising around the globe, an expansion of our arsenals is not out of question."
 QIN_japanese_manufacturer: "Japanese Manufacturer"
 QIN_japanese_manufacturer_desc: "Japan's rapid industrialization has seen great success, while our own navy has fallen behind. It is time to change this."
 QIN_reform_ministries: "Reform Ministries"
 QIN_reform_ministries_desc: "The Imperial Cabinet was a good start, but in order to complete our transition, we must instead appoint ministers to key positions, rather than relying on a single cabinet."
 QIN_appeal_to_the_militarists: "Appeal to the Militarists"
 QIN_appeal_to_the_militarists_desc: "Rather than fighting the militarists and causing even more loss of life, let us persuade them to rejoin us. There are brilliant minds among them that will serve our army well."
 QIN_appeal_to_the_militarists_tt: "In times of crisis, we may find some generals of the Beiyang Army to be on our side."
 QIN_constitutional_monarchy: "Monarchy Reformation"
 QIN_constitutional_monarchy_desc: "The Emperor is old enough to be crowned, and we have succeeded in our transition. Glory to Xuantong!"
 QIN_cooperation_with_dominions: "Cooperation with Dominions"
 QIN_cooperation_with_dominions_desc: "British dominions now are our friends."
 QIN_loyal_parliament: "Loyal Parliament"
 QIN_loyal_parliament_desc: "Ever since the betrayal of several of our parliament members, loyalty must be ensured."
 QIN_nation_recovery: "Early Industrialization"
 QIN_nation_recovery_desc: "We must to pay last reparations our western enemies."
 QIN_chinese_labour_corps: "Chinese Labour Corps"
 QIN_chinese_labour_corps_desc: "The British colonies are sorely in need of workers. If we offer to send some of our criminals to aid their efforts, it may lead to better cooperation between our nations."
 QIN_foreign_loan: "Four Power Loan"
 QIN_foreign_loan_desc: "Following grueling negotiations, we have finalized a major railway loan agreement totaling £6,000,000 with the Four-Power Banking Consortium of Britain, France, Germany, and the United States. Although we have paid a steep price by mortgaging provincial tax revenues and relinquishing exclusive material procurement rights and chief engineer appointments, the Court has successfully secured the immense capital required to rapidly construct the trunk lines and enforce railway nationalization."
 QIN_mandate_of_heaven: "The Mandate of Heaven"
 QIN_mandate_of_heaven_desc: "We have reclaimed the Mandate of Heaven. We once again have the support of the people, and sufficient reforms have transformed the dynasty to the power it used to be. The time has come to throw off the shackles of colonial oppression, and assert our rightful place in the world."
 QIN_xiyu_conquest: "Xiyu Conquest"
 QIN_xiyu_conquest_desc: "The Emperor and his Empire shall revenge the bitter lost on the Battle of Talas!"
 QIN_aksai_kachin: "Beyond Tibet"
 QIN_aksai_kachin_desc: "Far-southern imperial border had been illegitimately drawn into so called [601.Owner.GetNameDef]. The Emperor shall not ignore any his subject under foreign rule with an iron fist!"
 QIN_outer_manchurian_conquest: "Imperial Manchuria"
 QIN_outer_manchurian_conquest_desc: "No other "empire" is legitimated in Manchuria. Only the Chinese Empire under the Jurchen rule shall be there forever!"
 QIN_southern_expedition_of_dragon: "Southern Expedition"
 QIN_southern_expedition_of_dragon_desc: "Vietnamese originated from Baiyue. Baiyue people is Chinese. So Vietnamese are all Chinese. And every Chinese shall be under the imperial rule."
 QIN_prince_qing_cabinet: "Prince Qing Cabinet"
 QIN_prince_qing_cabinet_desc: "Prince Qing shall head the new Imperial Cabinet. We must prove to the people that we are truly reforming."
 QIN_protect_the_dynasty: "Protect the Qing Dynasty"
 QIN_protect_the_dynasty_desc: "For the Emperor!"
 QIN_nineteen_articles: "Nineteen Articles"
 QIN_nineteen_articles_desc: "The Qing Dynasty is on the verge of a major revolution and the end of the dynasty. This is indeed due to the complacency, corruption, depravity and ignorance of the imperial court and its officials. It may be too late, but we must draw up a constitution and carry out reforms immediately..."
 QIN_continue_qing_new_reforms: "Continue Qing New Reforms"
 QIN_continue_qing_new_reforms_desc: "With the republicans crushed, we can finish our reforms and legitimize the dynasty."
 QIN_advisory_council: "The Advisory Council"
 QIN_advisory_council_desc: "Urgent reforms are needed, and Prince Chun has begun the process of transitioning the dynasty to a constitutional monarchy. Our support for this movement is vital."
 QIN_fight_against_famine: "Fight Against Famine"
 QIN_fight_against_famine_desc: "While the nobility live in luxury, the peasants are starving. Efforts must be made to restore the civilian economy. The people will surely approve of this."
 QIN_united_china: "United China"
 QIN_united_china_desc: "China has collapsed. Petty warlords and their fiefdoms plague the lands. It's time to put them in their places."
 QIN_restore_the_nation: "Restore the Nation"
 QIN_restore_the_nation_desc: "The Xinhai Revolution has wracked China to its core. All must do their part to mend and repair the nation."
 QIN_militia_reorganization: "Militia Reorganization"
 QIN_militia_reorganization_desc: "The Chinese militias are disorganized. To combat this, we shall incorporate them into the army and train them to become effective combat units."
 QIN_economic_stabilization: "Economic Stabilization"
 QIN_economic_stabilization_desc: "The chaos of the revolution has led to economic turmoil. Fixing this should be our first issue."
 QIN_land_reform: "Land Reform"
 QIN_land_reform_desc: "Some of the peasantry continue to use ineffectual and backward techniques in their occupations. On top of this, some landowners do not make enough use out of their property. A comprehensive set of reforms shall fix this."
 QIN_pay_off_debts: "Pay Off Debts"
 QIN_pay_off_debts_desc: "With growing profits and economic reforms, we are in a position to pay off any outstanding debts."
 QIN_recover_transport_system: "Recover Supply System"
 QIN_recover_transport_system_desc: "Our army cannot fight effectively as a result of the damage sustained to our infrastructure. Now that the economy is beginning to stabilize, we can direct some funding to solving this issue."
 QIN_unite_provincial_command: "Unite Provincial Command"
 QIN_unite_provincial_command_desc: "Regional warlords have taken control over their respective provinces. However, that's not to say we won't be able to sway them to our way of thinking."
 QIN_pave_way_for_industrialization: "A Paved Path for Industrialization"
 QIN_pave_way_for_industrialization_desc: "Our collaboration with the foreign powers has finally paved the way for us to begin industrialization!"
 QIN_south_provinces: "Southern Industrialization"
 QIN_south_provinces_desc: "Our southern provinces remain barren swathes of mountainous land. Sufficient preparations must be made to prepare for eventual constructions."
 QIN_north_provinces: "Manchurian Industrialization"
 QIN_north_provinces_desc: "While the Government does make a lot of silver from the untapped lands of the Northeastern provinces, the vast resources and riches have yet to be touched. In addition, the Provinces' importance around Zhili and on the border to Korea makes Manchuria the crossroads between Russia, China and Japan. As such the strategic position and the railways in Manchuria has allowed Manufacturing to grow, the Qing Government will therefore further enrich the provinces and will invest in the Industries of the Province."
 QIN_central_provinces: "Central Industrialization"
 QIN_central_provinces_desc: "Most of our central lands remain underdeveloped, despite the vast opportunities that lie in wait. Let us sieze the initiative."
 QIN_south_factories: "Southern Factories"
 QIN_south_factories_desc: "Now that preparations have been made, we can begin work on numerous construction proposals."
 QIN_central_factories: "Central Factories"
 QIN_central_factories_desc: "With improved infrastructure, we can focus our efforts on improving our central areas."
 QIN_manchu_factories: "Manchurian Factories"
 QIN_manchu_factories_desc: "While the Government does make a lot of silver from the untapped lands of the Northeastern provinces, the vast resources and riches have yet to be touched. In addition, the Provinces' importance around Zhili and on the border to Korea makes Manchuria the crossroads between Russia, China and Japan. As such the strategic position and the railways in Manchuria has allowed Manufacturing to grow, the Qing Government will therefore further enrich the provinces and will invest in the Industries of the Province."
 QIN_split_the_tongmenghui: "Split the Tongmenghui"
 QIN_split_the_tongmenghui_desc: "The Tongmenghui's failure to overthrow us last time has significantly strengthened an anti-Sun faction in the Tongmenghui. We should use our agents to expand this split."
 QIN_mislead_the_tongmenghui: "Deception Campaign"
 QIN_mislead_the_tongmenghui_desc: "We will use our agents to delay the revolution through leading the Tongmenghui into believing false truths"
 QIN_secret_tongmenghui_sabotage: "Coordination Sabotage"
 QIN_secret_tongmenghui_sabotage_desc: "Our secret police will make sure that the Tongmenghui cannot effectively organize a fighting force to face our army!"
 QIN_beijing_arsenal: "Peking Arsenal"
 QIN_beijing_arsenal_desc: "We need to improve our production to defend our country against threats. Our capital is the perfect place to start this."
 QIN_imperial_bonds: "Imperial Bonds"
 QIN_imperial_bonds_desc: "Our legitimacy has risen to the point that we can now sell 'Imperial Bonds' instead of our assets directly."
 QIN_utilize_bribery_desc: "Corruption may be bad for the people, but taking some bribes is necessary for our country. Long in China's history has corruption been used as a tool, and we cannot stop now."
 QIN_utilize_bribery: "Solicit Bribes"
 QIN_village_mechanization: "Village Mechanization"
 QIN_village_mechanization_desc: "Most villagers are hesitant to adopt new technology and methods. We must begin a large scale industrialization program in this rural areas!"
 QIN_modern_staff: "Modern Staff"
 QIN_modern_staff_desc: "The Germans, specifically Prussia, are renouned for their military. We should follow their examples."
 QIN_purchase_of_machines: "Purchase of Machines"
 QIN_purchase_of_machines_desc: "While we have the best intentions at modernizing, we sorely lack the capability to do so as a result of outdated equipment. The British have offered to sell us some of their machines in order to revive our industries."
 QIN_boxer_treaty: "Boxer Treaty"
 QIN_boxer_treaty_desc: "Our collaboration with a foreign power has benefitted us vastly and them much. However, several unequal treaties stand in the way of furthur cooperation and as a unnecessary reminder of a humiliating past. It is time to remove these restrictions!"
 QIN_appease_the_colonialists: "Appease the Colonialists"
 QIN_appease_the_colonialists_desc: "We have to make some sacrifices in the present in order to pay the foreigners, but it will give us better standing with them; something we need if we are to seek investments."
 QIN_german_manufacturer: "Approach the Germans"
 QIN_german_manufacturer_desc: "The Germans have made great strides in weaponry. We must seek their help."
 QIN_british_manufacturer: "Invite British Manufacturers"
 QIN_british_manufacturer_desc: "If we are to ever regain our prestige, we must put our pride aside and seek help from those who have weakened us."
 QIN_hanyang: "Hanyang Factories"
 QIN_hanyang_desc: "Through our negotiations, the Germans are willing to open factories to produce their weaponry."
 QIN_mauser_contract: "Mauser Contract"
 QIN_mauser_contract_desc: "We've managed to negotiate a license to German weaponry. We shall waste no time in producing them."
 QIN_chinese_labour_corps2: "Chinese Labour Corps"
 QIN_chinese_labour_corps2_desc: "The western countries are sorely in need of workers. If we offer to send some of our criminals to aid their efforts, it may lead to better cooperation between our nations."
 QIN_aviation: "Domestic Aviation"
 QIN_aviation_desc: "Despite our efforts, air combat is something we are woefully inexperienced in. The British are willing to send us some of their fighters."
 QIN_money_to_reform: "Money to Reform"
 QIN_money_to_reform_desc: "Okay, here's the problem. We need to push through reforms, but we need money to do reforms, and we don't have anywhere to get it! We need to do something about it...!"
 QIN_army_leadership_problem: "Problem with Army Leadership"
 QIN_army_leadership_problem_desc: "For the past hundred years, we've allowed local powerhouses to raise privateers in place of the outdated central army to counter foreign invasions and internal rebellions. And that means their influence still extends to our New Army, which influences are a potential threat to the dynasty, especially since they're Han Chinese, unlike the Manchu imperial family."
 QIN_nationalise_railways: "Nationalise Railways"
 QIN_nationalise_railways_desc: "As a result of the Rights Recovery Movement, provincial gentry and merchants established private railway companies to pursue self-funded construction, yet chronic capital shortages and delays have severely hindered progress. Sheng Xuanhuai, the Minister of Posts and Communications, seeks to declare the nationalization of all trunk railways and use them as collateral to secure a massive foreign loan from the Four-Power Consortium, completing the network at once. Though this will undoubtedly provoke fierce provincial outrage over what they view as the outright seizure of private property, it remains an inevitable decision to resolve our fiscal exhaustion and gain control over modern transport infrastructure."
 QIN_suppress_railway_protection_movement: "Suppress the Railway Protection Movement"
 QIN_suppress_railway_protection_movement_desc: "Outrage over the railway nationalization edict has triggered widespread strikes, tax boycotts, and mass protests across Sichuan and the central-southern provinces. In Chengdu, Viceroy Zhao Erfeng aims to extinguish the unrest by arresting leaders of the Railway Protection League and ruthlessly ordering troops to open fire on demonstrators surrounding the yamen. Though blood will stain the streets, we cannot tolerate rebellious mobs challenging imperial authority and national policy."

 QIN_dispatch_hubei_new_army: "Dispatch the Hubei New Army to Sichuan"
 QIN_dispatch_hubei_new_army_desc: "Following the bloodshed in Chengdu, gentry and peasants across Sichuan have formed armed militias, besieging the provincial capital and plunging the region into open rebellion. The Court has ordered Imperial Commissioner Duanfang to lead elite divisions of the Hubei New Army from Wuchang into Sichuan to crush the insurrection. While this redeployment will dangerously hollow out garrisons in Wuhan, extinguishing the raging fire in Sichuan must take absolute priority."


###regular
 QIN_army_westernization: "Army Westernization"
 QIN_army_westernization_desc: "This will be 'New' New Army of China."
 QIN_the_armies_of_warlords: "The Armies of Warlords"
 QIN_the_armies_of_warlords_desc: "The Chinese army is not united and does not obey the center. It is necessary in this situation to form your own staff."
 QIN_invite_military_advisers: "Invite Military Advisers"
 QIN_invite_military_advisers_desc: "Only Europeans know how to form European army."
 QIN_recovery_of_naval_infrastructure: "Recovery of Naval Infrastructure"
 QIN_recovery_of_naval_infrastructure_desc: "It's just beginning of restoration of the fleet."
 QIN_destroyers_fleet: "Destroyers Fleet"
 QIN_destroyers_fleet_desc: "Torpedo boats and patrols for the Great Qing!"
 QIN_admiralty: "Admiralty"
 QIN_admiralty_tt: "Unlocks §YNavy High Chiefs§!."
 QIN_admiralty_desc: "Who knows how to swim?"
 QIN_marine_engineering: "Increase Navy Funding"
 QIN_marine_engineering_desc: "It’s not enough to rebuild the fleet. Our fleet must be modern and organised. it is time to learn from what Japan did and modernise our navy, starting with increasing its budget"
 QIN_submarine_fleet: "Submarine Fleet"
 QIN_submarine_fleet_desc: "We need to ask the Americans how their ships swim under water so that our's doesn't sink."
 QIN_maneuverable_fleet: "Maneuverable Fleet"
 QIN_maneuverable_fleet_desc: "The fleet must be multi-functional."
 QIN_dreadnought_fever: "Dreadnought Fever"
 QIN_dreadnought_fever_desc: "Larger ships are essential"
 QIN_domestic_fleet_doctrine: "Domestic Fleet Doctrine"
 QIN_support_corps: "Support Corps"
 QIN_support_corps_desc: "Europeans have long abandoned backward, infantry-only formations. Our modern armies will need support to fight on modern battlefields."
 QIN_towed_artillery: "Taiyuan Artillery"
 QIN_towed_artillery_desc: "Artillery decides the outcome of the war."
 QIN_send_officers_to_military_schools: "Send Officers to Military Schools"
 QIN_send_officers_to_military_schools_desc: "It is necessary to adopt the Japanese and European experience in training officers."
 QIN_train_engineers: "Train Engineers"
 QIN_train_engineers_desc: "Many centuries ago, China was famous for its engineers and inventors. Now we have to use the experience of European industrial plants."
 QIN_train_pilots: "Train Pilots"
 QIN_train_pilots_desc: "There are no pilots in China yet."
 QIN_armored_vehicles: "Armored Vehicles"
 QIN_armored_vehicles_desc: "A very useful thing if you want to scare the enemy."
 QIN_state_university: "Peking University"
 QIN_state_university_desc: "If we have enough money, we can afford to revive higher education."
###from rework
 QIN_continue_new_policies: "Continue the Xinzheng"
 QIN_continue_new_policies_tt: "§WShould the §GXinzheng Reforms§W not be carried out in time, there will be §RConsequences...§W"
 QIN_continue_new_policies_desc: "While many in the Qing Imperial Court had initially opposed Guangxu reform and the self-strengthening movement, the defeat following the Boxer Rebellion convinced many in the Qing court that holding on to the past was no longer an option. It has now become a certainty to Regent Zaifeng, that continuing the new policies will bring the Qing closer to a more 'developed' society that will one day crawl itself out of the era of national humiliation"
 QIN_national_currency_regulations: "National Currency Regulations"
 QIN_national_currency_regulations_desc: "Inconsistent measurements of coins from various mints across the empire had long caused the Qing government to suffer from unfavorable currency exchanges and further complicating taxation and commerce. The National Currency Regulations will be promulgated to standardize the weight and fineness of silver and copper coins to ensure that the Qing will be able to have a consistent currency to solve these plaguing problems."
 QIN_creating_national_budget: "Creating National Budget"
 QIN_creating_national_budget_desc: "The Qing government had long operated without a national budget, and the effects of corruption, unnecessary spending, and undocumented expenditures plagued Qing finances. There have been calls to unify the revenue and expenditure of central and local governments to rectify the financial woes of the Qing government to effectively finance its reforms and functions."
 QIN_administrative_affairs_office: "Administrative Affairs Office"
 QIN_administrative_affairs_office_desc: "The Administrative Affairs Office was established to implement the \"New Policy\" and oversee government affairs. Further empowering the Administrative Affairs Office would allow the Qing to implement reforms in the various provinces across the empire directly by the Imperial edicts issued in Beijing."
 QIN_privy_council: "Privy Council"
 QIN_privy_council_desc: "Before formalizing the constitution and the national assembly as the Qing legislative body begins, a parliamentary preparatory institution must be created to serve as its foundation to eventually change towards constitutionalism. Officials of the privy council would be elected by the advisory councils of each province and from the imperial government that would carefully select just and wise officials and gentry for the council."
 QIN_seperation_of_all_laws: "Separation of all Laws"
 QIN_seperation_of_all_laws_desc: "Since ancient times, China's legal codes have been characterized by \"no distinction between civil and criminal law, and the integration of all laws\", no distinction between civil and commercial law, and no difference between substantive law and procedural law. There have been talks within the Qing court and ministers to reform of this ancient legal structure, all civil, commercial and litigation laws should be specially compiled under the imperial decree and reforming the legal tradition on \"the integration of all laws\"."
 QIN_new_qing_code: "New Qing Code"
 QIN_new_qing_code_desc: "All other older laws are to be replaced by the New Qing Code, introducing the principle of legality of crime, punishment, and the principle of equality before the law. The previous legal application principles such as the Ten Evils, Eight Discussions, official duties, and the system of official positions, good and bad, and clothing were abolished, replaced with the adoption of the common Western systems and terminology. The Code of the Qing Dynasty will be divided into five parts: general principles, debts, property rights, relatives, and inheritance. The first three parts were mainly based on the German and Japanese civil codes, while the last two parts adopted the traditional system. "
 QIN_revise_national_assembly_deadline: "Revise National Assembly Deadline"
 QIN_revise_national_assembly_deadline_desc: "There are growing calls from the constitutional movement that demands that the National Assembly should be convened immediately. Recognizing the urgency and the numerous petitions brought foward, Regent Zaifeng revises the deadline to three years earlier than originally planned. This compromise acknowledges the petitions while allowing the necessary time to prepare for this monumental political transition. The regency remains cautious but receptive, ensuring the foundations of the assembly are solid and enduring."
 QIN_royal_cabinet: "Royal Cabinet"
 QIN_royal_cabinet_desc: "In an effort to modernize governance with in the Qing Dynasty, Regent Zaifeng will establish the Empire’s first cabinet, a step toward modernizing Qing administrative authority. However, the structure heavily favors the Manchu representation, the highest that has been since even the days of the early Qing. Thus earning it the nickname \"Royal Cabinet\" among many now disappointed constitutionalists and disrupting the unity between the Han and the Manchus. Despite the scornful ridicule controversy, this cabinet is supposed symbolize the progress being made and serves as the first step in aligning Qing Imperial rule with the demands of a changing world. Balancing tradition and reform will be critical as aging dynasty navigate this delicate transition."

 QIN_prince_zaifeng_regency: "Prince Zaifeng Regency"
 QIN_prince_zaifeng_regency_tt: "§9Prince Zaifeng§9 §Whas been selected by§W §9Empress Dowager Cixi§9§W to serve as Prince Regent to the Child Emperor, §W§YEmperor Xuantong§W.§!§W"
 QIN_prince_zaifeng_regency_desc: "On the 9th day of the 11th month of the 34th year of the reign of Emperor Guangxu, Zaifeng's son Puyi, now Emperor Xuantong ascended the throne in the Hall of Supreme Harmony. On the 20th day of the same month, the Cabinet and other government offices presented the \"General List of Etiquette for the Prince Regent\" and issued an imperial decree to announce it."
 QIN_concentrate_royal_powers: "Concentrate Royal Powers"
 QIN_concentrate_royal_powers_desc: "Prince Zaifeng had followed in the footsteps of the late Emperor Guangxu to reform the Qing state to overcome its century of humiliation, which involves a series of reforms for the concentration of power and preservation of the Qing Imperial Rule. But until then the Qing dynasty would have to reform itself."
 QIN_facade_of_constitutionalism: "Facade of Constitutionalism"
 QIN_facade_of_constitutionalism_desc: "Prince Zaifeng openly expressed willingness to reform the Qing Dynasty by claiming that the Qing Empire will transition into a Constitutional Monarchy by 1916 and issued an edict in March of the first year of Xuantong (1909) to reiterate the preparation for constitutionalism and ordered all provinces to \"earnestly prepare for constitutionalism\". However this is a mere facade to disguise his own efforts to concentrate military and political power and strengthen the status of the royal family."
 QIN_favor_manchu_ministers: "Favor Manchu Ministers"
 QIN_favor_manchu_ministers_desc: "In order to concentrate royal powers to the Imperial Court, Prince-Regent Zaifeng has decided to empower Manchu Ministers and his closest relatives into postitions of power inorder to effectively carry out his own agendas and for the preservation of the Qing Dynasty. While sidelining unreliable and untrustworthy Han Ministers."
 QIN_earnest_constitutionalism: "Earnest Constitutionalism"
 QIN_earnest_constitutionalism_desc: "Prince Zaifeng openly expressed willingness to reform the Qing Dynasty and claimed that the Qing Empire will transition into a Constitutional Monarchy by 1916 and issued an edict in March of the first year of Xuantong (1909) to reiterate the preparation for constitutionalism and ordered all provinces to \"earnestly prepare for constitutionalism\"."
 QIN_favor_han_ministers: "Favor Han Ministers"
 QIN_favor_han_ministers_desc: "Favoring Han Ministers would better improve the facade that the Prince-Regent has set up, while it is true that the Prince-Regent had no intentions to create a truly constitituional monarchy, by appointing and favoring Han Ministers within the Imperial Court it may increase the legitimacy for both the Constitituion efforts and for the Dynasty as a whole, a gesture of good faith."
 QIN_meeting_with_zhidong: "Meeting with Zhidong"
 QIN_meeting_with_zhidong_desc: "Prince Zaifeng meets with Zhang Zhidong, the only Han minister that the Imperial Court trusted, the two discuss about the fate of Yuan Shikai and the threat he can pose to imperial rule."
 QIN_exile_yuan: "Exile Yuan"
 QIN_exile_yuan_tt: "§LYuan Shikai§W will be spared from §Rexecution,§W and returned back home to recover. However his influence in the army is still §Rintact.§W§!§W"
 QIN_exile_yuan_desc: "The contents of the meeting between Zaifeng and Zhang Zhidong was discussed in secret, and Zhang Zhidong opposed Zaifeng's idea of having Yuan killed stating: Now that the country has just suffered a national mourning, it is not appropriate to kill the old Ministers suddenly."
 QIN_execute_yuan: "Kill Yuan"
 QIN_execute_yuan_tt: "§LYuan Shikai§W will be §Rexecuted§W or §Rassassinated§W for suspected §Rtreason...§W§!§W"
 QIN_execute_yuan_desc: "After becoming regent, Zaifeng held the Imperial court in the Qianqing Palace every day. The first thing he did was to discuss within Royalist and Manchu circles and decide to get rid of Yuan Shikai. After Yuan Shikai learned that Empress Dowager Cixi had died and Zaifeng became the regent, Yuan fled to Tianjin to hide. At this time, some young relatives of the Qing royal family advocated killing him. Despite Zhidong's reasoning to simply exile Yuan Shikai back home, Zaifeng has decided to carry out the removal of the Tiger before it becomes too dangerous for the Empire."
 QIN_noble_academies: "Academies for Nobles"
 QIN_noble_academies_desc: "Academy for Nobles will be established to recruit Manchus and train high-level military talents separate from the influences of Yuan Shikai and his Beiyang protégés, now that Yuan is exiled, his influence within the Beiyang Army remained in tact despite our best efforts. A establishment of a Royalist support base within the military would ensure that some officers remain loyal to the Qing Dynasty and not to Yuan Shikai himself."
 QIN_loyalist_officers: "Loyalists Officers"
 QIN_loyalist_officers_desc: "Promoting Manchu and Royalist Officers and providing military educations to loyalists of the dynasty would allow the Qing Dynasty to have a reliable officer corps outside the influence of Yuan Shikai and willing to serve for the dynasty against any potential uproar or mutinies."
 QIN_expand_imperial_coffers: "Expand Imperial Coffers"
 QIN_expand_imperial_coffers_desc: "Many within the Imperial Court had believed that the reason behind China's lack of modernization was simply a issue of Government Authority and Finances, therefore the reassertion of Imperial Taxation across the empire could hopefuly remedy the lack of resources for modernization and allow the Qing State to recover from the era of national humiliation."
