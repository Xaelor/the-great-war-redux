 QIN_1909_advisory_council_election: "Imperial Advisory Council Election"
 QIN_1909_advisory_council_election_desc: "The 1909 Chinese parliamentary election was an indirect election to the first imperial Advisory Council, a preparatory body of the parliament created under the constitutional reform. With growing calls for constitutionalism across the empire, the Prince-Regent Zaifeng has finally approved for limited provincial elections across the country as a part of the ongoing reforms. For the first time in the Empire's history, members of the Advisory Council would be decided through a nationwide electoral voting. Although only half of the members of the council would be elected as a part of this election with the other half still being directly appointed by the regent this will hopefully appease the constitutionalists enough as to stabilise our increasingly fragile political situation."


