l_english:
 ww1_agadir.1.t: "The French Grab for Morocco"
 ww1_agadir.1.d: "The French have made their move. Under the pretext of restoring order, their troops have marched into Fez and are now consolidating control over the Sultanate. Our diplomats in Paris report that the Quai d’Orsay intends to turn Morocco into a full protectorate – with or without our consent. \nThis is a direct blow to German prestige and our commercial interests in the region. The Kaiser is furious, and the Admiralty is already urging a show of force. However, we must choose our response carefully. A premature ultimatum could unite Britain and France against us; but waiting too long may make us look weak and allow the French to present us with a fait accompli. \nWhat course shall we take?"
 ww1_agadir.1.a: "Hold for the Right Moment."
 ww1_agadir.1.b: "The Panther Must Leap Now!"

 ww1_agadir.2.t: "Germans Ask for Compensation"
 ww1_agadir.2.d: "Berlin has finally shown its hand. The German government, using the 'Panther's Leap' as a cudgel, is demanding the wholesale cession of our territories in Central Africa – the entire French Congo and the right of first refusal on the Belgian Congo – as 'compensation' for their abandonment of Morocco. \nThis is blackmail, pure and simple. However, we must weigh our options carefully. Paris is not yet ready for a full-scale war, and our British allies have only given us guarded promises of support. A direct refusal could mean war on the Rhine; but yielding to these absurd demands would be a humiliation felt across the empire. \nHow shall we respond to the German note?"
 ww1_agadir.2.a: "England and Russia will support us!"
 ww1_agadir.2.b: "Avoid Escalation at All Costs."

 ww1_agadir.3.t: "France Refuses - The Congo Demands Are Rejected"
 ww1_agadir.3.d: "Paris has officially rejected our demand for the French Congo. Instead of accepting a deal, the French government has chosen to stall and treat our ultimatum with contempt. \nThe Kaiser is furious, but the General Staff advises patience. We have made our position clear; now the ball is in their court. We will wait and see if British or Russian mediation can bring France to reason – or if we must prepare for a more decisive response."
 ww1_agadir.3.a: "Let Them Feel the Pressure"

 ww1_agadir.4.t: "German Gunboat Arrives in Agadir"
 ww1_agadir.4.d: "The German Empire has dispatched the gunboat SMS Panther to the port of Agadir, under the pretext of protecting German trade interests following our intervention in Morocco. The larger cruiser SMS Berlin arrived days later. Our diplomats have been in contact with their German counterparts, and we fully expect that the Kaiser will soon present us with his demands."
 ww1_agadir.4.a: "Let us hope their demands are not too steep..."

 ww1_agadir.5.t: "France Rejects German Demands"
 ww1_agadir.5.d: "This afternoon, we received word that the French government has rejected our demands over the crisis in Agadir. Their nation is now beginning to mobilise its army, and our own military command is calling for an immediate response. We are at a crossroad: back down and face international humiliation, or declare war and plunge Europe into a conflict of untold scale. The Kaiser and his government must decide."
 ww1_agadir.5.a: "Begin mobilisation."
 ww1_agadir.5.b: "We must back down."

 ww1_agadir.6.t: "France Cedes Neukamerun"
 ww1_agadir.6.t_no_escalation: "France Cedes Congo"
 ww1_agadir.6.d: "Our diplomats have informed us that the crisis with France has been settled peacefully. Fearing a wider war, the French have agreed to cede a portion of the French Congo as compensation for their gains in Morocco. While not the grand colonial victory some had hoped for, we have secured a valuable concession and asserted our influence on the world stage."
 ww1_agadir.6.d_no_escalation: "Our diplomats have informed us that the crisis with France has been settled peacefully. Fearing a wider war, the French have agreed to cede the French Congo as compensation for their gains in Morocco. Its the grand colonial victory as we had hoped for, we have secured a valuable concession and asserted our influence on the world stage."
 ww1_agadir.6.a: "No war this year then."

 ww1_agadir.7.t: "France Enters Fez"
 ww1_agadir.7.d: "The French have marched into Fez under the pretext of 'protecting the Sultan' and 'restoring order'. Paris is clearly preparing to impose a full protectorate over Morocco – without consulting us or respecting our historic claims to the north. \nIf we stand idle, we will be marginalised. Our interests in the Rif, the coast, and the strategic cities of Tetouan and Larache will be trampled by French ambition. The time to act is now – before the crisis draws in Germany and Britain, and before the situation becomes irreversible."
 ww1_agadir.7.a: "Occupy Northern Morocco"

 ww1_agadir.8.t: "Spanish Protectorate in Morocco Established"
 ww1_agadir.8.d: "With the Agadir Crisis settled, France has agreed to divide Morocco into two separate protectorates. We will now administer the northern territories, securing our interests in the region."
 ww1_agadir.8.a: "A toast to our French friends!"

 ww1_agadir.9.t: "The Crisis Fades Away"
 ww1_agadir.9.d: "Germany delayed negotiations without putting forward any demands on France. The government of the empire criticizes the Minister of Foreign Affairs for the slowness and passivity in the conflict."
 ww1_agadir.9.a: "A missed opportunity!"

 ww1_agadir.10.t: "Financial Turmoil in Berlin"
 ww1_agadir.10.d: "The escalating crisis in Agadir has triggered financial panic in the German Empire. It was made public this morning that the stock market has plunged by 30% in a single day. Economists warn that the Reichsbank could lose a fifth of its gold reserves, potentially forcing Germany off the gold standard unless the government can resolve the situation.\n\nWhispers in financial circles even suggest French sabotage, aimed at weakening our position through economic warfare."
 ww1_agadir.10.a: "Scheisse..."

 ww1_agadir.11.t: "Germany Refuses to Back Down!"
 ww1_agadir.11.d: "Despite a stock market crash and immense financial pressure, the German Empire has not backed down from the crisis in Agadir and has now begun to mobilise its army. In response, the French are following suit. We have affirmed our support for [FRA.GetNameDef] and advocated for a peaceful resolution, but the situation grows more tense by the hour."
 ww1_agadir.11.a: "Perhaps we pushed them too far."
 ww1_agadir.11.b: "We will be home by Christmas!"
 ww1_agadir.11.c: "We must monitor this situation closely."

 ww1_agadir.12.t: "The \"Panther's Leap\""
 ww1_agadir.12.d: "The Imperial German gunboat SMS Panther has arrived in the harbour of Agadir, on the Atlantic coast of Morocco. The vessel, accompanied by the light cruiser SMS Berlin, anchored this morning under the pretext of \"protecting German citizens and commercial interests\" in the region. \n This sudden show of force, already dubbed the \"Panther's Leap\" by the international press, is widely seen as a direct challenge to French influence in Morocco. Just weeks after French troops occupied Fez, Germany now signals its intent to demand compensation for any future French control over the Sultanate. \n The move has stunned diplomats in Paris and London, who view it as a calculated provocation. While Berlin insists the mission is peaceful, observers warn that Europe may be on the brink of another major crisis."
 ww1_agadir.12.a: "This is an act of aggression!"
 ww1_agadir.12.b: "We protect our interests!"
 ww1_agadir.12.c: "They protect their interests!"

 ww1_agadir.13.t: "Crisis Brews in Morocco"
 ww1_agadir.13.d: "At the request of the besieged Moroccan Sultan, French forces have intervened to crush a rebellion near Fez. With the rebels scattered, France is moving to solidify its control over the nation, effectively annexing it as a protectorate.\n\nThis unilateral action has shattered the agreements of the Algeciras Conference. The international community now fears the German response. It is likely the Kaiser will react forcefully to assert German interests, potentially by demanding compensation. The capitals of Europe watch and wait, as the situation could easily escalate into a wider crisis."
 ww1_agadir.13.a: "Our control is non-negotiable."
 ww1_agadir.13.b: "What of the Algeciras Conference?"
 ww1_agadir.13.c: "Europe watches and waits."
 ww1_agadir.13.e: "So, the French wish to test our resolve..."
 ww1_agadir.13.f: "An excellent opportunity for [SPR.GetNameDef]!"

 ww1_agadir.14.t: "Germany Backs Down"
 ww1_agadir.14.d: "After [FRA.GetNameDefCap] moved to annex Morocco, the German Empire stationed the gunboat SMS Berlin in Agadir in an attempt to force concessions. The move backfired spectacularly, causing a financial panic in [GER.GetForeignNameDef]. The stock market plummeted and the Reichsbank lost a fifth of its gold reserves.\n\nTo prevent a total collapse, the Kaiser's government has been forced into a humiliating withdrawal, recalling the SMS Berlin from Agadir. For [FRA.GetNameDef], this is a stroke of luck, but [GER.GetForeignNameDef] will now be forced to the negotiating table to resolve the crisis and salvage what little prestige they have left."
 ww1_agadir.14.a: "Surely their demands will be modest now."
 ww1_agadir.14.b: "Perhaps we should publicly support the French position."

 ww1_agadir.15.t: "The Agadir Crisis Resolved!"
 ww1_agadir.15.d.forcongo: "After a period of intense negotiations, French and German diplomats have resolved the Agadir Crisis. In exchange for German recognition of a French protectorate in Morocco, France has ceded the territory of 'Neukamerun' from the French Congo to German Cameroon. Europe can breathe a sigh of relief, for now. This outcome is a significant, if not total, success for [GER.GetForeignNameDef], though the crisis has also strained international relations."
 ww1_agadir.15.d.forcongo_full: "After a period of intense negotiations, French and German diplomats have resolved the Agadir Crisis. In exchange for German recognition of a French protectorate in Morocco, France has ceded the territory of the French Congo to German Cameroon. Europe can breathe a sigh of relief, for now. This outcome is a total success for [GER.GetForeignNameDef]."
 ww1_agadir.15.a: "Peace at last."
 ww1_agadir.15.b: "At least we gained something..."
 ww1_agadir.15.c: "A clear victory for our nation!"
 ww1_agadir.15.d: "Well, at least no war..."

 ww1_agadir.16.t: "A Crisis Averted"
 ww1_agadir.16.d: "In a surprising move for diplomats across Europe, [GER.GetForeignNameDefCap] has refused to escalate the situation in Morocco, avoiding a major colonial crisis. Many had viewed the developing Agadir Crisis as a sure sign of impending war, but this sudden reversal of [GER.GetAdjective] policy has pulled the continent back from the brink.\n\nHowever, the resolution is not without consequence. The United Kingdom has openly criticised the [FRA.GetAdjective] government for its provocative actions, casting doubt on the strength of the Entente. It seems that while peace has been preserved, the alliances meant to secure it have been weakened."
 ww1_agadir.16.a: "A fragile peace."

