l_english:
 BW2_preventing_war_tt: "War can be prevented if §2Serbia§! transfers §Y[203.getName]§!, §Y[1258.getName]§! and §Y[1140.getName]§! to §GBulgaria§!."
 BW2_preventing_ahist_war_tt: "War can be prevented if §GBulgaria§! transfers §Y[1258.getName]§! and §Y[1140.getName]§! to §2Serbia§! and §Y[731.getName]§! and §Y[345.getName]§! to §4Greece§!"

 BW2_war_with_serbian_traitor: "$great_power_politics_balkan_powder_keg_tt_icon$ Thieving allies"
 BW2_war_with_serbian_traitor_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ Bulgaria is preparing an attack!"

 BW2_war_with_bulgarian_traitor: "$great_power_politics_balkan_powder_keg_tt_icon$ War with [BUL.getName]"
 BW2_war_with_bulgarian_traitor_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ Serbia is preparing an attack!"

 BW2_intervention_in_bulgaria: "$great_power_politics_balkan_powder_keg_tt_icon$ Intervention in [BUL.getName]"

 BW2_war_timer: "$great_power_politics_balkan_powder_keg_tt_icon$ The Second Balkan War"

 BW2_balkans_victory_tt: "§GBulgaria§! is being defeated by the troops of §Cthe anti-Bulgarian alliance§!, but it is not giving up yet. If §GBulgaria§! do not do something, it will be considered §Rloser§! of this war."
 BW2_balkans_victory_message: "@BUL §YBulgaria§! collapsed helplessly under the overwhelming encirclement by @SER @GRE @MNT @ROM @TUR §Ythe Anti-Bulgarian Alliance§!. The borders of the Balkans had barely changed when the map was redrawn."
 BW2_bulgaria_victory_tt: "§GBulgaria§! is crushing the troops of the §Canti-Bulgarian alliance§!. If nothing changes, §GBulgaria§! will be considered §Ythe winner§! of this war."
 BW2_bulgaria_victory_message: "Despite the immense threat posed by @SER @GRE @MNT @ROM @TUR §Ythe Anti-Bulgarian Alliance§!, @BUL §YBulgaria§! emerged victorious from the war. @BUL §YThe Bulgarians'§! territorial gains fully avenged §Ythe Treaty of San Stefano§!."
 BW2_stalemate_tt: "§GBulgaria§! and §Cthe Anti-Bulgarian Alliance§! are in a difficult situation at the same time, they will sign a truce while maintaining the status quo if nothing changes."
 BW2_stalemate_message: "The clashes between @BUL §YBulgaria§! and @SER @GRE @MNT @ROM @TUR §Ythe Anti-Bulgarian Alliance§! ended leaving only casualties and wounds on both sides. Whilst the borders were fixed as a result of the first shots fired in the Balkans, it is clear that, before long, the pen will have to be taken up once more to redraw the map."
 BW2_ottoman_victory_message: "@TUR §YThe Ottomans§! avenged some of the defeats and losses they had suffered in the previous war by taking advantage of @BUL §YBulgaria§!'s most difficult circumstances."
 BW2_ottoman_withdrawal_rus_message: "Under pressure from the major powers, particularly @RUS §YRussia§!, @TUR §Ythe Ottomans§! were forced to shelve their plans for revenge against @BUL §YBulgaria§! once again."
 BW2_ottoman_withdrawal_defeat_message: "Faced with a powerful @BUL §YBulgarian§! counter-attack, @TUR §Ythe Ottomans§! withdrew from the war in humiliation in order to hold on to the ancient capital they had captured in 1453."

 BW2_bulgaria_crushing_defeat_tt: "§Y[BUL.getName]§! has suffered §Ra crushing defeat§! (lost control under §YSofia§! or has more than §Y85%§! surrender progress)"
 BW2_balkans_crushing_defeat_tt: "§YThe Anti-Bulgarian Alliance§! has suffered §Ra crushing defeat§! (§Y[SER.getName]§! has capitulated or §Y[GRE.getName]§! and §Y[ROM.getName]§!(if its at war) have capitulated)"
 BW2_turkish_intervention_turkey_total_defeat_tt: "§Y[TUR.GetForeignName]§! has suffered §Ra crushing defeat§! (lost control under §YConstantinople§! or has more than §Y10%§!(§Y20%§! during Italo-Turkish war) surrender progress)"

 BW2_turkey_intervention: "$great_power_politics_balkan_powder_keg_tt_icon$ Intervention in [BUL.getName]"
 BW2_turkey_intervention_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ The Turkish Intervention"
 TUR_bw2_victory_tt: "§R[TUR.GetForeignName]§! was able to defeat §Gthe Bulgarian army§! and occupy its former territories, now §Yit will get them back.§!"
 TUR_bw2_lose_tt: "§R[TUR.GetForeignName]§! completely failed its invasion and was unable to defeat §Gthe Bulgarian army§!, everything will remain as it was before the invasion."

 BW2_dissolve_wth: "Dissolve [WTH.getNameDef]"
 BW2_dissolve_wth_tt: "The sooner we get this misunderstanding sorted out, the better for us."
 TUR_create_wth: "$great_power_politics_balkan_powder_keg_tt_icon$ Establish a puppet government in §YThrace§!"

 SER_cede_macedonia_to_bulgaria: "$great_power_politics_balkan_powder_keg_tt_icon$ Cede Macedonia to §Y[BUL.getName]§!"
 BUL_cede_macedonia_to_serbia: "$great_power_politics_balkan_powder_keg_tt_icon$ Cede Macedonia to §YThe Anti-Bulgarian Alliance§!"

 BW2_info_when_attack_ahist: "$great_power_politics_balkan_powder_keg_tt_icon$ We will attack Bulgaria in §Y[?SER.days_mission_timeout@BW2_war_with_bulgarian_traitor]§! days"


 # Win conditions
 BW2_balkans_hist_how_to_win_tt: "To be considered §7a winner§! at the end of the timer, we need to bring §YBulgaria§! to §Y30%§! progress of surrender and control §Y[203.getName]§!, §Y[1258.getName]§! and §Y[1140.getName]§!\n"
 BW2_balkans_ahist_how_to_win_tt: "To be considered §7a winner§! at the end of the timer, we need to bring §YBulgaria§! to §Y30%§! progress of surrender\n"
 BW2_BUL_hist_how_to_win_tt: "To be considered §7a winner§! at the end of the timer, we should control §Y[203.getName]§!, §Y[1258.getName]§! and §Y[1140.getName]§! states and dont have less than §Y30%§! of surrender progress.\n If we can force only §YRomania§! or only §YGreece§! to surrender, we will get §Y[846.getName]§! or §Y[345.getName]§!, respectively\n"
 BW2_BUL_ahist_how_to_win_tt: "To be considered §7a winner§! at the end of the timer, we should capitulate §YSerbia§! or §YGreece§! and §YRomania§!(if its at war)\n"
 BW2_turkish_intervention_TUR_how_to_win_tt: "To be considered §7a winner§! at the end of the timer, we need to control §Yany major state in Bulgaria§!, and we will get §Y[756.getName]§! and §Y[200.getName]§! if we control it.\n"
 BW2_turkish_intervention_BUL_how_to_win_tt: "To be considered §7a winner§! at the end of the timer, we must prevent the Turks from taking over §Yany of our major regions§!.\n"

 # Events
 ww1_secondbalkan.21.t: "Invasion of Bulgaria"
 ww1_secondbalkan.21.d: "A military conflict has broken out in the Balkans again, and our time has come to reclaim our rightful lands!"
 ww1_secondbalkan.21.a: "Prepare the operation!"
 ww1_secondbalkan.21.b: "Attack immediately!"

 ww1_secondbalkan.22.t: "A senseless war"
 ww1_secondbalkan.22.d: "The war has reached a stalemate and neither side has achieved its goals. Bulgaria and the anti-Bulgarian alliance signed peace on the terms of the status quo."
 ww1_secondbalkan.22.a: "But what about the dead people?"

 ww1_secondbalkan.23.t: "Fail of Intervention in Bulgaria"
 ww1_secondbalkan.23.d: "The Bulgarian army was able to hold back our offensive. Under pressure from the great Powers, we are forced to sign a peace treaty that will consolidate the Bulgarian conquests."
 ww1_secondbalkan.23.a: "What a great shame!"

 ww1_secondbalkan.24.t: "Another Victory"
 ww1_secondbalkan.24.d: "Our victorious army defeated the Ottoman hordes, who again encroached on us in a difficult hour. We have signed a new peace treaty with [TUR.GetForeignName], which secures the liberated territories for us. But unfortunately, due to the pressure of the great powers, we cannot get more, as they are afraid of our strengthening."
 ww1_secondbalkan.24.a: "Turks, this is not the end!"

 ww1_secondbalkan.25.t_bul: "Forced peace with Turkey"
 ww1_secondbalkan.25.d_bul: "Due to the difficult situation at the front, we are forced to sign armistice with [TUR.GetForeignName]."
 ww1_secondbalkan.25.a: "What a shame!"

 ww1_secondbalkan.25.t_tur: "Bulgaria signed peace"
 ww1_secondbalkan.25.d_tur: "Our victorious army has defeated small Bulgarian formations. But the Great Powers put pressure on us and forced us to sign an armistice with Bulgaria. A conference will be held soon in our capital, where we will sign a peace agreement that recognizes Edirne for us. "
 ww1_secondbalkan.25.b: "Revenge has been accomplished"

 ww1_secondbalkan.26.t: "The Situation in Western Thrace"
 ww1_secondbalkan.26.d: "Although we are crushing the Bulgarian army, the great powers will not allow us to return western Thrace. But the Muslim brothers are waiting for us there, so with the support of our troops, we can set up a puppet government there and use this as a lever of pressure on Bulgaria."
 ww1_secondbalkan.26.a: "A good opportunity"

 ww1_secondbalkan.27.t: "Shameful Peace"
 ww1_secondbalkan.27.d: "Our army is suffering a crushing defeat, the economy is bursting at the seams, and we are forced to sign a truce with our enemies."
 ww1_secondbalkan.27.a: "The greatest disaster"

 ww1_secondbalkan.28.t: "Bulgarian traitors"
 ww1_secondbalkan.28.d: "The Bulgarian army has occupied territories that rightfully belong to us. We will try to assemble an anti-Bulgarian alliance and together we will have the strength to punish arrogant Bulgarians. Montenegro already agreeds."
 ww1_secondbalkan.28.a: "Ask Greece"

 ww1_secondbalkan.29.t: "Anti-Bulgarian Alliance has deployed an army against us"
 ww1_secondbalkan.29.d: "The Serbs and Greeks are unhappy with the results of the partition of the Ottoman possessions, and now they have become on our border and are preparing an offensive. They also sent an ultimatum to transfer them our territories."
 ww1_secondbalkan.29.a: "Prepare the defense!"
 ww1_secondbalkan.29.b: "For the sake of peace..."

 ww1_secondbalkan.30.t: "Serbia claims Ohrid!"
 ww1_secondbalkan.30.d: "Serbia initially agreed to recognise that the territory below the Kriva Palanka-Ohrid line belonged to us in the territorial division, but during the war Serbian forces seized the region below that line and have not withdrawn since. We have to be firm in our territorial claims."
 ww1_secondbalkan.30.a: "Traitors!"

 ww1_secondbalkan.31.t: "Bulgaria claims Ohrid!"
 ww1_secondbalkan.31.d: "Bulgaria refused to relinquish its claim to Ohrid and protested strongly that we had seized the territory below the Kriva Palanka-Ohrid line, which we had agreed was theirs in the territorial division."
 ww1_secondbalkan.31.a: "We need time to think"
 ww1_secondbalkan.31.b: "For the sake of peace..."

 ww1_secondbalkan.32.t: "Serbia Gives Up Ohrid"
 ww1_secondbalkan.32.d: "Serbia has handed over the Ohrid region to our military administration in accordance with existing agreements. We can finally breathe a sigh of relief and enjoy our victory."
 ww1_secondbalkan.32.a: "Well done."

 ww1_secondbalkan.33.t: "Serbia invites us to Anti-Bulgaria Alliance"
 ww1_secondbalkan.33.d_gre: "We have never had a problem with Serbia, but the Bulgarians have occupied lands that should belong to us. We obviously agree to this"
 ww1_secondbalkan.33.d_mnt: "In general, we have no complaints about the Bulgarians, but the Serbs have helped us a lot, so we will not abandon our brotherly people in such a difficult hour."
 ww1_secondbalkan.33.a: "Together to Victory!"

 ww1_secondbalkan.34.t: "[FROM.getName] agreeds"
 ww1_secondbalkan.34.d: "[FROM.getName] made a wise decision and joined our alliance against the Bulgarians, now we have a chance to defeat them. We will immediately send Bulgaria an ultimatum on the surrender of the territories."
 ww1_secondbalkan.34.a: "War is close."

 ww1_secondbalkan.35.t: "Bulgaria agreed to accept the ultimatum"
 ww1_secondbalkan.35.d: "The Bulgarian government, realizing the inevitability of its defeat, decided to agree to return our territories to us"
 ww1_secondbalkan.35.a: "The greatest victory of diplomacy!"

 ww1_secondbalkan.36.t: "The war with Bulgaria Warning"
 ww1_secondbalkan.36.d: ""
 ww1_secondbalkan.36.a: "Prepare an Attack!"