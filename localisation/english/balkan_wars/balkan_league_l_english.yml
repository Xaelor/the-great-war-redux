l_english:
 ww1_balkan.1.t: "The Balkan League"
 ww1_balkan.1.d: "It's not for nothing that Turkey is called the sick man of Europe, it's no longer the country that once struck fear into everyone's heart. We now have a chance to take our revenge and liberate the lands they once conquered. We can try to propose an alliance to our Balkan neighbors in order to become stronger. But we must not forget that each of them wants to get a bigger piece of the pie, which could lead to conflicts in the future. What do we think about this?"
 ww1_balkan.1.a: "We must stand together against the Turk!"
 ww1_balkan.1.b: "This alliance is a folly."

 ww1_balkan.2.t: "A Proposal from [FROM.GetName]"
 ww1_balkan.2.d: "A formal diplomatic note has arrived from [FROM.getNameDef]. In the message, their government expresses a desire for a military alliance against the Ottoman Empire, with the shared goal of liberating the remaining Christian territories in the Balkans. \nThe proposal is straightforward: to combine our forces, coordinate our military efforts, and present a united front against the Sultan. Our neighbour is ready to sign a treaty of mutual defence and aggression, committing both nations to the common cause. \nThe decision now rests with us."
 ww1_balkan.2.a: "We accept the offer"
 ww1_balkan.2.b: "We decline the offer"

 ww1_balkan.3.t: "The failure of the Balkan League"
 ww1_balkan.3.d: "The news has spread quickly across the Balkan capitals: the negotiations between Serbia and Bulgaria for a military alliance against the Ottoman Empire have ended in failure. Despite the common goal of liberating the remaining Christian territories from Ottoman rule, mutual suspicions and conflicting territorial ambitions proved insurmountable."
 ww1_balkan.3.a: "It's every man for himself"

 ww1_balkan.4.t: "Invitation from [FROM.getName]"
 ww1_balkan.4.d: "A diplomatic messenger has arrived from the newly formed Balkan Alliance, bearing a formal invitation from the allied states. The letter speaks of a grand coalition against the Ottoman Empire, a united effort to liberate the remaining Christian territories of the Balkans once and for all."
 ww1_balkan.4.a: "Let's go"

 ww1_balkan.5.t: "[FROM.getName] Agrees"
 ww1_balkan.5.d_ser: "The Bulgarians have agreed to lead a military alliance against Turkey. We have discussed the future division of Turkish territories, although there are still a few issues to resolve, but that is no longer a concern. Now, we must begin serious military preparations to ensure victory in the upcoming conflict."
 ww1_balkan.5.d_bul: "The Serbs have made a wise choice and decided to join the alliance against Turkey, which we have led. We have discussed the future division of Turkish territories, although there are still a few issues to resolve, but that is no longer a concern. Now, we must begin serious military preparations to ensure victory in the upcoming conflict."
 ww1_balkan.5.a: "Good"

 ww1_balkan.6.t: "[FROM.getName] Agrees"
 ww1_balkan.6.d: "[FROM.getName] accepted the offer to join the alliance, and now we are stronger and have a better chance of defeating the Ottoman Empire."
 ww1_balkan.6.a: "Great"

 BLL_form_the_alliance: "One Man is No Army"

 BLL_anti_ottoman_crusade: "Anti Ottoman Crusade"
 BLL_anti_ottoman_crusade_desc: "Now that the Balkan alliance has been formed, it's time to prepare our crusade against the Ottomans for the liberation of the Balkans. We will negotiate with our allies who gets what at the end."
 BUL_lone_liberator: "Lone Liberator"
 BUL_lone_liberator_desc: "The formation of a Balkan alliance has failed after disputes over Macedonia. Even without an alliance the Balkans still must be liberated. By ourselves, we shall restore the Greater Bulgarian border of the Treaty of San Stefano by our hands!"
 BUL_buy_french_equipment: "Buy Artillery from France"
 BUL_buy_austrian_equipment: "Buy Equipment from [AUS.GetAuhName]"
 SER_buy_french_equipment: "$BUL_buy_french_equipment$"
 SER_buy_austrian_equipment: "$BUL_buy_austrian_equipment$"
 BUL_buy_austrian_equipment_desc: "Our industry is too weak to fund a war against the Ottomans ourselves, we must find another way to get equipment. We can turn to the Great Powers to purchase equipment from to prepare a fight against the Ottomans."

