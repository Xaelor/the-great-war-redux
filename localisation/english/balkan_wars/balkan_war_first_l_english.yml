l_english:
 BW1_war_with_turkey: "$great_power_politics_balkan_powder_keg_tt_icon$ War with the Ottoman Empire"
 BLL_attack_together_tt: "If any of the Balkan countries attacks §Y[TUR.GetForeignName]§! before us, we will also declare war on the Turks."
 BLL_replace_mission_tt: "If §YBulgaria§! becomes the head of §Cthe Balkan League§! and we are a member of it, then this mission will be replaced by an informative decision."
 BW1_info_when_attack: "$great_power_politics_balkan_powder_keg_tt_icon$ We will attack the Ottoman Empire in §Y[?BLL.days_mission_timeout@BW1_war_with_turkey]§! days"
 BW1_armistice_mission: "$great_power_politics_balkan_powder_keg_tt_icon$ Armistice with Balkan countries"
 BW1_armistice_mission_fake: "$great_power_politics_balkan_powder_keg_tt_icon$ Armistice with [TUR.GetForeignName]"
 BW1_london_conference: "$great_power_politics_balkan_powder_keg_tt_icon$ London Conference"

 BW1_armistice_tt: "§Y[TUR.GetForeignName]§! will offer §YBalkan countries§! to sign an armistice. A peace conference will also begin in §YLondon§!."

 BW1_armistice_TUR_ser: "Armistice with [SER.getName]"
 BW1_armistice_TUR_bul: "Armistice with [BUL.getName]"
 BW1_armistice_TUR_gre: "Armistice with [GRE.getName]"
 BW1_armistice_TUR_mnt: "Armistice with [MNT.getName]"
 BW1_armistice_balkans: "Armistice with [TUR.GetForeignName]"

 BW1_balkan_league_won_tt: "§RThe Ottoman Empire§! has lost most of its European territories, and §Cthe Balkan League§! will be considered §Ythe winner§! of this war and will gain §Ynew territories§!."
 BW1_balkan_league_won_message: "@SER @BUL @GRE @MNT §YThe Balkan states§! brought an end to the long period of @TUR §ROttoman rule§!, and fully regained their sovereignty and territory. However, the borders on the map had not yet been finalised, and the heat of battle had not yet subsided..."
 BW1_balkan_turkey_won_tt: "§CThe Balkan League§! failed to expel the Turks from their §YEuropean possessions§!, and §Rthe Ottoman Empire§! will be considered §Ythe winner§! of this war, retaining its territories and receiving §YCrete§! as compensation."
 BW1_balkan_turkey_won_message: "@TUR §YThe Ottomans§! were able to repel the reckless challenges of @SER @BUL @GRE @MNT §Ythe Balkan states§! and defend their European territories with receiving @CRE §YCrete§! as compensation. However, this war dealt a severe blow to @TUR §Ythe Ottomans§!, who were still struggling to recover from a serious illness. @SER @BUL @GRE @MNT §YThe Balkan states§! will attempt this again, and when they do, the powder keg will be set alight once more."

 albania_independence_message: "Following a series of uprisings that began in 1908, @ALB §Ythe Albanians§! finally gained independence from more than 400 years of @TUR §YOttoman rule.§!"

 BW1_turkey_crushing_defeat_tt: "§Y[TUR.GetForeignName]§! has suffered §Ra crushing defeat§! (lost control under §YConstantinople§! or has more than §Y30%§!(§Y40%§! during Italo-Turkish war) surrender progress)"
 BW1_balkans_crushing_defeat_tt: "§Ythe Balkan countries§! has suffered §Ra crushing defeat§! (§Y[BUL.getName]§! has capitulated or §Y[SER.getName]§! and §Y[GRE.getName]§! have capitulated)"

 BW1_separated_peace_tt: "To achieve §Ya quick victory§! in this war, we must force §Y[BUL.getName]§! to surrender or force §Y[SER.getName]§! and §Y[GRE.getName]§! to surrender."

 GRE_thessaloniki_race: "Race for Thessaloniki"

 ww1_firstbalkan.121.t: "Armistice with Balkans countries"
 ww1_firstbalkan.121.d: "Since the fighting had become stalemated, we can offer balkan countries to sign an armistice with us. In addition, a peace conference was also held in London to end the war."
 ww1_firstbalkan.121.a: "Sure, why not"
 ww1_firstbalkan.121.b: "No!"

 ww1_firstbalkan.122.t: "Armistice with [FROM.getName]"
 ww1_firstbalkan.122.d: "Since the fighting had become stalemated, we have received a truce offer from [FROM.getName], should we accept it?. In addition a peace conference was also held in London to end the war."
 ww1_firstbalkan.122.a: "We need it"
 ww1_firstbalkan.122.b: "No truce with turks!"

 ww1_firstbalkan.124.t: "End of the Armistice"
 ww1_firstbalkan.124.d: "There was a coup d'état in the Ottoman Empire, and the new government now wants to continue the war. Now we can continue our campaign and finally clear the Balkans of this Turkish scum."
 ww1_firstbalkan.124.a: "Continue the offensive!"

 ww1_firstbalkan.125.t: "End of the Armistice"
 ww1_firstbalkan.125.d: "It was a mistake for the previous government to make a truce with these rats and negotiate the transfer of European territories to them. We must immediately continue the war and show our greatness!"
 ww1_firstbalkan.125.a: "Start the offensive!"

 ww1_firstbalkan.126.t: "[FROM.getName] accepted a truce"
 ww1_firstbalkan.126.d: "[FROM.getName] has agreed to sign an armistice with us while the peace conference in London is underway."
 ww1_firstbalkan.126.a: "We have time to rest"

 ww1_firstbalkan.127.t: "[FROM.getName] rejected a truce"
 ww1_firstbalkan.127.d: "[FROM.getName] has decided that they are stronger than us and they don't need any truce, well, let's see."
 ww1_firstbalkan.127.a: "The war to the bitter end!"

 ww1_firstbalkan.128.t: "[FROM.getName] signs the peace"
 ww1_firstbalkan.128.d: "[FROM.getName] was defeated by our invincible army"
 ww1_firstbalkan.128.a: "Who's left?"