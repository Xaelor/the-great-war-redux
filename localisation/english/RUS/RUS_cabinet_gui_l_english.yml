 ww1_russia_flavor.1.t: "Welcome to Russia!"
 ww1_russia_flavor.1.d: "руссик напиши чё нибудь от себя про механики там"
 ww1_russia_flavor.1.a: "I need to know!"
 ww1_russia_flavor.1.b: "I already know everything!"
 ww1_russia_flavor.2.t: "June Third System"
 ww1_russia_flavor.2.d: "The June 3rd coup marked the definitive end of the 1905 Revolution and the beginning of the so-called "Stolypin Reaction".  The Third Duma, dubbed the "Black Duma" by its critics, has a conservative-monarchist majority that reliably supports government initiatives.  While Stolypin pursues land reforms aimed at creating a class of conservative peasant landowners, his political "system" rests on the suppression of dissent, the widespread use of military courts, and the notorious "Stolypin neckties"—the hangman's noose. The arrangement is a contradiction: a reactionary political structure combined with bourgeois economic reforms. We'll see if it's sustainable."
 ww1_russia_flavor.2.a: "The Duma will serve the Tsar—or it will not serve at all."
 ww1_russia_flavor.2.b: "I've seen enough."
 ww1_russia_flavor.3.t: "Agrarian Question"
 ww1_russia_flavor.3.d: "The Stolypin Land Reform is one of the most ambitious and controversial social engineering projects in Russian history. By breaking the commune and encouraging private property, Stolypin seeks to create a conservative peasant class that would underpin the autocracy. "
 ww1_russia_flavor.3.a: "A Wager on the Strong"
