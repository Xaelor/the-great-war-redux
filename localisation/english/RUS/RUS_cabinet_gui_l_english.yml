 ww1_russia_common.30.t: "The Death of Durnovo"
 ww1_russia_common.30.d: "On September 11, Pyotr Durnovo, the former Minister of Internal Affairs in the Cabinet of Gr. Witte. In the person of Durnovo, a typical bureaucrat, a fan of strong power, went to his grave. However, this is not surprising. P. N. Durnovo received a political upbringing in the depths of the police department, of which he was director for 10 years. The end of his political career was his parliamentary activity as the leader of the right in the State Council. Pyotr Durnovo died at the age of 69."
 ww1_russia_common.30.a: "Another face of old russia gone."
