 ww1_kokovtsov.20.t: "Kokovtsov's Fall"
 ww1_kokovtsov.20.d: "There's a saying, "If you don't do politics, politics will do you." Many people chose to ignore it at different points in history, from monarchs who would rather spend their time partying instead of governing to regular citizens who didn't care enough to vote in an election. Sometimes, it worked out for them, sometimes, they experienced the consequences of their apathy first hand.Vladimir Kokovtsov's story is of the second kind. He purposefully chose to ignore the politics of the State Duma, thinking he knew better how to govern the country than them. Regardless of it being true or not, today is the day he hands his resignation letter to the Emperor of all Russia due to his inability to keep the State Duma pacified. For people like him, Russian political system offers a kind opportunity to save face. Most likely, he will receive a seat in the State Council, will be awarded some aristocratic title and a good pension for his service, but no one will be fooled by this into thinking that his resignation was entirely voluntary. Kokovtsov's name will slowly fade into obscurity, dwarfed by the fame of his predeccessors and his successors, only to be remembered as a weird period of Russian history that came after Pyotr Stolypin. But that is the matter for the future, while in the present Russia once again lacks direction of the Chairman of the Council of Ministers."
 ww1_kokovtsov.20.a: "Time to fix this mess."
 
