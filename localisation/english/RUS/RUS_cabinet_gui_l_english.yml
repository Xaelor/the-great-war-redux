 ww1_kokovtsov.12.t: "Markov's Speech in the State Duma!"
 ww1_kokovtsov.12.d: "During today's budget hearing in the State Duma, chairman of the Union of the Russian People and a member of our parliamentary coalition Nikolai Markov gave a speech in which he denounced the government of Vladimir Kokovtsov in the strongest of term. To our unpleasant surprise, this speech recieved standing ovation from basically every faction in Duma, especially socialists. In one of the highlights of the speech, Markov proclaimed, that the Chairman has managed to do an impossible and unite the previously dysfunctional State Duma against him, and accused the Ministry of Finance of thievery, stating that "Stealing is wrong!", after which the leader of the Menshivik faction Nikolai Chkheidze asked to shake his hand. It's safe to say that after this performance any semblance of an agreement with rightists is a thing of the past."
 ww1_kokovtsov.12.a: "Traitor!"
 ww1_kokovtsov.13.t: "Like-minded Person"
 ww1_kokovtsov.13.d: "With the appointment of the new Minister of Internal Affairs, Nicholas II received Maklakov for half an hour in the morning, who made an excellent impression on him with "his correct view of things, his honesty and frankness". This personal favor on the part of Nicholas II is not hampered even by Maklakov’s negative attitude towards Rasputin.\nThe rather unexpected appointment of the young governor immediately gave rise to comparisons with Stolypin. In the Duma cirlces it is believed that Maklakov has his sights set on becoming prime minister and could well be leaning on nationalists and even right-wing Octobrists.\nSpeaking to his subordinates, Maklakov announced his program; "We should all have the same goal – to strengthen state power, strong, benevolent and calm ... working for the benefit of the multimillion-strong population of great Russia. The path leading to this goal is the only one, there is no other and there can be no other – this is the law approved and approved by his Imperial Majesty.""
 ww1_kokovtsov.13.a: "Finally, someone who understands!"
 ww1_kokovtsov.14.t: "Sergei Kryzhanovsky Appointed"
 ww1_kokovtsov.14.d: ""
 ww1_kokovtsov.14.a: "Let's see how well he does."
