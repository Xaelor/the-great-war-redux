 ww1_krivoshein.6.t: "Cabinet of Reactionaries"
 ww1_krivoshein.6.d: "The Russian State is at a crossroads: years of political turmoil caused by anger from the people over a system that has not been working for them has taken the Russian political system by storm. While progress has been made, the reactionary cabinet has, for the most part, attempted to stand against necessary reforms to save Russia. It is absolutely crucial we finish off the necessary reforms for the people in order to avoid another 1905, and if the cabinet wants to stand in the way of this, then they are our greatest enemy.\n\nReactionaries in cabinet positions must be identified and removed as soon as possible. We must replace them with more ideologically combatible men, who are ready to do what it takes to secure the stability of the Russian political systen. Many of these reactionaries are well entrenched in their positions, being friends with the Tsar himself, and removing them is going to be politically costly, yet it must be done."
 ww1_krivoshein.6.a: "For the good of Russia"
 ww1_krivoshein.6_tt: "Removing §qReactionaries§! from the cabinet will be crucial towards speeding up progress for the §Yreforms§!"
