 #Maklakov
 ww1_rus_maklakov.1.t: "Controversial Governor"
 ww1_rus_maklakov.1.d: "When Nikolai Maklakov was appointed governor of Chernigov, he discovered that the province represents, if not a stronghold, then a fairly strong platfotm for the liberals, especially the Octobrist party and members of zemstvo institutions.\nUsing administrative resources and other opportunities, Maklakov managed to significantly weaken the positions of the Octobrists and Zemstvo people in his province.\nAn acute conflict arose. Maklakov, caused a flurry of indignation from the liberal public of the region, which flood the imperial office with complaints about his arbitrariness and demands for his resignation."
 ww1_rus_maklakov.1.a: "He proved himself useful."
 ww1_rus_maklakov.2.t: "Silence in the Duma"
 ww1_rus_maklakov.2.d: ""
 ww1_rus_maklakov.2.a: "Finally, some peace and quiet."
