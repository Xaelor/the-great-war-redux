 ww1_russia_flavor.12.t: "Death of Lev Tolstoy"
 ww1_russia_flavor.12.d: "The great Russian writer, philosopher and religious thinker, Lev Tolstoy died at age of 82. His works «Anna Karenina» and the epic «War and Peace» are recognized as masterpieces of world literature. With his death, an entire era in Russian literature is leaving, which had a significant impact on the development of humanism and the genre of realism in Europe.\n\nDespite the conflict with the Russian Orthodox Church, Lev Nikolayevich Tolstoy will be buried with all honors as One of the Greatest Writers of the past and present centuries."
 ww1_russia_flavor.12.a: "May God judge him"
 #Stolypin
 ww1_stolypin.1.t: "Law on Western Zemstvo Passes in the State Duma"
 ww1_stolypin.1.d: "The law extends the Provision on Zemstvo institutions to six provinces of the Western Territory, with the peculiarity that landowners of Polish origin are allocated to a separate electoral curia; thus, the possibility of Poles receiving a majority of the votes of Zemstvo vowels is excluded.\nThe Duma took great interest in the bill and its adoption took thirteen meetings of the General Assembly. The bill is eventually approved by the Duma."
 ww1_stolypin.1.a: "Russia is for the Russians, after all"
 ww1_stolypin.2.t: "Covert Support for Octobrist Press"
 ww1_stolypin.2.d: ""
 ww1_stolypin.2.a: "Guchkov is in our pocket."
 ww1_stolypin.3.t: "Appointment of Sazonov and Kasso"
 ww1_stolypin.3.d: "Sergey Sazonov rose rapidly from minor diplomatic posts in London, Washington and the Vatican to become Deputy Foreign Minister in the government of his brother-in-law, Pyotr Stolypin. His elevation to Foreign Minister was hastened by the behaviour of his predecessor, Aleksandr Izvolskii, who during the Balkan crisis of 1908-1909 without the consent of the Council of Ministers, bargained with his Austrian counterpart for revisions to the Treaty of Berlin that would see the Straits of the Bosporus and Dardanelles opened to Russian ships while Austria annexed Bosnia and Herzegovina. Austria, backed by the threat of German force, announced annexation without any treaty review, and Russia had to accept Austrian aggression toward the Slav provinces for no return. In the aftermath of this humiliating acquiescence Izvolskii is removed to the diplomatic mission in Paris and the inexperienced Sazonov tooks his place.\n\nThe appointment of Lev Kassо as the head of the Ministry of Public Enlightenment, comes as a surprise to everyone. The resignation of his predecessor, Aleksandr Schwartz, had been widely expected and is the result of both his requests and the initiative of Pyotr Stolypin, but it was unclear who would accept such a difficult legacy. According to one version, Lev Kassо was recommended by Pyotr Stolypin's cousin, the Octobrist Baron Alexander von Meyendorff. There are rumors among scholars that “this was the candidate of the Grand Duchess Elizabeth Feodorovna and the Duma “nationalist” Krupensky”. In any case, the appointment is perceived by various political forces as the result of Pyotr Stolypin’s desire to completely control the government, although initially he was wary of Kasso’s “non-Russian appearance, upbringing” and “inner world”."
 ww1_stolypin.3.a: "Nothing wrong with a bit of Nepotism."
 ww1_stolypin.4.t: "Formation of the All-Russian National Union"
 ww1_stolypin.4.d: "At the regular congress of the VNS, of the VNS and the moderate-right party merge. Unlike the extreme right-wing Black Hundreds, who ideologically rely on Uvarov's triad of \"Orthodoxy, Autocracy, Nationality,\" moderate right-wing Russian nationalists put forward the slogan: \"Autocracy, Orthodoxy, Monocracy,\" the fundamental basis of which is declared to be Russian nationalism.\n\nTheir foals \"the unity and indivisibility of the Russian Empire, the protection of the dominance of the Russian people in all its parts, the strengthening of the consciousness of Russian national unity and the consolidation of Russian statehood on the principles of the autocratic power of the Tsar in unity with legislative popular representation.\""
 ww1_stolypin.4.a: "They could be useful."
 ww1_stolypin.23.t: "Affairs of the Internal Affairs"
 ww1_stolypin.201.d: "Stolypin currently holds a dual role of both the Chairman of the Council of Ministers and the Minister of Internal Affairs, which limits his influence over the latter. He wants a replacment, but is having difficulty finding a suitable successor.\nHowever there are three candidates on his mind:\nSergei Kryzhanovsky, a highly talented and intelligent man, the Deputy Minister of Internal Affairs and Stolypin's right-hand man. Unfortunately, Kryzhanovsky, is loacking in moral characterm often resorting to unseemly tactics that compromised Stolypin.\n\nNikolai Maklakov, appointed by Stolypin as acting governor of Chernigov, shows great skill in dealing with liberals, especially the Octobrist party and members of zemstvo.\n\nAleksey Khvostov is valued by Stolypin valued for his diligence, firm monarchist views, energetic suppression of revolutionary uprisings at the local level, and a talent for getting the right deputies into the State Duma."
 ww1_stolypin.23.a: "Noted."
 ww1_stolypin.5.t: "Death of Sergei Muromtsev"
 ww1_stolypin.5.d: "Sergei Andreevich Muromtsev, a legal scholar and one of the founders of Russian constitutional law, died suddenly "at approximately two o’clock in the morning from cardiac arrest."."
 ww1_stolypin.5.a: "One less Kadet."
 ww1_stolypin.6.t: "Student Protests at Muromtsev's Funeral!"
 ww1_stolypin.6.d: "Muromtsev's funeral turns into a demonstration attended by thousands of people who support liberal ideas and oppose the government. The newspaper "Russkiye Vedomosti" writes that Muromtsev "became a historical figure for all Russians and all Europeans during his lifetime, because Russian constitutional history begins with his name.""
 ww1_stolypin.6.a: "Concerning"
 ww1_stolypin.7.t: "Zerentui Tragedy"
 ww1_stolypin.7.d: "The warden of the Zerentui penal prison treats political prisoners equally with criminals and introduced corporal punishment for the former. In protest against the administration's harsh treatment six political prisoners attempt suicide. One of those who poisoned himself—a former member of the "Combat Organization of Socialist Revolutionaries," Sozonov—dies. News of the Zerentui tragedy sparks student unrest in several Russian cities."
 ww1_stolypin.7.a: "Why do they care about a terrorist?!"
 ww1_stolypin.8.t: "Question of Student Protests"
 ww1_stolypin.8.d: "The gatherings grew into larger riots, which are erupting in direct response to government decrees abolishing higher-education autonomy, banning student organizations, and authorizing police and military entry onto university campuses."
 ww1_stolypin.8.a: "The students know, shut it down!"
 ww1_stolypin.8.b: "Wait it out..."
 ww1_stolypin.9.t: "University Professors Resign in Protest"
 ww1_stolypin.9.d: "Adter police entered the Moscow University, the University Council, after hearing a speech by Rector Aleksandr Manuilov, accepted the resignation of the leadership, noting that the current situation "makes it impossible for the elected university administration to fulfill the duties entrusted to it." Aleksandr  Manuilov believes that only one authority—the professorial board—could exist at the university. The Minister of Public Enlightenment Lev Kasso not only accepted the resignations of the University Council, but also dismissed them from the university as professors.\nIn solidarity with the dismissed leaders, a whole group of professors and assistant professors at Moscow University submitts their resignations. Ultimately the number of faculty members who left the university reached 108."
 ww1_stolypin.9.a: "Good riddance."
 ww1_stolypin.10.t: "State Council Votes on the Western Zemstvo"
 ww1_stolypin.10.d: "Stolypin is convinced that consideration by the State Council will not create significant difficulties. Half of the Council consisted of appointed members, who by default side with the government; the other, elected half, is dominated by members of a right-wing, pro-government persuasion.\nAdopting the new law by the end of the term of office of the State Council members from the Southwestern Territory is no longer possible; new elections are to be held under the old law, and consideration of the bill loses its urgent urgency. The bill progresses at a sluggish pace, and although there is some opposition (primarily from Witte), its successful passage is certain."
 ww1_stolypin.10.a: "This should pass smoothly."
 ww1_stolypin.11.t: "Law on Western Zemstvo Unexpectedly Failed in the State Council!"
 ww1_stolypin.11.d: "Something unexpected happened. At an interim session, the State Council votes 92 to 68 in favor of the amendment abolishing the national curiae. The entire purpose of the government bill is nullified!\n\nThe reason for this unexpected vote is the activities of the right-wing leaders of the State Council, Pyotr Durnovo and Vladimir Trepov. They unexpectedly launched an active, but covert, campaign against the bill among members of the State Council. To justify his position, Durnovo drafted a special note for Nicholas II, which was transmitted to the emperor through Trepov. Apparently, Durnovo and Trepov told their supporters that the Emperor had agreed to reject the bill."
 ww1_stolypin.11.a: "They did what?!"
 ww1_stolypin.12.t: "Stolypin Wants to Resign!"
 ww1_stolypin.12.d: "Pyotr Stolypin perceives the bill's failure in the State Council as a personal insult and the result of base political intrigue. Stolypin is particularly outraged by the fact that the bill was being fought not from the podium, but behind the scenes, by submitting a memo to the Tsar. Immediately approaching Nicholas II, Stolypin asks for his resignation. Stolypin explains his request by arguing that his further work would be impossible if the legislative bodies were, out of personal animosity and a love of intrigue, to obstruct the most important government initiatives."
 ww1_stolypin.12.a: "Calm down, we can find a solution"
 ww1_stolypin.12.b: "Who do you think you are threatening?!"
 ww1_stolypin.13.t: "Stolypin Demands Temporary Dismissal of the Parliament"
 ww1_stolypin.13.d: "Nicholas II did not decide the matter immediately and took some time to consider. Stolypin announced his decision to the other ministers, explaining his reasons in detail.\nLater, Nicholas II informs Stolypin of his readiness to resolve the political crisis on his terms.\n\nStolypin proposes dissolving the legislative bodies for a short period and adopting a law by Imperial decree based on Article 87 of the Fundamental State Laws.\n\nThis article allows the Tsar to urgently enact necessary laws during periods when the legislative bodies are not in session, provided they are submitted to the legislative bodies within two months of their reopening.\nThe proposed actions are not formally a violation of the law, but they appear to be a gross manipulation of the law. Firstly, the law is not urgent: it had been under scheduled consideration for over a year and a half. Secondly, Article 87, in spirit, was intended for the Duma's summer recess and for the periods between the dissolution of the old Duma and the convocation of the new one."
 ww1_stolypin.13.a: "Durnovo is at fault anyway, proceed."
 ww1_stolypin.13.b: "Absolutely not!"
 ww1_stolypin.14.t: "Guchkov Resigns in Protest!"
 ww1_stolypin.14.d: "The adoption of the law under Article 87 is perceived by the majority factions of the State Duma as an expression of disdain for the Duma, which had passed the bill without delay.\nIn protest, Duma Chairman Alexander  Guchkov resigns from his position."
 ww1_stolypin.14.a: "You voted for it yourselves!"
 RUS_stolypin_resigned: "Stolypin resigned"
 ww1_stolypin.15.t: "Stolypin Resigns!"
 ww1_stolypin.15.d: "Seeing no prospects of the success of his policy, Stolypin resigns, deeply insulted by the betrayal of the State Council and now the Tsar as well. It is unceratin of he will ever return to the political scene."
 ww1_stolypin.15.a: "Let's review our options"
 ww1_stolypin.16.t: "New Chairman of the Council of Ministers"
 ww1_stolypin.16.d: "After the untimely departure of Pyotr Stolypin, the June Third Political System which he established for the purposes of passing his reforms as smoothly as possible now has a void in its center, and we have to now determine, who is the best fit for Stolypin's shoes, and what will be the future of the Russian political system.\n\nThe first candidate is Vladimir Kokovtsov, the current minister of finance. A peaceful man who prefers budgeting to fiery speeches and drastic actions, he is thoroughly fed up with Stolypin's controversies and intends to repair relations with the State Duma and invite its factions to work with the government for the betterment of Russia.\n\nThe second candidate is the current minister of agriculture, Alexander Krivoshein. He is a long time ally of Stolypin's and mastermind behind his agrarian reform. While he is an uncompromising reformist much like Stolypin, he prefers a compromise with the liberal faction of the State Duma over trying to manipulate everyone.\n\nAnd lastly, we have Pyotr Durnovo. An author of the western zemstvo crisis and a former minister of internal affairs, he is considered to be the leader of the most reactionary forces of Russia that reject even the reluctantly granted Russian Constitution of 1906. He is deeply opposed to any notion of parliamentarism, and is willing to use shrewd political tactics to undermine its existence.\n\nRegardless of who is chosen as Stolypin's successor, they're guaranteed to make an impact on the course of Russian history. Only time will tell, however, whether they will lead it to catastrophy or renew and strengthen it..."
 ww1_stolypin.16.a: "Those people in the State Council have a point..."
 ww1_stolypin.16.b: "Kokovtsov is a reasonable man."
 ww1_stolypin.16.c: "Krivoshein will continue Stolypin's course."
 ww1_stolypin.17.t: "Opening of the Alexander II Monument in Kiev"
 ww1_stolypin.17.d: "The monument to Alexander II is completed. Triumphal arches are being erected. Flags flutter in the streets, and the facades are richly decorated. Government and private institutions have prepared a wealth of valuable wreaths. Troops are arriving for maneuvers. Amusement reviews are underway. A mandatory decree has been issued regulating the supply of essential goods.\nNicholas II arrives to unveil the monument to his grandfather. The ceremony itself takes place on the feast day of Saint Alexander Nevsky, after whom the future emperor was named. The monument is unveiled in the presence of the emperor himself, Prime Minister Pyotr Stolypin, Chief Prosecutor of the Holy Synod Vladimir Sabler, Chief of the Gendarmes Kurlov, Minister of Enlightenment Kasso, the son and heir of the Bulgarian Tsar Ferdinand, minor officials, and representatives of the Austro-Swedish and Swiss consulates. During the festivities, city residents are given postcards with photographic reproductions of the monument and its parts."
 ww1_stolypin.17.d_no_stolypin: "The monument to Alexander II is completed. Triumphal arches are being erected. Flags flutter in the streets, and the facades are richly decorated. Government and private institutions have prepared a wealth of valuable wreaths. Troops are arriving for maneuvers. Amusement reviews are underway. A mandatory decree has been issued regulating the supply of essential goods.\nNicholas II arrives to unveil the monument to his grandfather. The ceremony itself takes place on the feast day of Saint Alexander Nevsky, after whom the future emperor was named. The monument is unveiled in the presence of the emperor himself, Chief Prosecutor of the Holy Synod Vladimir Sabler, Chief of the Gendarmes Kurlov, Minister of Enlightenment Kasso, the son and heir of the Bulgarian Tsar Ferdinand, minor officials, and representatives of the Austro-Swedish and Swiss consulates. During the festivities, city residents are given postcards with photographic reproductions of the monument and its parts."
 ww1_stolypin.17.a: "Let's feast!"
 ww1_stolypin.18.t: "Stolypin Shot!"
 ww1_stolypin.18.d: "The Emperor, his daughters, and close ministers, including Stolypin, are attending a performance of "The Tale of Tsar Saltan" at the Kyiv City Theater. At the time, the chief of Kyiv's security service had information, from Dmitry Bogrov, that a terrorist had arrived in the city with the intention of attacking a high-ranking official, and possibly the Tsar himself.\nDuring the second intermission of "The Tale of Tsar Saltan," Stolypin is conversing near the orchestra pit barrier with the Minister of the Court, Baron Fredericks, and Count Potocki, a land magnate. Suddenly, Bogrov approaches Pyotr Stolypin and fires twice from a Browning: the first bullet hit him in the arm, the second in the stomach, piercing his liver. Stolypin is saved from instant death by the Cross of St. Vladimir. Having shattered it, the bullet veered toward his heart. It pierced the rib cage, pleura, thoracoabdominal septum, and liver. After  being wounded, Stolypin crossed himself over the tsar, sank heavily into a chair, and, in a clear and distinct voice audible to those nearby, said:"
 ww1_stolypin.18.a: ""Happy to die for the Tsar""
 ww1_stolypin.19.t: "Stolypin is Stable"
 ww1_stolypin.19.d: "Renowned surgeons arrive at the hospital where Stolypin was taken. Led by Nikolai Volkovich, the doctors limited themselves to merely examining the entry wound and applying an aseptic dressing, finding no indication for either laparotomy or abdominal surgery to objectively confirm the presence of blood inside. As a result, they deemed internal bleeding questionable, and a search for the source of the bleeding unnecessary.\nNext morning, the wounded man's health is quite satisfactory, and he feels well. He combes his hair, tidies his mustache, and regains his appetite. Throughout the day, his condition remains satisfactory, with a normal pulse and temperature. The doctors consider this as a success of the wait-and-see approach."
 ww1_stolypin.19.a: "Please God."
 ww1_stolypin.20.t: "Stolypin Dies"
 ww1_stolypin.20.d: "Professor Hermann Zeidler arrived from St. Petersburg. But by that time, Stolypin had already developed a fever. The professor removed the bullet from his body. In the following days, Stolypin's health only worsened, and his chances of recovery dwindled.\n\nA solemn prayer service for Stolypin's recovery was held in St. Vladimir's Cathedral. The cathedral was overcrowded, and many wept.\nThe following days were filled with anxiety, and doctors hoped for a recovery. However, in the evening, Stolypin's condition deteriorated sharply. He began to lose strength, his pulse weakened, and on the next day, he died."
 ww1_stolypin.20.a: "Good night, sweet prince..."
 ww1_stolypin.21.t: "Stolypin Assassination"
 ww1_stolypin.21.d: "Russian Prime Minister Pyotr Stolypin died after the assassination attempt several days earlier. A member of the ministerial guard attacked him in the Kiev Opera House, where the minister was with Emperor Nicholas Romanov. The terrorist was caught on the spot, the royal family was not injured and is safe.\n\nAs prime minister Stolypin had tried to turn the Russian peasantry into prosperous independent small farmers who would be grateful and loyal to the imperial regime.\nHe also became famous for his methods of struggle with the opposition and had so many accused rebels hanged that the noose acquired the nickname of «Stolypin’s necktie»."
 ww1_stolypin.21.a: "He was proud to serve the Tsar"
 ww1_stolypin.22.t: "Stolypin's Funeral"
 ww1_stolypin.22.d: "Stolypin's will, written long before his death, was opened and its opening lines read: "I wish to be buried where I am killed." Stolypin's instructions were carried out by his family: the Kiev Pechersk Lavra was chosen as his burial site.\nThe refectory church, where the funeral service is held, is filled with wreaths of national ribbons. The government, representatives of the army and navy, and all civilian departments, many members of the State Council and the State Duma, and over a hundred peasants from nearby villages gather."
 ww1_stolypin.22.a: "His wish is fulfilled."
 #Kokovtsov
 ww1_kokovtsov.1.t: "Policy of Reconciliation"
 ww1_kokovtsov.1.d: "Vladimir Kokovtsov is not a liberal. He doesn't believe in the Constitution, the rule of law, democratic reforms, equality under law and many other things that the majority of the State Duma holds dear. If hypothetically he was given a choice between a British-style parliamentary system or a pre-1906-style Tsarist Autocracy, he would probably choose the latter. However, this is not because Vladimir Kokovtsov is a radical opponent of those things like many rightists in the State Duma and State Council are. He simply doesn't understand the concept of parliamentarism, and at worst is indifferent to it. What Vladimir Kokovtsov understands is numbers. Quarterly reports, budget estimates, expenses and revenues, those are the things that are of any interest to him. It's no wonder he always felt antipathy to Stolypin - he prefers the clarity of a balance sheet to the vagueness of grandiose speeches about such concepts as the rule of law, the greatness of Russia or whatever the former Prime Minister loved to cause an uproar in Duma over. Which is why the existence of the institution that invites that sort of discourse was always seen by Kokovtsov as an unfortunate turn of events, one that he nonetheless is willing to tolerate for the purposes of maintaining the stability of the Russian finance. And if he was able to come to terms with the existence of the State Duma, there should no logial reason why it in turn can't reconcile its differences with the government, for the common good of Russia."
 ww1_kokovtsov.1.a: "He is the best option we have."
 kokovtsov_coalition_mechanic_tt: "In order for the cabinet to survive, we need to make a coalition with different factions of the State Duma and satisfy their demands."
