 ww1_russia_common.37.t: "Thankless Job"
 ww1_russia_common.37.d: "The Minister of the Navy is a difficult position, as the Navy's prestige had declined after the war with Japan, its technical condition is poor, and bureaucracy is hindering its development. Emperor Nicholas II even had to intervene and send a telegram to Ivan Grigorovich:\n"I beg you, Ivan Konstantinovich, to pay no attention to the attacks on you personally and on the Naval Department. Continue firmly and steadfastly the work of rebuilding the Navy entrusted to you...'""
 ww1_russia_common.37.a: "It's an honour."
