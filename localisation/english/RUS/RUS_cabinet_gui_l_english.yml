 ww1_kokovtsov.15.d: ""
 ww1_kokovtsov.15.a: ""
 ww1_kokovtsov.16.t: "Maklakov's Plan"
 ww1_kokovtsov.16.d: "With the failure of Kokovtsov's policy of reconciliation, Maklakov offeres to speak in the Duma on behalf of the entire government, warning them to bring it into a "lawful course with a strong hand." In the case of disobedience, "this will only bring closer the denouement, which, apparently, is hardly averse." The "denouement" means the dissolution of the Duma, the introduction of increased emergency security in Petersburg, and the suppression of riots.\n\nThe Tsar replies that he is "pleasantly surprised" by his proposal, since he himself wants to take the same initiative. "I personally think that such a speech by the Minister of Internal Affairs will defuse the atmosphere with its unexpectednes and make Mr. Rodzianko and his lackeys bite their tongues.""
 ww1_kokovtsov.16.a: "Let's get to work."
 ww1_kokovtsov.16.b: "Hold your horses."
