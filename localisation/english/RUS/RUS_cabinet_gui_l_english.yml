 RUS_cabinet_title_tt: "Council of Ministers"
 RUS_cabinet_desc_tt: "The Council of Ministers is headed by the Chairman, who determines the overall course of the government, while other ministers enact their own policies.\n\nMembers of the §YCabinet§! can have their own §YStance§!, which §Gunlocks§! different options in the §YNational Focuses§!."

