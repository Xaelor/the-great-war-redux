 RUS_vacant: "Vacant"
 RUS_vacant_desc: "This ministry is vacant."
 RUS_nikolai_ii: "Nikolai II"
 RUS_nikolai_ii_desc: "His Imperial Majesty Nikolai II has been ruling Russia from 1894. From the early days of his reign he made clear that, like his father before him, he will defend the Tsar's absolute power, which he believed was the best tool to ensure the well-being of the people. His faith in this was put to the test in 1905, when the same people he swore to protect, unable to endure the living conditions in Russia, rebelled against his rule in what is known as the First Russian Revolution. Nikolai eventually was forced to accept the creation of the State Duma and the Constitution, which limited his absolute authority and made it so that no law could be passed without the consent of the parliament. However, the Emperor was dissatisfied with the first two State Dumas, which were too radical, pushed for too much and refused to compromise with the government. That's when he met Pyotr Stolypin, a staunch reformer who like Nikolai was disillusioned with the parliamentarism, and appointed him as his Prime Minister. Stolypin managed to tame the Duma and pursue necessary reforms. Now, the Emperor stands at the crossroads. Stolypins reforms provided the country with the stability it needed, and now Nikolai can choose - take back his lost powers, maintain the status quo or continue liberalizing the Empire."
 RUS_nikolai_romanov: "Nikolai Romanov"
 RUS_sergei_kryzhanovsky: "Sergei Kryzhanovsky"
 RUS_pyotr_stolypin_desc: "§LPyotr Stolypin was born on 14th of April, 1862, in Dresden, into an aristocratic family. From the earliest years of his life he was interested in both agriculture and public service, and having served for multiple years as a governor of Kovno, and then Grodno and Saratov, he realized that something was not right with Russia, a concern which came true in 1905, when Russia had its first Revolution. His successes as a governor earned him an appointment as a Minister of Internal Affaris and later as Prime Minister, with a mandate to deal with the Revolution by any means necessary. His became a synonym for controversy after his brutal suppression of revolution through executions of anyone suspected of being a revolutionary, and later undermining of the State Duma and the Russian Constitution. However, for each authoritarian measure he had taken, he made a liberal decision afterwards. He  began implementing his long-planned plan of reforms, which are supposed to transform Russia into a modern Western nation, and unlike Prime Ministers before him, he's willing to be a politician instead of a bureaucrat and engage with the public opinion in the State Duma, defending his reforms and making compromises. However, only time will tell if Russia will accept his vision.§!"
