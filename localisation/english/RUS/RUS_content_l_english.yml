 # National Focuses
 #INTERNAL POLITICS
 RUS_whirlwinds_of_danger: "Whirlwinds of Danger"
 RUS_whirlwinds_of_danger_desc: "The streets of Saint Petersburg are wrought with blood. The peasants have taken arms. The empire is in crisis. While the Tsar and the imperial family were successfully evacuated to his Tsarskoye Selo residence in advance, the Saint Petersburg Soviet has called for a renewed general strike in October and the peasants of Poland have launched their own insurrection in Łódź. Figures in the government like Sergei Witte have pushed the Tsar to promise reform and end the bloodshed, however he is reluctant. These are dark days for the empire, and only time will tell whether the situation improves, or turns south."
 RUS_october_manifesto: "October Manifesto"
 RUS_october_manifesto_desc: "The Tsar has conceded to compromise. After a multiple day long back and forth between the Tsar and his more moderate ministers, he has signed off on a new manifesto; the "Manifesto on the Improvement of the State Order". This manifesto contains a number of provisions aimed to appease the population, including universal male suffrage, an elected parliament called the Duma, and guarenteed freedom of speech, press, assembly and conscience. While these pledges aim to bring Russia down from the precipice, it isn't a secret that the Tsar wishes to claw back his power, and if that means holding his nose to the waves of reform in the short term - so be it."
 RUS_proclaim_religious_tolerance: "Proclaim Religious Tolerance"
 RUS_proclaim_religious_tolerance_desc: "As part of his concessions to the people in order to end the ongoing political and civil chaos across Russia, the Tsar has announced a new tolerance for religions other than the Russian Orthodox Church in the recently published Bulygin Constitution. As part of this he has signed the Edict of Toleration, giving legal status to sects other than the Orthodox Church. While this has frustrated the church immensely through recognising the so-called heretics of the Catholic and Protestant faiths, it will certainly go a long way in easing the ongoing crisis and restoring some semblance of stability to Russia's minority populations in Poland, the Baltic, the Caucasus and Central Asia."
 RUS_convene_first_state_duma: "Convene 1st State Duma"
 RUS_convene_first_state_duma_desc: "With the first legislative election over, the time is finally here to convene the First State Duma. The Constitutional Democrats under Pavel Milyukov have risen as the largest party, largely attributed by the boycott of the election by the Socialist-Revolutionaries and RSDLP. Despite this, behind closed doors the situation is tense. The Tsar and his ministers have been hard at work trying to take away powers and Milyukov has made it clear he believes the planned revision to the Fundamental Laws to be nothing more than a mock-constitution. How the situation may develop is uncertain, but with the Tsar now facing the reformists in the Duma rather than on the streets, his options are limited."
 RUS_appoint_stolypin: "Appoint Stolypin"
 RUS_appoint_stolypin_desc: "With Ivan Goremykin tendering his resignation, we are now faced with the question of his successor. After much deliberation the Tsar has decided to appoint Pyotr Stolypin as the next Prime Minister. A proven administrator during his time as Governor of Saratov, and a loyal Statesman to the monarchy, he differs from other in the government in that he is an avid supporter of economic modernisation. One of his main projects he plans on is the large scale agrarian reform based upon the recommendation of the Needs of Agricultural Industry Special Conference. This will surely anger the Liberal majority Duma, but they can do little but write angry letters to the Tsar's residence."
 RUS_court_martials_for_revolutionaries: "Court Martials for Revoltuionaries"
 RUS_court_martials_for_revolutionaries_desc: "In the Prime Minister's words, "When your home is on fire, gentlemen, you break into other homes, breaking down the doors and smashing the windows. When you are attacked by a murderer, you kill him. Gentlemen, this is self-defense.". Radical measures will be taken to ensure and safeguard stability in Russia. Through the use of Article 87 of the fundamental laws, we will use Military Tribunals to swiftly prosecute revolutionary dissidents and restore order to the streets. The people must see what happens when they strike out against the Tsar's authority. Perhaps they shall think twice of revolution when they see their "comrades" hanging from Stolypin's Necktie."
 RUS_abolish_buyout_payments: "Abolish Buyout Payments"
 RUS_abolish_buyout_payments_desc: "Buyout Payments, also referred to as Redemption Payments, are an incredibly unpopular measure introduced by Tsar Alexander II in 1861 in order to compensate the landowners for the loss of their serfs. In order to pay for this, the government of the time saddled emancipated peasants with a devastating 49-year loan with an annual repayment of 6% of the value of the land. Massive overinflation of land prices means this has forced the entire lower class into permanent squalor. Not only is this not ideal for the economy as it makes it difficult for independent farmers, but it also creates breeding grounds for socialist and revolutionary tendencies in the resentful communes. By abolishing them the Prime Minister seeks to progress his land reform and smash the revolutionaries at their heart - the peasantry themselves."
 RUS_kadet_cabinet: "Kadet Cabinet"
 RUS_expropriate_landlord_lands: "Expropriate Land from Landlords"
 RUS_amnesty_for_revolutionaries: "Amnesty for Revolutionaries"
 RUS_support_octobrist_press: "Support Octobrist Press"
 RUS_june_third_coup: "June Third Coup"
 RUS_june_third_coup_desc: "The time has finally arrived for Tsar Nicholas II to reclaim his rightful place as the real ruler of Russia. For too long, the Duma has been a thorn in the side of the Tsar's authority and Stolypin's government. Liberalism has become a plague on our great Fatherland. We have the Tsar, the government, the Zemstvos, the URP, and the Octobrists behind us. The plan is that Stolypin will hold a closed session of the Duma in which he will accuse the RSDLP of revolutionary activity and bend the hand of the deputies to suspend their immunity and allow for a shift arrest of the parties deputies. Then the Tsar shall dissolve the Duma, and rapidly pass new electoral laws to strengthen landowner votes and lower the power of the more Liberal urban centres, allowing for the subsequent election to hand him a comfortable majority and form a new government, free of Liberal blight and serving of the interests of the Tsar and his ministers."
 RUS_support_octobrist_press_desc: "The Union of October 17th , one of the largest political forces in Russia, publishes several newspapers and magazines across the country, the most popular of which is "Voice of Moscow." Their positions are quite reasonable, so our contribution to their funding could provide the government with more opportunities to advance reforms and spread its ideology."
 RUS_nationalist_proxies: "Unite the Moderate Nationalists"
 RUS_nationalist_proxies_desc: "The right-wing factions in the Duma can sometimes be too extreme even for our own likings. However, there are still many reasonable, patriotic deputies who understand the need for national unity and the position of autocracy. We must promote the unification of various moderate groups, such as the Russian People's Center Party, the Moderate Right Party, the Right Order Party, and others, to create a reliable patriotic force in the Duma."
