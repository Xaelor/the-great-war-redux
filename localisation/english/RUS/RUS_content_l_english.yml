 #STOLYPIN'S REFORMS
 RUS_stolypins_reforms: "Stolypin's Reforms"
 RUS_stolypins_reforms_desc: "Underway are many influential reforms under Prime Minister Stolypin's guidance, designated into four pillars. Those consist but are not limited to social reform, agrarian land reform, creating conservative peasant farm owners that back the state, and also industrial reform, attempting to discombobulate the strike movement, by reaching its core. The final reform is education reform, removing our decadent and horrible literacy rate, whilst also creating military institutes."
 #Education Reform
 RUS_universal_primary_schooling: "Universal Access to Primary Schooling"
 RUS_universal_primary_schooling_desc: "A key beginning to Stolypin's reforms, we will create education funds that provide new schooling for no cost, allowing kids to become more intelligent. This will also begin to satisfy the socialists, in turn, providing a great deal of good reforms to the nation."
 RUS_secular_primary_schooling: "Secular Primary Schooling"
 RUS_secular_primary_schooling_desc: "Even though this may face backlash, we will institute secularisation policies to the education system, creating a liveable enviroment for minorities, as currently, our Orthodox schools discriminate openly against non Orthodox, so to provide towards our reforms, we will complete this act."
