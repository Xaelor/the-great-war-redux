 RUS_monopolistic_capitalism: "Syndicate Lobbying"
 RUS_monopolistic_capitalism_desc: "Russian economy is dominated by a select number of large companies, such as Produgol, Prodvagon and Prodamet, which have monopolized parts of it. These syndicates are happy to exploit their workers and lobby the government so that it doesn't pay attention to them, however, any substantial labour reform will require dismantling them."
