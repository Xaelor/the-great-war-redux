 ww1_armenian_reforms.1.t: "The St. Petersburg Proposal"
 ww1_armenian_reforms.1.d: "The Russian Ambassador has presented an ultimatum disguised as reforms for our Armenian provinces. Their true intent is clear: to establish foreign governance over Ottoman territory, paving the way for the partition of our Empire. Accepting means signing the death warrant of our state and opening the gates to our enemies."
 ww1_armenian_reforms.1.a: "We'd better discuss other options."
 ww1_armenian_reforms.2.t: "Constantinople Talks Suspended"
 ww1_armenian_reforms.2.d: "For months, diplomats in Constantinople have engaged in tense negotiations over the proposed Armenian reform project. However, the escalating crisis in the Balkans has drawn the attention of the Great Powers elsewhere. With Europe on the brink, both sides have agreed to indefinitely suspend the talks. The Armenian question remains unresolved, but for now, the status quo is preserved."
 ww1_armenian_reforms.2.a: "We turn our attention elsewhere."
 ww1_armenian_reforms.3.t: "Negotiations Yield No Result"
 ww1_armenian_reforms.3.d: "After months of diplomatic efforts in Constantinople, the talks regarding the Armenian reform project have concluded without agreement. Neither side was willing to compromise on key points, and the delegations depart with nothing to show for their efforts. The status quo remains unchanged."
 ww1_armenian_reforms.3.a: "Back to square one. So be it."
 ww1_armenian_reforms.4.t: "Compromise Reached on Armenian Reforms"
 ww1_armenian_reforms.4.d: "The Constantinople talks have concluded with a compromise agreement. While rejecting full Russian oversight, the Ottoman delegation has agreed to limited administrative reforms in the Eastern Vilayets. Greater local autonomy and cultural rights are granted, though ultimate sovereignty remains with the Porte. A middle path has been chosen."
 ww1_armenian_reforms.4.a: "A pragmatic solution has been found."
 ww1_armenian_reforms.5.t: "Full Armenian Reform Project Approved"
 ww1_armenian_reforms.5.d: "The Constantinople talks have concluded with the Ottoman delegation accepting the full Russian-proposed reforms for the Eastern Vilayets. European oversight and new administrative structures will be implemented, marking a significant diplomatic victory for St. Petersburg and a major concession from the Porte."
 ww1_armenian_reforms.5.a: "The agreement is signed."

