 RUS_authoritarian_zemstvo: "Authoritarian Zemstvo"
 RUS_authoritarian_zemstvo_desc: "Zemstvo is a local government institution, introduced in 1864 during the Great Reforms of Alexander II. In 1890, due to Alexander III's counterreforms, their authority was severely restricted, which makes it easier to control our population, but in turn slows down our economic development."
