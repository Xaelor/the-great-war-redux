 # State Duma and State Council
 RUS_parliament_title: "State Duma"
 RUS_parliament_desc: "The State Duma is one of the two parliaments of the Russian Empire, which typically acts as a lower house. Being elected indirectly, although still with popular vote, the system is designed to provide some degree of representation, while maintaining the constructive majority in the parliament.\n\n§YFaction§! seats are based on §Yparty popularities§! during an election.\nWe need at least §G222§! votes to §Gpass§! §Ylaws§!."
 RUS_parliament_desc2: "\nWe can count on [getRussianParliamentMajority]/442 MPs to vote for our proposals."

