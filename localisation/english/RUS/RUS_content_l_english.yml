 RUS_state_council_title: "State Council"
 RUS_state_council_gui_decision_category: "Russian Parliament"
 RUS_state_council_gui_desc: "The State Council is one of the two parliaments of the Russian Empire, which typically acts as the upper house. Half of its members is appointed by the Emperor himself, and thus we can influence which faction dominates it directly.\n\nTo pass legislation, we need to have §G100%§! of §YLaw Acceptance§! while maintaining a §Gmajority§! of §Yloyal Duma MPs§!. We can also shift the faction balance in the desired direction with £pol_power §HPolitical Power§!."
 law_acceptance_tt: "Law Acceptance: [law_acceptance_scripted_trigger]"
 loyal_mps_tt: "Loyal State Duma MPs: [getRussianParliamentMajority]/442"
 law_acceptance_tt_1: "§R[?law_acceptance_progress]%§!"
 law_acceptance_tt_2: "§G[?law_acceptance_progress]%§!"
 dominant_faction_tt: "Domimant Faction: [RUS_current_domimant_faction]"

 RUS_socialist_faction_name: "§RSocialists§!"
 RUS_socialist_faction_name_icon: "£RUS_parliament_party_icon|1 $RUS_socialist_faction_name$"
 RUS_socialist_faction_desc: "[RUS_current_socialist_faction_leader]§L£RUS_parliament_party_icon|1 §RSocialist faction§! of the State Duma encompasses members of various far left parties, such as the §RRussian Social Democratic Labour Party§!, the §RSocialist Revolutionary Party§! and the §RLabour Group§!, who believe that the social revolution is the only viable path to achieve systemic change. This faction considers the State Duma to be an instrument that would bring the revolution closer, and as such, it is opposed to any government and is uninterested in any sort of compromise, favouring obstruction over lawmaking."
 RUS_center_left_faction_name: "§CLiberals§!"
 RUS_center_left_faction_name_icon: "£RUS_parliament_party_icon|2 $RUS_center_left_faction_name$"
 RUS_center_left_faction_desc: "[RUS_current_center_left_faction_leader]§L£RUS_parliament_party_icon|2 §CLiberal faction§! of the State Duma encompasses members of various progressive and liberal parties, such as the §CConstitutional Democratic Party§!, the §CProgressive Party§!, as well as various local autonomist groups. This faction believes that no meaningful reform can be achieved as long as parliament's powers remain severely limited. As such, it advocates for immediate empowerment of the State Duma, generally remaining in opposition to any Prime Minister that doesn't commit themselves to the expansion of parliamentarism and constitutionalism, although allowing itself to make tactical alliances with the ruling government to undermine the £RUS_parliament_party_icon|4 §qRightist faction§!."
 RUS_center_right_faction_name: "§gCentrists§!"
 RUS_center_right_faction_name_icon: "£RUS_parliament_party_icon|3 $RUS_center_right_faction_name$"
 RUS_center_right_faction_desc: "[RUS_current_center_right_faction_leader]§L£RUS_parliament_party_icon|3 §gCentrist faction§! of the State Duma consists of members of the §gUnion of October 17§!. Like their £RUS_parliament_party_icon|2 §CLiberal§! counterparts, £RUS_parliament_party_icon|3 §gCentrists§! believe in the necessity of reform for Russia, however, akin to £RUS_parliament_party_icon|4 §qRightists§!, they believe in the strong government, not legally constrained by the parliament, because they see it as the only way to effectively achieve reform, which often makes them a target of criticism from both the left and the right. This faction strictly adheres to the framework of the 1906 Fundamental Laws, and strongly oppose anything they deem contradictory to it."
 RUS_far_right_faction_name: "§qRightists§!"
 RUS_far_right_faction_name_icon: "£RUS_parliament_party_icon|4 $RUS_far_right_faction_name$"
 RUS_far_right_faction_desc: "[RUS_current_far_right_faction_leader]§L£RUS_parliament_party_icon|4 §qRightist faction§! of the State Duma encompasses members of various far right parties, such as the §qUnion of the Russian People§!, the §qAll-Russian Dubrovin's Union of the Russian People§!, and the §qRussian People's Union of the Archangel Michael§!. Characterized by extreme antisemitism, monarchism and nationalism, this faction's main goals are to protect existing Emperor's prerogatives, subvert the existing democratic institutions, ensure the dominance of ethnic Russians in the Russian Empire, and to limit the "Jewish" influence, which they believe to have caused the 1905 Revolution. While they maintain their loyalty to the crown, Reactionaries are willing to oppose Prime Ministers who they see as too "liberal"."


