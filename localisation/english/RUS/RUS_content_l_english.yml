 # Ideas
 RUS_june_third_political_system_idea: "June Third Political System"
 RUS_june_third_political_system_idea_desc: "After the creation of the State Duma, due to the negligence of the government when designing the electoral law, a lot of revolutionary MPs got elected into it. In 1907, a new prime minister, Pyotr Stolypin, has dissolved the Second State Duma and introduced a new electoral law in violation of the Constitution, which lowered representation of peasants, which created a strong Center-Right majority in the parliament."
 RUS_june_third_with_liberal_characteristics_idea: "June Third with Liberal Characteristics"
 RUS_june_third_with_liberal_characteristics_idea_desc: ""
 RUS_kokovtsovs_political_system_idea: "Reconciled Differences"
 RUS_kokovtsovs_political_system_idea_desc: "After the creation of the State Duma, due to the negligence of the government when designing the electoral law, a lot of revolutionary MPs got elected into it. In 1907, a new prime minister, Pyotr Stolypin, has dissolved the Second State Duma and introduced a new electoral law in violation of the Constitution, which lowered representation of peasants, which created a strong Center-Right majority in the parliament."
 RUS_autocracy_in_all_but_name_idea: "Autocracy In All But Name"
 RUS_autocracy_in_all_but_name_idea_desc: "The opposition has managed to overcome internal conflicts and form a coalition to oppose the government. They demand the appointment of the cabinet consisted of people trusted by the people, to accelerate political reform, and free political prisoners."
 RUS_progressive_bloc_idea: "Progressive Bloc"
 RUS_progressive_bloc_idea_desc: "The opposition has managed to overcome internal conflicts and form a coalition to oppose the government. They demand the appointment of the cabinet consisted of people trusted by the people, to accelerate political reform, and free political prisoners."
 RUS_government_of_public_trust_idea: "Government of Public Trust"
 RUS_government_of_public_trust_idea_desc: ""
 RUS_agrarian_question: "Agrarian Question"
 RUS_agrarian_question_desc: "The emancipation of peasants in 1861 didn't fix every problem the peasantry had as a class - they still were made to buy out the land they were working on and were forced to participate in the Obshchina. If we want to grow our economy, we need a strong farmer class, which means we have to help the peasantry in their struggle."
 RUS_black_partition: "Black Partition"
 RUS_labour_question: "Labour Question"
 RUS_crippling_illiteracy: "Crippling Illiteracy"
 RUS_crippling_illiteracy_desc: "Due to the fact that the vast majority of the population were serfs, historically their education was overlooked. Now, Russia falls behind every major country in terms of illiteracy, which affects every part of our country and economy. We have to create a better education for our people if we want to be successful as a nation."
