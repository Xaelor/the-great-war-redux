 TUR_millet_system_gui_tt: "§YMillet System§!"
 TUR_millet_system_gui_tt_desc: "Under the §Ymillet system§!, different §Yminorities§! of the Ottoman Empire are allowed to rule themselves autonomously according to their religious laws, harming §Y£national_unity_texticon centalization§! of the state.\n\nHover over a §Yminority§! button to track §Yrelations§! with it, or click it to see §Yvilayets§! with its population and §Ydecisions§! related to it."
