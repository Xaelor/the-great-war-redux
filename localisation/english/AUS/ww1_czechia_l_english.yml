 ww1_czechoslovakia.17.d: "In Outer Bohemian regions, there is like a lot of people that don't like our government even though we're still part of the Austrian government. They're kind of dumb but they are resisting us. Not very good!"
 ww1_czechoslovakia.18.t: "[CZE.GetName] Requests Investments"
 ww1_czechoslovakia.18.d: "The Bohemians have requested an investment in the country to further help their development efforts."
 ww1_czechoslovakia.18.a: "We shall invest"
 ww1_czechoslovakia.18.b: "The Bohemian Market is too volatile"
 ww1_czechoslovakia.19.t: "Austria accepts to invest"
 ww1_czechoslovakia.19.d: "They have decided to invest because they are so nice and kind."
 ww1_czechoslovakia.19.a: "Thank You [AUS.GetLeader]"
 decision_available_in_365_days: "The decision will be available again in 365 days. Each failed investment demand leads to a greater chance at Austria accepting."
 ww1_czechoslovakia.20.t: "Austria refuses investment"
 ww1_czechoslovakia.20.d: "The bureaucrats in Vienna have not sent their best delegation to our meeting today. They are total losers, completely low-energy. These \"Dumocrats\" at Austria Corp just said NO to investing in our beautiful, glorious nation of Bohemia. Can you believe it? Unbelievable. We have the best factories, the greatest workers, the most beautiful industries you've ever seen. Everybody is saying it. \n\nBut right now, our great people: the fantastic patriots in the urban Czech cities and the incredible, hard-working, rural folk out in Moravia; they are very, very upset. They are angry because we are currently economically dependent on Vienna. Open the straights... to the bank account! It's a rigged system, folks. A total puppet economy. We are making Austria rich, and what do we get? Nothing! They are laughing at us behind our backs, but we are going to stop the laughter, believe me. Make Bohemia great again."
 ww1_czechoslovakia.20.a: "Proposterous."
