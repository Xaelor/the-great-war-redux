AUS_minorities_roms: "§YRomanians§!"
AUS_minorities_roms_delay_tt: "§LThe §!§YRomanians§!§L constitute a substantial population in the eastern lands of the Crown of St. Stephen, particularly in §YTransylvania§!. They do maintain a distinct cultural and ecclesiastical life, supported by a growing intelligentsia. Under the policies of Magyarization, their language and schools face a certain pressure, yet a national movement continues to press for equal rights and recognition within the [HUN.GetName], while developments in the neighboring independant [ROM.GetName] are followed with keen interest.§!"


