AUS_force_through_the_bohemian_octroi: "Force Through the Bohemian Octroi"
AUS_force_through_the_bohemian_octroi_desc: "The Deutscher Nationalverband and other German nationalist factions have been long pushing for an octroi in Bohemia to demarcate linguistic areas, of course favouring the Germans. The Czechs strongly oppose it, but if the government wishes to keep the support of the German nationalists it must be pushed through, and the Czech anger dealt with later."
