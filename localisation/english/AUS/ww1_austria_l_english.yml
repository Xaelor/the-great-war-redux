AUS_forts_for_equipment_tt: "Unlocks decision: £decision_icon_small §YDismantle (State) Forts for Equipment§!"
AUS_suspend_civil_liberties: "Cede Political Influence to the Military"
AUS_thousand_year_reich: "Austriae Est Imperare Orbi Universo"
AUS_thousand_year_reich_desc: "... is a term coined by Frederick III, discovered in around 1666 which signifies 'All the world is subject to Austria'."
AUS_outlaw_hindering_of_war_effort: "Outlaw Hindering of the War Effort"
AUS_defeat_serbia_early: "Crush the Serbs"
AUS_expand_the_civilian_administration: "Expand the Civilian Bureaucracy"
AUS_abandon_jury_trials: "Suspend Jury Trials"
AUS_abandon_jury_trials_desc: "The principle of a jury at a trial is dangerous to our war effort. A jury can nullify punishments for traitors, which can end up being disastrous for morale.\nOrder No. 228 will solve this issue by suspending jury trials for the duration of eleven months."
AUS_abandon_jury_trials_tt: "After 11 months from completing this focus:\n"
AUS_suspended_jury_trials_ns: "Suspended Jury Trials"
AUS_suspended_jury_trials_ns_desc: "In a time of war, jury trials can lead to unforeseen consequences to the nation's morale."
AUS_extend_the_suspension_of_jury_trials: "Extend the Suspension of Jury Trials"
AUS_establish_landwehr_tribunals: "Military Control of the Courts"
AUS_establish_landwehr_tribunals_desc: "The Landwehr needs to take control over the prosecution of murder, manslaughter, robbery, and arson in order to improve national security."
AUS_landwehr_tribunals_ns: "Landwehr Tribunals"
AUS_the_siege_mentality: "Siege Mentality"
AUS_circular_firing_squad: "The Circular Firing Squad"
AUS_king_intervention: "The emperor's Intervention"
AUS_radio_to_squash_discontent: "Radio Propaganda"
AUS_radio_to_squash_discontent_desc: ""
AUS_immediate_proactivity: "Immediate Proactivity"
AUS_centralize_governance_in_vienna: "Centralize Governance in Vienna"
AUS_mp_is_neutral2: "The §YMinister-President§! spot will become §gNon-Partisan§! All focuses relating to the §YMinister-President§! will be locked."
AUS_mp_is_neutral: "The §YMinister-President§! spot will become §gvoid.§! All focuses relating to the §YMinister-President§! will be locked."
AUS_root_out_red_traitors: "Root Out Red Traitors"
AUS_tackle_galician_poverty_desc: "Galicia has a very high poverty rate compared to the rest of the empire, which has resulted in deep resentment from the peoples living there, while also trapping the region into a stagnant economy. By investing in the region, we can hopefully plant the seeds for future economic growth in Galicia while winning the hearts and minds of the people."
AUS_investing_in_galacia: "Already investing in Galicia"
AUS_state_of_the_realm: "Ausgleich Political System"
AUS_state_of_the_realm_desc: "The Habsburg crown binds together a vast multilingual patchwork of provinces and local autonomies, all with competing parliaments, separatists, and social unrest. While through gradual reforms we can hopefully maintain a stable and prosperous empire, a national crisis could lead to the empire completely dismantling."
AUS_economic_patchwork: "Economic Patchwork"
AUS_italian_university_desc: "Despite the best efforts from Italian irredentists and propaganda, Italian immigrants in our empire have often been described as the Küstenland's most loyal minority group. Although generally content with Habsburg rule, one thing causing grievances to local Italians is our refusal to permit construction of an Italian university in our territories. Doing so would be an easy way to gain more support from Italian locals in our empire."
AUS_economic_patchwork_desc: "The economy of [AUS.GetNameDef] is a jumbled quilt with prosperous cities and crime-ridden slums. The economy may be stable, but it is very unequal, which has caused resentment amongst many."
AUS_max_wladimir_von_beck: "Max Wladimir von Beck"
AUS_max_wladimir_von_beck_desc: "Max Wladimir von Beck is the son of Anton von Beck, the director of the court printing office. Born on the 21st of January 1854, he built a distinguished career in the civil service. He is widely respected for his brilliant, progressive mind and served as our Minister-President from 1906 until his cabinet fell in 1908. His greatest legacy remains the historic introduction of universal male suffrage, which he masterfully steered into law."
AUS_richard_von_bienerth_schmerling: "Baron Richard von Bienerth"
AUS_richard_von_bienerth_schmerling_desc: "Richard von Bienerth is the son of Lieutenant-Field Marshal Karl von Bienerth. He was born on the 2nd of March 1863 and he worked in the Austrian government since 1884. He was appointed Minister-President by Emperor Franz Joseph I in 1908 after Max Wladimir von Beck's cabinet fell apart."
AUS_heinrich_lammasch: "Heinrich Lammasch"
AUS_heinrich_lammasch_desc: "Heinrich Lammasch was born on the 21st of May 1853 and is one of the empire's most celebrated legal minds. A renowned professor of criminal and international law at the University of Vienna, he has represented Austria with immense pride at the international peace conferences in The Hague. He is a prominent member of the House of Lords and a trusted advisor to Archduke Franz Ferdinand, known across Europe for his dedication to international arbitration and peace."
AUH_defunct_reichsrat: "Defunct Legislature"
AUS_loosen_slav_policy: "Loosen Policy on Slavs"
AUS_ernest_von_koerber: "Ernest von Koerber"
AUS_ernest_von_koerber_desc: "Ernest von Koerber was born on the 6th of November 1850 into a family of prominent civil servants. He entered government service in 1874 and achieved great renown as our Minister-President from 1900 to 1904. His tenure was defined by an ambitious program of economic development, canal building, and infrastructure investments aimed at uniting our fractured nationalities through shared economic prosperity. Though he left office years ago, he remains a giant of Austrian political life."
AUS_relative_harmony: "An Empire in Relative Harmony"
AUS_reject_radicals: "Reject Radicalism"
AUS_quell_political_violence_in_south: "Quell Political Violence in Bosnia"
AUS_ferdinand_v_imperial_court: "Franz Ferdinand vs. the Imperial Court"
AUS_ferdinand_v_imperial_court_desc: "Franz Ferdinand's Wife, Sophie Chotek, is beloved by the former but many hold grudges and hatred towards her. This sentiment stems back from when the pair got married in 1900, where the Austrian elites told Ferdinand that Sophie could not become Empress consort if Franz Joseph were to die, as the Chotek family was not a high enough rank in noble elite society to do so, even though Ferdinand and Sophie are related, though love and blood. Sophie was and is victim of mistreatment by the Imperial Courts of Austria.\nNow, over 10 years later, it is time to fix Sophie's public image. There are rumors that Franz Joseph is ill, and Ferdinand could soon be the next to ascend the throne of the Austrian realm. It's time for Ferdinand and Sophie to take in their hands of what the future offers them."
