AUS_allow_volatile_growth: "Accept Volatile Growth"
AUS_allow_volatile_growth_desc: "Our economy has been stagnating for years due to the influence of the cartels on almost all aspects of it, now without their difference there can be true competition, growth and progress, this will allow us to rapidly increase our industrial base."
