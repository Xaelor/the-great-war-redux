ww1_austriahungary.187.t: "Army Budget Approvals Require Parliaments Consent"
ww1_austriahungary.187.d: "Although not a major thing, periodically a law is needed to address something like a fort in need of modernization, a snall grant for an arms factory, or an approval to spend a slight amount of funds to buy a few hundred more guns or pieces of artillery. Once again, the army is attempting to interrupt one of our sessions with their demands for laws to address issues in the army. These laws do add up and take away political capital and funds from laws we wish to see passed, and we could do something that may be seen as radical: block them. If we block these laws, we can ensure parliamenary sessions are focused on our agenda and not the military's agenda. We can also ensure our budget remains healthy, as its already straining under our expansion of public services. Blocking these laws however will enrage the military, and may make the emperor see us as a threat to Austria's national security."
ww1_austriahungary.187.a: "Who gives a damn if a fort lacks a beds? Block these laws and focus on the peoples welfare!"
ww1_austriahungary.187.b: "They're not asking for anything dramatic, this isn't a fight worth having. Let it go through"
