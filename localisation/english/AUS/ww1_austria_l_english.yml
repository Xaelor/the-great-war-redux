ww1_austriahungary.221.t: "Polish Authoritarian Government in Galicia"
AUS_polish_domination_of_galicia: "Polish Domination of Galicia"
ww1_austriahungary.221.d: "The situation in the Galicia diet is completely unfixable due to the radical uncompromising Ruthenians and Jews who have organized their members in the Galician diet to ensure the legislative body serves as nothing but a tool for them to vent their frustrations. This, combined with the general rise in protests by Ruthenians which are threatening the stability in the region mean that we must, as suggested by our Polish political allies, crackdown on Galicia.\n\nThe suspension of the Galician Diet indefinitely has been enacted by a decree endorsed by the emperor. Galicias government will instead be overseen by a Polish body. In addition, the police, also dominated by Poles, are being given the complete freedom to ensure stability of the region."
ww1_austriahungary.221.a: "And thus Galicia is in the grasps of our allies"
