ww1_austriahungary.254.t: "Austrians send us support"
ww1_austriahungary.254.d: "The Austrians have chosen to give us their support in our fight against the revolutionaries. This could be the start of a new friendship."
ww1_austriahungary.254.a: "Nice!"
ww1_austriahungary.255.t: "Austrians send us weapons"
ww1_austriahungary.255.d: "The Austrians have send us guns. This will help us against the revolutionaries."
ww1_austriahungary.255.a: "Thank you, come again"
ww1_austriahungary.256.t: "Austrians Offer Loans"
ww1_austriahungary.256.d: "The Austrians have offered us a loan, we can profit alot from it right now but we will have to pay it back later."
ww1_austriahungary.256.a: "I need money"
ww1_austriahungary.256.b: "I do not want to pay debt"
ww1_austriahungary.257.t: "Austria takes the North"
ww1_austriahungary.257.d: "Austria has moved its units into Lombardy and Veneto under the guise of 'peacekeeping'. We see it for what it actually is, a blatant sign of imperialism."
ww1_austriahungary.257.a: "We will take it back someday"
ww1_austriahungary.258.t: "Seperatists organise themselves in north"
ww1_austriahungary.258.d: "Italian nationalists and socialists in the regions we administer have called for a truce to deal with us. We cannot properly integrate the people if there are terrorists running around attacking Austrian troops and calling for a revolt."
ww1_austriahungary.258.a: "Anybody can get it, the hard part is keepin' it"
ww1_austriahungary.259.t: "Austria invites us to their alliance"
ww1_austriahungary.259.d: "The Austrians, after helping us in the Italian civil war, invite us to our faction, they want to secure their borders against socialist revolutions."
ww1_austriahungary.259.a: "We accept"
ww1_austriahungary.259.b: "Did they forget about the Great War?"
ww1_austriahungary.260.t: "Italy accepts our proposal"
ww1_austriahungary.260.d: "Italy has accepted our proposal to join our alliance."
ww1_austriahungary.260.a: "Yay"
ww1_austriahungary.261.t: "Italy rejects our proposal"
ww1_austriahungary.261.d: "Italy has rejected our proposal to join our alliance."
ww1_austriahungary.261.a: "Sad"
ww1_austriahungary.265.t: "Question of Ukraine"
ww1_austriahungary.265.d: "At the start of the war, we agreed to give Austria control of Ukraine. Now that we have finnaly reached the point where we occupy Ukraine, we have the choice between handing them what we agreed to or holding it for ourselves. Denying Austria their claims will anger their politicians."
ww1_austriahungary.265.a: "We are honorable"
ww1_austriahungary.265.b: "Austria can't hold this land"
ww1_austriahungary.266.t: "Germany gives us control of Ukraine"
ww1_austriahungary.266.d: "Germany has respected our claims by giving us control of Ukraine. At the start of the war we agreed that Ukraine can be under our sphere of influence while the rest of east Europe can be under the German sphere of influence. While Ukraine does have their own elected government, we can overthrow them and install a more preferable leader."
ww1_austriahungary.266.a: "Great"
ww1_austriahungary.267.t: "Germany refuses to give us Ukraine"
ww1_austriahungary.267.d: "Germany has refused to give us control of Ukraine, land they promised us at the start of the war. Our representatives have tried to convince the Germans but they are incredibly stubborn, citing our weakness as the reason for their rejection."
ww1_austriahungary.267.a: "Great allies"
ww1_austriahungary.268.t: "Austria coups us"
ww1_austriahungary.268.d: "Austra does not trust us enough and has taken measures to get rid of the Ukrainian rada. Archduke Wilhelm of Austria has forcefully taken control and declared himself king of Ukraine. The archduke has a big supporter base due to his pro Ukrainian policies and allowing Ukrainian nationalists to do their thing."
ww1_austriahungary.268.a: "All hail Wilhelm"
ww1_austriahungary.277.t: "Austro-Ukrainian Friendship"
ww1_austriahungary.277.d: "Ever since the Great War, Ukrainians and Austrians had a mutual affection of each other. Austrians helped the Ukrainians become indenpendent while Ukrainians fought in the Austrian army. The Ukrainians are very thankfull for our help and our friendship has never been closer."
ww1_austriahungary.277.a: "Nice!"
ww1_austriahungary.281.t: "Austria offers us protection"
ww1_austriahungary.281.d: "Austria has offered us protection but only on one condition. That condition being they have a say in government decisions and can control the direction of our country. It will save us from the horrors of this war but we will lose our indenpendence."
ww1_austriahungary.281.a: "Better Austrian than Rusian"
ww1_austriahungary.281.b: "We will keep our indenpendence"
ww1_austriahungary.282.t: "Don accepts our proposal"
ww1_austriahungary.282.d: "The Don Host has chosen to accept our proposal, prefering survival over death."
ww1_austriahungary.282.a: "Smart choice"
ww1_austriahungary.283.t: "Don rejects our proposal"
ww1_austriahungary.283.d: "The Don Host has chosen to reject our proposal, prefering death over survival."
ww1_austriahungary.283.a: "Sad"
ww1_austriahungary.284.t: "Question of White Armies"
ww1_austriahungary.284.d: "Our advisors have identified 2 White Army factions that we can support in their war against the Communists. The first faction is the North Western Army, an army supported by Germany and located in the North west. The second faction is the Southern Armed Forces or Volunteer Army, they are located in the Caucacus. Both factions are good choices but the Volunteer corps is stronger."
ww1_austriahungary.284.a: "Support the [NWA.Getname]"
ww1_austriahungary.284.b: "Support the [SRA.Getname]"
ww1_austriahungary.285.t: "Austria requests Wallachia"
ww1_austriahungary.285.d: "The Austrians have requested if they can take over the occupation of Wallachia as it is closer to them and thus will be easier."
ww1_austriahungary.285.a: "Sure thing"
ww1_austriahungary.285.b: "No."
ww1_austriahungary.286.t: "Fate of Serbia"
ww1_austriahungary.286.d: "We have finnaly defeated the annoying little country under us. Now it's up to us what their fate shall be. The Kaiser shall make plans to reorganise the country."
ww1_austriahungary.286.a: "Their fate is..."

