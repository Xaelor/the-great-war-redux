AUS_minorities_south_slavs_tt: "[CRO.GetFlag] §YCroat-Slovenian§! loyalty to us: [?AUS_croat_loyalty|+0]\n[SER.GetFlag] §YSerbian§! loyalty to us: [?AUS_serb_loyalty|+0]\nThe current §Cminimum§! loyalty for [CRO.GetFlag] §YCroats§! is [?AUS_cro_min_loyalty|Y0]\n§LCurrent modifiers:§! [AUS_generic_fragile_peace]   \nThe current §Cmaximum§! loyalty for [CRO.GetFlag] §YCroats§! is [?AUS_cro_max_loyalty|Y0]\n§LCurrent modifiers:§! [AUS_centralization_from_vienna_focus] \n-------------------------------\nThe current §Cminimum§! loyalty for [SER.GetFlag] §YSerbs§! is [?AUS_ser_min_loyalty|Y0]\n§LCurrent modifiers:§! [AUS_generic_fragile_peace]   \nThe current §Cmaximum§! loyalty for [SER.GetFlag] §YSerbs§! is [?AUS_ser_max_loyalty|Y0]\n§LCurrent modifiers:§! [AUS_centralization_from_vienna_focus]"
AUS_minorities_south_slavs: "§YSouth Slavs§!"
AUS_minorities_south_slavs_delay_tt: "§LThe §!§YSouthern Slavs§!§L within the Monarchy consists of §YSerbs§! and §YCroats§!, divided between the lands of §YCroatia-Slavonia§!, §YDalmatia§!, §YBosnia§! and the southern Hungarian parts. The Croats possess a measure of autonomy through the Croatian-Slavonian Sabor, yet remain chained to Budapest in key affairs. The Serbs maintain strong cultural institutions. Both groups are stirred by a wider idea of 'liberation', which calls for greater unity among their peoples, a question that weighs heavily upon relations with neighboring and independant Serbia and the stability of the Vienna-led Empire itself. Both live in Bosnia and are cause for much ethnic tension there and here.§!"
