AUS_invest_in_the_east: "Invest in the East"
AUS_invest_in_the_east_desc: "Using funds from other parts of the empire, we can establish loyalty in Ukrainian and Polish states by investing into their economic bases, such as Lemberg and Krakau."
AUS_take_180: "This decision will take §Y180§! days"
AUS_take_365: "This decision will take §Y365§! days"
