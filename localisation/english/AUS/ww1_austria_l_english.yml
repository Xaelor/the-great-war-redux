ww1_austriahungary.222.c: "With parliament unwilling to act, could we enlist the help of the Emperor?"
ww1_austriahungary.224.t: "Addressing Grievances Over Spending"
ww1_austriahungary.224.d: "One major issue the Czechs have with their current situation is that despite being arguably the most industrialized and modernized part of the empire, bringing in the most revenue and GDP, Czechia often doesn't recieve a very proportional slice of the cake where national spending is concerned. It's historically lead to the Czech diet being extremely resistant to any sort of tax increases and its fostered resentment amongst the Czechs. We need to address their complaints to secure Czech loyalty."
ww1_austriahungary.224.a: "Pledge reforms"
ww1_austriahungary.224.b: "Refuse changes"
AUS_you_can_do_it_narrowly: "§LYes, narrowly, thanks to the collapse of the Deutscher Nationalverband allowing for enough liberals and progressives to combine with pro-reform forces. It will however take immense political capital.§!"
AUS_the_king_will_article_14: "§LThe emperor will allow us to utilize an §YArticle 14§! decree to force the reform through anyways. It will anger parties in our coalition.§!"
AUS_the_german_nationalists_are_united: "§LCompleting the focus Split the Deutscher Nationalverband would change the effects of this event option§!\nThe §mDeutscher§! §NNationalverband§! is §Runited in opposition§! to this, and will obstruct our government over this. To mantain a coalition with a majority able to pass through legislation in the Imperial Council, we'd have to bring in support from the §lSozialdemokratische§! §SArbeiterpartei§!, which would force a §Ymassive§! change in our approach to governance"
AUS_local_parties: "§nLocal Parties§!"
ww1_austriahungary.223.t: "Working With the SDAPO?"
ww1_austriahungary.223.d: "If we're really gping to burn the bridge with the nationalists over the Czech language issue, we need new allies in parliament. If we don't, the Imperial Council will turn into an obstructionist mess which would surely lead to the King replacing us with someone like Sturgkh to control it. Despite our initial goal of explicitly uniting a coalition behind the idea of opposing the SDAPO, the SDAPO is the only party large enough to offset the loss of the nationalists. Although the most radical in the SDAPO must be isolated, some of the more reasonable members of the party (however 'reasonable' a socialist can be), should be people we can form a government with.\n\nAllying the SDAPO will radically shift the politics of Austria. Conservatives in our coalition are going to be outraged, although we could convince most of our right wing allies to stay by promising that this coalition will 'tame' the SDAPO by causing friction between the radicals which will weaken the party in the long run. It would also encourage moderation in general if we reward it with a chance at governance, and by implementing some of their most popular policies, we could reduce the need for pepole to vote for socialist parties in general.\n\nThe SDAPO will also come with their own demands for a coalition, some that may be hard to swallow. We'd have to push for serious reforms protecting labor and expanding workers rights, probably curtail re-armament initives, and attempt to further democratize the state in all aspects. Are we really going to do this?"
AUS_what_the_sdapo_does: "We will be forced to immediately revert some of our most antagonistic policies towards the §lSozialdemokratische§! §SArbeiterpartei.§!"
ww1_austriahungary.223.a: "Yes, we are"
ww1_austriahungary.223.b: "Surely there's another way"
AUS_imperial_council_ideology_tt: "The Imperial Council\nis led by the\n[AUS_GetImperialCouncilIdeologyShort]"
AUS_imperial_council_ideology_tt_2: "The Imperial Council is led by the [AUS_GetImperialCouncilIdeologyShort]"
AUS_mp_autocrat_desc_tt: "Currently, the §YMinister-President of Cisleithania§! is an §qAutocrat§!.\n§LAutocratic Minister-Presidents can work alongside conservative Imperial Councils in relative peace, yet will struggle heavily to work with liberals, nationalists, and social democrats. Generally, Autocrats will have poor relations with the Imperial Council and should work towards reducing the Imperial Council's powers as much as possible.§!"
AUS_mp_reformist_desc_tt: "Currently, the §YMinister-President of Cisleithania§! is a §CReformist§!.\n§LReformist Minister-Presidents may somewhat struggle to work alongside conservative Imperial Councils, but will have an easier time working with Liberals and Social Democrats. Reformist Minister-Presidents will only seek to override democracy in very extreme occasions, meaning it's best for reformist Minister-Presidents to try and maintain a working relationship with the Imperial Council.§!"
AUS_minister_president_desc_tt: "[AUS_GetMinisterIdeologyDescs]"
AUS_ic_conservatives_tt: "§LThe Christlichsoziale Partei, or the Christian Social Party, has led the Imperial Council for most of its history. It's made up of both moderate conservatives and staunch monarchists, who generally oppose reforms that will weaken the empire's power.§!"
AUS_ic_liberals_tt: "§LThe Deutscher Nationalverband, or the German National Association, is a collection of liberal and nationalist groups in Bohemia and Austria. Its members generally agree that reform is needed in the empire, with the party pushing for a comprehensive solution to solve Bohemian-German tensions.§!"
AUS_ic_social_dem_tt: "§LThe Sozialdemokratische Arbeiterpartei is a democratic socialist group that, combined with social democrat parties in different regions of Cisleithania, has finally reached a majority in parliament. The social democrats support new vast welfare programs and are divided on how to handle ethnic minorities in the empire.§!"
AUS_ic_party_desc_tt: "[AUS_GetImperialCouncilIdeologyDesc]"
