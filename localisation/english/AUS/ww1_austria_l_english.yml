ww1_austriahungary_war.69.t: "Preservation of Austria-Hungary Losing Support"
ww1_austriahungary_war.69.d: "For the past decades, the idea of the dissolution of Austria Hungary has been unthinkable. In the past even the most radical of the minorities, outside the south slavic areas, were usually advocates for extensive autonomy within the empire, and those who wanted to fully leave the monarchy wern't taken seriously. Now, with rising ideas of self determination, support from much of our enemies in the international community, and the detoriating life of civilians due to shortages from the war, the idea of seperate states is gaining support. If we can't prove our victories on the battle field, minorities within the empire might look for a way to fully exit it."
ww1_austriahungary_war.69.a: "They'd never survive on their own!"
AUS_civ_pop_limit: "The civilian population is reaching a §Rbreaking point§! and this news won't be taken well"
