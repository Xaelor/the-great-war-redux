AUS_fortwursteln_desc: "A long six decades of rule has left the aging Franz Joseph tired, and perhaps not as proactive as he used to be. Still, the empire needs his service now more than ever, and, as some Austrians like to say, he's 'fortwursteln'—meddling along somehow."
AUS_polish_baku: "Support the Galician Oil Industry"
AUS_polish_baku_desc: "Recently, the Galician oil industry has been in decline after expanding rapidly and reaching its peak in 1909. Something must be done about this decline, as many people in the already impoverished Galicia rely on this industry, and we must not fall behind other nations in the production of this critical resource."
AUS_rachet_on_bosnia: "Ratchet on the Slavs"
AUS_rachet_on_bosnia_desc: "The Slavs have always been the most rebellious minority in our empire, and the recent assassination attempt on Bosnia's governor highlights this fact. We must increase security in the region to stop these terrorists."
AUS_mp_austria_now_autocrat: "The next §YMinister-President of Cisleithania§! will be an §qAutocrat§!"
AUS_mp_austria_now_reformist: "The next §YMinister-President of Cisleithania§! will be a §CReformist§!"
AUS_this_might_be_complicated.tt: "The formula calculating the days for the mission §YAdministrative Sabotage in Southern Regions§! will change from:\n(30 + [SER.GetFlag]§YSerbian Loyalty§! + [CRO.GetFlag]§YCroat-Slovenian Loyalty§!)\nto now be:\n(30 + [SER.GetFlag]§YSerbian Loyalty§! + [CRO.GetFlag]§YCroat-Slovenian Loyalty§! x §Y1.5§!)\nEffective change: [?AUS_if_multiply_by_1] days --> [?AUS_if_multiply_by_1point5] days"
