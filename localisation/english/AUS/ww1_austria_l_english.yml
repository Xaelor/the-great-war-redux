AUS_spitzmuller_is_making_cabinet: "§YAlexander Spitzmüller§! will begin putting together a cabinet."
ww1_austriahungary.250.t: "Karl Tasks Spitzmüller with Forming a Cabinet"
ww1_austriahungary.250.d: "Kaiser Karl has approached Spitzmüller and asked him about forming a new cabinet, Spitzmüller initially declined as he opposed renewal of the Ausgleich by decree, Karl was swayed by his arguments and asked him again, they discussed the potential tasks of the government and Spitzmüller's opposition to the octroi in Bohemia and Spitzmüller agreed to begin forming a cabinet."
ww1_austriahungary.250.a: "Great!"
ww1_austriahungary.251.t: "Spitzmüller Losing Confidence"
ww1_austriahungary.251.d: "Spitzmüller has been losing confidence in forming a cabinet realising the opposition he will face, such as from diplomat Czernin and wished to not form a cabinet anymore and instead serve as finance minister in another government. Karl informed him that he planned to have Czernin serve as foreign minister and asked Spitzmüller to form a cabinet again, although he declined due to his dismay."
ww1_austriahungary.251.a: "Maybe Clam can be appointed?"
ww1_austriahungary.251.b: "Spitzmüller must form a cabinet."
ww1_austriahungary.252.t: "Appointing Heinrich Clam-Martinic"
ww1_austriahungary.252.d: "Karl suggested to Spitzmüller that Heinrich Clam-Martinic be appointed to form a cabinet, Spitzmüller supported Karl and Clam was informed of his appointment and agreed. Clam successfully formed a cabinet quickly and has backing behind him within the Christian Socialists and Deutscher Nationalverband as he supports the implementation of the octroi in Bohemia."
ww1_austriahungary.252.a: "Great!"
ww1_austriahungary.253.t: "The Fall of Clam"
ww1_austriahungary.253.d: ""
ww1_austriahungary.253.a: ""
ww1_austriahungary.263.t: "Preparing the Reichsrat Reopening"
ww1_austriahungary.263.d: "Karl is now planning for the reopening of the Imperial Council, however, with it being closed the building was converted into a temporary military hospital due to the war. Before the Imperial Council can be reopened there is a lot of work to be done clearing out the makeshift hospital and setting it up for government activiites."
ww1_austriahungary.263.a: "Let's get to work!"
ww1_austriahungary.264.t: "Minorities Criticise Government in Reichsrat Reopening"
ww1_austriahungary.264.d: ""
ww1_austriahungary.264.a: "Can they not wait until this is all over?"

