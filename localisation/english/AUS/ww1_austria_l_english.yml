ww1_austriahungary_war.78.d: "A collection of different government agencies, the military, and independent organizations are coming together in an unprecedented collaborative effort. We're working with friendly women organizations to encourage people to support and provide aid for the troops. Friendly peace organizations are being converted into pro war organizations as they call for a truce between the peace movement and the government in this crucial hour. Friendly Social Democrat and labor groups are being mobilized to ensure workers support the war effort. Big business is being mobilized as their industries are repurposed for war time industry. This mass collaborative project combined with the interworkings of a massively expanded and empowered civilian government are creating a machine that is strengthening all parts of the war effort."
ww1_austriahungary_war.78.a: "Everyone has a part to play"
