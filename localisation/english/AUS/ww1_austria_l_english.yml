ww1_austriahungary.97.t: "Russia Refuses to Help"
ww1_austriahungary.97.d: "Our appeals to Russia for assistance in kicking Austria out of Taslica have been met with refusal from the Russians. They claim that this issue would risk war with Austria, which Russia is not ready for. With Russia's refusal to help us, we must backdown."
ww1_austriahungary.97.a: "Who needs enemies with friends like these!"
ww1_austriahungary.100.t: "Austria Backs Down"
ww1_austriahungary.100.d: "Fearing our might, Austria has immediately given up their illegal seizure of Taslica. Their troops have left the province, handing it over to its rightful owners."
ww1_austriahungary.100.a: "Phew!"
ww1_austriahungary.146.t: "The Question of the Bukovina Census" 
ww1_austriahungary.147.t: "Rise of Die Fackel"
ww1_austriahungary.147.d: "Die Fackel, a anti-corruption and anti-war news paper, is seeing a soar in popularity recently. It comes as our conservative government continues to be perceived as corrupt, old, and war mongering amongst a large swath of the population. Although the paper is mostly harmless satirical fun, it is seriously inspiring anti-governmental actions amongst the population, such as protests and even sabotage."
ww1_austriahungary.147.a: "A bit worrying"
ww1_austriahungary.146.d: "As a part of our local governmental reforms, the census system in Bukovina has been brought up as a potential piece of reform. Currently, the people in charge of taking the census in Bukovina look at citizens family history to identify which recognized ethnic group they belong in, instead of simply allowing citizens to identify themselves. This isn't how the census works in much of the country, and it's built resentment amongst the local populations in Bukovina. Should we change the current system?"
ww1_austriahungary.146.a: "Let's implement personal autonomy"
ww1_austriahungary.146.b: "No need to change this, the experts know best"
ww1_austriahungary.105.t: "Russia Backs Down Last Minute"
ww1_austriahungary.105.d: "The threat of war with Germany has spooked Russia into backing down last minute, ordering us to simply accept Austria's occupation of our rightful land. With little chance at beating both Austria and Germany all by ourselves, we have no choice but to follow their advice"
ww1_austriahungary.105.a: "Pathetic!"
ww1_austriahungary.189.t: "Desná Dam Collapses"
ww1_austriahungary.189.d: "The Desna Dam, known locally as 'Burst Dam' by locals, has burst less than one year after its construction finished. This morning, log workers of the dam noticed the water leaking and tried to empty the reservoir, but the flow rate kept increasing when it burst at 16:15 local time, killing 65 people. A last-minute warning was sent out 15 minutes in advance, which was not enough time to escape the flooding that would ensue. After hearing about the dam collapse, Karel Podhajský, the senior state supervisor of the dam's construction committed suicide via bullet. It is not known what caused the dam collapse, although it might be linked to poor construction or geological instabilities."
ww1_austriahungary.189.a: "A tragedy"
ww1_austriahungary.106.t: "Russia and Serbia Give Up"
ww1_austriahungary.106.d: "The threat of the wrath of the entire triple alliance has forced Russia and Serbia to withdraw their ultimatum for an Austrian withdraw from Taslica. It seems our might has prevailed."
ww1_austriahungary.106.a: "Glad they saw reason"
ww1_austriahungary.169.t: "Anti-Cartel Protests Continue"
ww1_austriahungary.169.d: "Anti-Cartels are still ongoing rampant in our streets. The cartels and their partner businesses have demanded us to deal with the protestors in one way or another."
ww1_austriahungary.169.a: "Get off our streets!"
ww1_austriahungary.164.t: "Flour Prices Causes Unrest"
ww1_austriahungary.164.d: "The cost of living in Vienna has become a breaking point. The price of flour was slowly growing while wages stayed the same and were even shrinking; the meat had migrated from the plates of the laborers to the domain of luxury and the bread, once the appetizer of the working man's diet, has now become thin, scarce, and cost dearly. Balancing the needs of industry and land would soon find that the scales would tip. And the cartels are asking us to tip the scale in their side by crushing the rioters."
ww1_austriahungary.185.t: "Assassination of [AUS_GetMinisterPresident]"
ww1_austriahungary.185.d: "Today, the Minister-President of Cisleithania, [AUS_GetMinisterPresident] was assassinated by socialist politician Friedrich Adler, son of Viktor Adler, who founded the Sozialdemokratische Arbeiterpartei\nAs a socialist journalist, Friedrich contented himself by writing for the Volksrecht newspaper in Zurich and was even considered being appointed to Chair of the Physics Department instead of Einstein. He later became an Austromarxist and was against war, which is one of his reasons for murdering the war-supporting Minister-President." #self note daggie add more here
ww1_austriahungary.185.a: "Disaster!"
ww1_austriahungary.142.t: "Czechs Intesify Opposition to Government"
ww1_austriahungary.142.d: "As it becomes clear our government has no intentions of serious reforms to the Czech question, Czechs in parliament are ramping up their obstruction. In the Bohemian diet, they're beginning try and make their own moves, passing reforms under questionable legal precedent. We need to stop them, somehow."
ww1_austriahungary.142.a: "They're assholes!"
ww1_austriahungary.164.a: "Why are we still talking about inflation?"
ww1_austriahungary.165.t: "Rent Hikes Scare the Population"
ww1_austriahungary.165.d: "Recent rent price surges due to the spiraling economy has caused unrest in the streets of major cities like Vienna and Prague, and even many minor cities. The cartels have once again asked us to step in and stop these rioters once and for all."
ww1_austriahungary.165.a: "Affordability is their favorite word..."
ww1_austriahungary.166.t: "Women's Role in Unrest"
ww1_austriahungary.166.d: "Women have found another place outside of their household: in the streets. Indeed, they were the first to react to the problem of rising cost of living by protesting against the Cartels' anti-consumerist policies."
ww1_austriahungary.166.a: "They cannot be serious!"
ww1_austriahungary.167.t: "Success of the Bohemian Middle Class"
ww1_austriahungary.167.d: "The Bohemian middle class has found recent, and long awaited success thanks to the sugar industry. Indeed, Vienna's support towards the Bohemian sugar industry has managed to boost Czech banks, like the Zivnostenská banka, their value skyrocketing to fivefold of Vienna's banks' Czech branches. This has, unfortunately, gave the necessary political funding for Bohemian activists for greater autonomy."
ww1_austriahungary.167.a: "Did you even say 'thank you' once?"
ww1_austriahungary.141.t: "Key Laws in the Parliament Blocked by Opposition Obstructionist Groups"
ww1_austriahungary.141.d: "What should be simple procedure legislation - budgets, simple ammendments to old laws to fix some unthought of small problem, tiny grants to aid a city in fixing some infrastructure problem, are being held up by opposition groups in parliament. The blocking and delaying of these simple pieces of legislation are weakening the empire, as opposition groups in parliament demand we 'respect democracy' and end some of our recent actions which have attempted to legally subvert the Imperial Council."
ww1_austriahungary.141.a: "They're just proving our point, democracy leads to dysfunction!"
ww1_austriahungary.143.t: "Czechs Protest in Parliament"
ww1_austriahungary.143.d: "As our anti-minority policies become clear, Czechs in the Imperial Parliament are attempting to disrupt our governance to protest us. They're reintroducing reformist bills numerous times to waste time, voting against government measures, and attempting to delay votes on anything not related to reforms giving Bohemia more autonomy. We'll have to deal with these litte critters for now."
ww1_austriahungary.143.a: "They won't have the Imperial Council for long"
ww1_austriahungary.156.t: "Growth of the Steel Ring"
ww1_austriahungary.156.d: "Key leaders in the iron and steel industry such as the Vítkovice Mining and Iron Corporation and the Prague Iron Company have been expanding their operations, buying up existing businesses and driving the rest into bankruptcy to secure control over the steel industry. As they grow, their steel output has too. Although prices are generally rising for most consumers, favorites of the cartel such as the government itself and key partner companies to the government are getting preferential price rates."
ww1_austriahungary.156.a: "Good news for us"
ww1_austriahungary.101.t: "Austria Requests Our Backing in Crisis With Serbia and Russia"
ww1_austriahungary.101.d: "Austrias, perhaps hastely, occupied Taslica upon the outbreak of the Balkan War to prevent Serbia and Montenegro from securing a border. Now, Russia and Serbia have sent a demand to Vienna telling them to withdraw from Taslica or it will be considered an act of war with Serbia. Austria seems ready to go to war over this, requesting our backing for their occupation. They claim us backing them may make Russia and Serbia withdraw their ultimatum, but if they don't it would be a conflict we'd easily win. Are we really ready to risk setting the world ablaze?"
ww1_austriahungary.101.a: "Austria has our unconditional support!"
ww1_austriahungary.101.b: "Hell no. Tell Austria to give it up"
ww1_austriahungary.102.t: "Germany Demands We Back Down"
ww1_austriahungary.102.d: "Germany has refused our support against Russia and Serbias demands, and even worse have ordered us to step down. Without German support, we have little choice but to withdraw from Taslica"
ww1_austriahungary.102.a: "They show weakness!"
ww1_austriahungary.104.t: "Austria Secures German Backing"
ww1_austriahungary.104.d: "Our ultimatum to Austria has lead to them cowardly flocking to their German overlords, who have agreed to support Austria. A war with Serbia is thus likely to drag the entire Triple Alliance into it, which could lead to the largest war in human history if the Triple Entente then joins on our side."
ww1_austriahungary.104.a: "This changes nothing!"
ww1_austriahungary.104.b: "We're not ready for this!"
ww1_austriahungary.103.t: "Germany Backs Us"
ww1_austriahungary.103.d: "Germany has informed us that we have their absolute support in the crisis with Russia and Serbia. We can now present Russia and Serbia with this fact, and hopefully they will back down."
ww1_austriahungary.103.a: "Lets hope they don't do anything stupid"
ww1_austriahungary.98.t: "Russia Backs Us"
ww1_austriahungary.98.d: "Russia has backed our demand for Austria to withdraw from their recently seized lands in the Balkans, meaning we can now present a joint ultimatum to Austria. "
ww1_austriahungary.98.a: "They must back down!"
ww1_austriahungary.150.t: "The More Things Change"
ww1_austriahungary.150.d: "The more they stay the same. As tensions in Bohemia begin boiling, with obstructionism in the Imperial Council and the Bohemian lower diet becoming more and more common, relations between Poles and Ukrainians remaining intense, and socialist movements in Vienna cause turmoil in our politics, voters have just given a mandate to an Imperial Council and Minister President interested in keeping only the status quo. While many believe not rocking the boat is the way foward, others worry an inactive government may lead to things continuing to heat up, potentially leading to a more severe political crisis."
ww1_austriahungary.150.a: "We'll simply play it by ear"
ww1_austriahungary.175.t: "Surge in Agricultural Exports"
ww1_austriahungary.175.d: "leaf sussy loc blahj"
ww1_austriahungary.175.a: "Wow"
ww1_austriahungary.176.t: "The Anti-Semetic Undertone"
ww1_austriahungary.176.d: "The Christain Social Party has always been a home of antisemitism, containing many old middle class men who blame the Jewish population for their decline in economic importance. Their continued dominance in the Imperial council as well as local governments is likely to see insitutionalized anti semitism continue, which has pushed many jews in the previous few years into migrating to more friendly areas such as Hungary or countries outside the monarchy entirely."
ww1_austriahungary.176.a: "Are we better off without them?"
ww1_austriahungary.177.t: "Local Jewish Community Emmigrates in Mass"
ww1_austriahungary.177.d: "A local concentrated community of Jews in our empire have had enough of antisemitic policy and culture in Austria, packing their bags to leave somewhere else. This is likely to open up some jobs for locals in the region, although the loss of a generally more educated and skilled group will hurt the local economy. "
ww1_austriahungary.177.a: "Their jobs belong to true Austrians!"
ww1_austriahungary.178.t: "Local Jewish Community Emmigrates in Mass"
ww1_austriahungary.178.d: "A local concentrated community of Jews in our empire have had enough of antisemitic policy and culture in Austria, packing their bags to leave somewhere else. This is likely to open up some jobs for locals in the region, although the loss of a generally more educated and skilled group will hurt the local economy. "
ww1_austriahungary.178.a: "Their jobs belong to true Austrians!"
