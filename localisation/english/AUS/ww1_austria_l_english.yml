ww1_austriahungary_collapse.10.d: ""
ww1_austriahungary_collapse.10.a: ""

ww1_austriahungary_collapse.11.t: "Green Peasant Revolt"
ww1_austriahungary_collapse.11.d: ""
ww1_austriahungary_collapse.11.a: ""

ww1_austriahungary_collapse.12.t: "Lemberg Occupied by Ukrainian Rebels"
ww1_austriahungary_collapse.12.d: "Lemberg, also known as Lviv (by Ukrainians) and Lwow (by Poles), was recently taken over by Ukrainian nationals."
ww1_austriahungary_collapse.12.a: "Can anything be done?"
ww1_austriahungary_collapse.12.b: "Slava Ukraini! (Play as [WUK.GetFlag][WUK.GetName])"

ww1_austriahungary_collapse.13.t: "Creation of the Republic of Zakopane"
ww1_austriahungary_collapse.13.d: "Stefan Zeromski and his conglomerates have decided to declare independance from the fracturing Empire with the goal of joining an independant Polish state."
ww1_austriahungary_collapse.13.a: "Crazy..."
ww1_austriahungary_collapse.13.b: "Let's move to the wonderful city (Play as [ZKP.GetNameWithFlag])"

ww1_austriahungary_collapse.14.t: "Creation of the Komancza Republic"
ww1_austriahungary_collapse.14.d: ""
ww1_austriahungary_collapse.14.a: "Everybody thinks they can make little nations now"
ww1_austriahungary_collapse.14.b: "Let's move to the wonderful city (Play as [KMR.GetNameWithFlag])"

ww1_austriahungary_collapse.15.t: "Creation of the Tarnobrzeg Republic"
ww1_austriahungary_collapse.15.d: ""
ww1_austriahungary_collapse.15.a: "For idiots, by idiots. Bye Idiots!"
ww1_austriahungary_collapse.15.b: "For the Revolution! (Play as [TBZ.GetFlag][TBZ.GetName])"
that_was_not_tuff: "§RThat was not tuff.§!"

ww1_austriahungary_collapse.16.t: "Emperor Karl Lets Go of Authority"
ww1_austriahungary_collapse.16.d: ""
ww1_austriahungary_collapse.16.a: "Ok"

ww1_austriahungary_collapse.17.t: "Emperor Karl's People's Manifesto"
ww1_austriahungary_collapse.17.d: "Emperor Karl has published a People's Manifesto begging us to suck his Austrian balls"
ww1_austriahungary_collapse.17.a: "Abort the Ship!"

ww1_austriahungary_collapse.18.t: "Hungary Terminates Real Union"
ww1_austriahungary_collapse.18.d: "A day after Emperor Karl's People's Manifesto, the parliament of Hungary voted to end the real union between Austria and Hungary, finally breaking that link between the two nations that existed since 1867."
ww1_austriahungary_collapse.18.a: "We're gonna die, aren't we?"

ww1_austriahungary_collapse.19.t: "The Aster Revolution"
ww1_austriahungary_collapse.19.d: ""
ww1_austriahungary_collapse.19.a: ""
