AUS_minorities_mechanic: "Der Ausgleich"
AUS_minorities_mechanic_tt_desc: "Der Ausgleich, or \"the compromise\", was the compromise in 1867 that established the current dual monarchy of Austria-Hungary and restored partial sovereignty, the previous constitution and territories to the Kingdom of Hungary. But even with this compromise in place, our empire is a stitch of many diverse ethnicities. Unfortunately for us, we have to please the people living there in order to keep a firm grip over the lands and resources."

