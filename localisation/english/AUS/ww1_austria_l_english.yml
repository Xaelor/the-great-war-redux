ww1_austriahungary.180.d: "A local concentrated community of Jews in our empire have had enough of antisemitic policy and culture in Austria, packing their bags to leave somewhere else. This is likely to open up some jobs for locals in the region, although the loss of a generally more educated and skilled group will hurt the local economy. "
ww1_austriahungary.180.a: "Their jobs belong to true Austrians!"
ww1_austriahungary.181.t: "Increasing amount of food shortages"
ww1_austriahungary.181.d: ""
ww1_austriahungary.181.a: "This isn't good... don't worry the war will be over soon!"
ww1_austriahungary.182.t: "Purging the Deeply Entrenched Church"
ww1_austriahungary.182.d: "With the Christain Social Policy falling from power, a block built on distrust of the church has taken power in a country where the church has some of the greatest levels of influence over the state of the nation found in any European country. From education to common law, many reforms are needed.\n\nHowever, the christain conservatives in Austria are likely to fight tooth and nail to stop us. Going too far in our attempts to reform the power of the church may lead to mass civil unrest, so caution is advised."
ww1_austriahungary.182.a: "The rest of Europe figured this out decades ago!"
ww1_austriahungary.183.t: "The 'Camarilla' Advises Extreme Caution About the New Social Democrat Government"
ww1_austriahungary.183.d: "Many Austrian elite close to the Emperor are extremely wary of our government, seeing us as a threat to their insitutional power. They're lobbying hard to Franz Joseph to see our government kicked out, and a conservative minister president appointed, who would then use article 14 decrees to bypass the social democratic coalition in parliament. Franz Joseph, to his credit. is committed to giving our government an honest chance. If we can avoid outright angering the Emperor or making him see us as a threat to Austria's national security, we should be perfectly fine."
ww1_austriahungary.183.a: "Who cares about the tears of a bunch of junkers!"
ww1_austriahungary.184.t: "Worsening food situation across the nation"
ww1_austriahungary.184.d: "Across the nation food prices have been rapidly rising due to the war and loss of agricultural production, and the population is getting concerned. They no longer see the war ending any time soon, and are demanding that price caps on food be introduced to halt the rapidly rising prices of food."
ww1_austriahungary.184.a: "Calm down, this will all be sorted!"
ww1_austriahungary.174.t: "Czech Groups Begin Playing Their Hand"
ww1_austriahungary.174.d: "The 1911 Imperial Council elections saw bohemian interest groups gain greatly, hoping to push for reforms giving Bohemia more autonomy and keeping the Czech language and culture distinct and strong. The conservative majority in the council, apathetic to pushing any changes to the status of Bohemia, have lead to the Czechs taking new measures. They're bringing up demands in every Imperial Council session, delaying governance and annoying many. In the Bohemian Diet, the German groups in Bohemia have began to clash with Bohemian clubs, leading to the Bohemian Diet becoming more and more broken. With the Imperial Council unlikely to push any reforms, things may continue to get worse."
ww1_austriahungary.174.a: "Not a big deal in the grand scheme of things"
ww1_austriahungary.109.t: "Obstructionist Crisis"
ww1_austriahungary.109.d: "With relations between the Minister-President and members of the Imperial Council, especially nationalist and social democratic factions, hitting extreme lows, opposition members of parliament are resorting to simply outright taking the legislature captive, refusing to pass legislation until certain concessions are made. It shows their true colors: they failed to secure a majority last election, and are now committing to destroying the government elected by the people. With their demands being unacceptable, the situation is unlikely to resolve itself through negotiations. Yet, letting a group of agitators, marxists, and anarchists hold the peoples parliament hostage is unacceptable, and may give us the justification to turn to extreme measures. "
ww1_austriahungary.109.a: "Well, they're sort of forcing us to do something drastic here!"
ww1_austriahungary.148.t: "Körting Disaster"
ww1_austriahungary.148.d: "On the morning of 20 June 1914 in the eve of the war, our M.III Körting exploded in friendly colision while on in its way to Königsberg. Entire crew diet along with the reckless pilot of Farman F.20 biplane that crashed into M.III Körting. Ernst Flatz, pilot of the Farman, according to witnesses flew in circular patterns around the airship which he did not manage to identify as our own! Press visited crash site already in the afternoon, sparking media frenzy. This airship was first airship built and produced by Austrian engineers, also being one of its kind. Due to size of our arsenal many gruesomely joke that we have been decimated by our own hand. News about this event are spreading like wildfire and it might be too late to save our grace..."
ww1_austriahungary.148.a: "This is outrageous!"
ww1_austriahungary.149.t: "Biplane-Airship Crash in Austria"
ww1_austriahungary.149.d1: "This morning, Austrian airship M.III Körting crashed during a military training exercise with a Farman F.20 Biplane. Pilot Olt. Ernst Flatz, who flew the Farman, is being blamed for the crash as he was known for his recklessness."
ww1_austriahungary.149.d2: "This morning, Austrian airship M.III Körting crashed during a military training exercise with a Farman F.20 Biplane. Pilot Olt. Ernst Flatz, who flew the Farman, is being blamed for the crash as he was known for his recklessness. It looked like he was simulating an attack and began flying in circular patterns around the airship and crashed into its rubber surface. The plane crashed and the airship burst: none of the crew from the Farman biplane to the Körting airship survived their following crashes."
ww1_austriahungary.201.t: "The Party of Moderate Progress Within the Bounds of the Law"
ww1_austriahungary.201.d: "A new party is gaining a small amount of traction in Bohemia. Founded by Jaroslav Hasek, his party manifesto immediately raises eyebrows to all voters. The party calls for:\nThe reintroduction of slavery\nThe nationalization of janitors (similar to how it is in Russia, where every janitor is simultaneously a police informer.)\nThe rehabilitation of animals.\nThe institutionalization of feeble-minded MPs.\nThe reintroduction of the Inquisition.\nJudicial immunity for priests and the Church (In cases where a schoolgirl is deflowered by a priest.)\nAnd last but certainly not least, the mandatory introduction of alcoholism.\n\nThe party seems extremely bizare at first glance, yet its intentions are revealed at a deeper look. The party serves to mock the conservative order in Bohemia, where parties are seen as not advocating for real change, especially amongst the extremely moderate Bohemian social democrats. Its hoped by Jaroslav Hasek that this party can compete in the upcoming elections to ride a wave of discontent from a broad coalition of radicals in the Bohemian political spectrum that don't fit what many view as cautious and conservative parties."
ww1_austriahungary.201.a: "Their form of protest is rather odd"
ww1_austriahungary.202.t: "Bienerth Forms Majority Government"
ww1_austriahungary.202.d: "Although an actual parliamentary majority is not required to be the minister president of Austria, securing a mandate does much to legitimize a government and give it true capacity to govern through democratic norms. With the election results in, Bienerth has secured majority support from parliament, and thus Franz Joseph has entrusted him to continue his tenure. We must however recognize that our majority is far from tightly unified, with members of parliament all having their own agendas. The Christian Social Party has lost ground in the Imperial Council, and we will have to work with members of the Deutscher Nationalverband to pass legislation. Still, if we can closely unite our allies in parliament we should be able to push basic legislation, and above all a solution to the Bohemian question once and for all."
ww1_austriahungary.202.a: "The torch has been relit!"
