ww1_austriahungary.231.t: "The Young Czech Party demands the implementation of the Czech language in important roles"
ww1_austriahungary.231.d: "The radical Young Czech Party maintains that the German language enjoys a privileged position within the imperial administration and that Czech citizens are disadvantaged when aspiring to important public, judicial, or military positions. Therefore, they demand that Czech be recognized as an official language in all government institutions. Although this demand seems purely administrative on the surface, its promoters use it to strengthen Czech national sentiment and to claim ever greater autonomy from the authority of Vienna."
ww1_austriahungary.231.a: "Surely some sort of compromise could be reached?"
ww1_austriahungary.231.b: "This is nonsense"

ww1_austriahungary.232.t: "Various Radical Slavs request greater political autonomy "
ww1_austriahungary.232.d: "These groups maintain that Slavic peoples do not receive equal treatment within the Empire and demand a comprehensive reform of the political system. Among their main demands are the recognition of their languages in public administration, greater representation in state institutions, and guarantee them a greater political autonomy."
ww1_austriahungary.232.a: "Surely some sort of compromise could be reached?"
ww1_austriahungary.232.b: "Do they think they're the only ones in the world?"

ww1_austriahungary.233.t: "Austrian Pan-Germanic movement demands a single and total use of German"
ww1_austriahungary.233.d: "These agitators demand that German should remain the primary language of administration, education, the judiciary, and the military. Rejecting any reforms that would reduce the political influence of the German population across the Empire, the more radical elements of the movement advocate Pan-Germanism, according to which all German-speaking peoples should unite into a single nation. Some even consider a closer political union with the German Empire desirable."
ww1_austriahungary.233.a: "They're free to try and push it through if they want"
ww1_austriahungary.233.b: "What a stupid idea"

ww1_austriahungary.234.t: "Local Representatives Demand Money For Their Region"
ww1_austriahungary.234.d: "A local represnetative of an underdeveloped area in the Imperial Council is lobbying very hard for money to their area, threatening obstructionism if they don't get their way. Their threats to take the government hostage is certainly not making them any friends amongst the government. What do we do about this?"
ww1_austriahungary.234.a: "Would an investment be worthwhile?"
ww1_austriahungary.234.b: "Not worth it"

ww1_austriahungary.235.t: "Radical SDAPÖ members demand redistribution of wealth"
ww1_austriahungary.235.d: "These movements argue that workers' labor conditions are unfair and demand profound reforms to the political and economic system. Their main demands include a reduction in working hours, increased wages and improved working conditions and a redistribution of wealth through progressive taxation and social welfare programs."
ww1_austriahungary.235.a: "Sure thing"
ww1_austriahungary.235.b: "Are they not satisfied with not going to the front?"



