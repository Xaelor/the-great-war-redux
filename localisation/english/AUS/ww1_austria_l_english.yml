#idk
ww1_bulgaria.134.t: "Bulgaria Wishes To Conclude An Alliance"
ww1_bulgaria.134.d: "Bulgaria has approached us with the wishes of concluding an alliance that'll result in their entry into The Great War in return for Serbian Macedonia, Moravia and an Ottoman consession. Our diplomats discussed with the Bulgarian delegation and promised further loans for their war presentation, as well as a joint invasion of Serbia. We also promised Bulgaria Agean Macedonia and Dobruja south of Constanta in the case of Greek and Romanian entry into the Entente."
ww1_bulgaria.134.a: "Of Course!"
ww1_bulgaria.134.b: "We shouldn't alienate Greece and Romania..."
ww1_bulgaria.135.t: "The Sectet Alliance and Military Convention"
ww1_bulgaria.135.d: "With Negotiations concluded with German and Austro-Hungarian Diplomats and they have warmly welcomed us to the Central Powers with the promises of Serbian Macedonia and Moravia. The agreemant also included further loans and an Ottoman concession. Germany also made it clear that we are to not antagonize Greece nor Romania, but, if they were to join the Entente we would recieve Greek Macedonia and Dubroja south of the Constanta port. With the treaty signed and the military convention underway, a joint invasion of Serbia is too soon take place..."
ww1_bulgaria.135.a: "Bulgarian glory is soon to be restored!"
ww1_bulgaria.136.t: "A Personal Union With Albania?"
ww1_bulgaria.136.d: "Tsar Ferdinand has expressed great interest in the Albanian Throne and urges the Prime Minister to mention this to the German and Austrian delegates....Tsar Ferdinand theorizes that a personal union with Albania would pacify all muslims within the Balkans; however, the idea collides with Austrian ambitions. Are we to mention it?"
ww1_bulgaria.136.a: "Albania is rightfully Bulgarian!"
ww1_bulgaria.136.b: "Is Ferdinand mad!?"
ww1_bulgaria.137.t: "A Personal Union Between Bulgaria and Albania?"
ww1_bulgaria.137.d: "The Bulgarian Tsar, Ferdinand I, of the House of Saks-Koburg, has intentions to create a union between Bulgaria and Albania. An ambitious and daring request, but Ferdinand is someone who is very pro-German and the union could be fruitful..."
ww1_bulgaria.137.a: "Forward the idea to Austria"
ww1_bulgaria.138.t: "A Bulgarian Union With Albania?"
ww1_bulgaria.138.d: "The Bulgarian Tsar, Ferdinand I, of the House of Saks-Koburg, has intentions to create a union between Bulgaria and Albania. An ambitious and daring request! This directly contradicts our ambitions! Is Bulgaria insane?"
ww1_bulgaria.138.a: "Hell to the no!"
ww1_bulgaria.138.b: "Why not?"
ww1_bulgaria.139.t: "Austria Declines the Bulgaria Proposal"
ww1_bulgaria.139.d: "Austria declines the Bulgarian proposal for a personal union with Albania, for it contradicts her ambitions. Austria says that they'd never satisfy an alliance with Bulgaria if they had acess to three seas."
ww1_bulgaria.139.a: "Expected"
ww1_bulgaria.140.t: "Our Albanian Ambitions Not Realized"
ww1_bulgaria.140.d: "The Austrian delegate has declined our proposal for a personal union with Albania, but on the bright side we will still recieve Moravia. Despite this decline we will not let go of our Albanian dreams... perhaps Prince Kyril will be a great Canadite?"
ww1_bulgaria.140.a: "Sad!"
ww1_bulgaria.141.t: "Our Albanian Ambitions Realized!"
ww1_bulgaria.141.d: "Germany and Austria have conceded to our proposal, promising a place for a Koburg on the throne of Albania following the Great War!"
ww1_bulgaria.141.d: "Hurrah!"
