ww1_austriahungary.269.t: "Franz Ferdinand's Address to the Nation"
ww1_austriahungary.269.d: "Franz Ferdinand, in a new adress to the nation, has stated that he advocates and will be pushing policies relating to reform in the Austrian domain, including Universal Suffrage in Hungary. Of course, universal suffrage in Hungary would be devastating to the Magyar elites as this means that minority members would take up space in parliament. Ferdinand, who a known Magyarophobe, seems to be pushing out the Hungarian elite to put in their place pro-Vienna partisans."
ww1_austriahungary.269.a: "Interesting"
ww1_austriahungary.269.b: "Concerning"
