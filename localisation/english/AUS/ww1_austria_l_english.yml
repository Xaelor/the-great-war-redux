ww1_austriahungary.222.t: "German Nationalists Take Hardline to School Language Question"
ww1_austriahungary.222.d: "Despite being willing to broker compromises in other aspects relating reforms attempting to satisfy the demands of Czechs, it seems German nationalists are deciding to die on the hill of the school language question. They're refusing to entertain almost any reforms at all, wanting German to be taught in all schools with Czech as a secondary option in some. We've tried the usual threat of resigning in favor of Sturgkh, yet they seem unfazed. They want German to be pushed as a priority, and are generally refusing to budge on the issue, despite the Czechs wishing for a compromise similar to the compromise reached in the linguistic partition of Czech provinces, where German areas would prioritize German, Czech areas prioritize Czech, and mixed areas enforce the teaching of both languages. What should we do?"
ww1_austriahungary.222.a: "Shelf this until we're in a better position"
ww1_austriahungary.222.b: "Can we try and force it through without them?"
AUS_bienerth_resigns: "Yet Another Failure"
ww1_austriahungary.222.e: "We wern't bluffing about resigning. Enjoy Sturgkh crushing your liberties, then!"
ww1_austriahungary.211.d: "Our allied parties are beginning to fight with eachother more and more. While some disagreements amongst allies of Bienerth are to be expected, recently its getting to the point that tensions are getting harder and harder to resolve. If tensions run too high, parliament will collapse into infighting, which could lead to the end of our government at the hands of the Emperor, who will lose confidence in us."
ww1_austriahungary.211.a: "Not good"

AUH_obstructionist_imperial_council: "Obstructionist Groups in the Imperial Council"
AUS_bohemian_compromise_idea: "The Bohemian Rhapsody"
