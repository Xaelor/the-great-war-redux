ww1_austriahungary_war.63.t: "[Hun.GetLeader] Requests We Take Hungarian Coorination Oath As Soon As Possible"
ww1_austriahungary_war.63.d: "With the ongoing conflict and the need to stabilize the political situation of the Austro-Hungarian monarchy as soon as possible, [HUN.GetLeader] is asking Karl to take the crown of Hungary as soon as possible. Traditionally, emperors can wait up to 6 months to take the oath to the Hungarian consitution. By taking the oath as soon as possible, we will ensure stability in the empire."
ww1_austriahungary_war.63.a: "It would make sense to hasten the process"
ww1_austriahungary_war.64.t: "Karl Crowned Hungarian King"
ww1_austriahungary_war.64.d: "In a hastened process, Karl has offically taken an oath to the Hungarian consitution and been crowned king. With an oath to Hungary's constitution taken, the Ausgleich political system has once again been entrenched. This has smoothed the concern of some Hungarian politics, who wanted the king to be bound to the Hungarian constitution as soon as possible, to avoid any risk of Karl attempting to insitute any sort of reforms in Hungary before his oath to the consitution had been taken."
ww1_austriahungary_war.64.a: "Its offical!"
ww1_austriahungary_war.60.a: "They're just doomers"
