ww1_german_austria.1.t: "Anschluss"
ww1_german_austria.1.d: "The Austrian Empire experiment is over, dying in a fiery blaze. With the empire fallen, all political parties in German-Austria are in agreement that the next step foward is for Germans to join Germany. We've lost our industrial heartland, our agriculture, our resources, and have no hope at surviving as an independent state. Similar to the self determination of other minorities, Germans deserve to chose their own future, and its clear the vast majority wish to join their brothers in Germany. With all parties in agreement, we will immediately declare ourself part of Germany."
AUS_they_will_be_back: "Until we address underlying anger, the §QCommunists§! will be back, and they may be more organized next time..."
