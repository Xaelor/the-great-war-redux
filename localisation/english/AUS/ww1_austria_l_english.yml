ww1_austriahungary_war.59.t: "Para Pacem's Peace Movement"
ww1_austriahungary_war.59.d: "One of the only peace movements survive the crackdown on pacifist movements is Para Pacem, controlled by Adolf Muller. He avoids directly calling for Austria to lay down its arms, instead advocating for a broad international concept of a 'United Nations' organization which would settle disputes and wars between major nations to avoid anything as destructive as the conflict we find ourselves in from ever happening again. He's attempting to build a network across the world to support his idea, aiming for some form of institution post war to be set up. The idea has broad support among all other then the military, who sees the concept as showing weakness to the world."
AUH_karl_von_sturgkh_desc: "Karl von Stürgkh was born on the 30th of October 1859 into an ancient Styrian noble family. He has been a prominent conservative figure in the Reichsrat for many years and served capably as the Minister of Education under Richard von Bienerth. Just recently, in November of this year, Emperor Franz Joseph I appointed him as our new Minister-President to succeed Paul Gautsch, placing the heavy burden of navigating our current legislative gridlock squarely on his shoulders."
ww1_austriahungary_war.59.a: "An interesting concept for us to consider once we win"
ww1_austriahungary.230.d: "As parliament cotinues its rapid decline into paralysis, Sturgkh is lobbying the Emperor to appoint him to fix the problem. Sturgkh claims that the Imperial Council is fundementally flawed and with a great war probably on the horizon, anything other then the fundemental dissolution of the Imperial Council, even if temporary, risks leaving Austria vulnerable. So far, Bienerth has argued that the insitution can be reformed, outlining a plan to reform the legality of obstructionism. Bienerth is arguing only he can fix the Czech question and thus needs to be kept in charge instead of Sturgkh. Still, if the Imperial Council remains trapped in paralysis, Sturgkh may be able to convince the Emperor he is needed to fix the situation."
ww1_austriahungary.230.a: "We definitely need to get things under control"
AUS_sturgkh_appointed_instead: "Sturgkh successfully Convinces the Emperor to Appoint Him"
ww1_austriahungary.229.t: "Crisis of Obstructionism Continues"
ww1_austriahungary.229.d: "Despite being in the minority, opposition groups are still managing to impose their will on the Imperial Council. It was hoped that the new elections would build a constructive majority, yet things remain the same. Groups are continuing to use obstructionist tactics to delay votes on important legislation and force repeated votes on the unrealistic and inflamitory bills they've written. Its leading to the legislative government becominmg weaker and weaker."
ww1_austriahungary.229.a: "This is absolutely unacceptable!"
ww1_austriahungary.227.d: "Recent troubles in the economy are leading to a rise in Labor groups as disatisified workers join unions and socialist movements that are promising them a path to changing the status quo. A rise in labor activity will obviously, if unchecked, lead to an increase in strikes. "
ww1_austriahungary.227.a: "But economic prosperity is just a short time away!"
AUS_open_up_the_country: "Opening Up the Country"
AUS_open_up_the_country_desc: "For decades our policy has been downright hostile to foreign trade, if we want a truly competitive and modern economy we need to embrace trade and allow foreign goods into our economy, we will begin to slash tariffs and massively increase exports."
ww1_austriahungary.237.t: "The Social Democrat Charm Offensive"
ww1_austriahungary.237.d: "Scoring a suprising lists of successes last election, social democrats across Cisleithania have been greatly motivated by what they see as a great level of momentum they now carry. Recent economic turmoil has boosted their ground game significantly, and its largely agreed the party is likely to win in upcoming local elections in areas such as Vienna, which they very nearly won a plurality of the popular vote in last time. "
ww1_austriahungary.237.a: "We oppose their efforts, naturally"
ww1_austriahungary.238.t: "Czech Social Democrats Race Left"
ww1_austriahungary.238.d: "The Czech democratic socialist movement had been historically much more moderate then social democratic movements in other nationality groups. The Czech social democrats are outright disliked by most other social democrat groups, and Czech Social Democrats enjoy legitimate participation in elitist affairs of Bohemian politics, where behind closed door deals are a usual to try and formulate political strategies between all Czech parties. However, our bourgeoisie parliamentary group is seeing the Social Democrats lose their previously strong relationship with Czech establishment policies, and its also leaving their voters angry. Thus, the Czech Social Democrats are seeing a mass movement of their party back to the left."
ww1_austriahungary.238.a: "They race to the left and to irrelevancy"
ww1_austriahungary.239.t: "Officer Satisfaction Over Mountain Training Programs"
ww1_austriahungary.239.d: "Many officers have expressed their satisfaction with the new mountain-training programs. Although the training is quite rigorous, it has been praised for its effectiveness in preparing our brave and courageous soldiers for deep combat in mountainous and rugged  terrain."
ww1_austriahungary.239.a: "There is no summit we cannot reach, there is nothing that we cannot do!"
ww1_austriahungary.240.t: "Army Debloating finished"
ww1_austriahungary.240.d: ""
ww1_austriahungary.240.a: "Good"
AUS_satisfy_the_peasants: "Focus on the Cost of Life"
AUS_satisfy_the_peasants_desc: "Our new economic policy has mostly centered on breaking up the great industrial and manufacturing monopolies, but that doesn't mean we will neglect the agricultural sector. We shall further invest in our farmers so they can increase their production and allow the common people greater access to their produces."
AUS_crush_the_bohemian_parliament: "Crush the Bohemian Diet"
AUS_combat_the_scissor_effect: "Combat the Scissors Effect"
AUS_supremacy_of_the_armeeoberkommando: "Supremacy of the Armeeoberkommerando"
AUS_assume_jurisdiction_of_armament_factory_men: "Assume Jurisdiction Over Armament Factory Workers"
AUS_support_competitive_pricing: "Support Competitive Pricing"
AUS_support_competitive_pricing_desc: "For decades the cartels were able to determine the price of goods however they wanted, this was incredibly damaging towards our economy and for our people, now that we have begun to dismantle the cartels we can enact measures to combat price gouging and in a near future the prices of goods will be dictated only by the free market."
AUS_encourage_innovation: "Encourage Innovation"
AUS_encourage_innovation_desc: "In recent years we have greatly improved our economy and industry, thanks to that we can devote further resources to research and development while also giving greater funding to our universities to help usher in a new generation of great Austrian inventors."
public_utilities_aus: "Municipal Socialism"
AUS_improve_trento_supply_administration_desc: "The Alps represent a chain of mountains that are difficult to cross, and many empires would ruin their armies trying to pass through. Our troops on the border, although prepared, are not nearly well enough supplied. We must address this issue before any possible conflict begins in the region. A decent supply node will be constructed to maintain a front line in case of such an event."
AUS_conrad_effects: "Conrad is known for pushing the Austrian army to its absolute limit, planning very ambitiously even if the resources are... in shortage, to say the least. Thus, choosing to follow Conrad's army doctrine will §GDouble§! the buffs of all shared army focuses in this tree. However, all army focuses shared in this tree will also start §Rnegatively§! impacting £supply_consumption_texticon Supply Consumption, £army_experience Army Experience Gain, and £factory_output_texticon Factory Output\n\nWe can lessen the impact of these debuffs through the focuses §YExtraordinary Military Expenditures§!, §YExpand the Army Budget§!, and §YFunnel Money into the Landwehr§!"
AUS_reverse_serbian_reconciliation: "Reverse Serbian Reconciliation"
AUS_uplift_developing_areas: "Uplift Developing Areas"
AUS_support_the_cartelization_of_industry: "Support the Cartelization of Industry"
AUS_support_the_cartelization_of_industry_desc: "Cartelization of the economy occurs when a group of markets agrees to collaborate with each other to not stir up competition and instead maximize profits and dominate the market. Ever since the 1890s, our Empire's economy has been dominated by this libertarian policy, and we see no reason to stop: our economy is thriving as it is."
korting_disaster: "§YKörting Disaster§! has happened"
AUS_housing_projects: "Invest into Housing Construction"
AUS_support_textile_paper_cartels: "Support Textile and Paper Cartels"
AUS_mantain_a_competitive_economy: "Maintain a Competitive Economy"
AUS_mantain_a_competitive_economy_desc: "With a renewed mandate we have decided on a bold new course for our economy, we will begin to dismantle the economic cartels that have been allowed to fester in the past decades, this will hurt our economy in the short term but in the future it will allow us to once again have a truly competitive economy that can match that of our rivals."
AUS_break_the_1903_brussels_convention: "Break the 1902 Brussels Convention"
AUS_break_the_1903_brussels_convention_desc: "At the 1902 trade convention, attended by all European powerhouses, Austria-Hungary agreed to limit its import duties to 6 French Francs—which was 5.7 kronen per 100 kilograms—and to prohibit sugar bounties (government subsidies). However, these conventions are limiting any possible cartel expansion, which is why they must be removed for the good of the Austrian economy."
AUS_urbanize_vienna: "Urbanize Vienna"
AUS_urbanize_vienna_desc: "Vienna, the imperial capital of our Empire, must never lag behind any other major power's capital. Obviously, that is not the case, but to keep our unscarred pride safe, continuous funding into its industry is necessary. Let's keep our metropolis shining."
AUS_too_big_to_fail: "Too Big to Fail"
AUS_too_big_to_fail_desc: "The banks of Cisleithania not only provide credit for the development of our industries, but they own and manage them. This is due to the Great Depression in 1873, triggered in Vienna and caused by the misuse of the libertarian economic system. So the banks own the cartels."
AUS_mantain_cheap_goods: "Maintain Cheap Mining Resources"
AUS_mantain_cheap_goods_desc: "The mountains of our empire have been blessed with an abundance of mineral resources, we shall continue our practices of supporting the cartels related to these industries so we can extract more from our land and allow a greater influx of cheap goods to fuel our production demands."
AUS_the_iron_ring: "The Steel Ring"
AUS_cooperation_with_military_industry: "Cooperation with Military Industry"
AUS_cooperation_with_military_industry_desc: "Our economic policy has mostly focused on strengthening the great domestic producers but that doesn't mean we will neglect our arms industry, we shall cooperate with the great arms manufacturers such as the ÖWG to modernize and increase the size of our military industry."
AUS_commission_on_cartels: "Execute Cartel Favors"
AUS_commission_on_cartels_desc: "Now that we have reinforced our ties with the cartels we should further strengthen them by enacting new trade measures favorable towards them so they can grow even larger, but we will also need to quiet down any discontent that comes from these new policies."
AUS_housing_projects_desc: "In order to continue our economic policies and provide shelter to many families, we will create more apartments and state-owned homes, further developing our cities, the periphery of the empire, and reducing poverty rates from expensive housing."
AUS_improve_the_civil_service: "Improve the Civil Service"
AUS_improve_the_civil_service_desc: "We will invest heavily into efficiency within our government, attempting to remove bottlenecks and straighten out the flow of ideas and government requests—all to the praise of the Kaiser and the cabinet itself—creating a more straightforward and easy process for all."
AUS_multiethnic_army: "Kaiserlich Und Königlich Armee"
AUS_offensive_doctrine: "Offensive Doctrine"
AUS_mining_in_salzburg: "Fund Expansion of the Lend Aluminum Plant"
AUS_mining_in_salzburg_desc: "The aluminum plant in Lend owned by Aluminium-Industrie AG has been a critical provider of aluminum in Austria since its founding in 1898. With the growing demand for aluminum in new technology we should fund the expansion of the plant to make sure we don't fall behind."
AUS_multiethnic_army_desc: "The Landstreitkräfte Österreich-Ungarns is our ground force divided into three sections. The army is riddled with many differing and varying cultures and minorities, which creates organization and communication problems. Along with being incompetent. Someone can make this a little better. The rest of the description is a Wikipedia copy-paste. Here we go! In the wake of fighting between the Austrian Empire and the Kingdom of Hungary and the subsequent two decades of uneasy co-existence, Hungarian troops served either in ethnically mixed units or were stationed away from Hungarian regions. With the Austro-Hungarian Compromise of 1867, the Austro-Hungarian Army was brought into being. It existed until the disestablishment of Austria-Hungary in 1918, following the end of World War I. Common Army units were generally poorly trained and had very limited access to new equipment because the governments of the Austrian and Hungarian parts of the empire often preferred to generously fund their own units instead of outfitting all three army branches equally."
AUS_funnel_money_into_the_landwehr: "Funnel Money Into Remilitarization"
AUS_take_advantage_of_section_41: "Utilize the Dictator Paragraph"
AUS_take_advantage_of_section_41_desc: "Paragraph 14 of the Constitution, the Emergency Clause, allows for the bypassing of parliamentary debate when passing controversial decisions."
AUS_der_grosse_kriegsredux: "Mobilize the Nation"
AUS_der_grosse_kriegsredux_desc: "After careful preparations, the Great War has begun. Millions across Europe move to the front lines, and we will do the same. Our elite army will tactically eliminate Serbia by concentrating across the border into Belgrade, and we will hold the Russians with the rest of our army. Our time has come. The sun has risen, but for Austria and her allies. Glory to the Kaiserreich!"
AUS_invest_in_supporting_attacks: "Increase Supporting Forces in the Army"
AUS_invest_in_bosnian_schools: "Invest in Bosnian Schools"
AUS_invest_in_bosnian_schools_desc: "It's a well-known fact across the Empire that many laugh about the literacy rate in Bosnia and Herzegovina, our newest acquisition. To make some real change about the fact that four-fifths of that region are illiterate, we need to help them with construction of schools and further investments related to the issue."
AUS_adopt_modern_technology: "Adopt Modern Technology"
AUS_anti_peddling_laws: "Anti-Peddling Laws"
AUS_aid_chemical_warfare_development: "Fund Chemical Warfare Research"
AUS_remilitarization_program: "Remilitarization Program"
AUS_remilitarization_program_desc: "Enough with those absurd peace and prosperity programs! It is not peacetime but the eve of a major war. Pacifist elements are not aware of the situation of our war machine and general readiness of economy to maintain stability in case of large scale war. Immediate construction of weapons factories and subsidizing our most valuable companies is Empire's priority!"
BOS_young_bosnia_party: "Mlada Bosna"
AUS_unlock_tanks: "Unlocks special project: §Y$tank_design$§!"
AUS_new_course_in_aviation: "New Course in Aviation"
AUS_construct_air_base_in_ragusa: "Construct Air Base in [1206.GetName]"
AUS_construct_air_base_in_1197: "Construct Air Base in [1197.GetName]"
AUS_cultivate_polish_loyalty: "Cultivate Polish Loyalty"
AUS_bypass_the_obstructionists: "Bypass the Obstructionists"
AUS_prepare_for_war_economy: "Prepare for a War Economy"
AUS_prepare_for_war_economy_desc: "War is looming and our industry is still far from what we wished for. So to catch up as much as we can we will do an extreme measure and convert multiple factories over night into war machinery. Building completely new factories is just to expensive and lengthy process that we are forced into conversion. Hopefully, this will be just what we need."
AUS_bypass_the_obstructionists_desc: "If anti-democratic cowards in the reichsrat want to break down the legislature branch of the government, we'll simply axe the legislature. By using our powers to repeatedly suspend the reichsrat and pass emergency decrees while the reichsrat is out of session, we can prevent our agenda from being stopped."
AUH_franz_conrad_von_hotzendorf_desc: "Conrad von Hötzendorf was born on the 11th of November 1852 into a military family. A deeply intense and brilliant military strategist, he was appointed Chief of the General Staff of the Austro-Hungarian Army in 1906 with the strong backing of Archduke Franz Ferdinand. He is a fierce advocate for modernizing our armed forces and is known for his firm conviction that the Monarchy must act decisively against aggressive neighbors like Serbia and Italy to secure its borders."
AUS_encourage_jewish_exodus: "Encourage Jewish Emigration"
AUS_franz_schonaich: "Franz Xaver von Schönaich"
no_longer_hireable: "Got Fired"
AUS_canal_project_development: "Canal Project Development in [FROM.GetName]"
AUS_pit_minorities_against_eachother: "Pit the Minorities Against Eachother"
AUS_pit_southerners_against_muslims: "Encourage Bosniak Emigration"
AUS_ratify_new_budget3: "Prepare for the Coming Storm"
AUS_bohemian_language: "Equalize the Czech Language in Bohemia"
AUS_focus_on_the_administration: "Revolutionize the Administrative State"
AUS_build_a_welfare_state: "The Working Mans Government"
AUS_build_a_welfare_state_desc: "We are entering an age of socialism. People want rights, liberties, and progressivism. In order to fufill these duties, we will slowly shift towards a welfare state, to support the people."
AUS_cow_vaccine_program: "Quarantine Infected Cattle"
AUS_livestock_disease_mission: "Livestock Disease Worsens"
AUS_move_past_the_chaos: "Move Past the Chaos"
AUS_cultivate_real_loyalty: "Construct Lasting Loyalty to the Empire"
AUS_work_with_unions: "Repeal Anti Striker Laws"
AUS_above_petty_squabbles: "Above the Petty Squables of Nationalism"
AUS_butter_before_guns: "Butter Before Guns"
AUS_liberals_first_nationalists_second: "Liberals First, Nationalists Second"
AUS_condemn_ottomans: "Condemn Ottoman Policy on Christians"
AUS_condemn_ottomans_desc: "The Ottomans have brutually oppressed Christians in their Balkan territories, something which has been met with outrage by practically all in the empire. A strong condemination of these Ottoman policies could easily earn us good will with all in the empire."
AUS_crown_jewels_of_the_empire: "Crown Jewels of the Empire"
AUS_crown_jewels_of_the_empire_desc: "Undoubtedly, Vienna and Prague are the crown jewels of the Cisleithanian half of the empire. The vast majority of our industry is located in these areas, and our economic future relies on them. We should strengthen these areas further."
AUS_special_privileges_to_weapon_companies: "Loosen Industrial Regulations"
AUS_special_privileges_to_weapon_companies_desc: "Our war machinery is not in best shape. To change that, weapons factories need loosened regulations to maximise their effectiveness. This is not negotiable as our current war machine is lacking behind some great powers. Of course this will not be effective if further remilitarization effort do not take place..."
AUS_establish_kriegspressequartier: "Establish the Kriegspressequartier"
AUS_overton_window_tt: "The Overton Window"
AUS_overton_window_desc_tt: "The Overton Window is a meter determining what ideas are acceptable to the mainstream population. This here Overton Window expresses a limit of what policies we can take based on if the Austrian population is more leaning democratic or leaning towards autocratism."
current_overton_window: "The current overton window is [?AUS_overton_window] towards §qAutocracy§!"
current_overton_window_tt: "The current Overton Window is [?AUS_overton_window]towards the side of §qAutocracy§!. A higher overton window will allow us to complete more focuses to accomplish our goal of limiting minority autonomy and centralizing command."
AUS_parliamentary_mandate_tt: "Parliamentary Mandate"
AUS_parliamentary_mandate_tt_tt_tt: "Current power of our parliamentary mandate: §Y[?AUS_pm_mandate_power]§!"
AUS_at_least_one_pm_power: "Power of our parliamentary mandate is at least §Y1§!"
AUS_sanitarer_kordon: "[AUS_sanitarer_kordon_name]"
AUS_sanitarer_kordon_name_cordon_sanitaire: "Cordon Sanitaire"
AUS_sanitarer_kordon_name_fair_voting: "Oppose Nationalist Agitation"
AUS_stapinskis_directive: "Stapiński's Directive"
AUS_stapinskis_directive_desc: ""
AUS_negotiate_with_romanian_national_parties: "Negotiate with Romanian Parties"
AUS_negotiate_with_romanian_national_parties_desc: ""
AUS_anti_socialist_rally: "Rally Middle Class Against Socialism"
AUS_rally_parties_against_socialism: "Rally Parties Against Socialism"
ww1_austriahungary.206.t: "The Firewall"
AUS_further_agr_subsidies: "Further Agricultural Subsidies"
AUS_break_up_huge_estates: "Break Up Huge Estates"
AUS_public_investments: "Strategic Public Investments"
AUS_electricity_in_galicia: "Develop Energy Industry in Galicia"
AUS_invest_in_ports: "Invest in Port Infrastructure"
ww1_austriahungary.206.d: "The bourgeoisie parties don't agree on much, but anti socialism is a cause they all can get behind. Bienerth is attempting to convince local bourgeoisie parties to align against socialist parties, boosting eachothers canidates and agreeing to coalitions to keep social democrats and socialists from even getting close to power. Its hoped these efforts will draw all bourgeoisie parties closer together and help firmly align the flexible center/center left to allies of our government."
ww1_austriahungary.206.a: "We will all ensure socialism doesn't take power here!"
AUS_forment_strong_small_farms: "Forment Strong Small Farm Estates"
ww1_austriahungary.205.t: "Dreams of a Bourgeoisie Block"
ww1_austriahungary.205.d: "Austrias parliament is extremely polarized. Obstructionism is common place in the Imperial Council, and parties usually deeply distrust eachother. One problem for stable governance is that minority politics dominate Austria, meaning that conservative Czech groups, conservative German groups, and conservative Polish groups do not form a tightly unified block. Due to this, forming a large ideological coalition in parliament is extremely hard, as parties with similar ideologies still refuse to work with eachother. The best way to unite a group of people is to give them a common enemy, and hopefully the socialist and labour movements can serve as that common enemy. If we can try and draw a distinction between the Bourgeoisie parties vs the socialist parties, we can hopefully unite them behind our agenda."
ww1_austriahungary.205.a: "Is this achieveable?"
AUS_further_polish_autonomy: "Grant Further Power to the Poles in Galicia"
AUS_parliamentary_mandate_tt_tt_tt_desc_tt: "Parliamentary mandate power represents parliaments willingness to pass our agenda. We can gain more power for our parliamenary mandate by fufilling demands of specific parliamentary factions who will in exchange for us doing them favors will lend their support to us."
AUS_enforce_war_requirement_act_on_bosnia: "[AUS_enforce_war_requirement_act_on_bosnia_sl]"
AUS_enforce_war_requirement_act_on_bosnia_AUS: "Encourage Bosnian War Effort"
AUS_enforce_war_requirement_act_on_bosnia_BOS: "Pass the War Requirements Act"
AUS_enforce_war_requirement_act_on_bosnia_desc: "Bosnia has still not passed the War Requirements Act, passed by our legislation some time ago. It is time for us to dip our hands in the juice that is Bosnian politics even more by forcing upon them the War Requirements Act."
AUS_siegfried_popper: "Siegfried Popper"
scientist_AUS_naval_architect: "Naval Architect"
AUS_preferential_rates_to_hungarian_grain: "Protective Tariffs on Imperial Produce"
AUS_preferential_rates_to_hungarian_grain_desc: "Produce from other powers are way cheaper and are present in a larger quantity. This is an unfortunate situation for the Imperial farmers that have to charge more due to higher maintenance cost. We can establish Imperial dominance in the Austrian Produce Market by taxing foreign cattle and grain imports. This will advantage the less rich Imperial farmers and they will be able to make more profits."
AUS_bohemian_industry: "The Empire's Workshop"
AUS_bohemian_industry_desc: "We will further invest into Bohmen, by reallocating leftover funds to construct factories. This will significantly boost our economy, and also enhance Czech loyalty."
AUS_continue_the_army_reforms: "Continue the Army Reforms"
AUS_continue_the_army_reforms_desc: "After major preparations, we are now able to begin reforming our armed forces. With groundwork already in place; the task should be relatively simple."
AUS_price_ceiling: "Price Ceilings"
AUS_price_ceiling_desc: "Oscilating prices have been harsh to Empire's people. Topics about price ceiling have been debated before, but were always taken as a extraordinary measure and that it is step too far. Well these extreme measures will certainly put a strain on our economy, but populace cannot be kept with empty promises."
AUS_whip_the_army_into_action: "Whip the Army into Action"
AUS_war_cars: "War Automobiles"
AUS_improve_the_propaganda: "Target the Politically Illiterate"
AUS_protect_the_emperors_mandate: "Secure the Full Extent of the Emperor's Mandate"
AUS_protect_the_emperors_mandate_desc: "[AUS_GetMinisterPresident] was given a mandate by [AUS.GetLeader] to fufill his duties as the directive of the Imperial Council, yet pesky reformist groups are attempting to obstruct parliament and take this right for themselves. We won't let them obstruct our government, and to ensure this, we'll reform the law to remove the loopholes they are using to obstruct us."
AUS_ban_labour_unions: "Ban Labour Unions"
AUS_ban_labour_unions_desc: "Our reforms culminate now. In order to further shift the population towards the right, we must remove their protection for laziness, trade unions. Trade Unions are preventing us from creating realistic work hours, so they must end now. "
AUH_investment_bosnia: "Bosnian Investments"
AUS_improve_supply: "Slow, Thoughtful Offensives"
AUS_mandate_for_leadership_desc: "It is not enough for Franz Ferdinand to be another Emperor. If we are going to rescue the country from the grip of the radical Magyars, we need both a governing agenda and the right people in place, ready to carry this agenda out on day one of Ferdinand's reign."
AUS_mantain_principles_vogelsang: "Mantain the Principles of Vogelsang"
AUS_social_democratising: "Sozialdemokratisierung"
AUS_proactive_interest_rate_policy: "Proactive Interest Rate Policy"
AUS_investigate_artillery_decision: "Investigate the Artillery"
AUS_a_great_war_begins: "A Great War Begins"
AUS_romania_bulgaria_peace: "Bulgarian-Romanian Mediation"
AUH_extensive_bulgarian_investments: "Heavy Investments in Bulgaria"
AUS_crush_labor: "Destroy Class Conscious"
AUS_under_the_shadow_of_the_eagle: "Under the Shadow of the Eagle"
AUS_peace_with_honor: "Peace With Honor"
AUS_enforce_our_will_on_bohemia: "Enforce Our Will on Bohemia"
AUS_fate_of_the_czechs: "Craft Our Own Solution to Minority Questions"
AUS_united_in_christianity: "United in Christianity"
AUS_united_in_christianity_desc: "Emperor [AUS.GetLeader] 79% of the Cisleithanian population consider themselves to be Catholics is deeply devout and he wishes for a revival of the 17th century Pietas Austriaca."
AUS_national_unity_idea: "National Unity"
remove_tt_national_unity: "§RThis idea will be removed if the Christlichsoziale Partei is no longer in control of the Imperial Council§!"
AUS_the_reformist_era: "Usher in the Reformist Era"
ww1_austriahungary.188.t: "Parliament Grinded to a Hault"
ww1_austriahungary.188.d: "As conservatives continue to refuse any reforms to the country, parliament is beginning to face an assault from obstructionist Czechs, Liberals, and Social Democrats. All sorts of crucial laws are being blocked as the opposition uses parliament as a specticle to try and push their own favored laws which have no chance at passing. Its clear they're abusing the function of obstructionist laws in the Imperial Council, we must find a way to stop them!"
ww1_austriahungary.188.a: "They're overplaying their hand!"
