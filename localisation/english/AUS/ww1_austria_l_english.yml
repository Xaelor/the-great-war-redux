AUS_fire_koerber_desc: "The government of [AUS_GetMinisterPresident] currently does not align with Kaiser Karl's agenda for the Empire and will be difficult to deal with if kept around. If we wish to get things done, the government must be shuffled up a bit and someone more aligned with Karl's views, like Spitzmüller be appointed Minister-President."
