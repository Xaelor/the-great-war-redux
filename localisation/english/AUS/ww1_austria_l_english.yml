ww1_austriahungary_war.60.t: "Private Concerns Over the Supply Situation"
ww1_austriahungary_war.60.d: "No matter the current state of the front lines, many objective observers close to the Emperor are warning that the internal supply situation in the empire is extremely worrying. To put it blatantly, they think we're at risk of extreme internal turmoil if the war isn't finalized soon. Depending on how we're performing we may be able to win an absolute victory soon, but we may need to look into some sort of negotiated compromised peace too."
