AUS_obstructionism_of_our_own_desc: "The Empire's minorities love to bother us with obstructionism, prolonging the passing of necessary laws. Without remorse, these people sabotage the Empire from within, day after day, selfishly interested in nothing but their personal gain. To counter these wearying attempts, we will show them obstructionism of our own, which can subvert many more laws than they can't even fathom. If they want to play these dirty games, well then, we'll be playing even dirtier games."
