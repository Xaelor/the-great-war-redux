ww1_austriahungary.209.d: ""
ww1_austriahungary.209.a: "Cool"
ww1_austriahungary.210.t: "Coalition Fracturing"
ww1_austriahungary.210.d: "The broad coalition that Bienerth relies on is vulnerable to infighting, and the collapse of a parliamentary mandate would follow if the coalition fractures. Many issues divide the coalition, and its inevitable confrontations between the coalition parties are going to happen. We thus must try and ensure the parties supporting Bienerth have more uniting them then dividing them, and hopefully eventually bring them under a more tightly knitted bourgeoisie coaliton, which would allow us to bury the most controversial issues under the rug."
ww1_austriahungary.210.a: "Politics can never just be easy, can it"
ww1_austriahungary.211.t: "Allied Parties Fighting"
AUS_pork_barrel_politics: "Pork Barrel Politics"
AUS_tackle_first_czech_reforms: "Securing The National Compromise"
ww1_austriahungary.215.t: "Emperor Wants to see Progress on the Czech Issue"
ww1_austriahungary.215.d: "Bienerth first took the reign of power to try and solve the Czech question, seeking a national compromise to satisfy both German nationalists and the Czech national parties. Yet, all we have to show for it so far is small scale compromises in cities and provinces in Bohemia. With Bienerth not resigning after the next elections, the emperor has made it clear that he wants Bienerth to finally solve the Czech issue otherwise he will ask someone else to."
ww1_austriahungary.215.a: "Lets organize some meetings"
