AUS_minorities_poles_delay_tt: "§LThe §!§YPolish§!§L have been in Austrian hands since the First Partition of Poland in 1772. Even though they are crown land of Cisleithania, they currently enjoy a great level of provincial autonomy in the Empire compared to other provinces in Galicia and Lodomeria."





