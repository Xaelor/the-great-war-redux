AUS_as_serbia_strengthens: "As §Y[SER.GetNameWithFlag]§! captures more and more land, the situation will likely worsen."
AUS_burying_the_grudges_of_the_past: "Burying the Grudges of the Past"
AUS_burying_the_grudges_of_the_past_desc: "Our previous tolerance of minorities such as Slavs and Muslims was extremely conservative. We must destroy the grudges of the past, as they are decimating our reputation, as well as causing mass instability within the empire and its holdings."
tenacious_negotiator_2: "Diplomatic Architect"
