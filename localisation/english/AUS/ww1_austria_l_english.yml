AUS_propaganda_in_bohemia_cheaper: "The cost of the decision £decision_icon_small §YPropaganda Campaign in Bohemia§! will be §GHalved§!"
AUS_explain_suspend_re: "For the cost of a temporary £stability_icon£ §YStability§! and £consumer_goods_texticon §YConsumer Goods Factories factor§! debuff, we can now temporarily suspend the Reichsrat at will, §GRemoving§! the national spirit §YImperial Council§! for a short duration."
AUS_unlocks_ff_not_die: "Unlocks option for §YFranz Ferdinand§! to §Rdecline§! §YOskar Potiorek§!'s invitation to Sarajevo."
AUS_lay_our_cards_on_the_table: "Lay Our Cards on the Table"
AUS_moves_in_the_shadows: "Prepare for a Coup"
AUS_measures_in_background: "The economic situation will generally decline as the war goes on, with various factors inevitably resulting in the £consumer_goods_texticon §YConsumer Goods Factories factor§! modifier for the national spirit §YEconomic Patchwork§! rising over time. Measures will be automatically taken to get the situation under control, which will culminate in events firing about implementing new taxes, restrictions, and unprecedented policies intended to maintain an acceptable financial situation. These events will reduce the £consumer_goods_texticon §YConsumer Goods Factories factor§! modifier for the national spirit §YEconomic Patchwork§!, but will result in other consequences, such as debuffs to §YStability§!, §YWar Support§!, and §YMinority Loyalty§!"
