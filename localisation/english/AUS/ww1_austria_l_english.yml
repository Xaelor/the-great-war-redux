HUN_first_hungarian_republic: "First Hungarian Republic"

ww1_austriahungary_collapse.21.t: "Creation of the People's Republic of Lemko"
ww1_austriahungary_collapse.21.d: ""
ww1_austriahungary_collapse.21.a: "Why everybody hates me :("
ww1_austriahungary_collapse.21.b: "Nice (Play as [LMR.GetFlag][LMR.GetName])"

ww1_austriahungary_collapse.22.t: "Uprising establishes Hutsul Republic"
ww1_austriahungary_collapse.22.d: ""
ww1_austriahungary_collapse.22.a: "Sad"
ww1_austriahungary_collapse.22.b: "Carpathia is Ukrainian! (Play as [HSL.GetFlag][HSL.GetName])"

ww1_austriahungary_collapse.23.t: "West Ukrainian People's Republic"
ww1_austriahungary_collapse.23.d: "To not have an ugly-ass name, (even though this one is entirely accurate and only valid name, unlike 'Russian State'), the unstable government decided to change its name to the West Ukrainian People's Republic."
ww1_austriahungary_collapse.23.a: "Slava ukrayinskomu narodu!"

ww1_austriahungary_collapse.25.t1: "Bukovina Administration Failure"
ww1_austriahungary_collapse.25.d1: "Unfortunately, due to a phenomenon called 'Romanians', we have not been able to successfully set up an administration in Bukovina, in which the Romanians have seized the opporunity to snatch it from us."
ww1_austriahungary_collapse.25.a: "Goddamnit"
ww1_austriahungary_collapse.25.t2: "Ukrainian Incompetency"
ww1_austriahungary_collapse.25.d2: "Thanks to failed bureaucratic efforts to establish a direct managerial line from Lviv to Bukovina, we have seized the opportunity to occupy the lands."
ww1_austriahungary_collapse.25.b: "A total steal!"

ww1_austriahungary_collapse.26.t: "General Congress of Bukovina votes to unite with Romania"
ww1_austriahungary_collapse.26.d: "The General Congress of Bukovina, or Congresul General al Bucovinei, was created and it has voted to unify with Romania."
ww1_austriahungary_collapse.26.a: "The mail-in ballots didn't come in yet!"

ww1_austriahungary_collapse.27.t: "Republic of Zakopane to be integrated"
ww1_austriahungary_collapse.27.d: "The Republic of Zakopane, led by [ZKP.GetLeader], is now on the verge of uniting with [GAL.GetName]."
ww1_austriahungary_collapse.27.a: "Our dreams will come true"
ww1_austriahungary_collapse.27.b: "Okay..?"


