AUS_moritz_von_auffenberg: "Moritz von Auffenberg"
AUS_proactive_interest_rate_policy_desc: "Interest rates set by the Austro-Hungarian bank in the past have been quite steady, changing slower compared to most other European nations. With tensions rising and the world increasingly unstable, we must switch things up. By rapidly changing our interest rates up and down as the situation changes, we may reduce economic stability, but we'll ensure our nation is more prepared for anything that could happen."
reichsfinanzminister_AUS: "Reichsfinanzminister"
stephan_burian_break: "Resigned from position"
AUS_unlock_trade_romania: "§Y[ROM.GetNameWithFlag]§! will be §Gmore likely§! to accept a §Ytrade deal§! through the focus '§YTrade Convention with Romania§!' and more effects will be unlocked for the trade deal!"
AUS_autonomy: "Granted Autonomy"
AUS_bohemian_admin_reform: "Local Reforms in Bohemian Cities"
AUS_bohemian_admin_reform_desc: "While Bohemia has its own status as a crown kingdom, many Bohemian nationalists wish for more representation. To placate their demands, we should begin slowly introducing new administrative reforms on the city level, granting the Bohemian people more say over themselves."
AUS_reform_civil_service_code: "Reform the Civil Service Code"
AUS_state_of_the_realm_real: "State of the Monarchy"
AUS_bukovina_autonomy: "Personal Autonomy in Bukovina"
AUS_bukovina_autonomy_desc: "Our current census system forces our own classification of what ethnic group the citizens of Bukovina belong to. By changing the system to instead be self-reported, we can allow Bukovinians to feel better represented, and also have more accurate census data."
AUS_prioritize_wellbeing_of_galacia: "Prioritize the Well-Being of Galicia"
AUS_prioritize_wellbeing_of_galacia_desc: "Improving the situation in Galicia should be a top priority of the government, as if we let poverty continue to run rampant, we'll never have any hope of fully stabilizing the kingdom. We should work towards expanding government funding towards the cause."
joint_minister_finance_AUS: "Joint Minister of Finance"
#Navy
AUS_expand_the_marine_budget: "Expand the Marine Budget"
AUS_expand_the_marine_budget_desc: "Compared to our army, our navy has been neglected due to lack of funds. However, Archduke Franz Ferdinand has pushed for further naval expansion. In his name, our black and gold banner shall sail over the Adriatic once more!"
AUS_naval_technical_military_committee: "Naval Technical Military Committee"
AUS_naval_technical_military_committee_desc: ""
AUS_submarines_experiments: "Invest into the U-Boat Fleet"
AUS_submarines_experiments_desc: "Our industry may not have the capacity to produce capital ship after capital ship, but we may look no further than submarines—a cost-effective way to wreak havoc on all who oppose us at sea."
AUS_order_uboats_from_germany: "Order U-Boats from Germaniawerft"
AUS_order_uboats_from_germany_desc: ""
AUS_expand_tegetthof_class: "Finish the Tegetthof Dreadnoughts"
AUS_expand_tegetthof_class_desc: "It is not enough to build a battleship and call it a day. Our expansion of our naval industry marks the beginnings of a new Kriegsmarine, forged in the Adriatic, more than capable of standing up to our enemies."
AUS_improved_naval_guns: "Skoda Naval Guns"
AUS_improved_naval_guns_desc: ""
AUS_naval_expansion_program: "Naval Expansion Program"
AUS_naval_expansion_program_desc: ""
AUS_begin_new_dreadnought_constructions: "Begin New Dreadnought Constructions"
AUS_begin_new_dreadnought_constructions_desc: ""
AUS_naval_excercises: "Prepare Naval Strikes"
AUS_naval_excercises_desc: "Sailors of the Austro-Hungarian Navy must be seaworthy and well-trained. We shall perform exercises in the Adriatic to ensure they are perfectly equipped to serve in our new Kriegsmarine."
AUS_new_naval_officers: "Promote New Naval Officers"
AUS_new_naval_officers_desc: ""
#Airforce
AUS_reorganise_the_luftfahrtruppen: "Reorganize the Luftfahrtruppen"
AUS_reorganise_the_luftfahrtruppen_desc: "With war looming, our glorious Imperial Army and Navy will not be enough to defend ourselves from the threats abound. We must take to the skies to ensure victory in the name of our Emperor."
AUS_seaplane_experimentation: "Seaplane Experimentation"
AUS_seaplane_experimentation_desc: ""
AUS_form_kuk_seeflugwesen: "Form K.u.K. Seeflugwesen"
AUS_form_kuk_seeflugwesen_desc: "The Navy is demanding a separate and well-funded new branch of military. Well-funded, we cannot promise, but a new separate branch certainly. Uzelac has already approved this demand, so we shall immediately begin constructing coastal airfields and delving deeper into research of aircraft specialized in naval support. The Entente aircraft have cost us enough damage already; adapting to these new ways of warfare might be just what we need to swat all those flies over the western front."
AUS_airship_studies: "Airship Studies"
AUS_airship_studies_desc: "Ever since the Körting disaster, our airships haven't been mentioned in Cisleithania. Considering the event, it is no wonder the topic is a touchy one. But emotion should not get ahead of ourselves, as dominant control over the skies hasn't been achieved yet. Conservative minds on our command think it will be a bad idea to give up on airships and demand that we double down on our previous airship efforts."
AUS_prepare_the_great_war_of_sky: "Prepare for the Great War of Sky"
AUS_prepare_the_great_war_of_sky_desc: "With vast advancements in military technology, it is clear that the next Great War will take place not just on land and sea, but in the clouds. We must prepare ourselves to take part in this ultimate battle."
AUS_abandon_airships: "New Course in Aviation"
AUS_abandon_airships_desc: "It is hard to deny that this is an attempt at saving grace, but it is still a fact—we have to abandon our airship program. Our production is abysmal, and the only change in aviation is when we have to retire some ancient member of the fleet. We shouldn't be bothered by these events, but march bravely forward and use this moment to catch up as much as we can with other great powers in aviation. Instead of outdated airships, we will kickstart production of still-new airplanes."
AUS_kuk_luftfahrtruppen_expansion: "Expand Luftfahrtruppen"
AUS_kuk_luftfahrtruppen_expansion_desc: "The Great War has started, and our air force is dwarfed by every single great power. Although we don't act like it, further funding in aviation is urgent. Reliance on German aviation seems to grow, as few of our aircraft are demanded everywhere. With few additional airfields, more funds for research, and more officers being sent to fill their corps, hopefully the Empire's aviation shall regain its ground."
#useable loc idk  desc nothing more tho AUS_finance_osterreichische_aviatik_desc: "In order to build up our armada of the skies, we must turn to private arms companies to help. With the assistance of Österreichische Aviatik, we will create an air fleet never seen before."
AUS_our_own_fighters: "Our Own Fighters"
