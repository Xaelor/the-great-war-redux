ww1_austriahungary_war.68.t: "Bolshevik Revolution Sends Shockwaves in the Empire"
ww1_austriahungary_war.68.d: "The news of Russian workers overthrowing their government is leading to a massive surge in energy amongst Austrian workers who similarly feel oppressed by the government. Many workers in war industries are openly supportive of the Russian struggle and are organizing together to try and force more demands on the authorities to improve their conditions. We should be cautious."
ww1_austriahungary_war.68.a: "The red fever is spreading!"
