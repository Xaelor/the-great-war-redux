ww1_austriahungary.225.t: "Formation of The German Peoples Liberal Party"
ww1_austriahungary.225.d: "Our coalition with parts of the Deutscher Nationalverband has always been one of pure necessity. While Bienerth's economic and social agenda aligns a fair amount with the Liberal elements of the Deutscher Nationalverband, Bienerth has often butted heads with the Nationalists, who tend to be obstructionist and opposed to many of Bienerths reforms. By successfully convincing Liberals in the Deutscher Nationalverband that Bienerth is friendly enough to their agenda, many liberal parties in the coalition have agreed to split off from the nationalists and form their own liberal group. This group is expected to be much easier to appease and have their support of the government more firmly entrenched"
ww1_austriahungary.225.a: "Awesome"
