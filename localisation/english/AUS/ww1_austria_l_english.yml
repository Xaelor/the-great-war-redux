ww1_austriahungary_war.79.d: "Austrians are suffering from the realities of war which have crushed the economy. Although we're limited in what we can actually do; we're already spending drastically beyond our means to continue the war, we can at least give the people hope. New ministries, such as the ministry of sanitary and health, the ministry of food security, and more will be formed by Emperor Karl as soon as possible. Although these ministries are not going to be doing anything new, the creation of them should give us good press for a few weeks and inspire hope amongst the people."
ww1_austriahungary_war.79.a: "Nice"
