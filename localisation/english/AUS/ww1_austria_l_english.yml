ww1_austriahungary.272.t: "Austria Proposes Joint Government Bodies"
ww1_austriahungary.272.d: "Austria has proposed a, quite shocking offer: they want to unite governments: joint parliament, army; everything. This of course, means the end for Hungarian autonomy and maybe some dreams of independance: nobody would accept this."
ww1_austriahungary.272.a: "Hell no!"
ww1_austriahungary.273.t: "Hungary Rejects Joint Governmental Bodies Reform"
ww1_austriahungary.273.d: "Suprisingly, the Hungarians didn't feel like giving us their country just yet. This setback is only a small blow to us and our dreams of a better and more United Austria."
AUS_joint_fakeout: "We will prpose things like a national §YPrime Minister§! and §YLegislative Body.§! The result of these reforms would effectively §Gunite§! §YAustria§! and §YHungary§! completely. §RThis would clearly erode Hungarian independence§!"
AUS_joint_mil_budget_shi: "We will demand the §qmilitary§! budget process be turned into a single vote amongst both the members of the Austrian §YImperial Council§! and Hungarian §YNational Assembly.§! It will make it §Gsignificantly§! easier to raise the military budget, effectively making this the only way to unlock the national focus §YAmbitious Budget§!" 
ww1_austriahungary.273.a: "We must come back to this idea, then"
AUS_prep_coup: "We will prepare to rapidly shake up the §YHungarian§! government to §Rparalyze§! it as we rush through reforms to crush §YHungarian§! power in the empire. It will almost certainly lead to a §Rrevolt§! but if our startegy is successful a paralyzed §YHungary§! should be too weak to stop our §qmilitary§! from quickly crushing resistance.\n\nHalves the time and cost of £decision_icon_small §YDecisions§! to negotiate minority support in a §YHungarian§! §Rrevolt§!"
