AUS_centralization_and_discipline: "Centralization and Discipline"
AUS_centralization_and_discipline_desc: "Due to foolish mistakes of our predecessors many laws have been softened, producing worrisome lack of discipline among almost all sectors of society. Besides that, focus must be brought to centralization which has been decreasing for a while now. We have been off the course, so further centralization of the state and discipline of its men is urgent!"
AUS_automatic_prop.tt2: "This mission will subtract §Y25§! £pol_power §YPolitical Power§! every §Y30 days§! and grant us the effects of the £decision_icon_small Decision §YCool Tensions With Slavs§! in return, effectively automizing the decision for you. If your §YPolitical Power§! falls below §Y25§!, the mission will be canceled and this decision will be re-enabled, with an event notifying you of it."
AUS_stabilization_effort.tt: "This mission will subtract §Y[?AUS_cost_for_stabilization_effort_decision]§! £pol_power §YPolitical Power§! every §Y[?AUS_days_for_stabilization_effort_decision|0] days§! and grant us the effects of the £decision_icon_small Decision §YStabilization Effort in Slavic Territories§! in return, effectively automizing the decision for you. If your §YPolitical Power§! falls below §Y[?AUS_cost_for_stabilization_effort_decision]§!, the mission will be canceled and this decision will be re-enabled, with an event notifying you of it."
AUS_gui_explain_stuff.tt: "§LThe Imperial Council mechanic effects the national spirit 'Imperial Council', with it's effects depending on who controls the Imperial Council, the influence of the Imperial Council, and the Minister-President's relations with the Imperial Council. The modifiers are calculated with the following equations:\n\nPolitical Power Gain and Political Advisor Cost: 0.04 x influence x relations\n\nIf the Imperial Council is dominated by the Christlichsoziale Partei, Daily Authoritarian Support will be added with the formula 0.016 x influence.\n\nIf the Imperial Council is dominated by the Deutscher Nationalverband, Daily Democracy Support will be added with the formula 0.016 x influence. A cap on the total loyalty of minorities will be added, if relations with the Imperial Council are positive then the minimum loyalty of minorities will be increased using the formula = influence x 8 + 10, while if relations are negative then the maximum loyalty of minorities will be reduced with the formula 100 - influence x 8.\n\nIf the Sozialdemokratische Arbeiterpartei dominates the Imperial Council, Daily Democracy Support will be added with the formula 0.025 x influence. Stability will be added with the formula 0.025 x influence x relations. Consumer Goods Factories factor will be added with the formula influence x 0.04§!"
AUS_ic_lib.tt: "The §YImperial Council§! is currently dominated by the §mDeutscher§! §NNationalverband§!\n§LThe Deutscher Nationalverband, or the German National Association is a collection of liberal and nationalist groups in Bohemia and Austria. It's members generally agree that reform is needed in the empire, with the party pushing for a comprehensive solution to solve Bohemian-German tensions.§!"
AUS_ic_socdem.tt: "The §YImperial Council§! is currently dominated by the §lSozialdemokratische§! §SArbeiterpartei§! \n§LThe Sozialdemokratische Arbeiterpartei is a democratic socialist group that combined with social democrat parties in different regions of Cisleithania, have finally reached a majority in parliament. The social democrats support new vast welfare programs and are divided on how to handle ethnic minorities in the empire§!"
