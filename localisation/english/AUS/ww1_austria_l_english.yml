AUS_minorities_ukrs: "§YRuthenians§!"
AUS_minorities_ukrs_delay_tt: "§LThe §!§YRuthenians§!§L, mostly located in §YEastern Galicia§! and the northeastern counties of the Hungarian Crown, are a Slavic, predominantly agrarian and Greek Catholic people. In Galicia and Lodomeria, they compete politically and culturally with the Polish elite, seeking schools and offices in their own tongue. In Hungary, their position is weaker still under Magyar administration.§!"
