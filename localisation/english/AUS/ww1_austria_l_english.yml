AUS_guy_makes_better: "Having §YCount Alois von Aehrenthal§! as an advisor will make this decision's £pol_power §YPolitical Power Cost§! and £time_texticon §YDays Until Removed§! §GHalved§!"
AUS_if_pp_ever_75: "Our £pol_power §YPolitical Power§! will never be able to fall below §Y-50§! as long as we are not at war."
AUS_the_counterweight_to_serbia: "The Counterweight to Serbia"
AUS_the_counterweight_to_serbia_desc: "In order to weaken Serbian influence, we will support the Tsar of Bulgaria in his war against the Serbian-Greek Coalition. This, in turn, should provide us a stronger foothold in the Balkans."
