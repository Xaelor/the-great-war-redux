#wartime events ww1_austria_hungary_war
ww1_austriahungary_war.1.t: "Political Parties Agree to Truce"
ww1_austriahungary_war.1.d: "Austrian politics have seen a great battle between the three major coalition groups in the Imperial Council. Yet, today the social democrats, social christians, and German nationalists have all agreed to put their differences aside, for now, and collaborate on the war effort. Worth noting, is that many Social Democrat politicians are at best shaky in their support for the war, and we risk a revolt in the party if things last longer then expected. Still, the agreement between the three parties to not fight eachother during the war should help our domestic political situation greatly."
ww1_austriahungary_war.1.a: "This conflict is above petty political disputes!"
ww1_austriahungary_war.2.t: "The Military Oversight Department"
ww1_austriahungary_war.2.d: "To ensure the civilian government is effectively implementing measures to strengthen the war effort, in particular regarding offenses such as high treason, capital offenses against members of the military, desertion, and disturbing the peace, the Military Oversight Department has begun exercising increased power in ministries such as the Ministry of Education, Finance, Justice, and more. Military-approved figures are being stacked on the boards, increasingly interfering with the usual processes of these ministries to instead focus on the priorities of the military."
ww1_austriahungary_war.2.a: "The civilian administration must cede power in this crucial hour!"
ww1_austriahungary_war.3.t: "Mass Growth of the Military Bureaucracy"
ww1_austriahungary_war.3.d: "The war has required a large increase in the size of all departments revolving around military and wartime affairs, unfortunately at a pace much faster than we expected. The sheer scale of growth in the military-related bureaucracy is requiring the seizure of local hotels in the area to house workers. Luckily, renovations to existing departments are underway to massively expand their size."
ww1_austriahungary_war.3.a: "The scale of growth here is extraordinary!"
ww1_austriahungary_war.4.t: "Drumhead Trials"
ww1_austriahungary_war.4.d: "The state of war requires grand efficiency in our court system to quickly prosecute lawbreakers and secure the war effort. To prevent backlogs and quickly punish traitors, a system of trials requiring a final verdict within 72 hours has been implemented, allowing us to rapidly serve out punishments. Unfortunately, the quick time requirements do limit just how extensive our investigations into accused crimes can be, and may lead to some falsely accused suspects still facing punishment. Yet this is a sacrifice we must make for the war effort."
ww1_austriahungary_war.4.a: "We must quickly dish out punishments to traitors!"
ww1_austriahungary_war.5.t: "The Punitive Expedition"
ww1_austriahungary_war.5.d: "Serbia's gone unpunished for their role in spreading unrest in our Balkan territories for far too long, and now the time has come to finally get revenge. Serbia, being a weak and young nation, should be easy pickings for our grand army. The orders from the high command are clear: we must overwhelm the Serbs with our much larger and up-to-date army and crush them!"
ww1_austriahungary_war.5.a: "They'll regret ever messing with us!"
ww1_austriahungary_war.6.t: "Humiliation in Serbia"
ww1_austriahungary_war.6.d: "Somehow, the tiny Serbian nation still stands nearly six months after the beginning of the war. Our operations have failed to meet their objectives in our worst-case scenario timeframe, clearly as a result of the incompetence of the general in charge of the operation. We must shake things up, starting by firing everyone in charge of this disaster."
ww1_austriahungary_war.6.a: "What a screw-up!"
ww1_austriahungary_war.7.t: "Preparing the Nis Declaration"
ww1_austriahungary_war.7.d: "We've survived an onslaught from Austria-Hungary for months now, against the predictions of many. With our impressive performance, we must now prepare to take the next step in declaring our intentions for the future of Austria-Hungary's Balkan territories after our inevitable victory."
ww1_austriahungary_war.7.a: "What are our options?"
ww1_austriahungary_war.8.t: "The Nis Declaration"
ww1_austriahungary_war.8.d: "Serbia has just published the Nis Declaration, officially pushing for the unification of our southern territories with the Serbian state, which is to be reformed into a state for all Southern Slavs. While we're trying to suppress its message as much as possible, the news is still reaching the south, which has unfortunately raised the spirits of the rebellious sector of the Slavic population, who will undoubtedly step up their sabotage efforts."
ww1_austriahungary_war.8.a: "Suppress it as much as possible!"
ww1_austriahungary_war.9.t: "Formation of the Polish Supreme Committee"
ww1_austriahungary_war.9.d: "Polish political parties, together with some collaborators in Russian Poland, have formed the Polish Supreme Committe, a body intended to help govern a future autonomous Polish state in the Hasburg realm. In addition, they've began organizing legions of Polish volunteers to assist in the fight. They will undoubtedly provide our cause much legitimacy amongst the Poles, and their military units should provide us notable support."
ww1_austriahungary_war.9.a: "We will liberate Poland together!"
ww1_austriahungary_war.10.t: "Trial of Ferdinand's Assassins"
ww1_austriahungary_war.10.d: "The men implicated in the assassination of Franz Ferdinand, who were quickly captured after the tragic event, have finally had their day in court. The three main perpetrators were sentenced to twenty years of hard imprisonment, aggravated by a monthly fast and, on June 28th of each year, by solitary confinement in a dark cell. In addition, there was one life sentence and five death sentences, carried out by hanging."
ww1_austriahungary_war.10.a: "Justice has been served!"
ww1_austriahungary_war.12.t: "Special Status for Dalmatia"
ww1_austriahungary_war.12.d: "Dalmatia is home to many south slavs, of which the government in Vienna is deeply skeptical of. Worried about Serbian attempts to stir unrest in the region as well as slavic organization attempts to infiltrate the region. To ensure things are under control, the military has convinced the emperor to sign a special decree on the status of Dalmatia, allowing the military the right to implement a curfew, bypass some civil rights, and racially profile Slavic citizens. Its hoped that this will ensure stability in the southern region of the empire."
ww1_austriahungary_war.12.a: "We can't take any chances here"
ww1_austriahungary_war.13.t: "Trade from the Adriatic Cutoff"
ww1_austriahungary_war.13.d: "The British, utilizing the royal navy, have implemented a total blockade on us and the Germans, attempting to starve us into submission. With the naval forces of the Central Powers being greatly outclassed by the Entente, we have little hope at contesting this blockade. Unfortunately, shortaged are inevitably going to develop. Hopefully, through strict rationing, and creative repurposes of goods, we can make this blockade hurt less."
ww1_austriahungary_war.13.a: "The people must tighten their belts"
ww1_austriahungary_war.14.t: "Pacifists Attempt to Spread Their Message"
ww1_austriahungary_war.14.d: "Pacifist groups and writers such as Alfred Fried, the League of Women's Association, the BÖFV Peace Committee, and more have been shocked by the outbreak of the war and are deeply concerned about the inevitable slaughter of young Austrian boys in a war they see as unnecessary. Already, rallies for peace are being prepared, while writers publish their manifestos against war and for peace. We will likely need to deal with these groups somehow."
ww1_austriahungary_war.14.a: "Their messages are nice, but delusional"
ww1_austriahungary_war.15.t: "The BOFV Peace Committee and the League of Women's Association Rally For Peace"
ww1_austriahungary_war.15.d: "Leading pacifist women have organized a large rally in Vienna, protesting the draft and militarism in general, demanding peace as soon as possible. They speak messages of hopeful optimism for a pacifist future which would allow all peoples to thrive in harmony and prosperity—a message that many dismiss as delusional but some cling to."
ww1_austriahungary_war.15.a: "They don't understand how the real world works"
ww1_austriahungary_war.16.t: "Alfred Fried Ceases Publications"
ww1_austriahungary_war.16.d: "Alfred Fried, leader of the Austrian Peace Society, has essentially capitulated to Austria's new anti-pacifist laws. In his last publication, he wrote: 'For decades we have been carrying out dedicated work to achieve this goal, gladly devoting our energies to it. We can say with a clear conscience that we have done our duty. We have not suffered a defeat, as our opponents triumphantly claim.' There's no other way to read it: Fried is throwing in the towel, giving his readers one last message. Although many of his allies are likely to try and continue peace actions, with many of his friends fleeing to Switzerland, this is a major win for us."
ww1_austriahungary_war.16.a: "He's made the right choice"
ww1_austriahungary_war.17.t: "Collapse of the BOFV Peace Committee"
ww1_austriahungary_war.17.d: "Marianne Hainisch, writing in Der Bund, the BOFV's magazine, has declared the organization 'is deeply shocked and deplores the war, which affects us terribly, but must acknowledge we can do nothing about it. It would be a betrayal of the fatherland and the men defending it if we were now to advocate peace.' With this, another enemy of the war effort has capitulated."
ww1_austriahungary_war.17.a: "She understands the gravity of the situation!"
ww1_austriahungary_war.18.t: "Women's Peace Groups Rapidly Capitulate"
ww1_austriahungary_war.18.d: "Following the fall of the BOFV, the Women's Social Democrat organization, the Catholic Women's Organization of Lower Austria, and the Reich Organization of Austrian Housewives have all abandoned their previous advocacy for peace, instead supporting the war effort. Many of their members seem to be genuinely convinced by war propaganda, while others simply realize the reality of the situation and want to maintain some control over the public narrative."
ww1_austriahungary_war.18.a: "We welcome their support!"
ww1_austriahungary_war.19.t: "The Frauen-Hilfsaktion im Kriege"
ww1_austriahungary_war.19.d: "The Frauen-Hilfsaktion im Kriege, or the Women's War Aid Action, has been formed by merging several women's associations, the majority of which previously were pro-pacifist, to now support the war. They have condemned peace groups, vowed to cut contact with pro-pacifist women's groups domestic and abroad, and have declared their intentions to support the war effort where possible."
ww1_austriahungary_war.19.a: "All Austrian women should take inspiration from these patriots!"
AUS_rubber_supply: "Rubber Supply"
AUS_rubber_supply_desc: "Our rubber supply is running out!"
AUS_lead_supply: "Lead Supply"
AUS_lead_supply_desc: "Our lead supply is running out!"
AUS_iron_supply: "Iron Supply"
AUS_iron_supply_desc: "Our iron supply is running out!"
ww1_austriahungary_war.25.t: "Banning of Luxury Goods"
ww1_austriahungary_war.25.d: "While our financial state isn't unhealthy yet, the war is certainly having its cost. To ensure our citizens are not wasting money, we will ban the import of luxury goods. This will help control inflation slightly by decreasing spending while ensuring our citizens have money saved up if the war continues for a significant period."
ww1_austriahungary_war.25.a: "Who needs these anyway?"
ww1_austriahungary_war.26.t: "Cuts to Civilian Spending"
ww1_austriahungary_war.26.d: "To save money for the war, cuts to civilian spending have been approved through a decree. It will decrease funding for several welfare programs and civilian investments such as housing programs."
ww1_austriahungary_war.26.a: "Unfortunate, but necessary"
ww1_austriahungary_war.27.t: "War Profits Tax"
ww1_austriahungary_war.27.d: "To raise money for the war, the government has approved a new tax on companies perceived to be profiting from the war without providing enough benefit to the war effort."
ww1_austriahungary_war.27.a: "Natural to tax them"
ww1_austriahungary_war.28.t: "Raising Income Taxes"
ww1_austriahungary_war.28.d: "Unfortunately, Austria's war spending is spiraling, and we need to fund the war with revenue from our citizens. The income tax, being the most effective route, has been hiked through a decree."
ww1_austriahungary_war.28.a: "We need to get our war spending under control!"
ww1_austriahungary_war.29.t: "Raising the Tobacco Tax"
ww1_austriahungary_war.29.d: "Tobacco is widely consumed by all in our empire, and with our deficits spiraling, we need to increase the tax on it. By doing so, we can raise crucial revenue for the war effort."
ww1_austriahungary_war.29.a: "Better this than economic collapse"
ww1_austriahungary_war.30.t: "Taxes on Alcohol"
ww1_austriahungary_war.30.d: "Alcohol presents a great opportunity to try and get our deficits under control, with higher consumption taxes on it unlikely to harm the overall economy too much while giving us more revenue. Thus, higher taxes on alcohol have been approved."
ww1_austriahungary_war.30.a: "Maybe more of our people will get sober"
ww1_austriahungary_war.31.t: "Taxation of Gambling"
ww1_austriahungary_war.31.d: "Continuing the trend of raising sin and consumption taxes, taxes on gambling have been dramatically increased to try and raise funds for the war."
ww1_austriahungary_war.31.a: "We're running out of taxes!"
ww1_austriahungary_war.32.t: "Taxing Flint, Match, and Steel"
ww1_austriahungary_war.32.d: "An effective way to raise revenue is by taxing flint, match, and steel. Unfortunately, making these goods more expensive on the market will likely hinder our war industry, but our financial state is so poor we have no other choice."
ww1_austriahungary_war.32.a: "Let's hope this doesn't hurt too much"
ww1_austriahungary_war.33.t: "Taxes on Coal"
ww1_austriahungary_war.33.d: "To raise more funds, we will tax the consumption of all coal. It's a last resort tax, likely to hurt our industry and our people, but these are desperate times."
ww1_austriahungary_war.33.a: "We're running out of measures!"
ww1_austriahungary_war.34.t: "Hiking all Civilian Taxes"
ww1_austriahungary_war.34.d: "Our finances are in an extremely dire state, so we'll have to take desperate measures. Wine and sugar taxes, sin taxes, income and land taxes—all of them are being raised. This is going to hurt our civilian population greatly, but we have no other choice."
ww1_austriahungary_war.34.a: "We can't survive like this!"
ww1_austriahungary_war.35.t: "Direct Taxes on the War Industry"
ww1_austriahungary_war.35.d: "Obviously our last resort, we've begun directly taxing the war industry. Our production is surely going to be hit hard, but we have no good options in these times."
ww1_austriahungary_war.35.a: "We're taxing everything at this point!"
ww1_austriahungary_war.36.t: "Food Situation Gradually Worsening"
ww1_austriahungary_war.36.d: "As the war drags on, our production of food is continuously declining. Already strained before the war, our agricultural industry is being crippled by the lack of imports for tools and fertilizers needed for agriculture, the mass food needs of the military, and the drafting of rural farmers. As this war continues to drag on longer than we expected, our agricultural industry will continue to decline."
ww1_austriahungary_war.36.a: "Then we will need stricter measures"
ww1_austriahungary_war.37.t: "Rising Black Market"
ww1_austriahungary_war.37.d: "As we set price caps for food, many producers are starting to avoid selling their goods to the state, instead going underground. The black market is proving to be much more profitable for food producers due to it being unrestrained from government price controls. As business goes underground, our economy is losing revenue, and our food distribution efforts are becoming less effective."
ww1_austriahungary_war.37.a: "We need to combat this as much as possible!"
ww1_austriahungary_war.38.t: "Flawed Food Distribution"
ww1_austriahungary_war.38.d: "Our state distribution of grain is proving to have many flaws, with corruption, logistical issues, and outright neglect from officials in charge of the program leading to more rural and isolated communities having much worse experiences with state distribution than the wealthy and urban citizens. Rural citizens are seeing delays and shortages, stirring discontent with the system."
ww1_austriahungary_war.38.a: "Who cares about them?"
ww1_austriahungary_war.39.t: "Conscription of Farmers Reducing Agricultural Production"
ww1_austriahungary_war.39.d: "Across the Empire, agricultural output has been decreasing due to the conscription of farmers and farm laborers, leading to a drop in the production of grains and other agricultural products. This has been worsened further by our granting of draft exemptions to many industrial workers, causing farmers to be disproportionately conscripted."
ww1_austriahungary_war.39.a: "Who will work the fields?"
ww1_austriahungary_war.40.t: "Russian Invasion Damages East Galician Agriculture"
ww1_austriahungary_war.40.d: "The Russian invasion in East Galicia has caused significant disruption to agriculture in the region, with food production dropping significantly due to many farms being damaged or destroyed."
ww1_austriahungary_war.40.a: "Damn them!"
ww1_austriahungary_war.41.t: "Russian Invasion Damages West Galician Agriculture"
ww1_austriahungary_war.41.d: "The Russian invasion in West Galicia has caused significant disruption to agriculture in the region, with food production dropping significantly due to many farms being damaged or destroyed."
ww1_austriahungary.247.t: "War Requirements Act Comes Into Effect"
ww1_austriahungary.247.d: "Hear ye, Hear ye. Oyez, oyez, it has come: the time for citizens to surrender their military-capable equipment such as trucks, weaponry, and send them over to the frontlines. It is also time for the state to control the factories!"
ww1_austriahungary.247.a: "That was cringe"
ww1_austriahungary_war.42.t: "Civilian Governments Lose Independence"
ww1_austriahungary_war.42.d: "Mayors, governors, and parliament members have seen their powers confiscated as the Armeeoberkommer­ando ramps up their demands to elected officials. They're demanding specific persecutions, new laws, and militaristic agendas for their states. It's proving to be frustrating and unpopular amongst many in the civilian government, who see the military as disrespectful and ignorant."
ww1_austriahungary_war.42.a: "They need to relinquish full control for now"
ww1_austriahungary_war.43.t: "Military Seizes Equipment From Civilians"
ww1_austriahungary_war.43.d: "Military governors, with no approval from civilian governments, have begun going door to door to civilian populations, taking their weapons for the army and the war effort. They're taking civilian guns and in some cases their vehicles too, angering civilian populations but brutally putting down any resistance."
ww1_austriahungary_war.43.a: "Is this really necessary?"
ww1_austriahungary_war.44.t: "First Food Riots"
ww1_austriahungary_war.44.d: "Food instability is starting to rise greatly in the empire as the war continues. With our efforts to control food shortages failing, people are taking to radical measures, smashing windows in shops, looting, and even rioting. The state of the streets is unacceptable, and we must try and address the cause of this wave of unrest in any way possible."
ww1_austriahungary_war.44.a: "We need peace on the streets!"
ww1_austriahungary_war.44.b: "The military will deal with these threats"
ww1_austriahungary_war.45.t: "Monthly Press Conferences"
ww1_austriahungary_war.45.d: "Part of the newly constructed media strategy of the military has included a highly controlled monthly press conference to try and spin the war in the most positive way possible. All reporters there will be very carefully vetted, with said reporters only being allowed to ask state approved questions with pre prepared answers. If successful, we should be able to convince most of the population we are winning, as long as people actually pay attention to them."
ww1_austriahungary_war.45.a: "Perfect!"
ww1_austriahungary_war.46.t: "Social Democrats Rewrite Party Manifesto"
ww1_austriahungary_war.46.d: "In a strong show of support for the war, the social democrats have rewritten their pacifist party manifesto to be explicitly pro war, endorsing Austria Hungary's right to defend itself from aggression from the world and denouncing those who wish to undermine the unity of Austria Hungary. Although still including a call for peace as soon as possible as well as maximizing civil liberties, the pro war manifesto is proving to be deeply controversial in the party, with the left flank such as Friedrich Adler refusing to support the war and radicalizing"
ww1_austriahungary_war.46.a: "How long can leftist unity last?"
ww1_austriahungary_war.48.t: "Decline of the Social Democrats"
ww1_austriahungary_war.48.d: "As the social democrats pursue a pro war course, the party is seeing a decline especially in youth membership. This is likely as pacifists and radical leftists are losing faith and support for the party that is seen as upholding the increasingly authoritarian state as well as a decline in living quality."
ww1_austriahungary_war.48.a: "The left radicalizing is no good for us"
ww1_austriahungary_war.49.t: "Friedrich Adler Murders [AUS_GetMinisterPresident]"
ww1_austriahungary_war.49.d: "The Social Democrats have been for the last 2 years supporting the war effort of the autocrat [AUS_GetMinisterPresident] in a complete betrayal of everything the social democrat movement is supposed to stand for. Friedrich Adler, one of the leaders of the left in the Social Democrats, has been agitating for the last 2 years against this policy. With the party refusing to reform, however, he's resorted to extreme measures. Sneaking into the dining hall of the hotel [AUS_GetMinisterPresident] was staying at, he pulled out a pistol and shot the man 3 times, then uttering the words 'Down with absolutism, we want peace!' before waiting for the police to arrive to let himself to be peacefully arrested.\n\nHis murder is undoubtedly going to shock the nation and shakeup the government, which may have to reform its measures to avoid continued leftist unrest. Time will tell how this great gambit from Adler pays off."
ww1_austriahungary_war.49.a: "Oh my!"
ww1_austriahungary_war.50.t: "The Hateful Society of Assassins"
ww1_austriahungary_war.50.d: "The military has already been filled to the brim with anti-Serb thinkers who view Serbia and the Serbian people as the greatest enemy of Austria; undoubtedly, they feel vindicated due to recent events. The high command in charge of operations in Serbia have explicitly told its soldiers that the Serbian people should be viewed as a 'hateful society of assassins,' and kind and humane treatment towards them is not appropriate conduct for an Austrian soldier."
ww1_austriahungary_war.50.a: "Let's hope they don't do anything insane..."
ww1_austriahungary_war.51.t: "Mass Atrocities Against Bosnian Serbs"
ww1_austriahungary_war.51.d: "As Austrian troops flood into Bosnia to invade Serbia proper, mass atrocities are being committed against local Serbian populations. Mass expulsions are being ordered by the military, with Serbians having everything they own stolen, and thousands of deaths occurring from violent incidents. Unfortunately for the Serbian people, the actions are being endorsed from the top down, and they're likely to see no relief from these horrific actions."
ww1_austriahungary_war.51.a: "Are the entire Serbian people really our enemy?"
ww1_austriahungary_war.52.t: "Collective Punishment"
ww1_austriahungary_war.52.d: "Serbs are being rounded up and arrested without trial or interrogation on charges of being spies. If any Serbians attempt to flee the approaching Austrian soldiers, they risk being murdered in horrific ways, with recorded incidents of Serbians being burnt alive. Some commanders in charge of troops in Bosnia and occupied lands in Serbia have written appeals to the higher command, seeing the actions as sickening and a violation of international humanitarian standards and agreements. Yet their appeals are failing to see any real change implemented, as the higher-ups continue to give a de jure command of following humanitarian standards while doing nothing to address the de facto policies actually on the ground."
ww1_austriahungary_war.52.a: "Are we the bad guys?"
ww1_austriahungary_war.53.t: "Mass Looting in Serbia"
ww1_austriahungary_war.53.d: "As we advance into Serbia, our troops are completely looting Serbia, stealing whatever they can and burning what they don't want. This comes both as the army faces shortages and needs resources, as well as the army already having a hatred of Serbs and having no problem with seeing the citizens suffer."
ww1_austriahungary_war.53.a: "Well, our army needs supplies somehow"
ww1_austriahungary_war.54.t: "Croat Support For the Empire Surges on Italian Entry to War"
ww1_austriahungary_war.54.d: "Croat support for the empire has always been quite shaky, as Hungarian actions have often come at their expense, while many Croats sympathize with the ideals of a South Slavic state. Yet the entry of Italy into the war has massively rallied Croat support for the monarchy. The Croats view Italy as an imperial force seeking to subjugate them under an iron fist. At least under Austro-Hungarian rule, they have a serious degree of autonomy with future prospects for even more. Under Italy, they would lose all of this."
ww1_austriahungary_war.54.a: "They finally appreciate us!"
ww1_austriahungary_war.55.t: "Germany Wants a Separate Peace with Serbia"
ww1_austriahungary_war.55.d: "The entry of Italy into the war against us, the failure of a quick victory over France, and the continued existence of Serbia has led Germany to see the continuation of the Balkan front as a waste of resources. They wish to see a separate peace with Serbia, where we would allow them to unite with Montenegro and annex part of northern Albania, and in exchange they would commit to close political ties to us and Germany, helping root out pan-Slavic groups in the empire. It would be part of a great German ambition in the Balkans to settle disputes between Bulgaria, Romania, and Greece, appeasing all three countries and drawing the entire Balkans into an alliance."
ww1_austriahungary_war.55.a: "This is a complete non-starter; object!"
ww1_austriahungary_war.55.b: "Let us take the prospect seriously"
ww1_austriahungary_war.56.t: "A Separate Peace with Serbia?"
ww1_austriahungary_war.56.d: "The entry of Italy into the war against us, the failure of a quick victory over France, and the continued existence of Serbia means the continuation of the Balkan front is a waste of resources. Many in the government want us to seek a separate peace deal with Serbia, where we would allow them to unite with Montenegro and annex part of northern Albania, and in exchange they would commit to close political ties to us and Austria-Hungary, helping root out pan-Slavic groups in their empire. It would be part of a greater ambition in the Balkans to settle disputes between Bulgaria, Romania, and Greece, appeasing all three countries and drawing the entire Balkans into an alliance."
ww1_austriahungary_war.56.a: "Let us flirt with the idea to Austria"
ww1_austriahungary_war.56.b: "Reject these ideas; Serbia must completely surrender"
ww1_austriahungary_war.57.t: "Germany Seeks Seperate Peace With Serbia"
ww1_austriahungary_war.57.d: "The entry of Italy into the war against us, the failure of a quick victory over France, and the continued existence of Serbia has led Germany to see the continuation of the Balkan front as a waste of resources. They wish to see a separate peace with Serbia, where we would allow them to unite with Montenegro and annex part of northern Albania, and in exchange they would commit to close political ties to us and Germany, helping root out pan-Slavic groups in the empire. It would be part of a great German ambition in the Balkans to settle disputes between Bulgaria, Romania, and Greece, appeasing all three countries and drawing the entire Balkans into an alliance.\n\nThe Austrians have already refused this idea, and our government is generally aligned. Although we don't wish to see Serbian annexations, allowing Serbia to strengthen itself and have too much autonomy would be a betrayal of the entire reason we started the war."
ww1_austriahungary_war.57.a: "Let us condemn this"
ww1_austriahungary_war.58.t: "Austria-Hungary Refuses Separate Peace Idea"
ww1_austriahungary_war.58.d: "Both the Austrian and Hungarian governments have refused our idea of a separate peace with Germany, reacting with a surprising level of anger. Many in the Austrian and Hungarian governments see our idea of a separate peace as a complete betrayal to them. Frustratingly, our attempts to get a clear idea of what they would want from a peace deal are being replied to with vague concepts, meaning the Austrians don't truly have a plan and thus we can't negotiate in any capacity."
ww1_austriahungary_war.58.a: "Our allies are morons, but they are our morons..."
