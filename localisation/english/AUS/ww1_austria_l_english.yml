ww1_austriahungary.271.t: "Hungarian Revolt"
ww1_austriahungary.271.d: "The Hungarians have took to the streets with their weapons and pikes as Ferdinand recently tried to quickly introduce game changing laws that the Hugnarians didn't particularly seem to appreciate."
ww1_austriahungary.271.a: "They will feel the wrath of Austria"
