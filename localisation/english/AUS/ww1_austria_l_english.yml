ww1_austriahungary.179.d: "A local concentrated community of Jews in our empire have had enough of antisemitic policy and culture in Austria, packing their bags to leave somewhere else. This is likely to open up some jobs for locals in the region, although the loss of a generally more educated and skilled group will hurt the local economy. "
