AUH_great_war_bullshit_desc: "Our economy is not built for a long-lasting war of attrition. As this Great War goes on, our economy may buckle under the weight of itself.\n\nThe current £consumer_goods_texticon §NIntensity of Food Shortages§! are: [AUS_food_shortage_intensity] ([?AUS_intensity_of_food_shortages]) \n§LAs food prices increase, the people will get angrier. This cumulates in subtracting 1 loyalty from every minority group for every 5% increase to nominal food price increases.§!"
