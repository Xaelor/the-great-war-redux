ww1_austriahungary_war.73.t: "SDAPO Takes Over the Peace Movement"
ww1_austriahungary_war.77.t: "Imperial Council Agrees to be Suspended"
ww1_austriahungary_war.77.d: "The nations currently in the ultimate conflict, a fight that will decide the world order for the next 100 years. We do not have time to distract ourselves from this fight to discuss silly things like which province needs an investment in its roads. To ensure the nation is focused on the war effort, the Minister President has been granted massive powers over the governance of Austria, and the Imperial Council has agreed to essentially entrust the Minister President's judgement until the war is over. Working with the emperor, the Imperial Council will be dismissed through consitutional means, until the war is over."
ww1_austriahungary_war.77.a: "We need governance simple, for now"
ww1_austriahungary_war.73.d: "The SDAPO, whos party agreed at the start of the war to help the government, still has credibility amongst the workers. The rising strike and peace movement has grown much faster then radical socialists can control, and thus the SDAPO has managed to take over movement by having it organize behind their existing unions. This will expand the scope of the peace movement, but should actually help us. With moderates in charge, negotiating an end to the strikes should be much easier then it would be under radicals. Massive strikes are expected soon, but we may be able to negotiate an end to them without actually giving up that much."
ww1_austriahungary_war.73.a: "I suppose it is the least bad scenario"
ww1_austriahungary_war.74.t: "Massive Strikes Across the Nation"
ww1_austriahungary_war.74.d: "As labor has radicalized in the last few weeks, across the nation mass strikes have began everywhere. They're demanding peace and better working conditions such as more oversight for their saftey and shorter hours. Luckily, the SDAPO is behind much of these strikes, and have already worked out an agreement with our government to bring these to a close. Soon, we should be able to end these strikes although we'll have to make some minor concessions."
ww1_austriahungary_war.74.a: "Lets prepare our announcement"
ww1_austriahungary_war.75.t: "Strikes Come to an End"
ww1_austriahungary_war.76.t: "Failed Sailors Revolt"
ww1_austriahungary_war.76.d: "In our main fleet, sailors inspired by recent unrest from the peace movement have attempted their own mutiny. They raised red flags and demanded the government accept an immediate peace deal without annexations as well as socialist reforms in the economy. They also demanded democratization of the government and the end of war time oppression of civil liberties. Unfortunately for them their mutiny quickly fell apart, as army officals surrounded the boats and striking crew members forced leaders of the strikes to give up."
ww1_austriahungary_war.76.a: "We will have them executed!"
ww1_austriahungary_war.75.d: "We've agreed to the striker demands to pledge to seek peace as soon as possible and to make minor reforms to work places, such as reducing the role of the military in policing workers and giving workers slightly less hours. With this, the SDAPO has convinced unions to vote to end their strikes, bringing the nation back to peace."
ww1_austriahungary_war.75.a: "Yet more strikes could explode at any moment"
AUS_spado_help_strikes: "Massive strikes for peace and labor reforms will be organized within weeks. We will ensure the §SSDAPO§! will take the leading role in the strikes, who will work behind the scenes with our government to craft an agreement between the workers and the government that is as §Gfriendly§! to the government as possible."
AUS_annexation_of_bosnia_desc: "In 1908, Austria officially annexed Bosnia and Herzegovina into its empire, after de facto occupying it from the Ottoman Empire since 1878."
