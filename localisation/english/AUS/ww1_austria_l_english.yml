AUS_camarilla_introduction: "The conservative §qCamarilla§! surrounding Franz Joseph are eager to see our government replaced as soon as possible. Although Franz Joseph isn't receptive to their demands yet, if we try anything that could be viewed as a fundemental threat to Austrian national security, he will surely wish to replace us. This is tracked by the variable §YCamarilla sway over the Emperor,§! which starts at §Y1.§! Getting above §Y5§! will result in the Emperor demanding the §YMinister President§! resign, and appointing a conservative autocrat to the position."
