ww1_austriahungary_war.67.t: "The New Culture Around the Monarchy"
ww1_austriahungary_war.67.d: "Karl's father was a very traditional and serious man. Business around imperial affairs was treated of the upmost formality, people would not dare to let their guard down around the emperor. Karl is much different, shaking the hands of ordinary people, bowing before others, and allowing people around him to generally act much more formally, instead of enforcing the traditional treatment of the royal family. Karl is proving to be much more popular and personable amongst the average citizen, although some old nobles see Karl as degrading the authority and respect of the monarchy.ww1_austriahungary_war.67.t"
ww1_austriahungary_war.67.a: "Its time to stop living in the past"
