AUS_disrupt_the_right_desc: "Regionalist parties in the Imperial Council are increasingly obstructive and destructive to our empire. We need to combat the influence of these parties, both fighting their tactics in parliament and strangling their support amongst the people."
AUS_the_poison_of_nationalism: "Ameliorate the Poison of Nationalism"
AUS_the_poison_of_nationalism_desc: "Nationalism is milk and honey to illiterate, pretentious folk of the little nations to the southeast of our Empire. They are unaware of the complexities and nuances of achieving peace and prosperity instead of air-headed expansionism under quasi-historical claims. The same mindset is unfortunately found in the minds of many ethnic minority groups inside our borders. We cannot influence foreign nationals much, but our own people have to be reached out to. This commonfold's nationalism must be explained as short-sighted thought for the sake of their own lives' betterment."
