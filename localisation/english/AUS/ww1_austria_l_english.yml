ww1_franz_austria_rework.5.t: "[BOS.GetLeader] invites Franz Ferdinand to Sarajevo"
ww1_franz_austria_rework.5.d: "[BOS.GetLeader], a good friend of Ferdinand, has invited him and his wife Sophie to Sarajevo. Ever since the scandals surrounding Ferdinand and Sophie's marriage in 1900, they have been working to repair their public image in order to make it easier for Ferdinand to ascend the throne. [BOS.GetLeader], a military general and current Governor of the Condominium, invited them to Sarajevo, part of a land that has been more recently been integrated in the Austrian realm.\nSophie doesn't get invited to many places with Ferdinand, as she is not allowed to accompany the royal during ceremonies due to her 'lower royal status' with the exception of those where Ferdinand is invited as a military commander. This event is perfect for a stepping stool for the re-establishment of the royal couple."
ww1_franz_austria_rework.5.a: "Franz Ferdinand will attend"
ww1_franz_austria_rework.5.b: "Actually, he's feeling sick..."

ww1_franz_austria_rework.6.t: "Oskar Potiorek Assassinated!"
ww1_franz_austria_rework.6.d: "During ceremonies in Sarajevo, an assassin bombed Oskar Potiorek's car which resulted in his death. The assassin heard about rumors that Franz Ferdinand, the heir to the throne of Austria, would be visiting at this date, but alas, it seemed like killing Potiorek was the best course of action in order to accomplish his goal of terrorism.\n\nThe assassin was apprehended immediately by the guards, which it was revealed that he was a Serb nationalist and a member of Young Bosnia."
ww1_franz_austria_rework.6.a: "Serbia will pay for this!"

ww1_franz_austria_rework.7.t: "Austrian General Murdered in Sarajevo!"
ww1_franz_austria_rework.7.d: "Oskar Potiorek, a simp for Franz Ferdinand, a military general and the governor of the condominium of Bosnia and Herzegovina, has been assassinated by a member of Young Bosnia, Nedeljko Čabrinović, a Bosnian Serb terrorist-nationalist. Officials claim that his intended target was Franz Ferdinand, who was rumored to visit Sarajevo during the ceremonies, but he didn't show up.\n\nOskar's last words to the security before being exploded were reportedly: \"Do you think Sarajevo is full of assassins?\"."
ww1_franz_austria_rework.7.a: "Sources say Potiorek is stable. Please God"

ww1_franzferdinand.3.d2: "Bosnian governor to Austria-Hungary, Oskar Potiorek, was assassinated with a bomb during a day of festivities. He was bombed in his car and died a few minutes later due to concussions and remaining grenade fragments in his body."


ww1_franzferdinand.2.d2: "Austria has sent the Serbian government a series of demands after Nedeljko Čabrinović, who bombed and assassinated Oskar Potiorek, implicated us. These demands would render us little more than a puppet state. Thankfully, the Russians and French are backing us up to completely deny any compensation to those old Habsburgs at all. What we do here could change the world. What is your response?"




## tutorial
austria_tutorial.exit: "I got it from here"
austria_tutorial.go_back: "Go back"
austria_tutorial.1.t: "Austria Guides"
austria_tutorial.1.d: "Austria is a nation with many paths and mechanics, here you'll find explanations to all of them to ensure your going in knowing what your doing. Simply select what mechanic you would like to learn more about."
austria_tutorial.1.a: "Main mechanic"
austria_tutorial.1.b: "Bienerth mechanic"

# Main Mechanics
austria_tutorial.2.t: "Austria Mechanics"
austria_tutorial.2.d: "Austria has two overarching mechanics, §CMinority Loyalty§! and The §CImperial Council§!.\n\nMinority loyalty, as the name suggests, represents how loyal minorities are to the empire. These effect your national spirit §CState of the Monarchy.§! Your average loyalty effects §CPolitical Power§! and §CStability§! given by the national spirit. Higher average loyalty gives buffs while lower average minority gives debuffs. The Bohemian modifier will affect industrial modifiers provided by the national spirit and the eastern minorities will affect your consumer goods factors provided by your national spirits - the higher the relations the better.\n\nThe §CImperial Council§! mechanic has its effects added in the §CImperial Council§! national spirit. Having high §CRelations with the Imperial Council§! will provide buffs while low relations with the imperial council will provide debuffs. The extent of these buffs or debuffs is determined by the §CInfluence§! of the Imperial council - a Imperial Council with lower influence won't provide strong debuffs or buffs."
austria_tutorial.2.a: "Noted"

# Bienerth Mechanics
austria_tutorial.3.t: "Bienerth Mechanics"
austria_tutorial.3.d: "So, you want to know more about Bienerth. Bienerth, at game start, is Minister-President. His main mechanic is parliamentary mandates: you can exchange parliamentary mandates for a focus in his tree, for example; 'Set Up Programs for Small Farmers'. Some focuses require more than one, as they represent big changes in result of reforms by Bienerth's government.\n\nIn the Bienerth tree, you can form a coalition between the CSP, local parties, and DNV. This coalition, if won (conditions for win are indicated on the focus 'Propose a Moderate Electoral Alliance') This path is the reformist Austria path: and you have to prevent your coalition falling apart by reaching a certain focus and you have the option to release yourself as Austrian Bohemia."
austria_tutorial.3.a: "Certainly the best path"

