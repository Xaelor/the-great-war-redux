ww1_austriahungary.191.t: "Ruthenian-Jewish Electoral Alliance Formed"
ww1_austriahungary.191.d: "On both the national and local stage, Ruthenians and Jews have agreed to vote for their respective canidates in competitive elections where only one of their canidates has a realistic shot at winning, hoping that combining their votes can increase their influence in parliament, which is currently very low compared to the proportion of their population in the empire. Their low representation is at the gain of the Poles, who despite making up much less population percentage, dominate in the local Galacian diet and have more seats in the Imperial Council, due to unrfavorable laws for Ruthenian peasants favoring the richer land owning Polish class."
