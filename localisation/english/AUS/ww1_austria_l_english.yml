ww1_austriahungary.192.t: "Poles Prepare Extremely Aggressive Electoral Campaign"
ww1_austriahungary.192.d: "As Ruthenians and Jews organize attempting to challenge Polish domination of the Galacian Diet, the Poles are not taking their efforts lightly. Brutal methods are being deployed, such as violent responses to electoral campaigns by Ruthenians and Jews, and Polish groups planning to outright stop Ruthenians from voting through voter intimidation. Unfortunately, due to a lack of oversight in the east, nothing can likely be done to stop the Poles from taking these actions, meaning the elections are likely to be far from fair."
ww1_austriahungary.192.a: "They're the rich ones anyways. Just look the other way."
