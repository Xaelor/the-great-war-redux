ww1_austriahungary.190.t: "Tensions in the Galician Diet"
ww1_austriahungary.190.d: "As the nation wide elections conclude, elections in Galicia have been held at the same time for the local diet, with Poles, despite making up only 45% of the population, dominating over 80% of the seats in the local diet through the formation of the Polish Club. Ruthenian and Jewish parties, despite making up the majority of the population, have been left with a pathetic combined total of under 20% of the seats in the Galician diet combined. This is due to the curial system, which favors richer land owning voters over peasants, which make up an overwhelming percentage of the Ruthenian population. As if things wern't already stacked against the Ruthenians, Poles have also been reported violently intimidating Ruthenian voters, with one report saying they outright massacred unarmed civilians in Drohobych. With this very disproportionate representation, as well as events in Drohobych, tensions between Poles and Ruthenians, already high, will continue to get worse."
ww1_austriahungary.190.a: "The Ruthenians must work within the system!"
ww1_austriahungary.190.b: "We need to promise an investigation in Drohobych!"
