 ##############
 # FOCUS TREE #
 ##############

 canadian_focus: "Canadian Focus Tree"
 # Laurier Tree #
 CAN_continue_lauriers_leadership: "Continue Laurier's Premiership" 
 CAN_continue_lauriers_leadership_desc: "Since 1896, Sir Wilfrid Laurier has led our nation through thick and thin. From the Manitoba Schools Question to the Alaska Border Dispute, Laurier has been cool headed and open to compromise, giving him the nickname 'The Great Conciliator'"
 CAN_fight_for_fishing_rights_in_the_atlantic: "Fishing Rights in the Atlantic"
 CAN_fight_for_fishing_rights_in_the_atlantic_desc: ""
 CAN_ford_motors_dupont: "Ford Motors Dupont"
 CAN_ford_motors_dupont_desc: "Ford Motors already has some presence in Canada, namely their Walkerville factory, however there are plans for a second plant in Dupont. This could be an excellent source of jobs and could show Washington that we are willing to work with American companies."
 CAN_subsidize_local_motor_companies: "Subsidze Local Motor Companies"
 CAN_subsidize_local_motor_companies_desc: "The Americans have recently offered us a free trade agreement, but we know that this of course would favour them and not be beneficial for us. Instead we should subsidize local companies to protect our markets and to strengthen our domestic producers."
 CAN_reciprocity_trade_agreement: "Reciprocity Trade Agreement"
 CAN_reciprocity_trade_agreement_desc: "It is time for something Liberal policy has been after ever since the formation of the party, the freeing of trade. While the Conservatives hide behind their 'National Policy', as the old saying goes: 'The Freer the Market, the Freer the People' and it simply makes logical sense for the first target of our freer trade be our neighbour to the south, who happens to be the world's largest creditor."
 CAN_back_off_free_trade: "Tackle the Trade Deficit"
 CAN_back_off_free_trade_desc: "While we wish to form a comprehensible trade agreement with the United States, it simply would anger the industrialists of our nation. While the farmers who make up the backbone of our support out west will certainly be upset, it is not worth potentially losing voters in Ontario and Quebec."
 CAN_continue_economic_growth_of_the_praries: "Continue Economic Growth of the Prairies"
 CAN_continue_economic_growth_of_the_praries_desc: "The Prairies are growing rapidly with the influx of immigrants coming to the lands ready for farming. We should relax immigration laws to keep up the growth of the economy and the influx of migrants there."
 CAN_restrict_immigration: "Restrict Immigration"
 CAN_restrict_immigration_desc: "There are too many people immigrating to Canada. With the Immigration Act of [GetYear], we can control and regulate the flow of undesirable immigrants into Canada."
 CAN_support_merge_of_shell_companies: "Support Merge of Shell Companies"
 CAN_support_merge_of_shell_companies_desc: ""
 CAN_explosives_limited: "The Canadian Explosives Company"
 CAN_explosives_limited_desc: "Several companies specializing in munitions and explosives have come together to form the Canadian Explosives Company, by encouraging this merger we will certainly gain a major supplier if a war were to break out"
 CAN_a_winning_economy: "Preventing Monopolistic Capitalism"
 CAN_a_winning_economy_desc: ""
 CAN_canadian_steel_foundries: "Canadian Steel Foundries"
 CAN_canadian_steel_foundries_desc: "Steel is an essential part of the economy and in recent years it has begun to grow even more. And to continue this growth, new steel foundries will be opened in Quebec, mainly in and around Montreal."
 CAN_form_dome_mines: "Form Dome Mines"
 CAN_form_dome_mines_desc: "Canada is a nation of gold, that is made evident with the gold rushes of the Fraser, Klondlike, and Cariboo. And now another gold rush has begun in the north of Ontario, the Porcupine Gold Rush. Now with hundreds of people swarming in to make their fortune, perhaps the gold will benefit the nation as well."
 CAN_shell_oil: "Shell Oil"
 CAN_shell_oil_desc: "The Royal Dutch Shell Group has been eyeing Canada as a potential home for their next subsidiary, Shell Canada. This raises an opportunity for us to exploit the potential oil that we have."
 CAN_export_newspaper_materials: "Export Newspaper Materials"
 CAN_export_newspaper_materials_desc: ""
 CAN_new_shell_factories: "New Shell Factories"
 CAN_new_shell_factories_desc: "Canada is lacking a major arms industry and it has begun to show, we cannot rely on Britain forever and thus we must supervise the creation of new munitions factories."
 CAN_dominion_park_branch: "Dominion Parks Branch"
 CAN_dominion_park_branch_desc: "There are many beautiful landscapes in our country that we must protect and preserve for future generations, so we will create a branch of the federal government meant to protect natural and cultural resources. In effect we will create the world's first national parks system."
 CAN_telegraph_expansion: "Telegragh and Telephone Expansion"
 CAN_telegraph_expansion_desc: "Although much of the country is connected with telegraphs and telephones, not everywhere is. This is a concern and we must connect these communities with the rest of the country."
 CAN_new_building_techniques: "New Building Techniques"
 CAN_new_building_techniques_desc: "Our building techniques have fallen behind the Americans and Brits, as such we must modernize them in order to not only provide homes for our people, but also to improve our infrastructure as well."
 CAN_canadian_north_pacific_railway: "Canadian Northern Pacific Railway"
 CAN_canadian_north_pacific_railway_desc: "The Canadian Northern Pacific Railway is the final part of our new transcontinental railway that will reach from Quebec City to Vancouver as another option other than the Canada Pacific Railway."

 # Post-1911 Tree #
 CAN_election_of_1911: "General Election of 1911"
 CAN_election_of_1911_desc: "The time has come for another election to determine the leader of our country into the 1910s, will 15 years of Liberal rule come to an end? Or will Borden once again be defeated by Laurier?"
 CAN_liberal_victory_1911: "The Grits Hold On!"
 CAN_liberal_victory_1911_desc: "Following an intense back and forth campaign, the people have reelected the Liberals and Sir Wilfrid Laurier. Laurier has proven to the people that he has more to give the country and that his mandate shall carry on!"
 CAN_conservative_victory_1911: "The Triumphant Tories!"
 CAN_conservative_victory_1911_desc: "The Conservatives have gained the upper hand and have gotten elected into the Premiership. Robert Borden has represented what the people truely want: Canadianism over Continentalism!"
 CAN_fund_paper_mills: "Fund Papermaking"
 CAN_fund_paper_mills_desc: "Canada has large forests with plenty of wood to exploit for numerous things, such as paper. Paper is a necessity for newspapers, books, letters and more. Funding its production would get us a lot of revenue and profit."
 CAN_army_reorganization: "Militia Reorganization"
 CAN_army_reorganization_desc: "Canada does not have an army, at least not officially. Offically there is a Militia, but the Militia isn't one united force, there is the Active Militia which is a more professional force and the Non-Permanent Active Militia which is a reserve force."
 CAN_liberal_army: "Frederick Borden's Militia Reforms"
 CAN_liberal_army_desc: "Frederick Borden, cousin of the Leader of the Opposition Robert Borden, has been Minister of the Militia for the Laurier administration for 15 years and he still needs to implement the reforms he wishes to. To transform the militia to a professional army will be no easy task but this transformation is necessary in case of a war."
 CAN_conservative_army: "Sam Hughes' Militia Reforms"
 CAN_conservative_army_desc: "The new Minister of Militia for the Conservative government is Samuel Hughes, a man who believes in the supremacy of the Non-Permanent Militia over the Permanent Militia. If Canada wishes to have a respectable army, we will need to transform the militia to a true fighting force."
 CAN_swiss_inspiration: "The Swiss Inspiration"
 CAN_swiss_inspiration_desc: "Switzerland has an admirable system, citizen militias are how we should do it here in Canada. Although critics say that a system like the Swiss is not realistic for a more individualist nation like Canada, we will never know if we never try to implement it."

 # Great War Tree #
 CAN_king_and_country: "For King And Country!"
 CAN_king_and_country_desc: "Europe has been engulfed in war, and the Empire has been involved. Although some would like it another way, Britian's war is Canada's war. And thus we must send out a call to all young, able men across the country to rally to defend King and Country."
 CAN_victory_loan: "Victory Loans"
 CAN_victory_loan_desc: "War is expensive and we need a way to pay for it, many have called for 'Victory Loans' as a way for our citizens to support the war effort. Of course, the average citizen will not be willing to give out of simple patriotism, instead we must incentivize them to use these loans by promising them that we will pay the loans back with interest after the war is over and the economy returns to normal."
 CAN_the_new_war: "The New War"
 CAN_the_new_war_desc: "This war is unlike any other that we have seen before and our soldiers are not ready for it, this is a major problem and we must solve it somehow. Our commanders must learn to adapt to these new conditions and they must make sure that our men also adapt."
 CAN_trench_raids: "Trench Raids"
 CAN_trench_raids_desc: "A new strategy has been developed by our officers, they have realized that although trench warfare prevents traditional assaults from their usual effectiveness, night raids could confuse and disorient the enemy allowing us to later use that confusion in future."
 CAN_study_gas_warfare: "Study Gas Warfare"
 CAN_study_gas_warfare_desc: "Poison gas has been used on our lines before and we must ensure that we are prepared in case that happens again, masks will be necessary to protect our soldiers and our own gas weapons will be helpful for repelling our enemies."
 CAN_Brunitels_Brigade: "Bruintel's Brigade"
 CAN_Brunitels_Brigade_desc: "Brigader General Raymond Bruintel has proposed the creation of an armoured car brigade. This new brigade could be used as mobile machine gun nests that will allow our forces to be more flexible while on the battlefield."
 CAN_cycle_corps: "The Gas-Pipe Cavalry"
 CAN_cycle_corps_desc: "Although Britain has had cyclist battalions within their mobile infantry since 1908, we have been reluctent to introduce them ourselves. However, the new battlefield has proven that although cyclists would most likely not far very well on the frontlines, they can be incredibly valuable for reconnaissance where they would be able to travel at greater speeds than soldiers on foot but quieter than cavalry."
 CAN_promote_currie: "Promote Currie"
 CAN_promote_currie_desc: "Arthur Currie is nothing short of a military genius, although he began his days teaching and leading an unsuccessful real estate company in Victoria, his true gift is in the planning and leading of offensives. He has drawn influence from both French and British staff work and has been highly successful where he is deployed, it only makes sense for him to lead the entirety of the Canadian Corps."
 CAN_war_of_artillery: "A War of Artillery"
 CAN_war_of_artillery_desc: "It would be a very understandable mistake to view the Great War as nothing more than a war of men, but that is not the case. The war has been a war of artillery, whoever has the more sophisticated artillery has always had a clear advantage over their foes. This is a fact we must keep in mind and base our Corps on."
 CAN_survey_land: "Survey the Land"
 CAN_survey_land_desc: "As the offensives grow larger in scale, we must understand what exactly we are up against, as such more emphasis will be put on proper reconnaissance and ensuring that every soldier knows where he is going. General Currie has made it paramount to provide every soldier with a map of the battlefield, this will improve coordination and ensure that every man knows where the objectives are."
 CAN_staff_work: "Extensive Staff Work"
 CAN_staff_work_desc: "The success of a battle is not only decided by the vigor of the men, but also by how prepared the officers leading them are. Only through extensive staff work will every officer know what to do in battle. Every man should know the chain of command and the duties of the rank above him, this will make sure that if a commanding officer is shot down in battle, somebody is able to replace them and continue the fight."
 CAN_creeping_barrage: "Creeping Barrage"
 CAN_creeping_barrage_desc: "The creeping barrage is one of General Currie's key creations. The main idea is for artillery to fire ahead of advancing soldiers, this will allow for the men to reach enemy trenches before the enemy can react. Although this is a difficult strategy to pull of, if done correctly it is key to a successful offensive."
 CAN_armoured_warfare: "Armoured Warfare"
 CAN_armoured_warfare_desc: "A new creation is reaching the battlefield, the tank! This provides a turning point in the war, these armoured vehicles cause terror and fear in enemy soldiers, and they are almost completely bulletproof. We would be foolish to not utilize them to support our infantry."
 CAN_stormtroopers: "Stormtroopers"
 CAN_stormtroopers_desc: "Canadians have earned a reputation on the frontline, whereever the Canadian Corps finds itself, rumors of offensives circulate. Our men have become the shock troops of the Empire and have even been given a name by the Germans: 'Strumtruppen'. This shall become a moment of pride for our forces: Stormtroopers indeed!"
 CAN_imperial_munitions_board: "Imperial Munitions Board"
 CAN_imperial_munitions_board_desc: "A new board has been created to be the sole purchasing agent that answers directly to the War Office. This Board has been created to prevent any potential war profiteering and to ensure that all munitions created in Canada are to the same standard as British munitions."
 CAN_crackdown_corruption: "Crackdown on Corruption"
 CAN_crackdown_corruption_desc: "The act of patronage has stained both the army and the economy and we must reverse this somehow. This corruption cannot stand lest we wish for our men to suffer overseas because of it."
 CAN_explosives_factories: "More Explosives Factories"
 CAN_explosives_factories_desc: "In order to prevent a shell shortage we must take the time to create more factories where explosives can be produced, this way we will be able to keep our artillery guns firing without the fear that they will run out of shells."
 CAN_increase_shell_production: "Increase Shell Production"
 CAN_increase_shell_production_desc: "Shells are still needed at the front and we must increase production. All factory lines will have to become more effecient in order to satisfy the needs of both our men and the entire Empire."
 CAN_expand_dominion_arms: "Expand Dominion Arms"
 CAN_expand_dominion_arms_desc: "Dominion Arms, formerly known as the Ross Rifle Company, is our chief supplier of infantry rifles. Supporting their expansion will allow them to create more rifles and allow us to equip our men. "
 CAN_replace_ross: "Replace the Ross Rifle"
 CAN_replace_ross_desc: "Although the Ross Rifle is a fine gun, it is simply not built for trench warfare. Indeed, the rifle is excellent for hunting, snipers, or for training purposes but it jams far too easily in muddy enviroments. Thus, we will officially replace it within our army with the Lee Enfield."
 CAN_develop_huot: "Develop the Huot"
 CAN_develop_huot_desc: "With the replacing of the Ross Rifle, there are many of them simply lying around. Quebec engineer Joseph Huot has developed a light machine gun that utilizes parts from the Ross. The Huot Automatic Rifle is a remarkable weapon as it fires from a 25 drum magazine, can fire over 21,000 rounds before wearing out, and can even continue firing after immersion. This weapon would be excellent on the battlefield and will prevent many rifles from getting scrapped."
 CAN_new_theatres: "The New Theatres"
 CAN_new_theatres_desc: "The theatres of sea and air are completely new to Canadian men. Many Canadians have never even been on the high seas let alone fought there, and the air war is new to all nations. Perhaps these new theatres will also be places where our men thrive."
 CAN_canadian_vickers: "Expand Canadian Vickers"
 CAN_canadian_vickers_desc: "Vickers already has a company here in Canada, Canadian Vickers. However it never had much responsibilty, until now. With the war starting up, the experts at Canadian Vickers can have their knowledge utilized to create our own aircraft and naval vessels."
 CAN_air_war: "The War in the Air"
 CAN_air_war_desc: "The Great War is now the first in history to have battles in the air. In order not to lag behind, we must create our own force to conquer the skies."
 CAN_royal_flying_corps: "The Royal Flying Corps"
 CAN_royal_flying_corps_desc: "Britain already has a flying corps, and many brave Canadians have joined it to take to the skies. But relying on Britian to win the air war is simply not in our spirit, we will create our own Canadian Royal Flying Corps to train even more brave Canadian men so they can soar side by side their Britisher kin."
 CAN_canadian_aeroplanes: "Canadian Aeroplanes"
 CAN_canadian_aeroplanes_desc: "To produce airplanes at home, we will need somebody who knows what they're doing. The Imperial Munitions Board will purchase the Curtiss aeroplane operation in Toronto and transform it into a facility to put build aircraft for the Flying Corps."
 CAN_flying_aces: "Flying Aces"
 CAN_flying_aces_desc: "Several Canadians have proven themselves in the battles of the sky and they deserve to be recognized for their bravery. We will use them as examples for both future pilots and for war propaganda puroposes."
 CAN_naval_war: "The War at Sea"
 CAN_naval_war_desc: "With the Royal Canadian Navy only existing since 1910, this is the first war where Canada has an opportunity to show that we are a naval power as well, although the navies of Britain, Germany, and France completely eclipse our fleet, we can use it to defend our shores from possible attacks."
 CAN_escort_convoys: "Convoy Escorts"
 CAN_escort_convoys_desc: "The war at sea is becoming a dangerous one, the possibliity of submarines sinking our ships while they make it to Europe is becoming more and more likely. We must use our fleet to protect our convoys from any and all submarine attacks."
 CAN_refit_civilian_vessels: "Refit Civilian Vessels"
 CAN_refit_civilian_vessels_desc: "We do not have the time to build a new fleet from scratch, but we can refit some civilian ships quite quickly. These newly refited ships will fill the holes of our fleet and make our navy a somewhat respectable one."
 CAN_naval_drifters: "Naval Drifters"
 CAN_naval_drifters_desc: "Naval drifters are cheap, wooden vessels created for anti submarine purposes. This boats will help us catch more submarines and they can be transformed into fishing boats after the war is over."
 CAN_naval_air_service: "The Naval Air Service"
 CAN_naval_air_service_desc: "With our navy and air corps showing proficency, it's time we take another page out of Britain's book and create a Naval Air Service for operations over the sea."
 CAN_minesweeper_trawlers: "Minesweeper Trawlers"
 CAN_minesweeper_trawlers_desc: "We can create ships to clear minefields and make them safer for other ships. These would be based off trawlers, their large nets will be able to grab the mines without causing any damage to the ship itself."
 CAN_barnet_yard: "Barnet Yard"
 CAN_barnet_yard_desc: "Many American submarine experts have arrived to Canada to create a secret facility in British Columbia, this facility will allow us to create submarines to the same quality as our American neighbours."
 CAN_submarines_for_uk: "Submarines for Britain"
 CAN_submarines_for_uk_desc: "Although Britain has the most powerful navy in the world, the Germans have them beat in the submarine war. Thus, we will construct several H class submarines to help them in their war beneath the seas."
 CAN_submarines_for_russia: "Submarines for Russia"
 CAN_submarines_for_russia_desc: "Our allies in Russia are looking for help with their naval projection, Canadian submarine facilities can help. The plan is to build the submarines in British Columbia, sail them across the Pacific, deconstruct them in Vladivostok, and send them across the Trans Siberian Railway. Then the Russian Navy can decide whether to send them to the Baltic or the Black Sea."

 # UNUSED #
 CAN_naval_services_act: "Naval Services Act"
 CAN_naval_services_act_desc: "Currently, our nation has no navy and relies on our overlord’s Royal Navy. The Naval Services Act intends to change this and provide us with our own separate naval force, that if needed could be placed under British command during wartime."

 CAN_hudson_bay_railway: "Hudson Bay Railway"
 CAN_hudson_bay_railway_desc: ""

