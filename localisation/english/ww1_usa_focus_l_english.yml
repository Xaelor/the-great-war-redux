USA_mom_and_pop_shops: "Department of Trust-Busting"
USA_mom_and_pop_shops_desc: "To hasten the breakup of trusts, a new "Department of Trust Busting" to streamline the process of breaking up monopolies would be appropriate. With this, we can have a whole section of the government dedicated to finding trusts and breaking them up, without having to wait for often lengthy supreme court cases."
