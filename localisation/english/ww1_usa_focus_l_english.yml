USA_wilsons_democratic_party_desc: "With the ascension of Wilson to the white house, many are expecting a new wave of progressive reforms. However, the Democratic Party is a diverse one, with many different ideologies that are not necessary as reformist as Wilson in it. Therefore, Wilson will have to play his cards at the right time to ensure the rest of the party votes on the most progressive of his agenda when needed.\n\nThis is represented by your level of §nCongressional Tolerance§! available at your use. With more congressional tolerance, Wilson can ensure his legislation is more widereaching and reformist, giving §Gbuffs§! to several §YNational Focuses§! and §YEvents§!. However, by passing legislation, Wilson §Rspend§! the tolerance that non-progressives in the Democratic Party have for our progressive agenda, represented by a reduction in our level of §nCongressional Tolerance§!. §nCongressional Tolerance§! is a relatively rare resource, so it's crucial that we save up high levels of §nCongressional Tolerance§! for only the most important looking bonuses.\n\nThe current level §nCongressional Tolerance§! is §Y[?USA_progressive_strength]§!\n\nAdditionally, we must manage the ideology of the administration. While a Progressive himself, Wilson does not voice the opinion of all Democrats. To ensure his administration is functional, Wilson will have to thread the needle between between §SProgressives§!, §YModerates§!, and §cConservatives§!. Depending on our picks in §YNational Focuses§!, §YEvents§!, and §YDecisions§!, our administration will shift towards different sides. Each side provides it's own §Gbenefits§!, §Yexclusive focuses§!, and §rmaluses§!.\n\nCurrently, the administration is [wilson_party_control]"
USA_midterms_wilson_desc: "While the §1Democrat Party§! has won the presidency with a strong majority in congress, if the §1Democrats§! fall out of favorbility by the next elections, they may end up losing their majority and thus have Wilsons' plans for domestic agenda made §RImpossible§!.\n\nAmerican midterms have historically favored the party not in office, so the §1Democrat Party§! will have to ensure they mantain popularity if they wish to break the usual cycle.\n\nThere are several factors that will play into the results of the 1914 midterms.\nThings that will §Gfavor§! §1Democrats§! include:\n-Passing §Cmajor§! pieces popular of legislation\n-Completing §Yinfrastructure§! related missions\n\nThings that will hurt §YWilson§! include:\n-Passing §RUnpopular§! pieces of legislation\n-Completing focuses that compromise American neutrality when having blow §Y50%§! War Support\nAccording to polling, if the midterms were held today, the results would be:"
