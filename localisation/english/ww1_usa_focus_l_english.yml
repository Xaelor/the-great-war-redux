USA_national_bank: "Bank of the United States"
USA_federal_reserve_desc: "The United States is notorious for its issue with banking panics causing havok on the economy. It's time to fix this issue with the federal reserve, which will guide the financial system by setting interest rates, managing the money supply, and regulating financial markets. It will, however, be somewhat privitized, ensuring it does whats best for the economy instead of petty politics."
