USA_annual_budget_act: "Comprehensive Federal Budget"
USA_annual_budget_act_desc: "The current budget process is a disorganized mess. Instead of one comprehensive federal budget, it is a series of budgets proposed by several different agencies. We will reform this system to instead be a single budget, written directly by the president."
