USA_the_5_precent_agreement: "The 5 Precent Agreement"
ww1_USA_roosevelt.6.t: "Towards a New America"
USA_8_hour_railway_work_week: "8 Hour Work Week for Railway Workers"
ww1_USA_roosevelt.5.t: "The First Meetings Begin"
ww1_USA_roosevelt.5.d: "With a tense atmosphere, Roosevelt and top GOP Republicans have offically entered discussions on reunification between the Progressive Party and the Republican Party. While discussions were as smooth as one could wish for at first, a major piece of contention has shown its self as a debate on the New Nationalist position of a national bank has been met with fierce resistance by Conservatives, who have said that abandoning this policy would be required to continue talks. In return, Conservatives have promised their full backing towards an 8 hour work week for railway workers, a central piece of Roosevelts agenda.\n\nWhile abandoning a national bank would not be ideal, Roosevelt has secured support for a federal reserve compromise, which would still hold immense regulatory power over private US banks. Although a vocal minority have began calling for Roosevelt to back out of talks, the choice ultimately rests with him only."
ww1_USA_roosevelt.5.a: "Well, They Did Offer Us A Concession in Return..."
ww1_USA_roosevelt.5.b: "What a Shame That These Talks Didn't Work"
 ww1_USA_roosevelt.6.t: "Conservatives Demand Responsible Government"
 ww1_USA_roosevelt.6.d: "While talks are nearing their conclusion, one final issue has erupted into a debate that could collapse talks. Whilst the New Nationalist Agenda calls for widespread expansion of the federal government in many areas, Conservatives have brought up worries about a federal defict spiraling out of control. Because of this, they have request we agree to a principal of "responsible governance", promising not to have a federal defict of above 5%. Whilst this isnt an issue for most of our agenda, social insurance is where this could be a problem. As an expensive program, we would probably have to abandon in to mantain a balanced budget.\n\nAlthough this is Conservatives last demand, a sizable amount of those in the coalition feel this is too much to give up, just to gain the support of regressives in the house."
for_the_stupid.tt: "After completing the focus §YPrinciple of Responsible Governance§!, we will not be able to take the focus §YSocial Insurance§!"
 ww1_USA_roosevelt.6.a: "Yeah Yeah Whatever"
 ww1_USA_roosevelt.6.b: "They Need Us More Then We Need Them"
ww1_USA_roosevelt.4.t: "Congressional Recalls Bill Fails in House"
ww1_USA_roosevelt.4.d: "President Roosevelts first major piece of legislation, the Congressional Recalls Bill, has faced a humiliating defeat as the vast majority of the house has voted against it, including several in the New Nationalist Coalition. While demoralizing for sure, Roosevelt has called this a "simple set back", promising several new reforms are "just around the corner. Either way, it looks the New Nationalist Coalitions chance at getting a fully progressive lead congress are doomed, as the new reality that the coalition will have to work with moderates sets it."
ww1_USA_roosevelt.4.a: "Well That's Unfortunate, to say the Least"
ww1_USA_roosevelt.2.t: "Moderates Oppose Recall Bill"
ww1_USA_roosevelt.2.d: "In a big blow to our attempts at congressional recalls, several moderate Democrat and Republican House members have refused to declare their support for the bill. Wary of the potential for political instability and abuse of the recall process, Moderates have raised concerns about the bill's possibility of allowing mass recalls of every House member just because the minority disagrees with them. While Roosevelt has stated he remains optimistic, most remain skepical of the ability for the bill to make it through this.\n\nThere is a... unconventional strategy being proposed by some in the New Nationalist Coalition, however, that proponents of claim could save the bill. Realizing those on the right would also oppose many moderates votes on certain bills, Secretary of State Garfield has privately proposed to Roosevelt that the coalition reach out to conservative Democrat and Republicans, stating that we could sway them in support of the bill hinting that many moderate Democrats and Republicans could instead be replaced with their members."
ww1_USA_roosevelt.2.a: "Garfield is Speaking Nonsense, we Will Push the Bill Through Without Reactionary Help."
ww1_USA_roosevelt.2.b: "We Need the Votes, Lets Quietly Reach Out."
ww1_USA_roosevelt.3.t: "The Right Refuses to Support Congressional Recalls"
 ww1_USA_roosevelt.3.d: "Secretary of State Garfield's efforts to forge a bipartisan coalition of solidly right wing and left wing members of congress to push through the Congressional Recalls Bill have been met with failure. Right-wing lawmakers, wary about potential challenges to their own incumbency, have remained steadfast in their opposition. With this embarrassing fail to construct a coalition to get the bill past, even Roosevelt has been forced to admit the bill is most likely not going to make it through, calling it a "great shame that congress refuses to strengthen democracy and increase the common mans say in congresses makeup.""
 ww1_USA_roosevelt.3.a: "Fools! Don't They Understand This Will Benefit Them?"
USA_senate_support_roosevelt.tt: "The §YSenate§! will §Gsupport§! our agenda! The §YHouse of Represenatives§! will have to be swayed through compromise and political maneuvering, however\n\nWe can see the current house factions in the §YDecisions§! tab"
ww1_USA_roosevelt.1.t: "The New Nationalist Coalition"
ww1_USA_roosevelt.1.d: "With a victory to the White House under a banner that's not Democrat or Republican, we do not have a clear base of support to rely on during voting. Roosevelt has been chagning this in the past few weeks however,with the formation of the "New Nationalist Coalition" in Congress. Comprising like-minded senators and House members, the coalition members will accept Hiram Johnson as their leader in congress, expected to follow his whip when needed.\n\nThe coalition have so far sucessfully secured a slim, but stable majority in the Senate, with 59 senators declaring their support for the New Nationalist caucus. On the other side of things, however, the New Nationalist Coalition has failed to gain any sort of majority in the House. With members of the house generally acting much more independent then the Senate, and house members still remembering the level of absolute control Cannon had as speaker, have proven much more reluctent to join any sort of organized caucus that is not their own parties congress. With this failure to gain a majority in the House, it is clear Roosevelt will have to negotiate and compromise if he wishes to be a productive president."
ww1_USA_roosevelt.1.a: "Nobody Said Governance Was Going to be Easy..."




wilson_minor_boost.tt: "§4Wilson§! will receive a minor boost in the §1Democratic§! primary!"
ww1_USA.96.t: "Thomas R. Marshall Offers to Be Wilsons VP"
ww1_USA.96.d: "With Clark disgraced in the eyes of many, Thomas Masrshall, a minor canidate from Indiana has offered to throw all his delegates behind Wilson in exchange for the VP support. With his relative popularity amongst the liberals, and his delegates desperately needed, it would be a no-brainer for wilson to accept his offer"
ww1_USA.96.a: "The Tides Have Rapidly Changed"
ww1_USA.95.t: "Clarks Tammy Hall Ties Revealed"
ww1_USA.95.d: "It seems Tammy Halls support for Clark has backfired as several party leaders have began to dig into Clarks corruption. With the backing of one of the most corrupt political forces in the country, numerous Democrats have denounced Clark and thrown their support behind Wilson. With a resurgence in Wilsons Campaign, it seems the primary is still anyones game."
ww1_USA.95.a: "Did Clark Just Screw Himself Over?"
wilson_moderate_boost.tt: "§4Wilson§! will receive a moderate boost in the §1Democratic§! primary!"
wilson_large_boost.tt: "§4Wilson§! will receive a large boost in the §1Democratic§! primary!"
