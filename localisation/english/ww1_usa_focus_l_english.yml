USA_progressive_concessions: "Widespread Concessions to Progressives"
USA_reconcile_progressives_strategy: "Taft's strategy will be to §7reconcile§! with §Yprogressives§! in the party, giving them government jobs and concessions on policy. This will make them more supportive of us, and could prevent the party from fracturing. However, it costs a lot of political power and may be §9too little too late§!, only serving to strengthen the influence of any potential §tprimary challengers§!"
USA_fuck_roosevelt: "Taft's strategy will be to §Rreduce§! the influence of §Yprogressives§! in the party, giving government positions to §Yconservatives§! and attempting to §tdiscredit§! Roosevelt. This will most likely enrage Roosevelt and other progressives, however if their influence is low enough we will surely survive any primary attempt, and they won't have the political clout to break off from the party. However, it may only §9embolden§! Roosevelt and only serve to make Taft look §tout of touch§!"
USA_tax_cuts_idea: "Tax Cuts"
tax_cuts.tt: "We will periodically recieve events about increased consumer activity. These can result in additional §GCivilian Factories§! and §GStability§!. However these tax cuts will not be cheap! Every tax quarter, the "§YIncreasing Financial Burden of Tax Cuts§!" mission will cost §Rmore and more political power§!."
USA_tax_cuts_and_jobs_act: "Tax Cuts and Jobs Act"
USA_tax_cuts_and_jobs_act_desc: "If we wish to invest in America, the easiest way would be to lower the property tax. This way, American citizens will have more money in their pockets, which will be invested into the economy. Americans know how to spend their money better then a Washington bureaucrat, after all."
army_fall.tt: "§RThe army may fall further behind.§!"
USA_neutrality_laws: "Neutrality Laws"
USA_neutrality_laws_desc: "The world is becoming scarier and scarier, with a Great War in Europe looking inevitable. We should not concern ourself with foreign affairs at all, instead focusing on developing America proper. To secure our neutrality, a law banning arms sales to belligerent nations is appropriate."
USA_fields_to_fortunes_fund: "The Hidden Riches of Rural America"
USA_fields_to_fortunes_fund_desc: "Rural America supplies our industries in the east with vital resources, but as the economy grows our need for these resources will too. With much of America unexplored, there's widespread potential resources we could find and use."
USA_in_the_land_of_cotton: "In the Land of Cotton"
