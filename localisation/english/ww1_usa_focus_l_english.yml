### roosevelt army
USA_orders_from_the_top_down: "Orders From the Top Down"
USA_orders_from_the_top_down_desc: "The way to win wars is through careful and thorough planning. Those at the top of the field are generally there for a reason, and we should heed to their advice. A system of obedience, thorough planning, and coherent organization is how we will win future wars."
USA_a_disciplined_army: "From The Books"
USA_keep_the_taxes_low_desc: "The government is going to need a slight expansion in revenue to cover for some of our more expensive reforms. We will set a low income tax at around 2% on those who can afford it, to ensure we don't squeeze Americans pockets thin, and encourage Americans to inject their money in the economy instead of the government."
USA_a_disciplined_army_desc: "We must ensure the American army is a professional and coherent one  one. A system of strict training and education will ensure every soldier can effectively stick to the plan instead of suffering from incohesion and confusion, even if not every recruitee can keep up with the standards. "
USA_establish_the_pentagon: "Establish the Pentagon"
USA_establish_the_pentagon_desc: "A central command center is crucial to any well structured army command. We shall begin construction of the Pentagon in D.C, where top generals will meet to dicuss and strategize. In addition, this base can be used to study enemy tactics and ensure we are ahead of them."
USA_fix_communication_issues: "Fix Communication Issues"
USA_fix_communication_issues_desc: "Soldiers are at their best when they are a coherent unit made up of thousands of their fellow comrades. We must ensure all soldiers can effectively communicate and cordinate with eachother and their officers, otherwise they will be easy picking for the unforgiving enemy."
USA_flexible_command_structure: "Flexible Command Structure"
flexible_command_structure.tt: "Add §YCentralized Army Command§!, which grants\nDivision Speed: §G+5.00%§!\nArmy Organization Factor: §R-5.00%§!"

USA_concessions_to_unions: "Concessions To Unions"
USA_concessions_to_unions_desc: "With one of the strongest bases of Roosevelts support comes from organized labour, a top priority of ours should be making sure they're happy. To ensure unions absolute support, we will strengthen the power of the Department of Labour, and encourage workers join unions. With this, we can secure unions support, and also ensure unions do not radicalize."
USA_8_hour_railway_work_week_bill: "8 Hour Workday for Rail Road Workers"
USA_policy_of_new_nationalism: "Policy of New Nationalism"
USA_policy_of_new_nationalism_desc: "Theodore Roosevelts main socioeconomic campaign promises were based on the idea of  "New Nationalism", advocating for increased government regulations, social welfare programs, and political reforms. As we have finally won the election, it's time we try to push through this legislation based on this policy"
10_prog_dems.tt: "We will lose the support of §Y10§! §lProgressive Democrats§! and §Y2§! §SProgressive Republican§! House members."
USA_james_wilson: "James Wilson"
USA_louis_brandeis: "Louis Brandeis"
USA_anti_german_politics: "Anti German Politics"
USA_anti_german_politics_desc: "As it stands, the greatest enemy of the United States is the German Empire. Long antagonizing us, the Germans have challenged our influence wherever possible, and have openly stated that do not respect us. As tensions in the world rise, we must ensure we are ready to tackle our future enemy."
cant_take_grand.tt: "When hired, the focus §YRoosevelts Grand Vision§! cannot be taken."
USA_infrastructure_investment_act: "Infrastructure Investments Act"
USA_infrastructure_investment_act_desc: "Much of America, particularly in the south, still relies on aged 19th century infrastructure. As a way to create jobs and make sure the south had the infrastructure needed for future industrial success, a small bill granting Mississippi and Arkansas some additional funding towards their infrastructure could go a long way for the region."
infra_eec: "Completing the focus "§YCentralization of Washingtons Finances§!" will §GImprove§! the effects of this Focus"
USA_farm_security_administration: "Support the Country Life Movement"
USA_farm_security_administration_desc: "Rural life has clearly fallen greatly behind those in urban areas. Those in the country life movement have noticed this, and encouraged the government to increase investments in rural American infrastructure. This seems logical enough, and thus we should go through with it."
USA_henry_stimson: "Henry Stimson"
USA_press_speaker: "Court the Fourth Estate"
USA_foster_flight_to_cities: "Foster Rural Flight to Cities"
USA_foster_flight_to_cities_desc: "While many in the country life movement complain that rural areas are declining in population areas are declining in population, this is not necessarily a bad thing. Urbanization is a natural thing in modern economies, and it's usually a good thing. We should encourage those on farms to seek out better lifes in factories."
USA_rural_price_controls_idea: "Agricultural Price Supports"
rr.tt: "Building up food surpluses will certainly come with §Gbenefits§! once the United States joins The Great War."
USA_aviation_service: "Aviation Service"
USA_subsidize_international_american_banking: "Subsidize International American Banking"
 USA_wilsons_annual_message: "Wilsons Annual Message"
USA_anti_corruption_campaign: "Dismantle the Corpocracy"
USA_child_labor_tax: "Child Labor Tax"
USA_the_final_nail_in_the_coffin_for_lobbyists: "The Final Nail in the Coffin for Lobbyists"
USA_the_final_nail_in_the_coffin_for_lobbyists_desc: "There appears to be a large loophole in anti lobbyists laws of the past which we need to adress. While corporations can't directly donate millions to canidates, they can support campaigns that encourage members of the public to pressure Members of Congress to support what benefits them. We shall pass a bill to ban this."
USA_anti_corruption_campaign_desc: "Past American administrations have often been corrupted to the core by corporate and lobbyist influences. Even the great Theodore Roosevelt was guilty of this, but we must be different. We shall not only refuse any corporate and lobbyist pressure, we shall outright begin an investigation to root out their influence in Congress."
USA_firmly_progressive_mission: "Progressive Fever Amongst The Administration"
USA_farm_loans_idea: "Farm Loans"
new_nationalism_railway: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y3.0%§!\nStability: §G+2.00%§!"

USA_liberty_bonds: "Liberty Bonds"
ww1_USA.163.t: "They Are Giving Their All, Will You Give Them Wheat?"
ww1_USA.163.d: "Many Americans think we are asking too much of them when we ask them to reduce their consumption of certain foods. We must ask them: do they realize what we are asking of the brave men who fight for democracy in the trenches? Compared to this task, simply eating a little less on some days should be no problem at all. Eating less means they have more, and they sure as hell need it. All Americans must do their part! Eat a little less, so our boys fighting for freedom can eat a little more!"
ww1_USA.163.a: "It's the most humble of requests"
