USA_roll_out_new_regulations: "Rollout New Regulations"
USA_roll_out_new_regulations_desc: "It's time to put the nail in the coffin for these unfair monopolies, who have dominated the market for far too long. By finalizing the anti monopoly laws, we can hopefully prevent the rise of any second standard oil or general electric company again, and ensure a truly free market for all. "
USA_goldilocks_and_the_three_trusts: "Roosevelts Great Vision"
USA_goldilocks_and_the_three_trusts_desc: "While many trusts are indeed inefficient, some trusts are generally good at what they do. While most progressives support the complete destruction of monopolies, Roosevelt is more pragmatic. Seeing some trusts as a good thing, Roosevelt will force the party to endorse his idea, breaking some trusts while leaving others alone. It may seem unfair, but its efficient, and that's capitalism for you!"
minimum_wage_pass.tt: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y+4.0%§!\nStability: §G+8.00%§!\nPolitical Power Gain: §G+5%§!\nFactory Output: §G+5.00%§!\nProduction Efficiency Growth: §G+5.00%§!"
strong_union.tt: "Modify §YNew Nationalism§! by:\nPolitical Power Gain: §G+5%§!\nFactory Output: §R-5.00%§!"
USA_unionization_of_suburbia: "Unionization of Suburbia"
USA_unionization_of_suburbia_desc: "American workers benefit greatly from unions. From higher pay, better retirement plans, and better living standards, its clear unions are a necessity in the work place. With their support secured, we should look into covertly spreading union membership into the suburbs, where unions have struggled to garner support in the past. "
unionization.tt: "Modify §YNew Nationalism§! by:\nPolitical Power Gain: §G+2%§!\nFactory Output: §G+2.00%§!\nConstruction Speed: §R-2.00%§!"
unionization_focus.tt: "When decision is taken:\nModify §YNew Nationalism§! by:\nPolitical Power Gain: §G+2%§!\nFactory Output: §G+2.00%§!\nConstruction Speed: §R-2.00%§!"
out_with_old.tt: "Modify §YNew Nationalism§! by:\nConstruction Speed: §G+8.00%§!"
out_with_old_dec.tt: "Modify §YNew Nationalism§! by:\nConstruction Speed: §G+1.00%§!"
when_old.tt: "When taken, this decision modies §YNew Nationalism§! by: Construction Speed: §G+1.00%§!, but §Rremoves§! one §YCivilian Factory§!. You can take this decision up to §Y8§! times."
USA_out_with_the_old_in_with_the_new: "Out With The Old, In With The New!"
USA_out_with_the_old_in_with_the_new_desc: "The end of an American economy dominated by monopolies is coming, and with it, a new wave of small business owners will arise. We must embrace this, and make sure the new restructuring of the economy from the middle up brings forth a new era of prosperity in America."
25_moderates.tt: "We will lose the support of §Y25§! §mModerate Democrat and Republican§! House members."
all_social.tt: "We will gain the support of §YEvery§! §QSocialist§! House member\nMost §QSocialist§! support will be integrated into §3Democratic§! support"
USA_alliance_with_debs: "Alliance With Debs"
USA_alliance_with_debs_desc: "Eugene Debs, unlike most of his socialist counterparts, has proven to be somewhat reasonable. As a minor player in American politics, the Socialist Party does indeed have a seat in congress, and their influence is widespread in the Midwest. We should reach out to debs, and offer him a mutually benefitical pact: the Socialist Party will join the New Nationalist Coalition, although mantain independence as a party."
usa_come_back: "§Y20§! §mModerate Democrat and Republican§! House members who opposed the Congressional Recalls Bill will rejoin the coalition"
usa_2b: "§Y2§! §cBourbon Democratic§! House members will support the government"
usa_cons_rejoin: "§Y20§! §qConservative Republican§! House members will support us. This number will rise as talks continue"
usa_cons_rejoin_less: "§Y10§! §qConservative Republican§! House members will support us. Another §Y10§! will support us once we complete the §YResponsible Government§! Focus"
cons_leave_lol: "The §Y20§! §qConservative Republican§! House members that supported talks will re-leave us"
progressives_be_mad: "We will attempt to re-unify the fractured Republican Party. While this would gain us a large amount of §qGOP Republican§! House members support, it will for sure anger a lot of §Sprogresives§! into our coalition, especially the §lProgressive Democrats§!. In addition, we will be expected to support some §qConservatives§! bills, and most likely have to hold back on some of our more §rradical§! proposals, like universal healthcare and a national banking system. This will practically guarentee us a majority, §Qbut at what cost?§!"
USA_the_5_precent_agreement_desc: "The Government is going to need an unprecedented expansion of revenue if we are to enact all policies of New Nationalism. Due to this, the newly proposed income tax must be raied high. We shall set a national 5% income tax on all Americans, in which the vast majority of them will recieve more from our programs then they would get if we didn't have their tax money."
5_percent_agreement_conservatives.tt: "§cConser§!§qvatives§! will grow greatly in popularity"
USA_smith_hughes_act: "Smith Hughes Act"
whiteslave: "Modifies the §YWild Wests§! state modifier (§YArizona, New Mexico, Colorado, Kansas, Wyoming, Utah§!) \nLocal Factories: §G+25%§!\nOrganization Regain: §G+5.00%§!\nDivision Speed: §G+5.00%§!\nLocal Available Resources: §G+25%§!\nLocal Construction Speed: §G+5%§!"
USA_ford_assembly_lines: "Rollout Ford Assembly Lines"
USA_ford_assembly_lines_desc: "Ford Motor has recently made a breakthrough with the invention of a so called "assembly line" which has dramatically increased their companies production. We should force the company to give this technology to our ammunition plants, which would dramatically increase their output with said system." 
appointment: "After the §Y1912 election§!, the House of Representatives will increase from §Y391§! seats to §Y433§! seats"
appointment2: "After the 1910 midterms, we will lose §Y2§! less senate seats and §Y11§! less house seats"
firstcce.tt: "Requires the support of atleast §Y49 Senators§! and §Y218 Representatives§! by the end of this mission"
mexican_revolution.tt: "§YThis focus will be autocompleted when the§! §GMexican§! revolu§Rtion§! §Yhas begun§!"
focus_will_be_auto_completed: "This focus will be §Yautocompleted§! through an event" 
ccecreate.tt: "This focus will be autocompleted when the §YEconomic Efficiency Commission§! is created" 
USA_federal_reserve_act: "Federal Reserve Act"
USA_federal_reserve_act_desc: "A Federal Bank has long been called for by progressives. While the banking system does need reform, this would be too far. Let's instead set up the federal reserve that will guide the financial system by setting interest rates, managing the money supply, and regulating financial markets."
USA_federal_reserve_compromise: "Federal Reserve Compromise"
USA_federal_reserve_compromise_desc: "While a national bank is desired by most progressives, it's relatively unpopular amongst moderates, and we wont be able to gurantee it passes. We shall instead look towards a federal reserve system, which would keep private banks but give the government authority to manage the money supply, set interest rates, and regulate financial institutions. "
USA_keep_the_CCE: "Fight for the EEC"
USA_keep_the_CCE_desc: "The EEC has very interesting ideas of fincancial and government reform. We should fight to keep this recently made commission alive."
USA_pursue_wide_spread_administration_reforms: "Pursue Widespread Administration Reforms"
USA_pursue_wide_spread_administration_reforms_desc: "The consensus of the EEC commission is clear! We need widespread administration reforms to strengthen the federal governments power and fight government bloat."
USA_educate_rural_america: "Expand Opprotunities in Rural America"
USA_educate_rural_america_desc: "Being a farmer was once the dream of one coming to America looking for a better life. Now, however, its the cities that those pursuing the American dream look towards. We cannot leave rural America behind, and education is one area where they tend to fall behind. Let's pass a bill focusing on expanding schooling there."
USA_resource_development_department: "Resource Development Department"
USA_resource_development_department_desc: "The United States is full of untapped goldmines, both literally and figuratively. We should create a govenment department to search non private lands for resources that we could use."
 USA_lease_lands_to_private_companies: "Lease Land to Private Companies"
  USA_lease_lands_to_private_companies_desc: "Companies are more efficent then any Washington agency could be. Let's offer to sell some public lands to private companies who wish to look for natural resources."
  USA_federal_farm_loans: "Federal Farm Loans"
  USA_federal_farm_loans_desc: "We must strengthen investments in farmers and agriculture. Setting up easy to access cheap loans to farmers will help the agricultural industry and thus all americans."
  USA_dont_forget_the_little_man: "Don't Forget the Little Man!"
  USA_dont_forget_the_little_man_desc: "Many rural communities are scared that our investments into new roads will leave them behind. Let's ease their fears by ensuring some funds also go into developing rural roads as well."
  USA_this_land_will_surely_vote_for_me: "This Land will Surely Vote for me!"
  USA_vaccines_for_rural_america: "Expand Vaccinations in Rural America"
  USA_vaccines_for_rural_america_desc: "Rural Americans lack access to healthcare that those in the city have access too. Let's start a widespread effort to boost access to vaccines in rural america to make up for this."
  USA_the_city_and_the_good_life: "The CIty and the Good Life"
  USA_the_city_and_the_good_life_desc: "The cities are where the future of America lies. As the hub of our population and economy, we must support their further development."
  USA_you_can_have_it_in_detroit: "You Can Have it in Detroit!"
  USA_expand_the_commision_on_country_life: "Expand the Commision on Country Life"
  USA_expand_the_commision_on_country_life_desc: "The Commision on Country life, set up by former President Roosevelt, helped fight concerning organizations out west that have been facing lawlessness. We should expand this commission to help pacify the "Wild West"""
  USA_crush_the_wildwest: "Crush the "Wild West""
  USA_crush_the_wildwest_desc: "Bandits out west have been causing chaos out west for far too long! We must increase policing there to stop these bandits effective rule out west."
  USA_you_can_have_it_in_detroit_desc: "Many rural folks are moving to cities looking for better paying jobs and better education. The cities are the future, and we should promote these efforts and make sure there is opprotunity for those who want it."
  USA_boost_industrial_hubs: "Support Competition in the Automobile Market"
  USA_boost_industrial_hubs_desc: "The Midwest and Eastern seaboard is where a large majority of our economy is located. thus we should promote the expansion of industry in these well developed and populated areas."
  USA_promote_the_american_dream: "Promote the American Dream"
  USA_promote_the_american_dream_desc: "The American dream, the idea that anyone can immigrate to the United States and find a well paying job and a good education, must be promoted across the world. Skilled foreigners who wish to move to America for a better life will only strengthen our economy, after all."
  USA_transformthe_south: "Transform the South"
  USA_transformthe_south_desc: "The south, once the backwater of the nation, has increasingly been developing its own urban hubs. A bill investing in the expansion of Southern cities will help transform the south from an agricultural economy to a modern industrial one."
  USA_urbanization_efforts_out_west: "Urbanization Effort out West"
  USA_urbanization_efforts_out_west_desc: "The west is relatively undeveloped compared to the east, yet it has opprotunities to become huge industrial hubs. Let's promote movement out west of people and industry."
  USA_the_west_coast_project: "The West Coast Project"
  USA_the_west_coast_project_desc: "With our efforts to expand transportation across the united states, we should also make sure the west coast is not left out. Helping expand its infrastructure will be key to it's industrialization."
  USA_federal_highways: "Federal Highways"
  USA_federal_highways_desc: "Many cities in the United States remain unconnected. We should fight this, using federal money to help connect cities across the United States with new roads and railroads."
  USA_invest_in_private_road_companies: "Invest in Private Rail Companies"
  USA_invest_in_private_road_companies_desc: "Why fix something that's not broken? Rail companies have been doing fine so far, and we should invest in them to help them further connect America together."
  USA_focus_3: "Investments in the Steel Belt"
  USA_focus_2: "Newyork Dockyards"
  USA_focus_0: "Military-Industrial Complex"
  USA_focus_1: "Liberty Guns Act"
  USA_commissionon_economy_and_efficiency: "Commision on Economy and Efficiency"
  USA_commissionon_economy_and_efficiency_desc: "The Commision on Economy and Efficiency - the EEC, has many ambitious plans on how to reform the administrative process. They plan to create the first budget for the federal government, as well as creating the procedure for the President to establish a commission to study administrative reform."
  USA_good_neighbor_policy: "Good Neighbor Policy"
USA_exploiting_latin_america: "Latin American Shenanigans"
USA_exploiting_latin_america_desc: "American companies have great influence over Latin America, bringing tens of millions of dollars to the homeland. §8Nationalist§! and §tSocialist§! agitators in these countries are not happy about this however, and oppose us whenever they can. We will have to be careful when expanding business further, as if stabilty drops below §R25%§! in §YHonduras, Cuba, Or Dominica§!, we will recieve §Rdebuffs§!.\n\n The current stability of §YHonduras§! is [?HON.stability|%Y2]\n\n The current stability of §YCuba§! is [?CUB.stability|%Y2]\n\n The current stability of §YDominica§! is [?DOM.stability|%Y2]."
USA_gnb.tt: "This sub-branch will leave you with a §Rweaker§! §YCompany Ventures in the America's§! national spirit compared to the §YContinue Business in Latin America§! sub-branch, but it is much simpler, and could save §Gsignificantly§! more political power which could be used for other purposes..."
USA_legit_bus.tt: "These decisions will give both us and the target country §Y1 Civilian Factory§!, they can be taken once every §Y1.5 years§!"
