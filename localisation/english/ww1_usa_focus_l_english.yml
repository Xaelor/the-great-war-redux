taft_minor_election_boost.tt: "§mTaft§! will receive a minor boost in the general election!"
taft_moderate_election_boost.tt: "§mTaft§! will receive a moderate boost in the general election!"
taft_major_election_boost.tt: "§mTaft§! will receive a major boost in the general election!"

roosevelt_minor_election_boost.tt: "§SRoosevelt§! will receive a minor boost in the general election!"
