modify_dem_unityminus10: "Modify §1Democratic Unity§! by: §R-10§!"
on_select_iuc: "When this focus is selected:\nGets event '§YDepartment of Justice Announces Investigation of Several Union§!'\nThis event chain will reveal rampant corruption amongst unions. This will reduce the effects of the §Y'Corrupt Political System'§! national spirit, and could be a §Rdeadly blow to union support§!"
department_pf_labor: "Department of Labour"
USA_tighten_the_leash: "Tighten the Leash"
USA_a_job_well_done: "A Job Well Done!"
USA_lodge_mckellar_security_act: "Lodge Mckeller Anti Strike Act"
USA_economic_liberalization: "Economic Liberalization"
USA_postal_banking: "Cement the Postal Banking System"
USA_kick_the_rotten_structure: "Dismantle the Corrupted Unions"
USA_empower_the_dol: "Empower the Department of Labour"
USA_american_autarky: "American Autarky"
ww1_USA.52.t: "Chaos on our Southern Border"
USA_sfae_and_sound: "Stragetic Tariffs"
USA_increased_domestic_goods: "Protectionism"
USA_german_industrial_experts: "German Industrial Experts"
USA_corporist_council: "Establish the Board of Industrial Experts"
corporate_board: "Corporate Board"
ww1_USA.52.d: "Mexico, one of the most unstable countries in the Americas, has finally exploded into civil war. With the breakout of the conflict, violence has spread to our border. Mexican raiders looking for supplies have been crossing into our territory, with no fear of murdering those who try to stop them."
ww1_USA.52.a: "We need to do something about this!"
ww1_USA.109.t: "Inauguration of President Wilson"
ww1_USA.109.d: "President-elect Woodrow Wilson has finally assumed office as President of the United States today. Surrounded by several of his supporters, Wilson give his inauguration address speaking about the importance of passing the 'new freedom' agenda, as well as thanking his voters for their support."
ww1_USA.109.a: "Enough talk, let's get action!"
ww1_USA.127.a: "Jesus!"
 USA_build_back_better_act: "Build Back Better"
USA_alabama_farms: "Revive Alabaman Agricultural Production"
USA_georgia_farms: "Revive Georgian Agricultural Production"
USA_mississippi_farms: "Revive Mississippian Agricultural Production"

