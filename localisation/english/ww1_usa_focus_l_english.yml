USA_roosevelt_house_desc: "While the §YNew Nationalist Coalition§! has a majority in the §YSenate§!, we have a §Rminority§! in the §YHouse of Represenatives§!. Due to this fact, we will have to sway §mModerate Democrats and Republicans§! into supporting the vast majority of our progressive legislation. While they are open to a lot of our reforms, we may have to compromise our more §Sradical§! proposals to get them through.\n\nThe current reformist strength in the party is §Y[?new_nationalist_ideology]§!\nWhile the New Nationalist Coalition becoming too reformist may alienate §mModerate Democrat and Republican§! house members, some level of reformist strength is needed to take certain §YNational Focus's§!\n\nWe can currently rely on §Y[?roosevelt_house_support]§!/435 house members to support our current legislation!\n\nThe makeup of the house is as follows:\n\n[?socialist_members_support]/[?socialist_members] §QSocialist§! House members support the current legislation\n\n[?progressive_republican_support]/[?progressive_republican_member] §SProgressive Republican§! House members support the current legislation\n\n[?progressive_democrats_support]/[?progressive_democrats_member] §lProgressive Democrat§! House members support the current legislation\n\n[?moderate_democrats_and_republicans_support]/[?moderate_democrats_and_republicans_member] §mModerate Democrat and Republican§! House members support the current legislation\n\n[?bourbon_democrat_support]/[?bourbon_democrat_member] §cBourbon Democrat§! House members support the current legislation\n\n[?conservative_republican_support]/[?conservative_republican_member] §gGOP Republican§! House members support the current legislation"
