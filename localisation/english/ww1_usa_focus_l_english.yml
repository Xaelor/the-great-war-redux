USA_concessions_to_conservatives: "Concessions to Conservatives"
USA_concessions_to_conservatives_desc: "With conservatives organizing against Roosevelt, we must placate those on the right in the Republican party to ensure they do not flee to their cause. By making key verbal promises, speaking on party unity, and finding common ground, we can ensure that while conservatives won't love us, some of them will atleast tolerate us. "
USA_workers_compensation_act: "Workers Compensation Act"
USA_workers_compensation_act_desc: "Many workers suffer preventable injuries from company negligence. While we have made progress in reforms to improve workers saftey standards, we should also make sure that ignoring their workers saftey is not profitable. We will introduce a law that would force companies to pay for medical bills relating to company negligence caused injuries."
 USA_unionization_of_suburbia: "Unionization of Suburbia"
 USA_unionization_of_suburbia_desc: "American workers benefit greatly from unions. From higher pay, better retirement plans, and better living standards, its clear unions are a necessity in the work place. With their support secured, we should look into covertly spreading union membership into the suburbs, where unions have struggled to garner support in the past. "
