ww1_USA.122.t: "A Divided Party"
USA_foster_progressive_revolution: "Foster a Progressive Revolution"
ww1_USA.122.d: "Despite being the Republican President, these days you'll be somewhat hard pressed to find an average Republican on the street who enthusiastically supports Taft. Due to Tafts maverick nature, his mishmatch of conservative and progressive policies have left both factions of the party unhappy.\n\nDespite being handpicked by the leader of the progressive Republicans, Roosevelt, Taft and Roosevelt have became rivals as of late. Starting with the Payne-Aldrich Tariff Act in which Taft raised tariff rates despite promising not to. The Pinchot-Ballinger affair further widened this gap. This scandal was a result of Gifford Pinchot openly challenging Secretary of the Interior Richard Ballingers decisions to allow private development on conserved lands. When Taft sided with Ballinger and dismissed Pinchot, it enraged the progressive wing, who saw it as a direct assault on Roosevelts conservation legacy. Not only was it a betrayal of progressive policies, but there were very serious alligations of corruption against Richard Ballinger, which although congress's investigation has found to be untrue, remain a common progressive attack on Taft.\n\nMeanwhile, conservatives within the party have also been disenchanted. Taft's vigorous antitrust actions, of which are unprecedented by any president in history, have angered the traditionally pro big business wing of the Republican party. Along side this, Conservatives have remained dissapointed at Tafts picks for judges on American courts. Taft has nominated many more progressive thinkers on these courts then conservatives, leading to several loses in courts for conservatives on things like workers rights.\n\nWith both sides not really loving Taft, its clear there will need to be a dramatic shift in policy if there is to be a continuation of his presidency for a second term. Luckily, Taft is pretty flexible in policy, and can easily shift towards the progressives or the conservatives, depending on what benefits him."
ww1_USA.122.a: "We will need to be liked by atleast one of them..."
USA_gnb.tt: "This sub-branch will leave you with a §Rweaker§! §YCompany Ventures in the America's§! national spirit compared to the §YContinue Business in Latin America§! sub-branch, but it is much simpler, and could save §Gsignificantly§! more political power which could be used for other purposes..."
USA_legit_bus.tt: "These decisions will give both us and the target country §Y1 Civilian Factory§!, they can be taken once every §Y1.5 years§!"
USA_political_backing_to_honduras: "Political Backing to Honduras"
USA_political_backing_to_cuba: "Political Backing to Cuba"
USA_political_backing_to_dominica: "Political Backing to Dominica"
USA_expand_business_in_latin_america: "Further Expansion of Business in Latin America"
dollar_diplomacy.tt: "We can gain many §Gbuffs§! through this sub-branch, but it is also with its own §Rrisks§!. We will unlock several decisions improving the §YCompany Ventures in the America's§! national spirit, but if Latin American countries stability dips too low, we could face §Rsevere economic consequences§!. We can try to keep Latin American stability afloat, however, with several different investment options"
nic_helpful.tt: "You can find this decision under the "Foreign Influence" category"
tooltip_white_line: "    \n"
USA_Oust_Jose_Madriz: "Oust Jose Madriz"
USA_enforce_law_and_order: "Law and Order!"
USA_enforce_law_and_order_desc: "While the Klan ban is now in place once again, we need to ensure we can enforce it. Firing southern police officers who refuse to enforce the law, while sending federal police if needed, can ensure that the Klan gets whats coming to them."
USA_Oust_Jose_Madriz_desc: "Jose Madriz has proved himself unable to effectively rule Nicaragua. His failure to deal with revolts has proven that Nicaragua needs new, more pro American business leadership to prosper.\n\nLuckily, the United States has lots of influence over Nicaragua. However, we will need to increase it further to get our way. Our current preparedness to force §YJose Madriz§! to flee is [?USA_Oust_Jose_Madriz_Prepare]%"
USA_progressive_pp_dyn.tt: "[?progressive_republican_political_power]"
USA_defang_the_klan: "Defang the Klan"
USA_defang_the_klan_desc: "The Klan has once again sprung up, this time attempting to trick people with a fake persona of moderatism. If they are not dealt with shortly, not only would it lead to a rise of racial tensions, but it could also lead to the downfall of Roosevelts presidency through their support of conservative canidates."
USA_mcguigan_anti_klan: "McGuigan Anti Klan Campaign"
USA_klan_1: "Second Klan"
USA_memories_of_1871: "Memories of 1871"
USA_memories_of_1871_desc: "In 1871, Grant signed a law banning the first Klan. With this precedent, Roosevelt can technically argue the idea of a second Klan is illegal to begin with. While some conservatives will complain this is unfair, its the reality of the situation."
USA_invade_dominica_desc: "The Dominican Government has very high loans which it can never hope to repay. To prevent a European power from invading the island to secure their debt money, we must beat them to it. We shall order the Marines to quickly occupy the Dominican Republic to secure its independence from Europe."
 USA_neutrality_with_a_spine_desc: "While we are undoubtedly neutral, it doesn't mean we should let other nations just roll over us. We should increase rhetoric against those who attempt to violate our neutrality by trying to dictate who we can and can't trade with as well as blatanly send their spies into our country to sabatoge us."
USA_a_few_bad_apples: "Fight Ignorance"
USA_a_few_bad_apples_desc: "Many in the new Klan simply don't know any better due to a lack of education. By investing in southern schools, we can help ensure people know better then to believe the many lies the Klan spreads."
USA_southern_investments: "Invest in the South"
USA_southern_investments_desc: "One of the new Klans biggest groups of support comes from poor southerners, swayed by their populistic messages. By increasing investments in these areas, we can help reduce the appeal of the Klan."
USA_the_root_cause: "Target the Heart and Soul"
USA_support_the_war_preparedness_campaign: "Support the War Preparedness Campaign"
USA_support_the_war_preparedness_campaign_desc: "With tensions rising between Germany and us, we must be ready for a possible conflict with them. While we cannot offer the war preparedness campaign Wilsons open endorsement, we can make some positive off the hand remarks about them."
USA_the_root_cause_desc: "The second Klan is undoubtedly founded on anti American institutions, and their recent rise has been because they have prayed on good men who are simply uneducated or lack living proper opprotunity. By targeting the moral conscience of Americans, and investing in the south, we can stop the Klan from expanding to every day Americans."
trustbust.tt: "These decisions allow for the reduction of the §YCompany Monopolies§! national spirit"
stoproosevelt.tt: "Spending the 25 political power will stop the debuffs, but immediately restart the mission,"
10_day_later.tt: "The mission "§YKlan Membership Expands§!" will now always fire §Y10§! days later."
10_day_later2.tt: "The mission "§YPolice Raids on Klan Sites§!" will now always fire §Y5§! days faster."
USA_ban_lynching: "Ban Lynching"
USA_ban_lynching_desc: "While some southerners may seem this as extreme, the act of lynching is heinous and barbaric. While we are fighting the second Klan, we should take the opportunity to pass an executive order that will defacto ban all lynching."
new_nationalism_first: "Add §YNew Nationalism§!, which grants\nPolitical Power Gain: §G+5%§!\nStability: §G+5.00%§!\nWe will §GUpgrade§! this §YNational Spirit§! throughout the tree."
new_nationalism_railway: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y3.0%§!\nStability: §G+2.00%§!"
new_nationalism_high_tax: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y-12.0%§!\nStability: §G-2.00%§!\nPolitical Power Gain: §R-5%§!"
new_nationalism_central: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y-8.0%§!\nSeveral National Focus effects will be §Gimproved§!"
progressive_republicans_midterm_1914: "§SProgressive Republicans§! will perform moderately better in the next §YElections§!"
USA_centralization_of_washingtons_finances: "Strengthen Control Over Federal Funding Uses"
USA_centralization_of_washingtons_finances_desc: "As it stands now, states have huge leeway in how they must use federal funds. Even though a bill may be to fund, say roads or education, state governments can usually make use of loopholes to do whatever they want with the money. We must put a close to this, and sneaking a provision into a insignificant bill to increase federal control over congress delegated funding would be a way to prevent this."
conservative_midterm_1914: "§cConser§!§qvative§! canidates will perform slighty better in the next §YElections§!"
theywill.tt: "Be careful, §cConser§!§qvatives§! will organize and feed off of any ammunition we give them, in an attempt to take back the house and senate in 1914. Depending on whether or not we re-unified with the Republicans, they may even form a new party!\n If we don't handle this well, our administration may be §Rcrippled§!"
USA_national_minimum_wage: "National Minimum Wage"
USA_national_minimum_wage_desc: "A national minimum wage was one of Roosevelts core campaign promises in the 1912 election. Now that Roosevelt has won, it's time to propose this legislation to congress. By setting the minimum wage nation wide to 45 cents an hour, we should help prevent the exploitation of vulnerable workers who are usually paid slave wages."
