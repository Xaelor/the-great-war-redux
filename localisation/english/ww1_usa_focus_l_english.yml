USA_national_highways: "Military Highways"
USA_national_highways_desc: "While fine for civilian use, the US railway system is poorly optimized from a military standpoint. With the mass transportation of resources and equipment needed to mobilize for an inevitable war, we will need to fix this. By building federal highways only for military use, we can ensure mobilization goes smoothly."
