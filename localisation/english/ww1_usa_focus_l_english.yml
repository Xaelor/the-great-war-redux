USA_cannon_presidency_desc: "Joseph Cannon has seen personally the instability seperations of power brings as Speaker of the house, when he was ousted for trying to centralize power to himself. America cannot and will not be a weak nation with a weak ineffective government, even if it upsets the idea of some Americans."
cannon_lol: "President Cannon will begin the slow §Rdismantlement§! of American democracy"
USA_fuck_taft: "In this section of the tree, we will be playing as §YTheodore Roosevelt§!, not §YWilliam Taft§!. We will attempt §Rreduce§! §YTaft's§! influence on the party and §Gincrease§! our own! §YTaft§! will not go down without a fight, however. We will have to deal with a series of attempts by §YTaft§! to wrestle control over the §YRepublican Party§! in the form of events and missions."
USA_reconcile_progressives_strategy: "Taft's strategy will be to §Greconcile§! with §Yprogressives§! in the party, giving them government jobs and concessions on policy. This will make them more supportive of us, and could prevent the party from fracturing. However, it cost a lot of political power and may be §9too little too late§!, only serving to strengthen the influence of any potential §tprimary challengers§!"
USA_fuck_roosevelt: "Taft's strategy will be to §Rreduce§! the influence of §Yprogressives§! in the party, giving government positions to §Yconservatives§! and attempting to §tdiscredit§! Roosevelt. This will most likely enrage Roosevelt and other progressives, however if their influence is low enough we will surely survive any primary attempt, and they won't have the political clout to break off from the party. However, it may only §9embolden§! Roosevelt and only serve to make Taft look §tout of touch§!"
USA_reep_fruit: "Upon the opening of the Panama Canal, we will gain a bonus \nConsumer Goods Factories Factor: §Y-5%§! \non the "Panama Canal" national spirit, once the Panama Canal completes construction."
USA_fight_anti_american_ideals: "Socialism and Democracy"
taftcontrol: "Taft's control over the Republican Party will be §7strengthened§!, helping him against any §Ochallenger§!"
  USA_united_states_bureau_of_mines: "Create the Bureau of Mines" 
 USA_united_states_bureau_of_mines_desc: "There has been a concerningly high rise in catastrophic mine accidents lately. These accidents are not only killing hundreds monthly, but are also leading to wide spread protests, as well as slowing industries and markets that rely on these mined goods. The newly created Bureau of Mines should hopefully be able to introduce effective regulations to increase the saftey of our miners." 
USA_continue_trust_busting: "Continue Trust Busting"
USA_continue_trust_busting_desc: "There are many companies out there blatantly violating the Sherman Antitrust Act and destroying competition. With a friendly supreme court however, we can continue our progress of breaking up these monopolies."
USA_enabling_act: "Enabling Act"
USA_enabling_act_desc: "As a way to continue progression towards New Mexican and Arizonan statehood, the Enabling Act of 1910 will enable the people of New Mexico and Arizona to form a constitution and state government and be admitted into the Union on an equal footing with the original states."
USA_continue_teddies_nature_preserves: "Protect the Environment"
USA_continue_teddies_nature_preserves_desc: "Teddy Roosevelt has gone great lengths to protect our envionrnment from deterioration. With the Pickett act, we can continue these efforts by designating public lands as reserves and withdraw them from settlement, sale, or entry for various purposes. We can use this law to protect several different environmental beauties from destruction."
USA_general_withdraw_act: "Abuse the power of the Pickett law"
USA_general_withdraw_act_desc: "The Pickett law, in theory, should be a great win for enviornmentalists. However there is a fatal flaw in the legislation that many have noticed; we could order a "reserve" for conservation but with the hidden intent of later allowing oil drilling or resource extraction after the public is cleared from the land."
USA_political_strategy: "Riding a Razor Wire"
USA_political_strategy_desc: "President Taft has a... tough time ahead, to say the least. With both increasing Roosevelt anger at our administration and the panic of 1910 decreasing faith in our policies, a brewing storm is gathering that could see the end of Taft's political career entirely if we are not careful."
USA_public_inspection_of_corporate_tax_returns: "Crack Down on Corporate Tax Evasion"
USA_public_inspection_of_corporate_tax_returns_desc: "There is a widespread evasion of taxes by the wealthy using various loopholes. These need to be closed."
 USA_lower_corporate_tax: "Fill Their Pockets"
 USA_lower_corporate_tax_desc: "While it sounds bad to blatanly allow corporations to continue exploiting loopholes, the fact is that these corporations having more money is usually better for our industry. Besides, we can always remind those big buisness owners who is keeping their actual taxes low during the election season..."
USA_reconcile_with_progressives: "Crack the Door Open"
USA_reconcile_with_progressives_desc: "While Taft and Roosevelt have had their personal differences, the truth is on policy they do indeed share many similarities. Scandals like the Pinchot Ballinger controversy have definitely worsened our reputation amongst progressives. However, it is possible that with some new campaign strategies and some concessions to progressives in the administration, we should surely be able to win 'em back."
USA_new_car_regulations: "New Car Regulations"
USA_new_car_regulations_desc: "Sorry bro, but the USA dev couldn't find any information on what these new car regulations actually were, just that they existed. However, it feels wrong to leave this focus with no description at all. Hope you're having fun though!"
USA_white_slave_traffic_act: "White Slave Traffic Act"
USA_white_slave_traffic_act_desc: "America is a huge country. As such, it is inevitable that there will be a few large crime organizations we just cannot control. For a while, prostitution and even outright human trafficking has been widespread in the so called "Wild West". We cannot allow this to continue any longer."
USA_crumpacker_act: "Expand the House"
USA_crumpacker_act_desc: "There are 92,000,000 Americans, yet only 391 seats in the House of Representatives. How on earth is each representative supposed to adequately represent 235,000 Americans? An expansion of the House is long overdue at this point, and the Appointment Act will fix this."
USA_Ford_Motor_contracts: "Support Ford Motor"
USA_Ford_Motor_contracts_desc: "Ford Motor is the largest car manufacturing company in the United States. With cars increasingly becoming more and more accessible, helping Ford Motor expand could generate a lot of consumer spending and help our industry grow, making it a great investment."
USA_direct_election_of_senators: "Propose the 17th Ammendment"
USA_direct_election_of_senators_desc: "The way senators are currently "elected" is with state legislators appointing them. While not inheritely anti-democratic, it still does open possibilites to corruption and unpopular senators. A growing ammount of progressives, and even moderate, have called for directly electing senators, like with the House of Representatives."
USA_attract_progressive_defectors_desc: "Since we no longer have the Republican caucus to rely on for congressional votes, we will have to assemble our own coalition in congress. Dubbed the "New Nationalism Coalition" by the media, Roosevelt will begin the process of assembling a new force for the progressives"
