  USA_make_them_serve: "And make them Serve"
  USA_the_dream_for_all: "The American Dream, for All"
  USA_commissionon_economy_and_efficiency: "Commision on Economy and Efficiency"
  USA_commissionon_economy_and_efficiency_desc: "The Commision on Economy and Efficiency - the EEC, has many ambitious plans on how to reform the administrative process. They plan to create the first budget for the federal government, as well as creating the procedure for the President to establish a commission to study administrative reform."
####events
ww1_USA.70.t: "Japan Accepts US-Japanese Naval Collaboration Treaty"
ww1_USA.70.d: "Talks with Japan have gone relatively well as Japan's emperor agreed to a treaty expanding US-Japanese naval collaboration, paving the way for minor research collaborations and future naval exercises. While vague and in reality it is unlikely Japan and America will be sharing top of the notch research on naval matters, it is a diplomatic victory at the very least."
ww1_USA.70.a: "It will be a good headline, at least."
ww1_USA.69.t: "America Offers Naval Collaboration"
ww1_USA.68.t: "Treaty with Japan"
ww1_USA.68.c: "Let's shift talks towards a commercial treaty."
 ww1_usa.67.t: "Lynching acts"
 ww1_usa.67.d: "Members of a far right organisation attacked a settlement of ethnic minorities. State police are afraid to take any measures to stop these dangerous terrorists."
 ww1_usa.67.a: "What is the police doing??"
 ww1_usa.68.t: "Prohibitionist Agitation"
 ww1_usa.68.d: "Reactionary forces are conducting large-scale demonstrations and agitation in the states to convince the average American civilian to join the Prohibition campaigns."
 ww1_usa.68.a: "This is their right."
 ww1_usa.69.t: "Clashes with Progressivists"
 ww1_usa.69.d: "Two demonstrations of Prohibition supporters and their opponents crossed in one of the cities. Riots and clashes broke out, and the police were unable to contain them. This provocation greatly fueled the already heated conflict between parties."
 ww1_usa.69.a: "Not good."
 
 ww1_usa.71.t: "Clashes with Prohibitionists"
 ww1_usa.71.d: "Once again, the socialists carried out a terrorist attack on members of prohibitionist organizations."
 ww1_usa.71.a: "Not good."
 ww1_usa.72.t: "Political Attack"
 ww1_usa.72.d: "Socialists sabotage the work of administrations, the governor intends to use the army to disperse protesters."
 ww1_usa.72.a: "Terrorists!"
 ww1_usa.73.t: "Raid on Arsenal"
 ww1_usa.73.d: "State arsenals were attacked. Part of the infantry equipment was stolen."
 ww1_usa.73.a: "Find these criminals!"
 ww1_usa.74.t: "Corporatocracy"
 ww1_usa.74.d: "The political influence of big business is becoming too dangerous. Chief executive officers are pressuring and lobbying for their interests in Congress. We fear that the corruption generated by corporatocracy will destabilize national economy."
 ww1_usa.74.a: "This country is mired in corruption!"
 ww1_usa.75.t: "Triangle Shirtwaist Factory Fire"
 ww1_usa.75.d: "A terrible tragedy took place in New York. The largest civilian factory fire in history of the United States occurred at Triangle Shirtwaist Factory. Despite the fact that firefighters quickly arrived at the scene of disaster, they were unable to contain fire, as it had grown too large.\n\nThe fire took place in a clothing workshop, where most of the workers were women and children. About 146 people died in fire. Against the backdrop of this tragedy, socialist trade unions have become more active, demanding to reduce the working week and pass laws on safety at work. However, the government is in no hurry to comply with these requirements."
 ww1_usa.75.a: "The tragedy shouldn't be repeated a second time."
 ww1_usa.76.t: "Bootlegging"
 ww1_usa.76.d: "A huge number of entrepreneurs, bypassing the act, began to produce moonshine alcohol. Clandestine production takes on enormous proportions, and large criminal groups began to make money from protection of alcohol warehouses. Corruption and crime is becoming a major problem in large cities."
 ww1_usa.76.a: "Should this be a problem? Send the police!"
 ww1_usa.78.t: "Coal Wars"
 ww1_usa.78.d: "In the coal states of the country, there are large-scale protests by miners against the terrible working and living conditions. The Socialist Party supports the rebellious workers and even arms them. Measures should be taken to suppress coal riots."
 ww1_usa.78.a: "Enter into negotiations with miners."
 ww1_usa.78.b: "Send agents to suppress strikes!"
 ww1_usa.79.t: "Steel Strike"
 ww1_usa.79.d: "One of the largest steel mills has started a major strike, which was supported by the socialists.. Resource production is dwindling, and companies and the military industry suffer losses and spoil production plans."
 ww1_usa.79.a: "Enter into negotiations with workers."
 ww1_usa.79.b: "We aren't negotiating with socialists."
 ww1_usa.80.t: "Immigrant Strike"
 ww1_usa.80.d: "Workers in several large factories with the support of trade unions and foreign diasporas began to strike because of the terrible working conditions. Most of the protesters are immigrants, so the world media is closely following events in the US."
 ww1_usa.80.a: "Accept their demands."
 ww1_usa.80.b: "Send the police!"
 ww1_usa.81.t: "Railroad Strike"
 ww1_usa.81.d: "Railroad workers went on strike in the States and blocked some highways. Many trains are canceling the trip, and construction of new railways has stopped. The police hardly get to the settlements with the striking railroad workers. Agency assistance is required."
 ww1_usa.81.a: "It must end peacefully."
 ww1_usa.81.b: "Get back to work!"
 ww1_usa.82.t: "Dockyard Strike"
 ww1_usa.82.d: "Port workers have gone on strike in some states due to harsh working conditions. The socialists managed to enlist the support of the leaders of the protest."
 ww1_usa.82.a: "It could end badly."
 ww1_usa.82.b: "They will regret that.."
 ww1_usa.83.t: "American Civil War"
 ww1_usa.83.d_socialist: "Almost 50 years later, the United States is again blazing in the flames of the Civil War. The political split that arose in the country until recently didn't seem too serious, but the social crisis, the growing tension between progressives and reactionaries, brought the situation to armed conflict.\n\nSocialist Party, entrenched in Chicago and gaining widespread support in the industrial states, had long planned to establish a socialist republic in America. They were opposed by democratic forces and conservative reactionaries. This conflict, like its predecessor, will destroy countless lives and will forever shape the United States of America, or at least whatever is left of it. The world looks with great shock, and are forced to watch as America tears itself apart, bit by bit, until nothing is left of the once great republic.\n\nThe Great American Revolution begins."
 ww1_usa.83.d_confederate: "Almost 50 years later, the United States is again blazing in the flames of the Civil War. The political split that arose in the country until recently didn't seem too serious, but the social crisis, the growing tension between progressives and reactionaries, brought the situation to armed conflict.\n\nThe reactionary forces, supported by the southern states, raised the patriotic forces to fight for the American nation against the stubborn rule of the progressives. This conflict, like its predecessor, will destroy countless lives and will forever shape the United States of America, or at least whatever is left of it. The world looks with great shock, and are forced to watch as America tears itself apart, bit by bit, until nothing is left of the once great republic.\n\nThe Second American Civil War begins."
 ww1_usa.83.d: "Almost 50 years later, the United States is again blazing in the flames of the Civil War. The political split that arose in the country until recently didn't seem too serious, but the social crisis, the growing tension between progressives and reactionaries, brought the situation to armed conflict. This conflict, like its predecessor, will destroy countless lives and will forever shape the United States of America, or at least whatever is left of it. The world looks with great shock, and are forced to watch as America tears itself apart, bit by bit, until nothing is left of the once great republic.\n\nThe Second American Civil War begins."
 ww1_usa.83.a: "The mighty united no longer."
 ww1_usa.83.b: "A day of infamy."
 ww1_usa.84.t: "[USA.GetName] Wants to Buy the Virgin Islands"
 ww1_usa.84.d: "[USA.GetName] entered into negotiations with us to buy the Virgin Islands. These territories in the Caribbean have long been in economic decline, as the island depended mainly on slave labor. Even in the last century, America several times had offered Denmark this agreement, but for various reasons they could not completely buy all the islands."
 ww1_usa.84.a: "Ratify the treaty."
 ww1_usa.84.b: "That region is strategically important to us."
 ww1_usa.85.t: "[FROM.GetName] Won't Sell the Virgin Islands"
 ww1_usa.85.d: "[FROM.GetName] refused to sell the islands, despite our lucrative offer. Well, that's their right."
ww1_germany.173.t: "Sinking of the Sussex"
ww1_germany.173.d: "Another day of unrestricted submarine warfare and another diplomatic incident with the Americans. This time, we sunk the french SS Sussex, a ship that ignored all prior warnings we gracefully gave them, and decided to sail in waters where the policy of unrestricted submarine warfare is active in. Despite nobody being killed, 2 Americans were wounded in the incident.\n\nWhile a minor incident, all of the previous woundings and killings of American citizens on ships travelling to entente countries has lead to this minor incident being seen as a breaking point by many. Americans are tired of hearing about their fellow citizens getting attacked by German submarines, and the United States government certainly isn't happy with unrestricted submarine warfare reducing their trade with Britain significantly, which they claim violates their sovereignty to trade with who they chose despite them having no objections to the British blockade of us! Either way, we should prepare for an American response in the coming days."
 ww1_germany.174.t: "The Sussex Incident"
 ww1_germany.174.d: "The Germans have once again blatanly violated our citizens once again, with the sinking of the Sussex ship. Desipte being a purely civilian transport vessel with no weapons of war on board of the ship, the Germans attacked the Sussex anyways. Thankfully, none of our citizens lost their lifes, but 2 Americans suffered severe injuries. Many in America are seeing this as the last straw, as there has been no shortage of incidents involving Germany attacking our citizens before."
 ww1_germany.174.a: "Completly unacceptable, we will demand Berlin stop these attacks on passanger ships"
ww1_germany.175.t: "America Demands Restrictions on the Unrestricted Submarine Warfare Policy"
ww1_germany.175.d: "As expected, the hypocritical brats in Washington have once again came knocking on our door. While usually they just come to complain, this time it seems they mean business. The American ambassador went on a long rambling about supposed German violations of their neutrality and citizens. He ended it off by demanding an end to attacking merchant and passenger ships traveling to Britain and France, while ensuring they have safe passage to get to their destination.\n\nThis would, of course, defeat the purpose of unrestricted submarine warfare. We would lose the ability to sink ships delivering food to the Entente, while the Americans could easily just hide weapons on civilian passanger ships like they have done in the past. However, it may be worth just accepting American demands and defacto abandoning unrestricted submarine all together. The British economy is under strain, but not really due to us sinking ships delivering supplies to them. The British have plenty of food, and it may not be worth dragging America into the Great War to try and continue a failing war tactic."
ww1_germany.175.a: "Alright, the Americans win. Accept their demands"
ww1_germany.175.b: "We recommend they instead stop putting their civilians in harms in the first place."
ww1_germany.173.a: "They're going to start a diplomatic crisis over 2 people being wounded?"
ww1_USA.178.t: "The Sussex Pledge"
ww1_USA.178.d: "The sinking of Sussex, a French ship with American civilians on it, has caused outrage amongst the American public and government as of late. The American government has demanded an end to the sinkings of civilian and mechant ships heading to Entente countries all together. It seems Germany was unwilling to risk war with America, as its government has agreed to the so called 'Sussex pledge', promising not to sink civilian and mechant ships heading to the Entente. While America is appeased for now, this promise means Germany will be forced to defacto abandon submarine warfare all together. With the inability to sink ships providing food to the Entente, a large benefit of the policy has been completly lost."
ww1_USA.178.a: "Suprisingly reasonable coming from the Kaiser."
ww1_USA.178.b: "Let's hope this ensures their neutrality."
ww1_USA.178.c: "The ending of unrestricted submarine warfare will certainly benefit us."
ww1_USA.178.e: "Let's see just how long this lasts."
 ww1_usa.85.a: "We're disappointed."
 ww1_usa.86.t: "[USA.GetName] Sends A Note of Protest"
 ww1_usa.86.d: "In strong words, the American ruler denounced our "recent intolerable acts" which served to destabilize the region. [From.GetNameDefCap] remains committed to peace and stability in the region, the letter says, and would be forced to consider further measures, including military action, should we persist on our current course."
 ww1_usa.86.a: "Are they threatening us?"
 ww1_usa.86.b: "Calm them down."
 ww1_USA.137.t: "Panama Canal Opened"
 ww1_USA.137.d: "The canal, long in construction in Panama but having mainly being built by The United States, has finally finished today. With this, the Atlantic and Pacific oceans are finally connected, and trade between countries in the region is expected to increase. As the territorial controller of the Panama Canal, we will benefit greatly from tax rates we can set on ships going through it."
 ww1_USA.137.a: "It took long enough..."
 ww1_USA.120.t: "Sinking of the Lusitania"
 ww1_USA.120.d: "Ocean liner RMS Lusitania fell has fallen victim to a torpedo attack from a German U-Boat. Nore than 1000 have drowned or died during the attack, most of being innocent US citizens or migrants evacuated from war-torn Europe.\n\nAlready, public mood in America is already turning against Germany. Seeing this attack as completly unjust, some sort of action is being demanded. While was is of course infeasible, a strongly worded protest letter to Germany may be the move here. If we can show Germany we won't accept blatant murder of our citizens, they may be forced to quit their so called unrestricted submarine warfare.\n\nHowever, William Jenning Bryans has protested against any protest note, seeing Germanys claims of the incident being a complete accident as sufficent enough of an apology. Bryan claims that a strong protest would do nothing but compromise American neutrality, and antagonize Germany needlessly. What should the President do?"
 ww1_USA.120.a: "This is an outrage! Germany must stop this!"
 ww1_USA.120.b: "Let's not do anything we would regret."
 ww1_usa.89.t: "[USA.GetName] Wants to Buy Greenland"
 ww1_usa.89.d: "[USA.GetName] entered into negotiations with us to buy Greenland. America believes that this region is not of interest to European powers, because it is difficult to access and is a giant ice island. They are ready to buy these territories, although we do not really understand why."
 ww1_usa.90.t: "[FROM.GetName] Won't Sell Greenland"
 ww1_usa.90.d: "[FROM.GetName] refused to sell Greenland, despite our lucrative offer. Well, that's their right."
 ww1_usa.90.a: "We're disappointed."
 ww1_usa.91.t: "[USA.GetNameDefCap] Protest the Formation of the Imperial Federation"
 ww1_usa.91.d: "Expansion of the British Crown in North America is making [USA.GetNameDefCap] worry. The American government warns that the integration of Canada may be perceived as a violation of the sovereignty of American countries, and [USA.GetNameDefCap] would be forced to consider further measures, including military action following the Monroe Doctrine."
 ww1_usa.92.t: "Election of [GetYear]"
 ww1_usa.92.d: "The day of the presidential election has arrived. After the tense year 1912, the political situation in [USA.GetName] more or less stabilized. However, the world situation leaves much to be desired. The next president will be required to take decisive actions, since the indifference of [USA.GetName] in global conflict may turn out to be a fatal mistake."
 ww1_usa.92.a: "The Democrats. We need to unite the nation!"
 ww1_usa.92.b: "The Republicans. We need to strengthen our economy."
 ww1_usa.92.c: "We need Roosevelt!"
 ww1_usa.93.a: "The party will keep Wilson's candidacy."
 ww1_usa.93.b: "James Hanly will preserve unity of the party."
 ww1_usa.94.t: "Election of [GetYear]"
 ww1_usa.94.d: "The day of the presidential election has arrived. Woodrow Wilson is preparing for another election again, despite his health. During his first term, he managed to create a strong political system, which is based on the cult of the president's personality. If the party does not select a worthy successor in time, the opposition will try to destabilize the situation in [USA.GetName]."
 ww1_usa.94.a: "There is no one more reliable than Wilson."
 ww1_usa.94.b: "We need to demonstrate strength. Pershing is a good candidate."
 ww1_usa.95.t: "[USA.GetName] Ratifies Canada Act"
 ww1_usa.95.d: "[USA.GetName] seeks to expand the Monroe Doctrine. Congress passed the Canadian Colonial Independence Act. In fact, this is an ultimatum to the British - either they will grant Canada full independence, or [USA.GetNameDefCap] will begin military action."
 ww1_usa.95.a: "God bless America!"
 ww1_usa.96.t: "[USA.GetName] Demands Canada!"
 ww1_usa.96.d: "[USA.GetName] seeks to expand the Monroe Doctrine. Congress passed the Canadian Colonial Independence Act. In fact, this is an ultimatum to us - either we will grant Canada full independence, or [USA.GetNameDefCap] will begin military action."
 ww1_usa.96.a: "This is a difficult decision."
 ww1_usa.96.b: "Have the Yankees forgotten about 1814?"
 ww1_usa.97.t: "Canada Is Free!"
 ww1_usa.97.d: "[ENG.GetName] has submitted to pressure from the North American giant. Canada has gained full independence and is now in a de-facto alliance with [USA.GetNameDefCap]."
 ww1_usa.97.a: "America is free of colonial influence!"
 ww1_usa.98.t: "[ENG.GetName] Rejects ultimatum!"
 ww1_usa.98.d: "[ENG.GetName] is ready to fight back. They are not going to leave the North American continent. This international crisis will end on the battlefield."
 ww1_usa.98.a: "We have been waiting for this war."
 ww1_usa.99.t: "The Canada Act"
 ww1_usa.99.d: "[USA.GetName] seeks to expand the Monroe Doctrine. Congress passed the Canadian Colonial Independence Act. In fact, this is an ultimatum to [ENG.GetName] - either we will grant Canada full independence, or [USA.GetNameDefCap] will begin military action. North America could once again be the site of a massive battle."
 ww1_usa.99.a: "The American giant is waking up."
 ww1_usa.99.b: "God bless Canada!"
 ww1_usa.100.a: "Terrible sorrow."
 ww1_usa.100.b: "[GER.GetName] is responsible for their war crimes."
 ww1_usa.100.c: "How did they know it was our U-boat?"
 ww1_usa.101.t: "Opening of Panama Canal"
 ww1_usa.101.d: "After years of construction, the Panama Canal opened today, estbalishing a more direct connection from Atlantic to Pacific, which will no doubt be a boon to trade in the region, as well as make the area an important strategic location.\n\nAmerican Engineers have stunned the world with this amazing feat - with the exceptions, of course, of the British and Germans, who both insist that their canals are better."
 ww1_usa.101.a: "Amazing construction."
 ww1_usa.102.tt: "§YPanama Canal will be Unlocked§!\n"
ww1_USA.139.t: "America Offers us Increased Food Imports"
ww1_USA.139.d: "The Great War has had a heavy impact on the daily lifes of our average citizen, with food natually being prioritized for those in the army. While our people aren't outright starving, there has been a noticable reduction in food available for the common man. America is offering to help relieve some of these concerns, with relatively cheap food imports."
ww1_USA.139.a: "We'll keep this in mind"
 ww1_usa.102.a: "Let's celebrate, we completed it!"
 ww1_usa.105.t: "Occupation of Veracruz"
 ww1_usa.105.a: "Missed localisation? Are you kidding?"
 ww1_usa.106.t: "Standard Oil Case"
 ww1_usa.106.d: "Over a period of decades, the Standard Oil Company of New Jersey had bought up virtually all of the oil refining companies in the United States. However, the state intervened in the successful affairs of the Rockefeller family. The government sought to prosecute Standard Oil under the Sherman Antitrust Act, but the company acquired many others through means that might have been considered legal in common law, which provokes juridical conflict. If the Supreme Court agrees with the government, the Standard Oil Company will be forcibly disbanded and about 30 new ones will be created on its basis to prevent oil market capture."
 ww1_usa.106.a: "Breakup the Standard Oil."
 ww1_usa.106.b: "Nationalize the Company."
 ww1_usa.107.t: "[USA.GetName] demand colonial submission!"
 ww1_usa.107.d: "Americans intend to put pressure on the European empires and they need a foothold in Africa. They decided to take advantage of our indifference in world politics and establish a protectorate."
 ww1_usa.107.a: "Obey."
 ww1_usa.107.b: "This is reverse colonism!"
 ww1_usa.108.t: "[USA.GetName] Demands to Leave America!"
 ww1_usa.108.d: "The United States issued an ultimatum - they demand us to leave all the remaining colonial territories in South and Central America. Otherwise, they will use the expanded Monroe Doctrine to declare war."
 ww1_usa.108.a: "Retreat."
 ww1_usa.108.b: "Let them go to hell!"
 ww1_usa.109.t: "Tommies are going to fight for America."
 ww1_usa.109.d: "Our ultimatum was ignored. The Great War against the European colonists is inevitable."
 ww1_usa.109.a: "Bad decision, Brits."
 ww1_usa.110.t: "The North American Union"
 ww1_usa.110.d: "The United States has proposed to form the North American Union, a confederal state, but the federal government will remain in the American capital. In fact, they offer to voluntarily become part of their state."
 ww1_usa.110.a: "Hell yeah, we're in!"
 ww1_usa.110.b: "On second thought.."
 american_civil_war: "Second American Civil War"
 standard_oil_case: "Standard Oil Case"
 ww1_usa.111.t: "[MEX.GetName] in [USA.GetNameDefCap]?"
 ww1_usa.111.d: "Now [MEX.GetName] is joining the negotiations. The nation has stabilized a little, so we are ready to invite them to join our Union."
 ww1_usa.111.a: "Come on!"
 ww1_usa.111.b: "We can exist without them."
 ww1_usa.113.t: "Anarchist Society in America"
 ww1_usa.113.d: "Having survived the first bloody days after the anarchist coup, society has finally strengthened. Our ideologists and political commissars are infiltrating factories and building communes. America will never change, now it lives by the laws of Anarchy."
 ww1_usa.113.a: "We live in a SoCiEtY."
 ww1_usa.113.tt: "Over time, the Anarchist Society will improve.\n\n"
 ww1_usa.114.t: "Foreign diasporas protests"
 ww1_usa.114.d: "The migration crisis has developed into an internal conflict. The introduction of restrictive migration measures without social preparation led to the fact that the diasporas found themselves in an extremely oppressed position. Italians, Russians, Chinese, Irish, Germans, African Americans and many other diasporas have united together to voice their discontent with the government through strikes and constant protests on the streets of American cities."
 ww1_usa.114.a: "It takes time for them to calm down."
 ww1_usa.116.t: "Civil war stopped immigration"
 ww1_usa.116.d: "Bloody events in the United States have affected the migration flow. America is no longer a haven for refugees from Europe and Asia."
 ww1_usa.116.a: "At least one less problem."
 ww1_usa.117.t: "Fall of Berlin"
 ww1_usa.117.d: "American Forces entered Berlin. For the first time in history, Expeditionary Corps from another continent conducts a large-scale operation to intervene in the Old World and, apparently, is winning this war. However, on the outskirts of the city and in the capital centre, terrible battles continue. The German General Staff doesn't want to accept defeat, despite the calls of the American allies for negotiations.\n\nThe President of [USA.GetNameDefCap] compared the capture of Berlin to the signing of the Constitution - it is one of the greatest achievements of the American nation in its history."
 ww1_usa.117.a: "Yankee Doodle in Berlin!"
 ww1_usa.117.b: "We're doomed."
 ww1_usa.118.t: "Deoccupation of the Banana States"
 ww1_usa.118.d: "The period of the occupation of the American banana countries was too long. These states are too expensive to maintain, so our forces are leaving these territories."
 ww1_usa.118.a: "It was pretty nice vacation."
 ww1_usa.119.t: "Russians Demands to Stop the Intervention"
 ww1_usa.119.d: "The period of the occupation of the American banana countries was too long. These states are too expensive to maintain, so our forces are leaving these territories."
 ww1_usa.119.a: "We were ready for a confrontation."
 ww1_usa.119.b: "We have completed our task."
 ww1_usa.120.t: "American Intervention in Russia"
 ww1_usa.120.d: "American forces landed in Russian ports, thereby joining the military intervention in the Russian Civil War. According to the command of the American corps, they arrived to help resolve the conflict in the country, since the events in Russia affect almost the entire world, or will affect them in the future.\n\nThe Russians themselves fear that the American intervention has other tasks aimed at weakening their nation and subjugating the population in the occupied territories. There are already reports of civilian casualties from the occupation."
 ww1_usa.120.a: "One more problem."
 ww1_usa.120.b: "This is temporary occupation, I hope."
 ww1_usa.121.t: "Pershing leads the Punitive Expedition!"
 ww1_usa.121.d: "The Americans intend to eliminate the leader of the peasant uprising, Pancho Villa, in order to finally rid their borders of the raiders."
 ww1_usa.121.a: "Prepare for battle!"
 ww1_usa.122.t: "[USA.GetName] demands to transfer power immediately!"
 ww1_usa.122.d: "The Americans intend to enter a full-fledged war if we do not obey them. In fact, they will turn us into a their puppet!"
 ww1_usa.122.a: "It looks like there is no choice."
 ww1_usa.122.b: "This is an insult to my pride!"
 ww1_usa.123.t: "Pershing leads the Expedition into Mexico!"
 ww1_usa.123.d: "The general crossed the border with his corps. He intends to finally surround and capture Pancho Villa. He has little time and the official Mexican authorities will be extremely unhappy."
 ww1_usa.123.a: "Hurrah!"
 ww1_usa.124.t: "Pancho Villa captured by Americans"
 ww1_usa.124.d: ""
 ww1_usa.124.a: "The end of the Border War."
 ww1_usa.125.t: "Mexican government expels Americans"
 ww1_usa.125.d: ""
 ww1_usa.125.a: "Unluckly."
 ww1_usa.126.t: "Mexican government expels Americans"
 ww1_usa.126.d: ""
 ww1_usa.126.a: "Finally, they are gone."
 ww1_usa.129.t: "Philippines Revolts!"
 ww1_usa.129.d: "Due to our failure to win the Great War, our debts not payed by the defeated Entente, and rising nationalism, the Filipino people have begun a revolt as they've been seeking their independence since we invaded them in 1898."
 ww1_usa.129.a: "We will resist their attempt."
 ww1_usa.129.b: "Who even cares!"
 ww1_usa.129.c: "You can have some autonomy there."
USA_economic_downturn7: "Benefit of Economic Loans"

 ww1_USA.131.t: "Philippines Independence"
 ww1_USA.131.d: "Binarilan natin ang mga puting bayag nila!"
 ww1_USA.131.a: "Kalayaan!"
 ww1_usa.132.t: "Response on the Zimmermann Telegram"
 ww1_usa.132.d: "The German foreign minister, Artur Zimmermann, sent a secret telegram to Mexico, urging them to side with them and invade our country. This is clear hostile act on the United States. [GER.GetNameDefCap] has launched and operating the unrestricted submarine warfare and sank many ships with their submarines in hopes of cutting off supplies to the Entente. Many of these ships were American or had a large number of American passengers. The most known was the Lusitania. In addition, many circumstances, such as mysterious explosions presumed to have been caused by Germany, indicate that they considers us as their enemy. If they want war, we can declare war and join the Entente to end them.\nThe President [USA.GetLeader] has already submitted an agenda that including declaralation of war on [GER.GetNameDef] to the Congress. The Congress answered..."
 ww1_usa.132.a: "Our country is at war against [GER.GetNameDef]."
 ww1_usa.132.b: "The agenda is rejected."
 ww1_usa.133.t: "America Against Germany"
 ww1_usa.133.d: "[USA.GetNameDefCap] joined the war against [GER.GetNameDef]. We can declare war on them with siding [USA.GetNameDef]."
 ww1_usa.133.a: "To war."
 ww1_usa.133.b: "No war."
 ww1_usa.134.a: "Outrageous, but there is no evidence."
 ww1_usa.134.d: "Suspected German saboteurs destroyed a major US munitions dump in New Jersey at Black Tom Pier. Four people were killed in the explosion, and about a hundred were injured. And above all, it is gone too far that the Statue of Liberty, which France presented us, was damaged."
 ww1_usa.134.t: "Black Tom explosion"
 ww1_usa.135.d: "The explosions in New York Harbor, killed four people and destroyed some $20,000,000 worth of military goods. This incident also damaged the Statue of Liberty. It was one of the largest artificial explosions in history.\nThe term "Black Tom" originally referred to an island in New York Harbor next to Liberty Island. It was also a major munitions depot for the Northeastern [USA.GetName]. [USA.GetNameDefCap] is neutral in respect to the Great War and its munitions companies earlier in the war could sell to any buyer. Due to the blockade of Germany by the Entente, however, only the Allied Governments are able to purchase American munitions. As a result, some indicate that Germany sent spies to America to disrupt by any means necessary the production and delivery of war munitions."
 ww1_usa.135.a: "Who do you think we are?"
 ww1_usa.135.b: "Everything is all abroad. You Jerries!"
 ww1_usa.136.t: "[USA.GetName] wants to sell Rifles"
 ww1_usa.136.d: "[USA.GetNameDefCap], one of the industrial powerhouses, has contacted with her intention to sell infantry firearms, munition, and clothing for our army. We can get some money to buy these to use in the battlefields, by issuing wartime bonds."
 ww1_usa.136.a: "Deal."
 ww1_usa.136.b: "Not big deal."
 ww1_usa.137.t: "[FROM.GetName] agreed to buy Rifles"
 ww1_usa.137.d: "[FROM.GetAdjective] government replied yes to our deal offer. The payment is getting shipped to America."
 ww1_usa.137.a: "Monetized!"
 ww1_usa.138.t: "[FROM.GetName] don't want to buy Rifles"
 ww1_usa.138.d: "[FROM.GetAdjective] government replied no to our deal offer. I guess they are not afford to buy these fine rifles."
 ww1_usa.138.a: "We have other clients."
 ww1_usa.139.t: "[USA.GetName] wants to sell Artilleries"
 ww1_usa.139.d: "[USA.GetNameDefCap], one of the industrial powerhouses, has contacted with her intention to sell field cannons and munitions. We can get some money to buy these to use in the battlefields, by issuing wartime bonds."
 ww1_usa.140.t: "[FROM.GetName] agreed to buy Artilleries"
 ww1_usa.140.d: "[FROM.GetAdjective] government replied yes to our deal offer. The payment is getting shipped to America."
 ww1_usa.141.t: "[FROM.GetName] don't want to buy Artilleries"
 ww1_usa.141.d: "[FROM.GetAdjective] government replied no to our deal offer. I guess they are not afford to buy these fine artilleries."
 ww1_usa.142.t: "[USA.GetName] wants to sell Foods"
 ww1_usa.142.d: "[USA.GetNameDefCap], one of the agricultural powerhouses, has contacted with her intention to sell foods for our citizens and the military. We can get some money to buy these to supply them, by issuing wartime bonds."
 ww1_usa.143.t: "[FROM.GetName] agreed to buy Foods"
 ww1_usa.143.d: "[FROM.GetAdjective] government replied yes to our deal offer. The payment is getting shipped to America."
 ww1_usa.144.t: "[FROM.GetName] don't want to buy Foods"
 ww1_usa.144.d: "[FROM.GetAdjective] government replied no to our deal offer. I guess they are not afford to buy these edible goods."
 ww1_usa.145.t: "End of the U.S. occupation in American countries?"
 ww1_usa.145.d: "Because of the Great Depression, the government is feeling pressure to withdraw the troops from the occupied countries in Americas."
 ww1_usa.145.a: "Sure, it's burdensome."
 ww1_usa.145.b: "Never."

ww1_USA.67.t: "Mena's Rebellion!"
ww1_USA.67.d: "Angered by US influence over Nicaragua, Famed General Mena has lead a coup of the Nicaraguan government, appointing himself leader. He has promised to purge Nicaragua of US influence and mantain its independence. Adolfo has reorganized in the east and called for US intervention to save him."
ww1_USA.67.a: "Direct a force of Marines and batteships to his location!"
ww1_USA.66.t: "Nicaragua Agrees to Our Terms"
ww1_USA.66.d: "Realizing the reality of their situation, Adolfo has agreed to our offer of cheap loans and encouraging business investment in their country, in return for him making sure Nicaragua offers our companies concessions."
ww1_USA.66.a: "You couldn't live with yourself, and where did it bring you?"
ww1_USA.65.t: "A Deal With the Devil?"
ww1_USA.63.t: "Juan Estrada Forced to Resign in Nicaragua"
ww1_USA.63.d: "Juan Estrada has been forced to resign as president in Nicaragua by his war minister Luis Mena. This comes after increasing unpopularity from his precieved selling out of the country to America. He has been replaced by a more conservative man, Adolfo Díaz."
ww1_USA.63.a: "Get a line to Managua, now!"
ww1_USA.64.t: "The Nicaraguan Economy is Crashing!"
ww1_USA.64.d: "With a lack of American investment, the Nicaraguan is facing deep decline, as investment in the country is stalled. In addition, many companies are exporting jobs from Nicaragua to cheaper places. With this economic collapse, Adolfo is becoming desperate. We could most likely swoop in and offer Nicaragua more American investment and loans, in return for some concessions."
ww1_USA.64.a: "We'll send them an offer they can't refuse!"
oust_jose_25.tt: "We will become §Y25%§! more prepared to force §YJose Madriz§! to flee!"
oust_jose_100.tt: "Our preparedness to force §YJose Madriz§! to flee is §Y100%§!"
oust_jose.tt: "With these decisions, we will be able to replace §YJose Madriz§! with a more... friendly President, who will allow us to upgrade the §YCompany Ventures in the America's§Y national spirit."
ww1_USA.158.t: "Broadside - Why, Because, Why, Because."
ww1_USA.158.d: "We've made it clear to Americans what is needed of them to help their country, but why? Why does drifting from your job comfort the Kaiser? Because idle machines reduce production and weaken our army. Why does Uncle Sam need you on the job? Because without you the fighters for freedom will not be armed fed and clothed. A chain is only as strong as its weakest link. You are a link in the chain of production. If you do not stay on the job, you weaken the chain. It is of the upmost importance all Americans stick to their jobs!"
ww1_USA.158.a: "Don't break the chain and doom your country!"
ww1_USA.157.t: "Broadside - The Battle Line is Not Alone in France!"
ww1_USA.157.d: "While the United States is a vast nation with huge resource deposits, we have our fair share of shortages of key resources and items. Therefore, we encourage all Americans to look in their own homes and see what they can donate towards the war effort! The steel in your appliances can be turned into guns and bullets! Rubber in your old shoes can be used in motorized and aviation equipment! The battle in france is won with equipment, and the key to producing more equipment may be in your home!"
ww1_USA.157.a: "You can directly help our boys on the battle line of freedom!"
ww1_USA.156.t: "Broadside - Our Part"
ww1_USA.156.d: "The next best thing to being in the trenches, and actually fighting for democracy, is being in the factories, and actually making supplies. These enable our boys at the front to continue the fight for democracy. We must all do our part! Working full time and giving your all in your work ensures our soldiers can give their all in battle!"
ww1_USA.156.a: "The soldier is important. The worker is important. You are important."
ww1_USA.155.t: "Broadside - Only Men and Things Will Win the War"
ww1_USA.155.d: "Many average Americans ask themselves: how can we further help our country in its time of need?\n\nOur answer to them is simple: We need men, and 'things'. The average American citizen is attached to its consumerist life style, with an expectance of luxury goods and accessories avaible for purchase at all times. These 'things' take up labor and resources that could be used towards the war effort. What use is a fancy carpet when that purchase could cement the subjugation of America under the Kaisers thumb! We must ask Americans to give up the consumerist life style, atleast for now. Instead of expecting a variety of unneeded goods, embrace a reduction in useless consumption!"
ww1_USA.155.a: "The greatest luxury of all is knowing you helped your country"
ww1_USA.154.t: "Broadside - In the War?"
ww1_USA.154.d: "We are at war, this is a simple fact of life. Some Americans, however, have failed to grasp the severity and sheer importance of the war in which we now find ourselves involved. We must ask the American people: are you giving your best efforts to the country? Or do you think that because you are not in the trenches, your efforts arn't needed for the war! It must be said loudly and clearly that every American has a role to play! The coal our miners mine fuels our war machine! The irreplacable labor our men in the factories put in every day provides our army with their weapons of war! The American farmers feed the mouths of our soldiers! Every Americans work is significant and impactful. Put in your all, because your country needs you!"
ww1_USA.154.a: "Buck up! Get in the push! Help win the war!"
ww1_USA.153.t: "Broadside - Beware of German Traps and German Trouble Makers"
ww1_USA.153.d: "The tricky Germans have instigated a collapse of the Russian government by covertly supporting radical groups like the Bolsheviks. This is a tragic loss of an ally, but serves as a lesson to those of us at home! Let it be known: there is no doubt the Germans are already supporting radical groups similar to the Bolsheviks at home. We must be very careful, and while the sedition act is helping to root out traitors, we need the common mans help! Be on guard, as German spies can be anywhere at any time. If you suspect anyone of violating the sedition act, say something!"
ww1_USA.153.a: "We can't let it happen here!"
ww1_USA.61.t: "Jose Madriz flees Nicaragua!"
ww1_USA.61.d: "We've done it! Today Jose Madriz resigned the office of President in Nicaragua, giving power to Juan Estrada, a much more... friendly leader. Already, Juan has publicly endorsed Taft's "dollar diplomacy" strategy, inviting American business and loans to the country."
ww1_USA.61.a: "Mission accomplished."
ww1_USA.62.t: "Jose Madriz Flees Nicaraqua"
ww1_USA.124.t: "New York Stock Exchange Closes"
ww1_USA.124.d: "It seems the reality of the Great War is starting to have its effects on America. Today, the New York stock exchange announced it will be temporarily closing for the foreseeable future. They comes as the Treasury Secretary pressured the closure to prevent foreign countries from buying American gold. This is sadly having a great impact on the American economy, which is beginning to slide back into the recession we just started to come out of."
ww1_USA.124.a: "All of this because of some dumb European war over lines on a map?"

ww1_USA.125.t: "Paint Creek-Cabin Creek Strike"
ww1_USA.125.d: "While coal strikes are not at all uncommon in West Virginia, an unusually large and violent one has broken out in Kanawha County, West Virginia. This comes as workers in the area demanded the same levels compensation as workers in other area. With the local coal companies refusing, the area has broken out in protests and strikes. Several socialist organizations have already declared their support for the strikers, promising to financially back the strikers for however long it takes. The strike is quickly expanding, with over 5,000 miners from the north side of the Kanawha River joining their comrades in Kanawha county. Martial law has already been declared by governor Glasscock, and local clashes have began breaking out."
ww1_USA.125.a: "Can these damn strikers go one day without being a nuisance?"
ww1_USA.126.t: "End of the Paint Creek-Cabin Creek Strike"
ww1_USA.126.d: "The infamous Paint Creek-Cabin Creek strike has finally came to end today with the announcement of the Kern Resolution being seen as an acceptable concession towards the workers. The strike has lead to the death of 75 people as well as martial law in the state of West Virginia. Needless to say, all parties involved are glad to see an end to the bloodshed."
ww1_USA.126.a: "Good to see this come to an end"
ENG_finance_crisis: "Financial Strain of The Great War"
ww1_USA.127.t: "Coal Wars Spread to Michigan!"
ww1_USA.127.d: "Miners in Copper Country, located in the Upper Peninsula of Michigian, have gone on strike over various issues. These include almost tyrannical control over worker's lives due to the unfair policies in company towns, the one-man drill causing unsafe working conditions and unemployment, long hours, low wages, and the usage of children in mines. Those on strike joined the Western Federation of Miners, and a referendum was put into effect after 8,000 workers voted upon it, causing the local economy to collapse."
ww1_england.265.t: "Financing The Entente"
 ww1_USA.132.t: "Britain Pleads For us to Lift Ban on Loans"
ww1_USA.132.a: "We can both benefit greatly from these loans, approve them"
ww1_USA.132.d: "While as it currently stands, American loans to foreign powers at war are banned, the British have personally requested we remove these restrictions. They claim that their economy is at risk of collapse, and without American loans they very well may lose the war. With Germanys history of anti American statements, as well as their constant attempts to contest our sphere of influence across the Americas and Samoa, a victory of the Kaiser would not serve Americas interests.\n\nIn addition, the outbreak of the Great War has hit the American economy hard due to a great reduction of economic stability and trade across the world. Many economic experts have pushed hard to see these loans unbanned, as they would greatly strengthen the American economy.\n\nHowever, isolationists like William Jenning Bryans claim although allowing loans to the British would technically come with allowing loans to all fighting powers, these loans would unproportionately benefit the Entente much much more then the Central Powers, which could anger them and thus threaten our neutrality. They call to keep the current law, and look at other methods towards strengthening the economy. What should we say?"
ww1_USA.132.b: "And compromise our neutrality? No way!"
ww1_england.265.d: "As the country with the deepest financial markets and strongest credit rating, as well as the financial hub of the world, our dominions and allies have looked towards us as the financial backer of the war. Indeed, we do have an obligation to help our dominions at the minimum, and this won't be cheap. While the economic super power of the world, we do not have infinite money, and there is a real risk that if the war does not end quickly then we will have to take unwanted measures, like selling assets or even getting loans from the Americans."
ww1_england.265.a: "Not a problem, the war will be over by Christmas"
ww1_USA.127.a: "We need action!"
ww1_USA.128.t: "End of the Copper Country Strike"
ww1_USA.128.d: "After months of violence and hardship, 2,500 miners voted for the strike to end on April 13th, citing hardships for their families, the WFM running out of money, and thousands of workers leaving Copper Country to find employment elsewhere. However, several mines did concede some points, establishing eight-hour workdays, and Congress is reportedly in the works on several labor bills that would grant most of the striker's demands."
ww1_USA.128.a: ""
ww1_USA.129.t: "Coal Mine Strike begins in Colorado!"
ww1_USA.129.d: "LOC WRITERS DO YOUR FUCKING JOB"
ww1_USA.129.a: ""
ww1_USA.130.t: "Battles fought in Colorado Strikes"
ww1_USA.130.d: "LOC WRITERS DO YOUR FUCKING JOB"
ww1_USA.130.a: ""
ww1_USA.131.t: "End of the Colorado Coal Strikes"
ww1_USA.131.d: "LOC WRITERS DO YOUR FUCKING JOB"
ww1_USA.131.a: ""

ww1_USA_wilson.26.t: "A National Day of Praying For the End of The Great War?"
ww1_USA_wilson.26.d: "With the reality that the Great War in Europe is not going to end any time soon setting in, the general mood of America is that of disappointment in the failure of a peaceful option. Most in America simply wish for a peace deal with no territorial changes, and for Europe to sort out its rivarlies.\n\nPresident Wilson also shares these feelings, and despite his attempts to bring Europe together for a peace treaty, Europes leaders have only responded with half hearted responses or no response at all. Thus, Wilson has personally thought of the idea of declaring a day for prayer of peace in Europe. Of course theres no chance Europe will seek out a peaceful end to the war at this point, but declaring a day for prayer of peace would be a nice symbolic gesture to Americas commitment for world peace, and its commitment to neutrality."
ww1_USA_wilson.26.a: "Let's do it, history will know America is a nation of peace!"
ww1_USA_wilson.26.b: "This sounds like a waste of time."
 USA_promised_not_to_pass_resources_of_war: "We have reassured Pinchot that we will prioritize conservation over resource extraction"
ww1_USA_wilson.27.t: "Midterm Elections - Democrats Increase Majority in Congress"
ww1_USA_wilson.27.d: "In a somewhat unsuprising, but still uncommon event in American history, the current Presidents party has seen a increase in congressional seats. While usually the opposition party of the president sees great success in the midterms due to a variety of factors, in yesterdays elections the Democratic party increased its majorities. This is due to the wide variety of popular progressive legislation that Wilson has passed in the last 2 years, while overseeing a much stronger economy then the one he inherited. With this increase in Democratic majorities, Wilson is expected to have a easier time passing more progressive legislation."
USA_corrupted_politics: "Corrupt Political System"
 ww1_USA_wilson.32.t: "Midterm Elections - Democrats Secure Super Majority In Congress"
 ww1_USA_wilson.32.d: "Last nights midterm election results have turned out beyond our wildest dreams! Not only did we keep both chambers of congresses, we expanded our majorities, and we expanded them significantly, with a 2/3rds majority. Its safe to say we successfully passed our major legislation promises, and ensured the economy directly benefited the development of Americans. With these huge majorities, we should be able to easily pass whatever we desire, within reason, without having to water it down at all."
 ww1_USA_wilson.32.a: "This will be the progressive century!"
ww1_USA_wilson.30.t: "Midterm Elections - Republicans Secure Comfortable Control Over Both Chambers of Congress"
ww1_USA_wilson.30.d: "Complete disaster has struck the Democrat Party today as the results of the midterms elections have finally been counted. There's really no other way to put it, these elections were a blood bath. We've been crushed in competative elections, elections that leaned towards us, and even elections that Republicans were predicted to have no chance at winning.\n\nWhile the incumbent party losing control over congress after midterm elections is heard of in American politics, the shear severity of the loss is not. It seems our administration was not competent enough to pass any of its promised legislation, nor did our economy see any improvements for the average Americans life. "
ww1_USA_wilson.30.a: "Oh god! Our presidency is surely done for!"
ww1_USA_wilson.31.t: "Midterm Elections - Republicans Capture the House"
ww1_USA_wilson.31.d: "The midterm election results are in, and it's definitely not what we hoped for. It looks like we failed to pass our promised agenda, or Americans just didn't see any benefits from our economy. Either way, Republicans have secured a narrow control of the House, and thus governing is going to be much harder. "
ww1_USA_wilson.31.a: "We will persist!"
USA_no_controll_congress: "Has Lost Control of Congress"
ww1_USA_wilson.27.a: "Great news!"
ww1_USA_roosevelt.20.t: "Roosevelt Enforces 1871 KKK Ban"
ww1_USA_roosevelt.20.d: "Roosevelt today announced to a shocked crowd that he would enforce the 1871 KKK ban as law against the second Klan. Stating that the second Klan is "clearly just as radical as the first", Roosevelt has claimed that refusing to enforce the law against the new Klan would set a bad precedent for rule of law in the United States. Thus, as it stands for now, police officers across the nation have direct orders to break up KKK meetings and arrest members who refuse to renounce membership.\n\nConservatives have rallied against this decision, claiming that this is a federal overreach against a peaceful and non violent organization that is being subject to political persecution. While obviously false, many average Americans are sadly believing this propaganda."
ww1_USA_roosevelt.20.a: "We are a nation of laws!"
ww1_USA_roosevelt.12.t: "Conservatives Organize Against Roosevelt"
ww1_USA_roosevelt.12.d: "Just a few months into Roosevelt's third term, conservative opposition across the spectrum have began organizing for the 1914 midterms. While relatively unpopular for now, figures across the New Nationalist Coalition are worried that if not handled well, they could make gains amongst the public. The American electorate, after all, is notorious for turning against the party in power during the midterms.\n\nWhile we have the advantage for now, this could quickly fall. Passing unpopular legislation, mismanaging internal party politics, and failing to combat conservative narratives could all lead to them gaining the advantage. If they did win the House and Senate, it's clear that Roosevelt would have no hope at passing the vast majority of his legislation."
ww1_USA_roosevelt.12.a: "We must win the heart and soul of the American people."
USA_not_complete_resource: "We will not be able to take the focus §YThe Resources Of War§!"
ww1_USA_roosevelt.11.t: "Gifford Pinchot Demands Reassurance On Conservation Policies"
ww1_USA_roosevelt.11.d: "Gifford Pinchot, one of Roosevelt's longest advisors, has today personally raised his concerns to Roosevelt over enviornmentalist policies. Due to Roosevelts history of ignoring company giants he deems "worthy", and Roosevelts support for an expansion of war industry, Pinchot has raised his concern that Roosevelt would prioritize the extraction of resources needed to fuel a war machine over conservation and protection of the enviornment.\n\nWhile Pinchot is definitely a valued advisor, his demand that we guarantee to prioritize the protection of the enviornment could leave us in a bad position for a future war, and who knows what else Pinchot would demand? Whatever the case may be, it is ultimately Roosevelts decision on how to reply"
ww1_USA_roosevelt.11.a: "This is a no-brainer, give him our reassurance."
ww1_USA_roosevelt.11.b: "We will keep our options open"
ww1_USA.62.d: "Under immense pressure from the Americans, Nicaraquan president Jose Madriz has reigned as president, handing over power to Juan Estrada, a pro American leader. Former president Jose's downfall comes after his failure to supress conservative anti American protests down south, threatening American business there.\n\nAlready, Juan as denounced european influence, and has reached out to US president Taft looking for "further cooperation""
ww1_USA.62a: "This is for the Best."
ww1_USA.62b: "An Obvious Powergrab by the Americans"
ww1_USA.60.a: "We will do what's best for them, even if they don't understand why!"
ww1_USA.60.t: "Smedley Butler's Marines Arrive Off the Coast of Nicaragua"
ww1_USA.60.d: "Over the past few years, Nicaragua has been facing multiple conservative revolts first starting against the former president Zelaya's government, having captured many small towns on the border with Costa Rica and were fomenting an open rebellion in the capital of Managua. With the new president, Jose Madriz, failing to deal with these rebellions, it has become clear to American leadership that Jose Madriz needs to go. To pressure Jose Madriz into fleeing the country, we've organized a 250 strong marine force off the coast of Nicaragua, to make sure Nicaragua knows we will always be ready to secure our interests..."
ww1_USA.59.t: "Roosevelt Announces Run for Republican Nominee"
ww1_USA.59.d: "Stating he would "gladly accept" a Republican nomination for president, Roosevelt has confirmed the fears of many, that he will be challenging taft next November. While favored amongst the general population, Roosevelt and Taft are bitterly close amongst support of the party higherups, who actually nominate the president in most states."
ww1_USA.59.a: "Shit, shit!"
ww1_USA.143.t: "War Reaches America"
ww1_USA.143.d: "Even though it was seen as inevitable by many, the news that America has offically declared war on the German Empire has still sent shock waves across the country. While public opinion has shifted dramatically from a few years ago, there are still many in the United States in favor of neutrality, particularly amongst the German and Irish populations in the country.\n\nLuckily, atleast for now, American patriotism has spiked as a reaction to the war, and serious protests have been non existent. Still, the realities of war are expected to hit in the coming days. Those in opposition, funded by the Kaiser no doubt, are beginning to organize and plan their next move. German spies continue to distibute pro neutrality newspapers, and despite a surge in patriotism the silent majority of Americans are apathetic about the war at best.\n\nWhat certainly won't help the popularity of the war is the new economic conditions expected to sit in relatively soon. The soldiers of the country are always going to come first, and combining that with German submarine attacks, food is expected to become scarce in the coming months. We don't expect citizens to starve in the streets of course, but this dramatic shift in living standards for the average American certainly won't be a welcome one. We must ensure a proper balance between ensuring our soldiers have enough food while also ensuring our measures arn't so dramatic they cause bread riots."
 USA_a_safe_place: "Welcome Talented Refugees"
ww1_USA.144.t: "Food Surpluses Increase"
ww1_USA.144.d: "The Stock-Raising Homestead Act has, like expected, lead to a large incease of food in the United States. Americans are enjoying lower food prices for now, and it is expected that if America enters The Great War it will have more food left over for its citizens."
ww1_USA.144.a: "Great!"
ww1_USA.160.t: "Constitutionalists Oppose Our Plan to Invade Mexico"
ww1_USA.160.d: "Unexpectedly, the constitutionalists in Mexico have pleaded for us to abandon our planned invasion of [MEX.GetLeader]'s Mexico, and even stated they would consider it an invasion of their country if so. Stating that American troops helping in war  would only lose them popular support in Mexico, they have made it clear they have no interest in taking control of Mexico if we made a blitz to Mexico City and forced the government there to capitulate. Even worse, they have said that they would consider this invasion a direct threat to Mexican sovereignty, and would be forced to join forces with all Mexican factions in an anti American alliance to secure their countries independence.\n\nThe exact reason for this level of untrust and outright hostility to us when we are just trying to help them isn't known, but one things for sure: if we don't order the army to stop the invasion plans, we may just find ourselves at war with all of Mexico. Once the Mexicans organize, a painful guerilla warfare is certain to follow, and this war would most likely be no goud for our poll numbers at home. Shall we order our army to halt its advance towards Mexico City, or should we drag ourselves into a war with all of Mexico."
ww1_USA_clark.9.t: "Several Unions Announce Anti Corruption Reforms"
ww1_USA_clark.9.d: "Scared of potential Department of Justice imvestigations shutting them down completly, several unions have announced that 'in light of recent events' they will be performing anti corruption purged amongst their lower ranks, to restore faith in the American people. While President Clark has shed doubt on these self investigations, they due seem to be fairly legit as of late."
ww1_USA_clark.9.a:  "Are they really reforming, or trying to cover up their corruption?"
ww1_USA.161.t: "The Mexican Quagmire"
ww1_USA_clark.4.t: "A Meeting in the White House"
ww1_USA_clark.5.t: "Department of Justice Announces Investigation of Several Union"
ww1_USA_clark.6.t: "Several Top Labour Union Leaders Charged With Embezzlement!"
ww1_USA_clark.6.d: "The investigation of union corruption by the Department of Justice has already seen results. Several top labour union officals have been caught mismanaging large sums of union money, most certainly putting it in their own pockets! While offical charges have yet to be given, its obvious to anyone that the vast majority of these men are guilty.\n\nIn light of recent news, many Americans have began questioning just how much unions have their interests in mind. The sheer number of cases is suprising to most, and many have began to distrust unions as a result of the non stop reporting on it in the local paper."
ww1_USA_clark.6.a: "They thought they could hide from the law?"
ww1_USA_clark.7.t: "Politicians Caught up in Union Bribing Scandal"
ww1_USA_clark.7.d: "The Department of Justice's investigation of unions corruption has seen a wide variety of politicians caught up in suspicious activities involving payment of sums of money from unions. With further investigation, its been revealed unions have been engaging in outright bribery of several state government officals. With this corruption scandal revealed, many arrests have been made and further investigations are being made. This has greatly reduced the positive view many Americans have of unions, while leading to several union officals arrested."
ww1_USA_clark.7.a: "Scums! All of them!"
ww1_USA_clark.8.t: "Decline in Union Membership"
ww1_USA_clark.8.d: "After several arrests of union officals for various corruption charges, many Americans have rapidly shifted from overwhelmingly positive views of unions to being much more divided. Some think pretty much all unions are inheriently corrupt, while some think theres only a few bad actors in the union sector. Either way, many Americans are leaving their local unions, many Americans who were considering starting a union have abandoned their plan."
ww1_USA_clark.8.a: "Good for the free market"
ww1_USA_clark.5.d: "The rise of organized labour in the United States has also led to some bad actors infiltrating the movement for their own benefit. Rumors of embezzlement and bribary amongst unions, while not mainstream, seem to have captured the eyes of the Department of Justice. Several influential union accused of such crimes have began to be investigated by the Department of Justice, who has stated union corruption may go much deeper then we think.\n\nWhile the President usually stays out of DOJ cases, Champ Clark has thrown his full support behind these investigations, stating that there are very real concerns about mass union corruption, and the threat they hold to America in terms of possible bribings of United States politicians."
ww1_USA_clark.5.a: "They won't get away with what they've done!"
ww1_USA_clark.4.d: "After a eyebrow raising meeting with the leaders of Americas industrial giants, most notably being Henry Ford and John Rockefeller, President Clark has announced a 'board of industrial experts' to serve as close advisors to him. Several of these experts are expected to be appointed to key positions such as the Department of Labour, while some will just be advising Clarks congressional policies.\n\nProgressives, most of which who already have held a dislike of Clark, are outraged, seeing this as Clark blatanly selling the executive branch out to corporations. Meanwhile, conservatives and business leaders have praised the President for finally taking the advice of those who know best for the economy."
ww1_USA_clark.4.a: "These people are rich and successful business men for a reason!"
ww1_USA.161.d: "Our attempt to blitz through Mexico to install a puppet regime has failed. No matter how it happened, Mexican forces have finally been able to begin reorganizing themselves much faster then expected using local guerilla warfare tactics to halt our army's advance. Already, publications on the brutality of the war in Mexico have began circulating across America as anti war forces have began demanding the President accept defeat and pull out of Mexico.\n\nWhile anti war protests arn't exactly widespread yet, 'yet' is most likely going to end up being the key word in that statement. As the war continues, and casualties rise, opposition to The Second Mexican American war is likely to continue rising. If we don't hurry this war up, we may face a complete disaster in the next Elections. "
ww1_USA.161.a: "Stay calm! Final victory is just a few months away"
ww1_USA.160.a: "Do the Constitutionalists think their objections matter?"
ww1_USA.160.b: "Quick, get a line to Mayo and order him to halt any further advances into Mexican territory"
USA_invade_mexico.tt: "We will invade all §CMexico§! factions. We will have to fully capitulate all existing §CMexico's§! in 30 days or else the situation may evolve §Rnot necessarily to our advantage.§!"
stcok_fod: "When we enter the war, the severity of food shortages will be reduced."
ww1_USA.142.t: "The Tampico Affair"
ww1_USA.142.d: "A diplomatic crisis has broken out between the United States and [MEX.GetLeader]'s Mexico. Yesterday, 9 of our sailors just trying to purchase gasoline from a local merchant in Veracruz were arrested for 'trespassing land declared off-limits for foreigners, and thrown in jail. When General Ignacio Morelos Zaragoza, the superior of the commander who ordered the American soldiers arrest learned about what happened, he of course realized the misunderstanding and even jailed the commander who ordered the American soldiers arrest on the basis of negligence, and sent us an offical apology letter.\n\nStill, this has not satisfied the commander of the United States navy, Henry Mayo. He instead ordered the local garrison to hoist the American flag in a prominent location and salute it with 21 guns. General Zaragoza denied this request, and thus Henry Mayo has looked to [USA.GetLeader] to authorize not only the occupation of port Veracruz, but a full scale invasion towards Mexico City to topple the unfriendly regime and replace it with the constitutionalist rebels.\n\nWhile a shaky justification for sure, this could be one of the only opprotunities to finally ensure a stable and American friendly regime in Mexico through an invasion that would atleast not face total opposition from the public. There is however a risk that the operation does not go as planned. We could face unexpected resistance from Mexican partisans that would end up dragging the United States into a long and costly conflict with Mexico instead of the quick coup d'état of the Mexican government that's planned. Any sort of long conflict would certainly be political suicide after all."
ww1_USA.142.a: "What an opportunity! Land at Veracruz and inform our allies in Mexico of the plan!"
invasion_in_14: "If the §7Constitutionalists§! agree, we will launch a pincer operation to encircle and capture §YMexico City§! in 14 days, then transfer control of Mexico over to the §7Constitutionalists§!. Once the operation starts, we must control §YMexico City§! within 30 days, or the operation will be a failure and we will have to withdraw or engange in a highly unpopular war. If the §7Constitutionalists§! do not agree to the plan, we will have the option to abandon the plans for invading Mexico, or instead invade anyways and attempt to prop up a different pro American faction to power."
ww1_USA.142.b: "Let's issue an apology to Zaragoza for Mayo's unprofessionalism and pettiness instead"
USA_sell_infantry: "Purchase American Rifles"
USA_sell_artillery: "Sell Artillery"
USA_sell_medical_equipment: "Sell Medical Equipment"
ww1_USA.58.t: "Chevrolet Competes With Ford Motor"
ww1_USA.58.d: "Ford Motor, who has never had to deal with much competition in the automobile market, has faced new competition as a promising company named Chevrolet has recently announced its new automobile avaible for sale. Already, sales of automobiles are reaching new highs as Chevrolet and Ford Motor compete to make better and cheaper cars!"
ww1_USA.140.t: "The Gifts of American Capitilism"
ww1_USA.140.d: "While the United States government is refusing the sale of military equipment to all nations, we may be able to get our hands on American weapons anyways. Several large private producers of military equipments have announced that they will be selling their equipment to several foreign countries, including ours. If we are running low on any equipment, we should purchase some equipment from these corporations."
ww1_USA.140.a: "We'll keep it in mind"
ww1_USA.141.t: "Johann Heinrich returns from Germany"
ww1_USA.141.d: "German ambassador to the US, Johann Heinrich has returned after staying for a month in Germany during the escalating tensions. He has now returned."
ww1_USA.141.a: "Well that's good."
ww1_USA.58.a: "Capitalism breeds innovation!"
ww1_USA.92.t: "State Delegates Throw Support Behind Clark"
ww1_USA.92.d: "Seeing Clark as the best fit for the job, several state delegate leaders have began to endorse Clark, and promise their states votes in the upcoming convention. While the race seems completely locked in for Clark, supporters of Wilson still argue the primary is not over until it is over."
ww1_USA_roosevelt.18.t: "A Platforn on Civil Rights?"
ww1_USA_roosevelt.18.d: "While Roosevelt gave no offical position on civil rights during his campaign, Roosevelt still has a history of being somewhat friendly to African Americans. This, combined with Roosevelt generally surrounding himself with progressive figures, has lead to a lot of pressure on Roosevelt to offically give his stance on civil rights.\n\nSome have called for Roosevelt to atleast call for desegregation of the military, as the government is also desegregated. While it would be unrealistic to push for this now, a large war could give Roosevelt the momentum to push it through\n\nThe safer option could of course be to just ignore these people asking for a statement. After all, there is other legislation getting much more attention then these calls for a civil rights platform is. Ignoring it would probably doom any future desegregation of the army attempts, atleast for now, but it would avoid any backlash, and maybe it's better to leave this issue to a future president?"
ww1_USA_roosevelt.18.a: "Call for desegregation of the army."
ww1_USA_roosevelt.18.b: "Lets not rock the boat here."
ww1_USA_roosevelt.13.t: "Drafting the Federal Budget - Property Tax"
 ww1_USA_roosevelt.14.t: "Drafting the Federal Budget - Education Budget"
 ww1_USA_roosevelt.15.t: "Drafting the Federal Budget - Military Budget"
ww1_USA_roosevelt.16.t: "Drafting the Federal Budget - Healthcare Budget"
 ww1_USA_roosevelt.17.t: "Drafting the Federal Budget - Conservatives Drag the Process"
 ww1_USA_roosevelt.17.d: "Conservatives have began proposing ammendments to the new federal budget that would cut several programs in the name of fiscal responsibility. This has caused the federal budget to be delayed in its completion, and it's likely that conservatives are willing to drag this out if they don't get what they want.\n\nWe could wait them out, which would delay the bill and reduce our popularity amongst conservatives. We could also just give into some of their concessions, allowing the bill to quickly pass but reducing our good will amongst many in our coalition and moderate America."
ww1_USA_roosevelt.17.a: "They will have to give up once all their terrible ammendments get voted down"
ww1_USA_roosevelt.17.b: "We must be reasonable, let's agree to some of their cuts."
ww1_USA_roosevelt.16.d: "While federal spending does cover some limited amounts of healthcare expense, many claim it's not enough. Already we see people who simply die as they are unable to pay for treatment. A key progressive idea is the idea that healthcare is a human right, so it would be natural to increase the budget for healthcare to ensure less people die or get sick.\n\nHowever, increasing the healthcare budget would not be cheap, and may not be worth the extra expense. But can we really put a price on human life?"
ww1_USA_roosevelt.16.a: "We will obviously increase the budget, healthcare is a human right!"
ww1_USA_roosevelt.16.b: "Publicly endorse more spending, but secretly tell the caucus to vote against it due to its cost."
 ww1_USA_roosevelt.15.d: "The military budget is very low, and with a great war inevitable, some have called for the new federal budget to dramatically increase spending on the military. We thus, could increase funds for the construction of vital ammunition production plants needed to equip the new American army for war. However, it may also be more expensive then it is worth, and would alienate isolationists."
ww1_USA_roosevelt.15.a: "You know what they say, if you want peace then prepare for war. Approve the funding"
ww1_USA_roosevelt.15.b: "It is not needed"
 ww1_USA_roosevelt.14.d: "One of the governments primary expensives is funding public schools. While federal funding helps, public schools face teacher shortages, school supply shortages, and overcrowded classrooms. Thus, some have called for the budget to school funding to be increased. Shall we listen to them?"
ww1_USA_roosevelt.14.a: "You cannot put a price on our childrens future, increase the education budget!"
ww1_USA_roosevelt.14.b: "The current funding is suitable."
ww1_USA_roosevelt.13.d: "While the vast majority of government revenue has historically came from tariffs, the property tax has also been important to mantain a balanced budget. And thus, the first thing for us to decide in our federal budget will be on what rate we want property taxes to be.\n\nWe could spike the property tax rate, to provide funds for future expansions of the government within this budget or future government programs, however it would prove unpopular. It could, afterall, give conservatives ammunition to claim Roosevelt's policies directly lower the amount of money in their pay check, and would not help our relations with richer Americans.\n\nTherefore, we could also just keep the current property tax. While this would be safe politically, it could be a loss on government revenue that we may need if we attempt to massively expand the government budget."
ww1_USA_roosevelt.13.a: "Raise it, we need the extra revenue and most Americans will reap further benefits."
ww1_USA_roosevelt.13.b: "Keep it the same, we don't need to give conservatives any more ammunition."
ww1_USA.92.a: "Wilson can Still Win This!"
ww1_USA.92.b: "It's Only Natural the Speaker of the House Wins Against a Bunch of Nobodies"
ww1_USA_roosevelt.7.t: "Moderates Support Current Bill"
 ww1_USA_roosevelt.7.d: "The newly proposed bill in Congress has recieved widespread support amongst moderates previously reluctant to Roosevelts agenda. Due to this widespread support, many expect this bill to pass with flying colors, with only limited conservative opposition.\n\nWhile we can't expect their permanent support, we can mostly ignore this bill until it passes, unless something significant changes until then."
 ww1_USA_roosevelt.9.t: "Moderates Oppose Current Bill"
 ww1_USA_roosevelt.9.d: "The newly proposed bill in Congress, for whatever reason, has scared moderates support sway. Due to this opposition from much of the moderate faction of congress, this bill is most likely going to be a challenge to pass."
 ww1_USA_roosevelt.9.a: "They stand in the way of progress"
ww1_USA_roosevelt.10.t: "Moderates Return to Their Previous Stance"
ww1_USA_roosevelt.10.d: "While opposed to the last bill, many moderates still agree with the vast majority of the New Nationalist Coalition's ideology, and we can still expect their support most of our more moderate reforms."
ww1_USA_roosevelt.10.a: "We will welcome them back"
 ww1_USA_roosevelt.7.a: "Great!"
ww1_USA_roosevelt.8.t: "Moderates Return to Their Previous Stance"
ww1_USA_roosevelt.8.d: "While supporting the previous bill, these moderates have refused to join the New Nationalist Coalition, atleast for the near future. While disapointing, this was to be expected"
ww1_USA_roosevelt.8.a: "Their Votes Were Helpful for the Last Bill"
ww1_USA.57.t: "Roosevelt Announces New Nationalism"
ww1_USA.57.d: "Today in Kansas Roosevelt has given a speech dubbed the “New Nationalism” speech, in which Roosevelt has outlined a new role for the government in dealing with social issues, endorsing conservation, control of trusts, labor protection, and a graduated income tax. It also embraces the growing conviction that the nation must address the plight of children, women, and the underprivileged."
ww1_USA.57.a: "Is he an idealist or a delusionist?"
ww1_USA.56.t: "Southern Pacific and Union Pacific Railroads Want to Unite"
ww1_USA.56.a: "Look the other way."
ww1_USA.56.b: "File a suit to stop this merge."
ww1_USA.56.d: "Two massive railroad companies, South Pacific and Union Pacific, have announced plans to merge their companies together. This company would have a massive monopoly over railroads in the west coast, as well as possibly violating anti-trust laws. However, this company merge could also help improve the development of West Coast railway."
ww1_USA.55.t: "Robert LaFollette Challenges Taft"
ww1_USA.55.d: "With increasing anger towards Taft, Wisconsin senator Robert LaFollette has announced he will be challenging Taft in order to "save the progressive cause." While luckily not supported by Roosevelt, LaFollette has some serious support specifically in his home state of Wiscosin. Luckily for Taft however, LaFollette is quite prone to gaffes and emotional outbursts, as well as the fact that he is not liked amongst the party establishment."
ww1_USA.55.a: "The ramblings of a mad man..."
ww1_USA.54.t: "On the Need for a Federal Budget"
ww1_USA.54.d: "The CCE has come out with another report today, this time publicly available. The thesis has called for the introduction of a enforced federal budget, drafted by the president. They argue this new budget system would help increase business confidence as well as economic stability."
ww1_USA.54.a: "An interesting idea for sure!"
ww1_USA.53.t: "EEC Advises Taft on Administrative Matters"
ww1_USA.53.d: "The EEC has just came out with a report to Taft offering a wide variety of advice on the administrative and its efficiency. While not seeking direct legislation through congress, the EEC has offered taft a variety of smaller loopholes he can use to increase authority over the his cabinet and the administration in general."
ww1_USA.53.a: "They are valued advisors"
ww1_USA.51.t: "Where to Put Extra Funds?"
ww1_USA.51.d: "The new military budget expansion has still left money to be allocated. Since we have rejected some calls to put it in the development of air warfair, we are instead left with 3 main options. We could put the money into improving our infrantry equipment, our artillery, or improving our soldiers training."
ww1_USA.51.a: "Put the funds towards infrantry equipment development."
ww1_USA.51.b: "Allocate it to artillery production."
ww1_USA.51.c: "We need to invest in modernizing our tactics."
ww1_USA.2.t: "Boll Weevils Destroy Southern Cotton Farms."
ww1_USA.2.d: "The boll weevil, a cotton feeding insect native to Mexico, has recently been spotted in southern farms across the south! First reported in Texas, this bug has spread and caused havok to cotton farmers. This issue is especially prevelent in Alabama, where entire farming communities across the state are reporting their cotton completly gone because of the bug.\n\nWith this presents us two options, we could simply advise the Alabaman government to do nothing. This would definitely cause some economic issues in the state, but the bug will have to go away eventually, when winter comes. We could also advice Alabaman farmers begin diversifying crop production. This will be expensive, but ensure we don't have to worry about further issues down the road with this bug. What should we do?"
ww1_USA.2.a: "Let's attempt to diversify crop production."
ww1_USA.2.b: "Unfortunate, but theres not much we can do other then waiting it out."
ww1_USA.4.t: "Charles Evans Hughes confirmed as Supreme Court justice"
ww1_USA.4.d: "Today, without debate, the United States Congress confirmed former New York Governor Hughes as an Associate Justice on the Supreme Court. Hughes, who had seen through many reforms as governor of New York, has earned himself popularity amongst progressives from all sides. With this, the court is expected to shift towards the progressive side of things. While Progresives are satisfied, some Conservatives are grumbling."
ww1_USA.4.a: "Hopefully this will please progressives in the party."
ww1_USA.5.t:  "Armed mob drives out Japanese workers in Washington!"
ww1_USA.5.d: "The state of Washington has became the stage for a troubling confrontation as armed mobs have forcefully drove out 30 Japanese lumberjacks from their homes, kicking them out of the state completly. Local police have generally refused to intervene in the affair, and thus only federal pressure could really do anything. Although anti-Asian sentiment in general is high in America, not doing anything would decrease Japan's opinions of us."
ww1_USA.5.a: "If we won't defend their freedom, who else will?"
ww1_USA.5.b: "Surely there are more pressing issues facing the country right now."
ww1_USA.6.t: "4th of July celebrations!"
ww1_USA.6.d: "It's that time of year again, as Americans from sea to shining sea prepare to celebrate the independence of our great nation from our past British oppressors! Already, fireworks are painting the skies as parades across the country begin."
ww1_USA.71.t: "Dominican Government Overthrown!"
ww1_USA.71.d: "The Dominican government, increasingly facing more and more anti-American protests, has collapsed today as the army declared a temporary junta. Built on the ideas of nationalism and fighting foreign influence, American companies have already either pulled out or faced severe restrictions"
ww1_USA.73.t: "Cuban Government Overthrown!"
ww1_USA.73.d: "The Cuban government, increasingly facing more and more anti-American protests, has collapsed today as the army declared a temporary junta. Build on the ideas of nationalism and fighting foreign influence, American companies have already either pulled out or faced severe restrictions"
ww1_USA.6.a: "Happy 4th!"
ww1_USA.74.t: "New York Bans Drunk Driving"
ww1_USA.74.d: "Faced with increasing amounts of car accidents, and a clear link to being drunk and reduced ability to drive safely, New York has become the first state nation wide to offically criminalize driving while intoxicated. This move has been met with widespread support amongst prohibitionists, seen as very legitimizing to their movement, while some more "libertarian" (and probably alcoholic) New Yorkers have began protesting this "overstepping of the government""
ww1_USA.74.a: "Surely we Can Agree Driving while Drunk Isn't Safe, Right?"
ww1_USA.72.t: "Honduras Government Overthrown!"
ww1_USA.72.d: "The Honduran government, increasingly facing more and more anti-American protests, has collapsed today as the army declared a temporary junta. Build on the ideas of nationalism and fighting foreign influence, American companies have already either pulled out or faced severe restrictions"
ww1_USA.7.t: "The Americans Offer us a Trade Agreement."
ww1_USA.7.d: "The United States of America has sent our government a letter proposing a joint reduction of tarrifs on eachother. This would make our products cheaper, but some on the right claim this will threaten Canadian independence or hurt local economies."
ww1_USA.7.a: "Ignore their complaints and tell the Americans we will hold it to a vote."
ww1_USA.8.t: "Canadian Government agrees vote on joint tarrif reductions!"
ww1_USA.8.d: "We have gotten word from our friends up north that the liberal government has agreed on our proposed trade agreement, it will now go to a vote in the canadian parliment and hopefully be passed soon!"
ww1_USA_roosevelt.19.t: "Rise of the Second Klan."
ww1_USA_roosevelt.19.d: "The Ku Klux Klan, formed from the ashes of the Confederacy, was supposedly destroyed by President Grant in his second term of office, but it appears that they have made a resurgence. Starting as a small group in Georgia, the new Klan has attempted to broaden its appeal. Making use of conservative anger to roosevelt, the second Klans membership has sky rocketed in the last few months.\n\nWhile the first Klan was blatanly focused on overthrowing Republican governments in the south after the civil war, the second Klan has rebranded its self to be a self proclaimed right wing, populist, white, and protestant" movement. Already, this new Klan is rallying against Roosevelt, and causing racial tensions across the south. The new Klan may claim to respect the law, but it's clear they have every intention to regress civil rights even more, and take down Roosevelts administration while they do it. We simply cannot allow this new Klan to survive and thrive, and thus the president has 2 main options.\n\nThe first option may be seen as a bit radical, but we could claim the power vested in the 1871 law banning the first Klan also allows the banning of the second one. While this would be somewhat unpopular, and seen as an extreme measure, it could quickly allow us to nip this in the bud using federal force.\n\nOur second option would be to simply attempt to dampen the wider appeal of the Klan. By tackling southern poverty, we can reduce the populist appeal the Klan has amongst uneducated white southerners. Although taking down the Klan would be much slower, it would be at little cost to our popularity."
ww1_USA_roosevelt.19.a: "Worrying, we'll have to deal with this."
ww1_USA.115.t: "America Demands Our Part of Samoa!"
USA_federal_reserve1: "Federal Reserve"
ww1_USA.8.a: "May both of our nations prosper!"
ww1_USA.9.t: "Conservatives oppose the US-Canadian trade agreement!"
ww1_USA.9.d: "Sadly, the proposed Canadian American trade agreement has died in parliment, due to conservative opposition. Conservatives claim the treaty is a threat to Canadian indepdendence and favors America too much. We could try to push the agreement through after the 1911 elections, gambling on the fact that we would win, or we could try to re-write the treaty to gain conservative support."
USA_income_tax: "Income Tax"
ww1_USA_wilson.9.t: "No Business as Usual"
ww1_USA_wilson.9.d: "It was rare for the President, a mostly ceremonial figure, to adress congress at any lengths at all. After all, its the Senate and House who draft and pass all the laws, the President only signs them. Of course, the President is not completely without power, like in Grover Clevelands terms where the Presidental veto was used an unprecedented amount of times, forcing congress to mostly follow his vision. But Presidents like Cleveland were the exception, not the rule.\n\nSo when Wilson himself appeared directly infront of congress, it caught Congress off guard. As the first President to speak to congress in over 100 years, it was monumental enough. But this was no short speech. For over 2 hours the President spoke, calling for immediant and bold progressive reforms to be passed. Using public pressure, Wilson already destroyed most Conservative Democrat opposition to many of his near reforms. After all, with their party leader speaking directly infront of them, indirectly threatening those who opposed reforms about the necessity to listen to the American peoples demands or face the consequences at the ballot box, how could they garner up any opposition. With the Presidents remarks being wildly publicized, Wilsons agenda is more popular then ever."
ww1_USA_wilson.9.a: "With 1 speech, the internal party opposition is already defeated"
 ww1_USA_wilson.7.t: "California Passes Webb Alien Land-Holding Law"
 ww1_USA_wilson.7.d: "News from California has came out to the press: the anti Japanese Webb Alien Land-Holding Law has passed the California state legislature. Japan has already heavily denounced the law, calling it a violating of treaties with America and summoning the American ambassador. Either way, theres little chance any court overturns it, and it seems it will now be law of the land."
 ww1_USA_wilson.7.a: "Unfortunate"
 ww1_USA_wilson.8.t: "California Shoots Down Webb Alien Land-Holding Law"
 ww1_USA_wilson.8.d: "Suprising news from California has came out to the press, the anti Japanese Webb Alien Land-Holding Law has failed to pass the California state legislature. Seen as happening from the President personally denouncing the law, California governor Hiram Johnson has called the failure to pass the bill as disapointing. Either way, Japan and Japanese and celebrating this news."
 ww1_USA_wilson.6.t: "California moves to pass Webb Alien Land-Holding Law"
 ww1_USA_wilson.6.d: "Worrying news from California has reaches the president today as Californias 'Webb Alien Land-Holding' has been proposed in the state legislature. This law would prohibit Japanese ownership of land in California, seeing them as untruthworthy. While supported by much of the state legislature, this law could strengthen racial tensions and hurt our relationship with Japan. Some have called on the president to protest this law and attempt to lobby the California state legislature into voting against it"
 ww1_USA_wilson.6.a: "The president has no say on Californias laws"
 ww1_USA_wilson.6.b: "Offically state that the law wouldn't benefit California, to say the least"
 ww1_USA_wilson.6.c: "They're risking our relations with Japan! Lobby directly against this."
 ww1_USA_wilson.2.t: "Federal Trade Commission Breaks up Monopolies."
 ww1_USA_wilson.2.d: "Another success for the free trade commission has came into today as a major monopoly has been declared illegal by them. With this breaking up, the American market is already becoming more and more fair. We shall hope they keep up the good work."
 ww1_USA_wilson.2.a: "Great!"
ww1_USA_wilson.4.t: "Union Activity Increases"
ww1_USA_wilson.4.d: "With the inauguration of Woodrow Wilson, workers have been emboldened by Wilsons reformist ideas. Due to this, more and more workers have considered their current working conditions unacceptable. With demands for higher pay, less working hours, and safer working enviornments, more and more workers are joining unions and getting into disputes with their bosses. Thus, we can expect an increase in strikes and union activity until we pass the promised reforms of new freedom."
ww1_USA_wilson.4.a: "Patience is a virtue."
ww1_USA_wilson.5.t: "Large Local Strike Garners the Attention of Many."
ww1_USA_wilson.5.d: "Dissatisfied by current working conditions, hundreds of local workers in America have gone on strike, demanding reform for their work place. While not crippling on it's own, this local strike has inspired other workers across America to fight for reforms, and gotten widespread press attention."
ww1_USA_wilson.5.a: "Let's hope they figure it out peacefully"
federal_tt.t: "Every §Y150§! days we will get the event: '§YFederal Trade Commission Breaks up Monopolies.§!'\nFor every level of §SProgressivism§!, stacking up to 4 times, this event will fire §Y10§! days faster."
USA_emergency_taxes: "Emergency Taxes"
USA_modest_rearmament: "Modest Rearmament"
ww1_USA_wilson.3.t: "Ratification of the 17th Amendment"
ww1_USA_wilson.3.d: "A big win for progressives has been won today as the 17th, with Connecticut ratifying the amendment today. This amendment will now ensure that senator are voted in by the people instead of state legislatures. No longer are the days of corrupt and brought out senators, instead senators will now be responsible to the people. With this big victory, a new jolt of progressive energy has reached the Democrat party."
ww1_USA_wilson.3.a: "Great"
ww1_USA_wilson.1.t: "Post Master Albert Burleson Suggests Segregation of Federal Government"
ww1_USA_wilson.1.d: "Seeing Wilsons recent reforms to the administration, Post Master Albert Buerleson in a meeting with Wilson has suggested that the president consider enforcing segregation of the federal government. He claims that blacks and whites are natually different, and thus, do not work well together. Instead, as a part of progressive streamlining of the government, its only natural to seperate white and black employees into different parts of the government, to ensure work goes smoothly. "
ww1_USA_wilson.1.a: "Sure, this would help everyone right?"
ww1_USA_wilson.1.b: "This sounds unnecessary"
USA_income_tax_lean_progressive: "Income Tax"
USA_income_tax_progressive: "Income Tax"
ww1_USA.9.a: "A minor setback, but we will get it through in the next elections."
ww1_USA.9.b: "We need to request better terms."
democratic_house.tt: "The §1Democratic Party§! speaker of the house will rally §1Democrats§! against us, we will now require us to have <30 Political Power to pass certain National Focuses, and focus's will cost an additional 30 political power. The focus "§YSecond Annual Message§!" will allow us to bypass this requirement for 1 focus"
sam.tt: "If the §1Democrats§! control the house, this focus will also allow us to take 1 major legislation focus with no political power requirements"
democrat_house_punish.tt: "Because the §1Democrats§! control the house, this focus requires us to have above 30 political power to introduce it, and costs 30 political power to pass it."
democrat_house_punish_sam.tt: "Because the §1Democrats§! control the house, this focus would usually require us to have above 30 political power to introduce it, and costs 30 political power to pass it, but because we took the §!Second Annual Message§! focus, congress is more supportive then usual and we can pass 1 law without any requirements"
ww1_USA.10.t: "The US-Canadian trade agreement stalled!"
ww1_USA.10.d: "The Canadian Prime minister has sent our government a message stating that unfortunately, conservatives have killed the US-Canadian tarrif reduction bill in parliment. The liberals plan to re-introduce the bill in 1911 after their elections, banking on a larger majority."
ww1_USA.10.a: "Well shit."
ww1_USA.11.t: "Canada requests better terms"
ww1_USA.11.d: "We've recieved word from the Canadian government that protectionists and conservatives in Canadadian Parliment are threatening to kill the bill if it's not re-written to favor Canada more. As such, they've requested we make a few concessions on agriculture and job protection. The new bill would definitely favor Canada more then us, but it could still help the economy some none the less. What should our reply be?"
ww1_USA.11.a: "Tell them we're out."
ww1_USA.11.b: "Fair enough."
ww1_USA.12.t: "America withdraws from negotiations"
ww1_USA.12.d: "The Americans have let us know that they do not feel the new proposed agreement is fair, and thus have pulled out of discussions all together."
ww1_USA.12.a: "Damn conservatives."
ww1_USA.13.t: "America accepts our deal"
ww1_USA.13.d: "The Americans have accepted our proposal of a more favorable trade deal, giving us concessions in the area of agriculture and adding provisions to secure Canadian jobs, as such the treaty can proceed without much hassle from conservatives."
ww1_USA.14.t: "The US-Canadian trade deal takes effect!"
ww1_USA.14.d: "The Canadian government has finally ratified the modified trade deal between our two countries."
ww1_USA.14.a: "At least it's over"
ww1_USA.15.t: "Canadian-American trade deal negotiations fail"
ww1_USA.15.d: "The conservatives have won the Canadian elections, and have let us know that they do not feel the new proposed trade agreement is fair, and thus have pulled out of discussions all together."
ww1_USA.15.a: "Stone-headed fools."
ww1_USA.17.t: "The US-Canadian trade deal takes effect!"
ww1_USA.17.d: "The Canadian government has finally ratified the trade deal between our two countries."
ww1_USA.17.a: "This will benefit both countries!"
ww1_USA.18.t: "A note from the America dev"
ww1_USA.18.d: "Hey! Thank you so much for giving America a try, I hope you enjoy it as much as I have enjoyed making it. America has a huge amount of content and different paths in it. As such, if you want, there is a guide to electing all the different presidents, and also a guide for how to get break away states (which also have their own content!). If you don't want any spoilers however, you can choose not to see the guide. \n Also, if you have any questions/suggestions, feel free to dm me on discord; leaf_______"
ww1_USA.18.a: "Show me the path guides!"
ww1_USA.18.b: "No spoilers please!"
ww1_USA.19.t: "Guide to every president and breakaway state"
ww1_USA.19.a: "Interesting."
ww1_USA.3.t: "Crop dversity efforts boost southern industry"
ww1_USA.3.d: "Our efforts to diversify crop production down south has lead to a massive boost to the economy for the south! Moving away from cotton and towards more profitable crops has turned out to be a great idea."

ww1_USA.3.a: "Were the boll weevils a blessing in disguise?"
ww1_USA.20.t: "FDA Wins Lawsuit Against Lexington Mill Company"
ww1_USA.20.d: "Today, the western district court ruled that the lexington mill companies process for bleached flour breaks FDA regulations. The flour was treated by the "alsop process" by which nitrogen peroxide gas, is mixed with atmospheric air, then mixed into the flour. The lawsuit alleges that the practice makes the flour appear higher grade then it actually is, removes most nutrients, and could make the flour dangerous to consume."
james_s_sherman: "James S Sherman"
ww1_USA.20.a: "The FDA continues to make America a healthier place!"
ww1_USA.21.t: "Richard Ballinger resigns as Secretary of the Interior"
ww1_USA.21.d: "Stating his wish to "spend more time with his family", Richard Ballinger has resigned as Secretary of the Interior. The real reason however, is most likely his numerous scandals in office. As such, we must chose who we want to nominate to replace him"
USA_protector_of_american_business: "Protector of American Business"
ww1_USA.21.a: "Let's go with Walter Fisher."
ww1_USA.21.b: "Offer the job back to James Garfield."
ww1_USA.22.t: "Companies plan to destroy the "Devils Postpile" in California"
ww1_USA.22.d: "The "Devils Postpile" basalt collumns are a popular local tourist attraction in eastern California. While admired by many, there are also rumors of companies preparing to destroy the natural beauty, planning to build a dam instead. We could take a laissez faire approach to this, or we could create a national monument to protect it from being destroyed."
ww1_USA.22.a: "And thus, the Devils Postpile National Monument was born!"
ww1_USA.22.b: "Not our problem."
 ww1_USA.23.t: "Triangle Shirtwaist Factory Fire"
 ww1_USA.23.d: "Terrible tragedy took place in New York. The largest civilian factory fire in history of the United States occurred at Triangle Shirtwaist Factory. Despite the fact that firefighters quickly arrived at the scene of disaster, they were unable to contain fire, it was too large.\n\nFire took place in clothing workshop, where most of the workers were women and children. About 146 people died in fire. Against the backdrop of this tragedy, socialist trade unions have become more active, demanding to reduce the working week and pass laws on safety at work. However, the government is in no hurry to comply with these requirements."
 ww1_USA.23.a: "The tragedy shouldn't be repeated a second time."
 ww1_USA.23.b: "What a horrible accident!"
 ww1_USA.25.t: "Taft's Second Annual Adress to Congress"
 ww1_USA.25.d: "It's time for Taft to once again adress congress on his agenda, and the most important issues facing Americans. There were 2 different speeches prepared for him, one about the importance of progressive reforms, and one about the importance of a strong military. We don't have time to give booth speeches, and thus must chose one of them."
 ww1_USA.25.a: "Our military must be strengthened."
 ww1_USA.25.b: "We must continue progressive reforms."
 ww1_USA.27.t: "Wool tarrif reduction bill reaches Taft's desk"
 ww1_USA.27.d: "A bill that would reduce tarrifs on wool has passed congress and reached Taft's desk. While popular amongst progressives, this bill is unpopular amongst protectionists, and Taft personally. We could let it pass, or we could chose to veto it. "
 ww1_USA.27.a: "Veto it."
 ww1_USA.27.b: "Sign it."
  ww1_USA.26.t: "1910 Midterms"
  ww1_USA.26.d: "While not ideal, the congressional election results appear to be less bad then expected. Republicans have indeed lost ground, but the situation seems recoverable"
   ww1_USA.26.a: "Not bad."
   ww1_USA.1.t: "1910 Midterms"
  ww1_USA.1.d: "The congressional election results are in, and they are just as bad as expected. Republicans have lost 6 senate seats and control over the house. Champ Clark is expected to be elevated to house Speaker. Unfortunately for us, Clark has made clear he intends to be a huge obstructionist for our agenda. Due to this, legislation will certainly be harder to pass now."
   ww1_USA.1.a: "Don't panic!"
ww1_USA.28.t: "National Progressive Conference"
ww1_USA.28.d: "The "National Progressive League" has organized a conference in Washington D.C where they have announced their "dissaproval with Taft." Consisting of 15 Senators and 13 House members, rumor has it they have also elected to support former president Roosevelt in a potential primary bid."
ww1_USA.28.a: "It seems Taft is doomed, then."
ww1_USA.29.t: "Progressives elect to support taft!"
ww1_USA.29.d: "The "National Progressive League" has organized a conference in Washington D.C where they have announced their decision to "support president Taft's re-election." Consisting of 15 Senators and 13 House members, their widespread influence is likely to boost Taft's standing in the primary significantly.\n\nWith this endorsement, Roosevelt has lost one of the most influential organizations in the Republican party. With a defeat this bad, many predict Roosevelts momentum will continue to lose steam, to the point where his political ambitions may be completly dead in the water..."
ww1_USA.29.a: "Take that Roosevelt!"
ww1_USA.123.t: "Our Economic Sphere"
ww1_USA.123.d: "While sharing our common struggle for freedom for European colonizers, most of Latin America was much later to the game of independence then us. This, combined with the Monroe doctrine, has given us a natural leading role to Latin America, intervening in their politics when needed. With our rapid industrialization, in the last few decades our leading role has started to take the form of economic domination. Latin America has large markets and natural resources needed for our industrial economy.\n\nSeveral American giant companies have completly taken over Latin American economies. Companies such as the United Fruit Company make tens of millions of dollars from harvesting the vast resources of Latin America and selling it back to their people, as well as Americans. These companies have became 'to big to fail' as of recent however, and with Latin American instability increasing, it will be crucial in the coming years to protect these businesses, least they fall and our economy suffer."
ww1_USA.123.a: "We have their backs"
ww1_USA.30.t: "Super-Fire Errupts Out West!"
ww1_USA.30.d: "Orginally small fires in Oregon, Washington, Montana, and Idaho have met up, and combined into 1. This "Super-Fire" is raving havok across these 4 states destroying local infrastructure and killing 100's! While we could call congress in session to pass an emergancy aid bill out west, forecasts say huge rainpour is expected to hit the fire in just a few days. Should we call congress, or hope the rain takes care of it?"
 ww1_USA.30.a: "The rain and our brave firefighthers can manage it."
  ww1_USA.30.b: "Get congress together now!"
  ww1_USA.31.t: "Socialist Extremist Bombs Los Angeles Times Building"
ww1_USA.31.d: "Last night, the Los Angeles Times headquarters were set ablaze by dynamite. With socialist extremists taking the blame, Americans across the country are outraged. While police are looking for the suspect, Taft must weigh his options on if he wants to esculate the situation. With socialist organizations already crippling local economies in the past from devestating strikes, some more conservative figures have called for Taft to open an investigation into "socialist extremists everywhere."\n\nOf course, we could, and likely should, ignore these extremists. The police are doing thier jobs fine, and its likely we will capture the people who committed this terrorist attack."
ww1_USA.31.a: "We will find this bastard and bring him to justice!"
ww1_USA.31.b: "Lets Kill 2 Birds With One Stone"
ww1_USA.32.t: "Montana's Glacier National Park Opens!"
ww1_USA.32.d: "The Montanan glacier national park has offically opened today. Containing a breath-taking view of the Rocky Mountains, as well as thousands of plant species, this park is expected to bring tens of thousands of tourists from all around the world."
ww1_USA.32.a: "O beautiful for spacious skies..."
ww1_USA.33.t: ""The Masses" Newspaper Begins Publication"
ww1_USA.33.d: ""The Masses", founded by socialists, has offically began publication today. The newspaper has called for large scale working condition reforms across the United States like minimum wage, an 8 hour work week, and conditions for injuries in the work place. Until then, the newspaper has openly endorsed strikes across the nation. While not mainstream, the newpaper does have a small but loyal viewerbase, and it has been the direct inspiration for several strikes."
ww1_USA.33.a: "Americans will never be swayed by radicals!"
ww1_USA.33.b: "Denounce them as extremists."
ww1_USA.34.t: "Great Fire of 1911"
ww1_USA.34.d: "A small fire in a barn has gone totally out of control. With both a slow firefighter response time and a large amount of flammible material, the fire quickly spread and entire towns of Maine have been burnt down, and hundreds have lost their life. This fire has caused huge financial damages to Maine, and the local economy can expect a huge hit."
ww1_USA.35.t: "William Schuste Accepts Control of Persian finances"
ww1_USA.35.d: "Persia has long struggled from a weak economy due to European domination of their country. It seems Persie wants to be on the path of reforism and full independence as they have invited William Schuste, an experienced public servant, to help Persia sort its finciances. William has accepted their offer, and has already began introducing a series of economic reforms to Persias parliment. Sadly, the British and Russians have opposed this move, and have made clear their intentions to force William out."
ww1_USA.35.a: "Let's hope he can help them out, and strengthen US ties with Persia."
ww1_USA.36.t: "William Schuste Forced to Leave Persia"
ww1_USA.36.d: "Against the will of Persia's parliment, the Shah of Persia has forced Willian Schuste, an economist and public servant, to leave Persia or face consequences. This is thought to be because of immense Russian and British pressure, as his reforms were increasing Persia's control of their own economy."
 ww1_USA.38.t: "Bread and Roses Strike"
  ww1_USA.38.d: "A majority immigrant town in Lawrence, Massachusetts is making national news as the workers there have gone on a long and bitter strike. Wanting more pay, the strike began and quickly gained the attention of the Industrial Workers of the World organization, who traveled there in support. The strikers sent their hungry kids across New England, gaining much of the publics sympathty."
ww1_USA.38.a: "Let's hope the figure it out..."
ww1_USA.36.a: "Imperialist bastards.."
ww1_USA.34.a: "We will give our regrets to the victims."
ww1_USA.37.t: "The Strangling of Persia"
ww1_USA.37.d: "The American former treasurer-general of Persia, William Schuste, has just released a book called "The Strangling of Persia." This book has revealed the shocking nature of British-Russian Imperalism and just how much control they have over Persia. He details his attempts to reform Persias economy and his struggles to fight for Persian domestic indepdence. The book has angered many in the United States, outraged at the exploitation of Persia"
ww1_USA.37.a: "The Persian people deserve freedom..."
 ww1_USA.39.t: "Hague Court Settles US-British Fishing Dispute"
  ww1_USA.39.d: "The long standing dispute between the United States and the British Empire over fishing boundries near Newfoundland have finally been settled in court. The agreement would give the United States fishing rights boundry larger then the usual boundry according to international law, but mantain british rights on some of the surrounding territories of Newfoundland"
   ww1_USA.39.a: "This deal works for us!"
   ww1_USA.41.t: "Settlers Continue Exploration of Alaska"
   ww1_USA.41.d: "Despite being American territory for over 40 years now, Alaska has remained one of the most unexplored and underpopulated states in the union. This has began to change however, with many moving to the territory seeking out unexplored gold mines. In the last few weeks, the Ditarod River especially has seen a massive influx of people.\n\nIt seems these settlers have indeed been finding the gold they have been looking for as well, with decently large gold mines being discovered as of recent. While there is no expectation of another California gold rush type event, the future of Alaska and its economy does look promising as of recent."
   ww1_USA.41.a: "Good for them!"
   ww1_USA.40.t: "Champ Clark Advocates for Annexation of Canada"
    ww1_USA.40.d: "With the passing of the Canadian-American trade deal, Champ Clark today took to the senate to announce his support for the deal, stating that he supports this as the "first step" towards canadian intergration. He proceeded to call for Canada to begin intergation with America and spoke about America's destiny to annex canada. Even worse, he was met with large applauses on the senate stage! Already Canadian conservatives are calling for Canada to not sign the deal and spreading anti American propaganda."
  ww1_USA.40.a: "That fucking idiot Clark!"
  ww1_USA.42.t: "Railway Companies Plan to Hike Ticket Prices!"
  ww1_USA.42.d: "It seems no amount of profits is enough to sastify the greedy demands of railway companies, as a joint meeting of a collection of railway companies have all gathered together and agreed to increase ticket prices to increase their profits. With a lack of competition, there is little that would stop these companies.\n\nHowever, with enough pressure from the federal government, we could hope to prevent them from doing this. Shall Taft seek a meeting with them?"
ww1_USA.118.t: "Haiti President Assassinated"
ww1_USA.118.d: "News from Haiti has reached the President today: Haitis leader has been murdered by an opposition figure. This is nothing new, as the last 6 leaders of the country suffered the same fate. It's became clear to some policy makers that Haiti is too unstable to remain without any American oversight. In particular, German intervention could bacome a threat if the near anarchy state in Haiti remains. With German merchants dominating commercial business in the area, and Germans making up a notable amount of the population, the German government may seek to protect its interests in Haiti first if we don't do anything."
ww1_USA.118.a: "Then we will protect them"
USA_prepare_for_invasion: "Invasion Preparationa"
unlocks_focus_hat.tt: "Unlocks '§YStabilize Haiti§!' National Focus"
ww1_USA.119.t: "Special Military Operation in Haiti"
ww1_USA.119.d: "Haiti has been facing huge internal troubles as of recent, with several heads of states back to back being murdered by rivals. With the situation deteriorating, Haitis large financial reserves may be at risk. We have heard rumors of German merchant plans to seize the fund for themselves. Realizing the threat to Haitis money, the President ordered marines to enter the country and take $500,000 dollars back to New York, to store the cash for them. Obviously, Haiti can no longer be trusted to manage this money, and for their own sakes we will be forced to tranfer it to American accounts instead..."
ww1_USA.119.a: "Are we too generous for our own good?"
ww1_USA_wilson.25.t: "An Unfortunate Production"
ww1_USA_wilson.25.d: "It appears the movie streamed in the White House was not about Lincoln at all, but instead the KKK and reconstruction from a southern view. While watching, many reported the president was completly silent, appearing to look dissapointed yet deep in thought. Despite Wilsons condemnation the next day, the Movie has received a huge wave of viewership after the media has reported on the story of the movie "so popular, its even in the White House!""
ww1_USA_wilson.25.a: "I sure hope nobody makes up a quote 20 years later claiming I enjoyed this movie!"
ww1_USA_wilson.24.t: "New Groundbreaking Movie Offered to be Streamed in the White House"
ww1_USA_wilson.24.d: "Producers of a new movie credited with ground breaking innovations such as dramatic closeups, fadeouts, better uses of props, and much much better editing have approached Wilson, telling him about this new movie, bragging about its innovations. As a old friend from college, Wilson has a special relationship with the producer, but Wilson may not have the time to watch his movie. From what Wilson has been told, it appears the movie is about the life of Lincoln. Shall we stream this movie in the White House?"
ww1_USA_wilson.24.a: "This movie sounds pretty cool, what could be the harm from streaming it?"
ww1_USA_wilson.24.b: "The Presidency should be above this kind of thing"
  ww1_USA.42.a: "If they want to be greedy, theres little we can do about it"
 ww1_USA.121.t: "Railway Companies Refuse to Cancel Spike of Pricing"
 ww1_USA.121.d: "It seems Tafts meeting with railway companies was a complete waste of time after all. Citing 'recent unfriendly legislation', railway companies have collectively agreed that there is little reason to trust Tafts reasonings for why they should keep current railway prices."
 ww1_USA.121.a: "Bastards"
ww1_USA.117.t: "Roosevelt Prepares to Return to the United States After Africa Trip"
ww1_USA.117.d: "Former president Theodore Roosevelt has been taking a vacation across Africa for over a year at this point. Going from British East Africa traveling to the Congon before following the Nile up to British Sudan. With a wild ride behind him, including over 11 thousand animals hunted by him in the trip alone, including lions, elephants, birds, and even cheetahs.\n\nWith the 1910 midterms heating up, however, Roosevelt has decided it's time to return home to campaign for progressives on the ballot. As Roosevelt prepared to get on the boat reserved for him, he exclaimed to his travel partners..."
japan_will_remember_this: "Japan will take note of our defense of their citizens in future negotiations..."
political_professor: "Political Professor"
ww1_USA.117.a: "..."We have a lot of campaigning to do, don't we""
ww1_USA.117.b: "..."Oh goodness me! Is that a group of eight lions charging towards us?""
riding_razor.tt: "It's recommended you complete this branch fast or else you will suffer from very low £pol_power §HPolitical Power§!."
  ww1_USA.42.b: "Let's meet with these companies and try to pressure them not to."
  ww1_USA.43.t: "Railway Companies Agree to Abandon Price Hikes"
  ww1_USA.43.d: "It seems Taft has been able to convinve railway companies to abandon their spiking of prices, with the explanation that it would reduce railway usage and result in less profit convincing the railway company leaders. This will definitely be a political win for taft."
  ww1_USA.43.a: "The art of diplomacy works again!"
  ww1_USA.44.t: "Taft's Son Hits a Man while Driving!"
  ww1_USA.44.d: "While on a drive in Massachusetts, Robert Taft, son of President Taft, accidently hit civilian Michael Thisthwolla, who he didn't see crossing at the time. The man has ultimately ended up without serious injuries, althought still had to go to the hospital. Either way, this doesn't exactly look amazing for Taft himself."
  ww1_USA.44.a: "We'll pay his hospital bills, a few thousand dollars, and a trip to Italy to make up for it!"
   ww1_USA.45.t: "Cities across the United States Prohibit Viewing of the Johnson-Jeffries Boxing Fight"
  ww1_USA.45.d: "The long awaited "fight of the century" between African-American boxer Jack Johnson and white boxer James J. Jeffries has ended in great controversy. Jack Johnson ended up winning the match, causing many white Americans to protest, claiming the event had been rigged. While found to be baseless, this has not stopped many cities across the US from banning the viewing of the match."
  ww1_USA.45.a: "They seem unable to accept their prefered canidate lost..."
  ww1_USA.45.b: "The Supreme Court will make light work of this!"
  ww1_USA.46.t: "Race Riots Break out across the nation"
  ww1_USA.46.d: "In response to the prohibation of the Johnson-Jeffries boxing match in many American cities, black Americans across the nation have errupted in protest. They claim this is yet another example of completely unfair oppression and have marched for equality. They have have been met by counter protests, however, and the situation has escalated a lot in the past few days. Violence is breaking out across the country, and many have already lost their lifes."
  ww1_USA.46.a: "Send out the police!"
  ww1_USA.47.t: "Bloody July"
  ww1_USA.47.d: "Mass race riots and destruction across America, now dubbed as "blood July", caused by a lack of police action, have lead to mass lynching across the cities. The death toll was estimated at 419 until police across the nation finally responded, in a harsh crackdown that has lead to many unlawful arrests of black men"
  ww1_USA.47.a: "Oh the horror, the horror!"
  ww1_USA.48.t: "The Gang of 5"
  ww1_USA.48.d: "Today, 5 very experienced officals have began the task of fufilling the goals of the EEC. Consisting of New York Bureau of Municipal Research, Frederick Cleveland, already famous for creating one of the first municipal budgets for New York City. William Willoughby, a well known author of several books dealing with budget and public administrative reforms. Judge Walter Warwick, Former Missouri Supreme Court Justice Frank Goodnow. And a New York circut judge, Harvey Chase."
  ww1_USA.48.a: "They Seem Very Knowledgable"
  ww1_USA.48.b: "These are Some Really Talented People, Let's Make Sure Washington Knows This."
  ww1_USA.50.t: "Economic Efficiency Commission Created"
  ww1_USA.50.d: "Today, Taft declared a presidental commission to look into administrative and economic reforms. Dubbed the "Economic Efficiency Commission", a group of 5 experienced public servants and business owners have been appointed to look into this issue. While opposed by many in congress due to its suggestions to transfer more power to the president, many economists agree with these reformists."
  ww1_USA.50.a: "We welcome them and look forwards towards their Advice!"
  ww1_USA.75.t: "Corporate Influence is Starting to be Worrying!"
  ww1_USA.75.d: "Lobbyists and corporate interests are starting to have quite the impact on Taft's administration. Due to their widespread influence, it's getting harder and harder to pass legislation to oppose them. We must keep an eye!"
  ww1_USA.75.a: "...noted"
ww1_USA.86.t: "The Two Party System"

ww1_USA.86.d: "In America, while theres no real restriction on the number of parties allowed to run, there is only two parties that actually have power in congress. The Democrats, and the Republicans.\n\nConcentrated in New England and the Rust Belt, the Republicans are facing a key point in history that could decide the future of their party. With the end of Roosevelt's presidency in 1908, Taft, Roosevelt's former Secretary of War, was personally chosen to be Roosevelts sucessor. However, Taft and Roosevelt are increasingly becoming divided. With different views on "trusts", giant American companies, different views on tariffs, and administrative scandals, Roosevelt and Taft are not at all the unified duo they once were. With the Conservative and Progressive wings of the Republicans gearing up for a battle in 1912, the future of the Republican party could be at stake. On the other side, a dark horse attempts to make an unlikely bid for President. Joseph Cannon, the speaker and practical dictator of the house, seeks to take advantage of Taft and Roosevelts fighting, bidding on Taft not running and him taking over the party. While very unlikely, if Cannon somehow did get the nomination it could spell the end of the American experiment.\n\nOn the other side of the isle are the Democrats. Concentrated in Dixie and the Great Plains, Democrats are generally more united then their Republican counterparts. United on the idea of lower tariffs, the Democrats main players in 1912 are appearing to be Progressive New Jersey Democrat Woodrow Wilson, and minority House Speaker Champ Clark, on the more conservative spectrum.\n\n1912 is looking to be a complete tossup, with great opportunity for both parties and even their inner factions, it really could be anyones game. There can only be one party elected however, and you must decide which party you'd like to try and see in power."
ww1_USA.86.a: "The Republicans!"
ww1_USA.86.b: "The Democrats!"
dem_ex: "This event is visible because you are playing as the §1Democrats§!"
rep_ex: "This event is visible because you are playing as the §RRepublicans§!"
rep.tt: "We will occasionally recieve exclusive events relating to §RRepublican§! party affairs. With these, we can nudge the §RRepublican§! party in our vision, and play as our prefered canidate in the primaries and general election"
dem.tt: "We will occasionally recieve exclusive events relating to §1Democratic§! party affairs. With these, we can nudge the §1Democrat§! party in our vision, and play as our prefered canidate in the primaries and general election"
ww1_USA.87.t: "North Dakota's Democratic Primary vote nears"
ww1_USA.87.d: "As the first state that votes, North Dakota has large influence on the general view of the Democratic primary, with a victory in the state able to propel any canidate that was once seen as a joke. While having a popular vote, party elites ultimately have the final say in the state, and can nominate whoever they want. Split between Wilson and Clark, delegators there will have to quickly make up their minds."
ww1_USA.87.a: "Wilson is the most electable!"
ww1_USA.87.b: "Clark and his ties will carry the state for him"
 ww1_USA.90.t: "Illinois and Wisconsin Prepare to Vote Directly in the Democratic Primary"
 ww1_USA.90.d: "Having passed reforms that force state delegates to vote for the canidate that receives the most support in a popular vote election, Wisconsin and Illinois are due to vote in just a few days. With Clark having widespread influence amongst Democratic party elites, Chigaco is expected to be completly locked down for him, denying Wilson its large amount of delegate votes. Wisconsin however is more competative, with a more truely free electoral process that could go either way. While polling shows Clark with a minor lead, Wilson has began a recent campaign blitz across the state in an attempt to change the momentum"
ww1_USA.91.a: "The Intensity of the Primary is Definitely Increasing"
 ww1_USA.90.a: "While Clark Sweeps Illinois, Wilson Makes a Suprise win in Wisconsin."
 ww1_USA.90.b: "Both States Fold to Clark, Like Predicted"
 ww1_USA.89.t: "Wilson and Clark Debate "Trusts" Reform"
ww1_USA.91.t: "Party Elites Back Clark"
ww1_USA.91.d: "With Clarks position as Speaker of the House, his widespread connections to the establishment has greatly contrasted Wilsons, a relatively unknown man until this year. With the threat of Wilson seriously winning being taken more and more seriously, Clark has began meeting with party leaders securing their endorsements and votes in states where party leaders decide who the states delegates go to."
 ww1_USA.89.d: "The Democratic primary continues to intensify as Wilson and Clark have bashed heads on the issue of monopolies and trust busting. While Wilson and his "new freedom" idea of progressive reform has called for the mass breaking up of all trusts, Clark has taken a more moderate stance. While both want to continue Taft's law suits against trusts, Wilson has also called for a government agency to manage the issue of trusts more effectively. This has been critized by Clark, who has claimed the agency would be inefficent and would suffer from corruption."
 ww1_USA.89.a: "Wilsons Idea of Mass Breakups of Trusts Wins Support from Small Business"
ww1_USA.93.t: "Clark Wins Maryland Primary Vote"
ww1_USA.93.d: "More good news for the Clark campaign, as Maryland Democrats have voted to support Clark for the Democratic party nomination in July. With yet another state falling in line, 2 minor canidates have offically suspended their campaigns, seeing the nomination as locked for Clark."
backfire.tt: "§RThis could backfire big time§!"
ww1_USA.94.t: "Clark Fails To Gain Two-Thirds Vote for Party Nomination"
ww1_USA.94.d: "Despite holding a commanding lead, speaker Clark has not achieved the required 2/3rds delegate votes required to become the Democratic nominee. With this, Clark and Wilson, the second place canidate, will have to rush to make new alliances and promises across the Democratic party in order to secure enough votes for the next party nomination attemp, in just a few days.\n\nOn Clarks side of things, the Tammy Hall organization in New York, famous for their corruption, has none the less began considering supporting Clark, which would effectively lock up the state for Clark. While shady, New York has the most delegates out of any state, and locking up this state could force Wilson to give it up right there and then. Seeing this coming however, Clark could try to instead back away from Tammy Hall by reahcing out to moderates in the Democratic primary."
ww1_USA.100.t: "Clark Elected Democratic Party Canidate"
ww1_USA.100.d: "Today, Wilson gave his offical concession speech in the Democratic Convention, and endorsed Champ Clark. This follows a series of political victories and key endorsements from on the fence figures lining up behind Clark last minute. Seeing victory as impossible, Wilson dropped out and encouraged his delegates to vote for Clark for the sake of party unity. Strong with conservatives and moderates, Clark is expected to struggle with progressive voters. However, William Bryans, and Woodrow Wilson, both popular with progressives, can help Clark with this key group. This will require party unity however, and Clark will need to give concessions to the progressives in his party if he wishes to win. Internal Democratic politics aside, Clark is expected to face president Taft, and progressive Teddy Roosevelt in the general election."
ww1_USA.100.a: "Now Let's Make Sure He Wins this November"
ww1_USA.94.a: "They Endorse Clark"
ww1_USA.94.b: "Clark Offers Thomas Marshall VP For an Endorsement, Angering Tammy Hall"
ww1_USA.93.a: "It Really Seems Like Clarks Got This Thing Locked Up"
 ww1_USA.89.b: "Clarks Moderatism Wins him Support from Big Business and New England"
ww1_USA.101.t: "Presidential Canidates Debate Tariffs Issue"
ww1_USA.101.d: "One of the most defining issues of the day is the debate on low or high tarrifs. Proponents of high tarrifs, particularly in the Midwest, claim high protective tariffs are needed to support American industry and businesses. On the other hand, those in the South argue that low tariffs are benefical to the average American consumer, which reduce the price of goods for the average consumer.\n\nWilson and Roosevelt have campaigned in favor for tariff reform. Believing that high tariffs disproportionately benefited wealthy industrialists and monopolies at the expense of ordinary consumers, he and the democrats call for a reduced tariff to lower prices for consumers and foster natural competition between all countries products in the market place. Taft, however, has advocated for the continuation of high protective tariffs to support American industry and businesses. He argues that tariffs are necessary to maintain a major revenue source for the government and protect American jobs from foreign competition."
ww1_USA.101.a: "American Consumers Demand Lower Tariffs"
ww1_USA.101.b: "The Midwest Workers Rally Behind High Tariffs"
ww1_USA.103.t: "Canidates Debate Banking Reform"
ww1_USA.103.d: "With the panic of 1907 still in the minds of Americans, it's become clear that the banking sector needs reform. While Taft has worked towards a "postal banking" reform, allowing individuals to deposit their savings in post offices, providing a safe and accessible alternative to traditional banks, some claim he hasn't gone far enough.\n\nSome progressives instead call for a single, centralized national bank with control over all monetary policy, banking regulation, and the sole issuance of currency. While it would bring stability to the banking system for sure, some argue it could lead to excessive concentration of financial power.\n\nDue to this concern, moderates across the spectrum have been interested in a "federal reserve" that would have moderate regulationary power over banks of America, acting as a last resort in a major banking panic."
 ww1_USA.103.a: "A National Banking System Would Prevent Any Future Bank Panics"
 ww1_USA.103.b: "A Federal Reserve Would be a More Practical way to Regulate Banking"
 ww1_USA.103.c: "The Postal Banking System Just Needs Additional Funding"
ww1_USA.104.t: "Unions Prepare to Make Their Endorsements"
ww1_USA.105.t: "Canidates Debate Foreign Politics"
ww1_USA.105.d: "While not expected to be a major election issue this cycle, foreign politics are still getting attention from all 3 canidates. With increasing tensions world wide, the next president could very well have to make America's choice in a world wide war.\n\nSkepitcal of European politics in general, Wilson and Taft have both stated they would support strict American isolation from any European war, stating America has nothing to gain from involving its self in any potential European conflict.\n\nHolding a somewhat different opinion however, Roosevelt has argued against commiting America to any foreign policy, commenting that America should hold a slightly more active place in the world, as a force for good."
ww1_USA.105.a: "Why Should America Care About Europe?"
ww1_USA.105.b: "I Guess Roosevelt Has a Point"
ww1_USA.106.t: "Canidates Begin Visiting Swing States"
ww1_USA.106.d: "With election day nearing, Roosevelt Taft and Wilson have all began intensifying visits to so called "swing states", states that are around equally divided between support for the 3 canidates. With Utah, Vermont, Massachusetts, and Maine particularly close. With the election being bitterly contested, these states voters will have to make up their minds on who to support"
ww1_USA.106.a: "Roosevelt Gains the Common Mans Support"
ww1_USA.106.b: "Wilson Has the Support of the Silent Majority"
ww1_USA.106.c: "Taft Has an Unexpected Surge"
ww1_USA.107.t: "Canidates Debate Income Tax"
ww1_USA.107.d: "The idea of an income tax has became a common dinner table conversation across American, and now, the 3 canidates for President have finally announced their stances.\n\nfuck this shit ill write this shit later someone remind me to later"
 ww1_USA.108.t: "Wilson won primary"
 ww1_USA.108.d: "will write this shit later, wait till march for inaguration"
 ww1_USA.108.a: "yuge!!"
ww1_USA.104.d: "Unions have always been a central force in American politics, but with a 3 man race their support matters now more then ever. With their widespread influence in the midwest, unions could very well decide who wins the entire region - and the general election by proxy. While many would expect unions to line up behind the most progressive canidate, Roosevelt, unions have ended up divided between all 3 canidates for a variety of reasons.\n\nOf course, Roosevelt would be the obvious choice for unions. As the only canidate who supports a federal minimum wage, and a strong supporter of unions throughout his political history, Roosevelt can easily make the case that he is the most progressive and trust worthy canidate for unions.\n\nHowever, Wilson has been making his own breakthroughs in smaller union circles. Pointing out his own moderatism, and Roosevelts past support for the American Steel trust while he was president, Wilson has been making the case that maybe Roosevelt is not as trust worthy as he seems? \n\nThere is also a big opening for Taft that Roosevelt and Wilson don't have; the issue of tariffs. A strong supporter of protectionist policies, Taft can definitely make the case that he is the only canidate who can be trusted to protect American business and unions from foreign competition."
ww1_USA.104.a: "Unions Support the Workers Canidate, It's not Rocket Science"
ww1_USA.104.b: "Roosevelt has Indeed had a Sketchy History With Some Trusts..."
ww1_USA.104.c: "Only Taft can be Trusted to Protect American Industry"
wilson_minor_election_boost.tt: "§4Wilson§! will receive a minor boost in the general election!"
wilson_moderate_election_boost.tt: "§4Wilson§! will receive a moderate boost in the general election!"
