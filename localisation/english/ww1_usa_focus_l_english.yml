USA_1984: "Sedition Act"
ww1_USA.146.t: "The Kaiser, the Beast of Berlin"
ww1_USA.146.d: "The film 'The Kaiser, Beast of Berlin' has finally came out in theaters acorss America. The film depicts the ruthless and diabolical nature of Kaiser Wilhelm, and his truely greedy and imperialist views. In the movie, despite signing a peace treaty with neighboring countries, the Kaiser decides to invade Belguim. When the true extent of Germany's crimes in Belguim are revealed, and the Kaisers direct ordering of the sinking of the RMS Lusitania comes to light, the German generals stage a coup and hand over the Kaiser to the Entente."
USA_nationalize_coal_mines: "Nationalize Coal Mines"
ww1_USA.146.a: "This film shows the true nature of the Kaiser!"
