progressives_more_60.tt: "The coalition ideology is more §Sreformist§! then 60"
progressives_more_70.tt: "The coalition ideology is more §Sreformist§! then 70"
progressives_more_50.tt: "The coalition ideology is more §Sreformist§! then 50"
progressives_less_45.tt: "The coalition ideology is less §Sreformist§! then 45"
progressives_less_40.tt: "The coalition ideology is less §Sreformist§! then 40"
USA_mantain_the_party_line: "The Parties Commanding Might"
USA_slash_the_tarrifs: "Moderate Tariff Reduction"
USA_slash_the_tarrifs_desc: "From the mom in Houston purchasing abnormally expensive produce at the grocerry store to the small business owner in Ohio struggling to buy steel, Tafts tariff policy has hurt everyone. A long overdue reduction to the tariff is required to ensure prices for the consumer are kept low."
USA_mantain_the_party_line_desc: "While Roosevelt personally may support keeping some trusts, most progressives dont. It would be a disapointment to much of his base and his supporters in congress to completly go against their ideas, and thus, he will have to concede to the New Nationalist Union on this issue. Wide reaching anti trust legislation must be passed, to ensure a free market."
USA_concentration_in_industry_desc: "As Roosevelt has said, concentration of industries into a few very productive companies is just the natural evolution of a free market economy, and often benefits the consumer. If a company is very fast at producing a product, and is selling that product at a acceptable rate, then why should the government break that company up? We should instead encourage these companies."
USA_8_hour_railway_work_week_desc: "With protests erupting in pennsylvania by railway workers tired of poor conditions, there's no better time then now to introduce one of the core promises of New Nationalism: an 8 hour work week. While we can't get a national 8 hour work week for now, pressure is high on congress to pass some sort of reform for Railway workers, so an 8 hour work week for them only should pass."
USA_careful_construction_of_the_coalition: "Careful Construction of the Coalition"
USA_careful_construction_of_the_coalition_desc: "To ensure we have a chance at passing our agenda, we must align more moderates into our coalition. The fact is, we need their votes if we wish to get anything done, even if it means we may have to compromise and pass some of their legislation or scale back some of our more radical bills."
USA_the_bull_moose_presidency: "A Bull Moose in the White House"
USA_the_bull_moose_presidency_desc: "Former President Theodore Roosevelt has once again won the heart and soul of the American people! As the next commander in chief, Roosevelt plans to ride the current reformist mood in the United States, passing a series of sweeping domestic reforms and making America a safer, more equal, and more prosperous country for all."
USA_congressional_recalls: "Congressional Recalls Bill"
USA_congressional_recalls_desc: "To ensure we have a chance at passing our more §Sbolder§! agenda, we will need a more favorable congress. An easy way to achieve this, and one that the Progressive Party campaigned on in 1912, is recall elections. With these, we can organize the people who live in the districts of House members who stand against progress to quickly force elections, and ensure progressives win them."
USA_the_new_cabinet: "A Cabinet For the People"
USA_the_new_cabinet_desc: "Former President Taft's cabinet is inefficient and unwilling to bring bold, progressive ideas to the table. Luckily, Roosevelt knows many talented and ambitious people from his times as President in 1908. We will reach out to these individuals to assemble our new, progressive cabinet."
USA_attract_progressive_defectors: "Assemble the New Nationalist Coalition"
USA_attract_progressive_defectors_desc: "Since we no longer have the Republican caucus to rely on for congressional votes, we will have to assemble our own coalition in congress. Dubbed the "New Nationalism Coalition" by the media, Roosevelt will begin the process of assembling a new force for the progressives"
USA_re_unification_of_the_republicans: "Reunification of the Republicans"
USA_re_unification_of_the_republicans_desc: "We have to be realistic here, the Progressive party was only made in the first place due to our failure to win the Republican primary. If the Republican Party proves its self to be reasonable, then theres no reason why reunification with them should be impossible."
USA_curtail_the_two_party_system: "Curtail the Two Party System"
USA_art_of_politics: "The Art of Politics"
USA_curtail_the_two_party_system_desc: "With both the Democrats and Republicans being stacked full of corporate lobbyist and political machines, it's clear that only the newly founded Progressive Party can be trusted to have the American peoples interests in mind. We must foresee the expansion of the Progressive Party, unchained from corporate and elitist interests, to truely be a 3rd force in American politics "
failed_infra.tt: "We will lose the support of §Y30§! §mModerate Democrat and Republican§! House members, and §Y2§! §qGOP Republican§! House members"
careful_cabinet.tt: "We will recieve the support of §Y18§! §mModerate Democrat and Republican§! House members, and §Y2§! §qGOP Republican§! House members.\n\nThey will expect some §Rconcessions§!, however. These concessions are located in the §YThe Art of Politics§! focus branch."
USA_national_banking_system: "Centralize the Banking System"
USA_national_banking_system_desc: "The United States is notorious for its issue with banking panics causing havok on the economy. It's time to end this system of destabilizing private banks, and centralize the banking system to a government ran system which will ensure a stable and efficient monetary system."
mods_supportt.tt: "We will recieve the temporary support of §Y40§! §mModerate Democrat and Republican§! House members. These members will return to opposition after the current bill passes."
mods_not_supportt.tt: "The temporary support of §Y40§! §mModerate Democrat and Republican§! House members we recieved for the last bill will be removed."
