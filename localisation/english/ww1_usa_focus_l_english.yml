cw_gui_debug_mode: "Tafts Republican Party"
cw_gui_debug_mode_desc: "The §QRepublican Party§! is becoming increasingly divided by the day. With Progressive Republicans on one side, advocating for lower tarrifs and increased government regulations, vs the Conservatives who advocate for increased tarrifs and a reduction of government intervention. Taft, a moderate, has not fit neatly with either group. While progressive on issues like trusts and conservation, Taft has taken conservative positions on things like tarrifs and banking reform. This has only earned taft §Ranger§! by both sides, however, with §YRoosevelt§! in particular looking interested in a §Cprimary§! attempt. With anger from both sides, Taft will have to carefully align with one faction, and §Reliminate§! the influence of the faction he opposes.\n\nIf a faction has high influence and low loyalty, expect the £pol_power §YPolitical Power§! effects to be negative. If a faction has high influence and high loyalty, expect the £pol_power §YPolitical Power§! effects to be positive. If a faction has low influence, then regardless of the faction loyalty, expect the £pol_power §YPolitical Power§! effects to be negligible\n\nThe current §YInfluence§! of §SProgressive§! Republicans is [?USA_progressive_popularity]\nThe current §YLoyalty§! of §SProgressive§! Republicans is [?USA_progressive_loyalty]\nAs a result, the current £pol_power §YPolitical Power§! effects from §SProgressive§! Republicans is §Y[?progressive_republican_political_power]§!£pol_power\n\nThe current §YInfluence§! of §qConservative§! Republicans is [?USA_progressive2_popularity]\nThe current §YLoyalty§! of §qConservative§! Republicans is [?USA_progressive2_loyalty]\nAs a result, the current £pol_power §YPolitical Power§! effects from §qConservative§! Republicans is §Y[?conservative_republican_political_power]§!£pol_power."

