wilson_explain_balance.tt: "Wilson has 2 main mechanics: The balance of the administration ideology, and the level of §nCongressional Tolerance§!.\n\nYour level of §nCongressional Tolerance§! is your way to strengthen different event options and focuses. §nCongressional Tolerance§! is a relatively rare resource, sp it's crucial that we save up high levels of §nCongressional Tolerance§! for only the most important looking bonuses.\n\nThe administration balance of power can shift between §cLeaning Conservative§!, §YRelatively Centrist§!, §lLeaning Progressive§!, and §SFirmly Progressive§!.\nEach of these leanings have different effects. Depending on the leaning of the administration, you can recieve different buffs in the Focus Tree, unique advisors, and bonus options in some events. You will also gain a dynamic modifier based on where the administration is currently leaning. The effects are as follows:\n\n-§cLeaning Conservative§!: (Stability: §G+10.00%§!, Political Power Factor: §R-5%§!)\n-§YRelatively Centrist§!: (Stability: §G+5.00%§!, Political Advisor Cost: §G-10%§!)\n-§lLeaning Progressive§!: (Stability: §G+5.00%§!, Political Power Factor: §G+5%§!)\n-§SFirmly Progressive§!: (Stability: §R-10.00%§!, Political Power Factor: §R-10%§!), we will gain a mission '§YProgressive Fever Amongst The Administration§!' which will grant §Y1§! level of §nCongressional Tolerance§! every 365 days, as long as the administration doesn't change balance in that time.\n\nNote that the effects given by each of these administration leanings can change with different focuses. These changes won't be shown in this tooltip."
compro_c.tt: "Modifies the effects of all administration balances by the following:\n§cLeaning Conservative§!: (Daily Political Power Gain: §G+0.10§!)\n-§YRelatively Centrist§!: (Daily Political Power Gain: §G+0.10§!)\n-§lLeaning Progressive§!: (Daily Political Power Gain: §G+0.10§!)\n-§SFirmly Progressive§!: (Daily Political Power Gain: §G+0.10§!)"
