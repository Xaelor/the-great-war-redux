ww1_USA.133.t: "America Fails to Deliver Loans"
ww1_USA.133.d: "Despite promising to unban loans to nations at war, America has still not lifted the ban offically, 3 months later. We cannot affoard to wait for America to offically remove the ban, and thus we must look towards other measures."
ww1_USA.133.a: "We don't have all year!"
ww1_USA.134.t: "America Agrees to Lift the Ban"
ww1_USA.134.d: "Our appeal to the Americans has ended in success today as the Americans have agreed to unban loans to foreign powers at war in the next few weeks. This will allow us to get some much needed cash to continue the war effort, which continues to be a strain on the British economy."
loans_soon.tt: "§YThe United States§! take the focus §YLoans to the Entente§! in the coming weeks, which will allow us to offically take much needed loans"
ww1_USA.134.a: "Great news!"
ww1_USA.135.t: "The USA Refuses to Lift the Ban"
ww1_USA.135.d: "Our attempts to convince the United States to lift the ban on loans has failed. America claimed that unbanning foreign loans to nations at war would be a risk to their neutrality, and thus we will have to look towards other options"
ww1_USA.135.a: "Drastic Economic Measures Will be Needed"
