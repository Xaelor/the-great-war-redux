USA_expand_the_commission_on_country_life_desc: "Some other loc writer can do this one"
USA_graceful_step_down_from_politics: "Decline a Second Term"
USA_unity_of_the_republicans: "Unity of the Republican Party"
USA_from_speaker_to_president: "From Speaker to President"
USA_southern_dockyards: "Southern Dockyards"
USA_support_automobile_giants_desc: "Several new automobile manufacturer have been springing up as of late. As the future of transportation, we must do what we can to support these manufacturers and expand the automobile market."
USA_eliminate_the_progressive_challengers: "Secure Control of the Party"
USA_get_action: "Reinstate the House Dictatorship"
USA_8_hour_work: "Fair Hours for Fair Labor"
USA_8_hour_work_desc: "Americans are overworked as it stands today. There is no reason why Americans should have to spend 10 hours a day working, when most studies show that a workers productivity falls off massively after the 8th hour. It's time to finally implement a national 8 hour workweek, which has shown success in corporations who have already implemented it."
USA_dol_to_meditate_labour_distributes: "DOL to Meditate Labor Disbutes"
USA_dol_to_meditate_labour_distributes_desc: "With more and more strikes firing up across the nation, the newly created Department of Labor needs to step up. We will have the Department of Labor increase its intervention into local strikes, ensuring that everyone gets a fair deal."

