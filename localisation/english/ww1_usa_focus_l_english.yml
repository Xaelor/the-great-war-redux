USA_roosevelt_klan: "Tackling the Second Klan"
USA_roosevelt_klan_desc: "Fueled by a rise of §cConser§!§qvative§! populism following Roosevelts election victory, the §qKlan§! has made a second appearence, painting an image of themselfves as a right wing, populist, white, and protestant group that has no intentions on breaking the law.\n\nWe know better then this though, the first Klan was a blatan militia group founded on the idea of overthrowing Republican governments in the south, and this new Klan is hardly any better. The new Klan has made it clear their opposition to us, and their antics are proving to bring us many difficulties. As such, we must nip this new Klan in the bud, before they radicalize or mobilize enough people to take down our presidency through the ballot box."
