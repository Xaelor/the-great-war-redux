USA_mend_wounds_in_the_party: "Mend Rifts in the Party"
USA_mend_wounds_in_the_party_desc: "A lot of infighting and tension exists in the Republican party of today. We need to make a clear effort to help mend the growing rift, and make sure all Republicans are united."
USA_expand_insurance: "Expand Insurance"
USA_expand_insurance_desc: "Actions speak louder then words. We must prove to progressive Republicans we truly support their cause, and expanding insurance would be a perfect way to do this."
USA_give_conservatives_government_positions: "Give Conservatives Government Positions"
USA_give_conservatives_government_positions_desc: "A simple way to reduce the influence progressives have on the party is to simply reduce their influence over policy. Replacing progressives with conservatives in the administration will help strengthen the conservative wing of the Republicans."
USA_secure_big_donors: "Secure Big Donors"
USA_secure_big_donors_desc: "Progressive policies naturally hurt big business and their interests. With us not having to worry about progressives' opinions anymore, we can show big business our more conservative views and secure their support against a progressive challenger."
USA_fight_progressive_influence: "Secure the Establishment"
USA_fight_progressive_influence_desc: "Not all top Republicans agree with our administration, but that doesn't mean they support destroying the Republican party. We know Roosevelt is probably planning a third party run, and preventing as many politicians as we can from joining should help kill all of its momentum."
USA_united_states_postal_service: "Postal Banking"
USA_united_states_postal_service_desc: "The postal banking service will accept deposits from the general public, but not offer full banking services. Instead, it will redeposit the funds to designated banks. This will help stabilize the economy, as when people withdraw funds during a bank run, they will deposit into the postal system, which would redeposit into the banking system."
USA_second_annual_message: "Second Annual Message"
USA_second_annual_message_desc: "The Annual Message is our chance to speak directly to congress - and the American people, about our agenda and garner support. We must prepare in advance what agenda we plan to push."
USA_reep_the_fruits_of_the_panama_canal: "Reep the Fruits of the Panama Canal"
USA_reep_the_fruits_of_the_panama_canal_desc: "We are the one taking on the burden of building the Panama Canal, we deserve a reward for this. By elimating future toll rates for American ships, we can gain a large advantage on trade over the rest of the world."
USA_8_hour_work_week: "8 Hour Work Week"
USA_8_hour_work_week_desc: "Americans are overworked as it stands today. There is no reason why Americans should have to spend 10 hours+ a day working, and most studies show that a workers productivity falls off massively after the 8th hour anyway."
USA_keep_the_taxes_low: "Keep the Taxes Low"
USA_secure_corporate_americas_support: "Secure Corporate America's Backing"
USA_secure_corporate_americas_support_desc: "We have been getting very friendly with large corporations lately. Securing their electoral support and offering them government aid to expand their businesses. We should reach out to some of the corporate giants, and secure their backing."
USA_boost_american_manufacturing: "Made in America!"
USA_boost_american_manufacturing_desc: "We must prioritize American industry and American interests over other countries. There have been many calls for a trade agreement with Canada, instead we should boost American manufacturing and thus boost our economy more then any trade deal could."
