USA_purchase_greenland_desc: "In the North Atlantic lies the massive island of Greenland, currently territory of the Kingdom of Denmark. If we want to expand our influence further towards the Atlantic Ocean and Europe, this island could be a very important base for us. If we offer a large price for the island, the Danish will be sure to accept, as it would be a large boost their small economy."
