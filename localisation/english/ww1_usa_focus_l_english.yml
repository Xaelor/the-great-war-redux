USA_mend_wounds_in_the_party: "Mend Rifts in the Party"
USA_mend_wounds_in_the_party_desc: "A lot of infighting and tension exists in the Republican party of today. We need to make a clear effort to help mend the growing rift, and make sure all Republicans are united."
USA_expand_insurance: "Expand Insurance"
USA_expand_insurance_desc: "Actions speak louder then words. We must prove to progressive Republicans we truly support their cause, and expanding insurance would be a perfect way to do this."
USA_give_conservatives_government_positions: "Give Conservatives Government Positions"
USA_give_conservatives_government_positions_desc: "A simple way to reduce the influence progressives have on the party is to simply reduce their influence over policy. Replacing progressives with conservatives in the administration will help strengthen the conservative wing of the Republicans."
USA_secure_big_donors: "Secure Big Donors"
USA_secure_big_donors_desc: "Progressive policies naturally hurt big business and their interests. With us not having to worry about progressives' opinions anymore, we can show big business our more conservative views and secure their support against a progressive challenger."
USA_fight_progressive_influence: "Secure the Establishment"
USA_fight_progressive_influence_desc: "Not all top Republicans agree with our administration, but that doesn't mean they support destroying the Republican party. We know Roosevelt is probably planning a third party run, and preventing as many politicians as we can from joining should help kill all of its momentum."
USA_end_roosevelts_agitation: "End Roosevelt's Agitation"
USA_end_roosevelts_agitation_desc: ""
USA_united_states_postal_service: "Postal Banking"
USA_united_states_postal_service_desc: "The postal banking service will accept deposits from the general public, but not offer full banking services. Instead, it will redeposit the funds to designated banks. This will help stabilize the economy, as when people withdraw funds during a bank run, they will deposit into the postal system, which would redeposit into the banking system."
USA_second_annual_message: "Second Annual Message"
USA_second_annual_message_desc: "The Annual Message is our chance to speak directly to congress - and the American people, about our agenda and garner support. We must prepare in advance what agenda we plan to push."
USA_reep_the_fruits_of_the_panama_canal: "Reep the Fruits of the Panama Canal"
USA_reep_the_fruits_of_the_panama_canal_desc: "We are the one taking on the burden of building the Panama Canal, we deserve a reward for this. By elimating future toll rates for American ships, we can gain a large advantage on trade over the rest of the world."
USA_8_hour_work_week: "8 Hour Work Day"
USA_8_hour_work_week_desc: "Americans are overworked as it stands today. There is no reason why Americans should have to spend 10 hours+ a day working, and most studies show that a workers productivity falls off massively after the 8th hour anyway."
USA_reveal_weakness.tt: "Increasing the budget of the army won't be politically cheap. We will have to decide just how much §YPolitical Power§! we are willing to spend to get §5Congress§! to increase the funding of the army. The more §YPolitical Power§! we spend, the more thorough the investigation will be. After 365 days, the report on the state of our military will be complete. Depending on how thorough our investigation is, we will be able reduce the debuffs from the §YConsumer Based Economy§! national spirit, as well as gain potential rewards like §GMilitary Factories§!, §GArmy XP§! and possible §GHidden Focus's§!."
USA_occupy_tientsin_desc: "China has exploded into chaos! We can take this opprotunity to occupy Tientsin, a decently large city and good position for a military base."
USA_set_toll_rates_on_panama_canal_shipping: "Set Toll Rates on Panama Canal Shipping"
USA_set_toll_rates_on_panama_canal_shipping_desc: "With the Panama Canal nearing completion, we must prepare to set toll rates for those who wish to use the Panama Canal. We could set them high, which would increase our overall profits, but could be too much for other countries to accept which would result in less total revenue. We could also set them low, which would yield us less profit but guarentee the canal is used by the international community. Of course we could instead do an inbetween decision instead."
USA_secure_corporate_americas_support: "Secure Corporate America's Backing"
USA_secure_corporate_americas_support_desc: "We have been getting very friendly with large corporations lately. Securing their electoral support and offering them government aid to expand their businesses. We should reach out to some of the corporate giants, and secure their backing."
USA_boost_american_manufacturing: "Made in America!"
USA_boost_american_manufacturing_desc: "We must prioritize American industry and American interests over other countries. There have been many calls for a trade agreement with Canada, instead we should boost American manufacturing and thus boost our economy more then any trade deal could."
 Taft_Nomination_Warning_tt: "§gWithout Progressive Support, Republican votes will be Split and §!§RWilliam Howard Taft§! §gwill lose.§!"
 Roosevelt_Nomination_tt: "§gWith a United Republican Party,§! §GTheodore Roosevelt§!§g should win in a landslide.§!"
 Hadley_Nomination_tt: "§gWith a United Republican Party, §!§RHerbert Hadley§!§g should win.§!"
 Taft_Nomination_tt: "§gWith a United Republican Party, §!§RWilliam Howard Taft§!§g should win in a landslide.§!"
 Clark_Nomination_tt: "§gPopular throughout the whole nation, §!§CChamp Clark§!§g poses a unique chance at victory.§!"
 Wilson_Nomination_tt: "§gPopular in the South,§! §CWoodrow Wilson§!§g will likely only win through a split vote.§!"
 Bryan_Nomination_tt: "§gPopular nationwide and running for election an unprecedented fourth time, §!§CWilliam Jennings Bryan§!§g is a likely presidential winner.§!"
 Everyone_Disliked_That_tt: "§G[Everyone Disliked That]§!"
 Socialist_Election_1912_tt: "§gWorker's Around the Nation will come out to vote for §!§REugene Debs§! §gin November of 1912.§!"
 USA_develop_arizona: "Develop Arizona"
 USA_develop_arizona_desc: "I think the focus name is self explanatory"
 USA_develop_new_mexico: "Develop New Mexico"
 USA_develop_new_mexico_desc: "Waltuh"
 USA_new_mexican_statehood: "New Mexican Statehood"
 USA_new_mexican_statehood_desc: "With all preparations complete, we can finally welcome New Mexico as the 47th state."
 USA_arizonan_statehood: "Arizonan Statehood"
 USA_arizonan_statehood_desc: "With all preparations complete, we can finally welcome Arizona as the 48th state."
 USA_canadian_reciprocal_trade_agreement: "Canadian Reciprocal Trade Agreement"
 USA_canadian_reciprocal_trade_agreement_desc: "A free trade agreement with Canada, similar to the US-Canadian Reciprocity Treaty in 1854, would greatly strengthen our ties and trade with Canada. This trade deal would open our products to more markets, and allow us easier access to Canadas natural resources."
 USA_commercial_treaty_with_japan: "Treaty with Japan"
 USA_commercial_treaty_with_japan_desc: "While the Japanese terminated 1894 treaty with us, viewing it as unfair, they have made it clear they would be open to a new treaty they view as equal. Let's send Taft over to Tokyo to meet with the emperor and see what we can do."
 USA_supervise_dominican_republic: "Stabilize the Dominican Republic"
 USA_supervise_dominican_republic_desc: "The Dominican Republic is facing widespread riots due to wealth inequality and a lack of economic opportunity. This unstable enviornment is making it increasingly unsustainable for American businesses, who have been considering pulling out operations. To prevent this, we should offer them our troops and an aid package."
 USA_the_progressive_figure: "The Progressive Figure"
 USA_the_progressive_figure_desc: "We've passed a series of Progressive reforms lately. Let's put out a series a posters highlighting these accomplishments and characterizing us as a progressive reformer."
 USA_fear_me: "Fear Me"
 USA_fear_me_desc: "West Virginia has exploded in protests! We must make an example and send in the national guard to break up these protests"
 USA_hear_me: "Hear Me"
 USA_hear_me_desc: "West Virginian coal miners have gone on strike because of harsh conditions. Let's not make a rash decision, instead, we should negotiate with these protesters and see what we can do to make them go back to work peacefully."
 USA_alcohol_restrictions: "Alcohol Restrictions"
 USA_alcohol_restrictions_desc: "Alcohol is poisoning American society. While full prohibation would be too far, some reasonable restrictions on what classifies as whisky could help reduce the effects of rampid alcholism."
 USA_show_them_his_unreasonability: "Show Them his Unreasonability"
 USA_show_them_his_unreasonability_desc: "Roosevelt clearly has a grudge against Taft. Whatever the reason, by calling Roosevelt out on this with evidence, we could reduce Roosevelt's credibility and boost our view amongst progressives."
 USA_weeks_act: "Weeks Act"
 USA_weeks_act_desc: "There is a large problem with American forests often facing mass deforestation by corporations, with nothing legally stopping them. To prevent a depletion of resources (and expand the governments power), we should authorize the Federal Government to purchase land deemed as necessary to protect."
 USA_1912_election: "1912 Elections"
 USA_1912_election_desc: ""
USA_new_freedom: "Policy of 'New Freedom'"
USA_new_freedom_desc: "American enterprise for too long has been in the hands of monopolies and trusts. Only through freedom of enterprise, can America truely be free at all. With Wilsons bold progressive agenda, we can secure these "new freedoms" for all Americans"
USA_oscar_tariff: "Foundations for Fiscal Sustainability"
USA_oscar_tariff_desc: "One of the uniting beliefs of the Democrat Party is the idea of lower tariffs. Especially with Tafts recklessly high Tariffs, a huge reduction to tariffs across the board would help consumers a lot. Although tariffs do make up a lot of government income, finally reintroducing the income tax will be more then enough to make up for the lost revenue."
USA_re_affirm_kill_all_researchers: "Reaffirm American Isolation"
USA_the_final_war: "The Final War in History"
USA_the_final_war_desc: "We did all we can to keep our neutrality, but Germany's blatan violations of our sovereignty and our people have ultimately forced our hand. We will demand congress declare war on Germany to bring democracy and freedom to the Central Powers and thus ensure this is the final war the world ever fights."
USA_question_american_neutrality_desc: "Outright abandoning American neutrality is obviously political suicide, but it doesn't mean we can't criticize the blatan war crimes the German Empire is commiting in Belguim. We will address the nation pledging neutrality, but stating we cannot ask Americans to be neutral in thought."
USA_re_affirm_kill_all_researchers_desc: "The imperialist Europeans have once again dragged themselves into a large scale war, over petty lines on a map. We will make it clear from the start that America has no interest in this so called 'Great War'."
USA_neutrality_in_europes_war_desc: "While Europe tears its self apart over silly squabbles, we should take the time to speed up our domestic agenda. Pointing to our pledge to mantain American neutrality in The Great War should help whip up isolationist congress members who have been more wary of our agenda."
USA_never_ending_offensive: "The 'Nail Gun' Strategy"
USA_entente_training_plan: "Amalgamation With the Entente"
USA_loans_to_the_entente: "Revoke Ban On Loans For Nations At War"
USA_council_of_national_defense: "Assemble the Council"
USA_palmer_raids: "Finish the Socialists off"
USA_deportation_act: "Expel Radical Anarchists"
USA_womens_right_to_vote: "Expand Voting Rights to Women"
USA_increase_food_trade: "Increase Food Trade With Entente"
USA_increase_food_trade_desc: "Enente nations are suffering large food shortages, while we have large stockpiles ourselves. To kill two birds with one stone, let's reach out to Entente countries and offer them to dramatically increase food exports to their country for a relatively cheap price."
USA_loans_to_the_entente_desc: "Currently, there is a ban on American banks lending loans to any nations at war. With our economy suffering as of late, lifting this ban would be an easy way to revive the economy while also supporting the nation at war with one of our geopolitical enemies."
USA_talented_refugee: "Influx of European Refugees"
ww1_USA.143.a: "The people will understand"
USA_stock_homestead_act: "Stock-Raising Homestead Act"
USA_united_democratic_party: "United Democratic Party"
USA_gain_socialist_support: "Theory of 'Socialism and Democracy'"
USA_puerto_rico_government_reform: "Puerto Rico State Government Reform"
 USA_end_railway_strike: "Quell Striking Railway Workers"
USA_global_naval_power_potential: "Global Naval Power Potential"
USA_pursue_expansion_of_naval_production: "Pursue Expansion of Naval Production"
USA_old_policy_in_latin: "Oppose Revolutionaries in Latin America"
USA_old_policy_in_latin_desc: "Latin America is increasingly becoming more and more stable in the last few months. If these governments collapse, it would significantly harm U.S businesses across Latin America. We should reach out to Central American governments and offer them small loans to help stabilize their governments."
 USA_neutrality_in_europes_war: "Take a Backseat to Europes Problems"
 USA_end_railway_strike_desc: "A massive storm is brewing in Pennsylvania, where a large port has been completly shutdown due to strikes. With railway strikers joining them in several local cities, if we do not act quickly there's a chance the devils at the IWW will take this as their chance to cause a mass strike in the United States."
 USA_i_do_solemnly_swear...: "I do Solemnly Swear..."
USA_gain_support_of_trade_union: "Align Non-Socialist Unions"
USA_gain_support_of_trade_union_desc: "Many unions support the exact same policies as Wilsons new freedom agenda. We must reach out to these unions, and ensure their political support to our campaign."
 USA_i_do_solemnly_swear...: "I do Solemnly Swear..."
 USA_the_wilson_presidency: "The Wilson Presidency"
 USA_the_wilson_presidency_desc: "The American people have voted for Woodrow Wilson! A relatively progressive canidate, wilsons support is strong in the south and plains states."
 USA_press_secretary: "The Press Secretary"
 USA_press_secretary_desc: "Woodrow is a busy man with many tasks ahead of him. We simply don't have time to host weekly press confrences, so we can have someone else speak for the presidemt instead."
 USA_meet_with_railroad_workers: "Meet with Protesting Railroad Workers"
 USA_meet_with_railroad_workers_desc: "Theres currently a widespread strike amongst railroad workers taking place. Luckily, as a progressive canidate, these strikers do have faith in our administration. Let's reach out to them and see what we can do."
 USA_the_congressional_delegation_speaks: "The Congressional Delegation Speaks"
 USA_the_congressional_delegation_speaks_desc: "A delegation of senators opposed to the womens suffrage movement has repeatably requested to talk with the new president. We need good relations with congress, so we should atleast hear them out"
 USA_investigate_mining_conditions: "Investigate Mining Conditions"
 USA_investigate_mining_conditions_desc: "West Virginia has also been facing widespread protests as the large majority of their population is made up of coal miners. We should send some government officals to go investigate conditions and see what we can do."
 USA_im_from_government_and_here_to_help: "Fighting For You and Me!"
 USA_im_from_government_and_here_to_help_desc: "conditions may be bad, but president Wilson is doing all he can to help! We need to make sure the working families of America know that President Wilson is fighting for them!"
 USA_invite_NAWSA_members_to_a_meeting: "Invite NAWSA Members to a Meeting"
 USA_invite_NAWSA_members_to_a_meeting_desc: "The NAWSA - The National American Woman Suffrage Association, is the leading group for Womens suffrage. The writings on the wall, and we must be on the right side of history. Let's arrange a meeting with them for the publicity."
 USA_endorse_the_movement: "Endorse the Movement"
 USA_CCE_advisors: "Invite EEC Members in the Administration"
 USA_CCE_advisors_desc: "Whether we could save the EEC or not, many of their members are experienced and wise people that would do well as advisors in our new administration. Let's invite them to advise us."
 USA_clayton_anti_trust: "Clayton Antitrust Act"
 USA_clayton_anti_trust_desc: "American capitilism is still need of reform. The Clayton Antitrust act will help fight things like price discrimination and so called "exclusive deals" that continue to hurt the free market."
 USA_underwood_simmons_tariff: "Underwood Simmons Tarrif"
 USA_underwood_simmons_tariff_desc: "Tarrifs are way too high in this country! A bill to reduce tarrifs will help the consumer, and while we're at it we can finally implement a national income tax to make up for the lost revenue!"
 USA_emergency_tax_increases: "Emergency Tax Increases"
 USA_emergency_tax_increases_desc: "We set tax rates too low! Recent rearmment efforts have proved expensive, and we need the extra income to fund said efforts. Let's quickly pass a temporary tax increase before congress goes on break!"
 USA_congressional_research: "Congressional Research"
 USA_congressional_research_desc: "The congressional research service will help present congress with data on the most pressing issues of today. This service would be used to make more defined and effective legislation in theory, although some fear that biased research could be used to push an agenda."
 USA_perfect_the_whip: "Perfect the Whip"
 USA_perfect_the_whip_desc: "The recently made position of party "whips" have been very effective in getting the entire party behind legislation. We should work on perfecting this idea to get as much of our legislation through as we can."
 USA_flex_political_accomplishments: "Flex our Accomplishments"
 USA_flex_political_accomplishments_desc: "The Federal Reserve act! The Clayton Antitrust act! The Underwood Simmons Tarrif! The Federal Reserve! Investments in rural America! Woodrow Wilson is clearly succeeding with his idea of "New Nationalism", and all of these achievements can be used to flex Wilsons political might and the popularity of his achievements to congress."
 USA_federal_trade_commission: "Federal Trade Commission"
 USA_federal_trade_commission_desc: "The federal trade commission will be dedicated solely to enforcing Antitrust legislation, significantly accelerating the effort against unfair monopolies."
 USA_national_park_service: "National Park Service"
 USA_national_park_service_desc: "With the rise of National Parks, a government agency to help manage and run them would be worth looking into. Let's try and make an agency for this purpose."
 USA_transportaion_of_alcohol_restriction: "Restrict Transportation of Alcohol"
 USA_transportaion_of_alcohol_restriction_desc: "We must limit the amount of alcohol that is legally aloud to be transmitted across state lines. This will help fight both drunk driving and excessive alcohol consumption."
  USA_endorse_the_movement_desc: "It's time to make our stance offical: Wilson stands with womens rights. With the presidents approval, we can help to pass womens suffrage - and get some of the credit for it too."
  USA_an_issue_for_the_states: "An Issue for the States"
  USA_an_issue_for_the_states_desc: "This is a family of states! Each member of the family has a different view on the issue of womens suffrage, so why should the leader of the family decide for every single family member what they should believe? We should endorse the current state of affairs where states are free to pass any law they want on this issue."
  USA_prevent_a_strike: "Prevent a Strike"
  USA_prevent_a_strike_desc: "We must pass some sort of legislation to prevent a railway strike! The general consensus is a 8 hour workweek mandated by law for all railway workers. Let's propose the law to congress."
  USA_child_labour_restrictions: "Child Labour Restrictions"
  USA_child_labour_restrictions_desc: "Child labour is becoming increasingly unacceptable across the country. We must do the morally right thing and restrict the amount of hours children can work, while also banning the sale of goods outside the united states created by children."
  USA_seamans_act: "Seamans Act"
   USA_seamans_act_desc: "Being a Marine is one of the most dangerous jobs in the country. Improving the safety and security of United States seamen and eliminate shanghaiing, a practice of tricking people into becoming seaman, should help ease the fears of joining the Marines."
   USA_compensation_for_injuries: "Compensation for Injuries"
   USA_compensation_for_injuries_desc: "Many workers face injuries due to unsafe working conditions. We should force companies to pay for the medical bills of injuries that are due to company neligance and irresponsibilty."
   USA_sideline_administration_reformers: "Sideline Administration Reformers"
   USA_sideline_administration_reformers_desc: "The EEC and its members want to expand the federal governments powers even more. This will just make the government even more inefficent and weaken the power of the states, we need to reject these reformers and their ideas."
   USA_this_is_a_union_not_an_empire: "This is a Union, Not an Empire!"
   USA_this_is_a_union_not_an_empire_desc: "The constitution guarantees the rights of states to mostly govern themselves. We must affirm these rights and icrease states power to spend federal money sent to them as they see fit! After all, a state knows what its population needs more then washington does."
    USA_america_was_founded_as_sovereign_states_with_rights: "A Union of Sovereign States With Rights!"
    USA_america_was_founded_as_sovereign_states_with_rights_desc: "It seems many in congress have forgotten America was originally known as "These United States" before "The United States." The increasing centralization of power by Washington will only serve to weaken the United States and its tradition of local government."
  USA_restrict_governor_control_of_federal_programs: "Washington Knows Best!"
  USA_restrict_governor_control_of_federal_programs_desc: "Governors have often mismanaged federal funds to use for whatever they please. Why should federal aid meant for, say, education, be used to instead fund a more roads? We need new laws to assure that federal funds are used for their intended purposes."
USA_smith_hughes_act: "Smith Hughes Act"
USA_smith_hughes_act_desc: "The Smith Hughes act will help promote education in industry in agriculture, but also more importantly, the language of the bill will further strengthen federal control of federal funds and what they're used for."
USA_fight_gridlocks: "The Presidents Mediation"
USA_fight_gridlocks_desc: "The President holds a lot of influence, and he doesn't directly make the laws, he can influence them. Frequent talks infront of congress and some backdoor pressure, should help us be able to fight gridlocks."
USA_focus_on_top_priorities: "The Importance of the First 100 Days"
USA_focus_on_top_priorities_desc: "The first 100 days can make or break a presidents public image, we must rush to pass our agenda! Whats that? the EEC? It sounds interesting, yes, but we don't have time to save them in congress!"
 USA_concentration_in_industry: "Organize Cartelization of the Economy"
USA_build_back_better: "Build Back Better Program"
USA_build_back_better_desc: "American infrastructure has faced severe neglect in several areas of the country, with some roads and bridges blatanly falling apart. Luckily, President Taft has came up with a new progran aimed to revitalize American Infrastructure across the nation - the "Build Back Better Program" aimed to increase direct investments into America"
progressives_shift_10_left.tt: "The coalition ideology will become §Smore§! reformist by 10"
progressives_shift_20_right.tt: "The coalition ideology will become §cless§! reformist by 20"
progressives_shift_5_left.tt: "The coalition ideology will become §Smore§! reformist by 5"
