  USA_beat_niggers_down_with_baseball_bats: "Beat Niggers Down With Baseball Bats"
  USA_big_man_in_the_klan: "Big Man in the Klan"
  USA_make_them_submit: "Make them Submit"
  USA_make_them_serve: "And make them Serve"
  USA_the_dream_for_all: "The American Dream, for All"
  USA_commissionon_economy_and_efficiency: "Commision on Economy and Efficiency"
  USA_commissionon_economy_and_efficiency_desc: "The Commision on Economy and Efficiency - the EEC, has many ambitious plans on how to reform the administrative process. They plan to create the first budget for the federal government, as well as creating the procedure for the President to establish a commission to study administrative reform."
####events
ww1_USA.70.t: "Japan Accepts US-Japanese Naval Collaboration Treaty"
ww1_USA.70.d: "Talks with Japan have gone relatively well as Japan's emperor agreed to a treaty expanding US-Japanese naval collaboration, paving the way for minor research collaborations and future naval exercises. While vague and in reality its unlikely Japan and America will be sharing top of the notch research on naval matters, it is a diplomatic victory at the very least."
ww1_USA.70.a: "It will be a good headline, at least"
ww1_USA.69.t: "America Offers Naval Collaboration"

ww1_USA.68.t: "Taft's Visit to Tokyo"
ww1_USA.68.d: "Taft has arrived in Tokyo to negotiate a naval treaty with the Japanese. Japan terminated the last treaty with the US for being "unequal", yet still offered the USA the opprotunity for a new treaty. Today, we shall help make such new treaty a reality.\n\nWe have a variety of different options on what such treaty should involve. We could play it simple, just offering vague broad future naval collaboration. This would for sure get Japan to accept our deal, tho it may leave both parties feeling like they walked away with barley anything at all. We could also push for a treaty limiting the rapid expansion of Japans navy, although it is less certain they would accept any such deal. We would have to be prepared to offer some concessions in return, assuming they don't outright reject our approach. We also could try to expand the treaty outside just naval terms, aiming for a trade deal of sorts, cultural exchange, or maybe even a defensive pact!"
ww1_USA.68.a: "Lets just aim for minor naval collaboration"
ww1_USA.68.b: "So, about naval disarment..."
ww1_USA.68.c: "Let's shift talks towards a commercial treaty"

ww1_USA.67.t: "Mena's Rebellion!"
ww1_USA.67.d: "Angered by US influence over Nicaragua, Famed General Mena has lead a coup of the Nicaraguan government, appointing himself leader. He has promised to purge Nicaragua of US influence and mantain its independence. Adolfo has reorganized in the east and called for US intervention to save him."
ww1_USA.67.a: "Direct a force of Marines and batteships to his location!"
ww1_USA.66.t: "Nicaragua Agrees to Our Terms"
ww1_USA.66.d: "Realizing the reality of their situation, Adolfo has agreed to our offer of cheap loans and encouraging business investment in their country, in return for him making sure Nicaragua offers our companies concessions."
ww1_USA.66.a: "You couldn't live with yourself, and where did it bring you?"
ww1_USA.65.t: "A Deal With the Devil?"
ww1_USA.63.t: "Juan Estrada Forced to Resign in Nicaragua"
ww1_USA.63.d: "Juan Estrada has been forced to resign as president in Nicaragua by his war minister Luis Mena. This comes after increasing unpopularity from his precieved selling out of the country to America. He has been replaced by a more conservative man, Adolfo Díaz."
ww1_USA.63.a: "Get a line to Managua, now!"
ww1_USA.64.t: "The Nicaraguan Economy is Crashing!"
ww1_USA.64.d: "With a lack of American investment, the Nicaraguan is facing deep decline, as investment in the country is stalled. In addition, many companies are exporting jobs from Nicaragua to cheaper places. With this economic collapse, Adolfo is becoming desperate. We could most likely swoop in and offer Nicaragua more American investment and loans, in return for some concessions."
ww1_USA.64.a: "We'll send them an offer they can't refuse!"
oust_jose_25.tt: "We will become §Y25%§! more prepared to force §YJose Madriz§! to flee!"
oust_jose_100.tt: "Our preparedness to force §YJose Madriz§! to flee is §Y100%§!"
oust_jose.tt: "With these decisions, we will be able to replace §YJose Madriz§! with a more... friendly President, who will allow us to upgrade the §YCompany Ventures in the America's§Y national spirit."
ww1_USA.61.t: "Jose Madriz flees Nicaragua!"
ww1_USA.61.d: "We've done it! Today Jose Madriz resigned the office of President in Nicaragua, giving power to Juan Estrada, a much more... friendly leader. Already, Juan has publicly endorsed Taft's "dollar diplomacy" strategy, inviting American business and loans to the country."
ww1_USA.61.a: "Mission accomplished."
ww1_USA.62.t: "Jose Madriz Flees Nicaraqua"
 USA_promised_not_to_pass_resources_of_war: "We have reassured Pinchot that we will prioritize conservation over resource extraction"
ww1_USA_roosevelt.12.t: "Conservatives Organize Against Roosevelt"
ww1_USA_roosevelt.12.d: "Just a few months into Roosevelts first term, conservative opposition across the spectrum have began organizing for the 1914 midterms. While relatively unpopular for now, figures across the New Nationalist Coalition are worried that if not handled well, they could make gains amongst the public. The American electorate, afterall, is notorious for turning against the party in power during the midterms.\n\nWhile we have the advantage for now, this could quickly fall. Passing unpopular legislation, mismanaging internal party politics, and failing to combat conservative narratives could all lead to them gaining the advantage. If they did win the House and Senate, it's clear that Roosevelt would have no hope at passing the vast majority of his legislation."
ww1_USA_roosevelt.12.a: "We must win the heart and soul of the American people."
USA_not_complete_resource: "We will not be able to take the focus §YThe Resources Of War§!"
ww1_USA_roosevelt.11.t: "Gifford Pinchot Demands Reassurance On Conservation Policies"
ww1_USA_roosevelt.11.d: "Gifford Pinchot, one of Roosevelts longest advisors, has today personally raised his concerns to Roosevelt over enviornmentalist policies. Due to Roosevelts history of ignoring company giants he deems "worthy", and Roosevelts support for an expansion of war industry, Pinchot has raised his concern that Roosevelt would prioritize the extraction of resources needed to fuel a war machine over conservation and protection of the enviornment.\n\nWhile Pinchot is definitely a valued advisor, his demand that we guarantee to prioritize the protection of the enviornment could leave us in a bad position for a future war, and who knows what else Pinchot would demand? Whatever the case may be, it is ultimately Roosevelts decision on how to reply"
ww1_USA_roosevelt.11.a: "This is a no-brainer, give him our reassurance."
ww1_USA_roosevelt.11.b: "We will keep our options open"
ww1_USA.62.d: "Under immense pressure from the Americans, Nicaraquan president Jose Madriz has reigned as president, handing over power to Juan Estrada, a pro American leader. Former president Jose's downfall comes after his failure to supress conservative anti American protests down south, threatening American business there.\n\nAlready, Juan as denounced european influence, and has reached out to US president Taft looking for "further cooperation""
ww1_USA.62a: "This is for the Best."
ww1_USA.62b: "An Obvious Powergrab by the Americans"
ww1_USA.60.a: "We will do what's best for them, even if they don't understand why!"
ww1_USA.60.t: "Smedley Butler's Marines Arrive Off the Coast of Nicaragua"
ww1_USA.60.d: "Over the past few years, Nicaragua has been facing multiple conservative revolts first starting against the former president Zelaya's government, having captured many small towns on the border with Costa Rica and were fomenting an open rebellion in the capital of Managua. With the new president, Jose Madriz, failing to deal with these rebellions, it has become clear to American leadership that Jose Madriz needs to go. To pressure Jose Madriz into fleeing the country, we've organized a 250 strong marine force off the coast of Nicaragua, to make sure Nicaragua knows we will always be ready to secure our interests..."
ww1_USA.59.t: "Roosevelt Announces Run for Republican Nominee"
ww1_USA.59.d: "Stating he would "gladly accept" a Republican nomination for president, Roosevelt has confirmed the fears of many, that he will be challenging taft next November. While favored amongst the general population, Roosevelt and Taft are bitterly close amongst support of the party higherups, who actually nominate the president in most states."
ww1_USA.59.a: "Shit, shit!"
ww1_USA.58.t: "Chevrolet Competes With Ford Motor"
ww1_USA.58.d: "Ford Motor, who has never had to deal with much competition in the automobile market, has faced new competition as a promising company named Chevrolet has recently announced its new automobile avaible for sale. Already, sales of automobiles are reaching new highs as Chevrolet and Ford Motor compete to make better and cheaper cars!"
ww1_USA.58.a: "Capitalism breeds innovation!"
ww1_USA.92.t: "State Delegates Throw Support Behind Clark"
ww1_USA.92.d: "Seeing Clark as the best fit for the job, several state delegate leaders have began to endorse Clark, and promise their states votes in the upcoming convention. While the race seems completed locked in for Clark, supporters of Wilson still argue the primary is not over until it is over."
ww1_USA.92.a: "Wilson can Still Win This!"
ww1_USA.92.b: "It's Only Natural the Speaker of the House Wins Against a Bunch of Nobodies"
ww1_USA_roosevelt.7.t: "Moderates Support Current Bill"
 ww1_USA_roosevelt.7.d: "The newly proposed bill in Congress has recieved widespread support amongst moderates previously reluctant to Roosevelts agenda. Due to this widespread support, many expect this bill to pass with flying colors, with only limited conservative opposition.\n\nWhile we can't expect their permanent support, we can mostly ignore this bill until it passes, unless something significant changes until then."
 ww1_USA_roosevelt.9.t: "Moderates Oppose Current Bill"
 ww1_USA_roosevelt.9.d: "The newly proposed bill in Congress, for whatever reason, has scared moderates support sway. Due to this opposition from much of the moderate faction of congress, this bill is most likely going to be a challenge to pass"
 ww1_USA_roosevelt.9.a: "They stand in the way of progress"
ww1_USA_roosevelt.10.t: "Moderates Return to Their Previous Stance"
ww1_USA_roosevelt.10.d: "While opposed to the last bill, many moderates still agree with the vast majority of the New Nationalist Coalitions ideology, and we can still expect their support most of our more moderate reforms."
ww1_USA_roosevelt.10.a: "We will welcome them back"
 ww1_USA_roosevelt.7.a: "Great!"
ww1_USA_roosevelt.8.t: "Moderates Return to Their Previous Stance"
ww1_USA_roosevelt.8.d: "While supporting the previous bill, these moderates have refused to join the New Nationalist Coalition, atleast for the near future. While disapointing, this was to be expected"
ww1_USA_roosevelt.8.a: "Their Votes Were Helpful for the Last Bill"
ww1_USA.57.t: "Roosevelt Announces New Nationalism"
ww1_USA.57.d: "Today in Kansas Roosevelt has given a speech dubbed the “New Nationalism” speech, in which Roosevelt has outlined a new role for the government in dealing with social issues, endorsing conservation, control of trusts, labor protection, and a graduated income tax. It also embraces the growing conviction that the nation must address the plight of children, women, and the underprivileged."
ww1_USA.57.a: "Is he an idealist or a delusionist?"
ww1_USA.56.t: "Southern Pacific and Union Pacific Railroads Want to Unite"
ww1_USA.56.a: "Look the otherway"
ww1_USA.56.b: "File a suit to stop this merge"
ww1_USA.56.d: "Two massive railroad companies, South Pacific and Union Pacific, have announced plans to merge their companies together. This company would have a masive monopoly over railroads in the west coast, as well as possibly violating anti-trust laws. However, this company merge could also help improve the development of west coast railway."
ww1_USA.55.t: "Robert LaFollette Challenges Taft"
ww1_USA.55.d: "With increasing anger towards Taft, Wisconsin senator Robert LaFollette has announced he will be challenging Taft in order to "save the progressive cause." While luckily not supported by Roosevelt, LaFollette has some serious support specifically in his home state of Wiscosin. Luckily for Taft however, LaFollette is quite prone to gaffes and emotional outbursts, as well as not liked amongst the party establishment."
ww1_USA.55.a: "The ramblings of a mad man..."
ww1_USA.54.t: "On the Need for a Federal Budget"
ww1_USA.54.d: "The CCE has come out with another report today, this time publicly aviable. The thesis has called for the introduction of a enforced federal budget, drafted by the president. They argue this new budget system would help increase business confidence as well as economic stability."
ww1_USA.54.a: "An interesting idea for sure!"
ww1_USA.53.t: "EEC Advises Taft on Administrative Matters"
ww1_USA.53.d: "The EEC has just came out with a report to Taft offering a wide variety of advice on the administrative and its efficiency. While not seeking direct legislation through congress, the EEC has offered taft a variety of smaller loopholes he can use to increase authority over the his cabinet and the administration in general."
ww1_USA.53.a: "They are valued advisors"
ww1_USA.51.t: "Where to Put Extra Funds?"
ww1_USA.51.d: "The new military budget expansion has still left money to be allocated. Since we have rejected some calls to put it in the development of air warfair, we are instead left with 3 main options. We could put the money into improving our infrantry equipment, our artillery, or improving our soldiers training."
ww1_USA.51.a: "Put the funds towards infrantry equipment development."
ww1_USA.51.b: "Allocate it to artillery production."
ww1_USA.51.c: "We need to invest in modernizing our tactics."
ww1_USA.2.t: "Boll Weevils Destroy Southern Cotton Farms."
ww1_USA.2.d: "The boll weevil, a cotton feeding insect native to mexico, has recently been spotted in southern farms across the south! First reported in Texas, this bug has spread and caused havok to cotton farmers. This issue is especially prevelent in Alabama, where entire farming communities across the state are reporting their cotton completly gone because of the bug.\n\nWith this presents us two options, we could simply advise the Alabaman government to do nothing. This would definitely cause some economic issues in the state, but the bug will have to go away eventually, when winter comes. We could also advice Alabaman farmers begin diversifying crop production. This will be expensive, but ensure we don't have to worry about further issues down the road with this bug. What should we do?"
ww1_USA.2.a: "Let's attempt to diversify crop production."
ww1_USA.2.b: "Unfortunate, but theres not much we can do other then waiting it out."
ww1_USA.4.t: "Charles Evans Hughes confirmed as Supreme Court justice"
ww1_USA.4.d: "Today, without debate, the United States congress confirmed former New York governor Hughes as an Associate Justice on the supreme court. Hughes, who had seen through many reforms as governor of New York, has earned himself popularity amongst progressives from all sides. With this, the court is expected to shift towards the progressive side of things. While roosevelt and the progressives are happy about this appointment, it ultimately won't fix everything."
ww1_USA.4.a: "Hopefully this will please Roosevelt."
ww1_USA.5.t:  "Armed mob drives out Japanese workers in Washington state!"
ww1_USA.5.d: "In a distressing display of racial hostility, Washington state became the stage for a troubling confrontation as armed mobs forcefully drove out 30 Japanese lumberjacks from their homes, attempting to force them to be moved to Texas. Although anti-japanese sentiment is high in America, there is still some calls from more progressive forces in the country to at least do something."
ww1_USA.5.a: "If we won't defend their freedom, who else will?"
ww1_USA.5.b: "Surely there are more pressing issues facing the country right now."
ww1_USA.6.t: "4th of July celebrations!"
ww1_USA.6.d: "It's that time of year again, as Americans from sea to shining sea prepare to celebrate our victory against the British in the Revolutionary War! Already, fireworks are painting the skies as parades across the country begin."
ww1_USA.71.t: "Dominican Government Overthrown!"
ww1_USA.71.d: "The Dominican government, increasingly facing more and more anti-American protests, has collapsed today as the army declared a temporary junta. Build on the ideas of nationalism and fighting foreign influence, American companies have already either pulled out or faced severe restrictions"
ww1_USA.73.t: "Cuban Government Overthrown!"
ww1_USA.73.d: "The Cuban government, increasingly facing more and more anti-American protests, has collapsed today as the army declared a temporary junta. Build on the ideas of nationalism and fighting foreign influence, American companies have already either pulled out or faced severe restrictions"
ww1_USA.6.a: "Happy 4th!"
ww1_USA.74.t: "New York Bans Drunk Driving"
ww1_USA.74.d: "Faced with increasing amounts of car accidents, and a clear link to being drunk and reduced ability to drive safely, New York has become the first state nation wide to offically criminalize driving while intoxicated. This move has been met with widespread support amongst prohibitionists, seen as very legitimizing to their movement, while some more "libertarian" (and probably alcoholic) New Yorkers have began protesting this "overstepping of the government""
ww1_USA.74.a: "Surely we Can Agree Driving while Drunk Isn't Safe, Right?"
ww1_USA.72.t: "Honduras Government Overthrown!"
ww1_USA.72.d: "The Honduran government, increasingly facing more and more anti-American protests, has collapsed today as the army declared a temporary junta. Build on the ideas of nationalism and fighting foreign influence, American companies have already either pulled out or faced severe restrictions"
ww1_USA.7.t: "The Americans offer us a trade agreement."
ww1_USA.7.d: "The United States of America has sent our government a letter proposing a joint reduction of tarrifs on eachother. This would make our products cheaper, but some on the right claim this will threaten Canadian independence or hurt local economies."
ww1_USA.7.a: "Ignore their complaints and tell the Americans we will hold it to a vote."
ww1_USA.8.t: "Canadian Government agrees vote on joint tarrif reductions!"
ww1_USA.8.d: "We have gotten word from our friends up north that the liberal government has agreed on our proposed trade agreement, it will now go to a vote in the canadian parliment and hopefully be passed soon!"
ww1_USA.8.a: "May both of our nations prosper!"
ww1_USA.9.t: "Conservatives oppose the US-Canadian trade agreement!"
ww1_USA.9.d: "Sadly, the proposed Canadian American trade agreement has died in parliment, due to conservative opposition. Conservatives claim the treaty is a threat to Canadian indepdendence and favors America too much. We could try to push the agreement through after the 1911 elections, gambling on the fact that we would win, or we could try to re-write the treaty to gain conservative support."
ww1_USA.9.a: "A minor setback, but we will get it through in the next elections."
ww1_USA.9.b: "We need to request better terms."
democratic_house.tt: "The §1Democratic Party§! speaker of the house will rally §1Democrats§! against us, we will now require us to have <30 Political Power to pass certain National Focuses, and focus's will cost an additional 30 political power. The focus "§YSecond Annual Message§!" will allow us to bypass this requirement for 1 focus"
sam.tt: "If the §1Democrats§! control the house, this focus will also allow us to take 1 major legislation focus with no political power requirements"
democrat_house_punish.tt: "Because the §1Democrats§! control the house, this focus requires us to have above 30 political power to introduce it, and costs 30 political power to pass it."
democrat_house_punish_sam.tt: "Because the §1Democrats§! control the house, this focus would usually require us to have above 30 political power to introduce it, and costs 30 political power to pass it, but because we took the §!Second Annual Message§! focus, congress is more supportive then usual and we can pass 1 law without any requirements"
ww1_USA.10.t: "The US-Canadian trade agreement stalled!"
ww1_USA.10.d: "The Canadian Prime minister has sent our government a message stating that unfortunately, conservatives have killed the US-Canadian tarrif reduction bill in parliment. The liberals plan to re-introduce the bill in 1911 after their elections, banking on a larger majority."
ww1_USA.10.a: "Well shit."
ww1_USA.11.t: "Canada requests better terms"
ww1_USA.11.d: "We've recieved word from the Canadian government that protectionists and conservatives in Canadadian Parliment are threatening to kill the bill if it's not re-written to favor Canada more. As such, they've requested we make a few concessions on agriculture and job protection. The new bill would definitely favor Canada more then us, but it could still help the economy some none the less. What should our reply be?"
ww1_USA.11.a: "Tell them we're out."
ww1_USA.11.b: "Fair enough."
ww1_USA.12.t: "America withdraws from negotiations"
ww1_USA.12.d: "The Americans have let us know that they do not feel the new proposed agreement is fair, and thus have pulled out of discussions all together."
ww1_USA.12.a: "Damn conservatives."
ww1_USA.13.t: "America accepts our deal"
ww1_USA.13.d: "The Americans have accepted our proposal of a more favorable trade deal, giving us concessions in the area of agriculture and adding provisions to secure Canadian jobs, as such the treaty can proceed without much hassle from conservatives."
ww1_USA.14.t: "The US-Canadian trade deal takes effect!"
ww1_USA.14.d: "The Canadian government has finally ratified the modified trade deal between our two countries."
ww1_USA.14.a: "At least it's over"
ww1_USA.15.t: "Canadian-American trade deal negotiations fail"
ww1_USA.15.d: "The conservatives have won the Canadian elections, and have let us know that they do not feel the new proposed trade agreement is fair, and thus have pulled out of discussions all together."
ww1_USA.15.a: "Stone-headed fools."
ww1_USA.17.t: "The US-Canadian trade deal takes effect!"
ww1_USA.17.d: "The Canadian government has finally ratified the trade deal between our two countries."
ww1_USA.17.a: "This will benefit both countries!"
ww1_USA.18.t: "A note from the America dev"
ww1_USA.18.d: "Hey! Thank you so much for giving America a try, I hope you enjoy it as much as I have enjoyed making it. America has a huge amount of content and different paths in it. As such, if you want, there is a guide to electing all the different presidents, and also a guide for how to get break away states (which also have their own content!). If you don't want any spoilers however, you can choose not to see the guide. \n Also, if you have any questions/suggestions, feel free to dm me on discord; leaf_______"
ww1_USA.18.a: "Show me the path guides!"
ww1_USA.18.b: "No spoilers please!"
ww1_USA.19.t: "Guide to every president and breakaway state"
ww1_USA.19.d: "The electable presidents avaible (there are some non elected ones too) are the following, starting off in 1912; Taft (second term), Teddy Roosevelt, Woodrow Wilson, William Jennings Bryan, and Champ Clark. \n To stop Roosevelt from running as taft, you must have Progressive Republicans loyalty above 75 in the "Taft's Republican Party" decision UI, which then gives him a chance at winning the 1912 election. The easiest way to get Roosevelt elected is to alienate conservative Republicans as much as possible as Taft (while making sure not to get progressive support above 75). This will cause conservatives to defect to the Democratic party, leading to Clark being nominated by the democrats for president, who Roosevelt will easily beat. Electing Wilson is quite simple, chose to play as the democrats in the "1912 campaign season begins" event then simply select Wilson to win the nomination and election. Clark is also the same, simply select the Democrats then select him to win. To gain Bryan, pick the option to have the Democratic convention be deadlocked, Bryan will be nominated as a compromise canidate. \nThe following Presidents are aviable for 1916; Wilson (second term only), Robert La Follette (only aviable if Teddy won 1912), William Jennings Bryan (second term or if the U.S is in ww1 only), Champ Clark (second term only), Thomas R. Marshall (against La Follette only), and Eugene V. Debs (electable under Clark only) \n how to get the 1916 presidents; for Wilson, La Follette, Bryan (second term only), and Marshall, simply chose to win the election in the event. Non second term Bryan will win if you have more then 500k casualties while Debs requires you to have over 30% socialist support, "mass exploitation of workers" or worse as the current workers rights national spirit level, "a perfectly broken system" national spirit, and "empowered monopolies" national spirit \nCivil War; the debs presidency can end in 3 ways; good debs ending, impeachment, and being couped. You can be impeached by rushing down to "The Great Gambit" focus as fast as possible without doing any focus's involving increasing support in congress, while also passing civil rights legislation. You need to make sure relations with congress are as terrible as possible and then when the "Trust Elimination Act" (proposed by "The Great Gambit" focus ) fails chose to try and push it through executive action. You'll then be impeached Leading to your running mate Stedman will take over and will attempt to form a Marxist state. He will get couped no matter what you do and you can chose to have it be successful or fail based on who you want to play as (there will be a civil war either way). In the civil war through an event chain the following nations with content will also pop up; dixie, black belt rebels, and california. The us coup government will also have a tree allowing it to join the central powers and more!"" 
ww1_USA.19.a: "Interesting."
ww1_USA.3.t: "Crop dversity efforts boost southern industry"
ww1_USA.3.d: "Our efforts to diversify crop production down south has lead to a massive boost to the economy for the south! Moving away from cotton and towards more profitable crops has turned out to be a great idea."
ww1_USA.3.a: "Were the boll weevils a blessing in disguise?"
ww1_USA.20.t: "FDA wins suit against lexington mill company"
ww1_USA.20.d: "Today, the western district court ruled that the lexington mill companies process for bleached flour breaks FDA regulations. The flour was treated by the "alsop process" by which nitrogen peroxide gas, is mixed with atmospheric air, then mixed into the flour. The lawsuit alleges that the practice makes the flour appear higher grade then it actually is, removes most nutrients, and could make the flour dangerous to consume."
ww1_USA.20.a: "The FDA continues to make America a healthier place!"
ww1_USA.21.t: "Richard Ballinger resigns as Secretary of the Interior"
ww1_USA.21.d: "Stating his wish to "spend more time with his family", Richard Ballinger has resigned as Secretary of the Interior. The real reason however, is most likely his numerous scandals in office. As such, we must chose who we want to nominate to replace him"
ww1_USA.21.a: "Let's go with Walter Fisher."
ww1_USA.21.b: "Offer the job back to James Garfield."
ww1_USA.22.t: "Companies plan to destroy the "Devils Postpile" in California"
ww1_USA.22.d: "the "Devils Postpile" basalt collumns are a popular local tourist attraction in eastern California. While admired by many, there are also rumors of companies preparing to destroy the natural beauty, planning to build a dam instead. We could take a laissez faire approach to this, or we could create a national monument to protect it from being destroyed."
ww1_USA.22.a: "And thus, the Devils Postpile National Monument was born!"
ww1_USA.22.b: "Not our problem."
 ww1_USA.23.t: "Triangle Shirtwaist Factory Fire"
 ww1_USA.23.d: "Terrible tragedy took place in New York. The largest civilian factory fire in history of the United States occurred at Triangle Shirtwaist Factory. Despite the fact that firefighters quickly arrived at the scene of disaster, they were unable to contain fire, it was too large.\n\nFire took place in clothing workshop, where most of the workers were women and children. About 146 people died in fire. Against the backdrop of this tragedy, socialist trade unions have become more active, demanding to reduce the working week and pass laws on safety at work. However, the government is in no hurry to comply with these requirements."
 ww1_USA.23.a: "The tragedy shouldn't be repeated a second time."
 ww1_USA.23.b: "What a horrible accident!"
 ww1_USA.25.t: "Taft's second annual adress to congress"
 ww1_USA.25.d: "It's time for Taft to once again adress congress on his agenda, and the most important issues facing Americans. There were 2 different speeches prepared for him, one about the importance of progressive reforms, and one about the importance of a strong military. We don't have time to give booth speeches, and thus must chose one of them."
 ww1_USA.25.a: "Our military must be strengthened."
 ww1_USA.25.b: "We must continue progressive reforms."
 ww1_USA.27.t: "Wool tarrif reduction bill reaches Taft's desk"
 ww1_USA.27.d: "A bill that would reduce tarrifs on wool has passed congress and reached Taft's desk. While popular amongst progressives, this bill is unpopular amongst protectionists, and Taft personally. We could let it pass, or we could chose to veto it. "
 ww1_USA.27.a: "Veto it."
 ww1_USA.27.b: "Sign it."
  ww1_USA.26.t: "1910 Midterms"
  ww1_USA.26.d: "While not ideal, the congressional election results appear to be less bad then expected. Republicans have indeed lost ground, but the situation seems recoverable"
   ww1_USA.26.a: "Not bad."
   ww1_USA.1.t: "1910 Midterms"
  ww1_USA.1.d: "Thecongressional election results are in, and they are just as bad as expected. Republicans have lost 6 senate seats and several house seats! Legislation will certainly be harder to pass now."
   ww1_USA.1.a: "Don't panic!"
ww1_USA.28.t: "National Progressive Confrence"
ww1_USA.28.d: "The "National Progressive League" has organized a confrence in Washington D.C where they have announced their "dissaproval with Taft." Consisting of 15 Senators and 13 House members, rumor has it they have also elected to support former president Roosevelt in a potential primary bid."
ww1_USA.28.a: "It seems Taft is doomed, then."
ww1_USA.29.t: "Progressives elect to support taft!"
ww1_USA.29.d: "The "National Progressive League" has organized a confrence in Washington D.C where they have announced their decision to "support president Taft's re election". Consisting of 15 Senators and 13 House members, their widespread influence is likely to boost Taft's chance at re election significantly."
ww1_USA.30.t: "Super-Fire Errupts Out West!"
ww1_USA.30.d: "Orginally small fires in Oregon Washington Montana and Idaho have met up, and combined into 1. This "Super-Fire" is raving havok across these 4 states destroying local infrastructure and killing 100's! While we could call congress in session to pass an emergancy aid bill out west, forecasts say huge rainpour is expected to hit the fire in just a few days. Should we call congress, or hope the rain takes care of it?"
 ww1_USA.30.a: "The rain and our brave firefighthers can manage it."
  ww1_USA.30.b: "Get congress together now!"
  ww1_USA.31.t: "Socialist Extremist Bombs Los Angeles Times Building"
ww1_USA.31.d: "Last night, the Los Angeles Times headquarters were set ablaze by dynamite. With socialist extremists taking the blame, Americans across the country are outraged. While police are looking for the suspect, Taft must weigh his options on if he wants to esculate the situation. With socialist organizations already crippling local economies in the past from devestating strikes, some more conservative figures have called for Taft to open an investigation into "socialist extremists everywhere."\n\nOf course, we could, and likely should, ignore these extremists. The police are doing thier jobs fine, and its likely we will capture the people who committed this terrorist attack."
ww1_USA.31.a: "We will find this bastard and bring him to justice!"
ww1_USA.31.b: "Lets Kill 2 Birds With One Stone"
ww1_USA.32.t: "Montana's Glacier National Park Opens!"
ww1_USA.32.d: "The Montanan glacier national park has offically opened today. Containing a breath-taking view of the Rocky Mountains, as well as thousands of plant species, this park is expected to bring tens of thousands of tourists from all around the world."
ww1_USA.32.a: "O beautiful for spacious skies..."
ww1_USA.33.t: ""The Masses" Newspaper Begins Publication"
ww1_USA.33.d: ""The masses", a socialist newspaper calling for union activism, has recently began distributing papers across the nation. While relatively unknown, it has succeeded in swaying some union men."
ww1_USA.33.a: "Americans will never be swayed by radicals!"
ww1_USA.33.b: "Denounce them as extremists."
ww1_USA.34.t: "Great Fire of 1911"
ww1_USA.34.d: "A small fire in a barn has gone totally out of control. The entire town of Bangor, Maine has burnt down. 100's of residential and commercial buildings have been lost, hurting Maines economy a lot."
ww1_USA.35.t: "William Schuste Accepts Control of Persian finances"
ww1_USA.35.d: "William Schuste, an experienced public service, has recently been invited to help Persia sort its finciances. William has accepted their offer, and is boarding his ship to Persia now."
ww1_USA.35.a: "Let's hope he can help them out, and strengthen US ties with Persia."
ww1_USA.36.t: "William Schuste Forced to Leave Persia"
ww1_USA.36.d: "Against the will of Persia's parliment, the Shah of Persia has forced Willian Schuste, an economist and public servant, to leave Persia or face consequences. This is thought to be because of immense Russian and British pressure, as his reforms were increasing Persia's control of their own economy."
 ww1_USA.38.t: "Bread and Roses Strike"
  ww1_USA.38.d: "A majority immigrant town in Lawrence, Massachusetts is making national news as the workers there have gone on a long and bitter strike. Wanting more pay, the strike began and quickly gained the attention of the Industrial Workers of the World organization, who traveled there in support. The strikers sent their hungry kids across New England, gaining much of the publics sympathty."
ww1_USA.38.a: "Let's hope the figure it out..."
ww1_USA.36.a: "Imperialist bastards.."
ww1_USA.34.a: "We will give our regrets to the victims."
ww1_USA.37.t: "The Strangling of Persia"
ww1_USA.37.d: "The American former treasurer-general of Persia, William Schuste, has just released a book called "The Strangling of Persia." This book has revealed the shocking nature of British-Russian Imperalism and just how much control they have over Persia. He details his attempts to reform Persias economy and his struggles to fight for Persian domestic indepdence. The book has angered many in the United States, outraged at the exploitation of Persia"
ww1_USA.37.a: "The Persian people deserve freedom..."
 ww1_USA.39.t: "Hague Court Settles US-British Fishing Disbute"
  ww1_USA.39.d: "The long standing disbute between the United States and the British Empire over fishing boundries near Newfoundland have finally been settled in court. The agreement would give the United States fishing rights boundry larger then the usual boundry according to international law, but mantain british rights on some of the surrounding territories of Newfoundland"
   ww1_USA.39.a: "This deal works for us!"
   ww1_USA.41.t: "White Settlers Finish Exploration of Alaska"
   ww1_USA.41.d: "The vast and unexplored state of Alaska is becoming more and more mapped out as White settlers have crossed the Ditarod River looking for more gold. The river was seen as suprisingly habitable for Alaskan standards, and already the population has reached 2 thousand."
   ww1_USA.41.a: "Could this new city have potential?"
   ww1_USA.40.t: "Champ Clark Advocates for Annexation of Canada"
    ww1_USA.40.d: "With the passing of the Canadian-American trade deal, Champ Clark today took to the senate to announce his support for the deal, stating that he supports this as the "first step" towards canadian intergration. He proceeded to call for Canada to begin intergation with America and spoke about America's destiny to annex canada. Even worse, he was met with large applauses on the senate stage! Already Canadian conservatives are calling for Canada to not sign the deal and spreading anti American propaganda."
  ww1_USA.40.a: "That fucking idiot Clark!"
  ww1_USA.42.t: "Railway Companies Plan to Hike Ticket Prices!"
  ww1_USA.42.d: "A collection of railway companies have all gathered together and agreed to increase ticket prices to increase their profits."
  ww1_USA.42.a: "Bastards."
riding_razor.tt: "This section of the tree is important for shifting the Republican party towards our prefered direction, increasing the £pol_power §HPolitical Power§! we gain by boosting or reducing the influence sides who support or oppose us."
  ww1_USA.42.b: "Let's meet with these companies and try to pressure them not to."
  ww1_USA.43.t: "Railway Companies Agree to Abandon Price Hikes"
  ww1_USA.43.d: "After a tense meeting with Taft, multiple railway companies that were originally going to hike ticket prices have agreed to abandon these efforts."
  ww1_USA.43.a: "The art of diplomacy works again!"
  ww1_USA.44.t: "Taft's Son Hits a Man while Driving!"
  ww1_USA.44.d: "While on a drive in Massachusetts, Robert Taft, son of President Taft, accidently hit a Michael Thisthwolla, who he didn't see crossing at the time. The man has ultimately ended up without serious injuries, althought still had to go to the hospital."
  ww1_USA.44.a: "We'll pay his hospital bills, a few thousand dollars, and a trip to Italy to make up for it!"
   ww1_USA.45.t: "Cities across the United States Prohibit Viewing of the Johnson-Jeffries Boxing Fight"
  ww1_USA.45.d: "The long awaited "fight of the century" between African-American boxer Jack Johnson and white boxer James J. Jeffries has ended exploded . Jack Johnson ended up winning the match, causing protests of the event being rigged by many white Americans. While found to be baseless, this has not stopped many cities across the US from banning the viewing of the match."
  ww1_USA.45.a: "They seem unable to accept their prefered canidate lost..."
  ww1_USA.45.b: "The Supreme Court will make light work of this!"
  ww1_USA.46.t: "Race Riots Break out across the nation"
  ww1_USA.46.d: "In response to the prohibation of the Johnson-Jeffries boxing match, black Americans across the nation have protested and been met by counter protests. These counter protesters have inevitably ended in violence leading to many dead already!"
  ww1_USA.46.a: "Send out the police!"
  ww1_USA.46.b: "They're just exercising their first ammendment rights..."
  ww1_USA.47.t: "Bloody July"
  ww1_USA.47.d: "Mass race riots and destruction across America, now dubbed as "blood July", caused by a lack of police action, have lead to mass lynching across the cities. The death toll was estimated at 419 until police across the nation finally responded, in a harsh crackdown that has lead to many unlawful arrests of black men"
  ww1_USA.47.a: "Oh the horror, the horror!"
  ww1_USA.48.t: "The Gang of 5"
  ww1_USA.48.d: "Today, 5 very experienced officals have began the task of fufilling the goals of the EEC. Consisting of New York Bureau of Municipal Research, Frederick Cleveland, already famous for creating one of the first municipal budgets for New York City. William Willoughby, a well known author of several books dealing with budget and public administrative reforms. Judge Walter Warwick, Former Missouri Supreme Court Justice Frank Goodnow. And a New York circut judge, Harvey Chase."
  ww1_USA.48.a: "They Seem Very Knowledgable"
  ww1_USA.48.b: "These are Some Really Talented People, Let's Make Sure Washington Knows This."
  ww1_USA.50.t: "Economic Efficiency Commission Created"
  ww1_USA.50.d: "Today, Taft declared a presidental commission to look into administrative and economic reforms. Dubbed the "Economic Efficiency Commission", a group of 5 experienced public servants and business owners have been appointed to look into this issue. While opposed by many in congress due to its suggestions to transfer more power to the president, many economists agree with these reformists."
  ww1_USA.50.a: "We welcome them and look forwards towards their Advice!"
  ww1_USA.75.t: "Corporate Influence is Starting to be Worrying!"
  ww1_USA.75.d: "Lobbyists and corporate interests are starting to have quite the impact on Taft's administration. Due to their widespread influence, it's getting harder and harder to pass legislation to oppose them. We must keep an eye!"
  ww1_USA.75.a: "...noted"
ww1_USA.86.t: "The Two Party System"

ww1_USA.86.d: "In America, while theres no real restriction on the number of parties aloud to run, there is only two parties that actually have power in congress. The Democrats, and the Republicans.\n\nConcentrated in New England and the Rust Belt, the Republicans are facing a key point in history that could decide the future of their party. With the end of Roosevlts presidency in 1908, Taft, Roosevelts former secretary of war, was personally chosen to be Roosevelts sucessor. However, Taft and Roosevelt are increasingly becoming divided. With different views on "trusts", gaint American companies, different views on Tarrifs, and administrative scandals, Roosevelt and Taft are not at all the unified duo they once were. With the Conservative amd Progressive wings of the Republicans gearing up for a battle in 1912, the future of the Republican party could be at stake. On the other side, a dark horse attempts to make an unlikely bid for President. Joseph Cannon, the speaker and practical dictator of the house, seeks to take advantage of Taft and Roosevelts fighting, bidding on Taft not running and him taking over the Conservative faction of the party. While very unlikely, if Cannon somehow did get the nomination it could spell the end of the American experiment.\n\nOn the other side of the isle are the Democrats. Concentrated in Dixie and the Great Plains, Democrats are generally more united then their Republican counterparts. United on the idea of lower tarrifs, the Democrats main players in 1912 are appearing to be  Progressive New Jersey Democrat Woodrow Wilson, and minority House Speaker Champ Clark, on the more conservative spectrum.\n\n1912 is looking to be a complete tossup, with great opportunity for both parties and even their inner factions, it really could be anyones game. There can only be one party elected however, and you must decide which party you'd like to try and see in power."
ww1_USA.86.a: "The Republicans!"
ww1_USA.86.b: "The Democrats!"
dem_ex: "This event is visible because you are playing as the §1Democrats§!"
rep_ex: "This event is visible because you are playing as the §RRepublicans§!"
rep.tt: "We will occasionally recieve exclusive events relating to §RRepublican§! party affairs. With these, we can nudge the §RRepublican§! party in our vision, and play as our prefered canidate in the primaries and general election"
dem.tt: "We will occasionally recieve exclusive events relating to §1Democratic§! party affairs. With these, we can nudge the §1Democrat§! party in our vision, and play as our prefered canidate in the primaries and general election"
ww1_USA.87.t: "North Dakota's Democratic Primary vote nears"
ww1_USA.87.d: "As the first state that votes, North Dakota has large influence on the general view of the Democratic primary, with a victory in the state able to propel any canidate that was once seen as a joke. While having a popular vote, party elites ultimately have the final say in the state, and can nominate whoever they want. Split between Wilson and Clark, delegators there will have to quickly make up their minds."
ww1_USA.87.a: "Wilson is the most electable!"
ww1_USA.87.b: "Clark and his ties will carry the state for him"
 ww1_USA.90.t: "Illinois and Wisconsin Prepare to Vote Directly in the Democratic Primary"
 ww1_USA.90.d: "Having passed reforms that force state delegates to vote for the canidate that receives the most support in a popular vote election, Wisconsin and Illinois are due to vote in just a few days. With Clark having widespread influence amongst Democratic party elites, Chigaco is expected to be completly locked down for him, denying Wilson its large amount of delegate votes. Wisconsin however is more competative, with a more truely free electoral process that could go either way. While polling shows Clark with a minor lead, Wilson has began a recent campaign blitz across the state in an attempt to change the momentum"
ww1_USA.91.a: "The Intensity of the Primary is Definitely Increasing"
 ww1_USA.90.a: "While Clark Sweeps Illinois, Wilson Makes a Suprise win in Wisconsin."
 ww1_USA.90.b: "Both States Fold to Clark, Like Predicted"
 ww1_USA.89.t: "Wilson and Clark Debate "Trusts" Reform"
ww1_USA.91.t: "Party Elites Back Clark"
ww1_USA.91.d: "With Clarks position as Speaker of the House, his widespread connections to the establishment has greatly contrasted Wilsons, a relatively unknown man until this year. With the threat of Wilson seriously winning being taken more and more seriously, Clark has began meeting with party leaders securing their endorsements and votes in states where party leaders decide who the states delegates go to."
 ww1_USA.89.d: "The Democratic primary continues to intensify as Wilson and Clark have bashed heads on the issue of monopolies and trust busting. While Wilson and his "new freedom" idea of progressive reform has called for the mass breaking up of all trusts, Clark has taken a more moderate stance. While both want to continue Taft's law suits against trusts, Wilson has also called for a government agency to manage the issue of trusts more effectively. This has been critized by Clark, who has claimed the agency would be inefficent and would suffer from corruption."
 ww1_USA.89.a: "Wilsons Idea of Mass Breakups of Trusts Wins Support from Small Business"
ww1_USA.93.t: "Clark Wins Maryland Primary Vote"
ww1_USA.93.d: "More good news for the Clark campaign, as Maryland Democrats have voted to support Clark for the Democratic party nomination in July. With yet another state falling in line, 2 minor canidates have offically suspended their campaigns, seeing the nomination as locked for Clark."
backfire.tt: "§RThis could backfire big time§!"
ww1_USA.94.t: "Clark Fails To Gain Two-Thirds Vote for Party Nomination"
ww1_USA.94.d: "Despite holding a commanding lead, speaker Clark has not achieved the required 2/3rds delegate votes required to become the Democratic nominee. With this, Clark and Wilson, the second place canidate, will have to rush to make new alliances and promises across the Democratic party in order to secure enough votes for the next party nomination attemp, in just a few days.\n\nOn Clarks side of things, the Tammy Hall organization in New York, famous for their corruption, has none the less began considering supporting Clark, which would effectively lock up the state for Clark. While shady, New York has the most delegates out of any state, and locking up this state could force Wilson to give it up right there and then. Seeing this coming however, Clark could try to instead back away from Tammy Hall by reahcing out to moderates in the Democratic primary."
ww1_USA.100.t: "Clark Elected Democratic Party Canidate"
ww1_USA.100.d: "Today, Wilson gave his offical concession speech in the Democratic Convention, and endorsed Champ Clark. This follows a series of political victories and key endorsements from on the fence figures lining up behind Clark last minute. Seeing victory as impossible, Wilson dropped out and encouraged his delegates to vote for Clark for the sake of party unity. Strong with conservatives and moderates, Clark is expected to struggle with progressive voters. However, William Bryans, and Woodrow Wilson, both popular with progressives, can help Clark with this key group. This will require party unity however, and Clark will need to give concessions to the progressives in his party if he wishes to win. Internal Democratic politics aside, Clark is expected to face president Taft, and progressive Teddy Roosevelt in the general election."
ww1_USA.100.a: "Now Let's Make Sure He Wins this November"
ww1_USA.94.a: "They Endorse Clark"
ww1_USA.94.b: "Clark Offers Thomas Marshall VP For an Endorsement, Angering Tammy Hall"
ww1_USA.93.a: "It Really Seems Like Clarks Got This Thing Locked Up"
 ww1_USA.89.b: "Clarks Moderatism Wins him Support from Big Business and New England"
ww1_USA.101.t: "Presidential Canidates Debate Tariffs Issue"
ww1_USA.101.d: "One of the most defining issues of the day is the debate on low or high tarrifs. Proponents of high tarrifs, particularly in the Midwest, claim high protective tariffs are needed to support American industry and businesses. On the other hand, those in the South argue that low tariffs are benefical to the average American consumer, which reduce the price of goods for the average consumer.\n\nWilson and Roosevelt have campaigned in favor for tariff reform. Believing that high tariffs disproportionately benefited wealthy industrialists and monopolies at the expense of ordinary consumers, he and the democrats call for a reduced tariff to lower prices for consumers and foster natural competition between all countries products in the market place. Taft, however, has advocated for the continuation of high protective tariffs to support American industry and businesses. He argues that tariffs are necessary to maintain a major revenue source for the government and protect American jobs from foreign competition."
ww1_USA.101.a: "American Consumers Demand Lower Tariffs"
ww1_USA.101.b: "The Midwest Workers Rally Behind High Tariffs"
ww1_USA.103.t: "Canidates Debate Banking Reform"
ww1_USA.103.d: "With the panic of 1907 still in the minds of Americans, it's become clear that the banking sector needs reform. While Taft has worked towards a "postal banking" reform, allowing individuals to deposit their savings in post offices, providing a safe and accessible alternative to traditional banks, some claim he hasn't gone far enough.\n\nSome progressives instead call for a single, centralized national bank with control over all monetary policy, banking regulation, and the sole issuance of currency. While it would bring stability to the banking system for sure, some argue it could lead to excessive concentration of financial power.\n\nDue to this concern, moderates across the spectrum have been interested in a "federal reserve" that would have moderate regulationary power over banks of America, acting as a last resort in a major banking panic."
 ww1_USA.103.a: "A National Banking System Would Prevent Any Future Bank Panics"
 ww1_USA.103.b: "A Federal Reserve Would be a More Practical way to Regulate Banking"
 ww1_USA.103.c: "The Postal Banking System Just Needs Additional Funding"
ww1_USA.104.t: "Unions Prepare to Make Their Endorsements"
ww1_USA.105.t: "Canidates Debate Foreign Politics"
ww1_USA.105.d: "While not expected to be a major election issue this cycle, foreign politics are still getting attention from all 3 canidates. With increasing tensions world wide, the next president could very well have to make America's choice in a world wide war.\n\nSkepitcal of European politics in general, Wilson and Taft have both stated they would support strict American isolation from any European war, stating America has nothing to gain from involving its self in any potential European conflict.\n\nHolding a somewhat different opinion however, Roosevelt has argued against commiting America to any foreign policy, commenting that America should hold a slightly more active place in the world, as a force for good."
ww1_USA.105.a: "Why Should America Care About Europe?"
ww1_USA.105.b: "I Guess Roosevelt Has a Point"
ww1_USA.106.t: "Canidates Begin Visiting Swing States"
ww1_USA.106.d: "With election day nearing, Roosevelt Taft and Wilson have all began intensifying visits to so called "swing states", states that are around equally divided between support for the 3 canidates. With Utah, Vermont, Massachusetts, and Maine particularly close. With the election being bitterly contested, these states voters will have to make up their minds on who to support"
ww1_USA.106.a: "Roosevelt Gains the Common Mans Support"
ww1_USA.106.b: "Wilson Has the Support of the Silent Majority"
ww1_USA.106.c: "Taft Has an Unexpected Surge"
ww1_USA.107.t: "Canidates Debate Income Tax"
ww1_USA.107.d: "The idea of an income tax has became a common dinner table conversation across American, and now, the 3 canidates for President have finally announced their stances.\n\nfuck this shit ill write this shit later someone remind me to later"
 ww1_USA.108.t: "Wilson won primary"
 ww1_USA.108.d: "will write this shit later, wait till march for inaguration"
 ww1_USA.108.a: "yuge!!"
ww1_USA.104.d: "Unions have always been a central force in American politics, but with a 3 man race their support matters now more then ever. With their widespread influence in the midwest, unions could very well decide who wins the entire region - and the general election by proxy. While many would expect unions to line up behind the most progressive canidate, Roosevelt, unions have ended up divided between all 3 canidates for a variety of reasons.\n\nOf course, Roosevelt would be the obvious choice for unions. As the only canidate who supports a federal minimum wage, and a strong supporter of unions throughout his political history, Roosevelt can easily make the case that he is the most progressive and trust worthy canidate for unions.\n\nHowever, Wilson has been making his own breakthroughs in smaller union circles. Pointing out his own moderatism, and Roosevelts past support for the American Steel trust while he was president, Wilson has been making the case that maybe Roosevelt is not as trust worthy as he seems? \n\nThere is also a big opening for Taft that Roosevelt and Wilson don't have; the issue of tariffs. A strong supporter of protectionist policies, Taft can definitely make the case that he is the only canidate who can be trusted to protect American business and unions from foreign competition."
ww1_USA.104.a: "Unions Support the Workers Canidate, It's not Rocket Science"
ww1_USA.104.b: "Roosevelt has Indeed had a Sketchy History With Some Trusts..."
ww1_USA.104.c: "Only Taft can be Trusted to Protect American Industry"
