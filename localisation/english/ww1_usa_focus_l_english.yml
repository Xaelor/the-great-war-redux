  USA_low_panama_tax_tt: "We will get §Y-5% Consumer Goods§! and many countries will use the canal!"
  USA_medium_panama_tax_tt: "We will gain §Y-10% Consumer Goods§! however, some countries may choose not to use the canal due to our higher toll rates!"
  USA_high_panama_tax_tt: "We will give us §Y-15% Consumer Goods§! but many countries will not use the canal due to the very high toll rates!"
ww1_USA.102.t: "Panama Canal Toll Rates"
ww1_USA.102.d: "Now that the Panama Canal has been built, there comes the question of tolls. We spent a lot of money on this project and definetly want to make money back, however if we increase our toll rates too high many countries may choose to avoid the canal"
ww1_USA.102.a: "Set low tolls on the Canal"
ww1_USA.102.b: "Put the tolls a bit higher"
ww1_USA.102.c: "Increase the tolls as high as we can!"
ww1_USA.84.t: "Army Falls Further Behind"
ww1_USA.84.d: "With a lack of funding and widespread neglect, the US army is falling behind now more then ever. Recruitments are failing, the army is failing to get updated equipment, and doctrines are falling behind."
ww1_USA.84.a: "They will have to make do with what they have"
ww1_USA.85.t: "Tax Cuts Are Benefiting the Economy"
ww1_USA.85.d: "Economists and government officals are reporting increased activity in the economy due to our tax cuts leaving them with more cash in their pockets. With increased spending by consumers, our GDP has been seeing a growth from the previous year."
ww1_USA.85.a: "Good for us!"
  USA_corporate_warning_1: "Some more progressive focus's and decisions will begin having §Rdebuffs§!. These will be reversed if we get §gcorporate§! influence §Gunder control§!"
  USA_corporate_warning_gone_1: "Progressive focus's and decisions will no longer be met with §Rdebuffs§!. They can re-appear if §gcorporate§! influence spirals out of control again"
  USA_corporate_warning_2: "Some more progressive focus's and decisions will be locked. These will be reversed if we get §gcorporate§! influence §Gunder control§!"
  ww1_USA.76.t: "Corporate Influence back Under Control"
  ww1_USA.76.d: "Our recent efforts to reduce lobbyists and corporate interests influence over us have seen success. We are already finding it easier to act much more independently from corporate pressure"
# wow 1913 strike
ww1_USA.110.t: "Bucks County Pennyslvania Railway Workers Are Refusing to Work!"
ww1_USA.110.d: "Railway workers across Longshore, Pennyslvania, have been refusing to work, protesting for better conditions. Already, the traitorous IWW is attempting to spread dismay and chaos, meeting with protesting railway workers and encouraging them and their comrades to continue the strike. While the Longshore economy is taking a large hit, the rest of the country is generally uneffected, and thus, the strike has so far remained unaddressed by Washington.\n\nUniquely, however, with the help of the IWW, this strike has been going on for more then 3 weeks, much longer then most small scale strikes. Due to this, some local politicians are warning this strike could esculate out of control if it is not dealt with soon."
ww1_USA.110.a: "It Will Die Down Soon, Right?"
without_adress.tt: "§RRight?§!"
without_adress2.tt: "§RWithout a compromise, a strike could cripple western pennsylvania's economy§!"

ww1_USA.111.t: "Buck County Strike Enters Second Month"
ww1_USA.111.d: "As the Buck County railway strike stretches into its eighth consecutive week, the once contained labor dispute has evolved into a local crisis, paralyzing the Longshore economy. With IWW continuing to supply protesting railway workers with food and money, railway workers have upped their demands to an 8 hour work week, which the local railway giant has refused to grant, seeing it as a slipperly slope for stations across the country.\n\nComplicating the situation, there are growing indications that port workers may soon join their railway counterparts in walkout action, potentially crippling one of the largest ports on the East Coast. With port workers debating over the prospect of joining in strike action, fears are mounting that such a move could trigger loses in the millions for the US economy, if the strike were to last even one month.\n\nDespite the tense situation, Washington has still neglected the situation, focusing on the transition to the 63rd Congress."
ww1_USA.111.a: "This Would Definitely Hurt the Economy, Let's Hope the Locals Figure it Out."
ww1_USA.112.t: "Port Workers Strike in Longshore!"
ww1_USA.112.d: "Today the port workers of Longshore, Pennyslvania, have offically joined local railway workers in the city, declaring they will not work until reform is passed. With this, an estimated 400 thousand dollars are being lost a day due all exports and imports from this major port being halted.\n\nWith this, Washington has finally announced their intentions to pass some sort of reform dealing with working conditions, atleast in the local area.\n\nDespite this, the IWW is still trying to expand the strike, saying the proposed compromises are not enough. While the mood amongst the railway and port workers there is generally one of tire, there are still some hard liners that politicians worry could radicalize. "
ww1_USA.112.a: "Will make this dynamic later"
ww1_USA.113.t: "America Threatens war for the Virgin Islands!"
ww1_USA.113.d: "You really playing Denmark? Well womp womp the islands are American now."
ww1_USA.113.a: "We have no choice but to give it..."
ww1_USA.114.t: "The Occupation of Panama"
ww1_USA.114.d: "To secure our interests in Panama, we have sent a force to occupy the country. There was little to no resistance from Panama and our forces quickly took Panama city and the rest of the country. Panama is now under American Control and we can make sure our interests are protected in the country."
ww1_USA.114.a: "Good Work Soldiers!"
ww1_USA.115.t: "The US Requests to Purchase Greenland"
ww1_USA.115.d: "The government of the United States has requested to purchase our territory of Greenland, offering a very high price. This will surely benefit our economy by a lot if we accept their offer."
ww1_USA.115.a: "It's worthless to us anyways, lets do business."
ww1_USA.115.b: "Absolutely Not!"
