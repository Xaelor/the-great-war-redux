USA_conservatives_political_power: "Conservative Republican Party Faction"
USA_reclamation_and_irrigation_act_desc: "We must assume the burden of costs for irrigation, drainage, and flood control projects. These will end up creating new jobs, reclaim arid lands, and protest tens of thousands from deadly floods."
