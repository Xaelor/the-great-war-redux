ww1_USA.97.t: "William Bryan Endorses Wilson"
ww1_USA.99.t: "Wilson Elected Democratic Nominee"
ww1_USA.99.d: "Securing the required 2/3rds support of all delegates, New Jersey Governor Woodrow Wilson has been chosen by the Democratic party to face off against the Republican and Progressive parties in November. Clark today offically endorsed Wilson for president, stating he is prepared to unify the party for \"what matters\" coming into November. Seen as a moderate reformer, Wilson has been recieved relatively well amongst all but the most hard line conservatives and progressives in the party, and he is expected to go into November with a Democratic party completly behind him. Looking outwards, the Republican parties split between Taft and Roosevelt is expected to do nothing but benefit Woodrow, who is expected to scoop up moderate Republicans unsastified with either canidate."
ww1_USA.99.a: "Congratulations, Wilson"
wilson_win.tt: "§4Wilson§! will face Taft and Roosevelt in November"
clark_win.tt: "§3Clark§! will face Taft and Roosevelt in November"
ww1_USA.97.d: "William Bryans, a 3 time party nominee and leader of the liberal faction, has offically broken his silence today with a harsh speech attacking Speaker Clark. Calling him \"candidate of the corrupt\", Bryan has urged party leaders to instead vote for Wilson. With this endorsement from the most popular Democrat in the party, it seems Clarks campaign is truly over."
ww1_USA.97.a: "Looks Like Wilsons Got This One"
ww1_USA.88.t: "Democratic Party Divided on the Issue of Banking Reform"
ww1_USA.88.d: "With the recent creation of the postal banking service by president Taft, the Democratic party has been forced to make its reponse. While more progressive Democrats are saying the reform does not go far enough, calling for a national bank or a federal system to regulate banks, there are some conservatives in the party who support the legislation in its current state. With the main 2 canidates, Wilson and Clark, having different views, both sides will have to do their best to sway the Democratic base."
ww1_USA.88.a: "Wilsons Call for Federal Oversight of Banks Sways the Crowd"
ww1_USA.88.b: "Clarks Moderatism on the Issue Earns him Respect from Voters"
play_clark.tt: "Clark will win the primary"
ww1_USA.77.t: "Corporate Influence Dominates Administration"
ww1_USA.77.d: "Lobbyists are directly stopping Taft from pursuing legislation they oppose! We need to get this under control fast"
ww1_USA.98.t: "Thomas Marshall Agrees to be Clark's VP"
ww1_USA.98.d: "Seeing the writing on the wall, Thomas Marshall, a minor canidate from indiana, has agreed to endorse Clark for nominee. With his relative popularity amongst moderates, his support is expected to open the way for the more progressive forces in the Democratic party to reluctenly support Clark."
ww1_USA.98.a: "And Thus, Clark Locks up Every Faction"

ww1_USA.77.a: "Well Shit"
