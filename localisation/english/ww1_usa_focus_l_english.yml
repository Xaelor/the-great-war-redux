USA_let_the_people_flourish: "Let the People Flourish"
USA_sedition_act: "Espionage Act"
 ww1_USA.152.t: "Report on Food Stockpiles"
 ww1_USA.152.d: "The Great War reaching America has meant that food will most likely become much scarcer instead of abundant. While we may have passed legislation to help build up food surpluses, it is doubtful that we will face no food issues at all. Either way, the President has ordered a review of just how much food we have to ensure we make the right decisions in terms of food rationing."
 ww1_USA.152.a: "Well, lets see!"
USA_domestic_front: "The Home Front"
 USA_the_committee_on_public_information: "Committee on Public Information"
USA_attract_people_east: "Attract People to War Industries in the East"
USA_4_minute_men: "4 Minute Men"
 ww1_USA.145.t: "American Protective League"
 ww1_USA.145.d: "Many Americans, inspired by the Sediion act, have banded together to form the American Protective League. These patriots plan to privately investigate suspected German sympathizers and counteract the activities of radicals, anarchists, anti-war activists, and socialist labor and political organizations. They've already seen tens of thousands join their ranks and are providing some much appreciated help to our effort in rooting out traitors in the country."
 ww1_USA.145.a: "They are true patriots"
rad.tt: "Every 180 days we will get the event '§YFood Surpluses Increase§!'. \nBuilding up food surpluses will certainly come with §Gbenefits§! once the United States joins The Great War."
USA_rural_price_controls: "Agricultural Price Supports"
USA_rural_price_controls_desc: "We must ensure a stable market for our farmers, and agricultural price supports is just the way to do this. Setting fair maximum and minimum prices will ensure a fair playing field in the agricultural market, while offering to buy up surplus agricultural production will ensure that farmers produce as much as they can."
USA_stroke_anti_german_sentiment: "Stroke Anti German Sentiment"
USA_stroke_anti_german_sentiment_desc: "An easy way to rally support for war at home and to discredit pacifists is to demonize the German population in the country. We will spread paranoia and fear about Germans in the United States, covertly spreading rumors that they could be spies and agents hired by Germany to pressure the United States into neutrality."
new_nationalism_first: "Add §YNew Nationalism§!, which grants\nPolitical Power Gain: §G+5%§!\nStability: §G+5.00%§!\nWe will §GUpgrade§! this §YNational Spirit§! throughout the tree."
wilsonomic_first: "Add §YWilsonomics§!, which grants\nStability: §G+5.00%§!\nWe will §GUpgrade§! this §YNational Spirit§! throughout the subbranch."
new_nationalism_railway: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y3.0%§!\nStability: §G+2.00%§!"
USA_restore_economic_confidence: "Restore Economic Confidence"
USA_restore_economic_confidence_desc: "The several recent panics from the Taft era have caused some investors to lose faith in the United States. As a new president, Wilson must ensure investors know that the instability from the Taft era is over, and a new era of prosperity is beginning."
new_nationalism_high_tax: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y-12.0%§!\nStability: §G-2.00%§!\nPolitical Power Gain: §R-5%§!"
new_nationalism_inher_tax: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y-15.0%§!"
USA_restrictions_on_drunk_driving: "Restrictions on Drunk Driving"
USA_restrictions_on_drunk_driving_desc: "American roads are dangerous due to drunk drivers causing mass car accidents. The science is clear: being drunk impeeds your ability to drive. Therefore, we shall endorse local state laws to ban this practice, to hopefully reduce the damages alcoholism causes to the country."

USA_dual_use_investments: "Dual Use Investments"
USA_dual_use_investments_desc: "As a covert way to prepare the nation for war, we should promote industrial expansion in industries that are useful for both current civilian and future military uses. Some good examples of this would be the medical industry and, in limited cases, the automobile industry."
new_nationalism_central: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y-8.0%§!\nSeveral National Focus effects will be §Gimproved§!"
progressive_republicans_midterm_1914: "§SProgressive Republicans§! will perform §ymoderately§! better in the next §YElections§!"
USA_strong_executive_leadership: "A Strong Hand"
USA_strong_executive_leadership_desc: "While the president has been a pretty weak position throughout history, it has increasingly became more important. Mirroring what Theodore Roosevelt did during his presidency, we will do whatever we can to both directly confront congress and expand the use of executive orders."
progressive_republicans_midterm_small_1914: "§SProgressive Republicans§! will perform §Yslightly§! better in the next §YElections§!"
 USA_centralization_of_washingtons_finances: "Strengthen Control Over Federal Funding Uses"
 USA_centralization_of_washingtons_finances_desc: "As it stands now, states have huge leeway in how they must use federal funds. Even though a bill may be to fund, say roads or education, state governments can usually make use of loopholes to do whatever they want with the money. We must put a close to this, and sneaking a provision into a insignificant bill to increase federal control over congress delegated funding would be a way to prevent this."
 USA_restrict_governor_control_of_funds: "Restrict Governor Control of Federal Funds"
 USA_restrict_governor_control_of_funds_desc: "As it stands now, states have huge leeway in how they must use federal funds. Even though a bill may be to fund, say roads or education, state governments can usually make use of loopholes to do whatever they want with the money. We must put a close to this, and sneaking a provision into a insignificant bill to increase federal control over congress delegated funding would be a way to prevent this."
conservative_midterm_1914: "§cConser§!§qvative§! canidates will perform §Yslighty§! better in the next §YElections§!"
USA_inheritance_tax: "Inheritance Tax"
USA_inheritance_tax_desc: "do later"
conservative_midterm_pretty_high_1914: "§cConser§!§qvative§! canidates will perform §Rsignificantly§! better in the next §YElections§!"
theywill.tt: "Be careful, §cConser§!§qvatives§! will organize and feed off of any ammunition we give them, in an attempt to take back the house and senate in 1914. Depending on whether or not we re-unified with the Republicans, they may even form a new party!\n If we don't handle this well, our administration may be §Rcrippled§!"
USA_national_minimum_wage: "National Minimum Wage"
USA_national_minimum_wage_desc: "A national minimum wage was one of Roosevelts core campaign promises in the 1912 election. Now that Roosevelt has won, it's time to propose this legislation to congress. By setting the minimum wage nation wide to 45 cents an hour, we should help prevent the exploitation of vulnerable workers who are usually paid slave wages."
USA_new_rail_regulations: "New Railway Regulations"
USA_new_rail_regulations_desc: "Railway workers still face some of the worst working conditions in the world. With many deaths and diseases coming from unsafe working conditions, its clear current protections for workers arn't enough. We must implament more regulations on railway corporations, and even consider breaking some of them up."
if_8_railway_pass.tt: "If the legislation passes:\nModify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y3.0%§!\nStability: §G+2.00%§!\nThe §YRisk of Strikes Spreading§! mission will end"
if_high_tax_pass.tt: "If the legislation passes:\nModify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y-12.0%§!\nStability: §R-5.00%§!\nPolitical Power Gain: §R-5%§!"
 USA_second_revenue_act: "Second Revenue Act"
USA_in_their_light: "In Their Light"
USA_in_their_light_desc: "We must continue the groundwork layed out by the great thinkers of William Bryan, the elder LaFollette, and even Theodore Roosevelt. Their brave ideas of progressivism and expansion of federal power should be the exact principals we try to follow."
USA_aid_new_road_construction: "Fund Construction of New Roads "
USA_aid_new_road_construction_desc: "While cars are rapidly becoming more and more available, many places in the US lack the infrastructure for their use. With a bill setting aside funds to develop new roads, we can help ensure America is ready for the future."
 USA_second_revenue_act_desc: "While recent tax raises are set to expire, the government is still in need of more revenue. Another bill raising taxes on higher income individuals will help provide much needed government revenue"
if_inher.tt: "When this focus is selected:\nActivate mission: §YInheritance Tax Law§!\nIf the legislation passes:\nModify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y-15.0%§!"
USA_fight_opiates: "Regulate Distribution of Narcotics"
USA_fight_opiates_desc: "Many Americans, especially in rural areas, struggle with addiction. These addictions are causing widespread overdose and increasing poverty across the nation. A law banning prescribing maintenance doses for narcotics unless intended to cure the patient's addiction would help with this."
USA_urban_investments: "Profit from Narcotic Tax"
USA_urban_investments_desc: "On the counter narcotics currently have no tax on them. As a widely used medical prescription, this is a huge missed opprotunity for revenue. Let us encourage the use of narcotics, but implement a tax on them."
if_minimum_wage_pass.tt: "If the legislation passes:\nModify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y+4.0%§!\nStability: §G+8.00%§!\nPolitical Power Gain: §G+5.00%§!\nFactory Output: §G+5.00%§!\nProduction Efficiency Growth: §G+5.00%§!"
USA_modest_re_armement_program: "Modest Rearmament Program"
USA_modest_re_armement_program_desc: "While we do need to prepare the United States for possible conflict in the future, we cannot rock the boat too much. Let's set a moderate amount of funds aside to invest in the war industry, and ensure America will be safe."
USA_emergency_tax_raise: "Emergency Tax Increases"
USA_emergency_tax_raise_desc: "The world is rapidly increasing in tensions, and it's clear large preperations for our national security need to be taken. The tax rate we set in the Underwood-Simmons tariff was quite low, and thus we should raise them a moderate amount and direct the extra money towards war preperation."
if_mary.tt: "If the legislation passes:\nRemove §YMining Explosions§!, which grants (Resource Gain Efficiency: §R-5.00%§!, Weekly Manpower: §R-20§!, Consumer Goods Factories factor: §Y5.0%§!, Weekly Stability: §R-0.10%§!)"
concun.tt: "We can find these decisions in the Political Actions category"
 USA_mantain_supportive_role: "Mantain Supportive Role"
4_times.tt: "This decision can be taken 4 times"
2_times.tt: "This decision can be taken 2 times"
3_times.tt: "This decision can be taken 3 times"
USA_consumer_based_economy13: "Unusual Economic Conditions"
USA_sherman_anti_trust: "A Tight Leash on Parasitic Trusts"
USA_sherman_anti_trust_desc: "There are still many issues with unfair big business domination of the market. Large price discriminations that allow monopolies to charge way over their actual value, several merges going completly unchecked, and so called "holding companies" who buy and control the ownership interests of other companies."
USA_roll_out_new_regulations: "Rollout New Regulations"
USA_roll_out_new_regulations_desc: "It's time to put the nail in the coffin for these unfair monopolies, who have dominated the market for far too long. By finalizing the anti monopoly laws, we can hopefully prevent the rise of any second standard oil or general electric company again, and ensure a truly free market for all. "
USA_goldilocks_and_the_three_trusts: "Roosevelts Great Vision"
USA_goldilocks_and_the_three_trusts_desc: "While many trusts are indeed inefficient, some trusts are generally good at what they do. While most progressives support the complete destruction of monopolies, Roosevelt is more pragmatic. Seeing some trusts as a good thing, Roosevelt will force the party to endorse his idea, breaking some trusts while leaving others alone. It may seem unfair, but its efficient, and that's capitalism for you!"
budgetfocus.tt: "On the selection of this focus, we will gain a series of events where we will draft the next federal budget. This budget will modify the §YNew Nationalism§! national spirit depending on our choices."
minimum_wage_pass.tt: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y+4.0%§!\nStability: §G+8.00%§!\nPolitical Power Gain: §G+5%§!\nFactory Output: §G+5.00%§!\nProduction Efficiency Growth: §G+5.00%§!"
budget1.tt: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y-10.0%§!\nPolitical Power Gain: §R-8%§!"
USA_expand_access_to_insurance: "Expand Access to Insurance"
USA_expand_access_to_insurance_desc: "Many Americans cannot affoard health insurance due to insanely high prices they charge. We must help prevent this, by passing legislation setting limits on just how much health insurance companies can charge their customers."
budget2.tt: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y+5.0%§!\nResearch Speed: §G+8.0%§!"
budget3.tt: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y+5.0%§!\n§YMilitary Factory§! construction speed §G+5.0%§!"
budget4.tt: "Modify §YNew Nationalism§! by:\nConsumer Goods Factories factor: §Y+8.0%§!\nStability: §G+10.00§!\nMonthly Population: §G+10.0%§!"
expand_insurance.tt: "Modify §YNew Nationalism§! by:\nMonthly Population: §G+10.0%§!\nStability: §G+5.00%§!"
USA_neutralize_child_labour: "Neutralize Child Labour"
USA_neutralize_child_labour_desc: "Child labour is a backwards and immoral act that should have no place in society. By placing new regulations so severe that it no longer becomes profitable or practical to hire children under the age of 14, we can hopefully begin to eventually dismantle the system all together."
expand_insurance_focus.tt: "When this focus is selected:\nActivate mission: §YExpanding Access to Insurance§!\nIf the legislation passes:\nModify §YNew Nationalism§! by:\nMonthly Population: §G+10.0%§!\nStability: §G+5.00%§!"
mcdr.tt: "When this advisor is hired:\nActivate mission: §YMcGuigan Anti Klan Campaign§!\nThis mission will reduce the §qKlan§! strength by §Y1§! every 45 days."
USA_invest_in_american_schools: "The Pioneers of Tomorrow"
USA_invest_in_american_schools_desc: "America has became a major technological hub of the world, with several revolutionary inventions. With technology more important now then ever due to rising world tensions, we must ensure that we do not lose our way now, and give our scientists adequate funding for their research."
USA_the_great_eec_reform: "The Great EEC Reform"
USA_the_great_eec_reform_desc: "The executive branch of the government is very disorganized and bloated. As the EEC has suggested to the president, by removing or merging irrelevnt agencies and departments, we can ensure the government doesn't suffer from bureaucracy and bloat."
budget5.tt: "Modify §YNew Nationalism§! by:\nPolitical Power: §R-5%§!"
