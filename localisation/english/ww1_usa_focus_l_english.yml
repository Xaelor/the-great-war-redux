### War Prepardness Campaign ###
USA_the_war_preparedness_campaign: "The War Preparedness Campaign"
USA_the_war_preparedness_campaign_desc: "It's important that the American people know just how unprepared America is for a war. With an outdated army using outdated equipment and tactics, we are vulnerable to foreign attack. To help the people realize the danger we face, we must begin a campaign to pressure congress and the American people to end the policy of foolish isolationism, and instead prepare for the war the Kaiser will bring us."
USA_the_war_preparedness_campaign.tt: "Modify §YNew Nationalism§! by:\n§YMilitary Factory§! construction speed: §G+5.00%§!"
USA_mobilization_of_society: "Mobilization of Society"
USA_mobilization_of_society_desc: "Many countries across the world are slowly mobilizing their economies, preparing for any outbreak of war. Things here have been relatively quiet with little mobilization at all. This needs to change so we will be prepared for anything that comes to us."
USA_stroke_anti_german_sentiment: "Stoke Anti-German Sentiment"
USA_stoke_anti_german_sentiment.tt: "Modify §YNew Nationalism§! by:\nWeekly War Support §G+0.20%§!"
USA_open_alabaman_munition_plants: "Open Alabaman Munitions Plants"
USA_open_alabaman_munition_plants_desc: "To ensure our army has enough equipment, we will need to increase our production of infantry equipment. Therefore, government sponsored factories dedicated to the production of the war equipment must be opened. Alabama is a relatively quiet and unoccupied space, and thus would make a good place to open these new factories."
