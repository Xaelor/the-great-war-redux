USA_dollar_diplomacy: "Continue Business in Latin America"
USA_dollar_diplomacy_desc: "American business has long had a history of deep entrenchment in Central America and the Caribbean. While shady, these policies have kept our businesses very rich, and indirectly contribute much money to the US Economy. We should continue our policy of nudging Latin America towards a direction that supports our businesses."
USA_troop_surges_in_honduras: "Deploy Troops to Honduras"
USA_troop_surges_in_honduras_desc: "The United States army has had a long history of intervention in Honduras. Starting in 1907 when American troops intervened in Honduras to put down an anti American uprising, the American army has had free reign over Honduras. With protests and strikes erupting across Honduras once again, we should deploy more of our troops to secure stability"
USA_fosdick_commission: "Fosdick Commission"
 USA_the_progressive_traitor_desc: "Taft has stonewalled the progressive agenda for far too long. From raising tarrifs to firing progressive members in his cabinet, Taft has shown himself to be a good for nothing conservative. We cannot affoard to let this continue, and that's why Roosevelt will be putting an end to it."
