strikes.main.tt: "If we havn't completed the focuses:\n§YKerm Resolution§!\n§YNew Railway Regulations§!\n§YChild Labour Restrictions§!\n§YClayton Antitrust Act§!\n§YFederal Trade Commission§!\n§Y8 Hour Workweek§!\n§YCompensation for Injuries§!\n§YDOL to Meditate Labor Disbutes§!\nThen we will get this event again in 120 ,days."
