USA_discredit_the_obstructionists: "Discredit the Obstructionists"
USA_discredit_the_obstructionists_desc: "Talks of conservative domestic agenda has been stopped dead in the water by progressive opposition. Thus, before we attempt to implement our more conservative agenda, we must crush the progressive majority in congress. Let's smear the progressives as obstructionsist who oppose our centrist agenda."
USA_clark_defeat_progressives: "Democratic Factionalism"
USA_clark_defeat_progressives_desc: "The §1Democratic Party§! is a big tent party with many diverse views inside of it. Ranging from staunch §Sprogressives§! to hardline §cconservatives§!. While clark leans more to the §cright§!, completly ignoring progressive concerns may lead to a §Rcollapse§! of the party. Therefore, Clark will have to mantain party unity and ensure the §1Democrats§! are atleast somewhat united before making divisive decisions."
auosswr: "Several domesic focuses will now grant us §YStability§!"
ww1_USA_clark.1.t: "A Vote for Conservatives is a Vote for a Functional Government"
ww1_USA_clark.1.d: "Clark and the current majority of combined progressive Democrats and Republicans will never be able to govern properly. The progressives have made it clear that they will not compromise with Clark, and thus are unsuitable for governance during Clarks presidency.\n\nClarks allies have been intensifying this message of an obstructionist congress as of late in an attempt to sway voters in the next midterms. While a lot of voters are in favor of progressive reforms, playing on the narritive that progressives are simply refusing any sort of reasonable compromises will hopefully make voters think twice about their support."
