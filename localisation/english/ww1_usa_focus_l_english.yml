 USA_rise_of_technocracy: "Rise of Technocracy"
 USA_rise_of_technocracy_desc: "Progressivism has spawned many societies striving for maximum optimization of production and the management system. Even some senators have become ardent supporters of technocracy."
 USA_rise_of_technocracy_tt: "This focus is not finished yet. Sorry for your inconvenience."
 USA_radicalism_era: "Era of Radicalism"
 USA_radicalism_era_desc: "Society requires a radical transformation. If the federal government does not attempt to correct the social position of the working class, the proletariat will undertake to correct the mistakes of the state!"
 USA_ties_with_internationale: "Ties with Internationale"
 USA_ties_with_internationale_desc: "Contact with left revolutionaries. Their political influence should help us."
 USA_no_justice_no_peace: "No Justice. No Peace"
 USA_no_justice_no_peace_desc: "Immediately destroy traces of the existence in the history of the United States racism and respublicans. We must destroy the State, which is to blame for all this! Long Live Anarchy!"
 USA_no_justice_no_peace_tt: "The State will be destabilized, the anarchists will seize the congress!\n\n"
 USA_align_workers_rights: "Align Workers' Rights"
 USA_align_workers_rights_desc: "A woman and a man must have equal working rights! As well as minimum wages."
 USA_radical_prohibition: "Radical Prohibition"
 USA_radical_prohibition_desc: "Moralists in power. Therefore, we can not worry about the result of the introduction of the Prohibition."
 USA_bolshevism_is_enemy_of_socialism: "Bolshevism - Enemy of Socialism"
 USA_bolshevism_is_enemy_of_socialism_desc: "We already know about the insanity of the Bolsheviks. They dishonor socialism, they use leftist ideas to strengthen personal power, not the power of the masses! We need to end them."
 USA_prohibition: "Prohibition"
 USA_prohibition_desc: "The decades of reign of progressivists have created a huge number of social problems, which are pointed out by moralists and conservatives. We believe that you need to listen to them and start an anti-alcohol campaign."
 USA_lobbysit_register: "USA_lobbysit_register"
 USA_lobbyist_register: "Lobbyist Registration Act"
 USA_lobbyist_register_desc: "Its aim is to gain transparency about possible influences of interest groups on Parliamentarians and their staff. Several studies indicate that lobby transparency leads to a decrease of corruption. And in this situation, the fight against corruption should become an essential part of our program."
 USA_restrained_progressivism: "Restrained Progressivism"
 USA_restrained_progressivism_desc: "We are entering the final stage of the New Nationalism program and we can confidently say that we were able to tame wild progressivism and prevent from social crisis."
 USA_war_risk_insurance_act: "War Risk Insurance Act"
 USA_war_risk_insurance_act_desc: "Of course, not many will be sure of the success of military campaigns if volunteers and soldiers are not sure that they will not be paid for their efforts in the service."
 USA_arms_tax_desc: "The army begins its formation and preparation for a real war."
 USA_military_training_corps: "Military Training Corps"
 USA_military_training_corps_desc: "General Wood sponsors the reorganization of the training system, which should be aimed at training officers for the army of this era."
 USA_lafayette_escadrille: "Lafayette Escadrille"
 US2_condemn_unrestricted_sub: "US2_condemn_unrestricted_sub"
 USA_condemn_unrestricted_sub_warfare: "Resist Submarine Warfare"
 USA_doctrine_of_armored_raids: "Doctrine of Armored Raids"
 USA_prepare_for_trench_warfare: "Prepare for Trench Warfare"
 USA_occupy_villas_lair: "Occupy Pancho Villa's Lair"
 USA_occupy_villas_lair_desc: "After the death of Pancho Villa, General Pershing proposed not to stop there and establish military control over the rebellious region in order to completely suppress the Mexican raiders."
 USA_shotgun: "Trench Shotgun"
 USA_shotgun_desc: "That's a lot of damage!"
 USA_maneveur_divison: "The Maneveur_divison"
 USA_maneuver_divison: "The Maneuver Divison"
 USA_reorganize_army_corps: "Reorganize Army Corps"
 USA_reorganize_army_corps_desc: "In the United States there is no active army, only housed corps and the national guard. Our generals insist on expanding the composition of the corps, as well as on the formation of divisions."
 USA_regular_divisions: "Regular Divisions"
 USA_stimson_doctrine: "Stimson Doctrine"
 USA_puppet_warlords: "Puppet Warlords"
 USA_continental_corps: "Selective Service Act"
 USA_start_conscription: "Selective Service Act"
 USA_expeditionary_forces: "American Expeditionary Forces"
 USA_artillery_support: "Artillery Support"
 USA_aeronautical_divisions: "Aeronautical Divisions"
 USA_aviation_section: "Aviation Section"
 USA_air_service: "Army Air Service"
 USA_tactical_aviation: "Tactical Aviation"
 USA_support_aviation: "Support Aviation"
 USA_big_navy_act: "Big Navy Act"
 USA_great_white_fleet: "Great White Fleet"
 USA_great_white_fleet_desc: "The expedition of our great fleet is coming to an end. Now the Navy must draw conclusions from this experience."
 USA_cruiser_transport_force: "Cruiser & Transport Force"
 USA_marine_forces: "Marine Forces"
 USA_washington_naval_treaty: "Washington Naval Treaty"
 USA_support_ships: "Support Ships"
 USA_cw_triggered: "Second American Civil War"
 USA_war_against_germany: "War Against German Aggression"
 USA_liberia_focus: "Focus on Liberia"
 USA_liberia_focus_desc: "Liberty for Liberia"
 USA_war_against_france: "War Against French Aggression"


### roosevelt foreign policy ###
USA_re_assert_bigstick_diplomacy: "Re-Assert Big Stick Diplomacy"
USA_re_assert_bigstick_diplomacy_desc: ""
USA_rough_riders_militia: "Rough Riders Militia"
USA_rough_riders_militia_desc: "work loc writers WORK"
USA_the_banana_wars: "The Banana Wars"
USA_the_banana_wars_desc: "fruit!"
USA_occupy_panama: "Occupy Panama"
USA_occupy_panama_desc: "In Panama, we have many interests that are important to us and we need to secure them. We should occupy Panama by sending a force to occupy the country, with little resistance. This will also help us secure our interests and spread our influence in the rest of Central America too."
USA_purchase_greenland: "Purchase Greenland"
USA_purchase_greenland_desc: "In the North Atlantic lies the massive island of Greenland, currently territory of the Kingdom of Denmark. If we want to expand our influence further towards the Atlantic Ocean and Europe, this island could be a very important base for us. If we offer a large price for the island, the Danish will be sure to accept, as it would be a large boost their small economy."
USA_purchase_greenland.tt: "We will unlock a decision to §Gpurchase Greenland§! costing us §Y5 Civilian Factories§!."
USA_build_the_artic_fortress: "Build the Arctic Fortress"
### War Prepardness Campaign ###
USA_the_war_preparedness_campaign: "The War Preparedness Campaign"
USA_the_war_preparedness_campaign_desc: "It's important that the American people know just how unprepared America is for a war. With an outdated army using outdated equipment and tactics, we are vulnerable to foreign attack. To help the people realize the danger we face, we must begin a campaign to pressure congress and the American people to end the policy of foolish isolationism, and instead prepare for the war the Kaiser will bring us."
USA_the_war_preparedness_campaign.tt: "Modify §YNew Nationalism§! by:\n§YMilitary Factory§! construction speed: §G+5.00%§!"
USA_mobilization_of_society: "Mobilization of Society"
USA_mobilization_of_society_desc: "Many countries across the world are slowly mobilizing their economies, preparing for any outbreak of war. Things here have been relatively quiet with little mobilization at all. This needs to change so we will be prepared for anything that comes to us."
USA_stroke_anti_german_sentiment: "Stoke Anti-German Sentiment"
USA_stoke_anti_german_sentiment.tt: "Modify §YNew Nationalism§! by:\nWeekly War Support §G+0.20%§!"
USA_open_alabaman_munition_plants: "Open Alabaman Munitions Plants"
USA_open_alabaman_munition_plants_desc: "To ensure our army has enough equipment, we will need to increase our production of infantry equipment. Therefore, government sponsored factories dedicated to the production of the war equipment must be opened. Alabama is a relatively quiet and unoccupied space, and thus would make a good place to open these new factories."
USA_lucrative_offers_to_companies: "Lucrative Offers to Companies"
USA_lucrative_offers_to_companies.tt: "Modify §YNew Nationalism§! by:\n§YMilitary Factory§! construction speed: §G+8.00%§!\n§YCivilian Factory§! construction speed: §R-8.00%§!"
USA_lucrative_offers_extra.tt: "\nCompleting the focuses "§YAlliance with Giants§!" and "§YOrganize Cartelization of the Economy§!" will boost this focus by §G+2.00%§! Factory Output each."
USA_lucrative_offers_2.tt: "\nModify §YNew Nationalism§! by:\nFactory Output: §G+2.00%§!"
