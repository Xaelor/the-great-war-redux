l_english:

# Focuses
SIA_phra_piya_maharat: "Phra Piya Maharat"
SIA_phra_piya_maharat_desc: "King Chulalongkorn's lengthy reign is defined by the successful preservation of Siamese independence through modernization and strategic territorial concessions."
SIA_implement_the_monthon_system: "Implement Monthon Thesaphiban"
SIA_implement_the_monthon_system_desc: "Monthon Thesaphiban, or 'circle of local government', are planned administrative subdivisions of Siam. After its implementation getting set back by the lack of educated officials and tribal resistances, it is time to move to put it in motion."
SIA_coronation_of_vajiravudh: "Rama VI"
SIA_royal_pages_college: "Establish the Royal Pages College"
SIA_royal_pages_college_desc: "\"In the Royal Pages College, what I want is not so much to turn out model boys, all of the same standard, all brilliant scholars with thousands of marks each, as to turn out efficient young men— young men who will be physically and morally clean, and who will be looking forward keenly to take up whatever burden the future of our state may lay upon them.\"\n- Rama VI, Vajiravudh, on the Civil Service College of King Chulalongkorn"
SIA_wild_tiger_corps: "Establish Paramilitaries"
SIA_wild_tiger_corps_desc: "The Wild Tiger Corps will be a paramilitary group answering to the King and the King only, as it is outside of the military hierarchy. A ceremonial guard, it was inspired by the British Volunteer Forces, its main objective is to maintain civil order."
SIA_monthon_paks: "Monthon Reforms"
SIA_monthon_paks_desc: "By creating the 'paks' system, or regions, we can let an Uparaja, or viceroy, control each administrative bloc, that all report to the king."
SIA_chat_satsana_phramahakasat: "Nation, Religion, King"
SIA_chat_satsana_phramahakasat_desc: ""
SIA_publish_royal_nationalist_literature: "The King's Nationalist Literature"
SIA_maintain_british_french_counterbalance: "Maintain European Counterbalance"
SIA_maintain_british_french_counterbalance_desc: "Despite Vajiravudh having been educated in Western nations, those nations, France and Britain, still ended up carving Siam from the Kingdom it once was to a mere speck compared to its golden days. And those same nations still have the greatest influence in the country: we export primarily to the British (Hong Kong and Singapore), so it is time to use the counterbalance: since 1903, Jens Westengard has been the General Advisor in Foreign Affairs to the Government of Siam. he graduated at Harvard, earnt an LL.B.degree in 1898, and he graduated second in his class of 129 pupils. He helps us by negotiating territory disputes against the two European superpowers and helped us draft up a criminal code, a native government and a state administrative system."
SIA_water_works: "Water Works"
SIA_water_works_desc: "With the help of General Advisor Jens Westengard, we will construct water works to benefit the population of Siam."
SIA_increase_funding_to_RSR: "Fund Royal State Railways"
SIA_increase_funding_to_RSR_desc: ""
SIA_prioritize_german_advisors: "Prioritize German Advisors"
SIA_organize_coronation: "Organize the Coronation"
SIA_1909_siam_british_treaty: "1909 Anglo-Siamese Treaty"
SIA_1909_siam_british_treaty_desc: "Signed on the 10th of March 1909, this treaty had Siam give up its influence and its claims of Kedah, Kelantan, Perlis and Terrengganu in exchange of a loan from [MAL.GetNameDef] to build railways in Southern Siam."
SIA_tighten_grip_on_army: "Tighten Grip on the Army"
SIA_tighten_grip_on_army_desc: ""
SIA_national_identity: "A New National Identity"
SIA_national_identity_desc: "Ladyboys"
SIA_disband_paramilitary: "Disband the Rama's Paramilitary"
SIA_disband_paramilitary_desc: ""
SIA_assassination_of_vajiravudh: "Assassination of Vajiravudh"
SIA_assassination_of_vajiravudh_desc: ""
SIA_constitutional_monarchy: "System Inspired by European Monarchs"
SIA_the_siamese_economy: "The [SIA.GetAdjective] Economy"
SIA_the_siamese_economy_desc: ""
SIA_repair_old_canals: "Repair Old Canals"
SIA_repair_old_canals_desc: "The projects proposed by Dutch advisor Jens Westengard are obviously too costly, it would be worth it to spend time in other domains of industrialization and improvement of the transport of goods such as an expansion of the Royal State Railways."
SIA_increase_british_trade: "Integrate in the British Imperial Trade Web"
SIA_increase_british_trade_desc: ""
SIA_foreign_technologies: "Adapt European Advancements"
SIA_foreign_technologies_desc: "Machinery and medicine."
SIA_increased_opium_trade: "Increase Licensed Opium Trade"
SIA_increased_opium_trade_desc: "Yummy."
SIA_fund_siamese_owned_banks: "Fund Siamese-Owned Banks"
SIA_fund_siamese_owned_banks_desc: "Almost all the banks in this wonderful country are owned by for-profit British companies, whose only intention is to STEAL from the wonderful [SIA.GetAdjective] people! It is time to take back the fiscal power of our citizens into their hands--their pockets--instead of the British companies."

#Misc
SIA_slavery: "Limited Slavery"
SIA_slavery_desc: "Even though it was made illegal in the 1908 penal code, a limited form of slavery still exists under precarious exemptions. It's time to finally rid the world... or Siam of this ugly mark."
SIA_wild_tiger_corps_idea: "Wild Tiger Corps"
SIA_monthon_system_idea: "Monthon System"
SIA_nation_religion_king: "Chat, Satsana, Phramahakasat"
SIA_king_spends_palace: "Royal Expenditures"
SIA_agrarian_society: "Agrarian Society"
SIA_idea_overseas_chinese_community: "Dominant Chinese Merchants"
SIA_idea_overseas_chinese_community_desc: "Chinese Merchants form a great portion of our sorts of 'middle class', whilst the Siamese peasants are workers.The ethnic Chinese merchants control the milling, marketing, and distribution networks of rice mills."
SIA_bowring_treaty: "The Bowring Treaty"
SIA_bowring_treaty_desc: "Signed with the §Y[ENG.GetFlag]British§! in 1855, this treaty liberalised trade inside of the Siamese Kingdom. It limited export taxes on products such as opium and bullion and allowed the British merchants to sell or buy to any Siamese subject without intervention."
SIA_royal_state_railways: "Royal State Railways"

SIA_army_king_relations: "Military-King Relations"
SIA_army_king_relations_desc: "Contrary to his father, who was a master at managing the different political factions, Vajiravudh takes a more personalized approach, to the detriment of the officials around him. Vajiravudh and the Siamese Military are not always on the bestest of terms with each other. After numerous incidents, threats of a revolt in the midst are present and is causing the King some stress.\n\nThe relation between the King and the Army is [GetKingArmyRelations]"
