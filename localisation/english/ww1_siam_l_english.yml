# Events
ww1_siam.1.t: "King Chulalongkorn Dies"
ww1_siam.1.d: "King Chulalongkorn, or Rama V, has passed away today in the Ambara Villa from kidney disease, aged 57. He had been searching for a cure for his kidney disease for a long time, even travelling many times to Europe for a possible remedy, but to no avail. He implemented many reforms for the Siamese nation, like the abolishment of slavery and healthcare systems. Rama VI, or Vajiravudh, is set to be crowned as next King."
ww1_siam.1.a: "Glory to Rama VI"
ww1_siam.2.a: "Good idea."
ww1_siam.2.d: "After the resumption of German Submarine attacks, Siam joined the war on the side of the Entente and immediately impounded 12 German merchant ships.We should send an Expeditionary Corps to the UK to help and gain favour in the peace talks."
ww1_siam.2.t: "Siamese Expeditionary Army"
ww1_siam.3.t: "King Vajiravudh Dies"
ww1_siam.3.d: "His brother, Prajadhipok is crowned King Rama VII because Vajiravudh died without his children. He is an elite who is studied at Eton College in Britain and has educated by French military."
ww1_siam.3.a: "Glory to Rama VII."
ww1_siam.4.t: "Siamese Stance on the Great War"
ww1_siam.4.d: "Germany is sinking all vessels related to the Entente in the unrestricted submarine warfare. Since our country has also suffered damage, we can immediately declare war on Germany and seize German assets in the country."
ww1_siam.4.a: "Declare war with Germany."
ww1_siam.4.b: "Don't care this foreign war."
ww1_siam.5.t: "Siamese revolution of [GetYear]"
ww1_siam.5.d: "The military is discontent with the reign of King Rama VII and fired a coup against the absolute monarchy."
ww1_siam.5.a: "To reform will lead the future of the nation."
ww1_siam.5.b: "The king shall reign as an absolute monarch."
ww1_siam.6.t: "Siamese coup d'état of [GetYear]"
ww1_siam.6.d: "A constitutional crisis developed in Siam over the \"Yellow Cover Dossier\" incident, precipitated by Pridi's draft economic plan, which containedsocialist elements. Because of this, Phraya Manopakorn Nititada expelled him from the cabinet and suspended the constitution. This action upset many in the People's Party who supported Pridi, including Phraya Phahon.He resigned from the cabinet citing health reasons. In truth, he and a couple of military officersplanned to overthrow Phraya Mano's increasingly authoritarian government."
ww1_siam.6.a: "A bloodless coup was carried out."
ww1_siam.7.t: "A New National Flag"
ww1_siam.7.d: "After the incident of raising the national flag upside down in 1911, there was a public opinion to design a modern and symmetrical flag. A new flagdraft is completed and approved today, and now we have a red-white flag with a pretty decent design."
ww1_siam.7.a: "Well done."
ww1_siam.8.d: "A new flag design has been adopted. Blue in the center represents the monarch, white stripes represent Buddhism, and red stripes represent red bloodof Thai people."
ww1_siam.9.t: "Indochina Weakened"
ww1_siam.9.d: "After losing the Great War, Indochina is in turmoil, with ethnic conflict and administrative paralysis. Now is a good time to reclaim our rightful territories."
ww1_siam.9.a: "Forward!"
ww1_siam.9.b: "Too risky."
ww1_siam.10.t: "[FROM.GetAdjective] Expeditionary Army"
ww1_siam.10.d: "After [FROM.GetName] seized 12 German vessels in their ports, joined the Great War with our side. They sent some men to help our war effort."
ww1_siam.10.a: "Useful."
ww1_siam.30.t: "Provisional Coronation of [SIA.GetLeader]"
ww1_siam.30.d: "[SIA.GetLeader] was provisionally coronated today. Amongst the Siamese people, there are high hopes for his reign, as Vajiravudh studied abroad in Western universities, and the people are expecting a new constitution. The future is looking bright."
ww1_siam.30.a: "How's the afterparty?"
ww1_siam.12.t: "Formal Coronation of [SIA.GetLeader]"
ww1_siam.12.d: "The formal coronation of [SIA.GetLeader] took place today. Many foreign visitors attended the coronation: [DidRUSvisit][DidENGvisit][DidDENvisit][DidJAPvisit][DidSWEvisit][DidUSAvisit]. Festivities lasted for 13 days. It was reportedly the most expensive coronation of Siamese history and was two times more expensive than George V's coronation."
ww1_siam.12.a: "Luxurious!"
ww1_siam.13.t: "Growing Discontent Against the King"
ww1_siam.13.d: "The King has amassed a lot of enemies. This goes back to an incident in 1909 where Vajiravudh was arguing with military men over a woman. Vajiravudh arrested 6 men and petitioned the then-King Chulalongkorn to cane the soldiers. Chulalongkorn refused but Vajiravudh threatened to resign from the successor position, so they were caned."
ww1_siam.14.t: "King Vajiravudh spends on palace"
ww1_siam.14.d: "Rama VI has ordered the construction of a new palace, once again betraying the promise he made of making reforms. The Siamese people are angry."
ww1_siam.14.a: "Let the King do what he pleases"
ww1_siam.14.b: "Tell him to cut it"
ww1_siam.15.t: "King Rama VI Caught Socializing with Wild Tigers"
ww1_siam.15.d: "Not the animal, but the new paramilitary group he founded. He seems to pay more attention to his little paramilitary rather than the armed forces of his country. The noble traditional aristocrats and army officers took high offense."
ww1_siam.15.a: "Yes, King"
ww1_siam.15.b: "He should budget his balance"
ww1_siam.16.t: "Anger Against the Paramilitary"
ww1_siam.16.d: "Many officers in the Siamese Army view  the new paramilitary organization as a wasteful rival that siphoned off state resources and royal favor."
ww1_siam.16.a: "Let them be angry"
ww1_siam.17.t: "Attempted Coup of [GetYear]"
ww1_siam.17.d: "91 officers in the Siamese army branches have decided to attempt a revolt against our absolute monarchy, which they deem backward, unfair, corrupt and morally humiliated. The coup attempt failed due to the officers' goals being contradictory, as some wanted a republic while others wanted a constitutional monarchy. In the end, they were all arrested or something."
ww1_siam.17.a: "What is going on?"
ww1_siam.18.t: "[SIA.GetName]'s Royalist-Nationalist Literature"
ww1_siam.18.d: "Even though illiteracy is rampant, this pro-monarchy literature is the first step to achieving nationalism in the Siamese Kingdom."
ww1_siam.18.a: "Glory to the Rama!"
ww1_siam.19.t: "Yut Khongyu Reveals Plans for Assassination on Rama"
ww1_siam.19.d: "Captain Yut Khongyu revealed to the royal family that he was tasked with assassinating the King on April 1st, where he would have been attending a public ceremony. Fortunately for our King, his nerves failed him and he pussied out and he followed by revealing to a royal family member about the assassination plot and the coup."
ww1_siam.19.a: "Wow"
ww1_siam.20.t: "Coup Plotters Arrested"
ww1_siam.20.d: "A grand total of 91 officers were arrested for participating in the preparations for a coup d'état. more loc here."
ww1_siam.20.a: "Traitors! Make them rot in prison!"
ww1_siam.21.t: "Yut Khongyu tasked with assassinating the King"
ww1_siam.21.d: "Captain Yut Khongyu was tasked with assassinating Vajiravudh on April 1st 1912. more loc here."
ww1_siam.21.a: "Ok"
ww1_siam.22.t: "Assassination of Vajiravudh"
ww1_siam.22.d: "Today, Vajiravudh was assassinated when attending a public ceremony for Siamese New Year by Captain Yut Khongyu, as part of an ongoing coup against the government."
ww1_siam.22.a: "Glory to Rama VII?"
ww1_siam.23.t: "Successful Coup Against the Monarchy"
ww1_siam.23.d: "91 army officers held a mutiny that was led after the assassination of Rama VI; Vajiravudh. Their leader, Khun Thuayhanpitak, took over the nation."
ww1_siam.23.a: "The new nation"
ww1_siam.24.t: "General-Advisor Jens Westengard Retires"
ww1_siam.24.d: "After 12 years, the General-Advisor to the Siamese government Jens Westengard retired today in order to continue studying in the United States. He has served Chulalongkorn and Vajiravudh and helped both by organizing construction projects, settling diplomatic disputes, and helping change legal documents."
ww1_siam.24.a: "Farewell, legend"
ww1_siam.25.t: "Siam invites us to coronation"
ww1_siam.25.d: "The Kingdom has announced the King, Rama VI, or Vajiravudh, and his formal coronation and officials from our country were invited to visit the festivites, which would last around 2 weeks."
ww1_siam.25.a: "Of course, we will attend"
ww1_siam.25.b: "We have other stuff to deal with, sorry"
ww1_siam.26.t: "[FROM.GetName] accepts royal invitation"
ww1_siam.26.d: "[FROM.GetName] has accepted the invitation to the coronation of Vajiravudh."
ww1_siam.26.dUSA: "[FROM.GetName] has accepted the invitation to the coronation of Vajiravudh. Mister Hamilton King agreed to show up on the coronation ceremony."
ww1_siam.26.dRUS: "[FROM.GetName] has accepted the invitation to the coronation of Vajiravudh. Grand Duke Boris Vladimirovich agreed to show up on the coronation ceremony."
ww1_siam.26.dSWE: "[FROM.GetName] has accepted the invitation to the coronation of Vajiravudh. Prince Vilhelm and Princess Marie agreed to show up on the coronation ceremony."
ww1_siam.26.dJAP: "[FROM.GetName] has accepted the invitation to the coronation of Vajiravudh. Prince Higashi-Fushimi Yorihito agreed to show up on the coronation ceremony."
ww1_siam.26.dDEN: "[FROM.GetName] has accepted the invitation to the coronation of Vajiravudh. Prince Valdemar and his sons agreed to show up on the coronation ceremony."
ww1_siam.26.dENG: "[FROM.GetName] has accepted the invitation to the coronation of Vajiravudh. Prince Alexander of Teck and Princess Alice of Teck agreed to show up on the coronation ceremony."
ww1_siam.26: "Superb"
ww1_siam.27.t: "The Xinhai Revolution"
ww1_siam.27.d: "Across China, millions of citizens have risen up against the monarchy in charge. This might give some bad ideas to our own officers..."
ww1_siam.27.a: "This is not good"
ww1_siam.28.t: "Coronation Ceremony of Rama VI"
ww1_siam.28.d: "The formal coronation of [SIA.GetLeader] took place today after a temporary one back last year. Many foreign leaders attended the coronation: [DidRUSvisit][DidENGvisit][DidDENvisit][DidJAPvisit][DidSWEvisit][DidUSAvisit]. Many other countries paid visit with delegates. \"Such a gathering of Royalties, the guests of the Sovereign, is comparatively a rare thing in a European capital, and is without precedent outside Europe,\" a reporter for the Bangkok Times said.\n\n"
ww1_siam.28.a: "Great"
ww1_siam.28.b: "Ok"
ww1_siam.28.c: "Our visit to Siam was splendid"
ww1_siam.28_d: "Until next time"
ww1_siam.29.t: "[FROM.GetName] refuses to attend coronation party"
ww1_siam.29.d: "Invites to [FROM.GetName] were promptly either thrown in the trash, refused... or maybe even both."
ww1_siam.29.a: "They're disgraceful"