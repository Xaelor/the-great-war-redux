l_english:
 GER_backstab: "Backstab"
 GER_backstab_desc: "Austria is more of a burden than an Ally. Their national fragmentation and weak armed forces means they are constantly coming to us for help. If we abandon them, perhaps we can seek more powerful allies."
 GER_isolate_adriatic_sea: "Isolate Adriatic Sea"
 GER_isolate_adriatic_sea_desc: "If we impose a Blockade on Austria in the Adriatic Sea, we can severely cripple their economy and further sway the Italians to our side."
 GER_romanian_pact: "Romanian Pact"
 GER_romanian_pact_desc: "If we support their claims on Transylvania, Romania may be enticed to join our faction."
 GER_second_bjork_agreement: "Second Bjork Agreement"
 GER_second_bjork_agreement_desc: "By supporting their claims on Austrian Territory, we can pursue a pact of non-agression with Russia."
 GER_second_bjork_agreement_rejected: "Second Bjork Agreement has been rejected"
 GER_partition_of_persia: "Partition of Persia"
 GER_partition_of_persia_desc: "If we promise the Russians some of the spoils, perhaps we can Subjugate the Persians without them interfering."
 GER_bruderkrieg: "Bruderkrieg"
 GER_bruderkrieg_desc: "Austria-Hungary is merely a construct of territories that rightfully belong to other nations. We must end this, for the sake of us and our brothers."
 GER_german_cisleithania: "German Cisleithania"
 GER_german_cisleithania_desc: "Austria is German. Therefore, it belongs to the Kaiserreich. We will unite once more, even if it is through force."
 GER_suppress_the_hungarian_uprising: "Finish the Habsburgs"
 GER_suppress_the_hungarian_uprising_desc: "It is time to finish what we had started not so long ago, Habsburgs should be wiped out from this world."
 GER_recognize_hungarian_sovereignty: "Recognize Hungarian Sovereignty"
 GER_recognize_hungarian_sovereignty_desc: "Hungarians broke the Ausgleich and got their freedom. That is what we can celebrate!"
 GER_bohemia_integration: "Bohemia Integration"
 GER_bohemia_integration_desc: "Bohemia was in German Confederation. That means it should be Germany."

 GER_idea_isolation_of_adriatic_sea: "Isolated Adriatic Sea"
 GER_idea_isolation_of_adriatic_sea_desc: "Germany and Italy exert economic pressure by blocking trade routes in the Adriatic. Looks like they're getting ready for something."
